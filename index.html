<script>
const DATA = [{"n": "萧县老县城", "s": "萧县", "p": "安徽", "w": "皇藏峪刘邦避难·天门寺孔子晒书台·白土寨项羽驻军刘邦彭城兵败后藏身皇藏峪，蜘蛛结网巨石挡洞躲过项羽追兵。天门寺旁有孔子晒书台、砚墨池。白土镇萧窑（唐宋）烧窑，窑火绵延百里。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦属泗水郡。汉属彭城郡。明万历年间筑砖城。1950年代城墙拆。现状：城墙遗址2026年第四次文物普查新发现（交通路以北龙山路以西龙凤大道以南花园街以东）。皇藏峪国家森林公园（4A）、天门寺、瑞云寺、萧窑遗址保存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e皇藏峪（国家4A·96%森林覆盖率）：原名黄桑峪，因峪内长满黄桑树。公元前205年彭城之战刘邦兵败藏身于此，蜘蛛结网、巨石挡洞躲过项羽追兵——&quot;皇藏&quot;之名始此。有72处景点：皇藏洞、三仙洞、拔剑泉（刘邦拔剑得泉）、马扒泉（战马扒地得泉）、仙人床、瑞云寺（南朝梁大同年间建）、苏轼祈雪处、闵子祠。天门寺（元至正年间建）：天门山双峰壁立如天门，孔经此讲学留晒书台、砚墨池、洗砚泉、飞来佛、蚂虾泉。明宣德四年知州杨秘重建改名&quot;天门禅院&quot;。现有殿堂20余间，缅甸玉佛6尊、各种佛像40余尊。白土寨遗址（项羽驻军地）：白土镇白土寨村南部，夯土残垣还在。元末红巾军、明末义军均曾驻守。萧窑（唐宋）烧窑，窑火绵延百里，明清贡砖产地。萧县民治古街巷：明清-近现代，民治街中段保留。。\u003c/p\u003e\u003cp\u003e明代砖城城墙（遗址尚存）。萧窑大部分窑址（仅存遗址）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌萧县民谚：&quot;蜘蛛结网救汉王，巨石挡洞躲项王&quot;——公元前205年彭城之战刘邦败逃皇藏峪，蜘蛛在洞前结网、巨石滑到洞口，项羽追兵以为洞无人迹撤去。\u003cbr\u003e▌《萧县志》（明万历）：&quot;皇藏峪原名黄桑峪，以峪内多黄桑树得名。&quot;\u003cbr\u003e▌天门寺游客（2026）：&quot;孔子晒书台上还有石台，砚墨池的水还在——2500年前的痕迹，现在还能摸到。&quot;\u003c/p\u003e"}, {"n": "砀山老县城·凤城", "s": "砀山", "p": "安徽", "w": "内方外圆城·黄河27次改道·燕喜台李白饮·百万亩梨园都围着老城城是方的护城河是圆的——&quot;内方外圆&quot;独一份。明万历二十六年（1598）黄河淹城，全城人&quot;抱木登屋，有不食死者遂相食&quot;，迁城于虞山（今址）。此后268年间黄河流经砀境130次，重大决溢数十次。燕喜台是李白宴饮处（唐天宝年李白游砀山宴嬉于台），梨园百万亩环绕古城，吉尼斯纪录认定的世界最大连片果园就在这里。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦置砀郡，郡城在芒砀山西麓（今永城芒山镇）。金世宗大定六年（1166）黄河决口，砀城县治迁至虞山（今砀山县城址），此后800余年城址未动。明万历二十六年（1598）春大饥、夏疾疫，秋黄河决口淹没砀城，官民被迫迁徙。万历三十一年（1603）黄河决口朱家旺口，改道城南。万历三十四年（1606）大水，再改道城北。崇祯十四年（1641），砀山原有29393人，水患、饥馑、瘟疫、盗贼接踵而至，最终仅存6327人。现状：护城河（圆形）仍完整环绕老城区，城墙残垣可摸，燕喜台遗址、清真寺、文庙尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古城护城河（完整环城圆形护城河·全国罕见）：全长约4公里，平均宽度20米，历经800年仍完整围绕老城区。清代县志载&quot;城方池圆&quot;，护城河至今仍调节小气候、美化环境。燕喜台（又名宴嬉台·唐代李白饮处）：唐天宝年间李白游砀山，县令刘砀于台上设宴款待，李白赋诗&quot;燕喜台边春水流&quot;。现存台基为清代遗址，台周石碑数通。砀山清真寺（明代）：始建于明万历年间，位于老城区西南隅，占地约2亩，礼拜大殿为卷棚顶三开间，斗拱飞檐，是皖北保存较好的明代清真寺。砀山县文庙（明代）：始建于明万历年间，民国年间改为学校，现存大成殿主体。清乾隆《砀山县志》载&quot;文庙坐北朝南，棂星门、泮池、泮桥、戟门、大成殿、明伦堂依此排布&quot;。百年梨树王（砀山酥梨原产地核心地标）：良梨镇侯楼村，树龄约300年，树干直径约0.8米，每年仍挂果300-500斤。吉尼斯纪录认定砀山为世界最大连片果园——百万亩梨园环绕古城。黄河故道（百里古黄河横卧其间）：森林覆盖率达70%，明代黄河改道遗迹清晰可辨。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《砀山县志》（清乾隆三十五年）：&quot;万历二十六年秋，黄水入砀城，官民抱木登屋，有不食死者遂相食。二十九年始复故址。民存者十之一。&quot;\u003cbr\u003e▌砀山老教师张鹤龄：&quot;我爷爷说，民国时老城墙还能跑马车，后来拆砖盖学校、盖供销社，一块不剩。但护城河没拆，水还在淌，鱼还在游——这是砀城剩下的唯一圈住我们的东西。&quot;\u003cbr\u003e▌砀山酥梨非遗传承人李怀珍：&quot;我家种梨五辈人，老梨树就在古城墙根下。砀山梨能卖到东南亚，全靠这沙壤土、这黄河水。城里人都说我们砀山有三宝：墙圆、梨甜、燕喜台有诗仙。&quot;\u003c/p\u003e"}, {"n": "蒙城老县城·漆园", "s": "蒙城", "p": "安徽", "w": "庄子漆园吏·万佛塔宋建10年·文庙青云街·南华门烟火里庄子做漆园吏的地方——漆园就是蒙城的前身。万佛塔造了10年（宋崇宁元年到五年，每层有碑记哪年造的），全国重点文保。北大街历史街区7.53公顷省级文保，青云街一头连文庙棂星门一头连万佛塔——赶考学子拜完圣从这过，寓意&quot;平步青云&quot;。南华门（南门）至今是老城区最热闹的出入口，穿过城门洞就踏入宋元明清的老街巷。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北宋万佛塔始建，用10年建成（崇宁元年1102建到第四层，崇宁五年1106建到第十一层，全塔13层）。元至元二十一年（1284）始建文庙。明万历年间以砖包城。清代屡修屡圮。1950年代城墙大部拆除，四门仅存南华门门洞残段。2021年北大街历史文化街区列为省级保护街区，保护范围7.53公顷，核心区2.45公顷。现状：万佛塔、文庙、南华门完整，北大街、青云街、漆园街、三报司街等历史街巷格局完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e万佛塔（国保·北宋·1102-1106建）：八角十三层楼阁式砖塔，高42.2米。塔身内外嵌砌赭、黄、绿三彩琉璃小佛近万尊。宋代属兴化寺，明代属慈氏寺。塔体水磨青砖砌造，下几层穿心式楼梯，上面改成盘旋式。宋碑三块完整记载建造历程（哪年建到第几层）。1981-1984年国家文物局拨款修缮。蒙城文庙（省保·清代建筑·元始建）：位于老城区中心，占地2042平方米。大成门正对青云街（&quot;平步青云&quot;之意）。大成殿面阔五间进深三间，歇山顶抬梁式，九檩十八架四十二檐墩，巨杉为栋梁。圣井（大成门西南侧）——&quot;圣井甘泉&quot;为蒙城八景之一。明代二龙戏珠丹陛石在殿前。南华门（南门门洞）：明清遗留，穿过即入老城区，烟火气最浓的出入口。青云街（古街巷·至今在用）：一头接文庙棂星门一头遥望万佛塔。街名由来——古时赶考学子祭拜先圣后从此街走过，寓意平步青云。早年曾叫孟庄街，后恢复古名。北大街历史街区（省保·7.53公顷）：商肆格局完整，有庄子牌坊、钟鼓楼（省保1处）、文王庙、四牌楼等13处挂牌历史建筑。漆园街、三报司街、光复街：历史街巷格局完好，原住民仍住。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《蒙城县志》（清光绪）：&quot;万佛塔造于宋崇宁间，历十年而成。每层嵌琉璃小佛，数近万，因名。塔下有宋代碑三，记其造年。&quot;\u003cbr\u003e▌蒙城县历史文化研究会：&quot;万佛塔四层以上门窗位置不规则——为什么？因为它不是一次造完的。崇宁元年造到四层停了三年，崇宁五年才又接着往上造，所以楼梯改了方向，门窗位置也乱了。这是一座有&#x27;施工中断痕迹&#x27;的宋塔。&quot;\u003cbr\u003e▌南华门老裁缝王桂英（82岁）：&quot;我就在南华门洞里纳鞋底纳了50年。穿过门洞往西是卖菜的菜市，往东是青云街——小时候跟着母亲去文庙上香，娘说从这走过，下辈子也能考个秀才。现在门洞还是那个门洞，我还在，人换了一茬又一茬。&quot;\u003c/p\u003e"}, {"n": "亳州老县城·三朝古都", "s": "亳州", "p": "安徽", "w": "商汤南亳·花戏楼砖雕第一·曹氏宗族墓10平方公里·药都36老街三朝古都——商汤在此建都190年（王国维考证景亳在曹县土山集，今亳州市区亦为亳地核心区）、汉末曹操的故乡（陪都级）、元末韩林儿&quot;小明王&quot;称帝建&quot;宋&quot;以亳州为国都。花戏楼（大关帝庙·山陕会馆）的砖雕——厚度不足二寸的特制青砖上透刻30余个3毫米孔的双层花绣球，戏文70余种——松鹤延年、郭子仪做寿、吴越之战、三顾茅庐、白蛇传，巧夺天工。曹氏宗族墓群占地10平方公里，出土银缕玉衣、800多块带文字的墓砖（隶/篆/草/真/行五体俱全）。明清时期亳州是天下四大药都之一，北关老街现存白布大街、打铜巷、爬子巷、南京巷等36条老街72条古巷。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商汤建都亳（景亳/南亳），历190年。魏皇初二年（221）封谯郡为陪都——&quot;三朝古都&quot;头衔之一。隋大业二年（606）改谯郡为亳州，为唐代十望州府之一。元至正十五年（1355）刘福通拥韩林儿在亳州称帝建&quot;宋&quot;——&quot;三朝古都&quot;头衔之三。明洪武初（1368）降州为县。弘治九年（1496）复称亳州。清时为区域经济中心，&quot;小南京&quot;。1950年代城墙拆除。现状：花戏楼、曹操地下隐兵道、曹氏宗族墓群、南京巷钱庄、道德中宫（孔子问礼处）、华佗华祖庵、36条老街（白布大街、南京巷、打铜巷、爬子巷等）尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e花戏楼（国保·1656年建·山陕会馆·天下砖雕第一）：大关帝庙内，清顺治十三年（1656）山西/陕西药材商人集资建，康熙十五年（1676）建戏楼。戏楼与山门连为一体——砖雕牌坊式门楼，拱门&quot;大关帝庙&quot;四字上面镶嵌&quot;参天地&quot;金匾。特制青砖厚度不足二寸，透刻成数层——有一个直径仅5厘米的双层透花绣球，通体刻了30余个3毫米圆孔。戏文涉及70余种：松鹤延年、三星高照、郭子仪做寿、吴越之战、三顾茅庐、白蛇传、老君炼丹。戏台正中屏风透雕&quot;二龙戏珠&quot;，场门额书&quot;想当然&quot;&quot;莫须有&quot;。曹氏宗族墓群（国保·占地10平方公里·2001年公布）：魏武大道两侧——董园汉墓群、曹四孤堆、刘园孤堆、薛家孤堆、观音山孤堆、张园汉墓、马园汉墓、袁牌坊汉墓群、元宝坑汉墓群。墓门多为石结构饰画像刻石，墓室墙壁券顶绘彩色壁画。出土银缕玉衣、玉刚卯、玉猪、象牙石等，800多块带文字墓砖（隶/篆/草/真/行五体俱全）——有曹氏宗组成员姓名、地方官吏姓名，也有反映当时社会的词句。曹操地下隐兵道（国保·亳州古地道·长4500米·双层立体）：传说曹操为早期战略运用所建。双道并行，纵横交错，互相连通。工程巨大——有&quot;地下长城&quot;之称。结构有上下两层、单层、道中有室、室中有门，规模宏大。道德中宫（省保·孔子问礼处·老子庙）：市区中心，传孔子在此向老子问礼。始建年代不详，历代重修，现建筑为明代遗构。华佗华祖庵（省保·神医华佗故里）：市区永安街，华佗故居，庙祠完整，草堂经声、药圃流香、五禽鸣寿等八大景观。南京巷钱庄（国保·清代·亳州现存最完整的钱庄）：北关老街南京巷，清道光年间建，三间三进院落，保存完好。亳州36条老街（白布大街、打铜巷、爬子巷、南京巷、小花子街、署前街等）：明清格局，原住民仍住，日常烟火气。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：&quot;亳州自商汤建都以来，历经魏陪都、小明王宋都，三朝古都。明清时为天下四大药都之一，北关老街药栈林立，商贾云集，号称&#x27;小南京&#x27;。&quot;\u003cbr\u003e▌花戏楼导游小周：&quot;你看这砖雕——厚度才2厘米，却透刻了3层。那个5厘米的花绣球，上面有30多个3毫米的孔，全是手工刻的！砖雕上的人物，有的只有指甲盖大，眼睛眉毛都清清楚楚。1656年建的，370多年了——2厘米的青砖，这就是砖雕的命。&quot;\u003cbr\u003e▌曹操墓群考古队：&quot;800多块文字墓砖是宝贝——汉代书法史之前靠碑刻，墓砖是民间书法——有个墓砖上刻的是&#x27;曹氏丞曹甫砖&#x27;，还有的刻着当时工匠的牢骚话，比史书有趣多了。&quot;\u003cbr\u003e▌白布大街老药工王大爷（81岁）：&quot;我家在白布大街住了60年——这条街明清时是药都的门面街，药材商在这里卸车、看样、谈价。现在街两侧的门面还都是清代的青砖灰瓦——我小时候帮爹晒白芍，就铺在街面上——白芍晒3天，手摸起来发烫就是好药。&quot;\u003c/p\u003e"}, {"n": "涡阳老城·老子故里", "s": "涡阳", "p": "安徽", "w": "天静宫东汉始建·九龙井九眼甘泉·流星园感星受孕·老子坟在尹王村老子故里千年之争——涡阳天静宫vs河南鹿邑太清宫，两边各有依据，学界各执一词，老百姓把两地都当老子圣地来拜。涡阳的根据：东汉延熹八年（165）汉桓帝在涡阳建老子庙（这是官方给老子立祠的最早记载），元代《天静宫兴造碑》+出土流星园古碑+九龙井遗址+涡水北岸&quot;山南水北为阳&quot;的古地理选址。明成祖朱棣早年在此屯兵许愿：若能靖难登帝位，必大兴土木重修——靖难成功后果然兑现，天静宫扩建为皖北道教第一宫观。九龙井传说老子降生时九条龙喷水沐浴——九眼甘泉至今泉水清冽。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东汉延熹八年（165）汉桓帝敕建老子庙（最早官方立祠记载）。唐弘道元年（683）高宗改建为太清宫。宋真宗亲临加号太上老君，纳入皇家祭祀。元世祖定名&quot;天静宫&quot;。元末/明末/晚清多次毁于兵燹。明成祖朱棣靖难之役前在涡阳屯兵，许愿登帝位后重修天静宫——靖难成功兑现，天静宫迎来巅峰（&quot;食业数千人，庙地三千亩&quot;）。民国末期因战乱损毁殆尽，仅存东岳庙改作学校。1993年台湾道教学院马炳文教授/香港青松观侯宝垣道长筹资重建。现状：天静宫（4A级景区·2014年建成）、九龙井、流星园、尹喜墓、老子坟（李聃墓）遗址尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e天静宫（省级文保·道教祖庭·东汉始建·2014年复建）：县城北郑店村（武家河与涡河环绕）。始建于东汉延熹八年（165）——这是官方给老子立祠的最早记载（汉桓帝敕建）。历代帝王敕修：唐高宗太清宫→宋真宗加号→元世祖定名天静宫→明成祖靖难之役后大兴土木（&quot;食业数千人，庙地三千亩&quot;）。元末/明末毁于兵燹。1993年复建，4A级景区。考古出土汉代瓦当、春秋陶片、古井基址、元代重修石碑——地下全是硬货。依&quot;致虚极守静笃&quot;无为理念布局——中轴线统领对称布局，全长1800余米长廊群，朱色廊柱数百对。中路：山门→会仙桥→灵官殿→老君殿→三清殿。九龙井（唐代瓦圈·传说老子降生时九龙汲水·九眼甘泉尚存）：天静宫内九龙井苑，九眼古井并列，泉水常年清冽。传说老子降生时，九条巨龙环绕井口喷水沐浴，九井留存至今。井口多为唐代瓦圈砌成。流星园（古流星园石碑·感星受孕传说地·出土汉代瓦当）：天静宫西侧。传说老子母亲李氏在此园中休憩，一颗流星坠落园中，感星而孕。考古出土&quot;古流星园&quot;石碑——实物对标古籍记载。尹喜墓（春秋·涡阳省级文保·老子弟子尹喜之墓）：县城北，传说尹喜追随老子西出函谷关后回归涡阳葬此。老子坟/李聃之墓（尹王村西·明清有祠·遗址尚存）：传说为老子葬处（或纪念地）。明清有&quot;李氏石门&quot;石牌坊，毁于抗战前期。辉子园（李子园·避讳老子姓李改名为辉子）、紫楸林（楸树林·传与紫气东来传说有关）遗址尚存。城父古城（春秋·楚平王居城父·县城西北闸北镇）：春秋楚平王夺位后居城父12年，伍子胥之父伍奢为城父司马。秦置城父县，汉代为城父侯国。城址尚存夯土残垣。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：&quot;天静宫在城北郑店村，始建于汉桓帝延熹八年。明成祖靖难之役前屯兵涡阳，许愿登帝位后大修——靖难成功兑现，庙地三千亩，食业数千人，为皖北第一宫观。&quot;\u003cbr\u003e▌元代《天静宫兴造碑》：&quot;老子生楚苦县厉乡曲仁里。按水经注，苦县故城即今安溜古城，赖乡城在涡河之北——古水经注所记与今天静宫位置吻合。&quot;\u003cbr\u003e▌涡阳天静宫道士张先生（82岁·在此修行50年）：&quot;老子故里争了上千年——涡阳有东汉最早立祠的碑、有元代兴造碑、有九龙井、有流星园古石碑、有尹喜墓，都是实证。鹿邑那边有太清宫庙群、有唐玄宗宋真宗的碑文。两地都是老子圣地——游客来了，涡阳拜天静宫，鹿邑拜太清宫，两头跑才对。道不分家。&quot;\u003cbr\u003e▌郑店村老农老尹：&quot;九龙井的水我喝了一辈子——夏天舀一瓢喝，清冽甘甜。老人说这井是老子降生时九条龙喷水成的——不管真不真，这水确实比别的井水好，我家种的白菜比别家的嫩。&quot;\u003cbr\u003e▌李白《经下邳圯桥怀张子房》（关联地涡阳）：&quot;唯见碧流水，曾无黄石公&quot;——涡水从涡阳天静宫旁流过，东流经蒙城、怀远入淮河，李白也走过这条水路。\u003c/p\u003e"}, {"n": "泗县老城·虹县故城·裁虹归泗", "s": "泗县", "p": "安徽", "w": "古泗州沉洪泽湖·虹县600年砖城·大运河通济渠活水5.8km·世界遗产中国的&quot;水下庞贝城&quot;——清康熙十九年（1680）黄河夺淮，千年泗州城沉入洪泽湖底——城内水深数丈，&quot;官若浮鸥，百姓尽奔盱麓&quot;。泗州城在水下躺了300年，学者称之为&quot;东方庞贝&quot;。如今的泗县城，其实是古虹县——清乾隆四十二年（1777）&quot;裁虹归泗&quot;，泗州州治从盱眙迁到虹县，虹县作为独立县治的600年历史就此终结。隋唐大运河通济渠泗县段28公里，其中5.8公里活水段是大运河世界文化遗产段。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏商：夏丘古国（传说大禹封地）。西汉：置夏丘县。北周大象二年（580）：改东楚州为泗州——&quot;泗州&quot;之名首次出现，治所在今江苏盱眙。唐武德四年（621）：析夏丘县置虹县。唐贞观八年（634）：夏丘县并入虹县，虹县治迁至今泗县城——泗县县城成为虹县治所，延续600年。唐大业元年（605）：隋炀帝开通济渠（汴河）穿虹县城而过——虹县成为运河重镇。北宋：苏轼《南乡子·宿州上元》赞宿州&quot;此去淮南第一州&quot;——虹县属宿州。南宋：宋金对峙，虹县为淮北前线，屡遭兵燹。明洪武九年（1376）：知县乐徽创建县衙大堂。明弘治十三年（1500）：知县樊江修筑五门。明万历二十三年（1595）：知县任愚创建砖城。明万历四十四年（1616）：知县伍元正开通东西水关。清康熙十九年（1680）：黄河夺淮——泗州城沉洪泽湖底，州署寄居盱眙山上。清乾隆四十二年（1777）：裁虹归泗——泗州州治北迁虹县，虹县建制撤销。清乾隆四十五年（1780）：泗州知州张佩芳撰文、书法家梁巘书丹，立《移泗州治记》碑。民国元年（1912）：废州改县，定名泗县。现状：古泗州城遗址（江苏盱眙淮河镇·国保·水下庞贝）、虹县故城（泗县老城一环内·明代格局）、通济渠活水段5.8km（世界文化遗产）、《移泗州治记》碑尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古泗州城遗址（水下庞贝·国保·中国唯一完整保存的水下古城）：江苏盱眙县淮河镇，洪泽湖西岸。康熙十九年（1680）黄河夺淮，一夜之间沉入洪泽湖。考古已探出城门、城墙、街道、房屋、寺庙——城墙全长约11里，城内街道纵横，有东大街、西大街、南大街、北大街、小北街、城隍庙街等。城内建筑有州署、文庙、城隍庙、钟楼、鼓楼、关帝庙、天庆观等。遗址深埋水下1.5-2.5米——如今洪泽湖水位下降时，部分城墙遗迹露出水面。学者称之为&quot;中国庞贝城&quot;。通济渠（汴河）泗县段（世界文化遗产·大运河通济渠段7处遗产点之一）：总长28公里，其中县城东5.8公里为活水段——泗县段是通济渠唯一保留活水的河段。河堤高约5米，河宽约100米。沿岸出土大量漕运遗存——古码头遗迹、古河堤、漕船锚具、唐代开元通宝、宋代景德元宝、景德镇瓷器、越窑青瓷、磁州窑白釉黑花瓷等。2014年6月22日，随大运河整体列入《世界文化遗产名录》。虹县故城（明代砖城·泗县老城一环内·明代格局延续至今）：明洪武九年（1376）知县乐徽创建县衙大堂——至今遗存部分建筑结构。明弘治十三年（1500）知县樊江修筑五门——四门楼外加东西水关（万历四十四年1616伍元正开通）。明代砖城周长约3公里，城墙高5米、厚3米——清末城毁，仅剩城基。如今泗县城一环内老城区，街道走向、空间格局基本延续明代——县衙大堂原址现为泗县公安局。《移泗州治记》碑（乾隆四十五年·泗县博物馆藏·裁虹归泗的官方记录）：乾隆四十五年（1780）泗州知州张佩芳撰文，清代著名书法家梁巘书丹。碑文详细记载古泗州城沉没的全过程、州署寄居盱眙90年的困境、以及最终迁治虹县的决策经过。碑高2.5米，宽0.9米，楷书——书法遒劲有力，是梁巘代表作之一。古运河遗址公园（泗县泗水街道·沿通济渠活水段）：2014年世界遗产申报成功后建设。公园内有古码头遗址展示、古河堤保护标识、考古发掘地层剖面展示——考古队在泗运河遗址曾清理出完整的河堤、河道、河坡，船底摩擦河底痕迹，以及木岸狭河遗迹——证明主副航道的漕运模式。泗州戏（国家级非遗·拉魂腔·虹县乡土民间戏曲）：泗县是泗州戏的原生地。唱腔婉转缠绵，韵味拉魂动人——&quot;一听拉魂腔，三日不思乡&quot;。清代乾嘉年间形成雏形，道光年间已有职业戏班。传统剧目《四告》、《拾棉花》、《压裙记》等。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌泗县博物馆馆长刘建国：&quot;古泗州城沉在水下300年——为什么不打捞？主要是技术和资金问题。洪泽湖是蓄水库，水位高度影响防洪——如果要打捞，首先要让遗址完全露出水面，但这会影响洪泽湖调蓄能力。目前只能维持原状，通过测深仪、声呐、潜水员去探查。我们已经探出城墙全长约11里，街道纵横20多条，主要建筑遗址30余处——这比意大利庞贝城还要大。&quot;\u003cbr\u003e▌泗县老船夫姜治怀（84岁·泗水街道曹苗社区）：&quot;我家祖辈就在运河边——小时候我在河里游泳、捉鱼摸虾。那时候运河水很清，夏天能看到河底的鱼。以前沿河都是村庄，后来世界遗产申报，为了保护河道，老曹苗村整体搬迁了——村民都搬进了附近的楼房。我现在还经常去运河边散步，看看鸭子在河里游，看看花花草草——河还是那条河，我已不是当年那个光腚小孩了。&quot;\u003cbr\u003e▌虹城街道老居民王大娘（76岁）：&quot;我家就在原来的县衙旁边——听老辈人说，原来的县衙大堂三进院落，有&#x27;抱厦厅&#x27;、&#x27;礼房&#x27;、&#x27;兵房&#x27;……文革时拆了大部分，只剩后堂一间。80年代县公安局占了县衙地基盖办公楼——我现在路过还能找到原来县衙的台阶——那两块青石板，我小时候在上面摔过跤。&quot;\u003c/p\u003e"}, {"n": "凤阳·明中都", "s": "凤阳", "p": "安徽", "w": "朱元璋衣锦还乡建的未完成皇城、比北京故宫大12万平方米、被乡愁放弃的都城", "h": "", "r": "\u003cp\u003e明中都皇故城（国保第一批+国家考古遗址公园）：占地50平方公里，宫城84万㎡（比故宫大12万㎡），午门/西华门/1100米城墙/鼓楼台基（南北72米×东西34.25米×高15.8米，终明之最）存。蟠龙石础22.2吨（全国最大）。明皇陵（国保第二批）：神道长257米，石像生32对，朱元璋亲撰碑文。凤阳花鼓（国家级非遗）：明清传唱至今，&quot;说凤阳道凤阳&quot;。小岗村：1978年大包干发源地，18位农民红手印契约。历代帝王庙：朱元璋祀三皇五帝。肇建功臣庙：徐达/常遇春/汤和等淮西集团。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王剑英（已故，人民教育出版社历史地理学家，1969年五七干校到凤阳，第一个系统研究明中都的学者）：&quot;我1969年到凤阳干校——那时候明中都就是一片荒地，皇城里还有个县城村住着1200多户人家。我蹲在鼓楼台基下面摸那青石板——那砖上刻着&#x27;洪武二年造&#x27;，砖缝里长着荒草，草下面埋着600年前的工匠手印。我花了10年写了《明中都城考》——现在这本书是研究明中都的权威。有人问我&#x27;朱元璋为什么放弃中都&#x27;，我说&#x27;因为家太近了，近到他的老乡们跟他坐同一张桌子喝酒；又太远了，远到他能当皇帝却不能掌控家乡的权力&#x27;。中都不是被洪水淹的、不是被兵燹毁的——是被乡愁放弃的。这在中国历史上独一份。&quot;\u003c/p\u003e"}, {"n": "宿州老城", "s": "宿州", "p": "安徽", "w": "唐符离镇建州、苏轼墨竹扶疏亭、残墙256米见证汴河千帆", "h": "", "r": "\u003cp\u003e宿州老城墙残段（市级文保）：仅存北城墙256米，石砌马面（长18米高11米）。扶疏亭：刻苏轼墨竹碑，&quot;扶疏余韵&quot;古八景。蕲县古城遗址（省级文保）：距城20公里，战国秦代夯土城周长6000米，陈胜吴广攻克第一城。三贤庙：纪念陈胜/吴广/刘邦，庙前2000年红果树。通济渠泗县段：大运河世界遗产点。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李师傅（59岁，宿州市文物管理局司机，开了20年文物调研车）：&quot;我爹在埇桥区政府当过保安——他说他小时候北城墙还完整，城墙上能骑自行车，底下是州衙的后墙，谯楼暮鼓声从城墙角传出来。后来城墙一段一段被拆，拆到1970年代只剩最后这256米——就是现在区政府后院那段。我现在开的车，后备箱里永远放着一把铁锹——每次去蕲县古城，我都下车在城墙根儿转转，捡几块带花纹的陶片带回家。我家橱柜里摆了一排陶片——战国的绳纹瓦、汉代的方格陶、明代的城砖——都是我爹和我两代人捡的。我儿子在安徽大学考古系——暑假回来第一件事就是坐我车去蕲县挖陶片。&quot;\u003c/p\u003e"}, {"n": "寿县老城·宋代城墙", "s": "寿县", "p": "安徽", "w": "安徽唯一保存完好的古城池·月坝自动防洪涵闸·500成语之乡", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e前494年：蔡昭侯迁都州来（下蔡），寿县第一次成为都城。前241年：楚考烈王迁都寿春（郢），这里是楚国最后的都城。北宋熙宁年间（1068-1077）：始筑城墙。南宋嘉定年间：重修加固，做成&quot;土坡战城式&quot;，一段城墙同时兼任防洪大堤。唐代：城内报恩寺、孔庙等陆续兴建。1950年代以后：城墙当堤坝继续使用，城内街巷格局保持两千年未大变。现状：城墙、四门、瓮城、月坝基本完好，见证2500多年连续建城史\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古城墙（宋代·周长7147米·高约9.7米）：顶宽6-10米、底宽18-20米，土夯核心外砌青石灰砖，用糯米汁、石灰、桐油粘合。四门：东宾阳门、南通淝门、西定湖门、北靖淮门。月坝（明代·东北角、西北角各一座）：城墙底下的排水涵闸，城内积水自动往城外排，城外洪水一涨又凭水压自动关闸，堵住倒灌，是古人的&quot;海绵城市&quot;。宾阳门瓮城（东门·宋代遗风最浓）：主城门与瓮城门不在一条中轴线上，错位成&quot;歪门斜道&quot;，洪水冲来会被拧成涡流，卸掉冲城的力道。报恩寺（始建于唐贞观·1300多年）：院内两株唐代银杏，北宋塔基地宫，大雄宝殿里十八尊清代泥塑罗汉。孔庙（始建于唐·元代迁今址·安徽规模最大的孔庙）：最盛时占地两万多平方米，五进院落，棂星门、半月泮池、戟门、大成殿、明伦堂一路排开。留犊祠巷（东汉时苗留犊的清廉故事）、状元街、北过驿巷。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌寿县牛肉汤铺老张（58岁）：&quot;1991年发大水，我蹲在东门城楼上，脚就搭在垛口，水都淹到城外田地那么高，城里头倒安稳。老一辈说&#x27;铁打的寿州城&#x27;，真不是吹牛。&quot;\u003cbr\u003e▌孔庙旁的退休教师李姨（65岁）：&quot;我带孙子认&#x27;投鞭断流&#x27;&#x27;风声鹤唳&#x27;这些成语，全出在寿县。寿县是500个成语的故乡，孩子课本上划出来的，好多我们脚下就踩得着。&quot;\u003c/p\u003e"}, {"n": "阜阳老城·颍州", "s": "阜阳", "p": "安徽", "w": "西周胡子国筑城的三千年水城·奎星楼&quot;三蓬塔&quot;唯一幸存的城墙角楼·颍州西湖被黄河淤成平地", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周：胡子国在此建都。秦：置汝阴县。北魏武泰元年（528）：首置颍州，颍州的称呼从这里开始。北宋：欧阳修、苏轼先后任颍州，盛赞颍州西湖&quot;平湖十顷&quot;&quot;未觉杭颍谁雌雄&quot;。金、元以后：黄河屡次夺淮入颍，泥沙把西湖一点点淤成平地，主湖一度只剩唐时的1/150。明正德九年至十一年（1514-1516）：砌南城，四角建敌楼，东南角一座称&quot;望霍&quot;（今奎星楼）。清康熙三十五年（1696）：建七层文峰塔，俗称&quot;七蓬塔&quot;。1939年：遵&quot;拆城墙&quot;通令，古城墙悉数拆除，唯有已变成风水塔的奎星楼保留下来。现状：城墙无存，奎星楼、文峰塔、资福寺、城隍庙等零星尚存\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e奎星楼（明代·高9.93米·三层六边形砖塔）：原东南城角的瞭望敌楼，后改为祭祀奎星、求文运的风水塔。塔顶一铁制舞凤头西尾东，二层门楣题&quot;文光射斗&quot;、三层题&quot;奎壁联辉&quot;。老阜阳人叫它&quot;三蓬塔&quot;&quot;望霍楼&quot;&quot;拐角楼&quot;。文峰塔（康熙三十五年建·七层·青灰色）：与奎星楼一紫一青，隔着老城相望。资福寺（清代）：城内古刹。城隍庙（明至清·建设街23号）。颍州西湖（重建一期湖面1.9平方公里）：照着欧阳修&quot;平湖十顷碧琉璃&quot;的诗句，一亭一桥往回建，&quot;湖亭&quot;&quot;兰园&quot;&quot;撷芳亭&quot;&quot;怡园&quot;等古建重新落水。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌颍州老裁缝陈师傅（71岁）：&quot;老人都讲&#x27;七蓬塔能爬，三蓬塔爬不得&#x27;，说塔里睡着大蟒。其实那三蓬塔早先是东南城角的敌楼，望敌情用的，后来才改成求功名的风水塔，成了全城独一份的老底子。&quot;\u003cbr\u003e▌西湖边晨练的王大爷（64岁）：&quot;我小时候西湖早淤成平地了，只在老相片里见过。这几年政府照着欧阳修的诗一亭一桥地往回建，我领着孙子去，说&#x27;这就是当年跟杭州西湖并称的那个湖&#x27;。&quot;\u003c/p\u003e"}, {"n": "灵璧老县城·磬石之乡", "s": "灵璧", "p": "安徽", "w": "霸王别姬虞姬墓·乾隆御封&quot;天下第一石&quot;·钟馗画发源地", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋元祐元年（1086）：始置灵璧县。秦末楚汉之际：垓下古战场，霸王别姬的故事在这里收场（虞姬墓在灵璧）。宋代：磬云山开采灵璧磬石，凿成宫廷编磬进贡。北宋：通济渠（隋唐大运河）穿境，汴水绕城。明清：钟馗画成了民间过年的大宗年画，家家张贴驱邪纳福。现状：古城墙无存，虞姬墓、磬石山、花石纲遗址等地上地下遗迹尚存\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e虞姬墓（省保）：霸王别姬纪念地，墓冢、霸王广场、楚汉碑廊。园内汉白玉虞姬雕像，垂柳绕湖。磬石山（国家地质公园·宋代采石坑、摩崖造像）：灵璧石原生地，磬石瘦、皱、漏、透，叩之音如青铜。乾隆御封&quot;天下第一石&quot;。山上还有宋代古采石坑、将军洞、拔剑泉。花石纲遗址（国保）：北宋给宫廷采运贡石（花石纲）留下的采石遗迹。大运河遗址（灵璧段）：通济渠故道，近年勘探出土大量船具、瓷片。灵璧钟馗画（省级非遗）：中国民间文化艺术之乡，钟馗画、钟馗剪纸、钟馗皮影世代相传。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌钟馗画坊画师钟师傅（50岁）：&quot;我们灵璧人画钟馗，跟别处不一样——钟馗要画得又凶又亲。凶能镇宅，亲是老百姓把他当自家人。我爷爷那辈，过年集市上挂的全是钟馗像，孩子们追着看&#x27;钟馗嫁妹&#x27;。&quot;\u003cbr\u003e▌磬石山脚下的石匠老李（57岁）：&quot;灵璧石敲一下有铜音。乾隆爷封它&#x27;天下第一石&#x27;，我爹一辈子在磬云山凿石头，说宋朝就有人在这儿采石头给宫里做磬。摸一摸，是几亿年的东西。&quot;\u003c/p\u003e"}, {"n": "怀远老县城·荆涂峡口", "s": "怀远", "p": "安徽", "w": "禹会诸侯于涂山·荆山卞和洞和氏璧·白乳泉&quot;天下第七泉&quot;", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e四千年前：大禹会诸侯于涂山，《左传》记&quot;执玉帛者万国&quot;。汉高祖（前195年）：过涂山，命立禹王庙镇涂山。南宋宝佑五年（1257）：设怀远军，&quot;荆山为城，义在怀远&quot;，怀远之名从此定下来。明：常遇春故里常坟镇，明太祖追封开平王。2017年：禹会村国家考古遗址公园正式立项。现状：城墙无存，涂山禹王宫、启母石、荆山卞和洞、白乳泉等遗迹集中在荆涂两山之间\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e禹王宫（始建于前195年·涂山之巅·主峰338.7米）：祭祀大禹与涂山氏女，两千多年的老庙。会爬山的先登主峰烧香，再望淮河拐弯。启母石（望夫石·文保单位）：大禹治水&quot;三过家门&quot;，涂山氏女盼夫化成的巨石。禹会村遗址（龙山时代·国家考古遗址公园）：挖出大型祭祀台基，出土陶器来自山东、河南、安徽、江苏、上海、浙江六地，正应了&quot;执玉帛者万国&quot;。卞和洞（荆山半腰·天然岩石堆叠）：和氏璧的传说，楚人卞和献玉的地方，洞不大，弓腰才能进，能容十几人。白乳泉（苏轼赞&quot;天下第七泉&quot;）：四周榴林似海，五月花开如千株红珊瑚。常氏三王墓（常遇春祖坟·省保）、常遇春纪念馆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌涂山庙会常客涂大爷（72岁）：&quot;每年农历三月二十八涂山庙会，省里都列了非遗，祖祖辈辈上山拜禹王。我们这儿石榴五月开花像火，八月熟透掰开红籽像宝石——就长在荆涂二山夹着的淮河边上。&quot;\u003cbr\u003e▌禹会村放牛的老马（63岁）：&quot;早先在地里刨出陶片，谁也没当事，随手就扔。考古队一来，说这是四千年前大禹开会的地方。我才明白，脚下踩的是夏朝的一个脚后跟。&quot;\u003c/p\u003e"}, {"n": "太和老县城·细阳故城", "s": "太和", "p": "安徽", "w": "皖北唯一的元末明初文庙大成殿·七处故城叠置·楚都钜阳", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：宋国鹿上，宋襄公会诸侯的&quot;鹿上之盟&quot;在这里。前253年：楚考烈王迁都巨阳（钜阳）于此。秦：置新阳县，属颍川郡。汉：置细阳县，汝阴侯夏侯婴食邑细阳千户。元大德八年（1304）：建置今县城，始建文庙、城隍庙。明洪武三年（1370）：改&quot;泰和&quot;为&quot;太和&quot;，取太平祥和之意。1941年：城隍庙毁于一旦，绵延数百年的&quot;城隍出巡&quot;庙会就此断绝。现状：古城墙无存，文庙大成殿、崇圣祠、南寺等尚存，城隍庙只剩地名\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e文庙大成殿（省保·元末明初木构·皖北唯一）：真正原装的古建筑只剩大成殿和背后崇圣祠，泮池四周一圈汉白玉石栏保存完整——普通县级文庙的泮池栏杆早就没了。南寺（省保·人民北路120号·吕字形宫殿式建筑）：一部分直接占了马路的上街沿都没拆，正在申报国保。城隍庙遗址（明代曾&quot;大门三间、中门三间、正殿三间&quot;、青瓦丹柱）：1941年被毁，只留下&quot;城隍庙&quot;的地名。枕头馍（文庙小摊）：外皮酥脆、层层分明，一个够吃一个礼拜。太和板面：一清二白三红四绿，配卤羊蹄。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文庙广场练书法的刘老师（56岁）：&quot;大成殿那几根柱子是元末明初的老木头，全皖北独一份。泮池的汉白玉栏杆别的县早没了，我们这儿一圈还整整齐齐。太和是书画之乡，广场上常年有人蘸水练字。&quot;\u003cbr\u003e▌老城隍庙巷口的老住户徐奶奶（81岁）：&quot;我小时候每年清明&#x27;城隍出巡&#x27;，抬着木雕的城隍爷出南门进东门，各街出龙灯、旱船，热闹得过节。后来庙没了，这出巡再也没抬起来过。&quot;\u003c/p\u003e"}, {"n": "颍上老城·慎邑·管仲故里", "s": "颍上", "p": "安徽", "w": "管仲故里·管鲍祠·&quot;皖北水乡&quot;八里河", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周：慎邑，属楚。秦：置慎县，属泗水郡。隋大业二年（606）：改名颍上县，一直用到今天。春秋：管仲、鲍叔牙故里，&quot;管鲍之交&quot;的典故从这里来。明清：外城河、老街格局形成。1991年：特大洪水之后，利用低洼沼泽建起八里河景区。现状：管仲老街复建明清古建街，明清苑是皖北规模最大的明清古建筑群\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e管仲老街（沿外城河复建·明清风格古建街）：以管仲文化为主题，青石板路、徽派马头墙，晚上红灯笼一亮像到了江南。内有纪念管仲、鲍叔牙的管鲍祠。明清苑（皖北规模最大、保存最完整的明清古建筑群）：斗拱飞檐、木雕砖雕、石雕影壁。九合塔：临水古塔。八里河（国家5A·占地15.8平方千米）：1991年灾后，全镇人用小推车一车车推出来的&quot;天下第一农民公园&quot;，曾被联合国授予环保&quot;全球五百佳&quot;。颍上花鼓灯（国家级非遗·&quot;东方芭蕾&quot;）、推剧发源地。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌管仲老街开茶馆的小管（45岁）：&quot;我们颍上人出去说&#x27;管仲是我们县人&#x27;，谁听了都信。老街这些马头墙是照老样子复建的，晚上灯笼一亮，外地客都说像在江南——其实这是淮河边。&quot;\u003cbr\u003e▌八里河畔的沈大爷（70岁）：&quot;八里河是发大水之后，全镇人用小推车一车车推出来的。当年照着挂历上的名胜照片自己琢磨着建。我指着那座假山跟孙子说：这山，爷爷也推过一铲子土。&quot;\u003c/p\u003e"}, {"n": "临涣老城·铚城", "s": "临涣", "p": "安徽", "w": "国内唯一镇级夯土古城墙·5802米城垣还能登·不产茶却飘香千年的棒棒茶镇", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：宋国设铚邑，在涣水（今浍河）北岸夯筑土城。战国：属楚。秦：置铚县，属泗水郡，为区域政治经济中心。汉：仍为铚县；唐改称临涣。明：临涣商贸鼎盛，号称&quot;两庵四寺九阁十八庙&quot;。1968年：当地&quot;退城还田&quot;号召把城墙推平改农田，多处城墙遭破坏。2006年：临涣城址列为第六批全国重点文物保护单位。2017年：安徽省文物考古研究所对城墙做全面勘探，解剖东北角断面\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古城墙（夯土·总长约5802米·残高5-7米）：东、北、西三段基本完好，南城墙部分残存；城墙东西长1409米、南北宽约1400米，占地195万平米；城上豁口12处、外凸台墩8处、四角角楼基础仍在；城外北东西三面护城河总长4.2千米、宽5-10米，部分淤塞。南阁楼（玉皇阁·砖石结构）：临涣唯一砖石城楼，民间传说姜子牙在阁楼屋脊修了座迷你姜太公庙。文昌宫（唐代始建·初昌帝庙，宋更名文昌宫）：前后三进院落。怡心茶楼（1909年始建·两层三进天井）：棒棒茶一元一壶，十余年没涨价。棒棒茶：用六安瓜片、祁门红茶加工后剩的茶梗，配当地龙须泉水冲泡，别处泡不出这股绵甜。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌南阁街烟酒店老板李广英（63岁）：&quot;我祖上开染坊，这条南阁街从前就是牛市，浍河边一天几百头牛。现在老茶客天天清早来敲门，我晚开一步门口就一堆老头等。&quot;\u003cbr\u003e▌怡心茶楼掌柜张秀侠：&quot;三十多年前我接手时一壶棒棒茶两毛钱，十年前定成一元就没涨过。镇上老人一天来两趟，不为喝茶，就是来坐坐说说话。&quot;\u003c/p\u003e"}, {"n": "界首老城·颍滨彩陶乡", "s": "界首", "p": "安徽", "w": "沙颍河黄胶泥烧了千年·田营十三窑·刀马人三彩国家级非遗", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐宋：颍河（沙颍河）南岸已出现以黄河淤土为原料的陶窑。元延祐年间黄河泛滥后：淤土分&quot;小胶泥&quot;&quot;大胶泥&quot;，可塑性变强，能做复杂器型。清：田营镇形成卢窑、朱窑、计窑、魏窑、高窑、田窑、荣窑等十三窑，村以窑为名。1954年：窑工卢山义的&quot;刀马人&quot;三彩酒坛登上苏联《造型艺术》杂志，东欧国家争相收藏。2006年：界首彩陶烧制技艺列入首批国家级非遗。2019年：田营十三窑列为安徽省第八批省级文保，2022年完成抢救性修复。2025年：界首工艺陶瓷厂老窑入选全省第四次文物普查&quot;十大新发现&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e田营十三窑古窑址（省保）：卢窑、计窑、魏窑等十三口窑，2022年&quot;修旧如旧&quot;复原，修复前窑口长满树。界首彩陶（国家级非遗）：三彩刻花、刀马人刻画、花鸟纹，72道工序历时三个多月。界首工艺陶瓷厂老窑（七十多年·红砖烟囱高耸）：韩美林曾多次来此指导，2025年改造成陶艺公园。彩陶博物馆（田营镇韩楼村）：邢淑芹创办，可研学体验制陶。卢氏刻花彩陶非遗传习所（城区）：国家级传承人卢群山设，7位老师免费教学。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌田营镇制陶世家卢一林（市级非遗传承人）：&quot;上一批彩陶烧出来，72道工序我盯着过了三个多月。梅瓶、观音瓶、石榴瓶，窑门一开流光溢彩。&quot;\u003cbr\u003e▌计村老艺人计文刚（67岁）：&quot;现在村里就我还做陶了，做了一辈子。我要是不做，这手艺就绝了。&quot;\u003c/p\u003e"}, {"n": "临泉老城·沈子国", "s": "临泉", "p": "安徽", "w": "周文王第十子聃季载封地·古城子12层文化层·2000年通教寺银杏", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e前1042年：周文王第十子聃季载受封沈地，建沈子国，这是临泉有明确记载的建城之始。春秋：前506年沈子国为蔡所灭，后归楚。秦：设平舆县，属泗水郡。西汉：西部置鲖阳县（治今鲖城镇），两汉魏晋间鲖阳曾两次设郡。1934-1935年：析阜阳西乡设临泉县（县名取&quot;临泉河&quot;之意）。现状：古城子遗址保护，古沈国历史文化园建成\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e沈子国古城遗址（省保）：县城西500米古城子，北依泉河、南临流鞍河，城墙、护城河、古城堡、烽火台犹存；考古共12个文化层，上限商周、下限宋元；城边出土青铜镞、陶范众多。老丘堆（沈子墓·新石器遗址）：流鞍河南岸，长50余米、宽20余米、高10余米，出土石斧、石锛、骨针、陶方鼎；相传聃季载葬此。通教寺银杏树（唐·两千多年）：高30余米、胸围8米，&quot;九棱十八丫&quot;，根部传有李闯王&quot;马蹄印&quot;；与古城子、老丘堆合称&quot;临泉三件宝&quot;。鲖阳古城（鲖城镇北郊·两汉魏晋曾设郡）：陶片瓦砾俯拾皆是，出土楚国黄金货币&quot;郢爰&quot;、铜镜、石磬。姜尚故里（姜寨镇）：太公庙、姜公冢、&quot;姜尚故里&quot;石碑。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌古城子旁老人王大爷（71岁）：&quot;都说我们临泉三件宝——老丘堆、银杏树、古城堡。我在银杏树底下乘了一辈子凉，二十年前有个沈姓宗亲从外地回来，跪在树底下抱着就哭，说找着祖坟了。&quot;\u003cbr\u003e▌鲖城镇赶集的刘婶（58岁）：&quot;鲖阳古城那片地金贵，犁地都能犁出黑陶片。老辈说这是楚国铸钱的地方，我们管那叫&#x27;鬼集&#x27;——阴天夜里老听见铜钱响。&quot;\u003c/p\u003e"}, {"n": "凤台老城·州来下蔡", "s": "凤台", "p": "安徽", "w": "淮河绕城的茅仙洞佛道胜地·八公山豆腐源头·刘安《淮南子》之乡", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：楚灭州来国，为州来城。前493年：蔡昭侯由河南新蔡迁都州来，改称下蔡。秦：置下蔡县，属泗水郡。汉：刘安封淮南王，与门客在八公山编《淮南子》。清雍正十年（1732年）：置凤台县（因境内凤凰台得名），县名沿用至今。现状：下蔡老城格局尚存，茅仙洞、八公山是淮南文旅核心\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e茅仙洞（淮河第一峡·佛道两教胜地）：城南3公里，三面环水、淮河绕境，山石倒长南仰北倾；茅仙古洞、清天观、古寿唐关距今千年。八公山（豆腐发源地）：西汉淮南王刘安炼丹，无意间用卤水点出豆腐——&quot;八公山豆腐&quot;由此来，白嫩如脂。淮河故道（黑龙潭至峡山口段）：山高水急，淮河出峡第一景。刘安文化遗存：《淮南子》&quot;一人得道，鸡犬升天&quot;的典故即出此地。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌茅仙洞山下老船工常大叔（68岁）：&quot;我撑了一辈子淮河船，就数峡山口那段最险，船贴着一线天过。茅仙洞的道士说这是&#x27;淮上第一胜境&#x27;，夏天进去乘凉，比空调房还舒服。&quot;\u003cbr\u003e▌八公山豆腐坊刘婶（61岁）：&quot;我们这豆腐是两千年前刘安炼丹炼出来的，卤水一点，白得像玉。我这豆腐坊传了三代，豆子是本地豆，点浆用八公山的水，别处做不出这股嫩。&quot;\u003c/p\u003e"}, {"n": "五河老城·五水汇聚", "s": "五河", "p": "安徽", "w": "淮浍漴潼沱五水交汇·顺河老街七十余家粮行·人送&quot;小上海&quot;", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e清末：五河口成天然良港，顺河老街（东桥口一带）农历逢集成市。光绪版县志（1894）：记载&quot;顺河街在东桥口，迤南，每日逢集&quot;。民国初：上海、广州、天津客商汇入，粮行20多家猛增到70多家，从业人员500多人。2006年：顺河老街列为省级历史文化街区。2026年3月：五河城墙旧址、顺河街码头旧址、民国顺河老街纪念碑纳入第四次文物普查新增文物点\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e顺河老街（省级历史文化街区·总面积3.378公顷）：水巷、小东河巷、河西街、元宝街、顺河老街5条历史街巷；7处历史建筑（胡家大院、九和粮行、陈家果行、丁家宅院、张家果行、丁家粮行、板桥）。东桥口码头：36阶石阶埋于地下（上世纪80年代检查时用土盖住保存）。清末建筑四五处：黄霭堂杂货店、九和粮行、张家干果行、陈家水果行的部分房子。五河民歌（国家级非遗）、临北狮子舞、钱杆舞（省级非遗）。古城墙旧址：淮河路五河城墙旧址（2026年立牌）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌顺河街邓家后人小邓（52岁）：&quot;我曾祖父开九和粮行，红火到蚌埠信丰面粉厂的采购员常年住我家。小时候东桥口码头石阶还能走，后来给土盖起来，我路过就扒开看两眼。&quot;\u003cbr\u003e▌老街住户陈奶奶（76岁）：&quot;五河五条河，吃水靠人驮。我年轻时天天挑淮河水，顺河街码头卸粮的、上船的，一天到晚不断人，比现在赶集还热闹。&quot;\u003c/p\u003e"}, {"n": "阜南老城·台家寺", "s": "阜南", "p": "安徽", "w": "商代淮河青铜文明中心·龙虎尊出土地·原鹿会盟之城", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商代中晚期：台家寺成为商王朝在淮河流域的最高等级聚落、&quot;江淮金道&quot;上的铜料中转重镇。前639年：宋襄公在鹿上（今公桥乡阮城村一带，古原鹿故城）邀齐、楚会盟。1957年：朱寨镇农民徐庭兰在润河捕鱼，一网捞出8件商代青铜器（两尊两斝两觚两爵），其中的龙虎尊定为国家一级文物。1949-1950年：拆阜阳、临泉、颍上部分乡镇设阜南县。2014-2017年：武汉大学联合安徽省考古所发掘台家寺，出土陶范1174块。2019年：台家寺遗址列为第八批全国重点文物保护单位\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e台家寺遗址（国保）：朱寨镇三河村润河湾北岸，由1个大台墩+4个小台墩组成；方形环壕东西105米、南北85米、宽13-15米；围内大型宫殿基址、铸铜作坊；出土陶范1174块，证实龙虎尊在此铸造。龙虎尊（国家一级文物·禁止出境·高50.5厘米、口径45厘米）：肩部三条蟠龙，腹部三组双虎食人纹；1959年送藏中国国家博物馆，中国十大青铜器之一。原鹿故城遗址（公桥乡阮城村）：春秋鹿上会盟地，夯土城墙、护城河遗迹尚存，田野能捡到楚国蚁鼻钱、汉代铜镜。商代铜方鼎、铜鬲（1944年出土）：同出润河湾，比龙虎尊早13年。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌朱寨镇三河村放牛老汉徐大爷（70岁）：&quot;1957年徐庭兰在河里撒网，一网兜上来个大家伙，锈得发黑。政府奖了他200块，顶我爹半年工钱。后来才晓得那叫龙虎尊，进北京了。&quot;\u003cbr\u003e▌博物馆讲解员小张（28岁）：&quot;台家寺挖出1174块陶范，专家一比，跟龙虎尊纹路严丝合缝——原来这尊是三千年前就地在润河边铸的，不是外面运来的。&quot;\u003c/p\u003e"}, {"n": "谷阳老城·固镇", "s": "谷阳", "p": "安徽", "w": "西汉谷阳城遗址·862年郡县治所·字圣许慎为官地谷阳城建于西汉初，作为郡县治所延续862年，是&quot;固镇&quot;一名的源头（谷镇→固镇）；东汉文字学家许慎在此为官、著《说文解字》。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉初：筑谷阳城，属沛郡谷阳县。后汉：属沛国。南北朝：北魏置阳平郡，太和年间改谷阳郡，改谷阳城为谷阳镇，俗称&quot;谷镇&quot;（后演变为今名&quot;固镇&quot;）。隋：废谷阳郡，仍为谷阳县。唐显庆元年：省谷阳入蕲县，城废。2004年：谷阳城遗址列为省级文保。2025年：编制《谷阳城遗址保护规划（2025—2035年）》，遗址与樱花景观结合活化\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e谷阳城遗址（西汉·省保）：四方土城，每边城墙约1000米、面积100万平米；四门居中；遗址高于周围约3米、城墙残高平均3.5米、上宽20米、基宽30米、文化层厚3.5米；地表遍布汉代碎砖瓦、陶片。汉代&quot;谷阳之玺&quot;等出土文物（存固镇县博物馆）。许慎文化公园：纪念东汉字圣许慎。谷阳城樱花景观带：15万株、47种樱花环绕古城墙。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌谷阳村种地老农（60岁）：&quot;地里一锄下去净是汉朝碎瓦片子，早先不知道是宝，都捡去垫了猪圈。后来划成文保，种地都得绕着城墙根走。&quot;\u003cbr\u003e▌许慎文化公园晨练老人：&quot;固镇人一提起许慎，腰杆都直——写《说文解字》的字圣，在俺们这当过官呢。&quot;\u003c/p\u003e"}, {"n": "灵璧老城", "s": "灵璧", "p": "安徽", "w": "虞姬墓·天下第一奇石·钟馗故里·垓下楚汉风？霸王别姬故事的发生地，虞姬墓冢高六米，还有乾隆御封的&quot;天下第一石&quot;灵璧石与全国规模最大的钟馗文化园，一县集&quot;一石、一姬、一画&quot;三样独步天下的风物。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e楚汉相争，垓下一役项羽兵困，虞姬殉情，葬于灵璧城东，虞姬墓历经两千余年犹存。灵璧之名始于宋代，因境内磬石质坚如璧、扣之悦耳，&quot;灵璧磬石&quot;自商周即为宫廷编磬之材。隋唐大运河通济渠（汴河）穿境而过，灵璧为漕运冲要，&quot;古汴河&quot;之名流传至今。明清以来灵璧&quot;三宝&quot;定型——奇石（灵璧石）、虞姬（楚汉风月）、钟馗画（民间门神），代代相传。古灵城的&quot;凤山夕照&quot;等八景记载于方志，如今城东开辟虞姬文化园、钟馗文化园、奇石文化园，把这三样风物一一收拢。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e灵城东部的虞姬墓墓冢阜高六米、基宽十一米，1986年被列为省级文保，墓侧立碑，又建颂虞姬碑廊，由清代安徽巡抚冯煦撰墓碑文，启功、舒同等名家书碑成林，园内汉白玉虞姬雕像温婉，霸王广场与楚汉碑廊叙说着垓下悲歌。而灵璧石集&quot;瘦、皱、漏、透&quot;四字，扣之音如青铜、温润如玉，清代乾隆帝御封为&quot;天下第一石&quot;，产于磬云山一带，磬云山地质公园保留着宋代古采石坑、摩崖石刻、将军洞、拔剑泉，层层岩层记录着亿万年的沧海变迁。城内的钟馗文化园占地七百二十五亩，中心的馗峰塔高四十八米、四角方塔、唐风建筑，屹立制高点，馆藏明清古钟馗画与当代名家作品，是钟馗故里与钟馗画（省级非遗）最好的注脚。此外，古汴河在县城北蜿蜒而逝，是隋唐大运河通济渠在宿州一带的重要段落，岸边旧迹与地名至今仍留存着漕运的记忆。。\u003c/p\u003e\u003cp\u003e垓下古战场在灵璧东南，当年楚汉决战的那片旷野，如今已是平畴稼穑，唯余&quot;霸王别姬&quot;&quot;四面楚歌&quot;的典故在史料与戏文里流传，供人凭吊那场改变了历史走向的悲歌。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌灵璧老石工 马师傅（72岁）：&quot;灵璧石讲究瘦皱漏透，好石头扣起来&#x27;当当&#x27;跟敲钟一样。磬云山上那老采石坑，是宋朝就开的，磨了几百年。乾隆爷封它&#x27;天下第一石&#x27;，咱这行当认这个名头。&quot;\u003cbr\u003e▌虞姬墓园守墓人 李叔（69岁）：&quot;都说虞姬埋在这，墓堆高6米，站在跟前人就不敢大声说话。每年节令，庙会的人来烧纸上香，有唱戏的还现演霸王别姬，一个哭一个唱，看的人眼圈都红。传了两千年的故事，还有人在守着。&quot;\u003c/p\u003e"}, {"n": "东平州城", "s": "东平", "p": "山东", "w": "龟城·龟头南门望鲁·屁股眼北门井·肚脐桂井子？宋代始建龟形城池，城墙残垣可摸，桂井子还在熬东平粥", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋咸平三年（1000）始建土城，形如方胜（两个菱形压角相叠），城门东西各二。清乾隆三十四年（1769）知州沈维基以砖易土，西部城墙内缩，西门减为一，龟城变成向前游动姿态——蜷右前爪、扭尾巴。1982年县城迁往新城，旧县城废弃。现状：城墙残垣还能摸出龟城轮廓，长方土台残段长180米宽15米高2米。\u003c/li\u003e\u003cli\u003e城墙规格：高7米，底宽7米，顶宽4.3米，上铺两层海漫砖，堞高1.6米。城门楼高3丈，红墙碧瓦画柱重檐，四角挂铃铛。每扇城门81颗饽饽钉（拳头大小九九成列），一尺长圆形大象鼻锁。\u003c/li\u003e\u003cli\u003e明代纵横各十八条街，现六十多条。这些街巷名现在还在用：桂井子街（肚脐井雅称，明代就有）：270户1013人，东平粥发源地。署前街（迎门墙口→南门）：原来商号林立，晋商兴成永、协和永在此。署东街、署西街（州署东西两侧）。大隅首顶（龟盖，地势最高，当铺盐店所在地）。牌坊街、文庙街、大东门街、小隅首、书院街。迎门墙口：州署前照壁留下的地名，原来这里是小广场，吃食摊昼夜繁华\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e桂井子（龟肚脐井）：青石砌垒，井口2米见方厚0.3米整块石凿圆状，井口绳痕32处深0.03米。全州城井水多苦咸，唯此井甘冽。东平粥（徐家粥）：桂井子街徐保明世代经营，自清康熙十九年（1600）至今330年。大豆小米2:1磨浆，马公祠井水熬制，粥浓如酱喝似水，碗底不挂一丝。城墙残垣：汉代东平故城城墙遗存（宿城村西北），长180米宽15米高2米。五块城门石匾：全部出土！望鲁（东平博物馆）、龙虎/瞻岱/秩成/拱极（州城石刻博物馆）。永济桥：明代13孔石桥，现在还是公路桥，开车能过。宋槐：永济桥北端东侧，宋代种的。\u003c/p\u003e\u003cp\u003e五座城门门楼（高三丈，红墙碧瓦画柱重檐，四角挂铃铛）。铁皮城门（81颗饽饽钉，大象鼻锁）。州署大堂、库房、帑藏（宋建，毁于火灾）。魁星楼（文昌阁，大东门正南500米城墙上）。北门玄武老爷青铜法身（1938年被掠走）。城内七十二座牌坊。十里宋街（马可·波罗说&quot;万船竞发，舟楫如织&quot;的主街）。护城河（宽一丈深七尺，引汶水，现已填平）。\u003c/p\u003e", "c": ""}, {"n": "肥城老城", "s": "肥城", "p": "山东", "w": "卧虎城·虎口北门·元代大成殿·手能摸元代八根明柱元建卧虎城，城形如卧虎，城门按虎的部位命名。城墙残垣可摸，元代大成殿八根明柱至今立着，齐长城北端38公里还在。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e元初始建土城，形如卧虎（南有二隅似虎膝，西北有锯齿缩进似虎腚，北端两侧凹进似虎肷，东北东南两隅凸形似虎爪）。明万历四十六年（1618）改砖城，外砌33层青条石，缝处刀刃不入，号称&quot;玉城&quot;——阳光照耀泛玉石色。清代屡修屡圮，1938年兵燹后城墙残垣仅存东北段。现状：城墙残垣还能摸出卧虎轮廓，元代大成殿完整保存。\u003c/li\u003e\u003cli\u003e城墙规格：周长四里三十步，高三丈，厚两丈七尺。\u003c/li\u003e\u003cli\u003e城内以霸王街（南北大街）为虎脊，关帝庙东墙根一米余赤色菱形石为虎心，城隍庙街中段紫色条石为虎肺。街巷名保留至今。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e元代大成殿（文庙）：还在！长120米、宽12.4米、高12.2米。明柱八根，每根粗1.86米（两人合抱）。歇山式五脊顶，重椽斗拱。城墙基址线：老居民叫&quot;城墙根&quot;，一圈土堆还能摸出来，&quot;巧山青石来自巧山，建城后巧山被挖夷为平地&quot;的传说还在传。北门迎恩桥：明嘉靖年重修，李邦珍出资，尹庭撰文。桥体还在（后来重修过）。齐长城遗址（北端）：全长38公里，部分尚存，遗址清晰。北坦遗址（大汶口文化）：1973年出土石器陶器，文化层堆积1-3米。。\u003c/p\u003e\u003cp\u003e城墙（33层青条石、缝处刀刃不入、号称&quot;玉城&quot;——阳光照耀泛玉石色）。护城河（宽一丈深五尺，引康河水）。七座石牌坊（龙章奕世坊、敕赠坊、柱史坊、飞舄乘骢坊、谏议坊——全毁于兵燹或文革）。城隍庙（内有能动的城隍像，按下膝盖能站起来）。衙署（元代始建，毁于元末，后多次重修，1980年南迁后废弃）。\u003c/p\u003e", "c": ""}, {"n": "宁阳老城", "s": "宁阳", "p": "山东", "w": "四街千年不挪窝·泮池72石板·城砖拆去建学校？北齐天保七年（556）始建，文庙是泰安唯一县学，街道格局从明代至今一丝未变，唯独城墙砖全被拆去建了学校。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北齐天保七年（556），县治从汉宁阳城迁至今址，略呈正方形。北宋始筑土城。明正德六年（1511）被农民义军拆除。明嘉靖九年（1530）外砖内土，周四里五十步，高二丈四尺三寸，顶阔一丈，趾厚二丈。明万历九年（1581）悉易以砖，三十一年改城墙顶水道于内。护城河深八尺阔一丈二尺，蛇眼诸泉四面环绕。1950年代，城墙砖被拆去建学校，护城河填为街道。\u003c/li\u003e\u003cli\u003e古城四街至今位置走向没变，街名沿袭旧称！东西两街贯通，南北两街错开，北街垂直接在西街上。旧县署建在错开十字的东北位置，与东西两街和北街组成一个&quot;上&quot;字——全城最高点。四条街道由内向外成坡，水从中心流向四门，雨过天晴城区干净清新。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宁阳文庙（省级文保）：泰安现存唯一县学文庙！元大德元年（1297）建，占地近4000㎡，棂星门（四柱三门石坊）、泮池泮桥、大成门、大成殿、乡贤祠、名宦祠全在。泮池泮桥（明嘉靖十九年1540）：桥面七十二块大小不一石板（寓意孔子弟子三千精通六艺者七十二人），桥券&quot;三券三伏&quot;（帝王园林规格）。只有中状元才能走，普通人绕桥而行——所以又叫&quot;状元桥&quot;&quot;青云桥&quot;。元代关帝庙（省级文保）：尚书路中段，元代始建，占地1800平米。明代孔子庙（省级文保）：尚书路东段，孔子中都宰治政地（前501年）。尚书路（神奇一街三教）：东段文庙（儒·孔子）、中段关帝庙（道·关公）、西段宝相寺（释·释迦）——三位圣人相视而望，全国罕见。明代四尚书：吏部尚书吴岳、兵部尚书路迎、户部尚书王杲、工部尚书郭朝宾——&quot;小县不大四尚书&quot;。。\u003c/p\u003e\u003cp\u003e明代砖城四门（全毁）。护城河（填为街道）。县署全套建筑。宝相寺（宋代所创，俗称大寺，毁于兵燹）。天主教堂（清光绪二十年1894德国传教士建，今宁阳宾馆址）。城隍庙（今实验中学址）。文庙后明伦堂、敬一亭、尊经阁、文昌阁（全拆）。\u003c/p\u003e", "c": ""}, {"n": "兖州老城", "s": "兖州", "p": "山东", "w": "国内最短古城墙6米·北门外门朝东扭头门·先有石佛寺后有兖州城？古九州之一，明代鲁王城封地，城周14里200步山东数一数二，如今只剩西护城河侧一段6米残墙夹在两民居间——被称为&quot;国内最短古城墙遗址&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e金代始建土城（由瑕丘古城迁建今址）。元沿用土城。明洪武十八年（1385），朱元璋封第十子朱檀为鲁王，派武定侯郭英扩建：· 向南扩建两华里，新城周长14里200步，高三丈七尺。· 外砌青砖，新建带瓮城的东门、南门、西门（各具两道城门）；原地重建北门，外门朝东开——被称为&quot;扭头门&quot;。· 建鲁王城：城北中央，东西700米×南北600米=0.42平方公里，前门端礼门、右遵义门、后广智门、左体仁门。· 建府学文庙（3路5进）、贡院（文庙东侧，考房200间）。清康熙三十一年至五十九年（1692-1720）重建兴隆塔（郯城大地震震塌上截）。1960年代后，城墙砖全被拆走——明初14里大城荡然无存。现状：西护城河东侧残留6米残墙（长6米宽1米高4米），夹在两座民居间。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e兴隆塔（全国重点文保）：隋仁寿二年（602）始建，宋太平兴国七年（982）改砖塔。13层八角楼阁式空芯砖塔，高54米。2008年地宫出土石函、鎏金银棺、金瓶、安葬舍利碑刻等——石函内出鎏金银棺、金瓶、舍利、佛牙。金口坝（全国重点文保）：古代水利枢纽工程。石佛寺遗址（城东北豆腐店村北）：隋大业年间（605）建，&quot;先有石佛寺后有兖州城&quot;。陨石从天而降刻成弥勒石佛，旁有圣水井（八角琉璃砖砌井沿·井底有灵石·宋淳化五年刻咒文·天旱求雨取石即雨）。寺毁，遗址、圣水井还能找到。兖州府文庙（3路5进·格局完整）：棂星门→大成门→大成殿→明伦堂→尊经阁。府河（原御河·南护城河）：还在！中御桥/东御桥/西御桥跨河尚存。聊城东昌古城（作为对比）：同样有扭头门。。\u003c/p\u003e", "c": ""}, {"n": "汶上老城", "s": "汶上", "p": "山东", "w": "中都故城·孔子首任宰·宝相寺佛牙舍利·尚书路儒释道一街？孔子首任中都宰（前501年），宝相寺太子灵踪塔1994年地宫出土佛牙舍利震惊佛教界，尚书路一街聚儒释道三位圣人相视而望全国罕见。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周代封鲁置中都邑（孔子宰前叫&quot;致密城&quot;）。唐天宝元年（742）改称中都县，移治今址。金泰和八年（1208）取&quot;汶水在上&quot;意更名汶上县（汶上之名始此）。明成化至万历十年（1475-1582）筑土城覆砖石，周长6.3公里方形。四门：北门望岳、东门醉白、南门观河、西门怀冉，外筑月城（瓮城）。民国二十七年，寺遭炮轰夷为平地，塔身受创。现状：城门全毁。东、北两面遗有土筑残垣还能摸出轮廓。宝相寺已重建，太子灵踪塔保存完好。\u003c/li\u003e\u003cli\u003e尚书路最独特：一街聚儒释道——东段文庙（儒·孔子）、中段关帝庙（道·关公）、西段宝相寺（释·释迦）。明代四尚书：吏部尚书吴岳、兵部尚书路迎、户部尚书王杲、工部尚书郭朝宾——&quot;小县不大四尚书&quot;。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宝相寺（国家4A级）：北魏始建原名昭空寺，宋真宗封禅泰山御赐改宝相寺，&quot;北朝最初名胜，东土第一道场&quot;。太子灵踪塔（宝相寺塔）：北宋熙宁六年（1073）至政和二年（1112）建，仿开封开宝寺灵感塔。八角13层，高45.5米，底层莲花座。1994年修葺时意外发现地宫入口，出土金棺、银椁、佛牙、九百余颗佛舍利等141件——数量最大的佛舍利发掘。汶上文庙（省级文保）：始建不晚于唐玄宗开元十三年，占地20000平米。孔子首任中都宰治政地（前501年），&quot;路不拾遗夜不闭户&quot;。汶上关帝庙（省级文保）：元代始建，占地1800平米。。\u003c/p\u003e", "c": ""}, {"n": "滕州老城", "s": "滕州", "p": "山东", "w": "三国五邑·滕国故城文公台·孟子仁政实验田·龙泉塔滕州是古九州青州下辖的&quot;三国五邑&quot;之地，滕、薛、邾三国连城相望。滕国故城是中国历史上孟子&quot;仁政&quot;思想唯一的实地实验田，文公台上滕文公庙前的唐代古槐至今葱郁；而薛国故城那高8到10米、周长28里的夯土城垣，则是孟尝君当年食客三千的豪迈余韵。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐元和十二年（817），滕县治所从故蕃城东移二里，取原黄山岭的黄土夯筑起一座方城，这便是今日滕州老城区的雏形，宋、金、元各代沿用，旧时仅有土城。到明洪武二年（1369）才始建砖城，万历年间重修加固。城墙以内，历代官署、文庙、鼓楼次第铺陈，护城河畔遍植荷花，池莲四面成为滕文人吟咏的景致。至于更早的那座滕国故城，其内城至今残存着土筑的城墙遗迹，文公台隆起于东北隅，历两千年而不没。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e滕国故城（省级文保）在县城西南十四里的姜屯镇滕城村一带。周武王灭商后封其异母弟叔绣于滕，滕国传三十一世、享国七百年有余，到了战国，滕文公礼聘孟子入滕推行仁政，故城便是那场&quot;仁政实验&quot;的唯一现场。内城至今保存，东北隅的文公古台隆起成一座土台，台上立滕文公庙，庙前那棵唐代古槐枝繁叶茂。薛国故城（全国重点文保）横跨张汪镇与官桥镇之间，战国时齐国灭薛，孟尝君受封于此，城周二十八里、内城七里，夯土城墙如今仍高八到十米、清晰可辨，站在墙下仍能想见当年&quot;宾客三千&quot;的排场。滕州城内的龙泉塔是明代万历年间的建筑，八角九层、高四十三米，民间传说塔顶供奉舍利，早已成为滕州的地标。此外，宋元丰元年范纯粹任滕县知县时，苏轼自徐州来滕视察，撰《滕县公堂记》勒石记事，明万历重刻的碑石仍存，字里行间还能读到这位文豪对滕县吏治的期许。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌滕城村文保员 郑大爷（67岁）：&quot;老辈人讲，咱这村底下就是古滕国的城，文公台上那棵老槐树，我爷爷小时候就在底下乘凉，说唐僧取经都未必有它岁数大。每年清朗，四边姓滕、姓薛的都回来认祖，站台上往南一指——那一片全是薛国的地界。&quot;\u003cbr\u003e▌滕州退休老师 颜老师（70岁）：&quot;教书那会儿我爱给学生讲滕文公，说孟子在别处都碰壁，独独在咱这地方把&#x27;仁政&#x27;真推行开了，这就是孟子的实验田。龙泉塔底下有一圈浮雕，老人说是镇塔的，我打小看着它，拆了重建好几回，塔心还是老的。&quot;\u003c/p\u003e"}, {"n": "枣庄台儿庄老城", "s": "台儿庄", "p": "山东", "w": "运河活化石·天下第一庄·8种建筑风格·53处兵燹遗址明万历年间京杭运河改道流经崛起为水旱码头，清乾隆御赐&quot;天下第一庄&quot;。与波兰华沙同属世界上仅有的两座因二战兵燹毁坏而重建的城市。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e肇始于秦汉，发展于唐宋。明万历三十八年（1610），京杭大运河改道流经，迅速崛起为鲁南水陆通衢。清咸丰七年（1857）加固城墙：东西5华里×南北3华里，城门六座，水门一座（水上通道与运河主航道连通）。清乾隆年间最盛：&quot;商贾迤逦，一河渔火，歌声十里，夜不罢市&quot;——乾隆御笔钦赐&quot;天下第一庄&quot;。1938年春，兵燹毁灭古城，化为废墟。战后居民自发在故居残存墙基上重建家园。2008年枣庄市委市政府启动重建，遵循&quot;留古、复古、扬古、用古&quot;原则。现状：重建后2平方公里，3千米古运河道（月河），18个汪塘，15千米水街水巷，53处兵燹遗址保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古运河月河段（世界文化遗产）：3千米月牙形老运河河道，1959年大运河主航道改道城外留存。11座古码头、960米古驳岸，被誉为&quot;活着的古运河&quot;——京杭大运河中唯一完全东西流向的一段。53处兵燹遗址：按&quot;留古&quot;原则完整保存，大战遗址公园内房屋上方布满密密麻麻弹孔。明代水门遗址：运河主航道→城内水街水巷的水上闸门，现在恢复通航。八种建筑风格齐聚：北方大院、徽派白墙、闽南建筑、欧式建筑、岭南建筑、鲁南民居、宗教建筑、水乡建筑——&quot;中国民居建筑博物馆&quot;。。\u003c/p\u003e", "c": ""}, {"n": "聊城东昌古城", "s": "聊城", "p": "山东", "w": "中华水上古城·凤凰城扭头门·光岳楼乾隆御题黄河以北罕见的水上府城，城中有水水中有城。以光岳楼为中心十字主街，九大街十八巷道七十二胡同。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北宋熙宁三年（1070）筑土城。明洪武五年（1372）改筑砖城，周长3.5千米（七里余），高11.7米。南东西瓮城为扭头门——南门东向似凤头、东西门南向似凤翅、北门北向似凤尾，故名&quot;凤凰城&quot;，能陷不失。明洪武七年（1374）建光岳楼（城中心更鼓楼），高33米。永乐九年（1411）会通河疏通，聊城成运河九大商埠之一，&quot;漕挽之咽喉，天都之肘腋&quot;，&quot;江北一都会&quot;——漕运繁荣400年。清乾隆御题光岳楼&quot;天下第一楼&quot;，康熙帝四次驾临，乾隆帝九次驻跸。1947年城墙城楼全部拆除。现状：城墙墙基还在（辟为环城路），护城堤残留2公里（城南龙湾至南堤口）。古城区1.17平方公里，被6.3平方公里东昌湖环抱。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e光岳楼（全国重点文保·&quot;天下第一楼&quot;）：明洪武七年（1374）建，4重檐歇山十字脊木构高33米，宋元向明清过渡典范。山陕会馆（全国重点文保）：东关古运河西岸，清乾隆八年（1743）山陕商人集资建历时66年，聊城八大会馆唯一完整。海源阁（清代四大藏书楼）：光岳楼南侧杨氏宅院，清道光二十年（1840）杨以增始建。鼎盛藏书4000余种22万余卷。运河古码头：东关大码头，明清最繁华——&quot;金太平银双街铁打的小东关&quot;。；（古镇·运河活码头）。\u003c/p\u003e", "c": ""}, {"n": "枣庄山亭翼云石头部落", "s": "翼云石头部落", "p": "山东", "w": "600年石头村·响石巷·石磨磨辣椒藏在翼云山褶子里，600年全石头村，响石巷踩上去咚咚响。", "h": "", "r": "\u003cp\u003e石屋顺着山势铺开，墙是青石垒的路是石板铺的，连屋檐下的晒粮架都是石条搭的。600年，不用泥粘干垒就稳。响石巷：踩在石板路上会&quot;咚咚&quot;响，底下是空的，以前藏粮食防土匪。石磨盘在院角转了几百年，磨齿间还嵌着玉米面的黄。后山石阶是石头凿的，每级都有浅浅的凹痕——那是挑水的扁担磨的。；（淮安古城补充）。\u003c/p\u003e", "c": ""}, {"n": "青州明府城", "s": "青州", "p": "山东", "w": "六城叠压·1605年省会史·真教寺元代三大清真寺·偶园冯家花园大禹划九州之青州，古青齐文化中心。先后建过六座古城（广县城→广固城→东阳城→南阳城→东关圩子城→满族旗城），明洪武九年前一直是山东省会。真教寺是元代三大伊斯兰教寺之一，偶园是北方少见的江南园林。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南阳城（主体）：明洪武三年（1370）改建砖城，城高12米厚6米，垛口1777个。四门：海晏（东）、阜财（南）、岱宗（西）、瞻辰（北）。清代多次重修。1972年修南环路拆南城墙。2017年国家5A级景区（免费）。\u003c/li\u003e\u003cli\u003e青州作为山东政治经济文化中心达1400多年（前106年→1376年朱元璋移治济南）。省会史1605年。\u003c/li\u003e\u003cli\u003e东门大街（始建北魏）：后司巷（金代设山东东西路统军司）、卫里巷（明初山东都指挥使司所在地）。偶园大街（主干道核心）：青石板路，牌坊林立——柱国坊、大学士坊、一门科第坊（万历冯氏家族）。昭德街（东关回族区）：真教寺就在这条街上。青州贡院：曾是山东布政司衙门。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e真教寺（国保·元代三大清真寺之一）：元大德六年（1302）元相伯颜后裔立，元代封官寺。明朱元璋题&quot;百字赞&quot;碑。熔阿拉伯与中国建筑艺术于一炉。偶园（北方少见江南园林·500年）：原为衡王府东花园，清康熙文华殿大学士冯溥告老还乡后以之为终老之所。假山分坪、峰、涧、台四组主题。海岱都会坊：四柱三门，高9.4米宽14.4米。万年桥（南阳城北门外）。衡王府石坊（明代衡王府遗存）。青州博物馆：全国县级博物馆唯一国家一级馆，有西汉广国跽坐石俑、明代状元卷、北齐壁画墓。。\u003c/p\u003e\u003cp\u003e南阳城大部分城墙（仅存1986年修复60米）。东阳城、广县城、广固城全部城墙。衡王府全套建筑（仅存石坊）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《尚书·禹贡》：&quot;海岱惟青州&quot;——渤海和泰山之间。\u003cbr\u003e▌青州导游词：&quot;2230年建城史·12年国都史（南燕慕容德·山东唯一称帝者）·1605年省会史&quot;。\u003c/p\u003e"}, {"n": "临清老城", "s": "临清", "p": "山东", "w": "钞关帝国财源·临清贡砖修北京皇城·鳌头矶像鳌头明清运河八大钞关之首，万历年间年税收8.3万两占全国四分之一——山东省全年税收才8860两。临清砖&quot;击之有声断之无孔不碱不蚀&quot;，修北京皇宫、十三陵、清东陵西陵全用它。先有临清仓后有临清城。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e元代开通会通河，临清成汶卫交汇枢纽。明宣德四年（1429）设临清钞关——全国最早的运河钞关之一。明万历年间鼎盛：年收船料商税8.3万两（全国八大钞关之首，占全国四分之一）。彼时山东省一年课税折银仅8860两。清光绪二十七年（1901）运河漕运停止，钞关署治遂废。现状：临清运河钞关是全国仅存的一处运河钞关（世界文保+国保）。中洲古城160余条明清老街巷格局依旧。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e临清运河钞关（全国唯一·世界文保·国保）：明宣德四年（1429）始建，宣德十年升户部榷税分司。建筑群自运河而西依次为河口正关→阅货厅→&quot;国计民生&quot;坊→关堞→仪门→正堂。三进院落占地4万㎡，厅堂坊舍400余间。现存两进院落80余间6000㎡。鳌头矶（国保·世界文保）：永乐十五年（1417）始建，会通河与通惠河交汇处石坝形似鳌头——两支运河四处河闸像鳌的两对足，广济桥像鳌尾。观音阁砖砌基座高5米9米见方下辟门洞。古砖陈列室收明清临清贡砖（成化至康熙年间）。舍利宝塔（国保·运河四大名塔）：万历三十九年（1611）重修，高61米九级八面砖木楼阁式，每层&quot;四明四暗四真四假&quot;，通体近乎垂直。第6层最精致，有&quot;秀聚中天&quot;匾额。临清贡砖（非遗·击之有声断之无孔不碱不蚀）：明清修北京皇宫、紫禁城墙、明十三陵、清东陵西陵绝大部分用临清砖。河隈张庄明清砖窑遗址（国保）。月径桥（国保·清顺治九年1642徽商邵以枢捐资建）：单孔拱径4.6米。临清闸（国保·元至元三十年1293建）：会通河入卫河端始船闸。。\u003c/p\u003e\u003cp\u003e明代砖城城墙。钞关部分建筑（仅存两进院落）。运河漕运盛况（粮艘麋集帆樯如林）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代大学士李东阳（过临清）：&quot;十里人家两岸分，层楼高栋入青云。官船贾舶纷纷过，击鼓鸣锣处处闻。&quot;\u003cbr\u003e▌临清当地谚语：&quot;先有临清仓，后有临清城&quot;——临清仓年储粮300万石，输京漕运占四分之三，戍仓士兵3000人。\u003c/p\u003e"}, {"n": "济宁老府城", "s": "济宁", "p": "山东", "w": "太白楼移建南城墙·竹竿巷运河江南水乡·南池杜甫游处唐代李白客居任城23年，贺兰氏酒楼因他而易名太白酒楼。明洪武二十四年将楼移筑于南城墙之上——谪仙已逝何需俗醪相佐。竹竿巷是运河滋养的江南水乡风味街巷，鼎盛时江南竹筏在此上岸。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐：任城县城，南北二里东西三里，长方形，单城门。南门即今南门。金天德二年（1150）济州迁治任城。元建济州城，土城。明洪武三年（1370）济宁左卫指挥使狄崇重建易以砖，周九里三十步，大体正方形，四门均双城门（城门+月城门）。四门匾题：南门宣阜门&quot;野入青徐&quot;、北门宗翰门&quot;云连海岱&quot;、东门绥华门&quot;邹鲁接壤&quot;、西门萃成门&quot;获麟古道&quot;。还有外城土圩、外圩门、外濠。现状：明清砖城全毁，太白楼建在仅存的南城墙之上（重建后还在原址）。竹竿巷、清平巷街巷格局保留。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e太白楼（国保）：唐贺兰氏酒楼，因李白改名太白酒楼。明洪武二十四年移筑于三丈八尺高的南城墙之上，剔去&quot;酒&quot;字仅留&quot;太白&quot;二字符——谪仙已逝何需俗醪相佐。现存明清建筑，坐北朝南十间两层重檐歇山砖木结构，高20余米。楼内一层设&quot;诗仙太白、诗韵齐鲁&quot;专题展，二层有&quot;诗酒英豪&quot;石匾、李白手书&quot;壮观&quot;斗字方碑、乾隆御笔《登太白楼》诗碑。竹竿巷历史文化街区（0.26平方公里）：运河江南水乡风格，老篾匠弓身剖竹，明清时&quot;货栈鳞次人声鼎沸&quot;。与纸坊街、纸店街、小闸瓮城、清平巷五条街巷曲尺相连。顺河东大寺（AAA级）：运河边，济宁回族聚居地核心。南池公园（济宁八景之一）：古称王母阁湖，杜甫有诗&quot;秋水通沟洫，城隅进小船&quot;。铁塔寺：济宁老地标。。\u003c/p\u003e\u003cp\u003e明代砖城四门（宣阜/宗翰/绥华/萃成，均双城门）。外城土圩、外圩门、外濠。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《济宁府志》（明万历）：&quot;周九里三十步，大体正方形，四门均系双城门，城上有城楼、炮台、女墙、垛口，下有护城河，四门外各有吊桥。&quot;\u003cbr\u003e▌济宁老篾匠（世代居竹竿巷）：&quot;我家祖上就在这剖竹编筐，运河没水的年头还能靠手艺活，水来了就泊船卸货，日子就这么晃过去了。&quot;\u003c/p\u003e"}, {"n": "邹城老县城", "s": "邹城", "p": "山东", "w": "亚圣故里·孟母三迁·明代16座牌坊全毁·鱼骨型街巷孟子故里，孟母三迁择邻、断织喻学的故事发源地。明代县城立了16座牌坊（攀桂坊、进士坊、青云坊、登云坊、世科坊、双桂坊、澄清坊、宣化坊、城隍坊、亚圣坊……），凡考取举人者皆立坊表彰——把学业推举到至高无上的境地。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明初土城。明正德元年（1506）重筑。明万历五年（1577）知县冯中州改砌砖城，耗银1000两谷900石。方形，周长4里80步（945丈），高1丈6尺5寸，垛口1528个。四门：瞻岳（东）、近鲁（北）、襟济（西）、崇教（南）。城外护城河深1丈宽7尺，引因利渠水注入，四门石桥横跨。明末天启二年（1622）白莲教起义，部分城墙被拆。清顺治五年（1648）修复，改城垛为375个。清康熙七年（1688）地震，西南城墙坍塌。1950年左右，古城墙最终拆除。现状：城墙全毁。亚圣庙街历史文化街区（鱼骨型格局）、孟母断机处遗址、孟庙孟府完整保存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e孟庙（亚圣庙·国保）：北宋宣和三年（1121）始建，现存为明清建筑。有亚圣殿、启圣殿、孟母殿、致严堂、祧主祠、东西庑、知言门、养气门，57株古树（侧柏、桧柏、国槐，树龄多在800年以上）。孟府（国保）：孟子嫡裔世袭&quot;翰林院五经博士&quot;居所，前后七进院落，有亚圣木坊、大堂、世恩堂、赐书楼、见山堂、孟林门坊。孟母断机处遗址（省保）：明代立&quot;孟母断机处&quot;&quot;子思子作中庸处&quot;两通石碑，三迁故址牌坊。清末老照片里牌坊静静矗立，现在还在。亚圣庙街历史文化街区：鱼骨型街巷格局（主街为骨架两侧巷道枝状延伸），有亚圣街、过街棚街、塘子街、东马道、西马道、人祖庙街、井胡同、杜家胡同、小寺街、韩家胡同、武学胡同。明代16座牌坊全毁——三迁坊（城南门外孟母三迁）、断机堂（孟母断织）、攀桂坊（举人冯瑾）、进士坊（冯瑾次年进士）、青云坊、登云坊、世科坊、双桂坊（兄弟同中举）、澄清坊（县署）、宣化坊（县署）、城隍坊、亚圣坊（南门外孟庙界首）——每一座牌坊都是一段&quot;读书立世&quot;的宣言。；明代砖城四门（瞻岳/近鲁/襟济/崇教）。护城河（填为街道）。明代16座牌坊（全毁）。县衙全套建筑。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代嘉靖《邹县地理志》：&quot;地方二百余里，纵广七十里，横一百五十里，东南至滕，西至鲁齐，北抵泗岱。&quot;\u003cbr\u003e▌《孟母戒子》（西汉韩婴）：&quot;孟子辍然中止，乃复进。其母引刀裂其织，曰：此织断能复续乎？&quot;——孟母剪断正在织的整匹锦缎，教育孟子半途废学就像剪断的织锦再难续接。\u003cbr\u003e▌邹城老居民：&quot;老照片里三迁牌坊还在，旁边两通石碑、三孔因利桥。我妈说她小时候还在牌坊下留过影，现在只剩石碑了。&quot;\u003c/p\u003e"}, {"n": "菏泽老府城·曹州", "s": "菏泽", "p": "山东", "w": "七十二街七十二井·七纵七横棋盘·城内叠压五代古城·外圆内方铜钱城明正统十一年（1446）知州范希正始建，七纵七横棋盘格局至今完好。明清形成&quot;七十二条街七十二眼井七十二个坑塘&quot;古城肌理。老城区地下8米叠压宋金元明清五代古城——金元时期主干道和今天的广福大街、东方红大街完全重合，800年未变。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明正统十一年（1446）原曹县知县范希正迁任曹州知州，利用旧州址始筑城池。至明正德七年（1512）告成，历时66年。城周12华里，城墙高2.5丈，堞高5尺，趾宽3丈，池深1.5丈广4丈。四门：东&quot;双河&quot;、西&quot;凤山&quot;、南&quot;南华&quot;、北&quot;济阴&quot;。城门额嵌石为匾，上设城楼（东&quot;青波旭日&quot;、南&quot;风入虞弦&quot;、西&quot;凤台霜晓&quot;、北&quot;云里蓬莱&quot;）。外圆内方铜钱形制——方形城墙圆形护城河。清乾隆三十二年（1767）改土墙为砖墙，周长1872丈，设炮台26座、水簸箕84道、门楼4座、垛口3134堵。1938-1948年十年间两次重修三次拆除。1960年代初城墙遗址上植树，现已成林。现状：城墙全毁，七纵七横棋盘格局完好，东方红大街（明清东西中轴线）是老菏泽人叫的&quot;菏泽第一街&quot;。\u003c/li\u003e\u003cli\u003e明清棋盘格局完整保留至今：\u003c/li\u003e\u003cli\u003e东方红大街（明东西轴） 还在！\u003c/li\u003e\u003cli\u003e交叉点叫&quot;隅首&quot;，共23个（钟楼隅首、鼓楼隅首、石碑隅首、石人隅首、铁货隅首、油坊隅首、潘隅首、宋隅首……）——以隅首为界，街分数段各段长短大体相等，通名叫巷（全国独有）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e老城地下五代古城叠压：宋、金、元、明、清叠压8米深。金元时期主干道和今天的广福大街、东方红大街完全重合，800年未变。七十二井（部分复原）：明清曹州城水质甘醇的七十二个水井，藏在老街深处。青年湖（原七十二坑塘之一）：2025年修整为城市滨湖公园，五拱环洞泰宁桥。1446街区（老城曹州文旅区）：2022年开放，以范希正建城之年命名。海棠寺街、民权街、太平街、慎思园（范希正纪念园）、永安塔（七层八角四门56米高）。曹州牡丹园：曹州牡丹始于隋盛于唐甲天下于明，现有1200余种。。\u003c/p\u003e\u003cp\u003e明代砖城城墙+四门城楼（全毁）。七十二座牌坊（全毁）。明正统八年郭氏牌坊（东方红大街中段，1958年老档案照片存）。钟鼓楼（1950年代拆除）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《菏泽市志·城垣变化》：&quot;七纵七横，相互交叉，状若棋盘。交叉点称隅首，共23个。以隅首为界，街分数段，各段长短大体相等，通名叫巷。&quot;——这种街巷分段命名法全国独有。\u003cbr\u003e▌菏泽老居民（世代居曹州路）：&quot;我家就在考棚街边上，爷爷说他小时候听老人讲——地下还有一层城，老早战乱黄河决口淹的。后来挖地基挖出宋金元的砖头瓦块，才知是真的。&quot;\u003cbr\u003e▌菏泽歌谣（世代口传）：&quot;七十二条街，七十二眼井，七十二个牌坊，七十二个坑，七十二地煞藏其中。&quot;——72是吉利数，应地煞星驱魔禳灾护祐百姓。\u003cbr\u003e（已固化18座旧县城+6古镇·待下一批扩充）\u003c/p\u003e"}, {"n": "郯城老县城·碌碡城", "s": "郯城", "p": "山东", "w": "元末碌碡排垫筑城·郯国故城·少昊鸟名官·马陵之战元末沂州守御王信在郯城筑城时，正值隆冬天寒地冻采石困难，为抢工期从民间大量征用碌碡（石磙）排垫城墙基，&quot;累土而立&quot;版筑而成——所以郯城古城又叫&quot;碌碡城&quot;。郯国故城是西周至战国郯国都城，少昊后裔以鸟名官的史实发生地。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e元末沂州守御王信在郯城河（今郯子湖）以南筑新城，用碌碡排垫墙基，累土版筑——所以叫&quot;碌碡城&quot;。周五里八十步，高二丈二尺，厚八尺。设三门（郯城自古无东门）：南通淮、西瞻鲁、北拱极。明正德五年知县黄琮修北门建楼。嘉靖二十一年修南门西门建楼。万历二十三年（1595）始甃以砖（第一次外包砖）。清康熙七年（1668）郯城8.5级大地震，城墙垛堞都轰然坍塌。1958年拆城墙时挖出大批砌排整齐的碌碡——每个长69cm直径51cm，青石红石有辋无辋皆有（实物现存郯城一中老城墙边）。现状：郯国故城遗址（国保·周代）西墙北墙局部保存，残墙高4米。元明清碌碡城城墙全毁。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e郯国故城遗址（国保·西周至战国）：西周郯国都城，少昊后裔以鸟为图腾。城址在今县城北侧100米，与今城仅隔一条护城河。西墙北墙局部保存，墙基宽40米顶宽15米残墙高4米，周长4670米。《左传·昭公十七年》（前525）记载郯子朝鲁，孔子&quot;见于郯子而学之&quot;——少昊氏鸟名官典故发生地。马陵古战场（国保）：马陵之战发生地，战国齐魏马陵之战（前342）。唐代于公墓、东海孝妇冢。明代县衙（部分建筑残存）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《乾隆郯城县志》：&quot;元守御王信筑城，时值隆冬，大量征用碌碡排垫墙基，累土版筑，故又称碌碡城。&quot;\u003cbr\u003e▌郯城一中老教师（1958年亲历拆城）：&quot;我亲眼看见挖出来的碌碡——砌得整整齐齐，像一排一排的圆石头柱子，每个都有半人高，青石的红石头都有。&quot;\u003cbr\u003e▌《左传·昭公十七年》：&quot;郯子来朝，公与之宴。昭子问焉，曰：&#x27;少昊氏鸟名官，何故也？&#x27;郯子曰：&#x27;吾祖也，我知之。&#x27;&quot;——前525年郯子到鲁国朝见，讲述少昊氏以鸟名官的历史，孔子闻之特意见郯子而学之。\u003cbr\u003e（T3批次6城已固化·累计24座旧县城+6古镇）\u003c/p\u003e"}, {"n": "蒙阴老县城·蒙恬故里", "s": "蒙阴", "p": "山东", "w": "秦将蒙恬发族地·汉蒙城晋蒙城双遗址·蒙山鬼谷子讲堂蒙恬故里经县史志办实地考证确认为蒙阴县联城镇边家城子村（汉蒙城旧址），蒙氏祖谱记载&quot;始祖蒙山公封东蒙主安居蒙阴县，此地为蒙氏发祥圣地&quot;。蒙阴有汉蒙城+晋蒙城双遗址，汉蒙城遗址还能摸到四角大土堆城墙。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉初置蒙阴县（前205年），县治置于联城镇城子村一带（汉蒙城）。西晋公家城子村（晋蒙城），城址四角有四个大土堆，城墙和护城河沟清晰可见。明洪武三十年（1397）百户龙胜重修县城，石城周围一里零二百步，连雉口高一丈六尺。三座城门：东望海、西瞻岱、南文昌。1947年蒙阴遭强烈地震，城垣倒塌。1950年代城墙拆除。现状：汉蒙城遗址（边家城子村，角堆尚存），晋蒙城遗址（公家城子村），蒙恬故里联城镇。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e汉蒙城遗址·蒙恬故里（联城镇边家城子村东北）：西汉初置蒙阴县治所，考古发现众多古砖瓦和大段墙基。颛臾庙（明永乐二年1404年建，实为蒙氏宗祠，颛臾王葬于蒙阴守墓祭祀）。千年黄连木树（三人合抱粗）仍存。晋蒙城遗址（公家城子村）：四角四个大土堆（城墙残段），护城河沟清晰可见。蒙山国家森林公园（5A·亚岱）：主峰海拔1156米山东第二高峰，孔子曾登蒙山望鲁。鬼谷子讲堂遗址（云蒙峰下峪子里），传说孙膑庞涓苏秦张仪在此学艺。蒙恬造笔传说：蒙恬始作笔，鹿毫竹管，毛笔之父。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《沂州府志》：&quot;蒙阴故城，在县西南十五里，汉县，属泰山郡。&quot;\u003cbr\u003e▌蒙氏祖谱：&quot;始祖蒙山公，周成王在位时，封蒙山公为东蒙主，安居蒙阴县，此地为蒙氏发祥圣地也。&quot;\u003cbr\u003e▌蒙阴县史志办考证（2018）：&quot;蒙恬故里可断定在距蒙阴县城西南7.5公里处的边家城子村东北约一公里的汉蒙阴县城旧址上——颛臾王庙即蒙氏宗祠，千年黄连木树龄与周成王封颛臾时间吻合。&quot;\u003c/p\u003e"}, {"n": "兰陵古城·兰陵镇", "s": "兰陵", "p": "山东", "w": "荀子两任兰陵令·兰陵美酒3000年·兰陵王高长恭封地山东境内最早设立的县治单位（近2400年历史）。荀子两任兰陵令18年，辞官后定居终老于此——培养出李斯韩非浮丘伯，史学家刘向说&quot;兰陵多学盖以荀卿也&quot;。兰陵美酒3000年，1995年徐州狮子山楚王墓出土沉埋2148年的兰陵贡酒——泥封印有&quot;兰陵贡酒&quot;&quot;兰陵之印&quot;戳记，打开封泥后酒香溢出，令考古专家惊叹。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周周公兼治七十二国，在兰陵筑土城，大块红石做地基夯土做墙，&quot;土围子&quot;。北齐兰陵王高长恭封地在兰陵，下令扩建城池——新城围城总长12华里，东西2.5华里南北3.5华里长方形。兰陵王府在土围墙北门外300米，门正对土围子北门。唐盛世年间酒业兴起，扩建外城（楚币晒金滩遗址在温岭南头）。1917-1920年民国年间在内城墙原址用土修复——垫一层碌碡压一层，用了三年。1950年代城墙大部拆除。现状：内城遗址东西宽885米×南北长1980米=175万㎡，墙基宽约30米，南部残存几米残墙。荀子墓在兰陵镇东南1.5公里（省保）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e荀子墓（省保）：黄土堆积，东西30米南北20米封土高3米。1966-1976年间遭破坏墓冢挖深呈M状，1977年立省保标志碑。兰陵古城墙残段（兰陵镇）：墙基宽30米，南部残存几米残墙。兰陵美酒：1995年徐州狮子山楚王墓出土沉埋2148年的兰陵贡酒（泥封印&quot;兰陵贡酒&quot;戳记），经鉴定与今日兰陵美酒同为一宗。北魏贾思勰《齐民要术》载兰陵美酒酿造工艺，唐时宫廷御用。1915年巴拿马国际博览会获金牌。四城门匾额（北齐兰陵王所建城门）：东门&quot;东海镜清&quot;、西门&quot;逵达邹鲁&quot;、南门&quot;衢通徐淮&quot;、北门&quot;文峰映秀&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李白（唐开元二十八年）：&quot;兰陵美酒郁金香，玉碗盛来琥珀光。但使主人能醉客，不知何处是他乡。&quot;——千古绝句，对兰陵美酒从色香味情进行综合鉴赏。\u003cbr\u003e▌《金瓶梅》作者兰陵笑笑生：据专家考证为兰陵人——兰陵千年古镇、兰陵美酒、荀子文化、《金瓶梅》文化四大品牌世界闻名。\u003cbr\u003e▌徐州狮子山楚王墓考古队（1995年）：&quot;兰陵美酒陶制球形缸沉埋2148年，泥封上印有&#x27;兰陵贡酒&#x27;&#x27;兰陵之印&#x27;戳记——打开后一股浓郁酒香溢出，令在场考古专家惊叹不已。&quot;\u003cbr\u003e（T4批次6城已固化·累计30座旧县城+6古镇·v8 行数字符待追加验证）\u003cbr\u003e古今叠影稿（v8·30座旧县城+6古镇）完。\u003c/p\u003e"}, {"n": "定陶老县城·陶丘", "s": "定陶", "p": "山东", "w": "天下之中商圣范蠡·刘邦登基氾水之阳·黄肠题凑260万字司马迁说&quot;陶天下之中，诸侯四通，货物所交易也&quot;——范蠡助勾践灭吴后辗转到此定居，十九年间三致千金，被后世尊为商圣。刘邦公元前202年在这里登基称帝（氾水之阳·官堌堆）——大汉王朝四百年从此开始。定陶王陵M2汉墓是迄今出土单体墓葬文字量最大的——黄肠题凑墓室1800方柏木+37000块文字陶砖，出土墨书、朱书、刻印、戳印文字逾260万字，堪比一座汉代图书馆。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e尧舜以陶丘为都（陶唐氏）。西周初年周武王封其弟振铎为曹伯，建曹国，都陶丘，历26君558年。春秋宋灭曹，设陶郡，治陶城。秦始置定陶县（前221）。自春秋末至西汉400多年，定陶一直是中原水陆交通中心和商贸都会，享有&quot;天下之中&quot;美誉。元文宗至顺二年（1331）黄水淹没定陶故城。明洪武四年（1371）迁县城于今址。现状：官堌堆（刘邦登基处）、定陶王陵、仿山曹国古墓群、范蠡墓等遗存尚存，老县城明清街巷格局依稀可辨。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e官堌堆（受命坛·刘邦登基处·省保）：仿山镇姜楼村西南800米商周堌堆遗址，高近9米。《史记·高祖本纪》载&quot;甲午，乃即皇帝位氾水之阳&quot;即此。定陶县政府立&quot;大汉之源&quot;石碑。定陶王陵M2汉墓（世界最大黄肠题凑·国保）：发掘于马集镇，墓室木质构件1800方（柏木黄心），榫卯扣合。墓室四周文字陶砖37000余块，铺底砖43000余块。出土黄肠木及陶砖上墨书、朱书、刻印、戳印文字逾260万字——单体墓葬出土文字之最，汉代书法史新资料。仿山古墓群（省级·曹国25代国君墓）：仿山镇，曹国肇建之君曹叔振铎到末代国君共25君墓在此。&quot;天下曹姓出于陶&quot;——很多曹姓人来此拜祖。范蠡墓（陶朱公墓）：定陶镇西北，《史记·货殖列传》载范蠡&quot;止于陶，卒老死于陶&quot;，后世在此建范蠡祠、范蠡湖、马场（传说范蠡养马处）。陶朱公传说为国家级非遗。梁王台（彭越点将台）：定陶镇东北3公里，汉初梁王彭越在此点将。周围低洼潮湿，早晨远望台上白气茫茫。十里铺遗址（龙山文化·2015十大考古新发现）：定陶区西南，尧、舜时期陶国遗存。陶丘（古陶国遗址）：定陶县城西南，马集镇费庄村北200米。《说文》&quot;陶再成丘也，在济阴&quot;——双层土丘形似陶灶。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·货殖列传》：&quot;朱公以为陶天下之中，诸侯四通，货物所交易也。乃治产积居，与时逐而不责于人。故善治生者，能择人而任时。十九年之中三致千金，再分散与贫交疏昆弟。&quot;\u003cbr\u003e▌《定陶县志》（清）：&quot;官堌堆在城西北十里许，汉高帝即位于氾水之阳即此，高阜犹存，今名官堌堆。&quot;\u003cbr\u003e▌定陶文保干部李娜：&quot;260万字——你想象一下，一座墓里埋了一座图书馆。黄肠木上的墨书是工匠写的&#x27;某年某月某日造&#x27;，陶砖上有的写着产地&#x27;济阴郡定陶县昌邑乡&#x27;，比史书还准。&quot;\u003cbr\u003e▌仿山守墓老人曹大爷：&quot;每天都有全国各地姓曹的来上香——我守了40年，见过最远的是马来西亚来的。都说来认祖，说&#x27;天下曹姓从定陶来&#x27;。&quot;\u003c/p\u003e"}, {"n": "巨野老县城·麟州", "s": "巨野", "p": "山东", "w": "西狩获麟台·永丰塔宋建·文庙大成殿明·金山秦王避暑洞春秋鲁哀公十四年（前481）&quot;西狩获麟&quot;——麒麟被埋的地方就是麒麟冢/麒麟台。永丰塔（宋建）立在县城东南角1000多年了——塔因有&quot;永丰&quot;之名而叫&quot;永丰塔&quot;，塔下有永丰泉，泉水能酿酒。文庙大成殿是菏泽地区唯一保存较好的明代祭孔建筑。金山秦王避暑洞是昌邑王刘贺的废崖墓（刘贺就是那个当过27天皇帝就被废的人），金朝大定三年皇帝赐封&quot;大明禅院&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉始建县城（周九里）。唐高祖武德四年（621）设麟州于巨野，因&quot;西狩获麟&quot;而名。元文宗至顺元年（1330）黄水注巨，城址淹没，县治一度迁城北邢家务。明洪武七年（1374）黄河义决，巨野水深四丈，塔没二级，房屋殆尽。明武宗正德七年（1512）因农民起义军攻克数城，知县余守观惧故城空旷，急调民工改建——拆城西、北两隅，保留东、南两隅，新城周长1113丈（约3公里），加瓮城。明熹宗天启二年（1622）地震+起义军围攻，抢修城防。1946年元旦，巨野旧城墙开始被拆除，建起环城路。现状：永丰塔、文庙大成殿、麒麟台、昌邑故城址、金山秦王避暑洞尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e永丰塔（北宋·县城东南角）：建于宋代，高约32米，八角十三层楼阁式砖塔。因塔下有永丰泉（泉水清澈能酿酒），故名&quot;永丰塔&quot;。金大定十三年（1173）重修。巨野老八景&quot;塔立中流&quot;即此——黄河故道曾流至塔下。巨野文庙大成殿（省保·明代·菏泽唯一保存较好明代祭孔建筑）：坐北朝南，台基高1.4米，东西长22.3米，南北宽14.25米，通高13.7米。面阔5间18米，进深3间，重檐九脊歇山式建筑，绿瓦朱甍，斗拱盘错，雕梁画栋。巨野县衙曾把文庙大成殿作为&quot;学署&quot;，至今殿内仍有清乾隆年间匾额数方。麒麟台/麒麟冢（春秋·&quot;西狩获麟&quot;埋麟处）：麒麟镇陈胡庄村东750米。原遗址东西长48米、南北宽20米，台高约4米。明嘉靖十四年（1535）进士张九叙斗书&quot;麒麟冢&quot;碑，明天启年立&quot;重修瑞麟寺功德碑&quot;，均存。巨野麒麟传说为国家级非遗。昌邑故城址（国保·西汉昌邑国都城）：巨野县城南昌邑集一带，西汉昌邑国（刘贺为昌邑王时）都于此。地面仅存夯土城墙残段。金山秦王避暑洞（昌邑王刘贺废崖墓·金赐&quot;大明禅院&quot;）：巨野县城东南22公里金山景区内。西汉昌邑王刘贺被废后，回昌邑为王，死后葬于此废崖墓。金大定三年皇帝赐封该洞为大明禅院。洞内有历代文人墨宝石刻。蚩尤墓：巨野县城东北固堆庙村前，相传为上古蚩尤葬处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《巨野县志》（清道光）：&quot;鲁哀公十四年春，西狩获麟。孔子曰&#x27;孰为来哉，孰为来哉&#x27;，反袂拭面，涕沾袍……遂绝笔于获麟。&quot;——《春秋》写到这里就停笔了，所以又叫《麟经》。\u003cbr\u003e▌巨野文庙管理员张老师：&quot;大成殿的斗拱是真家伙——每一组都有名字：一跳、二跳、耍头、令拱……明式做法，没有任何一根钉子，全靠榫卯咬合。我带过很多建筑系学生来量，说这在菏泽地区是独一份。&quot;\u003cbr\u003e▌金山景区导游小刘：&quot;刘贺当过27天皇帝就被霍光废了，回昌邑继续当王。他怕死后被盗，在金山的悬崖上凿了个墓——就是这个避暑洞。为什么叫秦王避暑？因为金大定三年皇帝赐封后，老百姓觉得&#x27;大明禅院&#x27;不如&#x27;秦王避暑&#x27;好记，就这么叫下来了。&quot;\u003cbr\u003e▌永丰塔下卖酒的李老头：&quot;我家酒厂在永丰泉旁边50年了——这泉水酿的酒，喝了不头疼。老辈人说塔下有泉，泉下有龙，龙吐水出来酿酒——半真半假，但这水确实好。&quot;\u003c/p\u003e"}, {"n": "单县老县城·牌坊城", "s": "单县", "p": "山东", "w": "百狮坊天下第一坊·百寿坊五爪真龙·朱家大院百亩20院宋至清末建坊百余座，人称&quot;牌坊城&quot;——现在全国牌坊城的牌子归歙县归德牌坊群，但单县的两座国保石坊（百狮坊+百寿坊）相隔不足百米，都是乾隆年间造的，工艺上各玩各的绝活：百狮坊在八根夹柱上雕了百只石狮子（每个大狮身上攀着五个小狮），百寿坊在额枋上刻了百个不同篆体寿字，而且它还敢雕五爪真龙（四爪为蟒五爪为龙——民间石坊雕五爪龙，规格顶破天）。朱家大院占地百亩20多处院落，是明清鲁西南最大地主宅院之一，现在仅存两处楼院。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明代始建县城，万历年间以砖包城。清代屡修屡圮。乾隆三十年（1765）立百寿坊（朱家节孝坊）。乾隆四十三年（1778）立百狮坊（张家节孝坊，比百寿坊晚13年，两坊相对成&quot;姊妹坊&quot;）。1950年代城墙大部拆除。2013年百狮坊+百寿坊列为第七批全国重点文物保护单位。现状：两坊完整，朱家楼院（省保）尚存两处楼院，老县城街巷格局依稀。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e百狮坊（国保·清乾隆43年·1778·天下第一坊）：位于牌坊街中段，高14米，宽9米，四柱五楼式。八根夹柱各雕大狮及小狮（每大狮身上攀5小狮，母狮身上有的被按在足下、有的亲吻小腿、有的挠痒自娱）。正间额枋雕三层串枝牡丹，次间额枋雕龙凤。雕工&quot;每两石粉可换一两白银&quot;——造到最后张氏家产耗尽。传说石匠被坊主毒杀（怕再有富户造坊超过它）。百寿坊（国保·清乾隆30年·1765·天下第一龙坊）：胜利北街，高13米，宽8米，四柱三间五楼式。前后正间枋心浮雕百个不同篆体&quot;寿&quot;字（百寿坊得名）。坊座雕8头雄狮、8条出水蛟龙绕柱回舞。关键——绕柱龙是五爪真龙（民间石坊绝无仅有），因坊主朱叔琪娶了曲阜孔氏（衍圣公之族），孔氏上报中枢后，皇帝特许雕真龙。正上匾&quot;敕褒节孝&quot;，次匾有乾隆四子永珹赞颂孔氏的两首诗。朱家楼院（省保·明末清初·占地百亩20院）：朱氏先祖明初迁居，三世朱昂始建宅院，历经十代人改扩建，清道光年间鼎盛——连片院落占老县城近五分之一面积，20多处院落、200余间房屋。现存东西两院，磨砖合瓦，檐下雀替雕花，东蝴蝶厅花鸟盘龙栩栩如生，闺房百龙顶子床圆雕透雕多种工艺。2011年改为单县民俗博物馆。单县羊肉汤地标：老县城内数十家羊肉汤馆——&quot;单县羊肉汤&quot;是山东非遗，单县籍武将在京任职时，羊肉汤被带入宫廷，获&quot;中华第一汤&quot;美誉。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《单县志》（清道光）：&quot;单县建坊百余座，宋至清末皆有之。上世纪五十年代初尚存34座。百狮坊、百寿坊，一雕百狮一雕百寿，相距不足百米，为天下奇观。&quot;\u003cbr\u003e▌百狮坊老石匠孙师傅（78岁，家传石雕6代）：&quot;造百狮坊时没有吊车，是用堆土法——修多高堆多高的土山，把石料滚上去，修完再把土清走。造石狮子最难的是那5个小狮，每个都不一样。我爹说，他年轻时还见过造坊的老工匠后代，人家说&#x27;每雕完一只小狮，就要在石头上刻一个小记号——不然雕了50只以后自己就记混了&#x27;。&quot;\u003cbr\u003e▌单县老教师郭敏：&quot;我小时候从牌坊底下钻过去，百狮坊的石狮爪子上还挂着红布条——听老辈说，清朝时有小孩从石狮上掉下来摔伤，后来就不让爬了。百寿坊的寿字我数过，真有100个，每个都不一样——有钟鼎文、石鼓文、小篆、大篆，像是把一本篆书字典都刻上去了。&quot;\u003cbr\u003e▌朱家大院看门大爷：&quot;原来的朱家大院，从牌坊街到东关，占了县城一半地。我小时候听老辈说朱家是单县八大家之首，&#x27;出城巡游数百里，车不轧外姓田，靴不沾他姓泥&#x27;。现在只剩这两处楼院了——20多院剩2院，我守了10年，看着它从杂草堆变成博物馆。&quot;\u003c/p\u003e"}, {"n": "金乡老县城·有缗国", "s": "金乡", "p": "山东", "w": "大禹轴心方国·羊山汉墓群2万座·文庙泮池还在·鲁邑雄镇夏代就有缗氏是大禹最信任的轴心方国——有缗国故城遗址缗城堌堆还在（卜集镇东门屯村）。羊山周围分布着2万多座汉墓，是山东境内最大的汉墓群之一。明万历年间砖砌城垣曾号称&quot;鲁邑雄镇&quot;，文庙格局完整——大成殿、泮池、棂星门、青云桥、千古道源坊沿中轴线排开，至今格局犹在。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏代有缗国故城（卜集镇缗城堌堆），龙山文化→商→周→汉→唐文化层层叠压。秦置东缗县，治所在今嘉祥阿城铺村（旧金乡故城）。西晋泰始元年（265）金乡县治从阿城移至今金乡县城。明弘治十六年（1503）修县城，周长七里三十步，根阔一丈七尺，顶阔五尺，四门：东作/西成/南薰/北拱。明万历六年（1578-七年1579）大修砖城——烧砖百余万块，城垣增阔增高院增六尺，四门外加瓮城。明天启二年（1622）地震+民变围攻，抢修城防。1940年代县城砖石结构完整，西门外十字大街（清真街、南店子街）最繁华。1947年西、北、东门被土石堵塞，仅南门放行。1950年代城墙拆除。现状：缗城堌堆、羊山汉墓群、文峰塔、文庙大成殿尚存，仓房街、东秦街等传统街巷格局可辨。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e缗城堌堆（有缗国故城·省保）：卜集镇东门屯村，夏商周汉唐七层文化叠压的堌堆型古城址——大汶口→龙山→商→周→汉→唐，考古出土陶鼎、鬲、豆、罐、五铢钱、筒瓦板瓦。有缗氏是大禹治水后最受信任的轴心方国——夏王相的妻子后缗就来自有缗国。羊山汉墓群（山东最大汉墓群之一·省保）：羊山镇周围2万多座汉墓，包括葛山汉墓群、石马群、明代郭家老林石刻（石马、石羊、石翁仲）。郭东藩墓神道石刻&quot;线条流畅造型大气&quot;。文峰塔（县保）：县城内奎星湖旁，宋代始建，明万历重修，高约30米，八角七层楼阁式砖塔，是金乡县城千年地标。金乡文庙（省保·格局完整）：县城中心，唐始建，宋、金、元、明、清屡修。现仅存大成殿、东西庑、戟门、泮池、棂星门、青云桥、千古道源坊、地灵人杰坊。文庙格局完全保留——沿中轴线排列，东西各有明伦堂、启圣祠、文昌祠、名宦祠、乡贤祠。仓房街、东秦街（明清古街巷）：金乡街道内保留的传统街巷，青石板路，两侧民国时期商铺格局尚存。金谷（中华四大名米之一）：马庙镇金谷为康熙年间贡米，&quot;齐头占金谷&quot;——穗子齐整整地占满谷壳，米粒圆润。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《金乡县志》（清康熙）：&quot;明万历六年修城，计地输柴烧砖百余万块，自二月讫于次年八月。城垣加阔，马车可并轨；女墙敌楼森然壮观，鲁邑雄镇。&quot;\u003cbr\u003e▌缗城堌堆考古队：&quot;堌堆高约10米，夯土层清晰可辨。在堌堆下1.5米处发现西周陶鬲残片——这说明夏代有缗国可能就建在堌堆之上，后来逐层叠加。当地人说&#x27;这堆土比县城还老&#x27;——确实，老了2000年。&quot;\u003cbr\u003e▌金乡文庙管理员老李：&quot;文庙大成殿是明代原物——梁上墨书&#x27;万历八年重修&#x27;清晰可见。泮池里种着荷花，每逢六月满池香。青云桥是明代原桥，桥面石头被踩得发亮——500年的脚步声都留在上面了。&quot;\u003c/p\u003e"}, {"n": "嘉祥老县城·曾子故里·武氏祠汉画像石", "s": "嘉祥", "p": "山东", "w": "南武城夯土还在·曾翰博府皇帝御赐匾额·曾子琴堂琴台坑还能摸明嘉靖皇帝经过7朝89年考证认定曾子故里在嘉祥——正统→景泰→天顺→成化→弘治→正德→嘉靖，最后下旨授曾子59代孙曾质粹翰林院五经博士，世世承袭，跟颜孟两家同等待遇。武氏祠汉画像石是全国第一批全国重点文物保护单位（1961年，国1级），东汉桓灵年间武氏家族墓群石刻，46块画像石内容涵盖帝王圣贤、孔门弟子、神话仙人、忠孝节义，是汉代社会的&quot;百科全书&quot;，有文字榜题——&quot;武梁从事&quot;、&quot;武开明郡丞&quot;、&quot;武班敦煌长史&quot;、&quot;武荣执金吾丞&quot;，连汉代人看了都说好。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e金皇统七年（1147）设嘉祥县，以山口镇为县城。金大定十五年（1175）再徙萌山之阳（今嘉祥县城址）。明正统十年（1445）重建曾子庙（南武山南麓）。明成化初，山东守臣上言：嘉祥南武山西南元寨山东麓有渔者陷入一穴中，得见悬棺，前有石碣曰&quot;曾参之墓&quot;——成化帝下旨修治。明正德二年（1507-九年1514），孝宗/武宗皇帝下诏扩修曾庙如颜孟庙制，历时7年。明嘉靖十八年（1539）授曾子59代孙曾质粹翰林院五经博士，世世承袭。清代屡修。1950年代城墙拆除。现状：曾翰博府、曾子琴堂、武氏祠汉画像石、南武城遗址夯土残垣尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e武氏祠汉画像石（国保·1961年国1级·东汉桓灵年间·中国最古老的汉代石刻艺术瑰宝）：纸坊镇武翟山村北，东汉武氏家族墓地石刻——武梁、武开明、武班、武荣兄弟四人的宗族墓。46块画像石+2块汉碑+1对石狮+1对石阙。内容涵盖：帝王圣贤（神农/黄帝/尧舜禹）、孔门弟子（孔子见老子/子路/颜回）、历史故事（荆轲刺秦王/完璧归赵）、神话仙人（西王母/玉兔捣药/雷公电母）、忠孝节义（荆轲/专诸/聂政/孝女曹娥）。刻法为&quot;减地平面线刻&quot;——物像外留有细密平行的凿纹，凝重醒目。一对石狮昂首扭颈张口怒目——中国现存最早的石狮。曾子庙/曾庙（省保·明正德重修·三进院落·70余楹建筑）：南武山南麓阿城铺村西北，始建于周考王十五年（前425）。明正德重修后规模如颜孟庙——坐北朝南，红墙长方形（南北230米×东西120米=27600平方米）。三路中轴线：中路宗圣殿（面阔七间，34米宽），清世宗亲书&quot;道传一贯&quot;巨匾；东路三省堂（纪念&quot;吾日三省吾身&quot;）；西路莱芜侯祠（曾子父曾点）。庙内古柏参天，碑碣林立。曾翰博府（曾氏翰林院五经博士府·皇帝御赐·清光绪16年重修·10余亩）：嘉祥县城南隅，北面隔街面对原县衙。占地10余亩，大堂五间，中悬清世宗御赐曾尚溶&quot;省身念祖&quot;匾额——这是皇帝亲笔。抱厦三间，前坊一座，影壁一座，左右角门。曾子琴堂（城东北隅·金建明毁·琴台坑尚存）：萌山之阳，传为曾子鼓琴处。金章宗大和七年（1207）重建——穴地3尺，铺以大石砌石台，南面九级石阶，台上建堂（上圆下方如亭）。堂前甘泉池名琴台坑。明嘉靖九年（1530）知县王时佐取石建泮宫桥，堂遂毁——但琴台坑泉眼至今仍冒水。南武城遗址（春秋·济宁市保）：满硐乡南武山村东南1000米，呈方形子午向，面积25万平方米。残存东城墙南北长约100米、宽8米、高3-4米，夯土层夯窝清晰（圆形圜底，周代筑城特征）。夯层中含西周晚期和春秋陶片——与曲阜鲁国故城同期城墙工艺相同。曲阜颜孟三家并列：自嘉祥曾翰博府立后，&quot;东有颜（颜庙），西有孟（孟庙），中有曾（曾翰博府）&quot;——三家世世代代同享&quot;五经博士&quot;待遇，地方官春秋二祭。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明《重建宗圣公庙记》（正统十一年许彬撰）：&quot;郕国宗圣公自有封谥以来，载在祀典，血食天下。而此庙则在故里南武城，旧为邑，即子游为宰处。在今兖州之西，嘉祥、金乡县界，庙南北去县各四十五里，南武山之阳。&quot;\u003cbr\u003e▌武氏祠考古学者：&quot;武氏祠是东汉武氏家族出资造的——武梁是从事、武开明是郡丞、武班是敦煌长史、武荣是执金吾丞。兄弟四人都是汉代中高层官员，攒钱给家族修墓造石刻。画像石旁有文字榜题，比如&#x27;武梁从事&#x27;四字——汉代的简历直接刻在自己墓前，这自信没谁了。&quot;\u003cbr\u003e▌曾翰博府后人曾大爷：&quot;我家是曾子的嫡传后代——从明朝嘉靖年间就世袭翰林院五经博士，管曾子祠墓的事。大堂上那块&#x27;省身念祖&#x27;是雍正皇帝亲笔写的。后来断了传承，但每年清明我们家还是要回曾庙上香——这祖宗牌位不能丢。&quot;\u003c/p\u003e"}, {"n": "曹县老城·商汤之都·景亳", "s": "曹县", "p": "山东", "w": "商汤会诸侯景山·伊尹耕莘·汤陵封土70米·盘庚陵在城北商汤之都景亳（北亳/蒙亳）——王国维《观堂集林·说亳》考证商汤之都亳在曹县南二十余里（阎店楼/邵庄/郑庄三镇交界处），后世左丘明/司马迁/班固/傅瓒/杜预/伏滔/王国维/顾颉刚/辛德勇等全部持此说。商汤灭夏前会三千诸侯于景山（曹县东17公里梁堌堆）会盟演兵，史称&quot;商汤有景亳之命&quot;。伊尹就在曹县莘冢集耕于莘野，后来到亳汤王处做右相。汤陵封土南北70米×东西50米×高1.5米还在，明清重修碑还在。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商汤自契至成汤八迁都，最终定居于景亳（曹县）。商汤会三千诸侯于景山（曹县梁堌堆），灭夏建商。汤王在位30年死后葬于涂山之阳（曹县土山集）。盘庚曾居亳（景亳），恢复汤政。周初曹县属宋国（宋君为商汤后裔），把汤陵作为祖先宗邑祭祀。汉哀帝建平元年曾遣使祭祀汤陵。明弘治五年（1492）/嘉靖二十五年（1546）/万历九年（1581）多次重修汤陵庙。1967年山东省文保单位。现状：汤陵、伊尹墓、盘庚陵、莱朱墓、景山（梁堌堆）、莘冢集（有莘国遗址）尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e汤王陵（商肇建之君·省级文保·封土尚存·明清重修碑）：阎店楼镇土山集村西，现存封土南北长70米、东西宽50米、高1.5米。陵前有明清两代&quot;重修汤陵碑&quot;——宋皇祐四年（1052）、元延祐五年（1318）、明宣德八年（1433）、成化十二年（1476）、弘治五年（1492）、嘉靖二十五年（1546）、万历九年（1581）多次重修汤庙（有汤庙、东西庑、前殿、大殿），后毁于兵燹水患。遗址尚存。景山/梁堌堆（商汤会三千诸侯处·省级文保·景亳之命台基）：县城东17公里梁堌堆。商汤灭夏前在此会盟诸侯演兵，史称&quot;商汤有景亳之命&quot;。《商颂》&quot;陟彼景山，松柏丸丸&quot;即此。堌堆为龙山/商/周叠压文化层，出土商周陶片。伊尹墓（商右相·世界最早丞相·省级文保）：县城东南殷庙村（原楚丘城西）。伊尹&quot;耕于莘野&quot;（莘冢集）后到汤王处任右相——&quot;伊尹五就桀五就汤&quot;。沃丁时伊尹去世葬于亳。墓前有伊尹祠（&quot;元圣祠&quot;），明清重修多次。盘庚陵（商第20代王·曾居景亳·商中兴之主）：县城北燕陵村。盘庚曾一度回景亳（曹县）治天下推行汤政，恢复商道。盘庚死后葬此，后人建盘庚祠纪念。莘冢集（有莘国遗址·省级文保·伊尹耕莘处）：县城北18公里莘冢集镇。有莘国是夏商时古国，伊尹曾在此耕稼。商汤娶有莘氏为妃。遗址为龙山文化→商→周叠压的堌堆型。曹县城明清遗址（明代城墙残段）：明代曹县城周长九里，残垣可辨。县城内有盘庚村、盘庚祠遗址。&quot;汤陵异木/莘野春耘/景山夕翠&quot;——曹县明八景中，三个都与商汤有关。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·殷本纪》：&quot;成汤自契至汤八迁。汤始居亳，从先王居，作《帝诰》。——伊尹去汤适夏，既丑有夏，复归于亳。入自北门，遇汝鸠、汝方，作《汝鸠》《汝方》。&quot;\u003cbr\u003e▌王国维《观堂集林·说亳》：&quot;商汤之都亳，为汉之薄县，即今山东曹县南二十余里。左丘明、司马迁、班固、傅瓒、杜预、伏滔皆持此说。&quot;\u003cbr\u003e▌曹县文保干部老王：&quot;汤王陵封土南北70米——这是商王墓的标准规制。我们1967年立文保碑时，墓前还有明清两代的碑——共5块，现在只剩3块完整的，两块裂了。汤庙大殿毁了两次——民国战乱一次，黄河洪水一次。遗址夯土还在，每年清明还有人来上香。&quot;\u003cbr\u003e▌莘冢集老农民张大爷（76岁）：&quot;我家地就在莘冢集堌堆边上——小时候挖土豆经常能挖到陶片，碎陶片上有绳纹——老人说这是&#x27;伊尹耕田时用的碗&#x27;，我不敢信也不敢扔，捡回家放窗台上了。&quot;\u003c/p\u003e"}, {"n": "兰陵老城·两千年前山东第一县", "s": "兰陵", "p": "山东", "w": "战国楚置兰陵郡县·荀子两任令十八年·故城夯土残垣·荀子墓封土3.9米山东境内最早的县治单位——战国楚威王（前339-前329）设兰陵县，距今已2300多年，比秦始皇全国郡县制还早100年。战国四公子春申君举荐荀子出任兰陵令，前后两任共18年，辞官后定居兰陵著述终老。《荀子》一书在兰陵定稿，韩非、李斯俱事荀卿。兰陵酒3000年史——徐州狮子山汉王墓出土兰陵美酒封存2000年酒香未散。兰陵萧氏郡望——萧望之墓地在镇北小仲村，后裔南渡建立南朝齐梁两朝。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国楚威王时（前339-前329）设兰陵县，为楚国东北边境最早县治。前255-前237年荀子两任兰陵令，前后18年。秦统一后属东海郡，居38县第4位（汉东海郡属县吏员定簿）。西晋元康元年（291）置兰陵郡，郡县同名而治所分离。唐贞观元年（627）废兰陵县，并入承县——延续900年的兰陵县制首度撤销。金明昌六年（1195）改承县为兰陵县，治所迁承城（今峄城）——故城开始荒疏。金贞祐四年（1216）县治再迁土娄村——兰陵故城作为县治的历史正式终结。元属中书省益路沂州临沂县，降为普通城邑。明历经战乱，每况愈下，沦为普通集镇。清属沂州兰山县，乾隆六十年（1795）兰山县城丞驻此。民国为临沂县八区政府驻地。现状：故城夯土残垣、荀子墓、萧望之墓、于官庄遗址尚存，兰陵镇现为兰陵县副中心。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e兰陵故城夯土残垣（省级文保·战国楚县治·山东最早县级城址之一）：内城东西宽885米、南北长1980米，占地面积175万平方米。墙基宽约30米，夯土版筑。现存南部城墙残高2-4米，厚约3米；东南、东北城角仍可辨识轮廓。70年代在兰陵五中校园附近还见过高约5米的残段，如今只剩几米高——当地村民取土烧窑、建房，20年间吃掉了大半夯土。内外双城制布局，护城河东西两侧原有，今已淤塞。城内地面散见汉代陶器残片、板瓦、筒瓦。荀子墓（省级文保·战国大儒·葬兰陵2300年）：兰陵镇驻地东南1千米，运女河西岸。原封土为一巨大圆冢，墓顶较平，上小下大，状如山丘。原占地600多平方米，高5米。明清时因洪水冲击，呈东西长堤型。文革中遭毁呈M型，东西两端高7米，中间高3米——如今经修葺恢复原型，墓覆野草和刺槐。历代都有人前来祭拜——2023年荀子后人和兰陵文化研究会联合举办祭荀大典，百余人着汉服祭祀。萧望之墓（省级文保·汉宣帝辅政重臣·兰陵萧氏祖墓）：兰陵镇北小仲村（萧冢村）。墓园东西约120米、南北约80米。2011年出土龟钮铜印一枚，印文为&quot;萧征私印&quot;——确证墓主身份为萧望之之孙萧征（汉元帝时官至光禄大夫）。萧氏后裔南渡后建立南朝齐梁两朝，出了11位皇帝——如今海内外萧氏后裔每年清明都组团来此寻根祭祖。于官庄遗址（省级文保·新石器早期北辛文化·7000年先民聚落）：故城东3公里。出土北辛文化时期的石磨盘、磨棒、陶鼎、陶罐等——比大汶口文化早1500年，是鲁南已知最早的人类定居点之一。兰陵美酒老厂（商周至现代连续酿造·省级非遗）：兰陵镇驻地地下出土商周时期陶酿酒器具，县城出土汉代漆酒具——徐州狮子山汉墓出土的兰陵美酒陶瓮，封存2000年酒香未散（1995年全国考古十大发现之一）。唐李白《客中行》&quot;兰陵美酒郁金香&quot;使之名扬天下。1915年巴拿马万国博览会金奖，1954年日内瓦会议周总理带兰陵美酒招待外宾。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌兰陵镇老农民王大爷（68岁）：&quot;我家地就在故城东南角边上——小时候挖红薯经常挖到陶管碎片，爷爷说这是&#x27;荀子那时的陶管子&#x27;。我半信半疑，后来县文保所来人鉴定，说确实是汉代的排水陶管。现在我家地里还有一垄垄高出地面的土埂——那就是原来的城墙根，村里没人敢在上面盖房子。&quot;\u003cbr\u003e▌荀子研究会老李：&quot;文革中荀子墓被炸成M型——当时&#x27;破四旧&#x27;的人用炸药炸开墓顶，以为有金银财宝。结果里面只有青砖砌的椁室，什么都没有。村民后来悄悄回填了土，种上了洋槐树。80年代县政府拨款修复，现在两边又长到7米高了。&quot;\u003cbr\u003e▌萧冢村萧姓后人：&quot;我们萧姓全村300多户，都是萧望之后人。每年清明从广东、福建、台湾过来寻根的萧氏后人，少说也有一两百号人。祖坟被犁过、被盖过房子——80年代村里组织恢复祖坟时，我爷爷带领全村人扛石头、填坑，干了整整一个冬天。&quot;\u003c/p\u003e"}, {"n": "峄城老城·三城叠压", "s": "峄城", "p": "山东", "w": "汉承县夯土残15米·金峄州城荡平·明峄县石城西门存·孺子桥12孔96米枣庄的原名就是峄县，峄县的原名就是兰陵——明代文豪贾三近（《金瓶梅》作者嫌疑）在《峄县志》序中三次强调&quot;峄县即缯、承、兰陵之旧疆&quot;。峄城地下叠压着三座城池：汉承县故城（2000年前）、金峄州故城（800年前）、明峄县故城（600年前）。现存的明峄县西门是唯一还能摸到的城防建筑——2016年当地工匠用青砖补了垛子，面向公众开放。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e汉承县：西汉置承县，城周250m×600m，今仅西北角存残土墙15m×4m。金兴定年间（1221-1223）：王宣在仙坛山南麓建峄州城——周约3500米，西墙紧依承水，北墙在峄城北关外300米。元至元二年（1265）：省兰陵县入峄州，峄州版图扩大。元末：徐达、常遇春北伐&quot;三打峄州&quot;——峄州城夷为平地。明洪武二年（1369）：降峄州为峄县，知县乐徽在峄州城西南隅筑新县治——三座城叠压格局就此形成。成化二十二年（1486）：知县毛凤鸣将土城整建为石头城——内外壁面长条块石砌垒，中间填夯土、毛石、豆汁白灰麻刀。乾隆四十三年至四十九年（1778-1784）：知县张玉树重修城垣、文庙、乡贤祠。清后期/民国：城毁于兵燹，仅余城西北临河一段矮墙，西门相对完整。1949年后：拆城建房、&quot;文革&quot;破四旧，城墙几乎荡平，仅余西门。2013年：峄县西城门列为区级文保单位。2016年：峄城区文广新局修复西门南墙，用青砖补垛子——试开放。现状：峄县西门（迎恩门）经局部修复对外开放，汉承县西北角残土墙尚存，城内地下三城叠压。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e峄县西门（迎恩门·区级文保·峄城唯一幸存城门·2016年修复）：明洪武二年（1369）筑土城，成化二十二年（1486）知县毛凤鸣整建为石头城——内外壁面用长条块石料砌垒，中间填以夯土毛石、豆汁和白灰麻刀沙子浇制混凝。城墙高5米、厚3.3米，墙基宽10米。西门高3.5米，门洞宽3米，青砖灰瓦结构。2016年3月峄城区文广新局历时21天修复，主要是对西门南墙进行维修加固，用青砖垒成城墙垛子。保护范围：以西门建筑为基点向外延伸10米为重点保护区，40米为建筑控制区。孺子桥（西门外驿道桥·明代遗存·现存完好）：长96米，宽6米，高4米，12孔。横跨承水河，是邳州、峄城通往滕县、兖州的古驿道咽喉。桥头原有石狮子两对，文革中被砸毁。2008年当地村民募资修复桥面——现在还能通行农用三轮车。汉承县故城残墙（省级文保·西汉城址·鲁南最早县级城垣）：峄城西一里，紧靠承水河&quot;承水环烟&quot;八景西畔。城址南北长600米，东西宽250米，四周墙基已夷为平地。仅西北角残存一段黄土夯筑土墙——高约4米，东西长约15米，底宽约3米。1986年普查时农民取土还挖出汉代陶罐、五铢钱。仙坛山（古峄州城靠山·峄县八景之一&quot;仙坛晓翠&quot;）：金峄州城北面的天然屏障，海拔275米。山顶原有&quot;玉皇帝主祠&quot;，元代建&quot;玄真观&quot;，明清屡修。山下有承水河环绕，&quot;承水环烟&quot;是峄县八景之首——清晨河面上水汽蒸腾如烟雾缭绕。贾三近故居（明代文豪·《金瓶梅》作者嫌疑）：峄城牌坊街社区。贾三近（1534-1592），明隆庆进士，官至南京光禄寺卿，主编首部《峄县志》。其故居为三进院落，青砖灰瓦，门楣上有&quot;光禄第&quot;三字——文革中被毁，仅存门楼残基。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌峄城区文保所老赵：&quot;峄城地下埋着三座城——汉代的在西、金代的在中、明代的在东，叠压在一起。我们2018年搞基建时，在牌坊街打地基，挖到3米深时发现了金代峄州城的夯土墙基——直径1米左右，夯土层每层20厘米。再往下挖，居然挖到了汉代的陶排水管道，完整的，一节一节扣在一起。&quot;\u003cbr\u003e▌峄城西门守夜人张大爷（72岁）：&quot;我守西门5年了——每天早上开门，晚上关门。游客不多，大多是老头老太太遛弯的。2016年修城墙时，县文保所找的都是当地老石匠——用的还是传统的&#x27;糯米灰浆&#x27;，不是现在的水泥。我亲眼看着老石匠把凿好的条石一块一块砌上去，缝里塞的是麻刀和细沙——600年前我祖辈就是这么砌的。&quot;\u003cbr\u003e▌牌坊街老住户王奶奶（81岁）：&quot;我家就在牌坊街——原来街上有三座跨道石坊，文革时被推倒当了建材。我爷爷当年亲眼见贾三近的后代把《金瓶梅》手稿捐给了北京——说是祖传的，不敢留。后来听说北京的专家说是假的，我爷爷气得三天没吃饭。&quot;\u003c/p\u003e"}, {"n": "滕州老城·池莲四面", "s": "滕州", "p": "山东", "w": "唐元和迁黄山·护城河植荷千朵·龙泉塔存·薛国故城残高4-7米滕县城1200年没动过地方——唐元和十二年（817）知县迁城至黄山西坡后，此后宋元明清至今都是这个位置。护城河引南梁水后广植莲藕，&quot;池莲四面&quot;成为古滕八景之一——明万历年间的盛景：夏末初秋，红萼绿盖三面绕城，&quot;水光在楼，花光在水，香光在游人衣裙&quot;。清康熙七年（1668）郯城8.5级大地震是滕州城历史上最大的灾难——县志记载&quot;崩城郭，坏庐舍，城东地陷，涌出水有泥沙&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐元和十二年（817）：知县迁城至黄山西坡——借助龙岭龙脉，周长仅5里，6街12巷。宋元：土城，城墙多次修葺。明洪武二年（1369）：指挥唐某率军民砌砖石——滕县城墙第一次石砌化。成化八年（1472）：知县郁亨、千户钟理复土扩修——增高2尺、拓宽3尺，建女墙、垛口、4角楼、24城堡，城墙高三丈五尺、宽一丈五尺。明正德七年（1512）：筑郭城——保护四关，周长十余里。清康熙七年（1668）：郯城8.5级大地震波及滕县——城郭房屋大多倒塌，城东地陷涌水。乾隆三十二年（1767）：县令陈诏重修城垣——新增13条街、31条巷，滕县城初具规模。咸丰/光绪年间：增修城墙，建炮台。民国：动乱中城墙大部分毁损，仅余残段。1949年后：拆城建房，城墙几乎荡平，仅存极少量残基。现状：龙泉塔、薛国故城、滕国故城、滕县城明清街巷名尚存，护城河已淤塞改作他用。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e龙泉塔（塔影高标·北宋始建·省级文保·滕州标志性古塔）：位于城区东郊荆河西岸。始建于北宋元丰三年（1080年），原为龙泉寺附属建筑，后寺毁塔存。残高43.5米，砖结构，八角十三级密檐式，底部边长5.6米。塔身青砖砌筑，每层设佛龛。明清多次修葺——明万历年间重修时，塔顶设&quot;千佛阁&quot;，战乱中被毁，现仅存塔身。2010年再次修复，现为滕州城的标志性建筑。滕国故城（国保单位·周代滕国都城·孟子滕文公对话地）：城西南14里姜屯镇滕城村。故城周长10615米，城墙残存垣垛高出地面4-7米，底部宽20-30米。经考古普探，发现大小城门8处，城内有作坊遗址10余处、居住遗址9处。城中部的&quot;皇殿岗&quot;——相传是滕国宫室所在。城内自然村落9个，村民世代在故城内生息——城墙残段至今还是村民的宅基地边界。薛国故城（国保单位·周代薛国都城·造车鼻祖奚仲后裔封地）：城南张汪镇与官桥镇之间。周周长10615米，城墙残高4-7米。薛国是中华古车的发源地——奚仲造车、仲虺辅汤、孟尝君薛地养士，都在这片土地上。黄山桥（滕县古城遗迹·明代遗存·护城河石桥）：滕县古城北面。长5米、宽4米，一孔石拱桥。桥孔上弧正中有龙头东出，其尾西露——似龙若鱼。券洞北壁有题名石碑，正楷大字&quot;黄山桥&quot;。传说护城河中的鲤鱼曾跃此桥跳龙门——明代&quot;池莲四面&quot;盛景时，夏秋涨水季节，鲤鱼跃跃欲试。荆泉（趵突跳珠·古滕八景·汉志已载·今日仍为城区供水主源）：城东北荆沟村。最早见于《汉书·地理志》。明弘治四年（1491年）工部主事黄肃奉命总督泉源，&quot;忽见两泉源源汹涌，势如趵突，且味甘醴，南北对峙&quot;，手书一诗刻石碑于荆泉北侧。两泉眼相距不过十步，泉水清冽四季不涸——如今日供水量占滕州城区的40%。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌滕州历史学者马西良：&quot;滕县城1200年没挪窝——这在全国都是罕见的。为什么？因为元和十二年（817）选这个地方，选得太准了：黄山西部是制高点，南梁水绕东而过，护城河引南梁水形成天然屏障。此后不管怎么打、怎么震——康熙七年那场地震把县城震成废墟，乾隆三十二年陈诏还是在原址上重建。到现在滕州城还是围着当年的黄山西坡在发展。&quot;\u003cbr\u003e▌龙泉塔看护人李师傅（64岁）：&quot;龙泉塔有43.5米高——我每天绕塔走三圈。文革时红卫兵想拆塔顶，爬上去砸了三块砖就被塔掉下来的砖砸了脚——后来就没人敢再动了。90年代修塔时，考古队在塔基下挖了三天——挖出了宋代的佛舍利盒！现在放在滕州博物馆里展着。&quot;\u003cbr\u003e▌滕城村农民赵大哥：&quot;我家就在滕国故城里面——宅基地就是原来的城墙根，老夯土。我打地基时往下挖2米，全是周代的陶片。县文保所的人说，你这宅基地下面是滕国的宫殿遗址——不能往下挖了。我就停了。现在我家墙上还嵌着一块带绳纹的周陶，当墙脚石用了。&quot;\u003c/p\u003e"}, {"n": "郯城老城·碌碡城", "s": "郯城", "p": "山东", "w": "元末用石磙筑墙基·碌碡城无东门·郯国故城夯土墙高4米·银杏之乡全国独一份的&quot;碌碡城&quot;——元末沂州守将王宣、王信父子在郯城筑城时正值隆冬，天寒地冻运石困难，便从民间大量征用碌碡（石磙）——城墙基址由碌碡排垫、夯土版筑，故称&quot;碌碡城&quot;。1958年拆城墙时挖出大批：每个长69厘米、直径51厘米，青石红石皆有，有辋无辋均存。郯城自古无东门——明《郯城县志》记载&quot;设三门：南曰通淮，西曰瞻鲁，北曰拱极&quot;——东门从未开建，原因至今成谜。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：郯国（少昊之后·&quot;鹿乳奉亲&quot;郯子·孔子师郯子）。秦：设郯郡。汉：东海郡治所（治郯县）。唐元和间（806-820）：复置郯城县。唐后期：省入临沂县。元后期：复置郯城县。元末王宣/王信父子镇守沂州（元至正年间·1341-1368）：在护城河以南（今郯城今址）筑碌碡城——墙基排垫碌碡，夯土版筑，设三门（无东门）。明洪武年间：重修碌碡城。万历四十五年（1617）：增筑砖土结构瓮城、月城。清康熙七年（1668）地震：碌碡城遭破坏，次年重修。咸丰年间：捻军过境，城墙受损。1938年：动乱中城墙严重毁损。1958年：&quot;大跃进&quot;拆城墙烧石灰——大量碌碡被挖出，散落民间。文革期间：城墙残段继续被拆。2019年：郯国故城遗址公园动工，修复部分夯土城墙。现状：郯国故城（北老城·西周至汉）部分修复展示，碌碡城仅剩极少量残基散落民间。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e郯国故城夯土城墙（国保单位·西周至汉代·山东省现存年代较早、面积较大的古城址之一）：县城北侧约100米处，与今城仅隔一条护城河（今郯子湖）。城墙系黄土夯筑而成，每层厚约10-20厘米，现存最高处约4米。原城有东西南北四个城门——新中国成立初期尚存南门（系民国重修），门楼上书&quot;郯子故国&quot;四字。2019年故城遗址公园动工，重点修复西墙与北墙——采用浅草植被标识替代硬质围栏，既标示遗址范围又避免破坏原有土壤结构。公园占地14.55公顷，总投资约5500万元。碌碡（元明清碌碡城遗物·1958年拆城出土·散落民间）：元至正年间沂州守将王宣、王信父子筑碌碡城时，正值隆冬，天寒地冻采石、运石困难，为抢工期并使城池牢固，便从民间大量征用碌碡——城墙基址由碌碡排垫，&quot;累土而立&quot;版筑而成。1958年拆除县城内一段古城墙时，挖出大批砌排整齐的碌碡：每个长69厘米、直径51厘米，青石、红石皆有，有辋、无辋的均有。如今散落于县城各农户家中，或作门槛、或当凳子、或垫猪圈——县文保所正在组织回收。郯子庙（省文保·春秋郯国国君庙·&quot;鹿乳奉亲&quot;主人公祠堂）：县城南7公里郯庙村（原郯子花园）。相传春秋时期郯国之君郯子在此建花园供其游览，卒后后人于此建庙以祭。占地约540平方米，青砖灰瓦古建筑，有正殿3间、东西廊房各3间。郯子是&quot;二十四孝&quot;中&quot;鹿乳奉亲&quot;的主人公——其父母年老体衰患眼疾，需饮鹿乳治疗。郯子披鹿皮深入深山混于鹿群中，终于取得鹿乳，回家奉养双亲。孔子师郯子——郯子曾到鲁国，与孔子论古官制，孔子称郯子为&quot;圣人&quot;。豹公墩（国保·春秋徐国国君墓·天下徐氏始祖陵）：县城北郯城街道徐林村。封土高5米，南北长70米、东西宽50米。2001年认定为&quot;中华徐氏始祖陵&quot;——徐氏后裔的寻根祭祖地。郯城是中华徐氏发源地——徐国国君豹公葬于此。郯城一中老城墙边的碌碡：一中老校区旁尚存数块刻有文革口号的碌碡——1968年&quot;破四旧&quot;时刻上去的，&quot;变革&quot;、&quot;造反有理&quot;等字迹至今清晰可辨。县文保所已在此立牌保护。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郯城文化局退休干部乔闪（《老郯城》系列作者）：&quot;为什么碌碡城没有东门？这个问题我研究了20年——元末王宣父子筑城时，可能故意不建东门：东门外面是沭河，万一涨水直接从东门灌进城来。另外，郯城地处南北通衢，西门走孔孟圣贤之路（瞻鲁）、南门走京杭（通淮）、北门走圣脉（拱极）——东门方向是东海，是&#x27;尽头&#x27;，不吉利。《郯城县志》从万历版到民国版，从来没记载过要开东门——当地人说&#x27;郯城自古无东门&#x27;。&quot;\u003cbr\u003e▌郯城一中退休教师陈老师：&quot;1958年我还在上初中——我亲眼见施工队开着卡车来拆城墙。拆墙的地方就在现在一中北墙外，挖出来的碌碡一车一车往石灰窑拉。我当时捡了两个小的，放在教室窗台上当镇纸。后来被老师发现了——说这是&#x27;封建遗物&#x27;，给扔了。现在想起来后悔得很——当年随便捡一个留着，现在就是文物了。&quot;\u003cbr\u003e▌郯庙村村民郯大爷（78岁）：&quot;郯子庙年年都有人来拜——清明前后，徐氏、郯氏还有各种孝子孝孙，烧香磕头的，献花的，拍视频的。我家就在庙旁边——小时候庙还有个道士守着，后来道士走了，庙就荒废了。县文保所80年代开始修，现在又重新刷了漆，看起来像新庙。&quot;\u003c/p\u003e"}, {"n": "微山夏镇·运河名镇", "s": "夏镇", "p": "山东", "w": "一步两省三座庙·一部城跨运河·三绝碑1960省文保·泰山庙会四月十八京杭运河四大名镇之一·一镇跨苏鲁两省——&quot;一步两省三座庙，一条大街两县分&quot;。夏镇由三部分叠压而成：西北秦广戚县戚城（两千年老县城）、西南明代部城（运河护城兵驻地）、东寨（清咸丰沛县迁此，11年）。运河自西向东南蜿蜒穿行——部城砖城周长九百余丈、高二丈五尺、雉堞千余。康熙七年（1668）地震城门楼全塌，商贾东迁，运河东岸镇市渐盛。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦代：置广戚县——今夏镇戚城。南北朝：废广戚县并入留县——戚城城垣尚存，但繁华消退。明嘉靖末：新开漕运新渠（南阳至留城141里）——夏村（夏镇原名）成为沿运码头。明隆庆三年（1569）：夏村改村为镇，工部、户部分司自沽头城移驻。明万历十六年（1588）：筑土城，建四门楼——东&quot;见泰&quot;（后改&quot;安澜&quot;）、西&quot;瞻华&quot;、南&quot;延庆&quot;、北&quot;拱极&quot;。清顺治十五年（1658）-十八年（1661）：改建为砖城——城为梯形，周长九百余丈，高二丈五尺，雉堞千余，因常驻护河兵又名&quot;部城&quot;。清康熙七年（1668）：郯城8.5级大地震波及——部城四门楼皆倒塌，城内房屋多毁，商贾东迁运河东岸。清咸丰元年（1851）：黄河蟠龙集决口，沛县栖山一带淤没——沛县县城自栖山迁夏镇东寨，历经11年。咸丰二年（1852）：东寨筑土圩——因西以运河为障，仅三面筑墙，建三门楼（东&quot;同德&quot;、南门、北门）。清末：夏镇形成戚城（西北·滕县辖）、部城（西南·沛县辖）、夏镇寨（东·两县分治）三合一格局——&quot;一部两省三座庙，一条大街两县分&quot;。1949年后：拆城建房，城墙陆续荡平。现状：老运河（漕运新渠故道）5.8公里活水段、三绝碑（省文保）、顺河街/月河圈/三孔桥、泰山庙（碧霞宫）遗迹尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e老运河（漕运新渠故道·世界文化遗产延伸段·夏镇保留5.8公里活水）：明隆庆元年（1567）工部尚书朱衡主持开凿——北起南阳闸，途经夏镇直达留城，全长141里，疏浚旧渠53里。河道西引黄河，东接泗水，解决了黄河夺运淤塞问题。夏镇段保留5.8公里活水，河宽约50米，两岸柳树成荫。咸丰元年（1851）黄河蟠龙集决口淤塞旧道后，泇河成为主运道，此段运河不再承担漕运功能——如今作为城市景观河，东风桥、和平桥、运河桥横跨其上，为居民出行要道。三绝碑（漕运新渠记碑·省文保·明代碑刻艺术巅峰）：夏镇运河西岸，原玄帝庙门北侧，河清永镇亭（皇华亭）中。整个碑体规模与曲阜孔庙名碑相当。《漕运新渠记》系明嘉靖年间吏部尚书、建极殿大学士徐阶所撰，书法名家周天球书写，名石匠吴鼐刻石——撰、写、刻三绝，被誉为&quot;明碑第一&quot;。1960年山东省人民委员会曾拨专款修亭，围以栏杆保护——&quot;文革&quot;时被砸裂，80年代修复，现立于原皇华亭旧址。夏镇闸（明代漕运节制闸·运河关键工程）：老运河上，明隆庆年间工部尚书朱衡主持修建。为石制节制闸，闸身长120米，闸门宽8米——1930年前后仍在使用，建国后改建为公路桥的一部分。顺河街、月河圈、三孔桥（运河老街·夏镇最繁华的古街区）：顺河街原名运河涯——运河西岸的码头街巷，粮行、布店、药铺、银匠铺鳞次栉比。至民国初期，夏镇商业有17种行业193家商户——山西、河南、浙江、安徽、章丘五大商帮聚居于此。月河圈是清乾隆间疏通运河时挖得的半月形河道，供漕船商船停泊绕行——后人们围绕小河居住，弧形排列，成为运河边最具特色的居民区。三孔桥：嘉庆二十三年（1818）建，三孔石桥，横跨运河——桥长30米，宽6米，桥洞各高5米，三孔并列。姜肱故里碑（汉代名士·兄弟友爱典故）：部城北广戚城中——篆书&quot;汉姜肱故里&quot;五个大字。姜肱（东汉名士）与弟姜仲海、姜季江&quot;同被而眠&quot;——&quot;姜被&quot;成为形容兄弟友爱的典故。朝廷多次征召不就，一生不入仕。《后汉书》为其立传。原碑后移至通济门大南门胡同北头。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌微山县志办退休干部王建国：&quot;1980年修县志时，我在夏镇老街走访了三个月——一位姓赵的老太太告诉我：她1948年刚嫁到夏镇时，运河东岸的顺河街还能通船——夏天河里到处是荷花，小孩在水里摸莲蓬。后来泇河主运道改线，这条河就不通船了。现在河两边盖了住宅楼，河里种了荷花，每年夏天还有不少人来拍照。&quot;\u003cbr\u003e▌三孔桥附近老住户张大爷（74岁）：&quot;三孔桥是嘉庆年间造的——石头块一块挨一块，没用水泥没用灰，就是&#x27;卯榫&#x27;接起来的。我爷爷说，造桥时石料从微山湖上船运过来，一块石头要10个壮劳力抬。现在桥面上铺了沥青，桥墩还是原来的石头——600年了，一块石头都没掉。&quot;\u003cbr\u003e▌夏镇老船夫老李（70岁）：&quot;我爹是运河上的老船工——给漕船拉纤的。他说，夏镇泰山庙会是运河上最热闹的——四月十五到十八，碧霞元君出巡，队伍有几千人，銮驾、卫队、八仙、僧侣……光唱戏的戏台就搭了5座。那时候运河上的船连起来能排5里长——南北的客商全来逛庙会，卖粮的、卖布的、卖银器的……&quot;\u003c/p\u003e"}, {"n": "青州老城·三迁四筑六城叠压", "s": "青州", "p": "山东", "w": "西汉广县·广固城南燕都城·明砖城13里·昭德街800年·龙兴寺400造像古九州之青州，山东1600年省级治所，南燕国唯一都城——青州自西晋永嘉五年（311）至清雍正八年（1730），州府治所稳定在今青州市境内1400多年，是山东乃至全国延续时间最长的州府治所之一。南燕国（399-410）定都广固城——12年短暂王朝却是齐鲁大地上唯一有人称帝的地方。古城历经六座城池（广县城→广固城→东阳城→南阳城→东关子城→满洲旗城）的叠压更替。现存昭德街800年原貌、衡王府石坊、云门山&quot;天下第一高寿&quot;（7.5米）、龙兴寺窖藏造像震惊世界。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉高祖三年（前204）：封召欧为广侯，置广县城——青州历史上第一座城池，面积20万平方米，市级文保。西晋永嘉五年（311）：前赵曹嶷破临淄，筑广固城为青州治——因&quot;大涧甚广，因以为固&quot;得名，拐尺形，总面积30万平方米。东晋隆安三年（399）：鲜卑慕容德陷广固，建国称帝，史称南燕——山东唯一都城。东晋义熙六年（410）：刘裕陷广固，夷其城垣——广固城存世100年，七次攻守。此后筑东阳城（东晋），与南阳城（北齐）对峙——双城格局数百年。明洪武三年（1370）：青州府砖城建成——城周长13里零3步，城墙高12米、厚6米，垛口1777个。清雍正八年（1730）：降青州府为益都县——延续1100多年的青州府治结束。1949年后：陆续拆城，07028战备通道施工时推倒南城垣填平护城河——原护城河在今凤凰山路正中偏南。文革/70年代：扒东门、东城墙修云门山路，扒西城墙。2010年：青州古城修复保护启动——累计投入15亿元，改造116条古街巷，修复36处古迹，恢复明代格局。现状：5A景区，明清古街巷120余条，龙兴寺、真教寺（元代）、昭德街、万年桥遗存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e衡王府石坊（国保·明弘治·山东现存唯一跨街石刻四柱三楼坊）：明弘治十二年（1499）明宪宗封七子朱祐楎为衡王，在青州建王府。王府占地140多亩，规模宏大——明灭后改建为清代满城。两座跨街石坊分别曰&quot;大学士坊&quot;（为嘉靖年间大学士翟銮立）、&quot;总镇坊&quot;（为兵部侍郎陈经立）。石坊用优质石灰岩雕制，四柱三开间，明间宽3.15米，次间宽2.15米。坊额刻字，背面施浮雕&quot;二龙戏珠&quot;、&quot;龙凤呈祥&quot;。2008年修缮时从石坊下挖出明代铜钱数十枚——证明此处为明代重要官道。昭德街（全国首批十大历史文化名街·800年原貌）：东阳城东门——明以前称&quot;表海&quot;，后改&quot;昭德&quot;。长约1.5公里，青石板路面，两侧店铺林立，明清建筑保存完好——隆盛糕点（明代隆庆年间开业）、金城药铺等百年老字号至今营业。街内有真教寺（元代，全国三大元代真教寺之一）、清真寺（元代）、基督教堂（清末）——五大宗教和谐共处一城。800年间街名未改、格局未变，是青州古城的&quot;活化石&quot;。龙兴寺窖藏造像（国保·北齐-北宋·1996年十大考古）：1996年青州博物馆职工在龙兴寺遗址西侧一个地窖子里意外发现——窖藏400余尊佛教造像，其中最高的达305厘米，最小的仅10厘米。造像跨越北齐、隋、唐、北宋四个朝代，以北齐造像最为精美——雕工精湛、贴金彩绘保存完好，被学术界称为&quot;青州风格&quot;，改写了东方艺术史。龙兴寺始建于南朝刘宋永初年间（420-422），唐宋时期是山东最大的佛教寺院——毁于元代。万年桥（明代石桥·青州古八景之一·&quot;万年在鉴&quot;）：位于南阳河上，始建于北宋宣和年间（1119-1125），明万历二十二年（1594）由山东巡抚黄克缵重修。桥长86米，宽9米，三孔石拱桥——桥面中间拱起，两侧设石栏板望柱。桥墩迎水面为分水尖状，用糯米灰浆砌筑。明代时为青州南北交通要道——过桥便是南阳城北门&quot;镇青门&quot;。云门山&quot;寿&quot;字摩崖（明代·通高7.5米·天下第一高寿）：云门山顶崖壁上的巨型摩崖石刻&quot;寿&quot;字——通高7.5米，宽3.7米，仅&quot;寸&quot;部就高2.3米，古人谓之&quot;人无寸高&quot;。明嘉靖三十九年（1560）九月九日，青州衡王府内掌司、章丘籍人周全所书。字体结构严谨，气势磅礴。山下仰视，只见&quot;寿&quot;字不见崖——登上山巅方可尽览全貌。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌青州本地文化人王先生：&quot;昭德街有800年没动过——我家祖祖辈辈在这里开当铺，传到我爷爷那辈是第五代。文革时红卫兵砸了我家的&#x27;当&#x27;字招牌，把柜台劈了当柴烧。我爷爷偷偷把银号的账册埋在后院地里——去年翻修房子时挖到了，纸都黄了，但字迹清楚。&quot;\u003cbr\u003e▌龙兴寺遗址值班员：&quot;1996年挖窖藏那天我就在场——博物馆的人在遗址西边的地窖子里，拿洛阳铲一探，地下有硬东西。挖下去一米多，最先露出来的是一个北齐菩萨的佛头，贴金还亮着！后来连续挖了七天，挖出400多尊——整个青州都轰动了。现在这些造像大部分在青州博物馆里展着，每年日本、美国、德国的专家来参观的络绎不绝。&quot;\u003cbr\u003e▌云门山守门的老李（60岁）：&quot;我守云门山15年了——每年重阳节，青州人全家老小来登云门山摸寿字的&#x27;寸&#x27;部——传说摸了能长高三寸。我儿子今年高考，特意带他来摸了三次——我说你摸的是精神，不是身高。山下那块&#x27;云门仙境&#x27;的石碑，1958年大炼钢铁差点被砸了做炉灰，是山下一个老道士用身体护住才保住的。&quot;\u003c/p\u003e"}, {"n": "临清老城·运河钞关·帝国财源", "s": "临清", "p": "山东", "w": "元运河1.2km原生态·钞关年入8万两占全国1/4·舍利宝塔61米·鳌头矶全国唯一保存至今的古代运河税收机构·明清八大钞关之首·年税银8.3万两占全国1/4——万历年间山东全年税银仅8860两，不足临清钞关的十分之一。临清因运河而生：会通河与通惠河在此交汇，明清时期有&quot;繁华压两京&quot;之誉——城中当铺100余家、旅店200余家、绸布店100余家，粮食市场年销量500万石。如今元运河仅存1.2公里原生态河道，160条明清老街巷胡同名未改、格局未变。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：设清渊县——以城临清河回湾处得名。北魏：分置临清县——临清之名首次出现。隋开皇年间（581-600）：复置临清县——故城在今县城南。明景泰元年（1450）：临清北移至今址筑土城——因运河漕运重镇地位升州。明成化六年（1470）：筑土城将漕仓圈入城内——临清州城基本成型。明宣德四年（1429）：设临清运河钞关——明清八大钞关之首。明宣德十年（1435）：钞关升为户部榷税分司——中央直属，年入4万两。明万历二十五年（1597）：年收税银11.7万两——居全国第一，占全国运河钞关税收1/4。明嘉靖二十一年（1542）：扩建土城——延袤二十余里，面积扩大五倍。清乾隆四十一年（1776）：升为直隶州——山东巡抚直接管辖。清光绪二十七年（1901）：运河漕运停止——钞关裁撤。1950年代：陆续拆城墙，砖窑遗址被农田覆盖。2014年：大运河申遗成功——临清钞关、会通河临清段、鳌头矶、舍利宝塔列入世界遗产。现状：中洲古城区160条明清老街巷完好，元运河1.2公里活水，运河钞关、鳌头矶、舍利宝塔、临清闸、月径桥、会通闸等国保单位保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e临清运河钞关（国保·明代·全国唯一遗存的古代运河税收机构）：位于城区青年路西首南侧，会通河南支西侧。明宣德四年（1429）设立，宣德十年（1435）升为户部榷税分司——中央直属，下设德州、魏湾、尖冢等五处分关。钞关建筑群自运河而西依次为河口正关、阅货厅、&quot;国计民生&quot;坊、关堞、仪门、正堂等，占地四万平方米，厅堂坊舍四百余间。万历年间年征税银8.3万两，居全国八大钞关之首——占全国运河钞关税收的四分之一。清光绪二十七年（1901）运河漕运停止，钞关裁撤。现存两进院落——前院公署办公区、后院仓储区，主要建筑仪门、穿厅、科房、船料房等80余间保存完好。2014年大运河申遗成功，钞关成为世界文化遗产。鳌头矶（国保·明代·明清运河交汇处标志性建筑）：位于会通河南、北交汇处——原为元代运河与明代运河交汇处的石坝，因形似鳌头，两支运河上的四处河闸像鳌的两对足，广济桥在鳌头矶后面像其尾，故名。始建于明永乐十五年（1417），占地1200平方米。观音阁砖砌基座高5米，9米见方，下辟门洞，面阔三间，进深两间，歇山卷棚顶，三、五、七架梁和抹角梁木构架。西殿吕祖堂、南楼望河楼各三间。古人登临其上——&quot;粮艘麋集，帆樯如林&quot;、&quot;城中烟火千家集，江上帆樯万斛来&quot;。现&quot;古砖陈列室&quot;展出临清明清青砖——临清砖是营建北京皇城的重要建筑材料，明清两代修建皇宫各大殿、紫禁城、天坛所用青砖多出自临清官窑。舍利宝塔（国保·明代万历·高61米·运河四大名塔之一）：城北郊三里卫运河套内。重修于明万历三十九年（1611）。砖结构楼阁式建筑，高61米，塔基用条石砌基，平面呈八角形，塔身9层，周长39米。南面壁门，门楣上镌刻&quot;舍利宝塔&quot;——为明万历进士按察使王成德题。密檐宽1.55米，陶质斗拱，每层檐下置&quot;阿弥陀佛&quot;陶砖雕。塔内每层有石刻记载建塔宗旨、筹资事——第6层匾额&quot;秀聚中天&quot;，西窗&quot;东兴岱岳&quot;、&quot;西引太行&quot;。塔内有通天塔心木柱，可旋转迂回登临塔顶——塔身通体几乎垂直，堪称山东独具形制的盔顶古塔。中洲古城区（160条明清老街巷·胡同名未改·格局未变）：临清运河畔的老城区，竹竿巷、箍桶巷、吉士口街、福德街、桃园街、白布巷等明清街巷名沿用至今。竹竿巷因明清竹器行聚集得名，箍桶巷因箍桶工匠世代居此得名——每条巷名都有故事。中洲古城区是临清商业文化的&quot;活化石&quot;——冀家大院（明代）、汪家大院（清代）、赵家大院、孙家大院、朱家大院等五处省级文保民居集中于此。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临清钞关管理员老张（62岁）：&quot;我爷爷是运河上的老船夫——他说1920年代运河上还千帆竞发，临清钞关的税官每天能收好几筐铜钱。后来漕运停了，钞关改了好几次用途——做过粮库、小学、居民院。文革时差点被拆，是省文保所的人带了文件来，说是&#x27;重要文物&#x27;才保住了。现在我在这里当保安，每月工资3000块——但我觉得自己在守着一段历史。&quot;\u003cbr\u003e▌竹竿巷老住户王大婶（75岁）：&quot;我在竹竿巷住了60年——这巷子里以前全是竹器行，编筐的、做竹篮的、扎扫帚的，一家挨一家。我爹就是编筐的，手艺传到我哥那辈——现在没人编了，街上开了五金店、理发店、餐馆。巷子里的石板路还是500年前的——我小时候摔过跤的那块石头，现在还在原位，磨得亮晶晶的。&quot;\u003cbr\u003e▌河隈张庄老窑工后代：&quot;我家祖祖辈辈在河隈张庄烧砖——我爷爷说他祖上烧的砖被运到北京建故宫，砖上刻着&#x27;临清府窑&#x27;四个大字。文革时生产队要扒砖窑种地——我爷爷偷偷把窑址的石碑埋了。2006年砖窑遗址被列为国保，那块石碑才挖出来——碑上刻着&#x27;明嘉靖二十一年烧造&#x27;。现在遗址上立着牌子，每年有考古队来取样品。&quot;\u003c/p\u003e"}, {"n": "济宁老城·太白楼·铁塔·声远楼", "s": "济宁", "p": "山东", "w": "李白客居任城23年·明砖城九里三十步·铁塔11层23.8米·南池荷净李白客居任城23年·济宁古八景之首·全国现存最高铁铸佛塔——太白楼上塑李白花冈岩雕像（高4米），太白楼建在三丈八尺高的明代城墙上——济宁明代砖城周长九里三十步、城墙高三丈八尺。铁塔寺崇觉寺始建于南北朝东魏武定七年（549），铁塔通高23.8米，全国铁塔之最——因铸到第五层时铁水凝固停工，没顶成了&quot;塔无顶&quot;，明万历九年龚勉增建塔顶补全。济宁因大运河&quot;控邳徐津要、扼宋卫噤喉&quot;，元明清为漕运中枢。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏：封有仍氏于任，建任国城——济宁最古老城址。秦：置亢父县、任城县。汉章帝元和元年（84）：析东平国置任城国——任城国城（即今济宁老城）建立。金天德二年（1150）：济州治由巨野迁任城——济宁城第一次成为州治。元至正年间：济宁路治迁任城——济宁开始成为大运河漕运枢纽。明洪武三年（1370）：济宁左卫指挥使狄崇将土城易以砖——城墙高三丈八尺、顶阔二丈、基宽四丈，周长九里三十步，四门均双城门（城内门+月城门），内外濠护城河。明洪武二十四年（1391）：太白酒楼重建于南门城墙上——原李白客居贺兰氏酒楼，此为明洪武24年迁建，更名为&quot;太白楼&quot;。明万历九年（1581）：铁塔寺铸铁塔增建两级、添铜顶——补全285年无顶遗憾。清康熙七年（1668）：郯城8.5级大地震波及济宁——城墙受损，次年重修。清康熙/乾隆年间：济宁州城鼎盛——漕运枢纽，有&quot;九省通衢&quot;之称。清末/民国：城墙陆续损毁，抗战期间严重毁损。1930年代：城墙已成断壁残垣。1949年后：拆城建房，城墙几乎荡平——仅太白楼外明代城墙残段、人民公园土山、环城西路北段少量遗迹。现状：太白楼、铁塔寺（国保）、声远楼、南池（王母阁湖）、河道总督府遗址公园、古运河（市区段）、崇觉寺铁佛塔、浣笔泉遗址完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e太白楼（省文保·李白客居任城23年见证·明代城墙上重建）：古槐街道太白楼中路。唐开元二十四年（736），李白偕妻女移居任城（济宁），在此生活23年——贺兰氏常为李白送酒，李白作《任城县令厅壁记》、《东鲁门泛舟》等名篇。明洪武二十四年（1391），济宁左卫指挥使狄崇重建城楼，将太白酒楼迁于南门城墙上——去掉&quot;酒&quot;字，更名为&quot;太白楼&quot;。楼建在三丈八尺高的明代城墙上，坐北朝南，十间两层，斗拱飞檐，雄伟壮观，系两层重檐歇山式砖木结构，青砖灰瓦，高20余米。1952年由政府重建。楼前立李白花冈岩雕像，高4米——身披斗篷、一手擎杯、一手仗剑，昂首阔步，取意&quot;举杯邀明月，对影成三人&quot;。崇觉寺铁佛塔（国保·北宋铸铁·通高23.8米·全国铁塔之最）：铁塔寺街路北，原崇觉寺内。始建于南北朝东魏武定七年（549），原名崇觉寺。北宋崇宁四年（1105），济宁人徐永安之妻常氏出资重建寺院并铸铁塔——徐永安经商多年无子，到崇觉寺进香许愿，第二年得子后兑现誓愿。计划建九层，铸到第五层时铁水凝固无法运输——工匠束手无策。传说鲁班化身白胡子老头前来点拨：&quot;土埋脖子了，用土堆到塔顶&quot;。工匠们恍然大悟——用土堆坡道逐层浇铸。因无顶，后人评价&quot;塔无顶，譬伟丈夫剑佩峨然，唯冠冕不饰&quot;。明万历九年（1581），济宁道龚勉筹资增建两级、添铜制金章塔刹，四周垂风铎，铁塔方为完美。铁塔身为九层，加上塔座、刹顶共十一层，通高23.8米——全国现存最高铁铸佛塔。声远楼（市文保·明代·铜钟重1.5吨·声震百里）：铁塔寺前，与铁塔南北相对。明万历九年（1581）济宁道龚勉集资建成——原名为&quot;钟楼&quot;，悬大铜钟一口。声远楼为两层砖木结构，下层砖砌，上层木构，歇山卷棚顶。楼内铜钟重1.5吨，声震百里——明万历年间每逢重大祭祀活动，撞钟三声，济宁城内皆能听闻。楼上原有匾额&quot;声远&quot;二字，为龚勉手书——此楼与铁塔、太白酒楼并称&quot;济宁三胜&quot;。南池（王母阁湖·任城古八景&quot;南池荷净&quot;）：古任城南护城河旁。唐代大诗人杜甫游南池，有&quot;秋水通沟洫，城隅进小船&quot;之诗——证明唐代护城河（今越河）与南池相通，可通航小船。清代康熙年间南池为济宁著名园林——池广数十亩，广植莲藕，夏秋荷香四溢。今为城市水景公园——面积约80亩，湖心有王母阁，沿岸有荷香亭、杜甫雕像。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌济宁铁塔寺文保员老刘（70岁）：&quot;我守了铁塔30年——这个塔有个怪现象：每年农历五月二十日前后，铁塔周围的温度会比别处低1-2度。我查了县志，说那天是鲁班的生日——当年铸塔鲁班显灵点拨工匠的日子。我在塔底下埋了温度计测过——确实低，说不清为啥。2008年汶川地震时，铁塔晃得厉害——塔顶的铜铃响了整整三分钟，我当时就在塔底下，心都悬到嗓子眼。&quot;\u003cbr\u003e▌太白楼守楼人王师傅：&quot;太白楼下面是明代城墙——三丈八尺高的砖石城墙。我年轻时修楼，往下挖地基，挖了两米深全是明砖城砖——砖上有&#x27;洪武三年造&#x27;的戳记。我爷爷说抗战时城墙被日本兵拆了一段修碉堡，后来碉堡也没了，只剩太白楼还立在城墙上。现在游客不多，大多是老头老太太遛弯的。我每天擦李白雕像的胳膊——那地方被游客摸得发亮。&quot;\u003cbr\u003e▌河道总督府遗址公园散步的赵大爷：&quot;这里原来是清代直隶河道总督衙门——管着黄河、大运河、永定河、海河水系，官居从一品，比济宁知府还大。我小时候这府衙门改成了济宁一中的校舍，我在这儿上的初中。我当年坐过的那棵老槐树还在——比我记忆中又粗了一圈。旁边那块&#x27;河道总督府遗址&#x27;的石碑，文革时被推到了河里，80年代才捞起来。&quot;\u003c/p\u003e"}, {"n": "郓城老城·水浒故里·好汉七十二", "s": "郓城", "p": "山东", "w": "鲁成公4年筑郓·水浒好汉城·宋江武校·唐塔水浒一百单八将，七十二名在郓城·全国武术之乡——郓城始建于鲁成公四年（前587），鲁国筑城名郓，近2600年。《水浒传》宋江、晁盖、吴用、李逵的故事都发生在这里。清末民初城墙底宽1.8丈、顶宽1.2丈、高2.5丈、周长3.3华里——1947年刘邓大军攻克郓城后，城垣被拆除。现存郓城文庙（明代）、七级唐塔（五代后唐）、水浒好汉城、宋江武校（全国十大武校之首）。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e鲁成公四年（前587）：鲁国筑城名郓——郓城得名之始，近2600年。南北朝至唐贞观八年（634）：郓州治所驻旧县城（今城东张营乡张营村）——740余年。隋开皇十年至唐贞观八年（590-634）：郓州设总管府、都督府，统郓、濮、兖、戴、曹5州30县。唐贞观八年（634）：郓州治徙须昌（今东平）。金大定六年（1166）：黄河泛滥，旧县城沦没，徙盘沟村建新县城——即今郓城老城。金大定六年（1166）至今：县城位置稳定——850年未挪。清末民初：城墙底宽1.8丈、顶宽1.2丈、高2.5丈、周长3.3华里——设四门（南迎薰、东通济、北拱极、西安澜），四隅炮楼，东城墙南段魁星楼。城内18条街巷：育贤街、文献街、武安街、英贤街、平政街、油坊街、指南巷、豆腐巷等。1939年：动乱波及郓城——城墙遭严重破坏。1946年：郓城县民主政府为防国民党据城固守——组织民工将城垣、城楼、炮楼拆除，只剩城墙根。1947年：国民党五十五师再踞郓城，筑城墙+碉堡——同年刘邓大军攻克，城垣碉堡全拆。1949年后：县城向四周扩展——60-70年代向南，80年代向西西北。现状：水浒好汉城（4A）、郓城文庙（明代）、七级唐塔（五代）、宋江武校、县城东门街/西门街/金河路/唐塔路等街巷名沿用至今。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e郓城文庙大成殿（省文保·明代·水浒好汉城内核心文化建筑）：郓城老城内东南隅。明代建筑，下有6根圆木柱、24根石柱支撑，上有双层飞檐楼阁——红脊碧瓦，风铃叮叮。现为水浒好汉城核心景区之一——&quot;明伦堂&quot;和&quot;大成殿&quot;里展有水浒人物故事和郓城历史。文庙占地约1万平方米——据县志记载始建于北宋，明洪武九年（1376）重建，屡经修缮。1947年拆城时差点被拆，当地百姓保护下来。七级唐塔（市文保·五代后唐·古朴雄伟）：郓城老城内东北隅。五代后唐时期所建，七级古朴雄伟——因塔身斑驳、造型粗犷，当地人称之为&quot;唐塔&quot;。塔高约30米，为砖石结构——1958年大炼钢铁时，塔檐的铸铁构件被拆去炼钢，塔身残缺，但塔基稳固。现在塔旁建了唐塔广场，成了郓城的城市地标。水浒好汉城（4A景区·中华古民居博物馆·整体搬迁的明清建筑群）：郓城县城西门街。占地400多亩，36院落、72景观、108个景点——采用整体搬迁方式，将山西、陕西、浙江、安徽等地具有水浒文化特色的元明清民间建筑征集到郓城，在街区内恢复。晁家庄（托塔天王晁盖庄园，建筑面积2200㎡，城堡式，暗道+迷宫）、郓城县衙（北宋始建·重建，5400㎡）、宋江武馆、孙二娘客栈、乌龙院、及时雨茶楼、朱贵酒店、好汉城古城墙等。北方四合院与浙派徽派古建荟萃——雕梁画栋，古朴精致。宋江武校（全国十大武校之首·狗娃艺术团·状元大刀）：郓城县城水浒路西段。中国好汉之乡的标志——狗娃艺术团表演的武术舞蹈《狗娃闹春》上过央视春晚。重达200余斤的状元大刀绝技——全校师生都以能举此刀为荣。校址就在水浒好汉城内，武术教学与旅游体验深度融合。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郓城水浒研究会李会长：&quot;我研究水浒30年了——水浒里晁盖、宋江、吴用、李逵的故事，很多真的发生在郓城。宋江家乡在水堡镇——水堡镇原名宋家庄，宋江起义后改名&#x27;宋保义&#x27;，后改水堡。现在还有宋江井、宋江祖坟。黄泥冈在郓城县黄泥冈镇——当年晁盖等人劫生辰纲的地方，现在还有&#x27;黄泥冈遗址&#x27;碑。施耐庵当年写《水浒传》，很多细节都是从郓城老人们那里听来的。&quot;\u003cbr\u003e▌晁家庄管理员小张（28岁）：&quot;我每天在晁家庄里转——这个庄园是2008年从山西晋南搬迁过来的，城堡式结构，有暗道有迷宫。2016年有个游客是山西祁县人，说他家祖上就是这座庄园的主人——族谱上说庄园被卖了，但不知道卖到哪儿。他找到晁家庄，跪在庄园门口哭了半小时。我们听了都心酸——一座老宅子，承载的是两家人几百年的记忆。&quot;\u003cbr\u003e▌水堡镇宋江村老支书：&quot;宋江村全村300多户，姓宋的占70%——族谱上明确写着&#x27;起义军首领宋江后裔&#x27;。每年清明，海内外宋氏后人组团来祭祖——从美国、加拿大、台湾来的都有，每次一两百人。宋江井是村里的宝贝——据说宋江当年就是喝这口井水长大的。文革时红卫兵要填井，全村老人手拉手围着井不让填。&quot;\u003c/p\u003e"}, {"n": "梁山老城·宋江寨·会通河起点", "s": "梁山", "p": "山东", "w": "虎头峰石寨墙·前集村S形防御街巷·开河镇百步一庙·会通河起于码头水浒宋江寨虎头峰·会通河元起点·前集村明清防御式古村——梁山虎头峰海拔197.9米，北宋末年宋江聚义的大本营就在这里——明初清丈梁山，对梁山&quot;勒石山巅，垂为厉禁，归之版籍&quot;——山上建筑遭毁灭性破坏，崇祯十五年（1642）崇祯帝传旨严禁《水浒传》刻印流传。会通河元起于梁山码头（今前码头村），终点临清，全长125公里——比隋唐大运河缩短900公里。前集村明清防御式古村——S形街巷、丁字形交叉相通不相对，利于防御。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：梁山原名良山——汉梁孝王北猎良山，因改为梁山。隋大业四年（608）：隋炀帝开永济渠——东征高丽。东晋太和四年（369）：桓温北伐，开挖桓公沟——沟通泗水、汶水与济水，奠定济州河基础。元至元二十年（1283）：济州河挖通——济宁鲁桥至梁山小安山西南码头，全长75公里。元至元二十六年（1289）：会通河开挖——寿张县尹韩仲晖、边源建议，自码头为起点分梁山泺水源，经寿张、聊城125公里至临清会御河。元世祖忽必烈赐名&quot;会通河&quot;——比隋唐大运河缩短900公里，修通后北调南粮占全国税粮5/6。元至正年间：济州河与会通河衔接——码头村成为运河枢纽。明永乐九年（1411）：疏浚会通河——开河闸建立，开河镇成为运河名镇。明正德年间：《水浒传》成书刊刻——宋江寨故事流传。明崇祯十五年（1642）：崇祯帝严禁《水浒传》——对梁山&quot;勒石山巅，垂为厉禁，清丈其地，归之版籍&quot;。清初：黄河夺运——梁山泊逐渐淤为平原。清咸丰五年（1855）：黄河改道——梁山泊旧址成为东平湖平原。1958年：东平湖平原水库建成——梁山泊旧址大部分被淹。现状：宋江寨墙残段、前集村（省级历史文化名村·明清防御式古村）、开河镇（运河历史文化名镇）、大元新开会通河记事碑（县级文保）、前码头村（会通河起点）、水泊梁山风景区（4A）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宋江寨寨墙（虎头峰·北宋·石砌寨墙残存）：梁山主峰虎头峰上——虎头峰海拔197.9米，山势呈三角形，东、西、南三面危岩壁立，峭不可攀，唯有峰北一条临涧傍崖蜿蜒山道。顶端开阔平坦约15亩。北宋末年宋江等聚义的大本营就在这里——清初寿张县令曹玉珂登梁山作《过梁山记》记述有&quot;梁山宋江寨&quot;。1985年考古队对宋江寨及寨内建筑遗址考古——发掘出筒瓦、板瓦等古代建筑材料，经鉴定为汉代皇宫建筑材料——宋江上梁山时这里已有建筑物。寨墙依山脊修筑——块石垒成，底宽约2米，高约1.5米，南临悬崖边缘，东西北三面各有两重石墙，只有北门一门。因年代久远大部分倒塌，个别地段存残段——从内墙看不高，从外墙看高达2米。宋政和中（1111-1117）宋江&quot;保据于此&quot;，明崇祯十五年（1642）崇祯帝禁《水浒传》，对梁山&quot;勒石山巅，垂为厉禁&quot;——山上建筑遭毁灭性破坏。前集村（省级历史文化名村·明清防御式古村）：水泊梁山风景区南麓，与水浒前寨仅一涧之隔——刘家大院为明清官宦世家，前集村村民多为明末清初由梁山忠义堂旧址迁来的义军后人。村落在防御设计上独具匠心：&quot;S形街&quot;、&quot;丁字形交叉胡同，相通而不相对&quot;——外敌入侵时，难以长驱直入，处处遇阻，村落内部可通过交错胡同迂回旋转，对敌形成迂回包围。刘家大院为三进四合院，带看家楼（明崇祯年间建，高10米，青砖灰瓦，砖雕精细）——现为省级历史建筑。开河镇（运河历史文化名镇·元代置闸·明清繁盛）：县城东南26公里，运河穿村而过——元代置开河闸，设开河驿，明清设开河镇，是运河上的重要漕运枢纽。乾隆每次下江南都在开河停靠上岸驻留——当地人曾有乾隆亲笔题写的字匾。开河镇因繁盛建有围墙，设四门，又在丁字形大街三面建了三个哨门——阁楼下门洞深广、铁门启闭有时。镇上店铺林立：粮行、油坊、当铺、药铺、旅店、酒店、茶馆、餐馆等二十余家。荣氏家族&quot;德兴&quot;银号的纸币可在周围六个县及济宁州流通——开河镇被称为&quot;百步一庙&quot;，关羽庙就有五所，古庙址二十余座。大元新开会通河记事碑（县级文保·元至元二十六年·龙头龟座）：前码头村东北侧地下，1996年县文物普查时发现，2002年试掘，2003年公布为县级文保。碑高2.68米，碑文26行，满行71字——翰林直学士杨文郁撰文，礼部尚书张孔孙书丹，兵部郎中李处巽撰额。碑文详细记载会通河开挖的背景、用工、用料及全过程——会
