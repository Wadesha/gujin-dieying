在花园镇城子后村南之&quot;魏王城&quot;遗址，此地为治所近800年，曹操曾设乐陵郡，&quot;魏王城&quot;由此得名。\u003cstrong class=\"hl\"\u003e北魏永平二年（509）前后，乐陵城迁至庆云三汾水一带\u003c/strong\u003e；唐代再迁至西段乡张元标村（近汉重合城）。\u003cstrong class=\"hl\"\u003e明洪武二年（1369），县丞何恒因老县城地势低洼，迁县治于富平镇（今乐陵城区）\u003c/strong\u003e，并建文庙。明正德年间，知县许逵修城&quot;高两丈八尺、阔二丈&quot;，加筑砖垛、窝铺、敌楼，战乱中乐陵屡攻不破，得&quot;岩邑&quot;之称、享有&quot;不陷城&quot;名声。明清以降，乐陵文风鼎盛，史氏一门七进士、父子三进士传为美谈。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e乐陵地处鲁北枣乡，花园镇田野上魏王城夯土残垣断续相连，城里开元路文庙大成殿飞檐重拱，沿津滇公路两侧千年枣林绵延如海。一座乐毅择陵筑城、以金丝小枣闻名的老县。\u003c/p\u003e\u003cp class=\"main-text\"\u003e魏王城遗址（战国乐毅筑，秦至北魏县治）：花园镇顾家村北田野间，长约七百二十米、宽约四百二十米，南、北、东三面残垣断续相连，墙高二至三米，西墙破损较甚。相传战国燕将乐毅伐齐时筑城屯兵，秦置乐陵县治此，两汉四百余年为县郡治所，因曹操曾于此设乐陵郡、其子曹茂封乐陵王而俗呼魏王城。；乐陵文庙（山东省文保）：市区开元路，明洪武二年与迁城同期创建，现存大成殿、东西厢房、崇圣祠，大成殿面阔五间、单檐庑殿顶，斗拱飞檐，为江北现存规模较大、保存较完整的明初文庙之一。抗战初期中共冀鲁边区特委曾在此召开会议。；岩邑城墙遗事：明正德年间知县许逵筑城，加砖垛窝铺敌楼，战乱中屡攻不破，“岩邑”“不陷城”之名流传。今城墙虽无存而故事传世。；金丝小枣之乡：乐陵为金丝小枣核心产区，千年枣林绵延如海，乐陵小枣向为贡品名产。；五里冢遗址（省文保·龙山至周）：城西南五里中街道五里冢村北，台形高地长八十三米、宽三十一米、高二点三米，文化层叠压汉与龙山两层，出土鹿角锄长约五十厘米、石镰石斧蚌器陶鬲陶环陶纺轮、鹿骨卜骨、晋代五铢钱，1977年公布为乐陵首个省保，2025年辟为省级考古遗址公园。；惠王冢遗址（省文保·新石器夏商）：杨安镇关庙李村，堌堆高地高出四周地表，采集龙山至商代陶片、蚌器，与夷王冢、三女坟、二冢子、三冢子同列乐陵汉魏前古墓葬群，1977年公布省保。；奎台大佛寺遗址（省文保第六批）：郑店镇奎台村，隋唐大佛寺故址，原寺殿宇已圮，台基夯土尚存，地表散落唐代砖瓦片、佛像残件，2022年列入山东省第六批省保。；三女冢（战国末西汉初）：花园镇王母店村，传为魏公子毕仲之墓，三冢并封，出土战国末西汉初铜器陶器，与魏王城、王母殿同属乐陵早期城邑遗址群。；董养性墓（明）：朱集镇董家村，明末清初著名学者董养性墓葬，原墓前有石人石马石碑，封土尚存，董养性著《四书订疑》《易订》行世，为乐陵明清学者代表。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌城子后村老人 郑大爷（74岁）：\u003cbr\u003e&quot;村南那片土城圈子，就是&#x27;魏王城&#x27;，秦朝到南北朝一直是乐陵县城，驻了将近八百年。土墙还有两米多高，宽能跑车。老人说曹操在这儿设过郡，所以叫魏王城，2022年还有人出书写它呢。&quot;\u003cbr\u003e▌乐陵文史老人 苏叔（70岁）：\u003cbr\u003e&quot;咱乐陵最出名的是&#x27;五城四迁&#x27;，从秦到明朝搬了五次家。明朝正德年那知县许逵，把城墙修到两丈八尺高，守城守得死死，朝廷封它&#x27;岩邑&#x27;。老城几移，可文庙从洪武二年建起就没挪过窝。&quot;\u003c/p\u003e"}, {"n": "平阴老城", "s": "平阴", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e平阴县城始建于东汉，土筑城墙\u003c/strong\u003e，唐、宋、元历代四次修筑，旧城周长625丈、高1.8丈、宽1丈，设四门，护城河深1丈、宽2丈。隋开皇十四年（594）置榆山县、大业二年（606）改平阴县，唐代以来建置相沿。\u003cstrong class=\"hl\"\u003e唐、宋时城内已有东关、西关与南北门6条街巷\u003c/strong\u003e，商旅渐兴。\u003cstrong class=\"hl\"\u003e明万历九年至十一年（1581-1583），因黄河改道、城坍水患，知县张性成创修石城\u003c/strong\u003e，周长三里许，以石为基、以砖为垛，建城门楼4座、腰铺8座、角楼4座、巡更4座。城内南北大街三道形如川字，故得&quot;锦川城&quot;之号；清乾隆三十五年（1770），四门改额为东瞻泰、西抚榆、南仰圣、北拱宸。清末民初，城内店铺40余家，山西、长山、周村、邹平等地客商云集。\u003cstrong class=\"hl\"\u003e1952年，因旧城地势低洼、屡遭水患，平阴城址整体东移1公里建新城\u003c/strong\u003e，老城渐废。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e平阴地处黄河南岸、泰山余脉西麓，县学文庙碧瓦红墙立于府前街北端，棂星门与盘龙石柱尚存宋代遗意，城东南胡庄村尖山哥特式教堂与村内罗马式双塔隔水相望。一座锦川石城、玫瑰之乡。\u003c/p\u003e\u003cp class=\"main-text\"\u003e平阴县学文庙（山东省文保）：县城府前街北端，济南现存唯一县学文庙，北宋元符至大观四年始建，坐北朝南中轴线对称，占地近两万平方米，“前庙后学”格局。现存棂星门、泮池、大成门、大成殿、明伦堂，大成殿面阔五间、重梁起架、歇山九脊顶，正面六根八棱高浮雕盘龙石柱，工极精。2025年棂星门、大成门修缮竣工。；锦川城格局遗存：城内南北三道大街形如“川”字的旧格局，与锦川城名互为印证，老街地名多存明代遗意。；东阿镇（明洪武八年迁治）：旧东阿县治，五城门古镇，明代内阁首辅于慎行故里，于林墓园松柏森森。古镇又是阿胶传统制作核心产区。；高路桥·孔子弟子高柴故里：相传孔子七十二弟子之一高柴故里在此，古桥与祠祀遗风流传。；胡庄天主教堂建筑群：安城乡胡庄村，村内圣母无染原罪堂为罗马式双塔建筑，村北尖山顶上露德圣母堂为哥特式风格，红瓦黄墙、塔尖高耸，与上海佘山、吉林江南圣母堂并称全国三大天主教圣地。；翠屏山多佛塔（国保·唐始建明重建）：玫瑰镇王桥村翠屏山顶，八角十三级石塔，高十九点七米，塔底周长十八点五米，每层四面辟佛龛嵌唐代立雕石佛，原一百零四尊现存八十八尊，大者高一点一米，塔顶置明嘉靖六年铸铁宝瓶刹。唐贞观四年始建，现存塔为明嘉靖元年原址重建。；云翠山南天观建筑群（省保·元明清）：洪范池镇云翠山北麓环形山腰，道教全真派丘处机曾修炼、其弟子筑观，现存明清殿宇建筑群与国内少见的道士墓冢群，碑林中立有道教全真教世袭图碑，日月泉、悟庵洞、透龙碑旧称观中三瑰。；贤子峪建筑群（省保·明清）：榆山街道东蛮子村，沿山坡层叠而建的明清石头古村，石屋石巷石墙依地势错落，2015年公布省保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌平阴老城居民 陈大娘（72岁）：\u003cbr\u003e&quot;1952年搬到新县城时候我还小，老城那三道南北大街，走起来像&#x27;川&#x27;字，所以老祖宗叫它锦川城。文庙还在老城那，石头城墙、石基砖垛，可惜现在只留下文庙一处老房子了。&quot;\u003cbr\u003e▌文庙看护人 郝师傅（68岁）：\u003cbr\u003e&quot;老城是明朝张老爷创修的石头城，周长三里多，四个城门楼、八个腰铺。后来黄河老闹水，城里发了大水，这才把县城往东挪。文庙的老梁老柱还在，那是锦川城留给咱的宝贝。&quot;\u003c/p\u003e"}, {"n": "商河老城", "s": "商河", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e唐武德四年（621）始建内城墙\u003c/strong\u003e，椭圆状、周长3里，四面砖瓦城门楼。明成化二年（1466），拆旧建新，内城墙高2丈、厚1.5丈。\u003cstrong class=\"hl\"\u003e明弘治十三年、万历九年、乾隆五十九年三次大修\u003c/strong\u003e，最后一次（乾隆五十九年）耗银34377两，修后内城周长535.95丈、高1.8丈，城门8扇铁叶包钉，设水簸箕26道、排墙4堵、砖10层、垛墙360堵、炮台4座。\u003cstrong class=\"hl\"\u003e明正德六年（1511），始建外城墙，周长9里、高2.2丈、阔1.4丈\u003c/strong\u003e，嘉靖二年重修改为四门（东育物、南来薰、西阜民、北镇武），万历六年加筑，崇祯四年增外四门堑板。1927年，修补东城门楼；1945年后部分城墙随城市改建渐失，1960年后大段推倒铲除。县人民公园西北角尚存唐武德始建的城墙基址，2009年曾作复原展示。那座内外两重、嘉靖二年四门改额（育物、来薰、阜民、镇武）、乾隆五十九年耗银34377两大修的古城，如今只有人民公园西北角一段唐武德基址可寻。文庙大成殿与福胜寺大士文佛亦已无存，唯&quot;摩天岭&quot;之名还记着这鲁北古城曾踞高自守的雄姿。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e商河地处鲁北平原高地，旧有摩天岭之称，水患时独得庇护。县人民公园西北角残存一段唐代夯土城墙基址，外城明正德土城与内城唐武德砖城套合。一座内外两重、鲁北少有的高阜古城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城墙基址（唐武德四年始建）：县人民公园西北角，唐武德四年筑土城，明万历九年易土为砖，城周四里、四门题额明晖、镇远、承恩、拱辰。今残存夯土基址一段，长约五十米、宽约十五米、残高约一米半，2009年复原供人凭吊。；杨虚故城、古县城摩天岭：商河城地处鲁北平原高地，旧有摩天岭之称，水患时独得庇护，为平原上少有的高阜城。；梁王冢遗址（省文保·商周至汉）：郑路镇梁王冢村西北三百米，堌堆高地高出四周平地，文化层厚，为黄河以北冲积平原少有的保存较好商周至汉代遗址，2013年公布山东省第四批省保，2016年启动保护工程。；小官庄汉墓群（省文保·汉）：韩庙镇小官庄村，五座汉墓排列，俗称大冢、磨冢、平冢、信家冢，其中最大一座长宽各五十余米、高五米，封土上松柏成林，为鲁北大型汉墓群。；东温桥遗址（省文保·商周）：玉皇庙镇东温桥北，面积约四百乘六百米，1960年代水利施工在地下三米处挖出砖墙体、青铜器皿、夹砂红陶灰陶器豆陶鬲，纹饰绳纹篮纹，为先商文化沿滳河入境处。；耿家冢（代王墓，省文保·东汉）：怀仁镇耿家村东北二百米，封土高约五米、占地三千三百余平方米，松柏槐柳丛生，传东汉代王墓，1996年县保、2013年升省保。；白集村老清真寺（明万历）：张坊镇白集村，回族白氏兄弟明万历年间自南京北迁建寺，大殿砖木起脊，院内古柏数株，历次重修碑嵌壁，为商河现存最早清真寺。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e福胜寺遗风（相传东汉建）：明正统十一年重修，永乐年间曾铸大士文佛，寺与铜佛皆毁于二十世纪后半叶，现仅存一佛手指藏县文管所，原址南部辟为革命烈士陵园。；滴水镇、县公署故迹：明洪武二年重建的县公署，明末毁、清初复修，老地名追忆明清县治旧观。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌商河老住民 秦大爷（73岁）：\u003cbr\u003e&quot;咱老城有内外两层墙，内墙是唐朝修的椭圆城，外墙是明朝9里的大土城。老辈说乾隆五十九年那次大修花了三万四千多两银子，城门八扇都是铁叶子包着。现在只剩公园角上那截老墙根了。&quot;\u003cbr\u003e▌公园墙根下纳凉老人 王奶奶（70岁）：\u003cbr\u003e&quot;商河话里讲&#x27;摩天岭&#x27;，就是咱这城地势高，海拔20米，发大水四乡都淹了，就城里没事。小时候还在城墙上跑着玩，后来推了盖房，可惜了那一圈老城墙。&quot;\u003c/p\u003e"}, {"n": "临邑老城", "s": "临邑", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e春秋战国时期，今临邑一带称&quot;犁邱&quot;\u003c/strong\u003e，为齐大夫隰朋与犁弥的采邑之地。宋武帝时，侨置临邑县（侨治在济阳曲堤镇）。\u003cstrong class=\"hl\"\u003e宋建隆元年（960），因水淹，临邑县治迁往孙耿\u003c/strong\u003e。\u003cstrong class=\"hl\"\u003e宋元丰六年（1083），再北移三十余里建城（即今临邑县城）\u003c/strong\u003e，自此定居至今940余年。宋建隆三年重筑城墙，周九里、高1.9丈、池深1.2丈。元代至元年间县尹田寿、明代天顺刘文、成化王启相继修城；正德年间县丞高爵增修，知县郭郁重建南北城门并建谯楼，四门题额：东迎旸、西南薰、西告成、北来苏。\u003cstrong class=\"hl\"\u003e明万历七年（1579），知县冯思恭尽易以砖，用砖计二千五百有奇\u003c/strong\u003e，县丞王执中又在壕外植树。清顺治九年（1652），知县陈起凤重修，改门额为东连沧海、南瞻泰岱、西建燕赵、北拱宸极。1954、1970年，城墙陆续被填湾夷平，古城成为历史。宋元丰六年所建、经宋元明清屡修、万历七年尽易以砖（用砖二千五百有奇）、顺治九年四门改额（东连沧海、南瞻泰岱、西建燕赵、北拱宸极）的临邑古城，1954、1970年先后被填湾夷平。今寻旧城，唯见西关村的水湾与&quot;来禽馆&quot;书香，还在那儿守着940年的城根。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临邑地处鲁北，今城始筑于宋元丰六年，西关外护城河段仍存水面，邢侗公园内来禽馆帖十九方刻石按序嵌壁。一座犁邱古地、以明代书法大家邢侗闻名的老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e西关村（宋元丰六年随城而兴）：临邑西关历史可上溯宋元丰六年迁城之时，四面环水、东邻护城河，村存邢记驴肉等老商号，为古城西门外旧市。；护城河旧影（西关）：城西护城河段尚存水面，与宋建隆三年凿池的记载相印证。；邢侗故里遗风：邢侗（1551至1612）字子愿，官至陕西行太仆卿，与董其昌并称南董北邢，又与董其昌、米万钟、张瑞图并称晚明四大家。；曹冢汉墓（省文保·汉）：曹冢村北，汉魏封土墓冢高约五米、占地数千平方米，周围散见汉砖瓦与五铢钱，2013年列入山东省第四批省保。；邢侗墓（省文保·明）：临邑县境，明万历书法家邢侗葬处，与县城邢侗公园来禽馆隔城相望，墓前神道碑、石马尚存，邢侗与董其昌并称南董北邢。；石家清真寺（省文保·清乾隆四十年）：临南镇石家村，清乾隆四十年经师常杰主持修建，占地二千七百零四平方米，礼拜殿木框架砖结构、面阔宏大，可容千人礼拜，殿内壁画彩绘与中式木构交融，为临邑境内唯一保存完好的古代民族建筑。；蔺氏宅院（省文保·明清）：理合务镇大蔺家村，明末蔺尔琦所建青砖宅院，现存东西两处院落、建筑面积八百余平方米，砖混结构，为德州境内保存最完整最古老的明代民居群，大蔺家村入选省级传统村落。；龙泉寺丈八佛（明洪武十年·汉白玉）：原德平镇西南隅龙泉寺内，明洪武十年立，大理石雕立姿佛像高一丈八尺，丹唇金身，1937年寺为日军所焚，佛像幸存，现由临邑县文化馆珍藏。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e邢侗纪念馆（原来禽馆旧址）：县城关邢侗公园内，明万历年间邢侗辞官后于城内筑泲园、建来禽馆读书处。原馆抗战时毁，1986年动工三年重建，因新建与旧制不符改名邢侗纪念馆，1992年开放，启功题匾。《来禽馆帖》八帖十九方刻石按序嵌于正殿壁上，其中《唐人双钩十七帖》被推为明刻之冠。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临邑西关居民 刘大叔（71岁）：\u003cbr\u003e&quot;咱西关村是跟着元丰六年建的城一块儿起来的，四面环水、东边就是护城河。老城墙上原来四个城门，万历年间全换成砖的，用了两千多块大砖。后来1954年、1970年填河平墙，老城就没影了。&quot;\u003cbr\u003e▌邢侗故里后人 张老师（66岁）：\u003cbr\u003e&quot;邢侗是咱临邑的大书家，&#x27;来禽馆&#x27;就在西关，他写的字，北京城里的大人物都夸。老辈人讲，邢侗小时候就在护城河边练字，磨秃的笔杆子一大堆——所以咱这城不光有石头城墙，还有一脉书香。&quot;\u003c/p\u003e"}, {"n": "薛城老城", "s": "薛城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e夏朝，车正奚仲受封于此，创制车辆\u003c/strong\u003e；商朝，左相仲虺封于此地。\u003cstrong class=\"hl\"\u003e战国时期，田婴、田文（孟尝君）父子封于薛\u003c/strong\u003e，田文大规模增筑薛城，城分内外两重，薛城之名由此而盛。薛国故城外城呈不规则形，东西3公里、南北2.2公里，城墙总长10615米、残高4-7米，设大城门6座，战国时基本形成；内城周长2750米，延续周、春秋薛城旧制至汉代。毛遂为薛地人，自荐为赵国平原君门客、促成&quot;毛遂自荐&quot;典故。\u003cstrong class=\"hl\"\u003e明洪武二年（1369），设临城驿\u003c/strong\u003e，明代万历十三年《滕县志》载临城遗址&quot;县南七十里临山，周四里&quot;，相传为临王官家所筑。清乾隆年间，临城已成滕县、峄县间重镇，京沪铁路开通后临城为沿线大站，民国年间设临城县、薛城县，1962年建薛城区，临城即今薛城治所。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e薛城地处鲁南滕薛平原，官桥镇田野间薛国故城夯土城墙绵延六公里余，东北孟尝君陵与城北毛遂陵拱卫城内，皇殿岗高地相传为薛国君宫室基址。一座孟尝君封地、现存最完整的先秦古城之一。\u003c/p\u003e\u003cp class=\"main-text\"\u003e薛国故城遗址（第三批全国重点文保）：滕州市官桥镇、张汪镇间，西周始建、战国田婴田文父子扩建，城分内外两重，外城不规则形，周长约十公里余，夯土城墙残高四至七米、底宽二三十米，夯层夯窝清晰，城门五座。城内皇殿岗高地相传为薛国宫室基址，城东北有孟尝君陵园，城北门外有毛遂陵园（1991年重修，青砖灰瓦小院）。；皇殿岗·薛公台冶铁遗址：薛城西北汉代冶铁遗址，反映薛地冶铁之盛的工商业基础。；奚仲庙、薛国太庙宗庙故址：为纪念造车始祖奚仲与薛国宗系而建，庙址与造车典故流传。；前掌大商周薛国贵族墓地：官桥镇前掌大村，薛国高等级贵族墓地，出土青铜器、玉器丰富，是研究商周薛国社会的重要遗存。；毛遂故里与墓址：毛遂为薛人，自荐典故传世，其墓在古城北门外京沪铁路旁。；南常故城（春秋古城）：西汉建阳侯国都邑，出土汉代环首铁刀、龙山陶片、饕餮纹瓦当。；临城故址（明临城驿）：明洪武二年设临城驿，为临城（今薛城）之名所自。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌薛国故城村老农 魏大爷（72岁）：\u003cbr\u003e&quot;咱这土城墙可长了，东西三里、南北二里多，城墙根还有四五米高，能看出夯土的印子。老人说这是孟尝君修的城，还给毛遂、奚仲都在咱这儿立过庙——宋国、薛国多少代王侯都埋在这一带。&quot;\u003cbr\u003e▌前掌大村老人 孙婶（67岁）：\u003cbr\u003e&quot;前掌大老早挖出不少青铜器、玉器，是薛国贵族的坟。我们小时候锄地常碰上陶片。村边那&#x27;瓮上土墩&#x27;，老人说就是老城的北门遗址，汉朝还有个建阳侯国在这。&quot;\u003c/p\u003e"}, {"n": "莒南老城", "s": "莒南", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e西汉置高乡县，为今莒南一带治所\u003c/strong\u003e；东汉建武十三年，光武帝封刘坚为高乡侯。古城西门城楼曾镶&quot;高乡故址&quot;石匾，1938年毁于动乱。\u003cstrong class=\"hl\"\u003e南宋咸淳元年（1265）前后，蒙古昭勇大将军重喜奉旨筑十字路城、设兵驻守\u003c/strong\u003e；至元二十二年（1285）庆绪移镇于此。明嘉靖《青州府志》载&quot;十字路&quot;为莒州二镇之一；\u003cstrong class=\"hl\"\u003e明初于此设巡检司\u003c/strong\u003e，主司治安，至1913年裁撤、先后历45任巡检。民国十八年，莒县公安局于十字路设分局；民国二十二年（1933），重修十字路城墙，四角设炮台，东西南北四城门楼，南北设拐头门，东西街于十字路口错位呈ㄣ形。1948年，莒南县政府定驻十字路，十字路成为莒南县城。1933年重修、墙高9米、底8米、四角炮台、四城门楼、南北拐头门、东西街错位成&quot;ㄣ&quot;形的十字路城墙，与大戏楼（清乾隆三十八年山西当铺商人出资建、历时十年、长宽高均20米、上下两层、1979年拆毁）等，今均无存，唯镇中路八百年的街市气息与庄氏庄园的围墙炮楼遗址仍在。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e莒南地处鲁东南沂蒙山前，十字路镇中路自宋金以来八百年商市未断，大店镇庄氏庄园青砖瓦屋四合院连片，1945年山东省政府即在四余堂内成立。一座高乡故治、商街与庄园并存的县城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e十字路镇中路（八百年商街）：县城十字路街道，宋金时因东西南北两条大道十字相交得名，明设城墙四门，清代康乾年间大戏楼、西街商市繁盛。镇中路南门内大街保留旧市格局，是莒南建城的市井根脉。；大店庄氏庄园（全国重点文保）：大店镇，明初庄姓夫妇迁此，明清两代科第连绵，堂号鼎盛时百余家、有名者七十二堂号。庄园前堂后室四合院，青砖瓦屋五千余间。现存居业堂、四余堂两处院落，1945年8月13日中国共产党领导的第一个省级人民政府山东省政府在四余堂宣告成立，八路军一一五师司令部驻居业堂。；庄氏庄园围墙（清道光二十年建）：围墙周匝数里，下砌条石，四门双层门洞、隔距设炮楼，西门外为兴福寺，墙内深宅大院、暗道相通。；十字路老城墙遗址与六庙旧迹：城隍庙、关帝庙、玄帝庙、三官庙、观音庙、关爷楼六庙遗名，及1933年重修城墙的昔年雄姿，多存于老地名。；薛家窑遗址（省保·龙山文化）：大店镇薛家窑村西北约一点五公里，面积约十三万平方米，文化堆积厚约一点一米，断崖上暴露灰坑，为龙山文化黑陶产地，1977年曾出土大量史前黑陶，薛家窑泥陶技艺至今相传不绝。；向国故城（省保·周汉）：大店镇许家滩井子村南，周代向国都城，东西约三千米、南北约二千五百米，城址地表高出平地零点五至一米，整地翻土常出陶片与铁、铜器、残砖碎瓦，当地西南台子至今呼作城头、北小官庄村犹称城西关。；城子遗址（省保·周汉宋）：涝坡镇，周、汉、宋三迭压古聚落遗址，文化层上下延续两千余年，2013年公布省保。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e高乡故址遗韵：西汉高乡县治所故地，东汉封高乡侯，十字路古城西门城楼曾嵌高乡故址石匾，1938年毁于日军炮火，旧名仍在方志与地方记忆中流传。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌十字路镇老人 孟大爷（73岁）：\u003cbr\u003e&quot;老城墙是民国22年重修的，高9米，四个城门楼，东西街在十字路口故意错开，成个&#x27;ㄣ&#x27;字，老辈子说这样能挡煞。镇中路唱戏的大戏楼，当年山西老财出钱盖的，盖了十年，1979年拆了，可惜。&quot;\u003cbr\u003e▌大店庄氏后人 庄叔（70岁）：\u003cbr\u003e&quot;咱庄家是明初迁来的，万历年间先人中了进士，跟袁崇焕同榜。最盛的时候72个堂号、房子5000多间，围墙一圈5公里，一里地一座炮楼。现在庄园的老房子、墙基还有好些，走进来还能觉着当年的阔气。&quot;\u003c/p\u003e"}, {"n": "邳州老城", "s": "邳州", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏代奚仲封邳国（左沂水右泗水）。金宣宗兴定五年（1221）移治今邳城镇，夯土筑城。明洪武年间砖砌城西北、东南两隅，加建西门。康熙七年（1668）郯城大地震，同年黄河决口，旧州城被淹，史称“一夜沉旧州”。康熙二十八年（1689）在洪福山前再造新城，城作东南弯、西南弯，俗称荷包城，开先春、来薰、迎爽、拱极四门。1954年县治迁运河镇，邳城回归为乡镇。现状：邳城镇仅存不足十米残土墙（邳中学校门西侧）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到邳城镇，第一眼是洪福山前那片清代新城的老街骨架——旧城门名字还挂在路口，城的轮廓因东南弯、西南弯被当地人叫成荷包城。镇里现存的不过一段不足十米的残土墙，藏在邳中学校门西侧；真正的重头在镇外土山，一座明天顺年间的关帝庙压在山头，三路四院一百多间殿宇顺着山势铺开，山脚下明清老街的青石板还连着圩河。\u003c/p\u003e\u003cp class=\"main-text\"\u003e土山关帝庙（省保·明天顺三年1460）：土山镇老街北、依土山而建，座北朝南，三路四院一百余间，关帝殿、戏楼、钟鼓楼、马迹亭沿中轴排开，筒瓦屋面压着龙吻吞脊。庙门前一对青石对狮一雌一雄，雄狮踏绣球、雌狮偎幼狮，狮面风化但轮廓尚整。山顶马迹亭为六面三层砖木结构，高约十八米，亭周石灰岩马蹄印长约一尺、深寸许，旁卧玄武岩磨刀石一块、长四尺许，石面凹槽状磨损痕迹至今可辨；亭东存拴马桩石质基座。崇祯、雍正、道光、民国四次大修，二〇〇五年第五次大修后重放明清面貌，是江苏现存规模最大、保存最完整的关帝庙。《三国演义》“屯土山关公约三事”就发生在这一带。；土山明清老街：山镇依圩河而建，街面青石板铺地，魏家布庄、沈家大院、浴德池等明清店面与民居连片，风车形路网从圩河四门桥向心收拢。；圯桥遗址：邳城镇北，传为秦末张良遇黄石公进履处，旧桥已不存，今存桥址与进履碑。；大墩子遗址（国保·第六批）：四户镇，大汶口文化聚落，新石器时代，地层叠压清晰。；梁王城遗址（国保·第七批）：戴庄镇李圩村，春秋战国苏北最大城址，城墙高出周围农田一至二米，平面近长方形，面积百余万平方米。地表散落春秋陶片与战国瓦当，地层自大汶口延续至宋元，田埂断面可见夯土层与灰土层层叠压。；刘林遗址（国保·第七批）：大汶口文化墓地，与大墩子同期。；寨山摩崖石刻（省保）：燕子埠镇寨山，清康熙七年六月十七日郯城大地震摩崖，丙午举人雷亨坤书、住持道士栗教成勒，全国唯一现存地震灾害摩崖。石刻就山崖面镌字，字口经三百余年风化已漫漶斑驳，石缝间杂草从刻痕缝隙生出；今建保护亭遮蔽，碑面覆玻璃防尘。；煎药庙西晋墓地（省保·第八批）：新河镇陈滩村煎药庙，九座带斜坡墓道前后室砖室墓，全国唯一未被盗西晋贵族墓群。墓砖青灰色、纹路规整，一墓门墙砌砖阴刻“下邳国县建忠里谋显伯仲伯孝伯”，砖铭字迹尚清晰；出土鹦鹉螺杯、玻璃碗等三百余件，墓室券顶砖缝间仍可见白灰勾缝痕迹。；大墩子遗址（国保·第六批）：四户镇，大汶口文化聚落，新石器时代，地层叠压清晰。；梁王城遗址（国保·第七批）：戴庄镇李圩村，春秋战国苏北最大城址，城墙高出周围农田一至二米，平面近长方形，面积百余万平方米，地层自大汶口延续至宋元。；刘林遗址（国保·第七批）：大汶口文化墓地，与大墩子同期。；寨山摩崖石刻（省保）：燕子埠镇寨山，清康熙七年六月十七日郯城大地震摩崖，丙午举人雷亨坤书、住持道士栗教成勒，全国唯一现存地震灾害摩崖，现建保护亭。；煎药庙西晋墓地（省保·第八批）：新河镇陈滩村煎药庙，九座带斜坡墓道前后室砖室墓，全国唯一未被盗西晋贵族墓群，出鹦鹉螺杯、玻璃碗，墓砖刻“下邳国县建忠里谋显伯仲伯孝伯”。。\u003c/p\u003e", "c": ""}, {"n": "淮安府城·淮安区", "s": "淮安", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e东晋义熙年间始筑淮安旧城，世称“铁打城墙”。明嘉靖三十九年（1560）筑夹城（玉带城）连贯新旧二城，三联城格局成形：北端新城、中段夹城、南端旧城。同治三年（1864）筑清江浦城，开五门及水门；1952年拆除铺为环城路。现状：旧城棋盘格局完整，府署、镇淮楼、漕运总督署遗址尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e从镇淮楼脚下起步，老城是一条南北贯通的中轴：楼下拱形门洞还在拱着南北大街，向北依次走过漕运总督署遗址公园、中国漕运博物馆，再向北便是淮安府署。几处国保压在一条线上，旧城棋盘格局未动；城墙只剩淮安师范旁那一段四百来米的“城墙堆”还森然立着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e镇淮楼（省保·南宋）：旧城正中鼓楼岗上，底层石砌基台正中开拱形门洞，东西两侧设方砖踏步，台上两层砖木楼阁重檐九脊，楼顶四角龙头翘起、双目圆睁大口吞云。拱洞砖石墙面经八百年人行车碾，门洞内壁磨出浅凹；楼内现置大鼓三面、钟一口，自古为淮安城的标志。；总督漕运公署遗址（世界遗产·国保）：镇淮楼北、府署南，2002年施工中揭出明清大堂、二堂基址，今辟为遗址公园，北侧建中国漕运博物馆；这里曾是明清统管全国漕运的总督衙门。；淮安城墙遗址：旧城东南角及淮安师范学校旁，残存约四百米一段夯砖墙堆，墙土斑驳如土垄。砖面风化剥落，夯土层与外包城砖交界处可辨，墙缝间生枯草；是“铁打淮城”仅剩的一截。；文通塔（国保）：城东北角勺湖公园内、西临运河，唐代砖塔，原唐景龙二年建十三层，康熙七年郯城大地震后重建仅修七层，今高约二十三米。砖结构无梁柱，七层八角，黄身青檐，第六、第七两层无塔门，内部空腔，五层以上为穹窿式砖顶、顶上八角藻井；底层四面各供一佛。明清时漕船远望此塔即知抵淮，曾为运河航标。；金代铜钟（省保）：城内，金代天德间铸大钟，钟身铭文斑驳。；关天培祠（省保）：城内，祀清末鸦片战争虎门殉国关天培，享堂、厢房尚存。；刘鹗故居（省保）：勺湖边，《老残游记》作者故居，两进宅院。；梁红玉祠：北辰坊，祀南宋抗金巾帼，享殿尚存。；周恩来故居（国保）：驸马巷，清末两进宅院，东西宅院连通。；文通塔（国保）：城东北角，唐代砖塔，原唐景佑二年建，现存七层八角，斜檐砖身，与金代铜钟同处一院。；金代铜钟（省保）：城内，金代天德间铸大钟，钟身铭文斑驳。；关天培祠（省保）：城内，祀清末鸦片战争虎门殉国关天培，享堂、厢房尚存。；刘鹗故居（省保）：勺湖边，《老残游记》作者故居，两进宅院。；梁红玉祠：北辰坊，祀南宋抗金巾帼，享殿尚存。；周恩来故居（国保）：驸马巷，清末两进宅院，东西宅院连通。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e淮安府署（国保）：东门大街与北门大街交会处，明洪武三年建，沿中轴线大门、仪门、大堂、二堂、六科递进，现存房屋五十余幢。大堂东西七间、南北五间，脊高约十米，面积逾五百平方米，为全国现存衙署正堂之最；大木构架叠梁式小做法，前廊施乌篷轩，两山为悬山式五花山墙，屋顶铺青灰陶瓦而非琉璃，正脊以板瓦砌清水脊、两端置鱼吻。咸丰十年曾毁于大火、当年修复。是国内仅存两座完整古代府衙之一。。\u003c/p\u003e", "c": ""}, {"n": "徐州新沂窑湾古镇", "s": "窑湾", "p": "江苏", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e古镇卡在京杭大运河与骆马湖交汇处，三面环水，一条老街从河边码头向镇内延展。街上最打眼的是吴家大院——福建来的商人盖的院子窗高而小、天井收得紧，跟北方四合院完全两路；酱园店的甜油还在打，几家省籍会馆的门脸还对着运河。\u003c/p\u003e\u003cp class=\"main-text\"\u003e吴家大院（清康熙间）：四进院落南北深八十米、东西窄二十米，灰砖灰瓦，为福建沿海风格——窗高而小、院落紧凑，为的是防台风暴雨，与本地大院迥异。院内尚存当年烟丝柜台、私塾堂与厨房旧物，木雕门窗纹路细密；道光间吴家“吴红兴烟丝店”五处产业、房屋二百八十余间，人称“吴半街”。是古镇保存最完整的宅院。；赵信隆酱园店（明天启三年1623）：前店后坊格局，柜台、陶缸、木桶、石磨原样保留。院中一百三十余口古旧大缸整齐排成行列，上罩斗笠状竹编缸罩，缸盖被雨水浸成深褐色；掀开一角可见酱色在阳光下泛琥珀光。所产甜油自清乾隆时即为御膳房佐料，古法“三伏晒制、九煮八晒”周期逾年，至今仍在打。；山西会馆、苏镇扬会馆、江西会馆：一镇之中八省商人设商会，会馆门楼分列运河两岸，是当年“一埠十省商”的实物。；界牌楼：一脚踏三地，邳州、宿迁、睢宁三县交界立碑为界。；夜猫子集：运河商船白天航行、夜泊码头，三更天小商小贩挑担汇聚，蒸包子、烧五香妈糊、挑鱼拣菜，天亮船走集散，此俗沿袭至今。；窑湾天主教堂：西大街西端，一九〇九年建，欧洲哥特式，原占地约一万八千平方米、房屋二百余间，二〇一二年重建后双塔塔尖高四十点六米、大钟直径一点六米。重建后青砖拱券墙面仍可见原构件嵌于新墙间，钟声传五公里。；西大街、中宁街：两街平行，青石板路两侧明清木门店铺连片，南北建筑风格混搭。；山西会馆千年古槐：会馆院内唐代关帝庙旧址，古槐枝干扶疏，树身需三人合抱。树皮皴裂深如沟壑，主枝以水泥柱与铁架支撑仍枝叶繁茂，树根沿石板缝拱出地面。；百年耶稣堂：清光绪间建，两度避战火幸存，砖木结构小堂。；窑湾天主教堂：西大街西端，一九〇九年建，欧洲哥特式，原占地约一万八千平方米、房屋二百余间，二〇一二年重建后双塔塔尖高四十点六米、大钟直径一点六米，钟声传五公里。；西大街、中宁街：两街平行，青石板路两侧明清木门店铺连片，南北建筑风格混搭。；山西会馆千年古槐：会馆院内唐代关帝庙旧址，古槐枝干扶疏，树身需三人合抱。；百年耶稣堂：清光绪间建，两度避战火幸存，砖木结构小堂。。\u003c/p\u003e", "c": ""}, {"n": "徐州户部山+戏马台", "s": "户部山·戏马台", "p": "江苏", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e户部山其实是城南一座土山，明清富户把宅子一层层往山上叠，从戏马台沿石阶往下走，一家大院接一家大院，门楼、雕砖、鸳鸯楼全顺着山势抬高——雨水往山下走，宅子永远高一头。山顶戏马台只剩几株古柏，台下五百多间明清民居还连片。\u003c/p\u003e\u003cp class=\"main-text\"\u003e戏马台：公元前206年项羽依山筑台观马，今山顶台地已辟为园林，台上几株古柏苍然，枝干横斜。古柏树皮鳞皴，树根盘附台边石阶，登台可俯瞰徐州老城。；崔焘故居（崔家大院，国保）：清道光翰林府，十二座四合院串联、房屋一百五十余间，占地约五千二百平方米，大门悬“翰林”匾。下院正门两侧原竖两根数丈功名旗杆，屋脊饰“犀牛望月”砖雕；门楼雕梁，院中石板甬道沿山势层层抬高。是户部山规模最大、规格最高的古院落，盛时人称“崔半山”。；翟家大院鸳鸯楼：依山坡落差建上下两层，两层之间不设楼梯、两门朝向相反，因“鸳鸯”谐音得名。底层墙体部分利用原有山体岩壁，楼内设天梯上下，是户部山最讲地势的民居——地无三尺平，房子顺着坡叠。；余家大院“明三暗五”：门面看是三间，进去才发现暗藏两间阁楼，外表克制、内部宽绰。；郑家大院古银杏：院中古银杏年逾五百，秋来满树金黄。；李蟠状元府（国保）：劳动巷二十号，清康熙年间徐州唯一状元宅，原四进三路、房屋四百余间，现尚存三十余间，背依戏马台占南坡，是户部山两处最大宅地之一。；李家大楼：号称徐州第一楼，户部山民居中最高建筑，青砖券窗仍在。；刘家大院：戏马台北侧，占地约五百五十平方米、房屋十九间，四合院保存尚可。；李蟠状元府（国保）：劳动巷二十号，清康熙年间徐州唯一状元宅，原四进三路、房屋四百余间，现尚存三十余间，背依戏马台占南坡，是户部山两处最大宅地之一。；李家大楼：号称徐州第一楼，户部山民居中最高建筑，青砖券窗仍在。；刘家大院：戏马台北侧，占地约五百五十平方米、房屋十九间，四合院保存尚可。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e权谨牌坊（市保）：状元街东侧，明宣德二年建，门额嵌明仁宗“天朝元辅”“中原文献”“忠孝名臣”十二字。硬山顶门楼覆灰筒瓦，砖拱门楣尚存，享堂厢房已拆、仅存门楼独立街边。；权谨牌坊（市保）：状元街东侧，明宣德二年建，门额嵌明仁宗“天朝元辅”“中原文献”“忠孝名臣”十二字，硬山顶门楼覆灰筒瓦，享堂厢房已拆、仅存门楼。。\u003c/p\u003e", "c": ""}, {"n": "淮安区·河下古镇", "s": "淮安区", "p": "江苏", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e河下是淮城西北运河边的老镇，石板老街从运河堤岸一直铺到镇里，两边是盐商老宅的马头墙和斑驳门楼。镇不大，吴承恩故居就在巷子里，六角砖亭、假山、花草还围着那处小院。\u003c/p\u003e\u003cp class=\"main-text\"\u003e吴承恩故居：镇内打铜巷尾端巷中，明代园林式院落，六角砖亭立于院中，假山、花草丛杂，后园假山堆叠形似花果山。故居本体、生平陈列厅、美猴王世家艺术馆三部分相连，砖雕门楼与花窗仍可触摸；《西游记》作者就出生在这一带。；明清盐商住宅群：老街两侧连片马头墙、深宅大院，窗棂砖雕还在，是当年淮盐集散、徽商聚居的实物。；河下石板街：整条街以石板铺地，湖嘴大街石板路长约一千五百米，两侧青砖黛瓦马头墙连绵。石板被数百年来人行车压磨得中部微凹，边角翘起；至今仍是镇子的主骨架，清晨黄昏光影落在石板上。；沈坤状元府：竹巷街口，明嘉靖状元沈坤老宅与寓园，占地约一万三千平方米，状元楼、伴竹居、静寿堂、揽秀楼沿轴排布，房楣绘二十四孝图。状元楼为府内最高建筑，登楼可俯瞰古镇屋脊；宅旁紧傍古运河。是河下现存规模最大的明清宅邸。；漂母祠·韩侯钓台：萧湖边，明建清修，祠前立明代淮安知府刘大文撰联碑“一饭感韩信”，钓台石基犹在，临运河旧堤。碑面经风雨漫漶，对联字迹半可辨认，石基缝间生苔。；左宝贵墓：镇郊，清末甲午抗日名将左宝贵墓，封土与墓碑尚存。；秦焕故居：清代故居，市保，徽州盐商后裔营建，院内八角天井四水归堂，木构用料粗壮。；枚亭：萧湖畔，纪念西汉枚乘、枚皋父子，亭立枚氏故里碑。；江宁会馆：古运河南岸，清代江宁商人会馆，门楼与戏台尚存，砖雕梁架仍可触摸。戏台檐下砖雕斗拱纹路清晰，台基青石面被岁月磨平，当年会馆商帮云集的格局未散。；沈坤状元府：竹巷街口，明嘉靖状元沈坤老宅与寓园，占地约一万三千平方米，状元楼、伴竹居、静寿堂、揽秀楼沿轴排布，房楣绘二十四孝图，是河下现存规模最大的明清宅邸。；漂母祠·韩侯钓台：萧湖边，明建清修，祠前立明代淮安知府刘大文撰联碑“一饭感韩信”，钓台石基犹在，临运河旧堤。；左宝贵墓：镇郊，清末甲午抗日名将左宝贵墓，封土与墓碑尚存。；秦焕故居：清代故居，市保，徽州盐商后裔营建，院内八角天井四水归堂，木构用料粗壮。；枚亭：萧湖畔，纪念西汉枚乘、枚皋父子，亭立枚氏故里碑。；江宁会馆：古运河南岸，清代江宁商人会馆，门楼与戏台尚存，砖雕梁架仍可触摸。。\u003c/p\u003e", "c": ""}, {"n": "沛县老县城", "s": "沛县", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e元代沛县在泗水东岸建小城，后毁于黄泛兵燹。明嘉靖二十一年（1542）知县王治始筑土城，开永清、会源、恒休、拱极四门。嘉靖二十五年（1546）知县周泾甃砖。万历、崇祯至清康熙间屡修屡圮。1950年代城墙拆除。现状：城墙全毁；泗水亭1983年复建、歌风台1986年重建，老城街巷名保留。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走进沛县老城，汤沐路东侧那条南北向的樊巷还在，巷当中一口樊井，青石井沿被磨得发亮；城东南泗水亭公园里，两层小亭临水而立，亭里立着班固撰文的古碑。不远处歌风台上，汉代大风歌碑上半段字迹还能辨认——刘邦就是从这片泗水岸边起身的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e泗水亭（1983年复建）：泗水亭公园内，两层小亭临水而建，匾题“泗水亭”，亭中立清代重刻《高祖泗水亭碑铭》，碑文用东汉班固原文。；歌风台（1986年重建）：城东南原泗水岸，今为汉城制高点，台内辟沛县博物馆，藏汉代大风歌碑与元摹刻碑。汉碑高约一丈一尺、宽四尺四寸，石质坚细，字体浑圆虬劲，现存约原碑四分之三；上半尚清晰，下段风化难辨。刘邦回沛击筑唱《大风歌》即在此。；樊将军井：樊巷当中，青石井沿被两千年水桶绳磨出深沟，井水至今未枯。井沿石面光滑发亮，绳痕深可容指；有老居民称至今仍用此井浇花。；樊巷：城区东汤沐路东侧，南北向小巷，传为樊哙当年屠狗所居，巷名沿用至今。；汉城公园（1995年建）：汉魂宫、汉阙、仙人承露台、汉高祖原庙，一片仿汉建筑群。；吕布射戟台（县保）：文化馆院内，圆形青石板直径一米二二、厚十二厘米，传为吕布射戟所踩之石，石面留有脚印状凹痕。上建六柱飞檐射戟亭，亭上彩绘辕门射戟故事；旁立清乾隆十二年重修射戟台石碑，碑面字迹尚清晰。；琉璃井（八宝琉璃井）：青石井栏内绳痕勒出无数深沟，传为秦始皇东巡压天子气所凿，井水未枯。；阎尔梅墓：清初著名遗民诗人阎尔梅墓地，封土与墓碑尚存。；吕布射戟台（县保）：文化馆院内，圆形青石板直径一米二二、厚十二厘米，传为吕布射戟所踩之石，上有脚印状凹痕，上建六柱飞檐射戟亭，旁立清乾隆十二年重修射戟台石碑。；琉璃井（八宝琉璃井）：青石井栏内绳痕勒出无数深沟，传为秦始皇东巡压天子气所凿，井水未枯。；阎尔梅墓：清初著名遗民诗人阎尔梅墓地，封土与墓碑尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e晓明楼（省保）：沛中路沛县初级中学院内，一九一九年法国传教士建，两层带地下室、平面曲尺形。外观中式青砖坡屋顶斗拱，室内西式拱券彩色玻璃仍嵌于窗间，中西合璧痕迹一目了然；原天主教堂一九〇七年建、一九七二年拆。；晓明楼（省保）：沛中路沛县初级中学院内，一九一九年法国传教士建，两层带地下室、平面曲尺形，外观中式青砖坡屋顶斗拱，室内西式拱券彩色玻璃，原天主教堂一九〇七年建、一九七二年拆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：\u003cbr\u003e&quot;吾虽都关中，万岁后吾魂魄犹乐思沛。&quot;——公元前195年，刘邦平定英布后回沛县，置酒沛宫与乡亲欢宴，击筑唱《大风歌》。\u003cbr\u003e▌沛县民谚：\u003cbr\u003e&quot;丰吾所生长，极不忘耳&quot;——刘邦对丰县的牵挂；但他起事在沛县，自称&quot;沛公&quot;，后世把沛县当龙兴之地。\u003cbr\u003e▌沛县老樊巷居民：\u003cbr\u003e&quot;樊哙井还在巷中间，青石井沿被磨得发亮——2000年了，这口井见过屠狗的、见过亭长、见过大风歌，现在还在给我们浇花。&quot;\u003c/p\u003e"}, {"n": "宿迁老府城", "s": "宿迁", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦下相城、晋宿预县城、元宿迁县城、明万历马陵山新县城，四次迁治皆因黄河水患。明万历四年（1576）迁马陵山麓，土筑椭圆形城，开迎熙、拱秀、望淮三门（北因山不置门）。万历二十二年（1594）改砖城，开阳春、镇黄、迎薰、河清四门。1952年拆城，仅留西门镇黄门；1970年西门亦拆。2007年城市建设中发掘出六十米明代砖城残段，后建成下沉式遗址。现状：残段玻璃罩保护，项王故里景区开放。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宿迁老城最奇特的是幸福中路那段下沉式城墙广场：顺着台阶一层层往下走，玻璃罩底下就是明代砖城的墙基——现在的地面比当年的街面高出一截，黄河几百年淤上来多少，台阶就把这落差摊在你面前。不远处项王故里的项府项园还在原地，东大街老铺门脸半存半毁。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宿迁明清古城墙遗址（市保）：幸福中路西侧区府广场，六十米一段明代砖城残段被罩入玻璃房，沿台阶逐级而下可见原地面线；砌法是先打木桩地钉、其上砌砖，残高约一米。城砖青灰，砖缝间白灰尚存，玻璃罩内光线昏暗处砖面苔痕隐约。2007年城市建设中发掘。；项王故里（4A）：项羽出生地，项府、项园、将署、项羽故居、项家宗祠、虞家老宅连片。园内古槐相传为项羽手植，树高约十米、胸径逾一米，一九七四年遭雷击西侧主干折断，树身中空、水分靠树皮输送，仍枝繁叶茂，根系在东南角萌出新枝。院中石马槽传为饲乌骓马所用，槽面磨凹。；宿迁文庙（学宫）：今宿迁中学校园内，大成殿古建筑尚存，四百余年。；东大街（明代通岱街）：东城门外老街，原长约一里，宽丈许，石板路与老铺门脸尚在。；敕赐极乐律院（省保）：幸福中路，明崇祯十七年由马神庙扩建，五进院落。大门五间南向，上悬“敕赐极乐律院”大匾；关帝殿、罗汉殿、钟板堂依次递进。大雄宝殿单檐歇山宝顶，前有走廊、月台、石阶七级，藏经楼、大方丈室、玉佛楼人字梁全木构尚存。旧时“上有五台山、下有极乐庵”。；真如禅寺（南大寺）：城南，千年名刹重建，大雄宝殿面阔七间、重檐歇山、青绿彩画，梁枋饰龙纹祥云，殿内藻井绘飞天莲花。；显佑伯行宫：清代乾隆敕封，门楼上带戏台的罕见形制，砖木结构保存尚可。戏台悬于门楼之上，台沿木雕仍在，台下门洞穿街而过。；灶君庙：新盛街，与极乐律院相邻，清代庙屋尚存，近年街区修缮后开放。；敕赐极乐律院（省保）：幸福中路，明崇祯十七年由马神庙扩建，五进院落，大雄宝殿单檐歇山、前有月台石阶七级，藏经楼、大方丈室、玉佛楼人字梁全木构尚存，旧时“上有五台山、下有极乐庵”。；真如禅寺（南大寺）：城南，千年名刹重建，大雄宝殿面阔七间、重檐歇山、青绿彩画，梁枋饰龙纹祥云，殿内藻井绘飞天莲花。；显佑伯行宫：清代乾隆敕封，门楼上带戏台的罕见形制，砖木结构保存尚可。；灶君庙：新盛街，与极乐律院相邻，清代庙屋尚存，近年街区修缮后开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《宿迁县志》（清乾隆）：\u003cbr\u003e&quot;明万历四年，黄河决溢，知县何东凤卜地于马陵山麓另建县城。&quot;——宿迁四次迁城，根因全在黄河。\u003cbr\u003e▌宿迁考古队（2007）：\u003cbr\u003e&quot;城墙做法是先用木桩栽入地下做地钉，其上用城砖砌筑——这是明代筑城的标准工艺，也说明马陵山新县城是按正规府城规格建造的。&quot;\u003cbr\u003e▌宿迁老居民（70岁+）：\u003cbr\u003e&quot;我小时候还见过西门镇黄门——两层城楼，拱门黑得发亮。1970年拆的时候全城人都去看，有人哭。&quot;\u003c/p\u003e"}, {"n": "高邮老县城", "s": "高邮", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e北宋开宝四年（971）知军高凝祐始筑土城，方城四门。明洪武八年（1375）始建盂城驿。明正统间以砖包城。明嘉靖间增建瓮城。1956至1972年城墙大部拆除，仅东南角以奎楼为中心残留百十余米。2015年考古发掘北门瓮城，揭出双瓮城及多层结构。现状：盂城驿、镇国寺塔、北门瓮城遗址公园均存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e高邮老城贴运河西岸走，盂城驿的皇华门斜对着运河码头，站在驿院里能听见船号；西河里镇国寺塔孤零零立在河心洲上。最绝的是北门——考古挖开才发现城门里外套着两层瓮城，宋嘉定的内瓮和嘉靖抗倭的外瓮叠在一处，砖墙里还藏着好几层更早的城防。\u003c/p\u003e\u003cp class=\"main-text\"\u003e盂城驿（世界遗产·国保）：明洪武八年建，全国规模最大、保存最完好的古代驿站。皇华门、驻节堂、驿丞宅、驿马棚原样保留，其中驻节堂为真正明代原构；门前馆驿巷直通运河码头，青石板路仍在，可加盖高邮专属邮戳。；镇国寺塔（国保·唐）：城西运河河心洲上，唐代方形七层楼阁式砖塔，原为九层、现存七层，砖身斜檐，为全国仅存三座唐代方塔之一。一九五六年大运河拓宽，周恩来批示“让道保塔”，河道绕岛而过，塔影半在水里；人称“南方大雁塔”。；南门大街、北门大街（历史文化街区）：明清高邮城最热闹的两条街，明代砖石路面、砖雕门楼尚存。；奎楼（城东南角）：明天启三年建，八面三级，高约二十米，直接坐落在宋代城墙残段之上。；高邮当铺（国保）：清代中期开设，占地三千三百余平方米，五排五进，原房屋八十余间。中心存箱楼为二层回字形楼房，柜房、号房、更房保存完整；二〇一四年修缮后开放，木构梁架与柜台仍可触摸。；北门瓮城遗址：内瓮南宋嘉定间建，外瓮明嘉靖间为御倭增筑，双层砖墙叠压，墙内探出八层早期城防结构。二〇一五年考古发掘揭出，今辟为遗址公园，砖砌券面层叠可见。；文游台（省保）：人民路五〇七号，始建于北宋，为苏轼、王巩、秦观雅集处，台上筑秦观祠、盍簪堂。；净土寺塔（省保）：琵琶路南侧，明代砖塔，塔身斑驳。；龙虬庄遗址（国保）：龙虬镇北首，新石器时代江淮东部聚落，平面近方四面环水、面积四万余平方米，距今七千至五千年，发掘墓葬四百零二座。；王氏纪念馆：西后街，王念孙、王引之父子故居，一九八三年建馆。；天山汉墓（省保）：神居山，西汉黄肠题凑木椁墓。；文游台（省保）：人民路五〇七号，始建于北宋，为苏轼、王巩、秦观雅集处，台上筑秦观祠、盍簪堂。；净土寺塔（省保）：琵琶路南侧，明代砖塔，塔身斑驳。；龙虬庄遗址（国保）：龙虬镇北首，新石器时代江淮东部聚落，平面近方四面环水、面积四万余平方米，距今七千至五千年，发掘墓葬四百零二座。；王氏纪念馆：西后街，王念孙、王引之父子故居，一九八三年建馆。；天山汉墓（省保）：神居山，西汉黄肠题凑木椁墓。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《高邮州志》（明隆庆）：\u003cbr\u003e&quot;周围一十里三百一十六步&quot;——明清州志标准数据，民国测量地图实测5520米，略少于文献（差异因统计口径）。\u003cbr\u003e▌杨万里（南宋）：\u003cbr\u003e&quot;城外城中四通水，堤南堤北万垂杨。一州斗大君休笑，国士秦郎此故乡。&quot;——宋淳熙十六年（1189）过高邮。\u003cbr\u003e▌高邮考古队员（2015）：\u003cbr\u003e&quot;北门瓮城太罕见了——内瓮南宋嘉定年间建，外瓮明嘉靖年间为抗倭增筑，内外两层砖墙之间挖了8个瓮城结构层，是明代城防工事的直接实物见证。&quot;\u003c/p\u003e"}, {"n": "兴化老县城·昭阳", "s": "兴化", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e南宋宝庆元年（1225）知县陈垓始筑土城，因四面临水，以水为濠，只内城外无外城。明洪武五年（1372）守御千户郭德用砖外包重建。明嘉靖三十八年（1559）知县胡顺华重修加高，开启元、文明、威武、肇魁四门。1958年拆城，仅存西门、小东门残垣约四百米。2002年古城墙列江苏省文保；2024年12月国务院公布兴化为国家历史文化名城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e兴化城在里下河的水网窝里，城墙不圆不方，顺着水势弯着走——城外就是滔滔水面，天然城濠，所以老城从来只有内城没有外城。西门、小东门那两段残墙还趴在河边，凑近能摸到明代城砖；城东金东门、城北银北门两片老街鱼骨巷弄还在，上池斋药铺照常开门抓药。\u003c/p\u003e\u003cp class=\"main-text\"\u003e兴化古城墙残垣（省保）：西门、小东门两段共约四百米，南宋始建、明代外包砖，随水系而曲、不圆不方。残墙如土堆趴伏河边，外包城砖剥落处露出内芯夯土，砖面斑驳可辨明代铭文；凑近能摸到砖缝间青苔。；上池斋药店（国保）：东城外大街，清康熙六十年创，前后两进、前进上下二层砖木硬山顶，总建筑面积二百八十平方米。一九三二年重修，店内花饰瓷砖、德国镜面、八角琉璃灯仍是当年模样；前柜台南首竖楷体金字店招，木挂落雕仙鹤、鹿含灵芝、葫芦缠枝，柜端悬“橘井流芳”“水饮上池”等四块金字匾。三百余年从未改作他用，至今坐堂抓药。；银北门历史文化街区：曾聚集七十多个行业近两百家商行，万兴大典（省保）旧址尚存。；施耐庵墓（省保）：城东施家桥，《水浒传》作者墓。；郑板桥故居：古板桥畔，板桥当年的书房小院。；垛田（全球重要农业文化遗产）：城外水中垒起的一块块高地，四面环水、五面耕耘，清明前后菜花浮在水上。；四牌楼（省保）：府前街，明称“四攒坊”，四座牌坊组合、上架斗拱重檐、八出翼角、四脊攒尖，结顶五岳朝天沿用明代锡制原物。楼上悬四十七块匾额，启功、沙孟海、赵朴初等当代书家墨迹交相辉映。；李园船厅（省保）：清代扬州盐商李小波私家园林，咸丰间建。船厅内共七间，船头悬“自在流行”匾、中间悬“沧浪画舫”匾，厅形似船状；另有方厅、桂华楼以长廊相连，园内通兴化县衙旧址。；拱极台（市保）：城北海子池北岸，南宋宝庆元年知县陈垓筑城积土成台，台上原建襟淮楼，因位于北城又名玄武台。；上池斋药店（国保）：东城外大街，清康熙六十年创，前后两进、前进上下二层砖木，总建筑面积二百八十平方米，药铺至今坐堂抓药。；四牌楼（省保）：府前街，明称“四攒坊”，四座牌坊组合、上架斗拱重檐、八出翼角、四脊攒尖，结顶五岳朝天沿用明代锡制原物，楼上悬四十七块匾额。；李园船厅（省保）：清代扬州盐商李小波私家园林，咸丰间建，厅形似船状，另有方厅、桂华楼，园内通兴化县衙旧址。；拱极台（市保）：城北海子池北岸，南宋宝庆元年知县陈垓筑城积土成台，台上原建襟淮楼，因位于北城又名玄武台。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌兴化市文史专家郭保康：\u003cbr\u003e&quot;兴化的古城墙可以说是全国独一无二的——因为城墙既不圆也不方，是随着水系的变化而变化的，城墙外就是滔滔大水，形成天然的城濠。&quot;\u003cbr\u003e▌《重修兴化县志》（清咸丰）：\u003cbr\u003e&quot;城墙面宽四丈，底宽八丈——城上可五马并行。&quot;\u003cbr\u003e▌兴化老居民：\u003cbr\u003e&quot;我奶奶说小时候城墙上五马并行，现在西门残垣还在，像个土堆子——你凑近看还能摸到明代城砖。&quot;\u003c/p\u003e"}, {"n": "丰县老县城·中阳里·凤城", "s": "丰县", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国末已有城。秦置丰县，治中阳里，城址至今未移。明万历十九年（1591）知县费思箴始给土城包砖，用本地无字砖、沛县“沛”字砖、徐州府“府”字砖、丰县吴氏“丰县吴”字砖四种。清顺治五年增筑女儿墙，咸丰八年增筑四门瓮城。1948年开始扒城，砖用于建机关学校医院。现状：城墙全毁，四种城砖在老房子上尚能找到；凤鸣塔1994年重建，文庙明代大殿保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e丰县老城从战国末到今天县址没挪过窝，是中国县城里少见的例外。走进东大街，一墙之隔就是车水马龙，墙里文庙大成殿的黄琉璃瓦和古柏还安安静静；凤鸣公园那座七层八角砖塔立在湖边。老房墙上偶尔能翻出带字的城砖——“沛”字、“府”字、“丰县吴”字，是万历年间从沛县人手递手传过来的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e丰县文庙（省保）：东大街中阳里，明嘉靖三十九年建，苏北现存始建最早的文庙。大成殿歇山抬梁，面阔五间约十九米，进深三间，黄琉璃瓦屋面，二十四根楠木金柱贯通上下，外檐斗拱髹漆彩绘；殿前月台高约一米二、近二百平方米，月台嵌双龙戏珠石雕。八根金柱与莲花浮雕柱础为明代原物，今辟为丰县博物馆。；汉皇祖陵：赵庄镇金刘寨村，以刘邦曾祖父刘清墓为中心，墓丘、祭殿、二十四帝塑像环列，海内外刘氏寻根处。；刘邦广场：向阳北路西侧，传为古中阳里旧址。；四种城墙砖：老墙上尚可摸到无字砖、“沛”字砖、“府”字砖、“丰县吴”字砖四种；砖面字迹风化但仍可辨识，万历十九年包城时沛县砖由丰县百姓人递手传运来。；龙雾桥遗址：中阳里街道东北复新河与白帝河交汇处，遗址公园内两座明清碑亭，立明景泰元年《重修丰县龙雾桥庙记》、清康熙五十九年《重修丰县龙雾桥碑记》、清光绪三年碑三通。碑面字迹部分漫漶，石缝生草；两河交汇处水汽氤氲。；张道陵故里（宋楼镇费楼村）：汉天师张道陵出生地，村存张纲墓、药盒子（治病取土坑）、张道陵纪念馆，道教祖庭。；马公书院遗址：凤城镇五门桥，传为刘邦、卢绾跟马维读书处，民国间荒废，地名犹存。；萧何宅旧址：县城内，传为萧何故宅，街巷格局未改。；龙雾桥遗址：中阳里街道东北复新河与白帝河交汇处，遗址公园内两座明清碑亭，立明景泰元年《重修丰县龙雾桥庙记》、清康熙五十九年《重修丰县龙雾桥碑记》、清光绪三年碑三通。；张道陵故里（宋楼镇费楼村）：汉天师张道陵出生地，村存张纲墓、药盒子（治病取土坑）、张道陵纪念馆，道教祖庭。；马公书院遗址：凤城镇五门桥，传为刘邦、卢绾跟马维读书处，民国间荒废，地名犹存。；萧何宅旧址：县城内，传为萧何故宅，街巷格局未改。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e凤鸣塔：凤鸣公园内，明万历十六年建，七层八面八角砖石塔，原塔一九四六年毁，一九九四年重建，高约四十五米，内设旋梯可登。塔门嵌三块匾额：明代原刻、启功题字、赵朴初题字，一塔集齐古今书家。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌丰县古谚：\u003cbr\u003e&quot;先有徐州后有轩，惟有丰县不纪年&quot;——有先民在这片土地上生活的历史之长久。\u003cbr\u003e▌《史记·高祖本纪》：\u003cbr\u003e&quot;沛丰邑中阳里人&quot;——刘邦出生地。丰县汉元年（前206）被封为汤沐邑，高后二年丰县令品秩提高到一千石。\u003cbr\u003e▌丰县历史学者：\u003cbr\u003e&quot;建城墙时沛县砖不是用车子拉的，而是发动丰县百姓从沛县砖窑厂开始，一米远站一个人，一直站列到丰县城，用人手递手把砖传到城下。&quot;\u003c/p\u003e"}, {"n": "睢宁下邳古城·三层叠压·沉湖之城", "s": "下邳", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏代奚仲封地。战国邹忌封下邳成侯。秦置下邳县。汉高帝元年（前206）韩信为楚王，都下邳。东汉永平十五年（72）置下邳国，封刘衍为王，辖十七县。三国时刘备、曹操、吕布在此争战，吕布被缢于白门楼。南朝宋刘裕曾任下邳太守。清康熙七年（1668）大地震加黄河决口，下邳城沉水为旧城湖，县治迁今邳州。1983年旧城湖枯竭，2014年南京博物院考古调查，确认三层叠压。现状：遗址三层叠压已确认，圯桥、张良殿、双孤堆汉墓尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古邳镇城里村一带，站在田间就能看见三层叠压的剖面：最底下一层东汉下邳城夯土墙比现在的城墙还宽，中间一层翻出宋代庭院——青砖铺地还用铁钉固定在地上，跟今天装修铺地板一个手法；最上面一层才是明清下邳城。康熙七年地震黄河决口，整座城沉进旧城湖，直到1983年湖水才干。圯桥在镇外，朱漆栏杆立在马帮河上。\u003c/p\u003e\u003cp class=\"main-text\"\u003e下邳古城遗址（省保·三层叠压）：古邳镇城里村，自下而上四叠层——东汉、西晋、宋金、明清。东汉城夯土剖面清晰，城墙残高约五米半、顶宽约十六米、底宽约三十二米，夯土层一层压一层；中层宋城翻出两进庭院，青砖铺地、个别铺砖以铁钉固定于地面；上层明清城东西长一千五百米、南北宽一千三百五十米，叠压其上。站在田间可见三层剖面，“城上有城、城下有城”。；西晋下邳国贵族墓群：古城东约十五公里，九座砖室带斜坡墓道，出土鹦鹉螺杯、玻璃碗、金铛、青瓷扁壶等三百余件。一墓门墙砌砖阴刻“下邳国县建忠里谋显伯仲伯孝伯”，砖铭字迹清晰；墓砖青灰规整。；圯桥：古邳镇马帮河上，一九八一年重修，朱漆桥栏，桥边立“进履碑”。康熙七年原桥沉水，今桥栏漆色已暗，石级缝间生草；张良遇黄石公进履故事传在此。；张良殿、圯园：古邳镇内，张良坐像主殿，楹联述遇黄石公、随赤松子事。；双孤堆汉墓：古城周边东汉下邳王墓群，封土丘垄尚存于田野间，封土断面可见夯层。二〇一七年底考古专家齐聚发掘，封土上杂草丛生。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e白门楼旧址：古城东南角，原城楼毁于黄河，今立标识牌，传吕布被曹操缢处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清《邳州志》：\u003cbr\u003e&quot;康熙七年六月河水大上城陷——莒州郯城大地震，黄河决口，下邳城沉于水，为旧城湖。&quot;\u003cbr\u003e▌下邳古城考古队长马永强：\u003cbr\u003e&quot;我们找了三年才确认下邳古城不在原来公布的位置——实际位置在原来认定范围北侧500米。挖开一看，好家伙——三层叠压！最底层东汉城比明清城大一倍还多，城墙比现在的墙还宽。考古发掘最有意思的是那个宋代庭院——青砖铺地用铁钉固定，我们现在装修地板都这么干——宋代人就会了！&quot;\u003cbr\u003e▌古邳镇老渔民老刘：\u003cbr\u003e&quot;我爷爷说，1960年代湖水还没干的时候，夏天水浅时能捞到瓷碗碎片。1983年水突然干了——露出城墙的夯土，村里老人才说&#x27;哦，原来城在这儿&#x27;——沉了315年，才回来。&quot;\u003cbr\u003e▌李白《经下邳圯桥怀张子房》：\u003cbr\u003e&quot;子房未虎啸，破产不为家。沧海得壮士，椎秦博浪沙。报韩虽不成，天地皆震动。潜匿游下邳，岂曰非智勇？我来圯桥上，怀古钦英风。唯见碧流水，曾无黄石公。叹息此人去，萧条徐泗空。&quot;\u003c/p\u003e"}, {"n": "徐州老城", "s": "徐州", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋鲁成公十八年（前573）彭城见诸《左传》，为江苏有文字记载最早建城。西汉前201年楚元王刘交扩建。明洪武间垒石为基、砖包土，城周九里余。明崇祯天启四年黄河淹城后重建。清嘉庆五年（1800）扩建北关、西关、南关土城及坝子街城。1928年拆城。2014年回龙窝挖出明代城墙，2020年彭城广场揭出叠压明代城址。现状：回龙窝地下城墙、快哉亭东南角残墙存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在彭城广场往下走，回龙窝那段明代城墙就埋在你脚底下——2014年挖地基挖出五十米一段洪武年砖城，现在盖进了徐州城墙博物馆，玻璃罩下能看见砖缝。再往东南，快哉亭公园的城角还拱着一段明清残墙。黄河两千年里把城淹了四百多次，徐州人每次都在原地重建，城市中心两千六百年没挪窝。\u003c/p\u003e\u003cp class=\"main-text\"\u003e徐州城墙博物馆（回龙窝）：二〇一四年回龙窝改造中掘出约五十米深埋地下的明洪武砖城。青砖整齐垒砌，断面层次分明，局部苔痕犹存；玻璃栈道下可直视砖缝与砌法，砖面被地下水渍出深色水痕。；徐州城下城遗址博物馆：彭城广场，二〇二二年开放，总建筑面积三千七百平方米。遗址大厅展示明代石板街道，板上车辙印清晰，北门大街两侧以藤筐叠砌防水堤坝；地下约十二米处发掘出汉代陶井圈，井口直径一米余，陶壁内尚存当年打水绳痕。汉、唐宋、明三代上下叠压，相距约十米。；户部山明清建筑群（国保）：崔焘故居、李蟠状元府、郑孝理旧居依山层叠，详见户部山块。；快哉亭：城南古逍遥堂内，苏轼曾题名“快哉此风赋”，亭周为明清城角残段。；黄楼：宋熙宁十年（1077）苏轼守徐州抗洪后所建，今存旧址纪念。；徐州博物馆：藏狮子山楚王陵出土金缕玉衣等。；回龙窝历史文化街区：清代延续的民居街巷，2024年国家级旅游休闲街区。；云龙山兴化寺大石佛（省保）：北魏正平元年依山凿成，高十一点五二米，明洪武间覆三砖殿护佛，人称“三砖殿覆三丈佛”。大佛殿为明万历二十三年重修，殿壁紧贴佛身，崖壁间遍布唐宋摩崖造像，石面风化但佛面轮廓尚整。；放鹤亭：宋元丰元年张天骥建，清末重建，红柱飞檐，匾额“放鹤亭”三字传苏轼手迹。亭前临饮鹤泉千年古井，井栏石面被绳痕磨出深沟，泉水常年清冽；苏轼《放鹤亭记》诞生地。；东坡石床：云龙山第一节黄茅岗上，石旁宋明清摩崖十七方，米芾“第一山”真迹在壁，苏轼《登云龙山》诗刻于醉石亭内。石刻字迹部分漫漶，石面苔痕斑驳。；云龙书院：清康熙六十年建，七进院落，出徐树铮、张伯英等名人。；云龙山兴化寺大石佛（省保）：北魏正平元年依山凿成，高十一点五二米，明洪武间覆三砖殿护佛，人称“三砖殿覆三丈佛”，与云冈、龙门同时代。；放鹤亭：宋元丰元年张天骥建，红柱飞檐，前临饮鹤泉千年古井，苏轼《放鹤亭记》诞生地。；东坡石床：云龙山第一节黄茅岗上，石旁宋明清摩崖十七方，米芾“第一山”真迹在壁，苏轼《登云龙山》诗刻于醉石亭内。；云龙书院：清康熙六十年建，七进院落，出徐树铮、张伯英等名人。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老张（68岁，徐州回龙窝原住民，现在是回龙窝义务讲解员）：\u003cbr\u003e&quot;我1956年出生在回龙窝——那时候回龙窝就是&#x27;回流涡&#x27;，下雨天路上全是泥，小孩在泥里打滚。1970年代城墙还在，我和小伙伴爬上去摘酸枣。2014年政府改造回龙窝，挖地基的时候挖出了地下50米的明代城墙——我才知道我从小住的地方，上面是清代的房子，下面是明代的城墙，再下面还有唐宋的路、汉代的井。我现在是义务讲解员——每天给游客讲&#x27;城下城&#x27;的故事，讲得最多的一句话就是&#x27;\u003cstrong class=\"hl\"\u003e徐州2600年没挪窝\u003c/strong\u003e——黄河淹了十几次，徐州人就在原地上重建了十几次&#x27;。有人说这叫&#x27;坚忍&#x27;，我说这不叫坚忍，这叫&#x27;认地&#x27;——人不能丢地。&quot;\u003c/p\u003e"}, {"n": "宿迁皂河古镇·新沂窑湾", "s": "皂河·窑湾", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e清康熙二十三年（1684）敕建安澜龙王庙。乾隆六下江南五次驻跸，行宫扩建为三院九进，又称乾隆行宫。窑湾唐武德元年（618）建，明清鼎盛时店铺作坊三百六十余家。2014年龙王庙行宫、窑湾镇随大运河列入世界文化遗产。现状：行宫完整开放，每年正月初九庙会为苏北香火盛会之一。（T22河北中北部+江苏北部6县·完）。（以上为T22大批次6县正文）。（以下为T23大批次10县正文·安徽+山东+河南驻马店收尾）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e皂河镇卡在京杭大运河与骆马湖之间，龙王庙行宫的红墙黛瓦从运河堤后露出来——三院九进的北方宫式院子一座接一座往里走，绿瓦殿里东海龙王贴金坐像还在，殿前一对清代石狮是江苏独一份的皇家样式。往东南新沂窑湾，运河穿镇而过，吴家大院、酱园店、江西会馆八百多间明清老房子还连着河岸。\u003c/p\u003e\u003cp class=\"main-text\"\u003e龙王庙行宫（国保·世界遗产）：皂河镇，清顺治始建、康熙二十三年改建，三院九进封闭式合院，占地约三十六亩。御碑亭六角重檐攒尖顶黄色琉璃瓦，十二根朱红抱柱擎托，亭内御碑高五米、碑帽刻“圣旨”二字；龙王殿覆绿瓦。殿前一对清初皇家石狮，造型为江苏独一份，狮面风化仍威严。；窑湾古镇（世界遗产）：新沂西南，唐武德元年（618）建镇，明清八百余间老房沿江排布，吴家大院、赵信隆酱园、江西会馆连片，人称“苏北小上海”。；安澜桥：皂河镇跨京杭大运河。；陈家大院、合善堂、财神庙：皂河镇明清建筑，沿街存。；御码头：龙王庙行宫前运河堤上，乾隆六下江南五次登岸处，条石砌台阶直入运河水。码头岸石被缆绳磨出深沟，石面光滑发亮，台阶缝间生草；今运河水仍在台阶下流过。；陈家大院（市保）：清嘉庆年间，北方回廊式院落，六进、现存复原六十六间，西北角三层碉楼仍在，占地约四千五百平方米，为宿迁最大清代民居。回廊木柱石础尚存，碉楼青砖拱窗依旧。；合善堂（市保）：清光绪二十年，前后两进院，正门朝南，正堂硬山清水脊置跪兽龙吻，进深五架加前廊、面阔三开间，两旁设耳房。建筑布局规范，房屋结构完好。；通圣街：皂河老街，青石板路两侧明清店面连片，街面与龙王庙行宫同期。；御码头：龙王庙行宫前运河堤上，乾隆六下江南五次登岸处，条石砌台阶直入运河水，码头岸石被缆绳磨出深沟。；通圣街：皂河老街，青石板路两侧明清店面连片，街面与龙王庙行宫同期。；皂河御道：连接龙王庙行宫与御码头的条石御道，清代原样铺砌，石面被车辙磨平。；古皂河河道：古镇旁古皂河故道，河床半存半淤，岸柳成荫。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陆奶奶（82岁，皂河镇老居民，小时候见过乾隆行宫的老工人）：\u003cbr\u003e&quot;我家就在龙王庙行宫旁边，现在我还天天去行宫门口转。我爹说他小时候宫里还住着和尚——那时候行宫叫&#x27;敕建安澜龙王庙&#x27;，庙里有和尚值班，每年正月初九庙会方圆几百里的人都来烧香，庙里能挤爆。我爹说有个老和尚跟他说——乾隆爷当年下榻龙王殿，夜里听见外边运河上船响，就披了衣裳出去看，还跟船工说话。现在行宫修好了，成了4A景区，每年来的人更多了。我最喜欢正月初九那几天——老庙会的味道全回来了：卖香的、卖糖的、唱大戏的，跟我爹说的一模一样。&quot;\u003c/p\u003e"}, {"n": "江苏·响水老城", "s": "响水", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e宋代为淮北五大盐场之一。明嘉靖间云梯关设游击将军驻守。清乾隆八年（1743）民便河入灌河，响水口形成集市。清咸丰元年（1851）漕运中断，上海、山东货物改走外海经响水口中转，回澜街渐盛。清末民初回澜街商号两百四十余家，盐商聚集。民国三十四年（1945）建县，驻陈港镇。建国后县城东进南扩，回澜街渐冷；近年拆迁，仅个别标志建筑保留。现状：回澜街、聚兴巷残存，古云梯关石碑、望海楼存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e响水老城贴灌河而建，回澜街曾经是漕运中转港的主街，沿街二层飞檐的青瓦小楼还残着几栋，老字号招牌依稀可辨；聚兴巷是城里唯一还铺着青石板的小巷。往南黄圩镇，云梯关的老地界只剩一通“古云梯关”石碑立在护碑亭里，望海楼是后来重修的，登上去能看见海岸线已经往东退了几十公里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e聚兴巷：响水唯一铺青石板的小巷，巷板被脚印磨得发亮。石板宽窄不一，中部微凹，两侧老砖墙夹巷，巷窄仅容两人并行。；黄河故道：自西向东穿境约百来公里，故道两岸堆圩纵横。；大套古村：黄河故道边明清移民聚居的古聚落。；陈家港港城记忆片区：数十公顷，正在修缮港城记忆。；古云梯关巨碑：黄圩镇云梯村，清嘉庆十四年钦差工部尚书马慧裕手书隶书“古云梯关”四字，山安河务同知师兆龙铭刻。碑高约两米半、宽一米一，碑心阴刻隶书四字，字径近半米；今建护碑亭收于禹王寺院内，碑面风化但四字仍清晰可辨。；禹王寺：清康熙三十九年河督张鹏翮奏请敕建，原五进，正殿供大禹王塑像为京都名手所塑，望海楼近年重修。；饮马槽：云梯关遗址内，明代海防大石槽遗物，槽身苔痕斑驳。石槽长方形，外壁风化剥落，槽内积水生青苔；旁立说明石刻。；孝子坊：云梯关遗址内清代坊表，石额尚存。；黄河故道出土沉船：七十年代中期距地表十米处出四条沉船，内有宋、清遗物，说明宋元以来此处即海口航道。；饮马槽：云梯关遗址内，明代海防大石槽遗物，槽身苔痕斑驳。；孝子坊：云梯关遗址内清代坊表，石额尚存。；黄河故道出土沉船：七十年代中期距地表十米处出四条沉船，内有宋、清遗物，说明宋元以来此处即海口航道。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e回澜街：县城老街，街名取“东海回澜”，沿街青瓦房与二层飞檐小楼残存，老字号招牌依稀可辨；近年拆迁后仅个别标志性建筑保留。；禹王寺：清康熙三十九年河督张鹏翮奏请敕建，原五进，正殿供大禹王塑像为京都名手所塑。抗战时殿宇毁于战火，今禹王寺、望海楼近年重修，登楼可望海岸线东退数十公里。。\u003c/p\u003e", "c": ""}, {"n": "江苏·灌南新安镇老城", "s": "灌南", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为纪鄣城（纪国鄣邑），齐灭纪后属齐。汉属东海郡。元至正十八年（1358）总兵官八旦筑土城，周围五里。明洪武二年（1369）知县应通重修。明景泰四年（1453）知县黄嘉增修包砖，开四门。明正德七年（1512）设四门吊桥。明天启二年（1622）濉沱河决，城被水浸。1940年代城墙陆续拆除。现状：四门城楼、文庙、关帝庙均毁，仅四角台基与盐河水网存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新安镇老城被盐河和灌河勒成一个十字，老河道还在街后慢慢流。明代砖城早拆光了，四角台的基址在田边依稀可辨；镇西郊外出过大批古城墙砖。真正让人愣神的是海边那座纪鄣城——传为春秋诸侯国都，退潮时海面上还能看见城墙根的痕迹。\u003c/p\u003e\u003cp class=\"main-text\"\u003e盐河：纵贯县境约六十公里，与灌河交叉成一纵一横水网骨架，今仍通航。；纪鄣古城：传为春秋纪国鄣邑，齐灭纪后入齐。旧传因海啸沉海，今海边犹有城垣痕迹；退潮时滩涂上可见夯土残迹，与淤泥交错。；二郎神文化遗迹公园（五龙口）：县城北一公里武障河闸口，盐河、灌河、武障河与南北六塘河五河交汇。仿唐式献殿、钟楼、鼓楼沿中轴排布，占地约三百九十五亩，真君殿内供八米高二郎神像。河边立“杨二郎故里”碑，闸基下即古二郎神庙旧址。；龙沟西汉居住遗址：新安镇北十二公里龙沟河闸附近，面积约一百二十万平方米。闸身断面一米五黑土层中文化层厚达三米，汉砖、绳纹陶片在翻起的河堤上俯拾即是；陶片表面绳纹清晰，汉砖侧面模印纹路可辨。；大庙汉墓群：境内汉代古墓群，与中心墩、南闸大墩、白果大墩二墩连片，地表封土墩犹存。封土呈圆丘状隆起田畴，断面可见夯土层，墩上杂草丛生；大庙南至吴圩苗圩尚存五座。；上下马台唐代遗址：唐至明代聚落遗址，与城头西汉古城遗址、莞渎场镇明代遗址同列县保。；龙沟汉石刻画像：汉代石刻，与吴承恩撰文墓志铭、大庙告示碑、三圩闸碑同列县内重要石刻。；武障河闸：五龙口水利枢纽，闸体横锁武障河，闸基下即古二郎神庙旧址，明清县志所载灌河口二郎庙即在此一带。；二郎神文化遗迹公园（五龙口）：县城北一公里武障河闸口，盐河、灌河、武障河与南北六塘河五河交汇，仿唐式献殿、钟楼、鼓楼沿中轴排布，占地约三百九十五亩，河边立“杨二郎故里”碑。；龙沟西汉居住遗址：新安镇北十二公里龙沟河闸附近，面积约一百二十万平方米，闸身断面一米五黑土层中文化层厚达三米，汉砖、绳纹陶片在翻起的河堤上俯拾即是。；大庙汉墓群：境内汉代古墓群，与中心墩、南闸大墩、白果大墩二墩连片，地表封土墩犹存，断面可见夯层。；上下马台唐代遗址：唐至明代聚落遗址，与城头西汉古城遗址、莞渎场镇明代遗址同列县保。；龙沟汉石刻画像：汉代石刻，与吴承恩撰文墓志铭、大庙告示碑、三圩闸碑同列县内重要石刻。；武障河闸：五龙口水利枢纽，闸体横锁武障河，闸基下即古二郎神庙旧址，明清县志所载灌河口二郎庙即在此一带。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明代砖城墙基：老城四角台基址在田边依稀可辨，原四门（寅宾、时薰、安阜、拱极）门楼全毁。。\u003c/p\u003e", "c": ""}, {"n": "江苏·灌云伊山老城", "s": "灌云", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e明正德六年（1511）：流寇破城。明嘉靖二年（1523）：知县龙复礼建四门门楼（东观海、西延晖、南朝阳、北拱极）。明崇祯五年（1632）：知县龚奭增筑女墙。清康熙七年（1668）：郯城大地震，城墙受损。民国：城墙逐步拆除。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e西长街：伊山镇老城唯一连片未动迁的古街，东起中大街、西至伊山路双桥游园，三百来米长，清康熙年间已成街，2023年入选市级地名文化遗产保护名录。街面青石板被独轮车与布鞋磨得发亮，两侧老房清一色砖木结构、四梁八柱，墙厚及半米，当地称五十墙，隔热挡风，鲜见二层。正和烟店、吴寿松药店、掌孝先故居等老字号门面仍在巷口立着，近年按修旧如旧原则修缮外立面，仍作小吃与老字号经营。；石人巷：西长街北出的一条窄巷，因巷口一尊清代石人得名。石人原是康熙年间山东济宁府管仲闸官王廷瓒回乡所立，破四旧时被砸断，半截埋入猪圈，后由县文保所挖出擦净，重立于西长街口。旧俗端午大人携童于石人前焚香，祈求小儿平安，残碑断处棱线已被常年抚摸磨圆。；大伊山石棺墓遗址（国保）：城东南大伊山东麓青风岭台地上，1981年砖瓦厂取土首次发现，1985至1986年两次发掘清理出六十二座石棺墓。石棺用天然石板拼合，葬俗头东脚西、死者面部覆带孔红陶钵，距今六千五百年，是中国迄今最早的新石器时代石棺墓群。遗址背依青峰、双岭环抱，今设保护围栏与展示牌，山径间另有梅花鹿岩画、宋代船画散布。；大伊山：城东南隅的淮北名山，山东麓青风岭有六千五百年前的石棺墓遗址（国保），梅花鹿岩画、宋代船画等摩崖散布山径。；古巷群：钱巷、惠巷、万巷、魏巷、石人巷诸巷自西长街向两侧分叉，一线串起老灌云的盐商旧脉。；伊芦山六神台摩崖造像（省保）：同兴镇伊芦山西峰北侧，俗称落神台，唐代佛教造像刻于高约五米、宽约十米的天然峭壁上。造像分两组，一组利用山顶下天然洞穴稍作加工，一组位于窟下绝壁，共四十二尊高浮雕，有坐佛、力士、供养人、观音，部分带须弥座。早年即遭破坏，佛头多残，石缝间生杂草，摩崖下苔痕斑驳。；伊芦山石刻群（省保）：明清摩崖题刻，楷行草隶兼备，散见山径。；大伊山宋代船画（省保）：伊山镇大伊山摩崖，宋代石刻船画。；藏军洞：伊芦山古洞群，传为屯兵处，洞壁苔痕斑驳。；伊芦山六神台摩崖造像（省保）：同兴镇伊芦山西峰北侧，俗称落神台，唐代佛教造像刻于高约五米、宽约十米峭壁上，共四十二尊高浮雕，有坐佛、力士、供养人、观音。；伊芦山石刻群（省保）：明清摩崖题刻，楷行草隶兼备，散见山径。；藏军洞：伊芦山古洞群，传为屯兵处，洞壁苔痕斑驳。。\u003c/p\u003e", "c": ""}, {"n": "江苏·赣榆青口老城", "s": "赣榆", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：莒国置盐官城（盐仓城），秦为赣榆县治。汉：县治盐仓城，夯土城墙。宋元丰三年（1080）：移治赣马镇，直至1940年，历约六百年。清咸丰十一年（1861）：青口镇筑和安圩。1943年：赣马古城墙一夜拆尽。1946年9月：县抗日民主政府进驻青口镇，至今。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e赣榆县城六迁其址，从春秋莒国盐官城到青口镇，沿黄海海岸线挪了两千年；今青口老城只剩和安圩的圩沟残段，而老县治赣马镇的一座光绪砖塔还立在中学校园里，塔身已微微倾斜。\u003c/p\u003e\u003cp class=\"main-text\"\u003e盐仓城遗址（海头镇）：位于海头镇盐仓城村、龙王河北岸，春秋莒国盐官驻地，秦汉为赣榆县治。现存东西长约五百米、南北宽约七百米的台地，仅西南、西北两段城角夯土残垣高出地面三四米，墙宽四五米，版筑夯层清晰。1962年南京博物院调查，断面内含汉代陶片、瓦片，曾出土箭镞、刀剑、铜镜、汉五铢钱，今仍伏在庄稼地中。；赣马镇城里村：老赣榆县治所在达六百年，明万历十七年知县樊兆程改土城为砖城，城作随圆形，开南迎薰、北拱辰、西瞻圣三门，东不设门只建海晏谯楼。南门、西门两块石质门匾尚存，落款乾隆三十三年款，迎薰门石匾顶面嵌槽犹在、题款漫漶；西门瞻圣门匾因城西四十里夹谷山为孔子相鲁会齐侯处、出城可登山瞻圣而名。镇内金蟹泉井尚在，清康熙四年知县李俊改泉为井，水质甘甜。；青口和安圩遗址：咸丰十一年周曰森所筑砖圩，今圩墙已无，仅余圩沟残段与地名，当年七门六十一炮台的规模只在志书里。；徐福故里（金山镇）：传为秦徐福东渡故里，今立徐福祠与徐福村碑。；抗日山烈士陵园（国保）：西部抗日山，一九四一年建，八坡段三百六十三级台阶，九座大型纪念碑刻三千五百七十六位烈士英名，安葬一千八百余位烈士忠骨，全国唯一以“抗日”命名的山。；夹谷山齐鲁会盟遗址：夹谷山，明摩崖“圣迹犹存”四字，传为孔子相鲁会齐侯处。；秦山岛（国4A）：柘汪镇海中，面积仅零点一九二八平方公里，退潮时露出长约四公里七彩砾石“神路”，岛上存徐福井、受珠台、秦东门、将军石。；抗日山烈士陵园（国保）：西部抗日山，一九四一年建，八坡段三百六十三级台阶，九座大型纪念碑刻三千五百七十六位烈士英名，安葬一千八百余位烈士忠骨，全国唯一以“抗日”命名的山。；夹谷山齐鲁会盟遗址：夹谷山，明摩崖“圣迹犹存”四字，传为孔子相鲁会齐侯处。；秦山岛（国4A）：柘汪镇海中，面积仅零点一九二八平方公里，退潮时露出长约四公里七彩砾石“神路”，岛上存徐福井、受珠台、秦东门、将军石。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e赣榆文峰塔（省保·清光绪二十八年）：立于赣马高级中学校园东南角，又名铭志塔、响铃塔，光绪二十八年知县徐树锷为培植文风而建。塔为八角四层楼阁式砖木塔，高十四米余，各层原覆琉璃瓦檐、下挂铜铃，门窗以砖发券成洞，无棂，塔刹作葫芦状。抗战时日寇盗走铜铃、塔身东面弹痕累累；旧城墙拆后塔基失依托，百年风雨后塔身向东北微斜，文峰夕照旧为赣榆八景之一。。\u003c/p\u003e", "c": ""}, {"n": "江苏·宝应安宜老城", "s": "宝应", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐武德四年（621）：安宜县迁治白田，始筑土城。唐上元三年（762）：真如献八宝，代宗改元宝应年号，县改名宝应。南宋嘉定八年（1215）：贾涉始建土城。元至正十年（1350）：佥院萧成扩建包砖。明洪武十年（1377）：指挥时禹增筑新城。明嘉靖三十七年（1558）：海防副使刘景韶重建砖城，缩三分之一，开五门。1950年：拆城，砖石铺路。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宝应城从唐武德四年迁治白田至今一千三百年没挪窝，贴着大运河铺展开；叶挺路是一条走了千年的老街，朱家巷里明清四合院连成一片，鲁家巷住着《论语正义》作者刘宝楠。\u003c/p\u003e\u003cp class=\"main-text\"\u003e八宝亭：县城内小丘上的六角亭，明嘉靖年间为纪念唐上元三年真如献八宝、代宗改元宝应年号而建。原亭为四角攒尖小瓦屋面，1983年迁建于纵棹园内，亭侧另立明嘉靖三十年残碑及道光、民国修亭碑记。亭为方形攒尖、素砖高瓦，今为宝应城徽式地标。；县南街：与叶挺路相交的南北老街，有周恩来少年读书处（陈家大院）、刘宝楠故居（鲁家巷）、八宝亭等串联一线。；八宝亭：县城内小丘上的六角亭，为唐上元三年真如献八宝、代宗改元宝应年号的纪念地。；孔庙大成殿：宝应学宫仅存主体，在安宜镇小新桥二十五号，南宋嘉定始建、明清重建。殿前迎秀门、状元桥、泮池、棂星门、戟门一线，2006年恢复；戟门内两株银杏历四百余年仍苍翠。大成殿单檐歇山，面阔五间、进深九檩，占地约六百平方米，1992年大修，殿内悬康熙御笔万世师表匾。；城北门外城砖：原水产公司一带地下仍埋明代城砖残迹，地面上偶可拾得。；纵棹园（县保）：安宜东路一号，清康熙二十七年乔莱私家园林，占地约四点五三公顷，园内古戏台、鱼化龙石门柱、津逮桥、枕流桥、竹深荷净堂，八宝亭一九八三年迁入园内。；刘堡减水闸（世界遗产点）：宝应段大运河，明代减水闸遗址，条石砌基。；古邗沟东道码头（世界遗产点）：大运河宝应段，古码头岸石犹在。；宁国寺（县保）：叶挺路一百一十五号，唐贞观十一年始建，明万历重建，原殿堂五进、后进千佛楼梁柱木雕佛像数千尊，现存一殿清末重建歇山顶四周回廊。；纵棹园（县保）：安宜东路一号，清康熙二十七年乔莱私家园林，占地约四点五三公顷，园内古戏台、鱼化龙石门柱、津逮桥、枕流桥、竹深荷净堂，八宝亭一九八三年迁入园内。；刘堡减水闸（世界遗产点）：宝应段大运河，明代减水闸遗址，条石砌基。；古邗沟东道码头（世界遗产点）：大运河宝应段，古码头岸石犹在。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e朱家巷：老城古民居一条街，明成化举人朱讷世代聚居于此。巷内朱家三进士宅、陆公馆、万公馆等明清四合院连片，砖木结构，门楼砖雕依稀。巷口旧有朱士彦所题石牌坊，文革中毁，仅存地名与巷内残阶。；宁国寺（县保）：叶挺路一百一十五号，唐贞观十一年始建，明万历重建，原殿堂五进、房屋数百间，有跑马关山门之说，寺后千佛楼每根梁柱木雕佛像数千尊、组成千佛绕毗卢场面。清道光六年大雄宝殿毁于火，今存一殿为清末重建，歇山顶、四周带回廊，2007年后逐步修复配殿。。\u003c/p\u003e", "c": ""}, {"n": "江苏·仪征真州老城", "s": "仪征", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉：始置舆县。宋乾德二年（964）：升真州，设盐运使署。南宋宝庆元年（1225）：建东门水门。明弘治间：砌砖城，开四门。明嘉靖十一年（1532）：增筑西南延薰门。清：盐运衰落。建国后：城墙陆续拆除，环城路为城基。2012年：海德花园考古发现南城墙遗址与明清码头。2025年：焦点访谈曝光南门大码头拆真建假。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e仪征真州老城贴着运河入江口，宋代起就是江淮盐运第一码头；城东一段南宋水门遗址埋在地下，门洞宽近八米，二〇一一年列入省保；二〇二五年南门大码头片区的拆真建假风波，让这座盐运老城再次站到聚光灯下。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东岳庙：城南城墙边，明代建筑，与东门水门南北相望。；仪征学宫泮池：真州镇仪征实验中学校内，半月形泮池与棂星门遗址尚存。；万寿大佛寺：北宋始建，历代重修，今为近年重建。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东门水门遗址（省保·南宋宝庆元年）：真州城东城墙跨运河而建的水门，南宋宝庆元年知真州上官涣酉筑东西翼城、跨运河为水门，元明清三代沿用至民国。2007年清真寺河道截污工程发现，次年扬州考古所抢救发掘，揭出南北两厢石壁、东西四摆手、启闸滑槽与门道，上券顶与主城墙连为一体，门洞宽七点七米；墙土内含淮东运司铭文砖与南宋钱币。遗址覆土填埋保护，是江苏唯一保存至今的南宋城垣水关。；河西街都会街：明清街巷肌理尚存，大码头片区登记在册一般不可移动文物十四处，清代三进民居连片，青砖灰瓦、天井窄院。2025年焦点访谈曝光片区修缮中河西街四十六号一座三进清代民居被挖掘机夷平，应揭顶维修却全拆，事件后文物部门介入，三座文保建筑暂保。；南门大码头遗址：古运河与长江交汇的盐运码头，2012年海德花园考古揭出南宋至明清城墙基础与两座码头。2025年修缮项目中，商业部分按恢复街巷肌理打造，被中央媒体指为拆真建假；现场仅玉河西苑西侧一段一百二十米南宋城墙土基侥幸得存。。\u003c/p\u003e", "c": ""}, {"n": "江苏·泰兴老城", "s": "泰兴", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e南宋绍兴初：知县段傅相度延令村，迁县治于此，初筑土城。南宋绍兴三十一年：知县尤袤增筑外城。明弘治五年（1492）：知县原秉忠砖砌四城门。明嘉靖十一年（1532）：知县朱篪增辟西南延薰门。明嘉靖三十四年（1555）：为防倭改修县城，增浮桥五座。清乾隆三十九年（1774）：知县陈沣加高加宽，城形如瓜，号瓜城。解放初：城墙渐拆，今环城路为城基。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泰兴老城在长江北岸沙洲上，南宋绍兴初年选定龙开河环抱的地势筑土城，城池方正如瓜，人称瓜城；鼓楼东路一带的苏利巷是老城最后一片清末民初民居，庆云禅寺的宋代法轮塔是泰州地面上唯一的古塔。\u003c/p\u003e\u003cp class=\"main-text\"\u003e苏利巷街区：泰兴老城区唯一成片的传统街区，约一万七千四百平方米，清末民初名门聚居地，青砖黛瓦连片，砖木穿斗、前店后宅。2023年棚改进入倒计时，巷内老房被推、青砖散落，网友留住泰兴老城最后记忆视频走红后，政府调整方案，先做考古评估再定存废。；庆云禅寺·法轮塔：北宋咸平二年建寺，绍兴初宋高宗因泥马渡康王传说赐名庆云。寺内法轮塔原高五层、外形八角、内呈正方，楼阁式，三十二尊石刻佛像分嵌塔内壁；2015年加固时在塔基加三十厘米厚混凝土地基、五层加混凝土圈梁与不锈钢钢带，并将塔身由五层接至七层、高约五十米，与新大雄宝殿相协调。今为泰州地区现存最老地面建筑之一。；襟江书院（省保）：清咸丰十年知县金以诚捐建，在今泰兴中学老校区内。讲堂、重门、石刻长廊尚存，门前泮池为江南少见的完整明代书院水系，池畔洗墨池碑犹存。2025年布展竣工，旧匾、山长牌位与石刻长廊一并对公众开放。；黄桥明清古巷群：黄桥镇上珠巷、罗家巷等十二条古巷连片，砖雕门楼与石板路尚存，黄桥烧饼即出在这一带。；何氏宗祠（国保）：黄桥镇珠巷街一百二十四号，明建清改，现存房屋三十六间、占地约一千三百平方米，沿大门堂、仪门、大厅、振裔楼一路递进。荷叶墩承桁、纱帽翅饰梁垫、花瓶式童柱为苏北罕见砖木雕作，旧称江北第一祠。；丁家花园·丁文江故居（国保）：黄桥镇米巷十号，清代园林，占地约三千七百八十五平方米。多竹堂、小淤舟、桂花厅、蝴蝶厅、蝙蝠厅错落，假山鱼池、桂花芭蕉相映；1940年秋为通如靖泰临时行政委员会旧址，陈毅、粟裕曾在此运筹。；牛皋洗马池：黄桥镇，传为南宋牛皋驻军洗马处，池岸条石尚存。；福慧禅寺：黄桥镇古寺，殿宇近年重修。；裕泰和茶庄：黄桥东大街胡氏茶庄，前后四进屋，门脸尚存。；何氏宗祠（国保）：黄桥镇珠巷街一百二十四号，明建清改，现存房屋三十六间、占地一千三百平方米，大门堂、仪门、大厅、振裔楼，荷叶墩承桁、纱帽翅饰梁垫、花瓶式童柱为苏北罕见。；丁家花园·丁文江故居（国保）：黄桥镇米巷十号，清代园林，多竹堂、小淤舟、桂花厅、蝴蝶厅、蝙蝠厅，假山鱼池、桂花芭蕉，一九四〇年为通如靖泰临时行政委员会旧址。；牛皋洗马池：黄桥镇，传为南宋牛皋驻军洗马处，池岸条石尚存。；福慧禅寺：黄桥镇古寺，殿宇近年重修。；裕泰和茶庄：黄桥东大街胡氏茶庄，前后四进屋，门脸尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e泰兴鼓楼旧地：老城十字街口旧有谯楼，传为唐尉迟恭瞭望台，解放后拆，今仅存地名与广场。。\u003c/p\u003e", "c": ""}, {"n": "江苏·金湖老城", "s": "金湖", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e新石器至西周：戴楼三墩（獾墩、窑墩、磨脐墩）为金湖先民聚落。秦：于大云山麓筑东阳城，为江苏保存较完整秦汉城址之一。秦末：东阳令史陈婴率众起义，从项梁后归刘邦，封堂邑侯。西汉：东阳县六乡九千余户。隋：并入安宜县。南宋：属宝应县。明：属高邮州。1959年：周恩来总理定名金湖，取日出斗金之意。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e金湖是1959年周恩来总理取日出斗金之意亲定的县名，城在高邮湖与洪泽湖之间的水网里；戴楼一带田野上趴着秦代东阳县的夯土城垣，大云山下还叠着西汉陈婴母墓与汉楚王陵的封土。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东阳城遗址（省保）：大云山西麓，秦东阳县治所在。城略呈方形、正南北向，由东、西两城并列组成，东城较完整，东垣长八百余米、南垣长九百余米。黄土夯筑的城垣残段横在田野间，墙基宽约二十米、高出地面三四米，南、东两面护城河壕沟轮廓仍可辨认，断面夯层中含汉代陶片。北倚大云山、南向平原，是江苏保存较完整的秦汉城址之一。；磨脐墩遗址（省保）：戴楼小集村，西周聚落，2003年公布为淮安市级文保、后升省保。遗址由大小两墩相连呈椭圆形，大墩在东高五米、周长约三百米，小墩在西高二米、周长约一百五十米。文革后期官塘中学学生在墩顶开坑，于四十厘米厚黄土下发现印纹硬陶、夹砂红陶片与石铲等。；獾墩遗址：戴楼砖瓦厂取土处，新石器至周代聚落堆积，历年出土夹砂红陶与石斧。；尧帝故里塔集镇：《史记索隐》载尧初生时寄于伊侯长孺家，今塔集镇传为尧生处，镇内立尧帝故里碑。；尧帝古城：2011年在塔集复建的纪念性景区，围绕尧文化布展。；水上森林公园：宝应湖畔人工水杉林，四千余亩水杉立在水中，为华东最大人工湿地森林。；陈母墓：东阳古城附近，秦末东阳令史陈婴之母墓。史载陈婴母阻其称王、劝率众归项梁后归刘邦，后封堂邑侯。今封土尚存于大云山下田埂旁，高出地面数米，周围已成菜地，墓前无碑可考。。\u003c/p\u003e", "c": ""}, {"n": "连云港海州古城·秦东门", "s": "连云港海州", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦：于朐县立石阙，称秦东门。南朝梁天监十一年（512）：始筑城池。东魏武定七年（549）：定名海州。宋：魏胜抗金，筑外城围白虎山入城。明永乐间：改砖石包砌城墙，开镇海、通淮、朐阳、临洪四门。清同治七年（1868）：郯城大地震，城墙严重损毁。1956年：城市扩建拆去部分城砖。1989至1991年：按清代风格复建南门、东门及部分城墙。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e海州老城贴白虎山而建，城南北两面是锦屏山，城东旧临大海；中大街三百七十五米青石板路串着钟鼓楼与八条老巷，朐阳门、临洪门是上世纪九十年代按明清式样复建的，双龙井的石井栏还在原地被一代代居民摸得发亮。\u003c/p\u003e\u003cp class=\"main-text\"\u003e中大街：海州主街，长约三百七十五米，青石铺路，自钟鼓楼向十字街舒展。二营巷、塘巷、关庙巷、孔巷、隍庙巷、儒学巷、王巷、蒋巷八条巷子由主街向两侧分叉，青砖黛瓦老屋连绵。巷名自明代传下，沿街旧有盐商、布商铺面，今仍有杂货、早点、修鞋小铺营业。；双龙井：城内名井，在老南门外、今朐阳门广场西北侧，原名沙井、大井。井南数米东西各有一口小井，三井成品字，故又称品泉；南门外诸井皆咸，唯此泉甘冽四季不竭。井壁凿两尊石雕龙头，泉水自龙口中涌出，明代曾建品泉亭。今围作小园，井圈被一代代居民担水磨得发亮。；中大街：海州主街，长约三百七十五米，青石铺路，自钟鼓楼向十字街舒展，二营巷、塘巷、关庙巷、孔巷、隍庙巷、儒学巷、王巷、蒋巷八条巷子由主街向两侧分叉，青砖黛瓦老屋连绵。；白虎山：海州城西北，宋将魏胜抗金时筑外城将此山围入城内，山城相连，今为城中山地公园。；秦东门城雕：城东门外新立石阙与秦东门刻石，纪念秦于此立朐县。；百子庵、碧霞寺：古城内清代庙宇，近年重修，香火未断。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e朐阳门、临洪门：明永乐间砌砖石城垣，设镇海、通淮、朐阳、临洪四门。原门毁于地震战火，今南门朐阳门、东门临洪门于1991年按明清式样复建，城砖新砌，爬山虎爬满墙面。临洪门城楼总建筑面积约二百八十八平方米，高十九米余。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌海州古城老住户 刘奶奶（75岁）：&quot;我打小就在中大街长大，二营巷、塘巷这些巷子名是老人传下来的，明朝就有。双龙井的井水甜，全城都来担。老辈讲海州秦朝就有，城东立着&#x27;秦东门&#x27;的石阙，后来那地震把城震塌了，八几年又照着老样子修起来，城门楼子又回来了。&quot;\u003cbr\u003e▌家谱研究者 孙老师（62岁）：&quot;海州这地方，老早就是州城，管着沿海一亩三分地，码头的盐船布船都要打这过。钟鼓楼喊更，城门一关一开，街上的日子就有了章法。白虎山围在城里，打仗方便，可也成就了歌谣里说的&#x27;东头白虎山，西头青龙涧&#x27;，山水都护着这座城。&quot;\u003c/p\u003e"}, {"n": "盐城老城·海盐之城", "s": "盐城", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦汉：为盐渎县，海边煮海为盐。北宋天圣间：范仲淹任兴化县令，主持筑捍海长堤，后世称范公堤。明清：沿海设盐场，伍佑等场鼎盛，盐商聚宅置业。近代：设盐垦公司，废灶兴垦。今：串场河、范公堤、海盐博物馆一线构成海盐文化带。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e盐城老城被串场河贴着城根流过，河北岸一条范公土堤从北宋范仲淹任上一直卧到今天；中国海盐博物馆把煮海为盐的老锅老灶收进展厅，便仓镇枯枝牡丹园里一株枯枝上开花的牡丹，是明清盐商叶家传下来的老物件。\u003c/p\u003e\u003cp class=\"main-text\"\u003e串场河：穿城而过的运盐古水道，通宽约六十至八十米，北起阜宁、南至海安，全长一百八十余公里，将沿线各盐场像糖葫芦一样串起。沿河旧有码头、盐仓、盐商家宅，今河线仍在，两岸砌成步道，盐镇水街依河复建，青砖黛瓦临水，小桥石桥连通两岸。；范公堤遗址：北宋天圣年间范仲淹任兴化县令时主持修筑的捍海长堤，今老土堤残段仍卧在串场河东岸，夯土堤身高约一两米，被后世河线与步道覆盖。堤土经千年踩踏紧实，断面可见夯层，旧称范堤烟雨，为盐城古八景之一。；中国海盐博物馆：串场河畔专题馆，展陈历代煮盐、晒盐工具与盐运契约，系统讲盐城因盐立城。；盐镇水街：依串场河复建的明清风格水巷街区，青砖黛瓦临水，小桥石桥连通两岸。；便仓枯枝牡丹园：便仓镇卞氏支祠内，一株牡丹枯枝老干却年年开花，传为南宋即有，与明清盐城盐商叶氏经营盐场相伴。花株老干苍黑如枯木，春末谷雨前后新枝抽花，旧有枯枝牡丹、奇甲天下之誉，每年谷雨前后小镇游客如云。；伍佑场·珠溪古镇：串场河沿线古盐场，晋代建场、唐名伍佑场、明万历间建镇，旧谚三十六场大不过伍佑。古镇原有六河九街十八巷二十四桥，街头巷尾圈门四座；现存明清徽派风格百年建筑四十多处，青石板街与老码头犹在，2026年西南片区入选江苏省历史文化街区。；盐宗祠：供奉夙沙氏、管仲、胶鬲三位盐宗的祠宇，今依旧址重建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌串场河船工 王师傅（68岁）：&quot;我年轻时撑船走串场河，从盐场运盐到下河，一桨一桨地摇。河边的盐仓、老宅都是当年盐商留下来的，范公堤土堤还蹲在河边，老辈说那是范仲淹修的，护了这一方地。如今河边修了水街，我常去坐坐，看水还是那河。&quot;\u003cbr\u003e▌海盐文化研究者 李老师（60岁）：&quot;盐城这名字就是打盐字来的。古时候&#x27;环城皆盐场&#x27;，灶户们支起锅熬盐，海边一片白花花。伍佑场是三十六场里最大的，珠溪老镇的格局到今天还看得出。枯枝牡丹是便仓叶家传下的宝贝，花枯枝开花，多少年不谢。盐，就是这座城的魂。&quot;\u003c/p\u003e"}, {"n": "盱眙老城·第一山明祖陵", "s": "盱眙", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e北宋绍圣四年（1097）：米芾南渡题第一山，山名自此。明洪武：朱元璋追尊祖父朱初一为明德祖，营祖陵于洪泽湖畔。清康熙十九年（1680）：黄河夺淮，泗州城与明祖陵同沉洪泽湖。2010至2015年：江苏省考古所勘探发掘泗州城遗址。今：明祖陵、第一山、泗州城一线列为国家文化公园核心展示园。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e盱眙城趴在淮河边的第一山北坡，山上崖壁上刻着米芾写的第一山三个大字，一百多方宋元明清题刻布满秀岩瑞岩；城南洪泽湖畔明祖陵神道上二十一对石像生列在三百米中轴线上，玄宫还淹在水里；河对岸一片两平方公里的沙滩底下，压着康熙十九年沉湖的泗州城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e玻璃泉：第一山腹一泓泉水，泉壁镶历代碑刻，水色澄澈如玻璃，旧为文人雅集煮茶处。泉壁石缝渗水成滴，绕泉一圈青石阶被踏成凹面，春夏季泉上薄雾未散，山下淮河风帆在望。；明祖陵（国保）：洪泽湖南岸，朱元璋追尊祖父朱初一为明德祖而建，洪武十九年由太子朱标督工、历时近三十年建成。神道南北长约二百五十米，两侧二十一对石像生自麒麟起首，石马、文臣、武将依次排开，拉马侍整石雕成重逾二十吨；棂星门与享殿只余二十八个石柱础，北端玄宫砖砌九室，仍没在护城河水下，是全国唯一水中皇陵。；泗州城遗址（国保）：淮河镇境内、县城西一公里，唐开元二十三年移泗州治于此，清康熙十九年洪水灌城沉入洪泽湖。2010年勘探、2011至2015年联合考古发掘约两万八千五百平方米，已揭出西南香华门及月城、内城夯土包砖墙、灰砖铺地主街、覆莲石柱础与抱鼓石；外围城墙厚九至十二米、外砖内夯，香华门一段走势作S形以分水势。遗址总面积约二点四平方公里，发掘不足百分之二。；老北头·黄牌街：盱眙老城历史街区，青石板路向淮河蜿蜒，迎恩坊、半月形小楼、隅园等明清建筑散布两侧。；孔庙大成殿：盱眙学宫主体，明清木构，殿前古柏犹存。；大云山汉王陵（国保）：马坝镇大云山，西汉江都王刘非夫妇墓，出土金缕玉衣、长毋相忘银带钩等，今设王陵博物馆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e第一山题刻（国保）：城北第一山（都梁山）崖壁与碑墙间，现存摩崖八十九方、碑刻七十九方，合计一百六十八方。北宋绍圣四年米芾南渡泊舟登山，题第一山三字并赋诗，原碑毁于兵火，今碑为清乾隆间盱眙知县郭起元自闽县摹来重勒；苏轼、杨万里、赵孟頫、董其昌、陶澍手迹布满秀岩、瑞岩两壁，行楷草隶五体俱全。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老北头黄牌街居民 陈阿婆（72岁）：&quot;黄牌街是老盱眙最热闹的街，迎恩坊那牌坊，祖上说是给官老爷抬轿进城的。半月形小楼不多见，好像就我们这一带能看。第一山上的&#x27;第一山&#x27;三个字，是米芾写的，老辈都这么说，爬上去望得见淮河。&quot;\u003cbr\u003e▌洪泽湖畔老渔民 周大叔（66岁）：&quot;都说这湖底有一座老城——泗州城，康熙年间发大水，一整个州城就这么被淹到水底了。老辈传下话说，天旱水浅时，能看到水下的城墙屋脊。这几年考古的来捞，捞出一堆老砖老瓦，才信那水里头真压着一座城。&quot;\u003c/p\u003e"}, {"n": "泗阳老城·运河天后宫", "s": "泗阳", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦汉：为泗水国故地一角。明清：设桃源县。民国：改称泗阳。清康熙三年（1664）：闽商于骡马街建天后宫。2012年：在运河两岛新建妈祖文化园。今：骡马街整体改造为文化景区。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泗阳老城众兴镇贴着运河拐弯处，骡马老街青石板路还留着清代马帮歇脚的骨架，街西首一座康熙三年闽商建的天后宫，是千里运河上仅存的妈祖庙；运河中间如意岛上新立三面妈祖像，临水而立。\u003c/p\u003e\u003cp class=\"main-text\"\u003e骡马老街：众兴镇老城主街，清代南北马帮在此歇脚，青砖小瓦、石板铺地，两侧店铺林立。近年按汉唐风貌整治，街口立清代市民铜雕，老商户旧称这里北来布、南来货皆在此卸下，巷子口明代老井前几年仍有人用。；天后宫（市保·清康熙三年）：骡马街西首，康熙三年沿运河北上的闽商集资所建，前庙后殿两进尚存，主体三进五开间。前庙东壁砖雕河清、西壁海晏，后殿石柱、石础刻工精巧，金丝楠木梁柱雕花精美，保留闽南建筑风格。康熙南巡时赐封天后宫，是千里运河沿线现存唯一的妈祖文化遗存。；妈祖文化园：2012年在运河吉祥、如意两岛新建，三面环水，临水立三面妈祖立像，为运河妈祖信仰新地标。；桃源故城（小圩）：泗阳旧称桃源县，老城小圩一带仍可见夯土城墙与护城河残段。；明代古井：老城中明清市井用井，井栏被绳痕磨出深沟。；中国杨树博物馆：县城南，展陈意杨引种与平原林业，泗阳素有意杨之乡之称。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌骡马老街老商户 郑师傅（70岁）：&quot;骡马老街这名，是跑马帮、拉骡车的爷们叫出来的。明清时候运河在这拐个弯，北来的布、南来的货都在这卸下。老街上青砖瓦房还是那个骨架，巷子口的明代老井，前几年还在用。如今不跑骡马了，可街还是那条街。&quot;\u003cbr\u003e▌运河文化研究者 杨老师（58岁）：&quot;泗阳的天后宫不简单，康熙三年闽商建的，是千里大运河上仅存的妈祖庙。你想想，妈祖本是海神，跟着做生意的闽南人上了运河，一路护到苏北，这信仰就跟着水路走。现在建了妈祖文化园，32.3米的圣像立在水边，香火又续上了。&quot;\u003c/p\u003e"}, {"n": "沭阳老城·迎薰门·虞姬故里", "s": "沭阳", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e汉魏：厚丘、怀文等县治迭有变迁。北宋：沈括任沭阳主簿，治沭水，开百渠九堰。明清：县城筑砖城，南门名迎薰。清乾隆八年（1743）：袁枚知沭阳县，手植紫藤。2019年：胡家花园复建开放。今：迎薰门、胡家花园、袁公藤连成老城文脉线。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沭阳老城临沭河而建，南门迎薰门是近年按明清式样复建的三门拱券城楼，门额题迎薰二字，取《孔子家语》南风之薰的旧典；城西胡家花园复建后，园中一株康熙御赐的卧牛望月地柏盆景养了近四百年，紫藤花园小区里那株袁枚手植的紫藤还在春天开花。\u003c/p\u003e\u003cp class=\"main-text\"\u003e迎薰门：沭阳老城南门，近年在明代南门旧址上复建，三门拱券城台、重檐城楼，门额题迎薰二字，典出《孔子家语》南风之薰。城台城砖新砌、白灰勾缝，门洞内青石板被电动车碾出浅痕，门前已成市民广场；同期复建的还有东城门承晖门、西城门宣义门。；胡家花园（市保）：明嘉靖间抗葡英雄胡琏始筑，清康熙间胡简敬扩建，带回康熙御赐卧牛望月地柏盆景，已近四百年。2019年复建开放，两路三进徽派院落，三进堂、进士桥、状元井、揽月楼错落；园中地柏盆景卧牛造势、望月取景，园后又育二龙戏珠小品。；袁公藤：紫藤花园小区内（旧沭阳县衙后院），清乾隆八年袁枚任沭阳知县时自胡家花园移回手植。老藤蔓径半米余，虬枝如龙攀援成架，春末紫花满架。2009年列为宿迁市第三批文保，藤下围有青石矮栏，小区居民常在花架下乘凉。；虞姬沟（颜集镇）：传为虞姬故里，沟畔有虞姬庙、虞姬墓等纪念建筑，年年清明有人凭吊。；韩山：沭阳境内残丘，传韩信曾在此点将，山西麓楚王城遗址夯土残段尚存。；沭阳古城墙遗址：明代县城西墙残段，夯土包砖，为市级文保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌迎薰门老城根 胡大爷（73岁）：&quot;老沭阳的南门叫迎薰门，老人们说&#x27;薰风南来&#x27;四个字有讲究，是孔夫子家语里的话。西门那点老城墙还在，明朝的。虞姬沟在颜集镇那边，说是虞姬老家，年年有人去凭吊。我们这出风流人物，韩信还在这点过将呢。&quot;\u003cbr\u003e▌胡家花园园艺师 沈师傅（61岁）：&quot;胡家花园&#x27;苏北第一名园&#x27;的名号，是康熙御赐&#x27;卧牛望月&#x27;那盆古盆景挣来的，那盆景卧牛造势、望月取景，养了多少代人。袁枚在沭阳当县太爷时种的那株紫藤，我叫它袁公藤，春天紫花开得一片，游客都爱来。花木这行当，沭阳祖祖辈辈都做。&quot;\u003c/p\u003e"}, {"n": "泗洪老城·古徐国都", "s": "泗洪", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏：启封伯益子若木于徐，徐国立国。西周：徐偃王行仁义，都大徐城。春秋：吴季札出使过徐，挂剑徐君墓前。南北朝梁天监八年（509）：徐城为水患所毁，仅余半城。隋唐：通济渠（汴河）流经泗洪，为漕运要道。今：古汴河段列入世界文化遗产大运河。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泗洪老城在洪泽湖与淮河之间，城南一座七层仿古大阁叫古徐阁，通高六十米有余，阁高数字暗合徐国一千六百四十九年国祚；县城外围大徐城村外，犁地常翻出西周陶片，挂剑台在陈圩乡张墩村的田野里，半城镇的名字还留着南北朝古城塌了一半的记忆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古徐阁（3A）：县城南郊，仿古七层楼阁，通高六十一点六四九米，建筑面积七千余平方米，阁高数字暗合徐国一千六百四十九年国祚。阁为钢筋混凝土仿木构，飞檐翘角、黄瓦朱柱，阁内陈列徐国青铜器复制品与徐偃王以来徐氏名人展，登顶可俯瞰洪泽湖与县城。；大徐城遗址：半城镇一带，传为古徐国都城所在。村外田野间夯土城垣残段依稀，犁地常翻出西周至秦汉陶片、夹砂红陶残片。今地面已无城郭轮廓，仅靠地名与村民口头相传。；季札挂剑台：陈圩乡张墩村田野上一抔封土，旧志载为吴公子季札解剑挂于徐君墓树处。原台方圆数百米、高十数米，传洪泽湖水涨而台不没；今封土残存高约五米，台上近年立纪念亭与石碑，周围为农田。；半城镇：古徐城因南北朝梁天监八年水患塌去大半，仅剩半城，镇名沿用至今，今临洪泽湖。；古汴河（通济渠泗洪段·世界文化遗产）：隋唐大运河故道自泗洪穿境，堤岸故道仍可指认，为大运河世界遗产点。；双沟老窖池群：双沟镇明清以来连续使用的老窖池群，活态酿酒遗产。；下草湾人遗址：翠岭下旧石器地点，出土旧石器与脊椎动物化石，佐证境内远古人类活动。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌大徐城村老村民 徐爷爷（80岁）：&quot;我们村叫大徐城，老辈讲这就是从前徐国的都城，徐偃王在这坐过殿。村外还有老城土岗，犁地常常翻出碎瓦片。挂剑台的故事传了多少代——吴国的季札把剑挂在徐君坟头，讲究的是个诚信，我们徐家后人讲起来都觉着光彩。&quot;\u003cbr\u003e▌古汴河畔养鸭人 吴叔（55岁）：&quot;这河我们叫老汴河，唐朝那会儿叫通济渠，是大运河的一段，运粮船打北面一直撑到大江。河边有村叫半城，说是老泗州城塌了半边剩的。如今河边植树，水清了，我在这放鸭，看着这水就想，一千多年前的粮船也是打这走的。&quot;\u003c/p\u003e"}, {"n": "东海老城·秦郡名县·凤凰城", "s": "东海", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦始皇二十六年（前221）：设东海郡。汉：境内置曲阳、罗庄、鲁兰、城后等夯土城。唐武德四年（621）：于郁洲岛设环州，别治凤凰城。宋：合南北二城为一。1993年：尹湾汉墓出土简牍，轰动学界。2002年：尹湾简牍入选首批《中国档案文献遗产名录》。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东海是江苏唯一把秦代东海郡郡名沿用到今天的县；温泉镇尹湾村一九九三年从一座没被盗的西汉墓里挖出一棺木牍竹简，四万余字的郡级档案现在是连云港市博物馆镇馆之宝；曲阳镇一座刀把形的汉代城址趴在田野里，南城镇老街的青石板还磨得发亮。\u003c/p\u003e\u003cp class=\"main-text\"\u003e尹湾汉墓简牍（1993年）：温泉镇尹湾村西南高岭上的西汉晚期墓葬群，1993年二至四月抢救性发掘六座汉墓，其中六号墓未被盗扰。墓主师饶，字君兄，生前为东海郡功曹史；该墓出土木牍二十三方、竹简一百三十三枚，共四万余字，含东海郡集簿、吏员簿、武库永始四年兵车器集簿与元延二年视事日记。木牍长约二十三厘米，字如粟粒；简牍现藏连云港市博物馆，为中国时代最早、保存最完整的郡级行政文书档案。；曲阳城遗址（国保）：曲阳镇，城址略呈刀把形，外有护城河环绕，城址周长约一千米，面积五万余平方米。已发现城门四座，城外城壕深约一米半，现存夯土墙残高约一米半，地表散落云纹瓦当、绳纹陶片，曾出土军假司马铜印。；罗庄城遗址：温泉镇罗庄，汉代夯土城圈方正，地表遍布绳纹筒瓦板瓦碎片。；城后土城、鲁兰城遗址：白塔埠、驼峰镇一带汉代古城，四面夯土城墙仍可辨认。；磨山古建筑群：石梁河镇磨山，明清寺庙与民居遗存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e凤凰城（南城镇老街）：唐武德四年设环州，别治凤凰城，城以石砌，旧传周围十三里。今南城镇老街青石板路被布鞋磨得溜光，老屋骨架犹存，城砖早已拆作他用，凤凰城地名沿用至今。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尹湾村汉墓文保员 葛大爷（70岁）：&quot;1993年我们村平整土地挖出老墓砖，底下是十几座西汉墓，其中一座没被盗，挖出满满一棺材的竹片木片，后来一数一百多枚、四万多字！有个叫师饶的，生前管东海郡人事，把自己办公的账本都带进坟里了。专家说那是宝贝，如今都在博物馆里。&quot;\u003cbr\u003e▌凤凰城（南城镇）老住户 朱奶奶（77岁）：&quot;我们这老地方叫凤凰城，老人说是唐朝环州别治的城，石头砌的，周围一圈十三里。老街的青石头路，磨得溜光，我小时候就这么光。南宋那会儿，两座城合成一座，成了海口的石头城。如今城砖没了，但街名、地名还在，凤凰城这名我们一直在叫。&quot;\u003c/p\u003e"}, {"n": "洪泽老城·高良涧·水上长城", "s": "洪泽", "p": "江苏", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉建安五年（200）：广陵太守陈登筑高家堰。隋：炀帝行经破釜塘，赐名洪泽浦。明清：为保漕运，一百七十年间续砌石工墙。清康熙间：铸九牛二虎一只鸡镇水。清康熙十九年（1680）：洪泽镇与泗州城同沉洪泽湖。清道光四年（1824）：周桥决口，林则徐奉旨督工。1952年：建高良涧进水闸、三河闸。2014年：洪泽湖大堤随大运河列入世界文化遗产。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e洪泽老城高良涧贴洪泽湖大堤而建，堤身横卧六十七公里，东汉陈登始筑、明清一百七十年砌石，人称水上长城；堤上康熙年间铸铁牛昂首伏卧，周桥大塘那道深陷的洼地是清道光四年决口留下的伤疤，林则徐曾在此治水。\u003c/p\u003e\u003cp class=\"main-text\"\u003e洪泽湖大堤（高家堰·国保）：洪泽湖东岸大堤，东汉建安五年广陵太守陈登始筑，明清新砌直立条石工墙，南起蒋坝北至码头镇绵延六十七公里。堤顶宽约五米，湖面高于里下河平原数米，人称悬湖；今十堡至高良涧段及九龙湾段仍有十余公里完整石工墙，条石上万历八年等刻字清晰可辨。；石工墙遗存：大堤迎水面直立条式石工墙，条石以糯米汁、桐油拌石灰灌缝，下打木桩防渗，外砌砖柜三合土防蚀。道光四年周桥决口后，林则徐素服赴工，令每块条石凿齿槽、嵌工字形生铁锔，铁锔上铸林工二字以作终身追责，是古代水库型水利工程的石工典范。；镇水铁牛（康熙铸）：大堤建成时铸九牛二虎一只鸡镇水，今高家堰段存铁牛一头。生铁浇铸，昂首屈膝伏卧在与牛身一体的铁板底座上，身长约一米七、宽八十余厘米、高八十余厘米，总重两吨有余，牛角已残。腹下铭文维金克木蛟龙藏、维土制水龟蛇降仍可辨认。；周桥大塘：大堤四十五公里处，清道光四年西风大作决口冲击成塘，塘深二十四米。林则徐奉旨督工，道光十年沿大塘外口筑成内堤七百三十七米、顶宽三十三米，条石护墙、形如初月，又称月潭。地面以上可见条石二十层，是大堤现存最完整石工墙段，墙中铁锔铸林工铭文至今可辨。；高良涧闸：老城北端，1952年建成，三河闸之后洪泽湖泄洪主口，今与古堤相邻。；洪泽镇（沉湖古镇）：康熙十九年（1680）与泗州城同沉洪泽湖的洪泽古镇，旧称宋代人烟繁盛倍于淮阴，今湖底淤埋，枯水季偶可见瓦砾。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌高良涧老城居民 杨师傅（65岁）：&quot;我们高良涧，老城就贴着大堤。这大堤老一辈叫高家堰，说是东汉陈登先修的，明清又垒石墙垒了一百七十年，成了&#x27;水上长城&#x27;。堤上还有康熙年间铸的铁牛，说是镇水的，牛角磨秃了，身上铭文还在。守着这悬湖，辈辈人都敬这条堤。&quot;\u003cbr\u003e▌大堤看护人 刘老伯（72岁）：&quot;我守这片堤几十年。管它叫&#x27;悬湖&#x27;，是因为湖底比我们脚下的地皮还高，全靠这条堤拦住。堤上的石工墙，石头缝里灌三合土，浇得死死的，老辈工匠的手艺，连砖柜、桩基都有讲究。周桥那处大塘是当年决口留下的伤疤，也是治水的教训。&quot;\u003c/p\u003e"}, {"n": "邯郸老城", "s": "邯郸", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e站在邯郸老城，第一眼看见的是丛台公园东北角那座青灰色三层高台——武灵丛台。一条南北直街把老城穿起来，街不长，却压着战国到明清三千年的层：地下六米是赵都大北城，地上近三十米高的砖台是清同治年间重修的模样，街西一条仅容一车的青石窄巷是回车巷。三千年没挪过窝的城，就靠这一台一巷一条街把时间挂在明面上。\u003c/p\u003e\u003cp class=\"main-text\"\u003e串城街（邯郸道历史文化街区）：南北贯通老城的古街，长约两公里，二〇二五初重装开街，沿街保留回车巷、邯郸行宫（慈禧回銮所建行宫）、邯山书院、李景濂故居等明清院落，街下叠压着战国至明清七层路面。街两侧青灰砖门楼高低错落，板瓦仰铺、五架梁出抱厦，老门脸上还能辨出当年商号的石匾残字。；赵王城遗址：市区西南郊，战国赵都宫城，品字形三城，夯土城墙残高数米不等，龙台大基座犹存。；赵都大北城：今主城区地下六至十一米处，与二十世纪八十年代主城区范围基本重合，地表无存，靠钻探可知轮廓。；插箭岭遗址（国保）：丛台公园北约两公里赵苑内，战国赵邯郸故城大北城西垣残段，夯土带状土丘长六百三十米、宽二十至四十米、高三至八点七米，出土战国三棱铜镞、汉绳纹陶片。；梳妆楼·照眉池·铸箭炉：插箭岭遗址群内，梳妆楼夯土台曾出红烧土与战汉绳纹瓦，照眉池传为宫人梳妆处，铸箭炉为战国铸箭遗址。；插箭岭墓群：赵苑内，已发掘多座汉墓，出铜缕玉衣片与“刘安意印”铜印。；插箭岭遗址（国保）：丛台公园北约两公里赵苑内，战国赵邯郸故城大北城西垣残段，夯土带状土丘长六百三十米、宽二十至四十米、高三至八点七米，出土战国三棱铜镞、汉绳纹陶片。；梳妆楼·照眉池·铸箭炉：插箭岭遗址群内，梳妆楼夯土台曾出红烧土与战汉绳纹瓦，照眉池传为宫人梳妆处，铸箭炉为战国铸箭遗址。；插箭岭墓群：赵苑内，已发掘多座汉墓，出铜缕玉衣片与“刘安意印”铜印。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e武灵丛台：丛台公园东北角，一座青灰砖包砌的三层高台，高近二十八米、占地三千五百平方米，现存是清同治二年重修的样子，台芯仍压着战国夯土。下层南北各开一门，中层距地表七米，上层距地表十三米半、台面圆形；顶台据胜亭为明嘉靖十三年兵备杨彝所建，一九六三年暴雨塌毁、次年重修，四角攒尖重檐、高十三米、覆绿琉璃瓦，内塑赵武灵王像。南门高阶立郭沫若一九六一年诗碑，墙内嵌“滏流东渐、紫气西来”石刻，登台顶可远眺太行、俯瞰老城。赵武灵王当年在此阅兵观演。；回车巷：串城街南段西侧，一条宽约四米、长约七十余米的青石窄巷，相传蔺相如在此回车避让廉颇。巷口明万历十二年邯郸知县萧察据民间传闻立“蔺相如回车巷”石刻，原碑宽不足一米、高不足半米，嵌于巷口房墙；文革中碑及坊俱被砸毁，一九八一年市文管所重立碑碣并建石柱碑亭，碑亭双檐青瓦、通高四点四米、宽二点三米，内置新碑高一米六三、宽一米一。巷内青石板路面仍在，石板缝里的灰层叠压着历代车马辙痕。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王忠田（68岁，邯郸中学退休历史老师，一辈子住在串城街）：\u003cbr\u003e&quot;我小时候还在丛台的城墙上跑呢——那城墙高三丈七尺，砖缝里长酸枣，我和小伙伴摘着吃。我家就在串城街上，出门就是回车巷。我爹说他小时候回车巷还能走马车——现在虽然只能走人，但石板路还在，我每天遛弯都从巷口过。2021年串城街翻修，有人说&#x27;这是假古迹&#x27;，我说你蹲下来摸摸石板缝里的灰——那灰里埋着蔺相如的车辙、廉颇的马蹄、慈禧太后的轿杆印子。三千年来这条街上走过多少人？算不清。我每天在这儿给路过的小孩讲将相和的故事——不是课本上的，是我爹讲给我、我爹的爹讲给我爹的。&quot;\u003c/p\u003e"}, {"n": "磁县", "s": "磁县", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e走进磁县老城，十字街口先撞见一座八米高的青砖方台——鼓楼台基，台上是近年重建的三层楼阁。中山西大街路北，孤零零蹲着一座歇山琉璃瓦大殿，是城隍庙。城内地势低洼处，还剩一小片水面叫西海子，当年引水入城的“五湖四海”只剩这一洼。城虽小，却是磁州窑白地黑花的老家。\u003c/p\u003e\u003cp class=\"main-text\"\u003e磁州古城墙：明万历年间包砖的州城，周长八里余，今只剩断续土城基散落在城周巷陌间。；崔府君庙：城内府君庙街，祀唐滏阳县令崔珏，现存正殿、拜殿、后殿、过廊连成“工”字形，均为明清遗构。院落坐北朝南，红墙灰瓦仍在，殿前石阶磨出凹痕，庙内碑刻几块嵌于廊壁，字口已漫漶。；西海子：城内西南隅，当年“五湖四海”引水入城系统仅剩这一洼水面，面积不足原三分之一。；磁州窑博物馆：县城内，展陈中国北方最大民窑体系白地黑花瓷器标本与窑具。；观台磁州窑址：城西南漳河畔，磁州窑烧造中心之一，窑包与瓷片堆积数米。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城隍庙大殿：县城中山西大街路北，明洪武五年所建九脊歇山琉璃瓦顶大殿，面阔五间长二十米、进深三间宽十米，建筑面积四百七十平方米，是河北省现存唯一一座州城隍庙。木构为抬梁式露明造，九檩八椽，二十根朱红漆柱，檐下施七踩三昂重拱斗拱，柱网用移柱减柱做法腾出殿内空间；前出一间抱厦为清康熙八年增建。原山门、戏楼、后殿俱毁，独存大殿，殿前檐下两尊石狮仍蹲在门侧。；鼓楼：县城十字街心，明弘治十二年所建青砖方台基高约八米、面积一千三百八十平方米，台基南北开拱券洞穿街通行，南券题“景嵩”、北券题“拱极”（北券石额另镌“雄镇滏阳”），台基上锯齿砖墙环四周留陴垛四十八个。一九四五年解放战争中楼阁被拆、台基独存，一九九三年动工、一九九五年落成重建三檐二层仿明清楼阁，悬“畿南第一楼”匾。拱道至今仍通南北，楼阁内辟磁州民俗与古城文史陈列。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌贾师傅（55岁，磁县磁州窑烧制技艺传承人，跟着爹烧窑30年）：\u003cbr\u003e&quot;我爹16岁进窑厂，我14岁跟着他学——拉坯、修坯、施釉、装窑、烧窑，27道工序，每道都不能错。磁州窑跟景德镇不一样——景德镇是官窑，要精要贵；磁州窑是民窑，要活要实。磁州窑最大的特点是白地黑花——我爹说白地是磁县本地的大青土，黑花是武安的斑花石，两样土凑一起就是磁州窑的魂。2019年评国家级非遗的时候我去北京——专家说磁州窑是目前全国唯一一个连续烧了1400年没断过的民窑。我回来跟我爹说，我爹在窑口抽着旱烟笑了，说&#x27;咱磁州窑从来没断过火，将来也不会断&#x27;。&quot;\u003c/p\u003e"}, {"n": "临漳老城", "s": "临漳", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e走到三台村西，华北平原庄稼地里唯独西北角突起一座十二米高的黄土台——金凤台。台南文昌阁穿洞而上，台上明清旧屋尚在，古槐独立。往东几百米，铜雀台只剩一截五米高的缓坡土角；再往北，冰井台已被漳河冲得荡然无存。千年前六朝都城，如今全压在麦田底下，能站的就这一座台。\u003c/p\u003e\u003cp class=\"main-text\"\u003e邺城遗址：临漳西南邺镇一带，曹魏至北齐六朝都城，分南北二城，总面积约十余平方公里，地面无城郭，全在地下。；金凤台：三台村西，三台中唯一尚存模样的夯土台，南北长一百二十余米、东西宽约七十米、高约十二米，夯土层一层一层夹着碎瓦残瓷。台南侧清顺治八年建文昌阁，阁前石额嵌“金凤台”三字，阁后碑亭嵌历代题咏，其中元代“邺镇金凤台洞清观首创之碑”碑额雕六龙盘结；自碑亭北沿五十三级石阶登台顶，台顶西北独存一棵老槐，枝叶遮着小半台面。石阶西侧有转军洞（曹操藏兵洞）洞口，古地道原长约六公里，今仅存八十余米可入内探看。；铜雀台遗址：金凤台北侧数百米，地表仅存东南一角，高约五米、缓坡状，余皆没入平地麦田。土坡上半枯酸枣与野蒿丛生，站在坡顶北望，冰井台方向已是一望平畴。；邺城博物馆：邺北城址附近，仿汉式建筑，展陈朱明门复原与出土佛教造像、瓦当。；西门豹祠：邺镇东，战国西门豹投巫治邺处，现存近代祠宇与碑刻。；讲武城遗址：临漳讲武城村，战国至汉城址，夯土城墙残段断续可见。；邺城考古佛教造像坑：邺北城附近出土北朝佛造像，现藏邺城博物馆。；讲武城遗址：临漳讲武城村，战国至汉城址，夯土城墙残段断续可见。；邺城考古佛教造像坑：邺北城附近出土北朝佛造像，现藏邺城博物馆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e冰井台：三台最北，已被漳河洪水冲毁，地表无存。；邺城朱明门基址：邺南城正南门，经考古揭出双门道、双阙台基，现回填保护。；邺城朱明门基址：邺南城正南门，经考古揭出双门道、双阙台基，现回填保护。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王振兴（铜雀三台遗址公园副主任，考古发掘参与者8年）：\u003cbr\u003e&quot;我2017年到这儿的时候，铜雀台还是个没人管的土坡——金凤台上的古槐都快死了。我跟着社科院考古队钻探了两年——邺城的地下全是夯土，钻探杆下去2米就是汉代文化层，6米是战国层。最震撼的是2020年发掘的邺城佛寺塔基——全国十大考古新发现，那夯土基础直径28米，你能想象500年前一座七层佛塔立在这里有多高。现在金凤台顶上有一块明清石碑，刻着&#x27;古铜雀台&#x27;四个字——但旁边的土墙里，是魏晋时期的夯层。我每天傍晚都在三台转——风从金凤台吹过来，你闭上眼睛听，好像能听到曹植在台上念&#x27;仰春风之和穆兮，听百鸟之悲鸣&#x27;。&quot;\u003c/p\u003e"}, {"n": "大名府老城", "s": "大名府", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e走进大名老城，最直观的是一圈夯土外包砖的城墙还在——正方形城，四门带瓮城，城中间高、四边低，像一只倒扣的龟背。城里西大街还走得通，街心卧着一棵六百年卧龙槐。出西门不远，仿宋式的石刻博物馆院里，立着一通十二米多高的巨碑，比两层楼还高。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明清大名府古城：明建文年间都指挥使吴宓在艾家口重筑的正方形城，周长九里十八步，城墙、城楼、马面、瓮城、护城河大体尚存，中间高四边低的“龟背”格局仍在。城砖与夯土残段沿圈断续可辨，西门外石刻博物馆甬道即原城出门故道。；大名府故城遗址：城外西南，北宋陪都北京大名府被永乐大水一次性淹没，地下约四米处完整保留四十八里卧牛城基址。；五礼记碑：大名石刻博物馆院内，青石质，通高十二米三四、宽三米零四、厚一米零八，总重一百四十余吨，是全国现存最高古碑，碑由基石、龟趺、碑身、碑额四部分累叠而成。碑首为八龙戏珠圆首，碑额阳面篆书“御制大观五礼之记”八字，阴面为宋徽宗御书碑文，侧面一侧仍残存柳公权当年所书字迹。此碑原为唐何进滔德政碑，北宋磨改刻《五礼新仪》，明建文三年大名府城被洪水淹没时连碑一同淤埋地下，明嘉靖年间才重见天日。；何弘敬墓志铭：石刻博物馆弘敬阁内，唐魏博节度使何弘敬墓志，青石质，分志盖与志石。志盖盝顶式，顶面边长约一米、底面近两米见方、厚近一米，顶面正中篆书二十五字，四杀浮雕兽面、四神及牛马，四侧边雕卷云纹；志石正方形、边长一米九五、厚五十三厘米，志文五十九行三千三百余字。一九七三年出自万堤农场，二〇二〇年回迁大名。；卧龙槐：古城西大街中段路北，原为明兵部工部尚书刘遵宪后花园前之树，树高十二米半、胸围三米六、冠幅南北东西各十五米余，树荫铺地约一亩。东端一根粗枝横空平伸、离地仅半米，至梢头又昂起上翘，皮纹皴裂如龙鳞，远望如伏龙欲起。二〇一六年曾被货车撞倒地，经专家支撑抢救后复发新枝，至今腹空皮存、枝叶仍茂。；金滩古镇：城东南大运河畔，明代户部分司漕运衙署旧址、山陕会馆尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李大娘（68岁，大名古城西大街开二毛烧鸡店30年，祖孙三代）：\u003cbr\u003e&quot;我爷从1940年代就在大名古城卖烧鸡——那时候城门口还有兵把守，我爷挑着担子从瓮城的小门钻过去卖。现在我守着西大街的店，每天早6点起来卤鸡——老卤是我爷传下来的，每天都要加新料进去。有人问我&#x27;你这店能开多久&#x27;，我说&#x27;我爷开了60年，我爹开了40年，我开了30年，我儿子准备接着开——只要古城的城墙不拆，我这二毛烧鸡就不会断火&#x27;。去年有个小伙子从北京来，买了烧鸡站在卧龙槐下吃，吃完跟我说&#x27;阿姨，我终于知道为什么水浒传里写大名府了——这城真像从书里抠出来的&#x27;。&quot;\u003c/p\u003e"}, {"n": "邢台老城", "s": "邢台", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e站在邢台老城中心府前南街，抬头是一座重檐高楼——清风楼，楼后园子里立着八面青石刻经幢。往东看，开元寺的金代大殿屋顶从居民区露出来。城东南角楼广场，一截L形古城墙残段还戳在路边，断面里秦汉、唐宋、明代三层夯土叠压看得清清楚楚。\u003c/p\u003e\u003cp class=\"main-text\"\u003e邢台古城墙残段：城东南角楼广场，一段L形明包砖残段，残高约七米，断面可辨秦汉夯土、唐宋夯层与明代包砖三期叠压，夯土层里夹着碎瓦陶片。残段外侧现已砌砖护栏，墙根野枣与狗尾草从砖缝里钻出来。；清风楼：府前南街北端，明成化三年顺德知府黎光亨重建的重檐楼阁，通高约二十三米，原为府城谯楼。下为方形砖石大台基，拱券洞门南北穿通行人，西侧有露天梯道回旋登台；二、三层为木构重檐歇山、四角攒尖顶，上檐施五踩重昂斗拱三十四攒，布瓦捉节夹陇。底层室内墙壁嵌唐代王维四季图石刻，门洞上方“顺德府”石匾中“德”字少一横，为旧物痕迹。登楼可望老城，“郡楼远眺”为古八景之一。；道德经幢：清风楼西北清风园内，唐开元二十七年邢州刺史李质奉敕所立，通高约六米九，八面青石柱分顶、身、座三截，幢座雕仰莲纹。幢身一面篆书题额，余七面阴刻楷书《道德经》及唐玄宗逐句注，笔势清健。文革中被炸药炸碎，今仅存上下两段原件、中间一段为后补，以水泥拼接护存，字迹依稀可辨。；开元寺：古城东北角，俗称东大寺，后赵始建，现存唐代三门、金代大雄宝殿、元代钟鼓楼，唐十六面经幢与金代大钟尚在。；天宁寺：古城西，俗称西大寺，尚存旧殿。；顺德府文庙大成殿：达活泉公园内，河北省现存最大文庙单体。；郭守敬纪念馆：达活泉公园内，元代天文学家郭守敬故里纪念地。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌翁振军（88岁，邢文化概念提出者，邢台历史文化研究带头人）：\u003cbr\u003e&quot;我今年88岁，研究邢台历史整整60年。邢台为什么叫&#x27;邢台&#x27;？邢侯筑台以天子礼制建城，那个台叫&#x27;邢台&#x27;——邢台这个地名就从这台上来的。我小时候还在古城墙上跑呢——那城墙厚六丈，城上能并排跑三辆马车。角楼广场那片城墙，我1960年代带学生去考古钻探——我拿探杆往下钻，2米是明代砖，4米是唐宋夯土，6米是秦汉夯土，8米是西周文化层——邢台的城叠了整整2800年。有人说邢台是小城市，但我跟他们说：邢台是\u003cstrong class=\"hl\"\u003e华北地区第一座城市、中国最早的古都之一\u003c/strong\u003e——这是专家论证过的。3500年建城史没断过、城址没移过——你在中国找不出第二个这样的城市。&quot;\u003c/p\u003e"}, {"n": "沙河老城", "s": "沙河", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e沙河老城如今是北街、南街、北关三个村子拼成的一片聚落，城墙早没了，只剩村边几道土坡。走进村里，胡家巷、裴家巷的明清老石墙还在，北街口一棵千年古槐撑着半条街。城外东户村中学操场边，立着一通四米来高的唐碑——颜真卿亲笔写的宋璟碑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老沙河城：北街、南街、北关三村，隋至一九六九年一千四百年县治所在，河北省千年历史文化名镇，城墙仅存断续土坡。；宋璟碑：城东户村乡中学院内，唐大历七年颜真卿撰文并书丹的宋璟神道碑，碑高约四米、宽一米六、厚不足半米，全国重点文保。半圆形碑首浮雕缠尾四龙，方形碑额篆书二十字，原仰首赑屃碑座已佚失。碑四面环刻颜体楷书盈寸、洋洋三千余言，记宋璟历仕三朝刚直不阿；碑身曾于宋时佚失、明正德十二年沙河知县方豪重新衔接竖立。碑立在操场边的砖砌小护墙内，平日由学校师生照管。；沙河文庙大成殿：城内，后晋随县治西移而宋代复建，大成殿是沙河城现存最老建筑，今年久失修。；千年古槐：北街口胡家巷东端，树身通高近二十米，枝干半枯仍活，粗枝斜出撑着半条街。树皮皴裂如龙鳞，树洞里塞着村民敬奉的红布条。；梅花亭：城东南十里铺村，明正德十三年沙河知县方豪为纪念宋璟所建，亭内嵌清乾隆御笔《梅花赋》石刻。；梵爱寺唐碑：城内，唐代残碑。；霸王沟遗迹：城北大沙河南岸，传为项羽巨鹿之战强渡大沙河处，故道沟形犹在。；后晋沙河城泄洪暗道遗迹：古城墙遗迹旁，后晋随县治西移所辟，暗道砖石残段可见。；宋璟故居遗址：城内，唐名相宋璟故居，与城东户村宋璟碑遥相呼应。；无量寺遗迹：汉代寺庙遗址，地表柱础与残砖散落。；霸王沟遗迹：城北大沙河南岸，传为项羽巨鹿之战强渡大沙河处，故道沟形犹在。；后晋沙河城泄洪暗道遗迹：古城墙遗迹旁，后晋随县治西移所辟，暗道砖石残段可见。；宋璟故居遗址：城内，唐名相宋璟故居，与城东户村宋璟碑遥相呼应。；无量寺遗迹：汉代寺庙遗址，地表柱础与残砖散落。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明清古巷：胡家巷、裴家巷、王家巷，明清石墙老院连片，瓮城虽拆，巷制犹存。胡家巷在北街中段、东西走向，长八十余米、宽仅一米六七，狭长且曲折；裴家巷在北街北端路西，宽约两米、长百余米，东接南北主街、西至唐梵爱寺旧墙。巷两侧为石砌墙基、土坯上身、板瓦硬山顶老院，门脸只剩旧木门框。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡顺安（65岁，沙河城镇人，社会学者，20年研究沙河城历史）：\u003cbr\u003e&quot;我在沙河城出生长大，祖上是明朝迁来的。我用20年写了《邢台老沙河城人文历史》——因为我看着那些明清古巷、那些胡家巷的老院子一个个塌了心疼。1990年代我还在沙河城能看到城垣残段——现在只剩下土坡了。北瓮城门朝西开、南瓮城门朝东开，这个设计很讲究——敌人攻城时从南面来，南瓮城门朝东，敌人攻进去还要绕个弯才能碰到主城门；从北面来，北瓮城门朝西，敌人也要绕。现在瓮城没了，但胡家巷的老石墙还在、那棵千年古槐还在、宋璟碑还在。我常跟镇里说&#x27;沙河城的1400年不是纸上的历史，是街上还住着人的、院子里还晒着被子的活着的历史&#x27;。&quot;\u003c/p\u003e"}, {"n": "南和老城", "s": "南和", "p": "河北", "w": "", "h": "\u003cp class=\"main-text\"\u003e（T21河北南部7县·完）。（以上为T21大批次7县正文）。（以下为T22大批次6县正文·河北中北部+江苏北部）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e南和老城城墙早拆成了环城公路，沿圈走一圈才看出城的平面像一顶乌纱帽，两头翘中间平。城里还立着一座元代起的观音阁。出城西四五里，河郭镇桥西村的百泉河古道上，横着一座明代五孔大石桥，桥身压在干河床上，石面上的车辙印深得能埋住脚。\u003c/p\u003e\u003cp class=\"main-text\"\u003e观音阁：县城内，元代始建，屡经修葺，是老城现存最显眼的古建楼阁。；百泉五孔大石桥：城西河郭镇桥西村百泉河古道上，明成化七年乡民集资所建，全长五十四米、宽约五米、高约四米，两端引桥各长十一米，五孔石拱东西走向压在干河床上。中间一孔与其余四孔风格不同，系抗战时期补修；第二、三、四孔拱顶南北两侧共雕镇水兽六个，每个长约四十五厘米、宽约四十厘米，今多残损。桥面石板上车辙深陷、能埋住半个脚，桥两侧原栏杆墩雕仙桃、老虎、狮子，总高约一米三，二〇一九年文物部门加了外置金属护栏。；白雀庵：城东北，南北朝始建的尼庵，千手观音信仰道场，现存清代殿宇。；白佛寺水陆殿：城内，明代水陆殿遗存。；南和北齐造像碑（国保）：县城北，俗称透灵碑，北齐浮雕造像碑，碑面佛龛与供养人尚存。碑身立在砖砌小护亭内，龛楣雕刻已漫漶，线刻供养人衣裙下摆仍可辨出披帛弧度。；澧水石桥碑（省保）：隋代名碑，碑文记澧水石桥修造，碑身斑驳。；左村汉墓群（省保）：河郭镇左村西南，原三座汉墓、现存两座封土，一九八六年出玉猪、玉璧、铜温酒器、铜镜、铜虎头灶、青铜剑。；张宾墓：西十二里张相村东南，原长方形封土南北长四十米、东西宽三十米、占地一千二百平方米，后赵右侯张宾墓，一九六五年封土被平。；朱正色墓（省保）：明万历兵部侍郎朱正色墓，神道残石尚存。；南和北齐造像碑（国保）：县城北，俗称透灵碑，北齐浮雕造像碑，碑面佛龛与供养人尚存。；澧水石桥碑（省保）：隋代名碑，碑文记澧水石桥修造，碑身斑驳。；左村汉墓群（省保）：河郭镇左村西南，原三座汉墓、现存两座封土，一九八六年出玉猪、玉璧、铜温酒器、铜镜、铜虎头灶、青铜剑。；张宾墓：西十二里张相村东南，原长方形封土南北长四十米、东西宽三十米、占地一千二百平方米，后赵右侯张宾墓，一九六五年封土被平。；朱正色墓（省保）：明万历兵部侍郎朱正色墓，神道残石尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e纱帽城格局：原城平面形似乌纱帽，城墙拆平后改建环城公路，沿圈走一圈仍是老城边界。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡大姐（70岁，南和县城关镇退休小学老师，在南和住了60年）：\u003cbr\u003e&quot;我小时候城墙还在——不是土城了，是砖砌的，高3丈，我和小伙伴能爬到垛口上去玩。建国后拆城墙的时候我去帮忙捡砖——捡了几块好砖回家垒鸡窝。现在那鸡窝还在我家后院里。我每天遛弯必走环城路——那路就是原来的城墙根儿，走在上面我就想起小时候在垛口上看日落的样子。百泉五孔桥我也常去——那桥是我小时候上学必经之路，我爹说他小时候也是走这座桥上学的。2019年给桥加了护栏，说是文物保护——我站在护栏外面看那五个拱洞，好像能看见我爹和我小时候的影子在桥洞里跑来跑去。&quot;\u003c/p\u003e"}, {"n": "定州", "s": "定州", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e定州老城，抬头先看见的是开元寺塔——八角十一层的青砖高塔从居民区里拔起来，高八十余米，方圆几十里都能望见。塔下还压着明洪武年间展筑的城墙，如今只剩南城门瓮城一段。塔不远处，清代贡院的号舍还一排排坐着。一座塔的高度，就是这座城的门面。\u003c/p\u003e\u003cp class=\"main-text\"\u003e开元寺塔（料敌塔）：城内，北宋咸平四年始建、至和二年成，八角十一层楼阁式砖塔，高约八十三米七，是中国现存最高砖塔。塔建在高大砖台基上，台基外围边长一百二十余米，塔身用十几种规格青砖错缝砌筑，砖缝间穿插松柏木构件以增拉力，千年强震中东北角回廊曾塌而塔心柱不倾。塔内“塔中塔”——外塔体环抱内塔心柱，八角形回廊相连，梯道从塔心呈之字形穿心盘旋而上；一至七层回廊顶为斗拱平棋叠涩顶，八至十一层为拱券顶，每层佛龛内壁绘历代彩绘佛像，外壁通体白灰抹面。宋辽对峙时为瞭望敌情之用。；定州贡院：清代乾隆年间建，北方现存最完整的科举考场之一，占地两万二千余平方米。主体魁阁号舍面阔七间、进深九间，可容百余人同试；最南间魁阁为半四角攒尖结构，殿脊叠涩四层出檐，与北部三檐硬山卷棚顶号舍相连，号舍梁架八柱二十八檩。魁阁二层供魁星像，一手捧斗、一手执笔、单腿立鳌头，门楣悬“笔参造化”匾。今影壁、大门、魁阁号舍、大堂、后楼五座建筑尚存，号舍内号板条桌仍一排排摆着。；定州文庙：河北省规模最大、保存最完好的县级文庙。；定窑遗址：城北曲阳涧磁村，宋代五大名窑之白瓷产地，“芒口覆烧”工艺，瓷片堆积遍地。；定州博物馆：城内，展中山汉墓、静志寺塔基地宫出土文物。；净众院塔基地宫（国保）：城西南，北宋至道元年砖室方形穹窿顶地宫，一九六九年清理出银塔、银棺、定窑白瓷五十五件。；静志寺塔基地宫（国保）：北宋太平兴国二年，与净众院地宫合计出文物八百余件，含佛骨舍利、宋代壁画。；中山汉墓（国保）：市政府北，西汉中山孝王刘兴砖室墓，回廊嵌中山简王刘焉墓出土带铭石刻四百八十八块，铭文涉六州十八郡。；北庄子汉墓石刻：集中展于中山汉墓院内，石刻带采石场地、郡国、县邑及工匠姓名铭文。；净众院塔基地宫（国保）：城西南，北宋至道元年砖室方形穹窿顶地宫，一九六九年清理出银塔、银棺、定窑白瓷五十五件。；静志寺塔基地宫（国保）：北宋太平兴国二年，与净众院地宫合计出文物八百余件，含佛骨舍利、宋代壁画。；中山汉墓（国保）：市政府北，西汉中山孝王刘兴砖室墓，回廊嵌中山简王刘焉墓出土带铭石刻四百八十八块，铭文涉六州十八郡。；北庄子汉墓石刻：集中展于中山汉墓院内，石刻带采石场地、郡国、县邑及工匠姓名铭文。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e定州南城门瓮城：明洪武初年都督平安展筑的城墙遗迹，原四门洞、三道瓮城，今仍存三门洞及瓮城残段，城高约十二米、墙基宽约二十二米。万历四十七年知州沈廷瑛题石额“迎泰”，文革中东西北三门城楼俱毁、独南门幸存，一九九九年按原制复原内门重檐歇山城楼。城砖叠压处可见新旧砖缝，瓮城内仰头即见四壁合围。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（72岁，定州中学退休历史老师，一辈子守着料敌塔）：\u003cbr\u003e&quot;我爹说他小时候塔还能爬——有一次爬上去往下看，整个定州城像个盘子扣在地上，城中间的瓮城像个小碟子。那时候城门还在，瓮城里能跑马车。现在城门只剩遗址了，但塔还在——每天早上我遛弯都要绕塔走一圈，那风从塔的砖缝里吹出来，带着84.2米高处的凉气。2017年定州申文化旅游名城，我写了一篇《料敌塔下看定州》，开头就一句：&#x27;\u003cstrong class=\"hl\"\u003e一座塔的高度，就是一座城的尊严\u003c/strong\u003e。&#x27; 辽宋对峙时，这座塔是定州军民的眼睛；现在，它是定州的脊梁。&quot;\u003c/p\u003e"}, {"n": "正定", "s": "正定", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e正定古城南门长乐门一登上去，四面屋顶线上冒出四座塔尖——广惠寺华塔、临济寺澄灵塔、天宁寺凌霄塔、开元寺须弥塔，人称“四塔同框”。城墙是明代包砖，残段八千余米，南门瓮城月城完整。城不大，挤了十处国保，隆兴寺的宋代大殿就在城里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e开元寺须弥塔：城内，唐代方形密檐砖塔，叠涩出檐，塔身青砖素面无饰。寺内钟楼是国内现存唯一唐代钟楼，梁架上的包镶铁锭与风铎痕迹仍在，楼内原悬唐钟已佚。；隆兴寺：城内，宋代佛教建筑群，梁思成一九三六年六次来访测绘。摩尼殿北宋皇祐四年建，重檐歇山顶，正方形殿身四面各出一间抱厦，俯视呈十字形，檐下斗拱宏大疏朗，殿内五彩悬塑倒坐观音侧身斜倚；转轮藏阁底层正中八角木制转轮藏直径七米，中心一根十米余长木轴穿梁承重，可推转。大悲阁内铜铸千手观音立像通高二十一米三、四十二臂，北宋开宝四年铸，为国内现存最高铜佛，与沧州铁狮、定州塔、赵州桥并称“河北四宝”。；广惠寺华塔：城西南，金大定年间重修的花塔，主塔四层八角楼阁式砖塔高三十三米余，第一层四隅建四座六角形亭状小塔环抱主塔，栉比高低。第三层以上塔身骤缩，通体沿八角八面交叉塑出力士、狮、象、佛、菩萨壁塑，参差错落如花束，梁思成称“海内孤例”。塔刹已无存，一九九五年至一九九九年落架加固，补全四隅小塔与第四层壁塑。；临济寺澄灵塔：城东南，唐代始建，临济宗祖庭，现存金代密檐小塔。；天宁寺凌霄塔：城内，国内仅存两座半木半砖塔之一，塔心柱通顶。；开元寺须弥塔：城内，唐代方形密檐塔，寺内钟楼是国内现存唯一唐代钟楼。；县文庙大成殿：五代木构，河北省现存最早木结构。；梁氏宗祠（国保·第八批）：燕赵南大街东侧二百一十八号，明代建，明晚期祠堂，大门与正殿尚存。；蕉林书屋（县保）：燕赵南大街，清康熙六年梁清标藏书处，原花园式建筑群，现存三间清式小北屋、两间西厢房，院壁嵌《蕉林书屋歌》石刻。；崇因寺藏经楼：恒山东路，明代藏经楼，月台条石暗合二十八宿方位。；梁氏宗祠（国保·第八批）：燕赵南大街东侧二百一十八号，明代建，明晚期祠堂，大门与正殿尚存。；蕉林书屋（县保）：燕赵南大街，清康熙六年梁清标藏书处，原花园式建筑群，现存三间清式小北屋、两间西厢房，院壁嵌《蕉林书屋歌》石刻。；崇因寺藏经楼：恒山东路，明代藏经楼，月台条石暗合二十八宿方位。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌于坪兰（72岁，正定古文化研究会秘书长，正定文物保护老战士）：\u003cbr\u003e&quot;我1970年代就在正定文保所工作——那时候隆兴寺的转轮藏阁歪得要塌了，我们用木架子撑着。现在它转起来比新的还顺溜。我在正定工作50年，亲眼看着古城墙被拆、被修、被重新认识。2013年城墙评国保的时候我哭了——从80年代&#x27;拆城建房&#x27;到今天&#x27;修城护文&#x27;，正定走了30年弯路才找回来。2017年习近平总书记批示&#x27;正定古城保护工作做得好&#x27;——这是对我们这辈人最大的肯定。有人说正定的保护是&#x27;摸着石头过河&#x27;，我说不——我们是\u003cstrong class=\"hl\"\u003e摸着心过河\u003c/strong\u003e，知道什么该留、什么该修、什么不能动。&quot;\u003c/p\u003e"}, {"n": "保定老城", "s": "保定", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e保定老城裕华路一线，从东往西排着三座国保——直隶总督署、古莲花池、大慈阁。总督署是中轴五进的清代官署，大门八字墙还在；莲池是金代起的北方园林，池上亭桥错落；大慈阁高台重檐蹲在城中心。西大街一条八百多米的老街，刚做过微更新。\u003c/p\u003e\u003cp class=\"main-text\"\u003e直隶总督署：裕华中路，清代省级衙署，占地约三万平方米，中轴大门、仪门、大堂、二堂、官邸、上房五进院落，廊庑相通。大堂正中悬雍正御笔“恪恭首牧”匾，下置一品官方能用的海水松鹤屏风，屏风两侧楹联“俯仰无愧天地，褒贬自有春秋”，堂前两侧陈列公案桌、职衔牌、万民伞与车轿仪仗。二堂又称退思堂，悬“政肃风清”匾；大门外八字墙前抱柱联写“北吞大漠，南亘黄河，中更九水合流”。曾国藩、李鸿章、袁世凯皆曾任直隶总督。；古莲花池：总督署对面，金大定年间始建，“北方小江南”，清乾隆行宫、莲池书院旧址。园门迎门先见太湖石叠砌的春午坡假山作障景，石磴盘曲、古柏穿石，南侧嵌乾隆御笔“春午坡”三字及三块御制诗碑。北塘中央石砌台基上立临漪亭（水心亭），八角双层重檐攒尖顶，攒金柱间装隔扇门窗，亭南以凌空宛虹桥接岸、北以五孔曲桥连陆。园内散嵌唐田琬德政碑、清康熙御碑等数通，碑面风蚀字口渐浅。；大慈阁：市中心北大街南端，元成吉思汗时期河北东西路都元帅张柔始建，现存为清乾隆年间焚后多次重修，“市阁凌霄”为古八景之首。山门坐北朝南，门前石狮一对耳侧已被摸得发亮，门楣嵌“真觉禅寺”横额；入内东西钟鼓二楼对称，主体大慈阁重檐三层歇山布瓦顶，底层面阔五间、进深三间，二三层收为面阔三间。阁前青石台基高近五米，二十二级石阶陡直而上，围以汉白玉望柱栏杆，通高三十一米，阁内供五点五米木雕千手观音。；保定钟楼（鸣霜楼）：裕华西路，明宣德年间建、清康熙四十二年重修后定名鸣霜楼，重檐歇山布瓦顶，坐于砖砌高台之上。面阔三间、进深三间，外檐及墙内共立二十四根八角花岗岩廊柱，斗拱带元明过渡遗风。楼内悬金大定二十一年铸铁大钟，通高二米五五、口径两米、唇厚十七厘米、重约八吨，钟带三层、每层每方均铸佛像，钟以两根高八点五米的巨木梁悬挂。楼与大钟俱存，是保定老城现存最早木构。；西大街历史文化街区：全长八百余米，宋代成形、元明清兴盛，二〇二一年微更新后为国家级文旅街区。；保定陆军军官学校旧址：东风东路，一九〇二年袁世凯创办，中国近代第一所正规化军校，人称“南黄埔、北保定”。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌吴建立（70岁，保定市历史文化学者，保定地方志编修者）：\u003cbr\u003e&quot;我研究保定30年。很多人对保定的印象是&#x27;北京后花园&#x27;，但保定的根在300年直隶省——那时候保定是河北的心脏，总督署是全国最有权力的省级衙署之一（直隶总督是八大总督之首）。我爹说他小时候还在古城墙上跑——那城墙高三丈七尺，砖缝里长酸枣。现在城墙没了，但格局还在：总督署中轴线是南北向、西大街是东西向、府河自西向东穿城而过。2022年府河通航那天我哭了——这河是保定的母亲河，断了快100年了，又通了。现在年轻人在菊胡同喝咖啡、在府河上划船、在莲池里拍汉服照——这不是什么&#x27;复古&#x27;，这是保定人找回自己的方式。&quot;\u003c/p\u003e"}, {"n": "冀州老城", "s": "冀州", "p": "河北", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e冀州老城最扎眼的不是街，是城北中湖大道边那一道断断续续的黄土长墙——一段段趴在田野上，断面夯土层里夹着汉瓦宋瓷片。城里振商街一带，还留着上世纪六十年代国营照相馆、供销社的灰砖老楼，十字街东北角蹲着一座关岳庙大殿。\u003c/p\u003e\u003cp class=\"main-text\"\u003e冀州古城遗址：城北中湖大道西，西汉高祖六年始筑的夯土城墙，断续延伸四千五百米，最高处近八米，底宽三十米、顶宽十米，全国重点文保。墙是一层一层黄土夯成，夯层厚约十二厘米，每层之间夹着汉瓦、宋瓷与陶粒残片；断面经考古展示坑揭出三层——表层耕土、中层坡积夹碎瓷、下层夯土坚硬如砖。墙根野树根交缠，局部段趴在地头田野间，二〇二四年辟为古城遗址公园。；明弘治城墙残段：汉城东侧，明弘治二年缩内城时所筑，东西走向残长一千五百余米。；冀州老街：老城中心振商街、兴业街、当铺街、糖坊街一带，南北长六百一十米，明清街巷格局未变，完整保留上世纪六十至七十年代国营百货、饭店、照相馆、供销社等九十六间灰砖店铺。墙面上水泥制永久性招牌“国营照相馆”“国营百货公司”“城关人民饭店”“新华书店”字口清晰，壁上还留着“发展经济，保障供给”等时代标语；二〇二三年起按“修旧如旧”原则修缮，二〇二五年五月开街，青石板路重新铺过。；关岳庙：十字街东北角，又称忠义庙，大殿硬山灰瓦，台基条石经多年踩踏已圆钝，殿前两尊旧石狮蹲在阶下，庙内新塑关羽、岳飞像。院落夹在老街商铺之间，门脸不张，当地人管它叫“大庙”。；竹林寺：城东北衡水湖滨，水雾缭绕的寺观。；西元头汉墓（省保）：旧城西一公里西元头村西北，封土高约五至七米、东西长四十米、南北长三十一至三十八米，占地约一千二百平方米，俗称袁绍“四女坟”。；前冢后冢汉墓群：城北衡水湖畔，前冢高约十米，曾出土玉衣片。；竹林寺遗址（县保）：北关村东北三百米，明初州官依海市蜃楼幻景修建，四面环水，现衡水湖湖区内，现存新修竹林寺院落。；三友柏碑：原州城文庙内，现存冀州中学，清康熙志载。；汉代大石磨：城中，直径二米余、厚近一米，八人可推，传为李三娘磨面处。；西元头汉墓（省保）：旧城西一公里西元头村西北，封土高约五至七米、东西长四十米、南北长三十一至三十八米，占地约一千二百平方米，俗称袁绍“四女坟”。；前冢后冢汉墓群：城北衡水湖畔，前冢高约十米，曾出土玉衣片。；三友柏碑：原州城文庙内，现存冀州中学，清康熙志载。；汉代大石磨：城中，直径二米余、厚近一米，八人可推，传为李三娘磨面处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏龙亮（52岁，冀州区文旅局局长，2018年上任就盯住古城墙）：\u003cbr\u003e&quot;我2018年当局长的时候，那4500米古城墙就是一段一段的土坡——有人在上面放羊、有人在下面种菜、还有人堆了鸡窝。我带了考古队钻探——钻杆下去2米是明代夯土，4米是宋代夯土，6米是汉代夯土——我站在钻探现场跟队员说&#x27;这不是土，是咱们冀州2200年的家谱&#x27;。2024年古城遗址公园开放，2026年冲刺国家级考古遗址公园。现在每年有20多万人次来看这段城墙——有小孩在夯土体验区亲手筑城、有老人坐在城头晒太阳、有汉服女孩在城墙根拍视频。我爹说他小时候放羊就在这土坡上——那时候觉得是个荒地方，现在成了宝贝。&quot;\u003c/p\u003e"}, {"n": "商丘古城·归德府", "s": "商丘", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为宋国都城。秦汉为梁国睢阳城。隋唐为宋州宋城。北宋景德三年升应天府，后为南京。元为归德府。明弘治十五年河患城毁，弘治十六年（1503）始筑今城，正德六年（1511）落成。1996年归德府城墙公布为全国重点文保。现状：砖城、城湖、城郭三位一体格局完整，城内九十余条棋盘街尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到护城河边先看见一座方城浮在水面上——方方正正的青砖城，城外一整圈宽阔城湖，水外又卧一道圆形土堤，鸟瞰是枚方孔圆钱。城内九十多条街呈棋盘，城内地势中间高四边低如龟背。\u003c/p\u003e\u003cp class=\"main-text\"\u003e归德府城墙（全国重点文保）：明弘治十六年动工、正德六年落成的青砖城，周长约四点三五公里，高约六米，底宽顶窄，如今经逐年修缮，墙下青砖泛着盐碱白霜、局部酥松剥落。四门为东宾阳、西垤泽、南拱阳、北拱辰，门外原有瓮城。；城湖与城郭：砖城之外环一整圈开阔城湖，湖面宽阔把老城围成水中城；水外再卧一道圆形土堤（城郭），天圆地方，俯瞰如一枚古铜钱。；城摞城六叠：现存明城之下，垂直叠压着两周宋国故城、秦汉梁国睢阳城、隋唐宋州城、北宋应天府南京城、元代归德府城、明代归德府城，一城叠六层。；壮悔堂（侯方域故居）：城内刘隅首一带明末才子侯方域故宅，《桃花扇》中李香君故事所本，院落今辟为陈列。；应天书院：城南侧，北宋四大书院之一，范仲淹曾在此执教，现存为近年复建院落。；八关斋：城南护城河南岸，八角攒尖亭内立唐大历年间颜真卿撰文并书的八棱石幢，八百余字刻于石柱八面。；阏伯台：城西南，一座夯筑高台，传为上古商族始祖阏伯观星授时处，台上明清祠庙尚存。。\u003c/p\u003e", "c": ""}, {"n": "睢县老县城·睢州", "s": "睢县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦初治承匡城，后迁襄邑。宋崇宁四年（1105）升为拱州、睢州。明崇祯十五年（1642）三月李自成军克睢州拆城；九月黄河决口，狂流南奔，旧城沉为北湖。清初于旧城北部另筑新城，即今县城。现状：旧城沉于北湖，新城尚存袁家山、圣寿寺塔。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在北湖岸往水面看，底下沉的是整座宋睢州旧城——1642年黄河决口一夜灌城，官舍民庐尽付泽波。水面上还浮着两座土岛：襄台、驼岗。城东南闹市中，一座前低后高、像艘船的建筑卧在老陆园里，那是袁可立还愿仿蓬莱阁建的吕祖庙。\u003c/p\u003e\u003cp class=\"main-text\"\u003e睢州故城遗址（省级文保·水下城）：北湖底，城址南北约一千九百米、东西约一千三百米。旱年水浅时湖底方形城基轮廓隐约可见，早年开发西城湖曾挖出大量宋代瓷片。；襄台与驼岗：北湖水面上浮出的两座夯土小岛。襄台在湖东北隅，传为春秋宋襄公望母台，台上半截残碑早年尚可见。驼岗形似伏驼，高约五米，夯土堆成，战国时已有地面建筑，岗上至今能捡到陶片。早年旱年水浅，湖底方形城基轮廓隐约可见，西城湖开发时曾挖出大量宋代瓷片。；袁家山·吕祖庙（省级文保·明代船形建筑）：县城东南文化路与袁山路交汇口，明天启二年兵部尚书袁可立仿蓬莱阁所建。整组建筑前低后高，山门如船头、纯阳宝殿如船舱、望月台与台上八仙亭如船桅。纯阳宝殿面阔三间，前卷棚后硬山勾连搭，绿琉璃瓦覆顶，抬梁式梁架，屋内八根圆柱头带卷杀，柱础作鼓镜式；台上八仙亭歇山面阔一间，十二根石柱撑持。山下石坊、石碑、石马石像生分列。文革间曾改作县第二机械厂宿舍，一九七八年收回重修。；圣寿寺塔（全国重点文保·宋代）：县城西南后台乡阎庄村西北二百米，北宋六角九级密檐式砖塔，高二十二米，底座周长二十八点四米。第一层檐下南开圭形拱门，其余各层以叠涩砖出檐、反叠涩砖收顶，六角翘起。一至六层外壁嵌二百八十一块佛像雕砖，佛像坐入圆形佛龛，龛线圆正如规画出，或轻颦或微笑、或威严或慈祥。塔心室壁亦用佛像砖砌，顶部残留彩绘图案。寺废塔存已历千年，一九八五年省拨款加固。；汤斌贤良祠（汤文正公祠，省保·一九六一年首批省保）：县城建设路西段北侧，清初理学大师汤斌专祠，前身旌烈祠。几经兵燹，今仅存拜殿、大殿两进，青砖灰瓦硬山，院中古柏数株，殿内仍悬贤良旧匾。；承匡故城（匡城故城遗址，省保第五批）：县城西十五公里匡城村西北，秦初一度为县治所在。寺内至今残留一座周长约百十米、高十五米的夯土台岗，岗脚几段残墙斜卧田边，夯层清晰；台上关帝庙为上世纪八十年代村民于旧址重修，非原构。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌睢县民谚：\u003cbr\u003e&quot;古开封城摞城，老睢州阴阳城&quot;——湖下有城城上有湖，睢州城&quot;凸&quot;字形（旧城正方形+新城扁担形）相连。\u003cbr\u003e▌《睢州志》（清康熙）：\u003cbr\u003e&quot;崇祯十五年三月，闯贼攻陷睢州，拆城入壕。九月黄河决，狂流南奔，旧城遂沉为湖。&quot;\u003cbr\u003e▌睢县老渔民：\u003cbr\u003e&quot;北湖底下是古城没错，我爷爷年轻时旱年湖里能看到露出的房基瓦当。夏天水浅时撒网还能捞到瓷碗碎片。&quot;\u003c/p\u003e"}, {"n": "淮阳老县城·陈楚故城", "s": "淮阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周初年周武王封舜后妫满（陈胡公）于此建陈国，筑陈城。春秋楚灭陈为县，战国末楚顷襄王徙都于此（郢陈）。明洪武元年（1368）以砖包城。1950年代城墙大部拆除。2019年起搬迁占压城墙居民，九公里环城墙遗址公园建成。现状：龙湖抱城，太昊陵、弦歌台、平粮台并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e一进城就看见城被一汪大湖抱住——龙湖把老城四面围圆，湖心浮着一座红垣金瓦的殿宇。城西北沿湖走，是近年拆棚清淤后修出来的九公里环城墙遗址公园，夯土残墙贴着湖岸铺开。\u003c/p\u003e\u003cp class=\"main-text\"\u003e陈楚故城城墙遗址公园：老城区沿湖一线，2019年起搬迁千余户占压居民、清运十九万立方米垃圾后修成的环城墙遗址，夯土残段贴着龙湖岸铺开，四门立有标识。；龙湖：东湖、柳湖、弦歌湖、南坛湖四片水面拼成，环抱全城，是国内面积最大的内陆环城湖；东湖水湾里的白莲是商周原生种群。；太昊伏羲陵（全国重点文保、5A）：城北，三道皇城套在一条中轴线上。统天殿为陵内最高等级建筑，明建，面阔五间、进深三间，单檐歇山覆黄琉璃瓦，通高十五点七米；正脊龙凤大脊凌空，南龙北凤夹一尊彩釉吉星陶楼，两侧配二十八星宿。殿前月台青砖墁地、周压条石，可容千人同拜。殿内六十根金柱暗合六十四卦。院内古柏一百零八株，最老者植于唐，树干扭作虬龙，皮纹皴裂。每年农历二月二至三月三朝祖庙会，曾创八十二万人同日参拜的吉尼斯纪录。；弦歌台：西南南坛湖湖心岛上，台基高出水面三至四米，南北长九十米、东西宽四十五米。现存建筑清乾隆四十八年重修，正门、戟门、大成殿沿中轴线排开，周围群房七十二间。正殿七间进深五间，单檐歇山绿琉璃瓦，二十四根方形青石柱擎托回廊。正门悬清康熙五十二年石匾“弦歌台”三字，正殿石柱镌刻“堂上弦歌七日不能容大道，庭前俎豆千年犹自仰高山”一联，石面经三百年摩拓，字口已微微起毛。；画卦台：东湖北岸一座夯土高台，传为伏羲画八卦处，台前白龟池犹存。；平粮台古城遗址（全国重点文保）：城东南，一座高出周围地面五米的龙山文化方城台地，城墙残高三至五米、宽约十米。南门两侧以土坯垒砌门卫房，门道路土下三十厘米处，横铺倒品字形陶排水管三组六根——沟底一根、其上并排两根，陶管子母口节节相套，管身饰篮纹绳纹方格纹，自城内高外向城外城壕倾斜排水。这是国内已知年代最早、结构最完备的城市排水系统。南城门遗址保护展示工程已对外开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌史传统《河南行》：\u003cbr\u003e&quot;龙湖抱月卧羲陵——龙湖这一汪水替淮阳立了骨，水外是麦浪水内是荷浪，水中央浮起一座红垣金瓦的殿宇，像谁把上古的天幕裁了一角，轻轻覆在蔡水之阳。&quot;\u003cbr\u003e▌《诗经·陈风》：\u003cbr\u003e&quot;彼泽之陂，有蒲与荷。有美一人，伤如之何。寤寐无为，涕泗滂沱。&quot;——3000年前的淮阳人，对着龙湖里的蒲草荷花想心事。\u003cbr\u003e▌淮阳芦苇画非遗传承人葛磊：\u003cbr\u003e&quot;以前住城墙边上推门就是臭水坑，现在城墙修好左边是城墙右边是龙湖，走到这个画面里边都很美——我用城墙上的砖块芦苇创作非遗，城墙上的每一块砖都在讲陈胡公的事。&quot;\u003c/p\u003e"}, {"n": "永城老县城·芒砀山", "s": "永城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦末刘邦隐于芒砀山泽间，斩蛇起义。西汉梁国自梁孝王始，八代九王葬于芒砀山。隋大业六年（610）置永城县。1996年芒砀山汉梁王墓群公布为全国重点文保。现状：老县城街巷格局保留，芒砀山5A景区完整开放。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e芒砀山不高，是豫东平原上一串赭色小山包。山腹里被凿空成一排排地下石室——西汉八代九位梁王都葬在这。走进梁孝王王后陵那条两百多米的石隧道，石座便器、冰窖都还在原处。山巅夫子崖下，一尊明代孔子石像还对着洞口。\u003c/p\u003e\u003cp class=\"main-text\"\u003e梁孝王王后陵（全国重点文保）：保安山北坡山腹，一条东西长逾两百米的石砌地宫穿山而过，总容积六千五百余立方米，所谓“斩山作廓、穿石为藏”。后室四周绕一圈回廊，回廊中段向南开出一条五十三米长的斜坡隧道，即未完工的“黄泉道”，本欲直通梁孝王墓。厕间凿于过道西壁，石座便器带扶手与脚踏，脚踏面刻常青树防滑纹；南回廊东段南侧凿两层楼阁式储冰室，上层方井石坑藏冰、下层取冰，是国内现存最早的石藏冰室。；梁共王陵《四神云气图》：柿园汉墓主室顶上，一幅黑底彩绘壁画，青龙白虎朱雀配云气灵芝，两千一百年色彩仍浓，原物今移藏河南博物院，墓内有复刻。；夫子崖（孔子避雨处）：夫子山南坡一处天然石岩洞，阔约二十米、进深六点五米、高四米，半覆锅状洞口朝南开。洞内一尊明代圆雕孔子石像面南而坐，屈膝盘坐、拱手缩颈，高约一米，面部经风化与早年人为破坏已残损，今罩玻璃保护。洞外左前方一方约二十平米平石为晒书台，相传雨后晒简处；石室东侧仅存明万历残碑两通，字迹模糊难辨。；斩蛇碑：芒山镇南道旁，明隆庆五年重立一通石碑。碑身青石，夜晚灯光斜照碑面，石纹上隐约映出高祖佩剑幻影，当地人传为刘邦斩蛇处。碑亭近年重修，碑面风化石痕交错，字迹已漫漶。；陈胜墓（省级文保）：芒砀山西南麓一座覆斗形冢墓，郭沫若题碑立于墓前。；梁孝王陵（保安山南峰）：保安山南峰山腹，比王后陵更早，汉梁孝王刘武首葬处。&quot;斩山作廓、穿石为藏&quot;，一条狭长墓道自山坡直通山心，前室、后室、耳室沿中轴排开，早年随葬品盗空，石质洞窟仍完整可入。；僖山汉墓（金缕玉衣出土地）：芒砀山群最东端僖山，海拔不足九十米，近代开山采石把山体削出四五十米高的直壁。山腹一座竖穴石室墓早年被盗，当年那套金缕玉衣今移藏河南博物院，墓道与石穴仍可下到。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：\u003cbr\u003e&quot;秦始皇帝常曰&#x27;东南有天子气&#x27;，于是因东游以厌之。高祖即自疑，亡匿，隐于芒砀山泽岩石之间。&quot;——刘邦隐于芒砀山紫气岩，斩蛇起义处。\u003cbr\u003e▌永城民谚：\u003cbr\u003e&quot;汉兴之地，华夏之源&quot;——芒砀山被专家论证为汉兴之地，汉族、汉语、汉字、汉学自此而兴。\u003cbr\u003e▌《河南日报》：\u003cbr\u003e&quot;梁孝王王后陵比明定陵大两倍早1300年，地宫里的汉代坐便比现在的冲水马桶早2000多年——考古队都被古人的智慧惊住了。&quot;\u003c/p\u003e"}, {"n": "鹿邑老县城·老子故里", "s": "鹿邑", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为苦县，楚地。唐乾封元年（666）改真源县，宋改卫真。元至元二年（1265）鹿邑、卫真合并，治所迁今县城。明洪武二年（1369）因元旧城重修土城。明隆庆六年（1572）始甃砖石。近代砖城逐段拆除，护城河尚存。1938年日军炮轰老君台，十三发炮弹未爆。现状：太清宫、明道宫、老君台保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e县城东北隅一座十三米高的青砖方台立在街心，台阶八十一级直上台顶——这就是老君台。抬眼看见台壁砖缝里嵌着几处弹孔，1938年十三发炮弹打上去全没炸。城东太清宫镇，唐宋祭祀老子的殿基和那通宋真宗御书的大碑还在原地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老君台（升仙台，全国重点文保）：县城东北隅，一座高十三米的圆柱形青砖高台，二十四面以精工青砖垒砌，三十三级石阶自台下盘旋而上，暗合道家三十三天。台上正殿偏殿山门面北，殿门檐下嵌“道德真源”“犹龙遗迹”“孔子问礼处”明代石额。台上十三株古桧柏号“弟子树”，苍干如虬。一九三八年日军自东城墙上以炮轰台，大殿山墙、东偏殿后墙及柏树干身共中十三发炮弹，全部哑火，弹孔至今原样嵌在砖缝与树皮里；二零零三年台西南角坍塌处，又清理出一枚生锈未爆的炮弹。；明道宫：县城紫气大道中段，迎禧殿、玄元殿、文昌阁沿中轴线排布，与老君台同属一片。；九龙井：太清宫院内，相传老子降生时九龙吐水洗身处。旧有九井，今存一口，井外口以青石板覆盖；井口井头为一块完整青石雕成覆盆状，高五十二厘米、内径五十厘米，通体阴雕六条竖线将石面均分，浮雕九龙绕井。井水千年不涸，至今清冽。；九龙井：太清宫院内，相传老子降生时九龙吐水洗身处，井亭尚存，井水清冽。；隐山遗址：太清宫院内一处高出地面的台地，从龙山文化到商周、汉唐、宋六层地层垂直叠压。；武平故城（曹操武平侯封地都城，县保）：县城西二十公里邱集乡武平城村，白沟河自城中斜穿而过。经千年黄河淤积，地面仅存东北角一段残墙，高出平地约两米，台地轮廓在田地里仍可辨认。；洞霄宫（太清宫后宫，省保）：太清宫镇太清宫后院，相传祭祀老子母处。前院太极殿外，后宫今存清代三圣母殿五间、娃娃殿三间，院中立宋碑一通，与前院阴阳柏隔院相望。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·老子韩非列传》：\u003cbr\u003e&quot;老子者，楚苦县厉乡曲仁里人也，姓李氏，名耳，字聃，周守藏室之史也。&quot;——苦县即今鹿邑。\u003cbr\u003e▌太清宫历代尊荣：\u003cbr\u003e唐高祖尊老子为圣祖追封太上玄元皇帝，武则天加封太上老君，宋真宗加封混元上德皇帝——历朝九位皇帝亲临鹿邑祭拜。\u003cbr\u003e▌鹿邑老人：\u003cbr\u003e&quot;我小时候老君台弹孔还在，听老辈说鬼子炮打上来全没炸——老子爷保佑的。现在弹孔遗迹做了和平教育点。&quot;\u003c/p\u003e"}, {"n": "虞城老县城·利民古城", "s": "虞城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏代少康以纶邑（今利民镇）为根据地中兴夏。秦汉置虞县。明弘治九年（1496）筑龟背形土城。崇祯八年（1635）改土墙为砖墙，建西门瓮城。1954年县治南迁马牧集，老城改称利民镇。现状：护城湖、护城堤格局完整，商均墓尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老城不叫虞城叫利民镇——1954年县城南迁马牧集后，这龟背形的明城就静下来了。一圈两千多亩的护城湖把方城抱在中间，水外又一道五公里的圆形护城堤，鸟瞰是内方外圆的水抱城。城西南田地里，商均墓那座大土冢还立着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e利民古城：利民镇，明弘治九年筑的龟背形城，内方外圆。城外两千多亩护城湖分东南西北四片，以四门为界，为当年筑城取土挖成；水外再卧一道约五六里长的圆形护城堤，高出水面两人多。湖心仍留观音阁、泰山庙、歇马亭旧基；堤上原有鲁班庙、火神庙、山西会馆，今多不存，山西会馆残碑偶见于南关菜园边。二零一七年起搬迁住户、清淤城湖，今为三A景区。；仓颉墓：古王集乡堌堆坡村西，一座荒丘，传为造字鼻祖仓颉葬处。；木兰祠：营廓镇，花木兰故里祠宇，近年重修。；伊尹祠：谷熟镇，商初名相伊尹故里祠堂。；任家大院（省保·二〇〇〇年）：今虞城县城关镇大同路中段，清中期豫东大地主任氏宅，前后三进院、东西两跨院、五个四合院连成一片，硬山式房屋一百余间，重梁嵌檩、方木板檐，今辟为县民俗博物馆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e商均墓（省级文保）：镇西南商墓村北田地里，一座覆斗形封土大冢，残高约四米、周长百十米，四周柏树环绕。墓前立“商均祖陵”石门，四周平畴麦浪，是上古虞国开国之君商均的墓。早年拆城时，三十来斤重的黑青老城砖被各家搬去砌墙盖屋，唯独此冢未动。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《左传·哀公元年》：\u003cbr\u003e&quot;少康中兴，邑诸纶。有田一成，有众一旅。&quot;——纶邑即今虞城利民镇，少康以此为根据地完成复国。\u003cbr\u003e▌利民镇古谚：\u003cbr\u003e&quot;少康隐忍图强，厚积薄发&quot;——代代教育后辈的少康复国故事。\u003cbr\u003e▌利民镇近年改造：\u003cbr\u003e&quot;2017年以前外地人找不到利民古城墙，本地人看到的也是破烂不堪的古城和脏兮兮的湖水——现在搬迁住户改造成3A景区，成为商丘周边近郊游聚集区。&quot;\u003c/p\u003e"}, {"n": "夏邑老县城·孔子还乡祠", "s": "夏邑", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏邑古称栗，甲骨已有记载。金改下邑为夏邑。明崇祯年间修砖城。1950年代城墙拆除。2014年通济渠夏邑段列入世界文化遗产。现状：孔子还乡祠、运河故道保护展示园并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e城北王公楼村那片岗地，是孔子先祖的家族墓地——他祖上几代从宋国迁来又葬在这，孔子常回来省亲，把这叫还乡里。祠堂是上世纪九十年代在旧址上重修的。城南济阳镇，一段还留着水的隋唐大运河故道从麦田里穿过，堤上的车辙印、行人脚印都还埋在沙层里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大运河通济渠夏邑段（世界文化遗产）：城东济阳镇刘铺村一带，隋唐运河故道长约二十七公里。保护展示棚下，顶宽二十五至三十米的南北大堤与百米余宽的河道原貌并陈：堤面密集的车轮印痕、行人脚印、半个草鞋印、一个完整牛蹄印层层叠压在沙层里；堤上规律排列的木桩经考证为“木龙锁水”设施，借收束河道加快流速、带走泥沙。这是通济渠郑州以东唯一仍留水面的河段，二零一四年列入世界文化遗产。；栗城遗址（省级文保）：相传上古栗陆氏建都处，今为地下遗址。；夏邑文庙：县城内，大成殿尚存。；彭雪枫将军纪念馆（省保·一九八六年）：县城东北十七公里八里庄村，新四军第四师师长彭雪枫殉难处。一九八五年建馆，坐北朝南、松柏成列，院内立纪念碑与半身铜像，东侧仍存第四师指挥部旧屋与将军遗体停放处。；马头遗址（新石器时代·市保）：县城东南马头镇，一处高出周围麦田的龙山文化台地，地表耕层里至今散落红陶、灰陶残片。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孔子还乡祠（省级文保）：城北王公楼村，唐初始建，宋真宗时孔子四十五代孙孔良辅、孔彦辅自曲阜迁此主持扩建，金明清历代增修；近代河患兵燹，古建尽毁。一九九六年起在旧址分三期重修，一九九八年一期大成门、大成殿、碑林、护祠河竣工开放。大成殿九脊歇山、黄琉璃瓦覆顶——唯孔庙方可用皇家黄瓦；山门悬山式三间，前后檐各立四根红檐柱。院中竖香港孔教学院汤恩佳捐资所铸孔子行教铜像一尊，高三米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌2012年中国·夏邑上古古都研讨会（北大/北师大/中科院20多位专家）：\u003cbr\u003e&quot;夏邑为中国上古古都、华夏祖地——栗陆氏为中国上古帝王之一，建都夏邑，距今约8200年到8700年。&quot;\u003cbr\u003e▌《礼记·儒行》：\u003cbr\u003e&quot;孔子，少居鲁，长居宋&quot;——青年时期曾长期在宋国（今商丘一带）居住，考察殷礼。\u003cbr\u003e▌夏邑老居民：\u003cbr\u003e&quot;城区以前立的孔子像不是标准像，叫&#x27;孔子还乡像&#x27;——很多人搞不清曲阜和夏邑的关系，其实孔子祖籍在夏邑，出生地在曲阜。&quot;\u003c/p\u003e"}, {"n": "柘城老县城·朱襄氏陵·容湖水下城", "s": "柘城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国至明为柘城治所。明嘉靖二十一年（1542）七月黄河自野鸡岗决口，旧城淹没，居民移居南关，旧城积水成湖。县城南迁今址。现状：西城墙残段经保护展示后临湖而立，朱襄氏陵、邵园汉墓、李庄遗址并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e城西容湖水面下，沉的是整座明嘉靖以前的柘城旧县——1542年黄河野鸡岗决口一夜灌城，百姓集体南迁，旧城积水成湖。湖岸西缘，一段几百米长的西汉夯土城墙还斜躺在地上，夯窝密密麻麻，手能摸。朱襄氏陵那座土丘在湖的另一头。\u003c/p\u003e\u003cp class=\"main-text\"\u003e柘城故城（全国重点文保·水下城）：县城北容湖底下，叠压龙山、商、战国、汉、唐、宋、明七文化层。明嘉靖二十一年黄河野鸡岗决口灌城，旧城积水成湖。二零一九年西城墙保护展示工程开工，二零二四年通过国家文物局验收，沿湖修了步道可近观。；西城墙夯土残垣：故城西侧湖岸，残存南北向二百三十米，宽十至十五米、高五至十米。夯土层厚约十四厘米，碗口大的夯窝清晰可辨，土里夹着战国铜镞、汉砖、明清陶片——一层土一个朝代。南门附近还挖出过汉代下水管道。二零二四年保护展示工程竣工后，残墙与容湖碧波、环湖步道连成一片“城湖共生”景观。；朱襄氏陵：县城南朱堌寺，一座原始封土大冢，传为上古炎帝支系朱襄氏葬处，后世建寺祭祀。冢体在麦田与寺围合中隆起，乡人年年春祭。；邵园汉墓（全国重点文保）：东汉多室砖墓，商丘境内规模较大的汉代砖室墓，曾出土玛瑙、水晶、琥珀等。；李庄遗址（全国重点文保）：申桥乡李庄村，龙山文化晚期遗址，出土过震惊考古界的九牛祭祀坑。；孟庄遗址（心闷寺遗址，第七批国保）：城西四公里岗王镇孟庄村，商代前期聚落，首次在中原把龙山、二里头、商三层叠压切得清清楚楚，那只树皮纤维编成的商代草鞋底即出于此。遗址旁一株老白果树、一口老古井至今在，与台地同圈保护。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清光绪《柘城县志》：\u003cbr\u003e&quot;嘉靖二十一年秋，黄河自野鸡岗决口，河水从西北冲来，官署民居被淹殆尽。城内居民移居南关数十年，旧城遂成湖。&quot;\u003cbr\u003e▌柘城文保工作者朱卫华：\u003cbr\u003e&quot;西城墙的夯土是一层一层砸出来的，每层厚约0.3米，上面还有夯窝——是用一种叫&#x27;夯杵&#x27;的东西砸出来的，每个坑碗口大。我带过小学生摸过，有孩子说&#x27;摸起来像爷爷的手掌纹&#x27;——其实就是2000多年前民夫的力气印在土里。&quot;\u003cbr\u003e▌容湖老渔民刘德发（76岁）：\u003cbr\u003e&quot;我年轻时旱年湖里能摸到碎瓦当，撒网捞到过瓷碗。爷爷说&#x27;城在水下，水在城上&#x27;——柘城人早就习惯了和水下的城一起过日子。&quot;\u003c/p\u003e"}, {"n": "开封汴梁老城·城摞城桥摞桥", "s": "开封", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国魏惠王六年（前364）迁都大梁。秦王政二十二年（前225）水灌大梁。唐建中二年（781）重筑汴州城。北宋定都东京，三重城郭。金代展筑内城，定今日城墙规模。明洪武元年（1368）改土城为砖城。明崇祯十五年（1642）黄河泛滥，泥沙淤城数米。清道光二十二年（1842）重建今青砖城墙。2018至2022年州桥遗址发掘，入选2022年度全国十大考古新发现。现状：城墙基本完整，州桥、古马道两处以遗址博物馆方式展示。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在中山大道上，脚底下是同一条走了一千多年的路——北端龙亭，南端大南门，一条直线没挪过窝。大梁门北侧马道博物馆里，三层斜坡马道上下叠压，砖面车辙磨得溜光。御街南头州桥遗址那个大坑，把唐、宋、元、明、清五层土层直直立在你眼前。\u003c/p\u003e\u003cp class=\"main-text\"\u003e开封城墙（全国重点文保）：清道光二十二年重建的青砖城，周长约十四公里半，高约八米，是国内仅次于南京的明清城墙；大梁门、安远门、小南门为近年复建，大南门门洞位置千年未移。；州桥及汴河遗址：御街与汴河故道交汇处，一座下沉式方形探方，从地面到地下六
