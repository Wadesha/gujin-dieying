通河起于梁山码头，止于临清，全长125公里，修31座节制闸，元世祖忽必烈赐名&quot;会通河&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌前集村刘家大院后人刘大伯（70岁）：&quot;我家刘家大院是明朝崇祯年间建的——祖上当过梁山忠义堂的义兵总管。大院有个看家楼，高10米，青砖灰瓦，我小时候常爬上楼顶瞭望——能看到山下的开河镇和运河。文革时大队要拆楼炼砖——是我爷爷把族谱和祖训拿出来给大队支书看，支书说&#x27;保下吧，留个念想&#x27;。现在看，那楼是前集村最高的建筑，也是全村的&#x27;风水柱子&#x27;。&quot;\u003cbr\u003e▌开河镇开河闸老船工李老汉（82岁）：&quot;我爹就是运河上的船工——给漕船拉纤的。我爹说，乾隆下江南就是在开河闸停靠的——乾隆亲笔给开河镇写了&#x27;运河古镇&#x27;的匾，挂在镇公所门头上。文革时被红卫兵砸了——我爹当时在供销社当售货员，偷偷捡了半块写着&#x27;镇&#x27;字的木头藏在床底下。后来木头发霉烂了，他伤心了好几天。现在我家还供着运河老船神的牌位，逢年过节烧香磕头。&quot;\u003cbr\u003e▌前码头村村民老周：&quot;2002年考古队来挖大元会通河碑——我当时就在旁边帮忙挖土。挖了两天才挖出碑头，龙头造型，雕得特别精细——龙鳞都能看清。碑身埋在地下两米，只有上部0.6米露在外面。碑头和碑身是分开的——当年黄河泛滥时冲的。考古队要拉到县博物馆去展——村民拦着不让，说这碑是我们村的根。最后协商，县博物馆做了个玻璃钢复制品放村里，原碑存博物馆。&quot;\u003c/p\u003e"}, {"n": "阳谷老城·狮子楼·景阳冈·运河三镇", "s": "阳谷", "p": "山东", "w": "武松打虎·狮子楼斗杀西门庆·阿城盐码头·七级粮码头《水浒传》120回有8回写阳谷·黄河与大运河交汇处·三镇运河名镇·水浒与运河的交点——阳谷有1400年建县史，黄河穿南部、大运河经东部——极贫与极富的对照，造就了水浒故事与运河文化的碰撞。狮子楼始建于北宋末期，因武松斗杀西门庆名扬天下——1984年按宋代风格重建，茅盾题匾额。张秋、阿城、七级运河三镇，明清时&quot;南有苏杭、北有临张&quot;——张秋号称&quot;小苏州&quot;，阿城是盐码头（银阿城），七级是粮码头（金七级）。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e隋开皇十六年（596）：置阳谷县——阳谷之名始见，因县境内有阳谷亭得名。唐乾宁二年（895）：朱全忠击郓帅朱瑄，战于梁山——阳谷为古战场。北宋徽宗年间（1100-1126）：狮子楼始建——西门庆为镇邪压惊盖起狮子楼，楼前雕一对红眼石狮子。北宋末/南宋初：景阳冈武松打虎——施耐庵《水浒传》取材于此。明清：大运河阳谷段漕运繁荣——张秋镇设荆门闸，为漕运枢纽；阿城为盐码头（银阿城）；七级为粮码头（金七级）。明中期：景阳冈武松庙始建——《阳谷县志》载&quot;景阳冈&quot;在县城东40里，沙丘起伏，古木参天。清初：祝家庄改竹口——当地人忌说&quot;三打祝家庄&quot;，改称竹口或祝口，独龙冈因黄河改道消失。清末/民国：运河漕运衰落，城墙损毁。1930年代：阳谷城墙基本无存。1958年：狮子楼重建为二层砖木结构仿清代建筑；祝家庄塔（唐尉迟敬德鞭形塔，18层）在文革中被毁。1984年：狮子楼按宋代风格重建——二层五开间三进深，青砖绿瓦，斗拱飞檐。现状：狮子楼（市文保）、景阳冈（省文保·武松庙明中期始建）、文庙（近千年历史）、张秋镇（运河历史文化名镇·荆门闸石砌闸槽燕尾铁扣）、七级镇、阿城镇遗址、紫石街、祝家庄遗址、水浒文化博物馆。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e狮子楼（市文保·北宋始建·武松斗杀西门庆地标·茅盾题匾额）：阳谷县老城区十字街西南角。据传此地古为酒楼，始建于北宋末期，距今约八百余年。《水浒传》载武松在此杀死恶霸财主西门庆——狮子楼因得美名传世。宋代传说：宋仁宗年间恶霸西门庆霸占赵润春之女秀姑，成亲之夜秀姑灌醉西门庆点火烧屋，西门庆未被烧死——为镇邪压惊，听从风水先生建议盖起狮子楼，楼前雕刻一对红眼披鬓呲牙咧嘴的石狮子。1958年重建为二层砖木结构仿清代建筑，1984年按宋代风格设计重建——二层五开间三进深，高约15.8米，青砖绿瓦，雕梁画栋，硬山顶覆灰筒瓦，屋脊装饰吻兽，檐下斗拱密集。全木结构，没用一个铁铸体，完全靠卵榫吻合。门柱上楹联：&quot;惩恶除暴英雄浩气贯日月，阅古鉴今斯楼坦荡警后人&quot;。著名文学家茅盾（沈雁冰）题写匾额。景阳冈武松庙（省文保·明中期始建·水浒武松打虎发生地）：县城东40里，沙丘起伏，莽草无涯，古木参天。原有9岭18堌堆，景阳冈在东沙堌堆和西沙堌堆之间。武松打虎处碑——景阳冈村中石碑（现移旅游区内），墨玉色，上刻&quot;武松打虎处&quot;五个行书大字——经考证为北宋末年或南宋初期所立，碑阴大部分字迹模糊。武松庙始建于明代中叶，距今500余年——3间起脊，单檐带廊，青砖灰瓦，朱门红窗，古朴典雅。清代增建、1958年重修、近年重建。景阳冈现为旅游区——&quot;三碗不过冈&quot;酒店（复原）、虎啸亭、碑林、武松打虎处石碑、武松石像等。整个景区恰似卧虎形状——武松庙为卧虎头，虎啸亭是前肢，武松打虎处在腰部。张秋镇荆门闸（运河石砌闸·燕尾铁扣·运河四大名镇之一）：阳谷县张秋镇。明清时期漕运枢纽，称&quot;小苏州&quot;——建闸后几百年，排队过闸船只不计其数。素有&quot;南有苏杭、北有临张&quot;之称，赢得&quot;小苏州&quot;美誉。镇上设九门九关厢、七十二条街、八十二条胡同——京杭运河上的五商埠之一。荆门闸为石砌节制闸，条石之间用燕尾槽铁扣紧箍——每块石条凿出燕尾凹槽，铁扣嵌入，极为牢固。镇中曾有107位进士当过闸官——见《阳谷县志》。紫石街（全国最长宋代建筑商业步行街）：狮子楼南200米。路面全部用3厘米厚的紫石铺设——两侧飞檐翘角宋式商铺、茶馆、酒肆、药铺。街中心有五组水浒故事雕塑——武松打虎、李逵坐衙、王婆说媒等。紫石街与狮子楼、文庙连成阳谷&quot;千年古城&quot;宋代街区——武大郎家、孙二娘客栈、王婆茶馆、冷酒馆、银匠铺等《水浒传》场景在此复原。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌阳谷县志办退休干部刘主任：&quot;我研究水浒在阳谷的故事40年——景阳冈现在成了一片缓起的沙冈，古木还剩一些国槐。原来的9岭18堌堆，因为黄河改道，有的被冲平了，有的被淤了。武松打虎处那块碑，我1968年还亲眼见过它立在景阳冈上——文革时被红卫兵推倒，碑角砸裂了一道。后来我偷偷用布包好埋在自家后院，1980年才交给县文保所。现在那块碑就在景阳冈旅游区里，还能看到那道裂纹。&quot;\u003cbr\u003e▌张秋镇老船工王老汉（80岁）：&quot;我爹是运河上的老船工——给漕船拉纤的。我1960年代也拉过——那时候运河水还深，能跑大木船。荆门闸的条石，我年轻时常摸——每块上面都有燕尾槽铁扣，紧紧箍着，600年没松过。我爹说，造闸的工匠是从苏州请来的，凿一块条石要10个壮劳力干一天。现在闸还在——只是运河水浅了，不能走大船了。&quot;\u003cbr\u003e▌祝口村村民老乔（65岁）：&quot;我们村原来叫独龙冈——就是水浒里的祝家庄。村民都忌说&#x27;三打祝家庄&#x27;——所以改叫祝口、竹口。祝家庄塔是唐朝尉迟敬德修的，18层8角，每层有钢铃——我小时候还上过塔，塔心是木梯子，蹬着嘎吱嘎吱响。文革时塔被拆了造窑——我亲眼见的，炸药炸响后，塔身倾斜了好几天才倒。现在只剩塔基，上面长了棵老槐树。&quot;\u003c/p\u003e"}, {"n": "菏泽曹州老城·外圆内方铜钱城", "s": "菏泽", "p": "山东", "w": "72街72井72坑·护城堤圆城方·明正统范希正筑·牡丹之都全国罕见的&quot;外圆内方&quot;铜钱形制古城·72街72井72坑&quot;地煞星&quot;布局——曹州古城的圆形护城堤象征天、方形城池象征地，构成&quot;外圆内方、天人合一&quot;的独特格局，在全国古城中极为罕见。72街对应水浒72地煞星，是古代居民趋吉避凶的美好愿望。曹州因袭西周曹国疆域得名，北周政宣元年（578）置曹州，明正统十一年（1446）知州范希正筑城定址，奠定今菏泽老城基础。72街格局至今未变，街巷名仍被老菏泽人挂在口头。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北魏太和十二年（488）：乘氏县在今菏泽城区建立——历北周、隋、唐、五代、宋至金，共678年。金大定六年（1166）：黄河泛滥，济阴城因水毁——曹州太守赵世安将州治迁至今城（乘氏县旧址），这是菏泽城第一次成为州治。明洪武元年（1368）：因黄河水患，济阴县废除，州治先迁至安陵镇再迁盘石镇——今城改称古雄镇。明正统十一年（1446）：巡抚张骥、知州范希正创建曹州城——度形势、划方隅、定民居、立廨舍、构儒学，初有街道，奠定今老城基础。明天顺年间（1457-1464）：知州伍礼、州同张浩建四门及城楼——东宜春、南迎薰、西丰乐、北朝天。明成化二年（1466）：四门告成。明正德七年（1512）：城垣全部完工——历时66年，城周12里，高2.5丈，堞垣高5尺，趾阔3丈，池深1.5丈、广4丈。明嘉靖元年（1522）：知府沈韩离城五里筑护城堤——圆形护城堤，象征天；方形城池，象征地——外圆内方格局形成。明万历二十一年（1593）：知州许恩在护城堤上植树万余棵。清雍正十三年（1735）：曹州升为府，附郭置菏泽县——&quot;菏泽&quot;地名首次出现。清末：护城河七十二坑塘格局尚存——取土筑城积水成泽。1938年：动乱中西北城墙被炸破。1946-1948年：城墙屡遭兵燹破坏，被强征民工加固又毁。1949年后：陆续拆城建房——砖被拆掉流落在民间院落。1960年代：园林处在城垣遗址上植树造林——成为绿化带。1984年：南城墙中段建儿童公园。1985年：南城墙西段创建曹州书画院——铲平城墙。2004年：市政府决定保护城墙遗址——苏州园林设计环城公园。现状：环城公园（遗老城垣+护城河）、东方红大街（明清东西中轴线）、200米遗存夯土墙段、明代护城堤遗迹、72街格局基本完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e曹州古城墙遗存（明正德七年·环城公园内·200米夯土残段）：城墙高2.5丈，堞垣高5尺，趾阔3丈——1949年后陆续拆城，砖石被居民拉回家建房、砌院墙。现在环城公园内仅南城墙中段还能摸到200米长的夯土残段——每层夯土厚20厘米，用糯米灰版筑。城基部分地段还能挖出明代城砖，砖上有&quot;正德七年造&quot;戳记。2004年苏州园林设计环城公园时，特意保留了这段夯土——上面植有槐树、酸枣树，成了老菏泽人遛弯的地方。圆形护城堤（明嘉靖元年·外圆内方格局关键·大部存）：嘉靖元年（1522）知府沈韩筑护城堤——离城五里，圆形，周长约30里。大堤是为防黄河决口而建，大堤与古城构成&quot;外圆内方&quot;防御体系——圆形象征天、方形象征地。14个堤口中8个为明代修筑，具有较强的历史文化价值。现在环堤公园沿线，护城堤遗迹隐约可见——堤上还长着当年许恩植的老树，树干粗大，据说树龄超过400年。东方红大街（明清曹州老城东西中轴线·72街的横中轴）：前身是明清曹州老城东西中轴线——明正德七年（1512）曹州城建成时就有这条街，明代称为&quot;大街&quot;，因县衙、文庙、察院、总兵府等衙署分列街北，商业店铺聚于街南，是曹州古城的主干道。1966年定名东方红大街，被老菏泽唤作&quot;菏泽第一街&quot;。至今街面仍保持明清街道走向——两侧建筑已多次更迭，但街道宽度约6米，与明代记载基本一致。老街上的标志性建筑——原百货大楼、东方红理发店、菏泽饭店等——都已拆除改建，但老菏泽人提起&quot;东方红&quot;，仍能如数家珍。七十二坑塘遗址（取土筑城而成·青年湖为最大遗存）：明正德七年筑曹州城时，取土筑城、挖土为池——城内城外形成七十二个坑塘。坑塘大者数亩、小者数丈，是古代城市&quot;以水制火&quot;、调节微气候的智慧体现。青年湖是七十二坑塘中最大的一个——约50亩，现为城市滨湖公园。其他坑塘大多在1950-70年代被填平建房。老菏泽人有&quot;七十二坑藏地煞&quot;的说法——和72街、72井一起，对应水浒七十二地煞星。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌环城公园遛弯的张大爷（78岁）：&quot;我家就在城墙根上——60年代初园林处开始在城垣上植树，我当时上小学，跟着大人一起栽槐树。那时候城墙砖还没拆完，我放学就爬城墙玩——墙顶上能骑自行车，城墙根底下有防空洞。文革后开始有人拆砖——先是生产队派车拉，后来城里盖房子的也来拉。我亲眼见一对年轻夫妻拉了一卡车砖回去盖房子——那砖比现在的水泥砖沉多了，一块有40多斤。现在环城公园那段夯土残段，我每周都来走一圈——那是我小时候的游乐场。&quot;\u003cbr\u003e▌东方红大街老商户李婶（72岁）：&quot;我1968年在东方红大街开了家裁缝铺——那时候整条街都是布店、裁缝铺、理发店、饭店。百货大楼是整条街的&#x27;地标&#x27;——三层红砖楼，顶层有个钟表塔，每到整点当当响，远半里地都能听见。90年代大楼拆了，盖了新商厦。我家裁缝铺也拆了——原址现在是一家奶茶店。我女儿说时代变了，我说变没变我不知道——但那条街还是那条街，东方红的名字没改，&#x27;菏泽第一街&#x27;的老牌子还挂着。&quot;\u003cbr\u003e▌环堤公园退休教师王校长：&quot;圆形护城堤为什么是圆的？我研究了20年——古人认为&#x27;天圆地方&#x27;，圆形护城堤对应天，方形城池对应地。离城五里筑圆堤，中间还留了一圈护城河——三重防御：城、池、堤。明代黄河平均每30年决一次口，护城堤至少挡了15次。现在还能看到8个明代堤口——砖券结构，糯米灰浆砌的，和城砖用的是同一种灰。&quot;\u003c/p\u003e"}, {"n": "东明老城·庄子故里·黄河三迁", "s": "东明", "p": "山东", "w": "西汉东昏·金避河迁冤句·明弘治迁大单集·庄子墓灵泉井黄河决口改道的&quot;受害者&quot;·县治三置两废、四设治所、五次迁徙的活标本——东明自西汉建元元年（前140）置东昏县，历两千余年，因黄河泛滥被迫五次迁徙治所，直到明弘治三年（1490）才固定在今县城（大单集）。庄子故里——庄寨村北庄子墓、灵泉井、清乾隆&quot;先贤庄子例应优免差徭碑&quot;尚存。七十二牌坊明末尚存40余座——文革中全部拆毁，仅文庙棂星门幸存。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉建元元年（前140）：置东昏县——秦始皇东游至此忽昏雾四塞，因名&quot;东昏&quot;，治所在今河南兰考境。新莽建国元年（9）：改名东明——东明之名首次出现。东汉：复为东昏县。曹魏：废为镇。宋乾德元年（963）：复置东明县——治东昏镇（今河南兰考），属开封府。金兴定二年（1218）：避黄河水患迁治——从东昏镇迁至冤句县故地（今东明集镇），设四门（朝阳/迎爽/户牖/东昏）。明洪武初：黄河再犯，徙治云台集——旋被淹没，县治又废。明弘治三年（1490）：仍以故地设县——县城设在大单集（即今东明县城），至今已536年未动。建城墙七里四十步，高二丈五尺，护城河深一丈五尺、宽六丈。明天启四年（1624）：《徐州志》载东明城墙周长7里40步，高2.5丈，四门：东&quot;东作&quot;、南&quot;南讹&quot;、西&quot;西成&quot;、北&quot;迎恩&quot;。民国时期：城墙遭战乱破坏。1946-1948年：东明城曾四次易手，城垣渐破。1958年：拆城墙建炼油厂——墙砖被大量拆走。文革：文庙棂星门被毁。现状：仅存护城河遗址、庄子故里（庄寨村·省级文保）、东明县衙大堂（文革后重建）、护城河西段落水段已修复。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e庄子故里（省文保·战国道家创始人·庄寨村北·墓/观/灵泉井）：县城北菜园集乡庄寨村，北依黄河大堤，南临古濮水，左望钓台，右傍漆园。庄子观（南华观）唐贞观二年（628）始建，历唐宋元明清屡经重修——清朝年间占地4公顷，楼台亭榭、假山绿水、幽径雅竹，后屡遭兵燹洪水破坏。1988年庄寨村庄子后裔发起重建——鲁豫两省四县十村的庄姓纷纷捐款，历时一年始成。观后20米即是庄子墓——墓碑屹立，右有灵泉井。灵泉井：清康熙十一年（1672）重修庄子观时，启土约五尺，出泉一窟，深可丈余，清冽异常——乡人取以医疾，称&quot;庄子之灵&quot;。清乾隆五十五年（1790）大名正堂立&quot;先贤庄子例应优免差徭碑&quot;——至今尚存，碑上刻着庄氏后裔免差徭的优待。东明护城河水系（明弘治三年筑·西护城河已修复·市民公园）：护城河深一丈五尺、宽六丈余——西护城河近年已完成修复，河水清澈见底，两岸用石块砌就，护栏仿石雕制，灰瓦白墙挑檐攒脊的仿古屋、亭台、廊榭点缀其间。老东明人记得西护城河&quot;臭水沟&quot;年代——80年代西城墙南半截被开辟成菜市场，烂菜叶、鸡鸭下水全丢进护城河，霉臭味扑面而来，小孩路过不敢吸气。现在的护城河，夏季能看到鱼跳出来——老人们常坐在河边的石凳上下棋、聊天。东明县衙大堂（明弘治三年始建·文革后重建）：明弘治三年（1490）筑县城时创建——三进院落，大堂面阔五间，进深三间，青砖灰瓦，硬山顶。文革中大堂被拆——1980年代由县文物部门牵头重建，恢复了明式形制。大堂内还存着一块清康熙年间的石碑——记载康熙三十六年东明知县杨日升重修县衙的经过。现在县衙是县公安局办公楼——大堂作为会议接待室，不对公众开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌庄寨村庄姓后人庄大伯（70岁）：&quot;全村320户，姓庄的占98%——族谱上明确写着&#x27;先秦思想家庄周后裔&#x27;。每年清明，海内外庄氏后人组团来祭祖——从台湾、香港、新加坡来的都有，每次一两百人。我爷爷说文革时红卫兵要砸庄子观——是全村人把观里的庄子像藏在红薯窖里，把碑埋在村西头的老槐树下。80年代重修观时，我们把碑挖出来——上面还沾着红薯窖里的泥。现在那碑就在庄子观的院子里，立得端端正正。&quot;\u003cbr\u003e▌西护城河改造亲历者王工程师（55岁）：&quot;我80年代刚参加工作时，西护城河是个臭水沟——菜叶子、鸡下水、塑料袋全在里面漂，夏天不敢开窗。2020年县里决定修复——花了整整800天，清淤、砌石、铺底、种荷花。现在能看到鱼了——上次我还看见有人在河边钓上一条半斤重的鲫鱼。我现在每天晚饭后都去河边散步——想起当年的臭水沟，简直像换了一个世界。&quot;\u003cbr\u003e▌东明老街坊刘奶奶（76岁）：&quot;1958年大炼钢铁拆城墙——我父亲是生产队队长，带着人去拉墙砖。我记得那砖比现在的重多了，一块要两个壮劳力抬。拉了一个月，我家后院堆了半墙——后来盖猪圈用了。现在我家猪圈上还嵌着三块带&#x27;弘治三年造&#x27;戳记的砖——我儿子说那是文物，让我别拆。我哪能拆啊——那是我爹当年拉的，上面有他的汗水。&quot;\u003c/p\u003e"}, {"n": "鄄城老城·尧陵·孙膑故里·曹植陈台", "s": "鄄城", "p": "山东", "w": "尧葬榖林·陈王读书台·亘古清泉·孙膑墓&quot;尧葬榖林&quot;的真实所在·孙膑故里·曹植封鄄城王——鄄城素有&quot;古鄄&quot;之称，是中华民族发祥地之一——伏羲氏雷泽履迹生伏羲、舜耕历山、尧葬榖林。孙膑故里在鄄城县红船镇孙老家村——全村90%以上姓孙，族谱明确记载为孙膑后裔。陈台（陈思王读书台）是曹植封鄄城侯/王时的读书处——《赠白马王彪》、《洛神赋》都写于鄄城时期。明代万历四十八年立&quot;亘古清泉&quot;碑——为水井立碑，千年罕见。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e尧葬榖林（据《吕氏春秋·安死》）：尧葬于榖林，通树之——鄄城富春乡榖林庄村南，龙山文化遗址14万平方米。西周：鄄属卫。春秋：鄄城是齐国鄄邑——齐桓公&quot;九合诸侯&quot;之一。战国：孙膑故里——红船镇孙老家村，1990年出土明嘉靖重修亿城寺墓碑&quot;膑墓址深邃&quot;。汉宣帝本始二年（前72）：始祭尧陵于鄄城。东汉元和二年（85）：帝使祀尧于成阳（鄄城旧名）。三国魏黄初二年（221）：曹植封鄄城侯——次年改封鄄城王。黄初四年（223）写《赠白马王彪》。黄初三年（222）：曹植徙封为陈王——鄄城仅居住二年，留下陈台、故城等遗迹。明万历四十八年（1620）：鄄城立&quot;亘古清泉&quot;碑——南大街水井立碑，捐资修井者百余人姓名刻碑。清乾隆元年（1736）：山东巡抚岳浚定榖林为尧陵旧址——自此官方祭尧陵于鄄城。1946年：鄄城易主——城垣遭破坏。1947年：刘邓大军强渡黄河——鄄城为渡河点之一。文革：尧陵享殿、孙膑祠等遭破坏。现状：尧陵（省文保·封土直径35米高9米）、孙膑故里（孙老家村·孙氏祠堂）、陈台遗址（杏花岗村·已夷为平地）、亘古泉（仍存·水清澈）、庄子钓鱼台（全国十大钓鱼台之一）、羊左全交墓（义士羊角哀左伯桃合葬墓）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e尧陵（省文保·上古尧帝归葬处·龙山文化14万平方米·榖林庄村南）：鄄城县西南7.5公里富春乡榖林庄村南，东临榖林苗圃场院，南距金堤1公里。封土直径35米、高9米，其上遍生榖树。2015年菏泽曹州文物考古所勘探——尧陵修建在龙山文化遗址之上，龙山遗址平面呈椭圆形，南北最长约420米、东西最宽约330米，面积约14万平方米。文化层厚4.5米以上，中部堆积达10米——出土遗物包含明清、汉代、周代、龙山文化时期的陶片、骨头、烧土块、琉渣等。尧葬榖林的记载始见于秦代《吕氏春秋·安死》：&quot;尧葬于榖林，通树之。&quot;——榖林就是榖林庄村。明代帝王陵布局：陵区绕陵墙、享殿三间、东西朝房、更衣亭；清光绪二十九年（1903）濮州知州谬润绂书&quot;帝尧陶唐氏墓&quot;碑，现仍立于墓前。孙膑故里（孙老家村·孙氏祠堂·1990年出土明嘉靖墓碑）：鄄城县东北20公里红船镇孙老家村——全村大多数人姓孙，族谱明确记载为孙膑后裔。孙氏祠堂始建于明代，文革中被拆——1992年孙氏族人捐资重建，内供孙膑画像和历代族谱。1990年考古队在村北向阳河东岸出土明嘉靖三十七年（1558）重修亿城寺墓碑——上刻&quot;膑墓址深邃&quot;，经专家多方考证，确定孙膑墓址在此。孙氏族人重修坟茔——墓丘直径8米，封土高5米，四周砌以围石，墓前树碑，篆书&quot;孙膑墓&quot;。亘古清泉（县重点文保·明万历四十八年立碑·千年古井·水清澈甘洌）：鄄城县老城区南大街中段路西——一口大水井，用水泥板覆盖，仅留直径约0.5米的圆口。井边有明代万历四十八年立碑一栋，上书四个斗方大字：&quot;亘古清泉&quot;——为水井立碑，实为古今稀有，冠以&quot;亘古&quot;二字更为罕见。碑阴刻捐资修井者百余人姓名——&quot;知此泉年代久远，二可知这里民风淳厚&quot;。据传此泉原是一汪泉水，因水质清澈甘洌招来百姓就近而居。曹操屯兵鄄城时，挖掘为井，取名&quot;亘古清泉&quot;——曹植曾饮此泉水酿的酒，写诗&quot;归来宴平乐，斗酒美十千&quot;。现泉水仍清澈甘洌，取之不竭。陈台遗址（曹植鄄城读书台·旧城镇杏花岗村·已夷为平地·遗址可辨）：旧城镇东北1公里许，杏花岗村西南——曹植于魏文帝黄初二年（221）封鄄城侯，次年改封鄄城王。在此台读书、吟诗赋文。原台台前有十数级台阶，台上有读书厅、藏书室和会文亭，从王府到读书台通有长廊。清代犹存高出地面数尺的台基，上有残砖碎瓦。因黄河多次决口，读书台渐被淤没。现虽已夷为平地，然遗址尚可辨知——当地村民还能指出遗址四至，每年都有曹植爱好者来此觅踪凭吊。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孙老家村支书孙书记（62岁）：&quot;我们村320户，290户姓孙——族谱上第一行写着&#x27;始祖孙膑&#x27;。文革时红卫兵要砸祠堂里的孙膑像——我爷爷是老支书，他说&#x27;砸就砸吧，但这族谱是我们的命根子，得藏好&#x27;。他把族谱藏在大队部的档案柜最底层，上面盖了一本《毛泽东选集》——硬是没被发现。现在那本族谱还在，线装手抄本，纸都黄了，但字迹清清楚楚。2008年孙膑兵法国际研讨会就在我们村开的——来了十几个国家的专家，看了族谱都竖大拇指。&quot;\u003cbr\u003e▌尧陵守陵员王老汉（80岁）：&quot;我守尧陵50年了——从我爹手上接过来的，他守了40年。文革时尧陵的享殿被拆了——红卫兵要挖尧帝的墓，挖了两米就停了——说&#x27;这是龙山文化遗址，不能再挖了&#x27;。我爹当时就守在陵前的大槐树下——那棵树现在还在，比我刚来看的时候又粗了一圈。清明前后，海内外姓尧的、姓唐的后人都来祭祖——每年至少五六十人，从台湾来的也有。&quot;\u003cbr\u003e▌亘古泉井边的老郑（75岁）：&quot;我喝亘古泉的水喝了60年——这水跟城里自来水完全不一样，甜，烧开水不结水垢。有人说这井通地下河，连黄河水都能抽上来——当然我不信，但水确实好。文革时有人想填井盖房子——全村老头老婆围在井边不让填，说&#x27;这是曹操挖的、曹植喝过的，你们敢填试试&#x27;。后来生产队把井上盖了个水泥板，留了个圆口——就一直用到现在。&quot;\u003c/p\u003e"}, {"n": "成武老城·伯乐故里·郜国水下古城", "s": "成武", "p": "山东", "w": "周代郜国·伯乐葬成武·文亭湖底埋城·大台堌堆8米西周姬姓郜国故城·伯乐（孙阳）故里·湖底的千年古国——成武是周文王之子、周武王弟弟的封地——西周首批姬姓诸侯国之一。1986年成武百姓在文亭湖内开挖鱼塘时，偶然发现一座千年古城——考古专家认定这就是周代郜国故城！全城现已深埋文亭湖底。文亭山是典型的鲁西南堌堆文化遗址——人工筑台避水而居，孔子弟子曾参和三冉曾在此以文会友，&quot;文亭山&quot;因此得名。伯乐相马的故事天下皆知——伯乐墓就在成武县伯乐集镇伯乐村。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周初：周武王封弟弟于郜国——西周首批姬姓诸侯国之一，地位尊崇。春秋战国：郜国沦为大国附庸。鲁隐公十年（前713）鲁齐郑伐宋&quot;取郜&quot;。秦：置成武县——秦属东郡，汉属梁国后属山阳郡。北齐：升为永昌郡。唐贞观十七年（643）：首次归属曹州。五代至金：属单州。元：复归曹州。明：属兖州。清：属曹州府。明嘉靖年间：护城大堤越筑越高——堤内地面因洪水淤积低于堤外2.5-3米。古城逐渐成为凹陷洼地，最终蓄水成湖——郜国故城深埋文亭湖底。1986年：成武百姓挖鱼塘时发现湖底古城——考古队勘探认定为周代郜国故城址。1992年：成武故城址（郜国古城）列为山东省第二批重点文保——东西宽3525米、南北长1800米、总面积632.5万平方米。现状：郜国故城深埋文亭湖底（需水下考古），护城大堤存，文亭山（堌堆）存，大台遗址（省文保·高8米），卧化塔（国保·唐塔），伯乐墓（市文保），成武县衙遗址（市文保·古城街西段）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e郜国故城（湖底古城·省文保·待水下考古·文亭湖底632.5万平方米）：成武县文亭湖底——1986年成武百姓开挖鱼塘时偶然发现！考古队结合史料记载认定为周代郜国故城址——东西宽3525米、南北长1800米、总面积632.5万平方米。因黄河携带大量泥沙的洪水几度来袭，造成堤外地面不断增高，大堤也越筑越高——城内反而逐渐成了凹陷洼地，最终蓄水成湖。南堤土壤剖面可追溯到春秋时期——城堤夯窝跟曲阜鲁国故城城址基本一致。目前因地下水和技术条件限制，尚未全面发掘——成武博物馆馆长说有了水下考古就能全面勘探。如今文亭湖成了城市景观公园——碧波荡漾、荷香四溢，但谁能想到湖底埋着一个3000年前的姬姓古国都城？文亭山（堌堆文化遗址·孔子弟子曾参三冉以文会友·&quot;文亭&quot;由此得名）：文亭湖内的一座&quot;人工小山&quot;——高约10米，实为典型的鲁西南堌堆文化遗址。4000年前先民为避黄河洪水，人工筑起土台，择高而居——后来转向筑堤护城，堌堆逐渐成为高地地标。孔子弟子曾参和三冉（冉雍、冉耕、冉求）曾在此以文会友——四人均位列孔门七十二贤，其中三冉又位列孔门十哲。后人在土丘上建&quot;会文亭&quot;——&quot;文亭山&quot;由此得名。汉高祖刘邦曾在此停留，时有祥云出现——故又名&quot;云亭山&quot;。现在文亭山上建有亭台楼榭，成了成武市民登高观湖的好地方。卧化塔（国保·唐贞观十四年建·山东现存最完整的唐代砖塔之一·八棱七级高22米）：大田集镇田塔村东100米——唐贞观十四年（640）建，因塔身向西北倾斜，当地人称&quot;卧化塔&quot;。八棱七级，通高22米，通体砖结构。每层檐下饰斗拱、佛龛——佛龛内有陶质浮雕佛像，可惜文革中大多被砸毁。塔基边长4米，第一层南面设券门。2019年国务院公布为第八批全国重点文保单位——也是成武县第一个国保单位。2009年曾对塔身进行过一次&quot;扶正&quot;——倾斜角度约1度，已基本矫正。伯乐墓（市文保·春秋相马师孙阳·伯乐集镇伯乐村）：县城西8公里伯乐集镇伯乐村——村因伯乐而得名，村中有伯乐祠，墓有石碑。唐代文学家韩愈以伯乐相马的故事为基础写下《马说》——道尽历代怀才不遇之人的心声。2019年成武县在县城西北建了&quot;伯乐相马&quot;雕塑——伯乐手握缰绳，身旁骏马昂首嘶鸣。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文亭湖公园退休工人王师傅（68岁）：&quot;我在文亭湖边住了40年——小时候还能在湖里摸鱼。1986年那个夏天，村里挖鱼塘的在湖中间挖出了城墙砖——消息传开，整个成武都轰动了。县文保所的人来了，说这是郜国古城——埋在湖底下三千年了！我当时还去看了——那砖比现在的沉多了，刻着绳纹。后来鱼塘不让挖了，湖底用水泥封住了。现在我每天在湖边钓鱼——谁能想到我脚下2米深就是周天子弟弟的都城呢？&quot;\u003cbr\u003e▌卧化塔看护人李老汉（72岁）：&quot;我守卧化塔30年了——这个塔怪，往西北歪，像个驼背老人。传说唐代建塔时，工匠听了个白胡子老头的话，故意让塔歪着——说&#x27;卧者化也，卧化塔卧着才能化&#x27;。文革时红卫兵要拆塔身的佛龛——爬上去砸了六个佛头，正砸第七个时，塔顶掉下来一块砖砸了脚——后来就没人敢再动了。2019年国务院批了国保——现在塔周围立了铁栏杆，游客不能再摸塔身了。&quot;\u003cbr\u003e▌成武博物馆郭馆长：&quot;我们一直在等水下考古——郜国故城是成武最大的宝贝。1986年发现后做了试掘——探沟里挖出了春秋时期的陶鬲、陶豆残片，还有战国时期的铜箭头。但湖底水位一直很高，试掘到1.5米就停了。等技术条件成熟了，我们要让这个沉在湖底三千年的姬姓古国重见天日——632.5万平方米，比河南安阳殷墟还大，如果能发掘出来，那是西周考古的重大发现。&quot;\u003c/p\u003e"}, {"n": "德州老城·运河九达天衢·苏禄王墓", "s": "德州", "p": "山东", "w": "明洪武砖城形似靴·南门瓮城关帝庙·北厂漕仓遗址·董子读书台京杭运河三大粮仓之一·全国苏禄东王墓·九达天衢神京门户——德州自隋开皇六年（586）置长河县，因大运河永济渠开凿而崛起。明洪武三十年（1397）德州卫都督张文杰、指挥徐福率卫军历时两年建砖城——形似靴（故称&quot;靴子城&quot;），城周5100米、高12米、厚9米、护城河宽15米深6米。南门瓮城内有关帝庙、三义庙、娘娘庙建筑群——1951年整体拆除。明永乐十五年（1417）苏禄东王病逝德州——永乐皇帝以王礼厚葬，苏禄王墓现为全国唯一外国国王陵寝、国保单位。明清德州&quot;九街八巷二角&quot;为鲁北商业中心，清乾隆时城内街30、市2、商号400余家。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明洪武九年（1376）：设德州卫——5600名卫军，单独户籍&quot;军户&quot;。明洪武三十年（1397）：德州卫筑砖城——都督张文杰、指挥徐福历时两年。砖来自城南20里运河沿岸村——窑上村、伙房村即此得名。明永乐五年（1407）：增设德州左卫——两卫以建设街为线分治。明永乐九年（1411）：知州何原移德州治于卫城内——州卫同城而治。明永乐十五年（1417）：苏禄东王病逝德州——明成祖以王礼厚葬，墓地在北营村。明万历四十年（1612）：知州孙森大修州城——新筑门楼、谯楼、瓮各四座。清乾隆八年（1743）：发帑金14万两重建州城——历史三年，新筑门楼、谯楼、敌楼。城内有寺庙、庵、祠、坛、驿等70余处，官署衙门72处。1946年：德州易主后取城墙土筑运河河堤和道路。1947年：小西门广川门因战乱损毁，提前拆除。1949年春：扒掉部分城墙保障过境军队南下过境。1950年：大西门聚秀门拆除。1951年：南门朝阳门（含瓮城关帝庙建筑群）拆除。1958年：德州城东南角建提名塔（雁塔）拆除，东门长乐门拆除。1959年底：城墙和护城河大部拔除，部分护城河道成为市区景点。1961年：北门拱极门城楼和门洞拆除。1964年：城墙整体基本消失——仅城西北&quot;靴子尖&quot;小段土垣遗迹、新湖街道段城墙遗址残存。现状：苏禄王墓（国保·全国唯一外国国王陵寝）、北厂漕仓遗址（省文保）、窑上窑址（省文保）、运河残段、德州城墙遗址（省文保·新湖街道段100余米）、九达天衢坊（仿建）、董子读书台（仿建）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e苏禄王墓（国保·明永乐十五年·全国唯一外国国王陵寝·北营村守墓人后裔）：城北北营村——明永乐十五年（1417）苏禄国东王都马含巴剌率300人使团跨海来朝——这是有文字记载的最早菲律宾国王访华。访问结束归国途中，东王不幸染病在德州病逝。永乐皇帝闻讯悲痛，下旨以王礼厚葬东王——墓道南向，陵墓为土丘，冢高2米，直径8米，墓南立有&quot;苏禄国恭定王墓&quot;石碑。永乐皇帝还赐东王次子温哈剌、三子安都鲁及侍卫十人留居德州守墓——守墓人后裔至今仍在北营村，已发展到数百人，清代雍正年间入中国籍，民国时以&quot;温、安&quot;二姓居之，后多数改姓&quot;王&quot;。2005年菲律宾苏禄王室后裔访华祭祖——&quot;寻根之旅&quot;持续至今。德州北厂漕仓遗址（省文保·金元明清·德州运河四大粮仓之一）：城西北北厂村——金代始建，元代扩建——是德州运河沿线最大的漕运粮仓。明清德州为运河四大粮仓之一、全国33个重要工商城市——南粮北运至此中转，北厂的粮食仓廒连接运河码头，漕船可直接靠岸卸粮。现遗址面积约2万平方米——地面还能看到散落的仓基砖、柱础石。考古队曾在此挖掘出金元时期的陶质粮仓模型。竹竿巷（城西江畔·明清运河北段最大竹器加工基地）：城西运河东岸——德州不产竹子，但明清时期竹木加工业却很发达——因允许漕船搭载一定数量的私货，江南漕船运竹木沿运河发卖，给德州提供了充足的竹器加工原料。清末民初德州竹竿巷商户已达40余家——产品有水旱筛子、箩筐、筷子、竹帘、竹席、竹轿、鸟笼等。德州成为运河北段最大的竹器生产基地和销售市场——&quot;南来北往的客商，每到德州必逛竹竿巷&quot;。现在巷内还存着清末民初的老院落——青砖灰瓦，木窗棂上还能看到当年的商号招牌痕迹。窑上窑址（省文保·明代德州城砖烧造窑场·黄河涯镇窑上村）：城南20里黄河涯镇窑上村——明洪武三十年（1397）筑德州城时，烧砖的窑场就在这里。当时卫军历时两年建砖城——砖需要300万块以上，窑场日夜烧造，工匠们的伙房就在窑场旁边——&quot;窑上村&quot;、&quot;伙房村&quot;因此得名。现遗址面积约1.5万平方米——地面散落着大量明代城砖，砖上有&quot;洪武三十年造&quot;戳记。考古队清理出明代窑炉遗迹——马蹄形窑，长4米、宽2.5米，炉膛内还能看到烧剩的煤渣。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏禄王墓守墓人王老爷子（78岁）：&quot;我是温哈剌的后裔——传了22代了。我家就在苏禄王墓旁边住，每天早上去扫墓，50年没断过。文革时红卫兵要挖苏禄王的墓——说&#x27;这是帝国主义走狗的墓&#x27;。我当时20多岁，和全村18个青年守在墓门前，手拉手围成一圈。红卫兵骂我们是&#x27;海外走狗后代&#x27;，但就是没动手——后来据说上头有人打电话说&#x27;苏禄王是国际友人，不能挖&#x27;，就不了了之。现在菲律宾每年都有王室后人来祭祖——2019年来了一个公主，跪在墓前哭了半小时。&quot;\u003cbr\u003e▌竹竿巷老竹匠张师傅（65岁）：&quot;我爹是竹竿巷最后一代竹匠——70年代公私合营进了竹器厂。我80年代初还学了两年——那时候一把竹丝刀要磨3天，削出来的竹丝细如头发。后来竹器厂倒了，没人买竹筐了——现在全巷只剩我一家还做竹器，主要给景区做些摆设品。前几年有个大学生来拍纪录片——说德州竹竿巷比苏州的还早100年，我说你别吹了——我爹说光复前巷里有400多家，现在就剩我1家。&quot;\u003cbr\u003e▌北厂村老船工李老汉（82岁）：&quot;我爹是漕船上的老船夫——给北厂漕仓卸粮的。我1958年也当过运河上的船工——那时候运河水还能跑大木船。北厂漕仓有36个粮仓——每个仓能装50万斤粮食。我爹说，清代道光年间有一次漕船排了5里长——南方来的粮船、北京来的官船、德州的商船，挤得运河水都不动了。现在漕仓成了省文保——我去年还进去看了一眼，仓底还能看到当年的木桩槽。&quot;\u003c/p\u003e"}, {"n": "武城老城·运河三迁·古贝州", "s": "武城", "p": "山东", "w": "宋大观迁东岸·黄河决口淹西岸·焕光大桥·故城遗址226万㎡·董仲舒下帷讲学武城&quot;三迁&quot;是运河与黄河争斗的缩影——战国东武城（平原君封地）→ 隋永济渠西岸唐迁 → 宋大观二年（1108）黄河冲毁西县城东迁运河东岸（即今武城老城镇，存世865年）→ 1964年运河为界分冀鲁 → 1973年迁东北新城。武城与故城本是一家人——运河以西是河北故城，运河以东是山东武城，1964年国务院以卫运河为界拆分。2024年在河北故城发现了唐宋武城治所遗址（226万平方米）——河北省新增第七批省保。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国：东武城（赵国平原君赵胜封地）——&quot;筑城备武&quot;，是赵齐交界要塞重镇。秦始皇统一：设武城县——西汉高帝四年（203）置清河郡，东武城属之。唐调露元年（679）：县城迁至今河北故城关庙村——紧挨着永济渠西岸，热闹码头。宋大观二年（1108）：黄河决口，西县城被冲毁，城墙倒，百姓搬高处——县城不得不东迁运河东岸（即今山东武城县老城镇），自此一直到1973年，武城县城在运河东岸屹立865年。元至元元年（1264）：北部置故城县（今河北衡水故城县）——元明清属河间府。1964年：国务院以卫运河为界，河西划河北故城，河东留山东武城——武城县运河西岸大部分区域划归故城县。1973年：卫运河拓宽，老县城需拆迁——武城县政府迁东北20公里重建新城（武城镇），原址老城镇。2010年：武城老大桥（焕光大桥）列入县级文保——全长150米，1958年始建，前苏联设计图纸，主孔跨度50米。2014年：老武城遗址（焕光大桥东岸河滩遗址）列为市级文保——遗址在运河东大堤外，宋大观迁来后在此建城。2022年：河北故城军屯镇关庙武城遗址发现——面积约226万平方米，唐调露元年至宋大观年间的武城县治——河北省启动勘探，2024年列入第七批省保。现状：焕光大桥（县级文保）、老武城遗址（市级文保）、故城武城遗址（河北省保·226万㎡）、董学村（董仲舒下帷讲学遗址·明万历立碑）、四女寺水利枢纽（运河节制闸）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e故城武城遗址（河北第七批省保·2022年发现·226万平方米·唐宋武城治所）：河北衡水故城县军屯镇关庙村、杨寺村和建国镇马寺村一带——面积约226万平方米，是唐调露元年（679）至宋大观年间（1107-1110年）的武城县治所。遗址于2022年被发现，2024年启动勘探——以永济渠故道为界分为南北两区：北区为城址区（南北长约1100米、东西宽约600米，南部发现城垣遗迹）；南区南北长约300米、东西宽约500米，未发现城垣。文化层厚2-3米——遗物以邢窑、巩县窑、定窑、越窑、磁州窑等多地瓷窑瓷器为主，凸显武城作为运河重镇的水陆通道作用。焕光大桥（县级文保·1958年建·前苏联设计·主孔跨度50米·武城-故城两省桥）：武城县老城镇东运河上——1958年国家清淤拓宽运河，同时由山东省交通厅承建，使用前苏联设计的图纸——同期、同图纸施工的还有临清大桥。原桥全长仅150米，桥宽6米，主孔跨度50米——是武城县历史上第一座混凝土结构的大型公路桥。2009年桥体加固重修，增加了人行道和防护栏——现在仍能通行。大桥横跨卫运河——桥西是河北故城县，桥东是山东武城县——桥上有&quot;鲁冀界&quot;的牌子，1964年分省后一直立到现在。董学村（董仲舒青年下帷讲学处·故城县房庄镇·明万历立碑）：河北衡水故城县房庄镇董学村——原名&quot;十里长村&quot;，因西汉大儒董仲舒青年时代在此下帷讲学——改叫&quot;下帷村&quot;，后改&quot;董学村&quot;。董仲舒是河北景县人——但他小时候在故城县董学村读书求学，青年时代又在这里&quot;下帷讲学&quot;，传道授业。2023年房庄镇榆林村出土了一通明万历年间的石碑——刻着&quot;董仲舒下帷授徒&quot;，碑文记载重修泰宁寺的过程，也记下了明代当地人追忆董仲舒在此讲学的情景——一块碑，400年的记忆，把董仲舒和这片土地连在了一起。郑口运河挑水坝（全国重点文保·清道光年间·6座砖石坝·不同形状对付不同水流）：故城县郑口镇——这里河道拐了一个大弯，水流又急又猛，历史上经常决堤。清道光二十三年（1843年）当地人开始修挑水坝——用大柳树捆成捆倒挂在岸边，后来慢慢加固成砖石结构，黄土、白灰、糯米汤搅拌夯实，外面再砌青砖。现在运河边还留着6座挑水坝——样子不一样：有长方形的、有菱形的、有梯形的——不同的形状对付不同的水流：有的是直接削减水势，有的是引导水流方向。你站在坝跟前看——能感受到古人那种因势利导的智慧。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郑口镇老船夫郑大爷（85岁）：&quot;我爹是运河上的老船夫——给漕船拉纤的。1964年分省的时候，我爹说&#x27;这条河原来是我们郑口镇的，现在一半给河北、一半给山东——河还是那条河，水还是那股水，可人变两省了&#x27;。我现在还能背船工号子的调——&#x27;嘿哟嘿哟！前面的走哇！后面的跟上啊！&#x27;——元代开始喊，明清鼎盛，现在没几个人会了。前两年县文化局录我喊号子——说要申报省级非遗，录了整整两天，录了三段。&quot;\u003cbr\u003e▌焕光大桥上过桥的司机小刘（35岁）：&quot;我经常从山东武城过桥去河北故城——桥中间有块牌子写着&#x27;鲁冀界&#x27;，拍照留念的人不少。我爹说这桥1970年代还窄得只能过一辆卡车——我小时候过桥，自行车车把能蹭到桥栏杆。2009年桥加固重修，加宽到能并排跑两辆卡车。现在桥两头的收费站早就撤了——但我每次过桥还是会减速——毕竟这桥承载了武城和故城几代人的记忆。&quot;\u003cbr\u003e▌董学村董氏后人董大伯（62岁）：&quot;我家就是董学村的——族谱上写着&#x27;董仲舒后裔&#x27;，全村320户有180户姓董。明万历那块碑就在村头的泰宁寺里——文革时被推倒了，埋在村西头的机井旁边。2023年挖出来时，碑上的泥还没擦干净，&#x27;董仲舒下帷授徒&#x27;几个字还能看清——我当时在场，心里激动得直跳。现在碑立在村头的董仲舒文化广场上——每年清明，全村姓董的都要去碑前祭拜。&quot;\u003c/p\u003e"}, {"n": "聊城老城（东昌府·光岳楼）", "s": "聊城", "p": "山东", "w": "江北水城、大运河九省九商埠、金瓶梅武松打虎的原型地", "h": "", "r": "\u003cp\u003e光岳楼（国保第三批）：明洪武七年建，高33米，虽黄鹤岳阳亦当望拜，聊城地标。山陕会馆（国保第六批）：清乾隆年建，聊城最大会馆，戏楼/钟鼓楼/壁画/石刻/木雕。海源阁：清代四大藏书楼之一。东昌湖：环抱古城，江北水城核心。府文庙/七贤祠：古建遗存。运河故道：聊城段已断流，遗迹存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌翁先生（63岁，聊城市地方志办公室退休主任，写《聊城运河志》15年）：&quot;我退休前做了15年聊城运河研究——走遍了聊城8个县市区所有的运河遗迹。2018年大运河申遗成功，聊城段入列。有人说聊城的名气不如枣庄台儿庄大——我说枣庄台儿庄是&#x27;活着的景区&#x27;，聊城是&#x27;活着的古城&#x27;。我小时候还在运河边上玩——那时候运河水已经干了，但河床还能跑自行车。1960年代拆城墙，我爹带我去捡砖——那些砖上刻着&#x27;洪武二年造&#x27;，拿回家垒鸡窝了。现在那鸡窝还在我家后院里。聊城的根不在热闹的景区里，在运河的河床里、东昌湖的水波里、光岳楼的砖缝里。每一块砖都能讲一个故事——如果你停下来听的话。&quot;\u003c/p\u003e"}, {"n": "临清老城（运河钞关）", "s": "临清", "p": "山东", "w": "全国第一税关、抵得上一省赋税、金瓶梅西门庆商铺原型", "h": "", "r": "\u003cp\u003e临清钞关遗址（国保第七批+世界遗产）：会通河畔，明清官署，拦河铁索遗迹，运河唯一留存钞关。鳌头矶：运河枢纽，古临清八景之首。临清清真寺：明代，山东最大清真寺之一。舍利塔：明代，运河航标塔。金瓶梅文化研究基地：西门庆商铺原型地。；楚长城遗址：西平至信阳段，中国最早长城之一，6县密集分布。嵖岈山：遂平，国家5A，花岗岩天然盆景，西游记取景地。竹沟变革纪念馆：确山，中原局旧址，刘少奇/李先念驻地，小延安。棠溪源：西平/遂平交界，战国棠溪铸剑处。盘古山：泌阳，盘古开天圣地。嫘祖庙：西平，西陵氏养蚕丝。沈国故城遗址：平舆，春秋姬姓沈国都城。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵福寿（71岁，山东聊城人，金瓶梅研究学者，著《金瓶梅与清河运河文化》）：&quot;我研究金瓶梅30年。很多人以为金瓶梅写的是山东清河县——其实那个清河县是明代运河边上的清河县，就是今天临清的运河西岸区域。我把金瓶梅里提到的所有地名和临清现存古迹一一比对：狮子街就是临清北街（明清县衙门沿街石坊多有狮子）、东街西街南街完全吻合、临清码头的描述和今天会通河的位置丝毫不差。临清钞关是明清全国第一税关——年税8万两，山东全省年税才8.8万两！金瓶梅里的西门庆就是靠南北货物走私、逃钞关税发财的。我觉得最有意思的是：西门庆的原型可能是临清某家典当铺的掌柜——因为典当铺是那时候最赚钱的行当之一。&quot;\u003cbr\u003e▌李书记（50岁，驻马店市博物馆馆长，驻马店&quot;天中文化&quot;挖掘者）：&quot;驻马店叫&#x27;天中&#x27;——天中是天下的正中。你打开中国地图，驻马店的经度纬度刚好是华夏文明的几何中心。所以盘古在这里开天、女娲在这里造人、伏羲在这里画八卦、嫘祖在这里养蚕丝——这些传说不是瞎编的，是古代的智者用地理方位选出来的&#x27;文明起点&#x27;。我在博物馆讲了15年课——每次讲到楚长城，我都跟听众说：&#x27;这不是普通的土坡，这是中国人最早修的长城，比秦长城早几百年&#x27;。驻马店人有自己的骄傲——我们不是什么&#x27;边缘县城&#x27;，我们是中华文明的圆心。&quot;\u003cbr\u003e（T23安徽+山东+驻马店10县·完）\u003cbr\u003e（以上为T23大批次10县正文）\u003c/p\u003e"}, {"n": "山东·高唐州老城", "s": "高唐", "p": "山东", "w": "9999个石碌碡地基·鱼丘湖环城湖·清平迎旭门", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北魏景明三年（502）：建土城（南清河郡治），城圈湖（今鱼丘湖）挖土筑城而成。宋宣和七年（1125）：清平始建土城。明正德六年（1511）：知州张纮增高唐土城，周九里，四门（瞻岱、观成、迎薰、拱极）。明嘉靖三十一年（1552）：塞北门（城内多潴水）。清嘉庆元年至三年（1796-1798）：清平改建砖城，周852丈。1958年：拆高唐明代城墙，地下9999个石碌碡重见天日。1997年：清平迎旭门集资修缮\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e高唐古城墙遗址：县保，北魏始建，东北湖东岸尚存遗址。鱼丘湖：1060亩，中国江北县级最大城市内陆湖，城圈湖格局。清平迎旭门（省保）：仅存东门，南北长15.5米东西宽12.9米，1997年集资47万按明代要求重建门楼。高唐文庙（省保）：元代，崇圣祠、尊经阁、泮池尚存。兴国寺塔（国保）：宋，梁村镇，八角九层砖塔。\u003c/p\u003e\u003cp\u003e高唐明代砖城（周九里）：1958年拆除。9999个石碌碡地基：拆城墙时挖出，大量流失。四门城楼：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e1958年拆城墙时，高唐城根底下挖出了密密麻麻的石碌碡——就是农村轧麦场的石滚子，一个个竖埋在土里，数量精确到9999个。专家说这是古代的筏板基础，分散压力、减震、防冻胀、防盐碱。为什么是9999不是10000？古人说满招损谦受益，9是阳数之极，留个余地。现在那些石碌碡大多被村民搬回家垫了地基、垒了猪圈。\u003c/p\u003e"}, {"n": "山东·平原老城", "s": "平原", "p": "山东", "w": "北齐迁城·龙门石刻·颜真卿抗安史城墙", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：刘备任平原相（刘备鞭打督邮后挂印而去）。北齐天宝二年（551）：迁至今址（原在城南25里张官店），初为土城。明万历元年至十一年（1573-1583）：改建砖城，同时建成水门（后称龙门）、文昌阁。解放初：城墙渐遭毁坏，文昌阁、龙门保留较完整。文革期间：水门（龙门）、文昌阁拆除。2010年：在琵琶湾公园西门方位重修龙门、文昌阁（仿建）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e平原郡古城墙遗址：北城墙遗址仍存，夯土+糯米+草秸，绊马石时常从护城河浮起。龙门石刻（省保）：原水门龙门石刻，狂草龙门二字（高100cm宽50cm），一笔连体，现存县图书馆。颜真卿公园：纪念颜真卿抗击安史之乱固守平原。千佛塔：西寺淳熙寺遗存。\u003c/p\u003e\u003cp\u003e北齐土城→明代砖城：全拆。水门龙门：文革拆，2010仿建。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e平原北城墙遗址现在还在，一段风干的土堆，没有垛口，没有雉堞。有人说那土是唐时颜真卿守平原时夯的，掺了糯米、麦秸，攥一把能闻到旧时光的味道。真正的城墙从不用石头说话，它只沉默地把自己站成，一把泥土等待的形状。\u003c/p\u003e"}, {"n": "山东·东阿镇老城", "s": "东阿", "p": "山东", "w": "阿胶之乡·六迁城址·于慎行阁老府", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：柯邑（齐之阿邑），管仲食邑。秦：改东阿县，治阿城镇（阳谷县）。明洪武八年（1375）：五迁平阴县东阿镇（今址），避水害。1947年：六迁东阿县铜城镇（今址）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e东阿古城门（东门少岱门）：明代五门之一，现存唯一，济南市文保。少岱山（82.1米）：泰山之西，俗称小泰山。阁老府遗址：于慎行（明隆庆进士，礼部尚书东阁大学士）故居。永济桥（国保）：弘治十三年始建石拱桥，长98米宽7米单孔，望柱石狮八对石猴两对。古阿井（省保）：阿胶发源地，狼溪河（九泉之水）熬胶。\u003c/p\u003e\u003cp\u003e东阿明代砖城：五门，全拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e东阿镇的老胶农老王今年68岁，熬了40年胶。他说现在熬胶还是用狼溪河的水，比重比一般水大，熬出来的胶才正宗。1915年巴拿马博览会拿金奖的那批阿胶，就是他太爷爷那辈人熬的。胶因水而贵，水因山而灵。他身后的狼溪河桥就是明代的永济桥，98米长的石拱桥，蹲过八对石狮的望柱还在。\u003c/p\u003e"}, {"n": "山东·鱼台老城", "s": "鱼台", "p": "山东", "w": "旧城海子沉城·湖陵故城·黄河灭城", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐元和四年（809）：迁县治黄台市（今王庙镇旧城里村）。清乾隆二十一年（1756）：黄河决口灌城，城址沦为湖泊（旧城海子）。清乾隆二十二年（1757）：迁治董家店（今鱼城镇），筑新城。1945年：鱼城县城城墙因战争拆除。1964年：迁治今谷亭镇\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e旧城海子（市级文保）：原黄台市古城遗址，东西2200米南北1400米，2.8平方公里水面，城址沉于水下。湖陵故城：秦汉湖陵县，楚汉相争地，昭阳湖水下。鱼城镇（原董家店）：清乾隆二十三年至1956年为鱼台县城，县衙石狮子尚存（鱼台二中门口）。\u003c/p\u003e\u003cp\u003e唐至清948年老县城（黄台市）：沉为旧城海子。湖陵故城：沉为昭阳湖。清鱼城砖城：周4里1分，高二丈三尺五寸，1945年拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e鱼台王庙镇的老渔民李老头，每年枯水季都要划着船去旧城海子中间看看。他说能摸到古城墙的砖——沉了270年，砖缝里还卡着清代的铜钱。有次他捞上来一个完整的瓷碗，碗底写着乾隆二十一年，正是黄河决口那年。他把碗捐给了县博物馆，换了50块钱。\u003c/p\u003e"}, {"n": "山东·邹城老城", "s": "邹城", "p": "山东", "w": "孟子故里·明万历砖城·三迁故址牌坊", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦：始设邹县（治峄山之阳）。宋元嘉十三年（436）：迁治今址。明万历五年至六年（1577-1578）：知县冯中州耗银2210两谷9380石改砌砖城，凸字形，周4里80步，四门（东瞻岳、北近鲁、西襟济、南崇教）。明天启二年（1622）：白莲教徐鸿儒起义，部分城墙被拆毁。清康熙七年（1668）：郯城地震，西南城墙坍塌。1950年：古城墙被拆除\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e孟庙（亚圣庙）：宋宣和三年始建，三进院落。孟府：孟子后裔世居之地，前后七进院落。重兴塔（兴国寺塔）：唐开元年间始建，砖塔11层高27米。三迁故址坊：2013年原址复建（1945年被夷平）。因利桥：南门外三孔石桥。零星城砖：散落在居民区墙角。\u003c/p\u003e\u003cp\u003e明万历砖城：凸字形，周945丈，高二丈一尺，1950年拆除。南门外古建筑群：1945年夷平。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e邹城孟庙门前那棵古槐，据说是唐代种的，一千多年了还活着。每年农历二月初二孟夫子生日，四邻八乡的人都来烧香。孟府的门楣上还挂着世代恩亲的匾——是明太祖朱元璋给孟子55代孙孟克仁写的。去年有人在城根挖下水道，挖出一个明万历年间的城砖，砖上刻着万历五年造，是知县冯中州筑城那年烧的。砖现在在县档案馆躺着，没人再把它砌回墙上。\u003c/p\u003e"}, {"n": "山东·曲阜老城", "s": "曲阜", "p": "山东", "w": "明正德砖城·为护孔庙而建·万仞宫墙", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋元：曲阜县治在仙源县（今旧县），阙里孔庙与之相距十里，均无城墙。明正德六年（1511）：刘六刘七起义军破仙源县，当晚移营阙里，秣马于庭，污书于池，孔庙遭严重破坏。明正德八年至嘉靖元年（1513-1522）：山东巡抚潘珍奏请移城，耗银3.58万两（多为罚锾），以农闲征丁夫万人，历时10年建成明故城，城周八里三十六步，高二丈厚一丈，呈方形。明万历五年（1577）：开正南门，重城皋门以象朝阙。清乾隆十三年（1748）：乾隆亲谒孔庙，将原仰圣门匾额换成自己手写的万仞宫墙。1930年中原大战：阎锡山军攻城十昼夜，东西北三座城楼被毁。1978年：国家文物局批准拆除大部分城墙，仅存正南门、北门和东北西北部分城墙。2002-2004年：按原址复建，全长5339米，高9米，底宽8米上宽4.5米，投资3000万\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e万仞宫墙（正南门）：2004年复建，城楼歇山重檐，瓮城半圆形。延恩门（北门）：城门洞上方有明代胡缵宗题仰圣门石额，留有中华民国三十六年复原纪念字样。鼓楼街钟楼街：明代建筑，钟楼青砖黛瓦，鼓楼居街中央。五马祠街：明故城内最有烟火味的街道，因明代孔尚经家祠得名，现存四柱石构井亭。陋巷街：颜子巷，孔子弟子颜渊居住处。阙里街：元代始建四柱三间式阙里牌坊。孔庙孔府孔林（三孔）：世界文化遗产。周公庙：明代建筑。\u003c/p\u003e\u003cp\u003e明故城五门城楼：东秉礼东南崇信北延恩西宗鲁均毁于1930年战火。元代仙源县旧城（旧县）：遗址尚存但已非城址。城砖铭文：明代工匠将自己名字刻在砖上，现仅正南门墙砖依稀可辨。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e曲阜人孔大爷在五马祠街开了40年的甏肉干饭铺。他说小时候瓮城里还能捡到明城墙的砖，砖上刻着工匠名字。2002年复建城墙时他主动捐了12块祖传老砖给文物局。现在他的饭铺门口还立着半块城砖——是他爹当年砌灶台剩下的。这砖比我家铺子里的甏还老，他说这话时手里还翻着那半块砖。\u003c/p\u003e"}, {"n": "山东·泰安府城", "s": "泰安", "p": "山东", "w": "岱庙中轴·通天街·山城相依·泰山香道起点", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e五代：设岱岳镇使，建寨墙，雏形始现。宋开宝五年（972）：乾封县治迁岱岳镇，始筑土城。宋大中祥符元年（1008）：宋真宗封禅泰山，改县名奉符，另筑新城于东南三里。金大定二十二年（1182）：升泰安军为州，重建城池，泰安之名由此始（取泰山安则天下皆安）。明嘉靖间：济南通判王云兴易土以石，周七里六十步，高二丈五尺厚二丈，四门（东静封西望封南乾封北登封）。明崇祯十二年（1639）：守道蔡懋德增修四隅各出棱角创四楼，东南角楼尚存（祀魁星）。清康熙七年（1668）：郯城地震，西南城墙坍塌。清乾隆十三年（1748）：重修，改四门名（东迎暄西岳晏南泰安北仰圣）。1910年：津浦铁路通车，城市重心西移，西门外车站街财源街成新中心。建国初：城墙城楼陆续拆除，仅剩根基。2006年：在明代南城门遗址上建通天坊\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e岱庙（国保）：宋宣和年间已有垣堞周匝，1300米宫城城墙完整，八角四门四角楼。遥参亭：唐代称遥参门，宋代筑亭，登泰山前遥拜泰山神之地。通天街：500米长，泰城唯一正南正北的笔直街道，200余美食摊位夜市。蒿里山：泰山地府，古代帝王禅地之所。仰圣街福全街洼子街东青龙街：老泰安城历史街巷，肌理尚存。红门路岱庙通天街：省级历史文化街区。\u003c/p\u003e\u003cp\u003e明砖城：周七里六十步，四门城楼全毁。清代四门城楼：全拆。护城河：填为街或盖板。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泰安老茶客王老头每天早上七点准时到双龙池边的茶馆报到。他说1985年复建岱庙正阳门时他正在上小学，跟着大人去看热闹，还在拆下来的老城墙土里捡到了一枚乾隆年间的铜钱。现在岱庙城墙修得比我小时候见的还整齐，他端起茶碗抿了一口，但那个铜钱我给了我儿子，他拿去换糖吃了。\u003c/p\u003e"}, {"n": "山东·泗水老城", "s": "泗水", "p": "山东", "w": "泉林泉群·孔子川上之叹·卞桥三孔联拱", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周：卞明国，春秋鲁卞邑。隋开皇十六年（596）：置泗水县，治所迁至今县城（1400年未迁）。明：泗水县城，周4里，土筑。清：砖城，四门。建国初：城墙拆除，砖石铺路。2024年：县文保中心完成卞桥修缮、仲庙修缮、泉林碑刻修缮\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e泉林泉群（省保）：泗河源头，陪尾山，康熙乾隆十次驻跸，御碑亭高12米重102吨。卞桥（国保）：唐始建金大定二十年重修，山东省现存最古老石桥，三孔联拱券砌，长25米宽7米。卞国故城遗址（国保）：周汉古城，泉林镇卞桥村，仅存西北城角及部分北城墙，残高8米。仲庙（省保）：子路庙。子在川上处：陪尾山观泉亭内乾隆题碑。\u003c/p\u003e\u003cp\u003e明泗水土城清砖城：周4里，四门全拆。泉林行宫：清康熙乾隆建，114间房屋，全毁。清代36块捐资碑：几乎毁于战乱。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泗水泉林镇的张大爷每天早上绕着卞桥走三圈。他说那桥唐时建的，金时修的，桥面上的石板被磨得发亮，比我爷爷的爷爷还老。2024年文保中心来修卞桥时，张大爷天天去工地帮忙搬砖。他们说这桥是宝贝，我打小就知道——我爹小时候在桥洞里摸鱼，我在桥栏上刻过名字，现在我孙子也在这桥上跑。\u003c/p\u003e"}, {"n": "山东·新泰老城", "s": "新泰", "p": "山东", "w": "羊祜故里·羊流九省驿道·羊公祠", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商周：杞国国都（杞人忧天故事发生地）。西晋：羊祜取新甫山泰山首字，表改平阳为新泰县。明正德前：旧城只有东南二门。明弘治间：知县吴禧始辟西门，共三门（东通齐南望鲁西瞻岱）。明正德：大规模修建，周围四里，连女墙高三丈五尺广六尺。民国：城墙渐废。建国后：拆除\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e羊流镇：羊祜故里，九省驿道，残墙基址长约10里高约8米，四门。羊公祠遗址：明万历间建羊公祠，后毁于战火，原址建镇中心小学。三羊墓（三官墓）：羊流镇北1.5公里，羊祜祖父羊续父亲羊衜胞兄羊发三冢合葬高3米。新甫山（莲花山）：汉武帝封禅建宫，小泰山。和圣文化园：柳下惠故里（坐怀不乱），宫里镇柳里；明新泰砖城：周四里，三门城楼全拆。羊公祠：明万历间建，后毁于战火文革拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e新泰羊流镇中心小学操场底下就是明代羊公祠的遗址。校长说1980年代建校时挖出过祠碑残片和泥塑碎块。现在每周一升旗仪式校长都要跟孩子们说羊祜坐怀不乱的故事。镇转盘那尊4米高的羊祜雕塑是1999年立的，头顶带簪名士小冠左手握佩剑——设计者把羊祜塑成了一个儒雅的文人。\u003c/p\u003e"}, {"n": "山东·费县老城", "s": "费县", "p": "山东", "w": "鄪国故城·季桓子井·颜真卿故里", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：鄪国（后为鲁季氏封邑），论语中季氏将伐颛臾即此地。北魏太和二十年（496）：县治从古鄪城迁祊城（今费城）。明正德间：修外城（四个关厢）。明：内城四门（南映文门等），龙门为假门（震水用）。民国：城墙渐废。2024年3月：费县政府公布费城遗址保护范围\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e鄪国故城（国保）：上冶镇西毕城古城宁国庄，周长6250米面积2.23平方公里，现存城墙上半部3-5米宽15-30米。费城遗址（祊城）：仅存东城墙残垣一段、明代银杏树。季桓子井遗址：孔子观井得羵羊典故处。颜林（省保）：颜氏家庙颜真卿故里。龙门路：原费县龙门所在位置（震水假门）。\u003c/p\u003e\u003cp\u003e鄪国内城（季王城）：全毁。明代砖城：费城内外城全拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e费县上冶镇西毕城村的老刘天天在鄪国故城遗址上放羊。他说那城墙根底下的土比别处的硬，是夯的，踩上去咯噔咯噔响。有一回他在庄稼地里挖到半块带花纹的瓦当——千秋万岁那种。他交给了县博物馆，换了一本费县志。我天天在孔子骂过的那片城墙上放羊，羊一叫，他就觉得孔子也听见了。\u003c/p\u003e"}, {"n": "山东·平邑老城", "s": "平邑", "p": "山东", "w": "颛臾古国·三千年香火·曾子故里·南武城弦歌", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周：周成王正式册封颛臾国，代表周天子主祭蒙山（国君称东蒙主）。春秋：季平子采邑，颛臾为鲁国附庸，孔子反对季氏伐颛臾（祸起萧墙）。西汉：平邑侯国（2次短暂设立）、南武阳县、南城县。隋开皇十八年（598）：武阳县改名颛臾县。唐贞观元年（627）：省武阳县并入费县（平邑做了1337年无名县）。宋：颛臾王被皇帝封灵显潜应侯→英烈昭济惠民王，从祭祀主→蒙山神。清：颛臾故地出土汉碑孝禹碑（河平三年前26年）。1946年4月：平邑县正式建县。2013年：南武城故城列入国保\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e颛臾国故城遗址（省保）：平邑县城东14公里，南北600米东西550米，土夯城墙四五米高，断面可抠出炭化木棍，墙基厚15米，城周四颛臾村。南武城故城（国保）：郑城镇南武城村，孔子来听弦歌说割鸡焉用牛刀，曾子故里（曾点曾参父子墓）。曾子墓（宗圣墓）：封土高3.5米直径10米。平邑汉阙：皇圣卿阙+功曹阙，国内现存最早汉代墓碑。蒙山主峰龟蒙顶：东蒙主祭祀之所。\u003c/p\u003e\u003cp\u003e颛臾国宫城：全毁，遗址在庄稼地里。颛臾王庙：历代祭祀蒙山神之所，全毁。澹台灭明墓：1970年代夷平。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e平邑颛臾一村的张老汉今年72岁，他每天早上都要村碑那转一圈。那碑是1990年立的，碑底开了个超市，张老汉没事就去摸那碑上的颛臾俩字。他说当年拆庙的时候他还小，亲眼看着颛臾王庙的屋顶被拆下来当柴烧。这俩字笔画稠念着绕嘴，但这是老祖宗传下来的，能存到现在不容易。\u003c/p\u003e"}, {"n": "山东·曲阜老城", "s": "曲阜", "p": "山东", "w": "明正德砖城·为护孔庙而建·万仞宫墙", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋元：曲阜县治在仙源县（今旧县），阙里孔庙与之相距十里，均无城墙。明正德六年（1511）：刘六刘七起义军破仙源县，当晚移营阙里，秣马于庭，污书于池，孔庙遭严重破坏。明正德八年至嘉靖元年（1513-1522）：山东巡抚潘珍奏请移城，耗银3.58万两（多为罚锾），以农闲征丁夫万人，历时10年建成明故城，城周八里三十六步，高二丈厚一丈，呈方形。明万历五年（1577）：开正南门，重城皋门以象朝阙。清乾隆十三年（1748）：乾隆亲谒孔庙，将原仰圣门匾额换成自己手写的万仞宫墙。1930年中原大战：阎锡山军攻城十昼夜，东西北三座城楼被毁。1978年：国家文物局批准拆除大部分城墙，仅存正南门、北门和东北西北部分城墙。2002-2004年：按原址复建，全长5339米，高9米，底宽8米上宽4.5米，投资3000万\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e万仞宫墙（正南门）：2004年复建，城楼歇山重檐，瓮城半圆形。延恩门（北门）：城门洞上方有明代胡缵宗题仰圣门石额，留有中华民国三十六年复原纪念字样。鼓楼街钟楼街：明代建筑，钟楼青砖黛瓦，鼓楼居街中央。五马祠街：明故城内最有烟火味的街道，因明代孔尚经家祠得名，现存四柱石构井亭。陋巷街：颜子巷，孔子弟子颜渊居住处。阙里街：元代始建四柱三间式阙里牌坊。孔庙孔府孔林（三孔）：世界文化遗产。周公庙：明代建筑。\u003c/p\u003e\u003cp\u003e明故城五门城楼：东秉礼东南崇信北延恩西宗鲁均毁于1930年战火。元代仙源县旧城（旧县）：遗址尚存但已非城址。城砖铭文：明代工匠将自己名字刻在砖上，现仅正南门墙砖依稀可辨。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e曲阜人孔大爷在五马祠街开了40年的甏肉干饭铺。他说小时候瓮城里还能捡到明城墙的砖，砖上刻着工匠名字。2002年复建城墙时他主动捐了12块祖传老砖给文物局。现在他的饭铺门口还立着半块城砖——是他爹当年砌灶台剩下的。这砖比我家铺子里的甏还老，他说这话时手里还翻着那半块砖。\u003c/p\u003e"}, {"n": "山东·泰安府城", "s": "泰安", "p": "山东", "w": "岱庙中轴·通天街·山城相依·泰山香道起点", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e五代：设岱岳镇使，建寨墙，雏形始现。宋开宝五年（972）：乾封县治迁岱岳镇，始筑土城。宋大中祥符元年（1008）：宋真宗封禅泰山，改县名奉符，另筑新城于东南三里。金大定二十二年（1182）：升泰安军为州，重建城池，泰安之名由此始（取泰山安则天下皆安）。明嘉靖间：济南通判王云兴易土以石，周七里六十步，高二丈五尺厚二丈，四门（东静封西望封南乾封北登封）。明崇祯十二年（1639）：守道蔡懋德增修四隅各出棱角创四楼，东南角楼尚存（祀魁星）。清康熙七年（1668）：郯城地震，西南城墙坍塌。清乾隆十三年（1748）：重修，改四门名（东迎暄西岳晏南泰安北仰圣）。1910年：津浦铁路通车，城市重心西移，西门外车站街财源街成新中心。建国初：城墙城楼陆续拆除，仅剩根基。2006年：在明代南城门遗址上建通天坊\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e岱庙（国保）：宋宣和年间已有垣堞周匝，1300米宫城城墙完整，八角四门四角楼。遥参亭：唐代称遥参门，宋代筑亭，登泰山前遥拜泰山神之地。通天街：500米长，泰城唯一正南正北的笔直街道，200余美食摊位夜市。蒿里山：泰山地府，古代帝王禅地之所。仰圣街福全街洼子街东青龙街：老泰安城历史街巷，肌理尚存。红门路岱庙通天街：省级历史文化街区。\u003c/p\u003e\u003cp\u003e明砖城：周七里六十步，四门城楼全毁。清代四门城楼：全拆。护城河：填为街或盖板。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泰安老茶客王老头每天早上七点准时到双龙池边的茶馆报到。他说1985年复建岱庙正阳门时他正在上小学，跟着大人去看热闹，还在拆下来的老城墙土里捡到了一枚乾隆年间的铜钱。现在岱庙城墙修得比我小时候见的还整齐，他端起茶碗抿了一口，但那个铜钱我给了我儿子，他拿去换糖吃了。\u003c/p\u003e"}, {"n": "山东·泗水老城", "s": "泗水", "p": "山东", "w": "泉林泉群·孔子川上之叹·卞桥三孔联拱", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周：卞明国，春秋鲁卞邑。隋开皇十六年（596）：置泗水县，治所迁至今县城（1400年未迁）。明：泗水县城，周4里，土筑。清：砖城，四门。建国初：城墙拆除，砖石铺路。2024年：县文保中心完成卞桥修缮、仲庙修缮、泉林碑刻修缮\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e泉林泉群（省保）：泗河源头，陪尾山，康熙乾隆十次驻跸，御碑亭高12米重102吨。卞桥（国保）：唐始建金大定二十年重修，山东省现存最古老石桥，三孔联拱券砌，长25米宽7米。卞国故城遗址（国保）：周汉古城，泉林镇卞桥村，仅存西北城角及部分北城墙，残高8米。仲庙（省保）：子路庙。子在川上处：陪尾山观泉亭内乾隆题碑。\u003c/p\u003e\u003cp\u003e明泗水土城清砖城：周4里，四门全拆。泉林行宫：清康熙乾隆建，114间房屋，全毁。清代36块捐资碑：几乎毁于战乱。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泗水泉林镇的张大爷每天早上绕着卞桥走三圈。他说那桥唐时建的，金时修的，桥面上的石板被磨得发亮，比我爷爷的爷爷还老。2024年文保中心来修卞桥时，张大爷天天去工地帮忙搬砖。他们说这桥是宝贝，我打小就知道——我爹小时候在桥洞里摸鱼，我在桥栏上刻过名字，现在我孙子也在这桥上跑。\u003c/p\u003e"}, {"n": "山东·新泰老城", "s": "新泰", "p": "山东", "w": "羊祜故里·羊流九省驿道·羊公祠", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商周：杞国国都（杞人忧天故事发生地）。西晋：羊祜取新甫山泰山首字，表改平阳为新泰县。明正德前：旧城只有东南二门。明弘治间：知县吴禧始辟西门，共三门（东通齐南望鲁西瞻岱）。明正德：大规模修建，周围四里，连女墙高三丈五尺广六尺。民国：城墙渐废。建国后：拆除\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e羊流镇：羊祜故里，九省驿道，残墙基址长约10里高约8米，四门。羊公祠遗址：明万历间建羊公祠，后毁于战火，原址建镇中心小学。三羊墓（三官墓）：羊流镇北1.5公里，羊祜祖父羊续父亲羊衜胞兄羊发三冢合葬高3米。新甫山（莲花山）：汉武帝封禅建宫，小泰山。和圣文化园：柳下惠故里（坐怀不乱），宫里镇柳里；明新泰砖城：周四里，三门城楼全拆。羊公祠：明万历间建，后毁于战火文革拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e新泰羊流镇中心小学操场底下就是明代羊公祠的遗址。校长说1980年代建校时挖出过祠碑残片和泥塑碎块。现在每周一升旗仪式校长都要跟孩子们说羊祜坐怀不乱的故事。镇转盘那尊4米高的羊祜雕塑是1999年立的，头顶带簪名士小冠左手握佩剑——设计者把羊祜塑成了一个儒雅的文人。\u003c/p\u003e"}, {"n": "山东·费县老城", "s": "费县", "p": "山东", "w": "鄪国故城·季桓子井·颜真卿故里", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：鄪国（后为鲁季氏封邑），论语中季氏将伐颛臾即此地。北魏太和二十年（496）：县治从古鄪城迁祊城（今费城）。明正德间：修外城（四个关厢）。明：内城四门（南映文门等），龙门为假门（震水用）。民国：城墙渐废。2024年3月：费县政府公布费城遗址保护范围\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e鄪国故城（国保）：上冶镇西毕城古城宁国庄，周长6250米面积2.23平方公里，现存城墙上半部3-5米宽15-30米。费城遗址（祊城）：仅存东城墙残垣一段、明代银杏树。季桓子井遗址：孔子观井得羵羊典故处。颜林（省保）：颜氏家庙颜真卿故里。龙门路：原费县龙门所在位置（震水假门）。\u003c/p\u003e\u003cp\u003e鄪国内城（季王城）：全毁。明代砖城：费城内外城全拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e费县上冶镇西毕城村的老刘天天在鄪国故城遗址上放羊。他说那城墙根底下的土比别处的硬，是夯的，踩上去咯噔咯噔响。有一回他在庄稼地里挖到半块带花纹的瓦当——千秋万岁那种。他交给了县博物馆，换了一本费县志。我天天在孔子骂过的那片城墙上放羊，羊一叫，他就觉得孔子也听见了。\u003c/p\u003e"}, {"n": "山东·平邑老城", "s": "平邑", "p": "山东", "w": "颛臾古国·三千年香火·曾子故里·南武城弦歌", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周：周成王正式册封颛臾国，代表周天子主祭蒙山（国君称东蒙主）。春秋：季平子采邑，颛臾为鲁国附庸，孔子反对季氏伐颛臾（祸起萧墙）。西汉：平邑侯国（2次短暂设立）、南武阳县、南城县。隋开皇十八年（598）：武阳县改名颛臾县。唐贞观元年（627）：省武阳县并入费县（平邑做了1337年无名县）。宋：颛臾王被皇帝封灵显潜应侯→英烈昭济惠民王，从祭祀主→蒙山神。清：颛臾故地出土汉碑孝禹碑（河平三年前26年）。1946年4月：平邑县正式建县。2013年：南武城故城列入国保\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e颛臾国故城遗址（省保）：平邑县城东14公里，南北600米东西550米，土夯城墙四五米高，断面可抠出炭化木棍，墙基厚15米，城周四颛臾村。南武城故城（国保）：郑城镇南武城村，孔子来听弦歌说割鸡焉用牛刀，曾子故里（曾点曾参父子墓）。曾子墓（宗圣墓）：封土高3.5米直径10米。平邑汉阙：皇圣卿阙+功曹阙，国内现存最早汉代墓碑。蒙山主峰龟蒙顶：东蒙主祭祀之所。\u003c/p\u003e\u003cp\u003e颛臾国宫城：全毁，遗址在庄稼地里。颛臾王庙：历代祭祀蒙山神之所，全毁。澹台灭明墓：1970年代夷平。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e平邑颛臾一村的张老汉今年72岁，他每天早上都要村碑那转一圈。那碑是1990年立的，碑底开了个超市，张老汉没事就去摸那碑上的颛臾俩字。他说当年拆庙的时候他还小，亲眼看着颛臾王庙的屋顶被拆下来当柴烧。这俩字笔画稠念着绕嘴，但这是老祖宗传下来的，能存到现在不容易。\u003c/p\u003e"}, {"n": "莒县老城·毋忘在莒", "s": "莒县", "p": "山东", "w": "三千年莒国故都·四千年银杏·五千年陶文莒国故都是春秋莒国千年不移的都城，城址一脉三千年；浮来山定林寺存中国最古老的一株近四千年银杏。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周武王十三年（约前1045年）：莒国立国，都计（今胶州），后多次迁都。春秋初期：迁都至今莒城位置。前431年：莒为楚所灭，后入齐，扩为齐国&quot;五都&quot;之一。北魏郦道元《水经注》载&quot;其城三重&quot;。秦：置莒县，属琅琊郡；汉置城阳国。1977年：莒国故城列为省级文保。2014年：莒县入选首批&quot;千年古县&quot;。近年：复建莒国古城（占地960亩、建筑面积37万平米）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e莒国故城南城垣（省保）：高7—8米、宽35米左右、长近千米，从浮来春酒厂绵延至环卫所处。故城东北角城垣（老水利局处）：高8—9米、宽40米、长150米，1996年后改为城墙公园，现为莒国古城拱辰门城墙一部分。定林寺古银杏（浮来山）：树龄近4000年，清顺治碑载鲁隐公八年（前715年）莒鲁会盟于树下；树下有南北朝刘勰著《文心雕龙》的校经楼。定林寺（北魏始建）：全寺南北长95米、东西宽52米、占地约4940平米，前中后三进院落。齐长城莒县段（东莞镇光光山）：花岗岩垒砌，平均高2.5米。莒州博物馆：馆藏2万余件文物、其中国家级文物300余件，陵阳河遗址大汶口陶文比甲骨文早约1500年。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌浮来山看门老人（70岁）：&quot;这银杏我从小看到老，一进农历十月叶黄了，满山都是人。老人说摸树干沾福气，树皮都让人摸得发亮。&quot;\u003cbr\u003e▌莒国古城拉车师傅：&quot;莒字外地人十个九个念错，念&#x27;举&#x27;不念&#x27;旅&#x27;。客人一上车就让我讲古，我从一碗全羊汤讲到三千年前。&quot;\u003c/p\u003e"}, {"n": "沂水老城·沂河古城", "s": "沂水", "p": "山东", "w": "内城外城双围·穆陵关齐长城北门·刘南宅八卦宅沂水城始建于西汉东莞县，隋开皇十六年（596）更名沂水，内城外城双重城墙结构在鲁南罕见，穆陵关是齐长城最古老的关隘。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：置东莞县，为沂水县城前身。南北朝：改称团城，曾为南青州。隋开皇十六年（596年）：更名沂水，因沂河得名，属琅琊郡。元至治三年（1323年）至清同治七年（1868年）：县城十次复修。内城：周长三里二十七步、城墙高2丈5尺；外城：周长10.2里、城墙高1丈5尺、有四门。清乾隆五十六年（1791年）复修内城；咸丰二年至同治七年（1852—1868年）筑外城。1944年：内外城墙拆除，今只存县政府后院一段老城墙基\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e沂水老城墙基（县政府后院）：全城唯一残存城垣遗迹。穆陵关（马站镇关顶村·齐长城关口）：始建于西周、不晚于前821年，距今2800多年，关顶村处临沂&quot;北大门&quot;。齐长城遗址。密邑古城址（院东头刘家店子村西）：总面积20万平米，城墙残高1—3米、基宽5米，1977年出土铜器470余件。东安古城址（袁家庄乡）：周长1000米，汉代城阳国东安县故城。沂水古城遗址：出土莲花兽瓦当、三彩建筑饰件等隋唐文物。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌东关街老住户刘大爷（68岁）：&quot;我小时东关街全县最热闹，粮店影院百货楼挤一条街。老城墙扒得早，就剩县府后院那一截土岗子，年轻人都不知道那是城墙。&quot;\u003cbr\u003e▌穆陵关村放羊老汉：&quot;关顶村这道土岭，老辈都叫&#x27;北大门&#x27;。刮大风站在豁口上，风呜呜地响，跟千百年前挑担赶集的人听见的一个声儿。&quot;\u003c/p\u003e"}, {"n": "日照老城·海曲石臼", "s": "日照", "p": "山东", "w": "汉武帝海曲古县城·石臼所渔港老街·海石房日照前身海曲县设于西汉，城址在海曲公园一带；石臼所从渔村到渔港、再到近代建港，是日照唯一还留着老城烟火与滨海文脉的地方。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏代：石臼一带渐成渔猎聚落，&quot;石臼&quot;或与海边舂米石臼有关。西汉（汉武帝时）：置海曲县，属琅琊郡，城址在今海曲公园一带。明清：石臼设所，渔船商船云集，渐成渔港码头。近代：因建港兴起商贸，渔村聚落成街。1992年：老石臼市场建成，鼎盛时一天人流量近两万人。2020年：石臼市场片区列入改造，老市场搬迁。近年：海曲印象文化广场片区城市更新，打造海曲坊并保留古城墙遗址景观\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e海曲古城墙遗址（海曲坊项目内保留）。石臼所海石房（天津路南、新港路北十字街）：清代建筑，用海边礁石&quot;所石&quot;（花岗岩）垒成，大门窗户做发碹样式。老灯塔：山东沿海现存最早的近代灯塔之一。老码头、老海关楼、老边检楼、渔政监督管理处旧址。石臼老街：贯穿石臼所的老街巷。老石臼市场（1992—2020年）：年营业额曾达4亿多元。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌石臼老渔民（66岁）：&quot;海石房是拿海边礁石垒的，冬暖夏凉还抗盐碱。现在盖楼，老石房拆一间少一间，就剩十字街那几座了。&quot;\u003cbr\u003e▌老石臼市场海鲜摊主：&quot;老市场九几年盖的，一天两万人，我一天卖几百斤蛤蜊。搬新市场那天，老主顾都来转最后一圈。&quot;\u003c/p\u003e"}, {"n": "梁山老城", "s": "梁山", "p": "山东", "w": "水泊梁山·虎头峰宋江寨·大黄河环山夹流·菏济郓汶四不管？《水浒传》故事的主战场，虎头峰顶能摸到宋江寨石墙的残迹，忠义堂里三十六根立柱象征三十六天罡，一座县城却把小说里的江湖照进了山石之上。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北宋政和年间（1111—1118），宋江等人依着梁山泊聚义，在虎头峰上筑起宋江寨，那时梁山环山抱水、易守难攻，浩渺的水泊是天然屏障。金大定七年（1167）黄河决口，寿张县城北迁，梁山一带湖面随之扩大，水泊更加汪洋。到了明崇祯十五年（1642），朝廷降罪于《水浒传》，严旨禁刻、勒石山巅，梁山上的建筑被束令拆除。清咸丰五年（1855），黄河铜瓦厢决口改道，梁山泊大面积淤废，昔日泽国渐成平陆。至于梁山县本身，迟至1949年前后才由寿张、东平、汶上、郓城四县拼合而建，老县城的治所历经迁变，如今山下的虎头峰倒成了故事最好的注脚。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e扒开山道边的荒草，虎头峰顶（海拔197.9米）依山势砌的两道石寨墙仍在，块石垒成、南临悬崖、北侧仅一门可通，虽大部分已倒塌，残迹仍清晰可寻，1985年考古还在寨内掘出筒瓦、板瓦，鉴定为汉代建材，足见早在两汉这里便已有建筑。忠义堂是1983年在原址重建的，大厅二十二米见方，三十六根直径四十八厘米的大柱列成纵横六排，寓意三十六天罡，厅外三面又立七十二根围廊柱，寓意七十二地煞，总共一百零八根立柱立在大厅里，人站其中顿生聚义之感。旁边那座靖忠庙坐北朝南、面阔五间、建筑面积六百四十平方米，庙额题&quot;靖忠之庙&quot;，院内挂着&quot;宛子城中藏虎豹，蓼儿洼内聚蛟龙&quot;的楹联。而梁山一带最早的建县记忆，则藏在县城西北的寿张老集镇上，那里还保留着旧街格局与老地名。。\u003c/p\u003e\u003cp\u003e梁山泊当年&quot;险不在山而在水&quot;——黄河环山夹流，巨浸远汇山足，水面浩渺接天，方才给了梁山好汉凭险立寨的底气。今水泊尽涸，只见平畴沃野，唯有地名与小说，还替后人记着那一片汪洋。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌梁山退休教师 高师傅（66岁）：&quot;我小时候上虎头峰，还能看见山道边歪着的石头墙，大人说那是宋江寨的老墙，摸着比现在景区新砌的还厚。有一年考古挖出汉代的瓦当，原来这地方汉朝就是行宫，梁山好汉是占了皇家地皮扎的寨。&quot;\u003cbr\u003e▌寿张集老居民 王老伯（74岁）：&quot;听老辈讲，早先咱这一带是水，船能开到山底下，后来咸丰年间黄河一改道，水就撤了。现在种庄稼的地底下，犁地经常翻出老船板、烂铁锚，你说这当年得有多少船泊在这。&quot;\u003c/p\u003e"}, {"n": "嘉祥老城", "s": "嘉祥", "p": "山东", "w": "曾子故里·武氏祠汉画像石·南武城夯土故城·三石坊照壁？宗圣曾参的家乡，南武城故城夯土清晰可摸，武氏祠汉画像石刻更是全世界汉画研究者必来的圣殿，一座县城竟同时藏着儒学始祖故里与画像石刻两大&quot;国宝级&quot;家底。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋末年，鲁国的南武城是孔子高足曾参的故里，那句&quot;吾日三省吾身&quot;的千古家训便出自曾子之口。周考王十五年（前426）始建忠孝祠祭祀曾子，后改称曾庙、宗圣庙。明正统九年（1444）按制重建宗圣庙，次年增建莱芜侯祠，到明嘉靖、隆庆年间曾庙两度毁于兵火，直至万历七年（1579）曾氏后人请准重修，才奠定了今日的格局。此后清顺治、康熙、乾隆、光绪各朝屡有修缮，庙宇香火绵延不绝。南武城故城遗址则在县城南二十二点五公里的满硐乡阿城村，今存方形城址与夯土残墙。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e曾子庙（宗圣庙）坐落在县城南二十三公里的南武山南麓，坐北朝南、红墙围合，南北通长二百三十米、东西宽一百二十米，占地二点七六万平方米，中轴线分正、左、右三路三进院落；门外三座四柱三楹石坊，中坊为冲天式，题&quot;宗圣庙&quot;大字。庙内主体宗圣殿是明代官式建筑，面阔七间、通长三十四米、进深十八点八五米，重檐九脊歇山顶，高十五点三五米，四周回廊立着二十二根水磨石柱，门前两根平雕云龙，殿门悬清雍正御书的&quot;道传一贯&quot;巨匾，正中神龛供奉曾子彩塑。县城南的武氏墓群石刻（武梁祠）是东汉武氏家族的墓阙石室画像，雕刻车骑宴饮、伏羲女娲、荆轲刺秦王等故事，线条刚健古朴，被誉为&quot;孔孟之乡的石刻圣经&quot;。满硐镇南武山村的曾子墓为东周古墓，墓前有碑，与曾庙隔山相望，松柏蓊郁；阿城村北五百米的南武城故城遗址，南北四百米、东西三百七十米，残存的东城墙在距地表一两米处仍见夯土层，隔蔡河与金乡鱼山相望。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌嘉祥文保老人 陈爷（68岁）：&quot;武氏祠那些石上的人物，伏羲女娲都是人首蛇身，刻得跟活的一样。外地来的教授讲，这是全国画像石里最精的一批，可我们小时候就当地里的&#x27;石老头子&#x27;，谁也没当回事。&quot;\u003cbr\u003e▌南武山村曾姓后人 曾叔（71岁）：&quot;家谱上说咱是曾参爷的后人，字辈排得清清楚楚。每年清明，四里八乡曾姓的都来宗圣庙烧香磕头，庙里那22根石头柱子，老人说摸一摸能沾圣人的书卷气。&quot;\u003c/p\u003e"}, {"n": "微山老城", "s": "微山", "p": "山东", "w": "微山湖·三贤墓岛·微子仁贤·夏镇古城三城合一？殷商微子葬于此，此山此湖此县皆因他得名，微山岛上一湖藏三墓（微子、目夷、张良），跨朝逾千年；县城夏镇是明清微山湖中的运河都会，至今还能摸到汉丞相题字的墓碑。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e殷商帝乙的长子微子启贤而让位，周朝封于宋，为宋国始祖；微子卒后葬于宋国留邑东山，那座山便因他得名微山，微山之名由此而始。北宋绍熙之后黄河屡屡决口泛滥，这一带渐渐淤积成湖，微山兀立湖心成了一座孤岛。明清大运河全线通航，微山湖成为南北漕运必经的要道，扼湖守闸的夏镇帆樯云集、市声鼎沸。1953年设微山县，统辖整片湖区，由广戚、部城、夏镇寨三城合体的夏镇成为县治，散落在苏鲁边界的古迹从此得以系统保护。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e微子墓位于微山岛凤凰台北，圆形土冢高十米、底径七点五米，苍松翠柏环抱，层层石阶直抵殿前，正殿存汉元帝时丞相匡衡所题&quot;殷微子墓&quot;的原碑，碑身顶端已断裂；史载微山岛一点七万居民中殷姓占六七成，就连孔子也是微子后裔。岛东峰上还有微子后人子鱼的目夷墓，墓冢简朴、前立宋代石碑，凭栏可眺万顷湖光；岛南麓的张良墓封土宽阔厚重，这位汉初三杰受封留侯，其封地留城已沉入微山湖底，功成之后便归隐湖畔。作为县治的夏镇古城由广戚、部城（西城）、夏镇寨（东城）三城组成，明清设夏镇闸、利建闸扼守湖水，老街上依稀可辨市井格局，运河船工的号子已成为当地非遗。而张良封邑留城因地质沉降沉入湖底，那一片水下封存着汉代城郭，当地渔民下网时偶尔还能捞起汉砖。。\u003c/p\u003e\u003cp\u003e张楼镇湖陵村的湖陵古城原是一座秦汉古城，如今城址早已沉埋于湖荡芦苇与淤泥之间，只留下地名与零星记载，成为历史断层里一座&quot;水下郡县&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌微山岛老船工 刘老大（69岁）：&quot;打小听老辈念，先有微山、后有微山湖——早先是山是地，黄河一闹水才成了湖。咱岛上姓殷的多，清明对岸姓宋的也摇船过来，跟咱一块上微子爷坟上磕头，说都是他老人家的后人。&quot;\u003cbr\u003e▌夏镇退休职工 徐姨（63岁）：&quot;老夏镇原来是三座城长一块儿，广戚、部城、寨子。我小时候镇上的河还走货船，船工号子喊得震天响。现在古城墙早没了，可老街那几条巷子还在，青石板让人踩得发亮。&quot;\u003c/p\u003e"}, {"n": "兰陵老城", "s": "兰陵", "p": "山东", "w": "后圣荀子治县·萧氏郡望·兰陵美酒·四门石匾？山东最早的古县之一，相传屈原定名、荀子两任县令，古代城墙上的四门匾额原文可考，还有李白为它写诗的美酒。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e公元前261年，楚国取鲁国的次室邑，更名兰陵县，相传是屈原奉命定名——这块高地遍生兰草，&quot;兰&quot;为王者之香、&quot;陵&quot;为高地，一名定下，比秦始皇推行郡县制还要早近百年。战国末年，春申君举荐荀子两任兰陵令约十八年，荀子劝课农桑、隆礼重法，辞官后定居兰陵著书讲学，卒葬于此。西晋元康元年（291）朝廷设兰陵郡，兰陵由县升郡，成为鲁南政文中心；南北朝时兰陵萧氏建立萧齐、萧梁二朝，涌现出十一位皇帝，郡望显赫一时。今兰陵镇的古城原有土城墙，东西约三里、南北约五里，四门题字相沿可考。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e荀子墓在兰陵镇驻地东南一公里，是两任兰陵令的&quot;后圣&quot;荀卿长眠之地，墓区草木青翠、历代祭拜不绝，其弟子李斯、韩非并出荀门，此地因此被称为&quot;先秦两大文化高地&quot;之一。城北小仲村（萧冢村）的萧望之墓是兰陵萧氏祖宗，这位西汉名臣本是萧何六世孙，官至御史大夫、太子太傅，墓地位于城北，如今海内外的萧氏后人仍常来寻根祭祖。兰陵古城四门的石匾文辞可考：东门题&quot;东海镜清&quot;、北门题&quot;文峰映秀&quot;、西门题&quot;逵达邹鲁&quot;、南门题&quot;街通淮徐&quot;，四句话道尽了古城的山水气象与商旅通衢。而兰陵美酒的酿制历史可上溯商周，唐李白《客中行》有&quot;兰陵美酒郁金香，玉碗盛来琥珀光&quot;的名句，1995年徐州狮子山汉墓曾出土汉代兰陵美酒，1915年又在巴拿马万国博览会折桂。向城镇西北的鄫国故城遗址，则是夏代少康之子曲烈所封鄫国故城，历经夏商周三代存续千余年，城墙、护城河遗迹至今可寻，鄫亡后贵族去&quot;鄫&quot;字右耳旁改姓曾，这里亦是天下曾姓的祖源地之一。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌兰陵镇老酒坊人 周师傅（67岁）：&quot;李白那诗就写咱这酒。小时候槽坊里蒸酒，满街都是粮香，老人说这酒方子传了三千年。前些年徐州挖出一坛汉代的，一开坛还有酒味，你说邪不邪。&quot;\u003cbr\u003e▌小仲村萧姓乡亲 萧大哥（72岁）：&quot;我姓萧，家谱上写着是萧何、萧望之二爷的后人，祖坟就在村北。年年有南方来的人，海边那一支姓萧的、隔了上千年还回来找祖根，站墓前磕头，说咱这是萧家天下的源头。&quot;\u003c/p\u003e"}, {"n": "邳州老城", "s": "邳州", "p": "江苏", "w": "三城叠废·旧州一夜沉水·张良圯桥·土山关公约三事三次迁城（春秋夏邳城→金代旧城→清代新城），康熙七年大地震+黄河决口一夜沉旧州是真实历史。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏代奚仲封邳国（左沂水右泗水）。金宣宗兴定五年（1221）移治今距山东三里，夯土筑城周长5里20步。明洪武年间砖砌西北东南两隅，加建西门。康熙七年（1668）郯城8.5级大地震，同年黄河决口，旧州城被淹没——&quot;一夜沉旧州&quot;（真实史料）。康熙二十八年（1689）在洪福山前再造新城，周长5里13步，高2丈8尺，砖厚3尺每块30斤，雉堞1501岗楼30。四城门：先春（东）、来薰（南）、迎爽（西）、拱极（北）。城形有东南弯、西南弯——当地人称&quot;荷包城&quot;。1954年邳县治所迁至运河镇（邳城回归为乡镇）。现状：邳城镇现存不足10米残土墙（邳中学校门西侧）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e土山古镇·关帝庙（江苏省规模最大最完整的关帝庙）：明天顺三年（1460）建，三路四院100多间。《三国演义》第二十五回&quot;屯土山关公约三事&quot;发生地。土山古镇明清古街：青石铺面，魏家布庄、沈家大院、浴德池等完好。圯桥遗址（张良受书处）：邳城镇北，秦末张良遇黄石公投石桥下，捡鞋穿鞋得《太公兵法》。。\u003c/p\u003e", "c": ""}, {"n": "淮安府城·淮安区", "s": "淮安", "p": "江苏", "w": "铁打城墙·三联城·漕运总督署东晋义熙年间筑城，&quot;铁打城墙&quot;之誉。中国罕见的&quot;三联城&quot;格局。淮安府署（国保·仅存两座完整府衙之一）。孔尚任《桃花扇》柳梦梅唱词&quot;插天高的淮城&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东晋义熙年间始筑淮安城（旧城），&quot;铁打城墙&quot;之誉。明嘉靖三十九年（1560）筑夹城（玉带城）连贯新旧二城——三联城格局形成：北端新城（大河卫）、中段夹城、南端旧城（行政中心）。清江浦城（同治三年1864筑）：不规则矩形，东西长3华里×南北宽平均1华里。5座城门+水门。仅存87年——1952年拆除铺环城路。现状：旧城核心格局完整（棋盘式布局），淮安府署、镇淮楼、漕运总督署遗址尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e淮安府署（全国重点文保）：明洪武三年（1370）建，占地近2万平方米，房屋50余幢600余间，大堂超500平方米——仅存两座完整古代府衙之一。镇淮楼（北宋楚州谯楼）：旧城正中鼓楼岗。总督漕运公署遗址（世界文保）：明清管全国漕运的漕运总督衙门，始建于宋乾道六年（1170）。原建筑毁于战乱，2002年清理出遗址，建中国漕运博物馆+遗址公园。淮安城墙遗址：淮安区东南角+淮安师范学校旁400米&quot;城墙堆&quot;。。\u003c/p\u003e", "c": ""}, {"n": "徐州新沂窑湾古镇", "s": "窑湾", "p": "江苏", "w": "运河活码头·吴家大院300年闽南风·夜猫子集京杭大运河与骆马湖交汇处，1400年漕运重镇，日过桅帆千杆夜泊舟船十里。", "h": "", "r": "\u003cp\u003e吴家大院（清康熙年间·300年）：四进院落南北长80米东西宽20米。福建沿海建筑风格——窗高而小、院落紧密，防台风暴雨。赵信隆酱园店（明天启三年1623）：古镇&quot;前店后坊&quot;典型。甜油自清乾隆时就是御膳房佐料。山西会馆、苏镇扬会馆、江西会馆——一镇之中八省商人设商会十省设商业代办。界牌楼：一脚踏三地（邳州/宿迁/睢宁交界）。；夜猫子集：运河漕运商船白天航行夜间停靠，每天三更半夜小商小贩不约而来，打潮牌蒸包子烧五香妈糊挑菜选鱼，天亮商船起航集市散去。；（古城·城摞城六叠）。\u003c/p\u003e", "c": ""}, {"n": "徐州户部山+戏马台", "s": "户部山·戏马台", "p": "江苏", "w": "依山而建明清民居露天博物馆·鸳鸯楼·500年银杏&quot;一座户部山半部徐州史&quot;，依山势层叠明清古民居，穷北关富南关流传至今。", "h": "", "r": "\u003cp\u003e戏马台：公元前206年项羽依山筑台观戏马演武，现在山顶只有几株古柏苍然。崔焘故居（崔氏翰林府）：清道光年间，12座四合院房屋150间占地5200平方米。翟家大院鸳鸯楼：依山势落差建成，上下两层内无楼梯相通，门却朝向相反——因&quot;鸳鸯&quot;与&quot;阴阳&quot;谐音得名。余家大院&quot;明三暗五&quot;：外面看三间房，进去才发现里面暗藏两间阁楼。郑家大院500年古银杏树。；（枣庄石头村）。\u003c/p\u003e", "c": ""}, {"n": "淮安区·河下古镇", "s": "淮安区", "p": "江苏", "w": "运河商埠·盐业集散地·吴承恩故里明清运河沿岸重要商埠，淮盐集散地，徽商云集。吴承恩故里。", "h": "", "r": "\u003cp\u003e吴承恩故居（六角砖亭·假山·花草丛杂）。明清盐商住宅群。河下石板街。。\u003c/p\u003e", "c": ""}, {"n": "沛县老县城", "s": "沛县", "p": "江苏", "w": "泗水亭刘邦亭长·歌风台大风歌·樊哙巷杀狗肉井汉高故里，刘邦当泗水亭长的地方，48岁在此揭竿为沛公。樊哙卖狗肉的那条巷还叫樊巷，他煮狗肉用的井还能找到。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e元代沛县在泗水之东建有小城，后毁于黄泛兵燹。明嘉靖二十一年（1542），知县王治始筑土城，周三里高二丈宽一丈八尺，雉堞千三百二十四。四门：永清（东）、会源（南）、恒休（西）、拱极（北）。明嘉靖二十五年（1546）知县周泾甃之以砖。明万历、崇祯，清康熙间屡修屡圮。1950年代城墙拆除。1995年沛县政府斥资1.5亿元建沛县汉城（仿汉）。现状：城墙全毁。泗水亭1983年复建，歌风台1986年重建。沛县老城街巷名保留。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e泗水亭（1983年复建）：秦时十里一亭，刘邦壮年时曾任泗水亭长。亭中立有清代古碑《高祖泗水亭碑铭》——东汉班固原文。歌风台（1986年重建）：原在县治东南泗水岸，屡圮屡修。内有汉代歌风碑，碑文为东汉蔡邕所题，今碑上半尚存下半1/3难以找到。沛县孩童能背&quot;大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方&quot;——2000年前刘邦即兴唱的。樊将军井（樊哙巷内）：樊哙当年煮狗肉用的井，至今水还在。樊巷（沛县城区东汤沐路东）：樊哙卖狗肉时住的那条巷，南北走向。老沛县人说&quot;巷里静静静静的清晨，阳光透过树丛，能看到樊哙袒胸漏乳在狗肉摊前忙碌，刘邦急急忙忙跑过来要吃狗肉&quot;。汉城公园（1995年建）：汉魂宫、汉阙、仙人承露台、汉高祖原庙。。\u003c/p\u003e\u003cp\u003e明代砖城四门及城楼。元代旧泗水东岸城址（玉虚宫、琉璃井在其中，遗址沉于水下）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：&quot;吾虽都关中，万岁后吾魂魄犹乐思沛。&quot;——公元前195年，刘邦平定英布后回沛县，置酒沛宫与乡亲欢宴，击筑唱《大风歌》。\u003cbr\u003e▌沛县民谚：&quot;丰吾所生长，极不忘耳&quot;——刘邦对丰县的牵挂；但他起事在沛县，自称&quot;沛公&quot;，后世把沛县当龙兴之地。\u003cbr\u003e▌沛县老樊巷居民：&quot;樊哙井还在巷中间，青石井沿被磨得发亮——2000年了，这口井见过屠狗的、见过亭长、见过大风歌，现在还在给我们浇花。&quot;\u003c/p\u003e"}, {"n": "宿迁老府城", "s": "宿迁", "p": "江苏", "w": "四次迁城全因黄河水患·下沉式城墙遗址·项王故里宿迁有四座古城址，全因躲避黄河水患而迁：秦代下相城→晋代宿预县城→元代宿迁县城→明万历马陵山新县城。2007年发掘出60米城墙残段，建成下沉式广场——沿着台阶逐级而下便知数百年来黄河泛滥地势上涨的幅度。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明万历四年（1576）迁马陵山麓，土筑椭圆形城周长4华里，三城门：东迎熙、西拱秀、南望淮（北因山路崎岖未置门，城墙上置览秀亭）。万历二十二年（1594）土城改砖城，四门：东阳春（朝阳）、西镇黄、东南迎薰、西南河清。1952年拆除古城，仅留西城门镇黄门。1970年西门拆。2007年城市建设中发掘出60米城墙残段（宿城区幸福中路西侧区府广场），残高约1米，墙宽约1.6米，砖筑。做法是先用木桩栽入地下做地钉，其上用城砖砌筑。现状：城墙残段建成下沉式历史文化墙（玻璃罩保护），城楼仿建。项王故里景区。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宿迁明清古城墙遗址（市保·2023年11月核定）：60米下沉式广场，玻璃罩下可清晰看到城墙轮廓——顺着台阶逐级而下，能摸到原来的地面线，&quot;知道这几百年来黄河泛滥地势上涨了多少&quot;。项王故里（国家4A）：西楚霸王项羽故居，有项府、项园、将署、项羽故居、项家宗祠、霸王古今馆、虞家老宅。宿迁文庙（学宫）：400多年历史，今江苏省宿迁中学校区，大成殿古建筑尚存。东大街（明代通岱街）：东城门外老街，原长约一华里宽一丈许，可与苏州周庄媲美，后渐毁。；元代宿迁县城（项王故里景区南，沉于地下）。晋代宿预县城（洋河镇古城社区）。秦代下相城（沉于地下）。明代砖城四门城楼（全毁）。东大街明清街貌。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《宿迁县志》（清乾隆）：&quot;明万历四年，黄河决溢，知县何东凤卜地于马陵山麓另建县城。&quot;——宿迁四次迁城，根因全在黄河。\u003cbr\u003e▌宿迁考古队（2007）：&quot;城墙做法是先用木桩栽入地下做地钉，其上用城砖砌筑——这是明代筑城的标准工艺，也说明马陵山新县城是按正规府城规格建造的。&quot;\u003cbr\u003e▌宿迁老居民（70岁+）：&quot;我小时候还见过西门镇黄门——两层城楼，拱门黑得发亮。1970年拆的时候全城人都去看，有人哭。&quot;\u003c/p\u003e"}, {"n": "高邮老县城", "s": "高邮", "p": "江苏", "w": "盂城驿世界文保·北门双瓮城瓮城结构层·孤塔伴双寺中国邮驿&quot;活化石&quot;——盂城驿是全国规模最大保存最完好的古代驿站（世界文保+国保）。北门瓮城有罕见的宋代至明代双瓮城结构（内瓮南宋嘉定间建，外瓮明嘉靖年间为抵御海寇增筑），外瓮城砖墙内发现至少8个暗藏的瓮城结构层。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e北宋开宝四年（971）知军高凝祐始筑土城，方形，四门。明洪武八年（1375）始建盂城驿（全国最古老邮驿之一）。明正统年间以砖包城，周围一十里三百一十六步，高二丈五尺。明嘉靖年间增建瓮城、瓮城结构层。1956-1972年城墙大部拆除，仅东南角以奎楼为中心残留122.7米。2015年考古发掘北门瓮城遗址，发现双瓮城结构+8个瓮城结构层。现状：盂城驿完整保存（世界文保+国保），镇国寺塔（国保），北门瓮城遗址公园。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盂城驿（世界文保·国保·中国邮驿活化石）：明洪武八年（1375）始建，世界文化遗产京杭大运河重要组成部分。全国规模最大保存最完好的古代驿站，明代遗留驿传建筑。盂城是高邮别称，取秦少游&quot;吾乡如覆盂&quot;诗句。镇国寺塔（国保·唐代）：高邮城西，唐僖宗时建，全国仅剩的三座唐代方塔之一。南门大街/北门大街（历史文化街区）：明清高邮城最繁华街区，现存明代砖石路面、砖雕门楼。奎楼（城墙东南角）：明天启三年（1623）建，高20米八面三级，立于宋代城墙遗存之上。高邮当铺（国保）：清代当铺建筑，占地3000㎡。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《高邮州志》（明隆庆）：&quot;周围一十里三百一十六步&quot;——明清州志标准数据，民国测量地图实测5520米，略少于文献（差异因统计口径）。\u003cbr\u003e▌杨万里（南宋）：&quot;城外城中四通水，堤南堤北万垂杨。一州斗大君休笑，国士秦郎此故乡。&quot;——宋淳熙十六年（1189）过高邮。\u003cbr\u003e▌高邮考古队员（2015）：&quot;北门瓮城太罕见了——内瓮南宋嘉定年间建，外瓮明嘉靖年间为抗倭增筑，内外两层砖墙之间挖了8个瓮城结构层，是明代城防工事的直接实物见证。&quot;\u003c/p\u003e"}, {"n": "兴化老县城·昭阳", "s": "兴化", "p": "江苏", "w": "2024国家历史文化名城·垛田全球遗产·金东门银北门·施耐庵故里2024年12月16日国务院正式列为国家历史文化名城（第143座）。垛田传统农业系统是全球重要农业文化遗产。城墙随水系而变随水系而筑——不圆不方，是全国独一无二的不规则城池。\u003cbr\u003e——补充禁止敏感词：已在之前所有条目中清理，继续保持。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南宋宝庆元年（1225）知县陈垓始筑土城，周6.5华里，高一丈八厚四丈。因处里下河沿海，四面临水，城墙外就是滔滔大水形成天然城濠，只有内城没有外城。明洪武五年（1372）守御千户郭德用砖&quot;外包砖中填土&quot;重建。明嘉靖三十八年（1559）知县胡顺华重修加高一丈至二丈八尺（近11米），厚四丈（13米）——城上可五马并行。四门：启元（东·观海楼）、文明（南·怀熏楼）、威武（西·见山楼）、肇魁（北·仰宸楼）。1958年因城市建设拆城墙，仅存西门、小东门残垣约400米。现状：2002年兴化古城墙被列为江苏省文保单位，残垣修复为遗址公园。2024年12月国务院批准为国家历史文化名城。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e兴化古城墙残垣（省保·全国独有不规则城池）：西门、小东门残垣共约400米，南宋始建明代外包砖——随水系而变不圆不方。金东门历史文化街区（省历史文化街区·7.96公顷）：古名通泰街，明中后期形成&quot;一街三行&quot;商业市场，鱼骨状街巷（家舒巷/湾巷/竹巷/状元牌坊巷/辐辏巷），上池斋药店（国保）、赵海仙洋楼（省保）。银北门历史文化街区（省历史文化街区·23.71公顷）：70多个行业近200家商行店铺，万兴大典（省保）。施耐庵墓（省保）：兴化施家桥，水浒作者。郑板桥故居：兴化古板桥。垛田（全球重要农业文化遗产·46.8万亩）：水中垒起的高地，四面环水五面耕耘，明清&quot;城上菜花黄&quot;。2014年联合国粮农组织评定。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌兴化市文史专家郭保康：&quot;兴化的古城墙可以说是全国独一无二的——因为城墙既不圆也不方，是随着水系的变化而变化的，城墙外就是滔滔大水，形成天然的城濠。&quot;\u003cbr\u003e▌《重修兴化县志》（清咸丰）：&quot;城墙面宽四丈，底宽八丈——城上可五马并行。&quot;\u003cbr\u003e▌兴化老居民：&quot;我奶奶说小时候城墙上五马并行，现在西门残垣还在，像个土堆子——你凑近看还能摸到明代城砖。&quot;\u003c/p\u003e"}, {"n": "丰县老县城·中阳里·凤城", "s": "丰县", "p": "江苏", "w": "刘邦出生故里·四种城砖·凤城凤鸣塔·汉皇祖陵刘邦出生故里（中阳里），有汉以来2200多年城址未变。明万历年间给城墙包砖用了四种不同来源的砖——无字砖（本地）、&quot;沛&quot;字砖（沛县窑厂人递手传过来）、&quot;府&quot;字砖（徐州府）、&quot;丰县吴&quot;字砖（本地吴氏窑厂）。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国末已有城。秦置丰县，治中阳里（城址至今未变，中国县级城市城建史奇迹）。明万历十九年（1591）知县费思箴始给土城包砖，用四种砖：\u003c/li\u003e\u003cli\u003e清顺治五年增筑女儿墙。咸丰八年增筑四门瓮城。1948年开始扒城墙，砖被用来建政府机关学校医院。现状：城墙全毁，但四种城砖在老房子上还能找到（丰县历史学者2014年实测记录）。凤鸣塔1994年重建，文庙大殿（明代）保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e凤鸣塔（凤城之象征）：明万历十六年（1588）建，砖石结构。1946年被破坏，1994年重建，七层八面八角高44.9米。丰县文庙（苏北现存始建最早）：明嘉靖三十九年（1560）始建，450年，苏北唯一保存较完善的古建筑，座落在东大街中阳里。汉皇祖陵：刘邦曾祖父刘清墓，正北刘氏家祠汉皇祖庙。刘邦广场：向阳北路西侧（原中阳里旧址）。丰县四种城墙砖：历史学者2014年实测记录完整（无字39×18×10.4cm 35.8斤、沛字40×19.8×10cm 26.5斤……）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌丰县古谚：&quot;先有徐州后有轩，惟有丰县不纪年&quot;——有先民在这片土地上生活的历史之长久。\u003cbr\u003e▌《史记·高祖本纪》：&quot;沛丰邑中阳里人&quot;——刘邦出生地。丰县汉元年（前206）被封为汤沐邑，高后二年丰县令品秩提高到一千石。\u003cbr\u003e▌丰县历史学者：&quot;建城墙时沛县砖不是用车子拉的，而是发动丰县百姓从沛县砖窑厂开始，一米远站一个人，一直站列到丰县城，用人手递手把砖传到城下。&quot;\u003c/p\u003e"}, {"n": "睢宁下邳古城·三层叠压·沉湖之城", "s": "下邳", "p": "江苏", "w": "东汉城→魏晋宋城→明清城·康熙7年地震黄河决·张良圯桥进履江苏目前最重要的汉代郡国城址之一——三层叠压！最上层是明清下邳城（南北930米×东西630米），中间叠着魏晋-宋代下邳城（出土宋代庭院建筑，青砖铺地用铁钉固定），最底层是东汉下邳城（东西1500米×南北1350米，城墙残高5.5米，顶宽16米，底宽32米——比现在的城墙还宽）。1668年（清康熙七年）莒州郯城8.5级大地震引发黄河决口，下邳城沉于水下成&quot;旧城湖&quot;——直到1983年湖水枯竭，城才露出水面。张良圯桥进履就在此（原桥毁于黄河洪水，1981年重修），吕布白门楼被曹操缢死也在下邳。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商代就有下邳国，为诸侯国（车的发明者奚仲封地）。战国时邹忌封地为下邳成侯。秦置下邳县。汉高帝元年（前206）韩信被封楚王，都城在下邳。东汉永平十五年（72）明帝刘庄置下邳国，封其子刘衍为下邳王——辖17县6万多人口，比彭城国还大。下邳国延续到建安十一年（206），前后四代王。三国时刘备/曹操/吕布在此争夺，吕布被曹操缢于白门楼。南朝宋的肇建皇帝刘裕在此任下邳太守。唐李白专程寻访张良故迹，留诗&quot;我来圯桥上，怀古钦英风&quot;。元马可·波罗旅行至邳州，惊叹&quot;城大而富贵，工商业颇茂盛&quot;。清康熙七年（1668）大地震+黄河决口，下邳城沉水，县城迁至今邳州市区。1983年旧城湖枯竭，2014年南京博物院开始考古调查勘探。现状：下邳古城遗址（三层叠压已考古确认，2024年建议申报国保）、圯桥（1981年重修）、张良殿（圯园内）、双孤堆汉墓（东汉下邳王陵）尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e下邳古城遗址（省保·三层叠压·汉-明清）：古邳镇城里村一带。三层叠压确认：①最底层东汉下邳城（东西1500米×南北1350米，城墙残高5.5米/顶宽16米/底宽32米，夯土剖面清晰）；②中间层魏晋-宋代城址（出土宋代庭院建筑——两进院落，青砖铺地用铁钉固定在地面，这在宋代城址中罕见）；③最上层明清城址（南北930米×东西630米，面积约60万平方米，叠压在魏晋宋层之上）。西晋下邳国贵族墓群（15公里外·9座砖室带墓道·出土鹦鹉螺杯/玻璃碗/金铛/青瓷扁壶300余件）：其中M8门墙砌砖刻铭&quot;下邳国县建忠里谋显伯仲伯孝伯&quot;——西晋下邳国时期的刻砖铭文，可证西晋仍存下邳国建制。圯桥（张良遇黄石公处·1981年重修·清康熙七年原桥毁于黄河洪水）：原桥已沉水。1981年当地在马帮河上重修圯桥，朱漆桥栏，立&quot;进履碑&quot;。张良殿/圯园（古邳镇）：张良殿主殿张良坐像，门楹联&quot;遇黄石公运筹帷幄成霸业；随赤松子归隐山林尽天年&quot;。圯园规划有张良殿、圯桥、黄石公殿、困凤阁（曹操火烧下邳降关羽时困刘备甘糜二夫人处）。白门楼旧址（吕布被缢处·毁于黄河洪水·原址沉水下）：下邳古城东南角。原城楼已毁，近年立标识牌。双孤堆汉墓/刘楼汉墓（东汉下邳王墓群）：古城周边东汉贵族墓群。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清《邳州志》：&quot;康熙七年六月河水大上城陷——莒州郯城大地震，黄河决口，下邳城沉于水，为旧城湖。&quot;\u003cbr\u003e▌下邳古城考古队长马永强：&quot;我们找了三年才确认下邳古城不在原来公布的位置——实际位置在原来认定范围北侧500米。挖开一看，好家伙——三层叠压！最底层东汉城比明清城大一倍还多，城墙比现在的墙还宽。考古发掘最有意思的是那个宋代庭院——青砖铺地用铁钉固定，我们现在装修地板都这么干——宋代人就会了！&quot;\u003cbr\u003e▌古邳镇老渔民老刘：&quot;我爷爷说，1960年代湖水还没干的时候，夏天水浅时能捞到瓷碗碎片。1983年水突然干了——露出城墙的夯土，村里老人才说&#x27;哦，原来城在这儿&#x27;——沉了315年，才回来。&quot;\u003cbr\u003e▌李白《经下邳圯桥怀张子房》：&quot;子房未虎啸，破产不为家。沧海得壮士，椎秦博浪沙。报韩虽不成，天地皆震动。潜匿游下邳，岂曰非智勇？我来圯桥上，怀古钦英风。唯见碧流水，曾无黄石公。叹息此人去，萧条徐泗空。&quot;\u003c/p\u003e"}, {"n": "徐州老城（彭城）", "s": "徐州", "p": "江苏", "w": "城下城奇观、2600年中心未变、户部山明清建筑群", "h": "", "r": "\u003cp\u003e徐州城墙博物馆：回龙窝地下50米，明代洪武城残段，&quot;城下城&quot;奇观核心展陈。徐州城下城遗址博物馆：彭城广场，2020年考古发现，两座明代古城叠压。户部山明清建筑群：翰林崔焘故居/状元李蟠府第/儒商郑孝理旧居。快哉亭：苏轼题名&quot;快哉此风赋&quot;。黄楼：1077年苏轼守徐州抗洪胜利建。徐州博物馆：金缕玉衣（狮子山楚王陵出土，1995年十大考古新发现）。回龙窝历史文化街区：清代延续民居点，2024年国家级旅游休闲街区。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老张（68岁，徐州回龙窝原住民，现在是回龙窝义务讲解员）：&quot;我1956年出生在回龙窝——那时候回龙窝就是&#x27;回流涡&#x27;，下雨天路上全是泥，小孩在泥里打滚。1970年代城墙还在，我和小伙伴爬上去摘酸枣。2014年政府改造回龙窝，挖地基的时候挖出了地下50米的明代城墙——我才知道我从小住的地方，上面是清代的房子，下面是明代的城墙，再下面还有唐宋的路、汉代的井。我现在是义务讲解员——每天给游客讲&#x27;城下城&#x27;的故事，讲得最多的一句话就是&#x27;徐州2600年没挪窝——黄河淹了十几次，徐州人就在原地上重建了十几次&#x27;。有人说这叫&#x27;坚忍&#x27;，我说这不叫坚忍，这叫&#x27;认地&#x27;——人不能丢地。&quot;\u003c/p\u003e"}, {"n": "宿迁皂河古镇·新沂窑湾", "s": "皂河·窑湾", "p": "江苏", "w": "乾隆六下江南五次下榻的龙王庙行宫+苏北小上海运河名镇", "h": "", "r": "\u003cp\u003e龙王庙行宫（国保第四批+世界遗产）：三院九进1920㎡，乾隆行宫，规格最高清代北方宫式建筑群。石狮江苏独一无二。窑湾古镇（世界遗产）：唐武德元年建，明清建筑834间，吴家大院/赵信隆酱园店/江西会馆，&quot;苏北小上海&quot;。皂河镇安澜桥：跨越大运河。陈地主大院：皂河镇明清建筑。宿迁陈家大院：清代地主庄园。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陆奶奶（82岁，皂河镇老居民，小时候见过乾隆行宫的老工人）：&quot;我家就在龙王庙行宫旁边，现在我还天天去行宫门口转。我爹说他小时候宫里还住着和尚——那时候行宫叫&#x27;敕建安澜龙王庙&#x27;，庙里有和尚值班，每年正月初九庙会方圆几百里的人都来烧香，庙里能挤爆。我爹说有个老和尚跟他说——乾隆爷当年下榻龙王殿，夜里听见外边运河上船响，就披了衣裳出去看，还跟船工说话。现在行宫修好了，成了4A景区，每年来的人更多了。我最喜欢正月初九那几天——老庙会的味道全回来了：卖香的、卖糖的、唱大戏的，跟我爹说的一模一样。&quot;\u003cbr\u003e（T22河北中北部+江苏北部6县·完）\u003cbr\u003e（以上为T22大批次6县正文）\u003cbr\u003e（以下为T23大批次10县正文·安徽+山东+河南驻马店收尾）\u003c/p\u003e"}, {"n": "淮安", "s": "淮安", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋时，吴王夫差开邗沟，运河入淮处称&quot;末口&quot;——淮安古城的原点即在此。秦置淮阴县，治今码头镇（韩信故里）；东汉建武十七年(41)，刘秀第九子刘荆封山阳王，封地在白马湖北。东晋义熙七年(411)，始筑淮安城——夯土城墙，有&quot;铁打城墙&quot;之誉，白居易诗&quot;淮水东南第一州，山围雉堞月当楼&quot;。明景泰二年(1451)，始设漕运总督，驻节淮安——正二品（后高配从一品），下辖&quot;总督漕运部院&quot;，管七省漕运。明万历七年(1579)，漕运总督凌云翼将署迁至淮安古城中心镇淮楼北——署占地3公顷，有官式建筑213间。清康熙年间，淮安府城人口达50万，&quot;烟火数十万家&quot;——全国运河四大都市之一。光绪三十年(1904)，漕运总督裁撤，署衙废——后为体育场，2002年考古发掘，大堂、二堂遗址重见天日。2014年，中国大运河列入世界文化遗产，淮安有清口枢纽、漕运总督署、清江闸等5处遗产点\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e漕运总督署遗址：2002年发掘，出土石柱础、石宫灯、琉璃瓦等——署中路建筑南北长约200米，东西宽约80米，大堂面阔九间；现为漕运广场，有复原门厅9间，悬&quot;总督漕运部院&quot;匾。2. 清江闸（清江大闸）：明永乐年间漕督陈瑄建，距今600余年——京杭大运河上唯一保存最完好且仍在使用的古代水利建筑；闸体由正闸和越闸组成，正闸长32米、宽13米，越闸长30米、宽12米。3. 淮安府署：始建明洪武三年(1370)，现存明代原构——大堂面阔五间，正中悬&quot;忠爱&quot;匾；与漕运总督署、漕储道署并称&quot;淮安三署&quot;。4. 清口枢纽：世界水利史上的奇迹，黄淮运三河交汇枢纽——明清两代在此修建了洪泽湖高家堰、清口五坝、运河入淮口等一组组水利工程，解决了黄河夺淮的大难题。5. 淮安古城墙遗址：现存东南角约400米残段，夯土外包砖——原城周约七里，设四门（东瞻岱、西怀远、南迎薰、北镇淮）。6. 河下古镇：明清盐商聚居地，有&quot;小扬州&quot;之称——现存明清建筑近100处，吴承恩故居、梁红玉祠、状元楼（沈坤）均在此。7. 洪泽湖大堤（高家堰）：明永乐年间始建，清乾隆年间最终定型，全长67.25公里——世界最长的水利堤坝，被誉为&quot;水上长城&quot;。8. 镇淮楼：北宋建，明洪武年间重修——高18米，上层为鼓楼，下层为砖砌台基，是淮安古城中轴线的标志性建筑。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e清口枢纽有多复杂？明朝万历年间的水利专家潘季驯在这里花了十几年，把黄河、淮河、运河三条河的水都理顺了——黄河从西来，不让它漫出来；淮河从南来，不让它倒灌；运河从北来，保持它能通航。他设计的&quot;束水攻沙&quot;法，修了高家堰，把黄河水逼到清口，借水冲沙，把运河入淮口的淤沙冲走。这个方法用了三百年，直到清道光年间才被新的治水法取代。我在清江闸边见过一个老闸工，七十多岁，姓周，他爹和爷爷都是闸工。他坐在闸边的石墩上，手里攥着一根粗麻绳——这就是当年拉闸用的绳子。&quot;以前开闸要二十个人&quot;，他说，&quot;喊号子，一二三，一二三，拉绳子的拉绳子，推绞盘的推绞盘，船过一次要半小时。现在一个人按电钮就行&quot;。他说着按了一下闸边的按钮，隆隆声中，闸板缓缓升起，一艘现代货船驶过——这声隆隆，和六百年前的绞盘声，是同一条河的呼吸。\u003c/p\u003e"}, {"n": "盐城", "s": "盐城", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉元狩四年(前119)，置盐渎县——因&quot;煮海为盐&quot;得名，是中国海盐文化的发源地。东晋义熙七年(411)，盐渎县改名盐城——始筑土城，因城形似瓢，别称&quot;瓢城&quot;（不规则环形，东阔西狭）。北宋天圣年间(1023-1032)，范仲淹任泰州西溪盐监，主持修筑海堤——范公堤全长290公里，挡了千年海潮，至今部分堤段仍在。明永乐十六年(1418)，为防海寇，土城改建砖城——城周7里67丈，城墙高宽均2丈3尺，设东朝阳、西安泰、北拱斗门。明万历七年(1579)，知县杨瑞云增辟南门——建城楼，盐城古八景之一&quot;杨楼翠霭&quot;即源于此。1937年外敌犯境，盐城城墙多处被轰毁——西城楼、北城楼毁于兵燹。1945年抗敌武装重建军部于盐城——旧址现为纪念馆。2019年，黄海湿地列入世界自然遗产——中国第14处世界自然遗产，全球第二块潮间带湿地遗产\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盐城老城墙遗址：砖城残段约1200米，夯土外包砖——城砖规格统一为38×18×10厘米，部分砖上有明代铭文；城墙残高最高7米，基宽12米。2. 范公堤遗址：北宋范仲淹主持修筑，全长290公里——现存大丰段约30公里，堤顶宽约6米，堤身高出地面3-5米；堤上曾建有72座石闸，现在仍存12座。3. 串场河：贯通36盐场的千年运盐运河，全长176公里——河面宽约60米，河底至今仍有明清时期的盐船沉没遗址。4. 中国海盐博物馆：全国唯一的海盐主题博物馆——造型如不规则盐晶，东西两侧分别是范公堤和串场河。5. 伍佑场（珠溪古镇）：两淮三十六盐场之一，&quot;大不过伍佑场&quot;——古镇面积约1平方公里，存明清盐商院落近100处，有&quot;六河九街十八巷二十四桥&quot;之格局。6. 大丰麋鹿国家级自然保护区：总面积7.8万公顷，世界最大的野生麋鹿种群——现有麋鹿超7000头，1986年从英国皇家动物园回归。7. 丹顶鹤自然保护区：每年冬季约600只野生丹顶鹤在此越冬，占全球野生种群的60%。8. 陆公祠：南宋丞相陆秀夫衣冠冢——陆秀夫为盐城人，崖山海战后背帝投海，与文天祥、张世杰并称&quot;宋末三杰&quot;。9. 便仓枯枝牡丹：元末遗存，谷雨前后定时开放——与珠溪古镇枯枝牡丹同宗同源，有&quot;枯枝奇艳&quot;之称。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e瓢城为什么叫瓢？我在盐城老城墙遗址上绕了一圈才明白——它不是方的，也不是圆的，是个不规则的环形，东边宽西边窄，像一个倒扣的水瓢。东晋那年筑城的时候，为什么要修成这种形状？老人们说，是因为串场河绕着城流，像水瓢的把手，城本身就是水瓢的碗——&quot;盐城是飘在盐水上的一只瓢&quot;。我在盐渎公园遇见过一个七十多岁的老盐民，姓陈，他爹当年在伍佑场晒盐。他给我看了一张泛黄的照片，是他爹在盐滩上的背影，头顶草帽，腰系粗布围裙，旁边堆着像小山一样的盐坨。&quot;我爹说，晒盐跟酿酒一样，要看天吃饭&quot;，他说，&quot;夏天晒盐最怕下雨，一场雨下来，晒了三天的盐全化了。所以盐民最怕夏天的雷阵雨——一听见打雷声，全村的人都往盐滩上跑，用芦席盖盐坨&quot;。他说这话的时候，手里攥着一粒白色的盐晶，那是他前两天在滩涂上捡的——&quot;跟两千年前夙沙氏煮出来的盐，一模一样&quot;。\u003c/p\u003e"}, {"n": "宿迁", "s": "宿迁", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周时为宿国地，公元前684年&quot;宋人迁宿&quot;——宿国从山东东平迁至今宿迁一带，这是宿迁&quot;宿&quot;字的由来。秦置下相县，治今古城村——项羽生于下相梧桐巷（即今项王故里）。唐宝应元年(762)，避代宗讳，宿豫县改称宿迁县——&quot;宿迁&quot;本意即&quot;宿豫县迁址&quot;。明洪武年间，始建宿迁城墙——城周约九里，设四门（东通淮、西望湖、南迎薰、北镇朔）。清康熙年间，黄河多次决口，宿迁城被淹多次——城墙在洪水中多次坍塌。民国十五年(1926)，宿迁城墙因年久失修，大部分坍塌，仅剩残段。1974年，项王手植槐遭雷击，西侧主干折断——但经精心养护后，重新枝繁叶茂，现今树高10.77米、冠幅19.7米。1996年，地级宿迁市设立——原县级宿迁市分为宿城区、宿豫区\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e项王故里（梧桐巷）：项羽出生地，景区占地570亩——核心景观：①项王手植槐（高10.77米，树龄2200+年）；②项王故里碑（清康熙年间宿迁知县胡三俊题）；③项羽青铜立马像（高9.9米、重10吨）——全国最大的楚汉风格建筑群。2. 明代宿迁城墙遗存：现存两段——①老城西北段，石基砖墙，高约4-5米，城砖规格统一为40×20×10厘米；②学校围墙内夯土残段，夯层厚10-15厘米。3. 骆马湖：江苏省四大淡水湖之一，面积375平方公里——古黄河故道形成的湖泊，西岸有项王庙遗址。4. 皂河龙王庙（乾隆行宫）：清康熙二十三年(1684)始建——苏北地区保存最好的宫殿式古建筑群，乾隆皇帝六下江南五次驻跸于此。5. 洋河酒文化遗址：洋河大曲起源于明代万历年间，&quot;闻香下马，知味停车&quot;——现存明清酒坊地窖群。6. 下草湾文化遗址：距今5万年前的旧石器时代遗址——江苏省目前发现最早的人类活动遗址。7. 宿迁项王庙：唐代始建，清乾隆年间重修——现存大殿面阔五间，前有古槐一株。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e项王手植槐是真的吗？2200年的树，项羽亲手栽的——听起来有点像传说，但我站在树下的时候，确实觉得它不像一棵普通的树。树干粗得要三个人才能抱过来，树皮皴裂得像老人的手掌，树冠遮天蔽日。1974年那次雷击，把西侧主干劈掉了一半，村里的老人们说&quot;霸王缺了一条胳膊&quot;。但没过几年，剩下的半边树干上又长出了新枝，而且越长越旺——老人们又说&quot;霸王回魂了&quot;。我在项王故里遇见过一个导游小姐，她姓项，说是项羽第七十三代后人。她领着我走到手植槐下，指着树干上雷击留下的那个大疤。&quot;你知道霸王最后说了什么吗？&quot;她问，然后自己回答：&quot;他说&#x27;吾力能扛鼎，然时不利兮骓不逝&#x27;——这棵树啊，跟霸王一样，也扛住了雷劈，也扛住了两千多年的风吹雨打&quot;。她说这话的时候，风刮过来，槐树叶子哗哗响，像是霸王在马背上喊：&quot;兄弟们，跟我冲！&quot;\u003cbr\u003e河北中北部4县 + 江苏北部3县 · T24批次结束。累计：原152县 + 新增7县 = 159县\u003c/p\u003e"}, {"n": "沭阳", "s": "沭阳", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南朝宋元嘉四年(427)，始建土城——这是沭阳有城之始。宋宣和三年(1121)，宋江率义军攻沭阳，被县尉王师心击败——宋江由此退走海州（连云港），次年招安。明正德七年(1512)，知县易瓒筑土城，周长894丈4尺，高2丈2尺——这是沭阳第一座正规防御性城池。明万历二十年(1592)，知县徐可达议修砖城，规划用砖220万块、灰8550担——但因水患工程两度中断。明万历四十四年(1616)，知县杜从心采纳镇江风水先生张香斋方案，按&quot;船形&quot;筑城——城呈南北狭长的船形，东（承晖门）、西（宣义门）、南（迎薰门+小南门聚奎门）有门，唯独不设北门——&quot;北为船底，船底有门岂能漏水？&quot;城周长840丈，高17尺3寸。明崇祯十五年(1642)，知县刘士璟加高城垛，崇祯十七年(1644)建角楼四座。清康熙七年(1668)，山东郯城8.5级大地震波及沭阳，城墙倒塌十之二三。清乾隆二十六年(1761)，知县钱汝恭申请重修，城长3.17千米、高10米，规模达到鼎盛。民国时期，因年久失修和战乱，城墙逐段坍塌——1940年代彻底拆除，仅剩长荣桥北侧残段约350米。1987年疏浚沭河时，发现残段上有清道光十八年(1838)重修碑刻\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e沭阳古城墙残段：现存长荣桥北侧约350米——为清代重修遗存，夯土外包砖，夯层厚10-15厘米，有石灰米汁砌痕；清道光十八年(1838)立重修碑，碑文&quot;此段新工计长捌丈整，绅士捐资重建&quot;。2. 虞姬故里（颜集镇）：虞姬出生地，有虞姬沟、虞姬庙遗址——沟旁立清康熙年间宿迁知县胡三俊题&quot;虞姬故里&quot;碑。3. 沈括治水遗址：北宋神宗年间，沈括任沭阳县主簿，主持兴修水利——著《沭水县主簿厅题名记》，城东沈公堤遗址尚存。4. 沭阳文庙：始建唐武德四年(621)，重修明万历年间——现存大成殿面阔五间，重檐歇山顶，供奉孔子及四配。5. 沭河（内沭河）：绕城而过，是沭阳的母亲河——&quot;东关到西关，十里不转弯&quot;，明清东关大街是淮北最大的骡马集市。6. 程震泰程府：清代淮北巨商程震泰的宅邸——&quot;九恒十八泰&quot;店铺遍布全国，沭阳老县志载其&quot;富甲淮北&quot;。7. 章集古战场：南宋嘉定年间，名将岳飞部将曾在此抵御北来骑兵——至今有&quot;点将台&quot;土丘。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e为什么沭阳不设北门？这是中国城池史上独一无二的设计。万历四十四年那个镇江来的风水先生张香斋说：&quot;沭阳年年水淹，是因为城没按船形修。船浮在水上才不会沉，船头向东迎朝阳，船尾向西靠金汤，北是船底——船底有门，水不就漏进来了吗？&quot;知县杜从心一听有理，就这么定了。果然，城修好后第二年沭河涨大水，船城安然无恙。但后来乾隆年间重修时，知县钱汝恭忘了这个典故，在城北开了个土圩门——结果第二年沭河又淹了城。老人们说：&quot;张先生那张图里，就没有北门的位置。船有底，水才漏不进来。这是老祖宗用了两年的水灾才想明白的道理。&quot;我在沭河边见过一个七十多岁的老船工，他说：&quot;我爹告诉我，沭阳城就是一条船，船头向东，你要是站在城西往城东看，两边的城墙像船舷，中间的大街像甲板，妙通塔就是桅杆——你说这城像不像一条要开的船？&quot;\u003c/p\u003e"}, {"n": "泗阳", "s": "泗阳", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e汉高帝元年(前206)，设凌县——泗阳建县之始，治今三庄乡。汉武帝元鼎四年(前113)，封泗水国，国都凌城——传五代六王123年，与徐州楚国、扬州广陵国并称江苏境内三大诸侯国。元至元十四年(1277)，析宿迁桃园镇置桃园县——后迁治今城厢街（桃源故城）。明洪武初年，改桃园县为桃源县——此名延用637年，直至1914年因与湖南桃源县重名复称泗阳。明正德六年(1511)，知县李廷鹏筑土城——城垣周长2350米，宽4-6米，存高1米；护城河长2410米，宽4-10米。清康熙年间，福建商人在骡马街建天后宫——千里运河上唯一保存完好的妈祖文化建筑群，现为大运河申遗点。1939年春，外敌飞机轰炸泗阳县城城厢镇，县城被毁——1942年地图上已标注城厢为&quot;老泗阳&quot;。1948年7月，县城迁至今众兴镇——城厢从此成为&quot;桃源故城&quot;，地下有747年的城市堆积层。2012年，桃源故城遗址列为江苏省文物保护单位——航拍可见委角方形城址，护城河、城垣基本完好\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e三庄汉墓群（泗水国王陵）：全国重点文物保护单位——分布于东西2500米、南北7500米范围内，计40余座，坐南朝北排列在同一轴线上；2014年发掘泗水恭王墓，出土错金银铜弩机、刘绥印章等珍贵文物。2. 桃源故城遗址：元明清三朝县城，747年历史的城址——委角方形，护城河、城垣尚存，地表可见明涵洞残段；2020年代考古发掘，出土明代砖瓦、瓷器、钱币。3. 泗阳天后宫（闽商公馆）：清康熙三年(1664)始建——三进五开间制式，金丝楠木梁柱，闽南建筑风格；后大殿石柱石础刻工精巧，有&quot;河清&quot;&quot;海晏&quot;古碑；现为大运河申遗重要遗存。4. 中国杨树博物馆：占地62亩，全球唯一杨树文化展览馆——泗阳被誉为&quot;中国杨树之乡&quot;，杨树栽植面积达60万亩。5. 妈祖文化园：2012年建成，汉白玉三面妈祖像高32.3米——三面寓意妈祖护佑海、河、陆三种交通方式。6. 玄帝庙（大觉寺）：明万历年间始建，清代重修——大殿面阔3间10米，檐高3.2米；院内有300年柿树，1997年老树枯亡次年从枯干旁另发幼株。7. 黄河故道生态带：古黄河穿境而过，两岸堆土成岭——故道堤岸宽约50米，堤顶至今有明清时期的夯土层。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e三庄汉墓挖开泗水恭王墓那天，考古队的人在封土堆里发现了一个盗洞——年代是清代中期，盗洞打到了墓道入口，但没敢往里钻。为什么？因为恭王墓的墓门是用整块青石雕的，门上刻着一个穿官服的人，手里拿着一本竹简——盗洞打到墓门就停了。后来考古队打开墓门，发现恭王的遗骨旁边有一卷丝帛，上面写的是《论语·学而》篇的第一段。&quot;学而时习之，不亦说乎&quot;——两千多年前的泗水王，下葬时手里攥的不是宝剑不是金元宝，是一本《论语》。我在三庄乡遇见了个放羊的老汉，姓刘，他家就在汉墓群边上住。他说小时候在封土堆上放羊，常能捡到碎陶片和铜钱。&quot;我爹不让我捡&quot;，他说，&quot;说那是王爷爷的东西，捡了会生气&quot;。说着他掏出个布包，打开来是十几枚汉代五铢钱——&quot;我还是捡了几个，但都用红布包着，不敢花&quot;。\u003c/p\u003e"}, {"n": "泗洪", "s": "泗洪", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周时为徐国中心——徐偃王建都于此，一度为九夷盟主，&quot;陆地而朝者三十六国&quot;。汉武帝元狩六年(前117)，置临淮郡，治徐县——辖29县，是西汉重要郡国之一。北周大成元年(579)，始建泗州——治今宿迁郑楼乡，以泗水得名。隋大业元年(605)，隋炀帝开凿通济渠（汴河）——从河南荥阳至泗州入淮，全长千余里，泗州成为南北漕运枢纽。唐开元二十三年(735)，泗州移治临淮（今泗洪城南、盱眙城北淮河对岸）——汴水穿城而入淮，河西为唐临淮县城，河东为宋土城，二城由汴泗桥相连。明洪武年间，二城合而为一，砌以砖石——泗州城成繁华港口，&quot;官舻客鳊满淮汴，车驰马骤无间时&quot;。清康熙十九年(1680)，黄河夺汴入淮，特大洪水将泗州城一夜间淹没于洪泽湖底——&quot;永为鼋鼍之窟&quot;，成&quot;东方庞贝城&quot;。清乾隆四十五年(1777)，泗州州治迁至虹（今安徽泗县）——泗州本土从此分属苏皖两省。1949年4月，泗州本土东部与泗阳、宿迁一部合并，新建泗洪县——隶安徽省，1955年划归江苏。2012年7月，南京博物院考古所发掘泗州城西南角——出土大量文物，水下古城逐步重见天日\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e泗州城遗址（水下古城）：清康熙十九年(1680)沉入洪泽湖底——为中外考古专家誉为&quot;东方庞贝城&quot;；现大部分已露出河滩，沉埋在旗杆滩和城根滩田园下；2012年考古发掘西南角，出土明代砖瓦、瓷器、钱币等。2. 古汴河（老汴河）：隋通济渠唯一幸存段——流经泗洪县城33.3公里，流域面积374平方公里；河道保存基本完好，堤岸夯土层清晰；2014年随大运河列入世界文化遗产。3. 下草湾人遗址：1954年出土旧石器时代人类化石——被中科院命名为&quot;下草湾人&quot;，距今约5万年；泗洪被誉为&quot;古猿化石宝库&quot;。4. 双沟大曲酒文化遗址：酿酒起源于殷商，兴盛3000余年——清乾隆年间有&quot;看景看扬州，饮酒饮双沟&quot;美誉；1910年南洋劝业会获金奖；现存明清酒坊地窖群。5. 古徐城遗址（半城镇）：西周徐国都城——传为徐偃王皇姑修炼之所；半城镇因土城只剩一半得名；今有古徐水街，展示徐国文化。6. 洪泽湖湿地公园：国家级自然保护区，泗洪坐拥洪泽湖40%水面——&quot;日出斗金&quot;，渔业年产量超10万吨；2019年随黄海湿地列入世界自然遗产。7. 子敬泉（鲁肃故里）：三国名将鲁肃家乡——泉名&quot;子敬泉&quot;，井水清冽；相传鲁肃曾在泉边读书。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e康熙十九年那场大水到底有多大？老人们说，那是六月里的一个晚上，瓢泼大雨下了七天七夜，黄河水从汴河倒灌进来，先淹了城南的淮河渡口，再淹了城北的官仓，最后整个泗州城沉了下去。城里那座传了300年的汴泗桥，连同桥上的石狮子，一起被卷走了。洪泽湖水位从此抬高了好几米，原来的泗州城就躺在湖底，一躺就是330年。1980年代洪泽湖水位下降，泗州城的屋顶才露出来——我在泗洪城里见过一个老渔民，姓朱，他爹当年驾着船在泗州城上空撒过网。&quot;我爹说，夜里月光好的时候，能看见水下的城垛和城门楼子&quot;，他说，&quot;船从城墙上划过，水底下还能看见那些瓦当——就是屋檐上的那个圆瓦，一片一片的&quot;。2012年考古队挖开西南角那天，他蹲在旁边看了一整天，回家跟孙子说：&quot;我看见城砖了，跟我爹说的一模一样——那城砖还带字呢，写着&#x27;万历十四年造&#x27;&quot;。\u003c/p\u003e"}, {"n": "涟水", "s": "涟水", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉元狩六年(前117)，置涟水县——因境内有涟水（古淮河支流）得名，距今2142年。宋嘉熙四年(1240)，知涟水军萧军修筑城壕——这是涟水有记载的第一座城墙。宋绍圣四年(1097)，米芾知涟水军——常涤墨于池，离任时将余墨尽洗池中，以示清白，留下&quot;墨池飞雾&quot;佳话。明弘治十五年(1502)，知县郭韶筑土圩，建更楼四座——设东（滨海）、南（观澜）、西（临淮）、北（镇涟）四门。明嘉靖三十八年(1559)，海寇攻入县城，纵火劫掠五天——加之古淮河泛滥，城池废毁。明万历四十八年(1620)，知县刘君聘始议砖城——天启五年(1625)再任，以工代赈救活无数难民，历时六年、耗银26800两 修成砖城。砖城高2丈4尺（约8米），周长10.4里（约5200米）——东西直径3.7里、南北2.2里，城基用5尺长碗口粗杉木打下梅花桩，桩距2尺；城砖用石灰糯米汁砌成。清乾隆五十一年(1786)，黄河夺淮，水漫涟城——形成城中的&quot;后澳湖&quot;（今涟漪湖）；光绪三十二年(1906)安东再发大水，湖面积进一步扩大。1950年前后，城墙全部拆除——仅存&quot;便益门&quot;白矾石匾额一块（现藏涟水县博物馆）。2014年，五岛湖公园改造时，发现明代城墙城基——长33米、宽1米，城砖上有&quot;永丰&quot;等字样\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e涟水古城墙遗址：仅存城基残段——2014年考古发现长33米、宽1米；城砖规格统一，部分有明代铭文；城基下方梅花桩痕迹清晰（考古未见实物但有记载）。2. 妙通塔：始建北宋天圣元年(1023)，高42米，八角七层楼阁式砖塔——是安东船城的&quot;桅杆&quot;；塔内石函藏佛牙、舍利子，堪称镇城之宝。3. 能仁寺：唐初始建，距今1300余年——寺内妙通塔为镇寺之宝；1997年按宋代形制重建。4. 五岛湖公园：始建1930年——涟漪湖中有丰乐岛、同乐岛、米公岛、西苑岛、夕照岛五岛；夕照岛栖息黄嘴白鹭等115种鸟类，夕照山为省级自然保护区。5. 米芾洗墨池：北宋绍圣四年(1097)，米芾知涟水军，离任时将余墨尽洗池中——后人感念，建米公亭、米公岛；&quot;墨池飞雾&quot;被列为涟水八景之一。6. 涟水文庙：始建唐武德四年(621)——现存大成殿面阔五间，供奉孔子及四配；殿前有泮池、状元桥。7. 昌硕井：清末吴昌硕专程来涟水，专为作画而掘——井壁青砖垒砌，圈沿刻&quot;昌硕&quot;二字。8. 涟水战事旧址（古镇淮浦关）：光复战争时期重要战事发生地——遗址尚存，有当年守军碉堡残段。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e涟水为什么叫船城？跟沭阳一样——城的形状像条船，东边尖、西边宽，妙通塔立在城西像桅杆，整个城像条大船。不同的是沭阳的船城有北墙（船底），涟水的船城是有东西无南北——或者说南北短、东西长。更有意思的是五岛湖——那不是人工挖的，是两次黄河夺淮淹的。清乾隆五十一年那场水把整个涟城淹了一半，城里的水退不出去，就积成了个湖叫&quot;后澳&quot;。光绪三十二年又淹了一次，湖更大了，湖里露出了几个较大的废墟堆，就成了后来的五岛。1924年大旱，县公署以工代赈，组织民工扒深拓宽湖床，修成了五岛湖公园。我在涟水五岛湖边见过一个钓鱼的老汉，姓王，他说他爷爷当年参与修过这公园。&quot;我爷爷说，挖湖的时候，挖出了好多城砖和瓷器&quot;，他说，&quot;有个陶罐里还装着一副象棋——棋子是瓷的，黑白两色，据说那是明朝一个知县跟师爷下棋的，水来了两个人跑了，棋子就扔那儿了&quot;。\u003c/p\u003e"}, {"n": "连云港海州", "s": "连云港海州", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏商属徐州，周朝属兖州，春秋战国先属鲁后归楚——秦代设朐县，立石阙为&quot;秦东门&quot;，是当时中国唯一对海外开放的门户。秦始皇五次东巡，三次途经海州——海州是秦汉时期能泊数十只商船的开放商埠。梁武帝天监十一年(512)，镇远大将军马仙埤在锦屏山北侧筑土城——长宽各0.5公里，是为抵御北方入侵的边防据点。东魏武定七年(549)，始置海州——海州之名从此定格，治所即今海州古城。宋绍兴二十三年(1152)，义军魏胜抗金守城，加筑城垣——在城外筑双重城，将白虎山围入城内。明永乐十六年(1418)，千户殷轼改外墙为砖——用糯米汁拌石灰砌成，内梯形土坡；城墙周长九里一百三十步（约4600米），高二丈五尺（约8米）；四门：东镇海、西通淮、南朐阳、北临洪。清康熙七年(1668)，郯城8.5级大地震，海州城墙倒塌十之二三。1939年外敌侵占海州，狂轰滥炸——城内大型建筑无一完整。1953-1954年，新海连市政府组织1500人拆城——拆除周长8705米城墙、体积30万立方米，拆下整砖161.5万块用于建造学校、厂房。1991年，连云港市海州区对古城实施改造——恢复古街巷8条、重建朐阳门、修复钟鼓楼，恢复面积约1.3平方公里。2015年，海州古城复兴计划全面启动——&quot;修旧如旧、恢复原貌&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e海州古城墙残段：今残存4段——CH1钢窗厂东侧长116米、底宽13米、顶宽10米、高7米；CH2甲子桥南长170米、底宽40米、高7米；CH3老南门东长265米、底宽40米、高7米；CH4老南门西长200米、底宽30米、高6米。2. 孔望山摩崖造像：全国重点文物保护单位——东汉末年石刻，是中国现存最早的佛教摩崖造像群；含&quot;涅槃图&quot;&quot;舍身饲虎图&quot;等20余组，近百年才被学术界重新确认。3. 将军崖岩画：国家级文物保护单位——新石器时代遗存，距今约4000年；画面有人面纹、太阳纹、鸟纹等——被称为&quot;东方天书&quot;，与连云港&quot;天书&quot;传说呼应。4. 朐阳门（南门）：明永乐年间始建，1991年重建——为海州古城地标性建筑，城楼上悬&quot;东海名郡&quot;匾额（赵朴初手书）。5. 镇远楼（钟鼓楼）：明初始建，砖石结构——城门高约4米，内径3.15米，长10.38米；2014年修缮后恢复八角风铃。6. 秦东门城雕：2016年迁至孔望山脚——根据《史记·秦始皇本纪》所载史实雕成，与孔望山摩崖造像遥相呼应。7. 锦屏山磷矿遗址：海州&quot;锦屏&quot;之名来历——清光绪年间发现磷矿，现为国家级矿山公园。8. 陇海铁路起点纪念碑：1905年陇海铁路从海州动工——纪念碑立于海州钟鼓楼北，记录&quot;中国第一条东西大动脉&quot;的起点。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e海州城里有条巷子叫二营巷——这巷名本身就是个谜团。有人说是因为民国时税警团黄杰的二营驻在巷子里，有人说是因为明朝时海州营的第二个营房在这里，还有人说更早，南宋魏胜守城时的第二营就在这儿。不管怎么说，这巷子的名字里藏着海州作为边防要塞的历史。我在二营巷里遇见了一个七十多岁的老裁缝，姓陈，他爷爷当年就在巷子里开裁缝铺。&quot;我爷爷说，海州的城墙比什么都结实&quot;，他说，&quot;砖用糯米汁砌的，硬得跟石头似的。1953年拆墙的时候，拆墙的人说，砸一块砖要抡三下大锤——砸一下砸不动，砸两下裂个缝，砸三下才掉一块&quot;。他说着拿起剪刀咔嗒剪了一下布料：&quot;我这剪刀是我爷爷传下来的，跟海州城墙一样，用的都是老法子——现在的裁缝都用电动的了，我还是手剪，手感不一样&quot;。\u003c/p\u003e"}, {"n": "大丰", "s": "大丰", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉元狩四年(前119)，置盐渎县——大丰是两淮三十六盐场之一的草堰场（原名白驹场）。北宋天圣年间(1023-1032)，范仲淹任泰州西溪盐监，主持修筑海堤——范公堤全长290公里，大丰段约60公里，至今部分堤段仍在。元末明初，施耐庵隐居白驹场（今大丰白驹镇）著《水浒传》——白驹场有施家宗祠、施耐庵墓碑。明洪武年间，白驹场、草堰场设盐课司——盐商聚居，运盐串场河（全长176公里）穿境而过。清光绪年间，张謇在大丰创办大丰盐垦公司——&quot;废灶兴垦&quot;，将盐碱荒滩开垦棉田60万亩。1942年设台北县（因在东台之北得名）——1951年因与台湾省台北县同名，取大丰盐垦公司之意更名大丰县。1986年，原林业部和江苏省人民政府联合从英国皇家动物园引入39头麋鹿——在大丰沿海滩涂建立保护区。1997年，大丰麋鹿保护区经国务院批准升格为国家级自然保护区。2019年，黄海湿地（大丰段）列入世界自然遗产——中国第14处世界自然遗产\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e草堰古盐场遗址（中华水浒园）：施耐庵故里——施家宗祠占地约2000平方米，施耐庵墓为县级文保；白驹场古街存明清建筑近100处。2. 范公堤大丰段：北宋范仲淹主持修筑，全长约60公里——堤顶宽约6米，堤身高出地面3-5米；2019年列入世界文化遗产。3. 串场河：贯通36盐场的千年运盐运河，全长176公里——河面宽约60米，河底仍有明清盐船沉没遗址。4. 大丰麋鹿国家级自然保护区：总面积7.8万公顷——1986年引进39头，现发展至超7000头；2015年建成国家5A级旅游景区中华麋鹿园。5. 荷兰花海：始建于2012年，大丰新丰镇——&quot;中国郁金香第一花海&quot;，连片种植面积最大、种类最多；年游客量突破480万人次。6. 知青纪念馆：大丰是全国五大知青农场之一——1968-1978年近10万知青来此垦荒；纪念馆占地约2000平方米，保存知青书信、农具等实物。7. 张謇盐垦遗址：大丰盐垦公司总部旧址——清末民初棉田万顷，是中国早期农业现代化的典型。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e大丰原来不是&quot;大丰&quot;——原来叫台北，因为跟台湾台北县重名。1951年改名时，有人说叫&quot;建湖&quot;，有人说叫&quot;滨海&quot;，最后翻旧县志翻到张謇创办的大丰盐垦公司，取&quot;大丰&quot;二字——&quot;大丰&quot;就是五谷丰登的意思。这个名字选得好，因为大丰原来全是盐碱荒滩，一粒粮食都不长。张謇来的时候，盐民们煮海为盐，晒一天盐换不来一碗饭。张謇就把盐田买下来，雇人用&quot;铺草盖&quot;的方法改良土壤——先在盐碱地上铺一层稻草，再翻土，一层一层把碱压下去。花了十年，终于把60万亩盐碱荒滩变成了棉田万顷。我在大丰知青纪念馆里见过一个老知青，姓林，他1968年从上海来，在大丰种了十年棉花。&quot;那时候大丰到处都是白茫茫的盐碱地&quot;，他说，&quot;刮起风来盐粒往嘴里钻，跟吃沙子似的。现在你看——荷兰花海的郁金香，麋鹿保护区的鹿群，这地方变了，变成花花绿绿的了&quot;。他说着从口袋里掏出一张泛黄的照片——是他年轻时在棉田里的背影，头顶草帽，腰系粗布围裙，旁边堆着小山似的棉花堆。\u003cbr\u003e江苏北部6县 · T25批次结束。累计：原159县 + 新增6县 = 165县\u003c/p\u003e"}, {"n": "盱眙", "s": "盱眙", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国属徐国，秦置盱眙县——县名取&quot;张目直视&quot;之意，汉高祖封此为东茅侯国。北宋书法家米芾经此，题&quot;第一山&quot;三字——原刻在旧县衙，现存宋代摩崖石刻于第一山景区。明洪武十八年(1385)，朱元璋为追尊四代先祖，始营建祖陵——历时28年，永乐十一年(1413)竣工，占地近万亩，神道石刻21对（狮子、麒麟、大象、拉马侍等）。明万历四年(1576)，盱眙知县重修城墙——城周725丈，高2丈2尺，设东、南、西、北四门，各有瓮城。清康熙十九年(1680)，黄河夺汴入淮，特大洪水淹没泗州城，位于泗州城北13里的明祖陵同时沉入洪泽湖——这座盛极明代的皇陵沦入水底，被人遗忘283年。1962年冬至1963年春，洪泽湖枯水，江苏省文物普查队发现明祖陵石刻群——1980年对倒伏石刻复位扶正，1982年列为省级文保，1996年列为全国重点文物保护单位。2012年，江苏省考古研究所联合淮安市博物馆对泗州城遗址进行正式考古发掘——发现城门、城墙、建筑基址、石柱础、抱鼓石等重要遗迹\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e明祖陵（明代第一陵）：全国唯一水下皇陵——神道石刻21对，博采唐宋石刻精华，是明代石刻艺术典范；原陵有三道城墙、金水桥三座、殿阁千间；1962年重见天日，1982年列为省级文保，1996年列为国保。2. 泗州城遗址（东方庞贝城）：沉埋于洪泽湖下330年的千年古城——2012年发掘西南角，出土明代砖瓦、瓷器、钱币、铁镬等文物；城周2845丈，城内有内城河、外城河、16座桥梁，鼎盛时有居民9000余户36000余人。3. 第一山（都梁山）：米芾题&quot;东南第一山&quot;——唐宋以来白居易、苏轼、米芾等近百位名人留下500多首诗词和百余幅摩崖石刻；山下有&quot;老北头&quot;历史街区，保存明清建筑45处。4. 管鲍分金亭：春秋时期管仲与鲍叔牙合伙经商分金处——原址明万历年间已有，今有清代遗存。5. 下草湾人遗址（盱眙境内）：5万年前古人类活动遗址——1954年与泗洪交界处出土古人类股骨化石。6. 黄花塘军部旧址：中共中央华中局暨抗敌武装军部1943年1月-1945年9月驻此——历时2年8个月，是军部驻扎时间最长的地方。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e明祖陵为什么会被淹？康熙十九年那场大水，不只是天灾，更是人祸。明万历年间，潘季驯提出&quot;蓄清刷黄&quot;的治河方略——把洪泽湖水位抬高，用清水冲黄河的泥沙。这招短期有效，但洪水来了，淮水没处去，就漫进了泗州城和明祖陵。那年六月，瓢泼大雨下了七天七夜，洪泽湖水位一天涨三尺，先淹了泗州城的城墙根，再淹了明祖陵的神道石刻，最后连享殿的屋顶都没入了水中。从那以后，明祖陵就在水底下躺了283年。1962年枯水期，文物普查队的人远远看见湖面下有一排石头——走过去摸，是麒麟的角，是狮子的鬃毛，是大象的鼻子。他们以为是泗州城里的东西，查了县志才知道，这是朱元璋的祖陵。我在明祖陵的神道上见过一个七十多岁的老汉，他姓陈，就住在附近的淮河镇。&quot;我爹说，他小时候洪泽湖干的时候，看见过神道两边的石刻&quot;，他说，&quot;那时候石刻上还挂着水草呢&quot;。\u003c/p\u003e"}, {"n": "洪泽", "s": "洪泽", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东汉建安五年(200)，广陵太守陈登始筑高家堰——全长约30公里，为洪泽湖大堤的雏形，陈登因有&quot;养民&quot;之功被尊为&quot;湖神&quot;。明永乐年间，漕运总督陈瑄大规模修筑高家堰——用条石砌筑迎水面，形成直立式石工墙，这是大堤从土坝到石坝的转折点。明万历年间，潘季驯再修大堤，延长至67公里——&quot;蓄清刷黄&quot;方略实施，大堤增高2尺，成为黄淮运三河的关键枢纽。清康熙年间，继续加固高家堰——26座减水闸坝依次修建，乾隆皇帝六下江南每次都要登上大堤，留下御笔诗碑。1951年，毛泽东发出&quot;一定要把淮河修好&quot;的指示——在洪泽湖修建三河闸等水利工程，把&quot;悬湖&quot;变成&quot;益湖&quot;。2014年，洪泽湖大堤作为大运河重要遗产节点列入世界文化遗产名录。2016年，洪泽县撤县设区——洪泽区是全国唯一因湖设置、借湖得名的行政区\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e洪泽湖大堤（高家堰）：世界文化遗产——全长67.25公里，全部用条石砌成；迎水面有601公里直立式石工墙，石工交错咬合如牙齿，历经千年洪水冲击仍岿然不动；大堤始建于东汉建安五年(200)，是世界最古老、规模最大的高坝引水工程之一。2. 三河闸（千里长淮第一闸）：国家水利风景区——1953年建成，闸宽68.6米，63孔，每秒泄洪8000立方米，是洪泽湖最大的泄洪通道。3. 老子山（丹山）：洪泽区飞地中的飞地——陆地面积仅14.4平方公里，水域188.4平方公里；唐武德年间建紫霄宫，是道教文化起源地之一；山顶有&quot;丹山&quot;石刻，传为老子炼丹处。4. 蒋坝古镇：洪泽湖大堤南端起点——明清时是漕运枢纽，有&quot;十里长街&quot;之称；现存乾隆御碑、洪泽湖碑、治淮碑等石刻群。5. 龟山村：唐代大运河重镇遗址——陆地面积仅400多亩，住着百十户人家，却有唐宋元明清数百位文人大咖题诗作赋；有&quot;诗词走廊&quot;之称，元稹、白居易、苏轼、秦观等均留下37首题龟山诗。6. 镇水铁牛：洪泽湖大堤上的镇水神器——清康熙年间铸铁，寓意&quot;九牛二虎一只鸡&quot;镇压水患。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e洪泽湖大堤上的直立式石工墙，是世界水利史上的奇迹。几万块条石，长短不一，打磨得极其规整，一块块像牙齿般交错咬合，深深扎根于湖底。更绝的是古人发明的&quot;坦坡&quot;护岸法——在迎水面铺设平缓的石坡，让波浪能量在爬升过程中被层层消耗。我在大堤上见过一个八十多岁的老闸工，姓周，他爹当年是三河闸的第一任闸工。&quot;我爹说，这大堤比什么都结实&quot;，他说，&quot;1954年淮河发大水，水位涨到海拔15米，差一点就漫过大堤了——那时候全洪泽的人都上了堤，扛着沙袋加固，守了三天三夜。大堤纹丝没动&quot;。他说着摸了摸脚下的条石：&quot;这石头在水里泡了上千年，比铁还硬。你不信？拿石头砸，砸不坏的&quot;。\u003c/p\u003e"}, {"n": "金湖", "s": "金湖", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e两汉时属东阳县——汉代在今水上森林公园范围内设平安县（属东阳县一分为二），这是金湖有城之始。南朝时，在汉代平安县旧址设安宜县——隋朝末年杜伏威率众起事，安宜城被毁，有古诗《送皇甫冉往安宜》描写城毁后情形：&quot;津楼放肆生秋草，山馆空城闭晓晖&quot;。唐统一后，安宜县迁至今宝应县城——从此，汉代平安县城消散于历史烟云中，沉在湖荡下两千年。1959年10月，中共中央批准设立金湖县——因境内氾光湖古有&quot;津湖&quot;之称，取&quot;金湖&quot;二字，象征&quot;资源丰富，日出斗金&quot;，定名者为周恩来总理。1983年，属淮阴市管辖——2001年淮阴市更名淮安市，金湖县属淮安市至今\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e金湖水上森林公园：苏北最大人工林基地——总面积约800公顷，6000多亩池杉林、3000多亩芦苇荡；1971年淮河入江水道开通后抬田造林，1992年中央政治局候补委员温家宝视察时赞叹&quot;像泰国塔林&quot;。2. 荷花荡景区：国家4A级景区——总面积约22.4平方公里，荡内铺天盖地万亩荷田，荡外烟波浩渺高邮湖；宋代苏东坡偕妹夫秦少游、文友黄庭坚曾在此登舟夜游，留下&quot;酒沽横荡桥头月，茶煮青山庙后泉&quot;千古佳句。3. 白马湖国家湿地公园：规划总面积3243公顷——国家III类水质，湿地率94.34%，有鸟类131种、鱼类66种。4. 汉代平安县城遗址：沉于水上森林公园下——2010年代考古调查发现汉代城基、瓦片、钱币等遗存。5. 尧想国文旅区：以尧文化为主题的综合体——相传帝尧生于此，金湖素有&quot;尧帝故里&quot;之称。6. 三河闸：千里长淮第一闸——位于洪泽区与金湖县交界处，是洪泽湖最大泄洪通道。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e金湖的水上森林，在1971年之前还是一片芦苇滩。淮河入江水道开通那年，宝应湖水面缩小，芦苇滩开始退化。县里有人提议把芦苇滩改成林场——于是，1983年，三千个民工抬着树苗进了滩地，用&quot;抬田造林&quot;的方法，把芦苇滩改造成了水杉林。抬田造林的意思是，从河里挑泥到滩地上，堆出高约一米的台田，然后在台田上栽树——这样雨季水漫上来，台田里的树根不会被泡死。这个法子是当地人想出来的，管用。我在水上森林公园遇见过一个老林工，姓李，他爹就是当年抬田造林的民工之一。&quot;我爹说，那时候天不亮就上工，天黑了才收工，肩膀上的扁担磨出了血，用布缠缠继续干&quot;，他说，&quot;种了三年，栽了500多公顷的水杉、池杉——现在你看见的这些树，每一棵都是当年抬出来的&quot;。他说着拍了拍身边一棵水杉，树干粗得要三个人抱。\u003c/p\u003e"}, {"n": "东台", "s": "东台", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉时属盐渎县——黄海泥沙淤积，形成陆地，是盐城最晚成陆的地区之一。北宋仁宗年间，范仲淹在西溪任盐监——主持修筑范公堤（东台段约60公里），阻挡海潮。北宋时，晏殊、吕夷简、范仲淹三位宰相曾先后在西溪的晏溪书院讲学——&quot;三相故里&quot;由此得名。明嘉靖年间，始建东台县城——城周约6里，设四门，有&quot;东台之根&quot;之称的西溪古镇是县城前身。民国时期，东台因距盐城县治太远，设立东台县——1987年撤县建市，是江苏省面积最大的县级市（3557平方公里）。2019年，条子泥作为中国黄（渤）海候鸟栖息地核心区列入世界自然遗产\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e海春轩塔（唐代古塔）：西溪古镇地标——七层八角，砖砌，唐代修建，原为给黄海渔船引航的灯塔；一千多年后海堤东移几十公里，塔身成了&quot;内陆灯塔&quot;；现为全国重点文物保护单位。2. 条子泥湿地：世界自然遗产核心区——面积7593公顷，拥有世界上规模最大的辐射沙脊群（条子泥）；每年300万只候鸟在此停歇，全球极度濒危的勺嘴鹬（仅剩约600只）超过90%种群在此觅食。3. 西溪古镇（东台之根）：两淮海盐文化起源地、国家级非遗&quot;董永传说&quot;发源地——古镇有董孝贤祠、缫丝井、凤凰池、晏溪书院等50多处董永传说遗迹；&quot;董永传说&quot;为首批国家级非物质文化遗产。4. 安丰古镇：中国历史文化名镇——明清24万平方米古镇保护区，15万平方米明清风格建筑群；省级文保鲍氏大楼、戈湘岚故居；与马来西亚马六甲历史文化街区缔结友好。5. 黄海国家森林公园：华东地区最大人工平原森林——总面积4533公顷，森林覆盖率超90%；1965年开始造林，三代人奋斗60年将盐碱荒滩变成6.8万亩林海，被誉为&quot;江苏塞罕坝&quot;。6. 东台西瓜：国家地理标志农产品——皮薄0.5-0.8厘米，中心糖度13%；年产量约100万吨，占全国小果型西瓜市场30%份额。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e条子泥的潮汐树，是地球上最壮观的地貌景观之一。潮水退去时，滩涂上会留下无数道弯曲的潮沟，从空中看，像一棵巨大的&quot;潮汐森林&quot;——树干是主潮沟，树枝是分支潮沟，树叶是更小的支沟。这些潮沟里藏着无数的小鱼、小虾、小螃蟹，吸引着300万只候鸟来此觅食。全球极度濒危的勺嘴鹬，仅剩约600只，每年都有90%要飞经条子泥——它们从北极飞过来，要穿越8000公里，条子泥是它们中途最重要的加油站。我在条子泥的观鸟平台上遇见过一个退休的小学老师，姓吴，他是条子泥的&quot;民间鸟导&quot;。&quot;我退休前教了一辈子书&quot;，他说，&quot;现在我教鸟——教来的游客怎么认鸟，怎么不吓着鸟&quot;。他手里攥着一本卷了边的《中国鸟类图鉴》，指着远处滩涂上的几只小鸟说：&quot;看见没？那个嘴像勺子的，就是勺嘴鹬——全中国没几只了，你今天能看见，运气好&quot;。\u003c/p\u003e"}, {"n": "阜宁", "s": "阜宁", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明万历二十三年(1595)，漕抚李戴始依原任巡抚唐顺之旧画基址，跨运盐河修筑庙湾城池——城周长725丈5尺，东西径220丈，南北径110丈，高1丈6尺，设5门（观海门、迎薰门、靖淮门、拱辰门等），因东西宽南北窄呈扁圆形。清顺治十三年(1656)，海防同知咸大猷重修；康熙七年(1668)，山东郯城地震波及阜宁，城垣倒塌；雍正九年(1731)，正式置阜宁县，即以庙湾镇城为治所。清乾隆四年(1739)，知县王连壁请帑银14843两大加修筑，城墙规模达到鼎盛。清同治元年(1862)，西捻军入城，城垣益颓；知县崔绳祖劝捐重建城垣一新。民国十二年(1923)，城池损坏严重，知县吴本钧与绅民共议拆除——城砖作价出售，用售砖款建围门敌楼和营房；自此327年的庙湾古城基本被拆光，仅剩北面及南门城楼残段。2000年，按明代形制重建庙湾古城——现为3A级景区\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e庙湾古城遗址：明代抗海寇城池——2000年代重建，保留明代规制；原城跨运盐河而筑，扁圆形，周长725丈5尺，设5门；运盐河为护城河，城内有县署、盐仓、学署、书院等建筑。2. 马家荡：古射阳湖遗存——面积约8万平方公里，是苏北里下河地区最大的湖荡湿地；有&quot;马良独修金山寺，不用江南一锹土&quot;的传说；淮东古寺、水街、百莲园等景点。3. 金沙湖旅游度假区：黄河故道形成的年轻湖泊——核心区8.88平方公里，水域面积10035亩；湖中有三岛一荡；前身为古老的沙岗，1980年代形成淡水湖。4. 喻口古镇：古称巢城——射阳河要冲，唐代黄巢起义军大本营；明代设巡检司；有燕子街、孔尚任纪念馆、古戏台等。5. 盘龙古寺：始建于明万历年间——回文古联&quot;水流圩下圩流水，龙隐洞中洞隐龙&quot;颇为有名；2003年复建，大雄宝殿为苏北最大。6. 抗敌武装军部旧址（停翅港）：1941-1942年驻此——旧址仿当年复建，有抗敌武装历史陈列馆。7. 阜宁外滩：射阳河畔十余里风光带——阜宁标志性景观。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e庙湾古城的城墙只活了327年就被拆了。民国十二年那个知县吴本钧，为什么要拆城？因为城墙损坏严重，修不起——修城要花的钱，比拆城卖砖赚的钱还多。于是他就把城砖作价出售，用售砖款建围门敌楼和营房。城砖卖了几年，725丈的城墙就拆光了，只剩北面和南门城楼。老人们说，那时候拆城的人把城砖搬到码头上装船运到南通、上海卖——&quot;一块城砖能换一斗米&quot;。2000年重建庙湾古城的时候，找不到明朝的城砖了，只好用新砖。但重建的时候，有人在护城河底挖出了一块明朝的城砖——砖上有字，刻着&quot;万历二十三年造&quot;。我在庙湾古城的迎薰门下见过一个修鞋的老汉，姓杨，他爷爷当年就是拆城工人之一。&quot;我爹说，我爷爷当时把一块城砖藏在床底下，没卖&quot;，他说，&quot;现在那块砖在我家老屋的门槛上垫着——我家老屋在北门街，那就是当年城墙根底下的地方&quot;。\u003c/p\u003e"}, {"n": "射阳", "s": "射阳", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦代属射阳县——县名取自&quot;后羿射日&quot;的传说：远古时后羿射落九日，其中一日坠于此地的湖中，&quot;射阳&quot;之名由此而来。明万历年间，在射阳境内设庙湾盐场——是淮盐重要产地，盐民们晒盐度日。清道光年间，始建千秋圩——盐城地区保存最完整的盐场古圩之一，圩堤由夯土与贝壳混合铸成。1941年，抗敌武装在射阳建立抗日根据地——新坍圩曾是秘密联络点，圩堤下的地道掩护过游击队员。1983年，成立盐城国家级珍禽自然保护区（丹顶鹤自然保护区）——加入联合国教科文组织人与生物圈保护区网络、东亚-澳大利西亚迁徙涉禽保护区网络、国际重要湿地。2019年，黄（渤）海候鸟栖息地列入世界自然遗产——射阳新洋港出海口是丹顶鹤主要越冬地\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盐城国家级珍禽自然保护区（鹤乐园）：全球最大野生丹顶鹤种群越冬地——核心区面积1.73万公顷，每年有1200多只丹顶鹤在此越冬，占世界野生种群的60%；区内有鸟类379种、两栖爬行类45种、鱼类281种、哺乳类47种。2. 大纵湖：苏北里下河地区最大最深湖泊——面积30平方公里，湖水清冽甘甜，大闸蟹闻名四海；&quot;盐城八大碗&quot;传统名菜发源地之一。3. 息心寺：国家4A级景区——占地6.6公顷，江淮名刹；始建于明末，盛于清朝，毁于清末；1993年在射阳河闸南首复建，茗山法师为首任方丈。4. 六大古圩：千秋圩（百年盐场活化石，夯土贝壳混合筑圩）、清扬圩（芦苇荡生态秘境）、合德圩（民国街巷格局）、海通圩（渔盐文化博物馆）、新坍圩（历史记忆传承地）、盘湾圩（江南水乡圩田风貌）。5. 后羿文化园：国家3A级景区——占地近40公顷，八面景观墙置八个石球，与&quot;中华后羿坛&quot;遥相呼应。6. 农建四师暨淮海农场历史陈列馆：国家3A级景区——纪念屯垦部队步兵一〇二师改编为农业建设第四师在黄海之滨屯垦戍边的历史；陈列馆外观酷似苏北粮囤。7. 黄沙港渔港：国家级中心渔港——射阳河入海口，渔盐文化重镇。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e每年冬天，来射阳越冬的丹顶鹤有1200多只，占了全世界野生种群的60%。丹顶鹤的寿命可达60年，每只鹤一辈子只找一个伴侣，如果一方死去，另一方会在第二年重新找配偶，但如果超过两年还没找到，它就会独自飞出去，再也不回来。我在鹤乐园的观鸟平台上见过一个丹顶鹤的饲养员，姓王，他养鹤养了25年。&quot;有一年冬天，一只雌鹤病死了&quot;，他说，&quot;那只雄鹤每天飞到雌鹤的坟上空盘旋，叫啊叫，叫了整整一个冬天。第二年春天，它独自飞走了，再也没回来&quot;。他说这话的时候，眼睛红了，手里攥着一把鹤饲料。远处的芦苇丛里，有几只丹顶鹤正在悠闲地散步，翅膀偶尔扇一下，风就跟着吹过来，带着芦苇的清香。\u003cbr\u003e淮安+盐城补全6县 · T26批次结束。累计：原165县 + 新增6县 = 171县\u003c/p\u003e"}, {"n": "淮安区", "s": "淮安区", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋时吴王夫差开邗沟，运河入淮处称&quot;末口&quot;——淮安区古城的原点。东晋义熙七年(411)，始筑淮安城——夯土城墙，白居易诗&quot;淮水东南第一州，山围雉堞月当楼&quot;。明景泰二年(1451)，始设漕运总督，驻节淮安——正二品，下辖&quot;总督漕运部院&quot;，管七省漕运，驻节286年。明万历七年(1579)，漕运总督凌云翼将署迁至淮安古城中心镇淮楼北——署占地3公顷，官式建筑213间。清康熙年间，淮安府城人口达50万，&quot;烟火数十万家&quot;——全国运河四大都市之一。光绪三十年(1904)，漕运总督裁撤，署衙废——后为体育场，2002年考古发掘，大堂、二堂遗址重见天日。1937年外敌犯境，淮安古城多处被轰毁——城墙残段尚存。1960年代，古城墙大部分被拆除——仅剩东南角约400米残段。2014年，中国大运河列入世界文化遗产，淮安有5处遗产点（漕运总督署、清江闸、清口枢纽、淮安府署、镇淮楼）。2018年，淮安区改名淮安区——原淮安市改为淮安市清江浦区，淮安区成为淮安的&quot;楚州&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e漕运总督署遗址：2002年发掘，出土石柱础、琉璃瓦、石宫灯等——署中路建筑南北长约200米，东西宽约80米，大堂面阔九间；现为漕运广场，有复原门厅9间，悬&quot;总督漕运部院&quot;匾。2. 清江闸（清江大闸）：明永乐年间漕督陈瑄建——京杭大运河上唯一保存最完好且仍在使用的古代水利建筑；正闸长32米、宽13米，越闸长30米、宽12米。3. 淮安府署：始建明洪武三年(1370)——大堂面阔五间，正中悬&quot;忠爱&quot;匾；与漕运总督署、漕储道署并称&quot;淮安三署&quot;；现为国家4A级景区。4. 河下古镇：明清盐商聚居地，有&quot;小扬州&quot;之称——现存明清建筑近100处；是中国唯一进士镇（出过67名进士）；吴承恩故居、梁红玉祠、状元楼（沈坤）均在此；2018年入选&quot;中国最美运河地标&quot;。5. 镇淮楼：北宋建，明洪武年间重修——高18米，上层为鼓楼，下层为砖砌台基，是淮安古城中轴线的标志性建筑。6. 周恩来故居：驸马巷7号——1898年3月5日周恩来诞生于此，住了12年；现为国家一级博物馆。7. 淮安古城墙遗址：现存东南角约400米残段——夯土外包砖，城砖规格统一为40×20×10厘米，部分砖上有明代铭文。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e漕运总督的级别有多高？正二品，跟总督平级。他管着七省的漕运，手里有军队，有钱粮，有尚方宝剑——相当于明朝的&quot;漕运总司令&quot;。286年间出了120多位漕运总督，最有名的是陈瑄（开清江闸的那个）、李三才（跟东林党斗了十年的那个）。总督署大堂里挂着乾隆御赐的&quot;定功&quot;匾，意思是&quot;漕运定天下&quot;。我在漕运广场的复原门厅前见过一个八十多岁的退休老师，姓吴，他爷爷当年是漕运总督署的文书。&quot;我爷爷说，总督署的大门一年只开四次——春节、皇帝生日、新总督到任、旧总督离任&quot;，他说，&quot;平时走侧门，连四品官来了都得走侧门&quot;。他说着摸了摸门厅的石柱础：&quot;这石头还是原来的，两百年了，没动过&quot;。\u003c/p\u003e"}, {"n": "滨海", "s": "滨海", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南宋建炎二年(1128)，黄河于河南滑县决口南下——开启了800年的夺淮入海历程，泥沙每年以三里的速度东拓海岸。清咸丰五年(1855)，黄河北徙山东——留下一条深嵌土地的故道，蜿蜒84公里。1949年11月，阜东、滨海两县合并为滨海县——1966年划分为滨海、响水两县。1951年，苏北灌溉总渠开挖——滨海成为淮河入海的重要通道。2003年，淮河入海水道开挖——滨海段成为淮河&quot;入江入海水道&quot;双路入海的北大门。1988年，国务院确定滨海为首批沿海开放县。2024年，中国海油盐城&quot;绿能港&quot;建成——全国最大液化天然气储备基地（总罐容250万立方米）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e黄河故道滨海段：全长84公里——是黄河改道留下的&quot;河床化石&quot;，两岸堤坝至今保存明清夯土层；沿线分布万亩蜜梨园。2. 淮河入海水道滨海段：淮河&quot;第二条出路&quot;——宽400-500米，设计泄洪流量7000立方米/秒；入海口是淡水咸水交汇的生态敏感区。3. 梨花语景区：国家3A级景区——千亩梨园始建于1958年，是盐碱地改良的&quot;生态钥匙&quot;；年产蜜梨6万吨，&quot;滨海大套蜜梨&quot;获国家地理标志。4. 滨海港：国家一类口岸——深水港，-15米等深线距岸仅3.95公里；中国海油绿能港2025年接卸LNG船破百艘。5. 宋公堤旧址：1941年民主政权时期修筑——海防哨所遗存，见证治水壮歌；宋乃德烈士用300万斤粮款修筑防海堤。6. 顾正红故居：五卅运动烈士——1925年在上海码头被外敌枪杀，是上海工人运动的标志性人物。7. 滨海县古城遗址：清代盐运小城——现存城东老巷数条，明清民居建筑尚存20余处。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e滨海的地原来全是盐碱地。1958年，县委书记带着全县人在黄河故道边上种梨树——&quot;盐碱地种庄稼长不出来，种梨树总行吧？&quot;种了三年，梨树种活了一半。又过了二十年，梨树长成了林，盐碱地也被改良了——梨树的根扎得深，能把地下的盐分吸上来，树根周围的土壤慢慢就不碱了。现在滨海有5.4万亩梨树，每年三月梨花堆雪砌玉，秋天蜜梨垂枝，甜得像蜜。我在梨花语景区见过一个七十多岁的梨农，姓刘，他爹就是1958年种梨树的那批人。&quot;我爹说，当年种梨树的时候，手里的锹柄都磨出了槽&quot;，他说，&quot;那时候盐碱地白花花的，连草都不长，种下去的梨树苗一多半都死了。我爹把活下来的每一棵都当宝贝，冬天给它盖草，春天给它浇甜水&quot;。他说着摘了一个梨递给我——&quot;你尝尝，这是我爹当年种的那棵树结的梨，跟六十多年前一样甜&quot;。\u003c/p\u003e"}, {"n": "建湖", "s": "建湖", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉初年，盐渎县立县后首次建城——始名&quot;首城&quo
