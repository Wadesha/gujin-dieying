11）：疏浚会通河——\u003cstrong class=\"hl\"\u003e开河闸建立\u003c/strong\u003e，开河镇成为运河名镇。明正德年间：\u003cstrong class=\"hl\"\u003e《水浒传》成书刊刻\u003c/strong\u003e——宋江寨故事流传。明崇祯十五年（1642）：崇祯帝严禁《水浒传》——\u003cstrong class=\"hl\"\u003e对梁山&quot;勒石山巅，垂为厉禁，清丈其地，归之版籍&quot;\u003c/strong\u003e。清初：黄河夺运——梁山泊逐渐淤为平原。清咸丰五年（1855）：黄河改道——梁山泊旧址成为东平湖平原。1958年：东平湖平原水库建成——梁山泊旧址大部分被淹。现状：宋江寨墙残段、前集村（省级历史文化名村·明清防御式古村）、开河镇（运河历史文化名镇）、大元新开会通河记事碑（县级文保）、前码头村（会通河起点）、水泊梁山风景区（4A）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e梁山主峰虎头峰三面危岩壁立，峰顶两道青石寨墙干砌残存，旗杆窝、宋江井凿在巉岩上；山南麓前集村S形胡同曲折迂回，东南运河边前码头村一通龙头龟座元碑记会通河始开，沿山石步道可一一寻访。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宋江寨寨墙（虎头峰·北宋·石砌寨墙残存）：梁山主峰虎头峰顶，东西南三面危岩壁立，唯峰北临涧一条山道可上。峰顶平坦，两道块石干砌寨墙绕成椭圆形，墙底宽约两米、高约一米半，南临悬崖，东西北三面各两重。青石全凭咬合、不施灰浆，虽成残垣断壁而形状俱在，墙根生满齐膝野草与苍苔。寨中央聚义厅台基旁，一方巨石上凿着碗口大的旗杆窝；西边巉岩间石砌一口深十余米的石井，人称宋江井，泉至今清冽。；前集村（省级历史文化名村·明清防御式古村）：水泊梁山风景区南麓，与水浒前寨仅一涧之隔，S形街、丁字胡同相通而不相对，外敌入村难以长驱直入。刘家大院为明清三进四合院带看家楼，明崇祯间建，青砖灰瓦砖雕精细。；开河镇（运河历史文化名镇·元代置闸）：县城东南运河穿村而过，元代置开河闸开河驿，明清为漕运重镇，乾隆下江南曾停靠。镇上旧称百步一庙，仅关羽庙就有五所，粮行油坊当铺二十余家，荣氏德兴银号纸币曾流通六县。；大元新开会通河记事碑（县级文保·元至元二十六年）：前码头村东北，1996年文物普查发现，龙头龟座，碑文由杨文郁撰文、张孔孙书丹，详载会通河开挖用工用料。会通河元起于梁山码头止于临清。；青堌堆遗址（全国重点文保·龙山文化）：县城西北小安山镇董庄村西约五百米，堌堆高出地表数米，面积约数千平方米，经考古发掘发现龙山文化时期房址、灰坑及大量陶器、石器。2013年公布为第七批全国重点文保单位，为鲁西南龙山文化代表性遗址。；莲台寺及唐代石佛（省级文保·唐代）：梁山雪山峰南麓杏花村内，创建于唐代，现存唐代雕刻四米高束腰莲台石佛像一尊，结跏趺坐于莲台之上，法相庄严，旁有清代重修碑记。唐武则天封禅泰山曾两度至此，明鲁王朱檀亦出资重修。；贾堌堆遗址（省级文保·新石器时代至周）：县城北大路口乡吕那里村，堌堆高出地表数米，面积约数万平方米，地表散落新石器时代至周代陶片、石器。该村为中国传统村落。；黄花寺黄河决口堵复碑（县级文保·清代）：县城西黑虎庙镇吴楼村黄河大堤东侧，石碑记述清咸丰五年铜瓦厢决口后黄河改道、及黄花寺堵复经过。1855年黄河在此改道北徙，与运河交汇。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌前集村刘家大院后人刘大伯（70岁）：\u003cbr\u003e&quot;我家刘家大院是明朝崇祯年间建的——祖上当过梁山忠义堂的义兵总管。\u003cstrong class=\"hl\"\u003e大院有个看家楼，高10米\u003c/strong\u003e，青砖灰瓦，我小时候常爬上楼顶瞭望——能看到山下的开河镇和运河。文革时大队要拆楼炼砖——是我爷爷把族谱和祖训拿出来给大队支书看，支书说&#x27;保下吧，留个念想&#x27;。现在看，那楼是前集村最高的建筑，也是全村的&#x27;风水柱子&#x27;。&quot;\u003cbr\u003e▌开河镇开河闸老船工李老汉（82岁）：\u003cbr\u003e&quot;我爹就是运河上的船工——给漕船拉纤的。我爹说，\u003cstrong class=\"hl\"\u003e乾隆下江南就是在开河闸停靠的\u003c/strong\u003e——乾隆亲笔给开河镇写了&#x27;运河古镇&#x27;的匾，挂在镇公所门头上。文革时被红卫兵砸了——我爹当时在供销社当售货员，偷偷捡了半块写着&#x27;镇&#x27;字的木头藏在床底下。后来木头发霉烂了，他伤心了好几天。现在我家还供着运河老船神的牌位，逢年过节烧香磕头。&quot;\u003cbr\u003e▌前码头村村民老周：\u003cbr\u003e&quot;2002年考古队来挖大元会通河碑——我当时就在旁边帮忙挖土。挖了两天才挖出碑头，龙头造型，雕得特别精细——龙鳞都能看清。\u003cstrong class=\"hl\"\u003e碑身埋在地下两米，只有上部0.6米露在外面\u003c/strong\u003e。碑头和碑身是分开的——当年黄河泛滥时冲的。考古队要拉到县博物馆去展——村民拦着不让，说这碑是我们村的根。最后协商，县博物馆做了个玻璃钢复制品放村里，原碑存博物馆。&quot;\u003c/p\u003e"}, {"n": "阳谷老城·狮子楼·景阳冈·运河三镇", "s": "阳谷", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e1958年重建为二层砖木结构仿清代建筑，1984年按宋代风格设计重建。著名文学家茅盾（沈雁冰）题写匾额。武松庙始建于明代中叶，清代增建、1958年重修、近年重建。景阳冈现为旅游区。隋开皇十六年（596）：\u003cstrong class=\"hl\"\u003e置阳谷县\u003c/strong\u003e——阳谷之名始见，因县境内有阳谷亭得名。唐乾宁二年（895）：朱全忠击郓帅朱瑄，战于梁山——阳谷为古战场。北宋徽宗年间（1100-1126）：\u003cstrong class=\"hl\"\u003e狮子楼始建\u003c/strong\u003e——西门庆为镇邪压惊盖起狮子楼，楼前雕一对红眼石狮子。北宋末/南宋初：\u003cstrong class=\"hl\"\u003e景阳冈武松打虎\u003c/strong\u003e——施耐庵《水浒传》取材于此。明清：大运河阳谷段漕运繁荣——\u003cstrong class=\"hl\"\u003e张秋镇设荆门闸，为漕运枢纽\u003c/strong\u003e；阿城为盐码头（银阿城）；七级为粮码头（金七级）。明中期：\u003cstrong class=\"hl\"\u003e景阳冈武松庙始建\u003c/strong\u003e——《阳谷县志》载&quot;景阳冈&quot;在县城东40里，沙丘起伏，古木参天。清初：\u003cstrong class=\"hl\"\u003e祝家庄改竹口\u003c/strong\u003e——当地人忌说&quot;三打祝家庄&quot;，改称竹口或祝口，独龙冈因黄河改道消失。清末/民国：运河漕运衰落，城墙损毁。1930年代：阳谷城墙基本无存。1958年：狮子楼重建为二层砖木结构仿清代建筑；祝家庄塔（唐尉迟敬德鞭形塔，18层）在文革中被毁。1984年：狮子楼按宋代风格重建。现状：狮子楼（市文保）、景阳冈（省文保·武松庙明中期始建）、文庙（近千年历史）、张秋镇（运河历史文化名镇·荆门闸石砌闸槽燕尾铁扣）、七级镇、阿城镇遗址、紫石街、祝家庄遗址、水浒文化博物馆。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e阳谷老城十字街一座仿宋青砖高楼立在路口，楼前紫石街铺到狮子楼南；城东景阳冈沙冈起伏古木参天，冈上武松庙黑瓦朱门；运河东缘张秋镇石闸条石燕尾铁扣紧箍，阿城、七级盐粮码头旧迹散在河湾。\u003c/p\u003e\u003cp class=\"main-text\"\u003e景阳冈武松庙（省文保·明中期始建）：县城东张秋镇境，一片缓起的黄沙冈，莽草丛生、古木参天，旧有九岭十八堌堆。岗顶正中武松庙三间起脊、单檐带廊，青砖灰瓦朱门红窗，一九五八年重修；庙前立舒同题景阳冈碑。庙东二三百米处，一通墨玉色石碑刻武松打虎处行书五大字，经考证为北宋末南宋初所立，是打虎故事最早的实物见证。岗上古柏林立国槐森然，一九七三年以来省考古队屡在此试掘，证其下为龙山文化遗址。；张秋镇荆门闸（运河石砌闸·世界文化遗产点）：张秋镇上闸村、下闸村，元代石砌节制闸，条石间以燕尾槽铁扣紧箍，每块石条凿燕尾凹槽嵌入铁扣极为牢固。明清张秋号称小苏州，有九门九关厢七十二街，为运河五大商埠之一。；紫石街（宋式商业步行街）：狮子楼南，路面全部用紫石铺砌，两侧飞檐翘角宋式商铺茶馆酒肆，街心五组水浒故事雕塑，武大郎家、王婆茶馆等水浒场景在此复原，与狮子楼、文庙连成宋式街区。；七级运河古码头（省文保·清乾隆十年重修）：七级镇西街中桥北侧，由石砌台阶慢道、顶部平台、台阶下夯土平台三部分组成，总高约四米，中部石阶十七级、南北宽约五米，2011年南水北调工程中考掘出土，《重修渡口石磴碑记》碑尚在，旧传乾隆过此走七级石阶改毛镇为七级。；阿城上闸、下闸与阿城盐运司（世界文化遗产点·元明清）：阿城镇阿西村、刘楼村及海会寺村，三闸均为元代石砌节制闸，闸墙青石条石保存完整，下闸偏远，闸体神兽雕刻尚在；盐运司正殿台明仍存，清乾隆十三年山西盐商捐资所建，旧有十三家盐园子，俗称银阿城。；海会寺（省文保·清）：阿城镇南街，清康熙年间始建，乾隆、光绪两次扩建，沿中轴线依次山门、天王殿、千佛殿、大雄宝殿三进院落，两侧钟鼓楼对峙，原殿宇一百六十八间现存八十一间，大雄宝殿面阔五间进深三间，殿前立康熙手书石碑二通，旧为华北五大寺院之一。；阳谷文庙大成殿（省文保·明清）：县城紫石街北侧、景阳冈酒厂院内，明成化十六年知县刘洪重建大成殿五间，歇山顶覆筒瓦飞檐斗拱，殿外墙北东西三面青砖、南面木构，内立十四根楠松木金柱，原东西配殿、棂星门、泮池仅存基址，今存大成殿五间、东配殿四间。；蚩尤冢遗址（省文保·大汶口龙山）：十五里园镇皇姑冢村东，俗称皇姑冢，封土高约五米、占地约八千五百平方米，冢上遍生荆棘，1992年公布为省级文保，2009年经专家考证定名为蚩尤首级冢，今立蚩尤陵牌坊、神道、塑像一组。；博济桥（省文保·明）：县城中心广场，明代石砌拱桥，桥身青石条石干砌，栏板望柱浮雕人物故事，桥券额刻博济桥三字，旧为阳谷通往东阿官道上要冲。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e狮子楼（市文保·北宋始建·茅盾题匾）：老城十字街西南角，始建于北宋景祐三年，原楼已毁，今为园林专家陈从周设计仿宋重建，二层五开间三进深，青砖灰瓦飞檐斗拱，楼前列石狮两对，茅盾、刘海粟题匾。《水浒》载武松在此斗杀西门庆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌阳谷县志办退休干部刘主任：\u003cbr\u003e&quot;我研究水浒在阳谷的故事40年——\u003cstrong class=\"hl\"\u003e景阳冈现在成了一片缓起的沙冈，古木还剩一些国槐\u003c/strong\u003e。原来的9岭18堌堆，因为黄河改道，有的被冲平了，有的被淤了。\u003cstrong class=\"hl\"\u003e武松打虎处那块碑，我1968年还亲眼见过它立在景阳冈上\u003c/strong\u003e——文革时被红卫兵推倒，碑角砸裂了一道。后来我偷偷用布包好埋在自家后院，1980年才交给县文保所。现在那块碑就在景阳冈旅游区里，还能看到那道裂纹。&quot;\u003cbr\u003e▌张秋镇老船工王老汉（80岁）：\u003cbr\u003e&quot;我爹是运河上的老船工——给漕船拉纤的。我1960年代也拉过——那时候运河水还深，能跑大木船。\u003cstrong class=\"hl\"\u003e荆门闸的条石，我年轻时常摸\u003c/strong\u003e——每块上面都有燕尾槽铁扣，紧紧箍着，600年没松过。我爹说，造闸的工匠是从苏州请来的，凿一块条石要10个壮劳力干一天。现在闸还在——只是运河水浅了，不能走大船了。&quot;\u003cbr\u003e▌祝口村村民老乔（65岁）：\u003cbr\u003e&quot;我们村原来叫独龙冈——就是水浒里的祝家庄。\u003cstrong class=\"hl\"\u003e村民都忌说&#x27;三打祝家庄&#x27;\u003c/strong\u003e——所以改叫祝口、竹口。祝家庄塔是唐朝尉迟敬德修的，18层8角，每层有钢铃——我小时候还上过塔，塔心是木梯子，蹬着嘎吱嘎吱响。\u003cstrong class=\"hl\"\u003e文革时塔被拆了造窑\u003c/strong\u003e——我亲眼见的，炸药炸响后，塔身倾斜了好几天才倒。现在只剩塔基，上面长了棵老槐树。&quot;\u003c/p\u003e"}, {"n": "东明老城·庄子故里·黄河三迁", "s": "东明", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉建元元年（前140）：\u003cstrong class=\"hl\"\u003e置东昏县\u003c/strong\u003e——秦始皇东游至此忽昏雾四塞，因名&quot;东昏&quot;，治所在今河南兰考境。新莽建国元年（9）：改名东明——\u003cstrong class=\"hl\"\u003e东明之名首次出现\u003c/strong\u003e。东汉：复为东昏县。曹魏：废为镇。宋乾德元年（963）：\u003cstrong class=\"hl\"\u003e复置东明县\u003c/strong\u003e——治东昏镇（今河南兰考），属开封府。金兴定二年（1218）：\u003cstrong class=\"hl\"\u003e避黄河水患迁治\u003c/strong\u003e——从东昏镇迁至冤句县故地（今东明集镇），设四门（朝阳/迎爽/户牖/东昏）。明洪武初：黄河再犯，徙治云台集——旋被淹没，县治又废。明弘治三年（1490）：\u003cstrong class=\"hl\"\u003e仍以故地设县\u003c/strong\u003e——县城设在大单集（即今东明县城），\u003cstrong class=\"hl\"\u003e至今已536年未动\u003c/strong\u003e。建城墙七里四十步，高二丈五尺，护城河深一丈五尺、宽六丈。明天启四年（1624）：《徐州志》载东明城墙周长7里40步，高2.5丈，四门：东&quot;东作&quot;、南&quot;南讹&quot;、西&quot;西成&quot;、北&quot;迎恩&quot;。民国时期：城墙遭战乱破坏。1946-1948年：东明城曾四次易手，城垣渐破。1958年：拆城墙建炼油厂——墙砖被大量拆走。文革：文庙棂星门被毁。现状：仅存护城河遗址、庄子故里（庄寨村·省级文保）、东明县衙大堂（文革后重建）、护城河西段落水段已修复。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东明老城坐落在黄河南岸大堤旁，明弘治三年筑的西护城河环着旧城，河水清浅石栏夹岸；城北菜园集镇庄寨村北南华观后一垄封土隆起，灵泉井泉眼仍在，清乾隆免差徭碑立在观侧。\u003c/p\u003e\u003cp class=\"main-text\"\u003e庄子故里（省文保·庄寨村北）：县城北菜园集镇庄寨村北，北依黄河大堤、南望古濮水。南华观唐贞观二年始建，今为一九八八年鲁豫庄姓后裔捐资重建，门楼一间、大殿三楹，殿门悬生于蒙城地、逍遥漆园区一联。观后二十步即庄子墓，封土以青砖护圈、高约五米。观东五十步有灵泉井，井旁原刻灵泉二字石碑，一九五八年碎作石灰、仅存碑座；院中立清乾隆五十五年大名府正堂所立先贤庄子例应优免差徭碑。庄寨村庄氏后裔守墓至今，二月祭生、八月祭死。；东明护城河水系（明弘治三年筑）：明弘治三年筑县城时开凿护城河，西护城河近年修复，河水清澈，两岸石砌护栏仿石雕制，灰瓦白墙仿古亭台点缀，为市民休憩之所。；东明文庙大成殿（省级文保·明弘治十一年始建）：县城东大街城关中学院内，现仅存大成殿一座，砖木结构硬山式建筑，殿顶覆红绿色琉璃瓦，面阔五间进深三间，殿内塑孔子坐像，两旁陈列石碑。始建于明弘治十一年，清光绪十年重修，历经明清水患兵燹仅存此殿。；前营泰山行宫（省级文保·明永乐元年始建）：县城东南渔沃街道前营村东南角，南北长五十二米、东西宽二十四米，现有殿门、东西廊坊、前大殿、后大殿，砖木结构硬山式，殿顶着黄绿色琉璃瓦，院内古碑十通。始建于明永乐元年，清乾隆十二年重修，原供碧霞元君。；西葛岗节孝牌坊（省级文保·清乾隆四十二年）：东明集镇西葛岗村东，全石结构，高三点五米、宽二点五米，题联青年矢志、白首完贞，横批旌表节孝儒人杨元贡之妻张氏。清乾隆四十二年为杨元贡之妻张氏建，1996年从地下挖掘出土重立原址。；五霸岗会盟碑刻：县城东南三十里五霸岗村内，现存三通石碑：葵丘断碑一块、明万历年间五霸会盟断碑一块、宋代开封知府邓光绪题碑一块，碑文依稀可见。此处传为齐桓公葵丘会盟故地，古东明十二景五霸盟坛所在。；窦堌堆遗址（省级文保·龙山至汉代）：县城西南陆圈镇杨楼行政村东北八百米，南北长约二百八十米、东西宽约二百七十五米，面积七万六千八百平方米，堌堆高出地表数米，地表散落石器、陶片。为新石器时代龙山文化至汉代遗存，1992年公布为省级文保。；高村合拢处石碑（市级文保·清光绪六年）：县城西北七点五公里高村西头黄河大堤东侧，碑高一米七、宽八十厘米，碑文石刻高村合拢处。清光绪六年九月高村大堤决口，经数月堵复而立此碑，记黄河治患史实。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东明县衙大堂（明弘治三年始建·文革后重建）：明弘治三年创建，三进院落，大堂面阔五间进深三间青砖灰瓦硬山顶，文革中大堂被拆，八十年代按明式重建。堂内尚存清康熙年间石碑，记知县杨日升重修县衙经过。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌庄寨村庄姓后人庄大伯（70岁）：\u003cbr\u003e&quot;全村320户，姓庄的占98%——族谱上明确写着&#x27;先秦思想家庄周后裔&#x27;。\u003cstrong class=\"hl\"\u003e每年清明，海内外庄氏后人组团来祭祖\u003c/strong\u003e——从台湾、香港、新加坡来的都有，每次一两百人。我爷爷说文革时红卫兵要砸庄子观——是全村人把观里的庄子像藏在红薯窖里，把碑埋在村西头的老槐树下。80年代重修观时，我们把碑挖出来——上面还沾着红薯窖里的泥。现在那碑就在庄子观的院子里，立得端端正正。&quot;\u003cbr\u003e▌西护城河改造亲历者王工程师（55岁）：\u003cbr\u003e&quot;我80年代刚参加工作时，西护城河是个臭水沟——菜叶子、鸡下水、塑料袋全在里面漂，夏天不敢开窗。2020年县里决定修复——\u003cstrong class=\"hl\"\u003e花了整整800天，清淤、砌石、铺底、种荷花\u003c/strong\u003e。现在能看到鱼了——上次我还看见有人在河边钓上一条半斤重的鲫鱼。我现在每天晚饭后都去河边散步——想起当年的臭水沟，简直像换了一个世界。&quot;\u003cbr\u003e▌东明老街坊刘奶奶（76岁）：\u003cbr\u003e&quot;1958年大炼钢铁拆城墙——我父亲是生产队队长，带着人去拉墙砖。\u003cstrong class=\"hl\"\u003e我记得那砖比现在的重多了，一块要两个壮劳力抬\u003c/strong\u003e。拉了一个月，我家后院堆了半墙——后来盖猪圈用了。现在我家猪圈上还嵌着三块带&#x27;弘治三年造&#x27;戳记的砖——我儿子说那是文物，让我别拆。我哪能拆啊——那是我爹当年拉的，上面有他的汗水。&quot;\u003c/p\u003e"}, {"n": "鄄城老城·尧陵·孙膑故里·曹植陈台", "s": "鄄城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e尧葬榖林的记载始见于秦代《吕氏春秋·安死》：&quot;尧葬于榖林，通树之。&quot;——\u003cstrong class=\"hl\"\u003e榖林就是榖林庄村\u003c/strong\u003e。明代帝王陵布局：陵区绕陵墙、享殿三间、东西朝房、更衣亭；清光绪二十九年（1903）濮州知州谬润绂书\u003cstrong class=\"hl\"\u003e&quot;帝尧陶唐氏墓&quot;碑\u003c/strong\u003e，现仍立于墓前。尧葬榖林（据《吕氏春秋·安死》）：\u003cstrong class=\"hl\"\u003e尧葬于榖林，通树之\u003c/strong\u003e——鄄城富春乡榖林庄村南，龙山文化遗址14万平方米。西周：鄄属卫。春秋：鄄城是齐国鄄邑——齐桓公&quot;九合诸侯&quot;之一。战国：孙膑故里——红船镇孙老家村，1990年出土明嘉靖重修亿城寺墓碑&quot;膑墓址深邃&quot;。汉宣帝本始二年（前72）：始祭尧陵于鄄城。东汉元和二年（85）：\u003cstrong class=\"hl\"\u003e帝使祀尧于成阳\u003c/strong\u003e（鄄城旧名）。三国魏黄初二年（221）：\u003cstrong class=\"hl\"\u003e曹植封鄄城侯\u003c/strong\u003e——次年改封鄄城王。黄初四年（223）写《赠白马王彪》。黄初三年（222）：曹植徙封为陈王——鄄城\u003cstrong class=\"hl\"\u003e仅居住二年\u003c/strong\u003e，留下陈台、故城等遗迹。明万历四十八年（1620）：\u003cstrong class=\"hl\"\u003e鄄城立&quot;亘古清泉&quot;碑\u003c/strong\u003e——南大街水井立碑，捐资修井者百余人姓名刻碑。清乾隆元年（1736）：\u003cstrong class=\"hl\"\u003e山东巡抚岳浚定榖林为尧陵旧址\u003c/strong\u003e——自此官方祭尧陵于鄄城。1946年：鄄城易主——城垣遭破坏。1947年：刘邓大军强渡黄河——鄄城为渡河点之一。文革：尧陵享殿、孙膑祠等遭破坏。现状：尧陵（省文保·封土直径35米高9米）、孙膑故里（孙老家村·孙氏祠堂）、陈台遗址（杏花岗村·已夷为平地）、亘古泉（仍存·水清澈）、庄子钓鱼台（全国十大钓鱼台之一）、羊左全交墓（义士羊角哀左伯桃合葬墓）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e鄄城地处鲁西南黄河南岸，富春乡榖林庄村南一垄尧陵封土遍生榖树，神道上榖林云日石坊近年修复重立；红船镇孙老家村北向阳河东岸孙膑墓石碑新立；老城南大街一口大井旁亘古清泉明碑卧着，旧城镇曹植读书台已淤为平地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e尧陵（省文保·榖林庄村南）：富春乡榖林庄村南，一垄封土高约九米、径约五十米，遍生榖树葱郁遮护，陵区压在十四万平方米龙山文化遗址之上，文化层厚达十米。神道上榖林云日石坊为四柱三间门式青石坊，正间额枋榖林云日四字传为乾隆御笔，柱顶朝天吼神兽昂首向天；该坊构件二〇一二年从陵区地下掘出百余件，二〇一九年清洗拼对、吊装重立。陵前另存明嘉靖完陵祭文碑与清光绪帝尧陶唐氏墓碑，青石方首，字迹尚在。；亘古清泉（县重点文保·明万历立碑·千年古井）：老城区南大街中段路西，一口大水井，井口后因临路过近，以水泥板覆盖、仅留直径半米圆口，至今仍汲水。井边立明万历四十八年石碑一通，上书亘古清泉四个斗方大字，碑阴刻捐资修井者百余人姓名——为水井立碑本就稀有，冠以亘古更属罕见。井水清冽甘醇，烧而不结垢，老鄄城人至今取饮。；陈台遗址（曹植鄄城读书台·旧城镇）：旧城镇东北，曹植魏黄初二年封鄄城侯、次年改王，在此台读书赋诗，《赠白马王彪》《洛神赋》写于此时。原台有十数级台阶、台上读书厅藏书室，清代犹存台基数尺，因黄河决口渐被淤没，今已夷为平地，村民仍能指认遗址四至。；苏述御史牌坊（省文保·明天启）：什集镇北王召村南北大街中段，全石四柱三间，宽约九米、高约十米，须弥座基座，坊顶两面刻圣旨匾，横额书山西巡抚浙江监察御史进士苏述，柱面刻对联，2003年自黄河淤积十五米深地下出土，2004年吊装复位，为山东现存五座明代牌坊之一。；刘忠墓（刘林，省文保·明弘治）：彭楼镇香店村北，明都察院右副都御史刘忠及其家族墓地，俗称刘林，总面积七十二亩、墓区十三亩，现存硬山顶山门一座，神道两侧碑刻二十四通、石兽两对，其中奉天敕命碑、奉天诰命碑尚立，1984年公布县保、2013年升省保。；历山古遗址（省文保·龙山商周汉）：阎什镇历山庙村西，南临东西村街、西靠新建舜庙建筑群，遗址东西四十五米、南北七十七米，文化层厚，地表可采集夹砂红陶灰陶片、人骨、蚌片、烧土块，《史记》载舜耕历山渔雷泽即此，1980年文物普查发现。；羊角哀左伯桃合葬墓（省文保·清嘉庆立表）：旧城镇李胡同村，二冢并封于田野，冢前清嘉庆十四年范县古义士左伯桃表墓碑一通，碑体今加玻璃罩保护，碑文清晰可辨，传春秋羊角哀左伯桃舍命全交处，1979年县保、2015年升省保。；北王召苏氏家祠（省文保·明清）：什集镇北王召村，与苏述御史牌坊同村，祠堂三进院落，正殿硬山砖木，院内存明清苏氏世系碑、司马桥碑数通，苏氏一族自明万历以来世居于此。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孙膑故里（孙老家村·孙氏祠堂）：东北红船镇孙老家村，全村大多姓孙，族谱记为孙膑后裔。孙氏祠堂明建文革拆，1992年族人捐资重建。1990年村北向阳河东岸出土明嘉靖三十七年重修亿城寺碑刻膑墓址深邃，族人重修坟茔，墓前树篆书孙膑墓碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孙老家村支书孙书记（62岁）：\u003cbr\u003e&quot;我们村320户，290户姓孙——族谱上第一行写着&#x27;始祖孙膑&#x27;。\u003cstrong class=\"hl\"\u003e文革时红卫兵要砸祠堂里的孙膑像\u003c/strong\u003e——我爷爷是老支书，他说&#x27;砸就砸吧，但这族谱是我们的命根子，得藏好&#x27;。他把族谱藏在大队部的档案柜最底层，上面盖了一本《毛泽东选集》——硬是没被发现。现在那本族谱还在，线装手抄本，纸都黄了，但字迹清清楚楚。\u003cstrong class=\"hl\"\u003e2008年孙膑兵法国际研讨会就在我们村开的\u003c/strong\u003e——来了十几个国家的专家，看了族谱都竖大拇指。&quot;\u003cbr\u003e▌尧陵守陵员王老汉（80岁）：\u003cbr\u003e&quot;我守尧陵50年了——从我爹手上接过来的，他守了40年。\u003cstrong class=\"hl\"\u003e文革时尧陵的享殿被拆了\u003c/strong\u003e——红卫兵要挖尧帝的墓，挖了两米就停了——说&#x27;这是龙山文化遗址，不能再挖了&#x27;。我爹当时就守在陵前的大槐树下——那棵树现在还在，比我刚来看的时候又粗了一圈。清明前后，海内外姓尧的、姓唐的后人都来祭祖——每年至少五六十人，从台湾来的也有。&quot;\u003cbr\u003e▌亘古泉井边的老郑（75岁）：\u003cbr\u003e&quot;我喝亘古泉的水喝了60年——这水跟城里自来水完全不一样，\u003cstrong class=\"hl\"\u003e甜，烧开水不结水垢\u003c/strong\u003e。有人说这井通地下河，连黄河水都能抽上来——当然我不信，但水确实好。文革时有人想填井盖房子——全村老头老婆围在井边不让填，说&#x27;这是曹操挖的、曹植喝过的，你们敢填试试&#x27;。后来生产队把井上盖了个水泥板，留了个圆口——就一直用到现在。&quot;\u003c/p\u003e"}, {"n": "成武老城·伯乐故里·郜国水下古城", "s": "成武", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e周初：\u003cstrong class=\"hl\"\u003e周武王封弟弟于郜国\u003c/strong\u003e——西周首批姬姓诸侯国之一，地位尊崇。春秋战国：郜国沦为大国附庸。鲁隐公十年（前713）鲁齐郑伐宋&quot;取郜&quot;。秦：置成武县——秦属东郡，汉属梁国后属山阳郡。北齐：升为永昌郡。唐贞观十七年（643）：\u003cstrong class=\"hl\"\u003e首次归属曹州\u003c/strong\u003e。五代至金：属单州。元：复归曹州。明：属兖州。清：属曹州府。明嘉靖年间：\u003cstrong class=\"hl\"\u003e护城大堤越筑越高\u003c/strong\u003e——堤内地面因洪水淤积低于堤外2.5-3米。古城逐渐成为凹陷洼地，最终蓄水成湖——\u003cstrong class=\"hl\"\u003e郜国故城深埋文亭湖底\u003c/strong\u003e。1986年：\u003cstrong class=\"hl\"\u003e成武百姓挖鱼塘时发现湖底古城\u003c/strong\u003e——考古队勘探认定为周代郜国故城址。1992年：成武故城址（郜国古城）列为\u003cstrong class=\"hl\"\u003e山东省第二批重点文保\u003c/strong\u003e——东西宽3525米、南北长1800米、总面积632.5万平方米。现状：\u003cstrong class=\"hl\"\u003e郜国故城深埋文亭湖底\u003c/strong\u003e（需水下考古），护城大堤存，文亭山（堌堆）存，大台遗址（省文保·高8米），卧化塔（国保·唐塔），伯乐墓（市文保），成武县衙遗址（市文保·古城街西段）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e成武老城被文亭湖碧水环抱，湖心一座堌堆土山四面环水，山上苍松会文亭翼然；湖南岸护城大堤夯窝与曲阜鲁故城一致，三千年前郜国都城深埋湖底；大田集镇田塔村东一座青石斜塔干垒千年，伯乐集镇伯乐村伯乐墓石碑立在田间。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郜国故城（省文保·文亭湖底）：成武县城西北文亭湖底，1986年开挖鱼塘时发现，考古认定为周代郜国都城。因黄河泥沙几度来袭，城内成洼地蓄水成湖，南堤土壤剖面可追溯春秋，城堤夯窝与曲阜鲁故城基本一致。今未全面发掘，文亭湖成城市景观公园，湖底埋着三千年前姬姓古国都城。；文亭山（堌堆文化遗址·市保）：文亭湖北岸人工高地，典型鲁西南堌堆遗址，四千年前先民为避水夯土择高而居。山上苍松翠柏，旧建会文亭，孔子弟子曾参与三冉在此以文会友。汉高祖过此有祥云，又名云亭山，云山夕照为成武八景。；伯乐墓（市文保·春秋相马师孙阳）：县城西伯乐集镇伯乐村，村因伯乐得名，村中有伯乐祠墓石碑。唐韩愈《马说》咏伯乐相马，2019年县城西北建伯乐相马雕塑，伯乐握缰骏马昂首嘶鸣。；大台遗址（省文保·新石器至汉）：县城东关外护城堤内，旧称寿峰、东台，堌堆土台高约九米，南北长八十五米、东西宽七十七米，占地六千五百平方米，文化堆积厚八至九米，自上而下龙山、商周、东周、唐四层叠压，为鲁西南典型堌堆遗址。；刘氏节孝坊（省文保·清乾隆六十年）：白浮图镇徐官庄村隅首，全石仿木结构，歇山顶，四柱三门三楼式，底长九米、高约九米半、进深两米半，中门宽三米。四柱下各有两抱柱加固，抱柱上圆雕雄狮一对；中门三道横梁透雕缠枝，横梁间嵌敕褒节孝与旌表邑处士徐格妻刘氏节孝坊两匾，坊檐两面悬圣旨石匾。坊柱刻对联灵感一时来白鹤、忠魂千载著乌头。文革中坊顶龙吻被砸、最上一道横梁拉断，楼身主体与柱下石狮尚存。；成武文庙棂星门（明成化二年改石）：县城古城街中部路北，四柱三门式石质牌楼，中间横梁双钩雕法刻棂星门三字，两侧立柱正面刻配天地而为三千古一圣并君亲而为五万世一师对联，明成化二年知县王达以木易石，为文庙建筑群唯一地面遗存。；记河寺遗址（省文保·龙山）：汶上镇，龙山文化聚落遗址，地表采集夹砂灰陶片、方格纹绳纹陶片，遗址旁立明清重修记河寺残碑三通、古井一口，2013年公布为山东省第四批省保。；九女墓与九女庙碑（明万历碑）：九女集镇，庙内存明万历二十四年立汉贞孝金氏九女故里碑一通，并有崇祯十二年、清乾隆五十二年、嘉庆五年、道光二十三年重修记名碑多通及记名柱础一对，墓在庙南数百米田野中。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卧化塔（国保·唐初建）：大田集镇田塔村东，正四棱锥形，通体青石层层干垒，不施灰浆黏合，仅在石缝不平处垫石片稳固，全靠石块精密咬合屹立千年。原七层，今地面残存五层、高仅五米余，底边南北五米半、东西五米，基座及最下一层约两米仍埋在黄河泥沙里。每层檐下剔出石质斗拱，底层南向开塔室，东西两壁各嵌一块造像石；塔顶两层二十世纪六十年代被毁。塔在田埂边与庄稼为伴，为鲁西南现存最早地面建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文亭湖公园退休工人王师傅（68岁）：\u003cbr\u003e&quot;我在文亭湖边住了40年——小时候还能在湖里摸鱼。\u003cstrong class=\"hl\"\u003e1986年那个夏天，村里挖鱼塘的在湖中间挖出了城墙砖\u003c/strong\u003e——消息传开，整个成武都轰动了。县文保所的人来了，说这是郜国古城——埋在湖底下三千年了！我当时还去看了——那砖比现在的沉多了，刻着绳纹。后来鱼塘不让挖了，湖底用水泥封住了。现在我每天在湖边钓鱼——谁能想到我脚下2米深就是周天子弟弟的都城呢？&quot;\u003cbr\u003e▌卧化塔看护人李老汉（72岁）：\u003cbr\u003e&quot;我守卧化塔30年了——这个塔怪，往西北歪，\u003cstrong class=\"hl\"\u003e像个驼背老人\u003c/strong\u003e。传说唐代建塔时，工匠听了个白胡子老头的话，故意让塔歪着——说&#x27;卧者化也，卧化塔卧着才能化&#x27;。文革时红卫兵要拆塔身的佛龛——爬上去砸了六个佛头，正砸第七个时，塔顶掉下来一块砖砸了脚——后来就没人敢再动了。2019年国务院批了国保——现在塔周围立了铁栏杆，游客不能再摸塔身了。&quot;\u003cbr\u003e▌成武博物馆郭馆长：\u003cbr\u003e&quot;我们一直在等水下考古——郜国故城是成武最大的宝贝。\u003cstrong class=\"hl\"\u003e1986年发现后做了试掘\u003c/strong\u003e——探沟里挖出了春秋时期的陶鬲、陶豆残片，还有战国时期的铜箭头。但湖底水位一直很高，试掘到1.5米就停了。等技术条件成熟了，我们要让这个沉在湖底三千年的姬姓古国重见天日——\u003cstrong class=\"hl\"\u003e632.5万平方米，比河南安阳殷墟还大\u003c/strong\u003e，如果能发掘出来，那是西周考古的重大发现。&quot;\u003c/p\u003e"}, {"n": "德州老城·运河九达天衢·苏禄王墓", "s": "德州", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e明洪武九年（1376）：设德州卫——5600名卫军，单独户籍&quot;军户&quot;。明洪武三十年（1397）：\u003cstrong class=\"hl\"\u003e德州卫筑砖城\u003c/strong\u003e——都督张文杰、指挥徐福历时两年。砖来自城南20里运河沿岸村——\u003cstrong class=\"hl\"\u003e窑上村、伙房村即此得名\u003c/strong\u003e。明永乐五年（1407）：增设德州左卫——两卫以建设街为线分治。明永乐九年（1411）：\u003cstrong class=\"hl\"\u003e知州何原移德州治于卫城内\u003c/strong\u003e——州卫同城而治。明永乐十五年（1417）：\u003cstrong class=\"hl\"\u003e苏禄东王病逝德州\u003c/strong\u003e——明成祖以王礼厚葬，墓地在北营村。明万历四十年（1612）：知州孙森大修州城——新筑门楼、谯楼、瓮各四座。清乾隆八年（1743）：\u003cstrong class=\"hl\"\u003e发帑金14万两重建州城\u003c/strong\u003e——历史三年，新筑门楼、谯楼、敌楼。城内有寺庙、庵、祠、坛、驿等70余处，官署衙门72处。1946年：\u003cstrong class=\"hl\"\u003e德州易主后取城墙土筑运河河堤和道路\u003c/strong\u003e。1947年：\u003cstrong class=\"hl\"\u003e小西门广川门因战乱损毁，提前拆除\u003c/strong\u003e。1949年春：\u003cstrong class=\"hl\"\u003e扒掉部分城墙保障过境军队南下过境\u003c/strong\u003e。1950年：\u003cstrong class=\"hl\"\u003e大西门聚秀门拆除\u003c/strong\u003e。1951年：\u003cstrong class=\"hl\"\u003e南门朝阳门（含瓮城关帝庙建筑群）拆除\u003c/strong\u003e。1958年：\u003cstrong class=\"hl\"\u003e德州城东南角建提名塔（雁塔）拆除，东门长乐门拆除\u003c/strong\u003e。1959年底：\u003cstrong class=\"hl\"\u003e城墙和护城河大部拔除，部分护城河道成为市区景点\u003c/strong\u003e。1961年：\u003cstrong class=\"hl\"\u003e北门拱极门城楼和门洞拆除\u003c/strong\u003e。1964年：\u003cstrong class=\"hl\"\u003e城墙整体基本消失——仅城西北&quot;靴子尖&quot;小段土垣遗迹、新湖街道段城墙遗址残存\u003c/strong\u003e。现状：\u003cstrong class=\"hl\"\u003e苏禄王墓（国保·全国唯一外国国王陵寝）、北厂漕仓遗址（省文保）、窑上窑址（省文保）、运河残段、德州城墙遗址（省文保·新湖街道段100余米）、九达天衢坊（仿建）、董子读书台（仿建）\u003c/strong\u003e。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e德州老城沿运河铺开，明洪武砖城形似靴，今唯城北北营村苏禄王墓陵园建筑群保存完整，墓道向南御碑亭牌坊甬道石象生列开；城西北北厂村地面散落仓基砖柱础石，窑上村田野间明代城砖戳记犹可指认。\u003c/p\u003e\u003cp class=\"main-text\"\u003e苏禄王墓（国保·明永乐十五年·北营村守墓后裔）：城北北营村，明永乐十五年苏禄国东王巴都葛叭哈剌率三百四十余人跨海来朝，归国途中病逝德州，永乐以王礼厚葬。穿过牌坊是七十余米长神道，两侧对称列石望柱、石狮、石虎、石马、石羊及文臣武将石像生，石人脸圆，带明代石雕特有的朴拙。神道南段东侧御碑亭立永乐十六年朱棣亲撰御制苏禄国东王碑，螭首龟趺；神道尽头为祾恩殿。永乐命温哈剌、安都鲁二子留居守墓，后裔至今聚北营村，清雍正间入籍为温、安二姓，为唯一带守陵村落的异邦王陵。；北厂漕仓遗址（省文保·金元明清）：城西北北厂村，金天会七年置将陵仓，元明清扩建为运河四大粮仓之一，南粮北运至此中转，漕船可直接靠岸。现地面散落仓基砖柱础石，考古曾挖出金元陶质粮仓模型。；竹竿巷（明清竹器加工基地）：城西运河东岸，明万历御河西迁后立大小竹竿巷，江南漕船运竹木沿运河发卖，巷内清末民初竹器作坊四十余家。今巷内尚存清末老院落，青砖灰瓦木窗棂间商号招牌痕迹依稀。；窑上窑址（省文保·明代城砖窑场）：城南黄河涯镇窑上村，明洪武三十年筑德州城时烧砖窑场，现地面散落大量明代城砖，砖上有洪武三十年造戳记，考古清理出马蹄形窑炉遗迹，炉膛内烧剩煤渣犹存。；四女寺水利枢纽（国保·世界文化遗产·1957年）：德城区、武城县、河北故城县两省三县交界四女寺村北卫运河上，1957年在原明清四女寺滚水坝基址上建成，含南进洪闸、北进洪闸、节制闸三部分，闸体高大青砖衬砌，有北方都江堰之称，与南运河德州段同列入世界文化遗产。；德州码头（国保·世界文化遗产·明清）：德城区南运河东岸，明清漕运大码头，旧称上码头、老龙头，为明清德州四大摆渡口之一，乾隆六下江南均在此弃舟登陆，今石砌驳岸与栓船铁环尚存，与南运河德州段、四女寺枢纽同列大运河世界遗产点。；南运河德州段三弯抵一闸（国保·世界文化遗产）：自四女寺枢纽北流至第三店村入河北，全长四十五公里，河道保留原生人工弯道，素有九曲十八弯、三弯抵一闸之称，两岸条石护坡、老杨柳成行，是山东境内保存古运河原生风貌最完整的河段。；御制苏禄国东王碑（明永乐十六年·成祖亲撰）：苏禄王墓陵园东南御碑亭内，通高二点五米、宽一点一米，碑首螭首、下负龟趺，额题御制苏禄国东王碑，碑文为明成祖朱棣亲撰，赞东王慕义而来诚贯金石，为陵园内最珍贵的明代原物。；哨马营减河遗址（清·市文保）：德城区北哨马营村，清雍正九年为分泄运河水势开挖减河，旧有闸坝、神庙、演武厅，今河床故道与闸基条石尚存，与北厂漕仓、窑上窑址连成德州运河遗产线。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏禄王墓守墓人王老爷子（78岁）：\u003cbr\u003e&quot;我是温哈剌的后裔——传了22代了。我家就在苏禄王墓旁边住，\u003cstrong class=\"hl\"\u003e每天早上去扫墓\u003c/strong\u003e，50年没断过。文革时红卫兵要挖苏禄王的墓——说&#x27;这是帝国主义走狗的墓&#x27;。我当时20多岁，和全村18个青年守在墓门前，\u003cstrong class=\"hl\"\u003e手拉手围成一圈\u003c/strong\u003e。红卫兵骂我们是&#x27;海外走狗后代&#x27;，但就是没动手——后来据说上头有人打电话说&#x27;苏禄王是国际友人，不能挖&#x27;，就不了了之。现在菲律宾每年都有王室后人来祭祖——2019年来了一个公主，跪在墓前哭了半小时。&quot;\u003cbr\u003e▌竹竿巷老竹匠张师傅（65岁）：\u003cbr\u003e&quot;我爹是竹竿巷最后一代竹匠——70年代公私合营进了竹器厂。我80年代初还学了两年——\u003cstrong class=\"hl\"\u003e那时候一把竹丝刀要磨3天\u003c/strong\u003e，削出来的竹丝细如头发。后来竹器厂倒了，没人买竹筐了——现在全巷只剩我一家还做竹器，\u003cstrong class=\"hl\"\u003e主要给景区做些摆设品\u003c/strong\u003e。前几年有个大学生来拍纪录片——说德州竹竿巷比苏州的还早100年，我说你别吹了——我爹说光复前巷里有400多家，现在就剩我1家。&quot;\u003cbr\u003e▌北厂村老船工李老汉（82岁）：\u003cbr\u003e&quot;我爹是漕船上的老船夫——给北厂漕仓卸粮的。我1958年也当过运河上的船工——那时候运河水还能跑大木船。\u003cstrong class=\"hl\"\u003e北厂漕仓有36个粮仓\u003c/strong\u003e——每个仓能装50万斤粮食。我爹说，\u003cstrong class=\"hl\"\u003e清代道光年间有一次漕船排了5里长\u003c/strong\u003e——南方来的粮船、北京来的官船、德州的商船，挤得运河水都不动了。现在漕仓成了省文保——我去年还进去看了一眼，仓底还能看到当年的木桩槽。&quot;\u003c/p\u003e"}, {"n": "武城老城·运河三迁·古贝州", "s": "武城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国：东武城（赵国平原君赵胜封地）——&quot;筑城备武&quot;，是赵齐交界要塞重镇。秦始皇统一：设武城县——西汉高帝四年（203）置清河郡，东武城属之。唐调露元年（679）：\u003cstrong class=\"hl\"\u003e县城迁至今河北故城关庙村\u003c/strong\u003e——紧挨着永济渠西岸，热闹码头。宋大观二年（1108）：\u003cstrong class=\"hl\"\u003e黄河决口，西县城被冲毁，城墙倒，百姓搬高处\u003c/strong\u003e——县城不得不\u003cstrong class=\"hl\"\u003e东迁运河东岸\u003c/strong\u003e（即今山东武城县老城镇），自此一直到1973年，武城县城在运河东岸屹立865年。元至元元年（1264）：北部置故城县（今河北衡水故城县）——元明清属河间府。1964年：\u003cstrong class=\"hl\"\u003e国务院以卫运河为界，河西划河北故城，河东留山东武城\u003c/strong\u003e——武城县运河西岸大部分区域划归故城县。1973年：卫运河拓宽，老县城需拆迁——\u003cstrong class=\"hl\"\u003e武城县政府迁东北20公里重建新城\u003c/strong\u003e（武城镇），原址老城镇。2010年：武城老大桥（焕光大桥）列入\u003cstrong class=\"hl\"\u003e县级文保\u003c/strong\u003e——全长150米，1958年始建，前苏联设计图纸，主孔跨度50米。2014年：老武城遗址（焕光大桥东岸河滩遗址）列为\u003cstrong class=\"hl\"\u003e市级文保\u003c/strong\u003e——遗址在运河东大堤外，宋大观迁来后在此建城。2022年：\u003cstrong class=\"hl\"\u003e河北故城军屯镇关庙武城遗址发现\u003c/strong\u003e——面积约226万平方米，唐调露元年至宋大观年间的武城县治——河北省启动勘探，2024年列入\u003cstrong class=\"hl\"\u003e第七批省保\u003c/strong\u003e。现状：焕光大桥（县级文保）、老武城遗址（市级文保）、故城武城遗址（河北省保·226万㎡）、董学村（董仲舒下帷讲学遗址·明万历立碑）、四女寺水利枢纽（运河节制闸）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e武城老城镇横在卫运河东岸，1958年前苏联图纸建的焕光大桥拱跨两岸，桥西河北故城、桥东山东武城，桥上鲁冀界牌立至今；运河西河北故城县郑口镇六座砖石挑水坝呈倒U字列在河堤内侧，长堤上可一一数坝。\u003c/p\u003e\u003cp class=\"main-text\"\u003e故城武城遗址（河北省保·唐调露至宋大观县治）：河北衡水故城县军屯镇关庙村、杨寺村及建国镇马寺村一带，唐调露元年至宋大观间武城县治，设治四百余年。以永济渠故道为界分南北二区，北区发现城垣遗迹，遗物以邢窑定窑磁州窑等瓷器为主，2025年公布河北省第七批省保。；焕光大桥（县保·1958年建·前苏联设计）：武城县老城镇东运河上，1958年国家清淤拓宽运河时由山东省交通厅承建，用前苏联设计图纸，同期同图纸还有临清大桥。大桥横跨卫运河，桥西河北故城、桥东山东武城，桥上鲁冀界牌1964年分省后立至今，2009年加固增人行道护栏。；董学村（董仲舒下帷讲学处·明万历立碑）：河北衡水故城县房庄镇董学村，原名十里长村，因董仲舒青年下帷讲学改名下帷村后改董学村。2023年房庄镇榆林村出土明万历碑，刻董仲舒下帷授徒，记重修泰宁寺及明人追忆董讲学情景。；郑口运河挑水坝（国保·清道光二十三年）：河北故城县郑口镇运河大弯处，清道光二十三年始筑，后陆续补至六座。坝体以黄土、白灰、糯米汤搅拌夯实，外砌两层青砖，青砖上还刻着一至十四尺水位刻度。六座坝呈倒U字列于河堤内侧，全长约九百十米，体形分长方形、菱形、梯形不同：前后四座顺水挑流，第三座作锐角顶冲，分杀水势。最早此处只以柳树捆成龙尾埽倒挂缓冲，后渐改砖石；一九四五年最后一座落成时，故城县县长杨静桥题词抑息狂澜，凸刻方砖嵌在坝体中。；古贝州遗址（市文保·隋唐至金）：广运街道旧城村，即明清恩县旧城，城址呈土埠状南北长一千八百米、东西宽一千米，中心在原县汽车站十字路口附近，地面散落布纹瓦、黑白釉瓷片，《恩县志》载旧有四坊文德丛桂宣化武安，自隋开皇历亭县治至明洪武东迁，州县设治七百余年。；陈公堤（北宋·鲁冀界长堤）：武城县东部，北宋真宗年间为阻黄河西泛所筑，北起四女寺牛角峪减河南堤、南至恩武公路，长约二十公里，堤身高出两侧平地数米，夯土层次清晰，今为县境最古老人工堤。；达官营清真寺（省文保·清）：四女寺镇达官营村，清代回民礼拜寺，大殿坐西朝东，青砖起脊，院内古柏数株，1950年代曾扩建，2015年列入山东省第五批省保，为武城运河沿线仅存回民古寺。；漳南镇遗址（市文保·隋唐）：鲁权屯镇漳南镇村，隋大业间窦建德起义据漳南镇，唐为漳南县治，地面散见砖瓷残片，村名沿用至今，与东阳县遗址、老城镇遗址同列市保。；古贝春酒厂旧址（省文保·1960年代）：老城镇，厂区占地约三万八千平方米，南北长一百四十五米、东西宽二百六十五米，基本保留上世纪六十年代苏式红砖厂房、烟囱、发酵车间，2022年列入山东省第六批省保，为鲁北仅存计划经济时代工业遗产。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郑口镇老船夫郑大爷（85岁）：\u003cbr\u003e&quot;我爹是运河上的老船夫——给漕船拉纤的。1964年分省的时候，我爹说&#x27;这条河原来是我们郑口镇的，现在一半给河北、一半给山东——河还是那条河，水还是那股水，可人变两省了&#x27;。\u003cstrong class=\"hl\"\u003e我现在还能背船工号子的调\u003c/strong\u003e——&#x27;嘿哟嘿哟！前面的走哇！后面的跟上啊！&#x27;——元代开始喊，明清鼎盛，现在没几个人会了。前两年县文化局录我喊号子——说要申报省级非遗，录了整整两天，录了三段。&quot;\u003cbr\u003e▌焕光大桥上过桥的司机小刘（35岁）：\u003cbr\u003e&quot;我经常从山东武城过桥去河北故城——桥中间有块牌子写着&#x27;鲁冀界&#x27;，拍照留念的人不少。我爹说这桥1970年代还窄得只能过一辆卡车——\u003cstrong class=\"hl\"\u003e我小时候过桥，自行车车把能蹭到桥栏杆\u003c/strong\u003e。2009年桥加固重修，加宽到能并排跑两辆卡车。现在桥两头的收费站早就撤了——但我每次过桥还是会减速——毕竟这桥承载了武城和故城几代人的记忆。&quot;\u003cbr\u003e▌董学村董氏后人董大伯（62岁）：\u003cbr\u003e&quot;我家就是董学村的——族谱上写着&#x27;董仲舒后裔&#x27;，全村320户有180户姓董。\u003cstrong class=\"hl\"\u003e明万历那块碑就在村头的泰宁寺里\u003c/strong\u003e——文革时被推倒了，埋在村西头的机井旁边。2023年挖出来时，碑上的泥还没擦干净，&#x27;董仲舒下帷授徒&#x27;几个字还能看清——我当时在场，心里激动得直跳。现在碑立在村头的董仲舒文化广场上——每年清明，全村姓董的都要去碑前祭拜。&quot;\u003c/p\u003e"}, {"n": "山东·高唐州老城", "s": "高唐", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e1958年拆城墙时，高唐城根底下挖出了密密麻麻的石碌碡——就是农村轧麦场的石滚子，一个个竖埋在土里，数量精确到9999个。专家说这是古代的筏板基础，分散压力、减震、防冻胀、防盐碱。为什么是9999不是10000？古人说满招损谦受益，9是阳数之极，留个余地。现在那些石碌碡大多被村民搬回家垫了地基、垒了猪圈。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e高唐老城被鱼丘湖碧水环城环抱，北魏挖土筑城的城圈湖今作城市景观；清平镇仅存迎旭门青砖门洞立在十字街，门楼近年按明式重建；梁村镇梁村街东一座宋代仿木砖塔瘦俏挺立，塔北一株古槐相伴，旧志称唐槐宋塔。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鱼丘湖：环抱老城的环城湖，江北县级最大城内湖之一，城湖一色碧波荡漾，岸线绕旧城一周。；清平迎旭门（省保·仅存东门）：清平镇十字街仅存的东门。北宋宣和七年筑土城，清乾隆二十五年改建砖城，门楼早圮、只余青砖门洞与两侧土墙，一九九七年集资按明式重建门楼。今门洞青砖错缝拱券，门额嵌迎旭门石匾，门内青石板街面被独轮车碾出浅槽，为鲁西平原仅存的古代城门实物。；高唐文庙（省保·元代）：县城内，元代建筑，现存崇圣祠、尊经阁、泮池，古柏犹在。；兴国寺塔（国保·宋代·梁村镇）：梁村镇梁村街东，宋代仿木楼阁式空心砖塔。塔身八角，青砖白灰砌筑，原十三级、今存十一级，自二层起逐层收分，瘦俏挺拔；底层重檐、门洞北开，下承金刚座，檐部斗拱全用青砖切割磨制，转角砖雕倚柱阑额，顶置葫芦形塔刹。塔北十米古槐一株，树心早空、内生树瘿，经火大部枯死又自残干抽出新枝，与古塔相映，旧志唐槐宋塔并称。；固河汉墓群（省保·汉）：固河镇固河村西南，长七百米宽五百米地面上原分布七座汉墓封土，今唯齐盼子墓尚存大冢，封土高约四米、径二十米，周围另有王子坟与小冢三、双冢二；过去曾出土陶楼、汉画像石、陶灯陶灶。；华歆墓（市保·三国魏）：固河镇大华庄村西北二百米，平野中一抔封土，高约三米、径七米，砖室结构，顶作圆拱、底呈八角，顶部塌一米见方缺口，自缺口下望可见墓室。旧志传为三国魏太尉华歆葬处，麦田中孤冢可指。；灵城遗址：县城东南约十七公里南镇村，即汉灵县城址，春秋曰灵丘、战国曰灵县，城址深埋平野之下，村名与旧志互为印证。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e高唐古城墙遗址（县保·北魏始建）：北魏景明三年建土城为南清河郡治，城圈湖（今鱼丘湖）挖土筑城而成，东北湖东岸尚存遗址。明城墙下旧传埋九千九百九十九个石碌碡作筏板地基，1958年拆城时发现。。\u003c/p\u003e", "c": ""}, {"n": "山东·平原老城", "s": "平原", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e平原北城墙遗址现在还在，一段风干的土堆，没有垛口，没有雉堞。有人说那土是唐时颜真卿守平原时夯的，掺了糯米、麦秸，攥一把能闻到旧时光的味道。真正的城墙从不用石头说话，它只沉默地把自己站成，一把泥土等待的形状。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e平原老城坐落在鲁西北平原，北城墙夯土残段卧在护城河旁，糯米草秸夯层间绊马石时从水底浮起；三唐乡崔家庙村东一座清代七级青砖塔立在铁路与省道之间，塔门门额石刻千佛塔三字，龙门狂草石刻今存县图书馆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e颜真卿公园：纪念颜真卿抗安史之乱固守平原县城，园内立颜真卿像。；千佛塔（省保·清康熙八年）：三唐乡崔家庙村东，清康熙八年建，七级八棱柱形青砖结构，塔门朝南，门额嵌石刻千佛塔三字，高约二十六米，塔内阶梯可登至顶，四层以上仅容一人。为鲁西北平原少有的清代高层砖塔，旧仙塔插云为平原八景。；王汉庄墓群（省文保·汉）：王凤楼镇王汉庄村，汉魏贵族墓，墓上封土已平，1990年代发掘出土釉陶楼高约一米四，另有陶器、瓷器、水晶玉器铜器五十余件，其中二级文物十件、三级十二件，村形按八卦布局。；恩城文昌阁（省文保·明成化十六年）：恩城镇县立第二中学院内，原恩县文庙旁水门上，明成化十六年始建，万历元年重修，三层楼阁式砖木，登阁可俯瞰恩城老街，国家图书馆原馆长任继愈题匾，为原恩县治所仅存明代木构。；颊川石桥（市文保·明万历四十六年）：平原县境颊川故道，明万历四十六年南京都察院右都御史邑人宋仕捐资修建，清代知县吕宏积续修，桥为青石单孔，桥侧立重修颊川石桥碑记，并出土颊川代筏、大明万历四十六年岁次戊午正月吉等碑刻各一通。；森罗殿遗址（义和团大战官兵处·清末）：王凤楼镇森罗殿村，清光绪二十六年义和团朱红灯率众在此与清军决战，殿宇已圮，今立森罗殿义和团起义纪念碑一通，村名沿用。；张官店古城（西周至汉·齐平原邑）：城南二十五里张官店村东，西周姜太公封地、春秋战国齐平原邑、秦置平原县治，秦汉平原郡县城所在，今地面散见绳纹陶片与汉砖瓦，为平原立县两千年原点。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e平原郡古城墙遗址：北城墙残段仍存，夯土以糯米草秸夯筑，绊马石时常从护城河浮起。北齐天保二年迁今址初为土城，明万历改砖城，解放初城墙渐毁。；龙门石刻（省保）：原水门龙门石刻，明万历元年建水门时嵌于门洞楣上，碑刻一笔连体狂草龙门二字，起笔如龙首收笔如龙尾劲卷。文革水门拆除，石碑现存平原县图书馆，2010年琵琶湾公园西门方位仿建龙门。。\u003c/p\u003e", "c": ""}, {"n": "山东·东阿镇老城", "s": "东阿", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e东阿镇的老胶农老王今年68岁，熬了40年胶。他说现在熬胶还是用狼溪河的水，比重比一般水大，熬出来的胶才正宗。1915年巴拿马博览会拿金奖的那批阿胶，就是他太爷爷那辈人熬的。胶因水而贵，水因山而灵。他身后的狼溪河桥就是明代的永济桥，98米长的石拱桥，蹲过八对石狮的望柱还在。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东阿镇老城被浪溪河一分为二，明弘治始建的永济桥单孔青石拱桥跨河而立，桥栏石狮石猴蘑菇头排开；少岱山在镇西俗称小泰山，山上旧庙宇林立；永济桥东南近年重建的阁老府四进院落门悬季羡林题匾，沿少岱路可一路寻访阿胶故地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东阿古城门（少岱门·济南市文保）：明代五门之一，现存唯一城门少岱门，至今仍立在东阿镇老城内。；少岱山：镇西泰山之西，俗称小泰山，山上庙宇林立，旧为东阿镇香火胜地。；永济桥（国保·明弘治十三年始建·单孔青石拱桥）：老城内横跨浪溪河，原名狼溪桥，明弘治十三年始建，现存为明万历重修，全青石砌单孔石拱桥，长五十五米宽六米余，为济南现存跨度最大古石拱桥。桥栏望柱雕石狮七对石猴一对，配蘑菇头，拱券南北两面雕镇水螭首龙头。当地顺口溜十八个狮子一对猴，二八一十六个蘑菇头。；古阿井（省保·阿胶发源地）：狼溪河为九泉之水，历代以狼溪河水熬胶，井水清冽甘美与阿胶齐名。；于慎行墓地（于林·市保·明）：镇北纸坊村，万历帝为恩师于慎行敕建陵园，占地六十余亩，墓前甬道两侧原列石俑、石马、石羊、石虎与华表各两对，华表上雕望天吼。今墓区松柏森森，残存石像生列于甬道。；孟庄汉墓群（省保·东汉）：东阿镇孟庄村南，一片东汉墓葬群分布于乡野间，2006年公布省保，周围以土路为界。；少岱山碧霞宫（元君祠）：镇东少岱山顶北端高台之上，红墙灰瓦、飞檐花脊，祀碧霞元君，俗称泰山奶奶庙。旧志载其北为玉皇楼、台下为东岳帝祠，2018年恢复为道教活动场所。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e阁老府（于慎行故居·近年重建）：永济桥东南，明隆庆进士、礼部尚书东阁大学士于慎行故居，于为万历帝师人称于阁老。原府已毁，近年重建四进院落，门楣悬黄阁调元、谷城世家楹联，二进会客厅悬季羡林题于慎行纪念馆匾，厅内高悬万历御笔责难陈善。东院家庙存谱碑。。\u003c/p\u003e", "c": ""}, {"n": "山东·鱼台老城", "s": "鱼台", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e鱼台王庙镇的老渔民李老头，每年枯水季都要划着船去旧城海子中间看看。他说能摸到古城墙的砖——沉了270年，砖缝里还卡着清代的铜钱。有次他捞上来一个完整的瓷碗，碗底写着乾隆二十一年，正是黄河决口那年。他把碗捐给了县博物馆，换了50块钱。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e鱼台地处昭阳湖畔黄河冲积平原，清乾隆年间黄河决口两次沉城，千年县治没入水底化为一汪海子，湖陵故城也淤入昭阳湖荡。沿湖堤可访水下城墙的轮廓，田间尚有观鱼台高丘与闵子古祠可寻。\u003c/p\u003e\u003cp class=\"main-text\"\u003e旧城海子（市级文保）：王庙镇旧城里村南一片开阔水面，东西长两千余米、南北宽千余米，水色深碧。清乾隆二十一年黄河决铜山孙家集灌城，整座黄台县城沉入水底，今枯水季水下城垣房基依稀可辨，渔民常捞起清代瓷片铜钱。旧城里村北建有旧城文化博物馆，展陈九百余件皆从水底打捞而出。；湖陵故城：今张黄镇湖陵村一带，地处昭阳湖荡芦苇之间。秦汉湖陵县治所，泗水旧道穿城分为南北两城，明清黄河淤积渐没入湖。今唯余村名与芦苇荡中隐约可辨的城址轮廓，城砖陶片散落在湖滩淤泥上。；鱼城镇（原董家店）：清乾隆二十二年自旧城海子迁治于此，直至1956年迁谷亭，为鱼台县城两百年。原县衙前一对石狮子尚存于鱼台二中门口，镇内老街格局依稀可辨。；鲁隐公观鱼台（武棠亭遗址，省保）：张黄镇武台村西一座高台，南北长百余米、东西宽近百米，台高三米余。台上古柏十余株苍劲挺拔，传为唐植。尚存明崇祯年间鲁隐公观鱼处碑一通，碑阳刻字、碑阴清雍正重修题记，明清两朝隔近百年同刻一石。台上另有唐代始建超化寺伽蓝殿，红墙灰瓦。春秋鲁隐公五年观鱼于棠即此处，鱼台县名由此而来。；樊迟墓（省保·春秋）：张黄镇武台村南五十米，西距武棠亭三百米，孔子弟子樊迟墓，封土仅高出地面零点八米、周长十米，墓前旧有巨碑，历代从祀，与闵子祠、观鱼台并称五里三贤。；鱼台孔庙大殿（省保·清乾隆）：鱼城镇镇中（鱼台二中）院内，清乾隆二十二年自旧城迁治所建，大成殿长二十三点七米、宽十五点三米、高十五点五米，五脊歇山式，七楹四十二柱，覆绿琉璃瓦，前有戟门、棂星门，中为泮池。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e闵子祠（省保）：张黄镇大闵村内，清康熙六十年重建，雍正三年钦赐门宗孝行匾额。主殿重梁起架，六根巨柱顶梁。文革中主殿被毁，仅存东西配殿三间及院内三通清代古碑，2006年重建笃圣殿恢复格局。祀孔子弟子闵子骞。；太公庙（市保·唐贞观始建）：李阁镇太公庙村，唐贞观初为祀姜太公建，原殿毁于民国兵燹水灾，2002年于旧址重建大殿五间二层，歇山式，殿内双龙盘柱，存古碑七通、泥塑神像八十五尊。。\u003c/p\u003e", "c": ""}, {"n": "山东·曲阜老城", "s": "曲阜", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e曲阜人孔大爷在五马祠街开了40年的甏肉干饭铺。他说小时候瓮城里还能捡到明城墙的砖，砖上刻着工匠名字。2002年复建城墙时他主动捐了12块祖传老砖给文物局。现在他的饭铺门口还立着半块城砖——是他爹当年砌灶台剩下的。这砖比我家铺子里的甏还老，他说这话时手里还翻着那半块砖。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e曲阜老城方正规整，一圈明代砖城墙围合着孔庙孔府，这是全国唯一专为护庙而筑的县城。城内街巷纵横，万仞宫墙巍然当街，五马祠街青石板路上烟火气未散，陋巷口老井石栏磨得发亮。\u003c/p\u003e\u003cp class=\"main-text\"\u003e万仞宫墙（正南门）：明故城南门，砖砌券拱门洞，重门设半圆形瓮城，门上重檐城楼巍然。原额为明山东巡抚胡缵宗所题万仞宫墙，清乾隆十三年乾隆亲谒孔庙时易以御笔，原额移存庙西矍相圃。2004年按原貌复建，城墙蜿蜒五千三百余米连成一圈。；延恩门（北门）：明故城北城门，城门洞上方石额刻仰圣门三字，亦为明胡缵宗所书。门内回望城楼匾题延恩门，留有中华民国三十六年复原纪念字样。；鼓楼街钟楼街：明故城内南北向老街，钟楼青砖黛瓦，鼓楼居街心，为明旧有钟鼓二楼所在。街面石板铺砌，两侧老铺相连。；五马祠街：明故城内烟火最盛的老街，青石板路蜿蜒。街中段立四柱石构井亭，亭下古井尚存，四面楹联挂满红绶带。街因明代孔尚经家祠得名。；陋巷街：颜子陋巷故址所在街巷，青石板路被踩得发亮，巷口旧井石栏磨得光滑，旁有老槐树。孔子弟子颜渊当年所居之处。；阙里街：金声玉振坊以北的老街，元始建四柱三间式阙里牌坊屹立街口。孔子故宅所在，巷内古柏森森。；孔庙孔府孔林（三孔）：世界文化遗产。孔庙历代扩建成九进院落，大成殿巍峨；孔府为衍圣公衙宅合一，前后九进院落；孔林为孔子及其家族墓地，古木参天。；周公庙：曲阜东北寿丘下，祀周公。明代建筑，棂星门达大成殿共五进院落，古柏掩映。；元代仙源县旧城（旧县）：曲阜城东旧县村一带，宋元曲阜县治所在，城址尚存但已非城貌，地表散落砖瓦陶片。；城砖铭文：明代筑城工匠将籍贯姓名刻于城砖之上，今正南门旧墙砖上字迹依稀可辨，为研究明代城工制度的实物。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明故城五门城楼：东秉礼、东南崇信、北延恩、西宗鲁，原城楼均毁于1930年中原大战战火，今仅存城门基址。。\u003c/p\u003e", "c": ""}, {"n": "山东·泰安府城", "s": "泰安", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e泰安老茶客王老头每天早上七点准时到双龙池边的茶馆报到。他说1985年复建岱庙正阳门时他正在上小学，跟着大人去看热闹，还在拆下来的老城墙土里捡到了一枚乾隆年间的铜钱。现在岱庙城墙修得比我小时候见的还整齐，他端起茶碗抿了一口，但那个铜钱我给了我儿子，他拿去换糖吃了。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泰安城贴着泰山南麓铺展开来，没有自己的中轴线，而是借岱庙的南北轴做了自己的脊梁。岱庙城垣高峻如宫城，往南通天街笔直直通城外，往北遥参亭、岱宗坊一线古御道直上南天门。步出北门即是登山道，山城相依。\u003c/p\u003e\u003cp class=\"main-text\"\u003e岱庙（国保）：泰山南麓一组城堞式宫城，宫墙青砖砌筑周长近三里，高五六米，辟八门，四角建巽、艮、乾、坤四楼。中轴线上正阳门、配天门、仁安门依次向北，天贶殿高居露台之上，重檐庑殿顶，与故宫太和殿、曲阜大成殿并称东方三大殿。殿内壁画《泰山神启跸回銮图》满绘整壁。；遥参亭：岱庙正南门正南，一组四合院式小建筑。唐代称遥参门，明代扩建建殿围墙奉碧霞元君像。历代帝王登封泰山必先在此遥拜，再入岱庙行大典。前临通天街，后接正阳门。；通天街：泰安城唯一正南正北的笔直老街，北起遥参亭，旧名景岩街。街面石板铺砌，两侧老铺相连，取《诗经》泰山岩岩鲁邦所瞻之意。往北穿岱庙经岱宗坊即登山御道。；仰圣街福全街洼子街东青龙街：老泰安城历史街巷，明清肌理尚存，石板路蜿蜒，两侧青砖老民居错落。；红门路岱庙通天街：省级历史文化街区，自岱宗坊至岱庙的登山古御道，青石板依山势缓缓抬升，两侧古柏夹道。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e蒿里山：泰安城南一座不高的土山，古代帝王禅地之所。旧有森罗殿、阎王殿、鬼门关，设三曹六案七十五司。1931年驻军拆塔基时掘出唐玄宗、宋真宗禅地玉册，现藏台北故宫。今山林寺观尽毁，仅存遗址。；明砖城：明嘉靖间易土以石，周七里余，四门各建城楼。建国后城墙城楼陆续拆除，仅余根基。东南角楼旧祀魁星。；护城河：旧环城一周，今多填为街或加盖盖板，仅存几段水面。。\u003c/p\u003e", "c": ""}, {"n": "山东·泗水老城", "s": "泗水", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e泗水泉林镇的张大爷每天早上绕着卞桥走三圈。他说那桥唐时建的，金时修的，桥面上的石板被磨得发亮，比我爷爷的爷爷还老。2024年文保中心来修卞桥时，张大爷天天去工地帮忙搬砖。他们说这桥是宝贝，我打小就知道——我爹小时候在桥洞里摸鱼，我在桥栏上刻过名字，现在我孙子也在这桥上跑。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泗水城东陪尾山下泉眼如林，泗水从石缝间喷涌成河，水草随泉流飘荡。孔子在此临川叹逝，金代卞桥横跨泗河之上，三孔联拱青石券砌，桥身风雕雨刻八百年，仍是山东现存最老的石桥。\u003c/p\u003e\u003cp class=\"main-text\"\u003e泉林泉群（省保）：陪尾山下，趵突、珍珠、黑虎、红石诸泉星罗棋布，五步成溪百步成河。康熙御碑亭中赑屃驮碑高近七米，碑阳刻康熙御制《泉林记》满汉两种文字，碑阴为乾隆御诗。陪尾山立子在川上处石碑。；卞桥（国保）：泉林镇卞桥村东，跨泗河之上，三孔联拱青石券砌，桥长二十余米。中孔券顶刻金大定二十一年重修题记，桥墩迎水作梭形，拱脚莲花托石花瓣肥厚。桥面两侧望柱栏板浮雕人物花卉，桥两端各蹲石狮一对。中秋之夜桥下双月影浮动，旧称卞桥双月，为山东现存最古老石桥。；卞国故城遗址（国保）：泉林镇北，北临泗河东靠陪尾山，城址呈不规则长方形。今仅存西北角一段夯土残墙，夯层清晰，断面内含陶片灰土。春秋卞邑所在。；仲庙（省保）：县城东济河西岸，明万历十九年建。正殿高明殿祀孔子弟子仲由（子路），享殿三间，康熙乾隆年间大规模重修。庙东旧有仲子故里坊。；子在川上处：陪尾山观泉亭内，乾隆御题石碑一通。孔子当年在川上曰逝者如斯夫不舍昼夜即此处。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明泗水土城清砖城：周四里，四门。建国初城墙拆除，砖石铺路，今仅余地名。；泉林行宫：清康熙乾隆建，一百余间房屋，今全毁，仅存地基。；清代捐资碑：三十六块捐资碑几乎毁于战乱，零星残石散落。。\u003c/p\u003e", "c": ""}, {"n": "山东·新泰老城", "s": "新泰", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e新泰羊流镇中心小学操场底下就是明代羊公祠的遗址。校长说1980年代建校时挖出过祠碑残片和泥塑碎块。现在每周一升旗仪式校长都要跟孩子们说羊祜坐怀不乱的故事。镇转盘那尊4米高的羊祜雕塑是1999年立的，头顶带簪名士小冠左手握佩剑——设计者把羊祜塑成了一个儒雅的文人。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新泰城坐落在新甫山北麓汶水之阳，西晋羊祜取新甫、泰山首字定名新泰。城西羊流镇曾是九省通衢的驿道重镇，镇旁田野间散落着汉晋羊氏家族的高大封土与残碑，旧驿道墙基依稀绵延。\u003c/p\u003e\u003cp class=\"main-text\"\u003e羊流镇：新泰市西北三十里，西晋羊祜故里。古为九省通衢驿道重镇，传因羊祜羊流河而得名。街旁今立羊祜塑像，镇内旧驿道残墙基址依稀绵延。；三羊墓（羊氏祖茔）：羊流镇北田野间，三座高大封土传为东汉羊续、上党太守羊衜、羊曼之墓。旧称五冢，三冢高丈余、二冢半之，今封土痕迹尚在。1993年市博物馆曾发掘其中一座，1996年公布为县级文保。；新甫山（莲花山）：新泰城东，群峰插云有小泰山之称。汉武帝东巡封禅于此建离宫，山径古松夹道。；和圣文化园：宫里镇柳里，坐怀不乱的柳下惠故里，今为纪念性文化园。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e羊公祠遗址：羊流镇西门里北侧，明万历年间为追念羊祜所建。原三间大殿塑羊祜轻裘缓带立像，清乾隆二十八年泰安知府姚立德重修。祠毁后原址建镇中心小学，清姚立德所立羊公祠记碑尚存，立于镇政府院内。；明新泰砖城：明正德间大规模修建，周围四里，连女墙高三丈五尺。建国后拆除，三门城楼全毁。。\u003c/p\u003e", "c": ""}, {"n": "山东·费县老城", "s": "费县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e费县上冶镇西毕城村的老刘天天在鄪国故城遗址上放羊。他说那城墙根底下的土比别处的硬，是夯的，踩上去咯噔咯噔响。有一回他在庄稼地里挖到半块带花纹的瓦当——千秋万岁那种。他交给了县博物馆，换了一本费县志。我天天在孔子骂过的那片城墙上放羊，羊一叫，他就觉得孔子也听见了。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e费县北依蒙山南临浚河，春秋鄪国故城在田野间夯土残垣绵延，北高南低气势犹存。故城西北角一坑旧井旁立着两通清代石碑，颜林墓群散落城北乡野，这里是琅琊颜氏的根脉。\u003c/p\u003e\u003cp class=\"main-text\"\u003e费城遗址（祊城）：今费县城一带，北魏以后县治所。今仅存东城墙残垣一段，城内有一株明代古银杏枝干扶疏。；季桓子井遗址：鄪国故城西北角，今存一大坑即旧井所在。坑北侧立东西两通清代石碑，东碑为乾隆间费县知事骆大俊所书季桓子井楷书，西碑为嘉庆间孙星衍与知县郭志清合立，钱泳隶书季桓子得羵羊之井，字迹古朴。孔子观井得羵羊处。；颜林（市保）：城北颜林村，琅琊颜氏祖茔，自魏颜盛以下数十代葬此。唐颜真卿、颜杲卿殉国后于此建二颜墓，北宋元祐六年诏颜真卿墓载入祀典。林内旧有颜文忠新庙碑、醉翁亭碑。；龙门路：原费县龙门所在位置，旧为震水假门，今地名犹在。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鄪国故城（国保）：上冶镇西毕城、古城、宁国庄一带，北眺蒙山南临浚河。鲁僖公七年筑城，鲁定公十二年孔子堕三都时毁季氏之城。现存城垣夯土残段绵延，北高南低气势犹存，断面夯层清晰，地表散落砖瓦陶片。；鄪国内城（季王城）：全毁，仅存夯土基址埋于地下。；明代砖城：费城内外城全拆，仅存地名与少量基址。。\u003c/p\u003e", "c": ""}, {"n": "山东·平邑老城", "s": "平邑", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e平邑颛臾一村的张老汉今年72岁，他每天早上都要村碑那转一圈。那碑是1990年立的，碑底开了个超市，张老汉没事就去摸那碑上的颛臾俩字。他说当年拆庙的时候他还小，亲眼看着颛臾王庙的屋顶被拆下来当柴烧。这俩字笔画稠念着绕嘴，但这是老祖宗传下来的，能存到现在不容易。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e平邑地处蒙山南麓，柏林镇固城村北一座近方形的夯土小城伏在田野间，残墙高数米，断面夯层里还嵌着炭化木棍——这就是颛臾国故城，三千年前头一位替周天子祭蒙山的东蒙主封国。山下曾子故里弦歌旧地，城东两尊东汉青石汉阙犹立。\u003c/p\u003e\u003cp class=\"main-text\"\u003e颛臾国故城遗址（省保）：柏林镇固城村北，蒙山南麓，城近正方形，黄土夯筑。东、西、北三面残墙犹高数米，最高处近九米，断面夯层分明，孔洞中可见炭化木棍，墙基宽厚。城内文化堆积厚约两米，残砖断瓦俯拾即是。传为周成王所封颛臾国都，主祭蒙山。；南武城故城（国保）：郑城镇南武城村，鲁襄公十九年筑。城址北依苍山南城山，残垣土台犹存。孔子来此闻弦歌之声说割鸡焉用牛刀，亦是曾子、曾点、澹台灭明故里。；曾子墓（宗圣墓）：南武城村东北，封土隆起，古木环绕，为曾参长眠之处。；平邑汉阙（国保）：城东原汉墓前，含皇圣卿阙与功曹阙两尊青石雕刻。东汉元和年间所建，为中国现存时代最早、保存较完整的地面石建筑之一，被誉为石质汉书。；蒙山主峰龟蒙顶：东蒙主祭祀之所，蒙山上旧有颛臾王殿祭祀蒙山神，今殿已不存，峰顶远眺群峰如黛。；澹台灭明墓：1970年代夷平，今仅存地名。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e颛臾国宫城：全毁，遗址在庄稼地里。；颛臾王庙：历代祭祀蒙山神之所，全毁。。\u003c/p\u003e", "c": ""}, {"n": "莒县老城·毋忘在莒", "s": "莒县", "p": "山东", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e莒县老城坐落在莒河冲积平原上，春秋莒国都城的夯土残墙从酒厂一直绵延到环卫所一带，残高数米、宽三十余米，夯土层层如铁。城外浮来山定林寺前院中央，一株近四千年的古银杏遮天蔽日，八人合抱不过。\u003c/p\u003e\u003cp class=\"main-text\"\u003e莒国故城南城垣（省保）：自浮来春酒厂绵延至环卫所一带，东临沭河、西傍柳青河。旧志载莒城有外郭、内城、子城三重，子城方十二里、内城周二十里、外郭周四十里。现存断垣约一千六百五十米，残高七八米、宽达三四十米，黄土层层夯筑、坚而如铁，断面寸草不生，敲击有声，为春秋莒国都城三重城垣中保存最阔的一段。；定林寺古银杏（浮来山）：浮来山定林寺前院中央一株，树高近二十七米、干围近十六米，须八人展臂方能合围，树冠遮地数百平方米，至今枝繁叶茂。树龄近四千年，号称天下银杏第一树，树干皴裂如鳞、根部盘突出地。树下立清顺治年间碑刻，载鲁隐公八年莒鲁会盟即于树下而盟；旁侧校经楼为二层小楼，门额郭沫若一九六二年题校经楼三字。；定林寺：浮来山中，北魏始建，前中后三进院落。山门内古银杏遮天蔽日，寺内有三教堂、露天五百罗汉彩塑群。；齐长城莒县段（东莞镇光光山）：东莞镇光光山上，花岗岩垒砌，顺山脊蜿蜒，为齐长城东段遗迹，石砌墙体残存数段。；莒州博物馆：馆藏陵阳河遗址出土大汶口文化陶文（日月山刻符），比殷墟甲骨文早约一千五百年，将汉字起源推至五千年。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e故城东北角城垣（老水利局处）：老水利局东侧，残高八九米、宽四十米。1996年后辟为城墙公园，今并入复建莒国古城拱辰门段。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌浮来山看门老人（70岁）：\u003cbr\u003e&quot;这银杏我从小看到老，一进农历十月叶黄了，满山都是人。老人说摸树干沾福气，树皮都让人摸得发亮。&quot;\u003cbr\u003e▌莒国古城拉车师傅：\u003cbr\u003e&quot;莒字外地人十个九个念错，念&#x27;举&#x27;不念&#x27;旅&#x27;。客人一上车就让我讲古，我从一碗全羊汤讲到三千年前。&quot;\u003c/p\u003e"}, {"n": "沂水老城·沂河古城", "s": "沂水", "p": "山东", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e沂水县城坐落在沂河与沭河之间，内城外城双重城墙在鲁南罕见。城北马站镇关顶村大岘山口，穆陵关扼守齐鲁咽喉，齐长城石砌残墙沿山脊蜿蜒如龙。城西刘家店子村两座春秋大墓出土铜器金玉，墓主指向莒国国君。\u003c/p\u003e\u003cp class=\"main-text\"\u003e沂水老城墙基（县政府后院）：县政府后院，全城唯一残存的明代城垣遗迹。夯土城基隐于后院荒草间，断面可见夯层。；齐长城遗址（沂水段）：关顶村一带残存约五公里，多顺山脊以沙质黄土夯筑，基宽三五米，保存较好处墙体仍高出地面二至四米、宽五至八米，断面夯层清晰，蜿蜒山脊如卧龙。一九七七年县立齐长城遗址碑于村北路东。；东安古城址（袁家庄乡）：袁家庄乡，汉代城阳国东安县故城，周长约千米，夯土城基隐于田野。；沂水古城遗址：出土莲花兽面瓦当、三彩建筑饰件等隋唐文物，今为地下遗址。；刘南宅八卦宅遗址：明刘氏大宅，按阴阳八卦布局，分南宅中宅北宅，水磨砖瓦房鳞次栉比，为旧沂水城最大民居。今已不存，地名犹在（今沂水酒厂一带）。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e穆陵关（马站镇关顶村，齐长城关口）：马站镇关顶村大岘山口，齐长城最著名关隘。旧关楼东西长约五十米、南北宽约四十米，为二层三拱券门、歇山顶、前设瓮门的建筑，上世纪七十年代因扩修公路拆除。今关顶村仅存明嘉靖年间修葺关楼碑亭、清代重修功德碑两通，东西两侧二百五十米处山头上各有夯土烽火台遗址，东山头名韩通城。素有齐南天险之称，左传载赐我先君履南至于穆陵即此。；刘家店子春秋墓（密邑旧址）：院东头镇刘家店子村西，北依峙密山南临峙密河。1977至1978年发掘两座春秋大墓与车马坑，殉人四十余具，出土铜陶玉金器数百件，铜戈柄铸莒公铭文。封土与车马坑原址回填，地表为农田。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌东关街老住户刘大爷（68岁）：\u003cbr\u003e&quot;我小时东关街全县最热闹，粮店影院百货楼挤一条街。老城墙扒得早，就剩县府后院那一截土岗子，年轻人都不知道那是城墙。&quot;\u003cbr\u003e▌穆陵关村放羊老汉：\u003cbr\u003e&quot;关顶村这道土岭，老辈都叫&#x27;北大门&#x27;。刮大风站在豁口上，风呜呜地响，跟千百年前挑担赶集的人听见的一个声儿。&quot;\u003c/p\u003e"}, {"n": "日照老城·海曲石臼", "s": "日照", "p": "山东", "w": "", "h": "", "r": "\u003cp class=\"main-text\"\u003e日照老城背山面海，西汉海曲县城墙残段在海曲坊城市更新片区内原址保留。城南石臼所老街还留着花岗岩海石房与一座八角五层老灯塔，青石板路通向渔港码头，是日照唯一还带着滨海老烟火的地方。\u003c/p\u003e\u003cp class=\"main-text\"\u003e海曲古城墙遗址：海曲坊城市更新片区内，西汉海曲县城墙残段原址保留展示。汉武帝时置海曲县、属琅琊郡，因山海相围得名，旧志称海限塞山有此一曲。残墙夯土外包砖，断面夯层里夹着汉代绳纹砖瓦，墙头已辟为城市绿地步道。；石臼所海石房（天津路南新港路北十字街）：天津路南、新港路北十字街附近的清代民居。墙体以海边所产花岗岩石块错缝垒砌，间以青砖正反相扣，黑白横纹相间；大门、窗户一律发碹拱券，窗梢加砌装饰条，为鲁东沿海独有的海石建筑。石墙经海风盐雾长年侵蚀，棱角磨钝、石面泛白，冬暖夏凉，今十字街一带仅存数座。；石臼老灯塔（成章灯塔，省保）：石臼老港区内，一九三三年石臼商会会长贺仁庵募资兴建，英国人设计。塔身八角五层，全用丝山花岗岩错层内收砌筑，通高约十六米，石缝间海风盐渍斑斑。原仅存四层，二〇一八年修缮复原第五层；一九九二年退役后不再点灯，与一九八五年建成的新灯塔隔海相望，成为老港区的标志。；老码头、老海关楼、老边检楼、渔政监督管理处旧址：集中在石臼老港区，近代开埠以来的港口建筑遗存，砖石外墙斑驳，码头系船铁环犹在。；石臼老街：贯穿石臼所的渔港老街巷，青石板路犹存，旧时渔船商船云集，今两侧老铺改作鱼市与海味摊。；老石臼市场（1992至2020年）：年营业额曾达四亿多元，2020年片区改造搬迁，今仅存地名。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌石臼老渔民（66岁）：\u003cbr\u003e&quot;海石房是拿海边礁石垒的，冬暖夏凉还抗盐碱。现在盖楼，老石房拆一间少一间，就剩十字街那几座了。&quot;\u003cbr\u003e▌老石臼市场海鲜摊主：\u003cbr\u003e&quot;老市场九几年盖的，一天两万人，我一天卖几百斤蛤蜊。搬新市场那天，老主顾都来转最后一圈。&quot;\u003c/p\u003e"}, {"n": "微山老城", "s": "微山", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e微子墓位于微山岛凤凰台北，圆形土冢高十米、底径七点五米，苍松翠柏环抱，层层石阶直抵殿前，正殿存汉元帝时丞相匡衡所题&quot;殷微子墓&quot;的原碑，碑身顶端已断裂；史载微山岛一点七万居民中殷姓占六七成，就连孔子也是微子后裔。岛东峰上还有微子后人子鱼的目夷墓，墓冢简朴、前立宋代石碑，凭栏可眺万顷湖光；岛南麓的张良墓封土宽阔厚重，这位汉初三杰受封留侯，其封地留城已沉入微山湖底，功成之后便归隐湖畔。作为县治的夏镇古城由广戚、部城（西城）、夏镇寨（东城）三城组成，明清设夏镇闸、利建闸扼守湖水，老街上依稀可辨市井格局，运河船工的号子已成为当地非遗。而张良封邑留城因地质沉降沉入湖底，那一片水下封存着汉代城郭，当地渔民下网时偶尔还能捞起汉砖。殷商帝乙的长子微子启贤而让位，周朝封于宋，为宋国始祖；微子卒后葬于宋国留邑东山，那座山便因他得名微山，微山之名由此而始。北宋绍熙之后黄河屡屡决口泛滥，这一带渐渐淤积成湖，微山兀立湖心成了一座孤岛。明清大运河全线通航，微山湖成为南北漕运必经的要道，扼湖守闸的夏镇帆樯云集、市声鼎沸。1953年设微山县，统辖整片湖区，由广戚、部城、夏镇寨三城合体的夏镇成为县治，散落在苏鲁边界的古迹从此得以系统保护。张楼镇湖陵村的湖陵古城原是一座秦汉古城，如今城址早已沉埋于湖荡芦苇与淤泥之间，只留下地名与零星记载，成为历史断层里一座&quot;水下郡县&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e微山湖中一座小岛浮在水面上，岛上三座古墓跨着商、春秋、汉三代——微子墓高居凤凰台顶，目夷墓卧在东峰，张良墓封土宽阔为三墓之最。湖北岸夏镇老街曾是运河四大镇之一，青石板路还留着当年水旱码头的印痕。\u003c/p\u003e\u003cp class=\"main-text\"\u003e微子墓（省保）：微山岛凤凰台顶，圆形土冢高约十米、底径七米半，苍松翠柏环抱，层层石阶直抵殿前。正殿内存汉元帝时丞相匡衡所题殷微子墓原碑，碑顶已断裂，横额仁参箕比四字为侍中般伯篆书，字迹经千年风蚀仍可辨认。岛上殷姓居民众多，相传皆为微子后裔。；目夷墓（省保）：微山岛东峰，距微子墓约二公里半，墓冢简朴，只一圆土堆。前立宋熙宁五年徐州知州傅尧俞所碑，长方形抹角、高二米三、宽九十厘米、厚四十厘米，碑面阴刻篆文宋贤目夷君墓。目夷字子鱼为宋襄公庶兄、泓水之战主谋，凭栏可眺万顷湖光。；夏镇三城：明清夏镇由广戚、部城（西城）、夏镇寨（东城）三城连成一片，与镇江、杭州、南阳并称运河四大古镇。旧设夏镇闸、利建闸扼守湖水，老街青石板路犹存。；湖陵古城遗址：张楼镇湖陵村，秦汉湖陵县故地。今沉埋于湖荡芦苇淤泥之间，仅存地名与零星记载，成水下郡县。；微子文化（地名由来）：殷商帝乙长子微子启让国于纣，周封于宋为宋始祖。微山、微山湖、微山县皆因他得名，岛上殷姓居民相传为其后裔。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e张良墓（省保）：微山岛西南南麓，为三墓中最大一座。墓作下方上圆，以红黄粘土夹鹅卵石层层夯筑，夯层清晰可辨，高约十五米、长宽各近百米，是典型汉墓形制。墓前立清乾隆二年石碑，题汉留侯张良墓；墓东侧原张良祠毁于文革，旧传墓前透亮碑、松抱槐为岛上两奇观。其封地留城已沉入微山湖底，渔民下网偶捞汉砖。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌微山岛老船工 刘老大（69岁）：\u003cbr\u003e&quot;打小听老辈念，先有微山、后有微山湖——早先是山是地，黄河一闹水才成了湖。咱岛上姓殷的多，清明对岸姓宋的也摇船过来，跟咱一块上微子爷坟上磕头，说都是他老人家的后人。&quot;\u003cbr\u003e▌夏镇退休职工 徐姨（63岁）：\u003cbr\u003e&quot;老夏镇原来是三座城长一块儿，广戚、部城、寨子。我小时候镇上的河还走货船，船工号子喊得震天响。现在古城墙早没了，可老街那几条巷子还在，青石板让人踩得发亮。&quot;\u003c/p\u003e"}, {"n": "临沂老城·琅琊故郡·启阳城", "s": "临沂", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e临沂老城位于沂河、祊河合流之地，春秋鲁哀公三年（前492），鲁国为抵御强晋修筑启阳城，这是临沂筑城之始，距今已两千五百多年。西汉为避景帝刘启名讳，启阳改称开阳；东汉建初五年（80），琅琊王刘京将国都由莒县迁至开阳，古城自此称琅琊，成为鲁东南数百年的政治文化中心。琅琊王氏由此发迹——&quot;卧冰求鲤&quot;的王祥、辅佐东晋的王导皆出于此，书圣王羲之也于西晋太安二年（303）出生在琅琊临沂，幼年居家于此旧宅，其洗砚池遗迹至今犹在。北周改置沂州，隋朝临沂县治移入城内，&quot;临沂&quot;之名自此沿用，&quot;沂州&quot;之名历一千三百余年。明代洪武元年（1368）临沂始筑砖城，城呈椭圆形、形如展翅南飞的凤凰，故有&quot;龟驮凤凰城&quot;之传，设南望淮、东镇海、西瞻蒙、北宗岱四门；清雍正十二年（1734）升沂州为府。1972年，老城西南银雀山汉墓出土《孙子兵法》《孙膑兵法》等竹简七千五百余枚，将这部兵家经典的真容重现于世。今天的临沂老城，孔庙、王羲之故居、洗砚池与护城河相映，两千五百年的岁月在脚下层层叠叠。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临沂老城是鲁东南保存最完整的古建古遗址之城，一公里洗砚池街上聚齐孔庙、王羲之故居、天主教堂与基督教堂四脉文化；\u003cstrong class=\"hl\"\u003e王羲之故居的洗砚池\u003c/strong\u003e临池学书、池水尽黑，&quot;父子碑&quot;一碑双字，\u003cstrong class=\"hl\"\u003e银雀山汉墓\u003c/strong\u003e让失传两千年的《孙膑兵法》重见天日，金代孔庙两棵千年银杏护着鲁东南最大古建筑群，隋唐以来&quot;临沂&quot;&quot;沂州&quot;之名沿用至今，龟驮凤凰城的身世是它最厚重的底色。\u003c/p\u003e\u003cp class=\"main-text\"\u003e王羲之故居（洗砚池街21号·全国重点文保）：书圣王羲之出生地与幼年居所，坐北朝南，大门彩檐前出、立明柱四根。园中洗砚池即&quot;临池学书、池水尽黑&quot;典故原址，今池面仅当年约十分之一，池水静如镜，倒映飞檐垂柳；池侧鹅池立&quot;父子碑&quot;——&quot;鹅&quot;字为王羲之手笔、&quot;池&quot;字由王献之补写，一碑双字，池中白鹅浮游。沿墨华轩一线，百米碑廊列自晋至近现代八十余方石刻，复刻《兰亭集序》《十七帖》；右军祠、琅琊书院皆仿明清四合院形制，青墙环绕。2003年扩建时于地下出土两座西晋大墓、近三百件文物，入选当年全国十大考古新发现；银雀山汉墓竹简（1972年）·现存山东博物馆：1972年4月在老城西南银雀山发掘一、二号西汉墓，出土简牍近五千枚，一号墓整理出4942枚、二号墓32枚，以早期隶书写于西汉文景至武帝初期；\u003cstrong class=\"hl\"\u003e《孙子兵法》与失传近两千年的《孙膑兵法》同墓现世\u003c/strong\u003e，一举澄清宋以来孙武、孙膑真伪之问，另有《六韬》《尉缭子》《晏子》等古籍佚书，是我国文化史上的重大发现；临沂孔庙（兰山路109号·金代）：始建金代皇统三年（1143），明清式三进院落、南北155米东西45米近7000㎡，为鲁东南保存最完好的古建筑群。棂星门外照壁砖雕&quot;己所不欲，勿施于人&quot;，门前雌雄石狮镇守、朱门铜环。大门内两棵植于金代的千年银杏，东雄西雌，历经九百年仍枝叶交抱、年年结实，是全国雌雄距离最近的两棵千年银杏，古树修复时又现银杏与柏树相拥的&quot;银柏合抱&quot;奇观；大成殿重檐歇山、红柱金顶、琉璃流光，面阔5间，供4米彩绘孔子像与四配、十二哲；明伦堂柱础为明代遗存。1992年列为省级文保；东城门遗址公园（明城墙实物·启阳城故址）：位于沂州路与兰山路交会处，2008年9月涑河还建工地掘出青砖，专家确认为明代古城墙，遂废原建5号楼改辟公园，公园长约118米、宽约47米、占地8亩。城墙遗址以玻璃罩保护、总长25.3米，墙高约两米，城砖大小不一、长方形与不规则者层层叠压，砖面风化痕迹宛然；旁立&quot;琅琊古郡&quot;石刻、临沂建城2500年纪念碑与石制日晷，是启阳城（鲁哀公三年·前492筑）与历代城址叠压最直接的实物载体；鄅国故城（鄅古城村·省保）：距老城北约8公里柳青街道鄅古城村，为西周初年姒姓子爵小国鄅国都城，传为夏后氏后裔所建，故城东西约500米、南北约400米、约20万㎡，遗址曾见周至汉代陶片、铜戈、箭镞。1982年修兖石铁路时在沂河东凤凰岭发现春秋晚期鄅子大墓，车马坑、器物坑与墓室俱全，出土编钟、鼎等青铜礼器兵器及300余件随葬品，殉14人，其中&quot;凤头斤&quot;为国宝级文物。1992年列为省级文保；普照寺·集柳碑（琅琊八景之首&quot;普照夕阳&quot;）：王羲之故居园区内古寺，2003年按金代形制恢复\u003cstrong class=\"hl\"\u003e天王殿与大雄宝殿\u003c/strong\u003e，大雄宝殿\u003cstrong class=\"hl\"\u003e面阔5间、重檐歇山顶\u003c/strong\u003e，西山墙开两天窗，每逢傍晚夕照透窗射于三世佛身、满殿金光，重现八景之首&quot;普照夕阳&quot;；寺中\u003cstrong class=\"hl\"\u003e集柳碑\u003c/strong\u003e为金皇统四年（1144）觉海禅师集唐柳公权字而成《沂州普照禅寺兴造记碑》，\u003cstrong class=\"hl\"\u003e原碑高约275.2厘米、宽124.8厘米、碑文1261字\u003c/strong\u003e，清康熙七年（1668）沂州大地震碑碎数截、补后残128字，日军盘踞时欲运日本未逞，&quot;文革&quot;中被砸碎，1979年复制；今立于故居内的新集柳碑\u003cstrong class=\"hl\"\u003e高7.2米、重40余吨\u003c/strong\u003e，为&quot;东柳碑&quot;与西安碑林柳书&quot;玄秘塔碑&quot;相对；东城门遗址公园（明城墙实物·启阳城故址）：位于沂州路与兰山路交会处，\u003cstrong class=\"hl\"\u003e2008年9月\u003c/strong\u003e涑河还建工地掘出\u003cstrong class=\"hl\"\u003e明代古城墙\u003c/strong\u003e，为保护文物特废原建5号楼改辟公园，公园\u003cstrong class=\"hl\"\u003e长约118米、宽约47米、占地8亩\u003c/strong\u003e；城墙遗址以\u003cstrong class=\"hl\"\u003e玻璃罩保护、总长25.3米\u003c/strong\u003e，城砖大小不一、层层叠叠，旁立\u003cstrong class=\"hl\"\u003e临沂建城2500年纪念碑\u003c/strong\u003e与明临沂城分布图、日晷，是启阳城（鲁哀公三年·前492筑）与历代城址叠压最直接的实物载体。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老城东关老街坊 张大爷（76岁）：&quot;我们临沂城是老城了，《春秋》里写着鲁哀公三年筑的启阳城，到如今两千五百年。老人说城是龟驮着的凤凰，东西长南北短，四面门各有名字——南望淮、东镇海、西瞻蒙、北宗岱，北门楼子上还刻着&#x27;齐鲁锁钥&#x27;四个大字。&quot;\u003cbr\u003e▌王羲之故居讲解员 王老师（54岁）：&quot;这一片原是琅琊王氏的老宅，书圣王羲之小时候就住这，洗砚池是他洗笔的塘。2003年扩建时，从地下挖出两座西晋大墓，出土近三百件文物，一下子就评上当年的全国十大考古发现，琅琊王氏在这里生活的实据就这么实打实地摆出来了。&quot;\u003c/p\u003e"}, {"n": "沂南老城·阳都·诸葛故里", "s": "沂南", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e沂南古称阳都，地处沂河与汶河交汇、蒙山与沂山环护之处，山川形胜，人杰地灵。秦于此置阳都县，隶琅琊郡，历史上阳都曾封爵者十二人。东汉光和四年（181），诸葛亮出生于琅琊阳都（今砖埠镇孙家黄疃一带），在此度过少年时光，十三岁方随叔父南下，从此&quot;鞠躬尽瘁&quot;，他的《诫子书》&quot;静以修身，俭以养德&quot;传诵千年，故乡之人至今引以为训。距此十余里的常桑杭村，则是唐代名臣、书法大家颜真卿的祖居地，其先祖颜之推所著《颜氏家训》被誉为&quot;古今家训，以此为祖&quot;。西汉期间，戴德、戴圣叔侄师从后苍习《礼》，分别编成《大戴礼记》与《小戴礼记》，为中国礼学留下典范——诸葛亮、颜真卿、二戴，一城竟集聚智圣、书圣之祖与礼学宗师。城内的北寨汉墓群是东汉豪族墓葬，墓室由二百八十块石料构筑、画像石四十二块，攻战、宴乐、祭祀画面栩栩如生，被称为&quot;齐鲁小敦煌&quot;。今天的沂南，阳都故城、武侯祠、北寨汉墓与颜氏家风家训，共同勾勒出一幅文脉绵长的老城画卷。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沂南古称阳都，一处小城竟集齐\u003cstrong class=\"hl\"\u003e&quot;智圣&quot;诸葛亮出生地\u003c/strong\u003e、&quot;书圣&quot;颜真卿祖居与\u003cstrong class=\"hl\"\u003e礼学宗师&quot;大小戴&quot;\u003c/strong\u003e，阳都故城与武侯祠、常桑杭村颜氏祖居俱在，砖埠镇孙家黄疃一带的\u003cstrong class=\"hl\"\u003e北寨汉墓\u003c/strong\u003e更被誉为\u003cstrong class=\"hl\"\u003e&quot;齐鲁小敦煌&quot;\u003c/strong\u003e，画像石上刻满东汉人间的烟火，一座老城走出一文一武、辉映千古。\u003c/p\u003e\u003cp class=\"main-text\"\u003e北寨汉墓（齐鲁小敦煌·全国重点文保）：现存最大、最完整汉画像石墓之一。1954年春发掘，墓室通长8.7米、宽7.55米、高3.1米，由280块预制巨大石料按尺寸砌成，前、中、后三主室加东西侧室，隔墙上嵌画像石42块、画面73幅、画像面积达44.2㎡。墓门高2.74米，门楣横额以高浮雕加线刻刻《胡汉战争图》，立柱分刻伏羲、女娲、东王公、西王母与玉兔捣药；前室面阔两间、中有八角形擎天柱，中室八角柱上浮雕带背光仙人，被学者视作中国早期佛教图像之一。刀法以减地平雕加阴线刻为主，间用浅浮雕、高浮雕与透雕，攻战、乐舞百戏、车马出行、侍奉祭祀人物千余，郭沫若称&quot;汉代社会生活的百科全书&quot;；阳都故城（诸葛故里）：位于县城西北砖埠镇孙家黄疃一带的汉代阳都故城遗址，夯土城墙与石砌墙基依稀可辨，城东南建有武侯祠，是\u003cstrong class=\"hl\"\u003e一代贤相诸葛亮的出生地与少年居所\u003c/strong\u003e；诸葛亮故里纪念馆：1992年县府拨款于砖埠镇孙家黄疃建仿古院落，占地2700平方米，大殿高7米，殿内塑手持羽扇的诸葛亮铜像，院墙嵌清道光年间&quot;诸葛故里&quot;古碑。院左侧竖一块穿孔汉画像石碑，为汉代原物；院内一株老银杏高23米、树围3.6米、树冠覆盖360余平方米，相传树龄千二百年，至今枝繁叶茂、树干系满祈福红丝带，馆藏汉代瓦当、陶器等出土文物；武侯祠·诫子书：阳都故城武侯祠内祀诸葛亮，大殿悬&quot;静以修身，俭以养德&quot;警句；祠前历千年银杏古树，呼应诸葛亮《诫子书》&quot;非淡泊无以明志，非宁静无以致远&quot;；常桑杭村·颜氏祖林谱碑（乾隆三十三年·1768年·市级文保）：村中颜氏祖林（颜林）内，一座\u003cstrong class=\"hl\"\u003e汉白玉碑亭\u003c/strong\u003e护着乾隆三十三年（1768）四月初五所立\u003cstrong class=\"hl\"\u003e《颜氏谱碑》\u003c/strong\u003e，\u003cstrong class=\"hl\"\u003e整块青石磨制，碑高1.8米、宽0.9米、厚0.3米\u003c/strong\u003e，碑阳&quot;颜氏谱碑&quot;四字为颜体大字，碑身按世系刻自颜子24代孙颜盛至71代孙颜怀仁共\u003cstrong class=\"hl\"\u003e48代\u003c/strong\u003e颜氏子孙、名单150余人、其中90余人标注职务爵位，碑侧记述立碑缘由；2002年又于旁立复刻碑一块，碑文漫漶处清晰可读；常桑杭村·孝悌里牌坊与清泉寺碑：村口立&quot;孝悌里&quot;牌坊，村北清泉寺遗址存\u003cstrong class=\"hl\"\u003e明正德十五年（1520）石碑\u003c/strong\u003e，碑载此地即古&quot;孝悌里&quot;；遗址另有《万代流芳碑》《重修清泉寺碑》及&quot;正方体碑&quot;，村中颜氏后人还保存清道光、同治年间曲阜颜翰博府（世袭翰林院）颁给本村颜氏族人的《移文》《信牌》《祭田地地亩册》等纸质文书；孙隆村·二戴祠堂（同治十一年重修）：依汶镇孙隆村（戴氏后人聚居地）现存\u003cstrong class=\"hl\"\u003e清同治十一年（1872）重修的汉儒二戴祠堂房屋一处\u003c/strong\u003e，主体保持完整、解放后屋顶换过红瓦；院内立\u003cstrong class=\"hl\"\u003e&quot;重修汉儒二戴祠堂&quot;石碑一块\u003c/strong\u003e，另有\u003cstrong class=\"hl\"\u003e从大戴村（今张庄镇大岱村）迁移而来的康熙年间重修二戴祠堂石碑两块\u003c/strong\u003e，康熙十一年版《沂水县志》载&quot;大戴村，在县西南一百里，二戴讲礼之处&quot;；大戴村·二戴讲学故地（张庄镇大岱村）：村旧名&quot;大戴村&quot;，康熙十一年版《沂水县志》载&quot;大戴村，在县西南一百里，二戴讲礼之处&quot;，为西汉经学大师戴德、戴圣叔侄师从后苍习《礼》后立书院、授生徒之地，二人分别辑成《大戴礼记》与《小戴礼记》49篇，为两千年的礼学奠下根基；今村名&quot;大岱&quot;仍谐&quot;大戴&quot;之音，村中戴氏后人聚居。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌阳都故城武侯祠看护 诸葛氏后人 诸葛大爷（68岁）：&quot;我们这地方旧时叫阳都，诸葛亮就是在这出生的，纪念馆那棵银杏一千二百多年了，陪着他家的老宅子。村里孩子如今还背&#x27;非学无以广才，非志无以成学&#x27;，是孔明写在《诫子书》里的话。都说这是智圣故里，不能辱没先贤。&quot;\u003cbr\u003e▌北寨汉墓讲解员 高老师（51岁）：&quot;北寨这座汉墓，有人说它是&#x27;齐鲁小敦煌&#x27;。整个墓室用二百八十块石头垒成，画像石四十二块，攻战的、宴乐的、祭祀的全有，七十三幅画把汉朝人的生活刻了个遍。它是我国现存面积最大、保存最完整的汉画像石墓之一，看的是地下的一座&#x27;汉代博物馆&#x27;。&quot;\u003c/p\u003e"}, {"n": "临沭老城·沭河古县", "s": "临沭", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e临沭地处鲁东南沭河之滨，是沂蒙南麓一片古老的土地。传说尧舜之时，治水失败的鲧被殛于羽山，此山即在今临沭境内，山间&quot;殛鲧泉&quot;为这段上古传说留下幽微的注脚。春秋时，齐鲁两国于临沭东部的夹谷山会盟，孔子以鲁国司寇身份佐从鲁君，据礼力争，终令鲁国在外交上占了上风，&quot;夹谷之会&quot;名载史册。战国时期，齐军师孙膑在马陵山设伏，大破魏将庞涓，马陵之役便发生在临沭西南与郯城相接的山地一带。秦汉之际，此地置利成县（利城），历经汉魏诸朝，元明撤县为镇，今利城村犹存城门石匾、碑帽等遗迹。唐武德四年（621），临沭之名首次见诸史册。老城之外的朱村，自明洪武年间定名，村中崇奉朱子儒学，保存着七户二十三间清代民居，青砖小瓦、四合院落，为鲁东南少有的完整明清古村落；村中王氏祠堂、节孝坊与王椽中进士的旧事，透出昔日的书香门风。今天的临沭，羽山、夹谷、马陵、利城与朱村古建层层叠印，是一部沭河畔的千年编年史。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临沭坐落在沭河东岸，西南与郯城交界的马陵山绵延数十里，相传是孙膑设伏破庞涓的古战场。东北羽山上三缝石纵裂如劈，夹谷山顶摩崖石刻尼山分秀。曹庄镇朱村青砖飞檐的明清四合院成片保存，是鲁东南最完整的古民居群。\u003c/p\u003e\u003cp class=\"main-text\"\u003e羽山殛鲧泉遗址：临沭与江苏东海交界的羽山，相传舜殛鲧于此。山顶旧有殛鲧泉，1958年被炸后泉水不复出。山上另有三缝石、三官庙、出云洞等遗迹，石缝纵裂如劈。；夹谷山齐鲁会盟遗址：临沭境内夹谷山顶，鲁定公十年齐鲁两君会盟处。山顶旧有圣化亭、夹谷书院、奎星洞，摩崖刻尼山分秀四字。南坡存明万历丙子年（1576）会盟碑两通。孔子以鲁司寇相礼。；马陵山古战场：临沭西南与郯城交界的马陵山，战国齐魏马陵之战主战场。孙膑设伏大破庞涓处，样山一带相传为庞涓葬地。山陵沟壑纵横，林木幽深。；利城遗址：县城东十五里后利城村东，汉魏宋利城县故治。遗址略高于四周呈鏊面状，地表汉砖与商周陶片相杂，旧传出土城门石匾、双面二龙戏珠碑帽，村委院内现存一块刻&quot;重修香院&quot;小篆碑帽，雕工细密；村南射箭台、古墩残迹可寻；朱村明清古建筑群（省保）：曹庄镇朱村，王氏聚族而居，沿永济街、朱雀街、永安路三条古街展开。原存三百余间，今仍有清代砖木四合院百余间，上下两层、青砖小瓦，四檐飞出席龙头凤尾砖饰，檩梁构筑、泥瓦罩顶；东楼为村中最早单体，曾因洪水折顶后修为平房。村中另存王氏祠堂、玄武庙（占地约55亩）、嘉庆十六年钦节孝坊，抗战时为八路军老四团钢八连战斗地；北沟头遗址（省保）：县城西北，龙山文化至商周古文化遗址，出土石斧、蛋壳黑陶杯等，地表散落陶片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌利城村老乡亲 李大爷（72岁）：&quot;我们利城，老辈子是县呢——汉代叫利成县，后来撤县为镇。村委院里那块双面二龙戏珠的碑帽，刻的是&#x27;重修香院&#x27;四个小篆，专家说是秦汉的物件，雕工细得很。村南还有射箭台、古墩，都是当年的营盘古迹。&quot;\u003cbr\u003e▌朱村老村民 王奶奶（76岁）：&quot;我们朱村，明朝起就叫这名，祖上敬朱熹的学问，出过中进士的。村里这二十几间清代老屋，青砖小瓦、砖木两层，是鲁东南头一份保存完整的。王家祠堂、节孝坊都是老东西。前些年又照老样子修过，老屋顶、老天井都在，一进村门就像回到从前。&quot;\u003c/p\u003e"}, {"n": "临淄老城·齐国故都·姜太公封地", "s": "临淄", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e临淄地处泰沂山北麓、淄河之滨，因城临淄水而得名。西周初年，周王室封姜太公吕尚于齐，建立齐国；齐献公元年（前859）都治由薄姑迁至临淄，自此直至秦灭齐，临淄作为齐国都城六百三十余年，又历秦、汉、魏、晋先后为王国故都与州郡治所，是&quot;六朝故都、千年齐都&quot;，总共约一千一百年的古都历史。战国时期，临淄人烟繁盛，《战国策》称&quot;临淄之途，车毂击、人肩摩，连衽成帷、举袂成幕、挥汗成雨&quot;，为当时全国最大的都会之一。齐国故城由大城（廓城）与小城（宫城）组成，小城嵌于大城西南隅，城墙依地势蜿蜒，留有二十四处拐角；城内桓公台、雪宫台、遄台等宫室台榭基址散布，冶铁、炼铜、铸钱、制骨作坊遗址众多。相传孔子在齐闻《韶》乐，&quot;三月不知肉味&quot;，韶院村即为闻韶之地；齐都稷门外稷下学宫汇集百家，开创了&quot;百家争鸣&quot;的盛况。如今临淄老城与齐国故城遗址博物馆相连，1994年被国务院列为国家历史文化名城，齐文化的光华穿越千年而弥新。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临淄是周代齐国故都，姜太公封齐、\u003cstrong class=\"hl\"\u003e齐献公元年（前859）迁都于此\u003c/strong\u003e，至秦灭齐历六百三十余年，先后为六朝古都、历时约一千年余，\u003cstrong class=\"hl\"\u003e齐国故城大城小城、桓公台、殉马坑、孔子闻韶处、稷下学宫遗址俱在\u003c/strong\u003e，1994年列为国家历史文化名城，被誉为&quot;千年齐都、泱泱大国&quot;。\u003c/p\u003e\u003cp class=\"main-text\"\u003e齐国故城遗址（全国重点文保·1961年）：\u003cstrong class=\"hl\"\u003e周代最大诸侯国都城\u003c/strong\u003e，分大城（廓城）与小城（宫城），大城南北约4.5公里、东西约3.5公里，小城嵌于大城西南隅，两城周长合计\u003cstrong class=\"hl\"\u003e21433米\u003c/strong\u003e、总面积约15.5平方公里，城墙沿淄河蜿蜒、留有\u003cstrong class=\"hl\"\u003e24处拐角\u003c/strong\u003e，夯层清晰、层次分明；桓公台（小城西北）：小城宫殿区主体夯土台基，传为\u003cstrong class=\"hl\"\u003e齐桓公会盟、理政之所\u003c/strong\u003e，现存高约\u003cstrong class=\"hl\"\u003e14米\u003c/strong\u003e，台前有齐景公&quot;雪宫&quot;遗址与&quot;齐桓公号令处乡&quot;传说；殉马坑（河崖头5号墓·全国重点文保）：大城东北河崖头村齐国贵族墓地，主墓甲字形，墓室南北26米、东西23米，南墓道长18米、宽12米，椁室以自然巨石垒砌、南北8米、东西7米、深5米，墓室早年被盗，唯殉马坑环主墓东、西、北三面保存完好，总长215米，殉马多达600余匹，全为壮年战马、倒卧有序。马骨层层叠压、骨骼白中泛褐，坑顶今覆陈列大厅，是齐国&quot;厚葬&quot;之风与&quot;千乘之国&quot;的铁证；大城排水道口：大城西墙墙基宽40米下，以天然巨型青石东西向垒砌，总长42米、南北宽7至10.5米、深约3米，分进水道、过水道、出水道三段。过水道以石块交错砌出上、中、下三层15个方形水孔，每层5孔，水经石隙上下跌荡而过、人却不能穿行，既能泄城内积水又能御敌潜入，为迄今所见最完整古城排水系统之一；孔子闻韶处（宣统三年碑·韶院村）：齐故城大城东南韶院村（原名枣园），1982年修葺为村北一座淡灰色仿古小院，长约7米、宽约6米，围墙开圆形月亮门，极简朴。进门北墙正中嵌一方1911年（宣统三年）重立石碑，隶书大字&quot;孔子闻韶处&quot;为清末葛家庄秀才马庆煜题写，碑侧刻&quot;旧有碑记，迄今磨灭&quot;；碑左右分嵌&quot;舞乐图&quot;与&quot;韶乐及子在齐闻韶&quot;简介两方石刻。清嘉庆时村人掘地得古碑与石磬数枚，遂改村名韶院；1995年齐故城内又发现古琴减字谱《箫韶九成凤凰来仪》；稷下学宫遗址（2022年确认·小徐村西）：位于齐故城遗址博物馆西1公里、齐都镇小徐村西麦田之中，基址埋藏不深，2022年2月经近五年考古确认为中国最早官办大学。遗址东西约210米、南北长约190米，已揭露四排14个单体夯土建筑基址，11号主体建筑台基残高1.1至1.4米。早年村民筑温室大棚即出&quot;千秋万岁&quot;&quot;吉祥万岁&quot;圆瓦当、半瓦当、板瓦、铺地砖与陶豆，发掘又获螺钿镶边建筑构件、齐刀币钱范、陶制井圈千余件，广场路土碳十四测年为前400至前390年；城门与四门十三门：据载齐城有门十三座，已探明十一座城门遗址，门道宽逾8米，车马可并行；齐刀币与冶铸遗址：大城内发现冶铁、炼铜、铸钱、制骨作坊遗址数十处，出土齐刀币、齐量器等，为春秋战国工商业最发达都会之实证。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临淄齐国故城文保员 齐大爷（70岁）：&quot;我们临淄是齐国的都城，姜太公开国，献公迁都过来，前前后后千把年。故城分大城小城，小城是国君住的宫城，桓公台高十四米，是齐桓公召集群臣的地方。城里的老城墙土夯的，还有那排水道口，巨石垒的，能排水又能挡敌，工匠的手艺没得说。&quot;\u003cbr\u003e▌齐文化爱好者 赵老师（55岁）：&quot;你看战国时候那记载，临淄七万户，街上人挤人，车毂击、人肩摩。孔子在这听韶乐，&#x27;三月不知肉味&#x27;；稷下学宫聚了百家，辩得热火朝天。故城东北的殉马坑，那是齐国贵族的厚葬，马骨一层层，看了才懂什么叫&#x27;泱泱大国&#x27;。临淄这故都，值得到处走走。&quot;\u003c/p\u003e"}, {"n": "即墨老城·康王城与古城", "s": "即墨", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e即墨之名，始见于战国。齐威王时，即墨大夫政绩卓著，以&quot;田野辟、人民给、官无留事&quot;受褒；燕将乐毅伐齐，齐国仅存莒与即墨两城，齐人田单于即墨火牛阵大破燕军，收复失地，即墨由此名动天下。汉初此地为胶东国都，封王城于今平度，人呼&quot;康王城&quot;。隋开皇十六年（596），即墨县治西移今址，自此历千余年而城址不移。明清之际，即墨为胶东望邑，学宫、文庙、县衙、牌坊次第而立，丁字大街石坊林立，蔚为大观。及至近代，即墨古城历经沧桑，古城墙砖石多已拆除，唯县衙三堂与街巷格局犹存；近年依明清规制复建古城，城墙、城门、牌坊重立，县衙大堂依旧高悬&quot;明镜高悬&quot;，是胶东保存最完整的活衙门。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e即墨老城丁字大街上三十六座石牌坊曾冠绝胶东，今复建十九座错落街旁。古城里隋代迁建的县衙大堂硬山高脊，三堂俱存，是山东唯一活着的古代衙署。平度朱毛村田野间，田单火牛阵破燕的康王城夯土残墙犹存。\u003c/p\u003e\u003cp class=\"main-text\"\u003e即墨古县衙（省保）：隋开皇十六年（596）迁县治于此后历代沿用，元至正年间县尹董守中扩建，明清十二次大修。大堂硬山高脊小瓦顶、短檐砌安鸱吻，长13.7米、宽11米、内高5米，内立四柱，正门两侧无面墙、由四立柱撑檐作&quot;敞口&quot;，东墙根嵌一块明万历年间重修碑；二堂琴治堂取宓子贱鸣琴而治典故。整组影壁、大门、仪门、六房、箴石亭、大堂、二堂、三堂俱全，为山东省现存唯一三堂俱存的封建时代县衙建筑群；丁字大街石牌坊（明清）：古城主街呈丁字形，明清两代旌表节孝科第仕宦立起三十六座石牌坊。今复建十九座分布于古城内外，多为白麻花岗岩三间四柱三楼式，额枋透雕花卉人物。；即墨故城遗址（国保，平度朱毛村）：平度市古岘镇大朱毛村，战国齐国下都，田单以火牛阵破燕复齐即此，西汉为胶东康王都，又称康王城。外城南北长约5公里、东西宽约2.5公里，今存东城墙约1500米，墙基宽30至40米、高4至5米，全为夯土板筑、夯层层次清楚；北城墙因上世纪六七十年代窑厂取土烧砖仅余半米高。当年运粮河（今小沽河）穿东南城门洞直入储粮湾，城墙缺口尚存，内城金銮殿、点将台台基犹存，常出土铜钫、弩机、瓦当；田横岛：黄海中小岛，秦末田横率五百士居此。汉高祖召田横，田横行至洛阳自杀，岛上五百士闻讯亦皆蹈海。今岛上立田横塑像与五百义士墓。；即墨温泉（温泉镇）：古称汤泉，汉时已有记载。泉温常年九十余度，今仍为疗养胜地，泉池氤氲。；鹤山风景区：即墨东部海滨，元代鹤山遇真宫，邱处机修炼处。山石峭拔，海滨栈道蜿蜒。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌即墨古城老住户 王奶奶（78岁）：&quot;过去丁字大街上一座接一座的石牌坊，大人说一共三十六座，逢年过节牌坊底下贴对联挂灯笼。县衙大堂那三进院子，我小时候常进去捡落叶，木柱子粗得抱不过来。现在重修了，还是那老格局，一进门那股子当年的气派还在。&quot;\u003cbr\u003e▌即墨故城文物爱好者 刘叔（63岁）：&quot;平度那头有个朱毛村，老人家都说那是老即墨城、康王城，田单在这用火牛阵破了燕军。城墙土夯的还有一段，宫城台基老高。黄海里的田横岛，退潮时能上去，岛上立着五百士的碑。即墨这一笔从战国写到今天，没断过根。&quot;\u003c/p\u003e"}, {"n": "蓬莱老城·登州府城与蓬莱水城", "s": "蓬莱", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e蓬莱为古登州治所，唐神龙三年（707）设登州于黄县，后移治蓬莱，蓬莱遂成胶东海防与海运重镇。宋嘉佑六年（1061），蓬莱阁建于丹崖之巅，俯临沧海，海雾起时楼阁若隐若现，遂有&quot;海市&quot;之观，八仙过海、秦皇汉武求仙的传说皆萦绕此地。北宋于此建&quot;刀鱼寨&quot;水寨，明代改建为水城，驻水军备海防，水门可泊战船，振扬门巍然屹立，是国内现存规模最大、保存最完整的水军基地。登州府城依山面海，府城、水城、沙城三城并列，古典而雄浑；戚继光生于蓬莱、练军于此，其故居牌坊至今完好。千年海风蚀过城墙，府衙、庙宇、街巷仍旧，蓬莱老城是胶东海岸线上最富传奇的一座活城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e蓬莱城北丹崖山直插入海，山东坡一圈夯土砖石围出的水城泊着古港，水门通海、振扬门接陆，是国内保存最完整的古代水军基地。丹崖山顶蓬莱阁双层木楼临海凌空，八仙过海的传说就从这崖头飘出去。\u003c/p\u003e\u003cp class=\"main-text\"\u003e蓬莱水城（国保，备倭城）：东依丹崖山西接田横山，北宋庆历二年建刀鱼寨，明洪武九年（1376）在其基础上修筑备倭城，周长2248米、面积27万㎡。南门振扬门拱券门洞砖石砌筑，门道宽3米、进深13.75米、残高5.3米，为明代原构，1980年代末重修门洞上建两层阁楼。北门水门宽约3米通海，清同治间设密棂铁闸，今仅存闸门凹槽；城内小海南北纵长655米、平均宽100米，北端平浪台迎水门而立、长100米宽50米，沿岸石砌码头宽5至10米、高约3米，桩上仍留拴船缆的石柱与石级，防波堤以巨石堆出；蓬莱阁（国保）：丹崖山巅，宋嘉祐六年（1061）始建。双层木结构凌空楼阁，与滕王阁、岳阳楼、黄鹤楼并称中国四大名楼。阁区由天后宫、龙王宫、吕祖殿、三清殿、弥陀寺组成古建筑群，沿山崖错落排布。海市蜃楼奇观与八仙过海传说皆出于此。；戚继光故里（国保）：明嘉靖四十四年（1565）朝廷为旌表戚氏所建牌坊街，东母子节孝坊、西父子总督坊，两坊间距约140米，皆四柱三间五楼云檐多脊花岗岩石雕坊，高9.5米、宽8.3米、进深2.7米。正间上下三枋以高浮雕精工镂刻丹凤朝阳、二龙戏珠、狮子滚绣球、鱼龙变化、麒麟凤凰；母子节孝坊主题取凤与牡丹，父子总督坊东面上层刻二龙戏珠、中层一出武戏、下层狮子滚绣球，为明代石雕珍品。旁有戚继光祠堂与戚府；田横山与丹崖山：城北临海危崖，田横山传为齐王田横率五百士居此。山上有合海亭、海天一色石刻，崖下波涛拍岸。；水城刀鱼寨遗迹：北宋熙宁、庆历年间所建刀鱼寨水寨，为蓬莱水城前身，因战船如刀鱼形得名。今水城北岸夯土基址犹存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e登州府城四门：东春生、南朝天、西迎恩、北镇海。城门方位与城垣格局尚可辨认，城墙砖石多已拆用，仅余几段残基。唐贞观元年即置都督府。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌蓬莱阁景区老讲解 孙师傅（66岁）：&quot;丹崖山下的海市，一年总有几回，太阳一出，海上浮起楼台城郭，古人就说那是仙山。蓬莱阁宋代的底子，木头都换过，可那份临海的气势没变。水城那边水门九米四高，当年战船从那进出，振扬门厚实得跟铁铸似的。&quot;\u003cbr\u003e▌登州府城老居民 李大爷（74岁）：&quot;咱们登州府，一个府城、一个水城，外头还有个沙城，三城挨着海。老话讲八仙就是在蓬莱阁登的仙，何仙姑、铁拐李都在。戚继光家就在城里，那牌坊石头雕的，几百年也没倒。海边这城，日子过得慢，故事讲不完。&quot;\u003c/p\u003e"}, {"n": "莱芜老城·嬴汶之滨的铁城", "s": "莱芜", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e莱芜地居泰莱山区，汶水东西分派其间。此地殷商时为属国，商代有&quot;北城&quot;之称；秦灭六国，于嬴水之旁设嬴县，为秦代古县之一，嬴姓即发端于此。春秋时鲁、齐两国于此常有角逐，城北长勺，鲁人以&quot;一鼓作气、再而衰、三而竭&quot;之势大败齐军，成为千古名典。战国之际，齐国为御强邻，沿泰山南麓筑起千里齐长城，莱芜段峰峦叠嶂、墙体蜿蜒，比后世的明长城早筑数百年。金大定十二年（1172），莱芜县城由旧治南迁今址；明正德间，知县卢秉彝采石筑城，城周方整、石基坚固，时人呼为&quot;铁城&quot;，设通齐、望岳、临津三门，接驿道、通汶水。今莱芜老城街巷尚存旧韵，城南山岭间齐长城石墙斜轧，仍守着这片嬴汶水土的千年气象。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e莱芜城坐落在嬴汶之间，羊里镇田野下压着商周古嬴城，是伯益封地、嬴秦祖里。城南雪野乡锦阳关下，齐长城石砌残墙沿山脊蜿蜒，比八达岭明长城早约四百年。长勺之战的古战场在苗山乡丘垄间，曹刿一鼓作气的故事就从这里传开。\u003c/p\u003e\u003cp class=\"main-text\"\u003e嬴城遗址（国保）：羊里镇城子坡一带，商周至汉古嬴城。秦统一设嬴县于此，为伯益封地、嬴秦祖里。2012至2013年山东大学勘探确认城址范围，含城址、兵营、粮仓、冶铸、墓葬，夯土与陶片遍地可寻。；莱芜县城墙遗存（铁城）：金大定十二年（1172）县治南迁至今莱城，明正德八年（1513）知县卢秉彝以石砌城，人称铁城，设通齐、望岳、临津三门。今仅余残段，石墙坚固犹可见当年风貌。；长勺之战故地：今苗山镇杓山村一带，鲁庄公十年（前684）曹刿论战一鼓作气大破齐军处。今为田野丘垄，地名犹存。；唐经幢（八棱碑·省保）：唐景龙三年（709）莱芜县令贾璞德政碑，今在口镇蔡家镇村一条民宅夹峙的窄胡同里。整座由一块青石磨成八棱柱形，通高3.62米、幢身高2.4米、周长2.24米，顶盖作八角翘檐亭状，顶为八棱柱、隔面浮雕四尊佛像。幢身前六面刻《佛顶尊胜陀罗尼经》，后两面铭文记述贾璞复置莱芜县始末与六大功绩，由乾封县主簿赵太昚撰。碑面历经千余年风雨风化，字迹大半漫漶，壁上还留着莱芜战役时的弹痕，是莱芜现存最早的碑刻；牛保冢：传为唐代清官牛保墓，土丘高耸，民间口碑相传。；莱芜古冶铁遗址：汉以嬴铁闻名，宋为全国重要冶铁中心，明清仍鼓铸不绝。今冶铁遗址散见炉渣与铁块。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e齐长城遗址（莱芜段）：莱芜境内自西而东有天门关、锦阳关、黄石关、青石关四大关。锦阳关西至大厂村北山一段756米保存最完整，墙体高5至6米、底宽约5米，上有190个城垛，垛高1至1.5米、宽1.4至1.9米，中凿20乘30厘米瞭望孔，墙内设1至1.5米高站台供士卒往来；关楼石拱发券、门额阳刻&quot;锦阳关&quot;三字，1938年毁于战火，今关址仍为莱芜至章丘公路所穿。此段清咸丰十一年（1861）为御捻军重修，石砌墙体沿山脊蜿蜒，比八达岭明长城早约四百年。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌莱芜城北老农 张大爷（71岁）：&quot;我们这可讲究&#x27;一鼓作气&#x27;，说当年曹刿在长勺打齐军，击了三通鼓才出兵，人家鼓都敲疲了，这边一击就冲，把齐军打退。城在山根底下，明朝卢老爷用石头垒城，硬邦邦一点不虚，老人叫它铁城。&quot;\u003cbr\u003e▌齐长城踏察爱好者 陈老师（58岁）：&quot;莱芜这段齐长城，顺着山脊走，石墙到现在还有一人多高，上头能站人。比八达岭那明长城早盖了八百年。城里还有个唐代的八棱经幢，刻着清官贾璞的事，一米多高。山、城、碑，都不说话，可都是老辈子的证。&quot;\u003c/p\u003e"}, {"n": "惠民老城·武定府衙与海子城", "s": "惠民", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e惠民古称乐安，为兵圣孙武之故里。北宋大中祥符八年（1015），武定军与州治于此建衙筑城，府城自此肇基；崇宁元年（1102），知州牛保督修城墙，环城挖濠引水，城内外渐成水塘罗列之势，人呼&quot;七十二海子&quot;，是北方少见的滨水古城。金元之际，此地升为府、路，明清相沿置武定府，府衙大堂庄严，衙前立诫石坊，镌&quot;尔俸尔禄、民膏民脂，下民易虐、上天难欺&quot;，为官者日夕可见。护城河7.2公里环城一周，河上吊桥晨启暮闭，城四角旧有望楼。清光绪间，魏氏于城郊建城堡式庄园，高墙数丈、碉楼四峙，融民居与防御于一体的格局全国罕见。今惠民古城墙两段残垣犹在，魁星阁巍然，府衙市声依旧，孙武的名号与这方水土的尚武之气一同传了下来。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e惠民老城是鲁北平原上一座宋筑方城，筑城取土留下七十二个坑塘海子，碧水环城。城北两段宋代夯土残墙高十二米许，墙顶可行。城内武定府衙重檐大堂前，诫石坊上尔俸尔禄民膏民脂八字至今清晰。\u003c/p\u003e\u003cp class=\"main-text\"\u003e武定府衙：北宋大中祥符八年（1015）肇建，历宋金元明清五代皆为州府治所，景区占地85亩、南北长220米、东西宽204米。府衙大门为广亮大门、硬山大式，穿诫石坊即大堂德正堂，面阔五间；坊正面题&quot;赐履雄风&quot;，背面刻宋太祖御制戒石铭&quot;尔俸尔禄、民膏民脂、下民易虐、上天难欺&quot;十六字，字口至今清晰，为告诫官员清廉而立；宋代古城墙遗存：北宋崇宁元年（1102）筑，今存东北角、西北角两段残墙约1500米，高10米许、底宽22米，夯层坚实，墙顶可行人。城东南角复建魁星阁，纳入宋城遗址公园；城内外故园海子、中海子、糖坊海子、马市街海子、北门大街海子五处水面与护城河相通，碧水环城；七十二海子：古城内外水塘星罗棋布，与护城河环城水系相连。今尚存故园海子、中海子、糖坊海子、马市街海子、北门大街海子五处水面，碧水环城。；孙子兵法城（孙武故里）：城北台基相传为孙武演兵处，为纪念兵圣所辟文化胜迹，台基夯土犹存。；魏氏庄园（国保）：清光绪十六至十九年（1890至1893）武定府同知魏肇庆所建城堡式民居，占地五十余亩、三进九院二百余间。外围城墙高10米、根基厚3.8米、顶宽1.5米，内以三合土掺糯米浆夯筑、外砌青砖，墙顶外侧垛口、内侧女儿墙、中留更道，壁周砌12个拱券形壁龛式射击掩体；东南、西北角各筑半突出墙体的三层圆形碉堡，每层正侧两面均凿射击孔。内宅阁楼与城墙顶以吊桥相连，客厅东西设暗道——东为壁橱式夹层藏护院，西为高窗顺软梯通墙外，天井石板铜钱纹地漏，与烟台牟氏庄园、四川刘文彩庄园并称中国三大庄园。\u003c/p\u003e\u003cp class=\"main-text\"\u003e护城河：环城七点二公里，旧时以吊桥出入。今多填为街或盖板，仅存几段水面。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌惠民府衙文保员 高师傅（64岁）：&quot;府衙大堂进门，先看见诫石坊那十六个字，&#x27;尔俸尔禄、民膏民脂&#x27;，古时候当官的一进二堂就得看一遍。城墙虽拆了大半，东北角西北角那两段还在，上得去，墙顶能走人。海子多得很，老人说七十二个，天旱不干。&quot;\u003cbr\u003e▌惠民老船工 胡大爷（76岁）：&quot;护城河绕城整整七里多地，我年轻时候撑着木船走船，河上能进盐船。孙武就是我们惠民人，写《孙子兵法》那位，城北有孙子兵法城。魏家的庄园更绝，整座城堡式的大院，围墙好几丈高，外人进不去。&quot;\u003c/p\u003e"}, {"n": "广饶老城·千乘乐安故地", "s": "广饶", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e广饶地处小清河北岸，古为齐地，西周春秋分属齐、纪等国，旧号千乘、乐安。西汉高祖六年（前201）始置广饶县，为山东有数的古县之一。相传兵圣孙武祖居乐安，&quot;食采&quot;于此，故广饶以&quot;孙武故里&quot;为荣。汉时此地多出良吏，汉武帝朝御史大夫倪宽居此，敷教劝农，其墓傍小清河而筑，古柏成行，&quot;倪冢秋烟&quot;遂为邑八景之首。北宋建炎二年（1128），邑人为祀关帝，建大殿于城中，单檐九脊，梁枋用材硕大，保存宋代木构原貌，为山东现存最早的木构殿堂；楼上清音、檐下斗拱，历经八百年风雨而屹立。境内傅家遗址出土大汶口文化遗物，其中一头骨见开颅手术愈合之痕，距今约五千载，为华夏医学史上一绝。今广饶老城街巷犹存旧制，南宋大殿兀立市中，孙武、倪宽的故事随着小清河水代代流传。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e广饶县城西北东营市历史博物馆院内，一座南宋建炎二年的全木构大殿独坐院中，面阔进深各三间，单檐歇山，是山东省现存最早的宋代木构殿堂。城南傅家村大汶口文化墓地里，五千年前的开颅术颅骨沉默作证，城北倪宽墓古木森森。\u003c/p\u003e\u003cp class=\"main-text\"\u003e乐安故城草桥遗址：孙武食采乐安之处，古乐安县治城址与草桥遗址可寻。为兵圣孙武的故里所在。；傅家遗址（国保，大汶口文化）：城南傅家村，大汶口文化鲁北类型遗址。392号墓墓主颅骨有近圆形缺损，边缘经考证已长出骨痂、术后长期存活，为中国所见最早开颅手术成功实例，五千年前的开颅术痕迹沉默保存于博物馆展柜中；倪宽墓：西汉御史大夫倪宽葬于城北，与西汉八博士墓成群。古木森森，秋烟缭绕，旧列邑中八景倪冢秋烟。；千乘古地名迹：西周春秋为齐千乘邑、乐安邑，齐鲁侯国旧壤。今地名犹存。；关帝庙山门与配殿（明清）：大殿两侧明清配殿山门犹存，与宋殿连为一组庙宇，近年修缮一新。；柏寝台遗址：春秋齐桓公大会诸侯处，夯土高台犹存，台上散落陶瓦残片。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南宋大殿（国保，关帝庙正殿）：县城西北东营市历史博物馆院内，南宋建炎二年（1128）建，坐北朝南，全木构，通高10.38米、东西阔12.63米、进深10.70米，月台高0.73米。面阔进深各三间，单檐歇山顶、绿琉璃瓦剪边，梁架为六架椽屋乳栿对四椽栿用三柱，用材合宋《营造法式》六等材；柱头与补间斗拱皆双下昂五铺作，室内四椽栿彻上露明造，原当心间施藻井、次间施平棋。原关帝庙春秋楼、三义堂、戏楼等皆毁，唯此大殿独存，今为孙武祠主体建筑，殿内关公像香火未断。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌广饶南宋大殿守庙人 崔师傅（62岁）：&quot;这座大殿是宋朝建炎二年立的，山东头一份的木构老殿。你看那大梁、那斗拱，都是老料，八百年没换过。殿里供关公，香火一直没断。老人断言，这木头、这房架，比啥碑文都实在。&quot;\u003cbr\u003e▌广饶老教师 孙老师（67岁）：&quot;我们广饶是孙武故里，老人家说孙武&#x27;食采乐安&#x27;，乐安就是这地方。小清河边上倪宽的墓，种着古柏，到秋天一片青烟，叫&#x27;倪冢秋烟&#x27;，上了县志的八景。前几年傅家出土一副头骨，上头有动过开颅手术又长好的印，五千年前就有这手医术哩。&quot;\u003c/p\u003e"}, {"n": "沂源老城·沂河源头的织女之乡", "s": "沂源", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e沂源地处鲁山南麓、沂河正源之侧，山高林密，溪泉四布。此地古属姑幕、东安之境，山水清幽，遂生牛郎织女之传。大贤山崖壁间，织女洞倚崖而凿，洞内织女像端坐，相传可望河东；隔沂河相望，明代万历七年（1579）立牛郎庙与之应和，两相唱和，形成了这一带独有的&quot;牛郎织女实景群&quot;，被视为传说与山水相应的核心传承地。宋代，道人在山中建神清宫，香烟袅袅，与大贤山织女洞一同守护这片仙缘之地。山中更有一株九百余年的银杏，雌雄异株相抱，叶腋竟能结籽，为全国唯一，人称&quot;叶籽银杏&quot;；每年秋深，满树金黄，观者如堵。此地又是沂河之源，泉水自山根涌出，汇为清溪，一路东去；而角度不整合面那一道斜斜的岩层界线，恰为亿万年地壳运动留下的褶皱天书。今沂源县城依河而建，牛郎织女的传说与叶籽银杏的奇观，依然鲜活在这方山水间。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沂源地处沂河源头，燕崖镇大贤山东北麓四十米高的悬崖上凿着织女洞，石窗石龛分上下两层；隔沂河对岸牛郎官庄有明万历七年所建牛郎庙。迎仙观下一株九百余年古银杏，种子偏偏结在叶片上——全国仅此一株。\u003c/p\u003e\u003cp class=\"main-text\"\u003e织女洞（省保）：燕崖镇大贤山东北麓约40米高的悬崖峭壁上，天然溶洞因溶蚀而成，围岩为寒武纪砂质灰岩、下伏古老片麻岩呈角度不整合。洞高约8米、宽7米、长约10米，洞口嵌二层楼阁式建筑，青砖灰瓦、朱门绿窗，门楣镌&quot;织女仙洞&quot;四字，远望若空中楼阁。洞内分上下两层，西北隅有天然巨石形似石鼓、轻敲声韵浑厚，藏宋元明清碑刻，年代最早者上溯宋代；洞口外峭壁上镌清光绪二十一年（1895）沂水知县白锡元手书&quot;钟灵毓秀&quot;四个大字，字高约4米、宽约1米，另存&quot;与山并永&quot;碑与杜牧《秋夕》题刻；叶籽银杏（全国唯一）：大贤山迎仙观下，树高约26米、胸围3.5米、树冠覆阴近300平方米，树龄九百余年。普通银杏种子生于果枝，此株东北方向一枝却有约两成果实结在扇形叶片顶端边沿，其余为正常果与异形果各占一部分，为全国仅见的变异银杏，专家认为是植物返祖现象。1962年山东林校师生来此首次发现，今专人管护，秋深满树金黄与青砖古观相映；迎仙观九重塔：织女洞南，金代全真教石塔，九层八面。传为唐代道士张道通修炼羽化处。；神清宫：宋代道观，深藏山中，殿宇古朴，为道教胜迹。；角度不整合面（地质奇观）：沂源一带岩层角度不整合面典型出露，为地质教科书经典剖面，岩层褶皱错断清晰可见。；沂河源：沂河发源于此，泉涌成溪，东流入海。源头水潭清澈，水草丰茂。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e牛郎庙：隔沂河与织女洞遥遥相对，牛郎官庄村北。明万历七年（1579）建，原系二层楼阁式建筑，青砖碧瓦，彩绘斗拱。殿内塑牛郎及其子女像，旁卧金牛塑像。后圮毁，仅存碑碣十余通。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌沂源大贤山下老农 赵大爷（73岁）：&quot;我们织女洞、牛郎庙，一个在河西一个在河东，老辈子传下来的对景。每到七月七，四面八方的都来烧香，说这对夫妻一年一回会。洞里那织女像，石头刻的，眉眼还清亮。山里的道理，就靠这传说传着。&quot;\u003cbr\u003e▌沂源银杏树护树人 董师傅（61岁）：&quot;这棵银杏九百年了，别的银杏结籽长枝上，它倒好，叶子当间儿也结籽，全国就这一棵，独一份。夏天一蓬绿，秋天一地金，大贤山的织女洞就在上头。沂河就从山肚里淌出来，清清亮亮，浇了我们几辈人的地。&quot;\u003c/p\u003e"}, {"n": "章丘老城·百脉泉城的千年气韵", "s": "章丘", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e章丘地当泰沂山北麓与鲁中平原之交，地下泉脉丰沛，百脉泉群涌如沸，与济南趵突泉并称&quot;二泉&quot;。西汉初，于此置东平陵县，为济南郡治、济南国都，是山东早期的都会之城；故城夯土墙垣、宫殿台基历历可考。宋代，婉约词宗李清照相传生于章丘，其词清丽婉转，后世遂以&quot;漱玉&quot;名其文，绣江河畔的旧泉旧柳，犹带几分词人的清气。章丘又是铁艺之乡，匠人世代抡锤打铁，锅薄如纸而火候匀称，&quot;章丘铁锅&quot;的名声随厨火传遍四方。城西北女郎山如屏高峙，山麓泉流如练；城子崖遗址更是中国史前考古的圣地，龙山文化由此得名。今章丘老城街巷犹存，百脉泉日夜涌珠，铁匠铺的叮当声与词人遗韵交织，是齐鲁大地上少有的水火相济之城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e章丘南部山陵起伏、北部平原舒展，百脉泉群自明水城下喷涌成池，城子崖与东平陵两座夯土古城静卧田野，齐长城石墙沿南山脊线蜿蜒。李清照故里的泉池碑石与章丘铁锅的灶火同落一城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e百脉泉（济南七十二名泉之一）：明水城区百脉泉公园内，长方形青石砌垒泉池，长近30米，东西向架一虹桥，池岸与虹桥皆围雕刻石栏。池底无数气泡自泉脉串串浮上，冬日常见泉气蒸腾如烟，池北壁嵌清末&quot;百脉泉&quot;三字石刻，与趵突泉并称；东平陵故城（第六批全国重点文保）：龙山镇阎家村北田野间，城略呈方形、边长近两公里，四周夯土城墙犹存，尤以西墙最完整，残高约5米，墙基宽达三四十米、顶宽可容车。城内北为宫殿台基，南部探出冶铁作坊遗迹，民谣谓&quot;先有平陵城、后有济南府&quot;；城子崖遗址（第一批全国重点文保）：龙山文化命名地，今为国家考古遗址公园。龙山文化城平面近方形，东西宽约430米、南北最长530米、面积约22万平方米，城墙多挖基槽夯筑。西城垣保护展厅内，十数米高的夯土城墙剖面色分三层——自下而上龙山文化整体夯、岳石文化两侧夹板夯、周代夯筑，三城叠压一门三道。出土蛋壳黑陶杯黑如漆、薄如纸，杯高约26厘米、口径9厘米，器壁最薄处仅0.2毫米，杯柄透雕花纹，内壁酒石酸痕迹证实为先民祭祀礼器；李清照故里（清照园）：明水百脉泉畔，1997年建成开放，园内漱玉堂、吟风榭临泉而建，立李清照塑像，园东青石栏杆内立李格非《廉先生序》碑复刻。章丘为李清照祖籍。；女郎山：绣惠街道（旧章丘县城）城北，一山横列如屏，旧为邑人登高揽胜之地，山下泉流汇为泽国。；章丘铁锅（国家级非遗）：旧时东关、明水一带铁匠铺林立，经数万次人工捶打成锅，锅面如镜、薄而匀热，今作坊仍在老城中传承，炉前可围观铁匠抡锤。；齐长城章丘段（锦阳关）：文祖街道与莱芜雪野街道交界山脊上，现存关楼为2005年依原址以西复建，关西侧石砌城墙长约七百余米，高五六米，垛口瞭望孔保存完好，沿山脊蜿蜒于群峰之间。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌章丘老铁匠 郑师傅（68岁）：&quot;我们家三代打铁锅，锅要打七十二锤，锅底厚一点、锅沿薄一点，受热才匀。百脉泉就在城边上，泉眼多得很，清早冒热气，冬天也不封。老人说李清照就生在章丘，那才女给咱这地方添了文气。&quot;\u003cbr\u003e▌章丘平陵城老住户 王老师（60岁）：&quot;平陵故城是汉朝济南国的都城，城墙土夯的还有好几段，村里老人都说底下埋着宫殿。城子崖那头挖出过黑陶，是我们的祖先龙山文化起的名字。章丘这地方，地下是王都，地上是泉城，锅里还响着铁器的叮当。&quot;\u003c/p\u003e"}, {"n": "博山老城·颜神古镇的炉火之城", "s": "博山", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e博山旧称颜神，得名于孝妇颜文姜。相传文姜事姑至孝，山水为之感动涌泉，后世于城南立祠以祀，历北魏、唐宋而香火愈盛，孝妇河绕祠而流，遂以孝水名之。自宋元始，此地因山中瓷土、石英与薪炭之利，渐成窑场；明清两代，琉璃、陶瓷业大兴，博山琉璃以&quot;内画&quot;&quot;料器&quot;名闻天下，曾充宫廷御用，炉火三百年不绝，遂为北方琉璃之都、陶瓷重镇。城中孝妇河清波东去，两岸古窑、坯房、铺面沿河而起，山头窑、颜神古镇的街巷依山起伏，青石屋瓦之间，窑烟与市声相杂。至清末，博山已烟火万家、商贾云集，&quot;颜神&quot;之名在传统工艺的炉火里越烧越亮。今博山老城古建与新市并存，颜文姜祠大殿巍然，琉璃炉火依旧，是一座以手艺和孝道名世的古城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e博山旧称颜神镇，四周群山环抱，孝妇河自凤凰山下灵泉发源穿城北去。山头、大街一带古窑群与匣钵墙沿河散布，琉璃炉火自元明延续至今，是一座被窑火映红了数百年的山城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e颜文姜祠（第六批全国重点文保）：山头镇南凤凰山麓，祀孝妇颜文姜。正殿俗称无梁殿，立于石砌高台基上，面阔3间17.2米、进深3间18.6米、高约15米，单檐歇山顶，前设木构卷棚抱厦；梁架不用主梁，以悬挑叠造、四根斜柱撑一根龙形雷公柱，上置八角放射状斗拱承托屋面，外檐斗拱八铺作重翘三昂、层层挑出，角檐悬风铃，顶覆琉璃瓦、脊饰螭吻垂兽。原殿四壁皆木雕槅扇，清初本镇人内秘书院大学士孙廷铨恐年久侵损，以砖石围筑东、西、后三面，并增建殿前卷廊；殿内脊顶留&quot;顺治丁酉&quot;&quot;民国拾叁年&quot;重修墨书。殿前院中心灵泉方池约7米见方，周护兽雕石栏，泉自殿基下涵洞涌出；博山琉璃（国家级非遗）：大街遗址曾出土国内最早琉璃炉。今山头颜神古镇内，古圆窑、匣钵墙、青石板巷沿街犹存，窑壁以烧过的匣钵片垒墙、青砖黛瓦间窑烟痕迹犹深；十三座明清古圆窑有的被改作民宿与展览空间。琉璃工坊每日午后开炉，老师傅就着炉火烧料吹制鸡油黄、金红各色料器，可近观；孝妇河（古称孝水）：河源即颜文姜祠灵泉，出殿后北流穿博山城，经淄川、张店入小清河。今河两岸砌为滨水步道，水清见底，人家枕河而居。；古窑遗存与陶镇：沿河老厂房、隧道窑遗址改造为陶琉展示与体验空间，十三座明清古圆窑有的被改作民宿与展览空间，窑壁匣钵垒墙，青砖黛瓦间窑烟痕迹犹深，为博山因瓷因陶而兴的实物见证。；山头窑与颜神古镇（明清街巷）：山头街道古窑村一带，老街依山就势，石屋、窑房、琉璃铺面鳞次栉比，石板路上犹闻当年炉火气息。；文姜泉与泉眼群：祠前院灵泉涌流，水质清冽，古来供窑场与民饮用，泉出即为孝妇河正源。近年水位下降，现以管道人工循环补水。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌博山琉璃老艺人 孙师傅（70岁）：&quot;我们博山是琉璃之乡，明清给宫里进贡，炉火从来没断过。祖上的手艺，吹料、内画，一样样传到今天。孝妇河从城里过，老人说是孝妇颜文姜的眼泪化的，水清得很。颜文姜祠里的老碑，立了几百上千年。&quot;\u003cbr\u003e▌颜神镇老窖户 周大爷（75岁）：&quot;颜神这名字，打孝妇颜文姜来。祖上就在山头窑烧陶，窑炉一开就是一天一夜。老街石屋、坯房，顺着山势一层一层，到了晚上炉火映红半边天。现在琉璃灯、料器还卖到外头去，手艺没丢，人也没散。&quot;\u003c/p\u003e"}, {"n": "潍县老城·白浪河畔的板桥之城", "s": "潍县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e潍县地处白浪河东西，古为北海重镇，明清为五县通衢、商贾云集。乾隆年间，郑板桥出任潍县知县，勤政爱民，赈济饥民，又擅书画，尝书&quot;难得糊涂&quot;&quot;吃亏是福&quot;，墨迹至今传世，潍县因之文风大盛。清道光时，金石学家陈介祺归隐潍县，筑十钟山房、万印楼，著录金文印谱，金石之气冠绝齐鲁，潍县遂有&quot;金石之邦&quot;之誉。光绪十一年（1885），邑人建十笏园，仅十笏之地，却曲水回廊、亭榭错落，成为北方私家园林之绝品。潍县城自明筑砖城，白浪河沿城而流，两岸商市繁盛；清明前后，城头纸鸢如云，潍县风筝、杨家埠年画名闻天下，是北方民间艺术的渊薮。今潍县老城街巷与白浪河桥市相映，十笏园、万印楼依旧，郑板桥的风雅、风筝的飞扬一同装点着这座胶东老城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e潍县老城横卧白浪河两岸，河西城里城作龟形、河东东关形如长蛇，青砖墙与通济门、奎文门隔河相望。胡家牌坊街的十笏园藏在闹市，风筝年年春日飞满城头，是一座风雅与烟火兼得的胶东老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e十笏园（第三批全国重点文保）：潍城区胡家牌坊街，坐北朝南，青砖灰瓦砖木结构，南北深约70米、东西宽约50米、占地3430平方米，喻若十块笏板。园内中东西三轴线展开，假山、鱼池、曲桥、回廊串联34处亭台楼榭、67间房，菱形院门额嵌&quot;鸢飞鱼跃&quot;刻石，池北立太湖石&quot;镂云峰&quot;为对景。主体砚香楼为明代遗构、二层两开间五檩硬山楼房，楼前月台、圆窗方台，楼上门窗外有前廊设栏杆，原为园主藏书读书之所；潍县城墙遗存与城门（明清，山东省文保）：白浪河东岸东关城墙，三合土夯筑外包青砖，现存奎文门段、通济门段、古炮台段共千余米。奎文门为1988年原址修复的三层门楼，顶层悬&quot;鸢飞鱼跃&quot;木匾，登城可俯瞰白浪河与老城街衢；郑板桥治潍遗踪：清乾隆年间郑板桥知潍县七年，开仓赈灾、修城办学，“难得糊涂”“吃亏是福”皆出于此任。今十笏园、郑板桥纪念馆内藏其诗文碑刻。；杨家埠木版年画与风筝（国家级非遗）：寒亭杨家埠作坊古街犹存，清代年画作坊与风筝扎作铺连片，清明时节纸鸢满天，年画作坊内仍可看木版套色印刷。；白浪河（穿城大河）：自南而北纵贯潍县旧城，分城为东西两岸，今河两岸辟为白浪绿洲湿地公园，桥市相望。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e万印楼（山东省文保）：潍城增福堂街陈介祺故居，原宅第近万平方米大半不存，今仅存临街万印楼、北屋十钟山房、南厅三座。万印楼建于清道光三十年（1850），坐东朝西、砖木硬山、面阔五间两层，底层明间辟门、上层洞开圆窗，木楼梯自底层南端而上；楼壁嵌1992年省保刻石，朱漆大门上方悬刘海粟题&quot;万印楼&quot;匾。1952年因潍坊三中扩建险遭拆除，1993年辟为陈介祺故居陈列馆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌潍县老城居民 马老师（64岁）：&quot;我们潍县出过郑板桥，他在咱这当县令，&#x27;难得糊涂&#x27;就是他那会儿写的，现在人人都念叨。白浪河东西两岸，桥连着桥，城墙上清明放风筝，满天都是纸鸢。十笏园小是小，曲曲折折一院子景，评书里都讲。&quot;\u003cbr\u003e▌杨家埠年画匠人 于师傅（71岁）：&quot;杨家埠做年画、扎风筝，从我太爷爷那就干这行。木板刻的，上色印，一张张都讲究。潍县城头放风筝是老规矩，风一起，咱们的风筝飞得最高。郑板桥题过字的老碑也在，城里的老味道，全在这手艺里。&quot;\u003c/p\u003e"}, {"n": "诸城老城·超然台下的龙城", "s": "诸城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e诸城古称密州，潍河、扶淇河交汇抱城。北宋熙宁七年（1074），苏轼知密州，次年于城北筑超然台，作《超然台记》以自遣，又于台上命笔，写下《江城子·密州出猎》等雄浑词章，密州山水因之而显。南宋以后，诸城为州为县治所，明清筑南阳城，城周濠堑犹存。此地向为琅琊望族世居之地，秦汉以来豪杰文士辈出，古墓群与碑刻散在乡野。更奇者，城西恐龙涧一坡剖面，白垩纪地层中恐龙化石密如层积，出土巨型鸭嘴龙等大量标本，个体之完整、埋藏之集中为世所罕见，遂有&quot;中国龙城&quot;之誉。今诸城老城街巷旧韵尚存，超然台踞城头俯瞰潍水，台前石刻默对远去时光；恐龙化石早已名动海内，为这座古城添上一道地层的天工奇笔。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e诸城地处鲁东南丘陵，潍水与扶淇河绕城而过。城北超然台复建于老城墙上，城南常山雩泉仍在石缝间涌流，城东南恐龙涧的冲沟里密集嵌着整块斜坡状化石壁。一座文人与巨兽同栖的老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e超然台（北宋熙宁八年苏轼重修）：密州街道旧城北城墙旧址附近，2007年秋在原址西南百米外开工、2010年1月落成，按原规模三倍扩建。台高10.74米、长160米、宽28米，占地二十余亩、建面7000平方米，台上建仰苏堂、慕贤亭与东西庑房，台内辟两层苏轼纪念馆，陈列苏轼在密州原迹刻石与《超然台记》。苏轼熙宁八年知密州时修葺旧台，苏辙取老子&quot;虽有荣观，燕处超然&quot;意名之，《水调歌头·明月几时有》即作于此；诸城恐龙化石群（白垩纪晚期）：龙都街道库沟村恐龙涧，距市区约十公里，化石长廊长近50米、深数十米，整块斜坡状岩层上密集裸露恐龙骨骼化石近万块，原址露天展示，骨骼嵌在红褐砂岩中层层叠压。臧家庄化石层叠区七层地层剖面层层相叠，暴龙馆内展巨型诸城暴龙与华丽羽王龙骨架；常山雩泉与黄茅冈：城南山常山北坡，苏轼熙宁八年祈雨所得石泉，泉方井、凿痕宛在，2008年重建雩泉亭，旁立《雩泉记》碑。黄茅冈在常山东南，今梯田果林，东坡狩猎园群雕再现“千骑卷平冈”。；潍河与扶淇河：二水于密州城南交汇环抱，今河上架桥，两岸遍植林木，桥影人家散落。；苏轼密州遗踪：苏轼知密州两年余作诗文两百余篇，《江城子·密州出猎》《江城子·十年生死两茫茫》《水调歌头》《望江南·超然台作》称密州四曲。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南阳古城（明清诸城旧治）：旧南阳城墙1948年逐步拆除，仅西南角楼处残垣一角犹存，老街巷格局尚可寻。苏轼“试上超然台上看，半壕春水一城花”即此城。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌诸城老居民 徐老师（66岁）：&quot;苏轼在诸城当过太守，超然台就是他修的，还亲笔写了《超然台记》，城北那个台子老地方还在。他在这儿写过&#x27;老夫聊发少年狂&#x27;，那是打猎的词，写得豪气。南阳古城墙还有几段，潍河从城边过，风景老好。&quot;\u003cbr\u003e▌恐龙涧讲解员 刘师傅（59岁）：&quot;恐龙涧这块地，挖出来的恐龙化石一层压一层，那大鸭嘴龙有十几米，骨架现在是咱的镇馆之宝。老人说这是龙的故乡。诸城老城这边，苏轼的文脉，恐龙的骨气，一座城占了古今两样奇，少见得很。&quot;\u003c/p\u003e"}, {"n": "安丘老城·渠丘古国的酒乡", "s": "安丘", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e安丘古称渠丘，潍汶之间、山水秀美。春秋之际，此为莒、齐交界之地，孔门弟子公冶长隐居于此，博学能识鸟语，被孔子许为贤婿；后人于其读书之地建书院、植古柏，弦诵之音相沿千年。秦以迄明，安丘或为侯国、或为县治，城池屡有兴废；明清筑安丘城，砖墙围合，街巷规整。此地又与酒结缘，景芝古镇酿酒之艺源远流长，古法酿造、泉水为引，酒香弥漫乡里，明清之际已是齐鲁知名的酒镇。城西南青云山如屏峙立，汶河绕城而流，山水环村，田畴沃野。今安丘老城街巷旧韵尚存，公冶长书院的古柏依旧，景芝酒坊的青烟长袅，是一座把书香、酒香、山光水色沏进同一杯的老城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e安丘地处潍汶之间，城顶山前坡公冶长书院双银杏擎天，山顶齐长城石墙沿山鞍蜿蜒，东南景芝古镇酒旗依旧。一座弦歌与酒香同传的鲁中古城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e公冶长书院（山东省文保）：石埠子镇城顶山前坡，三面环山、一谷东去。公冶祠坐北朝南，正殿三间、朱柱青瓦，堂内塑公冶长坐像，东西耳房各一间，院内东西两边各立明清碑亭。院门前两株古银杏东雄西雌，相距7.5米、高近30米、胸围约7米，树冠东西28米、南北25米、占地670平方米，枝相交、根连理，相传为公冶长夫妇手植，号&quot;天下第一夫妻树&quot;，2023年入选全国十大最美古银杏；景芝古镇与酒坊（明清）：安丘东南景芝镇，齐鲁三大古镇之一，古有七十二座烧锅。镇南校场烧锅遗址青砖古灶尚存，“酒之城”仿汉城堡式建筑内展黑陶酒器至今芝麻香酒酿造工艺。景芝白乾、景阳春为鲁酒名品。；城顶山齐长城（春秋战国，全国重点文保）：城顶山山顶鞍部，石包土版筑，现存可见残墙约800米，墙基宽5至8米、残高1至2米，多被灌木杂草覆盖；墙体之上叠压1943年于学忠部抗日战壕与掩体，春秋石墙与战时工事层层相叠；青云山：城西南，山峦如屏临城，旧为邑人登览胜地，今辟为民俗游乐园。；汶河：绕城东去，桥渡相连，两岸田畴沃野。；安丘古城旧迹（明清）：老县城城墙城门多已不存，老街地名与街巷格局尚有痕迹可寻。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌安丘公冶长书院守护人 赵师傅（65岁）：&quot;公冶长是孔子的学生，能听懂鸟语，孔子还把女儿嫁给他。书院里那几株老柏，传说从那时候就有了，粗得两人抱不过来。老人家逢节还来上香，说这是读书人的根。&quot;\u003cbr\u003e▌景芝酒坊老酿酒工 孙师傅（69岁）：&quot;景芝的酒，用的是祖上传下的老曲，泉水一处一处选，火候一分一分守。酒坊里窖池一排排，老辈人说这手艺传了不知多少代。安丘有山有水有书院，又有这酒，日子过得有滋有味。&quot;\u003c/p\u003e"}, {"n": "胶州老城·板桥古镇的海风", "s": "胶州", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e胶州地处胶州湾之滨，古称黔陬、板桥，是山东半岛最早走向海洋的古港之城。唐代，板桥镇已为北方大港，商舶云集；北宋设市舶司于此，专管海外贸易，金元相沿，是当时海上丝绸之路的重要起点。元世祖为省漕运之劳，凿胶莱运河以通胶州湾与莱州湾，虽后壅塞，古河道遗迹犹存，见证着古人通江达海的雄心。境内三里河遗址，出土新石器时代遗物甚丰，石器陶器精美，是胶东史前文明的重要一环。明清以来，胶州为州为县，板桥古港虽渐趋沉寂，然少海渔汛、沽河舟楫，海边的日子从未停歇。今胶州老城街巷旧韵犹存，市舶司与古港的故事随海风传讲，三里河的石器与胶莱运河的波痕，共同守着一座千年海城的记忆。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e胶州地处胶州湾北岸，老城区地下埋着宋代板桥镇的铁钱与瓷片，城南三里河村下压着大汶口与龙山叠压的两文化层，少海水面上复建的市舶司、高丽亭馆临水而立。一座把“海”字写进千年的胶东老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e板桥镇遗址（第七批全国重点文保）：今胶州老城区地下，北宋元祐三年（1088）设市舶司，为北宋八大市舶司中唯一地处北方者。1996年冬常州路市政府宿舍工地在距地表1.6米深处掘出大块锈结铁钱，最大一块重约14吨，钱文&quot;圣宋元宝&quot;&quot;大观通宝&quot;清晰可辨；历年发掘另得30余吨铁钱与数以万计北宋各窑系瓷片，揭出房基、庭院、廊道、散水、隔墙、亭台等青砖砌筑的北宋大型建筑基址。少海景区2015年复建市舶司、高丽亭馆、榷场、水师营等仿宋建筑，青石板街临水成市；胶莱运河（元明开凿）：元至元十七年凿，南自胶州湾、北接莱州湾，贯通山东半岛。今河道仍在，仅作排洪灌溉之用，不复通航，故道堤岸与清代闸子集桥残迹尚存。；胶州老城旧迹（明清）：旧城墙城门多已不存，板桥镇遗址即埋于今老城地下，老街巷格局尚可寻。；少海（胶州湾畔）：古称少海，今为少海湿地公园，长堤连湖心岛，潮平水阔，为古港遗韵所在。；沽河与胶州湾：诸河汇流入海，旧为舟楫往来之地，今沿海渔船与养殖池错落。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e三里河遗址（全国重点文保）：三里河街道北三里河村，东西宽约200米、南北长约250米。1974、1975年两次发掘，下层大汶口文化（距今约4500年）出房址5处、墓葬66座，上层龙山文化（距今4300至3800年）出墓葬98座，两文化层直接叠压，确证承继关系。出土薄如蛋壳的黑陶高柄杯经修复完整者25件，一件高20厘米、仅重39克，另出黄铜钻形器；发掘后原址回填保护，地表今为农田。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胶州老城居民 高老师（65岁）：&quot;我们胶州老名叫板桥，宋代就设了市舶司，管海外买卖，是北方的大商港。老城墙、老城门虽然拆了，街巷还在，老辈人讲海船进港的盛景，一讲就是半晌。少海就在城边，潮起潮落，从古到今。&quot;\u003cbr\u003e▌三里河文保员 王师傅（61岁）：&quot;三里河那遗址挖出的陶器，黑陶、玉器，样样精致，是新石器时代先民留下的。胶莱运河是老元朝凿的，想通胶州湾和莱州湾，河床那遗迹还在。胶州这地方，一面是海，一面是河，几千年的水路都从这过。&quot;\u003c/p\u003e"}, {"n": "莘县老城", "s": "莘县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e商代名相伊尹，辅佐成汤灭夏，史载其早年&quot;耕于有莘之野&quot;\u003c/strong\u003e，有莘氏即在此地，莘县之名由此而来，此地正是这位商朝开国名相的人生起点。北宋治平元年（1064），始建燕塔，金天眷二年（1139）建成，十三级楼阁式青砖木柱塔，通高66.7米。元末明初局势动荡，明代立国后重修文庙，明洪武三年（1370）建莘县文庙，梁柱存元末明初木柱。\u003cstrong class=\"hl\"\u003e明成化十九年（1483），知县贾克中始筑土城\u003c/strong\u003e，弘治十三年重筑，城墙周围1633丈，设四门：东永清、南闪里、西大有、北伊田（伊田因伊尹得名）。崇祯五年（1632），知县孙愈贤增建城楼4座、敌楼29座，另筑外城四门：东定海、南阜民、西通津、北迎恩。\u003cstrong class=\"hl\"\u003e1968年，燕塔在特殊年代被拆毁\u003c/strong\u003e，2006年按原貌重建。今莘县老城已融入现城区，城门城墙大都无存，而&quot;伊尹耕莘&quot;的典故流传至今。明代城池四门（永清、闪里、大有、伊田）与城楼敌楼早已无存，今县城扩建吞没旧城，唯有&quot;伊田&quot;等城门旧名还嵌在老地名和新街名里，记着那座依伊尹而名的古城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e莘县地处鲁西黄河故道平原，城中心燕塔凌空，商业街东段文庙大成殿尚存明初木构，城北四公里莘亭镇野地里立着“莘亭伊尹耕处”碑。一座由商汤贤相与北宋名相共同写进地标的老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e莘县文庙（山东省文保）：县城商业街东段，明洪武三年建，原棂星门、大成殿、明伦堂、名宦乡贤二祠俱备，现仅存大成殿。殿建台基上，面阔五间、进深三间，单檐歇山顶，殿内檐柱金柱硕大，梁架存元末明初大木作遗风。院内今存泮池、状元桥与百年藤柏。；莘亭伊尹耕处：莘亭镇大里王村西，城北约四公里，传商代伊尹躬耕有莘之野。清康熙年间东昌知府程光珠书“莘亭伊尹耕处”碑，1995年重建莘亭移碑亭中，辟为乡野小景。；王旦墓与三槐堂故地：东鲁街道群贤堡村，北宋名相王旦葬此，其父王祜手植三槐、预言子孙必兴，“三槐堂”遂成王氏郡望。墓为省级文保，城内原三槐堂旧址今存清道光年间重修碑。；韩氏家族墓地（国保·唐末）：董杜庄镇梁丕营村北，唐末魏博节度使韩允中及其父韩国昌家族墓地，占地约五千八百八十平方米，神道石刻高大雄伟，石人石马石羊文武翁仲列于甬道两侧，碑体碑冠整石雕出、通高六点五米、宽二点一米、厚零点七四米，下负龟趺，为鲁西南现存最完整唐末神道。；孟洼遗址含汉墓群（省文保·汉）：朝城镇西孟庄村北，占地约一千零二十五万平方米，为汉代大型聚落与墓群复合遗址，文化层堆积厚，历年出土陶俑、画像砖、青铜器，2006年公布省保。；马陵古战场遗址（市文保·战国）：大张家镇马陵村，公元前341年孙膑减灶诱杀庞涓处，现立齐魏马陵战址纪念碑一通，周围田野仍可见古道沟堑痕迹，村名沿两千三百年。；鲁西北革命烈士陵园（省文保·国家级抗战纪念设施）：大王寨镇东丈八村西北，1946年鲁西行政公署修建，占地三万五千平方米，由门楼、纪念塔、纪念室、烈士墓组成，纪念塔高十八米、四面八角楼阁式，2015年入选第二批国家级抗战纪念设施名录。；朝城清真寺（市文保·明永乐五年）：朝城镇北街路西，占地两亩余、建筑面积五百四十平方米，坐西朝东，大门面阔三进石木结构、大木起脊重檐歇山斗拱飞檐，礼拜殿三梁九檀歇山双檐砖木，明永乐五年始建、清康熙重修，为鲁西大型清真寺之一。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e燕塔（山东省文保）：莘县城中心，北宋治平元年奠基、金天眷二年落成，八角十三层楼阁式砖塔，每层四门、斗拱券门。旧塔1968年拆毁，2009年原址依原式重建，通高约九十米，保持八面十三层，宋式装饰，塔顶四面设佛像与佛龛，塔内今装电梯可登。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌莘县老城居民 刘大爷（72岁）：\u003cbr\u003e&quot;我小时候那老城墙还在，城门楼子挺高，北门就叫&#x27;伊田&#x27;，大人说那名字是纪念伊尹的。后来燕塔也拆了，2006年又按老样子盖回来，老辈子人看了都说跟从前一个模样。&quot;\u003cbr\u003e▌文庙看门老人 张师傅（66岁）：\u003cbr\u003e&quot;文庙那大柱子是元朝的木头，粗得很，几个人才抱得过来。老人传，孔庙拜完再来拜伊尹，一文一武、一圣一相，莘县这两尊神都占全了。&quot;\u003c/p\u003e"}, {"n": "冠县老城", "s": "冠县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋时晋有冠氏邑，汉置馆陶县，隋大业二年（606）于此筑北馆陶城，称&quot;龟背城&quot;、街道呈丁字断头布局。\u003cstrong class=\"hl\"\u003e北宋景德元年（1004），辽国萧太后南下驻兵屯粮，在冠县筑萧城营垒\u003c/strong\u003e，建正方形城堡，边长1250米、总面积169万㎡，史称&quot;萧城&quot;、民间称&quot;盔安城&quot;。金元明清历朝，北馆陶城为馆陶县治，三关四街格局延续千年。清道光年间，武训行乞三十余年、积资办义学，成为震动朝野的&quot;千古奇丐&quot;。冠县老城别称&quot;卧牛城&quot;，城墙宽三丈、高二丈九尺，设敌台14座，四门分别为崇明、纯化、阜成、永安。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e冠县地处鲁西平原，北馆陶镇两座土城相望：一座是北宋辽萧太后屯兵的萧城，夯土高墙残立田野；一座是隋代始建、丁字断头街保留至今的北馆陶故城。柳林镇武训祠松柏森森。一座县城藏着两座千年土城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e萧城遗址（第七批全国重点文保）：北馆陶镇东南萧城村，北宋景德元年辽萧太后攻宋时驻兵屯粮所筑。城近方形，边长约一千三百余米，夯土城墙基宽约二十六米、顶宽约八米，现存残高最高约十三米，四门附瓮城、扭头门，城外城壕犹可辨识。城内点将台夯土高约五米、夯层清晰，饮马井、磨盘洞遗迹可寻。长城以南现存规模最大的契丹古城。；北馆陶故城（隋代始建）：北馆陶镇驻地，隋大业二年建馆陶县城，城作龟背形，城中心丁字路口高出四周数米，街巷多丁字断头，十字街肌理至今可见。城墙多已不存，仅东南角残存一段夯土。；冠县老城四门传说：老城墙四门题名崇明、纯化、阜成、永安，民间以卧牛城呼之。城墙虽无存，四门名称与卧牛传说流传至今。；武训祠与武训纪念馆（山东省文保）：柳林镇南街东首，清光绪二十九年始建，现存大殿歇山式砖木结构、面阔五间进深三间，与武魂亭、高歌台、百米碑廊、墓体（墓高约两米）、义学正牌坊同处一院。武训行乞三十余年积资兴学，为以乞丐身份载入正史第一人。；查拳发祥地：查拳相传明代西域人查密尔传于冠县，此后在冠县、聊城一带流传，为北方著名拳种。；中共鲁西北地委旧址（省保·清末民初）：县城南街红旗南路西，原冠县童文书馆，硬山起脊青砖瓦房、抬梁式结构，现存三处院落十六座单体建筑，占地三千三百余平方米，格棱门窗古朴。1938至1946年为鲁西特委、鲁西北地委驻地，宋任穷、段君毅、赵健民曾在此办公。；堂邑故城遗址（市保·隋）：定远寨镇千户营村，隋代堂邑县城，隋末宇文化及杀炀帝后据此为营垒与瓦岗军对垒，城址埋于今村野之下，旧为交通要塞兵家必争之地。；斜店村古驿站遗址（市保·宋）：斜店乡斜店村，宋代南北驿道驿站所在，村名与驿传旧迹相沿，为冠县境内少有的宋代驿站地面遗存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌萧城村老农 崔大爷（70岁）：\u003cbr\u003e&quot;萧城那土城墙可厚了，能并排跑好几辆大车。老人讲是辽国萧太后屯兵修的，城里还有两眼饮马井、两处点将台，说是当年萧太后点兵用的。土城上长满了酸枣棵，我们去放羊常在上面跑。&quot;\u003cbr\u003e▌北馆陶街坊 赵婶（65岁）：\u003cbr\u003e&quot;咱这街跟别处不一样，全是丁字头、走不通的断头胡同，老人说这就是老县城的&#x27;龟背&#x27;样，故意这样的，防贼一进来就迷路。沿街那些门面，还是从前的老木头铺子。&quot;\u003c/p\u003e"}, {"n": "茌平老城", "s": "茌平", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e秦置茌平县，因城东&quot;茌山&quot;平地起高而得县名\u003c/strong\u003e，迄今2200余年。战国末，齐人鲁仲连善谋略，在聊城以一封箭书劝退燕军守城将，传为&quot;一箭书退万兵&quot;的千古美谈，鲁仲连以&quot;义不帝秦&quot;名扬天下。龙山文化时期，教场铺一带已有大型城址聚落，属典型的龙山古城遗存。汉代置杨虚县（治所即今土城村一带），土筑城墙，夯层清晰。\u003cstrong class=\"hl\"\u003e金天会八年（1130）前后，茌平县城迁至今址\u003c/strong\u003e，此前城址历经碻磝城、鼓城、兴利镇三处迁变。唐代房玄龄，明、清各朝依河济漕运而城兴，古城规模屡有增广。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e茌平地处鲁西黄泛平原，县境历经四次迁城，乐平铺镇田野下压着龙山文化教场铺古城的椭圆形夯土墙，望鲁店村鲁仲连祠里仍供着射书救聊城的高士。一座两千年未曾断代、城址四迁的古县。\u003c/p\u003e\u003cp class=\"main-text\"\u003e教场铺遗址（第六批全国重点文保）：乐平铺镇教场铺村西北田野间，龙山文化中晚期椭圆形古城，核心城内近五万平方米，夯土城墙平均宽约二十八米、残高近两米，黄沙与黏土分层夯筑、夯层清晰，墙外环绕城壕。相传战国孟尝君曾于此练兵，故名教场铺。；尚庄遗址（全国重点文保）：振兴街道尚庄村东，大汶口文化至龙山文化叠压，出土双人合葬墓、玉器、石笄，2023年建成省级考古遗址公园，地表保护房与展示径可入。；鲁仲连祠（望鲁店村）：冯官屯镇望鲁店东村，清康熙二年始建，民国修三间祠堂，1994年翻修。祠祀义不帝秦、射书救聊城的齐高士鲁仲连，海外鲁氏后裔常来拜谒。；博平古城遗迹：旧博平县城墙基址与四照楼尚存，追怀博平旧治。；茌平四迁城址：秦碻磝城在今韩集乡高垣墙村，晋末鼓城在乐平铺镇土城村——土城村村西、北两面仍有土城墙残垣犹存，隋兴利镇、金天会八年定今治，两千余年城址四迁。；仰山书院（省保·清乾隆）：博平镇西街北侧，清乾隆十年始建、道光间增修，原称博陵书院，旧时设考棚为科举取士之所。现存三开间两层硬山青砖小楼，2008年落架重修，旁存历代碑刻。；李孝堂遗址（省保·新石器至汉）：振兴街道李孝堂村，新石器时代经商周至汉代叠压聚落，面积近九万平方米，文化层延续两千余年。；台子高遗址（牡丘遗址·省保）：杜郎口乡台子高村西南二百米，一突兀高岗，新石器时代至汉代文化堆积，旧传为春秋诸侯会盟之牡丘。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌土城村村民 孙老伯（73岁）：\u003cbr\u003e&quot;村边那土岗子就是汉朝杨虚县的城墙，夯土一层一层的，跟千层饼似的。下过大雨，土墙根经常冲出汉代的陶片、瓦当，我们小时候捡着玩，后来才知道是两千年的老古董。&quot;\u003cbr\u003e▌茌平中学退休教师 郭老师（68岁）：\u003cbr\u003e&quot;鲁仲连是咱茌平人，他那&#x27;义不帝秦&#x27;、&#x27;射书救聊&#x27;的故事，中学课本都讲过。县城里有他的祠，老辈人口口相传，说他是古时候最有骨气的读书人。&quot;\u003c/p\u003e"}, {"n": "夏津老城", "s": "夏津", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e西汉始置鄃县\u003c/strong\u003e，故址在县城附近王堂村一带，为古黄河渡口，汉代名臣田蚡曾以鄃为食邑。隋唐之际，鄃县与夏津县分合，夏津之名相沿至今。\u003cstrong class=\"hl\"\u003e明天顺年间，知县薛正重筑城池\u003c/strong\u003e，土城周长七里、高两丈、顶阔一丈，设四门（东挹旸、西成、南迎薰、北拱宸），建窝铺12座、垛头1970余个。明正德年间，知县张翰增修，城墙增至高三丈；嘉靖间、顺治姜念、康熙朱国祥相继修葺。\u003cstrong class=\"hl\"\u003e清同治年间，知县高溍大修城墙，周长1278丈、建炮台39座、垛口2346个\u003c/strong\u003e。1932年，谢锡文进行最后一次大修，1934年城墙高两丈四尺，城楼铜铁包皮、坚固异常。今城墙拆毁，而&quot;新市街&quot;（县前街、大槐树街、罗成拴马等老地名）仍存市井旧味。明代以来近20次修葺的巨大城池（起点时周长七里、同治时达1278丈、炮台39座、垛口2346个、城楼铜铁包皮）如今荡然无存，唯方志详记其规模，与&quot;鄃城晓望&quot;&quot;锦川晚眺&quot;等八景一同留在纸面，供人追想那座雄踞黄河北岸的古城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e夏津地处鲁西北黄河故道冲积平原，城东北阚家庄田野上“城子里”遍地汉瓦，新盛店镇大十字街高阜犹存旧县城地势，卫河古渡老码头的船运记忆散在街巷地名里。一座鄃县故地、以桑林与渡口著称的老县。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鄃县故址（西汉始置）：县城东北、平原县西南阚家庄（今属平原县腰站镇）一带，当地人俗呼“城子里”。遍地汉代瓦砾，曾出新莽货泉古钱，城址轮廓依稀可辨。本为西汉田蚡食邑，是夏津建县之根。；夏津故城（唐至宋旧治）：县城以北约十五公里新盛店镇新盛店村，大十字街为地势最高处，旧志载因地势低洼遇雨即涝，遂迁鄃城、改鄃为夏津，孙生镇、锦川镇之名沿此。；新市街老地名（县前街、大槐树街）：县治前旧街市，百年木铺、老槐树与罗成拴马传说交织，市井烟火延续至今。；古黄河渡口遗风：卫河古渡自古为南北渡口要道，列夏津八景之一，岸边老码头与船运记忆犹存。；夏津八景旧名：锦川晚眺、鄃城晓望、卫河古渡、云寺清凉、宝塔玲珑、马颊晴虹、龙湾烟雨、义茔苔碑，八景之名载于明清方志，今多为地名余韵。；夏津文庙大成殿（市保·金大定）：县城银城镇朝阳路北侧（原县委党校院内），金大定年间始建，明清多次重修，大殿坐北朝南、进深三间十三点二米，2019年落架修缮竣工，木构梁架犹见宋金遗意。1938年中共夏津县工委即在殿中成立。；窦建德兵站遗址：郑保屯村东北约三华里，东西二百五十米、南北二百米，周围高出平地一米上下，今蒿草丛生、瓦砾遍地，传隋末窦建德屯集兵马、轮番休整之所，曾出土隋唐陶片与骰子。；黄河故道古桑树群椹树王：县城东北黄河故道森林公园内，六千亩古桑林百年以上两万余株，其中一株树龄约一千五百年，五枝同根如掌，人称椹树王，枝上系满祈福红绳，为全球重要农业文化遗产。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌夏津老戏迷 李大爷（71岁）：\u003cbr\u003e&quot;老辈讲城楼上包着铜皮铁皮，结实得很。城门有四座，东门挹旸、南门迎薰，名字怪文雅。现在城墙拆了，可县前街、大槐树街这些老名字还在，街上那棵老槐树，都说罗成当年在那儿拴过马。&quot;\u003cbr\u003e▌王堂村老人 周婶（66岁）：\u003cbr\u003e&quot;村边那一圈土岗子，老人说就是汉朝鄃县的城墙，四边足有七八百米。种地的时候翻出过古钱、陶罐，还有的说在黄河故道边捡过船钉——早先这儿是渡口，船来船往的。&quot;\u003c/p\u003e"}, {"n": "齐河老城", "s": "齐河", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋时，齐国贤相晏婴采邑于晏（今晏城一带），此地为晏子食邑故地。西汉初，耿弇用兵东讨、首拔祝阿，此地遂有&quot;耿济&quot;古名。\u003cstrong class=\"hl\"\u003e北宋建城之前，此地为黄河边古渡重镇\u003c/strong\u003e，金天会八年（1130）升镇为县、始筑城池，周长五里三十步、高1.3丈，设四门：东临济、西瞻岱、南康城、北拱极，附角楼4座、墩台8座。清乾隆三十一年至三十三年（1766-1768），改砌砖城，周长809丈，四门改额为东朝阳、南迎薰、西阜成、北拱极，耗银48500两。\u003cstrong class=\"hl\"\u003e明嘉靖二十七年（1548）建大清桥，九孔跨河、号为&quot;九省通衢&quot;\u003c/strong\u003e，1855年黄河改道夺大清河入海，桥遂毁。\u003cstrong class=\"hl\"\u003e1971年兴建齐河黄河展宽工程，1973年国务院批准县城迁往晏城\u003c/strong\u003e，老城区成为堤外废城，渐次沉寂。晏城作为春秋晏婴食邑与广济古县治，承接齐河新县城地位至今。那座耗银48500两、周长809丈、四门题额（朝阳、迎薰、阜成、拱极）的清代砖城，以及金代周长五里三十步的初建城池，随着1973年县城整体迁往晏城、老城沦为堤外废城而彻底沉寂。今寻齐河老城，只能从方志舆图与堤外残土中辨认当年&quot;扼河守桥&quot;的雄姿。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e齐河老城紧贴黄河北岸，金代筑城、清代砌砖，1973年因黄河北展宽工程整体迁往晏城，旧城沦为堤外废城。黄河国际生态城内定慧寺于旧址东移重建，古银杏犹在，大清桥故址仅存地名与桥基。一座因黄河而兴又因黄河而迁的城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e晏城故地（春秋晏婴食邑）：晏城为春秋晏婴食邑，康熙南巡曾驻跸，古为东西大道驿站，1973年新县城即驻此。；恩荣坊残件（房家牌坊）：明代为科第望族房家敕建石牌坊，1973年迁城时倒塌，残存构件散存于房家湾一带。；齐河八景旧名：泰山南峙等八景载于方志，黄河风光与齐州南山相映成趣。；赵官孟氏民居（省保·清）：赵官镇北一村北街，清雍正间望族孟氏待客院，距今二百五十年，砖石木结构四合院，占地四百四十平方米，北屋二郎担山式五间，东西厢房对称，两厢南端耳房间以回廊木雕八宝吉祥纹相连，为齐河境内唯一完整保存的清代古建筑。；马官屯遗址（省保·龙山文化）：龙山文化聚落遗存，2014年立保护标志碑、2022年公布省保，为齐河县迄今发现较早的史前文化堆积。；侵华日军飞机场建筑群（省保）：齐河境内，为山东省乃至全国保存最完整的侵华日军飞机场建筑群，飞机库房等水泥筑体尚存，系日本侵华罪行的重要实物罪证。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大清桥故址（明嘉靖建）：旧城跨大清河上的九孔石桥，为明清九省通衢要道，咸丰五年黄河改道夺大清河后桥毁，今存桥址与“大清桥”地名。；定慧寺遗风（明永乐敕建）：明成祖为褒奖智寿禅师靖难之功敕建，时称江北第一寺、济南第一名刹，与长清灵岩寺并称姊妹寺。1973年因黄河北展区拆除，2009年于祝阿镇杨珍村黄河北岸易地重建，寺周古银杏犹存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌齐河老城遗民 冯叔（72岁）：\u003cbr\u003e&quot;1973年迁城那会儿我才二十几岁，老城墙还在，大清桥早就塌了。搬到晏城后，老城那边成了河滩地，每年发水前人影都少。可清明我们还回老城根烧纸，说那是祖祖辈辈的家。&quot;\u003cbr\u003e▌晏城退休干部 吴大爷（69岁）：\u003cbr\u003e&quot;晏城是晏婴的食邑，老早就有晏婴祠。康熙爷南巡还在这儿住过。咱齐河从黄河边老城搬到晏城来，换了块地方，可河水边的那段根儿，断不了。&quot;\u003c/p\u003e"}, {"n": "禹城老城", "s": "禹城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e秦始皇置祝柯县，汉高祖改祝阿县\u003c/strong\u003e，此即大禹治水传说流传的核心地带（徒骇河、应龙辅佐之典）。\u003cstrong class=\"hl\"\u003e唐玄宗天宝年间（759年前后），取&quot;大禹治水功成名就&quot;之意赐名&quot;禹城&quot;\u003c/strong\u003e，县名沿用至今。安史之乱后，李铣为阻水患扒开黄河大堤，旧城被毁，遂迁城于&quot;善村&quot;（俗称李善人村，即今禹城老城）。明嘉靖十三年至二十一年（1534-1542），历时八年重缮城墙。\u003cstrong class=\"hl\"\u003e明万历四年（1576），砖砌城墙并建四门楼\u003c/strong\u003e：东门祝阿、西门鬲津、南门禹迹、北门都阳，四门各立石碑镶嵌门楼，另筑铺楼熟堡17座。\u003cstrong class=\"hl\"\u003e清乾隆三十五年（1770），增炮台8座，并筑防洪护城堤3道\u003c/strong\u003e。故城布局方正，周长约五千五百六十米，县衙至十字街一带最高最繁华。城门石碑中&quot;禹迹&quot;&quot;祝阿&quot;两通后收于禹王亭博物馆，&quot;鬲津&quot;&quot;都阳&quot;下落不明。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e禹城地处鲁西北，相传大禹治水在此功成，具丘山田野上的土丘仍埋着龙山文化陶片，明万历四门石碑今收于禹王亭博物馆，八角亭阁矗立于丘顶。一座以大禹功成命名的老城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城门碑（禹迹、祝阿）：明万历四年砖砌城墙设四门，“禹迹”“祝阿”两通城门石碑今收于禹王亭博物馆，为明代砖城四门直接物证。；奎星阁（清乾隆三十九年建）：旧城门楼上所奉奎星遗制，寄托独占鳌头的文运祈愿。；北极庙故址：原祀镇武铜像的庙宇故地，与城隍祭祀并存的古城信仰痕迹。；泰禹钟传说：相传金泰和二年铸于黎吉寨永吉寺的大钟，历代悬于钟楼报时，钟声与禹城之名相系。；董子读书台：汉儒董仲舒曾于此设坛讲学的遗迹故址，历代文人凭吊。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e禹王亭（山东省文保，具丘山遗址）：市区西北约三公里，具丘山为龙山文化遗址，出土石斧、石铲、薄黑陶片与商代卜甲。明改建禹迹亭，清康熙称重修禹王亭，1966年亭毁。1996年依古制重修，于具丘山东北侧堆土成丘，条石筑六十四级台阶至顶，顶建八角亭阁，十六根朱红立柱擎顶。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌禹城老城居民 高大爷（72岁）：\u003cbr\u003e&quot;咱县城名字就是唐玄宗给起的，为大禹治水&#x27;功成名就&#x27;。老城墙是明朝砖砌的，四个城门楼还立个牌牌——东门祝阿、南门禹迹，那两块石头现在在禹王亭博物馆里供着。乾隆爷下江南还打咱这儿过、题过诗。&quot;\u003cbr\u003e▌禹王亭守园人 马师傅（65岁）：\u003cbr\u003e&quot;大禹在具丘山上看水、治水，把这儿的河治服了，所以叫&#x27;禹城&#x27;。老人们正月里都来禹王亭烧香，求风调雨顺。那钟是金朝铸的，敲起来声传十里，说能镇河。&quot;\u003c/p\u003e"}, {"n": "乐陵老城", "s": "乐陵", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e\u003cstrong class=\"hl\"\u003e周赧王三十一年（前284），乐毅伐齐后择陵筑城\u003c/strong\u003e，&quot;乐陵&quot;之名由此而起。秦代乐陵县城
