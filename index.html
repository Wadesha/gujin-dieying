能得以保留。门外汝河护城河。悟颖塔（北宋，国保）：高约30米，因无影得名（冬至正午无影）。小南海（城东南角取土筑城形成的湖）：湖边有观音阁、大士阁、准提楼。皇家驿站（明代官驿，复建）：北辰门、驿丞署、急递铺等，近年修复成景区。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张爷爷（82岁，汝南北街老住户，见过完整南城门）：&quot;我小时候那南城门还在——三洞双檐，叫汝南门。门口有两头大石狮子，我常骑在上面玩。1968年那时候拆的——我亲眼见的，拆了三天。北边那城门因为挡水才没拆，现在就剩个土台子。天中山那地方，我爹说原来就是个小土丘，颜真卿的碑是后来立的。&quot;\u003cbr\u003e▌退休教师李老师（70岁，秦观研究爱好者）：&quot;秦观在汝南当了8年蔡州教授——元丰八年到元祐八年。他写的《汝水涨溢记》就是记录汝南水灾的。我研究了一下，《鹊桥仙》里的牛郎织女故事，汝南有传说——城西董永墓、城东织女湖，古代有七夕庙会。秦少游可能就是受了本地传说的启发。&quot;\u003c/p\u003e"}, {"n": "上蔡·蔡国六百年夯土城", "s": "上蔡", "p": "河南", "w": "3000年古城墙·唯一没迁的西周古城·重阳发源地上蔡蔡国故城是中国保存最完好的西周古城——城址3000年没迁过，城底下压着周、汉、宋、明清各代叠压层（古今叠压型城市）。现存夯土城墙10490米，最高11米（相当于5层楼），宽15-25米，每层厚8-14厘米，夯窝圜底——3000年前的筑城工艺至今清晰可见。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周初年（前1046） 周武王封弟蔡叔度于蔡，建都于芦岗东侧。蔡叔度因&quot;三监之乱&quot;被周公旦囚禁于郭邻（故城蟾虎寺一带）。周成王三年 蔡叔度之子蔡仲胡被封于故地，继续修筑都城——蔡国故城始建于芦岗之上，南北2830米，东西2406米，面积8.1平方公里，是当时中原地区最坚固的诸侯城。春秋 蔡国受楚国欺凌，蔡平侯于前531年迁都新蔡，上蔡故都始称上蔡（区别于新蔡）。战国 楚灭蔡国，上蔡成为楚国北方重镇。秦汉以来 上蔡县城一直没迁——城池在蔡国故城内收缩成方形，明清城墙周约5里。建国后 明清城墙拆毁，但蔡国故城的3000年夯土城墙完整留存。1996年 蔡国故城公布为第四批全国重点文物保护单位。2025年 上蔡入选河南省第一批省级地名文化遗产保护名录。现状： 蔡国故城现存夯土城墙10490米（约21华里），高4-11米，宽15-25米。西城、南城保存最好。城内二郎台（宫殿区，面积120万平方米）高台尚存。上蔡县城（明清缩小城）城内仍有古街巷格局，蔡明园（近年复建）位于蔡国故城内。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e蔡国故城夯土城墙（西周，国保）：现存10490米，高4-11米，夯层厚8-14厘米，夯窝圜底。二郎台（蔡侯宫殿区）：高台比周围高出6-7米，面积120万平方米。台上发现古井、陶排水管、春秋筒瓦/板瓦碎片。蔡侯墓群（故城西北9个土冢）：相传为蔡侯墓。李斯楼村：秦丞相李斯故里，上蔡县西。蔡明园（近年复建，位于蔡国故城内）：仿古建筑群，免费开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尚景照（退休文物专家，78岁，用了30年研究蔡国故城）：&quot;我是1977年调到县文化馆搞文物的。那时候蔡国故城的城墙没人管——有人在城墙上取土盖房，有人在城墙上放牛。后来1996年立了国保碑才好点。我用了30年走遍这10公里城墙，每层夯土都摸过——8到14厘米厚的夯层，圜底夯窝，这就是西周的筑城法！我出版了《蔡国史研究》《蔡国纪事本末》。&quot;\u003cbr\u003e▌刘老汉（75岁，蔡国故城旁边王庄村农民，从小在城墙根长大）：&quot;我家种地就在城墙边上——那夯土真结实，比现在水泥都硬。小时候我爬城墙，从上往下跳，摔在土墙上也不疼，夯土厚着呢。城墙缝里长酸枣树，我常摘酸枣吃。现在不让爬了，立了铁栏杆。&quot;\u003c/p\u003e"}, {"n": "新蔡·蔡平侯迁都的春秋故城", "s": "新蔡", "p": "河南", "w": "8.6公里夯土城·东南角仅存1415米新蔡是蔡国的第二座都城——蔡平侯为依附楚国，从前531年起从上蔡迁都到此（原吕国都城），共传平侯、悼侯、昭侯三代，38年。故城东西长，长方形，周长8615米，占地5.8平方公里。东南角1415米夯土城墙保存尚好，高2-10米，宽20-50米——3000年风雨后的模样。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e前503年 蔡平侯迁都吕地（新蔡），称新蔡以别旧都上蔡。在吕国故城基础上扩建。前494年 蔡昭侯迁都州来（下蔡，安徽寿县）。新蔡故城遂废，沦为普通城邑。明洪武年间 在春秋故城西南部筑小县城——周长仅3里275步，面积仅为春秋故城的1/10。明正德年间（1516） 知县刘汉始筑砖城——高1.5丈，四门：东通淮、西望汝、南仪凤、北瞻极。明万历年间 文庙门口另辟启泰门（虚设，不通行）。民国30年（1941） 敌机轰炸县城，为疏散人口，县府下令拆毁砖城墙，仅留四门城台。建国后 四门城台和护城河也拆毁填平，城墙基址盖成民房。现状： 春秋故城（蔡国迁都地）东南角1415米夯土城墙保存尚好，高2-10米，宽20-50米。其余被工厂、机关、学校占用。明清小县城完全不存，城内街道改造成现代道路。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e新蔡春秋故城（省保）：东西长方形，周长8615米，占地5.8平方公里。东南角1415米夯土城墙保存尚好。新蔡文庙（始建于元大德八年1304）：大成殿、明伦堂等遗存。金粟禅林寺（清康熙十年1671，江北名刹）：原址在县城南郊，占地500亩，有塔林五六十座。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵老汉（70岁，新蔡老城农民，春秋城墙边上的庄稼户）：&quot;我家的地就在城墙边上——东南角那段1415米的夯土墙，旁边就是我种的花生地。那土夯得比石头还硬，花生根都扎不深。我爷爷说那是&#x27;蔡平侯城&#x27;，3000年前的城墙，现在还能摸得到。2025年文物普查，他们在那段城墙里挖了个探方，拿出来的夯层样本我看了——一层一层跟年轮似的。&quot;\u003c/p\u003e"}, {"n": "潢川光州·一水隔两城的吕字古城", "s": "潢川", "p": "河南", "w": "南北两城·小潢河穿城·春申君故里潢川（古称光州）是中国少有的&quot;一水隔两城&quot;格局的古城——小潢河穿城而过，把城分成南北两半，呈&quot;吕&quot;字形。南城（弋阳古镇）西汉初年已形成，比北城早1200年；北城（春申镇）南宋庆元年间才建。两城分别出了战国春申君黄歇（北城）和开漳圣王陈元光（南城），一水两城两大名人。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋 黄国故城在城西6公里，周长6720米（国保）。前648年楚灭黄。西汉初 置弋阳县，县城即潢川南城（弋阳古镇）。唐太极元年（712） 光州州治从光山迁定城（南城）——光州名字沿用至民国。南宋庆元元年（1195） 知州梁季泌扩建南城，小潢河因势利导被引入城内，城分南北两半，还是土城。明洪武元年（1368） 省定城入光州。明正德六年（1511）兵燹城陷；次年知州李镗用砖石重修南北两城——北城辟5门，南城辟6门，周长扩为14里，城墙高3丈。这是今天潢川城的最终格局。清 南城10条街，北城9条街。北城为官府所在，南城为商铺民居。民国2年（1913） 光州废州设县，更名潢川。建国后 城墙陆续拆除——砖被扒去盖办公楼、学校。护城河填平修路。现状： 南城（弋阳古镇）保存较好——大巷、中大、南国西天三条主街和十余条老街，清代胡家大院、苏家大院等58处传统民居+11处民国老宅。铁旗杆（三义观内，收入《中国名胜大词典》）仍在。北城街道已基本拆完，仅余少量遗存。小潢河穿城格局仍在，镇潢桥（明清石桥）尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e弋阳古镇（南城）：河南省首批历史文化街区。小南海（湖泊）周边，明清/民国建筑密集。铁旗杆（三义观内，收入《中国名胜大词典》）：两根铁柱旗杆，各高7米余，铸有对联和年号。黄国故城（春秋，国保）：城西6公里，周长6720米，夯土城墙尚存。镇潢桥（明清，小潢河上）：南北两城之间的石桥，尚存。春申君黄歇墓（北城）：战国四君子之一，楚国令尹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨大爷（76岁，弋阳古镇人，在南城外住了一辈子）：&quot;我家就在小南海边上——这湖是建城时挖土挖出来的，后来成了湖。三义观那两根铁旗杆，上面还刻着字呢，我小时候常爬上去摸。老北城我小时候还见过——官府都在那儿，后来拆得只剩下几个老巷子。现在南城被保护起来了，每天都有游客来拍照。&quot;\u003c/p\u003e"}, {"n": "鄢陵·郑伯克段于鄢的好城墙", "s": "鄢陵", "p": "河南", "w": "鄢有好城墙·陈寔故里·梁廷栋倡修砖城鄢陵城墙在黄河以东平原里素以坚固闻名——民间谚语&quot;扶沟县的好牌坊，鄢陵县的好城墙&quot;。城墙通体包砖，高5.5-6.6米，基宽8.3-9米。郑伯克段于鄢的故事就发生在这里（《古文观止》第一篇）。城内小北门因&quot;风水不利科举&quot;被封闭——现在地名还叫小北街。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e周 封陆终第四子求言后裔于鄢（鄢国，故城在彭店镇古城村）。春秋 郑武公灭鄢，因城建于黄土高陵之上，称鄢陵。《郑伯克段于鄢》故事发生地（前722）。汉 置鄢陵县（治彭店古城）。东汉永元元年（89）黄河冲毁，县治南迁至今安陵镇。明景泰七年（1456） 知县康健增筑土城——周长5里150步，开4门：东朝阳、西荣乐、南长宁、北永安。明万历四十年（1612） 知县张舜典重修——四门及小北门各建重楼，砖包瓮城，疏浚护城河，壕外筑新堤7里。新增角楼5、敌楼6、箭楼4。明崇祯六年（1633） 鄢陵籍兵部尚书梁廷栋（马栏镇梁老村人）倡修砖城——历时3月，改土城为砖城，成为&quot;汴南金汤&quot;。清咸丰十年（1860） 仿空心炮台，四面城墙建敌台8座——长出于城之外，中空架板，每层多开炮眼。民国25年（1936） 大修，通体包砖，高5.5-6.6米，基宽8.3-9米，顶宽3米——时人有谚&quot;扶沟县的好牌坊，鄢陵县的好城墙&quot;。建国后 城墙因城建拆除——砖被扒走盖房。现状： 城墙已不存，但小北门封闭后留下的地名&quot;小北街&quot;仍在。城内衙署旧址一带街道格局保留。陈寔故里（东汉&quot;颍川四长&quot;之一，太丘长，&quot;梁上君子&quot;故事主角）在鄢陵县西陈店村。乾明寺（县城小北门外，清代）仍存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e陈寔故里（陈店村）：东汉颍川郡&quot;四长&quot;之一，&quot;梁上君子&quot;故事主角。乾明寺（县城北，清代）：鄢陵著名佛寺。唐庄村汉魏古城（鄢陵县西南，省保）：三国魏都许昌南边的卫星城。小北街地名：小北门清嘉庆年间因&quot;风水不利科举&quot;被封闭，地名沿用至今。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，鄢陵老城北街住户，当过城墙根卖菜的小贩）：&quot;我小时候那城墙还在——真坚固，砖缝里长草都扎不进去。北门叫永安门，我爹在那儿摆过菜摊。后来说城墙挡路，要扒了修马路——一夜之间扒了半边，剩下的砖有人拉走盖房。现在走那条大路，就是城墙基址。我家宅基地原来就在南门瓮城边上，现在那块地盖了个小区。&quot;\u003c/p\u003e"}, {"n": "清丰·中心阁里的好城墙", "s": "清丰", "p": "河南", "w": "清丰的好城墙·中心阁魁星楼·中心阁还在濮阳一带流传两句民谚——&quot;清丰的好城墙，南乐的好牌坊&quot;。清丰城墙原高4丈（13米），墙基3丈宽，上宽1丈——比周围县城城墙高出一倍。县城中心十字街有一座中心阁（揽秀阁）——明代嘉靖年间建，上层塑伏魔圣像，下层人穿行，&quot;如太极之为天钧而令百体&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋 原县城在今西北18里处，因黄河水患，元丰五年（1082）后逐渐南迁至今址。元 县治停建。明初 始建土城——周5里34步，高4丈（13米），基宽3丈（10米），上宽1丈。开4门：东布德、西施泽、南阜财、北拱极。明嘉靖三十六年（1557） 知县李汝宽重修——城墙增高7尺，上增阔5尺，基增阔1.5丈。护城河宽增至3丈，深2.5丈。城上建更铺20座、墩台20座、角楼4座、城门楼4座，每个瓮城门架吊桥。明嘉靖年间 建中心阁（揽秀阁）——长方条石铺基，千根木柱支撑八角形，上下两层：下层人行道，上层塑伏魔圣像。明万历四十五年（1617） 知县黄文星在城墙南隅附土作基立魁星楼——&quot;架高阁旁列耳房……高且数仞，亭亭矗矗，若擎霄玉柱&quot;。明天启四年（1624） 四瓮城门重门悉包铁。崇祯八年（1635）四门各建敌楼2座。康熙十三年（1674） 知县杨燝修葺瓮城及雉堞垛口。康熙十五年重修中心阁。建国后 城墙拆除——砖和夯土被用于城市建设。现状： 城墙已不存，但中心阁（揽秀阁）仍在——现在县城十字街中心，已保护修缮。城内街道格局保留棋盘状。子路祠（孔子弟子仲由）在县城南街。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e中心阁（揽秀阁）（明代嘉靖年间）：县城十字街中心，八角形木构楼阁，上层伏魔圣像，下层通行。康熙年间重修，近年保护修缮。子路祠（县城南街）：纪念孔子弟子仲由（子路曾在清丰任职）。县城街巷格局：棋盘状，东西南北四街清晰保留。清丰亭（县城北）：唐代建筑，&quot;清丰&quot;县名由此而来——孝子张清丰（隋朝）的故事。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（82岁，清丰东街老木匠，1960年代见过完整中心阁）：&quot;那中心阁是真气派——千根木柱子撑着八角顶，上面雕梁画栋。我小时候爬上去过，伏魔圣像就在上面坐着。文革时差点被砸，几个老木匠偷偷把圣像拆了藏起来才保住。现在阁重新修了，比以前差点意思，但架子还在。我还能认出当年的木料——那根大梁是我师父的师父做的。&quot;\u003cbr\u003e（以上为T13大批次12县正文）\u003c/p\u003e"}, {"n": "洛阳老城·从都城缩到府城的活化石", "s": "洛阳", "p": "河南", "w": "隋唐缩小20倍·丽景门·十字街·洛阳味道洛阳老城是隋唐东都缩小20倍后的金明清府城——走完隋唐洛阳城要2小时，走完明清府城只需15分钟。30米高的丽景门（2002年复建）和背后不足10米宽的西大街形成鲜明反差，这本身就是&quot;千年帝都降级史&quot;的浓缩。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e隋炀帝大业元年（605） 建隋唐东都，外郭城周长27公里。南宽北窄，洛水横贯，面积47平方公里——走完一圈需2小时。金兴定元年（1217） 金宣宗在隋唐城东城旧基上筑新城——面积仅为隋唐故城的1/20，设四门：东建春、西丽景、南长夏、北安喜。这就是今天的洛阳老城前身。明洪武六年（1373） 砌以砖石，周长4里345步（约2公里），高13米，壕深17米。民国28年（1939） 老城城墙拆除。2002年 市政府投资3000万复建丽景门——钢筋混凝土芯外包青砖，城楼高30米、城墙宽11米。最初叫&quot;丽京门&quot;，2009年考据后改回&quot;丽景门&quot;。现状： 东西大街（全长1.2公里）是明清府城全部主要街道。十字街为夜市中心，西大街安静到只剩笔墨纸砚和寿衣花圈店——三层空间对应城市降级的三个阶段。东大街鼓楼（明代砖石，原物）尚存，南北街棋盘格局完整。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e丽景门（2002年复建，原址为金兴定元年西门）：城门高30米、城墙宽11米，钢筋混凝土芯外包青砖。登城门票45元。东西大街（明清府城主街，全长1.2公里）：宽度不足10米，青砖灰瓦硬山顶铺面，电动车行人混行。鼓楼（明代砖石原物）：东大街标志性建筑，门洞可穿行。河南府文庙（金元始建，明嘉靖六年重修）：全国重点文保，琉璃陶塑彩龙壁、棂星门、大成殿完整保存。文峰塔（清代，省保）：老城东南隅。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵师傅（65岁，西大街开了25年寿衣花圈店的老板）：&quot;我这条西大街，一半是游客，一半是老洛阳人。游客从丽景门进来往东走，走到十字街就拐去夜市吃水席了，没人再往我这西边走。但老街坊知道——要买寿衣还得回来找赵师傅。这西大街静，安静得能听见隔壁下棋的落子声。我25年没搬过店，这儿就是我的根。&quot;\u003cbr\u003e▌小张（28岁，汉服租赁店老板娘，东大街打工3年）：&quot;我刚到洛阳的时候以为丽景门是唐代的，后来才知道2002年才建的。但这不重要——站在丽景门洞里往西看，西大街的青砖灰瓦，往东看鼓楼的砖石拱门，两个门洞之间压缩的就是这座城一千年的历史。穿汉服拍出来特别有感觉，每天都能接到十几单。&quot;\u003c/p\u003e"}, {"n": "偃师老城·1935年被洛水淹没的城", "s": "偃师", "p": "河南", "w": "武王息偃戎师处·玄奘故里·&quot;偃师陆沉&quot;偃师老城是洛河岸边的&quot;陆沉之城&quot;——1935年夏洛河大水，整座老城被淹没，房屋倒塌殆尽，上海《晨报》以&quot;偃师陆沉&quot;为题报道。县长杨兆钫靠渔船连夜逃出，后来在邙山南麓槐庙北槐荫寨半山坡上建了新城。老城（今城关镇老城村）现在只剩残垣断壁和&quot;四奇&quot;传说。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e前1046年 武王伐纣在此筑城息偃戎师——偃师之名由此而来，迄今3060年。秦汉 置偃师县，老城在邙山南麓、洛河北岸，水陆交通便利。城址即今城关镇老城村。明正德六年（1511） 流寇寇河南，知县朱璟重修土城，周围6里84步，高1.5丈。崇祯十五年（1642） 知县夏士誉改土城为砖城——伐石为基，砖包。城破，力竭屠城。清顺治九年（1652） 知县魏惟紫重修。民国24年（1935）夏 豫西连日大雨，洛河暴涨，偃师老城被淹，房屋建筑倒塌殆尽——县长杨兆钫被渔船连夜救出，县署临时迁北窑、窑头。上海《晨报》以&quot;偃师陆沉&quot;为题报道，洛阳《行都日报》惊呼&quot;大雨滂沱三日之后，偃师又成泽国&quot;。民国25年（1936） 士绅孙桓卿等募捐，在槐庙北槐荫寨半山坡上建新城——背靠邙岭虎头山，南临伊洛河，地势高不怕水患。城墙周长5里，高近3丈。街道用偃师历史名人命名：许远路、玄奘路、武亿路、杜甫路、苌弘路。1937-1945 新城建城墙停工，抗战胜利后续建，历经10年完工。1950年代中期 偃师火车站扩建，南城墙被扒——施工不慎倒塌，造成多人死伤。1982年 洛河再发大水，偃师新老城均遭灾。现状： 老城村仅存城墙西北角、东北角残垣断壁，地面无重要文物遗存。新城（今偃师市区）为现代城市，街道格局保留名人路名。玄奘故里在缑氏镇。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e玄奘故里（缑氏镇陈河村）：唐贞观三年（629）玄奘从长安出发西行取经前，回故里探望母亲。现存明代重修玄奘寺、唐僧墓。偃师老城残垣（老城村西北、东北角）：1935年水灾后残存，夯土。&quot;四奇&quot;传说：①平地三孔窑（北城墙根平地券起三孔窑洞）、②百步两孔桥（西堤上两座石桥相距百步）、③一步两眼井（西街路北一步间距两井，一苦一甜）、④三柏一顶（三官庙三棵古柏树冠交织如盖）。杜甫路/玄奘路/许远路：新城市区内名人命名街道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董大爷（82岁，老城村村民，亲历1935年大水，当时6岁）：&quot;那天下大雨，三天三夜没停。洛河涨得快，眨眼就漫上城墙了。我爹抱着我爬到城墙上的树洞里，就听底下哗哗响——房子被冲倒的声音。后来爹找了块门板，我趴在上面漂了半天，被上游过来的渔船接住。现在老城村那块地，一下大雨还能看见城砖。&quot;\u003c/p\u003e"}, {"n": "孟津老城村·黄河5次改道的迁徙史", "s": "孟津", "p": "河南", "w": "会盟镇老城·王铎故居·明嘉靖迁城孟津老城是黄河治理史的活化石——从金代到明代，因黄河泛滥县城先后迁了至少5次，最后在会盟镇老城定居。427年县城史，老城村一直是孟津县治，直到1959年才西迁22公里。明末清初大书法家王铎就是老城村人。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e金熙宗天眷三年（1140） 河清县改名为孟津县，城在今会盟镇花园村东北桃花店——黄河孟津渡口。元代 黄河暴涨，县城西迁5里至永安堤（小集村北）——在黄河大堤上。明嘉靖十四年（1535） 黄河泛滥冲毁永安堤城，河南知府黄玠&quot;度地得旧城西二十里圣贤庄者，去河远而土壤良&quot;，迁城于会盟镇老城村。崇祯九年（1636） 知县张尔葆改土城为砖城。清顺治四年（1647） 知县宋弘道捐资补修，建城楼4座。城周长797.6丈（约5里），高宽各1.6丈，护城河宽2丈深1丈。1959年9月 孟津县人民委员会从老城村迁入新城长华（今孟津县城）——老城村结束427年县治历史。现状： 老城村现为会盟镇下辖村，距孟津城区22公里。明清城墙、文庙、城隍庙、十字街木石牌楼等古建筑多拆毁于1958年前。王铎故居（2646平方米+80亩后花园）保存较好，为国家AAA级景区、河南省重点文保。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e王铎故居（明清大书法家王铎宅第，省保+AAA）：2646平方米故居+80亩后花园。王铎字觉斯，号痴庵、松樵，明万历二十年（1592）生于孟津老城，官至礼部尚书、东阁大学士。书法与黄道周、倪元璐并称&quot;三大家&quot;。黄河会盟镇渡口（老城村北）：武王伐纣在此渡河盟誓——&quot;盟津渡&quot;，现仍有古渡口遗迹。老城村明清残垣：城墙残段、街巷格局。刘秀坟（汉光武帝陵）（老城村西2公里）：东汉光武皇帝刘秀陵墓。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王奶奶（78岁，王铎同宗后人，在老城村住了一辈子）：&quot;我家就在王铎故居隔壁。小时候那故居是王家后人住着，后来收归公了。王铎那字写得真是绝了——他一天能写一万字，而且&quot;神笔王铎&quot;不是白叫的。文革时候故居差点被砸，老村长连夜组织人把王家祖宗牌位藏起来才保住。现在每年都有人来拍照。&quot;\u003c/p\u003e"}, {"n": "新安县·杜甫《新安吏》的汉函谷关", "s": "新安", "p": "河南", "w": "丝绸之路第一关·千唐志斋·铁门镇新安是中原通往关中的咽喉要道——汉代杨仆把函谷关从灵宝迁到新安（为自己封关），汉函谷关成为丝绸之路西行第一关。铁门镇的千唐志斋藏有1000余方唐代墓志——全国唯一的墓志铭博物馆，还有狄仁杰的绝笔、武则天的造字。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦庄襄王元年（前249） 始置新安县，属三川郡——距今2275年。西汉武帝元鼎三年（前114） 楼船将军杨仆上疏：他在关东&quot;有罪&quot;，要把函谷关从灵宝迁到新安——给皇帝面子。皇帝同意。汉函谷关自此替代秦函谷关，成为两京咽喉。隋仁寿四年（604） 县治从义马西南迁阎韩城（今新安老城）。明天启年间（1621-1627） 汉函谷关城楼毁于兵燹。清同治十二年（1873）重建，1923年复毁。1923年 康有为游陕过豫，为铁门镇张钫花园题额&quot;蛰庐&quot;。张钫随后在蛰庐西隅建斋，收集洛阳邙山出土的唐代墓志1000余方——千唐志斋由此诞生。章太炎题额，河南大学校长王广庆命名。1935年 张钫建成铁门镇城墙及7个城门——民国时期县境内第二座有城墙的镇。2000年 千唐志斋更新为全国重点文物保护单位。汉函谷关遗址列入世界遗产名录（丝绸之路）。现状： 千唐志斋保存完好——15孔窑洞+3天井+1走廊，镶嵌1000余方唐志。汉函谷关遗址仅存夯土残基。铁门镇仍为豫西名镇，南涧河、北涧河在此汇合。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e千唐志斋（全国唯一墓志铭博物馆，国保+AAAA）：1000余方唐代墓志，其中有狄仁杰为挚友撰书的绝笔墓志、武则天亲造的19个奇字（武周政权结束后被废除，仅存于此）、&quot;谁非过客，花是主人&quot;奇联（作者成谜）。汉函谷关（丝绸之路第一关，世界遗产）：遗址仅存夯土残基。2014年随丝绸之路列入世界遗产名录。张钫故居（省保）：三进院落，豫西民宅典型。铁门镇城墙残段（民国1931年建）：7个城门——拱阙门（东）、&quot;铁门镇&quot;（于右任题）、&quot;凤舞&quot;（北）、&quot;龙飞&quot;（南）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张主任（70岁，千唐志斋博物馆退休馆员，守了一辈子墓志）：&quot;我1975年进馆，那时候馆里就一个看门老头，千唐志斋窑洞差点被当仓库。后来慢慢修复，1996年评国保，2024年新展区开放。狄仁杰那方墓志是镇馆之宝——他为好友娄师德写的绝笔，当时他自己也快病死了。武则天那19个字，&#x27;曌&#x27;字最有名，其他18个在任何字典里都找不到，只有在这儿能看到。&quot;\u003c/p\u003e"}, {"n": "宜阳·锦屏山下的船城", "s": "宜阳", "p": "河南", "w": "形如船·锦屏十二峰·李贺故里·韩国故城宜阳县城是豫西唯一的&quot;船形城&quot;——锦屏山12座山峰如屏障护城，城周长2公里，平面形似一艘船，俗称&quot;船城&quot;。战国时为韩国都城（前375年迁都新郑前），韩国故城郭城遗址仍存——夯土墙高3-8米，护城河壕宽4-17米。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国韩 景侯迁都阳翟后，在宜阳置西部重镇——宜阳故城（韩城镇东）。前308年秦克宜阳，以此为陪都。《战国策》：&quot;宜阳城方八里，材士十万，粟支数年。&quot;。隋开皇四年（584） 始建寿安城（今宜阳老城前身）。明景泰元年（1450） 知县康健增筑土城——周6里90步，高2.2丈。明正德十三年（1518） 知县司牧以砖筑城——城周长2公里，形如船，俗称&quot;船城&quot;。城墙高7.3米，厚3.4米。城南锦屏山12峰如屏障。明万历四十年（1612） 知县程字鹿在城垣高处另开一小东门——因旧城东门卑下，黄河涨浸入城。清咸丰十年（1860） 仿空心炮台，四面城墙建敌台8座。现状： 城墙已拆，但3座城门遗迹可寻——通贤门（南）、挹秀门（南小东门）、凝瑞门（西偏门）。城内中街学校内存明代城隍庙遗存。韩国故城（韩城镇东）夯土残段3-8米，护城河壕宽4-17米，为全国重点文保单位。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e锦屏山（12峰如屏障，武则天赐名&quot;锦屏奇观&quot;）：夕阳、太狮、双壁、文笔、书带、香山、栖云、玉柱、老人、烟霞、奎壁、桃花。最高峰玉柱峰。韩国故城（战国，国保）：郭城南北1510-2150米，东西1630-1843米，夯土城墙高3-8米。护城河宽4-17米、深7.8-10.5米。城隍庙（明嘉靖三十七年1558，中街学校内）：明代遗存。李贺故里（三乡镇）：唐代&quot;诗鬼&quot;李贺（790-816），长于吉，卒于宜阳。船城街巷格局：老城街道保留船形城格局，以县署为中心。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李老汉（75岁，韩城镇农民，韩国故城旁边住了一辈子）：&quot;我家地就在夯土墙边上——那土真硬，比石头还硬。小时候我爬城墙，从上往下跳，摔在夯土上也不疼。城墙缝里长酸枣树，我常摘酸枣吃。现在那遗址立了国保碑，不让爬了，立了铁栏杆。&quot;\u003c/p\u003e"}, {"n": "洛宁老城·千年不挪窝的永固城", "s": "洛宁", "p": "河南", "w": "前秦苻坚建·书名&quot;永固城&quot;·形如翻开的书洛宁老城是&quot;前秦苻坚建、千年不改名不迁址&quot;的活化石——苻坚字永固，370年在洛河沿岸建城，故名永固城。城平面形似一本翻开的书（以文昌路为轴心），洛宁因此又名&quot;书城&quot;。从隋义宁二年（618）改名永宁（后改洛宁），县名1400年没变，城址也没挪过。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e前秦建元年间（370-384） 苻坚建永固城——苻坚字永固，城以人名。土城，周长4里170步，高2.5丈。隋义宁二年（618） 改熊耳县为永宁县，县治永固城。城因名永宁，取&quot;长治久安&quot;意。唐 永宁县多次迁徙——同轨城、莎栅城、鹿桥驿。北宋咸平四年（1001）迁回永固城。明景泰元年（1450） 知县重修土城，四角建炮台。三座城门：东迎恩、西普安、南中和。崇祯六年（1633） 李自成义军炸开北城墙——明《河南府志》有载。康熙三十一年（1692） 《永宁县志》：城墙周长4里170步，高2.5丈，女墙7尺，壕深1丈宽3丈。三门（无北门，避李自成炸开之嫌）。清同治年间 砖石修补。1947年 县城光复，东城门和炮楼被炸毁。1958年 城内大石牌坊（崇祯年间四川巡抚张论建）拆除。祖师阁房舍1970年扒掉。2021年底 城隍庙、文庙、魁星楼仍存。现状： 城墙被毁殆尽，墙基上多已建为民房，仅少数城墙遗址。正正街（兴宁东路）宽5米，两侧为民居和商铺。魁星楼（明崇祯十五年，清顺治十四年重修，高18.2米）为唯一完整遗存——下层正方形，二三层八面棱柱体，顶八棱锥体，锥尖圆球。有顺口溜：&quot;永宁有座魁星楼，半截入到天里头。&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e魁星楼（聚魁楼）（明崇祯始建，清顺治重修，市保）：高18.2米。砖刻对联&quot;肇启斯文盛，崇封祀典隆&quot;&quot;金熬辉紫霭，银管点青云&quot;，横批&quot;聚魁楼&quot;。城隍庙（明洪武元年1368，国保）：山门、舞楼、献殿（两层楼阁式，绿琉璃瓦顶）、后殿、东西厢房。文庙（明始建，近年修缮）：琉璃陶塑彩龙壁、棂星门、大成殿。永固城遗迹：老城墙基隐于民房下，文昌路为轴心的书形格局仍隐约可辨。洛书出处：《尚书·禹贡》&quot;大禹导洛于熊耳&quot;——洛宁长水村，传说大禹在此洛河边上见到洛书。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王会计（68岁，洛宁县志办退休，在老县城住了一辈子）：&quot;我小时候还见过北城墙——夯土的，上面长满酸枣树。后来大跃进被扒了烧砖炼钢。那座魁星楼是我从小爬到大的——上面有木梯，登上去能看见全城。1958年差点被拆，几个老木匠把木梯拆了藏起来才保住。现在修复了，比当年还好看。&quot;\u003c/p\u003e"}, {"n": "陕州老城·陕西之名的起点", "s": "陕州", "p": "河南", "w": "分陕而治·宝轮寺塔·地坑院·黄河边的废墟陕州老城是&quot;陕西&quot;这个地名的起点——西周初年，周公召公&quot;分陕而治&quot;，&quot;陕以西&quot;归召公管辖——这就是&quot;陕西&quot;二字的由来。1957年三门峡大坝动工，陕州城属淹没区，后因规划调整免于淹没，但整体搬迁，原城成废墟——仅剩宝轮寺塔（金代）和石牌坊。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周初 周武王封神农之后于焦，故城即在陕州城。周公召公以陕塬为界分陕而治——&quot;自陕而东者，周公主之；自陕而西者，召公主之&quot;（《春秋公羊传·隐公五年》）。这是&quot;陕西&quot;之名的最初出处。秦孝公十年（前390） 置陕县。北魏太和十一年（487） 改置陕州。明洪武元年（1368） 朱元璋封端王于此，大规模整修——城郭规模为9里130步，高3.8丈，四城门：宣威（东）、迎恩（南）、政平（西）、宣化（北），各增阁楼。明崇祯八年（1635） 寇毁城，后重修，城围缩为9里13步。清光绪十三年（1887） 修缮加固，修护城拦河大堤及护城大坡，东、西、南三面城墙砖砌。1957年 三门峡大坝动工——陕州城属淹没区，群众完成迁移。后因水库建设方案调整，故城免于淹没，但已成废墟——城墙砖被陆续拆走。2000年 陕州故城（汉代古城址）公布为河南省第三批文物保护单位。现状： 陕州故城遗址辟为陕州公园——三门峡市最大城市公园。宝轮寺塔（金代，26.5米高，13层）和明代石牌坊为仅存的古建筑。东城墙南段保护项目2026年获批立项，正推进修缮。地坑院建筑群（庙上村）在县城东南。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宝轮寺塔（金代，26.5米高，13层）：现存最完整的古建筑。陕州故城夯土城墙（省保，227.52万平方米）：汉代古城址，东西宽1200米、南北长1900米。2025年启动东城墙南段修缮。地坑院建筑群（庙上村）：世界仅存的生土建筑，&quot;地平线下的村庄&quot;&quot;刻在大地上的符号&quot;。石壕古道（崤函古道石壕段，世界遗产）：杜甫经此写下《石壕吏》。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，原陕州城居民，1957年搬迁亲历者）：&quot;我家原来就在北门宣化门边上，三间土坯房，院子里有棵老槐树。1957年一说要淹，全家人扛着包袱往西走——搬到温塘村那边。后来听说不淹了，但回去一看，城已经成废墟了——城砖被拉去盖办公楼、学校。那座宝轮寺塔我小时候常爬，现在塔还在，我家老槐树早没了。&quot;\u003c/p\u003e"}, {"n": "灵宝老城·紫气东来的函谷关", "s": "灵宝", "p": "河南", "w": "鸡鸣狗盗·紫气东来·老君著经·被三门峡水库淹灵宝函谷关是中国最著名的雄关之一——始建于西周，是崤函古道咽喉，因深险如函得名。&quot;紫气东来&quot;&quot;鸡鸣狗盗&quot;&quot;一夫当关万夫莫开&quot;&quot;六国叩关&quot;都发生在这里。老子骑青牛过此，尹喜请他著《道德经》5000言。1960年三门峡大坝落闸，灵宝故城和魏函谷关被淹没，现仅存古道和烽火台。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周 始建周秦函谷关——关在谷中，深险如函。北带河、南依山，周五里40步，高2丈。秦庄襄王 置函谷关校尉。老子骑青牛西度，关令尹喜请著《道德经》——函谷关遂成道家之源。汉元鼎三年（前114） 楼船将军杨仆把函谷关东迁至新安（今汉函谷关）。原关称&quot;旧关&quot;。曹魏正始元年（240） 弘农太守孟康在弘农涧河西岸筑魏函谷关（大崤关/金陡关），关楼一门三层歇山顶四檐，高20余米。隋开皇十六年（596） 置桃林县，将三清殿圈入县城——&quot;先有三清殿，后有灵宝县&quot;。唐天宝元年（742） 因在周秦函谷关掘得灵符，桃林县更名灵宝县——&quot;灵符定县名&quot;。明景泰元年（1450） 知县夏永宁重建灵宝县城。1923年 康有为游此，为魏函谷关关楼题写&quot;天下为公&quot;。1938年 外敌侵占灵宝，魏函谷关关楼毁于战乱。1944年 灵虢战事——外敌3万入侵灵宝，军民节节阻击。1960年 三门峡大坝落闸蓄水——魏函谷关遗址和灵宝故城被淹没。1962-1978 大坝从高坝变中坝，水位从335米降至315米——魏函谷关和灵宝故城出露，但已被泥沙淤积覆盖。现状： 魏函谷关6号铁路隧洞东口（仅存2米高，被泥沙淤积大半）为唯一指引关楼位置的遗存。古道和烽火台尚在。周秦函谷关已辟为景区，2014年随丝绸之路列入世界遗产名录。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e周秦函谷关（世界遗产+AAAA）：景区内有老子著经处、太初圣宫、函谷关城楼（近年复建）、鸡鸣台、望气台（&quot;紫气东来&quot;典故）。魏函谷关遗址（仅存古道+烽火台）：湮没于三门峡水库泥沙中，现仅存少量遗存。灵宝孟村（河南省千年古村落）：关龙逄墓（夏代直臣）、薛书常墓（清代翰林）、曹魏古道遗址。先有三清殿后有灵宝县：三清殿（老子庙）在灵宝故城西南，隋代圈入桃林县城，唐代天宝年间因掘得灵符而县名改为灵宝。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孙老汉（78岁，函谷关镇王垛村农民，在周秦函谷关边上住了一辈子）：&quot;我家就在周秦函谷关边上的半山坡上——往东能看见崤函古道，往西是稠桑塬。那周秦关我小时候常爬——关楼是土夯的，后来塌了。魏函谷关在北边5公里，60年被淹了，后来水退下去，关楼没了，只剩个铁路隧洞口子——泥沙淤了大半，现在只剩2米高。你看那隧洞，上面还长着枣树。&quot;\u003c/p\u003e"}, {"n": "卢氏·2300年没改名没迁城的活化石", "s": "卢氏", "p": "河南", "w": "豫西门户·小洛阳·李自成炸开北城墙卢氏是河南唯一&quot;千年不改名、千年不迁城&quot;的县城——从战国韩宣王七年（前319）置县至今2345年，县名没改，城址没动。同治年间改砖城后被称为&quot;小洛阳&quot;——城周4里180步，高3丈，四角炮楼，四门吊桥。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国韩宣王七年（前319） 始置卢氏县——有&quot;七年卢氏令&quot;戈出土可证。县名出自卢敖（秦朝博士，隐居卢氏深山，救瘟疫虎驮采药，后人以卢敖姓为名）。汉武帝元鼎四年（前113） 再置卢氏县，属弘农郡。明洪武元年（1368） 知县李可民重修土城——城墙高1.5丈，周4里180步，壕深1丈宽5尺。四门：东文华、西平理（行刑处）、南望洛、北仰恩（朝京城方向）。四角炮楼，护城河引东沙河、西沙河水。崇祯六年（1633） 李自成义军炸开北城墙——清军入关后屡毁屡修。清康熙十三年（1674） 知县尚天禄疏浚城壕，建城楼四座。同治元年（1862） 捻军两次闯入卢氏，知县因城垣残破弃城而逃。同治二年（1863） 知县秦家驹决计修砖城——名士李宣政出&quot;各里户口钱粮分段承包&quot;方案，统一规格青砖（长2尺、宽8寸、厚4寸），近万百姓制砖筑城。一年后砖城竣工，城墙高3丈，周4里180步，四角炮楼、四门吊桥、护城河，固若金汤——卢氏城因此被称为&quot;小洛阳&quot;。1932年 山东匪首刘桂棠带2000人攻城，靠这老城墙硬顶3天3夜没进去。建国后 城墙陆续拆除——西城墙拆成新建路，南城壕填平建洛滨路。现状： 城墙已毁，但地名尚存——&quot;新建路&quot;（西城墙拆的）、&quot;洛滨路&quot;（南城壕填的）。城隍庙（国保）、清真上寺（豫西最大清真寺，清乾隆43年建）、魁星楼（明代）仍在。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e卢氏城隍庙（国保）：元始建，明洪武元年重建。山门、舞楼、献殿（两层楼阁，绿琉璃瓦顶）、后殿、东西厢房，占地2000多平方米。清真上寺（豫西最大，清乾隆43年1778）：前后两进，六角高楼，檐牙高翘。魁星楼（明代）：砖结构楼阁。北门仰恩门/东文华门/西平理门/南望洛门：城门名尚存，地名叫北街、东街、西街、南街。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尚允康（85岁，卢氏籍作家，写过《卢氏烟云记忆》，小时候见过完整砖城）：&quot;我7岁那时候还爬城墙上玩——城墙是青砖的，3丈高，四个角有炮楼。北门仰恩门我常从门洞钻过去——洞里装着两层铁皮包的城门，特别厚。1958年大跃进开始拆，先拆西墙，拆下来的砖拉去盖炼钢厂。我爹那时候当会计，亲眼看见的，回来跟我说心疼得直掉眼泪。现在只有城隍庙和清真寺还在——那是文保单位，没拆动。&quot;\u003c/p\u003e"}, {"n": "渑池·仰韶文化发现地的秦赵会盟台", "s": "渑池", "p": "河南", "w": "中国考古学圣地·秦赵会盟·刘少奇写《论修养》渑池是中国现代考古学的诞生地——1921年瑞典地质学家安特生在此发现仰韶村遗址，以此地名将这类彩陶遗存正式命名为&quot;仰韶文化&quot;，打破了&quot;中国无本土新石器时代&quot;的旧说。战国秦赵会盟（蔺相如逼秦王击缶）也发生在这里，会盟台尚存。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国前283年 秦昭襄王邀赵惠文王&quot;会于西河外渑池&quot;——蔺相如随行，以&quot;五步之内，相如请得以颈血溅大王矣&quot;逼秦王击缶，秦王竟酒，终不能加胜于赵。会盟台掩埋兵器立盟——&quot;盟台夕照&quot;为渑池古八景。1921年 瑞典地质学家安特生+中国地质学家袁复礼 主持发掘仰韶村遗址——中国第一次正式的科学考古发掘，以此地名将这类彩陶遗存正式命名为&quot;仰韶文化&quot;。中国现代考古学由此诞生。1938年11月 刘少奇在渑池中共兵站旧址（斗室一间）撰写《论共产党员的修养》——在渑池驻留56天，落实豫西特委改建为豫西省委。五个地委秘密代号用&quot;仁、义、礼、智、信&quot;。1941年 卫立煌（时河南省主席）重修秦赵会盟台，撰碑文。1985年 渑池县政府在原遗址基础上重建会盟台，立碑&quot;古秦赵会盟台&quot;。2022年 仰韶村遗址入选全国第四批国家考古遗址公园。2024年 仰韶文化博物馆全新开馆——球幕影院、空气成像、裸眼3D沉浸式体验。现状： 仰韶村遗址（30万平方米，国保）完整保存，文化层厚2-5米，跨仰韶→龙山两大阶段（7000-4700年）。秦赵会盟台在县城西南渑水与羊河交汇处，碑文为卫立煌所撰。中共渑池兵站旧址（刘少奇旧居）为豫西特色长条二进四合院，保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e仰韶村遗址（国保+国家考古遗址公园）：中国考古学圣地，1921年第一次科学发掘。文化堆积跨仰韶→龙山两阶段。秦赵会盟台（渑池古八景之&quot;盟台夕照&quot;）：重建于1985年，碑刻卫立煌1941年碑文。中共渑池兵站旧址（刘少奇旧居）：二进四合院，刘少奇在斗室一间撰写《论共产党员的修养》，驻留56天。赵沟古村（中原石头迷宫，千年古村）：房屋院墙全由山石垒砌，石板路蜿蜒，千年古槐、古镜泉完好。崤函古道石壕段（世界遗产）：杜甫经此写下《石壕吏》。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（75岁，仰韶镇退休文化站长，守仰韶村遗址40年）：&quot;我20岁参加工作，就在仰韶村遗址边上。1980年第三次考古发掘，我给考古队做饭——那时候考古队条件苦，帐篷搭在田野里。出土的彩陶盆、小口尖底瓶，我亲手摸过。2021年是仰韶文化发现100周年，我儿子带我去博物馆看，那个彩陶鱼纹盆真漂亮——7000年了，颜色还那么鲜亮。我一辈子就守这个遗址，值了。&quot;\u003c/p\u003e"}, {"n": "义马·秦汉新安故城的千秋古镇", "s": "义马", "p": "河南", "w": "崤函古道·千秋亭驿·两京古道上的明珠义马是崤函古道上唯一保存秦汉故城+千年古镇+丝路驿亭的地方——秦汉新安故城（全国第八批国保）在义马市区西南2公里下石河社区，是长安到洛阳两京古道上的重要县城；旁边千秋古镇（千秋古街）是古亭驿，明清民居400余所，北魏石窟仍在。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦庄襄王元年（前249） 置新安县，治所即在今义马市区西南2公里——秦汉新安故城。东西宽约500米、南北长约690米，面积33万平方米。汉元鼎三年（前114） 杨仆迁函谷关到新安（今新安县城），原义马新安故城降为一般县城——被学界称为&quot;新故安县&quot;。北魏 义马属新安郡。千秋亭驿（今千秋古镇）开始形成——两京古道上的亭驿。隋仁寿四年（604） 新安县治从义马西南迁阎韩城（今新安老城）——义马故城被废弃，沦为农田。北宋景祐四年（1037） 改千秋镇曰延禧（官方命名）——但民间一直叫千秋镇。明清 千秋古镇成为崤函古道上的重要驿站和商贸集市——明清民居400余所，豫西砖木结构青瓦白墙。2019年 秦汉新安故城遗址入选第八批全国重点文物保护单位。现状： 秦汉新安故城遗址立有国保碑，文化层厚1-3米，采集标本有陶制下水管道、简瓦、板瓦、瓦当、陶盆等。千秋古街现存明清民居400余所，南边涧河仙崖山上还有北魏孝文帝太和元年（477）所建石窟石佛。陇海铁路崤函古道沿故城南侧穿过。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e秦汉新安故城（国保，第八批）：义马市区西南2公里，33万平方米，两京古道（崤渑古道）沿东西方向穿过遗址。千秋古镇（千秋古街）：明清民居400余所，豫西砖木结构，青瓦白墙，雕梁画栋。北魏石窟石佛在仙崖山上。崤函古道：两京古道重要段，沿线仍存古道遗迹、烽燧。杨仆故里（铁门镇南湾村）：西汉名将，谏言汉武帝把函谷关东迁300余里。韩都村：隋朝名将韩擒虎故里（589年率军灭陈）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌周老汉（80岁，千秋古镇老居民，在老街住了60年）：&quot;我家那房子是明朝传下来的——三进院子，青砖院，我爹说那是杨仆后人的房子。我小时候在院墙上刻字，现在那刻痕还在。千秋街原来有3000多人，后来陇海铁路改线，镇就慢慢冷清了。现在老街还住着200多户，年轻人都出去打工了，就剩我们这些老头老太太守着老房子。我每天早上在街门口下棋，下到中午回家吃饭，下午再出来——日子慢得像磨盘。&quot;\u003cbr\u003e（以上为T14大批次12县正文）\u003cbr\u003e（以下为T15大批次12县正文·豫西南南阳）\u003c/p\u003e"}, {"n": "南阳老城", "s": "南阳", "p": "河南", "w": "西汉五大都会、东汉陪都的活化石", "h": "", "r": "\u003cp\u003e汉宛城残墙：城区东北隅防爆电气研究所附近，明远顶（高台基址）残高9米、南北长46米、东西宽44米。望仙台（另一高台基址）东西长80米、南北宽70米、残高9米。梅花寨南寨墙：全长970米，现存300米残段，永庆门（门额&quot;金堤巩固&quot;）、大寨门（门额&quot;淯流锦带&quot;）。南阳府衙（国保第五批）：民主街中段，现存清代建筑140余间，中轴线完整。四经四纬81巷格局：共和街/新华路/联合街/民主街（四纬），光复路/工农路/和平街/民权街（四经）。南门东马道（明清防务专用道）、外号街（明清宛城驿，总长300米）。护城河：2025年完成4.5公里河道及驳岸整治，修复桥梁15座。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘老爷子（78岁，民主街老居民，府衙旁住了50年）：&quot;我小时候府衙里还住着干部呢——那时候是县委大院。1980年代才搬出来当博物馆。我爷爷说他民国时候在府衙门口摆地摊卖馄饨，一碗两文钱。那时候光复路还叫长春街，青石板铺的。我家老屋在明伦巷，1990年翻修过一次，但地基还是明朝的——我刨院子的时候刨出个明代的瓷碗底，后来捐给府衙博物馆了。&quot;\u003c/p\u003e"}, {"n": "镇平老县城", "s": "镇平", "p": "河南", "w": "中国玉雕之乡的涅阳故城", "h": "", "r": "\u003cp\u003e黉学大殿（文庙）：明代，老城内。城隍庙/太极观/察院/魁星楼/纪公楼：明清建筑。古城壕沟残迹：老城地下。玉文化遗存：4000年玉雕史，国际玉城年交易额超百亿元。安固城（省保）：城郊乡王庄村南，汉安固县城遗址，南北长250米、东西宽180米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌贾元武（退休干部，镇平老城保护倡议者）：&quot;我写那篇《打通镇菩路》的文章的时候，镇菩路中段还是一片老院子。2020年后终于撕开了口子——先拆中医院西墙，再拆中山大街至雪枫路那片。中央华府建起来了，老城墙呢？就剩几段土堆在人家院子里种菜。我呼吁修复一段老城墙——不是为了搞旅游，是为了给后人留点念想。现在钢筋丛林不缺，我们缺的是老根儿。&quot;\u003c/p\u003e"}, {"n": "内乡老县城", "s": "内乡", "p": "河南", "w": "天下第一衙的菊潭古治", "h": "", "r": "\u003cp\u003e内乡县衙（国保第四批）：占地4万㎡，18进院落，280余间房舍。中轴线：照壁→宣化坊→大门→仪门→六房→大堂（公廉堂）→寅恭门→二堂→内宅门→三堂→后花园（半亩菜畦）。章炳焘手书匾额：大堂&quot;天理国法人情&quot;。古槐：县衙大门旁，约700年树龄。县衙监狱：南隅，完整保留清代形制。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，内乡县衙导游，干了35年）：&quot;我1989年开始在县衙当导游，那时候还没现在这么火。最早来的是高校搞古建筑研究的教授，后来是旅游团，现在是拍抖音的。最有意思的是讲章炳焘的故事——他离任时两袖清风，没钱回家，百姓凑了银子，他只拿了路费，剩下的捐给学堂了。我每次讲到这里，都看见有人抹眼泪。&quot;\u003c/p\u003e"}, {"n": "西峡老县城", "s": "西峡", "p": "河南", "w": "秦楚孔道的白羽故城与哪吒老家", "h": "", "r": "\u003cp\u003e白羽城遗址（省保）：莲花寺岗，夯土城墙残高10米，战国至汉代文化层。白羽城遗址公园：2009年建，占地300亩。鄀国故城：丁河镇邪地村后岗。陈塘关（奎文关）：丁河镇奎文村，秦楚古道要冲。哪吒祖庙（2000年建，占地15亩）。恐龙蛋化石群：地下埋藏数万枚，占全国1/2、世界1/3。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张俊伟（回车镇文化中心主任，白羽城遗址研究人）：&quot;我给网友当向导，指着那段藏在竹林里的老城墙说——这就是楚国人2600年前筑的城，夯土层每层8厘米，跟现在工地的标准差不多。秦楚丹阳之战就是在这城墙外打的。现在西峡人一聊就是恐龙蛋、哪吒——没错，但白羽城才是根儿。&quot;\u003c/p\u003e"}, {"n": "淅川老县城", "s": "淅川", "p": "河南", "w": "丹江口水库淹没的五百年县城", "h": "", "r": "\u003cp\u003e老城遗址：穆山村，157米水位下。荆紫关镇（明清商业重镇）：古商业街保存完整。香严寺（国保）：仓房镇。古码头遗址：老城、李官桥（原三大码头）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌程老汉（75岁，淅川县移民，1961年随县城搬迁）：&quot;我14岁那年搬的家——全村人拖家带口，锅碗瓢盆全带上，坐卡车往北走。回头看老城，还能看见城墙上的砖。1973年水库蓄水，我特意回去看——水面已经淹到膝盖了，城隍庙的屋脊还露在外面一点点。我现在还在上集镇住着——孙子上大学了，每次问他老家在哪儿，我都说在水底呢，你看南水北调的水，那就是咱们家乡的水。&quot;\u003c/p\u003e"}, {"n": "新野老县城", "s": "新野", "p": "河南", "w": "世界上最小的城，只为守一棵桑树", "h": "", "r": "\u003cp\u003e汉桑城（县级文保）：长宽3.5米，城围11米，高4米，青砖砌筑带垛口。城内古桑约1800年，主干已枯，根部萌发新枝。汉议事台（县级文保）：刘备诸葛亮商议军务处，明万历年间改为矩形。南城门（复建）：1995年按古制复建。鹊尾桥/光武桥：民国时用庙宇牌坊石碑建造，两座残存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌葛磊（新野县文史研究学者）：&quot;我每次带考察队去汉桑城，都要跟他们说——这城不是奇观，是人心。一棵普通的桑树，因为关羽种过，烧不死，就有人给它砌座城守着。六百多年了，这城比很多大城池都命长。新野的城墙拆了，护城河填了，但汉桑城还在——就像一座活的三国纪念碑。&quot;\u003c/p\u003e"}, {"n": "唐河老县城", "s": "唐河", "p": "河南", "w": "&quot;船地&quot;传说与一城担二塔的千年古县", "h": "", "r": "\u003cp\u003e泗洲塔（国保）：始建宋代绍圣二年（1095年），&quot;船地&quot;前桅杆。文峰塔：明万历年间，&quot;船地&quot;后桅杆。护城河：部分残存，现为城市水系。光复路（原中山大街）：西起河边码头，明清至今的主干道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌路喆（唐河县融媒体中心记者，《唐河的城》作者）：&quot;我小时候听我奶奶说唐河是&#x27;船地&#x27;——我就趴在护城河边上看，真的能看出个船形来。后来我查地方志，发现这说法不是空的——唐河的城址确实选得巧，1600年治所没动，说明祖先看得准。&quot;\u003c/p\u003e"}, {"n": "社旗（赊店）老县城", "s": "社旗", "p": "河南", "w": "九门九关、天下第一会馆的商埠古城", "h": "", "r": "\u003cp\u003e山陕会馆（国保第三批）：1656年晋陕商人建。&quot;三龙戏蛛&quot;照壁（高20米、宽13米）、悬鉴楼、大拜殿。慈禧御笔之宝匾。广盛镖局（华中第一镖局）：清代，戴氏心意拳发祥地。厘金局（国内唯一道台级）：清代税务衙署。72条古街：瓷器街、永庆街、西阁内外街……仍为青石板铺地。城墙九门：2010年后陆续重建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨银鹏（社旗县文化局干部，《厚重赊店》作者）：&quot;赊店最有意思的是&#x27;九门九关&#x27;——一般县城四个城门，赊店凭什么九个？光武御批是传说，但实际原因是镇太大了，13万人，四道门堵得慌。而且九门是不同方向的商路——北门通开封、西门通西安、南门通襄阳。相当于九条高速公路进出口。&quot;\u003c/p\u003e"}, {"n": "方城老县城", "s": "方城", "p": "河南", "w": "张骞封侯地、楚长城关隘的方形之城", "h": "", "r": "\u003cp\u003e大关口楚长城（省保）：县城北25公里独树镇。博望坡遗址（省保）：县城西南30公里，柘刺树（火烧博望坡幸存）。文庙：大成殿（面阔七间，单檐歇山），戟门。张释之祠（省保）：西汉法官方城人。普严寺（河南四大名寺之一）：唐宪宗元和年间建，山门前两株千年银杏。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌许金星（县政协委员，老城区保护提案撰写者）：&quot;方城的问题是——博望坡、大关口这些好东西都在城外，县城里的文庙、炼真宫被楼围着没人注意。方城人说&#x27;城小，城墙没了就没了，但文庙不能没&#x27;。我说文庙还在，但旁边的老院子快没了。&quot;\u003c/p\u003e"}, {"n": "南召老县城（云阳镇老城村）", "s": "南召", "p": "河南", "w": "楚王行宫的2700年夫妻柏", "h": "", "r": "\u003cp\u003e楚王行宫遗址：云阳镇第一小学内。两棵2700年古柏（&quot;夫妻树&quot;），明代石碑一通。文庙：明成化年间建。大成殿、状元桥。城隍庙戏楼：明代建筑，残破但结构完整。古城墙残段：老城社区民居间，半人高土堆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌高天顺（退休教师，《南召文化大观》作者）：&quot;上世纪50年代末拆城墙，我爹也去拆了——他搬了12块青砖回家，用来垒厨房的案台。现在那12块砖还在我家厨房里。那两棵古柏我从小看到大——2700年啊，楚王栽的，我每次摸它都觉得，我摸的不是木头，是楚文王的手摸过的地方。&quot;\u003c/p\u003e"}, {"n": "桐柏老县城", "s": "桐柏", "p": "河南", "w": "千里淮河之源的山区石城", "h": "", "r": "\u003cp\u003e淮渎庙遗址：县城东关（县一高中所在地），现仅存大殿台基。文庙/城隍庙：县城内。水帘洞：县城西北，李白曾访友至此。固县镇（古县城）：老街格局尚存。关帝庙1938年被外敌炸毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王技术员（62岁，淮河流域水利工程师）：&quot;桐柏作为淮河源头，我在外地搞水利30年，每次回家都要去淮渎庙遗址转一圈。现在全国搞四渎文化复兴，桐柏的淮渎庙是中国四大河神祭祀里最破的——黄河有庙，长江有庙，济水虽然干了还有济渎庙，就淮河的庙成了个台基。希望以后能修复起来——让后人知道，千里淮河从这儿开始。&quot;\u003c/p\u003e"}, {"n": "邓州老县城", "s": "邓州", "p": "河南", "w": "天下第一回形城池与岳阳楼记诞生地", "h": "", "r": "\u003cp\u003e花洲书院（国保第八批）：占地200余亩。春风堂（范仲淹写记处，前植四棵古桂）、大成殿（文庙，金丝楠木孔子像）、范文正公祠。2019年国保第八批。平成门（西门）：修复，邓州古城标志。西城墙遗址：部分修复，内外城河仍存。宋金古商业街遗址（2023河南十大考古新发现）：团结中路，唐代街巷肌理沿用至今。福胜寺塔：国保。穰东张仲景故里：城东30公里。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌邓老汉（80岁，邓州老居民，花洲书院旁住了60年）：&quot;我小时候在花洲书院后面玩——那时候书院是高中校舍，我们翻过墙去摘桂花。春风堂前面的四棵古桂，每年8月开，香得整条街都是。我爹说他小时候也摘过。现在书院成了景区，收门票，我用老年证免费进。每次走到春风堂，我都跟我孙女说——这就是范仲淹写&#x27;先天下之忧而忧&#x27;的地方。&quot;\u003cbr\u003e（T15大批次12县·完）\u003cbr\u003e（以上为T15大批次12县正文·豫西南南阳）\u003cbr\u003e（以下为T16大批次5县正文·豫东濮阳）\u003c/p\u003e"}, {"n": "濮阳老城（濮阳县）", "s": "濮阳", "p": "河南", "w": "中华龙乡、卧虎城的六千年叠影", "h": "", "r": "\u003cp\u003e五代澶州北城遗址（省保2021年）：西水坡南侧，残长1700米，最宽30米，最高8米。2025年因墙体倾斜塌陷进行分层夯筑修缮。西水坡遗址（国保第三批）：中华第一龙出土地，蚌塑龙虎图案。回銮碑（国保第五批）：又称契丹出境碑，澶渊之盟实物，澶渊之盟博物馆内，有御井。四牌楼（中心阁）：十字街中心，高8.6米，四面匾额&quot;颛顼遗都/澶渊旧郡/河朔保障/北门琐钥&quot;。八都坊：北大街，明万历年间为纪念董汉儒等八位濮阳籍都御史建。城隍庙：北宋熙宁十年（1077年）始建，特别之处——供奉明朝好官开州知州李嘉祥。戚城遗址（国保第四批）：城区，春秋卫都北面屏障，诸侯会盟7次。唐兀公碑（国保第六批）：柳屯镇杨什八郎村，元代蒙汉融合实证。张挥公园：南环路，张姓始祖挥公（发明弓箭，赐姓张）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老周（76岁，濮阳老城十字街居民，住了50年）：&quot;我小时候四牌楼上还挂着灯笼呢——过年过节亮一整夜。那时候西水坡还没挖第一龙，就是一片荒地，我们去那儿放羊。1987年挖第一龙的事儿，我亲眼看着那些考古队的人用刷子一点点刷蚌壳——我那时候才三十多，蹲在边上看了一下午。后来修了中华龙碑，380吨重，立在那儿像个大墓碑似的，我觉得不如那片荒地看着亲切。&quot;\u003cbr\u003e▌刘伟强（省政协委员，无党派人士，濮阳工商联副主席，2024年澶州北城遗址保护提案人）：&quot;我2024年10月用无人机拍澶州北城遗址的时候，发现墙体倾斜了200米，裂缝宽20厘米、深80厘米——要是不修，再过十年就得塌。我们组织了&#x27;益心为公&#x27;志愿者小分队，5个文旅博主+5个文物专家，用倾斜摄影建模，给检察院提了公益诉讼。县文广局采纳了分层夯筑防渗方案，现在修好了。澶州北城是919年建的，比北宋还早——郭威黄袍加身在这儿，宋辽澶渊之盟也在这儿，比陈桥驿早50年。&quot;\u003c/p\u003e"}, {"n": "南乐老县城", "s": "南乐", "p": "河南", "w": "字圣仓颉长眠地的昌意古城", "h": "", "r": "\u003cp\u003e仓颉陵庙（国保第八批、4A景区）：史官村（原吴村），陵高约5米，祠始建东汉。朝天门→仰圣门→万古一人殿→六书殿→藏甲楼→造书台。寇准联、元明清碑刻、明代大方碑。文庙：老城内，明清建筑，青石板路。明清古街：老城核心区，商铺林立。昌意城遗址：县城西北18公里，仓颉陵北侧，仰韶龙山文化层。南乐昌乐故城：谷村一带。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老吴（72岁，史官村仓颉陵守陵人，守了30年）：&quot;我爷爷是守陵的，我爹也是，传到我这儿第三代了。每年正月二十四仓颉诞辰庙会，天不亮就有人来烧香——从豫鲁冀过来的，开着面包车来。香火烧得能把半座陵都熏黑。我守陵30年，见过的最有意思的事儿是2023年谷雨祭仓颉，美国国会图书馆的人也来了——他们说仓颉是全球12位文字圣人之一，跟苏美尔、埃及文字创始人并列。那时候我才知道，我守的不是一座陵，是整个汉字文明的根。&quot;\u003c/p\u003e"}, {"n": "范县老城", "s": "范县", "p": "河南", "w": "中国唯一跨省飞地的六门龙形古城", "h": "", "r": "\u003cp\u003e濮州古城遗址（范县濮城镇）：明景泰二年（1451年）动工、天顺三年（1459年）落成，城周七里，高8米，护城河宽13米，四门（凝和/遂昌/延熙/拱极）。城墙遗址至今仍高出地面2-3米，护城河流水潺潺。范县旧城（黄河底）：周定王封士会食邑，六门龙形城，现已淹没。吴道子铸铜关帝像（已失）：旧城古佛堂前，高六尺，1958年炼钢。老城飞地：山东莘县樱桃园镇境内，河南范县城关镇驻地，现留汽车站等功能。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（80岁，范县濮城镇老居民，濮州古城边住了60年）：&quot;我小时候还在濮州城墙上跑呢——那时候城墙还有一人多高，砖都还在，城垛子也没全塌。后来大炼钢铁拆了一部分砖，再后来修公社修学校又拆了一部分。现在就剩几段土堆了，比人高不了多少。护城河还在——水少的时候能看见河底的青石板，那是明朝铺的。有一年涨水，冲出来个明朝的瓷碗，我捡回家当盐罐用了，我孙子说这得值不少钱，我说值多少钱不是我的，是祖宗留下的。&quot;\u003cbr\u003e▌范县干部小李（35岁，在新城区办公，老家樱桃园老飞地）：&quot;我小时候在老飞地住——河南县城被山东包围，去镇政府办事要进山东地界，打电话信号一会儿是鲁一会儿是豫。1997年迁新区以后，飞地就剩下汽车站、几个商店了。我现在开车回飞地，10分钟就到新区，中间还能经过一段山东地界——踩一脚油门过省界，这感觉挺神奇的。&quot;\u003c/p\u003e"}, {"n": "台前老县城（原寿张县）", "s": "台前", "p": "河南", "w": "黄河犀牛角上的百忍堂", "h": "", "r": "\u003cp\u003e张公艺墓祠（百忍堂）：孙口乡桥北张村，堂号&quot;百忍&quot;，唐高宗赐匾。晋王城遗址：吴坝乡晋城村，方形，边长200米，夯土厚20米，有东/西/南3门。1977年地面城墙全部被毁。凤凰台遗址：台前村，明代刘姓移民建村处，县名之源。寿张故城旧迹：清代有钱庄18家（万成/恒大最甚），四大寨门，东西主街各长里许。古贤桥：孙口乡桥上村，乡贤张公艺（与百忍非一人？待考）出资建。金堤：东汉永平十二年（69年）王景治河筑，台前段。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（百忍堂后人，桥北张村居民，70岁）：&quot;我是张公艺第78代孙。我们村百忍堂每年过年都祭——老人们说百忍堂的&#x27;忍&#x27;字写了一百个，其实是101个，高宗看了哭的那个就是多写的那个。我爹说他1960年代见过百忍堂的老匾——木头的，黑底金字，文革的时候被砸了。现在我们村自己刻了个新的挂在祠堂门口。我家现在还九代同堂——就差两代到张公艺那个规模了。&quot;\u003c/p\u003e"}, {"n": "清丰老县城", "s": "清丰", "p": "河南", "w": "中国唯一以孝子命名的&quot;好城墙&quot;之乡", "h": "", "r": "\u003cp\u003e子路墓祠（清丰西北三十里）：唐开元八年配享孔子，墓冢高大，明正统/天顺/嘉靖/隆庆/万历六次修葺，置祭田五十亩。张清丰祠/孝子牌坊：老城原县衙前街。中心阁（揽秀阁）：十字街中心，明嘉靖年间建，长方条石铺基，八角形上层。城墙残段：零星残存。普照寺/城隍庙/文庙：明清建筑，清丰古八景之一&quot;普照秋风&quot;。文明渠：子路率众开挖，排灌至今。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵大爷（78岁，清丰老城十字街居民，住了50年）：&quot;我小时候中心阁还在——八角形的，二层，上面有伏魔大帝像。那时候老人们说登上去能看见南乐的牌坊——其实南乐离我们20里地，看不清，但我真的爬上去看了，确实能看见城外的麦田。城墙我也爬过——城垛子都在，女墙也没坏，我和小伙伴从西门瓮城进去，顺着马道往上爬，上面还有铺舍，里面放着破破烂烂的打仗用的东西。1958年大队说拆城墙炼铁，我爹也去拆了——他搬了几块砖回家垒鸡窝。现在鸡窝还在，砖上的花纹已经磨平了。&quot;\u003cbr\u003e（T16豫东濮阳5县·完）\u003cbr\u003e（以上为T16大批次5县正文）\u003cbr\u003e（以下为T17大批次6县正文·豫中郑州西部+许昌）\u003c/p\u003e"}, {"n": "荥阳老县城", "s": "荥阳", "p": "河南", "w": "天下郑氏出荥阳的金龟戏水古城", "h": "", "r": "\u003cp\u003e荥阳县衙：明代洪武初年始建，四进院落，37亩。中轴线照壁→头门→仪门→大堂→二堂→三堂。现大堂及内宅格局完整。魁星楼：东街，青砖八棱形，直径4米，高10米，基层拱券四门，楼顶铁马风铃。汜水城（荥阳汜水镇）：明洪武六年（1373年）建，北依卧虎山，西/南濒汜河，现存西城门已恢复，王家旧宅/李家旧宅/老县衙3处古建。京襄城遗址（省保）：豫龙镇南，西城墙残长150米高15米，夯土层可见。石洞沟商相祠（傅说故里）：高山镇石洞沟村，全国唯一殷商贤相专祠，二十四级台阶对应二十四孝，门楣&quot;良弼家风&quot;武丁亲赐。大海寺：北魏正光年间建，1976年发掘出土北魏造像龛座、唐代坐佛8尊/菩萨18躯/罗汉3躯共42件。天下郑氏三祖铜像：郑上路，郑桓公/郑武公/郑庄公。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郑老板（60岁，荥阳郑氏宗亲会副会长，全球寻根组织者）：&quot;我每年清明都要组织全球郑氏宗亲回荥阳祭祖——2024年来了3000多人，从美国、加拿大、新加坡、马来西亚飞回来的都有。有人问我&#x27;天下郑氏出荥阳&#x27;到底凭什么？就凭郑鲁以国为姓那一刻——公元前375年，韩灭郑，他带着族人逃到广武山，从此郑氏在这里扎根。从汉到隋唐，20多个宰相、186个进士都出自荥阳郑氏，这叫&#x27;郑半朝&#x27;。现在我家也在修家谱——往上追到郑庄公，已经75代了。&quot;\u003c/p\u003e"}, {"n": "巩义老县城（站街老城村）", "s": "巩义", "p": "河南", "w": "杜甫出生窑洞+沉入藕坑的1400年县城", "h": "", "r": "\u003cp\u003e杜甫故里：站街镇笔架山下，窑洞至今仍存。杜甫诞生于712年正月初一。巩县老城遗址（藕坑）：站街镇陇海铁路与连霍高速间，已淤为平地。巩义窑址（国保第六批）：北山口镇水地河/白河/铁匠炉村，唐三彩/唐青花/白瓷/绞胎器，中国青花瓷源头。北宋皇陵（国保第二批）：芝田镇+回郭镇，七帝八陵+皇后陵+陪葬墓，石刻2000余件。东周故城：康店镇，东西长约4里，南北宽约2里，现存西城墙400米。康百万庄园：全国三大庄园之一，康家&quot;留余&quot;祖训。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杜老先生（82岁，巩义老城村居民，杜甫后裔旁系）：&quot;我小时候还见过老城的城墙根儿——就在西泗河边上，砖都泡在水里，长了绿苔。1958年&#x27;大炼钢铁&#x27;时挖城墙砖垒高炉，后来又有人挖城墙土卖钱——城墙上的黄土好，和泥盖房子结实。现在藕坑那个位置，我小时候还去摸过鱼——水退下去能摸到碎瓷片，都是明清的。杜甫那孔窑洞我从小看到大——就在笔架山下，旁边种着枣树，每年秋天我去捡枣。我爹说杜甫就出生在那孔窑洞里，我小时候还在里面玩过家家呢。&quot;\u003c/p\u003e"}, {"n": "登封老县城", "s": "登封", "p": "河南", "w": "武则天赐名的天地之中古城", "h": "", "r": "\u003cp\u003e观星台（世遗）：告成镇，元至元十三年建，高9.46米，宽8.1米，覆斗形。郭守敬在此主持编订《授时历》，精度与现代公历相当。中岳庙（世遗）：市区东太室山南麓，南北长650米，面积10.89公顷，五岳中现存规模最大的历史建筑群，峻极殿面阔九间重檐庑殿顶，有汉代守库铁人四尊、古柏330余株。城隍庙（国保第七批）：文庙街西，明初年建，现存大门/照壁/东西掖门/大殿/东西廊房，碑刻150余品。嵩岳寺塔（世遗）：市区北5公里，北魏，12边形密檐式砖塔，高37.678米，灰砖黄泥垒砌，为中国现存最古老的密檐式砖塔。周公测景台（世遗）：告成镇，最早土圭测日影遗址。古城墙残段：市直一初中北墙，长30米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌常松木（登封史学家，城隍修复工程牵头人，耗时3年还原登封古城）：&quot;我用了3年时间，走访了20多位老前辈，翻阅了能找到的所有县志，才把登封古城的格局搞清楚——北城墙在中岳大街南侧，南城墙在少林路北侧，西城墙在嵩阳路东侧，东城墙在菜市街西侧。最繁华的是东西关街。现在那30米残段还在——我每次路过都要摸一下那夯土层，摸的时候脑子里想的是武则天站在嵩山上封禅的样子。我今年60多了，希望有生之年能把这段残段修复起来，不是为了搞旅游，是为了让后人知道，登封这个名字是怎么来的。&quot;\u003c/p\u003e"}, {"n": "襄城老县城", "s": "襄城", "p": "河南", "w": "2500年城墙+最完整瓮城的南北咽喉", "h": "", "r": "\u003cp\u003e襄城古城墙（国保第七批）：残长2297米，高6米，红石奠基黄土夯筑。西城门瓮城：半圆形，南北长58米，周长200米，两道城门方向不一（第一道朝南，第二道门朝西），墙外有墙、门外有门。襄城驿遗址：瓮城旁，中国最早古驿站之一。古城公园：西城门外，北汝河畔。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌谢金成（襄城县文广旅局文物管理股工作人员，守了城墙30年）：&quot;我1994年参加工作就守在这个瓮城里——那时候瓮城里长着几棵榆树，粗得两个人合抱不过来。我最喜欢登西城门的台阶——拾级而上，站在城墙上能看到北汝河。西城门是1960年代为了防洪被封死的——那时候怕洪水从城门灌进来，用砖堵了。现在城门洞里还留着当年封堵的痕迹。瓮城里的榆树2018年清理瓮城的时候砍了——说是要修原貌，我看着那几棵榆树被拉走，心里空落落的，那树比我爷爷岁数都大。&quot;\u003c/p\u003e"}, {"n": "长葛老县城（老城镇）", "s": "长葛", "p": "河南", "w": "楷书之祖洗砚池+社柏2700年", "h": "", "r": "\u003cp\u003e钟繇洗砚池：老城镇和平村南，东西长60米、南北宽30米，水深丈余。钟繇台：洗砚池边，石台。社柏群：老城镇打绳赵村西，26株古柏，东西极大者各二皆24围。长葛故城（省保）：佛耳湖镇孟寨村，城墙东西南北各500米，现存最高3.8米，夯层厚10-20厘米。十二连城（国保）：战国魏长城，现存5段总长1500米，夯层15-20厘米。长葛老县衙：仅剩一堵墙，爬满爬山虎。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌钟老汉（75岁，老城镇洗砚池边住了50年，钟繇后裔旁系）：&quot;我小时候洗砚池里还有水——池水是黑的，我爹说那是钟繇洗砚台留下的墨汁。我半信半疑，舀了一瓢尝了一口——没味，但颜色确实黑。现在洗砚池干了，池底长了草，钟繇台还在，被村里立了个牌子。社柏群我也常去——那26株柏树，我爹说他爷爷小时候就那么粗，2700年了，还在长。我们钟氏家谱我爹还存着——往上追到钟繇，已经不知道多少代了，就知道是他的后代。&quot;\u003c/p\u003e"}, {"n": "禹州老县城（阳翟）", "s": "禹州", "p": "河南", "w": "夏都阳翟+钧瓷之都+徽藩七代王的7.5公里砖城", "h": "", "r": "\u003cp\u003e瓦店遗址（国保）：火龙镇，夏代早期都邑，面积120万㎡，发现中国最完整的夏代祭祀遗存（围沟/红烧土面/五谷坑/人骨坑/螺蚌堆积）。阳翟城墙（省保2016年）：钧官窑路残段，长229米，高7米，夯土城。钧窑遗址（国保）：神垕镇，五大名窑钧瓷产地。怀帮会馆（国保第七批）：清代山西怀庆府商人建，禹州十三帮会馆之一。古钧台（省保）：城南，夏启钧台之享地。天宁万寿寺（国保）：城内，北宋建筑。十三帮会馆/城隍庙/文庙广场（省保）：均在老城内。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘天骧（88岁，禹州城内长大，城墙旁卖黄土的连堂街居民后代）：&quot;我爹说他小时候在连堂街住——就是禹州城墙西边那片空地。新中国成立前，连堂街的穷苦人都在城墙上挖土洞住，以卖黄土为生。禹州城墙的黄土好，陶器脱坯、烧砖都离不开。我爹说他十几岁的时候，一天能挖两筐黄土，卖两文钱，够全家人吃一天。1942年国民政府下令扒城墙防日机轰炸——禹县政府没敢全扒，说城壕是防洪的，不能塞。后来城墙砖被陆续拆了盖房子、建学校，现在就剩钧官窑路那229米。我有时候路过那残段，还能看见城墙上挖过土的痕迹——凹凹凸凸的，像被狗咬过。&quot;\u003cbr\u003e（T17豫中郑州西部+许昌6县·完）\u003cbr\u003e（以上为T17大批次6县正文）\u003cbr\u003e（以下为T18大批次7县正文·豫南信阳大别山）\u003c/p\u003e"}, {"n": "信阳老城（原信阳州）", "s": "信阳", "p": "河南", "w": "义阳三关锁南北、船形之城藏八百", "h": "", "r": "\u003cp\u003e文庙大成殿（省保）：老城街道义阳社区，信阳现存唯一古代建筑。元代始建，明清屡修。文庙后街：东起中山路西至广场南路，500米，青瓦白墙，老城故事文化墙。奎楼（已毁）：原东南城墙上，&quot;奎楼晚照&quot;为信阳八景之一。1950年随城墙拆除。义阳社区：沿用古义阳山之名，原义阳山1949年前被铲除。浉河：穿城南而过，借河为城，天然屏障。申伯台/申国故城：战国申国遗存，北郊有战国板筑法古城残墙。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘老爷子（80岁，信阳老城十字街居民，住了55年）：&quot;我小时候城墙还在——1943年那张老照片是我爹拍的，他是照相馆的学徒。城墙那时候还能跑马车，宽得很。我爹说奎楼原来有两座——下奎楼在关帝庙旁，上奎楼在东南城墙上，&#x27;奎楼晚照&#x27;说的就是上面那座。1950年拆城的时候，我爹还哭了一场——那奎楼他小时候常爬上去玩。现在文庙大成殿还在，我每周都去那儿转一圈——里面有孔子像，有人烧香。文庙后街我也常走，现在修得比以前好，但我还是怀念以前那些青石板路——下雨后亮堂堂的，能照见人影。&quot;\u003c/p\u003e"}, {"n": "潢川（光州）老县城", "s": "潢川", "p": "河南", "w": "一水隔两城、天下黄姓的光州古城", "h": "", "r": "\u003cp\u003e黄国故城遗址（国保）：隆古乡，周长6720米，夯土城墙残段。出土黄君簋、黄太子伯克盘等4件国珍青铜器（郭沫若录《两周金文辞大系》）。2011年3A景区，&quot;万派朝宗&quot;牌坊。弋阳古镇：南城，南从西汉弋阳县到盛唐光州，千年古街，19条街巷存明清建筑遗风。大巷街/中大街：南城，阁楼式厅堂建筑，前店后居、下店上居格局。春申君故宅/墓地：北城春申镇。陈元光出生地：南城弋阳（《光州志》载&quot;陈元光，光州弋阳人&quot;）。南湖公园：五大宗教场所围湖而建——清真寺/南海观音禅寺/天主教堂/基督教堂/三义观/铁旗杆。五教共荣之地：以汉民族为主，聚集信仰伊斯兰教、佛教、天主教、基督教的信众。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌黄老板（62岁，潢川黄氏宗亲会会长，每年组织全球宗亲寻根）：&quot;我每年清明都要带宗亲团去黄国故城祭祖——2024年5月来了13个团，从马来西亚、印尼、菲律宾飞回来的都有。有人说&#x27;天下黄姓出潢川&#x27;凭什么？就凭黄国故城那周长6720米的夯土城墙，凭那4件被郭沫若收录的青铜器，凭1400年的黄国历史。黄歇、黄霸、黄香——这四位历代宰相的塑像就立在祭祀堂里，供天下黄姓子孙叩拜。我儿子在上海开公司，每次回来都要去故城转一圈——他说&#x27;黄歇当年在上海建城，我今天在上海赚钱，这叫光宗耀祖&#x27;。&quot;\u003c/p\u003e"}, {"n": "固始（蓼城）老县城", "s": "固始", "p": "河南", "w": "天下陈氏、闽台祖地的凤凰城", "h": "", "r": "\u003cp\u003e番国故城遗址（国保）：县城关镇，内外两城，夯土城墙大部分尚存，周长合计20公里。护城河完整。出土蓼公簋。陈氏将军祠：始建唐天宝年间，开漳圣王陈元光祖祠，清代古建，千年古榕。固始凤凰台：古城形似翔凤传说源起。东关南街/西关大街：明清格局，&quot;三弯九巷十八条大街&quot;残留。固始侯相墓（吴其濬）：清代状元，《植物名实图考》作者，河南省唯一状元。孙叔敖祠：春秋名相、华夏治水第一人（期思陂比都江堰早300年）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陈先生（55岁，固始陈氏宗亲会副会长，开漳圣王祖祠守祠人）：&quot;我守陈祠20年了——每年正月十六陈元光诞辰庙会，天不亮就有人来烧香。2024年来了台湾宗亲300多人，带着族谱回来——他们说&#x27;台湾70%的人口祖籍在福建，福建70%的人口祖籍在固始&#x27;。我听完眼睛都湿了——我们固始人在台湾的后代，比固始本地人还多。我儿子在厦门做生意，每次回来都要去陈祠上香——他说他是陈元光第78代孙，在厦门那边已经繁衍到好几千人了。我跟他说：&#x27;不管走到哪儿，根在固始，别忘了回来烧个香&#x27;。&quot;\u003c/p\u003e"}, {"n": "息县老县城", "s": "息县", "p": "河南", "w": "中华第一县、苏东坡题&quot;东南第一峰&quot;的濮公山", "h": "", "r": "\u003cp\u003e息国故城遗址（省保）：县城西南6公里青龙寺，残垣长300米、高24.5米，周长2532米。出土青铜剑、戈、箭镞等。谯楼：元代始建，明/清重修，现存。濮公山地质公园：正在修复中，九湖（桃花谷/不老泉/祖师庙）。息夫人纪念馆/雕像：县城内。赖国故城遗址：息县包信镇南3公里，西靠闾河，南北长312米、东西宽272米，城垣基宽55米。宋代息县县城排水系统：县城地下，仍在使用。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，息县十字街居民，住了50年）：&quot;我小时候濮公山还在——山上有狼洞、滴水洞、八仙洞，三月三庙会人多极了，耍猴卖艺的、卖玩具的、卖饭的全有。我和小伙伴爬山顶看庙会，挤得人都动不了。1970年代开始开水泥厂，十年工夫山体就挖没了——我爹说他亲眼看着山头被铲平，那炮声轰隆隆响了好几年。现在正在建地质公园，山还没修起来，九湖倒是先有了。我每天都去湖边转一圈——看着那湖水，我就想起小时候的濮公山。我儿子现在在河南大学教书，每次回家都要去濮公山看看——他说等修复好了要带我看苏轼题的&#x27;东南第一峰&#x27;。&quot;\u003c/p\u003e"}, {"n": "罗山老县城", "s": "罗山", "p": "河南", "w": "灵山有求必应、董寨观鸟天堂的千年古县", "h": "", "r": "\u003cp\u003e灵山寺（4A景区）：唐武德四年建，&quot;每有云气覆顶必雨&quot;，有求必应传说。董寨国家级自然保护区：4.68万公顷，鸟类237种，白冠长尾雉密度全国第一。何家冲（红二十五军长征出发地）：1934年11月16日出发。正大街：老城主街，南北走向，青瓦白墙豫南民居。罗山协议旧址：民国时期文物，活化利用。天湖墓地：商周文化遗址，国家考古遗址公园。灵山云雾茶：信阳毛尖精品。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王大妈（68岁，罗山正大街老居民，在老城住了45年）：&quot;我小时候正大街两边全是青瓦白墙的老房子——每天清晨能闻到隔壁蒸馒头的香味，傍晚街口卖糖葫芦的铜锣一响，小孩们都跑出来了。现在正大街还在，但老房子越来越少了——我家隔壁那棵老槐树今年被砍了，说是要修商业街。灵山寺我每年正月初一都去烧香——我女儿在郑州工作，每次回来也要去。说也奇怪，我去灵山求了好几次，她的工作每次都能如愿。我知道这是心理安慰，但人老了，就信这个。董寨我也去过——满山的鸟，叫得跟唱歌似的，比正大街闹多了。&quot;\u003c/p\u003e"}, {"n": "光山老县城", "s": "光山", "p": "河南", "w": "司马光砸缸地、紫水弦山的智慧之乡", "h": "", "r": "\u003cp\u003e司马光故居：正大街中段，四合院落，司马井（洗三井水至今清澈）、砸缸群塑。紫水塔（省保）：司马光东路，明末始建，八角七级楼阁式，二真二假拱形门。邓颖超祖居：城关镇马塘口，明清四合院。正大街：南北走向五华里，50年前唯一主街，部分明清格局残留。弦山公园：城北弦山。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌小方（28岁，光山县融媒体中心记者，司马光故居讲解志愿者）：&quot;我从小在正大街长大——上学路过司马光故居，天天进去蹭玩。我奶奶说我小时候跟同伴&#x27;砸缸&#x27;玩过——那时候还不知道自己玩的就是砸缸救友的典故。现在我是故居的志愿者讲解员，每次给游客讲司马光的故事，讲到&#x27;持石击瓮破之&#x27;，我都手舞足蹈的——可能小时候玩砸缸的记忆太深刻了。紫水塔我也常去——塔里面有石阶能爬到顶层，每层有两个真门两个假门，我小时候分不清，被卡住过两次。现在塔门还是那个样子——明代的工艺，真就是真，假就是假，像司马光这个人，表里如一。&quot;\u003c/p\u003e"}, {"n": "商城老县城", "s": "商城", "p": "河南", "w": "吴头楚尾、大别山下状元县的崇福塔", "h": "", "r": "\u003cp\u003e崇福塔：明代，县城内。金刚台抗敌洞群（国保第七批）：59个红军洞，海拔1584米。赤城县苏维埃政府旧址：县城内。黄柏山法眼寺：千年古寺，无念禅师弘法、李贽讲学地。汤泉池：金刚台脚下温泉。林伯襄故居：河南大学首任校长。商城高山茶：23万亩茶园，品牌价值54.94亿元。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌周先生（45岁，商城县教体局干部，商城起义史研究者）：&quot;商城的名字960年改至今，从来没变过。我每次给外地朋友介绍商城，都不说别的——先说109位进士，再说52位授衔将军，最后唱一句《八月桂花遍地开》。我爹是县党史办的退休干部，从小给我讲立夏节起义——1929年5月6日夜里，全县同时暴动，一夜之间打了商城县城。那是河南第一次成功的武装起义，意义大了去了。我现在每周都带学生去金刚台抗敌洞群——那上面藏着59个洞，28年红旗不倒。红军们在那上面吃野菜、盖草棚，还唱《八月桂花遍地开》。我每次唱这首歌，都能想起我爹讲的那些故事——商城的魂，就在那首歌里。&quot;\u003cbr\u003e（T18豫南信阳大别山7县·完）\u003cbr\u003e（以上为T18大批次7县正文）\u003cbr\u003e（以下为T19大批次6县正文·豫东开封补+豫北新乡）\u003c/p\u003e"}, {"n": "开封县（祥符区）老县城", "s": "开封县", "p": "河南", "w": "启拓封疆·郑庄公筑的开封前身", "h": "", "r": "\u003cp\u003e启封故城遗址（国保第七批）：朱仙镇东南2.5公里古城村，梯形，周长3330米，残垣高7米、长158米，夯层清晰。陈留古城（国保第八批）：祥符区陈留镇，秦代置县，汉晋陈留郡治，东汉末年曹操挟天子以令诸侯于此开端。朱仙镇木版年画：国家级非遗，与天津杨柳青、山东潍坊、四川绵竹并称四大年画。朱仙镇古街巷：72条街道存明清格局，西大街、顺河街、估衣街、京货街、铜货街连通。启封故园（4A）：朱仙镇，北宋风格城墙高10米，全长约2公里。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陈文斐（祥符区文管所所长，启封故城考古人）：&quot;我1987年刚参加工作时，就守着启封故城那段残垣——那时候城墙比现在高，上面长着酸枣树，我和考古队的人蹲在城根儿刷陶片。1986到1987年我们探明了整个城址——梯形，东西南北四墙全有，就是后来黄河淤积、后人取土烧窑，把城墙毁了不少。现在那段158米的残垣，是仅存的地面遗存——但夯土层每层8厘米，跟现在工地标准差不多。2013年评国保的时候我跟着去答辩，专家说&#x27;这段残垣是郑州以东、开封以南保存最完整的春秋城垣&#x27;——我心里那块石头才落了地。现在很多人只知道清明上河园，不知道启封故城——清明上河园是假的，这才是真开封的根儿。&quot;\u003c/p\u003e"}, {"n": "洧川老县城", "s": "洧川", "p": "河南", "w": "洧阳门古柏500年+城内护城河的独一份古城", "h": "", "r": "\u003cp\u003e洧阳门（南城门，省保2006年）：东西宽17米、进深13.5米、高10米，半圆形拱券门。门洞上方500年古柏，胸围1.1米，根扎砖缝。&quot;镇洧门&quot;三字王成喜手书。古柏：城门洞上方，自然生成，鸟衔柏籽落地生根。洧川城隍庙（省保2006年）：明初建，正统五年（1440年）重修，拜殿面阔五间。明弘治十七年（1504年）石狮一对，高2.47米。护城河：在城内而非城外，宽百米，残段仍在。十字形城垛遗址：状元专属。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王水田（洧川镇文化站站长，&quot;金牌讲解员&quot;，发表新闻作品9000余篇）：&quot;我给每一批来洧川的游客讲的第一件事就是那棵古柏——传说500年前城池竣工，一只小鸟衔着柏树籽飞过，柏籽从嘴里滑落，偏巧落在城门洞正上方的砖缝里，就长出来了。我每次讲这个故事，都要抬头看一眼那棵柏——它的根沿着砖缝往下扎，扎进城墙的砖缝里，扎进地下，跟这城门血脉相连。1964年那个闷热的夏夜，狂风裹着暴雨下着冰雹，很多树连根拔起，但这棵古柏岿然不动。我今年也常去南城门——现在城门洞里汽车川流不息，古柏的枝叶还那么葱郁，像个守护了500年的老爷爷。&quot;\u003c/p\u003e"}, {"n": "新乡老县城（龟背城）", "s": "新乡", "p": "河南", "w": "卫水之阴、龟背状的平原省省会", "h": "", "r": "\u003cp\u003e北关大桥（邵公桥）遗迹：北宋政和元年（1111年）邵博建，2018年卫河清淤时见桥墩。文庙（左文）：西大街（弦歌街），北宋大观二年《大观圣作之碑》（宋徽宗赵佶书）。关帝庙（右武）：东大街（崇化街），元至元七年建。卫河：大运河永济渠段，城北流过。城里十字：东大街/西大街/北大街/南大街交汇处，老城中心。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨大爷（75岁，新乡城里十字老居民，住了55年）：&quot;我小时候还在城墙上跑呢——那时候城墙高三丈七尺，砖缝里长着酸枣，我和小伙伴摘酸枣吃。北门（拱辰门）离卫河只有二丈远，城墙根儿就是护城河。1958年大队说拆城墙炼铁，我爹也去了——他搬了几块砖回家垒鸡窝。现在那鸡窝还在，砖上的花纹磨平了。北关大桥我也常去——那桥是北宋建的，桥墩还在。卫河边的老槐树，我小时候就在下面乘凉，现在还在。城里十字现在盖了商场，但西大街、东大街的老巷子还留着——文庙、关帝庙的香火还没断。我每天遛弯必走那条老巷——闻着香火味，心里踏实。&quot;\u003c/p\u003e"}, {"n": "获嘉老县城", "s": "获嘉", "p": "河南", "w": "武王伐纣同盟圣地、汉武帝赐名的古宁邑", "h": "", "r": "\u003cp\u003e同盟山武王庙（省保1986年）：县城东三公里，全国唯一祭祀周武王的庙宇，明清建筑群40余间，山门/二门/拜殿/武王大殿/文王殿/太公殿/周公殿。盟誓夯土台高于周围5-7米。齐州故城（省保）：北朝时期城址，现存城墙残垣。石佛芝麻糖：27道古法工序，省级非遗。获嘉马皮舞：省级非遗，北方少见的传统舞蹈。渡河词碑：明代内阁首辅夏言撰文书丹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（62岁，获嘉县同盟山武王庙讲解员，干了25年）：&quot;我每次给游客讲同盟山，都要让他们蹲下来摸一摸脚下的土——这就是3000年前八百诸侯每人捧一抔黄土堆出来的山。我25岁开始在这里当讲解员，那时候武王庙还没现在这么火，每年只有庙会的时候才有人来。现在每年清明前后都有上千人从全国各地赶来——有的是研究商周史的，有的是《封神演义》迷，有的是寻根的宁氏宗亲。我每次讲到&#x27;武王与诸侯歃血为盟&#x27;那段，声音都不自觉提高——3000年前这群人就是从这里出发，一路打到朝歌，推翻了商纣王。我摸那夯土台的时候，手还能感觉到3000年前残留的温度。&quot;\u003c/p\u003e"}, {"n": "卫辉老县城", "s": "卫辉", "p": "河南", "w": "天下林氏太始祖比干庙+中原定陵潞王坟", "h": "", "r": "\u003cp\u003e比干庙（国保）：顿坊店乡比干庙村，墓庙合一，北魏孝文帝建庙。每年四月初四诞辰纪念，海内外林氏后裔寻根。潞简王墓（国保第三批）：卫辉西北（现新乡市凤泉区），万历四十三年（1615年）建，神道石刻16对，石牌坊/华表，&quot;中原定陵&quot;。望京楼：明代万历年间建，国内最大明代单体建筑之一。徐世昌家祠（国保）：贡院街西口，民国大总统家祠，现存最大民国影壁。鼓楼：原高七丈，门洞高大南北通衢，现残。古城墙：部分残存，瓮城半圆形。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌林老师（70岁，卫辉比干庙管委会成员，林氏后裔，福建厦门人回卫辉寻根定居）：&quot;我每年四月初四都要在比干庙门口挂上&#x27;天下林氏归卫辉&#x27;的牌子——我是林氏第97代孙，老家在福建厦门，但族谱上清楚写着&#x27;源于卫辉&#x27;。我2005年第一次到卫辉，站在比干墓前，眼泪控制不住地往下掉——1000多年了，我们林氏子孙终于回到了根上。现在我退休后就定居在卫辉，每天去比干庙帮忙——有人问我&#x27;你厦门人跑到河南来干嘛&#x27;，我说&#x27;我回家&#x27;。&quot;\u003c/p\u003e"}, {"n": "辉县老县城（共城）", "s": "辉县", "p": "河南", "w": "中国确切纪年零公里+百泉药会600年", "h": "", "r": "\u003cp\u003e共城城址（国保第四批）：残存千米夯土城墙，东残垣高5、6米，墙基宽40米，西周共国故城。共和元年（前841年）发源于此。百泉（国保第五批，2001年）：河南最大古典园林建筑群，卫源庙（隋建，清晖殿面阔五间明代木构）、涌金亭、清辉阁。百泉药会：国家级非遗，全国四大药市之一，始于明代，600余年。善济塔：共和路，元代至元四年（1267年）建，七级六角形，高24米，辉县地标。琉璃阁遗址（国保）：东周至汉古墓葬，文昌阁（蓝色琉璃瓦，重檐攒尖顶八角形）。文庙/关帝庙（山西会馆）/县衙：县城内。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌韩师傅（58岁，辉县百泉药会传承人，&quot;百泉通&quot;，在百泉摆了25年药材摊）：&quot;我爷爷在百泉药会摆了50年摊，我爹摆了30年，传到我这里25年了——三代人，正好105年。我爹说他小时候百泉药会比现在还热闹——山西商人拉着骡子车来，卖党参、黄芪；安徽商人挑着担子来，卖白芍、菊花。药会从四月初一开到四月十五，半个月不散场。现在药会现代化了，网上也能卖，但我还是每年在百泉湖边摆个小摊——卖我爷爷传下来的老药方配的草药。2018年评国家级非遗的时候，我去北京参加论证——专家说百泉药会是目前全国唯一一个延续600年的露天药材交易市场，我说我信，因为我爷爷摆了50年，那片湖的水都能闻出药味儿来。&quot;\u003cbr\u003e（T19豫东开封补+新乡6县·完）\u003cbr\u003e（以上为T19大批次6县正文）\u003cbr\u003e（以下为T19大批次6县正文·豫东开封补+豫北新乡）\u003c/p\u003e"}, {"n": "开封县（祥符区）老县城", "s": "开封县", "p": "河南", "w": "启拓封疆·郑庄公筑的开封前身", "h": "", "r": "\u003cp\u003e启封故城遗址（国保第七批）：朱仙镇东南2.5公里古城村，梯形，周长3330米，残垣高7米、长158米，夯层清晰。陈留古城（国保第八批）：祥符区陈留镇，秦代置县，汉晋陈留郡治，东汉末年曹操挟天子以令诸侯于此开端。朱仙镇木版年画：国家级非遗，与天津杨柳青、山东潍坊、四川绵竹并称四大年画。朱仙镇古街巷：72条街道存明清格局，西大街、顺河街、估衣街、京货街、铜货街连通。启封故园（4A）：朱仙镇，北宋风格城墙高10米，全长约2公里。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陈文斐（祥符区文管所所长，启封故城考古人）：&quot;我1987年刚参加工作时，就守着启封故城那段残垣——那时候城墙比现在高，上面长着酸枣树，我和考古队的人蹲在城根儿刷陶片。1986到1987年我们探明了整个城址——梯形，东西南北四墙全有，就是后来黄河淤积、后人取土烧窑，把城墙毁了不少。现在那段158米的残垣，是仅存的地面遗存——但夯土层每层8厘米，跟现在工地标准差不多。2013年评国保的时候我跟着去答辩，专家说&#x27;这段残垣是郑州以东、开封以南保存最完整的春秋城垣&#x27;——我心里那块石头才落了地。现在很多人只知道清明上河园，不知道启封故城——清明上河园是假的，这才是真开封的根儿。&quot;\u003c/p\u003e"}, {"n": "洧川老县城", "s": "洧川", "p": "河南", "w": "洧阳门古柏500年+城内护城河的独一份古城", "h": "", "r": "\u003cp\u003e洧阳门（南城门，省保2006年）：东西宽17米、进深13.5米、高10米，半圆形拱券门。门洞上方500年古柏，胸围1.1米，根扎砖缝。&quot;镇洧门&quot;三字王成喜手书。古柏：城门洞上方，自然生成，鸟衔柏籽落地生根。洧川城隍庙（省保2006年）：明初建，正统五年（1440年）重修，拜殿面阔五间。明弘治十七年（1504年）石狮一对，高2.47米。护城河：在城内而非城外，宽百米，残段仍在。十字形城垛遗址：状元专属。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王水田（洧川镇文化站站长，&quot;金牌讲解员&quot;，发表新闻作品9000余篇）：&quot;我给每一批来洧川的游客讲的第一件事就是那棵古柏——传说500年前城池竣工，一只小鸟衔着柏树籽飞过，柏籽从嘴里滑落，偏巧落在城门洞正上方的砖缝里，就长出来了。我每次讲这个故事，都要抬头看一眼那棵柏——它的根沿着砖缝往下扎，扎进城墙的砖缝里，扎进地下，跟这城门血脉相连。1964年那个闷热的夏夜，狂风裹着暴雨下着冰雹，很多树连根拔起，但这棵古柏岿然不动。我今年也常去南城门——现在城门洞里汽车川流不息，古柏的枝叶还那么葱郁，像个守护了500年的老爷爷。&quot;\u003c/p\u003e"}, {"n": "新乡老县城（龟背城）", "s": "新乡", "p": "河南", "w": "卫水之阴、龟背状的平原省省会", "h": "", "r": "\u003cp\u003e北关大桥（邵公桥）遗迹：北宋政和元年（1111年）邵博建，2018年卫河清淤时见桥墩。文庙（左文）：西大街（弦歌街），北宋大观二年《大观圣作之碑》（宋徽宗赵佶书）。关帝庙（右武）：东大街（崇化街），元至元七年建。卫河：大运河永济渠段，城北流过。城里十字：东大街/西大街/北大街/南大街交汇处，老城中心。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨大爷（75岁，新乡城里十字老居民，住了55年）：&quot;我小时候还在城墙上跑呢——那时候城墙高三丈七尺，砖缝里长着酸枣，我和小伙伴摘酸枣吃。北门（拱辰门）离卫河只有二丈远，城墙根儿就是护城河。1958年大队说拆城墙炼铁，我爹也去了——他搬了几块砖回家垒鸡窝。现在那鸡窝还在，砖上的花纹磨平了。北关大桥我也常去——那桥是北宋建的，桥墩还在。卫河边的老槐树，我小时候就在下面乘凉，现在还在。城里十字现在盖了商场，但西大街、东大街的老巷子还留着——文庙、关帝庙的香火还没断。我每天遛弯必走那条老巷——闻着香火味，心里踏实。&quot;\u003c/p\u003e"}, {"n": "获嘉老县城", "s": "获嘉", "p": "河南", "w": "武王伐纣同盟圣地、汉武帝赐名的古宁邑", "h": "", "r": "\u003cp\u003e同盟山武王庙（省保1986年）：县城东三公里，全国唯一祭祀周武王的庙宇，明清建筑群40余间，山门/二门/拜殿/武王大殿/文王殿/太公殿/周公殿。盟誓夯土台高于周围5-7米。齐州故城（省保）：北朝时期城址，现存城墙残垣。石佛芝麻糖：27道古法工序，省级非遗。获嘉马皮舞：省级非遗，北方少见的传统舞蹈。渡河词碑：明代内阁首辅夏言撰文书丹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（62岁，获嘉县同盟山武王庙讲解员，干了25年）：&quot;我每次给游客讲同盟山，都要让他们蹲下来摸一摸脚下的土——这就是3000年前八百诸侯每人捧一抔黄土堆出来的山。我25岁开始在这里当讲解员，那时候武王庙还没现在这么火，每年只有庙会的时候才有人来。现在每年清明前后都有上千人从全国各地赶来——有的是研究商周史的，有的是《封神演义》迷，有的是寻根的宁氏宗亲。我每次讲到&#x27;武王与诸侯歃血为盟&#x27;那段，声音都不自觉提高——3000年前这群人就是从这里出发，一路打到朝歌，推翻了商纣王。我摸那夯土台的时候，手还能感觉到3000年前残留的温度。&quot;\u003c/p\u003e"}, {"n": "卫辉老县城", "s": "卫辉", "p": "河南", "w": "天下林氏太始祖比干庙+中原定陵潞王坟", "h": "", "r": "\u003cp\u003e比干庙（国保）：顿坊店乡比干庙村，墓庙合一，北魏孝文帝建庙。每年四月初四诞辰纪念，海内外林氏后裔寻根。潞简王墓（国保第三批）：卫辉西北（现新乡市凤泉区），万历四十三年（1615年）建，神道石刻16对，石牌坊/华表，&quot;中原定陵&quot;。望京楼：明代万历年间建，国内最大明代单体建筑之一。徐世昌家祠（国保）：贡院街西口，民国大总统家祠，现存最大民国影壁。鼓楼：原高七丈，门洞高大南北通衢，现残。古城墙：部分残存，瓮城半圆形。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌林老师（70岁，卫辉比干庙管委会成员，林氏后裔，福建厦门人回卫辉寻根定居）：&quot;我每年四月初四都要在比干庙门口挂上&#x27;天下林氏归卫辉&#x27;的牌子——我是林氏第97代孙，老家在福建厦门，但族谱上清楚写着&#x27;源于卫辉&#x27;。我2005年第一次到卫辉，站在比干墓前，眼泪控制不住地往下掉——1000多年了，我们林氏子孙终于回到了根上。现在我退休后就定居在卫辉，每天去比干庙帮忙——有人问我&#x27;你厦门人跑到河南来干嘛&#x27;，我说&#x27;我回家&#x27;。&quot;\u003c/p\u003e"}, {"n": "辉县老县城（共城）", "s": "辉县", "p": "河南", "w": "中国确切纪年零公里+百泉药会600年", "h": "", "r": "\u003cp\u003e共城城址（国保第四批）：残存千米夯土城墙，东残垣高5、6米，墙基宽40米，西周共国故城。共和元年（前841年）发源于此。百泉（国保第五批，2001年）：河南最大古典园林建筑群，卫源庙（隋建，清晖殿面阔五间明代木构）、涌金亭、清辉阁。百泉药会：国家级非遗，全国四大药市之一，始于明代，600余年。善济塔：共和路，元代至元四年（1267年）建，七级六角形，高24米，辉县地标。琉璃阁遗址（国保）：东周至汉古墓葬，文昌阁（蓝色琉璃瓦，重檐攒尖顶八角形）。文庙/关帝庙（山西会馆）/县衙：县城内。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌韩师傅（58岁，辉县百泉药会传承人，&quot;百泉通&quot;，在百泉摆了25年药材摊）：&quot;我爷爷在百泉药会摆了50年摊，我爹摆了30年，传到我这里25年了——三代人，正好105年。我爹说他小时候百泉药会比现在还热闹——山西商人拉着骡子车来，卖党参、黄芪；安徽商人挑着担子来，卖白芍、菊花。药会从四月初一开到四月十五，半个月不散场。现在药会现代化了，网上也能卖，但我还是每年在百泉湖边摆个小摊——卖我爷爷传下来的老药方配的草药。2018年评国家级非遗的时候，我去北京参加论证——专家说百泉药会是目前全国唯一一个延续600年的露天药材交易市场，我说我信，因为我爷爷摆了50年，那片湖的水都能闻出药味儿来。&quot;\u003cbr\u003e（T19豫东开封补+新乡6县·完）\u003cbr\u003e（以上为T19大批次6县正文）\u003cbr\u003e（以下为T20大批次3县正文·豫西补全）\u003c/p\u003e"}, {"n": "伊川老县城（城关镇古城寨村）", "s": "伊川", "p": "河南", "w": "程门立雪处、范仲淹长眠地、周赧王躲债台", "h": "", "r": "\u003cp\u003e二程文化园（国保第七批）：县城西北1.5公里，程门立雪典故源地，程颢程颐墓园，古柏数百株。范仲淹墓（国保第七批）：彭婆镇许营村万安山麓，范园古柏遮天，&quot;先天下之忧而忧&quot;长眠处。邵雍墓（省保）：平等乡西村紫荆山下，&quot;安乐佳城&quot;。杜康造酒遗址（国家级非遗）：葛寨镇上皇古泉，明弘治&quot;酒源&quot;题刻，水中天然酵母菌。伊川书院（省保）：鸣皋镇，元代炮手军总管克烈士希父子重修，赵孟頫亲笔碑，国内罕见元代书院实物。周赧王避债台（古城寨村）：战国夯土城残垣，周长数里，土层夹粟米灰烬和箭镞。徐阳陆浑戎墓地（国保第八批）：鸣皋镇徐阳村，600余座东周墓，2020年全国十大考古新发现，113年民族交融物证。白沙镇宣陵（省保）：五代后梁太祖朱温墓，残封土十几米高，石羊一尊。净土寺：玄奘剃度出家地，唐太宗贞观三年。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌范老师（56岁，彭婆镇范园管理员，范仲淹后裔旁系）：&quot;我爹从1960年代就守范园了，传到我这儿第二代。每年清明周边学校都来范园祭范仲淹——学生们齐声读&#x27;不以物喜不以己悲&#x27;，清亮的声音撞在古碑上，我每次都鼻子发酸。我爹说他小时候范园古柏比现在还粗，有棵三个人合抱不过来的，1958年大炼钢铁砍了烧高炉。现在范园还有几十棵古柏——其中一棵我爹说&#x27;范仲淹亲手种的&#x27;，虽然我不信，但每次摸那棵树的树皮，我就觉得在摸一千年的风骨。我儿子在河南大学读中文，每次回来都要去范园转转——他说他毕业论文要写范仲淹，写完第一个给我看。&quot;\u003c/p\u003e"}, {"n": "汝阳老县城", "s": "汝阳", "p": "河南", "w": "杜康之乡、观音寺倒驾慈航、建县550年的伊阳古城", "h": "", "r": "\u003cp\u003e观音寺（省保）：圣王台村，宋庆历年间建，坐南朝北仿白马寺四进院（天王殿/关圣殿/正佛殿/汤王宫），关圣殿明代壁画真品，金崇庆元年遗构，26根石雕望柱升圣桥，洗心井。杜康庙/杜康村：蔡店乡，杜康造酒遗址，国家级非遗酿造技艺，&quot;酒祖之乡&quot;。汝阳老县衙：西门大街，清顺治二年始建，正堂忠爱堂/思补堂。西泰山：杜鹃花海，前坪水库。汝阳红薯/杜康酒：地理标志产品。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌铁船（法号，80岁，观音寺第17代住持，守寺55年）：&quot;我师父给我起法号铁船——就是明代重修寺院那位铁船和尚的名字。我1969年进寺，那时候观音寺已经被改成了小学校，关圣殿里坐满了学生，壁画被糊上了报纸。我偷偷把报纸撕下来，用湿布擦壁画——擦了三天，擦出了单刀赴会的画面，那色彩还鲜艳着呢。现在壁画保护下来了，被评为河南省寺院壁画珍品。观音寺倒驾慈航坐南朝北——有人说这是菩萨面北望众生，有人说这是顺应凤凰山汝河水的地势。我不管那些，我只知道这寺在这儿快一千年了，汤王宫就在最高处——中原人把治水的汤王供在佛菩萨上面，这就是中原的厚道。&quot;\u003c/p\u003e"}, {"n": "三门峡湖滨区（陕州故城）", "s": "三门峡", "p": "河南", "w": "汉代陕州城+地坑院近万座+宝轮寺塔的黄河明珠", "h": "", "r": "\u003cp\u003e陕州故城遗址（省保）：湖滨区陕州公园内，东西宽1200米，南北长1900米，总面积227.52万㎡。城墙/钟鼓楼遗址存。2025年东城墙南段修缮中。宝轮寺塔（国保第六批）：金代，古陕州城塔心坐标。陕州地坑院（4A/国家级非遗）：张汴塬，近万座，最老者200余年住6代人。穿山灶九孔火路出十碗席，黑纸剪纸，捶草印花。虢国博物馆：湖滨区，西周虢国遗址。三门峡大坝：1960年建成，万里黄河第一坝。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（78岁，陕州故城边住了60年，当年参与1957年移民的亲历者）：&quot;我1957年23岁，三门峡水库说要淹陕州城，我爹带着我们全家往南边迁——那时候什么都没拿，就带了两件棉袄。迁了半年，突然说水库方案改了，陕州城不淹了！我爹领着我们又搬回来——那时候城砖已经被拆走了一半，很多房子被推倒了，我们就在废墟里捡砖重新盖房子。我家现在的房子用的砖，就是当年拆陕州城墙的砖——你看那砖上还有当年的白灰印子。现在2025年说要修城墙了——我等了60年，终于等到这一天。我每天都去城墙根儿转一圈——那残垣上的荒草里，能摸到汉代的夯土。&quot;\u003cbr\u003e（T20豫西补全3县·完）\u003cbr\u003e（以上为T20大批次3县正文）\u003cbr\u003e（以下为T21大批次7县正文·河北南部邯郸+邢台）\u003c/p\u003e"}, {"n": "道口老城·运河古镇", "s": "道口", "p": "河南", "w": "隋唐大运河原生河段·明清老街·道口烧鸡三百年道口是中州四大名镇之一、有&quot;小天津&quot;之称；隋唐大运河（永济渠）滑县段8240米是国内保存最完好的原生态运河河段，2014年列入世界文化遗产。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东汉建安九年（204年）：在黄河故道宿胥故渎上疏浚白沟（今卫河前身）。隋大业四年（608年）：开永济渠（即今卫河），道口因河而兴。明：道口属浚县，旧称李家道口，天启八年（1628年）设递运所。清乾隆二十四年（1759年）设道口所；嘉庆十九年（1814年）设滑浚丞、协防外委署。明清至民国：道口商贾云集、&quot;日进斗金&quot;，号&quot;小天津&quot;。1949年：道口划归滑县。2014年：隋唐大运河滑县段列入世界文化遗产。近年：道口古镇评为4A景区、获&quot;中国烧鸡名城&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e大运河（卫河）滑县段（世界遗产）：河段长8240米、宽33—50米，保存原生态河道。道口古城墙、一面街、顺河南街、顺河北街：长3000余米，老店铺与古建筑1000余间。老码头9处、老水闸6处、老胡同16条、老字号5处、绸缎庄1处、票号1处。大王庙、明福寺塔（唐代千佛塔·全国重点文保·七层）、欧阳书院。道口烧鸡义兴张老铺：清顺治年间张家始营，乾隆五十二年（1787年）张炳改良配方，历三百多年。同和裕老票号。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌顺河北街老住户（72岁）：&quot;我这条胡同直通卫河大堤，早年河里帆樯一片，南粮北运、津货南来，码头天天卸货。现在老了，天天在胡同口看游客。&quot;\u003cbr\u003e▌烧鸡铺老师傅：&quot;道口烧鸡讲究&#x27;八料加老汤&#x27;，先炸后煮四五个钟头。义兴张老铺那口锅，三百来年没断过火。&quot;\u003c/p\u003e"}, {"n": "昆阳老城·叶公故里", "s": "昆阳", "p": "河南", "w": "全国唯一明代五品县衙·金代文庙·叶公好龙故乡叶县县衙始建于明洪武二年（1369年），是中国现存古代衙署中唯一一座明代五品县衙；春秋时楚国置叶邑，是&quot;叶公好龙&quot;典故与天下叶姓的发源地。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：楚国灭应置叶邑，为楚国北方重镇。战国（前333年前后）：昆阳始见于《战国策·魏策》。秦：置昆阳、叶阳二县；汉改叶县、昆阳。明洪武二年（1369年）：建叶县县衙。金正大三年（1226年）：建文庙，明初重建。2004年：昆阳古城评为&quot;河南省十大古城&quot;之一。2006年：叶县县衙列为全国重点文保。2023年：县衙景区成功创建4A级旅游景区\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e叶县县衙（明洪武二年·全国重点文保）：建筑面积16000多平米，中轴线与东西副线41个单元153间房；大堂由厅堂与卷棚组成，卷棚天沟罗锅椽勾连搭做法为全国现存县衙唯一；大堂跪石有600年凹痕；黄庭坚书&quot;尔俸尔禄，民膏民脂&quot;官箴；于右任书&quot;天地正气&quot;；后花园有600年桂花树。金代文庙（金正大三年·省保）。昆阳古城墙：周长3018米、面积约75万平米，内城外城，仅东城墙南段残存约170米基址。明清街（县衙东侧）：明清商铺建筑。叶邑故城（叶邑镇）：叶公墓、明清街。岩盐（中原盐都）：展布400平方公里、地质储量2300亿吨。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌县衙讲解员（45岁）：&quot;别的县衙七品用黑漆柱子，我们是五品用青漆。大堂那块跪石让犯人跪了六百年，凹下去个坑，游客都抢着去摸。&quot;\u003cbr\u003e▌叶邑镇种田老农：&quot;俺们是叶公老家，叶公好龙的故事打小听。老辈说叶公本名沈诸梁，现在天南海北姓叶的都回来认祖。&quot;\u003c/p\u003e"}];

const provOrder = ["安徽", "山东", "江苏", "河北", "河南"];
let curProv = provOrder[0] || null;
let curKey = null;

const $tabs = document.getElementById('provTabs');
const $cards = document.getElementById('cards');
const $content = document.getElementById('content');

function renderTabs() {
  $tabs.innerHTML = provOrder.map(p => {
    const cnt = (PROVS[p]||[]).length;
    return '<div class="prov-tab'+(p===curProv?' active':'')+'" data-p="'+p+'">'+
           p+'<span class="county-count">'+cnt+'</span></div>';
  }).join('');
}

function renderCards() {
  const arr = (PROVS[curProv]||[]);
  $cards.innerHTML = arr.map(name => {
    const key = (curProv+'|'+name);
    const c = DATA.find(x => x.n===name && x.p===curProv);
    const label = (c && c.s) ? c.s : name;
    return '<div class="card'+(key===curKey?' active':'')+'" data-key="'+key+'" data-name="'+name+'" title="'+name+'">'+
           label+'</div>';
  }).join('');
}

function renderContent(c) {
  if(!c) {
    $content.innerHTML = '<div class="placeholder">点击上方卡片查看该县历史<br><small>古今叠影 · '+DATA.length+'县</small></div>';
    return;
  }
  $content.innerHTML =
    '<div class="county-body">'+
    '<div class="county-top"><span class="county-name">'+c.n+'</span><span class="county-prov">'+c.p+'</span></div>'+
    (c.w?'<p class="why">'+c.w+'</p>':'')+
    (c.h?'<h4>存废对照</h4>'+c.h: '')+
    (c.r?'<h4>遗存实物</h4>'+c.r:'')+
    (c.c?'<h4>小色块评论</h4>'+c.c:'')+
    '</div>';
  $content.scrollIntoView({behavior:'smooth', block:'start'});
}

function selectProv(p) {
  curProv = p; curKey = null;
  renderTabs(); renderCards();
  renderContent(null);
}

function selectCard(prov, name) {
  curKey = prov+'|'+name;
  const c = DATA.find(x => x.n===name && x.p===prov);
  renderTabs(); renderCards();
  renderContent(c);
}

$tabs.addEventListener('click', e=>{
  const t = e.target.closest('.prov-tab'); if(!t) return;
  selectProv(t.dataset.p);
});

$cards.addEventListener('click', e=>{
  const t = e.target.closest('.card'); if(!t) return;
  selectCard(curProv, t.dataset.name);
});

if(curProv) {
  renderTabs(); renderCards();
  const first = (PROVS[curProv]||[])[0];
  if(first) selectCard(curProv, first);
  else renderContent(null);
}
</script>
