云集，渐成渔港码头；近代：因建港兴起商贸，渔村聚落成街；1992年：老石臼市场建成，鼎盛时一天人流量近两万人；2020年：石臼市场片区列入改造，老市场搬迁；近年：海曲印象文化广场片区城市更新，打造海曲坊并保留古城墙遗址景观。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌石臼老渔民（66岁）：\u003cbr\u003e▌老石臼市场海鲜摊主：\u003c/p\u003e"}, {"n": "微山老城", "s": "微山", "p": "山东", "w": "微山湖·三贤墓岛·微子仁贤·夏镇古城三城合一？殷商微子葬于此，此山此湖此县皆因他得名，微山岛上一湖藏三墓（微子、目夷、张良），跨朝逾千年；县城夏镇是明清微山湖中的运河都会，至今还能摸到汉丞相题字的墓碑。", "h": "\u003cp class=\"main-text\"\u003e微子墓位于微山岛凤凰台北，圆形土冢高十米、底径七点五米，苍松翠柏环抱，层层石阶直抵殿前，正殿存汉元帝时丞相匡衡所题&quot;殷微子墓&quot;的原碑，碑身顶端已断裂；史载微山岛一点七万居民中殷姓占六七成，就连孔子也是微子后裔。岛东峰上还有微子后人子鱼的目夷墓，墓冢简朴、前立宋代石碑，凭栏可眺万顷湖光；岛南麓的张良墓封土宽阔厚重，这位汉初三杰受封留侯，其封地留城已沉入微山湖底，功成之后便归隐湖畔。作为县治的夏镇古城由广戚、部城（西城）、夏镇寨（东城）三城组成，明清设夏镇闸、利建闸扼守湖水，老街上依稀可辨市井格局，运河船工的号子已成为当地非遗。而张良封邑留城因地质沉降沉入湖底，那一片水下封存着汉代城郭，当地渔民下网时偶尔还能捞起汉砖。殷商帝乙的长子微子启贤而让位，周朝封于宋，为宋国始祖；微子卒后葬于宋国留邑东山，那座山便因他得名微山，微山之名由此而始。北宋绍熙之后黄河屡屡决口泛滥，这一带渐渐淤积成湖，微山兀立湖心成了一座孤岛。明清大运河全线通航，微山湖成为南北漕运必经的要道，扼湖守闸的夏镇帆樯云集、市声鼎沸。1953年设微山县，统辖整片湖区，由广戚、部城、夏镇寨三城合体的夏镇成为县治，散落在苏鲁边界的古迹从此得以系统保护。张楼镇湖陵村的湖陵古城原是一座秦汉古城，如今城址早已沉埋于湖荡芦苇与淤泥之间，只留下地名与零星记载，成为历史断层里一座&quot;水下郡县&quot;。&quot;打小听老辈念，先有微山、后有微山湖——早先是山是地，黄河一闹水才成了湖。咱岛上姓殷的多，清明对岸姓宋的也摇船过来，跟咱一块上微子爷坟上磕头，说都是他老人家的后人。&quot;。&quot;老夏镇原来是三座城长一块儿，广戚、部城、寨子。我小时候镇上的河还走货船，船工号子喊得震天响。现在古城墙早没了，可老街那几条巷子还在，青石板让人踩得发亮。&quot;。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌微山岛老船工 刘老大（69岁）：\u003cbr\u003e▌夏镇退休职工 徐姨（63岁）：\u003c/p\u003e"}, {"n": "邳州老城", "s": "邳州", "p": "江苏", "w": "三城叠废·旧州一夜沉水·张良圯桥·土山关公约三事三次迁城（春秋夏邳城→金代旧城→清代新城），康熙七年大地震+黄河决口一夜沉旧州是真实历史。", "h": "\u003cp class=\"main-text\"\u003e夏代奚仲封邳国（左沂水右泗水）。金宣宗兴定五年（1221）移治今距山东三里，夯土筑城周长5里20步。明洪武年间砖砌西北东南两隅，加建西门。康熙七年（1668）郯城8.5级大地震，同年黄河决口，旧州城被淹没——&quot;一夜沉旧州&quot;（真实史料）。康熙二十八年（1689）在洪福山前再造新城，周长5里13步，高2丈8尺，砖厚3尺每块30斤，雉堞1501岗楼30。四城门：先春（东）、来薰（南）、迎爽（西）、拱极（北）。城形有东南弯、西南弯——当地人称&quot;荷包城&quot;。1954年邳县治所迁至运河镇（邳城回归为乡镇）。现状：邳城镇现存不足10米残土墙（邳中学校门西侧）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e土山古镇·关帝庙（江苏省规模最大最完整的关帝庙）：明天顺三年（1460）建，三路四院100多间。《三国演义》第二十五回&quot;屯土山关公约三事&quot;发生地。；土山古镇明清古街：青石铺面，魏家布庄、沈家大院、浴德池等完好。；圯桥遗址（张良受书处）：邳城镇北，秦末张良遇黄石公投石桥下，捡鞋穿鞋得《太公兵法》。。\u003c/p\u003e", "c": ""}, {"n": "淮安府城·淮安区", "s": "淮安", "p": "江苏", "w": "铁打城墙·三联城·漕运总督署东晋义熙年间筑城，&quot;铁打城墙&quot;之誉。中国罕见的&quot;三联城&quot;格局。淮安府署（国保·仅存两座完整府衙之一）。孔尚任《桃花扇》柳梦梅唱词&quot;插天高的淮城&quot;。", "h": "\u003cp class=\"main-text\"\u003e东晋义熙年间始筑淮安城（旧城），&quot;铁打城墙&quot;之誉。明嘉靖三十九年（1560）筑夹城（玉带城）连贯新旧二城——三联城格局形成：北端新城（大河卫）、中段夹城、南端旧城（行政中心）。清江浦城（同治三年1864筑）：不规则矩形，东西长3华里×南北宽平均1华里。5座城门+水门。仅存87年——1952年拆除铺环城路。现状：旧城核心格局完整（棋盘式布局），淮安府署、镇淮楼、漕运总督署遗址尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e淮安府署（全国重点文保）：明洪武三年（1370）建，占地近2万平方米，房屋50余幢600余间，大堂超500平方米——仅存两座完整古代府衙之一。；镇淮楼（北宋楚州谯楼）：旧城正中鼓楼岗。；淮安城墙遗址：淮安区东南角+淮安师范学校旁400米&quot;城墙堆&quot;。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e总督漕运公署遗址（世界文保）：明清管全国漕运的漕运总督衙门，始建于宋乾道六年（1170）。原建筑毁于战乱，2002年清理出遗址，建中国漕运博物馆+遗址公园。。\u003c/p\u003e", "c": ""}, {"n": "徐州新沂窑湾古镇", "s": "窑湾", "p": "江苏", "w": "运河活码头·吴家大院300年闽南风·夜猫子集京杭大运河与骆马湖交汇处，1400年漕运重镇，日过桅帆千杆夜泊舟船十里。", "h": "\u003cp class=\"main-text\"\u003e（古城·城摞城六叠）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e吴家大院（清康熙年间·300年）：四进院落南北长80米东西宽20米。福建沿海建筑风格——窗高而小、院落紧密，防台风暴雨。；赵信隆酱园店（明天启三年1623）：古镇&quot;前店后坊&quot;典型。甜油自清乾隆时就是御膳房佐料。；山西会馆、苏镇扬会馆、江西会馆——一镇之中八省商人设商会十省设商业代办。；界牌楼：一脚踏三地（邳州/宿迁/睢宁交界）。；夜猫子集：运河漕运商船白天航行夜间停靠，每天三更半夜小商小贩不约而来，打潮牌蒸包子烧五香妈糊挑菜选鱼，天亮商船起航集市散去。。\u003c/p\u003e", "c": ""}, {"n": "徐州户部山+戏马台", "s": "户部山·戏马台", "p": "江苏", "w": "依山而建明清民居露天博物馆·鸳鸯楼·500年银杏&quot;一座户部山半部徐州史&quot;，依山势层叠明清古民居，穷北关富南关流传至今。", "h": "\u003cp class=\"main-text\"\u003e（枣庄石头村）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e戏马台：公元前206年项羽依山筑台观戏马演武，现在山顶只有几株古柏苍然。；崔焘故居（崔氏翰林府）：清道光年间，12座四合院房屋150间占地5200平方米。；翟家大院鸳鸯楼：依山势落差建成，上下两层内无楼梯相通，门却朝向相反——因&quot;鸳鸯&quot;与&quot;阴阳&quot;谐音得名。；余家大院&quot;明三暗五&quot;：外面看三间房，进去才发现里面暗藏两间阁楼。；郑家大院500年古银杏树。。\u003c/p\u003e", "c": ""}, {"n": "淮安区·河下古镇", "s": "淮安区", "p": "江苏", "w": "运河商埠·盐业集散地·吴承恩故里明清运河沿岸重要商埠，淮盐集散地，徽商云集。吴承恩故里。", "h": "", "r": "\u003cp class=\"main-text\"\u003e吴承恩故居（六角砖亭·假山·花草丛杂）。、明清盐商住宅群。、河下石板街。。\u003c/p\u003e", "c": ""}, {"n": "沛县老县城", "s": "沛县", "p": "江苏", "w": "泗水亭刘邦亭长·歌风台大风歌·樊哙巷杀狗肉井汉高故里，刘邦当泗水亭长的地方，48岁在此揭竿为沛公。樊哙卖狗肉的那条巷还叫樊巷，他煮狗肉用的井还能找到。", "h": "\u003cp class=\"main-text\"\u003e元代沛县在泗水之东建有小城，后毁于黄泛兵燹。明嘉靖二十一年（1542），知县王治始筑土城，周三里高二丈宽一丈八尺，雉堞千三百二十四。四门：永清（东）、会源（南）、恒休（西）、拱极（北）。明嘉靖二十五年（1546）知县周泾甃之以砖。明万历、崇祯，清康熙间屡修屡圮。1950年代城墙拆除。1995年沛县政府斥资1.5亿元建沛县汉城（仿汉）。现状：城墙全毁。泗水亭1983年复建，歌风台1986年重建。沛县老城街巷名保留。&quot;吾虽都关中，万岁后吾魂魄犹乐思沛。&quot;——公元前195年，刘邦平定英布后回沛县，置酒沛宫与乡亲欢宴，击筑唱《大风歌》。&quot;丰吾所生长，极不忘耳&quot;——刘邦对丰县的牵挂；但他起事在沛县，自称&quot;沛公&quot;，后世把沛县当龙兴之地。&quot;樊哙井还在巷中间，青石井沿被磨得发亮——2000年了，这口井见过屠狗的、见过亭长、见过大风歌，现在还在给我们浇花。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泗水亭（1983年复建）：秦时十里一亭，刘邦壮年时曾任泗水亭长。亭中立有清代古碑《高祖泗水亭碑铭》——东汉班固原文。；歌风台（1986年重建）：原在县治东南泗水岸，屡圮屡修。内有汉代歌风碑，碑文为东汉蔡邕所题，今碑上半尚存下半1/3难以找到。沛县孩童能背&quot;大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方&quot;——2000年前刘邦即兴唱的。；樊将军井（樊哙巷内）：樊哙当年煮狗肉用的井，至今水还在。；樊巷（沛县城区东汤沐路东）：樊哙卖狗肉时住的那条巷，南北走向。老沛县人说&quot;巷里静静静静的清晨，阳光透过树丛，能看到樊哙袒胸漏乳在狗肉摊前忙碌，刘邦急急忙忙跑过来要吃狗肉&quot;。；汉城公园（1995年建）：汉魂宫、汉阙、仙人承露台、汉高祖原庙。；明代砖城四门及城楼；元代旧泗水东岸城址（玉虚宫、琉璃井在其中，遗址沉于水下）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：\u003cbr\u003e▌沛县民谚：\u003cbr\u003e▌沛县老樊巷居民：\u003c/p\u003e"}, {"n": "宿迁老府城", "s": "宿迁", "p": "江苏", "w": "四次迁城全因黄河水患·下沉式城墙遗址·项王故里宿迁有四座古城址，全因躲避黄河水患而迁：秦代下相城→晋代宿预县城→元代宿迁县城→明万历马陵山新县城。2007年发掘出60米城墙残段，建成下沉式广场——沿着台阶逐级而下便知数百年来黄河泛滥地势上涨的幅度。", "h": "\u003cp class=\"main-text\"\u003e城名          年代          位置                  迁因。下相城（秦）    秦代          义乌商贸城附近          黄河水患。宿预县城（晋）  晋代          洋河镇古城社区          黄河水患。元代宿迁县城    元代          项王故里景区南          黄河水患。马陵山新县城    明万历四年(1576)  马陵山麓（今老城区）    黄河水患。明万历四年（1576）迁马陵山麓，土筑椭圆形城周长4华里，三城门：东迎熙、西拱秀、南望淮（北因山路崎岖未置门，城墙上置览秀亭）。万历二十二年（1594）土城改砖城，四门：东阳春（朝阳）、西镇黄、东南迎薰、西南河清。1952年拆除古城，仅留西城门镇黄门。1970年西门拆。2007年城市建设中发掘出60米城墙残段（宿城区幸福中路西侧区府广场），残高约1米，墙宽约1.6米，砖筑。做法是先用木桩栽入地下做地钉，其上用城砖砌筑。现状：城墙残段建成下沉式历史文化墙（玻璃罩保护），城楼仿建。项王故里景区。&quot;明万历四年，黄河决溢，知县何东凤卜地于马陵山麓另建县城。&quot;——宿迁四次迁城，根因全在黄河。&quot;城墙做法是先用木桩栽入地下做地钉，其上用城砖砌筑——这是明代筑城的标准工艺，也说明马陵山新县城是按正规府城规格建造的。&quot;。&quot;我小时候还见过西门镇黄门——两层城楼，拱门黑得发亮。1970年拆的时候全城人都去看，有人哭。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宿迁明清古城墙遗址（市保·2023年11月核定）：60米下沉式广场，玻璃罩下可清晰看到城墙轮廓——顺着台阶逐级而下，能摸到原来的地面线，&quot;知道这几百年来黄河泛滥地势上涨了多少&quot;。；项王故里（国家4A）：西楚霸王项羽故居，有项府、项园、将署、项羽故居、项家宗祠、霸王古今馆、虞家老宅。；宿迁文庙（学宫）：400多年历史，今江苏省宿迁中学校区，大成殿古建筑尚存。；元代宿迁县城（项王故里景区南，沉于地下）；晋代宿预县城（洋河镇古城社区）；秦代下相城（沉于地下）；东大街明清街貌。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东大街（明代通岱街）：东城门外老街，原长约一华里宽一丈许，可与苏州周庄媲美，后渐毁。；明代砖城四门城楼（全毁）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《宿迁县志》（清乾隆）：\u003cbr\u003e▌宿迁考古队（2007）：\u003cbr\u003e▌宿迁老居民（70岁+）：\u003c/p\u003e"}, {"n": "高邮老县城", "s": "高邮", "p": "江苏", "w": "盂城驿世界文保·北门双瓮城瓮城结构层·孤塔伴双寺中国邮驿&quot;活化石&quot;——盂城驿是全国规模最大保存最完好的古代驿站（世界文保+国保）。北门瓮城有罕见的宋代至明代双瓮城结构（内瓮南宋嘉定间建，外瓮明嘉靖年间为抵御海寇增筑），外瓮城砖墙内发现至少8个暗藏的瓮城结构层。", "h": "\u003cp class=\"main-text\"\u003e北宋开宝四年（971）知军高凝祐始筑土城，方形，四门。明洪武八年（1375）始建盂城驿（全国最古老邮驿之一）。明正统年间以砖包城，周围一十里三百一十六步，高二丈五尺。明嘉靖年间增建瓮城、瓮城结构层。1956-1972年城墙大部拆除，仅东南角以奎楼为中心残留122.7米。2015年考古发掘北门瓮城遗址，发现双瓮城结构+8个瓮城结构层。现状：盂城驿完整保存（世界文保+国保），镇国寺塔（国保），北门瓮城遗址公园。明代城门     现状。东门（镇海）  全毁。南门（望淮）  全毁。西门（通泗）  全毁。北门（迎恩）  双瓮城遗址尚存（瓮城结构层已发掘）。&quot;周围一十里三百一十六步&quot;——明清州志标准数据，民国测量地图实测5520米，略少于文献（差异因统计口径）。&quot;城外城中四通水，堤南堤北万垂杨。一州斗大君休笑，国士秦郎此故乡。&quot;——宋淳熙十六年（1189）过高邮。&quot;北门瓮城太罕见了——内瓮南宋嘉定年间建，外瓮明嘉靖年间为抗倭增筑，内外两层砖墙之间挖了8个瓮城结构层，是明代城防工事的直接实物见证。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e盂城驿（世界文保·国保·中国邮驿活化石）：明洪武八年（1375）始建，世界文化遗产京杭大运河重要组成部分。全国规模最大保存最完好的古代驿站，明代遗留驿传建筑。盂城是高邮别称，取秦少游&quot;吾乡如覆盂&quot;诗句。；镇国寺塔（国保·唐代）：高邮城西，唐僖宗时建，全国仅剩的三座唐代方塔之一。；南门大街/北门大街（历史文化街区）：明清高邮城最繁华街区，现存明代砖石路面、砖雕门楼。；奎楼（城墙东南角）：明天启三年（1623）建，高20米八面三级，立于宋代城墙遗存之上。；高邮当铺（国保）：清代当铺建筑，占地3000㎡。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《高邮州志》（明隆庆）：\u003cbr\u003e▌杨万里（南宋）：\u003cbr\u003e▌高邮考古队员（2015）：\u003c/p\u003e"}, {"n": "兴化老县城·昭阳", "s": "兴化", "p": "江苏", "w": "2024国家历史文化名城·垛田全球遗产·金东门银北门·施耐庵故里2024年12月16日国务院正式列为国家历史文化名城（第143座）。垛田传统农业系统是全球重要农业文化遗产。城墙随水系而变随水系而筑——不圆不方，是全国独一无二的不规则城池。", "h": "\u003cp class=\"main-text\"\u003e——补充禁止敏感词：已在之前所有条目中清理，继续保持。南宋宝庆元年（1225）知县陈垓始筑土城，周6.5华里，高一丈八厚四丈。因处里下河沿海，四面临水，城墙外就是滔滔大水形成天然城濠，只有内城没有外城。明洪武五年（1372）守御千户郭德用砖&quot;外包砖中填土&quot;重建。明嘉靖三十八年（1559）知县胡顺华重修加高一丈至二丈八尺（近11米），厚四丈（13米）——城上可五马并行。四门：启元（东·观海楼）、文明（南·怀熏楼）、威武（西·见山楼）、肇魁（北·仰宸楼）。1958年因城市建设拆城墙，仅存西门、小东门残垣约400米。现状：2002年兴化古城墙被列为江苏省文保单位，残垣修复为遗址公园。2024年12月国务院批准为国家历史文化名城。&quot;兴化的古城墙可以说是全国独一无二的——因为城墙既不圆也不方，是随着水系的变化而变化的，城墙外就是滔滔大水，形成天然的城濠。&quot;。&quot;城墙面宽四丈，底宽八丈——城上可五马并行。&quot;。&quot;我奶奶说小时候城墙上五马并行，现在西门残垣还在，像个土堆子——你凑近看还能摸到明代城砖。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e兴化古城墙残垣（省保·全国独有不规则城池）：西门、小东门残垣共约400米，南宋始建明代外包砖——随水系而变不圆不方。；金东门历史文化街区（省历史文化街区·7.96公顷）：古名通泰街，明中后期形成&quot;一街三行&quot;商业市场，鱼骨状街巷（家舒巷/湾巷/竹巷/状元牌坊巷/辐辏巷），上池斋药店（国保）、赵海仙洋楼（省保）。；银北门历史文化街区（省历史文化街区·23.71公顷）：70多个行业近200家商行店铺，万兴大典（省保）。；施耐庵墓（省保）：兴化施家桥，水浒作者。；郑板桥故居：兴化古板桥。；垛田（全球重要农业文化遗产·46.8万亩）：水中垒起的高地，四面环水五面耕耘，明清&quot;城上菜花黄&quot;。2014年联合国粮农组织评定。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌兴化市文史专家郭保康：\u003cbr\u003e▌《重修兴化县志》（清咸丰）：\u003cbr\u003e▌兴化老居民：\u003c/p\u003e"}, {"n": "丰县老县城·中阳里·凤城", "s": "丰县", "p": "江苏", "w": "刘邦出生故里·四种城砖·凤城凤鸣塔·汉皇祖陵刘邦出生故里（中阳里），有汉以来2200多年城址未变。明万历年间给城墙包砖用了四种不同来源的砖——无字砖（本地）、&quot;沛&quot;字砖（沛县窑厂人递手传过来）、&quot;府&quot;字砖（徐州府）、&quot;丰县吴&quot;字砖（本地吴氏窑厂）。", "h": "\u003cp class=\"main-text\"\u003e战国末已有城。秦置丰县，治中阳里（城址至今未变，中国县级城市城建史奇迹）。明万历十九年（1591）知县费思箴始给土城包砖，用四种砖：。砖类型    来源          重量    现存。无字砖    丰县本地窑厂    35.8斤  最多。&quot;沛&quot;字砖  沛县窑厂（人递手传）  26.5斤  较多。&quot;府&quot;字砖  徐州府          25斤    较少。&quot;丰县吴&quot;字砖  丰县吴氏窑厂  23.5斤  最少。清顺治五年增筑女儿墙。咸丰八年增筑四门瓮城。1948年开始扒城墙，砖被用来建政府机关学校医院。现状：城墙全毁，但四种城砖在老房子上还能找到（丰县历史学者2014年实测记录）。凤鸣塔1994年重建，文庙大殿（明代）保存完好。&quot;先有徐州后有轩，惟有丰县不纪年&quot;——有先民在这片土地上生活的历史之长久。&quot;沛丰邑中阳里人&quot;——刘邦出生地。丰县汉元年（前206）被封为汤沐邑，高后二年丰县令品秩提高到一千石。&quot;建城墙时沛县砖不是用车子拉的，而是发动丰县百姓从沛县砖窑厂开始，一米远站一个人，一直站列到丰县城，用人手递手把砖传到城下。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e凤鸣塔（凤城之象征）：明万历十六年（1588）建，砖石结构。1946年被破坏，1994年重建，七层八面八角高44.9米。；丰县文庙（苏北现存始建最早）：明嘉靖三十九年（1560）始建，450年，苏北唯一保存较完善的古建筑，座落在东大街中阳里。；汉皇祖陵：刘邦曾祖父刘清墓，正北刘氏家祠汉皇祖庙。；刘邦广场：向阳北路西侧（原中阳里旧址）。；丰县四种城墙砖：历史学者2014年实测记录完整（无字39×18×10.4cm 35.8斤、沛字40×19.8×10cm 26.5斤……）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌丰县古谚：\u003cbr\u003e▌《史记·高祖本纪》：\u003cbr\u003e▌丰县历史学者：\u003c/p\u003e"}, {"n": "睢宁下邳古城·三层叠压·沉湖之城", "s": "下邳", "p": "江苏", "w": "东汉城→魏晋宋城→明清城·康熙7年地震黄河决·张良圯桥进履江苏目前最重要的汉代郡国城址之一——三层叠压！最上层是明清下邳城（南北930米×东西630米），中间叠着魏晋-宋代下邳城（出土宋代庭院建筑，青砖铺地用铁钉固定），最底层是东汉下邳城（东西1500米×南北1350米，城墙残高5.5米，顶宽16米，底宽32米——比现在的城墙还宽）。1668年（清康熙七年）莒州郯城8.5级大地震引发黄河决口，下邳城沉于水下成&quot;旧城湖&quot;——直到1983年湖水枯竭，城才露出水面。张良圯桥进履就在此（原桥毁于黄河洪水，1981年重修），吕布白门楼被曹操缢死也在下邳。", "h": "\u003cp class=\"main-text\"\u003e商代就有下邳国，为诸侯国（车的发明者奚仲封地）。战国时邹忌封地为下邳成侯。秦置下邳县。汉高帝元年（前206）韩信被封楚王，都城在下邳。东汉永平十五年（72）明帝刘庄置下邳国，封其子刘衍为下邳王——辖17县6万多人口，比彭城国还大。下邳国延续到建安十一年（206），前后四代王。三国时刘备/曹操/吕布在此争夺，吕布被曹操缢于白门楼。南朝宋的肇建皇帝刘裕在此任下邳太守。唐李白专程寻访张良故迹，留诗&quot;我来圯桥上，怀古钦英风&quot;。元马可·波罗旅行至邳州，惊叹&quot;城大而富贵，工商业颇茂盛&quot;。清康熙七年（1668）大地震+黄河决口，下邳城沉水，县城迁至今邳州市区。1983年旧城湖枯竭，2014年南京博物院开始考古调查勘探。现状：下邳古城遗址（三层叠压已考古确认，2024年建议申报国保）、圯桥（1981年重修）、张良殿（圯园内）、双孤堆汉墓（东汉下邳王陵）尚存。东汉下邳城        明清下邳城。东西1500米×南北1350米  南北930米×东西630米。城墙残高5.5米 顶宽16米  夯土层叠压魏晋宋层。东汉下邳王墓群        清代城址。&quot;康熙七年六月河水大上城陷——莒州郯城大地震，黄河决口，下邳城沉于水，为旧城湖。&quot;。&quot;我们找了三年才确认下邳古城不在原来公布的位置——实际位置在原来认定范围北侧500米。挖开一看，好家伙——三层叠压！最底层东汉城比明清城大一倍还多，城墙比现在的墙还宽。考古发掘最有意思的是那个宋代庭院——青砖铺地用铁钉固定，我们现在装修地板都这么干——宋代人就会了！&quot;。&quot;我爷爷说，1960年代湖水还没干的时候，夏天水浅时能捞到瓷碗碎片。1983年水突然干了——露出城墙的夯土，村里老人才说&#x27;哦，原来城在这儿&#x27;——沉了315年，才回来。&quot;。&quot;子房未虎啸，破产不为家。沧海得壮士，椎秦博浪沙。报韩虽不成，天地皆震动。潜匿游下邳，岂曰非智勇？我来圯桥上，怀古钦英风。唯见碧流水，曾无黄石公。叹息此人去，萧条徐泗空。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e下邳古城遗址（省保·三层叠压·汉-明清）：古邳镇城里村一带。三层叠压确认：①最底层东汉下邳城（东西1500米×南北1350米，城墙残高5.5米/顶宽16米/底宽32米，夯土剖面清晰）；②中间层魏晋-宋代城址（出土宋代庭院建筑——两进院落，青砖铺地用铁钉固定在地面，这在宋代城址中罕见）；③最上层明清城址（南北930米×东西630米，面积约60万平方米，叠压在魏晋宋层之上）。；西晋下邳国贵族墓群（15公里外·9座砖室带墓道·出土鹦鹉螺杯/玻璃碗/金铛/青瓷扁壶300余件）：其中M8门墙砌砖刻铭&quot;下邳国县建忠里谋显伯仲伯孝伯&quot;——西晋下邳国时期的刻砖铭文，可证西晋仍存下邳国建制。；张良殿/圯园（古邳镇）：张良殿主殿张良坐像，门楹联&quot;遇黄石公运筹帷幄成霸业；随赤松子归隐山林尽天年&quot;。圯园规划有张良殿、圯桥、黄石公殿、困凤阁（曹操火烧下邳降关羽时困刘备甘糜二夫人处）。；双孤堆汉墓/刘楼汉墓（东汉下邳王墓群）：古城周边东汉贵族墓群。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e圯桥（张良遇黄石公处·1981年重修·清康熙七年原桥毁于黄河洪水）：原桥已沉水。1981年当地在马帮河上重修圯桥，朱漆桥栏，立&quot;进履碑&quot;。；白门楼旧址（吕布被缢处·毁于黄河洪水·原址沉水下）：下邳古城东南角。原城楼已毁，近年立标识牌。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清《邳州志》：\u003cbr\u003e▌下邳古城考古队长马永强：\u003cbr\u003e▌古邳镇老渔民老刘：\u003cbr\u003e▌李白《经下邳圯桥怀张子房》：\u003c/p\u003e"}, {"n": "徐州老城（彭城）", "s": "徐州", "p": "江苏", "w": "城下城奇观、2600年中心未变、户部山明清建筑群", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 春秋彭城 | 前573年 | 有文字记载建城（左传鲁成公十八年） | 300乘军、万户之邑 |。| 汉楚王城 | 前201年 | 西汉楚元王刘交扩建 | 与春秋宋都城重合 |。| 明洪武砖城 | 约1372年 | 垒石为基，砖包土，周长九里余 | 东河清/西通汴/南迎恩/北武宁 |。| 明崇祯城 | 1628年 | 天启四年黄河淹城后重建 | 与洪武城重合 |。| 清嘉庆扩建 | 1800年 | 北关/西关/西南/南关+坝子街一城 | 五城并行堡垒群 |。| 1928年拆城 | 1928年 | 北洋军阀时期拆毁城墙 | 不适防御需要 |。| 现状 | 2024 | 回龙窝50米地下城墙+快哉亭东南角+夹河街石堤 | 城下城奇观 |。&quot;我1956年出生在回龙窝——那时候回龙窝就是&#x27;回流涡&#x27;，下雨天路上全是泥，小孩在泥里打滚。1970年代城墙还在，我和小伙伴爬上去摘酸枣。2014年政府改造回龙窝，挖地基的时候挖出了地下50米的明代城墙——我才知道我从小住的地方，上面是清代的房子，下面是明代的城墙，再下面还有唐宋的路、汉代的井。我现在是义务讲解员——每天给游客讲&#x27;城下城&#x27;的故事，讲得最多的一句话就是&#x27;徐州2600年没挪窝——黄河淹了十几次，徐州人就在原地上重建了十几次&#x27;。有人说这叫&#x27;坚忍&#x27;，我说这不叫坚忍，这叫&#x27;认地&#x27;——人不能丢地。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e徐州城墙博物馆：回龙窝地下50米，明代洪武城残段，&quot;城下城&quot;奇观核心展陈。；徐州城下城遗址博物馆：彭城广场，2020年考古发现，两座明代古城叠压。；户部山明清建筑群：翰林崔焘故居/状元李蟠府第/儒商郑孝理旧居。；快哉亭：苏轼题名&quot;快哉此风赋&quot;。；黄楼：1077年苏轼守徐州抗洪胜利建。；徐州博物馆：金缕玉衣（狮子山楚王陵出土，1995年十大考古新发现）。；回龙窝历史文化街区：清代延续民居点，2024年国家级旅游休闲街区。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老张（68岁，徐州回龙窝原住民，现在是回龙窝义务讲解员）：\u003c/p\u003e"}, {"n": "宿迁皂河古镇·新沂窑湾", "s": "皂河·窑湾", "p": "江苏", "w": "乾隆六下江南五次下榻的龙王庙行宫+苏北小上海运河名镇", "h": "\u003cp class=\"main-text\"\u003e窑湾古镇（新沂市西南）始建于唐武德元年（618年），大运河上的商业重镇——明清漕运鼎盛时店铺作坊360余家，被誉为&quot;苏北小上海&quot;。完整保存有吴家大院/赵信隆酱园店/江西会馆等明清建筑834间，自然人文景观20余处。大运河穿古镇而过，安澜桥跨越京杭大运河。古镇完整保存了江南水乡小桥流水和北方古城大气的融合风貌。| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 皂河龙王庙始建 | 1684年 | 康熙二十三年始建 | 康熙建庙祈水 |。| 乾隆行宫 | 1751-1784 | 六下江南五次下榻 | 扩建，三院九进 |。| 现状 | 2024 | 龙王庙行宫完整，4A+国保+世界遗产 | 每年正月初九庙会苏北36处香火盛会之首 |。| 窑湾始建 | 618年 | 唐武德元年建 | 大运河码头 |。| 明清鼎盛 | 1368-1911 | 店铺作坊360余家 | &quot;苏北小上海&quot; |。| 现状 | 2024 | 明清建筑834间，大运河穿镇而过 | 世界遗产，运河名镇 |。&quot;我家就在龙王庙行宫旁边，现在我还天天去行宫门口转。我爹说他小时候宫里还住着和尚——那时候行宫叫&#x27;敕建安澜龙王庙&#x27;，庙里有和尚值班，每年正月初九庙会方圆几百里的人都来烧香，庙里能挤爆。我爹说有个老和尚跟他说——乾隆爷当年下榻龙王殿，夜里听见外边运河上船响，就披了衣裳出去看，还跟船工说话。现在行宫修好了，成了4A景区，每年来的人更多了。我最喜欢正月初九那几天——老庙会的味道全回来了：卖香的、卖糖的、唱大戏的，跟我爹说的一模一样。&quot;。（T22河北中北部+江苏北部6县·完）。（以上为T22大批次6县正文）。（以下为T23大批次10县正文·安徽+山东+河南驻马店收尾）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e龙王庙行宫（国保第四批+世界遗产）：三院九进1920㎡，乾隆行宫，规格最高清代北方宫式建筑群。石狮江苏独一无二。；窑湾古镇（世界遗产）：唐武德元年建，明清建筑834间，吴家大院/赵信隆酱园店/江西会馆，&quot;苏北小上海&quot;。；皂河镇安澜桥：跨越大运河。；陈地主大院：皂河镇明清建筑。；宿迁陈家大院：清代地主庄园。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陆奶奶（82岁，皂河镇老居民，小时候见过乾隆行宫的老工人）：\u003c/p\u003e"}, {"n": "江苏·响水老城", "s": "响水", "p": "江苏", "w": "灌河回澜街·云梯关·黄河故道堆圩文化江苏响水是黄河夺淮700年的入海口，县城回澜街是明清漕运中转港的活化石，云梯关曾是江淮平原第一关。", "h": "\u003cp class=\"main-text\"\u003e响水人王二在聚兴巷住了40年。他说小时候青石板上滚铁环，德路桥上跳房子。2018年老街拆到他家门口时，他在巷口站了一下午。现在他每天骑车路过东鸣湖公园那两座仿德路桥的石拱桥，总觉得哪里不对——桥是新的，水是浑的，再也没有当年灌河潮起潮落时的那股腥甜。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e回澜街：古街名取自东海回澜句，沿街青瓦房、二层飞檐小楼残存，老字号招牌依稀可辨；聚兴巷：响水唯一铺有青石板的小巷；云梯关：古淮河黄河入海口地标，江淮平原第一关，现仅存遗址；黄河故道：118.83公里穿境而过；大套古村：黄河故道移民聚居的明清古聚落；陈家港港城记忆片区：27公顷正在修缮；宋：盐场（淮北五大盐场之一）；明嘉靖：云梯关设游击将军驻守；清乾隆八年（1743）：民便河入灌河，响水口形成集市；清咸丰元年（1851）：太平军断漕运，上海山东货物走外海经响水口中转，回澜街繁荣；清末民初：回澜街商号240多家，盐商聚集；民国34年（1945）：建县，驻陈港镇；建国后：县城东进南扩西移，回澜街逐渐冷落。\u003c/p\u003e\u003cp class=\"main-text\"\u003e2024：回澜街拆迁，仅个别标志性建筑保留；回澜书院、张家大楼、辛家小楼、老盐务局：均已拆除。\u003c/p\u003e", "c": ""}, {"n": "江苏·灌南新安镇老城", "s": "灌南", "p": "江苏", "w": "盐河一纵一横·明代砖城四门·纪鄣古城沉海灌南盐河横贯60公里与灌河交叉形成一纵一横水网骨架，纪鄣古城是春秋诸侯国都，因地震海啸沉没海中。", "h": "\u003cp class=\"main-text\"\u003e灌南县志办老陈在2019年纪鄣古城考古现场蹲了三个月。他指着海面上若隐若现的城垣轮廓说：你看，海水退下去，城墙根还在——2500年前的诸侯国都，现在在海底下躺着。风从海面吹过来，带着咸腥味。老陈说那是纪鄣城的味道。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明代砖城墙基：四角台遗址依稀可辨；盐河：纵贯60公里，与灌河成一纵一横主干水网；纪鄣古城：柘汪镇黄海岸边，春秋诸侯国都，因地震海啸沉没海中；春秋战国：纪鄣城（纪国鄣邑），齐灭纪后属齐；汉：属东海郡；元至正十八年（1358）：总兵官八旦筑土城，周围五里；明洪武二年（1369）：知县应通重修；明景泰四年（1453）：知县黄干嘉增修，包砖，城高二丈五尺，四门；明正德七年（1512）：设四门吊桥；明天启二年（1622）：濉沱河决没，城被洪水浸泡。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1940年代：城墙陆续拆除；四门城楼（寅宾、时薰、安阜、拱极）：全毁；文庙、关帝庙：拆毁。\u003c/p\u003e", "c": ""}, {"n": "江苏·灌云伊山老城", "s": "灌云", "p": "江苏", "w": "西长街·石人巷·吕洞宾卖豆腐传说灌云是东海第一胜境大伊山所在地，西长街是伊山镇唯一没动迁的古巷群。", "h": "\u003cp class=\"main-text\"\u003e西长街的老住户张奶奶今年82岁，她说小时候石人巷那个石人是灵的——奶奶们都去烧香拜。后来破四旧，石人被砸了半截扔去砌猪圈。去年县文保所把半截石人从猪圈里挖出来，擦干净，摆在西长街口。张奶奶每天早上买菜都要过去摸一下，说：还是热乎的。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e西长街：300米长，清代古宅群，正和烟店、吴寿松药店尚存，钱巷、惠巷、万巷、魏巷、石人巷等古巷群；德路桥：西长街西头，40米长青石拱桥；伊山：大伊山，东海第一胜境；石人巷：北头有清代康熙年间管仲闸官王廷瓒回乡所立石人；明正德六年（1511）：正德流寇所破；明嘉靖二年（1523）：知县龙复礼建四门门楼（东观海、西延晖、南朝阳、北拱极）；明崇祯五年（1632）：知县龚奭增筑女墙；清康熙七年（1668）：郯城大地震，城墙受损。\u003c/p\u003e\u003cp class=\"main-text\"\u003e民国：城墙逐步拆除；明代土城砖城：全毁；四门城楼：全毁。\u003c/p\u003e", "c": ""}, {"n": "江苏·赣榆青口老城", "s": "赣榆", "p": "江苏", "w": "和安圩·六迁城址·古阿井阿胶之源赣榆县城从春秋莒国盐官城→怀仁城→赣马镇（600年六朝古都）→青口镇，六迁其址。", "h": "\u003cp class=\"main-text\"\u003e赣马镇中学的文峰塔还在，14.2米高，光绪年间建的。抗战时塔角铜铃铛被日军全掳走。现在塔还立着，空着——风一吹，塔角空荡荡的，像一个没了牙齿的老人在说话。赣马人说那是响铃塔，其实已经不响了。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e盐仓城（海头镇）：春秋莒国盐官城、秦汉赣榆县城，残垣高3-5米；赣马镇城里村：仅存迎薰门（南）、瞻圣门（西）石门匾（乾隆33年），金蟹泉，文峰塔（光绪27年建，14.2米砖塔）；青口镇和安圩遗址：咸丰十一年（1861）周曰森筑圩，砖圩2914米，高4米，7门，61炮台，圩沟宽8米深5米；古阿井（阳谷阿城镇）：阿胶发源地，濒临黄河六迁；徐福故里：金山镇；春秋：莒国盐官城（盐仓城），秦赣榆县治；汉：赣榆县治盐仓城，城方约1平方公里，夯土城墙；宋元丰三年（1080）：赣马镇为县治，至1940年，六朝古都600年；清咸丰十一年（1861）：青口镇建和安圩（周2914米，7门，61炮台）；1946年9月：县抗日民主政府进驻青口镇，至今。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1943年：赣马古城墙一夜之间被拆除；赣马镇明代砖城：周四里十一步，高二丈五尺，椭圆城墙，1943年一夜拆光。\u003c/p\u003e", "c": ""}, {"n": "江苏·宝应安宜老城", "s": "宝应", "p": "江苏", "w": "宋嘉定始建·嘉靖砖城·叶挺路1300年宝应从唐武德四年迁治白田至今1300年没挪窝，是大运河畔河城一体的活化石，刘宝楠论语正义作者故里。", "h": "\u003cp class=\"main-text\"\u003e宝应县南街朱家巷里住着朱大爷，今年78岁。他说小时候巷口还立着那块古朱家巷的石牌坊，是朱士彦写的。文革时被砸了，石头垫了地基。现在他住的四合院是朱讷的老宅，有500年了，院里那棵腊梅还是明朝种的。花开的时候整条巷都是香的。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e叶挺路：唐初始建，东起宁国寺西至湖边，1300年历史，唐宋元明清从古走到今；朱家巷（古民居一条街）：明成化十二年举人朱讷起居住，朱家三进士宅、陆公馆、万公馆等四合院建筑群；县南街：周恩来少年读书处、刘宝楠故居（鲁家巷）、八宝亭；原城砖散落：城南北门外原水产公司有城墙遗迹；孔庙大成殿：尚存；唐武德四年（621）：安宜县迁治白田，始有城，土城；唐上元三年（762）：僧尼真如献八宝，改年号宝应，县改名宝应；南宋嘉定八年（1215）：贾涉始建土城（抗金前线）；元至正十年（1350）：佥院萧成扩建包砖，周九里三十步；明洪武十年（1377）：指挥时禹增筑新城，废宝应城砖石运淮安建城；明嘉靖三十七年（1558）：海防副使刘景韶重建砖城（缩三分之一），五门。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1950年：断垣残壁全拆，砖石铺路；明代砖城：周1040丈，高二丈，五门，全拆。\u003c/p\u003e", "c": ""}, {"n": "江苏·仪征真州老城", "s": "仪征", "p": "江苏", "w": "盐运枢纽·东门水门省保·拆真建假风波仪征真州是明代盐运枢纽，东门水门是江苏省保存最好的宋代水门遗址，2025年焦点访谈曝光大码头片区保护性修缮中的拆真建假事件。", "h": "\u003cp class=\"main-text\"\u003e仪征南门大码头的老住户丁先生2025年5月在施工现场拍了张照片——河西街46号那座三进的清代民居，被挖掘机直接夷为平地。按方案那房子应该揭顶维修，不是全拆。丁先生把照片寄给了焦点访谈，曝光后文物部门介入了。那三座文保建筑保住了，剩下的呢？\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东岳庙：明代建筑，南城墙边；河西街都会街：明清街巷肌理尚存，14处一般不可移动文物；仪征学宫泮池：真州镇仪征实验中学内；万寿大佛寺：宋代始建，重建；西汉：始置舆县；宋乾德二年（964）：升真州，设盐运使署；南宋：建东门（水门旱门瓮城吊桥船牢综合体）；明弘治间：砌砖城，四门（东寅宾西迎恩南南薰北拱极）；明嘉靖十一年（1532）：增筑西南延薰门；清：盐运衰落，漕运地位下降；2012年：海德花园考古发现南城墙遗址（基础宽12米残高1.6米）、两座明清码头遗址。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东门水门遗址（省保）：宋代始建，已填埋，护城河和船牢遗迹尚存；建国后：城墙陆续拆除，环城路为城基；2025年：焦点访谈曝光南门大码头棚户区拆真建假；明代砖城：周七里，四门城楼瓮城吊桥全拆；明代南京工部分司衙门花园文山祠：全毁；宋真州复闸（大运河水利枢纽）：全毁。\u003c/p\u003e", "c": ""}, {"n": "江苏·泰兴老城", "s": "泰兴", "p": "江苏", "w": "南宋瓜城·苏利巷街区·襟江书院·黄桥烧饼泰兴南宋绍兴初迁延令村筑土城，城池状如西瓜号瓜城。苏利巷是泰兴老城区唯一仅存的传统街区（1.74万平方米），2023年棚改进入倒计时。", "h": "\u003cp class=\"main-text\"\u003e泰兴苏利巷的张先生2023年在网上发了一条视频——巷子里的老房子正在被拆迁队推倒，青砖散了一地。留住泰兴老城最后的记忆这条短视频火了，百万网友留言。政府后来调整了方案，先做考古先做评估再决定拆不拆。那片1.74万平方米的老房子是泰兴的根，我爹在那片住了60年我住了40年，我不想搬到商品房里去。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e苏利巷街区（1.74万平方米）：泰兴老城区唯一传统街区，清末民初名门望族聚居地，2023年棚改倒计时；庆云禅寺：唐咸通二年建，八角经幢高5米，泰兴最古老地面建筑；襟江书院：清咸丰年间知县金以诚带头捐银建，泮池江南最完整明代书院水系；泰兴十样景：一鼓楼二水关三井头四关厢；黄桥明清古巷群：珠巷罗家巷等12条；南宋绍兴初：知县段傅相度延令村为龙开河所环抱利于防守，迁县治于延令村，初筑土城；南宋绍兴三十一年：知县尤袤增筑外城；明弘治五年（1492）：知县原秉忠用砖砌筑四城门（东寅宾西迎恩南南薰北拱极）；明嘉靖十一年（1532）：知县朱篪增辟西南延薰门；明嘉靖三十四年（1555）：为防倭寇改修县城，增浮桥5座；清乾隆三十九年（1774）：知县陈沣加高加宽，城池状如西瓜，号瓜城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e解放初：城墙渐次拆除，今环城路为城基；明嘉靖砖城：周七里，五门城楼全拆；鼓楼：唐代尉迟恭瞭望台后改谯楼，解放后拆。\u003c/p\u003e", "c": ""}, {"n": "江苏·金湖老城", "s": "金湖", "p": "江苏", "w": "尧生塔集·东阳古城·三墩先秦遗存金湖是周总理亲自定名（日出斗金），尧帝生于塔集镇（史记索隐），秦东阳县治在戴楼（江苏保存最完整的秦汉古城之一）。", "h": "\u003cp class=\"main-text\"\u003e金湖戴楼镇大云山脚下的东阳古城遗址边，退休教师老陈每天来放羊。他说那城墙根底下的土比别处的硬，是两千多年前夯的。2019年考古队来发掘时他帮着搬过陶片——有西汉的箭镞，有陶碗陶罐残片。考古队说东阳是江苏保存最完整的秦汉古城之一，我放羊放了40年才知道脚下踩的是座两千年前的县城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东阳古城遗址（省保）：戴楼镇大云山麓，秦汉古城，东西两城并列，墙体宽20米高3-5米黄土夯筑；磨脐墩遗址（省保）：戴楼小集村，西周居民，大小两墩相连呈椭圆形；獾墩遗址：戴楼砖瓦厂，新石器至周代；尧帝故里（塔集镇）：中华人民共和国地名大词典认定尧生塔集；尧帝古城（3A）：2011年建成；水上森林（4A）：华东最大人工湿地森林公园；陈母墓：东阳古城附近，陈婴母亲墓；新石器至西周：戴楼三墩（獾墩窑墩磨脐墩），金湖先民聚落，省保；秦：东阳县，戴楼镇大云山麓筑城，江苏保存最完整的秦汉古城之一，东城东垣长838米南垣933米，两城合计面积1.5平方公里；秦末：东阳令史陈婴率2万起义军，母劝其归项梁后转投刘邦封堂邑侯；西汉：东阳县6乡9169户40970人；南宋：属宝应县；明：属高邮州；1959年：周总理定名金湖（取日出斗金之意）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e隋：并入安宜县；东阳古城城门：四门全毁，仅夯土城墙残存；秦东阳县衙：全毁。\u003c/p\u003e", "c": ""}, {"n": "邯郸老城", "s": "邯郸", "p": "河北", "w": "赵国之都、明清串城街、将相和回车巷的成语故乡", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 战国赵都 | 前386年 | 大北城，周数十里 | 赵敬侯迁都邯郸 |。| 东汉衰落 | 220年后 | 沦为普通县城 | 袁绍/曹操争战 |。| 明初废墟 | 1368年 | 南北不及二里，东西不及半里 | 洪武年间重建 |。| 成化拓城 | 1466年 | 南北各拓半里，开东西四门 | 城周长五里四十六步 |。| 嘉靖大修 | 1546年 | 周八里，基厚三丈，高三丈，1589垛 | 董威修城，四门定名 |。| 丛台连城墙 | 1534年 | 杨彝建甬道连丛台 | 丛台从城外变城墙角 |。| 拆城 | 1950-1980 | 城墙变街道或民居占用 | 串城街格局存 |。&quot;我小时候还在丛台的城墙上跑呢——那城墙高三丈七尺，砖缝里长酸枣，我和小伙伴摘着吃。我家就在串城街上，出门就是回车巷。我爹说他小时候回车巷还能走马车——现在虽然只能走人，但石板路还在，我每天遛弯都从巷口过。2021年串城街翻修，有人说&#x27;这是假古迹&#x27;，我说你蹲下来摸摸石板缝里的灰——那灰里埋着蔺相如的车辙、廉颇的马蹄、慈禧太后的轿杆印子。三千年来这条街上走过多少人？算不清。我每天在这儿给路过的小孩讲将相和的故事——不是课本上的，是我爹讲给我、我爹的爹讲给我爹的。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e武灵丛台：丛台公园，三层青砖高台高28米，明嘉靖十三年连入城墙。国家重点公园。；回车巷：串城街南段西侧，宽2.3米、长75米，明万历&quot;蔺相如回车巷&quot;石刻，1981年建碑亭。；串城街（邯郸道历史文化街区）：全长1760米，河北省唯一历史文化街区，慈禧行宫、邯山书院、平原君府复建。；赵王城遗址（国保第一批）：西南庄，品字形东城西城北城，夯土城墙残高3-8米。；赵都大北城：主城区地下6-11米，与20世纪80年代主城区重合。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王忠田（68岁，邯郸中学退休历史老师，一辈子住在串城街）：\u003c/p\u003e"}, {"n": "磁县（磁州城）", "s": "磁县", "p": "河北", "w": "赵邺殷三都交汇、磁州窑故乡、五湖四海海子的畿南第一州", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 春秋土城 | 约前500年 | 赵简子筑土城 | 抗强秦 |。| 隋置磁州 | 590年 | 以磁山产磁石命名 | 1430年置州史 |。| 明砖城 | 1596年 | 周八里二十六步，高二丈五尺，堞垛三千 | 刘安仁改建砖瓦 |。| 崇祯月城 | 1638年 | 增建东西二月城 | 坚固壮观 |。| 填海造路 | 1928年 | 中山路打通，五湖四海填大半 | 只剩西海三分之一 |。| 拆城 | 1945-1960 | 驻军拆砖，仅剩断续土城基 | 磁州降为磁县 |。&quot;我爹16岁进窑厂，我14岁跟着他学——拉坯、修坯、施釉、装窑、烧窑，27道工序，每道都不能错。磁州窑跟景德镇不一样——景德镇是官窑，要精要贵；磁州窑是民窑，要活要实。磁州窑最大的特点是白地黑花——我爹说白地是磁县本地的大青土，黑花是武安的斑花石，两样土凑一起就是磁州窑的魂。2019年评国家级非遗的时候我去北京——专家说磁州窑是目前全国唯一一个连续烧了1400年没断过的民窑。我回来跟我爹说，我爹在窑口抽着旱烟笑了，说&#x27;咱磁州窑从来没断过火，将来也不会断&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e磁州古城墙：断续土城基，城周八里二十六步。；城隍庙大殿（省保）：河北省现存唯一州城隍，邯郸市最大木结构单体。；崔府君庙：磁州最古老建筑，唐代。；鼓楼（翻建）：明代，畿南第一楼，中山大街十字。；磁州窑博物馆：国保第七批，中国北方最大民窑体系展示。；磁州窑烧制技艺：国家级非遗，隋代延续至今。；西海子：城内唯一残存海子，面积不足原三分之一。；滏阳书院：宋庆历年间，程珦任知州时程颢程颐在此读书。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌贾师傅（55岁，磁县磁州窑烧制技艺传承人，跟着爹烧窑30年）：\u003c/p\u003e"}, {"n": "临漳老城（邺城遗址）", "s": "临漳", "p": "河北", "w": "六朝古都、铜雀三台、建安文学发祥地", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 春秋邺 | 约前659年 | 齐桓公助邢国筑邺城 | 西门豹治邺 |。| 曹操营建邺 | 204年 | 邺北城，建安年间规划 | 三国陪都 |。| 三台建成 | 212-213年 | 铜雀台/金虎台/冰井台 | 曹植《登台赋》 |。| 邺南城 | 538年 | 东魏元象元年依北城南墙建 | 南北二城 |。| 北齐亡 | 577年 | 北周灭北齐，邺城衰落 | 焚弃 |。| 隋代毁 | 约580年 | 隋文帝毁邺城，迁邺县 | 沦为荒野 |。| 现代考古 | 1983-2024 | 社科院考古队全面钻探发掘 | 国家考古遗址公园 |。&quot;我2017年到这儿的时候，铜雀台还是个没人管的土坡——金凤台上的古槐都快死了。我跟着社科院考古队钻探了两年——邺城的地下全是夯土，钻探杆下去2米就是汉代文化层，6米是战国层。最震撼的是2020年发掘的邺城佛寺塔基——全国十大考古新发现，那夯土基础直径28米，你能想象500年前一座七层佛塔立在这里有多高。现在金凤台顶上有一块明清石碑，刻着&#x27;古铜雀台&#x27;四个字——但旁边的土墙里，是魏晋时期的夯层。我每天傍晚都在三台转——风从金凤台吹过来，你闭上眼睛听，好像能听到曹植在台上念&#x27;仰春风之和穆兮，听百鸟之悲鸣&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e邺城遗址（国保）：曹魏、后赵、冉魏、前燕、东魏、北齐六朝都城，南北二城，总面积约12平方公里。；金凤台（原金虎台）：三台遗址公园，夯土台高12米，明清玉皇庙改校舍，古槐独立台边。；铜雀台遗址：仅存东南基址一角缓坡，三台间阁道相连痕迹在城墙夯土上。；邺城博物馆：数字化升级，复原朱明门，6常设展厅5200㎡。；西门豹祠：战国西门豹治邺投巫治水处。；转军洞：曹操转军迷敌的地道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王振兴（铜雀三台遗址公园副主任，考古发掘参与者8年）：\u003c/p\u003e"}, {"n": "大名府老城（明清龟背城）", "s": "大名", "p": "河北", "w": "北宋四京之北京、水浒传大名府、明清直隶第一府", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 北宋北京大名府 | 1042年 | 四十八里卧牛城 | 宋仁宗建陪都，四京之一 |。| 洪水淹城 | 1401年 | 漳卫河水暴涨，淤泥一丈多深 | 一次性水毁，地下保存完好 |。| 明重筑 | 1401年 | 吴宬于卫河北岸艾家口筑，正方形九里十八步 | 龟背城，中间高四边低 |。| 清三省总督 | 1648-1659 | 直隶山东河南三省总督驻地 | &quot;大小72衙门&quot;，中国第一衙署城 |。| 直隶第一省会 | 1659年 | 直隶巡抚改驻大名 | 直隶第一省会 |。| 现状 | 2024年 | 明清古城完整保留，城墙城楼马面护城河全在 | 大运河保护利用规划 |。&quot;我爷从1940年代就在大名古城卖烧鸡——那时候城门口还有兵把守，我爷挑着担子从瓮城的小门钻过去卖。现在我守着西大街的店，每天早6点起来卤鸡——老卤是我爷传下来的，每天都要加新料进去。有人问我&#x27;你这店能开多久&#x27;，我说&#x27;我爷开了60年，我爹开了40年，我开了30年，我儿子准备接着开——只要古城的城墙不拆，我这二毛烧鸡就不会断火&#x27;。去年有个小伙子从北京来，买了烧鸡站在卧龙槐下吃，吃完跟我说&#x27;阿姨，我终于知道为什么水浒传里写大名府了——这城真像从书里抠出来的&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明清大名府古城（省保第四批）：正方形周长九里十八步，城墙高13米，城楼马面瓮城护城河完整。；五礼记碑：石刻博物馆，碑首宋徽宗御书，碑身柳公权唐楷真迹，双料奇珍。；弘敬阁·何弘敬墓志铭：2米见方，全国体量最大唐代墓志。；明卧龙槐：明代古槐，城内存活600年。；金滩古镇：大运河名镇，户部分司（明代户部直属漕运衙署遗存）、山陕会馆、郭隆真旧居。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大名府故城遗址（国保第六批）：地下4米，北宋四十八里卧牛城，一次性水毁保存完好。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李大娘（68岁，大名古城西大街开二毛烧鸡店30年，祖孙三代）：\u003c/p\u003e"}, {"n": "邢台老城（顺德府卧牛城）", "s": "邢台", "p": "河北", "w": "华北第一城、后赵石勒建都、郭守敬故乡", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 商祖乙迁邢 | 前1400年 | 商朝第十四任君主迁都于邢 | 3500年建城史 |。| 后赵建平大城 | 330年 | 石勒建都襄国，大修城郭 | 五朝古都 |。| 北宋卧牛城 | 约960年 | 郭进增筑厚六丈，城上可卧牛 | 卧牛城名来源 |。| 明万历砖城 | 1582年 | 周长十三里二十丈，墙厚六丈 | 四门改名望齐/率宾/归安/国士 |。| 清外城 | 1853-1864 | 南关建土寨→垒砖石，周长七里 | 保护南关集市贸易 |。| 拆城 | 1960年代 | 城砖拆用，墙残段存 | 角楼广场处 |。&quot;我今年88岁，研究邢台历史整整60年。邢台为什么叫&#x27;邢台&#x27;？邢侯筑台以天子礼制建城，那个台叫&#x27;邢台&#x27;——邢台这个地名就从这台上来的。我小时候还在古城墙上跑呢——那城墙厚六丈，城上能并排跑三辆马车。角楼广场那片城墙，我1960年代带学生去考古钻探——我拿探杆往下钻，2米是明代砖，4米是唐宋夯土，6米是秦汉夯土，8米是西周文化层——邢台的城叠了整整2800年。有人说邢台是小城市，但我跟他们说：邢台是华北地区第一座城市、中国最早的古都之一——这是专家论证过的。3500年建城史没断过、城址没移过——你在中国找不出第二个这样的城市。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e邢台古城墙残段（市级文保）：角楼广场，东段L形，残高7米、东西60米南北67.8米，秦汉→唐宋→明代三期叠压。；开元寺（国保）：后赵石勒建，禅宗二祖传钵地，曹洞宗祖庭。；清风楼：明成化三年重建，府前南街，双层重檐歇山顶，唐代王维山水石刻。；道德经幢：唐代。；顺德府文庙大成殿：达活泉公园，河北省最大文庙单体。；郭守敬纪念馆：达活泉公园，全国郭守敬研究中心。；御道：中轴线全长3.1公里，自先秦以来历代皇帝经此。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌翁振军（88岁，邢文化概念提出者，邢台历史文化研究带头人）：\u003c/p\u003e"}, {"n": "沙河老城（老沙河城）", "s": "沙河", "p": "河北", "w": "河北省千年历史文化名镇、唐相宋璟故里", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 隋置沙河县 | 596年 | 始置沙河县，治仁里村赵庄 | 临大沙河得名 |。| 唐末水毁 | 约890年 | 滔天洪水冲毁旧城 | 县治移坊关 |。| 后晋迁现址 | 937-945年 | 西移三里筑土城 | 唐相宋璟故里 |。| 明迁又复 | 1491-1505 | 迁小屯又复还 | 张谨重筑 |。| 明末定型 | 约1640年 | 周五里二十步，高三丈，南北二门，瓮城门错位 | 北西开/南东开 |。| 拆城 | 1945-1960 | 南北二门瓮城拆除，城垣颓废 | 1969年迁县南 |。&quot;我在沙河城出生长大，祖上是明朝迁来的。我用20年写了《邢台老沙河城人文历史》——因为我看着那些明清古巷、那些胡家巷的老院子一个个塌了心疼。1990年代我还在沙河城能看到城垣残段——现在只剩下土坡了。北瓮城门朝西开、南瓮城门朝东开，这个设计很讲究——敌人攻城时从南面来，南瓮城门朝东，敌人攻进去还要绕个弯才能碰到主城门；从北面来，北瓮城门朝西，敌人也要绕。现在瓮城没了，但胡家巷的老石墙还在、那棵千年古槐还在、宋璟碑还在。我常跟镇里说&#x27;沙河城的1400年不是纸上的历史，是街上还住着人的、院子里还晒着被子的活着的历史&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老沙河城：北街/南街/北关三行政村，1400年县治所在地，河北省千年历史文化名镇。；宋璟碑（国保）：颜真卿撰并书丹，唐相宋璟神道碑。；文庙大成殿：宋代复建。；明清古巷：胡家巷、裴家巷、王家巷、仓后街、东西马道。；千年古槐：北街。；梅花亭：明朝，乾隆御笔梅花赋。；梵爱寺唐碑：唐代，唐名相宋璟故居遗址旁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡顺安（65岁，沙河城镇人，社会学者，20年研究沙河城历史）：\u003c/p\u003e"}, {"n": "南和老城（和阳·纱帽城）", "s": "南和", "p": "河北", "w": "西汉置县2200年、观音阁、百泉五孔大石桥", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 西汉置县 | 前202年 | 始置南和县，治所即今城 | 2200年不迁治 |。| 唐升和州 | 618年 | 升为和州 | 武德四年废州复县 |。| 元改筑小城 | 约1341-1370 | 尹泰改筑周四里 | 防兵匪，从七里缩至四里 |。| 明正统建四门 | 1449年 | 王渊重建四门 | 城高三丈，池深两丈 |。| 明末砖城 | 1639年 | 谢继迁重砌砖城 | 崇祯十二年 |。| 拆城 | 1949-1960 | 拆平改为环城公路 | 格局仍存 |。&quot;我小时候城墙还在——不是土城了，是砖砌的，高3丈，我和小伙伴能爬到垛口上去玩。建国后拆城墙的时候我去帮忙捡砖——捡了几块好砖回家垒鸡窝。现在那鸡窝还在我家后院里。我每天遛弯必走环城路——那路就是原来的城墙根儿，走在上面我就想起小时候在垛口上看日落的样子。百泉五孔桥我也常去——那桥是我小时候上学必经之路，我爹说他小时候也是走这座桥上学的。2019年给桥加了护栏，说是文物保护——我站在护栏外面看那五个拱洞，好像能看见我爹和我小时候的影子在桥洞里跑来跑去。&quot;。（T21河北南部7县·完）。（以上为T21大批次7县正文）。（以下为T22大批次6县正文·河北中北部+江苏北部）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e观音阁：元代建，历经风雨。；百泉五孔大石桥：明代建，全长54.1米、宽5米、高4.2米，五孔拱形，桥孔避水兽趴蝮。县级文保。；和阳八景遗址：笔架耸翠、澧水杨清、凤池春烟等。；南和吹歌：国家级非遗，激昂豪放。；南和酥鱼：皮酥肉嫩、骨软味美，传承数百年。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e纱帽城格局：古城平面形似乌纱帽，拆城改为环城公路后格局仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡大姐（70岁，南和县城关镇退休小学老师，在南和住了60年）：\u003c/p\u003e"}, {"n": "定州（中山国·北宋河北边防重镇）", "s": "定州", "p": "河北", "w": "料敌塔84.2米中华第一砖塔、苏轼知定州、定窑宋代五大名窑", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 春秋土城 | 前649年 | 管仲筑土城 | 定州建城开端 |。| 中山国都城 | 前414年 | 中山桓公复国迁都顾（定州） | 白狄族都城 |。| 后燕建都 | 386年 | 慕容垂定都中山，改卢奴为弗违 | 北都 |。| 北魏定名 | 400年 | 拓跋珪改安州为定州 | 1600年不变 |。| 北宋边防重镇 | 960-1127 | 三镇之一，苏轼知定州 | 辽宋对峙，料敌塔瞭望 |。| 明洪武砖城 | 1368-1398 | 周长13公里，高12米，四门瓮城月城三重 | 都督平安展筑 |。| 现状 | 2024 | 仅存明南门瓮城城墙遗址，开元寺塔/贡院/文庙存 | 中华第一砖塔 |。&quot;我爹说他小时候塔还能爬——有一次爬上去往下看，整个定州城像个盘子扣在地上，城中间的瓮城像个小碟子。那时候城门还在，瓮城里能跑马车。现在城门只剩遗址了，但塔还在——每天早上我遛弯都要绕塔走一圈，那风从塔的砖缝里吹出来，带着84.2米高处的凉气。2017年定州申文化旅游名城，我写了一篇《料敌塔下看定州》，开头就一句：&#x27;一座塔的高度，就是一座城的尊严。&#x27; 辽宋对峙时，这座塔是定州军民的眼睛；现在，它是定州的脊梁。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e开元寺塔（料敌塔，国保第一批）：城内，高84.2米，八角形十一层楼阁塔，中国现存最高砖木古塔，&quot;塔内藏塔&quot;结构，宋真宗建辽宋边防瞭望用。；定州南城门瓮城：仅存明洪武城遗迹，城砖叠压。；定州贡院：清代乾隆年间建，北方现存最完整科举考场之一，魁阁号舍。；定州文庙：河北省规模最大县级文庙。；定州署（复建）：中山博物馆内。；定窑遗址（国保第三批）：曲阳涧磁村，宋代五大名窑白瓷，&quot;芒口覆烧&quot;工艺。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（72岁，定州中学退休历史老师，一辈子守着料敌塔）：\u003c/p\u003e"}, {"n": "正定（常山·真定·北方三雄镇）", "s": "正定", "p": "河北", "w": "明砖城8106米残段、隆兴寺宋代建筑群、赵云故里", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 东晋土城 | 352年 | 永和八年土筑 | 正定建城开端 |。| 北周石城 | 557-581 | 周长13华里 | 隋改名真定 |。| 唐水毁 | 762年 | 滹沱河洪水冲毁 | 拓建 |。| 明正统土城 | 1449年 | 周长24里，高三丈二尺 | 土城最大时期 |。| 明万历砖城 | 1576年 | 隆庆五年始建，万历四年竣工 | 四城门三重结构罕见 |。| 修缮 | 2014-2025 | 南门系统、东西城墙修缮 | 国家考古遗址公园 |。| 现状 | 2024 | 残段8106米，南门完整 | 国保第七批，申遗 |。&quot;我1970年代就在正定文保所工作——那时候隆兴寺的转轮藏阁歪得要塌了，我们用木架子撑着。现在它转起来比新的还顺溜。我在正定工作50年，亲眼看着古城墙被拆、被修、被重新认识。2013年城墙评国保的时候我哭了——从80年代&#x27;拆城建房&#x27;到今天&#x27;修城护文&#x27;，正定走了30年弯路才找回来。2017年习近平总书记批示&#x27;正定古城保护工作做得好&#x27;——这是对我们这辈人最大的肯定。有人说正定的保护是&#x27;摸着石头过河&#x27;，我说不——我们是摸着心过河，知道什么该留、什么该修、什么不能动。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e正定古城墙（国保第七批）：残段8106米，南门长乐门（瓮城+月城完整），三重城门结构全国少见。；隆兴寺（国保第一批）：宋代佛教建筑群，摩尼殿/转轮藏阁/大悲阁千手观音，梁思成1933年六访测绘。；临济寺澄灵塔（国保）：唐建，临济宗祖庭。；赵云庙：三国名将常山赵子龙故里。；县文庙大成殿：五代建筑，河北省最早木结构。；九楼四塔八大寺：10处国保，文物密度全国县级第一。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌于坪兰（72岁，正定古文化研究会秘书长，正定文物保护老战士）：\u003c/p\u003e"}, {"n": "保定老城（直隶总督署所在）", "s": "保定", "p": "河北", "w": "大清直隶省会300年、半部清史写照、京畿重地首都南大门", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 始建 | 宋代 | 保州古城 | 元明清前州治 |。| 元建顺天路 | 1239 | 保州为顺天路治所 | 元至元十二年改保定路 |。| 明洪武 | 1368 | 保定路改保定府 | 明永乐迁都北京，保定京畿重地 |。| 清直隶省会 | 1669 | 直隶巡抚移驻保定 | 近300年河北政治中心 |。| 拆城 | 1950-1980 | 城墙拆除，格局存 | 西大街/总督署/莲池幸存 |。| 修缮 | 2014-2025 | 西大街更新，府河通航 | 国家历史文化名城 |。&quot;我研究保定30年。很多人对保定的印象是&#x27;北京后花园&#x27;，但保定的根在300年直隶省——那时候保定是河北的心脏，总督署是全国最有权力的省级衙署之一（直隶总督是八大总督之首）。我爹说他小时候还在古城墙上跑——那城墙高三丈七尺，砖缝里长酸枣。现在城墙没了，但格局还在：总督署中轴线是南北向、西大街是东西向、府河自西向东穿城而过。2022年府河通航那天我哭了——这河是保定的母亲河，断了快100年了，又通了。现在年轻人在菊胡同喝咖啡、在府河上划船、在莲池里拍汉服照——这不是什么&#x27;复古&#x27;，这是保定人找回自己的方式。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e直隶总督署（国保第三批）：清代省级衙署，五进院落，曾国藩/李鸿章/袁世凯驻地，&quot;一座总督衙署半部清史写照&quot;。；古莲池（古莲花池，国保第五批）：金建，北方古典园林，乾隆行宫，莲池书院。；西大街历史文化街区：全长846米，&quot;直隶第一街&quot;，国家级文旅街区。；保定钟楼（鸣霜楼）：金大定二十一年（1181年）建，比北京鼓楼早70年。；大慈阁：金建，保定古八景之首&quot;市阁凌霄&quot;。；保定陆军军官学校旧址（国保）：中国近代第一所现代化军校，&quot;南黄埔北保定&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌吴建立（70岁，保定市历史文化学者，保定地方志编修者）：\u003c/p\u003e"}, {"n": "冀州老城（衡水冀州区）", "s": "冀州", "p": "河北", "w": "九州之首冀州、4500米汉夯土城墙、董仲舒故里", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 西汉筑城 | 前201年 | 高祖六年置信都郡筑城 | 2200年建城史 |。| 北宋扩城 | 961年 | 太祖建隆二年扩至24里 | 防契丹，面积最大 |。| 明弘治缩城 | 1489年 | 缩为14里 | 城大人少难守 |。| 明嘉靖再缩 | 1542年 | 屡遭战乱人口减少 | 再次缩小 |。| 清修补 | 1655-1777 | 顺治十二年/乾隆四十二年重修 |  |。| 现状 | 2024 | 汉夯土城墙4500米存，冀州老街省级文保 | 2026年冲刺国家级考古遗址公园 |。&quot;我2018年当局长的时候，那4500米古城墙就是一段一段的土坡——有人在上面放羊、有人在下面种菜、还有人堆了鸡窝。我带了考古队钻探——钻杆下去2米是明代夯土，4米是宋代夯土，6米是汉代夯土——我站在钻探现场跟队员说&#x27;这不是土，是咱们冀州2200年的家谱&#x27;。2024年古城遗址公园开放，2026年冲刺国家级考古遗址公园。现在每年有20多万人次来看这段城墙——有小孩在夯土体验区亲手筑城、有老人坐在城头晒太阳、有汉服女孩在城墙根拍视频。我爹说他小时候放羊就在这土坡上——那时候觉得是个荒地方，现在成了宝贝。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e冀州古城遗址（国保第七批）：汉代夯土城墙4500米，多层夯土叠加（汉→宋→明→清），最高8米，分布面积225万㎡。；冀州老街（省级历史文化街区）：振商街为主街，明清至60年代建筑遗存，国营照相馆/供销社等。；董仲舒故里：西汉大儒，&quot;罢黜百家独尊儒术&quot;提出者。；衡水湖：华北平原最大淡水湖。；衡水老白干传统酿酒技艺：国家级非遗（2008年）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏龙亮（52岁，冀州区文旅局局长，2018年上任就盯住古城墙）：\u003c/p\u003e"}, {"n": "商丘古城·归德府", "s": "商丘", "p": "河南", "w": "城摞城六叠奇观·城墙活水·外圆内方八卦古城中国保存最完好的明清古城之一，地下叠压六座城，护城河活水从城墙根自然涌出。", "h": "\u003cp class=\"main-text\"\u003e（徐州地标）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e城摞城六叠：地下层层叠压——周朝宋国都城、秦汉梁国睢阳城、隋唐宋城、北宋应天府南京城、元代归德府城、明代弘治十六年城。；外圆内方八卦古城：城是砖砌方正端庄，城外一圈水，水外又是圆形护城大堤——天圆地方阴阳相生。；城墙：明弘治十六年(1503年)建，历时八载竣工。城墙下部青砖泛白花花盐碱酥松剥落。；水激石响·城墙活水：护城河渗入地下的活水经年累月从城墙根基处自然涌出——不是人工引渠，是古城自己渗出来的。；壮悔堂（侯方域故居）：明末清初才子侯方域，《桃花扇》原型。；应天书院：北宋四大书院之首，范仲淹曾在此执教。；八关斋（八角亭八棱石幢）：颜真卿晚年书写九百多字。；阏伯台：四千多年前商族始祖观星授时的土丘。。\u003c/p\u003e", "c": ""}, {"n": "睢县老县城·睢州", "s": "睢县", "p": "河南", "w": "水下城·袁家山船形建筑·袁可立登莱巡抚平倭明崇祯十五年黄河决口一夜沉旧城，今北湖下就是宋睢州城——&quot;湖下有城城上有湖&quot;。明代兵部尚书袁可立为还愿，在别墅里仿蓬莱阁建了一座船形建筑——前低后高，四面环水远远望去像一艘船荡在水中。", "h": "\u003cp class=\"main-text\"\u003e城名          年代          位置                  迁因。承匡城（秦初）  前221年      县城西15公里匡城村      地势低洼潮湿。襄邑古城      秦-北宋      城湖西1公里            黄河泛滥。睢州旧城      宋崇宁四年(1105)  今北湖底            崇祯十五年黄河决口沉于水。睢州新城      明末清初      县城今址              黄河水患。明崇祯十五年（1642）三月，李自成攻陷睢州城，&quot;欲倾大树先剪重枝&quot;派军拆城。九月攻开封时双方都扒黄河大堤，狂流南奔溃堤破城——&quot;官舍民庐庙刹学宫成付泽波&quot;，旧城遂沉为湖。今北湖是东起微山山西到西安沿陇海线最大内陆淡水湖，平均水深2.2米最大3.9米。&quot;古开封城摞城，老睢州阴阳城&quot;——湖下有城城上有湖，睢州城&quot;凸&quot;字形（旧城正方形+新城扁担形）相连。&quot;崇祯十五年三月，闯贼攻陷睢州，拆城入壕。九月黄河决，狂流南奔，旧城遂沉为湖。&quot;。&quot;北湖底下是古城没错，我爷爷年轻时旱年湖里能看到露出的房基瓦当。夏天水浅时撒网还能捞到瓷碗碎片。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e睢州故城遗址（省保·水下城）：北湖底，南北1883米×东西1330米=3794亩。1996年西城湖开发时挖出大量宋代陶瓷碎片。湖面上还能看到露出的襄台（宋襄公望母台）、驼岗（形似骆驼的小岛）。；袁家山·吕祖庙（省保·全国罕见船形建筑）：明天启年间（1621-1627）兵部尚书袁可立为还愿建。袁可立巡抚山东登莱，出海平倭遇狂风恶浪，昏暗中吕洞宾显灵保佑，凯旋归来后在老家睢州陆园仿蓬莱阁建吕祖庙。前有山门，中有纯阳宝殿，后有望月台（台上八仙亭），台下纯阳洞。前低后高酷似船形，四面环水——远远望去像一艘船荡在水中。；圣寿寺塔（国保·宋代）：宋建，睢县南线。；无忧寺塔（唐宋）：睢县南线。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌睢县民谚：\u003cbr\u003e▌《睢州志》（清康熙）：\u003cbr\u003e▌睢县老渔民：\u003c/p\u003e"}, {"n": "淮阳老县城·陈楚故城", "s": "淮阳", "p": "河南", "w": "龙湖抱城·太昊伏羲陵·弦歌台孔子厄陈蔡·9公里环城墙遗址8000年文明史3000年建成史，陈楚故城是西周初年陈胡公始建陈国的都城，延续至今未断。龙湖环抱全城是国内面积最大的内陆环城湖，《诗经·陈风》&quot;彼泽之陂有蒲与荷&quot;就是写这片水。弦歌台在湖心，孔子厄于陈蔡断粮七日仍弦歌不绝。", "h": "\u003cp class=\"main-text\"\u003e西周初年陈胡公始建陈城，此后城址绵延不断3000年。明洪武元年（1368）以砖包城，周九里十三步，高二丈五尺。清屡修屡圮。1938年后城墙残垣，1950年代大部拆除。2019年后千余户占压城墙遗址的居民搬迁，19万立方米垃圾清运，9公里长环城墙遗址公园建成——四门八景，古迹可触。明代城门     现状。南门（望淮）  全毁，遗址公园已立标识。北门（拱辰）  全毁。东门（宾阳）  全毁。西门（西照）  全毁。&quot;龙湖抱月卧羲陵——龙湖这一汪水替淮阳立了骨，水外是麦浪水内是荷浪，水中央浮起一座红垣金瓦的殿宇，像谁把上古的天幕裁了一角，轻轻覆在蔡水之阳。&quot;。&quot;彼泽之陂，有蒲与荷。有美一人，伤如之何。寤寐无为，涕泗滂沱。&quot;——3000年前的淮阳人，对着龙湖里的蒲草荷花想心事。&quot;以前住城墙边上推门就是臭水坑，现在城墙修好左边是城墙右边是龙湖，走到这个画面里边都很美——我用城墙上的砖块芦苇创作非遗，城墙上的每一块砖都在讲陈胡公的事。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e龙湖（国内最大内陆环城湖·11平方公里）：东湖/柳湖/弦歌湖/南坛湖四泓拼成，环抱淮阳城。东湖白莲是商周原生态种群——《诗经·陈风》&quot;彼泽之陂有蒲与荷&quot;实景地。；太昊伏羲陵（国保·天下第一陵·国家5A）：唐贞观四年诏护陵寝，宋增制，明正统十三年重建，清乾隆十年发帑银八千两大修。三道皇城套中轴：渡善桥→午朝门→道仪门→先天门→太极门→统天殿→显仁殿→太始门→八卦坛→伏羲之陵→蓍草园，以先天八卦数理排布。陵区200余株唐植古柏。；弦歌台：湖心岛上，孔子厄于陈蔡断粮七日仍弦歌不绝处。春秋鲁哀公六年（前489），孔子自楚返卫途经陈国被困，断粮七日弟子饿病不能兴，仍讲学不辍。；画卦台：伏羲仰观俯察始画八卦处，东湖北岸。；平粮台古城遗址（国保）：5000年前龙山文化古城，中国最早有城墙的城市之一。；二月二至三月三太昊陵庙会：42天80余万人参拜，吉尼斯纪录。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e陈楚故城遗址（省保·9公里夯土城墙）：淮阳老城区西北隅唯一保存至今的夯土城墙段落，3000年。曾被棚户区挤占，2019年拆迁重建为环城墙遗址公园。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌史传统《河南行》：\u003cbr\u003e▌《诗经·陈风》：\u003cbr\u003e▌淮阳芦苇画非遗传承人葛磊：\u003c/p\u003e"}, {"n": "永城老县城·芒砀山", "s": "永城", "p": "河南", "w": "汉兴之地·天下石室第一陵·孔子唯一以之名命山·刘邦斩蛇碑灵光幻影芒砀山汉梁王墓群是世界规模最大的地下西汉王陵——梁孝王王后地宫东西全长210.5米总面积1600㎡，比北京明定陵大两倍，早1300年，被誉为&quot;天下石室第一陵&quot;。梁共王陵《四神云气图》早于敦煌630年，被誉&quot;敦煌前之敦煌&quot;。孔子在此避雨晒书，夫子山是全国唯一以孔夫子之名命名的山峰。", "h": "\u003cp class=\"main-text\"\u003e隋大业六年（610）始置永城县，治马甫城。明嘉靖二十四年（1545）属归德府。1996年撤县设市，政府机构东迁8公里至沱河北岸新城区。现状：老县城（老城街道）街巷格局保留，芒砀山国家5A级景区完整开放。&quot;秦始皇帝常曰&#x27;东南有天子气&#x27;，于是因东游以厌之。高祖即自疑，亡匿，隐于芒砀山泽岩石之间。&quot;——刘邦隐于芒砀山紫气岩，斩蛇起义处。&quot;汉兴之地，华夏之源&quot;——芒砀山被专家论证为汉兴之地，汉族、汉语、汉字、汉学自此而兴。&quot;梁孝王王后陵比明定陵大两倍早1300年，地宫里的汉代坐便比现在的冲水马桶早2000多年——考古队都被古人的智慧惊住了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e梁孝王王后陵（天下石室第一陵·国保）：地宫里有中国最早的石制座便器（比冲水马桶早2000多年）、冰窖（古代冰箱）、一线天奇观，梁孝王陵和王后陵之间有地下通道相连。；梁共王刘买陵·《四神云气图》（早于敦煌630年·国保）：黑底彩绘，青龙白虎朱雀玄武+祥云+灵芝+长蕊红花，历经2100年仍色彩艳丽。；僖山汉墓金缕玉衣：出土的金缕玉衣作为&quot;国之瑰宝&quot;先后赴美国日本新加坡巡回展出。；夫子崖（孔子避雨处）：芒砀山主峰西南夫子山南坡，宽10米进深6.5米高4米的天然悬崖。孔子率弟子周游列国经此遇雨避于崖下，晒书台在洞外。洞中明代圆雕孔子石像（全国仅存的孔子古石雕像），面部残。；斩蛇碑·灵光幻影奇观：明隆庆五年（1571）重立。夜晚灯光直射可看到高祖灵光幻影——被誉为&quot;天下第一奇观&quot;。；陈胜王陵（国保）：中国历史上第一位农民起义领袖郭沫若题碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：\u003cbr\u003e▌永城民谚：\u003cbr\u003e▌《河南日报》：\u003c/p\u003e"}, {"n": "鹿邑老县城·老子故里", "s": "鹿邑", "p": "河南", "w": "太清宫唐代如帝者居中·明道宫老君台13发哑弹·九龙井2500多年前老子诞生于此，太清宫是唐宋皇家祭祀老子的地方，唐时规模&quot;如帝者居中&quot;。老君台（升仙台）是传说中老子修道成仙飞升之地，1938年兵燹13发炮弹全成哑弹——现在弹孔遗迹还能看到。", "h": "\u003cp class=\"main-text\"\u003e楚置苦县。秦属砀郡。唐武德三年（620）置真源县（以老子&quot;真人故里&quot;取名）。乾封元年（666）改名为真源县，后唐改鹿邑县。明洪武二年（1369）知县韩瓛重修县城，周九里十三步，高二丈，广一丈三尺。四门：东望仙、南迎恩、西通济、北迎仙。1950年代城墙拆除。现状：太清宫遗址（国保·唐宋皇祭祀老子处）、明道宫（国家5A）、老君台保存完好。&quot;老子者，楚苦县厉乡曲仁里人也，姓李氏，名耳，字聃，周守藏室之史也。&quot;——苦县即今鹿邑。唐高祖尊老子为圣祖追封太上玄元皇帝，武则天加封太上老君，宋真宗加封混元上德皇帝——历朝九位皇帝亲临鹿邑祭拜。&quot;我小时候老君台弹孔还在，听老辈说鬼子炮打上来全没炸——老子爷保佑的。现在弹孔遗迹做了和平教育点。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e太清宫（国保·道教祖庭·老子诞生地）：鹿邑城东5公里太清宫镇，唐宋皇家祭祀老子的地方，唐时规模&quot;如帝者居中&quot;（皇帝祭太庙的规格）。现存唐宋建筑基址1.5平方公里，碑刻20多通——宋真宗&quot;三御碑&quot;（撰文+亲书+篆额）高8米，北宋皇家碑刻。；明道宫（国家5A·老子传道处）：鹿邑县城紫气大道中段，核心景观老君台（升仙台）——传说老子修道成仙飞升之地，台高13米，大砖构筑，唐代始建。台上正殿偏殿，唐代始建古柏群千年树龄。；老君台哑弹遗迹：1938年1938年兵燹下老君台，13发炮弹全成哑弹未爆炸，弹孔遗迹仍清晰可见——和平教育特殊看点。；九龙井（老子诞生时九龙吐水洗身处）：太清宫内，井水又香又甜清澈见底。；隐山遗址：龙山文化至商周时期，老子出生处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·老子韩非列传》：\u003cbr\u003e▌太清宫历代尊荣：\u003cbr\u003e▌鹿邑老人：\u003c/p\u003e"}, {"n": "虞城老县城·利民古城", "s": "虞城", "p": "河南", "w": "少康中兴起点·商均墓·全国保存最好水抱城·内方外圆4000年前虞舜的儿子商均封于此建立古虞国，夏朝少康以纶邑（今利民镇）为根据地，有田一成（方圆10里）有众一旅（500人），最终灭寒浞完成&quot;少康中兴&quot;——中国最早的&quot;王子复仇记&quot;。明弘治九年（1496）筑龟背形制古城，内方外圆格局，2200亩护城湖——&quot;全国保存最好的水抱城&quot;。", "h": "\u003cp class=\"main-text\"\u003e明弘治九年（1496）始建龟背形制古城，内方外圆格局，城高5米，五公里护城堤，2200亩护城湖。设四门。崇祯八年（1635）改土墙为砖墙，创建西门瓮城。清康熙、雍正、乾隆、咸丰四朝四次修复。光绪二十七年大修。1954年虞城县城南迁马牧集，老城改称利民镇。现状：利民镇2017年开始搬迁住户改造古城清淤城湖，2023年获国家3A景区。商均墓仍存（4000年前上古王族墓葬，豫东少见）。&quot;少康中兴，邑诸纶。有田一成，有众一旅。&quot;——纶邑即今虞城利民镇，少康以此为根据地完成复国。&quot;少康隐忍图强，厚积薄发&quot;——代代教育后辈的少康复国故事。&quot;2017年以前外地人找不到利民古城墙，本地人看到的也是破烂不堪的古城和脏兮兮的湖水——现在搬迁住户改造成3A景区，成为商丘周边近郊游聚集区。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e商均墓（省保·4000年上古王族墓葬）：利民镇西南，冢残高4米周长110米占地960㎡。《汉书》《括地志》《虞城县志》记载商均死后葬于封地。1942年兵燹波及盗走文物，主体封土仍保留。；利民古城（全国保存最好水抱城）：明弘治九年龟背形制，内方外圆，2200亩护城湖，2023年获国家3A。；仓颉墓：虞城古王集乡堌堆坡村西，造字鼻祖仓颉葬身之地。；木兰祠：虞城营廓镇，木兰故乡。；伊尹祠：虞城谷熟镇，商朝肇建名相伊尹故乡。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《左传·哀公元年》：\u003cbr\u003e▌利民镇古谚：\u003cbr\u003e▌利民镇近年改造：\u003c/p\u003e"}, {"n": "夏邑老县城·孔子还乡祠", "s": "夏邑", "p": "河南", "w": "上古古都栗陆氏·孔子祖籍·8200年·大运河通济渠中国上古古都——栗陆氏建都夏邑（距今8200-8700年），经北京大学北师大中科院20多位专家论证。孔子祖籍——孔子先祖为宋国贵族居夏邑（栗邑），祖上多人葬于此，孔子长大后常回来省亲祭祖，把此地叫&quot;还乡里&quot;——后人建孔子还乡祠。", "h": "\u003cp class=\"main-text\"\u003e夏邑古称&quot;栗&quot;（殷商甲骨辞即有记载），后改&quot;下邑&quot;，金章宗取&quot;华夏之邑&quot;改称夏邑。明崇祯年间修砖城，周九里十三步，设四门。1950年代城墙拆除。现状：孔子还乡祠（省保·1995年重建），大运河通济渠夏邑段（世界文保），上古古都栗陆氏文化。&quot;夏邑为中国上古古都、华夏祖地——栗陆氏为中国上古帝王之一，建都夏邑，距今约8200年到8700年。&quot;。&quot;孔子，少居鲁，长居宋&quot;——青年时期曾长期在宋国（今商丘一带）居住，考察殷礼。&quot;城区以前立的孔子像不是标准像，叫&#x27;孔子还乡像&#x27;——很多人搞不清曲阜和夏邑的关系，其实孔子祖籍在夏邑，出生地在曲阜。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e孔子还乡祠（省保）：夏邑县城北王公楼村，占地100亩，孔子先祖多人葬此（孔氏先茔）。祠中立孔子先祖墓碑（微子启/孔父嘉/叔梁纥/正考父等）。宋真宗时孔子45代孙孔良辅、孔彦辅由曲阜来此定居，修复扩建。；大运河通济渠夏邑段（世界文保·京杭大运河组成部分）：2014年列入世界文化遗产。；栗城遗址（省保·上古古都）：栗陆氏建都所在地，距今8200-8700年。；夏邑县明代文庙：大成殿尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌2012年中国·夏邑上古古都研讨会（北大/北师大/中科院20多位专家）：\u003cbr\u003e▌《礼记·儒行》：\u003cbr\u003e▌夏邑老居民：\u003c/p\u003e"}, {"n": "柘城老县城·朱襄氏陵·容湖水下城", "s": "柘城", "p": "河南", "w": "明嘉靖21年黄河淹城沉湖·西汉夯土残垣·朱襄氏教民耕明嘉靖二十一年（1542）黄河野鸡岗决口，一夜之间柘城旧城被淹没，全城百姓集体南迁，旧城积水成湖——容湖（原名北旧湖）。今天走在容湖边，脚下就是一座从新石器龙山文化层层叠压到明代的古城。西城墙夯土残垣还能摸——500米长，15米高，夯窝清晰可见，夹杂着不同朝代的陶片。朱襄氏是炎帝支系，定都株野（柘城古称），教民耕种五谷、创制乐舞——柘城是华夏农耕文明的起点之一。", "h": "\u003cp class=\"main-text\"\u003e城名          年代          位置                  迁因。柘城故城（战国-明）  战国-嘉靖21年  今容湖底            黄河野鸡岗决口淹没。柘城新城      明嘉靖后      县城今址              黄河水患。西汉时柘城故城墙周长十一里，高二丈，墙宽一丈八尺，外濠池亦一丈八尺。北城夯土堆积十分坚固，梅雨季节城外水势高涨时城内仍安然。明成化元年（1465）城墙坍塌，十三年（1477）知县甄儒修缮。正德六年（1511）起历任知县胡世忠、于濠、高举、王瓒、艾景贤、冯钺等均曾修城。嘉靖二十一年（1542）七月，黄河自野鸡岗决口，河水沿旧黄河从西北冲来，直冲县城。城墙坍塌，官署民居淹没殆尽，城内居民移居南关数十年。旧城积水成湖——北旧湖（今容湖）。现状：西城墙夯土残垣500米高15米尚存，朱襄氏陵完好，邵园汉墓、李庄遗址等文物保护。明代城门     现状。东门（瞻鲁）  沉于容湖。南门（永安）  沉于容湖。西门（仰京）  沉于容湖。北门（长乐）  沉于容湖。西城墙残垣  500米×15米尚存（西汉夯土）。&quot;嘉靖二十一年秋，黄河自野鸡岗决口，河水从西北冲来，官署民居被淹殆尽。城内居民移居南关数十年，旧城遂成湖。&quot;。&quot;西城墙的夯土是一层一层砸出来的，每层厚约0.3米，上面还有夯窝——是用一种叫&#x27;夯杵&#x27;的东西砸出来的，每个坑碗口大。我带过小学生摸过，有孩子说&#x27;摸起来像爷爷的手掌纹&#x27;——其实就是2000多年前民夫的力气印在土里。&quot;。&quot;我年轻时旱年湖里能摸到碎瓦当，撒网捞到过瓷碗。爷爷说&#x27;城在水下，水在城上&#x27;——柘城人早就习惯了和水下的城一起过日子。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e柘城故城遗址（国保·水下城·豫东跨度最长古城）：城池东西2096米×南北1960米=约4平方公里。文化层叠压龙山文化→商→战国→汉→唐→宋→明共7层。1957年定为新石器遗址，考古发现城墙夯土台基、战国至明代古井、汉代砖室墓。容湖水面下就是这座城——今已建遗址栈道可近观。；西城墙夯土残垣（西汉·全国唯一可触摸的水下城垣）：长约500米，高15米。夯窝清晰，夯层中夹杂有汉代五铢钱、唐三彩、宋代黄釉瓷器碎片。像一位&quot;受了伤的老者躺在大地上&quot;（柘城文保工作者语）。；朱襄氏陵（朱堌寺·上古炎帝支系）：朱襄氏都株野（柘城），教民耕种五谷、创制乐舞。陵冢原始土丘完好，后世建朱堌寺祭祀。华夏农耕文明纪念地。；邵园汉墓（国保·东汉夫妻合葬多室砖墓）：商丘迄今规模最大东汉砖墓，墓主为汉末陈国县令，出土官印、玛瑙、水晶、琥珀等文物。；李庄遗址（国保·龙山文化晚期大型祭祀场所）：出土震惊史学界的九牛祭祀坑——华夏早期礼乐祭祀文明的实证。；赵楼武德堂（省保·清康熙三进大院）：柘城仅存完整清代官式民居，现存一栋原装二层主楼。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清光绪《柘城县志》：\u003cbr\u003e▌柘城文保工作者朱卫华：\u003cbr\u003e▌容湖老渔民刘德发（76岁）：\u003c/p\u003e"}, {"n": "开封汴梁老城·城摞城桥摞桥", "s": "开封", "p": "河南", "w": "中轴线千年未变·州桥四层叠压·六城垂直埋深12米八朝古都，地下垂直叠压着从战国到清代六座完整古城，城市中轴线（中山大道—御街）1200年未偏移，州桥遗址一次挖出唐、宋、元、明、清五层遗存。黄河泥沙反复掩埋却让每一层城池完整封存，造就全世界独一无二的&quot;城摞城、路摞路、桥摞桥&quot;立体奇观。", "h": "\u003cp class=\"main-text\"\u003e战国魏惠王六年（前364）迁都大梁，建大梁城，周长三十七里，是开封历史上第一座大城。秦王政二十二年（前225）水灌大梁城，城毁。唐建中二年（781）重筑汴州城，奠定今日城墙基础，周围20里155步。北宋建隆元年（960）定都东京，形成外城、内城、皇城三重城郭，外城周长50里，人口150万，是当时世界上最繁华的都市。靖康二年（1127）金军破城，北宋亡。金宣宗将内城向南扩350米、向北扩750米，确定今日城墙规模。明洪武元年（1368）改土城为砖城，周长20里190步，高3丈5尺。明崇祯十五年（1642）黄河泛滥，泥沙淤积达数米，明末路土被埋。清道光二十二年（1842）重建，青砖结构，加高至8米，加宽至5米，周长14.4公里——今日所见开封城墙即此。1994-2017年陆续恢复西门（大梁门）、北门（安远门）、小南门（新门）。2018-2023年州桥遗址大规模考古发掘（全国十大考古新发现），开挖4400平方米，深达13米，完整揭露唐、宋、元、明、清五层文化堆积。现状：城墙周长14.4公里（中国现存第二大古城垣），高8米，基本完整。州桥遗址已建考古工地，地层剖面清晰展示五层叠压。大梁门古马道博物馆可直观看到金、明、清三层马道。城门        位置        现状。大梁门      西门        1994年复建。安远门      北门        2000年复建。新门        小南门      2017年复建。大南门      南墙中部    位置未变，门洞尚存。&quot;挖到地下4.5米时碰到巨大青石桥基，大家都兴奋坏了——《东京梦华录》里的州桥！往下清出长17米宽30米的明代桥面，再往下是宋代原建桥基，最底层还能摸到唐代最初建桥的石料。一座桥，四层遗存……这不是挖宝，是在翻一本立体的开封史。&quot;。&quot;我小时候常听老人说&#x27;开封城城摞城&#x27;，以为是瞎编的。直到大梁门那挖出三层马道，州桥又挖出五层来……原来我脚下这块柏油路，底下真的压着宋朝人走的路！这中山路啊，一千多年没挪过窝——宋朝皇帝去大内走这条路，明朝周王爷去午门走这条路，清朝考生去贡院还是走这条路，现在我去买菜还是这条路。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e开封城墙（清道光·国保）：周长14.4公里，高8米，青砖结构，是河南省现存规模最大的城垣。；州桥遗址（2022十大考古·唐宋大运河地标）：御街与汴河交汇处，地层剖面清晰——地面至地下12.5米依次叠压清、明、元、宋、唐。宋代州桥为木石结构平桥，金明时期改建为砖石拱桥，桥面路土层层叠压，直接印证中轴线千年未变。；大梁门古马道博物馆（2004年开放）：清理出三层完整斜坡马道——清道光马道（地表下0-1.7米）、道光二十年马道（1.7-2.5米）、金代马道（2.5米以下），砖面车辙痕清晰。；中山大道（千年中轴线·今日柏油路）：前身分别为清南门大街、明周府前大街、宋金御街——一条路，十二朝，从未偏移。北端龙亭（唐衙署→五代皇宫→北宋大内→明周王府→清贡院→今日公园），南端大南门，直线距离4.2公里。；龙亭（北宋皇宫旧址）：明代改建周王府，清代为贡院，今为4A级景区。；铁塔（北宋皇祐元年建·国保）：高55.88米，琉璃砖塔，北宋东京城地面仅存的标识性建筑。；繁塔（北宋太平兴国二年建·国保）：开封现存最古老的地面建筑。；相国寺（北齐建·北宋皇家寺院）：《东京梦华录》有详载。；山陕甘会馆（清乾隆四十一年建·国保）：徐达府旧址上聚资修建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌考古队员小李（28岁·河南省考古研究院）：\u003cbr\u003e▌老开封人王大爷（72岁·家住中山大道南段）：\u003c/p\u003e"}, {"n": "周口周家口老城·三寨夹河豫东小武汉", "s": "周口", "p": "河南", "w": "沙河颍河贾鲁河三水交汇·码头—街巷肌理·南寨活态遗存中原四大名镇之一，因沙河、颍河、贾鲁河三水交汇自然分割成三块陆地，清咸丰八年地方绅商筑寨墙形成南寨、北寨、西寨三足鼎立格局，&quot;三寨夹河而峙如三城然&quot;。历史上无州县级治所，纯因漕运商贸兴盛而成城，是豫东唯一一个&quot;因水兴市&quot;的独特案例。", "h": "\u003cp class=\"main-text\"\u003e明永乐年间（1403-1424）沙河颍河贾鲁河三川交汇口形成自然渡口，称&quot;周家口&quot;。清康熙年间（1662-1722）漕运兴盛，码头密布，商号林立，豫东平原粮食、棉花、皮货在此集散。咸丰八年（1858）地方绅商统一修筑寨墙——三寨格局正式形成。寨墙宽五丈、长二千八百余丈，南寨设十六座寨门，兼具防御与商贸功能。史料形容：&quot;三寨夹河而峙，如三城然&quot;——&quot;豫东小武汉&quot;之名由此。清末民初漕运渐衰，码头凋敝，寨墙年久失修。建国后北寨、西寨基本消散，仅南寨尚存部分古街巷肌理。皮件厂、纺织厂等工业遗存见证水运落幕、工业兴起的时代转折。2023年启动南寨历史文化街区保护更新项目，范围26公顷，核心保护4.12公顷，&quot;修旧如旧&quot;修李家当铺、白彦章故居，复建6大古码头（大渡口、小渡口、三道沟、普济门等）。2026年2月南寨街区正式开街，入选河南省第三批历史文化街区。现状：南寨尚存11条百年古街巷（红石板巷、李家大院巷等）、18处历史建筑、6大古码头复建开放。北寨西寨仅存零星地名记忆。古码头        特色            现状。大渡口        三川交汇处    复建开放。普济门        寨墙原位置    复建开放。小渡口        漕运主码头    复建开放。三道沟        粮货专用      复建开放。&quot;以前南寨北寨西寨各占一块地儿，沙颍河中间一划，就像三个岛。码头那时候热闹啊——粮船、棉船、盐船，桅杆戳天，夜里灯笼一串串从码头挂到街里。后来漕运衰了，寨墙也拆了砖修房子了……现在大渡口又建起来了，我去看过，修得跟以前差不多，就是船没了。&quot;。&quot;我是商水人，去年年底在南寨租了门面做汉服租赁写真。以前来这里的时候，巷子破破烂烂的，红石板上长着青苔，院子里住了好多老人，电线蜘蛛网似的。现在修好了，老墙保留了，木门窗换了新的雕花，一到节日游客多得推不开门。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e李家当铺院（清同治·市级文保）：周口首富李氏家族宅邸，北方典型四合院，主楼门柱直径45厘米，严格按&quot;四原&quot;（原材料、原工艺、原形制、原做法）修缮，院内展陈老纺车、青石磨、漕运旧船等千余件中原百工老物件。；白彦章故居（清末民初·市级文保）：周口最早西医医院&quot;同仁医院&quot;旧址，主房硬山灰瓦带前廊，南厢房是二层小木楼。白彦章（1902-1976），北平大学医学院毕业，豫东现代西医奠基人。；红石板巷（百年古巷·原物尚存）：赭色条石铺地，年久磨得发亮，南寨老街肌理最完好的一段。；周口皮件厂（建国初·苏式工业遗存）：红砖烟囱、长条厚墙厂房，记录水运落幕、工业兴起的时代转折，今改建成文创园区。；三川交汇处（地理原点）：沙河、颍河、贾鲁河三水汇流处，是周口城市的地理起点。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南寨古寨墙残段（清咸丰·仅存夯土）：寨墙宽五丈、周长二千八百余丈，包砖已拆，仅黄土夯筑残段隐匿于居民区。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老周口张师傅（68岁·退休码头工人）：\u003cbr\u003e▌洪玲娣（28岁·商水姑娘·汉服店老板）：\u003c/p\u003e"}, {"n": "太康老城·夏王封地谢氏故里", "s": "太康", "p": "河南", "w": "中国唯一以夏王命名的县·文庙大成殿琉璃龙脊·刘庄遗址夏代早期城墙中国唯一以夏朝君王名字命名的县（夏王太康失国后流落戈地筑城，死后葬于此），建县2247年未改名。文庙大成殿绿色琉璃瓦、二龙戏珠脊饰，省内罕有。刘庄遗址夯土城墙碳十四测年公元前1964年——夏代早期纪年。", "h": "\u003cp class=\"main-text\"\u003e约公元前21世纪，夏王太康田猎百日不归，后羿堵路不让其回国。太康流落戈地筑城，死后葬县城东南二里，村名王陵村至今沿用。秦嬴政二十三年（前224）置阳夏县。隋开皇七年（587）改阳夏为太康县——以夏王太康之名，一叫叫到今天。元至正二年（1342）建土城，周九里三十三步，四门（东朝阳、西乐成、南南薰）。明宣德元年（1426）建文庙（黉学）——后历经多次损毁重修，现仅存拜殿和大成殿（清代重建）。明崇祯九年（1636）知县李皋土城换砖城，厚五尺，高四丈三尺。崇祯十五年（1642）文庙毁于兵燹。清顺治五年（1648）重建文庙。康熙六年（1667）、民国23年（1934）两次重修。1952年建国后曾维修文庙。近代县城砖城墙被逐步拆除，仅存零星残段。2024年考古发掘刘庄遗址——夯土城墙碳十四测年为公元前1964-1833年，进入夏代早期纪年。现状：文庙大成殿和拜殿完整保存（国家重点文保），太康陵（夏王太康墓）为市级文保，刘庄遗址夏代城墙考古中。遗迹          年代            现状。太康文庙大成殿 清重建        面宽7间22.65米，进梁5间14米，绿色琉璃瓦。太康陵        夏代传说        县城东南二里王陵村，市级文保。刘庄遗址城墙  夏代早期        2024年发掘，东西长126米南北宽100米。&quot;我小时候文庙还有泮池棂星门戟门崇圣祠，从南到北一排全的。文革时候拆了好多，棂星门拆了搭戏台用。现在就剩大成殿和拜殿了，但那大成殿真牛——绿色琉璃瓦，正脊上二龙戏珠，那挑角比别的地方文庙都大，听老师说那是南方风格，中原少见。每年祭孔大典33个步骤，不能错一点——我背得滚瓜烂熟。&quot;。&quot;碳十四测年出来的时候我们全组都炸了——公元前1964年！正好卡在夏代早期纪年里！这城址才东西126米南北100米，小归小，但是夏代早期的夯土城墙啊！四道城墙有南门缺口，城内16座房子一排一排的……豫东这地方，真的是藏龙卧虎，随便挖挖就能改写历史。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e太康文庙大成殿（国保·清代重建）：面宽七间22.65米，进梁五间14米，高10.5米，单檐歇山顶覆绿色琉璃瓦。正脊琉璃烧制二龙戏珠、人物、宝瓶、象轮，垂脊戗脊置琉璃狮狗。大殿檐下五彩重昂斗拱，前屋坡为&quot;两断式&quot;（加大深度）——河南省内古建筑罕见，四翼角挑角高且大，具南方风格，中原少有。月台高1米，青石台阶正中嵌祥龙卧云阶石。；太康文庙拜殿（国保·清代重建）：面阔五间，进梁三间，单檐歇山灰色筒瓦，檐下五彩重昂斗拱，普柏枋、栏额、斗拱均有彩绘。；刘庄遗址夏代早期城墙（2024年新发现）：四道城墙，宽2.6-3.4米，南墙有缺口（城门），平面呈圆角长方形，东西长126米、南北宽100米，城址内有16座龙山晚期房址自南向北成排分布。；太康陵（市级文保）：夏王太康墓，位于县城东南二里王陵村，封土尚存。；谢安故里（太康县老冢镇）：东晋太傅谢安、才女谢道韫、山水诗祖谢灵运祖籍地，中华谢氏发源地。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌太康退休教师刘先生（65岁·文庙义务讲解员）：\u003cbr\u003e▌考古队员小李（29岁·河南省考古研究院·刘庄遗址）：\u003c/p\u003e"}, {"n": "扶沟老城·桐丘程门·大程书院", "s": "扶沟", "p": "河南", "w": "程颢理学圣地·固城春秋残墙·吉鸿昌故里宋代理学泰斗程颢任知县三年的&quot;程门立雪&quot;发源地，大程书院为程颢讲学处。固城村春秋城残段1974年挖出22斤楚金币（全国罕见），县城叠压在先秦郑国边防重镇桐丘城之上。", "h": "\u003cp class=\"main-text\"\u003e春秋时期郑国城邑桐丘，《左传》鲁庄公二十七年（前667）&quot;楚伐郑，郑人将奔桐丘&quot;——扶沟老城叠压在桐丘城址之上。西汉高祖十一年（前196）置扶沟县，县治设崔桥镇古城村（西汉扶沟故城），同时并存新汲、扶乐三县。隋大业十四年（618）新汲县废入扶沟，县治迁至桐丘（今日县城）。宋神宗熙宁八年（1075） 程颢任扶沟知县，在县衙旁开设大程书院讲学——程门四大弟子齐聚，理学一脉在此传承。明洪武三年（1370）县丞刘镒创建土城，高仅一丈，周六里三百二十二步。正统七年（1442）知县韩琼增筑至周九里十三步，高二丈五尺。成化十九年（1483）知县胡宜修四门：寅宾（东）、迎薰（南）、见嵩（西）、拱辰（北）。正德五年（1510） 知县王廷华四面以砖包砌土城，修高城楼增设角楼。崇祯十五年（1642）闯军毁城，后有修缮但高厚不如前。清顺治、康熙、嘉庆年间多次修缮，咸丰年间增设四角炮楼。1948年扶沟县政府陆续拆除城墙修筑公路——砖城尽毁，护城河尚存残段。1938年黄泛虽有城墙保护，城外村镇圩寨尽没。遗存          年代            现状。固城春秋城墙  春秋中晚期      残高7.5米，基宽20米，1974年出土22斤楚金币。大程书院      宋熙宁八年      明清重建，现存青砖长房、立雪讲堂。城隍庙        元代始建        600多年历史，现存大殿。&quot;1974年我还没下地干活呢，就听人说固北大队挖石灰池挖出了金子！那22斤楚金币啊，用篮子装了满满一篮，金光闪闪的。我跑过去看，城墙根下挖了个坑，底下还是城墙夯土。后来考古队来了，说这城春秋就有了，比桐丘城还早……这城墙我小时候常爬，南边那角还能上去，现在长树了。&quot;。&quot;程颢在扶沟只待了三年，可是这三年把整个扶沟的文风都转过来了。大程书院立雪讲堂，现在还在那里，青砖长房，当年弟子们就在那读书。你说奇怪不奇怪，程门立雪的故事，杨时游酢在程颢那也立过——真事发生在洛阳，但扶沟人说，程颢在这讲学的三年，杨时也来过……这不管真假吧，书院立在这，文脉就没断。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e固城春秋古城墙（春秋·省保）：位于县城西南18公里固城乡固城村，平面不规则长方形，南北长800米、东西宽480米，城基宽20米，残高2-8米，西南角保存最完好仍高7.5米。夯层8-20厘米，夯窝圆形平底直径5厘米。1974年村民挖石灰池时挖出22斤楚国金币（含金量90%以上）。出土带子母口沿圆筒形地下排水管道——早于周口平粮台。城墙下厚25米、上厚4米，夯土为深灰色，内内涵遗物极少，始建春秋中晚期、鼎盛战国两汉、延至宋明。；大程书院（宋·后重建·省保）：程颢任扶沟知县时（1075-1077）讲学处，程门四大弟子齐聚于此，一时英杰汇聚。现存青砖长房（学子读书处）、立雪讲堂（程颢讲学处），格局尚在。明永乐二年（1404）重建，清康熙四十八年（1709）增修。；扶沟西汉故城（崔桥镇古城村）：断续夯土城垣尚存，出土汉代筒瓦、板瓦、陶罐残片。；吉鸿昌故居（吕潭镇）：清代院落，吉鸿昌1895年生于此，扶沟中学创办者。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌固城乡村民老孙（72岁·固城村土生土长）：\u003cbr\u003e▌扶沟退休教师张老师（68岁·大程书院义务讲解）：\u003c/p\u003e"}, {"n": "西华老城·娲城女娲·逍遥胡辣汤", "s": "西华", "p": "河南", "w": "中华唯一女娲建都地·春秋女娲城·350年黄泛淤积古称娲城，传说女娲在此抟土造人、炼石补天并建都，是中华创世神话唯一有考古遗址支撑的女娲建都地。明洪武间夯土包砖的老城叠压在唐代箕城县之上，城外10公里春秋女娲城遗址城墙残段仍存。逍遥镇胡辣汤发源地。", "h": "\u003cp class=\"main-text\"\u003e春秋时期 女娲城（娲皇故城），正方形内外两层，外郭城墙长4000米，内城1440米——春秋时期大型城邑，夯层10-20厘米，夯窝圆形平底直径5厘米。秦代置长平县，西汉分长平、西华两县并存。唐武德八年（625） 西华人张道陵后裔建箕城——唐代城址。明洪武年间重建西华县城，夯土包砖，后因洪水反复修缮（西华有史载黄泛350余次）。1938年黄河花园口决口，西华全境没于黄水，淤积泥土数丈厚，女娲陵曾被黄水冲至仅剩土丘，1940年代乡民清淤重修。1986年女娲城址被定为河南省第二批省级文物保护单位。1994年当地民众自发捐资，在女娲古陵处动工兴建女娲城景区。现状：县城明城墙已全部拆除，护城河残段可辨。女娲城遗址城墙残高3米、宽8米，夯土尚在。县城中心女娲文化广场立铁质女娲雕像，城西昆山女娲宫为明代建筑群（古柏参天）。遗迹          年代            现状。女娲城址      春秋            残高3米，宽8米，外郭4000米，夯土尚存。女娲陵        汉代重修        陵丘尚存，被1938黄水淤后重修。明伦堂        清代            清代重建，西华儒学遗迹。&quot;我爹说1938年黄水漫过来的时候，女娲陵被淤了大半，就剩个土尖尖露着。后来水退了，村里人扛着锄头铁锹，挖了半个月才把陵挖出来……现在的陵是清淤后重修的。每年三月庙会，从许昌漯河郑州来的人一车子一车子的，我守陵一辈子了，就信这——女娲娘娘在这住过，这是咱老李家老王家的根。&quot;。&quot;西华城下面压着好几层呢——最底下是春秋女娲城，上面是汉长平县，再上面是唐箕城县，最上面才是明洪武间建的砖城。可惜明城墙建国后全拆了，护城河也淤了。现在县城中心立着个铁铸女娲像，旁边建了女娲文化广场，算是把根找回来了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e女娲城遗址（省保·春秋）：位于县城北10公里聂堆镇思都岗村，正方形分内外两层，外郭城墙长4000米，内城墙长1440米。残存城墙最高点3米、宽8米，护城壕轮廓清晰（基底宽6米、上部宽15米）。城墙分层夯筑，夯窝圆形平底直径5厘米。城内出土釜、罐、鬲、瓮、瓦等春秋时期遗物。民国初年三个&quot;娲城夕照&quot;土丘被挖平，1938黄水淤积，1994年民众重修。；女娲陵（思都岗村）：1938年黄淤后乡民重修，陵丘尚存，常年香火旺盛。每逢农历三月庙会，香客数万人。；明伦堂（清代重建·省保）：西华文庙主建筑，青砖灰瓦，硬山结构，棂星门尚存。；逍遥镇（胡辣汤发源地）：距县城25公里，胡辣汤创制于明崇祯年间，以胡椒、面筋、牛肉片为主料，一碗仅8元。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌思都岗村王老汉（78岁·女娲陵守墓人后代）：\u003cbr\u003e▌西华中学退休教师李老师（65岁·文史爱好者）：\u003c/p\u003e"}, {"n": "商水老城·阳城扶苏·叶氏庄园", "s": "商水", "p": "河南", "w": "陈胜故里·叶氏270亩寨堡庄园·周口三川漕运商水是陈胜故里（扶苏村即陈胜出生地），扶苏城战国城墙残段（外城东西800米、南北500米）。叶氏庄园是清代中原首富寨堡式庄园（270亩），2017年升为全国重点文保。", "h": "\u003cp class=\"main-text\"\u003e战国 楚国边邑阳城故址（今扶苏寺村），《楚辞》&quot;惑阳城，迷下蔡&quot;即此。陈胜故里在后陈村。秦代置阳城县，属陈郡。扶苏城为陈胜所筑，秦二世诈称公子扶苏。隋开皇十六年（596） 设溵水县，北宋建隆元年（960）避宋太祖父讳改溵水为商水——商水县名始于此。明洪武四年（1371）县丞孙元仁修土城，周四里有余，高二丈，四门：仁化、义和、道泰、德政。万历三十五年（1607）知县祖鼎欲包砖城仅完成东门以北二十余丈。崇祯九年（1636）知县王化行全面改筑砖城，四门增设瓮城。崇祯十四年（1641）李自成陷商水城，后顺治三年重修。清康熙至乾隆年间，商水周家口（沙河、颍河、贾鲁河三川交汇）漕运兴盛，渡口十六处、街巷百余条，与朱仙镇、道口镇、赊旗镇并称河南四大名镇——周家口历史上属商水县。清咸丰八年（1858）叶氏（叶绍颐后裔）始建叶氏庄园，历时50余年，耗银百余万两。现状：砖城墙全部拆除，护城河仅存残段。扶苏城残墙尚可辨认。叶氏庄园270亩完整保存，2017年升国保。遗迹          年代            现状。扶苏城        战国（陈胜筑）  外城残墙，东西800南北500。叶氏庄园      清咸丰八年      国保，现存99间，原266间。周家口三寨    清咸丰八年      属原商水县，今周口市区。&quot;我祖上叶绍颐是明末从山西洪洞迁来的，开饭店起家——这听着不像啊，但老辈传下来就是。后来漕运通了，周家口那时候属商水，我家靠码头盐粮买卖发了，从清咸丰八年开始建宅子，建了五十多年！270亩啊，四角炮楼，护城河，东中西三组院落每组三进院……文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军1976年来了一趟，不让再拆，才保住。&quot;。&quot;陈胜就是从我们后陈村出去的！扶苏城是他诈称扶苏后筑的——你看那外城残墙，在村东边那片田地里，一长段土坡坡，夯土硬得很，用锄头刨都刨不动。挖出的陶片上有&#x27;扶苏司工&#x27;四个字，考古队说是陈胜造的。陈胜吴广起义，那可是中国第一次农民大起义！我小时候上学，老师就在课堂上讲，说咱村出了个揭竿而起的人。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e叶氏庄园（国保·清代寨堡）：位于邓城镇，270亩（18万平方米），原楼瓦房500余间，现存99间。晚清防御寨堡式庄园，东、中、西三组院落各三进院，青砖灰瓦，走马门楼、石狮子（左边母狮背幼狮、右边雄狮侧视）、五尺高石狮子，门前大江明柱彩雕&quot;青蛙戏荷&quot;。寨堡原高7米，四角炮楼（两层），东寨门书&quot;众志成城&quot;、西寨门书&quot;同登仁寿&quot;。西侧花园有六角凉亭，护城河绕城。1976年杨得志向制止进一步破坏。；扶苏城（战国·省保）：位于舒庄乡扶苏村，陈胜故里。外城东西800米、南北500米，外城东北部夯土墙仍高出地面200米残段，城基宽20米。内城每边长250米，俗称&quot;金銮殿&quot;。出土&quot;扶苏司工&quot;陶片4件。；阳城故址（战国·省保）：扶苏寺村。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌叶氏后裔叶国玺（75岁·邓城镇）：\u003cbr\u003e▌后陈村村民王振行（62岁·扶苏村村支书）：\u003c/p\u003e"}, {"n": "项城老城·三迁城址·袁寨故居", "s": "项城", "p": "河南", "w": "商周南顿故城·三城叠置·270亩袁氏寨堡项城是唯一经历三次城址迁徙的县城（槐坊店→秣陵镇→水寨），南顿故城商代城墙残段215米尚在。袁世凯故居是晚清最典型的防御寨堡式庄园（270亩），&quot;大邸阁&quot;粮阁遗址为三国正始六年（245年）仓粮仓库。", "h": "\u003cp class=\"main-text\"\u003e西周 项子国封于此，以&quot;项&quot;为封地，项羽家族即项子国后代。春秋 顿子国（南顿），南顿故城城墙下厚上薄，上层秦代、中层东西周、下层商代——&quot;三层叠压&quot;研究城市变迁的活化石。汉高帝 设项县，东汉光武帝刘秀之父刘钦任南顿县令，刘秀在此长大——&quot;光武台&quot;&quot;晾马台&quot;&quot;扳倒井&quot;等遗迹尚存。东魏天平二年（535） 侨置秣陵县——项城又称秣陵，来源在此。明宣德三年（1428） 槐坊店（古项城）遭黄水淹没，县治迁至秣陵镇（殄寇镇）——老项城，一住五百二十五年。清咸丰八年（1858） 袁甲三（袁世凯叔祖父）购置明代石氏庄园改建袁氏故居寨堡，历时四年完工——三道寨河环绕，高7米砖砌寨墙，四角双层炮楼。1953年底 县城从秣陵镇迁至今水寨镇（原项城镇）。现状：南顿故城东北角商代城墙残段长217米、宽12米、高7米（省保），三层文化层清晰。秣陵镇（老项城）文庙、莲溪书院、状元桥尚存。袁氏故居270亩完整保存。城址          年代            现状。南顿故城      商代至秦汉      东北角残段217米，三层文化层。秣陵镇（老项城） 明宣德三年    文庙、莲溪书院、状元桥尚存。袁氏故居      清咸丰八年      国保，270亩，三道寨河。&quot;袁寨那房子结实，一百多年了还立着。我小时候常钻寨墙根底下玩，那寨墙是砖砌的，外面三道寨河，四角炮楼——你说厉害不厉害？袁世凯出生在中院腰楼西间，我去看过那间房，不大。文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军说&#x27;这房子不能拆&#x27;，才保住。&quot;。&quot;那城墙是商代的！三层啊——底下是商朝的土，中间是周朝的，上面是秦朝的——考古队挖的时候我在旁边看了好几天。城墙上夯窝密密麻麻，像牛蹄子印似的。我小时候常爬到城墙上玩，现在城周围都是庄稼地，只有东北角那一段土坡还像样子。刘秀小时候跟着他爹刘钦在南顿当县令，王莽追他他躲在八角井里——那井现在还在。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e南顿故城（省保·商代至秦汉）：位于南顿镇，残存东北角土城墙217米，宽12米，高7米，三层叠压——上层秦代、中层东西周、下层商代，是研究城市变迁的活化石。东汉建武十九年（43）光武帝刘秀在此筑光武台、建光武庙。；莲溪书院（清代·老项城）：秣陵镇，匾额&quot;凡乡之秀美而文者，自成人以及小子咸得攻诗书习礼乐&quot;，是当时全县最高学府。；华佗冢（三国·项城）：位于南顿镇，传说华佗死后葬于此。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e袁氏故居（国保·晚清寨堡）：位于王明口镇袁寨村，270亩，三道寨河环绕，高7米方形砖砌寨墙，四角双层炮楼，东西寨门吊桥高悬。始建1858年，袁甲三（钦差大臣漕运总督）购置明代石氏庄园改建。住宅99间（原266间，文革拆除），东组5天井院、中组3天井院、西组3天井院，袁世凯出生于中院腰楼西间。走马门楼、彩雕&quot;紫气东来&quot;、石狮子（五尺高）、门前两根大石柱彩雕&quot;青蛙戏荷&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌袁寨村老周（68岁·袁氏后裔邻居）：\u003cbr\u003e▌南顿镇刘大爷（80岁·城墙根下长大）：\u003c/p\u003e"}, {"n": "沈丘老城·三迁城址·槐店古项", "s": "沈丘", "p": "河南", "w": "沈子国西周遗址·乳香台龙山文化·槐店三川交汇沈丘是罕见的&quot;三座县城&quot;——临泉古城子（沈子国西周都）→乳香台（明弘治新址）→槐店（古项城县治）。沈子国遗址千年银杏仍在，东汉永平七年（64年）建广教寺比白马寺早四年。", "h": "\u003cp class=\"main-text\"\u003e西周初年 周文王第十子聃季载封沈子国，都临泉古城子——沈丘第一座县城（后属安徽临泉），历经1600余年。春秋鲁定公四年（前506） 沈子国被蔡国所灭，都称&quot;沈集&quot;。隋开皇三年（583） 置沈州，改褒信县为沈丘县——沈丘县名首现。明弘治十年（1497） 划陈州、颍州、项城边隅，复置沈丘县，县界西移，治所由临泉迁至乳香台——第二座县城，建方形土城，周三里半零四十步，城高1.8丈、壕宽3丈深1.5丈。正德二年（1507）砖包城墙工程动工，东、西、南、北四门楼落成，四角四面立八座炮楼，城门以铁叶包裹。明宣德三年（1428） 古项城县治槐坊店遭黄水淹没后南迁，槐坊店改称槐店——沈丘第三座县城，沙河、谷河、蔡河三川交汇，古项羽所筑。现状：沈子国遗址（临泉古城子）千年银杏尚在，城垣残高1-2米。乳香台旧址今为沈丘老城镇（明代沈丘）。槐店（今沈丘县城）古项城石板街、大胡同尚存。城址          年代            现状。沈子国古城    西周            临泉古城子，千年银杏，残垣。乳香台        明弘治十年      今沈丘老城镇，土城已泯。槐店          古项城（楚项羽筑）  今沈丘县城，石板街、大胡同。&quot;这棵银杏树是周朝的！我爷爷说他爷爷那辈儿就这么粗——要三个人才能合抱。旁边那土台台就是沈子国的城墙根了，夯土硬得很。1985年挖商代墓的时候我去看热闹，挖出了好多铜器——爵、觚、剑……亮闪闪的。这地方水好风好，沈子国选这儿建都没错。&quot;。&quot;槐店这地方三川交汇啊，沙河、谷河、蔡河在这儿碰面，船多得很，老早以前就热闹。石板街那几块红石板还在，我小时候在上面跳房子。大胡同两边的房子还是老样子，青砖灰瓦。清真古寺那座老礼拜殿，木柱都要两人合抱——听我爹说那是明初建的。槐店文狮子，国家级非遗，每年庙会都要跳。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沈子国遗址（省保·西周）：位于安徽临泉古城子，长方形高台地，南北长500米、东西宽300米，夯土城垣残高1-2米，四角城堡残高2米多。千年银杏立于遗址内，虬枝参天，古姿龙钟。出土楚国蚁鼻钱、郢爰、弧底绳纹陶罐、铜剑、铜戈等。1985年征集商代墓群铜爵、铜觚、玉璜等。；乳香台（沈丘老城镇）：龙山文化遗址（4000年），东汉永平七年（64）建广教寺——比白马寺（68年）早四年。明成化年间重建，庙梁为乳香木（伏天渗出乳香香气），故改名乳香台寺。香台井甘美，县志有载。；槐店（今沈丘县城）：古项城县治，明万历《项城县志》载&quot;项城县城槐坊店，楚项羽所筑&quot;。东关大胡同、石板街尚存，三川交汇（沙河、谷河、蔡河）。；清真古寺（省保）：槐店回族镇，明初建，历次重修。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临泉古城子刘大爷（82岁·沈子国遗址守树人）：\u003cbr\u003e▌槐店老陈（70岁·回族镇老户）：\u003c/p\u003e"}, {"n": "郸城老城·老子丹成·宁平故城", "s": "郸城", "p": "河南", "w": "商周亳都·汉光武妹妹封地·老子炼丹成名地东魏设丹阳郡、隋设郸县，&quot;郸城&quot;谐音&quot;丹成&quot;——传说老子在洺河岸边炼丹成功大呼&quot;丹成也&quot;。宁平故城是商朝前期都城亳（五帝帝喾都亳、商汤迁亳），两汉宁平县——光武帝刘秀妹妹刘伯姬封地。汉代汲黯（《史记·汲郑列传》）葬此。", "h": "\u003cp class=\"main-text\"\u003e五帝帝喾 都于亳（今郸城宁平）——宁平有五千年建城史。商朝前期 成汤把都城从商丘迁到亳（宁平），历五代十王，亳为都约二百年。战国 称&quot;留城&quot;&quot;留木城&quot;。西汉设宁平县，东汉光武帝封妹刘伯姬为宁平长公主——在宁平生活四年，死后葬城南三公里。西晋永嘉五年（311） 东海王司马越灵柩东运经宁平，石勒追上大败晋军——&quot;宁平之战&quot;，王公士卒死者十余万，宁平故城彻底毁坏，后世在废墟北面重建。隋 设郸县，后撤县，设郸城集。传说老子在洺河岸边（今县城大桥一带）炼丹成功，大呼&quot;丹成也&quot;——&quot;丹成&quot;谐音&quot;郸城&quot;。1951年设郸城办事处（县级），1952年设郸城县。清代康熙《鹿邑县志》载：宁平城是方圆几十里最大的城。建国初期宁平故城城墙尚存，东西长620米、南北长612米、总长2464米——夯土城墙，大寨墙厚9米多高3米多，小寨墙1米多高带垛口，四角碉堡圆形直径5米。四门有外门内门，门板厚约5米高丈余，东北红松做。每门有两眼大铁炮，炮筒一丈长如高压线杆粗。1949年土改时城墙全部拆除——大青砖建了宁平粮库。现状：宁平故城残墙尚存（省保），故城遗址1995年NHK《中华五千年》摄制组拍摄。郸城老城墙、护城河全部拆除，仅存&quot;大桥南侧人民路&quot;北门位置、&quot;南关老汽车站西侧&quot;南门位置。遗迹          年代            现状。宁平故城      商至汉          残墙尚存，夯土2464米，省保。宁平长公主墓  东汉            封土尚存，刘秀妹妹刘伯姬葬于此。汲冢          西汉            汲黯葬此，今汲冢镇。&quot;我爹是1948年建政那年在宁平粮库干活的，他说粮库那青砖全是从城墙上扒下来的——那砖真大，一块顶现在两块。城墙我小时候还见过，大寨墙厚9米多，上面还有小寨墙，四角有碉堡圆形的能藏人。每面城墙上有两眼大铁炮，炮筒粗得像高压线杆，装上药能打二三里远。四门都是外门内门，进去像钻隧道——我爬过门楼，上面摆着门神牌位。&quot;。&quot;郸城这县名太有意思了——老子在洺河边炼丹，丹成了，叫&#x27;丹成&#x27;，谐音&#x27;郸城&#x27;。传说老子原来在鹿邑那练，后来嫌苦，跑到洺河边——&#x27;汲洺河之水，拔苇为薪&#x27;，一举成功。宁平故城更了不得了，商朝前期都城就在这儿，二百年啊！成汤迁过来的，五帝帝喾也在这儿定都。可惜城墙拆了，大青砖建粮库了，只剩夯土残段了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宁平长公主墓（东汉·刘伯姬）：光武帝刘秀之妹封地宁平，在宁平生活四年，死后葬城南三公里。封土尚存，近两千年未动。；汲冢（西汉·汲黯墓）：《史记·汲郑列传》中的西汉名臣汲黯葬于县城西，今汲冢镇。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宁平故城（省保·商至汉）：位于宁平镇，残存部分夯土城墙，东西长620米、南北长612米、总长2464米，城高3米多，大寨墙厚9米多。1949年拆除大青砖建宁平粮库，现存夯土残段，寨海子（护城河）宽两丈多深一丈多轮廓可辨。四门均有高大双门楼建筑，外门内门相隔八九米，门是厚木门用东北红松做，有大铁铆钉，门外吊桥。每门有两眼大铁炮，炮筒一丈长——民间流传&quot;绿头绳红头绳，大炮打不透宁平城&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宁平镇老艺人王大爷（85岁·城墙记忆）：\u003cbr\u003e▌郸城退休干部小李（60岁·文史爱好者）：\u003c/p\u003e"}, {"n": "宁陵·吕坤故里的修城传奇", "s": "宁陵", "p": "河南", "w": "明代唯一《修城书》传世·城墙拆了城门复建宁陵城有两份独一无二的遗产——明代&quot;天下三大贤&quot;之一的吕坤晚年辞官回乡，写了一封《修城书》倡议修城，是唯一留传下来的明代民间修城倡议书；还有&quot;逻岗&quot;&quot;李成帝村&quot;这些跟李自成有关的地名。", "h": "\u003cp class=\"main-text\"\u003e金大定二十二年（1182） 县治徙于汴河堤南古城（宁陵城前身）。明初 宁陵城周围9里有余。成化年间（1465-1487） 知县金玺割城南之半改筑，约5里。明万历二十九年（1601） 吕坤倡修宁陵城——66岁的吕坤辞官回乡，力排众议，筹措经费，写《修城书》，主张展修加固新城。最终城周6里有余，高三丈，全用砖包，开四门：南文明、北钟祥、东延和、西宝城。崇祯十五年（1642） 李自成军攻陷宁陵，拆毁城墙。逻岗（原涝岗）得名——李自成军巡逻部队驻扎于此。清雍正六年（1728）、咸丰八年（1858）、光绪十五年（1889）、十九年（1893） 多次重修。1947年2月 县城第一次被攻克时扒掉部分城墙。1956年 城墙拆除殆尽——机关学校扒砖取土。现状： 近年复建北城门（钟祥门）、东城门（延和门），四湖改造让老城区焕新。&quot;我家在县城东大街，小时候见过城墙残段——夯土的，上面长着酸枣树。58年大跃进那会儿，机关上带头扒砖，老百姓跟着扒，一夜之间砖城墙就没了。后来我在县志里翻到吕坤的《修城书》，那是他花了好几年才写成的，2000多字，句句恳切。现在复建城门，算是还了老吕一个愿。&quot;。&quot;我爹说逻岗原来叫涝岗，李自成巡逻的部队来过后才改的。其实我们当地人一直叫涝岗，书面上写逻岗。镇西那沙河岸边，还有个土台子，老辈说那是当年李自成的瞭望哨。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e吕坤《修城书》（明代唯一民间修城倡议书）：存于清光绪十九年《宁陵县志》，全文约2000字，力主&quot;三年之劳，为千年之计&quot;。；复建北门钟祥门（2024年复建）：明城原建筑，青砖砌筑。；复建东门延和门（2024年复建）：与北门同批复建。；逻岗镇（地名遗存）：原称涝岗，因李自成军巡逻部队驻扎改名。至今当地人仍读&quot;涝&quot;音。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（70岁，宁陵中学退休语文教师，吕坤研究爱好者）：\u003cbr\u003e▌刘大嫂（55岁，逻岗镇开了20年农资店）：\u003c/p\u003e"}, {"n": "虞城利民·古虞国杜康酿酒的城", "s": "利民", "p": "河南", "w": "卍字街·2200亩护城河·5公里护城堤利民镇（原虞城老城）是上古古虞国都城、杜康（少康）酿酒之地，现存明代老城格局——&quot;卍&quot;字形街道、&quot;龟背式&quot;地形、外圆内方、2200亩护城河抱城——这套格局在全国县城中罕见。", "h": "\u003cp class=\"main-text\"\u003e舜时 舜之子商均封于此，建立古虞国，建都纶城（今利民镇）。少康（杜康）避难于此20余载，发明秫酒，后中兴夏朝。秦汉 置虞县，属砀郡。明弘治九年（1496） 选建新城（即今利民镇老城），面积约2平方公里，筑土城，墙高5米，开四门：东宾阳、南薰风、北拱辰、西望汴。嘉靖十年（1531） 县治迁于此。崇祯八年（1635） 县人范良彦、杨春育捐资改土墙为砖墙。清康熙三十年（1691）、雍正八年（1730）、乾隆二十六年（1761）、咸丰八年（1858） 四次修缮。光绪二十七年（1901） 城墙倒塌过甚，官绅商民捐资大修。建国后 城墙城门逐渐拆除。1954年 谷熟、虞城两县合并，县城迁马牧集（今虞城县城），利民镇改称今名。现状： 2200亩护城河（东西南北四城湖）完整保存，5公里护城堤（高约7米）仍在，外圆内方格局清晰。城内街道呈&quot;卍&quot;字形，大隅首居中。&quot;我家厨房西墙全是老城砖——30斤一块，黑青色的，比现在砖宽一倍。那时候城墙拆，家家户户都去抬。我爹跟我说，城砖缝里抠出过铜钱和瓷片子。护城河的水现在还清，我年轻时候冬天在冰上打炮楼子（一种游戏）。&quot;。&quot;现在护城堤还在，上面的庙大部分毁了，山西会馆的残碑我前些年见过，在南关那菜园子边上。2200亩护城河抱城——&#x27;四分水一分城&#x27;，这套格局在全国县城里真不多。河南其他地方都是城在水里，利民是水在城外。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e护城河（四城湖）（明弘治九年筑城取土而成）：正常水位面积2200亩，水深1-4米，分东南西北四湖，以四门为入口分隔。湖内有地藏庵、观音阁、泰山庙、歇马亭等遗迹。；护城堤（周长5公里，高约7米）：堤上原有鲁班庙、火神庙、玉皇庙、三教堂、山西会馆。；商均墓（古城西南3里）：舜子商均之墓，现存。；旧城砖石遗物：城区居民早年建房多用城砖——&quot;30斤重的城砖，小时候搬不动，掀起一边慢慢翻&quot;（老城居民回忆）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，利民镇南街老木匠，曾用城砖盖过厨房）：\u003cbr\u003e▌孙会计（58岁，利民镇文化站干事）：\u003c/p\u003e"}, {"n": "民权老城·民国最年轻的县城", "s": "民权", "p": "河南", "w": "冯玉祥定名·1928年建城·城墙拆了地名留民权县是整个豫东设县最晚的县——1928年才由冯玉祥批准设立，取三民主义之&quot;民权&quot;为名。建县时城墙是边长500米的正方形土城，北靠黄河故道大堤，设中山、平等、博爱三门，没有北门。1948年迁治后变成普通村庄，但&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;的地名留到今天。", "h": "\u003cp class=\"main-text\"\u003e清末 李坝集（老城原名）是黄河渡口，黄河主流流经于此，设渡口。渡口首领姓李排行第八，人称李八口。清嘉庆年间 黄河漫溢，土不能打墙，村民编篱笆围之——又名篱笆集。1928年 冯玉祥批准在豫东新设民权县，首任县长孙巍在李坝集筑土城。城为边长500米正方形，北枕黄河故道大堤当北墙，墙底宽15米，顶宽4米，高8米，城壕宽20米深2.5米。无北门，仅东、南、西三门——中山门、平等门、博爱门（三民主义命名）。1930年 中原大战，李坝集激战三个月。1935年 大火延烧西半城，损失严重。1946-1948年 历经动乱，城墙毁于兵燹。1948年 民权县迁治田庄车站（今民权县城），李坝集改称&quot;老城村&quot;。现状： 城墙已全部拆除，城壕填平住上人家。&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;地名保留至今。老城村现有1777户4950人，回汉杂居。&quot;我爷爷当年在城墙上种过树。那城墙真高——8米，上面能跑马车。建国后先拆的城门楼，然后拆城墙砖盖学校，最后连夯土都被挖了垫路了。我家那块宅基地，原来就在西南头——当年的赵家大同照相馆位置。&quot;。&quot;我记得第一次攻城——1946年8月，打了18天18夜没打下来。后来1948年才彻底安定。那时候城壕里死的人真多，护城河水都是红的。现在城壕填平了，上面盖了房子，谁知道这儿原来是护城河啊。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老城村（原民权县治）：属民权绿洲街道办事处，西北距县城2公里。村中仍有&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;等原始城门位置地名。；黄河故道南大堤（老城村北侧）：原民权县城的&quot;北城墙&quot;，至今仍高大宽阔。；县政府遗址（老城村双语幼儿园）：原关帝庙改建的县政府，大殿3间，东西廊房各6间。；四眼吃水井：城东南、西南、东北、西北各一，井口直径约2米，上设田字木架。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌徐金堂（62岁，老城东村村干部，族谱可追溯到李坝集时代）：\u003cbr\u003e▌孙守礼（80岁，老城村最年长的老人之一，亲历老城8次易手记忆）：\u003c/p\u003e"}, {"n": "杞县·杞人忧天的双重城防", "s": "杞县", "p": "河南", "w": "内砖城外土堤·周长9里13步·堤上植柳3000株杞县的双重城防在整个豫东独一无二——内有砖城（9里13步），外有护城土堤（周长7.5公里，高5米）。清代黄河屡次决口，全靠这道土堤挡住洪水保住县城。杞人忧天的典故就出自这里。", "h": "\u003cp class=\"main-text\"\u003e商 杞国都城——杞柳丛生，故名杞国。秦 置雍丘县，围筑城表。金大定十四年（1174） 避世宗完颜雍讳，改雍丘为杞县。元太宗六年（1234） 黄河决口，杞县城北面被冲垮。元太宗癸卯年（1243） 万户张柔在故城北约1公里处筑新城（张柔城）。元至大四年（1311） 河决张柔城，县治迁回南杞县（即今城址）。明崇祯八年（1635） 知县乔岱改土城为砖城，周长1400余丈。清乾隆二十八年（1763） 大水冲毁城墙，修缮后塞废小南门，仅余5门：东寅旭、西镇安、南肃清、北永安、西南宝成。清嘉庆二十五年（1820） 黄河决口兰仪，知县徐大镛筑护城堤——周长7.5公里，高5米，顶宽3米，底宽10米。道光六年（1826）沿堤植柳3000株。1946年 城墙拆除——出于战争需要。现状： 护城堤土形仍在，部分地段保存较好，现为县级文保单位。城内70多条街巷棋盘格局，至今基本保持明清风貌。&quot;我小时候护城堤还完整着呢——上面全是柳树，道光年间种的那批。后来大跃进砍了烧火。7.5公里的堤，我放羊一绕就是大半天。现在堤被挖得七零八落，只有县医院后面那段还像个样子。&quot;。&quot;伯喈胡同就在圉镇西街——蔡邕（蔡伯喈）的故里，青石板还在。我小时候那条胡同里还有老宅子，门楼上有雕花。现在修了路，老房子只剩两家了。子在塔也在圉镇，相传孔子过此住过一夜，弟子后来建的塔。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e护城堤土段：外筑土堤，周长7.5公里，高约5米，现部分残留。；孔庙（大成殿）：始建于明洪武三年（1370），县城黉学主体建筑，至今仍在。；圉镇（古圉县治）：杞县南部，秦汉圉县、圉城县治所，唐代改镇。现存崇兴寺、泰山庙、普济桥、伯喈胡同（蔡邕故里）、子在塔（孔子行宫塔）。；内城街巷：东门大街、西门大街、南门大街、北门大街（原寅旭街、镇安街、肃清街、永安街），格局未变。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，杞县城关镇东街老住户，曾在护城堤上放过羊）：\u003cbr\u003e▌王大姐（55岁，圉镇开蔡文姬纪念馆的个体户）：\u003c/p\u003e"}, {"n": "通许·400年没挪窝的县城", "s": "通许", "p": "河南", "w": "唐始建·嘉靖砖城·街巷格局至今未变通许县城是整个豫东平原上最&quot;老实&quot;的县城——自唐代始建以来，城址从来没迁过，城墙从夯土变砖城，又变成了环城路，但街巷棋盘格局从明嘉靖二十七年（1548）县志上看，到现在几乎没变。", "h": "\u003cp class=\"main-text\"\u003e唐 始建城垣，具体规模不详。明洪武五年（1372） 知县姜允和增筑，周围9里30步，高1丈8尺，宽1丈3尺，池深8尺，涧2丈。明嘉靖七年（1528） 知县于尚春始筑砖城。明末遭毁。清顺治年间 知县褚士行、姜汝松、贾待旌相继修葺。清光绪十五年（1889） 知县谢立本因年久失修，外筑砖墙。清光绪三十年（1904） 筹资修筑加固。1949年后 砖墙拆除。1972年 向北扩建新城区。现状： 街巷格局完整保留，70多条街巷呈棋盘状。主干道光复路、行政路、幸福路、文卫路穿城而过。老城区仍有传统商铺和老房子。&quot;我18岁在这街上摆缝纫机，现在76了，还在这条街的另一头。街变宽了，铺子换了一茬又一茬，但街道走向没变——南北街东西街，还是明嘉靖年间那个棋盘样。我那台老缝纫机用了40年，现在搁家里当摆设。&quot;。&quot;我是教历史的，嘉靖二十七年县志上有老县城图，拿出来跟现在的地图一比——街道位置几乎没动。这在黄河泛滥区太少见了，周围杞县、睢县都迁过城，通许从唐代起就没挪窝，真是奇迹。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老城区街巷：状元桥街（北宋王拱辰故里）、光复路、行政路等，格局未变。；清真寺：老城区遗存，明清风格。；护城河残段：老城区东南部仍有小面积水体，为原城池遗迹。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明嘉靖城墙基址：环城路位置——1949年后拆城砖修路，城墙基址隐于路面下。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵大爷（76岁，通许县中街老裁缝，从青年到老年在同一条街上做衣服）：\u003cbr\u003e▌退休教师李老师（70岁）：\u003c/p\u003e"}, {"n": "尉氏·城墙还在的活化石", "s": "尉氏", "p": "河南", "w": "2米夯土轮廓完整·洧川南门长500年柏树尉氏县城的城墙是豫东平原上少有的还能完整触摸到的城墙——虽然砖层1951年被拆，但夯土墙基还在，最高处从城外看约2米，整个轮廓清晰可辨。更为奇特的是，下属洧川镇的明代南城门（镇洧门）门洞砖缝里长着一棵500年古柏，胸围1.1米。", "h": "\u003cp class=\"main-text\"\u003e春秋 郑国别狱（地方监狱），为郑大夫尉氏之邑。秦始皇三年（前219） 置尉氏县，隶属三川郡——秦首批郡县。汉 始筑尉氏县城，周六里一百步，方形。明宣德六年（1431） 知县李琦因南关居民稠密，外拓城垣1里183步——方形城变凸字形。明成化十九年（1483） 知县刘绍修城垣，增高至2丈5尺，开6门：大东门敦化、小东门朝阳、大西门阜成、小西门兴化、北门迎恩、南门保安。明崇祯七年（1634） 改土城为砖城，外砖内土。明崇祯十四年（1641） 毁于闯军。清顺治初 重修。1951年 拆取城墙砖用于城市建设。1959年 夯土城垣被移平——大部分地段。现状： 城墙轮廓清晰可辨，最高处从城外看约2米。从明嘉靖二十七年县志城图、清道光十一年县志城图与现在对比——街道布局几乎没有变动。&quot;我把嘉靖二十七年的老县志城图拿出来，跟现在尉氏的卫星地图一比——街道走向一模一样。这在豫东太罕见了！旁边通许虽然也没迁城，但城墙早平了；杞县迁过两次城。尉氏是真&#x27;老实&#x27;——2500年，城没挪窝，街没改向。&quot;。&quot;那棵柏树从我爷爷小时候就在那——500年了。传说是小鸟衔的柏籽掉进门洞砖缝里长出来的。82年县文物所的人给南门挂牌，说柏树是&#x27;自然奇观&#x27;。我小时候爬上去摸过树根，那根顺着砖缝往下钻，不知道扎到哪儿了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e尉氏县城夯土城墙残段：现存轮廓完整，从城外看最高约2米。；洧川南门（镇洧门）（明景泰元年1450，省保）：门洞东西宽7米，进深13.5米，高10米。内外壁大砖砌成，底部青石铺基，顶部半圆形拱券。门洞正中砖缝里长着一棵500年古柏——胸围1.1米，根系沿两侧砖缝向下延伸。城垛为柿花形（出过状元的县才允许用）——吕蒙正、刘理顺。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e洧川北门古榆（已毁）：与南门古柏遥相呼应，有&quot;南门到北门，百（柏）里有余（榆）&quot;之说。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌退休志办赵主任（73岁）：\u003cbr\u003e▌洧川南街老校长（68岁，教了一辈子书）：\u003c/p\u003e"}, {"n": "兰考考城·迷你小城堌阳镇", "s": "考城", "p": "河南", "w": "周长仅3里·四门吊桥·康熙年间迁址考城县在豫东县城中堪称&quot;流浪&quot;——从汉代到清乾隆年间，因黄河水患先后迁了至少5次，最后在堌阳镇定居。这座小城周长仅3里（约1500米），是黄河泛滥下考城能找到的最后一块安全地。", "h": "\u003cp class=\"main-text\"\u003e东汉建初八年（83） 甾县改名为考城县，城在今民权林七乡西村——内城9里13步，外城36里有奇。元至元间 城没于河，县治迁贺丘（民权王桥集）。明洪武二十三年（1390） 河决，迁江墓店（民权李堂乡）。正统二年（1437） 再遭河患，迁北关（民权北关镇），筑城4里90步，土城。崇祯年间 改土城为砖城。清康熙二十八年（1689） 淫雨致城墙坍塌，重修。清乾隆四十三年（1778） 北关城没于黄河——考城第N次城毁。清乾隆四十九年（1784） 考城县治迁堌阳（今兰考堌阳镇），知县雷逊重新筑城——城周仅3里，高1丈4尺2寸，内土外砖，开四门：东门朝阳、南门迎薰、西门安澜、北门拱辰。四门皆设铁索吊桥。1949年 考城县治由堌阳迁至张君墓镇（考城镇）。1954年 考城与兰封两县合并为兰考县。现状： 堌阳老考城址占地约20万平方米，城墙残迹可寻，护城河遗迹尚存。2026年省专家组正在对堌阳老城开展文物专项调查。&quot;我还记得建国前堌阳城的样子——城墙不高但很结实，四门有吊桥，每天晚上放下来。城内街道太绕了，刚来的人容易迷路——全是丁字路口，没几个十字街口。卖胡辣汤的、炸油条的、补鞋的都挤在大隅首。后来1949年县治搬走，城就慢慢败了。&quot;。&quot;考城的迁徙史就是一部黄河泛滥史——从西汉到乾隆，迁了至少5次，每次都是河毁城。最后在堌阳找到这块高地，只筑了3里城——黄河能淹到的地方越来越高，能用来筑城的地方越来越小。3里城在豫东县城里是最小的，但它挺了170年。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e堌阳考城城墙残段：清乾隆四十九年（1784）筑，城周3里，内土外砖，夯土残垣尚存。；护城河遗迹：四门各有铁索吊桥，护城河宽阔。；堌阳老城街巷：街道多丁字、少十字，少有平行街，如蛛网密织，似迷宫——独特的防御布局。；四门位置：东门朝阳、南门迎薰、西门安澜、北门拱辰——地名仍存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老爹（82岁，堌阳镇最年长的老人，见证老城变迁）：\u003cbr\u003e▌退休中学教师刘老师（70岁，本地史学家）：\u003c/p\u003e"}, {"n": "中牟·官渡之战的曹操城", "s": "中牟", "p": "河南", "w": "汉初始置·曹操重筑·崇祯砖城中牟是中国古代史上最著名的战场之一——官渡之战就发生在这里。曹操在青峰岭重筑城池，明清沿用。1938年黄河花园口决堤，中牟城被冲毁三分之一——东门到北门几乎全塌，城内房屋几乎全倒，全城仅剩丁字口一片孤岛。", "h": "\u003cp class=\"main-text\"\u003e春秋 郑国清邑，《左传》记载。西汉初年 始置中牟县。高帝十二年（前195）封单父圣为中牟共侯。汉末曹操 在青峰岭重筑城池，城垣周长6里36步，高2丈5尺，阔2丈——即今明清县城前身。明天顺五年（1461） 黄河决口，城毁。知县董敏移城于西（今址），筑土城，周长6里36步，高1丈5尺。明崇祯七年（1643） 知县俞士鸿易土为砖，加筑东西瓮城。改西门名为观光，北门拱辰。清顺治二年（1645） 重修，四角置窝铺，四门：东门朝阳、西门观光、南门迎薰、北门拱辰。清乾隆十五年（1750） 知县孙和相大兴土木，重建四门瓮城、城楼。城高1丈6尺，顶宽2丈，底宽2丈5尺。1938年 花园口决堤，黄水围城，冲毁三分之一城墙，东门至北门几乎全部坍塌，城内房屋几乎全部倒塌，全城仅剩丁字口地势较高的一片孤岛。1956-1958年 剩余城墙砖石被拆除用于城市建设。现状： 城墙已无，但街道格局保留明清形态。老城区丁字口为当年洪水后的&quot;孤岛&quot;中心。&quot;我是个农民，小学都没毕业，后来靠自学。2023年在东关洞上村居民房后发现一段古城墙——长约20米，宽10余米，初步断定就是中牟城遗址。这一发现把中牟建城史从汉代提前了两千年，通到夏商时期了。我研究了十多年，终于找到点实在东西。&quot;。&quot;我小时候听老辈说，1938年那场大水，全城就剩丁字口那一片没淹，周围全是水。后来日本人来了，在碉堡里住。1945年日本人投降后，居民才敢回来搭棚子。我家1952年盖房子，砖还是从城墙基下挖的。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明清中牟县城街格局：老城区东西大街（原朝阳-观光门一线）、南北大街（迎薰-拱辰门一线），丁字口为中心。；官渡古战场遗址：中牟北部官渡桥村一带，东汉末年官渡之战主战场。；东古城遗址（县城东南11公里）：东周至宋代古城，夯土城墙高8米，基宽30米，西北城角保存完好（高15米）。；老城区残存民宅：丁字口附近仍有少量民国时期老建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌齐治平（真名赵福群，中牟历史研究专家，行走的中牟活字典）：\u003cbr\u003e▌退休老干部李主任（75岁，1950年代就住在老城区）：\u003c/p\u003e"}, {"n": "新郑·四十五里牛角城", "s": "新郑", "p": "河南", "w": "郑韩故城垣世界之最·南街活了六百年·高拱故里新郑是春秋战国时期的大国都城——郑国和韩国先后在此建都，&quot;四十五里牛角城&quot;（郑韩故城）的夯土城墙至今大部分保存，是世界同期（东周）最完整的古城垣之一。墙基宽40-60米，最高处16米，全部用土夯筑。", "h": "\u003cp class=\"main-text\"\u003e西周 郑国肇建名相郑桓公。春秋 郑武公迁都新郑（前769），郑国在此建都39年。战国 前375年，韩国灭郑后迁都新郑，加固加高郑国的东城和北城——因为南、西墙临近双洎河（洧水），向内收缩。公元前230年 秦灭韩。此后 郑韩故城夯土城墙一直作为新郑县城的基础——城内建县治，城外城墙保留。明代重修新郑城，增建瓮城、城楼。明隆庆年间（1567-1572） 内阁首辅高拱（新郑人）主持朝政。新郑南街立石牌坊&quot;少傅冢宰&quot;&quot;少师大学士&quot;。1958年 拆城墙砖——大量城墙砖被用于城市建设。但夯土城墙大部分未拆，作为地面隆起至今保存。2006年 新郑市改造西环路，挖出明代城墙墙基近千米——下以青石长条为基础，上砌带文字的大砖（隆庆四年造）。1997年 拓宽郑新公路时，新郑市毅然决定多投资400多万元改线50多米——保护了一段城墙。现状： 郑韩故城遗址东西长约5000米，南北宽约4500米，一道南北走向夯土墙将城分为东西两部（西城宫城、东城平民区）。墙基宽40-60米，顶宽2.5米，最高16米。东墙和北墙保存最好。南街古巷：600年未变的老街，2013年列入保护，2024年成为省级历史文化街区。&quot;我这辈子没离开过南街——小时候青石板就被磨得发亮了，街两边的老宅子一座挨一座。1958年拆城墙，南街口那段老墙还在，青砖斑斑驳驳缝里长草。我每次路过都摸一把。现在好了，南街2024年成了省级文化街区，灯笼一亮，小孩追着跑，跟我小时候一样一样的。&quot;。&quot;郑韩故城的城墙是真厉害——2700多年了，土夯的比砖的还结实。墙基最宽60米，顶上2.5米，能并排跑两辆马车。97年公路改线保护那段，是新郑人做对的一件大事——多花了400万，但保住了世界文化遗产。&quot;。（以上为T12大批次12县正文）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e郑韩故城夯土城墙（世界同期最完整）：大部分地段仍高出地面——东墙、北墙保存最好，墙基宽40-60米，顶宽2.5米，最高16米。西城地势最险要（牛角最凸出部分）。；南街古巷（省级历史文化街区）：明代始建，600年未换名字。老街长约500米，青石板路，老宅黑灰相间古墙，雕花木格窗。现存合盛泰布庄（清代商号，近年修复）。；鉴忠堂宝谟楼（明万历年间，高拱接旨亭）：新郑旧城保存下来的唯一明代建筑，基座高1.2米，青石条铺地。；惠济门（明代南城门，近年复建）：城头上篆有&quot;惠济门&quot;三字，门口是热闹的南环路。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张大爷（83岁，南街最年长的老住户，南街&quot;活化石&quot;）：\u003cbr\u003e▌退休志办王主任（70岁）：\u003c/p\u003e"}, {"n": "长垣老城·黄河岸边的蒲城", "s": "长垣", "p": "河南", "w": "子路治过的邑·岳飞系马槐·9里18步砖城长垣老城是黄河沿岸最&quot;折腾&quot;的县城——金元旧城被黄河淤没，明初迁到蒲城，明末筑砖城，500年间修了26次。孔子弟子子路在此当过3年&quot;蒲宰&quot;，岳飞抗金路过在县衙后院拴过马（系马槐还活着）。", "h": "\u003cp class=\"main-text\"\u003e春秋 子路（仲由）在此任蒲邑宰3年，&quot;三善&quot;政绩传世。金元 县城在今苗寨镇旧城村一带，因黄河多次泛滥，城址被淤没。至民国黄河中还有古塔露头，成为黄河一景。明洪武二年（1369） 县丞刘彦昭将县治从旧城迁到古蒲城（今老城），初筑土围3里多。正统十四年（1449） 知县萧翼展拓城周至8里，高6米，建四门：仁和、义正、悦来、拱极。成化十年（1474） 城墙加高至6.6米，厚9米，开挖护城壕，四门外各建石桥。崇祯十年（1637） 知县王虚白改土城为砖砌城墙——高10.5米，底宽13.5米，顶宽6.9米，周长9里18步。护城壕宽13.8米，深4.5米。城内挖排水沟120条。这是长垣历史上最完备的城墙。乾隆三十三年（1768） 知县吴钢重修，题名四门：东景晖、西义正、南承熏、北迎恩。1945年9月 因战争需要，组织万余民工拆除砖城墙，从此砖城变土城。1986年 县政府将古城墙4500米作为重点保护区。1995年 大部土城被拓为内环路，仅存西南隅约1公里。2001年 700米开发为仿古商业街。现状： 古城墙仅存约300米（龙山商业街南口东侧），2000年用石块裹护，长70米，高6.2米，底宽14米，顶宽8.4米。老城城内街道格局基本保留，岳飞系马槐仍在县衙旧址后院。&quot;我小时候城墙还完整着呢——9里18步，上面能跑马车。北城墙上洋槐树最多，5月槐花一开，香半里地。我妈那时候常带我去掐槐花蒸饭。70年代修环城路，拆墙的人来了，我爹跟他们吵了一架——这墙比你爷年纪都大！吵也没用，一夜之间没了半面。&quot;。&quot;系马槐是真的老——据说岳飞拴过马，树干粗得很。文革时候差点被砍了烧火，一个老木工偷偷把锯子藏起来才保住。现在树旁边立了块碑，写着&#x27;岳飞系马处&#x27;。每年春天槐花开，很多人专门来合影。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城墙残段（仅存300米）：龙山商业街南口东侧，用石块裹护，高6.2米，底宽14米。；系马槐（岳飞拴马槐，千年古槐）：老县衙后院，树干粗三人合抱，枝繁叶茂。岳飞抗金路过长垣，在此拴马。；蒲城旧治石额：县衙遗址残存，刻&quot;蒲城旧治&quot;四字。；子路祠（纪念孔子弟子仲由治蒲政绩）：老城西街，明清建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董老汉（80岁，老城北街原粮库家属院，在城墙根儿住了一辈子）：\u003cbr\u003e▌张会计（62岁，长垣县文物管理所退休）：\u003c/p\u003e"}, {"n": "浚县·河堤上的活城墙", "s": "浚县", "p": "河南", "w": "城墙当河岸用·一县六大国保·2.1平方公里老城浚县古城墙是全国独一无二的&quot;河堤城墙&quot;——沿卫河西岸那段768米城墙，既要承载防御功能，又要充当河堤驳岸，一旦拆除河岸就会坍塌。这段墙完整保留了明代夯土+砖面结构，砖上还能看到明代窑厂的文字印记。", "h": "\u003cp class=\"main-text\"\u003e西汉 置黎阳县，为黄河以北行政中心之一。隋初 设黎阳总管府，辖四州八县。明洪武三年（1370） 始建县城，以文治阁为中心，夯土筑城，周长4公里。城内形成&quot;四街八巷三十六小巷&quot;格局。成化、正德年间 多次增修。正德三年（1508）建云溪桥（卫河桥）。崇祯十五年（1642） 遭李自成军围城5个月，粮尽援绝，黄河决堤灌城，城墙大部损毁。清初 复修。沿卫河西岸一段768米城墙因兼具河堤功能得以完整留存——其他地段在20世纪被陆续拆除。2014年 大运河申遗成功，这段城墙被纳入世界文化遗产点位。现状： 完整保存&quot;四街八巷三十六小巷&quot;格局。城墙沿卫河西岸768米最完整，高约6米，基部砌青石，上部砌砖，内实夯土。面积2.1平方公里，2019年获评国家4A级旅游景区。文治阁（城中心高台楼阁，通高约20米）、文庙、县衙、翰林府等明清建筑保存完好。&quot;那城墙就是河堤——小时候涨大水，河面上的浪能拍到城墙砖上。要是拆了那768米，西街这一片早冲没了。我家就在城墙根儿，后门一推就是城墙的砖面，下雨能避雨，夏天能乘凉。这墙比我爷爷年纪还大。&quot;。&quot;我做子馍的鹅卵石，就是从城墙上捡的——那砖缝里的小石头磨得溜光，炕子馍最好用。现在城墙上不让捡了，我都从河滩里挖。浚县子馍要放在烫热的鹅卵石上炕，淋鸡蛋进去，外皮脆内里软，这手艺传了几百年。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城墙（沿卫河西岸768米，明代，世界文化遗产）：基部砌青石，上部砌砖，内实夯土。砖面有明代窑厂文字印记。；云溪桥（明正德三年1508，省保）：五孔连拱石桥，卫河上仅存的两座古桥之一。桥墩两端砌分水尖，四角各有石雕水兽（低头引颈状）。；文治阁（清代重建，古城中心）：通高约20米，四个拱券门分别题&quot;丹流东壁&quot;&quot;碧泻西山&quot;&quot;清环黎山&quot;&quot;黛护伾岚&quot;。；黎阳仓遗址（隋代国仓，世界文化遗产）：隋唐大运河关键官仓，有&quot;黎阳收，顾九州&quot;之说。；大伾山摩崖大佛（北魏，22米高，国保）：北方早期大型摩崖造像。；浮丘山碧霞宫（明清建筑群，国保）：规模宏大，院落层层递进。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王奶奶（78岁，西街村人，在卫河边住了60年）：\u003cbr\u003e▌张掌柜（65岁，西大街开了30年浚县子馍铺）：\u003c/p\u003e"}, {"n": "淇县·朝歌城门缝里的古柏", "s": "淇县", "p": "河南", "w": "500年柏长在门洞砖缝·《诗经》淇水汤汤地淇县老城是殷商故都朝歌，古城墙早已不存，但朝歌老街还留着明清、民国、建国初期的建筑叠层——清末5处、民国23处、建国初期36处挤在几百米老街上。更奇的是下属鹿台阁（摘星台）的门洞砖缝里，长着一棵500年古柏，胸围1.1米。", "h": "\u003cp class=\"main-text\"\u003e商末 纣王帝辛都朝歌，历武丁、武乙、帝乙、帝辛四代，约100年。城墙遗址在县城西3公里。春秋 卫国都朝歌，后迁楚丘、帝丘（濮阳）。西汉 置朝歌县。唐 卫县（治今汲县）属卫州。明洪武二年（1369） 降州为县，称淇县。筑土城，后多次增修。崇祯十五年（1642） 遭战乱损毁。清初 重建砖城。鹿台阁（摘星台）为明代中期重建——纣王摘星楼旧址，门洞砖缝里自然长出古柏。建国后 城墙逐步拆除，护城河填平。现状： 朝歌老街保存清末建筑5处、民国建筑23处、建国初期公共建筑36处，青石板路，两侧老铺子。文昌阁（明末崇祯年间建）在街口。卫国故城遗址（春秋卫国都城，国保）在县城东侧，城墙残段尚存。&quot;那棵柏树什么时候有的？我爷爷说他小时候就在那儿了——至少500年。门洞砖缝里长出来的，根顺着砖缝往下钻，不知道扎到哪儿了。我小时候常爬上去摸树根。现在有人说那是&#x27;封神&#x27;的一景，游客来都要摸一把。&quot;。&quot;我家那屋子是民国时期的，木梁雕花都在。老街有意思——明清的深宅、民国的商铺、建国初期的供销社、人民剧院，全挤在一条街上。我小时候供销社还开着，卖的糖块5分钱一颗，现在供销社变文物了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e鹿台阁古柏（500年，胸围1.1米）：摘星台门洞砖缝里自然生长，根系沿两侧砖缝向下延伸。；朝歌老街（省级历史文化街区）：青石板路，清末/民国/建国初期建筑叠层保存。人民剧院、百货公司、新华书店（50-70年代风貌）、大清邮局旧址等。；卫国故城遗址（春秋，国保）：县城东侧，夯土城墙残段尚存。；文昌阁（明末崇祯年间）：朝歌老街街口标志建筑，登阁可俯瞰老街全景。；云梦山（中华第一古军校）：鬼谷子隐居地，水帘洞、孙膑洞等遗址。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，朝歌老街最年长住户，在老街上住了60年）：\u003cbr\u003e▌孙姐（58岁，朝歌老街开了20年代香铺+茶馆）：\u003c/p\u003e"}, {"n": "原阳原武·黄河渡口的玲珑塔", "s": "原武", "p": "河南", "w": "汉张苍墓·黄河重要渡口·外敌占据时留下城墙老照片原武城是黄河北岸的千年渡口——从汉代到民国，都是从河北过黄河到开封的必经之地。城虽小（周长2547米），但外敌占据时期的战时档案里专门记录了它的城墙数据——&quot;高7米，上宽2米，下宽10米&quot;。城外善护寺的玲珑塔是&quot;原武八景&quot;之一。", "h": "\u003cp class=\"main-text\"\u003e西汉 置原武县。明洪武四年（1371） 筑土城。崇祯十三年（1640）改砖城。清 属怀庆府。多次重修。1938年12月 外敌占据原武。战时档案载：&quot;城墙高7米，上宽2米，下宽10米，周长2547米，外壕沟宽8米深3米。&quot;外敌士兵在东城墙站岗，拍了珍贵的城墙老照片。1941年 伪知事岳绍明奉命修城墙，立&quot;城壁修复纪念碑&quot;。1945年 光复。1950年代 原武、阳武两县合并为原阳县，县治迁原武镇（原阳老县城）。现状： 原武老城（原原阳县城）现为原阳县原武镇。城墙已不存，但街道格局保留。善护寺玲珑塔（宋代）仍在城外，&quot;原武八景&quot;之&quot;东门烟寺暮雨&quot;即指此。城内有汉张苍墓（西汉丞相）。&quot;那城墙是真高——7米，跟现在两层楼差不多。外敌站岗那事儿我爹跟我说的——人拿枪逼着老百姓修城，还立了碑。我小时候城墙砖还能挖着，后来大跃进全扒了烧砖炼钢。善护寺的塔现在还在，我爬上去过，能看见黄河滩。&quot;。&quot;那战时档案是我从网上找到的——日本防卫厅战史研究所藏的。上面写着&#x27;原武城城墙高七米，上宽二米，下宽十米，周长二千五百四十七米&#x27;，精确到米。还有一张老照片，外敌站在城墙上，背后就是玲珑塔。这是原武城仅存的几张老照片。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e善护寺玲珑塔（宋代）：&quot;原武八景&quot;之一，东门烟寺暮雨。塔高约20米，砖结构。战时老照片里仍清晰可见。；汉张苍墓（西汉丞相）：原武镇北，现存封土丘。；原武老城街巷：街道格局基本保留，东西南北四街仍在。；黄河渡口遗址：原武老城北依黄河大堤，古代渡河码头遗迹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，原武镇东街老木匠，1950年代见过完整城墙）：\u003cbr\u003e▌退休教师李老师（70岁，原阳县志办公室）：\u003c/p\u003e"}, {"n": "延津·吴起城的鬼打城传说", "s": "延津", "p": "河南", "w": "战国吴起驻军·鬼打城传说·黄河古渡口延津有两处全国独一无二的古城遗址——吴起城（沙门城址）是战国名将吴起驻军抗击秦国的古城，城址被黄沙覆盖，近年考古挖出宋农田遗存；还有&quot;鬼打城&quot;传说——一夜之间夯土城墙出现，百姓传是鬼神所筑，其实是明代附近村落因躲避战乱集体筑城。", "h": "\u003cp class=\"main-text\"\u003e战国 吴起在今沙门村驻军抗击秦国，筑吴起城（今沙门城址）。金明昌五年（1194） 黄河改道，宜村（宋金时期叫沙门）从黄河南岸变成北岸。金贞祐二年（1214） 卫州州治迁宜村新城，胙城县治同迁。正大八年（1231）用石头包砌城壁（以石甃其城）。元 胙城县治他迁，卫州城废弃。2005年冬 长济高速施工取土，无意中挖到古钱币，引发&quot;吴起城淘宝热&quot;。2006年7-8月 考古队对遗址全面调查勘探——现存北城墙长740米，东城墙640米，西城墙800米。城址北窄南宽，面积约1000多亩，被黄沙覆盖。2013年 沙门城址列入第七批全国重点文物保护单位。现状： 吴起城遗址立有全国重点文物保护单位石碑，夯土上包着一棵老柳树，经十四路旁。县城老城的明清城墙已全部消失，仅剩城墙基址隐于环城路下。&quot;2005年修高速挖土方，挖出一堆古铜钱——有汉代的、宋代的。消息传开，全国来淘宝的人把地都翻遍了。我也捡了一枚&#x27;大观通宝&#x27;，后来县文管所来人收走了，给了我一张奖状。现在那夯土堆上立着&#x27;国保&#x27;石碑，旁边长着一棵老柳树，不知道什么时候栽的。&quot;。&quot;我爹说那夯土堆原来有1000米长、3米高——传说是鬼神一夜筑的。其实就是明朝时候周围村子为了躲土匪，晚上偷偷一起筑的，怕被土匪发现，才说&#x27;鬼打城&#x27;。现在全成耕地了，种麦子。我小时候还在上面放羊呢。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e吴起城遗址（沙门城址）（国保）：战国，夯土城墙尚存，被黄沙覆盖。现存北墙740米、东墙640米、西墙800米。；&quot;鬼打城&quot;夯土堆（延津东古墙/西古墙村）：传说一夜之间出现的夯土城墙，实为明代百姓躲避战乱集体筑城。20世纪90年代遗址长1000米、宽12米、高3米，现在变成肥沃农田。；胙城城隍庙：胙城县治旧址，尚存，近年文物专项调查新发现鲁葛祠。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宋老师（72岁，延津县十八里村农民，吴起城遗址发现者之一）：\u003cbr\u003e▌张老汉（68岁，东古墙村农民，&quot;鬼打城&quot;传说知晓者）：\u003c/p\u003e"}, {"n": "封丘·黄池会盟的城墙路", "s": "封丘", "p": "河南", "w": "春秋黄池会盟·城墙拆了变黄池路·四碱坑封丘老城是春秋吴王夫差黄池会盟的故地——孔子闻&quot;黄池之会&quot;时正在卫国。明嘉靖三十年（1551）知县李嵩始筑砖城。1980年代城墙拆除修成黄池路——现在双向四车道的主干道，路基就是明代东城墙和护城河。城因避水患，城内东南西北四角取土形成四个&quot;碱坑&quot;（现称湖），雨天全城不积水——这是封丘城独特的排水智慧。", "h": "\u003cp class=\"main-text\"\u003e春秋（前482） 吴王夫差与晋定公、鲁哀公等诸侯会盟于黄池——孔子当时在卫国，闻讯感叹&quot;黄池之会&quot;。西汉 置封丘县。明景泰二年（1451） 典史郜瑢筑土城，周五里有奇。明嘉靖三十年（1551） 知县李嵩始筑砖城——基宽3丈，顶宽2丈，高2.5丈，城外壕宽3丈。清顺治、咸丰年间 多次重修。北门有镶金匾额，旌表封丘人李嵩阳（清顺治年间任监察御史）。1980年代 城墙拆除，护城河填平，修成南北主干道黄池路——定名即取自黄池会盟典故。2019年 黄池路全线升级改造为双向四车道。现状： 老城街巷基本保留棋盘格局。四个碱坑（东南西北四角取土形成的湖）仍在——现称东湖、西湖，荷花盛开。边胡同（因边姓家族出两对父子进士而闻名）仍存，两边有明清老宅子。黄池路就是原东城墙+护城河位置。&quot;我家就在边胡同——清末的时候胡同里出了两对父子进士。现在我家那老宅子还是前房后院的格局，门楼砖雕都在。我爹说当年城墙还在的时候，北门上有块镶金的大匾，后来日本人来了就没了。那匾是夸李嵩阳的——他是清顺治年间的御史，捐钱修城墙、救济流民。&quot;。&quot;封丘老城最聪明的地方就是那四个碱坑——修城墙取土挖的，后来变成湖。不管下多大的雨，城里不积水——雨水顺着地势往四个坑里流。这是几百年前古人的排水智慧！现在南边那个碱坑变成公园了，种满了荷花，我常去拍照。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e黄池路（明城墙原址）：南北主干道，路基为明东城墙+护城河。；四个碱坑（明清排水智慧）：城内东南西北四角取土筑城形成的湖，雨天全城雨水汇入，城内不积水。现为城市公园。；边胡同：因边姓家族出两对父子进士（举人秀才近百人）闻名，南北长数百米，两侧有前房后院式明清建筑。；北干道（原北城墙）：清代砖砌北城墙，顶上曾有垛口、敌楼，墙外为护城河。；黄池会盟碑：近年复建，立于黄池公园。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李老汉（78岁，老城边胡同住户，边姓后人）：\u003cbr\u003e▌王大姐（62岁，封丘退休教师，碱坑爱好者）：\u003c/p\u003e"}, {"n": "汝南·天下之中的蔡州城", "s": "汝南", "p": "河南", "w": "秦观当过8年教授·《鹊桥仙》灵感·汝水抱城汝南古称悬瓠城，因汝水三面环抱如垂瓠（葫芦）得名。这里是中国地理上的&quot;天中&quot;——周公在此立圭测影，颜真卿亲笔题&quot;天中山&quot;三字。北宋婉约词宗秦观（秦少游）在此当了8年蔡州教授，《鹊桥仙》&quot;两情若是久长时&quot;的创作灵感深受汝南民间牛郎织女传说滋养。", "h": "\u003cp class=\"main-text\"\u003e东晋义熙十四年（418） 汝南郡治所迁悬瓠城（今汝南老城）。北魏 城周长12公里，仅东、西、南3门，无北门。城墙夯土筑成。公元449年，魏军围困悬瓠城，汝南太守陈宪率千人苦战42天，魏军死伤无数，汝水为之断流。明洪武八年（1375） 增辟北门，城周拓为9里30步，高2.5丈。四门：东作、汝南、西城、拱北。成化二十年（1484） 重修，撤旧楼，绕以子墙，建警铺48个。清顺治、咸丰年间 多次重修。1936-1937年 国民党第八行政区督察专员下令，除四关城门外，城墙全部拆除。1953-1968年 四座城门陆续拆除——1968年南城门和内城西城门最后拆除，北门因对汝河水浸有保护作用而得以留存。1996年 汝南县农业银行捐资复建天中门（南城门）。2021年复建汝南门。现状： 北城门遗址留存，门外汝河为天然护城河。城内七街三巷青石板路，遗存古建筑有悟颖塔、观音阁、准提楼、开元寺等。天中山文化园（周公立圭测影处，颜真卿题碑）、皇家驿站（明代崇简王驻马驿址）均在城外。&quot;我小时候那南城门还在——三洞双檐，叫汝南门。门口有两头大石狮子，我常骑在上面玩。1968年那时候拆的——我亲眼见的，拆了三天。北边那城门因为挡水才没拆，现在就剩个土台子。天中山那地方，我爹说原来就是个小土丘，颜真卿的碑是后来立的。&quot;。&quot;秦观在汝南当了8年蔡州教授——元丰八年到元祐八年。他写的《汝水涨溢记》就是记录汝南水灾的。我研究了一下，《鹊桥仙》里的牛郎织女故事，汝南有传说——城西董永墓、城东织女湖，古代有七夕庙会。秦少游可能就是受了本地传说的启发。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e天中山（天下地理中心）：高不过丈余的小土丘，周公立圭测影处。颜真卿亲笔题&quot;天中山&quot;三字，碑刻现存。；悟颖塔（北宋，国保）：高约30米，因无影得名（冬至正午无影）。；小南海（城东南角取土筑城形成的湖）：湖边有观音阁、大士阁、准提楼。；皇家驿站（明代官驿，复建）：北辰门、驿丞署、急递铺等，近年修复成景区。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e北城门遗址：1968年唯一没拆的城门，因有防洪功能得以保留。门外汝河护城河。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张爷爷（82岁，汝南北街老住户，见过完整南城门）：\u003cbr\u003e▌退休教师李老师（70岁，秦观研究爱好者）：\u003c/p\u003e"}, {"n": "上蔡·蔡国六百年夯土城", "s": "上蔡", "p": "河南", "w": "3000年古城墙·唯一没迁的西周古城·重阳发源地上蔡蔡国故城是中国保存最完好的西周古城——城址3000年没迁过，城底下压着周、汉、宋、明清各代叠压层（古今叠压型城市）。现存夯土城墙10490米，最高11米（相当于5层楼），宽15-25米，每层厚8-14厘米，夯窝圜底——3000年前的筑城工艺至今清晰可见。", "h": "\u003cp class=\"main-text\"\u003e西周初年（前1046） 周武王封弟蔡叔度于蔡，建都于芦岗东侧。蔡叔度因&quot;三监之乱&quot;被周公旦囚禁于郭邻（故城蟾虎寺一带）。周成王三年 蔡叔度之子蔡仲胡被封于故地，继续修筑都城——蔡国故城始建于芦岗之上，南北2830米，东西2406米，面积8.1平方公里，是当时中原地区最坚固的诸侯城。春秋 蔡国受楚国欺凌，蔡平侯于前531年迁都新蔡，上蔡故都始称上蔡（区别于新蔡）。战国 楚灭蔡国，上蔡成为楚国北方重镇。秦汉以来 上蔡县城一直没迁——城池在蔡国故城内收缩成方形，明清城墙周约5里。建国后 明清城墙拆毁，但蔡国故城的3000年夯土城墙完整留存。1996年 蔡国故城公布为第四批全国重点文物保护单位。2025年 上蔡入选河南省第一批省级地名文化遗产保护名录。现状： 蔡国故城现存夯土城墙10490米（约21华里），高4-11米，宽15-25米。西城、南城保存最好。城内二郎台（宫殿区，面积120万平方米）高台尚存。上蔡县城（明清缩小城）城内仍有古街巷格局，蔡明园（近年复建）位于蔡国故城内。&quot;我是1977年调到县文化馆搞文物的。那时候蔡国故城的城墙没人管——有人在城墙上取土盖房，有人在城墙上放牛。后来1996年立了国保碑才好点。我用了30年走遍这10公里城墙，每层夯土都摸过——8到14厘米厚的夯层，圜底夯窝，这就是西周的筑城法！我出版了《蔡国史研究》《蔡国纪事本末》。&quot;。&quot;我家种地就在城墙边上——那夯土真结实，比现在水泥都硬。小时候我爬城墙，从上往下跳，摔在土墙上也不疼，夯土厚着呢。城墙缝里长酸枣树，我常摘酸枣吃。现在不让爬了，立了铁栏杆。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e蔡国故城夯土城墙（西周，国保）：现存10490米，高4-11米，夯层厚8-14厘米，夯窝圜底。；二郎台（蔡侯宫殿区）：高台比周围高出6-7米，面积120万平方米。台上发现古井、陶排水管、春秋筒瓦/板瓦碎片。；蔡侯墓群（故城西北9个土冢）：相传为蔡侯墓。；李斯楼村：秦丞相李斯故里，上蔡县西。；蔡明园（近年复建，位于蔡国故城内）：仿古建筑群，免费开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尚景照（退休文物专家，78岁，用了30年研究蔡国故城）：\u003cbr\u003e▌刘老汉（75岁，蔡国故城旁边王庄村农民，从小在城墙根长大）：\u003c/p\u003e"}, {"n": "新蔡·蔡平侯迁都的春秋故城", "s": "新蔡", "p": "河南", "w": "8.6公里夯土城·东南角仅存1415米新蔡是蔡国的第二座都城——蔡平侯为依附楚国，从前531年起从上蔡迁都到此（原吕国都城），共传平侯、悼侯、昭侯三代，38年。故城东西长，长方形，周长8615米，占地5.8平方公里。东南角1415米夯土城墙保存尚好，高2-10米，宽20-50米——3000年风雨后的模样。", "h": "\u003cp class=\"main-text\"\u003e前503年 蔡平侯迁都吕地（新蔡），称新蔡以别旧都上蔡。在吕国故城基础上扩建。前494年 蔡昭侯迁都州来（下蔡，安徽寿县）。新蔡故城遂废，沦为普通城邑。明洪武年间 在春秋故城西南部筑小县城——周长仅3里275步，面积仅为春秋故城的1/10。明正德年间（1516） 知县刘汉始筑砖城——高1.5丈，四门：东通淮、西望汝、南仪凤、北瞻极。明万历年间 文庙门口另辟启泰门（虚设，不通行）。民国30年（1941） 敌机轰炸县城，为疏散人口，县府下令拆毁砖城墙，仅留四门城台。建国后 四门城台和护城河也拆毁填平，城墙基址盖成民房。现状： 春秋故城（蔡国迁都地）东南角1415米夯土城墙保存尚好，高2-10米，宽20-50米。其余被工厂、机关、学校占用。明清小县城完全不存，城内街道改造成现代道路。&quot;我家的地就在城墙边上——东南角那段1415米的夯土墙，旁边就是我种的花生地。那土夯得比石头还硬，花生根都扎不深。我爷爷说那是&#x27;蔡平侯城&#x27;，3000年前的城墙，现在还能摸得到。2025年文物普查，他们在那段城墙里挖了个探方，拿出来的夯层样本我看了——一层一层跟年轮似的。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新蔡春秋故城（省保）：东西长方形，周长8615米，占地5.8平方公里。东南角1415米夯土城墙保存尚好。；新蔡文庙（始建于元大德八年1304）：大成殿、明伦堂等遗存。；金粟禅林寺（清康熙十年1671，江北名刹）：原址在县城南郊，占地500亩，有塔林五六十座。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵老汉（70岁，新蔡老城农民，春秋城墙边上的庄稼户）：\u003c/p\u003e"}, {"n": "潢川光州·一水隔两城的吕字古城", "s": "潢川", "p": "河南", "w": "南北两城·小潢河穿城·春申君故里潢川（古称光州）是中国少有的&quot;一水隔两城&quot;格局的古城——小潢河穿城而过，把城分成南北两半，呈&quot;吕&quot;字形。南城（弋阳古镇）西汉初年已形成，比北城早1200年；北城（春申镇）南宋庆元年间才建。两城分别出了战国春申君黄歇（北城）和开漳圣王陈元光（南城），一水两城两大名人。", "h": "\u003cp class=\"main-text\"\u003e春秋 黄国故城在城西6公里，周长6720米（国保）。前648年楚灭黄。西汉初 置弋阳县，县城即潢川南城（弋阳古镇）。唐太极元年（712） 光州州治从光山迁定城（南城）——光州名字沿用至民国。南宋庆元元年（1195） 知州梁季泌扩建南城，小潢河因势利导被引入城内，城分南北两半，还是土城。明洪武元年（1368） 省定城入光州。明正德六年（1511）兵燹城陷；次年知州李镗用砖石重修南北两城——北城辟5门，南城辟6门，周长扩为14里，城墙高3丈。这是今天潢川城的最终格局。清 南城10条街，北城9条街。北城为官府所在，南城为商铺民居。民国2年（1913） 光州废州设县，更名潢川。建国后 城墙陆续拆除——砖被扒去盖办公楼、学校。护城河填平修路。现状： 南城（弋阳古镇）保存较好——大巷、中大、南国西天三条主街和十余条老街，清代胡
