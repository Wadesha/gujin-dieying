;淮河路古称庐州、庐阳，秦置县两千二百多年，淝水穿流全城，&quot;淮右襟喉、江南唇齿&quot;。教弩台三国练兵原物、明教寺梁代铁佛、包公园、李鸿章故居，一条淮河路串起千年庐州文脉。", "h": "\u003cp class=\"main-text\"\u003e合肥古称合淝、庐州、庐阳。秦代置县属九江郡，至今两千二百多年。西汉为淮南王国都邑之一，东汉末曹操挟天子以令诸侯，在此大规模练兵，教弩台就是那个时期的遗物——台基用汉代条石砌筑，台上面平如砥，原在老城外，宋代庐州城扩建时圈入城内。三国时期这里是魏吴交界前线，曹魏新城遗址是满宠为抵御东吴所筑，城址在今庐阳区三十岗乡，土夯城墙残段仍可辨认。唐代庐州城已具规模，城内报恩寺、明教寺等古刹陆续兴建——明教寺原名铁佛寺，南朝梁天监年间就有，唐代宗大历年间挖出丈八铁佛后皇帝李豫诏令重建改名明教院，清咸丰年间兵乱受损、光绪年间重修至今。包拯就是合肥人，北宋治平三年（1066）知州吴几道始建包公祠于城西，明弘治元年（1488）庐州知府宋鉴迁建到南门外小河边，清光绪八年（1882）原籍合肥的李鸿章捐银2800两重建，从此老合肥流传&quot;包家祠堂李家修&quot;。清代李鸿章、李鹤章兄弟在淮河路修建私宅，五进院落纵深2500多平方米，与包公园隔淝水相望，人称&quot;李府半条街&quot;。宋代熙宁年间始建庐州府城，城墙跨淝水两岸，历元明清多次修葺，1938年战乱中部分损毁，建国后又拆去大半。如今环城河内5.2平方公里的老城仍在更新，教弩台、包公园、李鸿章故居连成一线，淮河路的青石板上还能踩出清末民初的市井回音。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e教弩台（三国·高5米·面积4260平方米·条石砌筑）：曹操公元215年在此训练强弩手，原在老城外，宋城扩建圈入城内，听松阁&quot;教弩松阴&quot;为庐阳八景之一；明教寺（南朝梁天监年间·502-549·原名铁佛寺）：唐代宗时挖出丈八铁佛改名明教院，清光绪年间重建。&quot;屋上井&quot;井栏刻&quot;泰始四年殿中司马夏侯胜造&quot;（268年），井沿23条汲水绳磨出深沟；庐州府城隍庙（北宋皇祐三年·1051·江淮最大城隍庙）：清光绪五年李鹤章重修，三进院落；包公园·包公祠（明弘治元年·1488·清光绪八年李鸿章捐2800两重建）：廉泉井传说贪官喝了头疼，老合肥有&quot;包家祠堂李家修&quot;的说法；李鸿章故居（淮河路208号·五进院落2500平方米）：江淮间最大清代私宅，&quot;李府半条街&quot;的别称，福寿堂、福寿墙保存完整；曹魏新城遗址（满宠公元230年建·庐阳区三十岗乡）：三国时期的城防要塞，土夯城墙残段可摸；大蜀山（合肥近郊·死火山·海拔284米）：淝水之战的地理标识之一，山顶有电视塔。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明教寺方丈 觉空法师（72岁）：&quot;明教寺的&#x27;铁佛寺&#x27;名字早了，梁代就有。唐代挖出个丈八铁佛，皇帝赐名明教院。&#x27;屋上井&#x27;的井栏还是晋代刻的字——&#x27;泰始四年殿中司马夏侯胜造&#x27;，公元268年了，井沿上那23条绳痕，每一条都是老合肥人一代代打水井磨出来的。&quot;\u003cbr\u003e▌包公园保洁员 王阿姨（58岁）：&quot;廉泉那口井，老辈说贪官能看见水里有影子还头疼，清官喝了没事，传了上千年了。李鸿章捐了2800两银子重建包公祠，所以有&#x27;包家祠堂李家修&#x27;的说法，两家就在这河两岸，一个祠堂一个宅子。&quot;\u003c/p\u003e"}, {"n": "霍山老城·衡山镇·古南岳·文庙·文峰塔", "s": "霍山", "p": "安徽", "w": "黄帝封霍山为南岳·华东保存最完好明清文庙·道光年间半截北塔未完工古称衡山、南岳，上古九黎三苗聚居地，黄帝封霍山为南岳、祝融镇守，《尔雅·释山》列&quot;霍山为南岳&quot;。隋文帝改封湖南衡山后，这里称&quot;古南岳&quot;&quot;小南岳&quot;；文庙是华东保存最完好的明清古建筑群。", "h": "\u003cp class=\"main-text\"\u003e霍山古称衡山、南岳，是上古九黎三苗的聚居地，传说蚩尤在此起兵，迎驾厂社区的三星堆风格遗迹就是那个时期的遗物——&quot;战神庙&quot;遗址出土石斧、石钺、石箭簇，距今三四千年。黄帝平定蚩尤后封霍山为南岳、祝融镇守，《尔雅·释山》明确列&quot;霍山为南岳&quot;，《说文解字》也说&quot;东岱、南霍、西华、北恒、中泰室&quot;——隋文帝改封湖南衡山后，这里改叫&quot;古南岳&quot;，民国时期当地百姓俗称&quot;小南岳&quot;。汉初属衡山国（刘安封地），汉高祖五年（前202）置灊县，南朝梁属岳安县，隋开皇三年（583）改岳安县为霍山县——这是霍山作为县名的开始，至今1400多年。北宋开宝元年（968）曾降为故埠镇，明弘治七年（1494）复设霍山县至今未改。文庙就在复设之年动工兴建，历经明万历年间两次迁址（十六年迁淠河北、二十九年复迁回），崇祯八年（1635）兵乱受损，清顺治十年（1653）恢复、乾隆十八年（1753）扩大大修，现存45间古建筑，是华东保存最完好的明清文庙之一。清道光年间知县朱士达、许道藩先后集资在县城南北建两座风水塔：南塔1826/1829年建成，七级六棱高21米，实心密檐式，&quot;文峰塔&quot;三字篆书刻在塔基；北塔建在龙头石、淠河边，建到第三级就停了，至今是半截锥子。皮日休写《霍山赋》&quot;夫古有五岳，霍居其一&quot;，把霍山列入古岳之中，历代皇帝来此巡狩封禅祭南岳——舜、秦始皇、汉武帝都曾登山。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e霍山文庙（明弘治七年·1494·占地面积4027平方米）：华东保存最完好明清古建筑群之一，现存大成殿、崇圣祠、明伦堂、藏经阁45间，省保；明万历十六年（1588）曾迁淠河北、二十九年复迁回现址；文峰塔（南塔·清道光二年/五年·知县朱士达建·六棱七级实心密檐·高21米）：风水塔，&quot;人杰原于地灵，欲启人文宜培地脉&quot;，塔基层篆书&quot;文峰塔&quot;三字，省保，1982年抢修、1999-2000年建文峰广场；北塔（龙头石·淠河边·半截锥子仅三级·未完工）：道光年间与南塔先后动工，因工程受阻中止，光绪《霍山县志》有载；南岳山（小南岳·山顶南岳庙/南岳祠·祝融庙·百步阶明代石阶120级）：东门楼明建筑&quot;小南岳&quot;于右任手迹，西门楼&quot;汉帝敕封&quot;石刻，天池、试心崖；衡山古镇（迎驾厂社区·三星堆风格遗迹）：蚩尤起兵处，&quot;战神庙&quot;遗址出土石斧、石钺、石箭簇。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文庙看门人 陈先生（68岁）：&quot;文庙是明弘治七年复设霍山县那年建的，4027平方米，45间房子。大成殿里的孔子像还在，民国时候差点被拆，老知县保住了。明万历年间搬过一次家，从城中心搬到淠河北、又搬回来，折腾了三次。&quot;\u003cbr\u003e▌文峰塔下卖茶叶的老周（55岁）：&quot;南塔是道光年间建的，高21米，七级六棱，风水塔，知县朱士达建的，说&#x27;人杰原于地灵&#x27;。对面还有个北塔，建到第三级就停了，半截塔，老辈说钱不够了。南岳山顶的庙供的是祝融，老皇帝来祭南岳的地方。&quot;\u003c/p\u003e"}, {"n": "巢湖老城·巢县·居巢·卧牛山·陷巢州传说", "s": "巢湖", "p": "安徽", "w": "卧牛山唐宋古城墙残段·中庙东吴赤乌二年·姥山文峰塔古称居巢、南巢，与巢湖&quot;陷巢州长庐州&quot;传说密不可分。卧牛山顶有唐宋城墙残段，中庙东吴赤乌二年始建近一千八百年，姥山岛文峰塔明崇祯年间建，昭忠祠是巢湖现存最大古建筑。", "h": "\u003cp class=\"main-text\"\u003e巢县古称居巢、南巢，巢湖周边流传&quot;陷巢州、长庐州&quot;的传说——小白龙违抗玉帝降雨令，被打落凡间，巢湖因此陷落形成。《永乐大典》&quot;湖&quot;字册引南宋《合肥志》记载了最完整的官方版本，说焦姥化身姥山、女儿化身姑山、遗鞋化为鞋山。2001年考古工作者在巢湖北岸唐咀水下发现秦汉陶片，印证了古巢城沉没的传说。巢县古城始建于元末土城，明嘉靖三十六年（1557）改砖城，四门：东朝阳、南迎薰、西滨湖、北拱极。卧牛山是巢县老城中心，山上曾筑唐宋城池，城墙残段至今仍可辨认——青砖砌筑，沿山势蜿蜒，山顶北侧最清晰。中庙始建于东吴赤乌二年（239），是巢州、庐州中间的标志，&quot;南九华中庙&quot;与九华山西禅寺齐名；建在突入湖中形如飞台的石矶上，因此叫&quot;凤凰台&quot;；光绪《庐州府志》记载晋时朝廷敕封焦姥为圣妃、建圣妃庙——中庙的前身就是这座圣妃庙。姥山岛文峰塔明崇祯四年（1631）由邑人严尔圭主持修建，七层砖塔，民谚&quot;姥山尖一尖，庐州出状元&quot;因它而起；龟山塔明初始建，崇祯年间遭雷击倒两层，清道光年间重修七层，600多年历史。昭忠祠是清末重臣李鸿章为淮军阵亡将士修建的纪念性祠堂，1892年动工、1894年竣工，正殿七开间、殿宇30间、建筑面积990平方米，供奉牌位190余尊，是巢湖现存最大的古建筑，省级文保单位。文昌阁初建在卧牛山顶，清末迁到天河边，1957年前后拆除，如今按原样重建。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e卧牛山古城墙（唐宋·残段可辨）：卧牛山是巢县老城中心，山上曾有唐宋筑城，城墙残段在山顶北侧，青砖砌筑；中庙（圣姥庙·忠庙·东吴赤乌二年·239·距今1780年·&quot;南九华中庙&quot;）：因处巢州、庐州中间得名，建在突入湖中形似飞台的石矶上称&quot;凤凰台&quot;；光绪《庐州府志》载&quot;巢湖圣妃庙在姥山庙，晋时敕建&quot;，朝廷封焦姥为圣妃；姥山岛文峰塔（明崇祯四年·1631·严尔圭建）：七层砖塔，&quot;姥山尖一尖，庐州出状元&quot;的民谚因塔而起；龟山塔（明初·崇祯年间雷击倒两层·清道光重修·七层）：600多年历史；昭忠祠（淮军忠烈祠·1892-1894·李鸿章建）：正殿七开间，殿宇30间，建筑面积990平方米，供奉神位190余尊，巢湖现存最大古建筑，省保；巢湖水下古城遗址（北岸唐咀·2001年考古·秦汉陶片出土）：&quot;陷巢州长庐州&quot;传说的实物佐证。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文昌阁（初建卧牛山顶·清末迁天河边·现原址重建）：原阁1957年前后拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌卧牛山晨练的老巢（72岁）：&quot;卧牛山是老城中心，唐宋年间这里有城墙，残段还在山顶北边，青砖垒的。&#x27;陷巢州长庐州&#x27;的传说，老辈都讲——小白龙降雨被玉帝惩罚，巢湖就陷下来把巢州淹了，焦姥变姥山，她女儿变姑山。&quot;\u003cbr\u003e▌中庙看庙人 吴师傅（66岁）：&quot;中庙是东吴赤乌二年建的，快一千八百年了，叫&#x27;忠庙&#x27;又叫&#x27;圣姥庙&#x27;，晋时皇帝敕封焦姥为圣妃。庙建在湖边石矶上，像凤凰落在湖面上，所以叫凤凰台。老辈说九华山是九华，中庙是九华的&#x27;中&#x27;，南九华中庙。&quot;\u003c/p\u003e"}, {"n": "滁州老城·琅琊山·醉翁亭·欧阳修知滁", "s": "滁州", "p": "安徽", "w": "&quot;环滁皆山也&quot;·天下第一亭·丰乐亭同乐园·《儒林外史》作者吴敬梓故里古有琅琊山、今有&quot;醉美亭城&quot;。欧阳修庆历五年（1045）贬知滁州，写下《醉翁亭记》《丰乐亭记》，醉翁亭成四大名亭之首；琅琊寺唐代始建、韦应物写《滁州西涧》；吴敬梓是滁州全椒人，《儒林外史》作者。", "h": "\u003cp class=\"main-text\"\u003e滁州得名于滁河，古称涂中、清流。西周灭商后，周王东征建立诸侯国屏藩王室，市境建有嬴姓的钟离国、高阳氏的椒国。春秋时楚、吴分据周简王二年（前584）吴楚在钟离会盟，周敬王二年（前518）爆发&quot;卑梁之衅&quot;——吴国卑梁与楚国钟离边民因争桑引发战事，导致两国相继灭掉钟离、居巢。秦末项羽兵败垓下，渡过淮水后经钟离、阴陵、东城、椒陵至乌江，市境留下虞姬墓、霸王墩遗迹。西晋惠帝时&quot;八王之乱&quot;，琅琊王司马睿避乱南下建康途中曾在滁州西南山中停留，琅琊山因此得名。东晋咸安元年（371）大司马桓温破前秦、太元四年（379）谢玄率三万精兵进驻白马塘败前秦，滁州成为南北政权交界的兵家必争之地。唐代大历六年（771）刺史李幼卿与法琛禅师在琅琊山建佛寺，代宗李豫赐名&quot;宝应寺&quot;（琅琊寺）。建中二年（782）韦应物出任滁州刺史，写下千古绝唱《滁州西涧》，三年后罢任因无路费返乡，在西涧边搭庵栖身。至道元年（995）王禹偁贬守滁州，宽政爱民、清廉自守，俸禄外不收取一物，妻子素服荆钗不识金翠，儿子粗衣布履不着罗绮。庆历五年（1045）欧阳修贬知滁州，时任龙图阁直学士、河北都转运使，被&quot;庆历新政&quot;失败牵连贬谪。他在滁州任上三年——宽简施政、寄情山水、与民同乐。琅琊寺住持僧智仙为他在琅琊山麓建了一座亭子，欧阳修以自己的号&quot;醉翁&quot;命名为醉翁亭，写下477字的散文名篇《醉翁亭记》，使滁州名动天下。庆历六年（1046）他又在丰山之侧偶然发现一处甘泉，水味甘冽，因爱其山势环抱筑小亭泉上，自名&quot;丰乐亭&quot;并撰《丰乐亭记》，取&quot;岁物丰成、与民同乐&quot;之意。苏轼为《醉翁亭记》《丰乐亭记》书写碑刻，&quot;欧文苏字&quot;成为滁州文化瑰宝。吴敬梓是滁州全椒人，《儒林外史》作者，琅琊山、醉翁亭都在他的诗文里留下了印记。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e醉翁亭（北宋庆历五年·1045·琅琊寺僧智仙为欧阳修建·天下第一亭）：小巧独特、飞檐凌空；亭内有苏轼手书《醉翁亭记》碑刻（&quot;欧文苏字&quot;）；明代扩建至&quot;九亭十阁&quot;建筑群；清光绪七年（1881）全椒薛时雨募化巨资重修；省保；同乐园（醉翁亭西侧·现代重建）：塑欧阳修雕像、挂苏轼/祝枝山/赵孟頫/董其昌等名家《醉翁亭记》碑刻楹联；有对联系&quot;翁去八百载，醉乡犹在；山行六七里，亭影不孤&quot;；丰乐亭（丰山之侧·北宋庆历六年·1046·欧阳修偶得甘泉所筑·撰《丰乐亭记》）：丰山南麓有泉水味甘冽，欧阳修建亭，&quot;丰乐&quot;二字取&quot;岁物丰成、与民同乐&quot;之意；琅琊寺（唐代大历六年·771·刺史李幼卿与法琛禅师建·代宗李豫赐名&quot;宝应寺&quot;）：琅琊寺内有摩崖石刻、无梁殿、大雄宝殿；二贤堂（醉翁亭北面·纪念王禹偁、欧阳修）：北宋王禹偁至道元年（995）贬守滁州，宽政爱民、清廉自守；欧阳修感念王禹偁品德，后人建堂纪念二人，欧阳修持书卷像、王禹偁捻胡须像；南岳庙、百步阶、洗心亭、影香亭、古梅亭（醉翁亭九景）：古梅亭前有&quot;欧梅&quot;传欧阳修手栽，花期不抢腊梅、不与春梅争艳；洗心亭始建于清康熙年间；滁河（古称涂水·滁州因水而名）：韦应物建中三年（782）任滁州刺史，写《滁州西涧》&quot;独怜幽草涧边生&quot;。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌醉翁亭景区老导游 老刘（59岁）：&quot;醉翁亭是北宋庆历五年建的，僧智仙为欧阳修建的，天下第一亭。里面有苏轼写的《醉翁亭记》碑——&#x27;欧文苏字&#x27;，一文一字都是大家。清代薛时雨重修的时候，写了对联&#x27;翁去八百载，醉乡犹在；山行六七里，亭影不孤&#x27;，现在还挂在亭子里。&quot;\u003cbr\u003e▌琅琊寺老僧人 释智远（71岁）：&quot;琅琊寺是唐代大历六年建的，代宗皇帝赐名&#x27;宝应寺&#x27;。韦应物写过《滁州西涧》，就是城南那条小涧。王禹偁、欧阳修、宋濂、文征明这些名人都来过。欧阳修在滁州三年，把他最好的散文写在这里了——一篇《醉翁亭记》，天下都知道滁州。&quot;\u003c/p\u003e"}, {"n": "东平州城", "s": "东平", "p": "山东", "w": "龟城·龟头南门望鲁·屁股眼北门井·肚脐桂井子？宋代始建龟形城池，城墙残垣可摸，桂井子还在熬东平粥", "h": "\u003cp class=\"main-text\"\u003e明代纵横各十八条街，现六十多条。这些街巷名现在还在用：。宋咸平三年（1000）始建土城，形如方胜（两个菱形压角相叠），城门东西各二。清乾隆三十四年（1769）知州沈维基以砖易土，西部城墙内缩，西门减为一，龟城变成向前游动姿态——蜷右前爪、扭尾巴。1982年县城迁往新城，旧县城废弃。现状：城墙残垣还能摸出龟城轮廓，长方土台残段长180米宽15米高2米。明代城门（清改砖城后）  现状。龙虎门（大东门）        城门石匾藏州城石刻博物馆。瞻岱门（小东门）        城门石匾藏州城石刻博物馆。望鲁门（南门·龟头）     城门石匾藏东平博物馆（长163cm高65cm厚26cm，1980年代池塘出土）。秩成门（西门）          城门石匾藏州城石刻博物馆。拱极门（北门·龟尾）     城门石匾藏州城石刻博物馆。城墙规格：高7米，底宽7米，顶宽4.3米，上铺两层海漫砖，堞高1.6米。城门楼高3丈，红墙碧瓦画柱重檐，四角挂铃铛。每扇城门81颗饽饽钉（拳头大小九九成列），一尺长圆形大象鼻锁。龟的部位    城上对应。龟头        南门（望鲁门）。龟眼        南门外两口对称水井。龟尾        北门（拱极门），月城门朝西=尾巴摇动。屁股眼儿    北门里边一眼井。肚脐        南门到北门五里长街正中街心井（桂井子）。心脏        州署（中心偏左）。膀胱        署右&quot;8&quot;字形水坑（中间架石桥）。血管经络    五十条街道七十二个胡同。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e桂井子（龟肚脐井）：青石砌垒，井口2米见方厚0.3米整块石凿圆状，井口绳痕32处深0.03米。全州城井水多苦咸，唯此井甘冽；东平粥（徐家粥）：桂井子街徐保明世代经营，自清康熙十九年（1600）至今330年。大豆小米2:1磨浆，马公祠井水熬制，粥浓如酱喝似水，碗底不挂一丝；城墙残垣：汉代东平故城城墙遗存（宿城村西北），长180米宽15米高2米；五块城门石匾：全部出土！望鲁（东平博物馆）、龙虎/瞻岱/秩成/拱极（州城石刻博物馆）；永济桥：明代13孔石桥，现在还是公路桥，开车能过；宋槐：永济桥北端东侧，宋代种的；桂井子街（肚脐井雅称，明代就有）：270户1013人，东平粥发源地；署前街（迎门墙口→南门）：原来商号林立，晋商兴成永、协和永在此；署东街、署西街（州署东西两侧）；大隅首顶（龟盖，地势最高，当铺盐店所在地）；牌坊街、文庙街、大东门街、小隅首、书院街；迎门墙口：州署前照壁留下的地名，原来这里是小广场，吃食摊昼夜繁华；五座城门门楼（高三丈，红墙碧瓦画柱重檐，四角挂铃铛）；铁皮城门（81颗饽饽钉，大象鼻锁）；魁星楼（文昌阁，大东门正南500米城墙上）；北门玄武老爷青铜法身（1938年被掠走）；城内七十二座牌坊；十里宋街（马可·波罗说&quot;万船竞发，舟楫如织&quot;的主街）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e州署大堂、库房、帑藏（宋建，毁于火灾）、护城河（宽一丈深七尺，引汶水，现已填平）。\u003c/p\u003e", "c": ""}, {"n": "肥城老城", "s": "肥城", "p": "山东", "w": "卧虎城·虎口北门·元代大成殿·手能摸元代八根明柱元建卧虎城，城形如卧虎，城门按虎的部位命名。城墙残垣可摸，元代大成殿八根明柱至今立着，齐长城北端38公里还在。", "h": "\u003cp class=\"main-text\"\u003e城内以霸王街（南北大街）为虎脊，关帝庙东墙根一米余赤色菱形石为虎心，城隍庙街中段紫色条石为虎肺。街巷名保留至今。元初始建土城，形如卧虎（南有二隅似虎膝，西北有锯齿缩进似虎腚，北端两侧凹进似虎肷，东北东南两隅凸形似虎爪）。明万历四十六年（1618）改砖城，外砌33层青条石，缝处刀刃不入，号称&quot;玉城&quot;——阳光照耀泛玉石色。清代屡修屡圮，1938年兵燹后城墙残垣仅存东北段。现状：城墙残垣还能摸出卧虎轮廓，元代大成殿完整保存。明代砖城城门  虎口北门  其它门。迎恩门（北）  虎口——门洞低矮，杨姓县官因&quot;羊入虎口&quot;不敢乘轿从北门入城。南门          虎腹。东门          虎左前爪。西门          虎右前爪。城墙规格：周长四里三十步，高三丈，厚两丈七尺。老虎部位    城上对应。虎目        南门外两口大井。虎脊        霸王街（南北大街）。虎心        关帝庙东墙根一米余赤色菱形石。虎肺        城隍庙街中段紫色条石。虎腚        西北缩进部位（锯齿形）。虎尾        北门外沟。虎肷        北端两侧凹进部位。虎膝        东北东南两隅凸形石坝。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e元代大成殿（文庙）：还在！长120米、宽12.4米、高12.2米。明柱八根，每根粗1.86米（两人合抱）。歇山式五脊顶，重椽斗拱。；城墙基址线：老居民叫&quot;城墙根&quot;，一圈土堆还能摸出来，&quot;巧山青石来自巧山，建城后巧山被挖夷为平地&quot;的传说还在传。；北门迎恩桥：明嘉靖年重修，李邦珍出资，尹庭撰文。桥体还在（后来重修过）。；齐长城遗址（北端）：全长38公里，部分尚存，遗址清晰。；北坦遗址（大汶口文化）：1973年出土石器陶器，文化层堆积1-3米。；城墙（33层青条石、缝处刀刃不入、号称&quot;玉城&quot;——阳光照耀泛玉石色）；护城河（宽一丈深五尺，引康河水）；城隍庙（内有能动的城隍像，按下膝盖能站起来）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e七座石牌坊（龙章奕世坊、敕赠坊、柱史坊、飞舄乘骢坊、谏议坊——全毁于兵燹或文革）、衙署（元代始建，毁于元末，后多次重修，1980年南迁后废弃）。\u003c/p\u003e", "c": ""}, {"n": "宁阳老城", "s": "宁阳", "p": "山东", "w": "四街千年不挪窝·泮池72石板·城砖拆去建学校？北齐天保七年（556）始建，文庙是泰安唯一县学，街道格局从明代至今一丝未变，唯独城墙砖全被拆去建了学校。", "h": "\u003cp class=\"main-text\"\u003e古城四街至今位置走向没变，街名沿袭旧称！东西两街贯通，南北两街错开，北街垂直接在西街上。旧县署建在错开十字的东北位置，与东西两街和北街组成一个&quot;上&quot;字——全城最高点。四条街道由内向外成坡，水从中心流向四门，雨过天晴城区干净清新。明代街巷        现状。东街（县署→东门）  东街（还在！，两侧有文庙、宝相寺遗址、天主教堂遗址）。西街（县署→西门）  西街（还在！，两侧有三义庙遗址、吴氏家祠遗址）。南街（县署→南门）  南街（还在！，有徐家巷、宁氏节孝坊遗址）。北街（西街→北门）  北街（还在！，有城隍庙遗址、白衣堂小巷）。东街南→东南隅巷    东南隅（还在！）。东街北→东北巷      东北巷（还在！）。西街南→西南巷      西南巷（还在！）。西街北→西北巷      西北巷（还在！）。南街东→徐家巷      徐家巷（还在！）。北街东→城隍庙小巷  已并入实验中学。北街西→白衣堂小巷  白衣堂小巷（还在！）。北齐天保七年（556），县治从汉宁阳城迁至今址，略呈正方形。北宋始筑土城。明正德六年（1511）被农民义军拆除。明嘉靖九年（1530）外砖内土，周四里五十步，高二丈四尺三寸，顶阔一丈，趾厚二丈。明万历九年（1581）悉易以砖，三十一年改城墙顶水道于内。护城河深八尺阔一丈二尺，蛇眼诸泉四面环绕。1950年代，城墙砖被拆去建学校，护城河填为街道。明代（嘉靖）城门     现状。寅宾门（东门·旧名望泗）  全毁，仅存地名&quot;东门里&quot;。宝成门（西门·旧名临洸）  全毁，仅存地名&quot;西门里&quot;。迎薰门（南门·旧名迎恩）  全毁。拱极门（北门·旧名瞻岳）  全毁，仅存地名&quot;北门里&quot;。原护城河段落    现状。南城壕        → 人民路北沟（还在！人民广场西至世纪城）。东城壕        → 教师河（还在！）。北城壕        → 欣街（建国初填河建成）。西城壕        → 宁阳河（还在！）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宁阳文庙（省级文保）：泰安现存唯一县学文庙！元大德元年（1297）建，占地近4000㎡，棂星门（四柱三门石坊）、泮池泮桥、大成门、大成殿、乡贤祠、名宦祠全在。；泮池泮桥（明嘉靖十九年1540）：桥面七十二块大小不一石板（寓意孔子弟子三千精通六艺者七十二人），桥券&quot;三券三伏&quot;（帝王园林规格）。只有中状元才能走，普通人绕桥而行——所以又叫&quot;状元桥&quot;&quot;青云桥&quot;。；元代关帝庙（省级文保）：尚书路中段，元代始建，占地1800平米。；明代孔子庙（省级文保）：尚书路东段，孔子中都宰治政地（前501年）。；尚书路（神奇一街三教）：东段文庙（儒·孔子）、中段关帝庙（道·关公）、西段宝相寺（释·释迦）——三位圣人相视而望，全国罕见。明代四尚书：吏部尚书吴岳、兵部尚书路迎、户部尚书王杲、工部尚书郭朝宾——&quot;小县不大四尚书&quot;。；县署全套建筑；天主教堂（清光绪二十年1894德国传教士建，今宁阳宾馆址）；城隍庙（今实验中学址）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明代砖城四门（全毁）、护城河（填为街道）、宝相寺（宋代所创，俗称大寺，毁于兵燹）、文庙后明伦堂、敬一亭、尊经阁、文昌阁（全拆）。\u003c/p\u003e", "c": ""}, {"n": "兖州老城", "s": "兖州", "p": "山东", "w": "国内最短古城墙6米·北门外门朝东扭头门·先有石佛寺后有兖州城？古九州之一，明代鲁王城封地，城周14里200步山东数一数二，如今只剩西护城河侧一段6米残墙夹在两民居间——被称为&quot;国内最短古城墙遗址&quot;。", "h": "\u003cp class=\"main-text\"\u003e金代始建土城（由瑕丘古城迁建今址）。元沿用土城。明洪武十八年（1385），朱元璋封第十子朱檀为鲁王，派武定侯郭英扩建：。清康熙三十一年至五十九年（1692-1720）重建兴隆塔（郯城大地震震塌上截）。1960年代后，城墙砖全被拆走——明初14里大城荡然无存。现状：西护城河东侧残留6米残墙（长6米宽1米高4米），夹在两座民居间。明代城门     现状。宗鲁门（东门）  全毁，仅存地名。瞻峄门（南门）  全毁，旧址即今&quot;南门口&quot;。望京门（西门）  全毁，西护城河侧6米残墙在此附近。拱极门（北门·扭头门）  全毁，外门朝东开至今无人能解释。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e兴隆塔（全国重点文保）：隋仁寿二年（602）始建，宋太平兴国七年（982）改砖塔。13层八角楼阁式空芯砖塔，高54米。2008年地宫出土石函、鎏金银棺、金瓶、安葬舍利碑刻等——石函内出鎏金银棺、金瓶、舍利、佛牙。；金口坝（全国重点文保）：古代水利枢纽工程。；兖州府文庙（3路5进·格局完整）：棂星门→大成门→大成殿→明伦堂→尊经阁。；府河（原御河·南护城河）：还在！中御桥/东御桥/西御桥跨河尚存。；聊城东昌古城（作为对比）：同样有扭头门。；向南扩建两华里，新城周长14里200步，高三丈七尺。；外砌青砖，新建带瓮城的东门、南门、西门（各具两道城门）；原地重建北门，外门朝东开——被称为&quot;扭头门&quot;。；建鲁王城：城北中央，东西700米×南北600米=0.42平方公里，前门端礼门、右遵义门、后广智门、左体仁门。；建府学文庙（3路5进）、贡院（文庙东侧，考房200间）。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e石佛寺遗址（城东北豆腐店村北）：隋大业年间（605）建，&quot;先有石佛寺后有兖州城&quot;。陨石从天而降刻成弥勒石佛，旁有圣水井（八角琉璃砖砌井沿·井底有灵石·宋淳化五年刻咒文·天旱求雨取石即雨）。寺毁，遗址、圣水井还能找到。。\u003c/p\u003e", "c": ""}, {"n": "汶上老城", "s": "汶上", "p": "山东", "w": "中都故城·孔子首任宰·宝相寺佛牙舍利·尚书路儒释道一街？孔子首任中都宰（前501年），宝相寺太子灵踪塔1994年地宫出土佛牙舍利震惊佛教界，尚书路一街聚儒释道三位圣人相视而望全国罕见。", "h": "\u003cp class=\"main-text\"\u003e尚书路最独特：一街聚儒释道——东段文庙（儒·孔子）、中段关帝庙（道·关公）、西段宝相寺（释·释迦）。明代四尚书：吏部尚书吴岳、兵部尚书路迎、户部尚书王杲、工部尚书郭朝宾——&quot;小县不大四尚书&quot;。周代封鲁置中都邑（孔子宰前叫&quot;致密城&quot;）。唐天宝元年（742）改称中都县，移治今址。金泰和八年（1208）取&quot;汶水在上&quot;意更名汶上县（汶上之名始此）。明成化至万历十年（1475-1582）筑土城覆砖石，周长6.3公里方形。四门：北门望岳、东门醉白、南门观河、西门怀冉，外筑月城（瓮城）。民国二十七年，寺遭炮轰夷为平地，塔身受创。现状：城门全毁。东、北两面遗有土筑残垣还能摸出轮廓。宝相寺已重建，太子灵踪塔保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宝相寺（国家4A级）：北魏始建原名昭空寺，宋真宗封禅泰山御赐改宝相寺，&quot;北朝最初名胜，东土第一道场&quot;。；太子灵踪塔（宝相寺塔）：北宋熙宁六年（1073）至政和二年（1112）建，仿开封开宝寺灵感塔。八角13层，高45.5米，底层莲花座。1994年修葺时意外发现地宫入口，出土金棺、银椁、佛牙、九百余颗佛舍利等141件——数量最大的佛舍利发掘。；汶上文庙（省级文保）：始建不晚于唐玄宗开元十三年，占地20000平米。孔子首任中都宰治政地（前501年），&quot;路不拾遗夜不闭户&quot;。；汶上关帝庙（省级文保）：元代始建，占地1800平米。。\u003c/p\u003e", "c": ""}, {"n": "滕州老城", "s": "滕州", "p": "山东", "w": "三国五邑·滕国故城文公台·孟子仁政实验田·龙泉塔滕州是古九州青州下辖的&quot;三国五邑&quot;之地，滕、薛、邾三国连城相望。滕国故城是中国历史上孟子&quot;仁政&quot;思想唯一的实地实验田，文公台上滕文公庙前的唐代古槐至今葱郁；而薛国故城那高8到10米、周长28里的夯土城垣，则是孟尝君当年食客三千的豪迈余韵。", "h": "\u003cp class=\"main-text\"\u003e滕国故城（省级文保）在县城西南十四里的姜屯镇滕城村一带。周武王灭商后封其异母弟叔绣于滕，滕国传三十一世、享国七百年有余，到了战国，滕文公礼聘孟子入滕推行仁政，故城便是那场&quot;仁政实验&quot;的唯一现场。内城至今保存，东北隅的文公古台隆起成一座土台，台上立滕文公庙，庙前那棵唐代古槐枝繁叶茂。薛国故城（全国重点文保）横跨张汪镇与官桥镇之间，战国时齐国灭薛，孟尝君受封于此，城周二十八里、内城七里，夯土城墙如今仍高八到十米、清晰可辨，站在墙下仍能想见当年&quot;宾客三千&quot;的排场。滕州城内的龙泉塔是明代万历年间的建筑，八角九层、高四十三米，民间传说塔顶供奉舍利，早已成为滕州的地标。此外，宋元丰元年范纯粹任滕县知县时，苏轼自徐州来滕视察，撰《滕县公堂记》勒石记事，明万历重刻的碑石仍存，字里行间还能读到这位文豪对滕县吏治的期许。唐元和十二年（817），滕县治所从故蕃城东移二里，取原黄山岭的黄土夯筑起一座方城，这便是今日滕州老城区的雏形，宋、金、元各代沿用，旧时仅有土城。到明洪武二年（1369）才始建砖城，万历年间重修加固。城墙以内，历代官署、文庙、鼓楼次第铺陈，护城河畔遍植荷花，池莲四面成为滕文人吟咏的景致。至于更早的那座滕国故城，其内城至今残存着土筑的城墙遗迹，文公台隆起于东北隅，历两千年而不没。&quot;老辈人讲，咱这村底下就是古滕国的城，文公台上那棵老槐树，我爷爷小时候就在底下乘凉，说唐僧取经都未必有它岁数大。每年清朗，四边姓滕、姓薛的都回来认祖，站台上往南一指——那一片全是薛国的地界。&quot;。&quot;教书那会儿我爱给学生讲滕文公，说孟子在别处都碰壁，独独在咱这地方把&#x27;仁政&#x27;真推行开了，这就是孟子的实验田。龙泉塔底下有一圈浮雕，老人说是镇塔的，我打小看着它，拆了重建好几回，塔心还是老的。&quot;。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌滕城村文保员 郑大爷（67岁）：\u003cbr\u003e▌滕州退休老师 颜老师（70岁）：\u003c/p\u003e"}, {"n": "枣庄台儿庄老城", "s": "台儿庄", "p": "山东", "w": "运河活化石·天下第一庄·8种建筑风格·53处兵燹遗址明万历年间京杭运河改道流经崛起为水旱码头，清乾隆御赐&quot;天下第一庄&quot;。与波兰华沙同属世界上仅有的两座因二战兵燹毁坏而重建的城市。", "h": "\u003cp class=\"main-text\"\u003e肇始于秦汉，发展于唐宋。明万历三十八年（1610），京杭大运河改道流经，迅速崛起为鲁南水陆通衢。清咸丰七年（1857）加固城墙：东西5华里×南北3华里，城门六座，水门一座（水上通道与运河主航道连通）。清乾隆年间最盛：&quot;商贾迤逦，一河渔火，歌声十里，夜不罢市&quot;——乾隆御笔钦赐&quot;天下第一庄&quot;。1938年春，兵燹毁灭古城，化为废墟。战后居民自发在故居残存墙基上重建家园。2008年枣庄市委市政府启动重建，遵循&quot;留古、复古、扬古、用古&quot;原则。现状：重建后2平方公里，3千米古运河道（月河），18个汪塘，15千米水街水巷，53处兵燹遗址保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古运河月河段（世界文化遗产）：3千米月牙形老运河河道，1959年大运河主航道改道城外留存。11座古码头、960米古驳岸，被誉为&quot;活着的古运河&quot;——京杭大运河中唯一完全东西流向的一段。；53处兵燹遗址：按&quot;留古&quot;原则完整保存，大战遗址公园内房屋上方布满密密麻麻弹孔。；明代水门遗址：运河主航道→城内水街水巷的水上闸门，现在恢复通航。；八种建筑风格齐聚：北方大院、徽派白墙、闽南建筑、欧式建筑、岭南建筑、鲁南民居、宗教建筑、水乡建筑——&quot;中国民居建筑博物馆&quot;。。\u003c/p\u003e", "c": ""}, {"n": "聊城东昌古城", "s": "聊城", "p": "山东", "w": "中华水上古城·凤凰城扭头门·光岳楼乾隆御题黄河以北罕见的水上府城，城中有水水中有城。以光岳楼为中心十字主街，九大街十八巷道七十二胡同。", "h": "\u003cp class=\"main-text\"\u003e（古镇·运河活码头）。北宋熙宁三年（1070）筑土城。明洪武五年（1372）改筑砖城，周长3.5千米（七里余），高11.7米。南东西瓮城为扭头门——南门东向似凤头、东西门南向似凤翅、北门北向似凤尾，故名&quot;凤凰城&quot;，能陷不失。明洪武七年（1374）建光岳楼（城中心更鼓楼），高33米。永乐九年（1411）会通河疏通，聊城成运河九大商埠之一，&quot;漕挽之咽喉，天都之肘腋&quot;，&quot;江北一都会&quot;——漕运繁荣400年。清乾隆御题光岳楼&quot;天下第一楼&quot;，康熙帝四次驾临，乾隆帝九次驻跸。1947年城墙城楼全部拆除。现状：城墙墙基还在（辟为环城路），护城堤残留2公里（城南龙湾至南堤口）。古城区1.17平方公里，被6.3平方公里东昌湖环抱。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e光岳楼（全国重点文保·&quot;天下第一楼&quot;）：明洪武七年（1374）建，4重檐歇山十字脊木构高33米，宋元向明清过渡典范。；山陕会馆（全国重点文保）：东关古运河西岸，清乾隆八年（1743）山陕商人集资建历时66年，聊城八大会馆唯一完整。；海源阁（清代四大藏书楼）：光岳楼南侧杨氏宅院，清道光二十年（1840）杨以增始建。鼎盛藏书4000余种22万余卷。；运河古码头：东关大码头，明清最繁华——&quot;金太平银双街铁打的小东关&quot;。。\u003c/p\u003e", "c": ""}, {"n": "枣庄山亭翼云石头部落", "s": "翼云石头部落", "p": "山东", "w": "600年石头村·响石巷·石磨磨辣椒藏在翼云山褶子里，600年全石头村，响石巷踩上去咚咚响。", "h": "\u003cp class=\"main-text\"\u003e（淮安古城补充）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e石屋顺着山势铺开，墙是青石垒的路是石板铺的，连屋檐下的晒粮架都是石条搭的。600年，不用泥粘干垒就稳。；响石巷：踩在石板路上会&quot;咚咚&quot;响，底下是空的，以前藏粮食防土匪。；石磨盘在院角转了几百年，磨齿间还嵌着玉米面的黄。；后山石阶是石头凿的，每级都有浅浅的凹痕——那是挑水的扁担磨的。。\u003c/p\u003e", "c": ""}, {"n": "青州明府城", "s": "青州", "p": "山东", "w": "六城叠压·1605年省会史·真教寺元代三大清真寺·偶园冯家花园大禹划九州之青州，古青齐文化中心。先后建过六座古城（广县城→广固城→东阳城→南阳城→东关圩子城→满族旗城），明洪武九年前一直是山东省会。真教寺是元代三大伊斯兰教寺之一，偶园是北方少见的江南园林。", "h": "\u003cp class=\"main-text\"\u003e城名          年代          位置          现状。广县城        西汉(前204)    城西4里瀑水涧  遗址尚存（市级文保）。广固城        西晋永嘉五年(311)  邵庄镇窑头村  山东唯一南燕国都遗址·拐尺形30万㎡。东阳城        东晋义熙六年后  南阳河北岸    遗址尚存。南阳城（主体）  北魏孝明帝始筑  南阳河南岸    1986年修复60米残墙。东关圩子城    明代          东关回族区    昭德街明清街区完整。满族旗城      清雍正八年    城北          残存格局。南阳城（主体）：明洪武三年（1370）改建砖城，城高12米厚6米，垛口1777个。四门：海晏（东）、阜财（南）、岱宗（西）、瞻辰（北）。清代多次重修。1972年修南环路拆南城墙。2017年国家5A级景区（免费）。明代南阳城城门  现状。海晏门（东）    全毁（1972年因修路拆）。阜财门（南）    重建（2013年，古城地标）。岱宗门（西）    全毁。瞻辰门（北）    全毁。青州作为山东政治经济文化中心达1400多年（前106年→1376年朱元璋移治济南）。省会史1605年。&quot;海岱惟青州&quot;——渤海和泰山之间。&quot;2230年建城史·12年国都史（南燕慕容德·山东唯一称帝者）·1605年省会史&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e真教寺（国保·元代三大清真寺之一）：元大德六年（1302）元相伯颜后裔立，元代封官寺。明朱元璋题&quot;百字赞&quot;碑。熔阿拉伯与中国建筑艺术于一炉。；偶园（北方少见江南园林·500年）：原为衡王府东花园，清康熙文华殿大学士冯溥告老还乡后以之为终老之所。假山分坪、峰、涧、台四组主题。；海岱都会坊：四柱三门，高9.4米宽14.4米。；万年桥（南阳城北门外）。；衡王府石坊（明代衡王府遗存）。；青州博物馆：全国县级博物馆唯一国家一级馆，有西汉广国跽坐石俑、明代状元卷、北齐壁画墓。；东门大街（始建北魏）：后司巷（金代设山东东西路统军司）、卫里巷（明初山东都指挥使司所在地）。；偶园大街（主干道核心）：青石板路，牌坊林立——柱国坊、大学士坊、一门科第坊（万历冯氏家族）。；昭德街（东关回族区）：真教寺就在这条街上。；青州贡院：曾是山东布政司衙门。；南阳城大部分城墙（仅存1986年修复60米）；东阳城、广县城、广固城全部城墙；衡王府全套建筑（仅存石坊）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《尚书·禹贡》：\u003cbr\u003e▌青州导游词：\u003c/p\u003e"}, {"n": "临清老城", "s": "临清", "p": "山东", "w": "钞关帝国财源·临清贡砖修北京皇城·鳌头矶像鳌头明清运河八大钞关之首，万历年间年税收8.3万两占全国四分之一——山东省全年税收才8860两。临清砖&quot;击之有声断之无孔不碱不蚀&quot;，修北京皇宫、十三陵、清东陵西陵全用它。先有临清仓后有临清城。", "h": "\u003cp class=\"main-text\"\u003e元代开通会通河，临清成汶卫交汇枢纽。明宣德四年（1429）设临清钞关——全国最早的运河钞关之一。明万历年间鼎盛：年收船料商税8.3万两（全国八大钞关之首，占全国四分之一）。彼时山东省一年课税折银仅8860两。清光绪二十七年（1901）运河漕运停止，钞关署治遂废。现状：临清运河钞关是全国仅存的一处运河钞关（世界文保+国保）。中洲古城160余条明清老街巷格局依旧。明代钞关税收  数字  对比。中前期年税    4万两    —。万历年间年税  8.3万两  占全国运河钞关1/4。同年山东全省税  8860两   仅临清钞关1/10稍强。运河漕运输京  75%      临清仓年储粮300万石。&quot;十里人家两岸分，层楼高栋入青云。官船贾舶纷纷过，击鼓鸣锣处处闻。&quot;。&quot;先有临清仓，后有临清城&quot;——临清仓年储粮300万石，输京漕运占四分之三，戍仓士兵3000人。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临清运河钞关（全国唯一·世界文保·国保）：明宣德四年（1429）始建，宣德十年升户部榷税分司。建筑群自运河而西依次为河口正关→阅货厅→&quot;国计民生&quot;坊→关堞→仪门→正堂。三进院落占地4万㎡，厅堂坊舍400余间。现存两进院落80余间6000㎡。；鳌头矶（国保·世界文保）：永乐十五年（1417）始建，会通河与通惠河交汇处石坝形似鳌头——两支运河四处河闸像鳌的两对足，广济桥像鳌尾。观音阁砖砌基座高5米9米见方下辟门洞。古砖陈列室收明清临清贡砖（成化至康熙年间）。；舍利宝塔（国保·运河四大名塔）：万历三十九年（1611）重修，高61米九级八面砖木楼阁式，每层&quot;四明四暗四真四假&quot;，通体近乎垂直。第6层最精致，有&quot;秀聚中天&quot;匾额。；临清贡砖（非遗·击之有声断之无孔不碱不蚀）：明清修北京皇宫、紫禁城墙、明十三陵、清东陵西陵绝大部分用临清砖。河隈张庄明清砖窑遗址（国保）。；月径桥（国保·清顺治九年1642徽商邵以枢捐资建）：单孔拱径4.6米。；临清闸（国保·元至元三十年1293建）：会通河入卫河端始船闸。；明代砖城城墙；钞关部分建筑（仅存两进院落）；运河漕运盛况（粮艘麋集帆樯如林）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代大学士李东阳（过临清）：\u003cbr\u003e▌临清当地谚语：\u003c/p\u003e"}, {"n": "济宁老府城", "s": "济宁", "p": "山东", "w": "太白楼移建南城墙·竹竿巷运河江南水乡·南池杜甫游处唐代李白客居任城23年，贺兰氏酒楼因他而易名太白酒楼。明洪武二十四年将楼移筑于南城墙之上——谪仙已逝何需俗醪相佐。竹竿巷是运河滋养的江南水乡风味街巷，鼎盛时江南竹筏在此上岸。", "h": "\u003cp class=\"main-text\"\u003e唐：任城县城，南北二里东西三里，长方形，单城门。南门即今南门。金天德二年（1150）济州迁治任城。元建济州城，土城。明洪武三年（1370）济宁左卫指挥使狄崇重建易以砖，周九里三十步，大体正方形，四门均双城门（城门+月城门）。四门匾题：南门宣阜门&quot;野入青徐&quot;、北门宗翰门&quot;云连海岱&quot;、东门绥华门&quot;邹鲁接壤&quot;、西门萃成门&quot;获麟古道&quot;。还有外城土圩、外圩门、外濠。现状：明清砖城全毁，太白楼建在仅存的南城墙之上（重建后还在原址）。竹竿巷、清平巷街巷格局保留。&quot;周九里三十步，大体正方形，四门均系双城门，城上有城楼、炮台、女墙、垛口，下有护城河，四门外各有吊桥。&quot;。&quot;我家祖上就在这剖竹编筐，运河没水的年头还能靠手艺活，水来了就泊船卸货，日子就这么晃过去了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e太白楼（国保）：唐贺兰氏酒楼，因李白改名太白酒楼。明洪武二十四年移筑于三丈八尺高的南城墙之上，剔去&quot;酒&quot;字仅留&quot;太白&quot;二字符——谪仙已逝何需俗醪相佐。现存明清建筑，坐北朝南十间两层重檐歇山砖木结构，高20余米。楼内一层设&quot;诗仙太白、诗韵齐鲁&quot;专题展，二层有&quot;诗酒英豪&quot;石匾、李白手书&quot;壮观&quot;斗字方碑、乾隆御笔《登太白楼》诗碑。；竹竿巷历史文化街区（0.26平方公里）：运河江南水乡风格，老篾匠弓身剖竹，明清时&quot;货栈鳞次人声鼎沸&quot;。与纸坊街、纸店街、小闸瓮城、清平巷五条街巷曲尺相连。；顺河东大寺（AAA级）：运河边，济宁回族聚居地核心。；南池公园（济宁八景之一）：古称王母阁湖，杜甫有诗&quot;秋水通沟洫，城隅进小船&quot;。；铁塔寺：济宁老地标。；明代砖城四门（宣阜/宗翰/绥华/萃成，均双城门）；外城土圩、外圩门、外濠。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《济宁府志》（明万历）：\u003cbr\u003e▌济宁老篾匠（世代居竹竿巷）：\u003c/p\u003e"}, {"n": "邹城老县城", "s": "邹城", "p": "山东", "w": "亚圣故里·孟母三迁·明代16座牌坊全毁·鱼骨型街巷孟子故里，孟母三迁择邻、断织喻学的故事发源地。明代县城立了16座牌坊（攀桂坊、进士坊、青云坊、登云坊、世科坊、双桂坊、澄清坊、宣化坊、城隍坊、亚圣坊……），凡考取举人者皆立坊表彰——把学业推举到至高无上的境地。", "h": "\u003cp class=\"main-text\"\u003e明初土城。明正德元年（1506）重筑。明万历五年（1577）知县冯中州改砌砖城，耗银1000两谷900石。方形，周长4里80步（945丈），高1丈6尺5寸，垛口1528个。四门：瞻岳（东）、近鲁（北）、襟济（西）、崇教（南）。城外护城河深1丈宽7尺，引因利渠水注入，四门石桥横跨。明末天启二年（1622）白莲教起义，部分城墙被拆。清顺治五年（1648）修复，改城垛为375个。清康熙七年（1688）地震，西南城墙坍塌。1950年左右，古城墙最终拆除。现状：城墙全毁。亚圣庙街历史文化街区（鱼骨型格局）、孟母断机处遗址、孟庙孟府完整保存。&quot;地方二百余里，纵广七十里，横一百五十里，东南至滕，西至鲁齐，北抵泗岱。&quot;。&quot;孟子辍然中止，乃复进。其母引刀裂其织，曰：此织断能复续乎？&quot;——孟母剪断正在织的整匹锦缎，教育孟子半途废学就像剪断的织锦再难续接。&quot;老照片里三迁牌坊还在，旁边两通石碑、三孔因利桥。我妈说她小时候还在牌坊下留过影，现在只剩石碑了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e孟庙（亚圣庙·国保）：北宋宣和三年（1121）始建，现存为明清建筑。有亚圣殿、启圣殿、孟母殿、致严堂、祧主祠、东西庑、知言门、养气门，57株古树（侧柏、桧柏、国槐，树龄多在800年以上）。；孟府（国保）：孟子嫡裔世袭&quot;翰林院五经博士&quot;居所，前后七进院落，有亚圣木坊、大堂、世恩堂、赐书楼、见山堂、孟林门坊。；孟母断机处遗址（省保）：明代立&quot;孟母断机处&quot;&quot;子思子作中庸处&quot;两通石碑，三迁故址牌坊。清末老照片里牌坊静静矗立，现在还在。；亚圣庙街历史文化街区：鱼骨型街巷格局（主街为骨架两侧巷道枝状延伸），有亚圣街、过街棚街、塘子街、东马道、西马道、人祖庙街、井胡同、杜家胡同、小寺街、韩家胡同、武学胡同。；明代砖城四门（瞻岳/近鲁/襟济/崇教）；县衙全套建筑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明代16座牌坊全毁——三迁坊（城南门外孟母三迁）、断机堂（孟母断织）、攀桂坊（举人冯瑾）、进士坊（冯瑾次年进士）、青云坊、登云坊、世科坊、双桂坊（兄弟同中举）、澄清坊（县署）、宣化坊（县署）、城隍坊、亚圣坊（南门外孟庙界首）——每一座牌坊都是一段&quot;读书立世&quot;的宣言。、护城河（填为街道）、明代16座牌坊（全毁）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代嘉靖《邹县地理志》：\u003cbr\u003e▌《孟母戒子》（西汉韩婴）：\u003cbr\u003e▌邹城老居民：\u003c/p\u003e"}, {"n": "菏泽老府城·曹州", "s": "菏泽", "p": "山东", "w": "七十二街七十二井·七纵七横棋盘·城内叠压五代古城·外圆内方铜钱城明正统十一年（1446）知州范希正始建，七纵七横棋盘格局至今完好。明清形成&quot;七十二条街七十二眼井七十二个坑塘&quot;古城肌理。老城区地下8米叠压宋金元明清五代古城——金元时期主干道和今天的广福大街、东方红大街完全重合，800年未变。", "h": "\u003cp class=\"main-text\"\u003e明清棋盘格局完整保留至今：。七纵（自西而东）    现状。清真寺街            还在！水洼街              还在！广福街              还在！南华街              还在！光复街（原南北大街）  还在！双井街              还在！东顺城街            还在！七横（自北而南）    现状。北顺城街            还在！八一街              还在！道碑街              还在！东方红大街（明东西轴） 还在！考棚街（后改曹州路）  还在！石人街              还在！南顺城街            还在！交叉点叫&quot;隅首&quot;，共23个（钟楼隅首、鼓楼隅首、石碑隅首、石人隅首、铁货隅首、油坊隅首、潘隅首、宋隅首……）——以隅首为界，街分数段各段长短大体相等，通名叫巷（全国独有）。明正统十一年（1446）原曹县知县范希正迁任曹州知州，利用旧州址始筑城池。至明正德七年（1512）告成，历时66年。城周12华里，城墙高2.5丈，堞高5尺，趾宽3丈，池深1.5丈广4丈。四门：东&quot;双河&quot;、西&quot;凤山&quot;、南&quot;南华&quot;、北&quot;济阴&quot;。城门额嵌石为匾，上设城楼（东&quot;青波旭日&quot;、南&quot;风入虞弦&quot;、西&quot;凤台霜晓&quot;、北&quot;云里蓬莱&quot;）。外圆内方铜钱形制——方形城墙圆形护城河。清乾隆三十二年（1767）改土墙为砖墙，周长1872丈，设炮台26座、水簸箕84道、门楼4座、垛口3134堵。1938-1948年十年间两次重修三次拆除。1960年代初城墙遗址上植树，现已成林。现状：城墙全毁，七纵七横棋盘格局完好，东方红大街（明清东西中轴线）是老菏泽人叫的&quot;菏泽第一街&quot;。&quot;七纵七横，相互交叉，状若棋盘。交叉点称隅首，共23个。以隅首为界，街分数段，各段长短大体相等，通名叫巷。&quot;——这种街巷分段命名法全国独有。&quot;我家就在考棚街边上，爷爷说他小时候听老人讲——地下还有一层城，老早战乱黄河决口淹的。后来挖地基挖出宋金元的砖头瓦块，才知是真的。&quot;。&quot;七十二条街，七十二眼井，七十二个牌坊，七十二个坑，七十二地煞藏其中。&quot;——72是吉利数，应地煞星驱魔禳灾护祐百姓。（已固化18座旧县城+6古镇·待下一批扩充）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老城地下五代古城叠压：宋、金、元、明、清叠压8米深。金元时期主干道和今天的广福大街、东方红大街完全重合，800年未变。；七十二井（部分复原）：明清曹州城水质甘醇的七十二个水井，藏在老街深处。；青年湖（原七十二坑塘之一）：2025年修整为城市滨湖公园，五拱环洞泰宁桥。；1446街区（老城曹州文旅区）：2022年开放，以范希正建城之年命名。海棠寺街、民权街、太平街、慎思园（范希正纪念园）、永安塔（七层八角四门56米高）。；曹州牡丹园：曹州牡丹始于隋盛于唐甲天下于明，现有1200余种。；明正统八年郭氏牌坊（东方红大街中段，1958年老档案照片存）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明代砖城城墙+四门城楼（全毁）、七十二座牌坊（全毁）、钟鼓楼（1950年代拆除）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《菏泽市志·城垣变化》：\u003cbr\u003e▌菏泽老居民（世代居曹州路）：\u003cbr\u003e▌菏泽歌谣（世代口传）：\u003c/p\u003e"}, {"n": "郯城老县城·碌碡城", "s": "郯城", "p": "山东", "w": "元末碌碡排垫筑城·郯国故城·少昊鸟名官·马陵之战元末沂州守御王信在郯城筑城时，正值隆冬天寒地冻采石困难，为抢工期从民间大量征用碌碡（石磙）排垫城墙基，&quot;累土而立&quot;版筑而成——所以郯城古城又叫&quot;碌碡城&quot;。郯国故城是西周至战国郯国都城，少昊后裔以鸟名官的史实发生地。", "h": "\u003cp class=\"main-text\"\u003e元末沂州守御王信在郯城河（今郯子湖）以南筑新城，用碌碡排垫墙基，累土版筑——所以叫&quot;碌碡城&quot;。周五里八十步，高二丈二尺，厚八尺。设三门（郯城自古无东门）：南通淮、西瞻鲁、北拱极。明正德五年知县黄琮修北门建楼。嘉靖二十一年修南门西门建楼。万历二十三年（1595）始甃以砖（第一次外包砖）。清康熙七年（1668）郯城8.5级大地震，城墙垛堞都轰然坍塌。1958年拆城墙时挖出大批砌排整齐的碌碡——每个长69cm直径51cm，青石红石有辋无辋皆有（实物现存郯城一中老城墙边）。现状：郯国故城遗址（国保·周代）西墙北墙局部保存，残墙高4米。元明清碌碡城城墙全毁。城门     现状。南门（通淮）  全毁。西门（瞻鲁）  全毁。北门（拱极）  全毁。东门          郯城自古无东门！&quot;元守御王信筑城，时值隆冬，大量征用碌碡排垫墙基，累土版筑，故又称碌碡城。&quot;。&quot;我亲眼看见挖出来的碌碡——砌得整整齐齐，像一排一排的圆石头柱子，每个都有半人高，青石的红石头都有。&quot;。&quot;郯子来朝，公与之宴。昭子问焉，曰：&#x27;少昊氏鸟名官，何故也？&#x27;郯子曰：&#x27;吾祖也，我知之。&#x27;&quot;——前525年郯子到鲁国朝见，讲述少昊氏以鸟名官的历史，孔子闻之特意见郯子而学之。（T3批次6城已固化·累计24座旧县城+6古镇）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e郯国故城遗址（国保·西周至战国）：西周郯国都城，少昊后裔以鸟为图腾。城址在今县城北侧100米，与今城仅隔一条护城河。西墙北墙局部保存，墙基宽40米顶宽15米残墙高4米，周长4670米。《左传·昭公十七年》（前525）记载郯子朝鲁，孔子&quot;见于郯子而学之&quot;——少昊氏鸟名官典故发生地。；马陵古战场（国保）：马陵之战发生地，战国齐魏马陵之战（前342）。；唐代于公墓、东海孝妇冢。；明代县衙（部分建筑残存）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《乾隆郯城县志》：\u003cbr\u003e▌郯城一中老教师（1958年亲历拆城）：\u003cbr\u003e▌《左传·昭公十七年》：\u003c/p\u003e"}, {"n": "蒙阴老县城·蒙恬故里", "s": "蒙阴", "p": "山东", "w": "秦将蒙恬发族地·汉蒙城晋蒙城双遗址·蒙山鬼谷子讲堂蒙恬故里经县史志办实地考证确认为蒙阴县联城镇边家城子村（汉蒙城旧址），蒙氏祖谱记载&quot;始祖蒙山公封东蒙主安居蒙阴县，此地为蒙氏发祥圣地&quot;。蒙阴有汉蒙城+晋蒙城双遗址，汉蒙城遗址还能摸到四角大土堆城墙。", "h": "\u003cp class=\"main-text\"\u003e西汉初置蒙阴县（前205年），县治置于联城镇城子村一带（汉蒙城）。西晋公家城子村（晋蒙城），城址四角有四个大土堆，城墙和护城河沟清晰可见。明洪武三十年（1397）百户龙胜重修县城，石城周围一里零二百步，连雉口高一丈六尺。三座城门：东望海、西瞻岱、南文昌。1947年蒙阴遭强烈地震，城垣倒塌。1950年代城墙拆除。现状：汉蒙城遗址（边家城子村，角堆尚存），晋蒙城遗址（公家城子村），蒙恬故里联城镇。&quot;蒙阴故城，在县西南十五里，汉县，属泰山郡。&quot;。&quot;始祖蒙山公，周成王在位时，封蒙山公为东蒙主，安居蒙阴县，此地为蒙氏发祥圣地也。&quot;。&quot;蒙恬故里可断定在距蒙阴县城西南7.5公里处的边家城子村东北约一公里的汉蒙阴县城旧址上——颛臾王庙即蒙氏宗祠，千年黄连木树龄与周成王封颛臾时间吻合。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e汉蒙城遗址·蒙恬故里（联城镇边家城子村东北）：西汉初置蒙阴县治所，考古发现众多古砖瓦和大段墙基。颛臾庙（明永乐二年1404年建，实为蒙氏宗祠，颛臾王葬于蒙阴守墓祭祀）。千年黄连木树（三人合抱粗）仍存。；晋蒙城遗址（公家城子村）：四角四个大土堆（城墙残段），护城河沟清晰可见。；蒙山国家森林公园（5A·亚岱）：主峰海拔1156米山东第二高峰，孔子曾登蒙山望鲁。鬼谷子讲堂遗址（云蒙峰下峪子里），传说孙膑庞涓苏秦张仪在此学艺。；蒙恬造笔传说：蒙恬始作笔，鹿毫竹管，毛笔之父。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《沂州府志》：\u003cbr\u003e▌蒙氏祖谱：\u003cbr\u003e▌蒙阴县史志办考证（2018）：\u003c/p\u003e"}, {"n": "兰陵古城·兰陵镇", "s": "兰陵", "p": "山东", "w": "荀子两任兰陵令·兰陵美酒3000年·兰陵王高长恭封地山东境内最早设立的县治单位（近2400年历史）。荀子两任兰陵令18年，辞官后定居终老于此——培养出李斯韩非浮丘伯，史学家刘向说&quot;兰陵多学盖以荀卿也&quot;。兰陵美酒3000年，1995年徐州狮子山楚王墓出土沉埋2148年的兰陵贡酒——泥封印有&quot;兰陵贡酒&quot;&quot;兰陵之印&quot;戳记，打开封泥后酒香溢出，令考古专家惊叹。", "h": "\u003cp class=\"main-text\"\u003e西周周公兼治七十二国，在兰陵筑土城，大块红石做地基夯土做墙，&quot;土围子&quot;。北齐兰陵王高长恭封地在兰陵，下令扩建城池——新城围城总长12华里，东西2.5华里南北3.5华里长方形。兰陵王府在土围墙北门外300米，门正对土围子北门。唐盛世年间酒业兴起，扩建外城（楚币晒金滩遗址在温岭南头）。1917-1920年民国年间在内城墙原址用土修复——垫一层碌碡压一层，用了三年。1950年代城墙大部拆除。现状：内城遗址东西宽885米×南北长1980米=175万㎡，墙基宽约30米，南部残存几米残墙。荀子墓在兰陵镇东南1.5公里（省保）。&quot;兰陵美酒郁金香，玉碗盛来琥珀光。但使主人能醉客，不知何处是他乡。&quot;——千古绝句，对兰陵美酒从色香味情进行综合鉴赏。据专家考证为兰陵人——兰陵千年古镇、兰陵美酒、荀子文化、《金瓶梅》文化四大品牌世界闻名。&quot;兰陵美酒陶制球形缸沉埋2148年，泥封上印有&#x27;兰陵贡酒&#x27;&#x27;兰陵之印&#x27;戳记——打开后一股浓郁酒香溢出，令在场考古专家惊叹不已。&quot;。（T4批次6城已固化·累计30座旧县城+6古镇·v8 行数字符待追加验证）。古今叠影稿（v8·30座旧县城+6古镇）完。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e荀子墓（省保）：黄土堆积，东西30米南北20米封土高3米。1966-1976年间遭破坏墓冢挖深呈M状，1977年立省保标志碑。；兰陵古城墙残段（兰陵镇）：墙基宽30米，南部残存几米残墙。；兰陵美酒：1995年徐州狮子山楚王墓出土沉埋2148年的兰陵贡酒（泥封印&quot;兰陵贡酒&quot;戳记），经鉴定与今日兰陵美酒同为一宗。北魏贾思勰《齐民要术》载兰陵美酒酿造工艺，唐时宫廷御用。1915年巴拿马国际博览会获金牌。；四城门匾额（北齐兰陵王所建城门）：东门&quot;东海镜清&quot;、西门&quot;逵达邹鲁&quot;、南门&quot;衢通徐淮&quot;、北门&quot;文峰映秀&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李白（唐开元二十八年）：\u003cbr\u003e▌《金瓶梅》作者兰陵笑笑生：\u003cbr\u003e▌徐州狮子山楚王墓考古队（1995年）：\u003c/p\u003e"}, {"n": "定陶老县城·陶丘", "s": "定陶", "p": "山东", "w": "天下之中商圣范蠡·刘邦登基氾水之阳·黄肠题凑260万字司马迁说&quot;陶天下之中，诸侯四通，货物所交易也&quot;——范蠡助勾践灭吴后辗转到此定居，十九年间三致千金，被后世尊为商圣。刘邦公元前202年在这里登基称帝（氾水之阳·官堌堆）——大汉王朝四百年从此开始。定陶王陵M2汉墓是迄今出土单体墓葬文字量最大的——黄肠题凑墓室1800方柏木+37000块文字陶砖，出土墨书、朱书、刻印、戳印文字逾260万字，堪比一座汉代图书馆。", "h": "\u003cp class=\"main-text\"\u003e尧舜以陶丘为都（陶唐氏）。西周初年周武王封其弟振铎为曹伯，建曹国，都陶丘，历26君558年。春秋宋灭曹，设陶郡，治陶城。秦始置定陶县（前221）。自春秋末至西汉400多年，定陶一直是中原水陆交通中心和商贸都会，享有&quot;天下之中&quot;美誉。元文宗至顺二年（1331）黄水淹没定陶故城。明洪武四年（1371）迁县城于今址。现状：官堌堆（刘邦登基处）、定陶王陵、仿山曹国古墓群、范蠡墓等遗存尚存，老县城明清街巷格局依稀可辨。明代迁城后城门  现状。东门        全毁。南门        全毁。西门        全毁。北门        全毁。官堌堆遗址  尚存（高近9米）。&quot;朱公以为陶天下之中，诸侯四通，货物所交易也。乃治产积居，与时逐而不责于人。故善治生者，能择人而任时。十九年之中三致千金，再分散与贫交疏昆弟。&quot;。&quot;官堌堆在城西北十里许，汉高帝即位于氾水之阳即此，高阜犹存，今名官堌堆。&quot;。&quot;260万字——你想象一下，一座墓里埋了一座图书馆。黄肠木上的墨书是工匠写的&#x27;某年某月某日造&#x27;，陶砖上有的写着产地&#x27;济阴郡定陶县昌邑乡&#x27;，比史书还准。&quot;。&quot;每天都有全国各地姓曹的来上香——我守了40年，见过最远的是马来西亚来的。都说来认祖，说&#x27;天下曹姓从定陶来&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e官堌堆（受命坛·刘邦登基处·省保）：仿山镇姜楼村西南800米商周堌堆遗址，高近9米。《史记·高祖本纪》载&quot;甲午，乃即皇帝位氾水之阳&quot;即此。定陶县政府立&quot;大汉之源&quot;石碑。；定陶王陵M2汉墓（世界最大黄肠题凑·国保）：发掘于马集镇，墓室木质构件1800方（柏木黄心），榫卯扣合。墓室四周文字陶砖37000余块，铺底砖43000余块。出土黄肠木及陶砖上墨书、朱书、刻印、戳印文字逾260万字——单体墓葬出土文字之最，汉代书法史新资料。；仿山古墓群（省级·曹国25代国君墓）：仿山镇，曹国肇建之君曹叔振铎到末代国君共25君墓在此。&quot;天下曹姓出于陶&quot;——很多曹姓人来此拜祖。；范蠡墓（陶朱公墓）：定陶镇西北，《史记·货殖列传》载范蠡&quot;止于陶，卒老死于陶&quot;，后世在此建范蠡祠、范蠡湖、马场（传说范蠡养马处）。陶朱公传说为国家级非遗。；梁王台（彭越点将台）：定陶镇东北3公里，汉初梁王彭越在此点将。周围低洼潮湿，早晨远望台上白气茫茫。；十里铺遗址（龙山文化·2015十大考古新发现）：定陶区西南，尧、舜时期陶国遗存。；陶丘（古陶国遗址）：定陶县城西南，马集镇费庄村北200米。《说文》&quot;陶再成丘也，在济阴&quot;——双层土丘形似陶灶。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·货殖列传》：\u003cbr\u003e▌《定陶县志》（清）：\u003cbr\u003e▌定陶文保干部李娜：\u003cbr\u003e▌仿山守墓老人曹大爷：\u003c/p\u003e"}, {"n": "巨野老县城·麟州", "s": "巨野", "p": "山东", "w": "西狩获麟台·永丰塔宋建·文庙大成殿明·金山秦王避暑洞春秋鲁哀公十四年（前481）&quot;西狩获麟&quot;——麒麟被埋的地方就是麒麟冢/麒麟台。永丰塔（宋建）立在县城东南角1000多年了——塔因有&quot;永丰&quot;之名而叫&quot;永丰塔&quot;，塔下有永丰泉，泉水能酿酒。文庙大成殿是菏泽地区唯一保存较好的明代祭孔建筑。金山秦王避暑洞是昌邑王刘贺的废崖墓（刘贺就是那个当过27天皇帝就被废的人），金朝大定三年皇帝赐封&quot;大明禅院&quot;。", "h": "\u003cp class=\"main-text\"\u003e西汉始建县城（周九里）。唐高祖武德四年（621）设麟州于巨野，因&quot;西狩获麟&quot;而名。元文宗至顺元年（1330）黄水注巨，城址淹没，县治一度迁城北邢家务。明洪武七年（1374）黄河义决，巨野水深四丈，塔没二级，房屋殆尽。明武宗正德七年（1512）因农民起义军攻克数城，知县余守观惧故城空旷，急调民工改建——拆城西、北两隅，保留东、南两隅，新城周长1113丈（约3公里），加瓮城。明熹宗天启二年（1622）地震+起义军围攻，抢修城防。1946年元旦，巨野旧城墙开始被拆除，建起环城路。现状：永丰塔、文庙大成殿、麒麟台、昌邑故城址、金山秦王避暑洞尚存。明代改建后城门  现状。东门（凝和）  全毁。南门（延熙）  全毁。西门（遂昌）  全毁。北门（拱极）  全毁。永丰塔      县城东南角尚存。&quot;鲁哀公十四年春，西狩获麟。孔子曰&#x27;孰为来哉，孰为来哉&#x27;，反袂拭面，涕沾袍……遂绝笔于获麟。&quot;——《春秋》写到这里就停笔了，所以又叫《麟经》。&quot;大成殿的斗拱是真家伙——每一组都有名字：一跳、二跳、耍头、令拱……明式做法，没有任何一根钉子，全靠榫卯咬合。我带过很多建筑系学生来量，说这在菏泽地区是独一份。&quot;。&quot;刘贺当过27天皇帝就被霍光废了，回昌邑继续当王。他怕死后被盗，在金山的悬崖上凿了个墓——就是这个避暑洞。为什么叫秦王避暑？因为金大定三年皇帝赐封后，老百姓觉得&#x27;大明禅院&#x27;不如&#x27;秦王避暑&#x27;好记，就这么叫下来了。&quot;。&quot;我家酒厂在永丰泉旁边50年了——这泉水酿的酒，喝了不头疼。老辈人说塔下有泉，泉下有龙，龙吐水出来酿酒——半真半假，但这水确实好。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e永丰塔（北宋·县城东南角）：建于宋代，高约32米，八角十三层楼阁式砖塔。因塔下有永丰泉（泉水清澈能酿酒），故名&quot;永丰塔&quot;。金大定十三年（1173）重修。巨野老八景&quot;塔立中流&quot;即此——黄河故道曾流至塔下。；巨野文庙大成殿（省保·明代·菏泽唯一保存较好明代祭孔建筑）：坐北朝南，台基高1.4米，东西长22.3米，南北宽14.25米，通高13.7米。面阔5间18米，进深3间，重檐九脊歇山式建筑，绿瓦朱甍，斗拱盘错，雕梁画栋。巨野县衙曾把文庙大成殿作为&quot;学署&quot;，至今殿内仍有清乾隆年间匾额数方。；麒麟台/麒麟冢（春秋·&quot;西狩获麟&quot;埋麟处）：麒麟镇陈胡庄村东750米。原遗址东西长48米、南北宽20米，台高约4米。明嘉靖十四年（1535）进士张九叙斗书&quot;麒麟冢&quot;碑，明天启年立&quot;重修瑞麟寺功德碑&quot;，均存。巨野麒麟传说为国家级非遗。；昌邑故城址（国保·西汉昌邑国都城）：巨野县城南昌邑集一带，西汉昌邑国（刘贺为昌邑王时）都于此。地面仅存夯土城墙残段。；金山秦王避暑洞（昌邑王刘贺废崖墓·金赐&quot;大明禅院&quot;）：巨野县城东南22公里金山景区内。西汉昌邑王刘贺被废后，回昌邑为王，死后葬于此废崖墓。金大定三年皇帝赐封该洞为大明禅院。洞内有历代文人墨宝石刻。；蚩尤墓：巨野县城东北固堆庙村前，相传为上古蚩尤葬处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《巨野县志》（清道光）：\u003cbr\u003e▌巨野文庙管理员张老师：\u003cbr\u003e▌金山景区导游小刘：\u003cbr\u003e▌永丰塔下卖酒的李老头：\u003c/p\u003e"}, {"n": "单县老县城·牌坊城", "s": "单县", "p": "山东", "w": "百狮坊天下第一坊·百寿坊五爪真龙·朱家大院百亩20院宋至清末建坊百余座，人称&quot;牌坊城&quot;——现在全国牌坊城的牌子归歙县归德牌坊群，但单县的两座国保石坊（百狮坊+百寿坊）相隔不足百米，都是乾隆年间造的，工艺上各玩各的绝活：百狮坊在八根夹柱上雕了百只石狮子（每个大狮身上攀着五个小狮），百寿坊在额枋上刻了百个不同篆体寿字，而且它还敢雕五爪真龙（四爪为蟒五爪为龙——民间石坊雕五爪龙，规格顶破天）。朱家大院占地百亩20多处院落，是明清鲁西南最大地主宅院之一，现在仅存两处楼院。", "h": "\u003cp class=\"main-text\"\u003e明代始建县城，万历年间以砖包城。清代屡修屡圮。乾隆三十年（1765）立百寿坊（朱家节孝坊）。乾隆四十三年（1778）立百狮坊（张家节孝坊，比百寿坊晚13年，两坊相对成&quot;姊妹坊&quot;）。1950年代城墙大部拆除。2013年百狮坊+百寿坊列为第七批全国重点文物保护单位。现状：两坊完整，朱家楼院（省保）尚存两处楼院，老县城街巷格局依稀。明代城门     现状。东门        全毁。南门        全毁。西门        全毁。北门        全毁。&quot;单县建坊百余座，宋至清末皆有之。上世纪五十年代初尚存34座。百狮坊、百寿坊，一雕百狮一雕百寿，相距不足百米，为天下奇观。&quot;。&quot;造百狮坊时没有吊车，是用堆土法——修多高堆多高的土山，把石料滚上去，修完再把土清走。造石狮子最难的是那5个小狮，每个都不一样。我爹说，他年轻时还见过造坊的老工匠后代，人家说&#x27;每雕完一只小狮，就要在石头上刻一个小记号——不然雕了50只以后自己就记混了&#x27;。&quot;。&quot;我小时候从牌坊底下钻过去，百狮坊的石狮爪子上还挂着红布条——听老辈说，清朝时有小孩从石狮上掉下来摔伤，后来就不让爬了。百寿坊的寿字我数过，真有100个，每个都不一样——有钟鼎文、石鼓文、小篆、大篆，像是把一本篆书字典都刻上去了。&quot;。&quot;原来的朱家大院，从牌坊街到东关，占了县城一半地。我小时候听老辈说朱家是单县八大家之首，&#x27;出城巡游数百里，车不轧外姓田，靴不沾他姓泥&#x27;。现在只剩这两处楼院了——20多院剩2院，我守了10年，看着它从杂草堆变成博物馆。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e百狮坊（国保·清乾隆43年·1778·天下第一坊）：位于牌坊街中段，高14米，宽9米，四柱五楼式。八根夹柱各雕大狮及小狮（每大狮身上攀5小狮，母狮身上有的被按在足下、有的亲吻小腿、有的挠痒自娱）。正间额枋雕三层串枝牡丹，次间额枋雕龙凤。雕工&quot;每两石粉可换一两白银&quot;——造到最后张氏家产耗尽。传说石匠被坊主毒杀（怕再有富户造坊超过它）。；百寿坊（国保·清乾隆30年·1765·天下第一龙坊）：胜利北街，高13米，宽8米，四柱三间五楼式。前后正间枋心浮雕百个不同篆体&quot;寿&quot;字（百寿坊得名）。坊座雕8头雄狮、8条出水蛟龙绕柱回舞。关键——绕柱龙是五爪真龙（民间石坊绝无仅有），因坊主朱叔琪娶了曲阜孔氏（衍圣公之族），孔氏上报中枢后，皇帝特许雕真龙。正上匾&quot;敕褒节孝&quot;，次匾有乾隆四子永珹赞颂孔氏的两首诗。；单县羊肉汤地标：老县城内数十家羊肉汤馆——&quot;单县羊肉汤&quot;是山东非遗，单县籍武将在京任职时，羊肉汤被带入宫廷，获&quot;中华第一汤&quot;美誉。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e朱家楼院（省保·明末清初·占地百亩20院）：朱氏先祖明初迁居，三世朱昂始建宅院，历经十代人改扩建，清道光年间鼎盛——连片院落占老县城近五分之一面积，20多处院落、200余间房屋。现存东西两院，磨砖合瓦，檐下雀替雕花，东蝴蝶厅花鸟盘龙栩栩如生，闺房百龙顶子床圆雕透雕多种工艺。2011年改为单县民俗博物馆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《单县志》（清道光）：\u003cbr\u003e▌百狮坊老石匠孙师傅（78岁，家传石雕6代）：\u003cbr\u003e▌单县老教师郭敏：\u003cbr\u003e▌朱家大院看门大爷：\u003c/p\u003e"}, {"n": "金乡老县城·有缗国", "s": "金乡", "p": "山东", "w": "大禹轴心方国·羊山汉墓群2万座·文庙泮池还在·鲁邑雄镇夏代就有缗氏是大禹最信任的轴心方国——有缗国故城遗址缗城堌堆还在（卜集镇东门屯村）。羊山周围分布着2万多座汉墓，是山东境内最大的汉墓群之一。明万历年间砖砌城垣曾号称&quot;鲁邑雄镇&quot;，文庙格局完整——大成殿、泮池、棂星门、青云桥、千古道源坊沿中轴线排开，至今格局犹在。", "h": "\u003cp class=\"main-text\"\u003e夏代有缗国故城（卜集镇缗城堌堆），龙山文化→商→周→汉→唐文化层层叠压。秦置东缗县，治所在今嘉祥阿城铺村（旧金乡故城）。西晋泰始元年（265）金乡县治从阿城移至今金乡县城。明弘治十六年（1503）修县城，周长七里三十步，根阔一丈七尺，顶阔五尺，四门：东作/西成/南薰/北拱。明万历六年（1578-七年1579）大修砖城——烧砖百余万块，城垣增阔增高院增六尺，四门外加瓮城。明天启二年（1622）地震+民变围攻，抢修城防。1940年代县城砖石结构完整，西门外十字大街（清真街、南店子街）最繁华。1947年西、北、东门被土石堵塞，仅南门放行。1950年代城墙拆除。现状：缗城堌堆、羊山汉墓群、文峰塔、文庙大成殿尚存，仓房街、东秦街等传统街巷格局可辨。明代城门     现状。东门（东作）  全毁。西门（西成）  全毁。南门（南薰）  全毁。北门（北拱）  全毁。&quot;明万历六年修城，计地输柴烧砖百余万块，自二月讫于次年八月。城垣加阔，马车可并轨；女墙敌楼森然壮观，鲁邑雄镇。&quot;。&quot;堌堆高约10米，夯土层清晰可辨。在堌堆下1.5米处发现西周陶鬲残片——这说明夏代有缗国可能就建在堌堆之上，后来逐层叠加。当地人说&#x27;这堆土比县城还老&#x27;——确实，老了2000年。&quot;。&quot;文庙大成殿是明代原物——梁上墨书&#x27;万历八年重修&#x27;清晰可见。泮池里种着荷花，每逢六月满池香。青云桥是明代原桥，桥面石头被踩得发亮——500年的脚步声都留在上面了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e缗城堌堆（有缗国故城·省保）：卜集镇东门屯村，夏商周汉唐七层文化叠压的堌堆型古城址——大汶口→龙山→商→周→汉→唐，考古出土陶鼎、鬲、豆、罐、五铢钱、筒瓦板瓦。有缗氏是大禹治水后最受信任的轴心方国——夏王相的妻子后缗就来自有缗国。；羊山汉墓群（山东最大汉墓群之一·省保）：羊山镇周围2万多座汉墓，包括葛山汉墓群、石马群、明代郭家老林石刻（石马、石羊、石翁仲）。郭东藩墓神道石刻&quot;线条流畅造型大气&quot;。；文峰塔（县保）：县城内奎星湖旁，宋代始建，明万历重修，高约30米，八角七层楼阁式砖塔，是金乡县城千年地标。；金乡文庙（省保·格局完整）：县城中心，唐始建，宋、金、元、明、清屡修。现仅存大成殿、东西庑、戟门、泮池、棂星门、青云桥、千古道源坊、地灵人杰坊。文庙格局完全保留——沿中轴线排列，东西各有明伦堂、启圣祠、文昌祠、名宦祠、乡贤祠。；仓房街、东秦街（明清古街巷）：金乡街道内保留的传统街巷，青石板路，两侧民国时期商铺格局尚存。；金谷（中华四大名米之一）：马庙镇金谷为康熙年间贡米，&quot;齐头占金谷&quot;——穗子齐整整地占满谷壳，米粒圆润。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《金乡县志》（清康熙）：\u003cbr\u003e▌缗城堌堆考古队：\u003cbr\u003e▌金乡文庙管理员老李：\u003c/p\u003e"}, {"n": "嘉祥老县城·曾子故里·武氏祠汉画像石", "s": "嘉祥", "p": "山东", "w": "南武城夯土还在·曾翰博府皇帝御赐匾额·曾子琴堂琴台坑还能摸明嘉靖皇帝经过7朝89年考证认定曾子故里在嘉祥——正统→景泰→天顺→成化→弘治→正德→嘉靖，最后下旨授曾子59代孙曾质粹翰林院五经博士，世世承袭，跟颜孟两家同等待遇。武氏祠汉画像石是全国第一批全国重点文物保护单位（1961年，国1级），东汉桓灵年间武氏家族墓群石刻，46块画像石内容涵盖帝王圣贤、孔门弟子、神话仙人、忠孝节义，是汉代社会的&quot;百科全书&quot;，有文字榜题——&quot;武梁从事&quot;、&quot;武开明郡丞&quot;、&quot;武班敦煌长史&quot;、&quot;武荣执金吾丞&quot;，连汉代人看了都说好。", "h": "\u003cp class=\"main-text\"\u003e金皇统七年（1147）设嘉祥县，以山口镇为县城。金大定十五年（1175）再徙萌山之阳（今嘉祥县城址）。明正统十年（1445）重建曾子庙（南武山南麓）。明成化初，山东守臣上言：嘉祥南武山西南元寨山东麓有渔者陷入一穴中，得见悬棺，前有石碣曰&quot;曾参之墓&quot;——成化帝下旨修治。明正德二年（1507-九年1514），孝宗/武宗皇帝下诏扩修曾庙如颜孟庙制，历时7年。明嘉靖十八年（1539）授曾子59代孙曾质粹翰林院五经博士，世世承袭。清代屡修。1950年代城墙拆除。现状：曾翰博府、曾子琴堂、武氏祠汉画像石、南武城遗址夯土残垣尚存。明代嘉祥城门  现状。东门        全毁。西门        全毁。南门        全毁。北门        全毁。&quot;郕国宗圣公自有封谥以来，载在祀典，血食天下。而此庙则在故里南武城，旧为邑，即子游为宰处。在今兖州之西，嘉祥、金乡县界，庙南北去县各四十五里，南武山之阳。&quot;。&quot;武氏祠是东汉武氏家族出资造的——武梁是从事、武开明是郡丞、武班是敦煌长史、武荣是执金吾丞。兄弟四人都是汉代中高层官员，攒钱给家族修墓造石刻。画像石旁有文字榜题，比如&#x27;武梁从事&#x27;四字——汉代的简历直接刻在自己墓前，这自信没谁了。&quot;。&quot;我家是曾子的嫡传后代——从明朝嘉靖年间就世袭翰林院五经博士，管曾子祠墓的事。大堂上那块&#x27;省身念祖&#x27;是雍正皇帝亲笔写的。后来断了传承，但每年清明我们家还是要回曾庙上香——这祖宗牌位不能丢。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e武氏祠汉画像石（国保·1961年国1级·东汉桓灵年间·中国最古老的汉代石刻艺术瑰宝）：纸坊镇武翟山村北，东汉武氏家族墓地石刻——武梁、武开明、武班、武荣兄弟四人的宗族墓。46块画像石+2块汉碑+1对石狮+1对石阙。内容涵盖：帝王圣贤（神农/黄帝/尧舜禹）、孔门弟子（孔子见老子/子路/颜回）、历史故事（荆轲刺秦王/完璧归赵）、神话仙人（西王母/玉兔捣药/雷公电母）、忠孝节义（荆轲/专诸/聂政/孝女曹娥）。刻法为&quot;减地平面线刻&quot;——物像外留有细密平行的凿纹，凝重醒目。一对石狮昂首扭颈张口怒目——中国现存最早的石狮。；曾子庙/曾庙（省保·明正德重修·三进院落·70余楹建筑）：南武山南麓阿城铺村西北，始建于周考王十五年（前425）。明正德重修后规模如颜孟庙——坐北朝南，红墙长方形（南北230米×东西120米=27600平方米）。三路中轴线：中路宗圣殿（面阔七间，34米宽），清世宗亲书&quot;道传一贯&quot;巨匾；东路三省堂（纪念&quot;吾日三省吾身&quot;）；西路莱芜侯祠（曾子父曾点）。庙内古柏参天，碑碣林立。；曾翰博府（曾氏翰林院五经博士府·皇帝御赐·清光绪16年重修·10余亩）：嘉祥县城南隅，北面隔街面对原县衙。占地10余亩，大堂五间，中悬清世宗御赐曾尚溶&quot;省身念祖&quot;匾额——这是皇帝亲笔。抱厦三间，前坊一座，影壁一座，左右角门。；南武城遗址（春秋·济宁市保）：满硐乡南武山村东南1000米，呈方形子午向，面积25万平方米。残存东城墙南北长约100米、宽8米、高3-4米，夯土层夯窝清晰（圆形圜底，周代筑城特征）。夯层中含西周晚期和春秋陶片——与曲阜鲁国故城同期城墙工艺相同。；曲阜颜孟三家并列：自嘉祥曾翰博府立后，&quot;东有颜（颜庙），西有孟（孟庙），中有曾（曾翰博府）&quot;——三家世世代代同享&quot;五经博士&quot;待遇，地方官春秋二祭。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e曾子琴堂（城东北隅·金建明毁·琴台坑尚存）：萌山之阳，传为曾子鼓琴处。金章宗大和七年（1207）重建——穴地3尺，铺以大石砌石台，南面九级石阶，台上建堂（上圆下方如亭）。堂前甘泉池名琴台坑。明嘉靖九年（1530）知县王时佐取石建泮宫桥，堂遂毁——但琴台坑泉眼至今仍冒水。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明《重建宗圣公庙记》（正统十一年许彬撰）：\u003cbr\u003e▌武氏祠考古学者：\u003cbr\u003e▌曾翰博府后人曾大爷：\u003c/p\u003e"}, {"n": "曹县老城·商汤之都·景亳", "s": "曹县", "p": "山东", "w": "商汤会诸侯景山·伊尹耕莘·汤陵封土70米·盘庚陵在城北商汤之都景亳（北亳/蒙亳）——王国维《观堂集林·说亳》考证商汤之都亳在曹县南二十余里（阎店楼/邵庄/郑庄三镇交界处），后世左丘明/司马迁/班固/傅瓒/杜预/伏滔/王国维/顾颉刚/辛德勇等全部持此说。商汤灭夏前会三千诸侯于景山（曹县东17公里梁堌堆）会盟演兵，史称&quot;商汤有景亳之命&quot;。伊尹就在曹县莘冢集耕于莘野，后来到亳汤王处做右相。汤陵封土南北70米×东西50米×高1.5米还在，明清重修碑还在。", "h": "\u003cp class=\"main-text\"\u003e商汤自契至成汤八迁都，最终定居于景亳（曹县）。商汤会三千诸侯于景山（曹县梁堌堆），灭夏建商。汤王在位30年死后葬于涂山之阳（曹县土山集）。盘庚曾居亳（景亳），恢复汤政。周初曹县属宋国（宋君为商汤后裔），把汤陵作为祖先宗邑祭祀。汉哀帝建平元年曾遣使祭祀汤陵。明弘治五年（1492）/嘉靖二十五年（1546）/万历九年（1581）多次重修汤陵庙。1967年山东省文保单位。现状：汤陵、伊尹墓、盘庚陵、莱朱墓、景山（梁堌堆）、莘冢集（有莘国遗址）尚存。商汤建都遗迹    位置。景亳故城（汤都）  阎店楼/邵庄/郑庄三镇交界。汤王陵        土山集村（县城南10公里）。伊尹墓        殷庙村（县城东南15公里）。盘庚陵        燕陵（县城北）。莱朱墓（左相）  宋天堌/潘白刘（县城南5公里）。景山（会盟台）  梁堌堆（县城东17公里）。莘冢集（有莘国）  莘冢集镇（县城北18公里）。箕子墓        县城西。&quot;成汤自契至汤八迁。汤始居亳，从先王居，作《帝诰》。——伊尹去汤适夏，既丑有夏，复归于亳。入自北门，遇汝鸠、汝方，作《汝鸠》《汝方》。&quot;。&quot;商汤之都亳，为汉之薄县，即今山东曹县南二十余里。左丘明、司马迁、班固、傅瓒、杜预、伏滔皆持此说。&quot;。&quot;汤王陵封土南北70米——这是商王墓的标准规制。我们1967年立文保碑时，墓前还有明清两代的碑——共5块，现在只剩3块完整的，两块裂了。汤庙大殿毁了两次——民国战乱一次，黄河洪水一次。遗址夯土还在，每年清明还有人来上香。&quot;。&quot;我家地就在莘冢集堌堆边上——小时候挖土豆经常能挖到陶片，碎陶片上有绳纹——老人说这是&#x27;伊尹耕田时用的碗&#x27;，我不敢信也不敢扔，捡回家放窗台上了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e景山/梁堌堆（商汤会三千诸侯处·省级文保·景亳之命台基）：县城东17公里梁堌堆。商汤灭夏前在此会盟诸侯演兵，史称&quot;商汤有景亳之命&quot;。《商颂》&quot;陟彼景山，松柏丸丸&quot;即此。堌堆为龙山/商/周叠压文化层，出土商周陶片。；伊尹墓（商右相·世界最早丞相·省级文保）：县城东南殷庙村（原楚丘城西）。伊尹&quot;耕于莘野&quot;（莘冢集）后到汤王处任右相——&quot;伊尹五就桀五就汤&quot;。沃丁时伊尹去世葬于亳。墓前有伊尹祠（&quot;元圣祠&quot;），明清重修多次。；盘庚陵（商第20代王·曾居景亳·商中兴之主）：县城北燕陵村。盘庚曾一度回景亳（曹县）治天下推行汤政，恢复商道。盘庚死后葬此，后人建盘庚祠纪念。；莘冢集（有莘国遗址·省级文保·伊尹耕莘处）：县城北18公里莘冢集镇。有莘国是夏商时古国，伊尹曾在此耕稼。商汤娶有莘氏为妃。遗址为龙山文化→商→周叠压的堌堆型。；曹县城明清遗址（明代城墙残段）：明代曹县城周长九里，残垣可辨。县城内有盘庚村、盘庚祠遗址。；&quot;汤陵异木/莘野春耘/景山夕翠&quot;——曹县明八景中，三个都与商汤有关。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汤王陵（商肇建之君·省级文保·封土尚存·明清重修碑）：阎店楼镇土山集村西，现存封土南北长70米、东西宽50米、高1.5米。陵前有明清两代&quot;重修汤陵碑&quot;——宋皇祐四年（1052）、元延祐五年（1318）、明宣德八年（1433）、成化十二年（1476）、弘治五年（1492）、嘉靖二十五年（1546）、万历九年（1581）多次重修汤庙（有汤庙、东西庑、前殿、大殿），后毁于兵燹水患。遗址尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·殷本纪》：\u003cbr\u003e▌王国维《观堂集林·说亳》：\u003cbr\u003e▌曹县文保干部老王：\u003cbr\u003e▌莘冢集老农民张大爷（76岁）：\u003c/p\u003e"}, {"n": "峄城老城·三城叠压", "s": "峄城", "p": "山东", "w": "汉承县夯土残15米·金峄州城荡平·明峄县石城西门存·孺子桥12孔96米枣庄的原名就是峄县，峄县的原名就是兰陵——明代文豪贾三近（《金瓶梅》作者嫌疑）在《峄县志》序中三次强调&quot;峄县即缯、承、兰陵之旧疆&quot;。峄城地下叠压着三座城池：汉承县故城（2000年前）、金峄州故城（800年前）、明峄县故城（600年前）。现存的明峄县西门是唯一还能摸到的城防建筑——2016年当地工匠用青砖补了垛子，面向公众开放。", "h": "\u003cp class=\"main-text\"\u003e汉承县：西汉置承县，城周250m×600m，今仅西北角存残土墙15m×4m。金兴定年间（1221-1223）：王宣在仙坛山南麓建峄州城——周约3500米，西墙紧依承水，北墙在峄城北关外300米。元至元二年（1265）：省兰陵县入峄州，峄州版图扩大。元末：徐达、常遇春北伐&quot;三打峄州&quot;——峄州城夷为平地。明洪武二年（1369）：降峄州为峄县，知县乐徽在峄州城西南隅筑新县治——三座城叠压格局就此形成。成化二十二年（1486）：知县毛凤鸣将土城整建为石头城——内外壁面长条块石砌垒，中间填夯土、毛石、豆汁白灰麻刀。乾隆四十三年至四十九年（1778-1784）：知县张玉树重修城垣、文庙、乡贤祠。清后期/民国：城毁于兵燹，仅余城西北临河一段矮墙，西门相对完整。1949年后：拆城建房、&quot;文革&quot;破四旧，城墙几乎荡平，仅余西门。2013年：峄县西城门列为区级文保单位。2016年：峄城区文广新局修复西门南墙，用青砖补垛子——试开放。现状：峄县西门（迎恩门）经局部修复对外开放，汉承县西北角残土墙尚存，城内地下三城叠压。峄城三城遗迹      现状。汉承县故城      城西一里·仅西北角存残土墙15m×4m·底宽3m·黄土夯筑。金峄州故城      仙坛山南麓·荡平·西墙依承水·北在城北关外300米·周约3500m。明峄县故城      峄州城西南隅·仅余西门（迎恩门）·城墙周4里余·高5m厚3.3m。峄县四门        东&quot;兴贤&quot;（喜门·嫁娶庆典走此）·西&quot;迎恩&quot;（处斩罪犯也走此）·南&quot;望仙&quot;·北&quot;近圣&quot;。孺子桥（西门外）  长96m·宽6m·高4m·12孔·跨承水河·古驿道咽喉。乡贤祠          牌坊街社区·祀荀子/萧望之/疏广疏受/匡衡/王良/贾三近。&quot;峄城地下埋着三座城——汉代的在西、金代的在中、明代的在东，叠压在一起。我们2018年搞基建时，在牌坊街打地基，挖到3米深时发现了金代峄州城的夯土墙基——直径1米左右，夯土层每层20厘米。再往下挖，居然挖到了汉代的陶排水管道，完整的，一节一节扣在一起。&quot;。&quot;我守西门5年了——每天早上开门，晚上关门。游客不多，大多是老头老太太遛弯的。2016年修城墙时，县文保所找的都是当地老石匠——用的还是传统的&#x27;糯米灰浆&#x27;，不是现在的水泥。我亲眼看着老石匠把凿好的条石一块一块砌上去，缝里塞的是麻刀和细沙——600年前我祖辈就是这么砌的。&quot;。&quot;我家就在牌坊街——原来街上有三座跨道石坊，文革时被推倒当了建材。我爷爷当年亲眼见贾三近的后代把《金瓶梅》手稿捐给了北京——说是祖传的，不敢留。后来听说北京的专家说是假的，我爷爷气得三天没吃饭。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e汉承县故城残墙（省级文保·西汉城址·鲁南最早县级城垣）：峄城西一里，紧靠承水河&quot;承水环烟&quot;八景西畔。城址南北长600米，东西宽250米，四周墙基已夷为平地。仅西北角残存一段黄土夯筑土墙——高约4米，东西长约15米，底宽约3米。1986年普查时农民取土还挖出汉代陶罐、五铢钱。；仙坛山（古峄州城靠山·峄县八景之一&quot;仙坛晓翠&quot;）：金峄州城北面的天然屏障，海拔275米。山顶原有&quot;玉皇帝主祠&quot;，元代建&quot;玄真观&quot;，明清屡修。山下有承水河环绕，&quot;承水环烟&quot;是峄县八景之首——清晨河面上水汽蒸腾如烟雾缭绕。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e峄县西门（迎恩门·区级文保·峄城唯一幸存城门·2016年修复）：明洪武二年（1369）筑土城，成化二十二年（1486）知县毛凤鸣整建为石头城——内外壁面用长条块石料砌垒，中间填以夯土毛石、豆汁和白灰麻刀沙子浇制混凝。城墙高5米、厚3.3米，墙基宽10米。西门高3.5米，门洞宽3米，青砖灰瓦结构。2016年3月峄城区文广新局历时21天修复，主要是对西门南墙进行维修加固，用青砖垒成城墙垛子。保护范围：以西门建筑为基点向外延伸10米为重点保护区，40米为建筑控制区。；孺子桥（西门外驿道桥·明代遗存·现存完好）：长96米，宽6米，高4米，12孔。横跨承水河，是邳州、峄城通往滕县、兖州的古驿道咽喉。桥头原有石狮子两对，文革中被砸毁。2008年当地村民募资修复桥面——现在还能通行农用三轮车。；贾三近故居（明代文豪·《金瓶梅》作者嫌疑）：峄城牌坊街社区。贾三近（1534-1592），明隆庆进士，官至南京光禄寺卿，主编首部《峄县志》。其故居为三进院落，青砖灰瓦，门楣上有&quot;光禄第&quot;三字——文革中被毁，仅存门楼残基。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌峄城区文保所老赵：\u003cbr\u003e▌峄城西门守夜人张大爷（72岁）：\u003cbr\u003e▌牌坊街老住户王奶奶（81岁）：\u003c/p\u003e"}, {"n": "微山夏镇·运河名镇", "s": "夏镇", "p": "山东", "w": "一步两省三座庙·一部城跨运河·三绝碑1960省文保·泰山庙会四月十八京杭运河四大名镇之一·一镇跨苏鲁两省——&quot;一步两省三座庙，一条大街两县分&quot;。夏镇由三部分叠压而成：西北秦广戚县戚城（两千年老县城）、西南明代部城（运河护城兵驻地）、东寨（清咸丰沛县迁此，11年）。运河自西向东南蜿蜒穿行——部城砖城周长九百余丈、高二丈五尺、雉堞千余。康熙七年（1668）地震城门楼全塌，商贾东迁，运河东岸镇市渐盛。", "h": "\u003cp class=\"main-text\"\u003e秦代：置广戚县——今夏镇戚城。南北朝：废广戚县并入留县——戚城城垣尚存，但繁华消退。明嘉靖末：新开漕运新渠（南阳至留城141里）——夏村（夏镇原名）成为沿运码头。明隆庆三年（1569）：夏村改村为镇，工部、户部分司自沽头城移驻。明万历十六年（1588）：筑土城，建四门楼——东&quot;见泰&quot;（后改&quot;安澜&quot;）、西&quot;瞻华&quot;、南&quot;延庆&quot;、北&quot;拱极&quot;。清顺治十五年（1658）-十八年（1661）：改建为砖城——城为梯形，周长九百余丈，高二丈五尺，雉堞千余，因常驻护河兵又名&quot;部城&quot;。清康熙七年（1668）：郯城8.5级大地震波及——部城四门楼皆倒塌，城内房屋多毁，商贾东迁运河东岸。清咸丰元年（1851）：黄河蟠龙集决口，沛县栖山一带淤没——沛县县城自栖山迁夏镇东寨，历经11年。咸丰二年（1852）：东寨筑土圩——因西以运河为障，仅三面筑墙，建三门楼（东&quot;同德&quot;、南门、北门）。清末：夏镇形成戚城（西北·滕县辖）、部城（西南·沛县辖）、夏镇寨（东·两县分治）三合一格局——&quot;一部两省三座庙，一条大街两县分&quot;。1949年后：拆城建房，城墙陆续荡平。现状：老运河（漕运新渠故道）5.8公里活水段、三绝碑（省文保）、顺河街/月河圈/三孔桥、泰山庙（碧霞宫）遗迹尚存。夏镇三城运河遗迹      现状。秦戚城（广戚县）    夏镇西北·仅剩城垣残基·明清&quot;姜肱故里&quot;碑存。明部城（砖城）      夏镇西南·仅剩极少残基·清顺治三年建·常驻护河兵。清东寨（沛县迁治）  运河东岸·已无城垣·一条大街两县分。老运河（漕运新渠）  穿镇而过·明隆庆元年开凿·全长141里·夏镇段保留5.8km活水。三绝碑（漕运新渠记）  运河西岸·徐阶撰/周天球书/吴鼐刻·1960年省文保·与曲阜孔庙名碑相当。夏镇闸            明隆庆年间建·漕运新渠上重要节制闸·民国时期仍在使用。三孔桥            运河上·嘉庆二十三年（1818）建·三孔石桥·现存。碧霞宫（泰山庙）    三孔桥北·原&quot;夏镇泰山庙会&quot;地·庙会四月十五至十八日·庙会时碧霞元君出巡。姜肱故里碑        部城北广戚城中·篆体&quot;汉姜肱故里&quot;·后移至通济门大南门胡同北头。泗水亭问渡坊      夏镇闸上·康熙南巡时建·记刘邦泗亭亭长旧事·后毁。&quot;1980年修县志时，我在夏镇老街走访了三个月——一位姓赵的老太太告诉我：她1948年刚嫁到夏镇时，运河东岸的顺河街还能通船——夏天河里到处是荷花，小孩在水里摸莲蓬。后来泇河主运道改线，这条河就不通船了。现在河两边盖了住宅楼，河里种了荷花，每年夏天还有不少人来拍照。&quot;。&quot;三孔桥是嘉庆年间造的——石头块一块挨一块，没用水泥没用灰，就是&#x27;卯榫&#x27;接起来的。我爷爷说，造桥时石料从微山湖上船运过来，一块石头要10个壮劳力抬。现在桥面上铺了沥青，桥墩还是原来的石头——600年了，一块石头都没掉。&quot;。&quot;我爹是运河上的老船工——给漕船拉纤的。他说，夏镇泰山庙会是运河上最热闹的——四月十五到十八，碧霞元君出巡，队伍有几千人，銮驾、卫队、八仙、僧侣……光唱戏的戏台就搭了5座。那时候运河上的船连起来能排5里长——南北的客商全来逛庙会，卖粮的、卖布的、卖银器的……&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老运河（漕运新渠故道·世界文化遗产延伸段·夏镇保留5.8公里活水）：明隆庆元年（1567）工部尚书朱衡主持开凿——北起南阳闸，途经夏镇直达留城，全长141里，疏浚旧渠53里。河道西引黄河，东接泗水，解决了黄河夺运淤塞问题。夏镇段保留5.8公里活水，河宽约50米，两岸柳树成荫。咸丰元年（1851）黄河蟠龙集决口淤塞旧道后，泇河成为主运道，此段运河不再承担漕运功能——如今作为城市景观河，东风桥、和平桥、运河桥横跨其上，为居民出行要道。；三绝碑（漕运新渠记碑·省文保·明代碑刻艺术巅峰）：夏镇运河西岸，原玄帝庙门北侧，河清永镇亭（皇华亭）中。整个碑体规模与曲阜孔庙名碑相当。《漕运新渠记》系明嘉靖年间吏部尚书、建极殿大学士徐阶所撰，书法名家周天球书写，名石匠吴鼐刻石——撰、写、刻三绝，被誉为&quot;明碑第一&quot;。1960年山东省人民委员会曾拨专款修亭，围以栏杆保护——&quot;文革&quot;时被砸裂，80年代修复，现立于原皇华亭旧址。；夏镇闸（明代漕运节制闸·运河关键工程）：老运河上，明隆庆年间工部尚书朱衡主持修建。为石制节制闸，闸身长120米，闸门宽8米——1930年前后仍在使用，建国后改建为公路桥的一部分。；顺河街、月河圈、三孔桥（运河老街·夏镇最繁华的古街区）：顺河街原名运河涯——运河西岸的码头街巷，粮行、布店、药铺、银匠铺鳞次栉比。至民国初期，夏镇商业有17种行业193家商户——山西、河南、浙江、安徽、章丘五大商帮聚居于此。月河圈是清乾隆间疏通运河时挖得的半月形河道，供漕船商船停泊绕行——后人们围绕小河居住，弧形排列，成为运河边最具特色的居民区。三孔桥：嘉庆二十三年（1818）建，三孔石桥，横跨运河——桥长30米，宽6米，桥洞各高5米，三孔并列。；姜肱故里碑（汉代名士·兄弟友爱典故）：部城北广戚城中——篆书&quot;汉姜肱故里&quot;五个大字。姜肱（东汉名士）与弟姜仲海、姜季江&quot;同被而眠&quot;——&quot;姜被&quot;成为形容兄弟友爱的典故。朝廷多次征召不就，一生不入仕。《后汉书》为其立传。原碑后移至通济门大南门胡同北头。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌微山县志办退休干部王建国：\u003cbr\u003e▌三孔桥附近老住户张大爷（74岁）：\u003cbr\u003e▌夏镇老船夫老李（70岁）：\u003c/p\u003e"}, {"n": "郓城老城·水浒故里·好汉七十二", "s": "郓城", "p": "山东", "w": "鲁成公4年筑郓·水浒好汉城·宋江武校·唐塔水浒一百单八将，七十二名在郓城·全国武术之乡——郓城始建于鲁成公四年（前587），鲁国筑城名郓，近2600年。《水浒传》宋江、晁盖、吴用、李逵的故事都发生在这里。清末民初城墙底宽1.8丈、顶宽1.2丈、高2.5丈、周长3.3华里——1947年刘邓大军攻克郓城后，城垣被拆除。现存郓城文庙（明代）、七级唐塔（五代后唐）、水浒好汉城、宋江武校（全国十大武校之首）。", "h": "\u003cp class=\"main-text\"\u003e鲁成公四年（前587）：鲁国筑城名郓——郓城得名之始，近2600年。南北朝至唐贞观八年（634）：郓州治所驻旧县城（今城东张营乡张营村）——740余年。隋开皇十年至唐贞观八年（590-634）：郓州设总管府、都督府，统郓、濮、兖、戴、曹5州30县。唐贞观八年（634）：郓州治徙须昌（今东平）。金大定六年（1166）：黄河泛滥，旧县城沦没，徙盘沟村建新县城——即今郓城老城。金大定六年（1166）至今：县城位置稳定——850年未挪。清末民初：城墙底宽1.8丈、顶宽1.2丈、高2.5丈、周长3.3华里——设四门（南迎薰、东通济、北拱极、西安澜），四隅炮楼，东城墙南段魁星楼。城内18条街巷：育贤街、文献街、武安街、英贤街、平政街、油坊街、指南巷、豆腐巷等。1939年：动乱波及郓城——城墙遭严重破坏。1946年：郓城县民主政府为防国民党据城固守——组织民工将城垣、城楼、炮楼拆除，只剩城墙根。1947年：国民党五十五师再踞郓城，筑城墙+碉堡——同年刘邓大军攻克，城垣碉堡全拆。1949年后：县城向四周扩展——60-70年代向南，80年代向西西北。现状：水浒好汉城（4A）、郓城文庙（明代）、七级唐塔（五代）、宋江武校、县城东门街/西门街/金河路/唐塔路等街巷名沿用至今。郓城水浒老城遗迹      现状。郓城文庙（大成殿）  城内东南隅·明代·6根圆木柱+24根石柱·双层飞檐·红脊碧瓦·省文保。七级唐塔          城内东北隅·五代后唐时建·七级古塔·古朴雄伟·市文保。水浒好汉城        西门街·4A景区·占地400亩·36院落·72景观·108景点·北方四合院+浙派徽派古建。宋江武校          全国十大武校之首·狗娃艺术团·状元大刀（200余斤）。宋江武馆        好汉城内·北方传统四合院·宋江后代拳谱。晁家庄          好汉城内·托塔天王晁盖庄园·城堡式建筑·暗道+迷宫。郓城县衙          好汉城内·北宋始建·重建·大堂二堂六房后宅。郓城老城墙根      今城内盘沟路/东门街沿线·1946-47年拆城后残存·农民建房地基。旧县城（张营村）  城东张营乡·740年郓州治所·金大定六年黄河泛没·今仅存旧县寺石碑。&quot;我研究水浒30年了——水浒里晁盖、宋江、吴用、李逵的故事，很多真的发生在郓城。宋江家乡在水堡镇——水堡镇原名宋家庄，宋江起义后改名&#x27;宋保义&#x27;，后改水堡。现在还有宋江井、宋江祖坟。黄泥冈在郓城县黄泥冈镇——当年晁盖等人劫生辰纲的地方，现在还有&#x27;黄泥冈遗址&#x27;碑。施耐庵当年写《水浒传》，很多细节都是从郓城老人们那里听来的。&quot;。&quot;我每天在晁家庄里转——这个庄园是2008年从山西晋南搬迁过来的，城堡式结构，有暗道有迷宫。2016年有个游客是山西祁县人，说他家祖上就是这座庄园的主人——族谱上说庄园被卖了，但不知道卖到哪儿。他找到晁家庄，跪在庄园门口哭了半小时。我们听了都心酸——一座老宅子，承载的是两家人几百年的记忆。&quot;。&quot;宋江村全村300多户，姓宋的占70%——族谱上明确写着&#x27;起义军首领宋江后裔&#x27;。每年清明，海内外宋氏后人组团来祭祖——从美国、加拿大、台湾来的都有，每次一两百人。宋江井是村里的宝贝——据说宋江当年就是喝这口井水长大的。文革时红卫兵要填井，全村老人手拉手围着井不让填。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e水浒好汉城（4A景区·中华古民居博物馆·整体搬迁的明清建筑群）：郓城县城西门街。占地400多亩，36院落、72景观、108个景点——采用整体搬迁方式，将山西、陕西、浙江、安徽等地具有水浒文化特色的元明清民间建筑征集到郓城，在街区内恢复。晁家庄（托塔天王晁盖庄园，建筑面积2200㎡，城堡式，暗道+迷宫）、郓城县衙（北宋始建·重建，5400㎡）、宋江武馆、孙二娘客栈、乌龙院、及时雨茶楼、朱贵酒店、好汉城古城墙等。北方四合院与浙派徽派古建荟萃——雕梁画栋，古朴精致。；宋江武校（全国十大武校之首·狗娃艺术团·状元大刀）：郓城县城水浒路西段。中国好汉之乡的标志——狗娃艺术团表演的武术舞蹈《狗娃闹春》上过央视春晚。重达200余斤的状元大刀绝技——全校师生都以能举此刀为荣。校址就在水浒好汉城内，武术教学与旅游体验深度融合。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郓城文庙大成殿（省文保·明代·水浒好汉城内核心文化建筑）：郓城老城内东南隅。明代建筑，下有6根圆木柱、24根石柱支撑，上有双层飞檐楼阁——红脊碧瓦，风铃叮叮。现为水浒好汉城核心景区之一——&quot;明伦堂&quot;和&quot;大成殿&quot;里展有水浒人物故事和郓城历史。文庙占地约1万平方米——据县志记载始建于北宋，明洪武九年（1376）重建，屡经修缮。1947年拆城时差点被拆，当地百姓保护下来。；七级唐塔（市文保·五代后唐·古朴雄伟）：郓城老城内东北隅。五代后唐时期所建，七级古朴雄伟——因塔身斑驳、造型粗犷，当地人称之为&quot;唐塔&quot;。塔高约30米，为砖石结构——1958年大炼钢铁时，塔檐的铸铁构件被拆去炼钢，塔身残缺，但塔基稳固。现在塔旁建了唐塔广场，成了郓城的城市地标。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郓城水浒研究会李会长：\u003cbr\u003e▌晁家庄管理员小张（28岁）：\u003cbr\u003e▌水堡镇宋江村老支书：\u003c/p\u003e"}, {"n": "梁山老城·宋江寨·会通河起点", "s": "梁山", "p": "山东", "w": "虎头峰石寨墙·前集村S形防御街巷·开河镇百步一庙·会通河起于码头水浒宋江寨虎头峰·会通河元起点·前集村明清防御式古村——梁山虎头峰海拔197.9米，北宋末年宋江聚义的大本营就在这里——明初清丈梁山，对梁山&quot;勒石山巅，垂为厉禁，归之版籍&quot;——山上建筑遭毁灭性破坏，崇祯十五年（1642）崇祯帝传旨严禁《水浒传》刻印流传。会通河元起于梁山码头（今前码头村），终点临清，全长125公里——比隋唐大运河缩短900公里。前集村明清防御式古村——S形街巷、丁字形交叉相通不相对，利于防御。", "h": "\u003cp class=\"main-text\"\u003e寨墙依山脊修筑——块石垒成，底宽约2米，高约1.5米，南临悬崖边缘，东西北三面各有两重石墙，只有北门一门。因年代久远大部分倒塌，个别地段存残段——从内墙看不高，从外墙看高达2米。宋政和中（1111-1117）宋江&quot;保据于此&quot;，明崇祯十五年（1642）崇祯帝禁《水浒传》，对梁山&quot;勒石山巅，垂为厉禁&quot;——山上建筑遭毁灭性破坏。西汉：梁山原名良山——汉梁孝王北猎良山，因改为梁山。隋大业四年（608）：隋炀帝开永济渠——东征高丽。东晋太和四年（369）：桓温北伐，开挖桓公沟——沟通泗水、汶水与济水，奠定济州河基础。元至元二十年（1283）：济州河挖通——济宁鲁桥至梁山小安山西南码头，全长75公里。元至元二十六年（1289）：会通河开挖——寿张县尹韩仲晖、边源建议，自码头为起点分梁山泺水源，经寿张、聊城125公里至临清会御河。元世祖忽必烈赐名&quot;会通河&quot;——比隋唐大运河缩短900公里，修通后北调南粮占全国税粮5/6。元至正年间：济州河与会通河衔接——码头村成为运河枢纽。明永乐九年（1411）：疏浚会通河——开河闸建立，开河镇成为运河名镇。明正德年间：《水浒传》成书刊刻——宋江寨故事流传。明崇祯十五年（1642）：崇祯帝严禁《水浒传》——对梁山&quot;勒石山巅，垂为厉禁，清丈其地，归之版籍&quot;。清初：黄河夺运——梁山泊逐渐淤为平原。清咸丰五年（1855）：黄河改道——梁山泊旧址成为东平湖平原。1958年：东平湖平原水库建成——梁山泊旧址大部分被淹。现状：宋江寨墙残段、前集村（省级历史文化名村·明清防御式古村）、开河镇（运河历史文化名镇）、大元新开会通河记事碑（县级文保）、前码头村（会通河起点）、水泊梁山风景区（4A）。梁山水浒运河遗迹      现状。宋江寨（虎头峰）      虎头峰顶·宋江聚义大本营·海拔197.9米·石寨墙底宽2m×高1.5m·残存·宋政和中。宋江寨墙            虎头峰·块石垒成·椭圆寨墙·底宽2m高1.5m·南临悬崖·东西北三重石墙·仅北门。忠义堂            宋江寨内·1983年清理房基·重建·36根立柱+72根围廊柱·象征天罡地煞。前集村            水泊街道·明清防御式古村·省级历史文化名村·S形街·丁字形胡同·刘家大院。开河镇            县城东南26km·运河古镇·元代置闸·明清繁盛·百步一庙·荣氏&quot;德兴&quot;银号流通六县。大元新开会通河记事碑  前码头村·元至元二十六年·龙头龟座·碑高2.68m·县级文保·2003年试掘。前码头村            济州河与会通河交汇·元代运河枢纽·地下码头遗迹·县级文保。靖忠庙            宋江寨前院·仿宋歇山式·面阔5间·宋江庙·宋代敕封。&quot;我家刘家大院是明朝崇祯年间建的——祖上当过梁山忠义堂的义兵总管。大院有个看家楼，高10米，青砖灰瓦，我小时候常爬上楼顶瞭望——能看到山下的开河镇和运河。文革时大队要拆楼炼砖——是我爷爷把族谱和祖训拿出来给大队支书看，支书说&#x27;保下吧，留个念想&#x27;。现在看，那楼是前集村最高的建筑，也是全村的&#x27;风水柱子&#x27;。&quot;。&quot;我爹就是运河上的船工——给漕船拉纤的。我爹说，乾隆下江南就是在开河闸停靠的——乾隆亲笔给开河镇写了&#x27;运河古镇&#x27;的匾，挂在镇公所门头上。文革时被红卫兵砸了——我爹当时在供销社当售货员，偷偷捡了半块写着&#x27;镇&#x27;字的木头藏在床底下。后来木头发霉烂了，他伤心了好几天。现在我家还供着运河老船神的牌位，逢年过节烧香磕头。&quot;。&quot;2002年考古队来挖大元会通河碑——我当时就在旁边帮忙挖土。挖了两天才挖出碑头，龙头造型，雕得特别精细——龙鳞都能看清。碑身埋在地下两米，只有上部0.6米露在外面。碑头和碑身是分开的——当年黄河泛滥时冲的。考古队要拉到县博物馆去展——村民拦着不让，说这碑是我们村的根。最后协商，县博物馆做了个玻璃钢复制品放村里，原碑存博物馆。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宋江寨寨墙（虎头峰·北宋·石砌寨墙残存）：梁山主峰虎头峰上——虎头峰海拔197.9米，山势呈三角形，东、西、南三面危岩壁立，峭不可攀，唯有峰北一条临涧傍崖蜿蜒山道。顶端开阔平坦约15亩。北宋末年宋江等聚义的大本营就在这里——清初寿张县令曹玉珂登梁山作《过梁山记》记述有&quot;梁山宋江寨&quot;。1985年考古队对宋江寨及寨内建筑遗址考古——发掘出筒瓦、板瓦等古代建筑材料，经鉴定为汉代皇宫建筑材料——宋江上梁山时这里已有建筑物。；前集村（省级历史文化名村·明清防御式古村）：水泊梁山风景区南麓，与水浒前寨仅一涧之隔——刘家大院为明清官宦世家，前集村村民多为明末清初由梁山忠义堂旧址迁来的义军后人。村落在防御设计上独具匠心：&quot;S形街&quot;、&quot;丁字形交叉胡同，相通而不相对&quot;——外敌入侵时，难以长驱直入，处处遇阻，村落内部可通过交错胡同迂回旋转，对敌形成迂回包围。刘家大院为三进四合院，带看家楼（明崇祯年间建，高10米，青砖灰瓦，砖雕精细）——现为省级历史建筑。；开河镇（运河历史文化名镇·元代置闸·明清繁盛）：县城东南26公里，运河穿村而过——元代置开河闸，设开河驿，明清设开河镇，是运河上的重要漕运枢纽。乾隆每次下江南都在开河停靠上岸驻留——当地人曾有乾隆亲笔题写的字匾。开河镇因繁盛建有围墙，设四门，又在丁字形大街三面建了三个哨门——阁楼下门洞深广、铁门启闭有时。镇上店铺林立：粮行、油坊、当铺、药铺、旅店、酒店、茶馆、餐馆等二十余家。荣氏家族&quot;德兴&quot;银号的纸币可在周围六个县及济宁州流通——开河镇被称为&quot;百步一庙&quot;，关羽庙就有五所，古庙址二十余座。；大元新开会通河记事碑（县级文保·元至元二十六年·龙头龟座）：前码头村东北侧地下，1996年县文物普查时发现，2002年试掘，2003年公布为县级文保。碑高2.68米，碑文26行，满行71字——翰林直学士杨文郁撰文，礼部尚书张孔孙书丹，兵部郎中李处巽撰额。碑文详细记载会通河开挖的背景、用工、用料及全过程——会通河起于梁山码头，止于临清，全长125公里，修31座节制闸，元世祖忽必烈赐名&quot;会通河&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌前集村刘家大院后人刘大伯（70岁）：\u003cbr\u003e▌开河镇开河闸老船工李老汉（82岁）：\u003cbr\u003e▌前码头村村民老周：\u003c/p\u003e"}, {"n": "阳谷老城·狮子楼·景阳冈·运河三镇", "s": "阳谷", "p": "山东", "w": "武松打虎·狮子楼斗杀西门庆·阿城盐码头·七级粮码头《水浒传》120回有8回写阳谷·黄河与大运河交汇处·三镇运河名镇·水浒与运河的交点——阳谷有1400年建县史，黄河穿南部、大运河经东部——极贫与极富的对照，造就了水浒故事与运河文化的碰撞。狮子楼始建于北宋末期，因武松斗杀西门庆名扬天下——1984年按宋代风格重建，茅盾题匾额。张秋、阿城、七级运河三镇，明清时&quot;南有苏杭、北有临张&quot;——张秋号称&quot;小苏州&quot;，阿城是盐码头（银阿城），七级是粮码头（金七级）。", "h": "\u003cp class=\"main-text\"\u003e1958年重建为二层砖木结构仿清代建筑，1984年按宋代风格设计重建——二层五开间三进深，高约15.8米，青砖绿瓦，雕梁画栋，硬山顶覆灰筒瓦，屋脊装饰吻兽，檐下斗拱密集。全木结构，没用一个铁铸体，完全靠卵榫吻合。门柱上楹联：&quot;惩恶除暴英雄浩气贯日月，阅古鉴今斯楼坦荡警后人&quot;。著名文学家茅盾（沈雁冰）题写匾额。武松庙始建于明代中叶，距今500余年——3间起脊，单檐带廊，青砖灰瓦，朱门红窗，古朴典雅。清代增建、1958年重修、近年重建。景阳冈现为旅游区——&quot;三碗不过冈&quot;酒店（复原）、虎啸亭、碑林、武松打虎处石碑、武松石像等。整个景区恰似卧虎形状——武松庙为卧虎头，虎啸亭是前肢，武松打虎处在腰部。隋开皇十六年（596）：置阳谷县——阳谷之名始见，因县境内有阳谷亭得名。唐乾宁二年（895）：朱全忠击郓帅朱瑄，战于梁山——阳谷为古战场。北宋徽宗年间（1100-1126）：狮子楼始建——西门庆为镇邪压惊盖起狮子楼，楼前雕一对红眼石狮子。北宋末/南宋初：景阳冈武松打虎——施耐庵《水浒传》取材于此。明清：大运河阳谷段漕运繁荣——张秋镇设荆门闸，为漕运枢纽；阿城为盐码头（银阿城）；七级为粮码头（金七级）。明中期：景阳冈武松庙始建——《阳谷县志》载&quot;景阳冈&quot;在县城东40里，沙丘起伏，古木参天。清初：祝家庄改竹口——当地人忌说&quot;三打祝家庄&quot;，改称竹口或祝口，独龙冈因黄河改道消失。清末/民国：运河漕运衰落，城墙损毁。1930年代：阳谷城墙基本无存。1958年：狮子楼重建为二层砖木结构仿清代建筑；祝家庄塔（唐尉迟敬德鞭形塔，18层）在文革中被毁。1984年：狮子楼按宋代风格重建——二层五开间三进深，青砖绿瓦，斗拱飞檐。现状：狮子楼（市文保）、景阳冈（省文保·武松庙明中期始建）、文庙（近千年历史）、张秋镇（运河历史文化名镇·荆门闸石砌闸槽燕尾铁扣）、七级镇、阿城镇遗址、紫石街、祝家庄遗址、水浒文化博物馆。阳谷水浒运河遗迹      现状。狮子楼            老城区十字街西南角·宋始建·1984年按宋风格重建·二层五开间·高15.8米·茅盾题匾·市文保。景阳冈            县城东40里·武松打虎处·明代摩崖&quot;景阳冈&quot;·武松庙明中期始建·省文保·碑刻&quot;武松打虎处&quot;（宋末）。阳谷文庙          县城内·近千年历史·&quot;千秋阳谷&quot;文化园·儒家+孙膑兵家。张秋镇            运河名镇·&quot;小苏州&quot;·荆门闸石砌·燕尾铁扣·镇内设九门九关厢·七十二条街·八十二条胡同。七级镇            运河粮码头·&quot;金七级&quot;·漕运鼎盛期·粮船云集。阿城镇            运河盐码头·&quot;银阿城&quot;·明清食盐集散地·盐业会馆遗址。紫石街            狮子楼南200米·宋代建筑商业步行街·三厘米紫石铺路·水浒雕塑·全国最长宋风步行街。祝家庄            城西原独龙冈·后改祝口/竹口·塔在文革中毁·仅存遗址·村民忌说&quot;三打祝家庄&quot;。&quot;我研究水浒在阳谷的故事40年——景阳冈现在成了一片缓起的沙冈，古木还剩一些国槐。原来的9岭18堌堆，因为黄河改道，有的被冲平了，有的被淤了。武松打虎处那块碑，我1968年还亲眼见过它立在景阳冈上——文革时被红卫兵推倒，碑角砸裂了一道。后来我偷偷用布包好埋在自家后院，1980年才交给县文保所。现在那块碑就在景阳冈旅游区里，还能看到那道裂纹。&quot;。&quot;我爹是运河上的老船工——给漕船拉纤的。我1960年代也拉过——那时候运河水还深，能跑大木船。荆门闸的条石，我年轻时常摸——每块上面都有燕尾槽铁扣，紧紧箍着，600年没松过。我爹说，造闸的工匠是从苏州请来的，凿一块条石要10个壮劳力干一天。现在闸还在——只是运河水浅了，不能走大船了。&quot;。&quot;我们村原来叫独龙冈——就是水浒里的祝家庄。村民都忌说&#x27;三打祝家庄&#x27;——所以改叫祝口、竹口。祝家庄塔是唐朝尉迟敬德修的，18层8角，每层有钢铃——我小时候还上过塔，塔心是木梯子，蹬着嘎吱嘎吱响。文革时塔被拆了造窑——我亲眼见的，炸药炸响后，塔身倾斜了好几天才倒。现在只剩塔基，上面长了棵老槐树。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e狮子楼（市文保·北宋始建·武松斗杀西门庆地标·茅盾题匾额）：阳谷县老城区十字街西南角。据传此地古为酒楼，始建于北宋末期，距今约八百余年。《水浒传》载武松在此杀死恶霸财主西门庆——狮子楼因得美名传世。宋代传说：宋仁宗年间恶霸西门庆霸占赵润春之女秀姑，成亲之夜秀姑灌醉西门庆点火烧屋，西门庆未被烧死——为镇邪压惊，听从风水先生建议盖起狮子楼，楼前雕刻一对红眼披鬓呲牙咧嘴的石狮子。；景阳冈武松庙（省文保·明中期始建·水浒武松打虎发生地）：县城东40里，沙丘起伏，莽草无涯，古木参天。原有9岭18堌堆，景阳冈在东沙堌堆和西沙堌堆之间。武松打虎处碑——景阳冈村中石碑（现移旅游区内），墨玉色，上刻&quot;武松打虎处&quot;五个行书大字——经考证为北宋末年或南宋初期所立，碑阴大部分字迹模糊。；张秋镇荆门闸（运河石砌闸·燕尾铁扣·运河四大名镇之一）：阳谷县张秋镇。明清时期漕运枢纽，称&quot;小苏州&quot;——建闸后几百年，排队过闸船只不计其数。素有&quot;南有苏杭、北有临张&quot;之称，赢得&quot;小苏州&quot;美誉。镇上设九门九关厢、七十二条街、八十二条胡同——京杭运河上的五商埠之一。荆门闸为石砌节制闸，条石之间用燕尾槽铁扣紧箍——每块石条凿出燕尾凹槽，铁扣嵌入，极为牢固。镇中曾有107位进士当过闸官——见《阳谷县志》。；紫石街（全国最长宋代建筑商业步行街）：狮子楼南200米。路面全部用3厘米厚的紫石铺设——两侧飞檐翘角宋式商铺、茶馆、酒肆、药铺。街中心有五组水浒故事雕塑——武松打虎、李逵坐衙、王婆说媒等。紫石街与狮子楼、文庙连成阳谷&quot;千年古城&quot;宋代街区——武大郎家、孙二娘客栈、王婆茶馆、冷酒馆、银匠铺等《水浒传》场景在此复原。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌阳谷县志办退休干部刘主任：\u003cbr\u003e▌张秋镇老船工王老汉（80岁）：\u003cbr\u003e▌祝口村村民老乔（65岁）：\u003c/p\u003e"}, {"n": "东明老城·庄子故里·黄河三迁", "s": "东明", "p": "山东", "w": "西汉东昏·金避河迁冤句·明弘治迁大单集·庄子墓灵泉井黄河决口改道的&quot;受害者&quot;·县治三置两废、四设治所、五次迁徙的活标本——东明自西汉建元元年（前140）置东昏县，历两千余年，因黄河泛滥被迫五次迁徙治所，直到明弘治三年（1490）才固定在今县城（大单集）。庄子故里——庄寨村北庄子墓、灵泉井、清乾隆&quot;先贤庄子例应优免差徭碑&quot;尚存。七十二牌坊明末尚存40余座——文革中全部拆毁，仅文庙棂星门幸存。", "h": "\u003cp class=\"main-text\"\u003e西汉建元元年（前140）：置东昏县——秦始皇东游至此忽昏雾四塞，因名&quot;东昏&quot;，治所在今河南兰考境。新莽建国元年（9）：改名东明——东明之名首次出现。东汉：复为东昏县。曹魏：废为镇。宋乾德元年（963）：复置东明县——治东昏镇（今河南兰考），属开封府。金兴定二年（1218）：避黄河水患迁治——从东昏镇迁至冤句县故地（今东明集镇），设四门（朝阳/迎爽/户牖/东昏）。明洪武初：黄河再犯，徙治云台集——旋被淹没，县治又废。明弘治三年（1490）：仍以故地设县——县城设在大单集（即今东明县城），至今已536年未动。建城墙七里四十步，高二丈五尺，护城河深一丈五尺、宽六丈。明天启四年（1624）：《徐州志》载东明城墙周长7里40步，高2.5丈，四门：东&quot;东作&quot;、南&quot;南讹&quot;、西&quot;西成&quot;、北&quot;迎恩&quot;。民国时期：城墙遭战乱破坏。1946-1948年：东明城曾四次易手，城垣渐破。1958年：拆城墙建炼油厂——墙砖被大量拆走。文革：文庙棂星门被毁。现状：仅存护城河遗址、庄子故里（庄寨村·省级文保）、东明县衙大堂（文革后重建）、护城河西段落水段已修复。东明黄河迁徙遗迹        现状。东明县城（今址）      大单集·明弘治三年筑·城墙七里四十步·护城河仍存·城墙全毁。旧东明（一）        河南兰考境·西汉东昏县·金兴定二年遭黄河泛没。旧东明（二）        东明集镇·金兴定二年迁治·150余年·后迁云台集。旧东明（三）        云台集·明洪武初·旋遭黄河泛没·遂废。庄子故里（庄寨村）    县北菜园集乡·庄子墓/庄子观/灵泉井·清乾隆立&quot;先贤庄子例应优免差徭碑&quot;·省文保。漆园故址            县北裕州屯村·庄子为吏处·《庄子》成书地。东平王墓            西汉东平王刘宇墓·县城西·汉墓群。县衙大堂            明弘治三年始建·文革被拆·1980年代重建·砖石结构。护城河遗址          今县城一周·西护城河已修复·清澈见底·两岸仿古亭台。七十二牌坊          明48座·1933年存40余座·1948年黄河抢险拆一部分·建国后又拆·文革全毁·仅文庙棂星门幸存（后毁）。&quot;全村320户，姓庄的占98%——族谱上明确写着&#x27;先秦思想家庄周后裔&#x27;。每年清明，海内外庄氏后人组团来祭祖——从台湾、香港、新加坡来的都有，每次一两百人。我爷爷说文革时红卫兵要砸庄子观——是全村人把观里的庄子像藏在红薯窖里，把碑埋在村西头的老槐树下。80年代重修观时，我们把碑挖出来——上面还沾着红薯窖里的泥。现在那碑就在庄子观的院子里，立得端端正正。&quot;。&quot;我80年代刚参加工作时，西护城河是个臭水沟——菜叶子、鸡下水、塑料袋全在里面漂，夏天不敢开窗。2020年县里决定修复——花了整整800天，清淤、砌石、铺底、种荷花。现在能看到鱼了——上次我还看见有人在河边钓上一条半斤重的鲫鱼。我现在每天晚饭后都去河边散步——想起当年的臭水沟，简直像换了一个世界。&quot;。&quot;1958年大炼钢铁拆城墙——我父亲是生产队队长，带着人去拉墙砖。我记得那砖比现在的重多了，一块要两个壮劳力抬。拉了一个月，我家后院堆了半墙——后来盖猪圈用了。现在我家猪圈上还嵌着三块带&#x27;弘治三年造&#x27;戳记的砖——我儿子说那是文物，让我别拆。我哪能拆啊——那是我爹当年拉的，上面有他的汗水。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e庄子故里（省文保·战国道家创始人·庄寨村北·墓/观/灵泉井）：县城北菜园集乡庄寨村，北依黄河大堤，南临古濮水，左望钓台，右傍漆园。庄子观（南华观）唐贞观二年（628）始建，历唐宋元明清屡经重修——清朝年间占地4公顷，楼台亭榭、假山绿水、幽径雅竹，后屡遭兵燹洪水破坏。1988年庄寨村庄子后裔发起重建——鲁豫两省四县十村的庄姓纷纷捐款，历时一年始成。观后20米即是庄子墓——墓碑屹立，右有灵泉井。灵泉井：清康熙十一年（1672）重修庄子观时，启土约五尺，出泉一窟，深可丈余，清冽异常——乡人取以医疾，称&quot;庄子之灵&quot;。清乾隆五十五年（1790）大名正堂立&quot;先贤庄子例应优免差徭碑&quot;——至今尚存，碑上刻着庄氏后裔免差徭的优待。；东明护城河水系（明弘治三年筑·西护城河已修复·市民公园）：护城河深一丈五尺、宽六丈余——西护城河近年已完成修复，河水清澈见底，两岸用石块砌就，护栏仿石雕制，灰瓦白墙挑檐攒脊的仿古屋、亭台、廊榭点缀其间。老东明人记得西护城河&quot;臭水沟&quot;年代——80年代西城墙南半截被开辟成菜市场，烂菜叶、鸡鸭下水全丢进护城河，霉臭味扑面而来，小孩路过不敢吸气。现在的护城河，夏季能看到鱼跳出来——老人们常坐在河边的石凳上下棋、聊天。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东明县衙大堂（明弘治三年始建·文革后重建）：明弘治三年（1490）筑县城时创建——三进院落，大堂面阔五间，进深三间，青砖灰瓦，硬山顶。文革中大堂被拆——1980年代由县文物部门牵头重建，恢复了明式形制。大堂内还存着一块清康熙年间的石碑——记载康熙三十六年东明知县杨日升重修县衙的经过。现在县衙是县公安局办公楼——大堂作为会议接待室，不对公众开放。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌庄寨村庄姓后人庄大伯（70岁）：\u003cbr\u003e▌西护城河改造亲历者王工程师（55岁）：\u003cbr\u003e▌东明老街坊刘奶奶（76岁）：\u003c/p\u003e"}, {"n": "鄄城老城·尧陵·孙膑故里·曹植陈台", "s": "鄄城", "p": "山东", "w": "尧葬榖林·陈王读书台·亘古清泉·孙膑墓&quot;尧葬榖林&quot;的真实所在·孙膑故里·曹植封鄄城王——鄄城素有&quot;古鄄&quot;之称，是中华民族发祥地之一——伏羲氏雷泽履迹生伏羲、舜耕历山、尧葬榖林。孙膑故里在鄄城县红船镇孙老家村——全村90%以上姓孙，族谱明确记载为孙膑后裔。陈台（陈思王读书台）是曹植封鄄城侯/王时的读书处——《赠白马王彪》、《洛神赋》都写于鄄城时期。明代万历四十八年立&quot;亘古清泉&quot;碑——为水井立碑，千年罕见。", "h": "\u003cp class=\"main-text\"\u003e尧葬榖林的记载始见于秦代《吕氏春秋·安死》：&quot;尧葬于榖林，通树之。&quot;——榖林就是榖林庄村。明代帝王陵布局：陵区绕陵墙、享殿三间、东西朝房、更衣亭；清光绪二十九年（1903）濮州知州谬润绂书&quot;帝尧陶唐氏墓&quot;碑，现仍立于墓前。尧葬榖林（据《吕氏春秋·安死》）：尧葬于榖林，通树之——鄄城富春乡榖林庄村南，龙山文化遗址14万平方米。西周：鄄属卫。春秋：鄄城是齐国鄄邑——齐桓公&quot;九合诸侯&quot;之一。战国：孙膑故里——红船镇孙老家村，1990年出土明嘉靖重修亿城寺墓碑&quot;膑墓址深邃&quot;。汉宣帝本始二年（前72）：始祭尧陵于鄄城。东汉元和二年（85）：帝使祀尧于成阳（鄄城旧名）。三国魏黄初二年（221）：曹植封鄄城侯——次年改封鄄城王。黄初四年（223）写《赠白马王彪》。黄初三年（222）：曹植徙封为陈王——鄄城仅居住二年，留下陈台、故城等遗迹。明万历四十八年（1620）：鄄城立&quot;亘古清泉&quot;碑——南大街水井立碑，捐资修井者百余人姓名刻碑。清乾隆元年（1736）：山东巡抚岳浚定榖林为尧陵旧址——自此官方祭尧陵于鄄城。1946年：鄄城易主——城垣遭破坏。1947年：刘邓大军强渡黄河——鄄城为渡河点之一。文革：尧陵享殿、孙膑祠等遭破坏。现状：尧陵（省文保·封土直径35米高9米）、孙膑故里（孙老家村·孙氏祠堂）、陈台遗址（杏花岗村·已夷为平地）、亘古泉（仍存·水清澈）、庄子钓鱼台（全国十大钓鱼台之一）、羊左全交墓（义士羊角哀左伯桃合葬墓）。鄄城古鄄遗迹        现状。尧陵            县西南7.5km富春乡榖林庄村南·封土直径35m高9m·省文保·龙山文化14万㎡·明嘉靖/清光绪碑。孙膑故里          县东北20km红船镇孙老家村·孙氏祠堂明始建·《孙膑兵法》故里·1990年出土明嘉靖墓碑。孙膑墓            孙老家村北·1990年出土重修亿城寺墓碑·墓丘直径8m封土高5m·孙氏族人重修。陈台（曹植读书台）  旧城镇杏花岗村西南·原高出地面数尺·40年代尚有台基·今夷为平地·遗址可辨。亘古清泉          老城南大街中段·明万历四十八年立碑·水清澈甘洌·仍存·县重点文保。庄子钓鱼台          县南·全国十大钓鱼台之一·庄子观北有灵泉井·唐贞观二年始建南华观。羊左全交墓        义士羊角哀左伯桃合葬墓·古鄄八景之一·&quot;羊左全交&quot;典故发生地。葵丘会盟台        齐桓公九合诸侯之一·春秋鲁僖公九年（前651）·遗址在旧城镇葵丘村。历山遗址          闫什口镇西3里·舜耕历山处·原高丈余·清代已无山形·仅历山庙遗址。鄄城老城区        旧城镇·明清濮州治所·民国鄄城县·1931年迁治今址·旧城格局残。&quot;我们村320户，290户姓孙——族谱上第一行写着&#x27;始祖孙膑&#x27;。文革时红卫兵要砸祠堂里的孙膑像——我爷爷是老支书，他说&#x27;砸就砸吧，但这族谱是我们的命根子，得藏好&#x27;。他把族谱藏在大队部的档案柜最底层，上面盖了一本《毛泽东选集》——硬是没被发现。现在那本族谱还在，线装手抄本，纸都黄了，但字迹清清楚楚。2008年孙膑兵法国际研讨会就在我们村开的——来了十几个国家的专家，看了族谱都竖大拇指。&quot;。&quot;我守尧陵50年了——从我爹手上接过来的，他守了40年。文革时尧陵的享殿被拆了——红卫兵要挖尧帝的墓，挖了两米就停了——说&#x27;这是龙山文化遗址，不能再挖了&#x27;。我爹当时就守在陵前的大槐树下——那棵树现在还在，比我刚来看的时候又粗了一圈。清明前后，海内外姓尧的、姓唐的后人都来祭祖——每年至少五六十人，从台湾来的也有。&quot;。&quot;我喝亘古泉的水喝了60年——这水跟城里自来水完全不一样，甜，烧开水不结水垢。有人说这井通地下河，连黄河水都能抽上来——当然我不信，但水确实好。文革时有人想填井盖房子——全村老头老婆围在井边不让填，说&#x27;这是曹操挖的、曹植喝过的，你们敢填试试&#x27;。后来生产队把井上盖了个水泥板，留了个圆口——就一直用到现在。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e尧陵（省文保·上古尧帝归葬处·龙山文化14万平方米·榖林庄村南）：鄄城县西南7.5公里富春乡榖林庄村南，东临榖林苗圃场院，南距金堤1公里。封土直径35米、高9米，其上遍生榖树。2015年菏泽曹州文物考古所勘探——尧陵修建在龙山文化遗址之上，龙山遗址平面呈椭圆形，南北最长约420米、东西最宽约330米，面积约14万平方米。文化层厚4.5米以上，中部堆积达10米——出土遗物包含明清、汉代、周代、龙山文化时期的陶片、骨头、烧土块、琉渣等。；亘古清泉（县重点文保·明万历四十八年立碑·千年古井·水清澈甘洌）：鄄城县老城区南大街中段路西——一口大水井，用水泥板覆盖，仅留直径约0.5米的圆口。井边有明代万历四十八年立碑一栋，上书四个斗方大字：&quot;亘古清泉&quot;——为水井立碑，实为古今稀有，冠以&quot;亘古&quot;二字更为罕见。碑阴刻捐资修井者百余人姓名——&quot;知此泉年代久远，二可知这里民风淳厚&quot;。据传此泉原是一汪泉水，因水质清澈甘洌招来百姓就近而居。曹操屯兵鄄城时，挖掘为井，取名&quot;亘古清泉&quot;——曹植曾饮此泉水酿的酒，写诗&quot;归来宴平乐，斗酒美十千&quot;。现泉水仍清澈甘洌，取之不竭。；陈台遗址（曹植鄄城读书台·旧城镇杏花岗村·已夷为平地·遗址可辨）：旧城镇东北1公里许，杏花岗村西南——曹植于魏文帝黄初二年（221）封鄄城侯，次年改封鄄城王。在此台读书、吟诗赋文。原台台前有十数级台阶，台上有读书厅、藏书室和会文亭，从王府到读书台通有长廊。清代犹存高出地面数尺的台基，上有残砖碎瓦。因黄河多次决口，读书台渐被淤没。现虽已夷为平地，然遗址尚可辨知——当地村民还能指出遗址四至，每年都有曹植爱好者来此觅踪凭吊。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孙膑故里（孙老家村·孙氏祠堂·1990年出土明嘉靖墓碑）：鄄城县东北20公里红船镇孙老家村——全村大多数人姓孙，族谱明确记载为孙膑后裔。孙氏祠堂始建于明代，文革中被拆——1992年孙氏族人捐资重建，内供孙膑画像和历代族谱。1990年考古队在村北向阳河东岸出土明嘉靖三十七年（1558）重修亿城寺墓碑——上刻&quot;膑墓址深邃&quot;，经专家多方考证，确定孙膑墓址在此。孙氏族人重修坟茔——墓丘直径8米，封土高5米，四周砌以围石，墓前树碑，篆书&quot;孙膑墓&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孙老家村支书孙书记（62岁）：\u003cbr\u003e▌尧陵守陵员王老汉（80岁）：\u003cbr\u003e▌亘古泉井边的老郑（75岁）：\u003c/p\u003e"}, {"n": "成武老城·伯乐故里·郜国水下古城", "s": "成武", "p": "山东", "w": "周代郜国·伯乐葬成武·文亭湖底埋城·大台堌堆8米西周姬姓郜国故城·伯乐（孙阳）故里·湖底的千年古国——成武是周文王之子、周武王弟弟的封地——西周首批姬姓诸侯国之一。1986年成武百姓在文亭湖内开挖鱼塘时，偶然发现一座千年古城——考古专家认定这就是周代郜国故城！全城现已深埋文亭湖底。文亭山是典型的鲁西南堌堆文化遗址——人工筑台避水而居，孔子弟子曾参和三冉曾在此以文会友，&quot;文亭山&quot;因此得名。伯乐相马的故事天下皆知——伯乐墓就在成武县伯乐集镇伯乐村。", "h": "\u003cp class=\"main-text\"\u003e周初：周武王封弟弟于郜国——西周首批姬姓诸侯国之一，地位尊崇。春秋战国：郜国沦为大国附庸。鲁隐公十年（前713）鲁齐郑伐宋&quot;取郜&quot;。秦：置成武县——秦属东郡，汉属梁国后属山阳郡。北齐：升为永昌郡。唐贞观十七年（643）：首次归属曹州。五代至金：属单州。元：复归曹州。明：属兖州。清：属曹州府。明嘉靖年间：护城大堤越筑越高——堤内地面因洪水淤积低于堤外2.5-3米。古城逐渐成为凹陷洼地，最终蓄水成湖——郜国故城深埋文亭湖底。1986年：成武百姓挖鱼塘时发现湖底古城——考古队勘探认定为周代郜国故城址。1992年：成武故城址（郜国古城）列为山东省第二批重点文保——东西宽3525米、南北长1800米、总面积632.5万平方米。现状：郜国故城深埋文亭湖底（需水下考古），护城大堤存，文亭山（堌堆）存，大台遗址（省文保·高8米），卧化塔（国保·唐塔），伯乐墓（市文保），成武县衙遗址（市文保·古城街西段）。成武堌堆郜国遗迹      现状。郜国故城（湖底）      文亭湖内·1986年发现·东西3525m×南北1800m·总面积632.5万㎡·省文保·待水下考古。护城大堤            全长约15700m·春秋时期夯窝·堤内外地面高差2.5-3m·明代越筑越高。文亭山（云亭山）      文亭湖内·堌堆文化·人工筑台·孔子弟子曾参三冉以文会友·&quot;文亭&quot;由此得名·高约10m。大台遗址（寿峰）      东关村东侧·堌堆·高8m·占地5000㎡·新石器至汉代·省文保。小台遗址            文亭湖东堌堆·隔河与大台相望·新石器至汉代。卧化塔              大田集镇田塔村东·唐贞观十四年（640）建·高22m·八棱七级·国保·第八批。伯乐墓              伯乐集镇伯乐村·春秋相马师孙阳墓·市文保·墓前有伯乐相马雕塑。成武县衙遗址          古城街西段·市文保·大堂东耳房/议事厅/九间楼照壁残·民国为日据点后为县委。玉皇庙（秺侯国）      伯乐集镇玉皇庙村北·新石器至汉·秺侯国都城·汉金日磾封地·韩国金氏寻根地。刘氏石坊/申氏石坊      清乾隆年间·白浮图镇/张楼乡·省文保·歇山顶四柱三门三楼。&quot;我在文亭湖边住了40年——小时候还能在湖里摸鱼。1986年那个夏天，村里挖鱼塘的在湖中间挖出了城墙砖——消息传开，整个成武都轰动了。县文保所的人来了，说这是郜国古城——埋在湖底下三千年了！我当时还去看了——那砖比现在的沉多了，刻着绳纹。后来鱼塘不让挖了，湖底用水泥封住了。现在我每天在湖边钓鱼——谁能想到我脚下2米深就是周天子弟弟的都城呢？&quot;。&quot;我守卧化塔30年了——这个塔怪，往西北歪，像个驼背老人。传说唐代建塔时，工匠听了个白胡子老头的话，故意让塔歪着——说&#x27;卧者化也，卧化塔卧着才能化&#x27;。文革时红卫兵要拆塔身的佛龛——爬上去砸了六个佛头，正砸第七个时，塔顶掉下来一块砖砸了脚——后来就没人敢再动了。2019年国务院批了国保——现在塔周围立了铁栏杆，游客不能再摸塔身了。&quot;。&quot;我们一直在等水下考古——郜国故城是成武最大的宝贝。1986年发现后做了试掘——探沟里挖出了春秋时期的陶鬲、陶豆残片，还有战国时期的铜箭头。但湖底水位一直很高，试掘到1.5米就停了。等技术条件成熟了，我们要让这个沉在湖底三千年的姬姓古国重见天日——632.5万平方米，比河南安阳殷墟还大，如果能发掘出来，那是西周考古的重大发现。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e郜国故城（湖底古城·省文保·待水下考古·文亭湖底632.5万平方米）：成武县文亭湖底——1986年成武百姓开挖鱼塘时偶然发现！考古队结合史料记载认定为周代郜国故城址——东西宽3525米、南北长1800米、总面积632.5万平方米。因黄河携带大量泥沙的洪水几度来袭，造成堤外地面不断增高，大堤也越筑越高——城内反而逐渐成了凹陷洼地，最终蓄水成湖。南堤土壤剖面可追溯到春秋时期——城堤夯窝跟曲阜鲁国故城城址基本一致。目前因地下水和技术条件限制，尚未全面发掘——成武博物馆馆长说有了水下考古就能全面勘探。如今文亭湖成了城市景观公园——碧波荡漾、荷香四溢，但谁能想到湖底埋着一个3000年前的姬姓古国都城？；文亭山（堌堆文化遗址·孔子弟子曾参三冉以文会友·&quot;文亭&quot;由此得名）：文亭湖内的一座&quot;人工小山&quot;——高约10米，实为典型的鲁西南堌堆文化遗址。4000年前先民为避黄河洪水，人工筑起土台，择高而居——后来转向筑堤护城，堌堆逐渐成为高地地标。孔子弟子曾参和三冉（冉雍、冉耕、冉求）曾在此以文会友——四人均位列孔门七十二贤，其中三冉又位列孔门十哲。后人在土丘上建&quot;会文亭&quot;——&quot;文亭山&quot;由此得名。汉高祖刘邦曾在此停留，时有祥云出现——故又名&quot;云亭山&quot;。现在文亭山上建有亭台楼榭，成了成武市民登高观湖的好地方。；伯乐墓（市文保·春秋相马师孙阳·伯乐集镇伯乐村）：县城西8公里伯乐集镇伯乐村——村因伯乐而得名，村中有伯乐祠，墓有石碑。唐代文学家韩愈以伯乐相马的故事为基础写下《马说》——道尽历代怀才不遇之人的心声。2019年成武县在县城西北建了&quot;伯乐相马&quot;雕塑——伯乐手握缰绳，身旁骏马昂首嘶鸣。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卧化塔（国保·唐贞观十四年建·山东现存最完整的唐代砖塔之一·八棱七级高22米）：大田集镇田塔村东100米——唐贞观十四年（640）建，因塔身向西北倾斜，当地人称&quot;卧化塔&quot;。八棱七级，通高22米，通体砖结构。每层檐下饰斗拱、佛龛——佛龛内有陶质浮雕佛像，可惜文革中大多被砸毁。塔基边长4米，第一层南面设券门。2019年国务院公布为第八批全国重点文保单位——也是成武县第一个国保单位。2009年曾对塔身进行过一次&quot;扶正&quot;——倾斜角度约1度，已基本矫正。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文亭湖公园退休工人王师傅（68岁）：\u003cbr\u003e▌卧化塔看护人李老汉（72岁）：\u003cbr\u003e▌成武博物馆郭馆长：\u003c/p\u003e"}, {"n": "德州老城·运河九达天衢·苏禄王墓", "s": "德州", "p": "山东", "w": "明洪武砖城形似靴·南门瓮城关帝庙·北厂漕仓遗址·董子读书台京杭运河三大粮仓之一·全国苏禄东王墓·九达天衢神京门户——德州自隋开皇六年（586）置长河县，因大运河永济渠开凿而崛起。明洪武三十年（1397）德州卫都督张文杰、指挥徐福率卫军历时两年建砖城——形似靴（故称&quot;靴子城&quot;），城周5100米、高12米、厚9米、护城河宽15米深6米。南门瓮城内有关帝庙、三义庙、娘娘庙建筑群——1951年整体拆除。明永乐十五年（1417）苏禄东王病逝德州——永乐皇帝以王礼厚葬，苏禄王墓现为全国唯一外国国王陵寝、国保单位。明清德州&quot;九街八巷二角&quot;为鲁北商业中心，清乾隆时城内街30、市2、商号400余家。", "h": "\u003cp class=\"main-text\"\u003e明洪武九年（1376）：设德州卫——5600名卫军，单独户籍&quot;军户&quot;。明洪武三十年（1397）：德州卫筑砖城——都督张文杰、指挥徐福历时两年。砖来自城南20里运河沿岸村——窑上村、伙房村即此得名。明永乐五年（1407）：增设德州左卫——两卫以建设街为线分治。明永乐九年（1411）：知州何原移德州治于卫城内——州卫同城而治。明永乐十五年（1417）：苏禄东王病逝德州——明成祖以王礼厚葬，墓地在北营村。明万历四十年（1612）：知州孙森大修州城——新筑门楼、谯楼、瓮各四座。清乾隆八年（1743）：发帑金14万两重建州城——历史三年，新筑门楼、谯楼、敌楼。城内有寺庙、庵、祠、坛、驿等70余处，官署衙门72处。1946年：德州易主后取城墙土筑运河河堤和道路。1947年：小西门广川门因战乱损毁，提前拆除。1949年春：扒掉部分城墙保障过境军队南下过境。1950年：大西门聚秀门拆除。1951年：南门朝阳门（含瓮城关帝庙建筑群）拆除。1958年：德州城东南角建提名塔（雁塔）拆除，东门长乐门拆除。1959年底：城墙和护城河大部拔除，部分护城河道成为市区景点。1961年：北门拱极门城楼和门洞拆除。1964年：城墙整体基本消失——仅城西北&quot;靴子尖&quot;小段土垣遗迹、新湖街道段城墙遗址残存。现状：苏禄王墓（国保·全国唯一外国国王陵寝）、北厂漕仓遗址（省文保）、窑上窑址（省文保）、运河残段、德州城墙遗址（省文保·新湖街道段100余米）、九达天衢坊（仿建）、董子读书台（仿建）。德州运河古城遗迹        现状。德州砖城（靴子城）      明洪武30年·城周5100m·高12m·厚9m·仅城西北靴子尖小段土垣遗迹+新湖街道100m砖石残。南门朝阳门（瓮城）      1951年整体拆除·瓮城关帝庙/三义庙/娘娘庙/钟楼建筑群全毁。大西门聚秀门          1950年拆除·小西门广川门1947年毁。东门长乐门            1958年拆除。北门拱极门            1961年拆除城楼门洞。苏禄王墓              城北北营村·明永乐15年·国保·东王都马含巴剌病逝以王礼葬·守墓人后裔至今。北厂漕仓遗址          城西北北厂村·金元明清·省文保·漕运粮仓·德州运河四大粮仓之一。窑上窑址              城南黄河涯镇窑上村·明·省文保·德州城砖烧造窑场·&quot;窑上村&quot;得名。董子读书台            明建·清乾隆帝赋诗·原址运河西岸·清末废墟·现代仿建经开区。九达天衢坊            明·运河门户地标·原九达天衢石牌坊遗迹·现代仿建。竹竿巷              城西江畔·明清运河北段最大竹器加工基地·清末民初商户40余家·现存老院落。德州卫署/州署          建设街北段·明清行政中心·70年代片区改造整体拆除。&quot;我是温哈剌的后裔——传了22代了。我家就在苏禄王墓旁边住，每天早上去扫墓，50年没断过。文革时红卫兵要挖苏禄王的墓——说&#x27;这是帝国主义走狗的墓&#x27;。我当时20多岁，和全村18个青年守在墓门前，手拉手围成一圈。红卫兵骂我们是&#x27;海外走狗后代&#x27;，但就是没动手——后来据说上头有人打电话说&#x27;苏禄王是国际友人，不能挖&#x27;，就不了了之。现在菲律宾每年都有王室后人来祭祖——2019年来了一个公主，跪在墓前哭了半小时。&quot;。&quot;我爹是竹竿巷最后一代竹匠——70年代公私合营进了竹器厂。我80年代初还学了两年——那时候一把竹丝刀要磨3天，削出来的竹丝细如头发。后来竹器厂倒了，没人买竹筐了——现在全巷只剩我一家还做竹器，主要给景区做些摆设品。前几年有个大学生来拍纪录片——说德州竹竿巷比苏州的还早100年，我说你别吹了——我爹说光复前巷里有400多家，现在就剩我1家。&quot;。&quot;我爹是漕船上的老船夫——给北厂漕仓卸粮的。我1958年也当过运河上的船工——那时候运河水还能跑大木船。北厂漕仓有36个粮仓——每个仓能装50万斤粮食。我爹说，清代道光年间有一次漕船排了5里长——南方来的粮船、北京来的官船、德州的商船，挤得运河水都不动了。现在漕仓成了省文保——我去年还进去看了一眼，仓底还能看到当年的木桩槽。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e苏禄王墓（国保·明永乐十五年·全国唯一外国国王陵寝·北营村守墓人后裔）：城北北营村——明永乐十五年（1417）苏禄国东王都马含巴剌率300人使团跨海来朝——这是有文字记载的最早菲律宾国王访华。访问结束归国途中，东王不幸染病在德州病逝。永乐皇帝闻讯悲痛，下旨以王礼厚葬东王——墓道南向，陵墓为土丘，冢高2米，直径8米，墓南立有&quot;苏禄国恭定王墓&quot;石碑。永乐皇帝还赐东王次子温哈剌、三子安都鲁及侍卫十人留居德州守墓——守墓人后裔至今仍在北营村，已发展到数百人，清代雍正年间入中国籍，民国时以&quot;温、安&quot;二姓居之，后多数改姓&quot;王&quot;。2005年菲律宾苏禄王室后裔访华祭祖——&quot;寻根之旅&quot;持续至今。；德州北厂漕仓遗址（省文保·金元明清·德州运河四大粮仓之一）：城西北北厂村——金代始建，元代扩建——是德州运河沿线最大的漕运粮仓。明清德州为运河四大粮仓之一、全国33个重要工商城市——南粮北运至此中转，北厂的粮食仓廒连接运河码头，漕船可直接靠岸卸粮。现遗址面积约2万平方米——地面还能看到散落的仓基砖、柱础石。考古队曾在此挖掘出金元时期的陶质粮仓模型。；竹竿巷（城西江畔·明清运河北段最大竹器加工基地）：城西运河东岸——德州不产竹子，但明清时期竹木加工业却很发达——因允许漕船搭载一定数量的私货，江南漕船运竹木沿运河发卖，给德州提供了充足的竹器加工原料。清末民初德州竹竿巷商户已达40余家——产品有水旱筛子、箩筐、筷子、竹帘、竹席、竹轿、鸟笼等。德州成为运河北段最大的竹器生产基地和销售市场——&quot;南来北往的客商，每到德州必逛竹竿巷&quot;。现在巷内还存着清末民初的老院落——青砖灰瓦，木窗棂上还能看到当年的商号招牌痕迹。；窑上窑址（省文保·明代德州城砖烧造窑场·黄河涯镇窑上村）：城南20里黄河涯镇窑上村——明洪武三十年（1397）筑德州城时，烧砖的窑场就在这里。当时卫军历时两年建砖城——砖需要300万块以上，窑场日夜烧造，工匠们的伙房就在窑场旁边——&quot;窑上村&quot;、&quot;伙房村&quot;因此得名。现遗址面积约1.5万平方米——地面散落着大量明代城砖，砖上有&quot;洪武三十年造&quot;戳记。考古队清理出明代窑炉遗迹——马蹄形窑，长4米、宽2.5米，炉膛内还能看到烧剩的煤渣。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏禄王墓守墓人王老爷子（78岁）：\u003cbr\u003e▌竹竿巷老竹匠张师傅（65岁）：\u003cbr\u003e▌北厂村老船工李老汉（82岁）：\u003c/p\u003e"}, {"n": "武城老城·运河三迁·古贝州", "s": "武城", "p": "山东", "w": "宋大观迁东岸·黄河决口淹西岸·焕光大桥·故城遗址226万㎡·董仲舒下帷讲学武城&quot;三迁&quot;是运河与黄河争斗的缩影——战国东武城（平原君封地）→ 隋永济渠西岸唐迁 → 宋大观二年（1108）黄河冲毁西县城东迁运河东岸（即今武城老城镇，存世865年）→ 1964年运河为界分冀鲁 → 1973年迁东北新城。武城与故城本是一家人——运河以西是河北故城，运河以东是山东武城，1964年国务院以卫运河为界拆分。2024年在河北故城发现了唐宋武城治所遗址（226万平方米）——河北省新增第七批省保。", "h": "\u003cp class=\"main-text\"\u003e战国：东武城（赵国平原君赵胜封地）——&quot;筑城备武&quot;，是赵齐交界要塞重镇。秦始皇统一：设武城县——西汉高帝四年（203）置清河郡，东武城属之。唐调露元年（679）：县城迁至今河北故城关庙村——紧挨着永济渠西岸，热闹码头。宋大观二年（1108）：黄河决口，西县城被冲毁，城墙倒，百姓搬高处——县城不得不东迁运河东岸（即今山东武城县老城镇），自此一直到1973年，武城县城在运河东岸屹立865年。元至元元年（1264）：北部置故城县（今河北衡水故城县）——元明清属河间府。1964年：国务院以卫运河为界，河西划河北故城，河东留山东武城——武城县运河西岸大部分区域划归故城县。1973年：卫运河拓宽，老县城需拆迁——武城县政府迁东北20公里重建新城（武城镇），原址老城镇。2010年：武城老大桥（焕光大桥）列入县级文保——全长150米，1958年始建，前苏联设计图纸，主孔跨度50米。2014年：老武城遗址（焕光大桥东岸河滩遗址）列为市级文保——遗址在运河东大堤外，宋大观迁来后在此建城。2022年：河北故城军屯镇关庙武城遗址发现——面积约226万平方米，唐调露元年至宋大观年间的武城县治——河北省启动勘探，2024年列入第七批省保。现状：焕光大桥（县级文保）、老武城遗址（市级文保）、故城武城遗址（河北省保·226万㎡）、董学村（董仲舒下帷讲学遗址·明万历立碑）、四女寺水利枢纽（运河节制闸）。武城故城运河遗迹        现状。战国东武城          河北故城军屯镇·平原君封地·夯土城·残存痕迹。唐-宋武城县城（西）    河北故城军屯镇关庙村·2022年发现·面积226万㎡·2024年河北七批省保·唐679-宋1108。宋-1973武城县城（东）  山东武城县老城镇·1108-1973·865年·城墙全毁·仅古城格局可辨·1973年迁新城。故城（另县）          河北衡水故城县·南宋景定五年（1264）置·运河西岸·与武城河东河西相邻。焕光大桥（老桥）      武城县老城镇·1958年建·苏式图纸·主孔跨50m·县级文保·原武城县城横跨运河。董学村（下帷讲学）    故城县房庄镇董学村·董仲舒青年下帷授徒处·明万历立碑&quot;董仲舒下帷授徒&quot;。郑口运河挑水坝          故城县郑口镇·清道光年间修·6座砖石坝·全国重点文保·长方形/菱形/梯形·不同形状对付不同水流。运河船工号子          省级非遗·元代开始·鼎盛明清·纤夫拉纤/船工摇橹时喊的号子·现已衰落。古贝州遗址            武城县广运街道·南北1800m×东西1000m·高出周围·中心汽车站十字路口·陶器/唐代绞胎瓷。&quot;我爹是运河上的老船夫——给漕船拉纤的。1964年分省的时候，我爹说&#x27;这条河原来是我们郑口镇的，现在一半给河北、一半给山东——河还是那条河，水还是那股水，可人变两省了&#x27;。我现在还能背船工号子的调——&#x27;嘿哟嘿哟！前面的走哇！后面的跟上啊！&#x27;——元代开始喊，明清鼎盛，现在没几个人会了。前两年县文化局录我喊号子——说要申报省级非遗，录了整整两天，录了三段。&quot;。&quot;我经常从山东武城过桥去河北故城——桥中间有块牌子写着&#x27;鲁冀界&#x27;，拍照留念的人不少。我爹说这桥1970年代还窄得只能过一辆卡车——我小时候过桥，自行车车把能蹭到桥栏杆。2009年桥加固重修，加宽到能并排跑两辆卡车。现在桥两头的收费站早就撤了——但我每次过桥还是会减速——毕竟这桥承载了武城和故城几代人的记忆。&quot;。&quot;我家就是董学村的——族谱上写着&#x27;董仲舒后裔&#x27;，全村320户有180户姓董。明万历那块碑就在村头的泰宁寺里——文革时被推倒了，埋在村西头的机井旁边。2023年挖出来时，碑上的泥还没擦干净，&#x27;董仲舒下帷授徒&#x27;几个字还能看清——我当时在场，心里激动得直跳。现在碑立在村头的董仲舒文化广场上——每年清明，全村姓董的都要去碑前祭拜。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e故城武城遗址（河北第七批省保·2022年发现·226万平方米·唐宋武城治所）：河北衡水故城县军屯镇关庙村、杨寺村和建国镇马寺村一带——面积约226万平方米，是唐调露元年（679）至宋大观年间（1107-1110年）的武城县治所。遗址于2022年被发现，2024年启动勘探——以永济渠故道为界分为南北两区：北区为城址区（南北长约1100米、东西宽约600米，南部发现城垣遗迹）；南区南北长约300米、东西宽约500米，未发现城垣。文化层厚2-3米——遗物以邢窑、巩县窑、定窑、越窑、磁州窑等多地瓷窑瓷器为主，凸显武城作为运河重镇的水陆通道作用。；焕光大桥（县级文保·1958年建·前苏联设计·主孔跨度50米·武城-故城两省桥）：武城县老城镇东运河上——1958年国家清淤拓宽运河，同时由山东省交通厅承建，使用前苏联设计的图纸——同期、同图纸施工的还有临清大桥。原桥全长仅150米，桥宽6米，主孔跨度50米——是武城县历史上第一座混凝土结构的大型公路桥。2009年桥体加固重修，增加了人行道和防护栏——现在仍能通行。大桥横跨卫运河——桥西是河北故城县，桥东是山东武城县——桥上有&quot;鲁冀界&quot;的牌子，1964年分省后一直立到现在。；董学村（董仲舒青年下帷讲学处·故城县房庄镇·明万历立碑）：河北衡水故城县房庄镇董学村——原名&quot;十里长村&quot;，因西汉大儒董仲舒青年时代在此下帷讲学——改叫&quot;下帷村&quot;，后改&quot;董学村&quot;。董仲舒是河北景县人——但他小时候在故城县董学村读书求学，青年时代又在这里&quot;下帷讲学&quot;，传道授业。2023年房庄镇榆林村出土了一通明万历年间的石碑——刻着&quot;董仲舒下帷授徒&quot;，碑文记载重修泰宁寺的过程，也记下了明代当地人追忆董仲舒在此讲学的情景——一块碑，400年的记忆，把董仲舒和这片土地连在了一起。；郑口运河挑水坝（全国重点文保·清道光年间·6座砖石坝·不同形状对付不同水流）：故城县郑口镇——这里河道拐了一个大弯，水流又急又猛，历史上经常决堤。清道光二十三年（1843年）当地人开始修挑水坝——用大柳树捆成捆倒挂在岸边，后来慢慢加固成砖石结构，黄土、白灰、糯米汤搅拌夯实，外面再砌青砖。现在运河边还留着6座挑水坝——样子不一样：有长方形的、有菱形的、有梯形的——不同的形状对付不同的水流：有的是直接削减水势，有的是引导水流方向。你站在坝跟前看——能感受到古人那种因势利导的智慧。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郑口镇老船夫郑大爷（85岁）：\u003cbr\u003e▌焕光大桥上过桥的司机小刘（35岁）：\u003cbr\u003e▌董学村董氏后人董大伯（62岁）：\u003c/p\u003e"}, {"n": "山东·高唐州老城", "s": "高唐", "p": "山东", "w": "9999个石碌碡地基·鱼丘湖环城湖·清平迎旭门高唐明代城墙下埋了9999个石碌碡作为地基（古代筏板基础），1958年拆城墙时才发现，震惊工程界。", "h": "\u003cp class=\"main-text\"\u003e1958年拆城墙时，高唐城根底下挖出了密密麻麻的石碌碡——就是农村轧麦场的石滚子，一个个竖埋在土里，数量精确到9999个。专家说这是古代的筏板基础，分散压力、减震、防冻胀、防盐碱。为什么是9999不是10000？古人说满招损谦受益，9是阳数之极，留个余地。现在那些石碌碡大多被村民搬回家垫了地基、垒了猪圈。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e高唐古城墙遗址：县保，北魏始建，东北湖东岸尚存遗址；鱼丘湖：1060亩，中国江北县级最大城市内陆湖，城圈湖格局；清平迎旭门（省保）：仅存东门，南北长15.5米东西宽12.9米，1997年集资47万按明代要求重建门楼；高唐文庙（省保）：元代，崇圣祠、尊经阁、泮池尚存；兴国寺塔（国保）：宋，梁村镇，八角九层砖塔；北魏景明三年（502）：建土城（南清河郡治），城圈湖（今鱼丘湖）挖土筑城而成；宋宣和七年（1125）：清平始建土城；明正德六年（1511）：知州张纮增高唐土城，周九里，四门（瞻岱、观成、迎薰、拱极）；明嘉靖三十一年（1552）：塞北门（城内多潴水）；清嘉庆元年至三年（1796-1798）：清平改建砖城，周852丈；1997年：清平迎旭门集资修缮。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1958年：拆高唐明代城墙，地下9999个石碌碡重见天日；高唐明代砖城（周九里）：1958年拆除；9999个石碌碡地基：拆城墙时挖出，大量流失；四门城楼：全毁。\u003c/p\u003e", "c": ""}, {"n": "山东·平原老城", "s": "平原", "p": "山东", "w": "北齐迁城·龙门石刻·颜真卿抗安史城墙平原是刘备当过县令的地方，张飞鞭打督邮的故事发生地，颜真卿抗击安史之乱固守的城池。", "h": "\u003cp class=\"main-text\"\u003e平原北城墙遗址现在还在，一段风干的土堆，没有垛口，没有雉堞。有人说那土是唐时颜真卿守平原时夯的，掺了糯米、麦秸，攥一把能闻到旧时光的味道。真正的城墙从不用石头说话，它只沉默地把自己站成，一把泥土等待的形状。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e平原郡古城墙遗址：北城墙遗址仍存，夯土+糯米+草秸，绊马石时常从护城河浮起；龙门石刻（省保）：原水门龙门石刻，狂草龙门二字（高100cm宽50cm），一笔连体，现存县图书馆；颜真卿公园：纪念颜真卿抗击安史之乱固守平原；千佛塔：西寺淳熙寺遗存；西汉：刘备任平原相（刘备鞭打督邮后挂印而去）；北齐天宝二年（551）：迁至今址（原在城南25里张官店），初为土城；明万历元年至十一年（1573-1583）：改建砖城，同时建成水门（后称龙门）、文昌阁；2010年：在琵琶湾公园西门方位重修龙门、文昌阁（仿建）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e解放初：城墙渐遭毁坏，文昌阁、龙门保留较完整；文革期间：水门（龙门）、文昌阁拆除；北齐土城→明代砖城：全拆；水门龙门：文革拆，2010仿建。\u003c/p\u003e", "c": ""}, {"n": "山东·东阿镇老城", "s": "东阿", "p": "山东", "w": "阿胶之乡·六迁城址·于慎行阁老府东阿镇是中国阿胶之乡（1915巴拿马金奖），东阿县城历史上六迁其址，城址变迁就是一部治水史。", "h": "\u003cp class=\"main-text\"\u003e东阿镇的老胶农老王今年68岁，熬了40年胶。他说现在熬胶还是用狼溪河的水，比重比一般水大，熬出来的胶才正宗。1915年巴拿马博览会拿金奖的那批阿胶，就是他太爷爷那辈人熬的。胶因水而贵，水因山而灵。他身后的狼溪河桥就是明代的永济桥，98米长的石拱桥，蹲过八对石狮的望柱还在。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东阿古城门（东门少岱门）：明代五门之一，现存唯一，济南市文保；少岱山（82.1米）：泰山之西，俗称小泰山；阁老府遗址：于慎行（明隆庆进士，礼部尚书东阁大学士）故居；永济桥（国保）：弘治十三年始建石拱桥，长98米宽7米单孔，望柱石狮八对石猴两对；古阿井（省保）：阿胶发源地，狼溪河（九泉之水）熬胶；春秋：柯邑（齐之阿邑），管仲食邑；秦：改东阿县，治阿城镇（阳谷县）；明洪武八年（1375）：五迁平阴县东阿镇（今址），避水害；1947年：六迁东阿县铜城镇（今址）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东阿明代砖城：五门，全拆。\u003c/p\u003e", "c": ""}, {"n": "山东·鱼台老城", "s": "鱼台", "p": "山东", "w": "旧城海子沉城·湖陵故城·黄河灭城鱼台因黄河改道两毁其城，旧城沉为湖泊（旧城海子），湖陵故城沉为昭阳湖。", "h": "\u003cp class=\"main-text\"\u003e鱼台王庙镇的老渔民李老头，每年枯水季都要划着船去旧城海子中间看看。他说能摸到古城墙的砖——沉了270年，砖缝里还卡着清代的铜钱。有次他捞上来一个完整的瓷碗，碗底写着乾隆二十一年，正是黄河决口那年。他把碗捐给了县博物馆，换了50块钱。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e旧城海子（市级文保）：原黄台市古城遗址，东西2200米南北1400米，2.8平方公里水面，城址沉于水下；湖陵故城：秦汉湖陵县，楚汉相争地，昭阳湖水下；鱼城镇（原董家店）：清乾隆二十三年至1956年为鱼台县城，县衙石狮子尚存（鱼台二中门口）；唐元和四年（809）：迁县治黄台市（今王庙镇旧城里村）；清乾隆二十一年（1756）：黄河决口灌城，城址沦为湖泊（旧城海子）；清乾隆二十二年（1757）：迁治董家店（今鱼城镇），筑新城；1964年：迁治今谷亭镇；唐至清948年老县城（黄台市）：沉为旧城海子；湖陵故城：沉为昭阳湖。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1945年：鱼城县城城墙因战争拆除；清鱼城砖城：周4里1分，高二丈三尺五寸，1945年拆除。\u003c/p\u003e", "c": ""}, {"n": "山东·曲阜老城", "s": "曲阜", "p": "山东", "w": "明正德砖城·为护孔庙而建·万仞宫墙曲阜明故城是中国唯一一座为保护孔庙而专门修建的城墙。因正德年间刘六刘七起义军攻破旧县秣马于庭污书于池，朝廷才下决心移县治、筑新城、护圣地。", "h": "\u003cp class=\"main-text\"\u003e曲阜人孔大爷在五马祠街开了40年的甏肉干饭铺。他说小时候瓮城里还能捡到明城墙的砖，砖上刻着工匠名字。2002年复建城墙时他主动捐了12块祖传老砖给文物局。现在他的饭铺门口还立着半块城砖——是他爹当年砌灶台剩下的。这砖比我家铺子里的甏还老，他说这话时手里还翻着那半块砖。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e万仞宫墙（正南门）：2004年复建，城楼歇山重檐，瓮城半圆形；延恩门（北门）：城门洞上方有明代胡缵宗题仰圣门石额，留有中华民国三十六年复原纪念字样；鼓楼街钟楼街：明代建筑，钟楼青砖黛瓦，鼓楼居街中央；五马祠街：明故城内最有烟火味的街道，因明代孔尚经家祠得名，现存四柱石构井亭；陋巷街：颜子巷，孔子弟子颜渊居住处；阙里街：元代始建四柱三间式阙里牌坊；孔庙孔府孔林（三孔）：世界文化遗产；周公庙：明代建筑；宋元：曲阜县治在仙源县（今旧县），阙里孔庙与之相距十里，均无城墙；明正德六年（1511）：刘六刘七起义军破仙源县，当晚移营阙里，秣马于庭，污书于池，孔庙遭严重破坏；明正德八年至嘉靖元年（1513-1522）：山东巡抚潘珍奏请移城，耗银3.58万两（多为罚锾），以农闲征丁夫万人，历时10年建成明故城，城周八里三十六步，高二丈厚一丈，呈方形；明万历五年（1577）：开正南门，重城皋门以象朝阙；清乾隆十三年（1748）：乾隆亲谒孔庙，将原仰圣门匾额换成自己手写的万仞宫墙；2002-2004年：按原址复建，全长5339米，高9米，底宽8米上宽4.5米，投资3000万；元代仙源县旧城（旧县）：遗址尚存但已非城址；城砖铭文：明代工匠将自己名字刻在砖上，现仅正南门墙砖依稀可辨。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1930年中原大战：阎锡山军攻城十昼夜，东西北三座城楼被毁；1978年：国家文物局批准拆除大部分城墙，仅存正南门、北门和东北西北部分城墙；明故城五门城楼：东秉礼东南崇信北延恩西宗鲁均毁于1930年战火。\u003c/p\u003e", "c": ""}, {"n": "山东·泰安府城", "s": "泰安", "p": "山东", "w": "岱庙中轴·通天街·山城相依·泰山香道起点泰安城没有自己的中轴线，而是借岱庙的南北轴做了自己的中轴线。岱庙中轴往北接遥参亭经岱宗坊直达泰山南天门，往南就是通天街。先有东岳庙后有泰安城不是空话。", "h": "\u003cp class=\"main-text\"\u003e泰安老茶客王老头每天早上七点准时到双龙池边的茶馆报到。他说1985年复建岱庙正阳门时他正在上小学，跟着大人去看热闹，还在拆下来的老城墙土里捡到了一枚乾隆年间的铜钱。现在岱庙城墙修得比我小时候见的还整齐，他端起茶碗抿了一口，但那个铜钱我给了我儿子，他拿去换糖吃了。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e岱庙（国保）：宋宣和年间已有垣堞周匝，1300米宫城城墙完整，八角四门四角楼；遥参亭：唐代称遥参门，宋代筑亭，登泰山前遥拜泰山神之地；通天街：500米长，泰城唯一正南正北的笔直街道，200余美食摊位夜市；蒿里山：泰山地府，古代帝王禅地之所；仰圣街福全街洼子街东青龙街：老泰安城历史街巷，肌理尚存；红门路岱庙通天街：省级历史文化街区；五代：设岱岳镇使，建寨墙，雏形始现；宋开宝五年（972）：乾封县治迁岱岳镇，始筑土城；宋大中祥符元年（1008）：宋真宗封禅泰山，改县名奉符，另筑新城于东南三里；金大定二十二年（1182）：升泰安军为州，重建城池，泰安之名由此始（取泰山安则天下皆安）；明嘉靖间：济南通判王云兴易土以石，周七里六十步，高二丈五尺厚二丈，四门（东静封西望封南乾封北登封）；明崇祯十二年（1639）：守道蔡懋德增修四隅各出棱角创四楼，东南角楼尚存（祀魁星）；清康熙七年（1668）：郯城地震，西南城墙坍塌；清乾隆十三年（1748）：重修，改四门名（东迎暄西岳晏南泰安北仰圣）；1910年：津浦铁路通车，城市重心西移，西门外车站街财源街成新中心；2006年：在明代南城门遗址上建通天坊。\u003c/p\u003e\u003cp class=\"main-text\"\u003e建国初：城墙城楼陆续拆除，仅剩根基；明砖城：周七里六十步，四门城楼全毁；清代四门城楼：全拆；护城河：填为街或盖板。\u003c/p\u003e", "c": ""}, {"n": "山东·泗水老城", "s": "泗水", "p": "山东", "w": "泉林泉群·孔子川上之叹·卞桥三孔联拱泗水是泗河源头（泉林泉群），孔子在这里发出逝者如斯夫不舍昼夜的千古一叹，卞桥是山东省内现存最古老的石桥。", "h": "\u003cp class=\"main-text\"\u003e泗水泉林镇的张大爷每天早上绕着卞桥走三圈。他说那桥唐时建的，金时修的，桥面上的石板被磨得发亮，比我爷爷的爷爷还老。2024年文保中心来修卞桥时，张大爷天天去工地帮忙搬砖。他们说这桥是宝贝，我打小就知道——我爹小时候在桥洞里摸鱼，我在桥栏上刻过名字，现在我孙子也在这桥上跑。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泉林泉群（省保）：泗河源头，陪尾山，康熙乾隆十次驻跸，御碑亭高12米重102吨；卞桥（国保）：唐始建金大定二十年重修，山东省现存最古老石桥，三孔联拱券砌，长25米宽7米；卞国故城遗址（国保）：周汉古城，泉林镇卞桥村，仅存西北城角及部分北城墙，残高8米；仲庙（省保）：子路庙；子在川上处：陪尾山观泉亭内乾隆题碑；周：卞明国，春秋鲁卞邑；隋开皇十六年（596）：置泗水县，治所迁至今县城（1400年未迁）；明：泗水县城，周4里，土筑；清：砖城，四门；2024年：县文保中心完成卞桥修缮、仲庙修缮、泉林碑刻修缮。\u003c/p\u003e\u003cp class=\"main-text\"\u003e建国初：城墙拆除，砖石铺路；明泗水土城清砖城：周4里，四门全拆；泉林行宫：清康熙乾隆建，114间房屋，全毁；清代36块捐资碑：几乎毁于战乱。\u003c/p\u003e", "c": ""}, {"n": "山东·新泰老城", "s": "新泰", "p": "山东", "w": "羊祜故里·羊流九省驿道·羊公祠新泰因羊祜取新甫山泰山首字得名，羊流镇是西晋羊氏家族发源地，有北京到南京羊流在当中的九省驿道。", "h": "\u003cp class=\"main-text\"\u003e新泰羊流镇中心小学操场底下就是明代羊公祠的遗址。校长说1980年代建校时挖出过祠碑残片和泥塑碎块。现在每周一升旗仪式校长都要跟孩子们说羊祜坐怀不乱的故事。镇转盘那尊4米高的羊祜雕塑是1999年立的，头顶带簪名士小冠左手握佩剑——设计者把羊祜塑成了一个儒雅的文人。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e羊流镇：羊祜故里，九省驿道，残墙基址长约10里高约8米，四门；三羊墓（三官墓）：羊流镇北1.5公里，羊祜祖父羊续父亲羊衜胞兄羊发三冢合葬高3米；新甫山（莲花山）：汉武帝封禅建宫，小泰山；和圣文化园：柳下惠故里（坐怀不乱），宫里镇柳里；商周：杞国国都（杞人忧天故事发生地）；西晋：羊祜取新甫山泰山首字，表改平阳为新泰县；明正德前：旧城只有东南二门；明弘治间：知县吴禧始辟西门，共三门（东通齐南望鲁西瞻岱）；明正德：大规模修建，周围四里，连女墙高三丈五尺广六尺；民国：城墙渐废。\u003c/p\u003e\u003cp class=\"main-text\"\u003e羊公祠遗址：明万历间建羊公祠，后毁于战火，原址建镇中心小学；建国后：拆除；明新泰砖城：周四里，三门城楼全拆；羊公祠：明万历间建，后毁于战火文革拆除。\u003c/p\u003e", "c": ""}, {"n": "山东·费县老城", "s": "费县", "p": "山东", "w": "鄪国故城·季桓子井·颜真卿故里费县是千年古县，春秋为鄪国（姬姓伯爵），孔子骂鲁国权臣季氏伐的那个小国就是它。现存南北双城遗址。", "h": "\u003cp class=\"main-text\"\u003e费县上冶镇西毕城村的老刘天天在鄪国故城遗址上放羊。他说那城墙根底下的土比别处的硬，是夯的，踩上去咯噔咯噔响。有一回他在庄稼地里挖到半块带花纹的瓦当——千秋万岁那种。他交给了县博物馆，换了一本费县志。我天天在孔子骂过的那片城墙上放羊，羊一叫，他就觉得孔子也听见了。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e鄪国故城（国保）：上冶镇西毕城古城宁国庄，周长6250米面积2.23平方公里，现存城墙上半部3-5米宽15-30米；费城遗址（祊城）：仅存东城墙残垣一段、明代银杏树；季桓子井遗址：孔子观井得羵羊典故处；颜林（省保）：颜氏家庙颜真卿故里；龙门路：原费县龙门所在位置（震水假门）；春秋：鄪国（后为鲁季氏封邑），论语中季氏将伐颛臾即此地；北魏太和二十年（496）：县治从古鄪城迁祊城（今费城）；明正德间：修外城（四个关厢）；明：内城四门（南映文门等），龙门为假门（震水用）；民国：城墙渐废；2024年3月：费县政府公布费城遗址保护范围。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鄪国内城（季王城）：全毁；明代砖城：费城内外城全拆。\u003c/p\u003e", "c": ""}, {"n": "山东·平邑老城", "s": "平邑", "p": "山东", "w": "颛臾古国·三千年香火·曾子故里·南武城弦歌颛臾国不是打仗立国的，是专门替周天子祭祀蒙山的——国君叫东蒙主，周成王亲封。地盘极小（南北600米东西550米跑一圈才二里地）但来头极大，连孔子都为它跟鲁国权臣拍桌子。", "h": "\u003cp class=\"main-text\"\u003e平邑颛臾一村的张老汉今年72岁，他每天早上都要村碑那转一圈。那碑是1990年立的，碑底开了个超市，张老汉没事就去摸那碑上的颛臾俩字。他说当年拆庙的时候他还小，亲眼看着颛臾王庙的屋顶被拆下来当柴烧。这俩字笔画稠念着绕嘴，但这是老祖宗传下来的，能存到现在不容易。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e颛臾国故城遗址（省保）：平邑县城东14公里，南北600米东西550米，土夯城墙四五米高，断面可抠出炭化木棍，墙基厚15米，城周四颛臾村；南武城故城（国保）：郑城镇南武城村，孔子来听弦歌说割鸡焉用牛刀，曾子故里（曾点曾参父子墓）；曾子墓（宗圣墓）：封土高3.5米直径10米；平邑汉阙：皇圣卿阙+功曹阙，国内现存最早汉代墓碑；蒙山主峰龟蒙顶：东蒙主祭祀之所；西周：周成王正式册封颛臾国，代表周天子主祭蒙山（国君称东蒙主）；春秋：季平子采邑，颛臾为鲁国附庸，孔子反对季氏伐颛臾（祸起萧墙）；西汉：平邑侯国（2次短暂设立）、南武阳县、南城县；隋开皇十八年（598）：武阳县改名颛臾县；宋：颛臾王被皇帝封灵显潜应侯→英烈昭济惠民王，从祭祀主→蒙山神；清：颛臾故地出土汉碑孝禹碑（河平三年前26年）；1946年4月：平邑县正式建县；2013年：南武城故城列入国保；澹台灭明墓：1970年代夷平。\u003c/p\u003e\u003cp class=\"main-text\"\u003e唐贞观元年（627）：省武阳县并入费县（平邑做了1337年无名县）；颛臾国宫城：全毁，遗址在庄稼地里；颛臾王庙：历代祭祀蒙山神之所，全毁。\u003c/p\u003e", "c": ""}, {"n": "莒县老城·毋忘在莒", "s": "莒县", "p": "山东", "w": "三千年莒国故都·四千年银杏·五千年陶文莒国故都是春秋莒国千年不移的都城，城址一脉三千年；浮来山定林寺存中国最古老的一株近四千年银杏。", "h": "\u003cp class=\"main-text\"\u003e&quot;这银杏我从小看到老，一进农历十月叶黄了，满山都是人。老人说摸树干沾福气，树皮都让人摸得发亮。&quot;。&quot;莒字外地人十个九个念错，念&#x27;举&#x27;不念&#x27;旅&#x27;。客人一上车就让我讲古，我从一碗全羊汤讲到三千年前。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e莒国故城南城垣（省保）：高7—8米、宽35米左右、长近千米，从浮来春酒厂绵延至环卫所处；定林寺古银杏（浮来山）：树龄近4000年，清顺治碑载鲁隐公八年（前715年）莒鲁会盟于树下；树下有南北朝刘勰著《文心雕龙》的校经楼；定林寺（北魏始建）：全寺南北长95米、东西宽52米、占地约4940平米，前中后三进院落；齐长城莒县段（东莞镇光光山）：花岗岩垒砌，平均高2.5米；莒州博物馆：馆藏2万余件文物、其中国家级文物300余件，陵阳河遗址大汶口陶文比甲骨文早约1500年；周武王十三年（约前1045年）：莒国立国，都计（今胶州），后多次迁都；春秋初期：迁都至今莒城位置；前431年：莒为楚所灭，后入齐，扩为齐国&quot;五都&quot;之一；北魏郦道元《水经注》载&quot;其城三重&quot;；秦：置莒县，属琅琊郡；汉置城阳国；1977年：莒国故城列为省级文保；2014年：莒县入选首批&quot;千年古县&quot;；近年：复建莒国古城（占地960亩、建筑面积37万平米）。\u003c/p\u003e\u003cp class=\"main-text\"\u003e故城东北角城垣（老水利局处）：高8—9米、宽40米、长150米，1996年后改为城墙公园，现为莒国古城拱辰门城墙一部分。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌浮来山看门老人（70岁）：\u003cbr\u003e▌莒国古城拉车师傅：\u003c/p\u003e"}, {"n": "沂水老城·沂河古城", "s": "沂水", "p": "山东", "w": "内城外城双围·穆陵关齐长城北门·刘南宅八卦宅沂水城始建于西汉东莞县，隋开皇十六年（596）更名沂水，内城外城双重城墙结构在鲁南罕见，穆陵关是齐长城最古老的关隘。", "h": "\u003cp class=\"main-text\"\u003e&quot;我小时东关街全县最热闹，粮店影院百货楼挤一条街。老城墙扒得早，就剩县府后院那一截土岗子，年轻人都不知道那是城墙。&quot;。&quot;关顶村这道土岭，老辈都叫&#x27;北大门&#x27;。刮大风站在豁口上，风呜呜地响，跟千百年前挑担赶集的人听见的一个声儿。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沂水老城墙基（县政府后院）：全城唯一残存城垣遗迹；穆陵关（马站镇关顶村·齐长城关口）：始建于西周、不晚于前821年，距今2800多年，关顶村处临沂&quot;北大门&quot;；齐长城遗址；密邑古城址（院东头刘家店子村西）：总面积20万平米，城墙残高1—3米、基宽5米，1977年出土铜器470余件；东安古城址（袁家庄乡）：周长1000米，汉代城阳国东安县故城；沂水古城遗址：出土莲花兽瓦当、三彩建筑饰件等隋唐文物；西汉：置东莞县，为沂水县城前身；南北朝：改称团城，曾为南青州；隋开皇十六年（596年）：更名沂水，因沂河得名，属琅琊郡；元至治三年（1323年）至清同治七年（1868年）：县城十次复修；内城：周长三里二十七步、城墙高2丈5尺；外城：周长10.2里、城墙高1丈5尺、有四门；清乾隆五十六年（1791年）复修内城；咸丰二年至同治七年（1852—1868年）筑外城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1944年：内外城墙拆除，今只存县政府后院一段老城墙基。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌东关街老住户刘大爷（68岁）：\u003cbr\u003e▌穆陵关村放羊老汉：\u003c/p\u003e"}, {"n": "日照老城·海曲石臼", "s": "日照", "p": "山东", "w": "汉武帝海曲古县城·石臼所渔港老街·海石房日照前身海曲县设于西汉，城址在海曲公园一带；石臼所从渔村到渔港、再到近代建港，是日照唯一还留着老城烟火与滨海文脉的地方。", "h": "\u003cp class=\"main-text\"\u003e&quot;海石房是拿海边礁石垒的，冬暖夏凉还抗盐碱。现在盖楼，老石房拆一间少一间，就剩十字街那几座了。&quot;。&quot;老市场九几年盖的，一天两万人，我一天卖几百斤蛤蜊。搬新市场那天，老主顾都来转最后一圈。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e海曲古城墙遗址（海曲坊项目内保留）；石臼所海石房（天津路南、新港路北十字街）：清代建筑，用海边礁石&quot;所石&quot;（花岗岩）垒成，大门窗户做发碹样式；老灯塔：山东沿海现存最早的近代灯塔之一；老码头、老海关楼、老边检楼、渔政监督管理处旧址；石臼老街：贯穿石臼所的老街巷；老石臼市场（1992—2020年）：年营业额曾达4亿多元；夏代：石臼一带渐成渔猎聚落，&quot;石臼&quot;或与海边舂米石臼有关；西汉（汉武帝时）：置海曲县，属琅琊郡，城址在今海曲公园一带；明清：石臼设所，渔船商船
