<script>
const DATA=[{"n": "萧县老县城", "s": "萧县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦属泗水郡，汉属彭城郡。明万历年间筑砖城。1950年代城墙拆除。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到萧县老县城，第一眼是被龙河、龙山路圈在中间的一片平地——2026年第四次文物普查新探出的明代砖城墙基就埋在交通路以北这方地块下；往东南不远，皇藏峪把整山黄桑树和瑞云寺收进峪里，白土镇的萧窑窑址散在田野上。\u003c/p\u003e\u003cp class=\"main-text\"\u003e皇藏峪（国家4A）：峪里长满老黄桑树，林子密得遮天。峪底皇藏洞是块天然巨石半掩的石洞，传说当年蜘蛛在洞口结网骗过追兵；拔剑泉、马扒泉两眼泉水至今从石缝里渗出来。瑞云寺倚在峪腹，殿宇依山层叠。；天门寺：天门山双峰夹峙如门，寺就坐在门里。孔子晒书台是一块平展的石台，旁有砚墨池、洗砚泉，泉水还在。明宣德年间重建，现有殿堂二十余间，供着缅甸玉佛数尊；寺倚山门面涧而开，石级顺坡叠上，殿后林木遮天。；白土寨遗址：白土镇白土寨村南，夯土残垣还压在村边地头。这一带唐宋时是萧窑烧窑的场子，窑火绵延百里，明清还出贡砖。萧窑创烧于唐，唐时烧黄釉瓷，胎体厚重呈焦黄、釉色黄中闪绿，流釉处转墨绿；入宋转烧白瓷，碗盘内心留着三足支钉叠烧的支痕。二〇一七年发掘还清出拉坯、晾坯、沉淀瓷泥的陈泥池等一整条生产链。；民治古街巷：民治街中段还留着一段明清到近现代的老街，石板路两侧老门面断断续续。；明代砖城城墙遗址：交通路以北、龙山路以西、龙凤大道以南、花园街以东这一方，2026年第四次文物普查新探出墙基，埋在路下与田间。；瑞云寺 detail：市保二〇〇六年，南北朝，官桥镇皇藏峪。倚峪腹而建，宋端拱间改今名，原房屋九十九间，历经战乱现存五十三间，三进三出院落，一九八四年列省重点寺院。寺门高悬的“瑞云寺”匾为清代邓石如所书。前院藏经楼楼下为斋堂、楼上藏经，中院大雄宝殿五间，内塑释迦、观音、十八罗汉二十余尊，飞檐拱壁；后院为僧房。全寺石级层叠、回廊交错、门楣多变。寺旁一千五百年古银杏与三千五百年古青檀围寺而立，树根盘出石缝。；祖庄铸钱遗址（市保二〇〇六年，龙城镇祖庄村北）：汉代铸钱作坊遗址，铜范残片散于田间。；皇藏峪古银杏与古青檀：峪中两株古树，银杏一千五百年、青檀三千五百年，树干需数人合抱。；将军碑林：峪中收藏陈毅、罗炳辉等将军诗词碑刻。；倒流河遗址区：皇藏峪景区五片区之一，史前聚落。；竹林寺景区：峪内旧寺遗址，竹林围拢。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌萧县民谚：\u003cbr\u003e&quot;蜘蛛结网救汉王，巨石挡洞躲项王&quot;——公元前205年彭城之战刘邦败逃皇藏峪，蜘蛛在洞前结网、巨石滑到洞口，项羽追兵以为洞无人迹撤去。\u003cbr\u003e▌《萧县志》（明万历）：\u003cbr\u003e&quot;皇藏峪原名黄桑峪，以峪内多黄桑树得名。&quot;\u003cbr\u003e▌天门寺游客（2026）：\u003cbr\u003e&quot;孔子晒书台上还有石台，砚墨池的水还在——2500年前的痕迹，现在还能摸到。&quot;\u003c/p\u003e"}, {"n": "砀山老县城·凤城", "s": "砀山", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦置砀郡，郡城在芒砀山西麓（今永城芒山镇）。金大定六年（1166）黄河决口，县治迁虞山（今址），此后八百余年城址未动。明万历二十六年（1598）秋黄河决口淹没砀城，官民被迫迁徙。万历三十一年（1603）黄河决朱家旺口，改道城南。万历三十四年（1606）大水，再改道城北。崇祯十四年（1641）水患、饥馑、瘟疫、盗贼接踵，户口大减。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到砀山老城第一眼，是一圈把城抱在中间的圆护城河——城是方的、河是圆的，所谓内方外圆。河外一圈尽是梨花，春天百万亩梨园铺到天边，良梨镇那棵三百年的梨树王至今还在挂果。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古城护城河：约四公里长一圈，平均宽二十来米，八百年了还完整绕着老城淌，清代县志写的城方池圆今天还看得见，两岸柳树成荫。；燕喜台：县城里一座夯土台基，清代遗址，台周立着石碑数通。唐天宝年间李白游砀山，县令在此设宴，留下燕喜台边春水流一句。台侧现存北宋“宴嬉台”碑一通，高一米七五、宽八十厘米，纵行楷书三个大字每字近半米见方，为北宋真州知府李釜手书，一九八〇年从县城东北渔场院内出土，一九八五年在城南外环路内侧原址重建台亭。；砀山清真寺：老城区西南隅，明万历年间始建，礼拜大殿是卷棚顶三开间，斗拱飞檐翘起来，是皖北保存较好的明代清真寺。现存老大殿座西朝东，南北长十四米、东西宽十米，木构梁柱上还留着当年工匠的手痕；明崇祯十五年首修，清光绪二十四年本县回族总兵许世亨捐款扩建，汉式飞檐与清真寺的简洁庄重叠在一进院子里。；砀山县文庙：明万历始建，民国改作学校，至今大成殿主体还立着。乾隆县志记它棂星门、泮池、泮桥、戟门、大成殿、明伦堂一路排开；乾隆年间重修的大成殿高约三丈六尺、广近八丈、深四丈七尺，旧塾学格局犹可辨。；百年梨树王：良梨镇侯楼村，树龄约三百年，树干要一人合抱，每年还挂几百斤果。吉尼斯认定的世界最大连片果园，就是这片围着老城的百万亩梨花。；黄河故道：百里古黄河横卧城外，堤上林子密，明代改道的旧河床一眼可辨。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《砀山县志》（清乾隆三十五年）：\u003cbr\u003e&quot;万历二十六年秋，黄水入砀城，官民抱木登屋，有不食死者遂相食。二十九年始复故址。民存者十之一。&quot;\u003cbr\u003e▌砀山老教师张鹤龄：\u003cbr\u003e&quot;我爷爷说，民国时老城墙还能跑马车，后来拆砖盖学校、盖供销社，一块不剩。但护城河没拆，水还在淌，鱼还在游——这是砀城剩下的唯一圈住我们的东西。&quot;\u003cbr\u003e▌砀山酥梨非遗传承人李怀珍：\u003cbr\u003e&quot;我家种梨五辈人，老梨树就在古城墙根下。砀山梨能卖到东南亚，全靠这沙壤土、这黄河水。城里人都说我们砀山有三宝：墙圆、梨甜、燕喜台有诗仙。&quot;\u003c/p\u003e"}, {"n": "蒙城老县城·漆园", "s": "蒙城", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e北宋万佛塔始建，用十年建成（崇宁元年1102建到第四层，崇宁五年1106续建，全塔十三层）。元至元二十一年（1284）始建文庙。明万历年间以砖包城。清代屡修屡圮。1950年代城墙大部拆除，四门仅存南华门门洞残段。2021年北大街历史文化街区列为省级保护街区。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e万佛塔（国保·北宋）：八角十三层楼阁式砖塔，高约四十二米。塔内外嵌着赭黄绿三彩琉璃小佛近万尊，塔身用打磨青砖砌成，下几层走穿心楼梯、上面改盘旋。塔下三块宋碑完整记着哪年建到第几层。塔身全部用水磨青砖，每块琉璃面砖塑一佛二弟子三尊，共一千三百余块；塔底周长二十四米、直径八米，浅夯土基仅两米四深却撑起近千吨塔身。四正面辟门、余四面砌作假窗，塔刹为铁制，装复钵、五重相轮与宝瓶。地宫方形约一点五平方米，四壁遍镶石雕，内存北魏石碑一通。；蒙城文庙（省保·元始建）：老城中心，大成门正对青云街，取平步青云之意。大成殿面阔五间进深三间，歇山顶抬梁式，巨杉做栋梁。九檩十八架、四十二檐墩撑起飞檐，前檐设六条镂空蟠龙斜撑，檐下砖木雕镂飞禽走兽。大成门西南侧一眼圣井，旧称圣井甘泉；殿前台阶正中铺明代二龙戏珠丹陛石，龙鳞祥云宛然。院内东西廊庑各七间，灰筒瓦覆顶。；南华门（南门门洞）：明清遗留的城门洞，穿过去就踏进老城区，至今是城南最热闹的出入口。；青云街：一头接文庙棂星门、一头望万佛塔的老街，至今还在走。古时赶考学子拜完圣打此经过，寓意平步青云。；北大街历史街区（省保）：商肆格局完整，庄了牌坊、钟鼓楼、文王庙、四牌楼等十三处挂牌历史建筑散在街上。；漆园街、三报司街、光复街：历史街巷格局完好，原住民还住在里面。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《蒙城县志》（清光绪）：\u003cbr\u003e&quot;万佛塔造于宋崇宁间，历十年而成。每层嵌琉璃小佛，数近万，因名。塔下有宋代碑三，记其造年。&quot;\u003cbr\u003e▌蒙城县历史文化研究会：\u003cbr\u003e&quot;万佛塔四层以上门窗位置不规则——为什么？因为它不是一次造完的。崇宁元年造到四层停了三年，崇宁五年才又接着往上造，所以楼梯改了方向，门窗位置也乱了。这是一座有&#x27;施工中断痕迹&#x27;的宋塔。&quot;\u003cbr\u003e▌南华门老裁缝王桂英（82岁）：\u003cbr\u003e&quot;我就在南华门洞里纳鞋底纳了50年。穿过门洞往西是卖菜的菜市，往东是青云街——小时候跟着母亲去文庙上香，娘说从这走过，下辈子也能考个秀才。现在门洞还是那个门洞，我还在，人换了一茬又一茬。&quot;\u003c/p\u003e"}, {"n": "亳州老县城·三朝古都", "s": "亳州", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e商汤建都亳（景亳/南亳），历约一百九十年。魏皇初二年（221）封谯郡为陪都。隋大业二年（606）改谯郡为亳州，为唐代十望州府之一。元至正十五年（1355）刘福通拥韩林儿在亳州称帝建宋。明洪武初（1368）降州为县，弘治九年（1496）复称亳州。清时为区域经济中心，号小南京。1950年代城墙拆除。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到亳州老城，第一眼是北关——白布大街、打铜巷、爬子巷、南京巷三十六条老街斜斜铺开，青砖灰瓦的老药栈门脸还在。城中心花戏楼那道砖雕牌坊式门楼贴着街面，上头透花绣球上的小孔还能凑近数。\u003c/p\u003e\u003cp class=\"main-text\"\u003e花戏楼（国保·山陕会馆·天下砖雕第一）：大关帝庙内，清顺治十三年山陕药材商集资建、康熙十五年增建戏楼。戏楼与山门连成砖雕牌坊，拱门上方嵌参天地金匾。特制青砖厚不到二寸，透雕成数层，一个巴掌大的双层透花绣球上密密麻麻钻出三十余个小孔；戏文砖雕七十余种，松鹤延年、郭子仪做寿、三顾茅庐、白蛇传都在墙上。；曹氏宗族墓群（国保）：魏武大道两侧一串孤堆——董园汉墓、曹四孤堆、张园汉墓、元宝坑汉墓群等。墓门多石结构带画像刻石，墓室券顶绘彩画。出土银缕玉衣和八百多块带字墓砖，隶篆草真行五种书体俱全。；曹操地下运兵道（国保）：双道并行、纵横交错的地下砖券道，有上下两层、道中有室，人称地下长城，如今一段开放可走入。已探明近八千米，道顶距地表二至七米；单行道宽仅六至九十厘米、高一米六至二米一，须侧身弯腰。平行双道相距二至三米半，中间砌方形传话孔；道壁挖出猫耳洞、障碍券、绊腿板、陷阱，券顶另留通气孔与灯龛。现存多为宋时重修的青砖拱券，齐口、咬口两种砌法相间。；道德中宫（省保）：市区中心，传孔子在此问礼于老子，现存明代遗构。；华祖庵（省保）：永安街华佗故居，庙祠完整，草堂、药圃尚存。；南京巷钱庄（国保·清代）：北关老街南京巷，清道光年间建，三间三进院落，是亳州现存最完整的老钱庄。占地一千三百平方米，三进四合院共三十余间，前厅、中厅、信房、账房、掌柜房、金库、财神堂一应俱全。三道院子八道门，前门大、后门小逐进收窄成倒斗状；天井四檐雨水汇入院中青石板，寓意肥水不流外人田，地下银窖入口仅见方八十厘米。；北关三十六条老街：白布大街、打铜巷、爬子巷、南京巷、小花子街、署前街等，明清格局，原住民仍住，烟火气不散。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：\u003cbr\u003e&quot;亳州自商汤建都以来，历经魏陪都、小明王宋都，三朝古都。明清时为天下四大药都之一，北关老街药栈林立，商贾云集，号称&#x27;小南京&#x27;。&quot;\u003cbr\u003e▌花戏楼导游小周：\u003cbr\u003e&quot;你看这砖雕——厚度才2厘米，却透刻了3层。那个5厘米的花绣球，上面有30多个3毫米的孔，全是手工刻的！砖雕上的人物，有的只有指甲盖大，眼睛眉毛都清清楚楚。1656年建的，370多年了——2厘米的青砖，这就是砖雕的命。&quot;\u003cbr\u003e▌曹操墓群考古队：\u003cbr\u003e&quot;800多块文字墓砖是宝贝——汉代书法史之前靠碑刻，墓砖是民间书法——有个墓砖上刻的是&#x27;曹氏丞曹甫砖&#x27;，还有的刻着当时工匠的牢骚话，比史书有趣多了。&quot;\u003cbr\u003e▌白布大街老药工王大爷（81岁）：\u003cbr\u003e&quot;我家在白布大街住了60年——这条街明清时是药都的门面街，药材商在这里卸车、看样、谈价。现在街两侧的门面还都是清代的青砖灰瓦——我小时候帮爹晒白芍，就铺在街面上——白芍晒3天，手摸起来发烫就是好药。&quot;\u003c/p\u003e"}, {"n": "涡阳老城·老子故里", "s": "涡阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉延熹八年（165）汉桓帝敕建老子庙。唐弘道元年（683）高宗改建为太清宫。宋真宗亲临加号太上老君。元世祖定名天静宫。元末、明末、晚清多次毁于兵燹。明成祖靖难之役前在涡阳屯兵许愿，称帝后重修天静宫。1993年募资重建天静宫。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到涡阳老城北约郑店村，第一眼是武家河与涡河环抱中的天静宫——朱墙长廊顺着中轴线一路铺到远处，宫苑里九眼古井一字排开，井水还在冒。这就是和鹿邑太清宫争了上千年的老子故里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e九龙井：天静宫九龙井苑里，九眼古井并列，井口多以唐代瓦圈砌成，泉水常年清冽。传说老子降生时九龙喷水沐浴。其中一眼经碳十四测定为春秋时期瓦圈井，井圈层层叠砌，现已加盖井亭保护，被视为老子故里在涡阳的关键物证。；流星园：天静宫西侧，传老子母亲在此感星而孕；考古出土过古流星园石碑一通。；尹喜墓（省保）：县城北，传老子弟子尹喜随老子西出函谷关后回归葬此。；城父古城：县城西北闸北镇，春秋楚平王居城父处，秦置城父县。城址夯土残垣还在。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e天静宫（省保·4A）：城北郑店村，武家河与涡河环绕。东汉延熹八年汉桓帝敕建老子庙，是官方给老子立祠最早的记载；元末毁于兵火，1990年代复建。主殿老君殿按宋代规制九脊重檐，东西长四十七米、南北深二十八米，殿高近二十四米，立于两米高崇台上；殿内老子铜像高五米半、重六吨，与尹喜、东华帝君并立。三清殿前草坪上立“宋代老君殿遗址”碑，考古曾揭出完整宋代殿基、约四亩炼丹场地与炼渣。；老子坟（李聃墓）：尹王村西，传为老子葬处或纪念地，明清石牌坊已毁，辉子园、紫楸林地名犹在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：\u003cbr\u003e&quot;天静宫在城北郑店村，始建于汉桓帝延熹八年。明成祖靖难之役前屯兵涡阳，许愿登帝位后大修——靖难成功兑现，庙地三千亩，食业数千人，为皖北第一宫观。&quot;\u003cbr\u003e▌元代《天静宫兴造碑》：\u003cbr\u003e&quot;老子生楚苦县厉乡曲仁里。按水经注，苦县故城即今安溜古城，赖乡城在涡河之北——古水经注所记与今天静宫位置吻合。&quot;\u003cbr\u003e▌涡阳天静宫道士张先生（82岁·在此修行50年）：\u003cbr\u003e&quot;老子故里争了上千年——涡阳有东汉最早立祠的碑、有元代兴造碑、有九龙井、有流星园古石碑、有尹喜墓，都是实证。鹿邑那边有太清宫庙群、有唐玄宗宋真宗的碑文。两地都是老子圣地——游客来了，涡阳拜天静宫，鹿邑拜太清宫，两头跑才对。道不分家。&quot;\u003cbr\u003e▌郑店村老农老尹：\u003cbr\u003e&quot;九龙井的水我喝了一辈子——夏天舀一瓢喝，清冽甘甜。老人说这井是老子降生时九条龙喷水成的——不管真不真，这水确实比别的井水好，我家种的白菜比别家的嫩。&quot;\u003cbr\u003e▌李白《经下邳圯桥怀张子房》（关联地涡阳）：\u003cbr\u003e&quot;唯见碧流水，曾无黄石公&quot;——涡水从涡阳天静宫旁流过，东流经蒙城、怀远入淮河，李白也走过这条水路。\u003c/p\u003e"}, {"n": "泗县老城·虹县故城·裁虹归泗", "s": "泗县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉置夏丘县。北周大象二年（580）改东楚州为泗州，治所在今江苏盱眙。唐武德四年（621）析夏丘县置虹县。唐贞观八年（634）夏丘县并入虹县，虹县治迁至今泗县城。隋大业元年（605）隋炀帝开通济渠穿虹县城而过。明洪武九年（1376）知县乐徽创建县衙大堂。明弘治十三年（1500）知县樊江修筑五门。明万历二十三年（1595）建砖城，四十四年（1616）开通东西水关。清康熙十九年（1680）黄河夺淮，泗州城沉洪泽湖底，州署寄居盱眙。清乾隆四十二年（1777）裁虹归泗，泗州州治北迁虹县，虹县建制撤销。民国元年（1912）废州改县，定名泗县。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到泗县城，第一眼是城东那段还在淌水的通济渠——河面不宽、河堤长草，是隋唐大运河通济渠唯一还活着的河段。老城一环内，街道走向还顺着明代虹县砖城的旧脉走。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古泗州城遗址（国保·水下庞贝）：江苏盱眙淮河镇洪泽湖西岸，康熙十九年（1680）黄河夺淮后沉入湖底。水下探出城门、城墙、纵横街道和州署、文庙、城隍庙基址，水位低时部分城墙露出水面。；通济渠（汴河）泗县段（世界文化遗产）：总长二十八公里，县城东约五公里半为活水段，是通济渠唯一保留活水的河段。沿岸出土过古码头、唐开元通宝、宋景德元宝和南北窑口瓷器。河道如今仅宽十余米，水一千四百年未断；新虹桥向东至新濉河交汇处约五点八公里列入世界遗产，堤上植柳长草，隋堤旧址旁那株“千里汴河第一槐”树围四米有余，枝干横斜。；《移泗州治记》碑：泗县博物馆藏，乾隆四十五年泗州知州张佩芳撰文、书法家梁巘书丹，楷书，详记泗州沉没与裁虹归泗经过。；古运河遗址公园：泗水街道沿通济渠活水段而建，园内有古码头、古河堤和考古地层剖面展示。；泗州戏（国家级非遗）：泗县是泗州戏原生地，拉魂腔唱腔婉转，乾嘉年间成雏形，传统剧目《四告》《拾棉花》代代传。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e虹县故城（明代砖城）：泗县老城一环内，明洪武九年始建县衙大堂，弘治十二年筑五门，万历二十三年再砌砖城。清末城毁，如今一环内街道走向、空间格局仍基本延续明代；老县衙地基上后建办公楼，原抱厦厅、礼房、兵房只余后堂一间，门阶两块青石板仍在原地。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌泗县博物馆馆长刘建国：\u003cbr\u003e&quot;古泗州城沉在水下300年——为什么不打捞？主要是技术和资金问题。洪泽湖是蓄水库，水位高度影响防洪——如果要打捞，首先要让遗址完全露出水面，但这会影响洪泽湖调蓄能力。目前只能维持原状，通过测深仪、声呐、潜水员去探查。\u003cstrong class=\"hl\"\u003e我们已经探出城墙全长约11里，街道纵横20多条，主要建筑遗址30余处\u003c/strong\u003e——这比意大利庞贝城还要大。&quot;\u003cbr\u003e▌泗县老船夫姜治怀（84岁·泗水街道曹苗社区）：\u003cbr\u003e&quot;我家祖辈就在运河边——小时候我在河里游泳、捉鱼摸虾。那时候运河水很清，夏天能看到河底的鱼。\u003cstrong class=\"hl\"\u003e以前沿河都是村庄，后来世界遗产申报，为了保护河道，老曹苗村整体搬迁了\u003c/strong\u003e——村民都搬进了附近的楼房。我现在还经常去运河边散步，看看鸭子在河里游，看看花花草草——河还是那条河，我已不是当年那个光腚小孩了。&quot;\u003cbr\u003e▌虹城街道老居民王大娘（76岁）：\u003cbr\u003e&quot;我家就在原来的县衙旁边——听老辈人说，原来的县衙大堂三进院落，有&#x27;抱厦厅&#x27;、&#x27;礼房&#x27;、&#x27;兵房&#x27;……文革时拆了大部分，只剩后堂一间。\u003cstrong class=\"hl\"\u003e80年代县公安局占了县衙地基盖办公楼\u003c/strong\u003e——我现在路过还能找到原来县衙的台阶——那两块青石板，我小时候在上面摔过跤。&quot;\u003c/p\u003e"}, {"n": "凤阳·明中都", "s": "凤阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e元天历元年（1328）朱元璋生于濠州钟离（今凤阳），父母早逝无地安葬。明洪武二年（1369）下诏以临濠为中都，调集全国人力营建。洪武八年（1375）中都功将完成时突然罢役停工。洪武十二年（1379）建成明皇陵，朱元璋亲撰碑文。2017年明中都皇故城列为安徽首个国家级考古遗址公园。2021年入选全国十大考古新发现。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到凤阳县城西北，第一眼是一片铺开的皇城土垣——午门、西华门和近千一百米的城墙还立在原地，城砖上刻着洪武年间造砖工匠的名字。城外西南，明皇陵神道两侧三十二对石像生一字排开，一直望到朱元璋亲撰的皇陵碑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明中都皇故城（国保·国家考古遗址公园）：三城相套，宫城比北京故宫还大。午门、西华门和近一千一百米城墙至今存，城墙包砖上多有洪武纪年铭文；鼓楼台基高大，是明代国内最大的鼓楼台基；宫城里那块蟠龙石础重达二十余吨，为全国同类石础之最。午门正券两侧及凹字形楼台基部，总长四百余米的白玉石须弥座上连续镶嵌龙凤、鹿象、麒麟、牡丹、西番莲浮雕；奉天殿蟠龙石础为白色大理岩，埋头边长两米六二，础槽正中雕蟠龙、外围翔云，重达二十二吨。；明皇陵（国保）：凤阳西南，朱元璋父母兄嫂的葬地。神道约二百五十米长，石像生三十二对夹道而立，皇陵碑为朱元璋亲撰，记述早年艰辛身世。三十二对共六十四尊全为整块青石琢成，石质黝黑带红筋，自北而南依次麒麟、蹲狮、望柱、石马控马者、石虎、跪羊、文臣武将内侍；其中八尊半跪半卧的石羊取跪乳之义，六百年来石人衣纹、石兽鬃毛纤细处仍如新刻。皇陵碑高六米八七，螭首龟趺，碑文一千一百零五字，神道东侧对称立无字碑。；凤阳花鼓（国家级非遗）：明清传唱至今，说凤阳道凤阳的调子从街巷唱到今天。；小岗村：县城东，1978年十八户农民按下红手印搞大包干，那份契约是中国农村改革的起点。；历代帝王庙遗址：朱元璋在此祀三皇五帝。；肇建功臣庙：徐达、常遇春、汤和等淮西旧将的从祀庙。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王剑英（已故，人民教育出版社历史地理学家，1969年五七干校到凤阳，第一个系统研究明中都的学者）：\u003cbr\u003e&quot;我1969年到凤阳干校——那时候明中都就是一片荒地，皇城里还有个县城村住着1200多户人家。我蹲在鼓楼台基下面摸那青石板——那砖上刻着&#x27;洪武二年造&#x27;，砖缝里长着荒草，草下面埋着600年前的工匠手印。我花了10年写了《明中都城考》——现在这本书是研究明中都的权威。有人问我&#x27;朱元璋为什么放弃中都&#x27;，我说&#x27;\u003cstrong class=\"hl\"\u003e因为家太近了，近到他的老乡们跟他坐同一张桌子喝酒；又太远了，远到他能当皇帝却不能掌控家乡的权力\u003c/strong\u003e&#x27;。中都不是被洪水淹的、不是被兵燹毁的——是被乡愁放弃的。这在中国历史上独一份。&quot;\u003c/p\u003e"}, {"n": "宿州老城", "s": "宿州", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐元和四年（809）析徐州符离、蕲县与泗州虹县地置宿州，因汴河穿城、埇桥为水陆要冲。北宋时汴河漕运繁盛，苏轼《南乡子》称此去淮南第一州。明洪武十年（1377）垒石为基、砖石包砌，周四里余，四门各建戍楼，外有护城河。万历年间疏浚护城河、堤岸植柳。民国间城墙拆作工事，1938年遭战火。现存北城墙残段二百五十六米，列为市级文保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到宿州老城，第一眼是埇桥区政府后院那段北城墙——二百五十六米残墙贴着院墙立着，墙上石砌马面还在，砖缝里长草。城东北二十公里，蕲县古城的夯土城墙在平原上圈出一大圈旧轮廓。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宿州老城墙残段（市保）：仅存北城墙二百五十六米，现为埇桥区政府大院后墙。墙上石砌马面长约十八米、高约十一米，残砖断土至今可摸。残墙宽约二十四米、高约十米，垒石为基、青砖砌墙、内夯黄土；明洪武十年垒石包砖时周长近四千一百米，到上世纪七十年代只剩这一段贴着院墙。；扶疏亭：亭壁嵌着苏轼守徐州时遗墨竹的刻石，扶疏余韵为古宿州八景之一。今亭建于北城墙残段之上，坐北朝南，中高两低、殿堂五间；亭壁所嵌墨竹碑画疏竹两枝，刻东坡自题“寄卧虚寂堂，月明浸疏竹”诗与落款印章，元季兵燹后明弘治间知州曾显寻得残碑重立。；蕲县古城遗址（省保）：城东约二十公里，战国楚邑、秦代县治，夯土城墙周长约六千米，是陈胜吴广攻克的第一座城。；三贤庙：在蕲县古城旁，纪念陈胜、吴广、刘邦，庙前一棵老红果树相传是秦代旧物。；通济渠故道：宿州段与泗县段相连，为大运河世界文化遗产的一段河身。；城隍庙巷：南接中山街北靠胜利路，全长七十五米宽六米，旧城隍庙前巷道，今商业步行街。；前寺后遗址（汉，曹村镇寺后村）：汉代村落遗址，陶片散见。；何庄遗址（汉，曹村镇马湾村何庄）：汉代聚落，绳纹瓦片成堆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e地藏庙（故城隍庙址重建）：宿城现存唯一香火旺盛的古庙，一九九八年城隍庙拆后在旧址重建，砖木殿宇，香火甚旺。；宿州文庙大成殿：老城仅存文庙主体，清代木构，为宿州城内少数未拆旧庙。；扶疏亭 detail：宋建，元季毁于兵，明弘治间知州曾显追寻旧刻得残碑两刻构亭，今建成中高两低殿堂五间，碑石墨竹枝叶扶疏嵌于壁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李师傅（59岁，宿州市文物管理局司机，开了20年文物调研车）：\u003cbr\u003e&quot;我爹在埇桥区政府当过保安——他说他小时候北城墙还完整，城墙上能骑自行车，底下是州衙的后墙，谯楼暮鼓声从城墙角传出来。后来城墙一段一段被拆，拆到1970年代只剩最后这256米——就是现在区政府后院那段。我现在开的车，后备箱里永远放着一把铁锹——每次去蕲县古城，我都下车在城墙根儿转转，捡几块带花纹的陶片带回家。我家橱柜里摆了一排陶片——战国的绳纹瓦、汉代的方格陶、明代的城砖——都是我爹和我两代人捡的。我儿子在安徽大学考古系——暑假回来第一件事就是坐我车去蕲县挖陶片。&quot;\u003c/p\u003e"}, {"n": "寿县老城·宋代城墙", "s": "寿县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e前494年：蔡昭侯迁都州来（下蔡）。前241年：楚考烈王迁都寿春（郢），楚最后都城。北宋熙宁年间（1068-1077）：始筑城墙。南宋嘉定年间：重修加固，城墙兼作防洪大堤。唐：报恩寺、孔庙陆续兴建。1991年：淮河大水，城墙挡住城外汪洋。现状：城墙、四门、瓮城、月坝基本完好，见证两千五百年连续建城史。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走上东门宾阳门的城垛，脚下是一圈宋代老砖墙，城外就是淝水，1991年大水时城里人能坐在垛口把脚伸进水里洗脚。四门、瓮城、月坝一圈完好，安徽再找不出第二座宋代砖城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e寿州城墙（宋代始建，周长七里有余，高近十米）：土夯核心外砌青灰砖，砖缝以糯米汁拌石灰桐油勾缝，至今抠不动；四门东宾阳、南通淝、西定湖、北靖淮，门门带瓮城。城砖上一块块刻着历代修城年号，垛口青砖被九百年脚步磨出圆棱，墙顶走一圈，城外淝水波光与城内瓦房屋脊一齐入眼。1991年、2003年两次特大洪水，城外汪洋漫到垛口，城里人坐在城头把脚伸进水里，城内街巷滴水未进。；月坝（城墙下明代排水涵闸，东北角、西北角各一座）：东北、西北城根各一座砖石圆筒状坝体，像倒扣在地上的巨缸，直径约七米半、壁厚半米，坝身题“崇墉障流”与“金汤巩固”。坝内石阶可沿级递下到底，坝底涵道直角拐弯穿城而出，涵道口装只能外开的T形木塞闸门——平时城内积水自排，城外洪水凭水压自闭，借虹吸原理近五百年没失灵。本地人叫它“筛子池”，是古人的自动防洪闸。；宾阳门瓮城（东门）：四门中保存最原汁原味的一座，主门与瓮城门不在一条轴线，错位成“歪门斜道”，洪水冲来被拧成涡流卸力。门洞青砖拱券，券顶石缝里长着瓦松，门限青石被九百年车轮磨出两道深槽；城楼顶檐新修过，城砖还是宋代旧物，砖铭上“建康”“都统”字样依稀可辨。；报恩寺（唐贞观始建）：院内两株唐银杏遮天，树皮皴裂如鳞，树根把石阶顶出裂缝；北宋塔基地宫尚存，地宫石函压在大雄宝殿后。大雄宝殿十八尊清代泥塑罗汉满堂，袈裟褶纹里还留着旧彩绘，殿内柱础是青石覆盆式，风磨了几百年仍见刻线。逢清明庙会，殿前照常有香火。；寿州孔庙（唐始建，元迁今址，安徽最大）：五进院落，棂星门、半月泮池、戟门、大成殿、明伦堂一路排开；留犊祠巷、状元街、北过驿巷：老城巷名还挂在口上，东汉时苗留犊的故事就出在留犊祠巷。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌寿县牛肉汤铺老张（58岁）：\u003cbr\u003e&quot;1991年发大水，我蹲在东门城楼上，脚就搭在垛口，水都淹到城外田地那么高，城里头倒安稳。老一辈说&#x27;铁打的寿州城&#x27;，真不是吹牛。&quot;\u003cbr\u003e▌孔庙旁的退休教师李姨（65岁）：\u003cbr\u003e&quot;我带孙子认&#x27;投鞭断流&#x27;&#x27;风声鹤唳&#x27;这些成语，全出在寿县。寿县是500个成语的故乡，孩子课本上划出来的，好多我们脚下就踩得着。&quot;\u003c/p\u003e"}, {"n": "阜阳老城·颍州", "s": "阜阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周：胡子国建都于此。秦：置汝阴县。北魏武泰元年（528）：首置颍州。北宋：欧阳修、苏轼先后知颍州，盛赞颍州西湖。金元以后：黄河夺淮入颍，西湖被泥沙淤成平地。明正德九年至十一年（1514-1516）：砌南城，四角建敌楼。清康熙三十五年（1696）：建文峰塔。1939年：遵令拆城墙，仅奎星楼留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到老城东南拐角，只剩一座三层六边形小塔戳在高楼缝里，老阜阳人叫它&quot;三蓬塔&quot;——原是明代城角敌楼，城墙1939年拆光，就它一个留了下来替全城守着文运。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文峰塔（清康熙三十五年建）：七层八边形全砖塔，通高三十余米，一层独为一室，北门为阶梯入口，盘旋梯道贯顶。一、三、五、七层四面开四券形门，二、四、六层只朝东南西三面开窗，各层塔心室八角形；塔顶铁制五叉刹杆、三叠宝珠式塔刹锈成暗褐色，砖面被淮上风刮得泛白。塔与奎星楼一紫一青，隔老城遥遥相望。；资福寺（清代）：城内大寺，元大德间始建，现存大雄宝殿为明代木构，斗拱用材硕大，皖北保存较早的寺庙建筑之一。殿内一口宋代古井为建寺之初原物，井圈青石被井绳磨出深沟，井水四季不竭；一九九二年起全面修葺，至今香火绵延，老阜阳人仍叫它“大寺”。；城隍庙（明至清，建设街）；颍州西湖（今重建湖面约两平方公里）：照欧阳修&quot;平湖十顷碧琉璃&quot;一亭一桥往回建，湖亭、兰园、撷芳亭重新落水；资福寺 detail：城内古刹，元大德间建，现存大雄宝殿为明代木构，斗拱用材硕大，皖北保存较早寺庙建筑之一，一九九二年起全面修葺。；聚星阁旧址：老城东南旧阁基，青石台阶尚存。；白蟹泉：旧志所载泉眼，泉池石栏尚在。；阜阳老城砖石大街：鼓楼至大隅首一带青条石路面。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e奎星楼（明代，原东南城角敌楼）：全砖结构三层六边形，通高约十米，叠涩出檐起翘，戳在东城墙南路与临泉路交口的环岛中央。塔顶铁凤头西尾东，二三层门楣嵌“文光射斗”“奎壁联辉”石额，字口被风雨磨得发钝。塔内盘旋梯道贯顶，砖壁上龙凤、鹿鹤、鱼跃龙门砖雕还在；老阜阳人叫它三蓬塔、望霍楼、拐角楼，1939年拆城就它一个留下来替全城守着文运。；刘公祠（刘锜祠，西城墙路北侧）：明嘉靖十二年始建，祀南宋抗金名将刘锜，陪祀顺昌知府陈规、通判汪若海及副将赵樽、耿训等。清乾隆十年、嘉庆十三年、光绪三年三次重修，一九三九年秋拆，一九四七年甘肃静宁籍官员倡捐重建大殿三间厢房四间，二〇〇八年再修。现存大殿厢房各三间，殿内刘锜彩色塑像，山墙悬抗金楹联，殿前立清乾隆六年重修碑记。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌颍州老裁缝陈师傅（71岁）：\u003cbr\u003e&quot;老人都讲&#x27;七蓬塔能爬，三蓬塔爬不得&#x27;，说塔里睡着大蟒。其实那三蓬塔早先是东南城角的敌楼，望敌情用的，后来才改成求功名的风水塔，成了全城独一份的老底子。&quot;\u003cbr\u003e▌西湖边晨练的王大爷（64岁）：\u003cbr\u003e&quot;我小时候西湖早淤成平地了，只在老相片里见过。这几年政府照着欧阳修的诗一亭一桥地往回建，我领着孙子去，说&#x27;这就是当年跟杭州西湖并称的那个湖&#x27;。&quot;\u003c/p\u003e"}, {"n": "灵璧老县城·磬石之乡", "s": "灵璧", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e宋元祐元年（1086）：始置灵璧县。秦末楚汉：垓下之战，虞姬葬此。宋：磬云山采磬石进贡宫廷编磬。北宋：通济渠穿境。明清：钟馗画成年画大宗。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e出灵城往东走，一片荒草围着六米高的墓冢，汉白玉虞姬雕像立在湖边，垂柳绕着霸王广场；再上磬云山，宋代采石坑口还敞着，石头敲一下当当响如青铜。\u003c/p\u003e\u003cp class=\"main-text\"\u003e虞姬墓（城东，省保）：灵城东郊一片常绿树林里，墓冢阜高六米、基宽十一米，封土上草色四季不褪，南接垓下古战场，北临古汴河。墓前立高大石碑，碑额横书“巾帼千秋”，两旁刻“虞兮奈何，自古红颜多薄命；姬耶安在，独留青冢向黄昏”。墓侧颂虞姬碑廊由清安徽巡抚冯煦撰文，启功、舒同等名家书碑成林，字口新刻发亮；广场汉白玉虞姬雕像温婉，垂柳绕着霸王广场。；磬石山（国家地质公园）：渔沟镇东，灵璧石原生地，山上宋代古采石坑口还敞着，坑壁层层岩层如刀切，将军洞、拔剑泉、摩崖石刻沿山势散在。石头瘦皱漏透，叩之音如青铜，乾隆御封“天下第一石”；坑口石阶被石匠踩了几百年磨出凹痕，石缝里长着耐旱的荆条。；花石纲遗址（国保）：北宋给宫廷采运花石纲留下的采石遗迹；大运河遗址（灵璧段）：通济渠故道，近年勘探出土船具瓷片；灵璧钟馗画（省级非遗）：民间文化艺术之乡，钟馗画、剪纸、皮影世代相传；霸王城遗址（市保二〇一七年，尹集镇西北古濉水之滨）：项羽楚军驻地，夯土城垣轮廓仍高出地平线，文化层厚近两米。断面可见绳纹筒瓦、陶片一层层堆积，土色发黑，曾出土楚国蚁鼻钱、铜箭镞；城外濉水故道已成平畴，土城墩上长满酸枣刺。；正学书院（市保，明代）：明清皖北重要学府，建筑东墙至西墙保存明代格局，号舍基址犹存。；玉石山遗址（省保）：新石器台地，石斧石锛散见。；城后汉墓（县保二〇一〇年，金银山村丁谷眼庄）：汉代封土墓冢，高出平地数米。；武圩墓群（县保二〇一〇年，向阳镇韩姑堆）：汉代墓群，封土成堆。；老海寺（市保，明清）：深山古寺，院落尚存。；灵璧城隍庙碑：明万历四十七年《重修城隍庙记》碑，详载九省商帮捐资名录。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌钟馗画坊画师钟师傅（50岁）：\u003cbr\u003e&quot;我们灵璧人画钟馗，跟别处不一样——钟馗要画得又凶又亲。凶能镇宅，亲是老百姓把他当自家人。我爷爷那辈，过年集市上挂的全是钟馗像，孩子们追着看&#x27;钟馗嫁妹&#x27;。&quot;\u003cbr\u003e▌磬石山脚下的石匠老李（57岁）：\u003cbr\u003e&quot;灵璧石敲一下有铜音。乾隆爷封它&#x27;天下第一石&#x27;，我爹一辈子在磬云山凿石头，说宋朝就有人在这儿采石头给宫里做磬。摸一摸，是几亿年的东西。&quot;\u003c/p\u003e"}, {"n": "怀远老县城·荆涂峡口", "s": "怀远", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e四千年前：大禹会诸侯于涂山。汉高祖十二年（前195）：过涂山，命立禹王庙。南宋宝祐五年（1257）：设怀远军。明：常遇春故里常坟镇。2017年：禹会村国家考古遗址公园立项。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e禹王宫（省保，涂山之巅）：汉高祖十二年始建，占地三千四百余平方米，坐北朝南按八卦方位五进院落。第一进山门三间带两厢客房，第二进崇德院拜厅三间，西院吕祖殿北壁间嵌苏轼书《涂山诗》石刻，字口被香客摸得发亮；第三进禹王殿歇山顶，殿内泥胎彩绘大禹像，皋陶、伯益配祀左右。院内两株千年银杏大可数围，拔地而起，飞檐瓦当被山风磨得模糊；西北瞭望台登临，涡、淮波涌，荆、涂翠峰尽收眼底。；启母石（望夫石，文保单位）：涂山氏女盼夫化成的巨石；禹会村遗址（龙山时代，国家考古遗址公园）：大型祭祀台基，出土陶器来自六省，正应&quot;执玉帛者万国&quot;；卞和洞（省保，荆山半腰）：天然花岗岩巨石相扣叠成的岩洞，巨石如门弓腰方入，洞内可容十几人，洞顶石缝漏下天光。洞壁上有明清游人题刻，字迹被青苔盖去一半，须俯身用手拂开才读得清；北望荆山山脊如巨龙，洞在龙首之东胯下，传为卞和抱璞泣玉处。；白乳泉（省保第九批）：荆山北麓，背山面淮，东与涂山隔河相望。泉池石砌方井，井壁青石被泉水浸成青黑色，水清浮乳，苏轼品为天下第七泉；泉四周榴林似海，五月花开如千株红珊瑚，八月石榴熟透掰开红籽如宝石。泉旁双烈祠为县保，纪念黄花岗宋豫琳烈士，望淮楼檐角挂的铁马迎风作响。；常氏三王墓（常遇春祖坟，省保）、常遇春纪念馆；禹王宫（省保）：涂山之巅，汉高祖十二年始建，占地三千四百余平方米，按八卦方位五进院落。现存灵官殿、禹王殿、启母殿、老君殿，飞檐瓦当被风磨得模糊。殿内悬无字匾额，传为乾隆手书。；白乳泉（省保第九批）：荆山北麓，背山面淮，东与涂山隔河相望。泉池石砌方井，水清浮乳，苏轼品为天下第七泉。泉旁双烈祠为县保，纪念辛亥黄花岗宋豫琳烈士。；大圣寺：白乳泉景区内，千年古寺，现存大雄宝殿、藏经楼，寺前古银杏一株树龄千年。；卞和洞（省保）：荆山半腰，天然花岗岩叠成的岩洞，巨石相扣，弓腰方入，洞内可容十几人。洞壁上有明清游人题刻。；望禹亭与台桑景观：涂山南坡石板步道登临，望禹亭面对淮河拐弯，台桑为传说大禹娶涂山氏处，立有解释碑。；青云楼（县保）：荆山镇，明代古建筑，三层楼阁式，六角攒尖，登楼可俯看县城与涡淮交汇。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌涂山庙会常客涂大爷（72岁）：\u003cbr\u003e&quot;每年农历三月二十八涂山庙会，省里都列了非遗，祖祖辈辈上山拜禹王。我们这儿石榴五月开花像火，八月熟透掰开红籽像宝石——就长在荆涂二山夹着的淮河边上。&quot;\u003cbr\u003e▌禹会村放牛的老马（63岁）：\u003cbr\u003e&quot;早先在地里刨出陶片，谁也没当事，随手就扔。考古队一来，说这是四千年前大禹开会的地方。我才明白，脚下踩的是夏朝的一个脚后跟。&quot;\u003c/p\u003e"}, {"n": "太和老县城·细阳故城", "s": "太和", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：宋襄公&quot;鹿上之盟&quot;在此。前253年：楚考烈王迁都钜阳。秦：置新阳县。汉：置细阳县，夏侯婴食邑细阳。元大德八年（1304）：始建今县城，建文庙城隍庙。明洪武三年（1370）：改&quot;泰和&quot;为&quot;太和&quot;。1941年：城隍庙毁。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e文庙大成殿（省保，元末明初木构，皖北唯一）：黉学街正中，单檐歇山顶，方形台基高出地面约三尺，面阔五间进深四间，二十六根立柱撑起整座大殿，柱下一律青石覆盆柱础。梁架式与穿斗式结合，是南北风格相融的孤例；原装古建只剩大成殿与背后崇圣祠，殿前泮池四周汉白玉石栏整整齐齐围着月池，望柱头的小狮子被几百年手摸得浑圆。广场上常年有人蘸水练字，老木头柱子纹理粗粝，凑近能闻到旧木香气。；南寺（省保，人民北路）：吕字形宫殿式建筑，一部分上街沿还占着马路；枕头馍（文庙小摊）：外皮酥脆层层分明，一个够吃一个礼拜；太和板面：一清二白三红四绿配卤羊蹄；倪邱集遗址与倪公祠（省保）：县北三十公里倪邱镇，传为西汉御史大夫倪宽葬衣冠处。土台高出平地数米，台上坐东朝西建大门、汉相殿、课最堂、经锄楼；经锄楼临茨河而建，为二层硬山楼阁，临茨河一面开窗，旧时秋月悬楼前水面。楼前古柏一株传为明代所植，枝干横斜，楼柱上刻倪宽带经而锄故事楹联，字口深峻。；清真北寺（省保，人民北路）：明洪武十年始建，建筑汇南北寺院风格，大殿面阔七间，青砖对缝砌筑，窑殿穹顶以砖叠涩而成。礼拜殿为主体，面阔五间进深三间，十一架前后廊，檐角飞翘；月台上望月亭尚整，与清真南寺并称县内两坊。青砖墙根被几百年鞋底磨出浅槽，殿内地毡仍在礼拜。；徐氏宗祠暨杨虎城故居（省保）：城关旧巷内，为民国将领杨虎城早年在太和驻节时所居，前后两进砖木院落，梁枋雕花尚整，天井石板被脚步磨出凹痕。；灰角寺遗址（省保）：苗老集，新石器时代台地，文化层厚数米，地表散见红灰夹砂陶片，早年曾出石斧石铲。；新郪遗址（城孜故城，县保）：赵庙镇城孜行政村，战国魏地、东汉建武五年分封诸侯国之城址。夯土城垣残段断续可辨，城内瓦砾遍地，地面可拾东周夹砂红陶片。；经锄楼（市保）：倪邱镇茨水北岸，二层硬山楼阁，临茨河一面开窗，旧时秋月悬楼前水面，为太和八景锄楼映月所在。楼柱上刻倪宽读书故事楹联。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城隍庙遗址：1941年被毁，只剩&quot;城隍庙&quot;地名。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文庙广场练书法的刘老师（56岁）：\u003cbr\u003e&quot;大成殿那几根柱子是元末明初的老木头，全皖北独一份。泮池的汉白玉栏杆别的县早没了，我们这儿一圈还整整齐齐。太和是书画之乡，广场上常年有人蘸水练字。&quot;\u003cbr\u003e▌老城隍庙巷口的老住户徐奶奶（81岁）：\u003cbr\u003e&quot;我小时候每年清明&#x27;城隍出巡&#x27;，抬着木雕的城隍爷出南门进东门，各街出龙灯、旱船，热闹得过节。后来庙没了，这出巡再也没抬起来过。&quot;\u003c/p\u003e"}, {"n": "颍上老城·慎邑·管仲故里", "s": "颍上", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e周：慎邑，属楚。秦：置慎县。隋大业二年（606）：改名颍上县。春秋：管仲鲍叔牙故里。明清：外城河老街格局形成。1991年：洪水后建八里河。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沿外城河走，一溜青石板马头墙复建古街，晚上红灯笼一亮像到了江南——其实是淮河边；管鲍祠就缩在老街中段，纪念两个两千年前让权让金的人。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明清苑（皖北规模最大明清古建筑群）：占地三十八亩，建筑面积一万三千平方米，以沙颍河故道为水脉，集中原之恢弘汇江南之神秀。整体四进院落布局，十三院落、八大外院、五大内院，砖瓦缝合、斗拱飞檐，砖石木雕精工细作；系搜罗各地明清旧构件重新拼装，梁枋与门墩带着别处老屋的包浆，被誉为皖北第一苑。；九合塔：临水古塔；八里河（国家5A）：1991年灾后全镇小推车推出来的&quot;天下第一农民公园&quot;，曾获联合国&quot;全球五百佳&quot;；颍上花鼓灯（国家级非遗&quot;东方芭蕾&quot;）、推剧发源地；尤家花园（省保二〇〇四年，城西五里湖畔）：清末豪绅尤荫轩私园，一九二三年前后扩建，初名游园，民间以谐音称尤家花园，解放后改淮上公园。园四面环水，三水绕四园，亭台楼阁十八座、桥十八座各各不同，砖墙、护城河、角楼的防御格局犹存。主体建筑砖木结构，飞檐翘角，青砖灰瓦，砖雕木雕石雕题材多吉祥纹样；藏奇花老树，人称皖北豫园。；尤氏故居：花园旁五进三院旧宅，青砖马头墙，为尤荫轩旧居，木构件保存尚整。；迪沟风景区：张庄乡湖心岛上竹音寺，五百罗汉堂木雕满堂，大殿依山傍水。；慎城遗址（春秋慎邑故址）：淮河北岸旧慎城，夯土城基尚在，地表散东周陶片。；甘罗城（江口集）：秦上卿甘罗故里旧筑，土台高地尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e管鲍祠（省保，管仲老街中段）：原名管子祠，明万历六年知县屠隆重建并作《管鲍祠碑记》，明末毁于战火，清道光六年重修。祠由门厅和正殿组成，正殿坐北向南面阔三间，民间硬山抬梁式，屋面青色筒瓦盖顶，饰五脊六兽；院西侧管仲衣冠冢封土犹存，墩前树碑两方，一书“管仲父墓”，为明万历十六年所立。封土上草色葱茏，殿内梁柱还留着旧彩绘。；管鲍祠（省保，管仲老街中段）：原名管子祠，明万历六年知县屠隆重建并作《管鲍祠碑记》，明末毁于战火，清道光六年重修。祠内管鲍享殿三间，殿后管仲衣冠冢与管仲父墓封土犹存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌管仲老街开茶馆的小管（45岁）：\u003cbr\u003e&quot;我们颍上人出去说&#x27;管仲是我们县人&#x27;，谁听了都信。老街这些马头墙是照老样子复建的，晚上灯笼一亮，外地客都说像在江南——其实这是淮河边。&quot;\u003cbr\u003e▌八里河畔的沈大爷（70岁）：\u003cbr\u003e&quot;八里河是发大水之后，全镇人用小推车一车车推出来的。当年照着挂历上的名胜照片自己琢磨着建。我指着那座假山跟孙子说：这山，爷爷也推过一铲子土。&quot;\u003c/p\u003e"}, {"n": "临涣老城·铚城", "s": "临涣", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：宋国设铚邑，夯筑土城。战国：属楚。秦：置铚县。汉：仍为铚县；唐改称临涣。明：商贸鼎盛，&quot;两庵四寺九阁十八庙&quot;。1968年：退城还田，城墙多处遭破坏。2006年：临涣城址列第六批国保。2017年：省考古所解剖东北角断面。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e临涣古城墙（国保，夯土）：浍河北岸，整体呈方形，东、北、西三段基本完好，总长近五千八百米，残高五至七米。黄土层层夯筑，每层厚六至十五厘米，夯窝密布、窝径约一掌，夯土里混着砂礓、瓦片、螺蛳壳、蚌壳；城上豁口十二处、外凸台墩八处、四角角楼基础仍在。城外北东西三面护城河部分淤塞成稻田，断面在镇政府西侧停车场北，新修石阶可登，夯土断面夹着汉代陶片。；南阁楼（玉皇阁，砖石结构）：临涣唯一砖石城楼；文昌宫（唐代始建）：前后三进院落；怡心茶楼（1909年始建，两层三进天井）：棒棒茶一元一壶；棒棒茶：六安茶梗配龙须泉水冲泡，别处泡不出这股绵甜；临涣城隍庙（县保）：古城中部，清雍正庚申年间建，四合院落。后大殿三间长十米宽五点八米，青砖小瓦高脊出厦，花格门窗皆作拱形；八棱形石质廊柱上阴刻对联“罪有重轻罚，富而不仁”，字迹至今可辨，石柱面被香客磨得发滑。院中天井石板被脚步磨出凹痕，门缝里长出瓦松。；蹇叔墓：镇西蹇山之阳，传为春秋秦相蹇叔葬处。封土高大，周围植柏，墓前立清代墓碑。墓旁蹇家古街地名沿用至今。；回龙泉与老泉井：城南浍河岸边，井圈青石整块凿成，被井绳磨出数十道深沟，沟里嵌着旧麻绳的颜色。棒棒茶即以此泉水冲泡，井水四季不涸，泡茶味绵；井台石板被几百年挑水人踩出弧形凹面，泉边老柳树根盘过井沿。；古城墙断面：镇政府西侧停车场北，新修石阶可登城垣，夯土断面夹着汉代陶片，城上石板步道沿旧城墙走势铺出，立有临涣古城模型图，示意南临浍河、北有护城河的格局。；淮海战役总前委文昌宫旧址（国保）：城内东北角，唐始建，原名尚书宫。前后三进院落，青砖小瓦砖木房屋五十八间，占地三千平方米。1948年11月刘邓陈驻此指挥淮海第一阶段。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e临涣石板老街：南阁街、文昌街沿浍河排开，青石板被独轮车碾出深深凹槽，缝里嵌着旧时车铁，雨天积一层水光。街两侧老茶馆一家挨一家，竹椅方桌摆到门外，一元一壶棒棒茶续水一天，老茶客清早来敲门、下午再坐一趟；南阁楼（玉皇阁）原高十五米长十二米宽九米，始建于唐，一九七八年拆除，街名仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌南阁街烟酒店老板李广英（63岁）：\u003cbr\u003e&quot;我祖上开染坊，这条南阁街从前就是牛市，浍河边一天几百头牛。现在老茶客天天清早来敲门，我晚开一步门口就一堆老头等。&quot;\u003cbr\u003e▌怡心茶楼掌柜张秀侠：\u003cbr\u003e&quot;三十多年前我接手时一壶棒棒茶两毛钱，十年前定成一元就没涨过。镇上老人一天来两趟，不为喝茶，就是来坐坐说说话。&quot;\u003c/p\u003e"}, {"n": "界首老城·颍滨彩陶乡", "s": "界首", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐宋：颍河南岸出现以黄河淤土为原料的陶窑。元延祐间：黄河泛滥，淤土分大小胶泥。清：田营形成十三窑，村以窑为名。1954年：卢山义&quot;刀马人&quot;三彩酒坛上苏联杂志。2006年：界首彩陶烧造技艺列首批国家级非遗。2019年：田营十三窑列省保；2022年抢救性修复。2025年：工艺陶瓷厂老窑入选省四普十大新发现。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沙颍河南岸田营镇，十三个以窑为名的村子围着河湾转，老窑口修复前长满树，红砖烟囱从工艺陶瓷厂院子里戳出来——这就是界首彩陶的老家，唐三彩的余脉。\u003c/p\u003e\u003cp class=\"main-text\"\u003e田营十三窑古窑址（省保）：沙颍河南岸田营镇，卢窑、魏窑、计窑等十三口窑围着河湾转，村以窑为名。计窑南北七点五米、东西十五点七米，卢窑七点二三方正，窑口老砖壁尚在；二〇二二年修旧如旧，修复前窑口长满野树。窑壁残砖被火烧成酱红色，灰缝里夹着旧时陶渣，周边田埂上陶片散见。；界首彩陶（国家级非遗）：三彩刻花、刀马人刻画，七十二道工序烧三个多月；界首工艺陶瓷厂老窑：红砖烟囱高耸，韩美林曾多次来此，2025年改陶艺公园；彩陶博物馆（田营镇韩楼村）：可研学制陶；卢氏刻花彩陶传习所（城区）：国家级传承人卢群山设；大黄庙（阜阳市保二〇一二年，大黄镇大黄集东西大街）：始建于唐，原占地四百八十亩分东中西三院，前中后三门，有伏羲楼、神农楼、钟鼓楼。今存大门楼、二门楼与前后两进院落，占地一千二百平方米，主房厢房耳房二十八间，传统“明三暗九间”，外面看三间里面实为九间。青砖小瓦，梁枋雕花尚整，建国初曾为界首市政府办公地，木门槛被几代办公人员踩出圆棱。；臧公馆（省保）：城区新华街中段，系爱国将领臧致平民国十三年所建，占地约九百余平方米，面南临街、二进院落，有大门楼、二门楼、前后两进。砖木楼房，清末民初北方大宅院风格，是皖北唯一保存完整的民国时期建筑；建国初期曾为界首市政府办公地，今抢救性维修后仍存旧木门与天井石板。；王庄古文化遗址（阜阳市保）：田野台地，陶片散见。；两湾湿地公园：沙颍河与泉河故道交汇河湾，芦苇连片。；计窑址、卢窑址本体：二〇二六年省政府划定保护范围，计窑南北七点五米、东西十五点七米，卢窑七点二三方正，窑口老砖壁尚在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌田营镇制陶世家卢一林（市级非遗传承人）：\u003cbr\u003e&quot;上一批彩陶烧出来，72道工序我盯着过了三个多月。梅瓶、观音瓶、石榴瓶，窑门一开流光溢彩。&quot;\u003cbr\u003e▌计村老艺人计文刚（67岁）：\u003cbr\u003e&quot;现在村里就我还做陶了，做了一辈子。我要是不做，这手艺就绝了。&quot;\u003c/p\u003e"}, {"n": "临泉老城·沈子国", "s": "临泉", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e前1042年：周文王第十子聃季载受封沈地，建沈子国。前506年：沈为蔡所灭，后归楚。秦：设平舆县。西汉：西部置鲖阳县。1934-1935年：析阜阳西乡设临泉县。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沈子国古城遗址（省保）：县城西古城子，北依泉河南临流鞍河，平面近方，总面积约五十五万平方米，城内约四十一万平方米。城墙、护城河、古城堡、烽火台犹存；考古下挖五米见十一层文化层，上层明代、下层西周，城边出土青铜镞、陶范。西北角夯土烽火台高出周围农田两三米，台上荆棘丛生，台下即泉河故道，犁地还能捡着黑陶片。；老丘堆（沈子墓，新石器遗址）：流鞍河南岸，椭圆形封土堆长五十余米、宽二十余米、高十余米，西北角封土高约八米。台地出土石斧、石锛、骨针、陶方鼎；一九七六年群众躲洪水在封土上居住，挖出过完整陶器。堆上草色深绿，旁立解释碑，相传聃季载葬于此。；通教寺银杏树（唐代，两千多年）：高三丈余、胸围近三米，“九棱十八丫”，树干皴裂如鳞，根部盘突出地，传有李自成马蹄印。树龄近一千四百年，至今枝繁叶茂，树下立着历代残碑；老沈姓人在外乡找到祖坟，就在这树下抱树而哭。；鲖阳古城（鲖城北郊）：陶片瓦砾俯拾，出土楚国&quot;郢爰&quot;金版、铜镜、石磬；姜尚故里（姜寨镇）：太公庙、姜公冢、&quot;姜尚故里&quot;石碑；民国临泉县政府旧址（省保第八批）：顺河老街内，民国砖木两层办公楼，洋式拱券门窗，红砖清水墙，檐口线脚仍在。今辟为老街展览馆，木楼梯踩上去吱呀作响，窗台下青石被几代人倚出光滑面；府门原骑棋盘街而建，影壁墙上曾嵌“古沈亭”“挚亭”等古碑。；顺河老街：泉河南岸，青石板路、古牌坊、老字号铺面，复建后红砖黛瓦，沿街为非遗小店与杂技茶馆，夜有灯光秀。；魏野畴烈士纪念馆：县城内，纪念皖北党组织创始人魏野畴，四合院院落，陈列革命文物。；鲖阳城址与蔡侯申钟出土地：鲖城镇北郊，两汉魏晋两度设郡，城垣残段在田野中隆起，地表散见黑陶片，旧出土楚国郢爰金版、铜镜、石磬。；老丘堆商周车马坑：流鞍河南岸新石器台地上，已发掘出西周车马坑遗迹，旁立解释碑，封土长五十余米宽二十余米高十余米。；沈子国古城烽火台：城西古城子西北角夯土台墩，高出周围农田两三米，台上荆棘丛生，台下即泉河故道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌古城子旁老人王大爷（71岁）：\u003cbr\u003e&quot;都说我们临泉三件宝——老丘堆、银杏树、古城堡。我在银杏树底下乘了一辈子凉，二十年前有个沈姓宗亲从外地回来，跪在树底下抱着就哭，说找着祖坟了。&quot;\u003cbr\u003e▌鲖城镇赶集的刘婶（58岁）：\u003cbr\u003e&quot;鲖阳古城那片地金贵，犁地都能犁出黑陶片。老辈说这是楚国铸钱的地方，我们管那叫&#x27;鬼集&#x27;——阴天夜里老听见铜钱响。&quot;\u003c/p\u003e"}, {"n": "凤台老城·州来下蔡", "s": "凤台", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：楚灭州来国。前493年：蔡昭侯迁都州来，改称下蔡。秦：置下蔡县。汉：刘安封淮南王，编《淮南子》。清雍正十年（1732）：置凤台县。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e寿唐关（县保）：县城南三公里三峰山余脉东楼山与西楼山之间垭口，卡在寿凤古道最低处，地势最窄处仅容一车。关门全用块石条砖混合砌成，券拱南北走向偏东十度，通长近十九米、东西宽两米半，南向通高约四米半；块石以白灰膏嵌缝，其上青砖起券。关上原重楼钟鼓楼已塌，仅存关身与东侧碑刻一面，阴刻楷书“古寿唐关”四字，关两侧三十余间楼基夯土残迹尚在。；八公山（豆腐发源地）：西汉淮南王刘安炼丹用卤水点出豆腐；淮河故道（黑龙潭至峡山口段）：山高水急，淮河出峡第一景；刘安文化遗存：《淮南子》&quot;一人得道鸡犬升天&quot;典故地；慰农亭与硖山口摩崖（省保）：县城西南三公里西硖石顶，西硖石独立河心，形似昂首逆行的神龟。清光绪三年凤台知县颜海飏重建石构方亭，石柱飞檐，亭额“慰农亭”三字，亭柱刻颜氏手书长联“选胜值公余，看淮水安澜，硖山拱秀；系怀在民隐，愿春耕恒足，秋稼丰登”。亭西一株千年古皂荚，铁干虬枝，雷击与战火痕迹犹存；亭旁崖壁摩崖石刻《筑城记》字口风化，站亭上望淮河自东硖西硖之间夺路而出。；寿唐关（县保）：县城南三公里三峰山余脉东楼山与西楼山之间垭口，卡在寿凤古道最低处。关门全用青砖砌成，券拱可行车马，关上原重楼钟鼓楼已塌，仅存关身与东侧碑刻一面，阴刻楷书古寿唐关四字。关两侧三十余间楼基夯土残迹尚在，南绾寿州北控下蔡，地势最窄处仅容一车。；廉颇墓：县城东北八公山纪家郢放牛山之阳，封土如山，墓前原有石人石兽多已散失，现存封土高约五六米，周围广植松柏。墓前立清光绪年间所立新碑，楷书赵将廉颇墓三字，当地人呼为颇古堆。；清天观与茅仙古洞：城南三公里三峰山南坡，西汉地节间茅盈草庵旧址。观前石阶自上而下，正殿三进依山叠起，崖壁上嵌明清碑刻十余方，字口被风雨磨浅。古洞在观后崖腹，洞口朝北，内有石榻石灶，传为茅盈修炼处；三面环水，淮绕山脚，山石倒长南仰北倾。；凤台千年银杏树：城南茅仙洞景区内，树龄逾两千年，胸围需三人合抱，树干中空仍枝繁叶茂，秋后满树金叶。树旁立有清人题咏残碑半截，字迹漫漶可辨。；黑龙潭故道：硖山口下游淮水回旋处，潭水深不可测，崖壁下有摩崖石刻，旧志载两岸石上有禹疏凿旧迹。枯水期滩涂露出，黑石层叠，水色墨绿，与上游清亮淮水判然两色。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌茅仙洞山下老船工常大叔（68岁）：\u003cbr\u003e&quot;我撑了一辈子淮河船，就数峡山口那段最险，船贴着一线天过。茅仙洞的道士说这是&#x27;淮上第一胜境&#x27;，夏天进去乘凉，比空调房还舒服。&quot;\u003cbr\u003e▌八公山豆腐坊刘婶（61岁）：\u003cbr\u003e&quot;我们这豆腐是两千年前刘安炼丹炼出来的，卤水一点，白得像玉。我这豆腐坊传了三代，豆子是本地豆，点浆用八公山的水，别处做不出这股嫩。&quot;\u003c/p\u003e"}, {"n": "五河老城·五水汇聚", "s": "五河", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e清末：五河口成天然良港，顺河街逢集成市。光绪二十年（1894）：县志载&quot;顺河街在东桥口，迤南，每日逢集&quot;。民国初：粮行二十多家增至七十多家。2006年：顺河老街列省级历史文化街区。2026年3月：城墙旧址、码头旧址、纪念碑列四普新点。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e顺河老街（省级历史文化街区）：淮、浍、漴、潼、沱五河汇口，水巷、小东河巷、河西街、元宝街、顺河老街五条历史街巷沿水排开。胡家大院、九和粮行、陈家果行、丁家宅院、张家果行、丁家粮行、板桥七处历史建筑门脸还挨着；九和粮行在桥口，邓家主宅堂屋保留清末建筑基本特征，为一级保护历史建筑。青石板被独轮车碾出凹槽，黄霭堂杂货店、陈万兴粮行、邓春芳油行三家老屋仍在。；东桥口码头：三十六阶石阶埋于地下，上世纪八十年代覆土保存；清末建筑：黄霭堂杂货店、九和粮行、张家干果行、陈家水果行部分房子；五河民歌（国家级非遗）、临北狮子舞、钱杆舞；古城墙旧址（淮河路，2026年立牌）；化明塘严氏墓（国保，第七批）：县城东南小溪镇化明塘村东南五百米，传为明太祖严氏未婚妻墓，明代一品夫人规制，坐北朝南背靠大巩山。神道长三十米，两侧望柱一对顶雕小狮，石虎蹲踞、石羊跪卧、石马俯首、石翁仲文武各一，均为青石雕成，风化较重但轮廓清晰。神道后享堂已塌，仅存无字碑，碑座为龟趺；墓园内出土洪武五年、七年纪年铭文砖。；临北淮河古渡口遗址：临北回族乡淮河北岸，考古发掘揭示出保存完好的古代码头石砌驳岸与石阶，为淮河流域迄今唯一经正式发掘的古渡口遗址。石砌驳岸条石咬合紧密，石阶一级级探入河坡，今立保护标志，枯水期可走下阶石。；霸王井：县城内旧街口，传项羽屯兵时所凿。井圈青石圆形，被井绳磨出多道深沟，井水清冽；井上旧有亭已废，井台石板被脚步磨凹成弧形，街坊至今仍来提水。；仙人洞与大巩山：城东大巩山，旧传仙人在此炼丹，洞口石缝中曾出明清瓷片。山不高而石色赭红，与浮山隔淮相望，旧有大巩点把火、浮山冒青烟之谚。；五河盐卡遗址：淮河北岸旧盐卡，旧时淮盐过境查验处。石砌墙基残段嵌入堤坡，旁立四普新立保护碑。；严氏墓望柱石像生：化明塘严氏墓神道两侧，一对望柱顶雕小狮，石虎蹲踞，石羊跪卧，石马俯首，均为青石雕成，风化较重但轮廓清晰。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌顺河街邓家后人小邓（52岁）：\u003cbr\u003e&quot;我曾祖父开九和粮行，红火到蚌埠信丰面粉厂的采购员常年住我家。小时候东桥口码头石阶还能走，后来给土盖起来，我路过就扒开看两眼。&quot;\u003cbr\u003e▌老街住户陈奶奶（76岁）：\u003cbr\u003e&quot;五河五条河，吃水靠人驮。我年轻时天天挑淮河水，顺河街码头卸粮的、上船的，一天到晚不断人，比现在赶集还热闹。&quot;\u003c/p\u003e"}, {"n": "阜南老城·台家寺", "s": "阜南", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e商代中晚期：台家寺为商王朝在淮河最高等级聚落。前639年：宋襄公鹿上会盟。1957年：农民徐庭兰润河一网捞出八件商铜器。1949-1950年：设阜南县。2014-2017年：武大考古所发掘台家寺。2019年：台家寺遗址列第八批国保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e朱寨镇三河村润河湾北岸，一圈方形环壕围着大台墩，台基上是三千年前的铸铜作坊，一千多块陶范摞在坑底——国家一级文物龙虎尊就是在这就地铸出来的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e台家寺遗址（国保）：朱寨镇三河村润河湾北岸，一大台墩带四小台墩，方形环壕围内有大型宫殿基址与铸铜作坊。铸铜作坊位于北部台基最东边，由多个柱洞围成曲尺形工棚，东西约六米八、南北约七米；南部曲尺形半地穴工作面上覆一层白色碳酸钙烧结面，肉眼可见青铜颗粒。已发掘二十八个灰坑，出土陶范一千一百七十四块，证实龙虎尊在此铸造。；龙虎尊（国家一级文物，禁止出境）：肩盘三龙、腹刻双虎食人纹，1957年润河出水，现藏中国国家博物馆；原鹿故城遗址（公桥乡阮城村）：春秋鹿上会盟地，夯土城墙与护城河遗迹尚存，田野上土埂隆起。地表能捡楚国蚁鼻钱、汉镜碎片，瓦砾遍地；城址内新种庄稼，残墙断埂成了田埂分界。；商代铜方鼎、铜鬲（1944年润河湾出土）：比龙虎尊早十三年；贺胜台遗址（县城东二十公里黄岗集西南一公里）：台地高出地面六至七米，现存一千多平方米，文化堆积层厚三米五，地面散篮纹、绳纹、云雷纹陶片。；七星桥遗址：田野古桥基，青石桥墩半埋土中。；中岗清真寺：中岗镇老街，始建于明初，砖木礼拜殿融合中式砖木与伊斯兰风格，望月楼高耸、殿宇古朴，院内古柏苍劲。望月亭尚在，礼拜殿青砖对缝，门楣木雕花卉；为皖西北重要的伊斯兰文化遗迹，至今仍作礼拜用。；王店孜乡五岳庙：千年古柏两株、百年银杏数株围庙而立，庙屋近年重修。；长子街古桥（县保）：明代砖砌五孔拱桥，桥墩用石磙装基石，为明代造桥典型做法。；万沟遗址（王化镇万沟集东两公里）：新石器晚期台地，背坡面湖，高出地面一至三米，面积二千五百平方米，一九五〇年小学校长刘金屏带师生捕鱼时发现，采集陶片、蚌壳、石器。；王家坝闸（一九五三年建成）：千里淮河第一闸，连拱坝横在淮河上，蒙洼蓄洪区闸门。自建成以来十三个洪水年份先后十六次开闸蓄洪，累计蓄洪数十亿立方米；闸体混凝土拱垛立在河滩上，老闸档案与纪念亭在闸旁，坝顶公路仍可步行过河。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌朱寨镇三河村放牛老汉徐大爷（70岁）：\u003cbr\u003e&quot;1957年徐庭兰在河里撒网，一网兜上来个大家伙，锈得发黑。政府奖了他200块，顶我爹半年工钱。后来才晓得那叫龙虎尊，进北京了。&quot;\u003cbr\u003e▌博物馆讲解员小张（28岁）：\u003cbr\u003e&quot;台家寺挖出1174块陶范，专家一比，跟龙虎尊纹路严丝合缝——原来这尊是三千年前就地在润河边铸的，不是外面运来的。&quot;\u003c/p\u003e"}, {"n": "谷阳老城·固镇", "s": "谷阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉初：筑谷阳城，属沛郡。后汉：属沛国。南北朝：北魏置阳平郡，太和间改谷阳郡，城为谷阳镇（俗称谷镇，后演为固镇）。隋：废郡仍为谷阳县。唐显庆元年（656）：省谷阳入蕲县，城废。2004年：列省保。2025年：编制保护规划。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e出县城往东，四方土城趴在河北岸，每边城墙约一公里，地表一层汉代碎瓦，一锄下去全是&quot;谷阳&quot;旧物——这就是《说文解字》作者许慎当过县长的谷阳城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e谷阳城遗址（西汉，省保）：县城南浍河南岸，四方土城每边约一千米，面积约一百万平方米，四门居中且居各边正中。遗址比周围高出约三米，城墙残高平均三米半，上宽二十米、基宽三十米，城内文化层厚三米半；地表遍布汉代碎砖瓦陶片，一锄下去净是汉瓦。2015年起栽下四十七种约十五万株樱花环绕古城墙，春来粉白压城。；固镇县博物馆：馆内三千余件文物从远古排到民国，展谷阳之玺、汉鎏金龟形砚滴、汉黄釉水波纹盖鼎；一件刻画纹大口陶尊腹壁刻日月山符号，学者指为早期文字雏形。玻璃柜里垓下之战出土兵器箭镞锈成青黑色，与汉瓦当并排陈列。；许慎文化公园：纪念东汉字圣许慎；谷阳城樱花景观带：数十万株樱花环绕古城墙；垓下遗址（国保，濠城镇北沱河南岸）：俗称霸王城，不规则四方土城趴在沱河边岗地上，四角呈弧形。西墙长约四百五十米、北墙三百四十米、南墙二百八十米、东墙四百米，城垣内近十五万平方米，城墙残高二至三米，城外一圈护城河与沱河相通，水面宽处一二十米。城下叠压四千六百年前大汶口文化晚期夯土城圈，是淮河已知最老的城址；新建遗址博物馆外墙还原夯土肌理，声光电沙盘复原十面埋伏。；集东遗址：县城东北七千五百年前新石器台地，高出平地数米，地表散布红衣陶片与夹砂蚌器。；南城子遗址（省保）：距今四千九百年新石器台地，断面文化层叠压清楚，绳纹陶片散在田埂。；固镇县博物馆：馆内展谷阳之玺、汉鎏金龟形砚滴、汉黄釉水波纹盖鼎；一件刻画纹大口陶尊腹壁刻日月山符号，学者指为早期文字雏形。；淮北西大门抗战烈士陵园：任桥镇清凉村，墓碑成排，松柏围拢。；津浦铁路固镇火车站旧址：城关镇车站居委会，老站房砖墙与拱窗尚在。；小王庄霸王城遗址：连城镇谷阳村小王庄东南，夯土城压在村边地头。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌谷阳村种地老农（60岁）：\u003cbr\u003e&quot;地里一锄下去净是汉朝碎瓦片子，早先不知道是宝，都捡去垫了猪圈。后来划成文保，种地都得绕着城墙根走。&quot;\u003cbr\u003e▌许慎文化公园晨练老人：\u003cbr\u003e&quot;固镇人一提起许慎，腰杆都直——写《说文解字》的字圣，在俺们这当过官呢。&quot;\u003c/p\u003e"}, {"n": "濉溪老城·柳孜运河·千年口子酒·临涣茶镇", "s": "濉溪", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e隋大业元年（605）开通济渠，濉溪正当汴水入睢之口。唐宋时柳孜为运河岸边码头，千帆往来。明万历年间镇上酒坊十余家，清晚期增至七十二家。1999年柳孜运河遗址发掘，出土唐代沉船与宋代码头，入选当年全国十大考古新发现。2001年柳孜运河遗址列为全国重点文物保护单位。2014年随中国大运河列入世界文化遗产名录。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到濉溪，一半在地下一半在桌上：百善镇柳孜村地下埋着宋代码头和唐代沉船，老城石板街上还走着口子酒的老井老窑池，浍河北岸的临涣古镇，茶馆里五块钱一壶棒棒茶能坐一天。\u003c/p\u003e\u003cp class=\"main-text\"\u003e柳孜运河遗址（国保·世界文化遗产）：百善镇柳孜村，隋唐大运河通济渠故道。1999年考古揭出宋代石构码头与桥墩、八艘唐代木船，可复原文物七千多件；2012年二次发掘又出沉船与瓷器。现场石砌桥墩、河道断面至今保留展示。九百余平方米探方内石砌码头下叠压九艘唐宋沉船：一号木板船尾舵呈扫把状，二号为整木雕凿的独木舟长十米六，三号木板船长二十三点六米，多艘平底无桅、架空梁，挤靠叠压定格漕运盛景；出土瓷器出自南北二十余座窑口。；口子酒老作坊：濉溪老城，老井掘于隋唐、老窖池起于元末明初，几百年的窖泥池至今还在发酵酿酒，是活着的酿酒遗迹。老井井水打上来甜丝丝，几百年不间断使用的窖池黑泥一层压一层，至今还在投料发酵。；濉溪老城石板街：明清酒坊、商铺串成的石板老街，清末镇上酒坊曾多达七十二家，街面老门脸断断续续。；临涣古城：浍河北岸，江淮保存最完整的汉代城址之一，夯土城墙残段环着镇子，青石板街穿城而过。；临涣文昌阁、城隍庙：镇里清代楼阁庙宇，砖木结构，檐角飞翘，至今为老茶馆围着。；临涣棒棒茶茶馆：回龙泉的水泡棒棒茶，五块钱一壶续水一天，老茶客围坐打鼓说书，茶馆沿浍河排开。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌濉溪老酒工 王师傅（71岁）：&quot;老祖宗传下来的窑池，泥是几百年的窖泥，我爹在池边酿酒，我孙子还在这池子边闻。老井的水打上来是甜丝丝的，酿酒、沏茶都靠它。口子这个名字，就是汴河水跟睢水合一道的口子上长出来的。&quot;\u003cbr\u003e▌柳孜村船工后代 老赵（67岁）：&quot;1999年挖公路，一铲子下去挖出个旧码头，那底下全是沉船、瓶瓶罐罐。我爷爷那辈人说柳孜街从前是码头上排队的船，一里长。千年走船的水路，如今归了地底下。&quot;\u003c/p\u003e"}, {"n": "蚌埠老城·千里淮河第一港·津浦铁路·长淮", "s": "蚌埠", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e宋代正街为淮河河滩码头，明代定名正街。明洪武六年（1373）置长淮卫，为朱元璋钦定三大卫之一。清同治元年（1862）陈氏兄弟倡建老大街（青年街）。清光绪三十四年（1908）津浦铁路淮河铁桥开工。1911年淮河铁路大桥合龙，1912年津浦铁路通车，蚌埠由河滩小集成南北咽喉。2013年双墩遗址列为第七批全国重点文物保护单位。2025年双墩国家考古遗址公园挂牌。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到蚌埠，第一眼是淮河上那座老铁桥——1911年合龙的津浦线淮河铁桥，桥墩立在河心，火车至今从桥上过。桥北岸老北头，青石板路从淮上渡口一直铺到候船室，把开埠那几十年的味道留在街上。\u003c/p\u003e\u003cp class=\"main-text\"\u003e津浦铁路淮河大铁桥（市历史建筑）：1908年开工、1911年建成，是淮河上第一座铁路桥。石砌桥墩立在河心，近一百二十年仍在承重，南来北往的火车照常从桥上驶过。全桥分九孔，每孔长近六十一米，连引桥全长五百五十余米，八座石砌桥墩架带架钢梁，梁底高出最高水面逾十米，至今单轨通车。；老北头淮河老街：紧邻淮上渡口，老码头巷、红旗照相馆、回民饭店、候船室等二十世纪老建筑修缮如旧，青石板路面照着老样重铺。；青年街（老大街）：清同治元年陈氏三兄弟倡建的商业街，青石板被踩得发亮，两侧骑楼式老门面还留着开埠时的样子。；长淮卫：明洪武六年朱元璋钦定的三大卫之一，淮河湾边卫城旧地名和残迹散布。；双墩遗址（国保·国家考古遗址公园）：淮河北岸小蚌埠镇双墩村，距今约七千三百年新石器台地，出土六百多件带刻划符号的陶片，被视为汉字起源的重要源头；2025年6月挂牌国家考古遗址公园。符号多刻在陶豆、陶钵、陶碗底部，分象形与几何两类，鱼、猪、鹿、网、十字、网格俱全；另出国内罕见的陶塑雕题纹面人头像。；双墩春秋墓（国保）：与双墩新石器遗址同园，距今约两千六百年，出土过编钟等成套礼器。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌蚌埠老船工 陈师傅（74岁）：&quot;老话讲&#x27;先有小蚌埠，后有大蚌埠&#x27;，我打小就在淮河里撑船。1908年那条铁桥一修，南来北往的货都从这过，码头上的绳子比我的胳膊还粗，一条龙排到河心。&quot;\u003cbr\u003e▌老大街老住户 李婶（66岁）：&quot;青年街那头的青石板，是清同治年间陈家弟兄铺的，踩了几百年磨得发亮。记得小时候街两边的店铺半夜还亮着灯，盐、布、铁器都在这条街上过手，热闹得很。&quot;\u003c/p\u003e"}, {"n": "霍邱老城·古蓼国·大青砖城墙·李氏庄园隋", "s": "霍邱", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e隋开皇十九年（599）始置霍邱县。春秋楚相孙叔敖修大业陂（今水门塘）。宋初筑土城墙，明成化年间培土加高。明弘治五年（1492）扩城，挖护城河。明正德七年（1512）改筑砖石城，用大青砖、糯米汁浆勾缝。清康熙七年（1668）再扩建。清咸丰六年（1856）始建李氏庄园，十年建成。民国二十八年（1939）拆城。2006年李氏庄园列为第六批全国重点文物保护单位，水门塘评为国家级水利风景区。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到霍邱，第一眼是三面环着城的淮河与城河湾——旧城格局还在，只是城墙拆了，墙根散在城周。城西三十多公里马店镇，李氏庄园那道四角炮楼挑出的圩墙立在田畈里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e李氏庄园西圩院落（李家圩·国保第六批）：马店镇西山脚下，清咸丰六年始建、十年建成，占地七十多亩。原有房屋四百三十多间，现仅存西圩约一百四十间，走马穿廊式布局，青砖黛瓦，天井里老槐树仍在。庄园南北一百七十五米、东西二百七十六米，初分大腰圩、小腰圩、老圩后并东西两圩；四周深濠固防、二河护圩，圩周石墙高矗，四角炮楼成犄角之势，二〇一二年起国家文物局拨款对七十九间主体抢救性落架大修。；李氏庄园圩河炮楼：庄园外围两道圩河环护，第一道圩河上原悬三座吊桥，二道圩河内侧连着石砌围墙，四角炮楼挑出，墙上至今留着卧、跪、立三排射击孔。石门槛被几代人踩得发亮，空房的青砖黛瓦仍是当年旧物。；淮河大堤与城河湾：淮河三面环城，旧城三面环水的旧格局从大堤上望还依稀可辨。；城西湖口旧渡：霍邱城西临城西湖，古蓼国地望所在，湖岸老堤断续。；水门塘（大业陂·国家级水利风景区）：县城东北，传春秋楚相孙叔敖所修，距今两千六百多年，现有水面四千五百亩，塘中四十六座小岛错落，曲桥相连，旧称天下第一古塘。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e霍邱古城墙遗址：隋开皇十九年始置霍邱县，明正德七年改筑砖石城，用大青砖、石灰糯米浆勾缝。民国二十八年拆城，如今护城河河床与城墙基址在城周多处还能找到，四门旧名镇淮、来熏、朝阳、拱辰仍挂在地名里。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌霍邱老居民 周大爷（70岁）：&quot;老城墙是大青砖垒的，砖缝里是糯米浆，硬得跟铁一样。我爹见过四门的城楼，镇淮楼正对着淮河，涨水时侯知府都要登楼看水。民国二十八年拆城，一车车大砖拉去修路，可惜了。&quot;\u003cbr\u003e▌李氏庄园后人 老李（63岁）：&quot;我们这庄园是清咸丰年间的老财主起家盖的，430间房子，现在还剩西边140间。石头门槛磨得光滑，天井里老槐树还在，房子空着，可砖瓦都是当年的。&quot;\u003c/p\u003e"}, {"n": "利辛老城·文州故城·西淝河·阴阳城唐武德", "s": "利辛", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋时乾溪（今阴阳城一带）为楚地，乾溪之战发生在西淝河畔。唐武德三年（620）置文州，治张村铺一带，后废。五代宋以后分属阜阳、涡阳、蒙城、凤台等县。1964年析阜阳、涡阳、蒙城、凤台四县地置利辛县，县城设利辛集。2012年阴阳城遗址、纪家塔列为安徽省级文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到利辛，老城是1964年四县边角拼出来的新县，真正的旧东西散在西淝河两岸的田野上——汝集镇边一道夯土城垣伏在麦地里，孙庙乡一座大土冢立在平川上，都是东周到汉的旧物。\u003c/p\u003e\u003cp class=\"main-text\"\u003e阴阳城遗址（省保·周至东汉）：汝集镇东李自然村东侧西淝河两岸，城址中心点东西各约五百米、南北各约一千米。麦田里起伏平缓的夯土台基环着庄稼，田埂上立着文保石碑，地表散见陶片；老农在土堆上捡过带花纹的碎瓦片，洗洗仍可见绳纹。；伍奢冢遗址（省保·新石器至汉）：孙庙乡庙李村北、老母猪港南岸，呈谷堆形，占地约三万平方米。高高土冢立在平川上，冢上曾出石斧、骨针、陶网坠，上层叠压东周至汉遗物。；纪家塔（清代）：孙集镇孙园村东南，一座清代小塔孤立乡野，为县境少见的清代砖塔。塔为七层六面仿木结构，通高约十米，塔基平面正六边形、每边一米四八；第一层高两米二，以上逐层收分，二三层转角处砌砖挑檐挑出飞檐。塔身无窗、塔内中空无塔心柱，每层仅以十字横木交叉支撑，塔顶为绿红彩釉葫芦形、以铁签贯穿。第一层嵌青石碑，落款“嘉庆五年”“蒙城举人”尚可辨识，第二层嵌隶书“芳名永垂”石匾。；禅阳寺遗址：马店孜镇一带，东周至汉代聚落旧址，田野间旧城旧寺痕迹。；红门寺遗址：西淝河畔古遗址，与阴阳城、伍奢冢串成沿河一条古文明带。；利辛县博物馆藏西周铜器：馆内展出沿河出土的西周夔龙纹铜簠等，是西淝河千年文明的物证。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌利辛老农 张大叔（69岁）：&quot;阴阳城那两堆土，小时候放牛天天去，老人说底下埋着一座城，从东周传到汉朝。土堆上捡过不少碎瓦片，洗洗还能看见花纹。&quot;\u003cbr\u003e▌伍奢冢守坟人后代 老刘（64岁）：&quot;冢子名叫伍奢冢，说是伍子胥他爹埋的。逢年过节还有人烧纸上坟，传了千把年的故事。春天冢上开满野花，好看，也荒凉。&quot;\u003c/p\u003e"}, {"n": "六安老城·皋陶故里·明代砖城墙·南北双塔", "s": "六安", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e上古皋陶封于六，其墓在今城东。春秋为六国国都，秦属九江郡。隋唐筑土城。明洪武十三年（1380）改砖石城，设四门加月城与南北水关。民国后城墙渐拆，今仅存云路桥北一段。1981年西古城遗址列为安徽省重点文物保护单位。1998年观音寺塔、多宝庵塔列为安徽省重点文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到六安老城，第一眼是南北遥对的两座砖塔——南门锥子在南塔公园，北门锥子在北塔公园，隔城相望，旧称双塔摩青。云路桥北还立着一段清代城墙，砖上烧着道光三年的年号。\u003c/p\u003e\u003cp class=\"main-text\"\u003e皋陶墓（省保）：城东，上古四圣之一皋陶的葬地。墓冢高耸，享堂与墓碑至今犹存，老树覆在墓上。墓为圆形土冢，周长九十七米、高六点二米，墓顶平面直径四米，上生一棵黄连木形如华盖；墓前立清同治八年安徽布政使吴坤修手书“古皋陶墓”碑，东北三十五米为皋陶祠旧址。；观音寺塔（南门锥子·省保）：南塔公园内，平面六角形楼阁式实心砖塔，九级，高约二十七米，底层每边近四米，逐级收分呈角锥体；明万历年间重建，与北塔遥遥相对。基层每边宽近四米、高四米三，各级平座以平砖叠涩挑出，砖砌仿木。；六安明城墙残段（省保）：云路桥北约一百四十米清代墙体，夯土外包砖，城砖上可见道光三年城工铭文。；西古城遗址（省保）：淠河东岸台地、距市区约六公里，传为夏六国都与西汉英布都城。城址长方形，南北长约四百七十米、东西宽约二百三十米，四角高墩环护，文化层叠压。；六安文庙、城隍庙旧迹：老城中心旧学宫庙宇基址，街巷格局仍沿明清。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e多宝庵塔（北门锥子·省保）：城北，北宋楼阁式砖塔，原九级，今残高约二十余米，塔心室与蹬道犹存，2005年曾维修并辟为北塔公园。塔为六角形空心砖塔，现存七级、残高二十一点六米，底层每边宽四点四米、高三点九米，各级逐层收分，“文革”中塔内佛龛佛像被毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌六安老文保员 王伯（72岁）：&quot;皋陶是咱六安的根，&#x27;画地为牢&#x27;的说法就从他那来的。云路桥北那截老城墙，砖上刻&#x27;道光三年&#x27;，道光年补的工。四门四塔，南门锥北门锥，老早城里的孩子都爬过。&quot;\u003cbr\u003e▌六安老市民 刘姨（65岁）：&quot;南门锥的塔是砖的，一层一层往上收，夏天傍晚塔影拉得老长。皋陶墓那棵老树，树下歇脚的人都说，这是断案断了几千年的人埋的地方。&quot;\u003c/p\u003e"}, {"n": "明光老城·女山湖沉城·旧县镇·嘉祐院女山", "s": "明光", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e汉晋于女山湖畔设县，宋称招信县。南宋嘉祐年间仁宗驻跸，寺因名嘉祐院。约元末大水，古招信城大半沉入女山湖底。明正德十二年（1517）黄河决堤、淮水泛滥，湖中城仅剩半平方公里小岛。清代重建火神庙、古戏台等建筑。今女山湖古建筑群（嘉祐院、火神庙、古戏台、招信寺）列为省级文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到明光女山湖镇旧县村，第一眼是临湖那一组清代老建筑——嘉祐院大殿、火神庙、皖东唯一保存完整的清代古戏台连成一片，院墙爬着青苔；湖滩旱季时，能捡到沉在水下招信城的唐宋城砖。\u003c/p\u003e\u003cp class=\"main-text\"\u003e嘉祐院（省保）：女山湖镇旧县村，传宋仁宗驻跸处。宋代原址已沉湖，现存为清代易地重修的大殿六间，与农博馆同院管护。；古戏台（省保）：火神庙对面，清代倒座式四合院戏台，面阔进深各三间，是皖东保存唯一完整的清代古戏台，传为乾隆下江南看戏处。戏台始建于咸丰末、同治初，立面通高十一米、通面阔十米、通进深六米半，明间阔四米，柱网支承于石础之上，台前围出五百平方米院落容观众看戏。；招信寺与招信古城墙残迹：镇中心老街尚有招信寺旧基，湖边断续露出招信古城墙残段。；七百年古柏：湖岸旧院门口一棵古柏粗可合抱，树龄七百余年，村里办喜事来系红布。；女山火山地质公园：城北女山，世界罕见的盾形古火山，保存完整火山口与玉环池，火山湖与女山湖相映。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e火神庙（省保）：古镇西角，坐北朝南，砖瓦抬梁式木结构，始建于宋、清乾隆十八年重建，前进后进各三间，山墙嵌有山河并寿捐款碑。正殿取硬山马头墙两坡水，明间七架梁前后出单步、次间穿斗式，山面马头墙正背两端翘起与墙相连，这种混搭梁架在当地罕见；前进山墙下方嵌“山河并寿”捐款碑，原塑坐佛、观音、十大天王像上世纪六十年代末被毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明光老渔民 孙师傅（73岁）：&quot;女山湖水底下埋着旧招信城，老辈说晌午好好的，一夜大水过来，城就没了。天旱水浅的时候，湖边能摸到城砖，还有带字的铜钱，一洗全是青绿锈。这是真的，不是瞎编。&quot;\u003cbr\u003e▌嘉祐院看庙人 陈姨（66岁）：&quot;老辈讲宋仁宗避难在这住过，叫嘉祐院。大殿现在还剩6间，屋里供着老菩萨。门口那棵柏树700年了，村里办喜事都来系红布。&quot;\u003c/p\u003e"}, {"n": "定远老城·东城遗址·炉桥古镇·东周古城秦", "s": "定远", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦始皇二十六年（前221）置九江郡，境内设曲阳、阴陵、东城三县。汉文帝封刘良为东成侯，东城为其侯国县治。隋开皇三年（583）废郡，大业十一年（615）县废。唐武德二年（619）复置定远县，天宝四年（745）迁至今治。东汉建安十三年（208）曹操于炉桥（古冶溪）建炉铸剑。1998年东城遗址列为安徽省重点文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到定远，旧物在城西两片：永康镇古城村一座秦汉阴陵城伏在麦田，炉桥镇冶溪街上一眼青石三眼井还在。城基高出平地几米，秦砖汉瓦散得满地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东城遗址（省保·1998）：县城东南，汉代东成侯国都。内外两城轮廓清楚，城基高出平地约三米，四角城楼旧墩高耸，护城濠还在；城中古井七十多口，遍地秦砖汉瓦。当地老人把这土岗叫“城里头”，捡过黑亮带细纹的汉瓦。；阴陵城遗址：西北永康镇古城村，秦汉阴陵县治所，项羽败走阴陵失道处。今残垣瓦砾散落田间，秦砖汉瓦俯拾即是。；陈铎祠：古城村，传汉代田父陈铎错指项羽处，刘邦称帝后追封建祠，清光绪二十一年重修。；炉桥古镇三眼井：冶溪街上，整块青石凿成的三个井眼盖，井水清冽，旁有桥上桥、马道井。街北“桥上桥”长四十五米、宽三米七，已一千八百余年，为皖东现存最长古桥；老街飞檐封火墙，北方建筑雄浑硬朗，李鸿章家族当铺旧址、美人巷、裤裆街地名仍在。；炉桥老街与李鸿章当铺：冶溪街北方式建筑雄浑，飞檐封火墙，李鸿章家族当铺旧址、美人巷、裤裆街地名仍在。；池河太平桥：城东池河上，明代古石桥横卧，桥东街市连绵。；藕塘烈士陵园（省保，藕塘镇塔山村）：一九八九年省烈士纪念建筑物重点保护单位，塔山村府前路东，抗战时新四军二师所建烈士塔原碑犹存，王光美一九九六年亲临瞻仰。；令狐塔（藕塘镇相公山顶）：七层砖塔，明嘉靖《定远县志》已载，东汉楚相令狐子伯少年读书处，塔立相公山巅。塔紧环藕塘老街、雄踞大沙河畔相公山顶，山下几座山峦连绵，历经几度兴废，今塔仍立山巅。；中共中央中原局第二次会议旧址（界牌集镇，县保）：刘少奇当年主持中原局会议旧屋，所用方桌、门板俱在。；中原局枣树王旧址：刘少奇住草房开会处，房翻盖原貌未变。；藕塘烈士塔及陵园（县保，塔山村）：新四军二师建。；郎峰汉墓群（县保，藕塘镇）：汉代封土墓群。；周王旧石器遗址（藕塘镇周王村）：四普新发现。；通济桥旧址（定城镇花园湖大街，清代）：四普新发现。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌定远老农民 高大叔（68岁）：&quot;东城遗址这土岗子，老人叫&#x27;城里头&#x27;，全是秦砖汉瓦。老辈说那是楚霸王项羽走丢的地方，然后往东就到东城去了。土堆上捡过一块带细纹的瓦，黑亮黑亮的，说是汉瓦。&quot;\u003cbr\u003e▌炉桥老住户 郑叔（71岁）：&quot;炉桥这地名，是曹操在这山沟里炼铁铸剑来的，窑河上一座石桥，河这边是马场湖——操练骑兵的场子。三眼井那口井盖是整块青石凿的，三个眼，夏天打上来的水凉得沁牙。&quot;\u003c/p\u003e"}, {"n": "天长老城·千秋古县·老西门·四大古镇唐代", "s": "天长", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋称卑梁，《史记》卑梁之衅由此而来。唐天宝元年（742）割江都、六合、高邮地置千秋县。唐天宝七年（748）更名天长县，沿用至今。宋置天长军，南唐升雄州。明嘉靖年间筑城，崇本门正对凤阳。2017年治理护城河发现明代西月城墙基，复建崇本门。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到天长老城，第一眼是护城河上复建的崇本门——城楼三层，一层展着清淤时挖出的明代老城砖。城外老西门巷弄弯弯绕绕，越河巷、胭脂巷串成一座小迷宫。\u003c/p\u003e\u003cp class=\"main-text\"\u003e崇本门：明嘉靖年间老城门，正对朱元璋龙兴之地凤阳。明嘉靖三十七年知县黄泰然改砌砖城，周长约三点五公里、高约六米七，辟启文、长春、崇本、永福四门；2017年治理护城河时在老西门附近发现明代西月城墙基与城门洞条石，遂原地复建城楼三层，一层为旧物展示馆，老城墙砖、石碾、上马石百余件收在其中，透过玻璃可直视地下老墙基。；老西门古巷：越河巷、胭脂巷、礼堂巷等青砖老巷纵横，巷巷相通形如迷宫，两侧老民居仍住人。；龙岗古镇：铜城镇下，距今一千二百多年，三面环水，田字形街巷、七十二口古井，明清老街保存完好；抗大第八分校旧址在此，是全国抗大分校旧址保存最完整者之一。古镇状如卧龙，青砖小瓦马头墙四合院沿街巷铺开，一九四一至一九四五年抗大八分校在此办学，校舍墙上“团结紧张”等标语旧痕犹在。；秦栏孝子树：秦栏镇，宋朱寿昌弃官寻母故里，传其手植的千年孝子树仍活着，老树发新芽。；石梁古城遗址：旧石梁县城故址，千年旧城痕迹散在田野。；马家墩遗址：距今约五千年新石器台地，为市境史前聚落。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌天长老居民 吴奶奶（72岁）：&quot;崇本门是嘉靖年间的老城门，正对着凤阳，那是给皇帝家的老家开的。2017年清护城河挖出老墙根，又照着原样盖起来了。老西门这巷子啊，越河巷、胭脂巷弯弯绕绕，走进去跟走迷宫似的，可总有路能穿出来。&quot;\u003cbr\u003e▌秦栏老菜农 朱大爷（70岁）：&quot;我们秦栏讲孝子，朱寿昌弃官找娘的故事传了千年。他手栽的那棵&#x27;孝子树&#x27;现在还活着，老树发新芽，村人拿它当宝贝。开春树下头坐满了歇脚的人。&quot;\u003c/p\u003e"}, {"n": "全椒老城·襄水环城·吴敬梓·走太平著名讽", "s": "全椒", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为椒国椒邑，西汉高祖四年（前203）置全椒县。东晋平北将军姚襄筑襄城，襄河由此得名。明清代吴敬梓先祖吴国对探花及第，建探花第。清吴敬梓少年居此，后移居南京，十年写成《儒林外史》。正月十六走太平自东汉传承至今千五百年。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到全椒，第一眼是襄河把县城抱在怀里——河湾街上吴敬梓故居探花第隔水对着纪念馆，正月十六走太平的人流从积玉桥一直排到太平桥。\u003c/p\u003e\u003cp class=\"main-text\"\u003e吴敬梓故居探花第（国保相关·4A）：襄河河湾街，吴敬梓先祖清代探花吴国对所建宅第，俗称探花第、遗园，东宅西园，青砖硬山马头墙，占地七千余平方米，今按故居格局复建。建筑群三进三出，分正宅东中西三路、延陵堂、赐书楼、文木山房与西花园，砖木结构、青砖清水墙、蝴蝶瓦屋面、马头墙硬山；门前探花第牌坊为青石四柱三间。；吴敬梓纪念馆：走马岗，与故居隔襄河隔水相望，仿明清园林，正厅前立吴敬梓铜像，馆内藏《儒林外史》各版本与吴氏家珍。；袁家湾老街：全长约一千五百米，自积玉桥起经仙鹤楼至红栏桥止，临河一段半边砌玉石栏杆，老铁匠铺、豆腐坊、弹棉花弓弦声至今不绝。；走太平三桥：积玉桥（汉代古桥）、红栏桥（宋代）、太平桥（玄济桥），串起正月十六走太平的老路线，自东汉传至今日。积玉桥始建于汉初、北宋嘉祐二年重修，四垛三孔，是全椒现存最古的桥；自积玉桥经红栏桥到太平桥，玉、栏、平谐音“遇难平”，每年正月十六数十万人沿此道祈福。；笔峰塔、尊经阁、北极阁：襄河两岸旧阁古塔，与山景相映。；霸王桥、饮马池、楚迷沟：传项羽垓下突围途经处，地名至今仍在城边。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌全椒老手艺人 孙师傅（73岁）：&quot;袁家湾那条街，从积玉桥进、过红栏桥、上太平桥，正月十六几十万人走这条道，图个平安。街上老铁匠铺、豆腐坊、蔑器行都还开着，手艺是一代一代传下来的。&quot;\u003cbr\u003e▌吴敬梓纪念馆讲解员 周老师（68岁）：&quot;吴敬梓年轻在全椒的探花第住过，后来家道中落才去了南京写《儒林外史》。故居隔河正对着纪念馆，河水一隔就是一辈子。他那支笔，把假儒生一个个都写活了。&quot;\u003c/p\u003e"}, {"n": "来安老城·永阳古城·太平古城·南北四门五", "s": "来安", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e五代南唐始建来安县。南宋迁治大雍镇（今新安镇）。旧城主街十字形，四门宾阳、庆成、迎薰、拱极。清末民初城墙犹在。民国二十七年（1938）拆城，护城河填平。滁河另存隋唐始建的太平古城，明代建太平桥。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到来安老城，十字街还按着五代南唐旧城的格局走——四门旧名宾阳、庆成、迎薰、拱极挂在老地名里，街中心琉璃井的水夏天还清凉。滁河边还卧着一座隋唐太平古城的青砖墙。\u003c/p\u003e\u003cp class=\"main-text\"\u003e旧城四古井：琉璃井、县署井、北门井、东门开元观井，井栏井石犹存，琉璃井水夏凉，街坊仍来打水泡茶。琉璃井位于街心，井圈青石磨出几道绳痕，夏初打水上来还带着凉意。；太平古城遗址（隋唐）：滁河边，曾为江淮水陆码头，城周长约八百米、宽约五百米，青砖城墙残段高约数米。城墙高约八米、底宽六米、顶宽四米，砖砌外包，旧为江淮间水陆要津。；太平石拱桥：明代，长约三十米，桥心铺一块龙纹石，古街两侧明清两层老楼青砖灰瓦仍在。桥长约三十米、宽五米，全青石砌筑，桥面中央那块龙纹石被行人踩得发亮，孩子过桥都要踩一脚讨吉利。；青龙街八面塘：城东旧塘，1984年出土过新石器石器，把当地人类活动推到七千年前后。；石界牌古村：县境山区，保留只字型村落格局与传统民居，依山就势。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e来安旧城十字街：五代南唐建县、南宋迁大雍镇（今新安镇）后形成。主街呈十字形，原四门宾阳、庆成、迎薰、拱极外加崇文小南门、耀武小西门，1938年拆城、护城河填平，街巷骨架仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌来安老居民 马叔（70岁）：&quot;老城四门叫宾阳、庆成、迎薰、拱极，听着就气派。民国二十七年拆的城墙，护城河后来填平盖了楼。剩下那几口老井，琉璃井的水夏天打上来还是清凉的，街坊还来打水泡茶。&quot;\u003cbr\u003e▌太平古城老住户 吴婶（65岁）：&quot;滁河边那个老城，说是隋唐就有了，城墙青砖垒的，八米高。太平桥是明朝的，桥心那块龙纹石，小孩过桥都踩一脚讨个吉利。老街两边的铺子还是老式两层楼，青砖灰瓦。&quot;\u003c/p\u003e"}, {"n": "淮南老城·淮河老街·田家庵·舜耕山从\"老", "s": "淮南", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周青铜器铭文已见淮南夷，距今约两千九百年。春秋淮夷建州来国，楚灭蔡后改下蔡为寿春。楚考烈王二十二年（前241）迁都寿春。西汉高祖封刘长为淮南王、都寿春。田家庵由淮河渡口老田家庵子起家，民国后淮河航运日盛。北宋以来寿州城墙屡修，现存为宋代体系。2025年武王墩墓发掘成果公布。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到淮南田家庵老北头，第一眼是淮上渡口——老码头巷、候船室、回民饭店一溜二十世纪老房子贴着河岸，青石板照着老样重铺。往南不远，寿县一圈宋代城墙把楚都寿春抱在里面。\u003c/p\u003e\u003cp class=\"main-text\"\u003e田家庵淮河老街（老北头）：紧邻淮上渡口，老码头巷、红旗照相馆、回民饭店、候船室等老建筑修缮如旧，青石板路面复刻旧时肌理，巷弄里藏着二十世纪市井烟火。；寿县古城墙（国保）：周长约七千一百多米宋代城墙，四门皆带瓮城，墙身高踞兼具防洪堤坝功能，月坝水涵闸借虹吸自然排水；城砖上刻着历代修城年号。墙体以粘土夯筑，外壁下砌八公山条石、上砌青砖，砖石缝以桐油、糯米汁、石灰勾缝；明万历年间加瓮城、建月坝，东北角月坝高与城平、形如圆城堡，借虹吸将城内积水排出城外。城墙内侧作斜坡，可从城下直登城头，人称“土坡战城”。；寿春城遗址（国保）：末代楚都大城，楚考烈王二十二年（前241）迁都于此，大城轮廓东西约六公里、南北约四公里尚在。；武王墩墓（国保）：2025年轰动考古的战国楚王级大墓，出土新楚大鼎与成套九鼎八簋、多架瑟，正在建遗址博物馆。；八公山：刘安墓、廉颇墓、珍珠泉等三十余处散在山林，山上出淮南虫化石，把生命史推到八亿年前。；安丰塘（芍陂·世界灌溉工程遗产）：寿县城南，春秋楚相孙叔敖所修，比都江堰早三百多年，至今仍灌溉万顷良田，塘北孙公祠犹存。塘面约三十四平方公里，两千六百多年来历代屡修，孙公祠明成化、清光绪多次重修，现存正殿、碑刻与禁闸石规。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌田家庵老码头工 刘师傅（72岁）：&quot;老田家的庵子&quot;就是咱这名字的来头——从河滩上一个歇脚的庵堂，长成了淮上大码头。老北头那条街，候船室、回民饭店、红旗照相馆，民国到六七十年代的房子一溜排，青石板是照着老样重铺的。\u003cbr\u003e▌寿县城墙边老住户 老孙（68岁）：&quot;寿县的城墙是宋代筑的，900多年，7公里多的一整圈，四门都有瓮城。&#x27;风声鹤唳&#x27;&#x27;投鞭断流&#x27;都发生在咱这城边的淝水。老城墙上的砖，一块块都有故事。&quot;\u003c/p\u003e"}, {"n": "淮北老城·相土筑城·隋唐运河·相山显通寺", "s": "淮北", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e商：相土在此筑&quot;相城&quot;，距今四千余年。春秋：宋共姬（鲁宣公女）嫁共公，葬此。秦：设泗水郡治于相城。西汉：沛郡治相城；东汉为沛国都。隋大业元年（605）：通济渠（汴河）穿境，柳孜成运河重镇。西晋太康五年（284）：显通寺始建。1960年：因煤建市，名濉溪市；1971年更名淮北市。1999年：柳孜运河遗址发掘，入选全国十大考古新发现。2014年：柳孜遗址列入世界文化遗产。2025年：柳孜运河遗址博物馆开放。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到相山脚下，城市刚出楼群，山窝窝里就蹲着一座老庙显通寺，乾隆御碑还立在东厢房；山下淮海路西头，一圈两千五百年的夯土墓冢压在快车道端头；再往南二十公里，柳孜运河遗址博物馆把宋代石码头和唐代沉船原样罩在玻璃底下。一座因煤而兴的工业新城，老底全在山上、墓上、河底下。\u003c/p\u003e\u003cp class=\"main-text\"\u003e相山显通寺（相山公园龙峰虎峰南麓山窝里，西晋始建，现存清代建筑）：整组院落三面环山，现存房屋五十二间，除部分屋面换了玻璃瓦，大多仍是青砖小瓦、两面坡顶，山门奎楼、大殿、六角亭沿山势一线排开。正殿殿廊东侧小门通碑廊，宋金元明清碑刻二十二方沿壁而立；东院御书亭里那方乾隆御笔“惠我南黎”巨碑，字如斗大，石面已被历代抚摸磨得温润。寺后崖壁上高晋手书“渗水崖”三字摩崖高近两人，字口被风雨磨钝，石缝里钻出细草；院内古柏、银杏参天，初一十五仍有香客上山祈福。；柳孜运河遗址（世界文化遗产，遗址博物馆2025年开放）：玻璃罩底下原样罩着宋代石筑码头原物，条石垒砌的埠头还贴着当年的河坡；旁边开挖坑里八艘唐代沉船并排躺着，十二米多长的木板船身木纹清晰，边缘已被地下水浸成深褐。成堆的隋唐瓷器、铁釜、石碇就搁在原位，船板、瓷片、铜钱一层压一层——1999年一铲下去揭开了古运河路线之谜。博物馆建在码头原址之上，游客隔着玻璃能看见宋砖缝里夹着的唐瓷片。；淮北市博物馆（国家一级馆）：汉画像石从石棺、石墓到石阙全型齐，被誉为&quot;敦煌前的敦煌&quot;；运河遗韵厅五十二米东阳木雕长卷再现柳孜码头千帆；刘开渠纪念馆（相山公园内）：中国第一座雕塑家纪念馆，陈列刘开渠原塑与手稿，馆藏近三千件；古相城遗址：上世纪六十年代建市初尚见内城夯土残墙、底宽近五十米、高六七米，今已平入马路与楼群，&quot;相山&quot;&quot;相城&quot;地名仍在，残砖断瓦收进博物馆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e共姬墓（淮海路西端，北枕相山西脉）：一座独立的大封土冢杵在快车道端头，周围早已围满楼房，只剩这一圈黄土还杵着。墓丘周长约四百米，坡长六十米，占地十余亩，原立“周宋共姬之神道”与“周宋共姬墓”两通石碑，碑在“文革”中被毁，如今只余“共姬墓”三字新刻。站在冢顶四望，北边是相山林，南边是车流，两千五百年的宋共姬就埋在这一坡黄土底下。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌淮北老职工 张师傅（73岁）：&quot;咱这地方老名叫相城，是商朝老祖宗相土筑的城，几千年了。山上的显通寺，西晋就有，乾隆爷还题过&#x27;惠我南黎&#x27;的石碑。城里老人都知道，隋唐大运河就从咱这过，柳孜的码头挖出来过唐代沉船。&quot;\u003cbr\u003e▌临涣老茶馆主 陈爷（69岁）：&quot;临涣的城墙是汉代的，两千多年了，还立在那。茶馆里一壶棒棒茶5块钱能坐一整天，用回龙泉的水泡，听大鼓书、说评书。老街青石板磨得溜光，脚下就是明清的车辙印。&quot;\u003c/p\u003e"}, {"n": "桐城老城", "s": "桐城", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e明万历三年（1575）：知县陈于阶以砖筑城，周六里六门，形如金龟。清咸丰间城墙受损，同治重修。二十世纪五十年代后城墙渐拆。明清两代出进士三百余人，张英张廷玉父子宰相，方苞姚鼐刘大櫆桐城派。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e六尺巷：文城西路，清康熙张英家人与邻争地、两家各退三尺而成。巷长百米、宽两米，全由鹅卵石铺就，两堵白墙夹道；巷南为宰相府，巷北为吴氏宅。鹅卵石被几百年脚步磨得圆润发亮，缝里长着细草，墙根苔色深绿。；东作门：明万历四年（1576）重筑砖城东门，2008年依旧制重建，门洞石额&quot;东作&quot;二字仍可辨；紫来桥：元末方德益捐建石桥横跨龙眠河，清乾隆初张廷玉捐资重建更名良弼桥。五孔四垛，全长近五十米、宽约四米半、高近五米，全用麻条石垒成，桥面石被明清车辙压出深印，桥缝里卡着老船钉。桥下龙眠河水依旧潺潺，一抬头就是文庙飞檐。；桐城文庙（元延祐始建，明移今址）：坐北朝南，过宫墙门楼、棂星门，经泮池泮桥，沿中轴线大成门、大成殿、崇圣祠一路排开。大成殿楠木梁架江南少见，木色深红，梁枋上旧彩绘隐约可辨；泮池、大成门、两庑完整，尊经阁在殿后为明清藏书楼旧构。一九八七年仿明清图式重修，今兼作桐城市博物馆。；北大街：明清老街肌理，青石板、马头墙店铺；龙眠河：穿城母亲河，宋李公麟归隐龙眠山；张廷玉墓园（文和园，国保第七批）：龙眠山双溪村，清乾隆二十年建，占地七千余平方米。入中门横式巨照壁前后分刻“赞猷硕辅”“调梅良弼”八字，为雍正御书。沿苍松翠柏间石阶上行百余步，九级拜台而至墓地，石俑、石马、石羊、石虎分列神道，文俑武俑、龟跃错落，墓冢前石供桌、香炉、烛台齐备。；孔城老街：孔城镇，距市区十二公里，相传三国吕蒙筑城。老街长约三公里，麻条石铺面呈S形，按十甲分段，各甲之间以闸门相隔。两侧青砖小瓦二层铺面，马头墙连绵，为安徽现存最长最完整古街之一。；桐城文庙崇圣祠与尊经阁：元延祐始建，明迁今址。大成殿楠木梁架江南少见，泮池、大成门、两庑完整。尊经阁在殿后，为明清藏书楼旧构。；戴名世墓：县南山庄，清初桐城派先驱戴南山葬处，封土矮圆，前立清碑。；披雪瀑：城北龙眠山，瀑布分两段上披雪崩雪，下披龙跃潭，瀑下巨石摊平如床，刻披雪二字。；李公麟龙眠山庄遗址：龙眠山中小岭，宋李公麟归隐处，旧有绵绣亭、元辉阁，今仅存台地与摩崖残刻。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌桐城北大街老住户 吴奶奶（74岁）：&quot;六尺巷那故事是真的，张家让步让出了名气。我小时候天天在紫来桥上看人挑水过龙眠河，桥面都磨光了。文庙里供着孔子，桐城读书人多，老话说&#x27;穷不丢书，富不丢猪&#x27;，这话到今儿还灵验。&quot;\u003cbr\u003e▌紫来桥边卖米酒的老谢（61岁）：&quot;这桥是元朝造的，五孔，长得很，河涨水也冲不垮。桥缝里卡着老船钉，大人说那是康熙年间的。现在桥还在走车走人，桥下的龙眠河还是老样子，一抬头就是文庙的飞檐。&quot;\u003c/p\u003e"}, {"n": "潜山老城", "s": "潜山", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：皖国。西汉：设皖县。唐贞观：设舒州治皖城。明成化：筑土城；嘉靖砌砖开四门。清咸丰：再修。二十世纪后城墙多拆，临河残墙因防洪保存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e天柱山（古南岳）：汉武帝元封五年（前106）南巡封南岳，摩崖石刻遍布；梅城土城墙：东门河堤、雪湖南岸、西环路一带青石残墙四段，墙体内可见明代城砖；薛家岗遗址：新石器时代，出土十三孔石刀（长逾五十厘米），为全国之最；另有玉琮、陶器数千件；皖公古墓与皖公像：东周皖国君主墓，山巅立皖公石像；胭脂井：乔公故宅旧址，传二乔梳洗处。井栏青石圆形，栏上勒“胭脂”二字，字口深峻，井水常年清碧。旧在天宁寺内，今围入民居，井台被四周住户踩得溜光，仍有人来提水。；三祖寺与觉寂塔（国保）：城南九公里天柱山凤形山上，禅宗三祖僧璨道场。觉寂塔唐天宝五载建，五层七面楼阁式砖塔，通高三十余米，外壁嵌砖雕佛像近千尊，砖龛小佛面相圆润。唐塔基、宋塔刹、明塔身叠用至今，塔顶生铁相轮高约一丈五尺；塔螺旋石阶可登，每层四门两虚两实，北有石级，石面被鞋底磨出凹棱。；山谷流泉摩崖石刻（国保）：三祖寺西石牛谷中，溪岸两壁自唐至民国题刻三百余方，全长五百余米。最早一为唐李翱题刻，一为唐三州刺史李德修题刻；宋刻一百方，王安石、苏轼、黄庭坚真迹在壁。石刻沿溪水深浅分布，青苔覆盖，须俯身读字，字口被水汽浸得发黑。；太平塔（省保）：县北彰法山皖光苑内，北宋崇宁三年建，七层八面楼阁式砖塔，塔高四十三米，弧檐翘角。塔内中空，梯级木楼，每层四门虚实相对，每方置龛供砖雕佛像千余尊；地宫曾出土舍利，为安徽现存早期古塔之一。砖面风化成酱色，檐角铁马犹在。；胭脂井：乔公故宅旧址，传二乔梳洗处。井栏青石圆形，栏上勒胭脂二字，井水常年清碧。旧在天宁寺内，今围入民居。；薛家岗遗址博物馆：城外薛家岗台地，新石器时代遗址，出土十三孔石刀、玉琮、陶球数千件。石刀长逾五十厘米，钻孔规整，陈列于博物馆玻璃柜中。；雪湖梅城土城残段：东门河堤、雪湖南岸、西环路四段青石残墙断续相连，墙体内夹明代城砖，临水一段因防洪保留至今，砖缝里偶可抠出唐宋瓷片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌梅城雪湖南岸老住户 韩大爷（70岁）：&quot;这段土城墙从明朝就有了，靠河那边一直护着，青石砌的，结实得很。小时候我们爬上去玩，砖缝里还能抠出老铜钱。薛家岗挖出来的十三孔石刀我见过图了，那手艺，谁说五千年前的人笨？&quot;\u003cbr\u003e▌潜山老街坊 储奶奶（68岁）：&quot;天柱山老辈人都叫南岳，汉武帝封的。城里老槐树底下听人说书，讲的就是二乔、皖公这些老故事。城墙拆了，但河边的土城埂还在，那就是潜山的根。&quot;\u003c/p\u003e"}, {"n": "安庆老城", "s": "安庆", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e南宋：同安郡与德庆军各取一字，安庆得名。明万历：设按察使、兵备处，成皖江重镇。清康熙：安徽建省，安庆为省会两百余年。同治二年（1863）：曾国藩设安庆内军械所，徐寿华蘅芳造出中国首台蒸汽机。1920年代后江运衰，城墙拆。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e振风塔：明隆庆四年建，七层八角楼阁式砖石结构，塔高近六十五米，底层基座每边近十九米，各层按比例自下而上收分，轮廓呈圆锥体。塔内螺旋石阶一百六十八级，石阶狭窄仅容一人；三至五层嵌明代砖雕佛像六百余尊，最多一层四百十七尊，总计浮雕佛像一千一百余尊，塔身另嵌碑刻五十二方。顶层望长江如练，老话说“塔不倒，江不决”。；迎江寺：北宋开宝七年始建，现存殿宇多清代重建，重檐歇山顶毗卢殿内佛像背后立十多米高海岛浮雕。山门前一对大铁锚蹲在江边，各重约三吨，锚绳早锈成黑褐色；传说安庆形似大船，铁锚固城、振风塔作桅杆，寓意镇住江涛。；倒扒狮街：明隆庆间石牌楼门楼，四排石狮倒扒朝街，为安庆现存最老石牌门楼；石狮风化斑驳，卷毛被磨平，仍蹲伏朝街。两侧骑楼商铺延续明清格局，廊柱是旧木，街面石板被几百年鞋底磨光，老铺子换了几茬主人，街名一天没断过。；古钱塘街、火正街：明清商业旧街名仍在使用；江岸码头群与大观亭遗址：皖河长江交汇处，历代漕运盐运重埠；世太史第（赵朴初故居，国保第六批）：天台里街九号，明万历始建，清同治三年赵畇购为宅，赵氏四代翰林。七进主体沿纵轴展开，马头墙、望板直接铺桁条为本地特色；东三东四西三隔断墙封门，各进自成院落。李鸿章曾题“四代翰林”金字匾，惜为日寇所掠；天井石板被几代人磨出凹痕。；安庆天主堂（国保第七批）：锡麟街三十四号，清同治五年法籍耶稣会士始建，十一年建成。圣心堂坐北朝南，门头嵌三块竖额石刻，东曰仁基远奠、中曰万有真源、西曰圣城洪厅。院内花冈岩立柱、拱券门窗保存完好。；安徽大学红楼及敬敷书院旧址（国保）：菱湖南路安庆师大菱湖校区内。红楼一九三五年建，平面倒山字形，两层砖木，红砖红瓦，门檐半圆，环六根圆石柱，钟楼高耸。敬敷书院在东，全木卯榫，清代安徽最大官办书院。；安庆谯楼：司下坡顶，明洪武元年建，下为拱形门洞深二十余米，上为双檐楼阁。旧时安徽布政使司衙署大门望楼，青砖城台拱券，登楼可俯瞰老城。；南关清真寺（国保）：大南门江岸清真寺街七号，明成化六年建，初名清真堂。现存大殿、明德堂、望月楼，马头墙与江南园林结合。；探花第与登云坡（市保）：大南门街登云坡两侧，清宁本禹探花宅第，马头墙、石库门、天井院落保存尚整，与清真寺历史街巷连成一片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌倒扒狮街老商户 郑老板（66岁）：&quot;这牌楼上的狮子是明清就有的，四排石狮倒着扒，镇邪的。街两边老铺子换了好几茬主人，但骑楼的廊柱还是旧的。我爷爷的爷爷在这街上卖布，传到我这辈卖干果，倒扒狮街的街名一天没断过。&quot;\u003cbr\u003e▌迎江寺看塔人 周师傅（58岁）：&quot;振风塔64米8，七层，爬168级台阶上去，长江就在脚底下。老话说&#x27;塔不倒，江不决&#x27;，安庆人对这塔亲得很，那是咱的定江神针。&quot;\u003c/p\u003e"}, {"n": "怀宁石牌老城", "s": "怀宁石牌", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e东晋：怀宁设县。清乾隆：石牌因皖河通江，商贾云集，&quot;无石不成班&quot;。乾隆五十五年（1790）：高朗亭率三庆班进京。光绪：怀宁县治一度在石牌。1950年：县治迁石牌镇；2002年县城再西迁。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e石牌老街（上下石牌）：鼎盛时二十五条街巷，丁字街为旧时商贸主街，永兴街在建设路末端。两侧老木屋、飞檐、马头墙低矮连绵，青石板缝里嵌着明清车辙；后街多两层木楼，五六十年前店铺门面仍贴着旧字号木匾。逢年过节老茶馆弦索不绝，街头茶楼一早黄梅戏弦子就拉起来。；三庆班旧址与戏窝子：清乾隆五十五年（1790）高朗亭率三庆班进京，老街保留旧戏楼遗址；文武庙旧址：清同治间徽式建筑，庙前广场为旧时酬神唱戏之所；猫山新城遗址：民国后水患西移所建，可见老城墙基；石牌早茶与黄梅戏：街头茶楼弦索不绝；徽班博物馆：石牌戏曲小镇核心建筑，建筑面积四千平方米，由院士设计，白墙黛瓦徽派院落。馆藏严凤英戏服、七凤冠、包公盔、状元帽、黄花梨二胡、古戏本、令牌等三百余件；馆内古戏台仍按期上演徽剧黄梅戏折子戏，VR互动区可虚拟徽班进京。；石牌丁字街与永兴街：上下石牌四大老街中，丁字街为旧时商贸主街，永兴街在建设路末端。两侧老木屋、飞檐、马头墙低矮连绵，青石板缝里嵌着明清车辙。后街多两层木楼，五六十年前的店铺门面仍贴着旧字号木匾。；孔雀台（万年台）：小市港老街永承寺对面，据碑文唐末始筑土台，元为竹棚台，明永乐间改砖木大戏台。台前有清人题碑记孔雀台沿革，砖石台基仍高出台地；当地人称万年台，为《孔雀东南飞》故事发生地的戏台遗存，村头立传说石碑。；焦刘合葬墓与孔雀东南飞遗迹：小市镇受泉村，汉代合葬墓封土隆起，周围植松。村头立孔雀东南飞传说石碑，列为国家级非遗。；金鸡碑与五猖神庙碑（省保）：洪铺镇金鸡村沿湖而立，碑身高一米一、宽七十厘米，白色石料刻成，正文阴刻“金鸡社令正直之神位”，两侧冠以“日”“月”二字，上款题“庚戌岁冬月吉旦众生祀奉”。碑身被有机玻璃罩护，上建四角小亭；碑侧五猖神庙碑并列，风化较重，字口已浅。；石牌猫山城墙基：猫山新城遗址上，民国后县城因水患西移所建，老城墙砖石散落田野，墙基夯土断续可寻，墙根砖缝里长出荆棘。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌石牌老街老戏迷 方向东（69岁）：&quot;&#x27;无石不成班&#x27;，说的就是咱石牌。京剧老祖宗高朗亭就是石牌人，他带的三庆班进京，唱出了京戏。我打小唱黄梅，也学京戏的西皮二黄，街上老茶馆里两样都能听见。&quot;\u003cbr\u003e▌石牌镇文化站老站长 黄爷爷（73岁）：&quot;石牌老街当年25条街，布行药铺茶馆数不清，全靠着河码头。戏台就搭在文庙前，逢年过节唱大戏，四面八方的班社都来赶场。我小时候挤在人堆里看戏，那个热闹，一辈子忘不了。&quot;\u003c/p\u003e"}, {"n": "望江老城", "s": "望江", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e晋：建雷池、雷港。明万历三年（1575）：知县蒲以遇筑砖城开七门。清咸丰同治：城池屡修。二十世纪后城墙渐拆，环城路即旧城基。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在明万历年间老墙基的土埂子上，环城路一圈就是旧砖城，文庙大成殿五开间飞檐翘角还在城中间；城外雷池圩里湖泊连片，&quot;不敢越雷池一步&quot;就从这一片水起的名。\u003c/p\u003e\u003cp class=\"main-text\"\u003e雷池：古雷水与池水交汇处，雷池乡一带湖泊池沼连片；三孝祠：纪念孟宗、王祥、徐仲源，旧祠废而&quot;三孝故里&quot;名沿用；县署旧址与老城墙基：明万历三年（1575）筑砖城，设孝感翔凤等七门；护城河沿线尚有部分墙基；香茗山、太阳山、泊湖：古&quot;望江八景&quot;所在；褒隐寺塔（省保二〇一二年，鸦滩镇连塘城村）：孤独砖墙古塔立在村岗上，历五百年风雨，砖砌塔身斑驳，砖面风化成浅灰色，塔顶已残。塔旁农田开阔，远处村舍点点，野藤爬上塔基。；雷阳书院（省保，华阳镇书院路）：清代书院，今存四合院与讲堂两进，木构架尚整。大门框为石质立柱，两旁有石鼓，门上林调阳书“雷阳书院”颜体大字匾；大门内左右庑廊、东西教室、中间大讲堂组成四合院，右壁下嵌“在院教读，逢考作寓”石碑，院中圆柏撑天。一九八八年列省保。；陈氏宗祠：前后两进保存较好，梁枋雕花犹在，已实施修缮。；王幼学墓（省保二〇二六年，太慈镇桃岭村）：望江首座古墓类省保。；望江二中校史楼（省保二〇二六年）：四普新发现文物，二层砖木旧楼。；双河口桥（清代，鸦滩镇花河村）：四普新发现石梁桥。；时公桥（清代，长岭镇黄家堰村）：四普新发现石拱桥。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文庙大成殿：明末清初重建，位于县城中心文化馆后，五开间歇山顶，高约十米、面积三百余平方米，二十四根大柱组成方形结构，四周围廊。重檐翘角，装饰斗拱，檐角铁马空悬迎风作响；梁上彩绘仍在，飞檐翘角为皖西南最完整文庙大殿之一。抗日期间县城沦陷，大部分附属建筑被日寇烧毁，今独存大成殿一座。；青林寺：县城主体殿宇尚存，为望江旧庙少数未拆者。元泰定三年僧了智创建，明洪武二年僧性空重建佛殿，宣德二年建钟楼、方丈楼；佛龛与柱础仍在原位，木柱漆色剥落，石础风化，今为望江县佛教活动中心，香火不断。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌望江县署街老街坊 徐阿姨（65岁）：&quot;文庙的大成殿还是明朝的老样子，飞檐翘角的，梁上彩绘都还在。雷池就在城外的圩里，老话说&#x27;不足无过雷池一步&#x27;，咱望江人守着这份本分，过自己的日子。&quot;\u003cbr\u003e▌望江三孝祠旧址旁 老童（58岁）：&quot;三孝祠是老字号了，孟宗哭竹、王祥卧冰、徐仲源泣墓，都是咱望江人。城还是明万历年间的格局，七街十巷八桥，桥多的很。河边的老城墙基还在，砖给拆了，土埂子还杵着。&quot;\u003c/p\u003e"}, {"n": "太湖老城·晋熙", "s": "太湖", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e太湖县始建于南北朝，县治晋熙镇地处皖河之滨，自南朝起商贸渐兴。西正街因临河得名河街，为千余年来太湖最繁华的商贸动脉，粮食、布匹、山货经皖河转运进出。明万历年间筑砖城，崇祯九年（1636）为镇水患将六门一一更名，屡毁屡建。清中叶为水患所迫，县城西街外迁，老街格局渐定。二十世纪中叶花亭湖水库建成，部分旧街市沉入水下，但河街区至今仍是太湖最有烟火气的所在，逢集日人流如织，老铺子的木门板吱呀开合。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e太湖县治晋熙的西正街俗称河街，始建于南朝元嘉末年（424-452），一千五百多年没挪窝，主街两侧鱼骨般岔出条条小巷，是江南罕见的古街&quot;活化石&quot;。\u003c/p\u003e\u003cp class=\"main-text\"\u003e西正街（河街）：东起韦家巷、西至马路河口，长约六百五十米，主街宽四米余，支巷仅两米上下。沿街多清至民国砖木店铺，窄面宽、大进深，前商后宅，青砖小瓦、木椽马头墙连片。街面青石板竖向铺砌，传唯有出过状元的县方准如此铺法，街下旧河道穿巷而过，这便是河街一名的由来。；韦家巷、华美巷等支巷：自西正街两侧鱼骨状岔开，巷口宽不足两米，青石板路夹着深宅高墙。巷口那口井青石井圈磨得溜光，井圈上绳痕一圈深过一圈，老住户至今仍就井边淘米洗衣。；花亭湖：县西水库，库区淹没了古城的部分街市，湖滨老村落群成片；徐桥老街：太湖南境古镇老街，青石板街、徽派建筑仍存；赵朴初墓园及旧居（省保）：寺前镇凤形山畔，花亭湖畔。旧居为三进三纵九开间青砖小瓦徽派建筑，用房三十四间，建筑面积二千六百四十平方米。墓园倚凤凰山，2004年朴老灵骨归葬，立汉白玉碑。；佛图寺及摩崖石刻（省保）：寺前镇佛图村大尖山上，东晋大兴间天竺高僧佛图澄建，为安庆最早有文字记载的佛寺。现存天柱塔、飞来泉、天就门、披云石、八正桥等胜迹，摩崖石刻明清题记众多。；海会寺：小池镇白云峰下，现存仿唐大殿，赵朴初题寺名。寺内千年罗汉松一株，宋代玉带桥遗迹，慈禧御书真如自在匾额悬于殿上。；赵文楷墓（省保）：清嘉庆元年状元赵文楷葬处，墓前石人石马神道尚存，墓碑楷书赵文楷墓。；蔡家畈古建筑群与龙潭寨古民居（省保）：县北山区，明清徽派民居群，马头墙、天井、走马楼，沿溪而建，石板路连通寨门。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太湖文庙遗址与老城北门：明万历砖城屡毁屡筑，今老城砖散落街巷，护城河残迹犹存。街东段王氏宗祠为清乾隆间建，三进青砖小瓦，已列县级文保。；西风禅寺及摩崖石刻（省保）：花凉亭村凤凰山上，原名狮子庵，因左侧天然石洞朝西纳风而名西风洞。寺清咸丰六年毁于兵火，民国八年惺悟和尚重修。洞内摩崖石刻自唐至清十余方。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌河街布店老板娘 孙姐（60岁）：&quot;这条街一千五百多年了，从南朝就有。两边门面是清代的马头墙，一架架小木楼，鱼骨一样的巷子岔开去。赶集的日子，山里的山货、河里的鱼鲜都往这街上涌。我嫁到河街三十年，看着它老，也看着它活。&quot;\u003cbr\u003e▌韦家巷老住户 石爷爷（72岁）：&quot;我家巷子口那口井，青石井圈磨得溜光，打了几百年水了。街上的老铺子一家挨一家，砖墙进了水泛着青苔。太湖城老，河街更老，老得连县志都记不清它啥时候建的。&quot;\u003c/p\u003e"}, {"n": "宿松老城", "s": "宿松", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e宿松置县始于西汉，初为松兹侯国，唐代始称宿松。地处皖、鄂、赣三省交界，长江自此出皖境。晋代诗人李白曾来游，作&quot;浮云知古城，落日见秋色&quot;，咏的便是宿松。北宋时县城屡筑新城，青白釉瓷器烧造声名远播，南京市博藏有一件宿松北宋青白釉仙人吹笙壶，为全省仅见的国宝瓷。元末白崖寨筑就，明清两代兵燹屡经，城墙存废循环。二十世纪后临江商贸渐衰，但小孤山依旧耸立，白崖寨依旧巍然，老街的弦索声里还留着黄梅调的影子。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宿松始封松兹侯国于西汉，城东江畔小孤山一柱擎天，江中有&quot;海门第一关&quot;之誉；南宋白崖寨绵延十余华里号称&quot;南国小长城&quot;，还是黄梅戏的发祥地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e小孤山：海拔不足八十米，孤峰一柱耸峙长江北岸，嶙峋削立，号称海门天柱、江上第一关。山顶启秀寺黄墙依山石而建，蹬道两侧自唐至清摩崖题刻数十方，启秀寺后崖壁上楷书海门天柱四字，字径盈尺，临江望之凛然。；白崖寨：元末吴仕杰筑，寨墙沿山势蜿蜒四千二百余米，高约三米、宽一米余，险段叠为双层，全用大片石顺山脊垒砌。原有朝九、百花、听雨、乘风、攀龙五门，今存听雨、朝九、攀龙三门，门楼大条石垒砌呈半月形拱桥状，高十米许、宽八米、厚五米，顶部炮口瞭望俱在。；松兹故城遗址：西汉高祖时封松兹侯国，故城位于今县城一带，夯土遗存偶见；黄梅戏发祥地：宿松与黄梅隔江相望，采茶调在此孕育流行，为黄梅戏早期流传的核心区；县城老城墙基与雷港故道：江畔港埠废兴，老地名沿用；廖河古戏台（省保）：北浴乡廖河村，明中期建，前台三十二平方米，歇山顶抬梁干栏式。前后台以木雕花板相隔，乐队耳台高出正台八十公分，台中悬大雅元音匾额，雕戏文人物尚整。；小孤山石刻（省保）：小孤山蹬道两侧，自唐至清摩崖题刻数十方，启秀寺后山崖上楷书海门天柱四字大字径盈尺。；吴家五房屋（省保）：趾凤乡白崖寨下，明清徽派民居群，五进马头墙院落，木窗雕花尚整，与白崖寨同期修建。；贺氏启六公祠（省保）：县北乡村，清代宗祠，前后两进享堂，梁枋雕刻戏文人物。；朱书墓（省保）：县北，清初桐城派前驱朱书葬处，封土前立清碑。；黄鳝嘴遗址（省保）：县南沿江，新石器时代台地，为长江下游史前文化节点，文化层厚两米，地表散见红陶片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌小孤山船工 骆师傅（63岁）：&quot;小孤山一柱擎天，立在江心里，老话叫&#x27;海门天柱&#x27;。跑船的看到小孤山就知道到宿松、出皖江了。山顶的庙香火旺，过江的都上去拜。李白到过这，写&#x27;浮云知古城&#x27;，那字还刻在山崖上。&quot;\u003cbr\u003e▌白崖寨护寨人 王大叔（68岁）：&quot;这寨墙是石头的，元末吴仕杰筑的，沿山十几里，垛口枪眼都在，人称&#x27;南国小长城&#x27;。我小时候就在寨墙上放牛，青石缝里长着老苔。城墙会老，这石头寨子比县城的老城墙还硬气。&quot;\u003c/p\u003e"}, {"n": "枞阳老城", "s": "枞阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e枞阳西汉初置县，武帝元封五年（前106）南巡经此射蛟，于是设枞阳，属庐江郡。三国时为魏吴交争之地，地名&quot;周瑜镇&quot;流传。东晋陶侃曾令于此，凿洗墨池明志。隋唐以后枞阳因皖江之利渐成水路商贸重镇，上码头一带船桅林立，布行盐号鳞次栉比。明末清初，桐城学派的代表人方以智、方苞、姚鼐多与枞阳渊源深厚，故枞阳有&quot;文章之府、诗人之窟&quot;之誉。近代铁路公路兴起后江运转衰，老码头沉寂，但&quot;川&quot;字三街、射蛟台、洗墨池的旧迹连同老地名一起留在了枞阳人的记忆里。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e汉武帝在枞阳射蛟、陶侃在洗墨池洗笔。上码头老街后街、中街、河街三街似&quot;川&quot;字并列，是皖江老码头难得一见的旧街格局。\u003c/p\u003e\u003cp class=\"main-text\"\u003e上码头老街：后街、中街、河街三街近平行并列形似川字，青石板路斑驳木楼。中街近城门旧有一排十间大门面商铺，皆前店后宅；近年棚改后临江一段筑成青石防洪长堤，坝顶新立巨石刻古枞阳上码头，老街旧物已稀。；射蛟台：传汉武帝元封五年（前106）在枞阳长江射蛟，登高台留遗迹，今枞山麓尚有台地；洗墨池：在百步云梯山下，东晋陶侃任枞阳令时所凿，旁建惜阴亭。池水常年不涸，后人立碑纪念，碑面字迹经数百年风日已漫漶，池畔修竹犹存。；杨子升井：明代所凿，在原蛟台里巷深处，井口外沿为紫铜色麻石井圈，圈上阴刻杨子升三字。井圈经数百年绳磨，三字笔画凹槽里发亮，井水至今清冽。；舒家祠堂：清代宗祠建筑，木雕彩绘保存完整；老城门楼：枞阳老城残存的麻石条砌城门，券顶厚实；浮山摩崖石刻（国保）：浮山西南峭壁间，自唐宋至民国四百八十余方石刻，上至宋陆元杰、王安石、苏轼，下至明清民国。摩崖集中在张公岩、金谷岩一带，字径大者盈尺，小者寸许。；方以智墓（省保）：浮山镇白沙岭，明末清初思想家方以智葬处。墓前石阶数十级，墓碑楷书方密之先生墓。旁立省保碑。；方以智故居（县保）：浮山西麓丹丘墨历两岩之下，现名陆庄，旧名在陆居。明万历辛亥方大镇所建，前后两进隔天井相向，中心两进之间设天井。；太平军枞阳会议旧址望龙庵（省保）：在金鸡山下月牙湖西北，清康熙年间建。老门楼青砖小瓦依旧，进门大院内一株古柏已倾斜，以钢管斜撑；现存山门、大雄宝殿、藏经阁，殿内壁画尚整，今辟为太平天国纪念馆。；落箭墩与幕旗山：城东江畔，传汉武帝射蛟落箭处与三国吕蒙扎寨的幕旗山，山岗上有台地隆起，地表散见汉代绳纹陶片。；达观亭与黄山谷读书处：城中旧街后山顶，传宋黄庭坚读书处，亭为六角石亭，亭下摩崖刻达观二字。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌上码头中街老商户 陈伯（67岁）：&quot;我这条街叫中街，老辈子叫上码头，后街、中街、河街三条街排成&#x27;川&#x27;字，都是老码头留下的名堂。河街临江，涨潮时船就靠在街边。陶侃在枞阳当过官，洗墨池的碑还在。&quot;\u003cbr\u003e▌枞阳老文化人 何老师（70岁）：&quot;射蛟台上老辈人都说汉武帝登过，射过蛟。枞阳文气重，桐城派的大家好多从这出去，&#x27;文章之府&#x27;不是白叫的。老城门楼是麻石条砌的，喝了江水再重的车也压不垮。&quot;\u003c/p\u003e"}, {"n": "舒城老城", "s": "舒城", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e舒城春秋为舒国，隋唐析置舒城县，属庐州。宋代李公麟归隐龙眠山，自号龙眠居士，泼墨山水由此得名&quot;龙眠山色&quot;。明代洪武三年（1369）重建县署与鼓楼，县城格局渐定。清咸丰三年（1853）县署两度被毁，此后&quot;官赁民房作署&quot;，旧衙渐废。二十世纪后旧城改造，鼓楼街、东门路一带老街肌理大部荡然，惟晓天、汤池、桃溪等乡镇老街遗存较好。周瑜城、春秋山、龙津桥等古迹仍立在青山绿水间，为这座两千年古城留下可触的注脚。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e舒城古称龙舒，是周瑜故里、李公麟隐居地。老城里明代谯楼鼓楼街仍存，城外周瑜城、春秋山遗址散布，晓天老街是皖西保存最完整的徽派古街。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鼓楼街（古楼大街）：明代洪武三年（1369）知县员义建谯楼，重檐翚飞钟鼓严肃，为鼓楼街之始，今街名沿用；周瑜城：县西十八里，城址近方形，长宽各约二百九十米，四周夯土城垣尚存，东残垣高逾八米、基宽十七米、顶宽六米，夯层每层厚约二十厘米。城内有一直径九十余米、高五米的台基，城四周掘土尺余即见沙石河床，传为当年护城河。；晓天老街：中大街长七百米、宽三米，明清成街，卵石街面，徽派小灰瓦马头墙沿溪而建。街中独梁厅为清乾隆间建，四进五开间三天井一院落，二十八间房，第一进临街墙体高大，设青石质门框大门，二进为主体，属清代中期典型徽派民居。；春秋山：传唐贞元年间二禅子于此脱解，山上有李公麟读书堂、洗砚池遗址；龙津桥：古驿道上的石桥，横跨南溪，为南关外三里街门户；七门堰：汉颉羹侯刘信筑，与都江堰芍陂并称，利泽千亩。\u003c/p\u003e\u003cp class=\"main-text\"\u003e龙头塔：在县城龙舒路文化广场，明天启元年始建，清乾隆二十九年重修。六角七层，底层每边宽二米六，通高二十米七，塔刹为生铁铸造三层葫芦形、高二米一；塔身外砌青砖、内填杂土，二层以上砌假拱券门，第七层每角悬铁风铃一只。塔身上第四层嵌石碑刻龙头二字，塔名由此而来。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌鼓楼街老居民 束大爷（72岁）：&quot;鼓楼街明朝就有，洪武三年知府建的鼓楼，钟鼓一响四方都听得见。街上老铺子一家挨一家，我小时候还听见过敲更的梆子。后来楼拆了，街名还留着，老辈人都管这街叫&#x27;鼓楼大街&#x27;。&quot;\u003cbr\u003e▌晓天老街住户 花姐（58岁）：&quot;这条街从元朝就有人住，明清成了买卖，长700米，靠山临水。街头石桥、老井、祠堂戏台都在，青石板磨得发亮。2023年省里批了历史文化街区，街上又热闹起来了。&quot;\u003c/p\u003e"}, {"n": "庐江老城", "s": "庐江", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e庐江春秋属庐子国，西汉置庐江郡。东汉末周瑜生于舒，与庐江渊源颇深。南北朝时县治数迁，至梁代定于庐城南。唐代杨行密驻军庐江，舍宅建寺广兴佛事。元至正年间县人许荣筑土城，周围五百丈；明万历年间易土为砖，崇祯年间开六门。清朝时岗湾老街商贸鼎盛，&quot;金岗银湾&quot;之名远播。二十世纪后城墙拆除，环城河犹存；2021年岗湾老街依原貌重建，青砖马头墙再现潜川古韵。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e庐江古称潜川，岗湾老街是庐江商业发源地，明清时&quot;金岗银湾&quot;誉满天下；水西门明代筑就，冶父山禅林参天，周瑜故里的英风犹在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e岗湾老街：在庐城西北西大街，俗称岗上、西门湾，取首尾二字得名。老街在岗上、下临绣溪河拐弯处，原存三百余米青石板路与百余间老商铺；2021年依原貌重建，青砖马头墙连排，米行布庄旧址上重开茶铺食肆。；水西门（小西门/通济门）：明崇祯十二年建，为庐江六道城门之一。石券门洞与护城河桥尚存，近年依旧址辟为水西门街区，入口明代石雕尚在，戏台式广场入夜灯火渐起。；冶父山：县城东北，禅林古刹众多，伏虎禅师于此开坛，山上有&quot;冶父晴岚&quot;胜景；黄屯老街：庐江东南山乡，明清建筑百余间，两横一纵街巷格局，2015年入选安徽省首批千年古村落；金牛山安城遗址：县城西北，三国曹魏筑安城，古城残墙、旗杆石、葵花井等遗存；周瑜墓（省保）：在庐城镇朝墓巷，明正统七年立碑，1989年列省保。2008年辟为周瑜文化园，外立牌坊，内仿汉阙门，圆形封土墓冢前墓碑楷书吴周瑜之墓，神道两侧石像生成对，园中有仿汉享殿两进。；吴武壮公祠（省保）：城中东路牌楼社区，清光绪年间为纪念淮军吴长庆建。主体三进五开间，坐南朝北，马头墙封火山青砖小瓦。祠南十米古井一口，周围居民仍在使用。；孙立人故居（省保第六批）：金牛中学校园内，现存第三进十一间青砖瓦房，室内陈设按当年旧貌复原。院内孙立人手植枣树、木瓜树虬枝苍劲。；奎星楼：县城中心，始建清康熙二十五年，2011年重建八角三层攒尖顶，总高二十七点六八米，木构楼梯可登。；果树宋代瓷窑址（省保）：县东南果树乡，宋代青白瓷窑址，龙窑残基尚在，地表散落宋瓷片。；何氏太始祖陵园（省保）：县北，何氏始迁祖墓园，神道石像生多对，碑亭内供何氏始祖碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌岗湾老街老住户 李阿姨（63岁）：&quot;&#x27;金岗银湾&#x27;是老话，讲的就是咱庐江西门岗湾。老街在岗上，下头绣溪河拐弯，米行布庄药铺挤得满满当当。2021年重建的岗湾，青砖马头墙，想找回老庐江的模样。&quot;\u003cbr\u003e▌黄屯老街铺主 郑叔（59岁）：&quot;黄屯老街两横一纵，明清老房子一百多间，竹子、山货从这河运出去。街老了，铺子还有些，茶馆里还摆着老桌子。2015年评上千年古村落，村里人都挺高兴。&quot;\u003c/p\u003e"}, {"n": "无为老城", "s": "无为", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e无为之名取自&quot;思天下安于无事，无为而治&quot;，北宋太宗所定。三国时孙权筑濡须坞，为濡须口岸，曹操在此屯兵，濡须河成魏吴争夺要冲。北宋崇宁三年（1103）米芾知军于此，宝晋斋、墨池、拜石皆成佳话。宋末元初筑城，明洪武年间因水患重建，周围九里。清代无为商贸日盛，黄金塔、太平桥、华林桥等跨河而设。二十世纪后城墙多拆，惟北墙一段存为遗址。县境水网如织，泥汊、姚沟、刘渡、陡沟等老地名皆因水得名，诉说着这座水乡之城与江河湖汊共生两千年。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e无为是米芾痴禅拜石之地，&quot;墨池&quot;犹存。北宋黄金塔是安徽现存最古老的塔，无城古城墙遗址与米公祠（省级文保）一道，守着两千多年水乡的记忆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e米公祠：北宋崇宁三年米芾任无为知军时所建书斋宝晋斋，后祀米芾为祠。祠内藏历代碑刻一百五十余通，楷行草皆有名师手笔，院中古木遮日，1981年列省级文保。；墨池与投砚亭：米芾研墨洗笔之池，池水常呈墨色，今在米公祠院内。池上投砚亭为米芾掷砚处，六角小亭临池而立，石栏经数百年摩挲已发乌光。；拜石：米芾见奇石便整衣下拜，称&quot;石兄&quot;，此石今置米公祠内；黄金塔：在城北郊西河之畔，北宋咸平元年建，为安徽现存最早的砖塔。仿木楼阁式，平面六边形，面阔三米四，通高三十五米，共九层；通体青砖磨砖对缝，一、二与二、三层间为双层腰檐，腰檐仿木斗拱作鸳鸯交手，底层西半侧设佛龛室，塔内折式台阶可盘旋而上。；无城古城墙遗址：明代的北城墙残段，从仓埠门至东门一带，砖砌券顶尚存；绣溪公园与杏花泉井：县园林，老井青石井圈古意盎然；襄安白鹤观遗址：商周遗址，出土青铜鼎、玉璧、原始青瓷等，为无为先民聚落到此两千年的佐证。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌米公祠看祠人 老侯（61岁）：&quot;米芾在这当过知军，他那个书斋叫宝晋斋，藏过王羲之的帖。墨池的水常年发黑，是他洗笔洗的；那块拜石他还称过&#x27;石兄&#x27;，跪着拜过。祠里一百五十多通碑，楷行草都有名师手笔。&quot;\u003cbr\u003e▌黄金塔下老船工 丁师傅（66岁）：&quot;黄金塔是北宋咸平年间的，安徽最老的古塔，七层六面，立在河西岸。跑船的看见塔就知道到家了。米公祠在南门里，墨池杏花泉井都挨着，老无城的根都在这。&quot;\u003c/p\u003e"}, {"n": "岳西响肠老街", "s": "岳西响肠老街", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e岳西建县于1936年，为安徽省最年轻的县之一，由潜山、太湖、舒城、霍山边境析置。虽县龄不足百年，境内却古村镇遍布，响肠、店前、黄尾等皆是明清以来皖西南商道上的重镇。响肠地处潜岳通衢，古为商贾云集之地，石碑石桥石亭沿河而设。山城多雾、溪谷深秀，传统村落保存完整，先后有响肠、请水寨等列入中国传统村落名录。老街的祠堂戏楼、惜字亭上的铁戟，提醒人们这座年轻的县城底下，沉睡着更古老的文脉。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e岳西建县虽晚（1936年），境内却藏着响肠老街这样的明清古街：惜字亭六面三层铁戟指天，方氏胡氏宗祠堪称皖西南古建筑典范，千佛塔见证这座山城建县的年轻与老街的古老。\u003c/p\u003e\u003cp class=\"main-text\"\u003e响肠老街：明代始建、清初成街，长二百五十米、宽四米，依响肠河而建。街口惜字亭为清光绪八年建，亭高约十六米半，三层六方砖石结构，每层飞檐斗拱下饰花纹，底层空心，五方设假门、一方为正门供塞纸焚化，顶端竖铁戟，铁枪尖配月牙形锋刃直指天上。；方氏宗祠：在老街核心，清康熙九年建，坐南朝北，三进两天井。一进祠门面阔三间，大门凹进形成前门廊后过厅，大门背面二层为戏台，单檐歇山顶，台口矮栏三面敞开、左右看楼相接；二进中厅五架抬梁前轩后双步，三进神堂左右厢房各一。；胡氏宗祠：皖西南大屋典范，青砖黛瓦，木雕精美；千佛塔：在响肠镇法云寺内，相传东晋咸和年间始建，现存青砖砌筑四方七级楼阁式砖塔，原高二十八米、今残高二十米六，塔基宽三米五、条石砌成。塔心室中空至顶，每层内外壁各有四十个砖雕神龛，每龛一大二小三尊佛像，共一千六百八十尊，故名千佛。；万家楼、大夫第：明代古民居与功名府第，马头墙、天井、木格窗保存尚好；店前老街：岳西南部店前镇，临河埠而建，清末店铺近百家，巨型青石板铺街。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌响肠老街居民 方奶奶（75岁）：&quot;这条街从明朝就有，清末成了大买卖，河边码头抬货的人络绎不绝。街口的惜字亭是烧字纸的，老辈人敬惜字纸，写在纸上的字不能乱扔。方氏祠堂的戏楼唱过多少台戏，正月的花灯从这里出发。&quot;\u003cbr\u003e▌胡氏宗祠古建修缮工 储师傅（57岁）：&quot;胡家的祠堂是皖西南的老手艺，石雕木雕都讲究，专家看了都说能跟徽州的比。响肠的千佛塔一千八百多年了，老街的石头桥、老井、马头墙，一进山就能撞见一百多年前的老光景。&quot;\u003c/p\u003e"}, {"n": "贵池老城", "s": "贵池", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e明代洪武年间池州设府领贵池等六县，府城原为唐武德年间尉迟敬德初筑（一说唐永泰年间李芃修筑），明正德十二年（1520）知府何绍正依故址筑城，设七门：南面通远、毓秀、钟英三门，东九华门，西秀山门，北迎恩、望京二门。明万历三年（1573）加筑城楼，设警铺二十七处；清乾隆二十九年（1764）大修城墙，四门城楼巍然。清末至民国年间城墙渐次倾圮，惟秀山门及北城夯土尚存，1990年代后依遗址保护复建秀山门城墙展示。贵池古为秋浦、池州治所，李白曾五至秋浦，作《秋浦歌十七首》，&quot;炉火照天地，红星乱紫烟&quot;即咏铜官山冶铜之景；杜牧刺池州时&quot;借问酒家何处有&quot;的杏花村即在此。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e池州府城明代筑起七座城门的砖石城墙，秀山门博物馆里还留着瓮城和夯土断面，能看见城墙&quot;里土外砖&quot;的千年砌法。唐代始建的池州府儒学，大成门、状元桥、泮池至今完好。\u003c/p\u003e\u003cp class=\"main-text\"\u003e池州府儒学：唐代始建，2009年依原址复建，由牌坊、文昌阁、泮池状元桥、棂星门、大成门、大成殿、明伦堂、崇圣祠及东西庑组成，占地近一万五千平方米。原大成门框架结构保存基本完好，状元桥、泮池至今仍为考生家长考前图吉之所。；牌坊街：原池州城有牌坊九十余座，今仅存复建者，孝肃街口立有牌坊，连接府儒学与秀山门；城墙残段：明正德十二年依故址筑城，清乾隆二十九年大修后周长约四公里，墙基底宽两丈三尺。清末至民国渐次倾圮，今城北一带尚有夯土残墙可寻，府学巷、永胜巷一段老墙根仍在民居间露出。；池口镇古街：清溪河汇江处旧商埠，青石板街与老码头遗迹尚存。\u003c/p\u003e\u003cp class=\"main-text\"\u003e秀山门博物馆：明洪武间秀山门为池州七门之一，解放前夕城楼仍完好，文革时被毁，2006年依旧址复建。仿明清风格，城墙高十二米、脊高十九米，共五层设三个门洞，馆内陈列木雕、石雕、砖雕四千余件，城墙断面可见里土外砖的明代砌法。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌秀山门旁老街坊 李爷爷（72岁）：&quot;秀山门这瓮城是明代的，砖缝里都长青苔了。老辈讲城墙基宽两丈三，上面能跑马，我小时候还在城墙上放过风筝。府学的大成殿现在还在，逢考的日子，家长们还去状元桥走一走，图个吉利。&quot;\u003cbr\u003e▌杏花村街茶馆主 王大爷（63岁）：&quot;李白来过秋浦五次，&#x27;白发三千丈&#x27;就是在这写的。池州这地方水好山好，老城墙剩得不多了，但秀山门那张老脸还在，一见着它就想起当年七门齐开的模样。&quot;\u003c/p\u003e"}, {"n": "东至老城", "s": "东至", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e东流于唐会昌初年置县，因地处长江南岸、陶渊明采菊于此而有&quot;菊邑&quot;之称。明万历元年（1573）知县陈春循江筑城，分水城、山城、平城三段，设五门，后屡经增修。清乾隆年间建秀峰、天然双塔镇守南端，与对岸塔影相望。清末民初东流为皖西南商贸口岸，十字街船楫往来，商贾云集。1959年东流与至德合并置东至县，县治移尧渡，东流老城保留为历史文化名镇，老街、双塔、陶公祠成为&quot;菊邑东流&quot;的文脉见证。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东流是&quot;菊邑&quot;，陶渊明任彭泽令时常来此采菊，陶公祠里香火至今不断。东流老街十字街东西880米南北300米，明清徽派老屋一千多幢，是皖西南保存最好的古镇之一。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东流老街：十字街格局，东西街长约八百六十米、南北三百米，街宽三至五米，石板铺路。两侧明清徽派老屋千余幢，多二层块石基础、青砖小瓦、木柱横梁，泛潮发黑的墙根与斑驳木门格窗相映，檐下砖雕石雕尚整，1989年列省级历史文化保护区。；陶公祠（靖节祠）：原在县学宫内，明弘治三年（1490）重建，万历元年（1573）移建菊江亭侧，祀陶渊明，祠前菊径古意盎然；天然塔：在城北回龙山祝家矶上，清乾隆九年由邑人周士信夫人陈氏捐建，五层六方砖木结构，通高二十七米四，底部周长二十米八。塔方方有门，外飞檐内画栋，砖石楼梯可登，塔顶以法轮装饰，登塔可见大江东去。；天然塔：清乾隆十年（1745）建，建于回龙山，为周氏族人捐建；秀峰塔：在靖节祠侧，清乾隆二十四年建，五层六方，砖石砌成，高十余丈。除第一层外各层开六扇门，内设阶梯直通顶层，塔顶饰斗笔形宝顶，与天然塔的佛教相轮相别，远望如彩笔插天。；东流老城墙遗址：明万历元年（1573）知县陈春筑城，周长736丈，高1.4丈，分水城274丈、山城256丈、平城210丈，设迎春、丽山、通津、菊江、瞻极五门；今城基局部犹存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌东流老街住户 陈奶奶（70岁）：&quot;老街东西880米，走到底得老半天。街上的徽派老房子有一千多幢，青砖马头墙，檐下挂着旧牌匾。秀峰塔五层六方，老远就能看见，塔影落在菊江里，好看得很。&quot;\u003cbr\u003e▌陶公祠看祠人 吴师傅（59岁）：&quot;陶渊明当彭泽令，常到东流来采菊，所以这里叫菊邑。祠堂自明代移过来，香火一直没断，院里的菊花开到秋深还不谢。老话讲&#x27;采菊东篱下，悠然见南山&#x27;，说的就是这股子淡泊劲儿。&quot;\u003c/p\u003e"}, {"n": "青阳老城", "s": "青阳", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e青阳唐天宝元年（742）析南陵置县，治所设蓉城，此后历代为县治所未曾迁移。蓉城之名承九华山&quot;秀出九芙蓉&quot;之意，李白乐观九华而名之。陵阳更古，西汉元封二年（前109）置陵阳县，为皖南古县之一，东晋以后县治渐废，陵阳镇留为古镇。南宋以降青阳文风兴盛，明代理学家王阳明、湛若水曾至九华讲学。蓉城城墙历代皆以土筑，清末民初渐废为民居街巷，今仅富阳、双河二桥与老街肌理为昔日城池之遗，陵阳古镇的汉城遗址与明代太平山房则把青阳的文脉一路拉回两千年前。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e蓉城自唐天宝元年（742）置青阳即为县治，李白赞九华山&quot;秀出九芙蓉&quot;。镇内仅存富阳、双河两座明清石拱桥，陵阳古镇则有汉县遗迹与120根圆柱顶梁的国家文保太平山房。\u003c/p\u003e\u003cp class=\"main-text\"\u003e富阳桥：蓉城镇内仅存两座明建清修石拱桥之一，横跨青通河，桥券粗壮，桥栏雕兽古朴。青通河涨水时拱洞大、不阻流，老成都在桥头摆摊洗菜。；双河桥：另一座明代始建、清代重修的青石拱桥，桥券粗壮，是蓉城过河老径；太平山房（所村村）：全国重点文保，明清砖木学馆建筑，坐北朝南，通面阔五开间十五米，进深三进七十一米，占地一千一百平方米。正面四柱三楼式门坊，明间匾额楷书积善流芳四个径尺大字，枋额砖塑戏文典故，底座大理石单层须弥座。内部满堂柱造抬梁式，一百一十六根合抱明柱顶梁，月梁纵横。；陵阳古镇：汉元封二年（前109）置县为陵阳，今汉古城墙遗址、汉县衙遗址尚可寻，镇上明清古民居156栋、古桥40余座；南流桥：在陵阳镇，明嘉靖始建，历明清多次重修，条石砌三孔拱桥，长四十五米、宽五米、高七米。桥面石阶车辙深印，桥面高齐两侧屋顶，桥两端嵌修桥记事碑数块，立桥上可纵览陵阳街景与远近山色。；蓉城老街：青通河畔明清街巷肌理尚存，青石板路与沿河吊脚屋相映。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌所村村守太平山房的老屋主 刘大伯（71岁）：&quot;太平山房117根大柱子顶着那么大屋顶，四进院，当年是大户人家的正堂，现在还是村里的宝贝。陵阳的南流桥三孔，45米长，我爷爷小时候就在桥上乘凉，桥下的水清亮亮的。&quot;\u003cbr\u003e▌蓉城富阳桥头摆摊的周婶（58岁）：&quot;富阳桥、双河桥是蓉城老街上仅剩的两座老石桥，明代建的，清代修过。青通河涨水也不怕，拱洞大。九华山就在城西南，李白起的名，&#x27;秀出九芙蓉&#x27;，一出太阳就能看见九座山头。&quot;\u003c/p\u003e"}, {"n": "铜陵老城", "s": "铜陵", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e大通北宋设镇，古名澜溪，因长江支流澜溪河得名。明代以后大通为皖江货运集散中心，清代辟为商埠，与安庆、芜湖、蚌埠并称&quot;四大商埠&quot;，街市&quot;三街十三巷&quot;，钱庄、剧院、茶楼林立，号称&quot;小上海&quot;。1938年一场大火焚毁八大钱庄、四大剧院与三街十三巷大部，商埠自此衰落。铜陵本以铜名，春秋金牛洞古铜矿开采数百年，宋设铜官监，明清铜冶不辍，今铜陵市博物馆藏春秋兽耳鸟纹鉴，其青铜板幕墙用铜50吨，见证&quot;中国古铜都&quot;之名。如今澜溪老街与和悦洲隔江相望，旧港船影渐淡，惟老秤行的叮当声与天主堂的钟楼还守着大通的旧码头味。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e大通古名澜溪，北宋建镇，与安庆、芜湖、蚌埠并称安徽&quot;四大商埠&quot;，有&quot;小上海&quot;之称。澜溪老街780米走不完六百年的商埠浮沉，沿街老店与江心洲格局至今可辨。\u003c/p\u003e\u003cp class=\"main-text\"\u003e澜溪老街：长七百八十米、宽约七米，铺四方青石板，沿街徽式骑楼店屋鳞次栉比，现存历史建筑一百二十二处。沿江一侧粉墙黛瓦马头墙，二层木挡板斑驳，老秤行、老酱园门板半掩，青石板直通江边码头。；夏洪兴老秤行：百年老店，第四代传人夏大明至今制秤，杆秤、戥子手艺仍在；天主堂钟楼：清同治十年西班牙神父始建，民国二十五年竣工，原占地十四亩，共建钟楼、教堂、圣母院等十一幢建筑，1938年被日军占为兵营，今仅存钟楼。钟楼为罗马式四方立柱形，青灰砖与料石垒砌，边长约五米、高约二十米，分上中下三层，竖柱高耸、拱券门半圆，孤悬江岸。；金牛洞古采矿遗址：春秋至西汉铜矿遗址，全国重点文保，反映铜陵三千年铜冶历史；铜官山旧址与1978文创园：明清以来铜采冶重地，今辟为文创街区。\u003c/p\u003e\u003cp class=\"main-text\"\u003e和悦洲：长江江心洲，旧时三街十三巷格局，头道街、二道街残迹尚存。洲上圣公会教堂建于1914年，房屋部分毁于日机轰炸，今仅存一幢两层青砖小楼约八百平方米，青砖墙体经风雨不倒。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌大通澜溪老街住户 章奶奶（75岁）：&quot;老街780米，从这头走到那头，一路都是老店铺。夏洪兴的秤做了四代人，现在还在做，称东西一称一个准。和悦洲在江心，当年三条街十三条巷，热闹得跟上海似的。&quot;\u003cbr\u003e▌夏洪兴老秤行第四代 夏大明（60岁）：&quot;我太爷爷那辈就在澜溪街做秤，传到我这第四代。秤是公平，不能亏了买卖人。老话说大通是&#x27;小上海&#x27;，钱庄剧院都烧了，可做秤的手艺还在，街还在，那就行。&quot;\u003c/p\u003e"}, {"n": "南陵老城", "s": "南陵", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e南陵西汉置春谷县，三国时周瑜、黄盖先后任春谷长，李白《南陵别儿童入京》&quot;仰天大笑出门去&quot;即离南陵入京之作。唐长安四年（704）县治由赭圻迁至青阳城（今籍山镇），此后千年末移。明洪武元年（1368）知县梅鼎建县署，正德十年（1515）知县胡文静立四门：东迎恩、西黉堂、南丽正、北拱辰；城门俱设城楼，外环护城河。清代增修，城墙遮護城池数百年。二十世纪后城墙渐拆，惟&quot;城墙头&quot;土埂因防洪而存，遗址公园内老木森森，文风塔依旧矗立，是为南陵&quot;春谷故郡&quot;之城根。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e南陵古称春谷，周瑜、黄盖先后任春谷长，李白几度寓居。县治唐代迁籍山镇后千年未改，&quot;城墙头&quot;还留着一圈护城土埂，宋代的文风塔立着&quot;文峰璧立&quot;三碑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文风塔：北宋元祐间始建，今存为明万历年间重建的六角七层楼阁式砖塔，高近四十米。每层一门两窗、门窗上下交错隐现，塔刹高耸、刹杆穿七重相轮；塔旁立文峰璧立、雁塔题名、金石榜三碑，碑面风日漫漶而字迹尚可辨。；城墙头遗址公园：在城北，明嘉靖间知县郝永春筑城墙、设四门，今砖体已融入城市，惟一圈夯土老埂因防洪留存。埂上古木合抱，树根把土抱住，公园沿埂铺草坪，北门灵应门一带老墙基仍在。；护城土埂：县城&quot;城墙头&quot;现存一圈土埂，明清以降每逢梅雨汛期即为护城屏障，土埂上老树盘根；籍山河畔老街：县治籍山镇沿青弋江支流的明清街巷与老码头；弋江镇：在县城东郊青弋江畔，千年古镇，干字型老街为骑楼式二层小楼，灰砖砌成，楼下门面楼上住家。江西会馆五间三进为清代赣商所建，古碑石刻字迹清晰；王家大宅占地一千二百平方米，双层砖木，旧时界碑尚存。；大工山铜矿遗址：全国重点文保，西周至汉铜矿采冶遗址，曾出土青铜器。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌南陵城墙头老住户 孙大爷（74岁）：&quot;&#x27;城墙头&#x27;这圈土埂是明朝起的，年年梅雨就靠它挡水。土埂上那几棵大树，比我爷爷的爷爷还老，树根把土都抱住了。文风塔宋代就有，塔旁三块碑，&#x27;文峰璧立&#x27;那四个字还在。&quot;\u003cbr\u003e▌籍山镇青弋江畔的老船工 黄师傅（66岁）：&quot;南陵老话讲&#x27;周瑜黄盖守春谷&#x27;，李白走的时候高唱&#x27;仰天大笑出门去&#x27;。县治从唐朝搬到籍山就没挪过窝，快一千四百年了。弋江镇九条老街上，老铺子一家接一家。&quot;\u003c/p\u003e"}, {"n": "泾县老城", "s": "泾县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e泾县西汉置县，属丹阳郡，古为宣纸产地，唐时宣纸即以泾县为最。明嘉靖四十二年（1563）为防倭寇知县陈廷芝筑砖城，乾隆二十九年（1764）大修，城周扩至1035丈、垛口2027个，耗白银三万五千两。历代城墙屡修屡圮，至民国时仅余南门口至青弋江大桥一段条石城墙，凭借临江顶托之力保存至今，为皖南不可多得的明代城墙实物。泾县文脉鼎盛，李白游泾县桃花潭作《赠汪伦》，&quot;桃花潭水深千尺&quot;千古传唱；宣纸自唐宋传续，乌溪红星宣纸为&quot;文房四宝&quot;之首；查济、章渡等古村古镇，则把泾县的山光水色与纸墨书香一并留在了青弋江畔。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泾县是宣纸故里，&quot;纸中之王&quot;从这里走向天下。章渡古镇的&quot;吊栋阁&quot;临江木柱撑起97间老屋，号称&quot;江南千条腿&quot;；明嘉靖筑的砖城墙，南门口到青弋江大桥还留着1060米条石老墙。\u003c/p\u003e\u003cp class=\"main-text\"\u003e泾县明代城墙：明嘉靖四十二年知县陈廷芝为防倭筑，今存南门口至青弋江大桥一段长一千零六十米，条石砌筑、高约十米。条石经数百年江水与岁月剥蚀，石缝间生草，临江一侧墙根被江水顶托至今未塌，为皖南保存最长的古城墙。；章渡古镇吊栋阁：临青弋江而筑，三分之一坐地、三分之二悬空，每间以原木柱撑于江埂之上，现存九十七间连为一体，沿岸六处下河石阶将其分为七组。屋为瓦木结构，楼上檐下有雕花斜撑与雕花栏杆栏板，江水上涨时从柱下穿流，入夜屋灯映江如一串吊灯。；桃花潭：李白赠汪伦处，踏歌岸阁始建于明、清乾隆重建，道光二十六年翟金生督修石座。阁后文昌阁为清乾隆三十二年建，三层八角，上层铁铃、下两层铜铃，三层屋面逐层加陡、八角翘向天空，底层悬盛世文明、二层文光射斗、三层共登云梯匾额。；查济古村：元明清古民居140余处、古桥40余座、祠堂30座，全国重点文保；宣纸作坊（乌溪）：红星牌宣纸产地，古法捞纸技艺传承千年；青弋江水西双塔：北宋双塔隔河相望，全国重点文保。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌泾县南门城墙根下住户 查奶奶（73岁）：&quot;这段城墙是明朝嘉靖年间筑的，条石砌的，十来米高，老结实了。青弋江就在墙脚下流过，涨水也不怕。桃花潭更老，李白的诗把它的名气唱了一千年。&quot;\u003cbr\u003e▌章渡古镇吊栋阁住户 冯大爷（70岁）：&quot;吊栋阁就吊在青弋江上，底下木柱子撑着，一共97间，顺河排开，像千条腿撑着一条街。下河有六级石阶，洗菜挑水都走那。老匠人还守着捞宣纸的手艺，泾县纸天下闻名。&quot;\u003c/p\u003e"}, {"n": "宣州老城", "s": "宣州", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e宣城西汉为丹阳郡治，古名宛陵，历代为郡、州、府治所，号称&quot;江南通都大邑&quot;。东晋咸和二年（327）内史桓彝营建子城，隋开皇中刺史王选扩筑罗城广轮三十里，唐末罗城毁，南唐刺史林仁肇更筑龟形新城。清末民初城墙总长九里十三步，高二丈五尺、厚三丈，设五门：东阳德、小东泰和、南薰化、西宝城、北拱极，均为双城门。1939年为城墙改用，县长率数万民工拆除古城墙，&quot;九街十八巷&quot;格局逐渐改观。谢朓楼、景德寺塔、敬亭山与广教寺双塔则跨越千年，把宣城&quot;上江人文之盛首&quot;的文脉一直讲到今天。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宣城古名宛陵，2300年古城，是&quot;宣城自古诗人地&quot;。谢朓、李白、白居易、杜牧都在此留下名篇，李白&quot;相看两不厌，只有敬亭山&quot;让敬亭山成了江南诗山。古城&quot;九街十八巷&quot;格局可寻，唐代始建的谢朓楼今日重现。\u003c/p\u003e\u003cp class=\"main-text\"\u003e谢朓楼：南齐建武二年谢朓任宣城太守时筑高斋于陵阳山，唐初改建为楼，历代重建，今楼为1997年依旧制重建。二层十字歇山顶木结构楼阁，占地二百九十平方米、高约十八米，红柱黛瓦飞檐翘角，四角悬风铃，顶层匾江南名楼、下层匾谢朓楼，楼内陈列谢朓李白诗文碑刻。；敬亭山：海拔三百余米，李白相看两不厌咏之，历代三百余位诗人登临。山麓广教寺双塔为北宋建，东西相距二十七米，均七层方形仿木楼阁式砖塔，残高约十七米，沿袭唐代方形平面为宋塔孤例；塔壁以间柱分三间，二层内壁嵌北宋苏轼书《观自在菩萨如意轮陀罗尼经》刻石。；景德寺塔（开元塔）：在古城东南，北宋九级六面楼阁式砖木塔，高三十一米四，底边直径八米。塔身弧身砌法、叠涩菱牙砖出跳，内部空筒式结构设螺旋木梯可登顶，塔顶三戟护环铁刹工艺精巧，为宣城老城重要地标。；九街十八巷：九街为阳德、木直、福星、锦城、元宝、奉公、镇前、迎恩、西直大街；十八巷如孙家巷、瓦碴巷、九曲巷等，街道原为青石板铺设，下为拱形下水道，两溜青石嵌边；水东老街：宣州区水东镇明清老街，天主教堂建筑群与花戏楼为省保；老十字街与济川桥：阳德门外的济川桥跨宛溪河，为老城四桥之首。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宣城老大街街坊 许大爷（76岁）：&quot;老宣城有&#x27;九街十八巷&#x27;，阳德街、木直街、锦城街，青石板下面都是拱形的排水沟，下雨不积水。小时候还爬过城墙，九里十三步，五个城门双城门。现在城墙没了，老街还留着几段。&quot;\u003cbr\u003e▌敬亭山下摆茶摊的郑婆婆（67岁）：&quot;敬亭山不高，三百来米，可李白一写就出了名，&#x27;相看两不厌，只有敬亭山&#x27;。谢朓楼更不用讲，李白喝醉酒写&#x27;抽刀断水水更流&#x27;，就在那楼上。城变了，山和楼的故事没变。&quot;\u003c/p\u003e"}, {"n": "当涂老城", "s": "当涂", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e姑孰城始筑于三国东吴黄武年间（222-228），旧志载城基建基有&quot;黄武&quot;二字，为当涂县治之始。东晋兴宁二年（364）大司马桓温镇姑孰重建城并筑子城，此后姑孰历为县、州、路、府治所，明清为太平府附廓。宋建炎三年（1129）知州郭伟弃姑溪河于城外，开挖护城河、增南北水关、建五门城楼；清乾隆初年城成高三丈六尺、围9里19步的砖石城垣，城蝶1850个，设行春、澄江、清源、龙津、南津、湖孰六门。清咸丰年间太平军拆城砖运至金柱关筑&quot;天保城&quot;，城垣渐损；1937年城垣尽拆，惟护城河与城基遗址留存。当涂因李白而名，李白晚年定居此地，葬于青山西麓，太白楼、太白墓遂成&quot;诗仙&quot;乡愁所系。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e当涂是太平府治所，姑孰城始筑于三国东吴&quot;黄武&quot;年号。采石矶为&quot;长江三矶&quot;之首，太白楼是全国现存最古的纪念李白古建筑；城内的清源门城墙遗址与护城河还勾勒着明清府城的轮廓。\u003c/p\u003e\u003cp class=\"main-text\"\u003e姑孰城清源门（北门）段城墙遗址：在太平府文化园，明城遗存。复建清源门段城墙、敌楼与水关高约十二米，墙基下压真正原址旧砖；登城墙可见四公里长护城河如玉带绕老城，旧砖纹路深浅不一，六朝以来的旧迹犹可指认。；护城河：明清姑孰城护城河总长4公里、宽近百米，至今水环老城；采石矶：长江三大名矶之首，临江绝壁，李白、白居易、苏轼、陆游等皆登临题咏；翠螺山、太白楼、三台阁、三元洞、捉月台等景；太白楼（谪仙楼）：唐元和始建，现存建筑为清光绪三年彭玉麟捐资重建，两进三层木结构，通高十八米、占地五百七十余平方米。北朝南，一层厅、二层楼、三层阁，前楼后祠；底层青石垒砌，二三层木结构，歇山屋面铺黄色琉璃瓦，筒瓦滴水饰鳌鱼走兽，飞檐镶金色剪边，大门门额蓝底金书唐李公青莲祠。；太白墓（青山李白墓）：全国重点文保，在青山之阳，园门朝西青石牌坊高悬诗仙圣境匾。圆形墓冢以一百七十块青石砌成、周长二十余米，墓前嵌清碑楷书唐名贤李太白之墓，碑高仅一米四、字径一寸四，墓旁新植翠竹冬青。；黄山塔：南朝始建，李白&quot;长啸倚天梯&quot;咏之；金柱塔建于明代，八角七层；天门山（东西梁山）：李白&quot;天门中断楚江开&quot;即咏此夹江对峙之山。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌当涂清源门遗址旁住户 赵奶奶（71岁）：&quot;姑孰城是三国吴黄武年间起的，明朝修成砖城，高三丈六，九里十九步，六座城门。现在只剩北门清源门一段城墙和一圈护城河。河还在，四公里长，水还绕着老城走。&quot;\u003cbr\u003e▌采石太白楼讲解员 马老师（55岁）：&quot;太白楼唐代就有了，是我国最老的纪念李白的楼，李白晚年就住当涂，葬在青山。&#x27;天门中断楚江开&#x27;写的东梁山西梁山，就在采石矶对过。来当涂的人都说，这是诗仙最后的家。&quot;\u003c/p\u003e"}, {"n": "芜湖老城", "s": "芜湖", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e芜湖古为鸠兹邑，公元前570年楚国大夫子重克鸠兹，这是芜湖最早的城址。西汉元封二年（前109）鸠兹设县，易名芜湖。三国吴黄武二年（223）孙权迁县治于青弋江口鸡毛山高地，此后城址未再迁移；东晋王敦在此筑&quot;王敦城&quot;。隋唐芜湖撤县为当涂属镇，南唐复置县，北宋筑县城，盛极一时。明嘉靖间倭寇窜犯，县库两次被盗失银一万三千八百两，遂于万历三年（1575）起费时6年筑新城，周5华里、高3丈，设宣春、长虹、弼赋、来凤四城门及迎秀、上水、下水三便门。清光绪二年（1876）芜湖辟为通商口岸，城墙渐拆拓为环城马路。晚清开埠后芜湖米市盛极一时，居江南四大米市之首，中江塔、城隍庙与沿江街巷记录着这座江城吞吐千帆的旧事。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e芜湖古称鸠兹，两千五百多年城史，吴黄武二年孙权把县治迁到青弋江口。明代万历筑的城墙如今拓成了环城马路，中江塔、城隍庙、宋代谯楼还把着古城的江岸烟火。\u003c/p\u003e\u003cp class=\"main-text\"\u003e中江塔：临青弋江与长江交汇处，明始建、清续建，五层八角楼阁式砖木塔，高四十三米七，每边长四米一、塔刹高十米余。一、二层为明代原构，三至五层清代续建；每层一门四窗错置相间，窗左右设灯龛为夜航船导航，塔内一、二层壁内折上式石梯盘绕，三至五层空筒木梯依壁，八角转角斗拱支承出檐。；城隍庙：东吴赤乌二年始建，距今约一千七百八十年，为国内最早城隍庙之一。现存建筑经明清重修，戏台、厢房、大殿香火延续至今，庙前广场逢年过节仍有灯会香火。；宋代谯楼与明清县衙：安徽仅存两处宋代高台建筑之一，石砌高台为宋代原物，台高三米五、长二十四米、宽十米九，台中门空四米二宽。门头不用砖石起券，而以二十五厘米见方楞木做过桥，为宋代营造旧法；面阔三间，明间抬梁、次间穿斗，歇山顶。咸丰战乱县衙被焚，仅存石台，上木构楼阁为同治重修。；花街、南街：古城热闹老街区，青石板路、马头墙、红灯笼；南正街为明万历年间芜湖最早的步行街，前店后场格局；环城马路（环城东、西、南、北路）：即四百年前明代城墙遗址，四周城门方位仍可循；干将铸剑遗址（赤铸山）：春秋冶剑师干将、莫邪为楚王铸剑处，淬剑池、铁门槛等遗迹尚存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌芜湖环城路老住户 秦大爷（74岁）：&quot;这圈环城路就是明朝城墙扒掉修的，宣春门、长虹门、来凤门，方位我还能指出来。中江塔是又当航标又镇水，四角挂风铃，晚上江上的船看着塔灯就知道到芜湖了。&quot;\u003cbr\u003e▌南正街老商户 沈老板（62岁）：&quot;南正街是明朝万历年间的步行街，前店后场，我爷爷在这卖过米。芜湖米市当年是江南四大米市之首，青弋江边的船一靠岸，米就挑上岸过秤。街还是老街，米市的余味还在老街巷里飘。&quot;\u003c/p\u003e"}, {"n": "和县老城", "s": "和县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e和县秦置历阳县，因&quot;历&quot;水得名，梁陈时南梁北齐在此议和，555年改名和州，沿称至民国改和县。历阳镇古称亚父城，相传为范增所建，自古为和州治所。唐代文豪刘禹锡元和年间贬任和州刺史，于州署东偏筑陋室，作《陋室铭》以明志，陋室遂成千古名迹。北宋镇淮楼雄踞城北，明代墙垣屡加修筑，清乾隆、道光年间重修，朱元璋曾登楼赋诗。明末清初和州为江东险要之郡，城墙多次增筑。乌江镇为项羽自刎地，霸王祠香火千年。二十世纪后城墙渐废，惟陋室、镇淮楼、文庙、文昌塔与乌江霸王祠跨越千年，把和县的文臣风骨与霸王气概一并留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e和县古名历阳，秦置县，2200年城史。刘禹锡被贬和州时写下&quot;斯是陋室，惟吾德馨&quot;；镇淮楼是朱元璋登楼赋诗的地方；乌江的霸王祠，是项羽&quot;不肯过江东&quot;的千古凭吊处。\u003c/p\u003e\u003cp class=\"main-text\"\u003e陋室：唐长庆四年刘禹锡任和州刺史时所建，清乾隆年间知州宋思仁重建九间，1986年列省保。今为三幢九间品字形院落，白墙黑瓦斗拱飞檐，虽清构而存唐意；门楣陋室二字为今人所题，院内石铺小院、龙池月洞门相通，刘禹锡铜像立正厅。；镇淮楼（谯楼）：北宋始建，坐北朝南，楼基长五十五米、宽二十一米、高十一米，夯土筑台外砌青砖，现存主体为清光绪十七年知州罗锡畴督造。楼上下两层、共楼房十四间，建筑面积千余平方米，正下方拱形门洞穿街，朝南门楼隶书匾尚存，登楼可望长江。；和县文庙：唐代始建，地方祭祀孔子官学之处，重建有大成殿、东西庑、泮池，红墙黄瓦；历阳古城遗址与亚父城：历阳镇古称亚父城，传为项羽亚父范增所建，城池遗址可寻；文昌塔、万寿塔、和阳桥：明代文昌塔、三国万寿塔与明代和阳桥。\u003c/p\u003e\u003cp class=\"main-text\"\u003e西楚霸王灵祠：在乌江镇，文革中塑像墓地被毁，仅存正殿三间两侧厢房曾改作中学校舍，1984、1992年两次重修。入口青石汉阙式门楼，明代董其昌手书霸王祠三字凿于石；棂星门前一对清代石狮，门楣韩美林题西楚霸王灵祠镏金大字。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌和县陋室公园老住户 钱大爷（73岁）：&quot;陋室是刘禹锡当和州刺史时住的，&#x27;斯是陋室，惟吾德馨&#x27;就写在这。乾隆年间重建过九间，1986年还立了省保。镇淮楼在城北，朱元璋上去喝酒作诗，&#x27;满天明月大江流&#x27;。&quot;\u003cbr\u003e▌乌江霸王祠守祠人 韩师傅（64岁）：&quot;霸王祠就建在项羽自刎的乌江边，李清照那句&#x27;生当作人杰，死亦为鬼雄&#x27;，刻在碑上。老辈人都说项羽&#x27;不肯过江东&#x27;，气节重过性命。和县这地方，文有陋室，武有霸王，全了。&quot;\u003c/p\u003e"}, {"n": "含山老城", "s": "含山", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e含山先秦为吴楚边界要地，秦属九江郡历阳县地。东晋大兴二年（319）为安置北来流民，侨置龙亢县于此，县治在杨府城村。唐武德六年（623）分历阳西部置含山县，县名源于县西含山&quot;群山列峙，势若吞含&quot;，永乐间近1400年沿用不改，其间武德八年曾废并历阳，长安四年复置改名武寿，神龙元年恢复含山。宋元明清含山长期属和州。清中期县治环峰筑城，城外环山，明清两代屡有修葺。含山文脉厚重：春秋伍子胥过昭关，北宋王安石游褒禅山作名篇，理学家游酢晚年定居含山终老；而凌家滩遗址则以五千八百年前的精美玉器，把含山的根扎进中华文明的源头。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e含山有中华远古文明曙光凌家滩，5800年前的玉龙、玉鹰从这里出土；褒禅山华阳洞是王安石《游褒禅山记》的诞生地；运漕古镇是千年商贸水乡，李鸿章当铺至今仍在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e凌家滩遗址：铜闸镇新石器时代晚期遗址，距今5800-5300年，出土玉器、石器等3000余件，为中华玉礼文化重要源头，列国家考古遗址公园；褒禅山华阳洞：长江以北少见的喀斯特溶洞，王安石游此作《游褒禅山记》，&quot;世之奇伟、瑰怪、非常之观，常在于险远&quot;；古昭关与伍相祠：东马山、西城山夹峙成关，关洞拱形，径深约七米、宽三米、拱顶距地约四米。关顶伍相祠始建南宋隆兴元年，明万历二十四年重修，明三暗五砖瓦木石结构，飞檐翘角，殿中木龛伍子胥怒按七星剑塑像，关前青石板车辙深印。；运漕古镇：在裕溪河畔，千年商贸水乡，中国历史文化名镇。镇西大街李鸿章当铺为李鸿章四弟李蕴章所开元和质，坐南朝北前后五进四开间砖木平房，正门临西大街、后门靠裕溪河，建筑面积一千四百余平方米。山墙细砖每六块一组十字交错垒至顶，敲之如击铁；今内部分割小间仍住居民，框架基本完好。；环峰老街与县署旧址：县治环峰镇因周围环山得名，老城街巷仍存部分明清肌理。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌运漕古镇老住户 贾奶奶（69岁）：&quot;运漕是千年老镇，傍着裕溪河，当年商船云集。李鸿章在这里开过当铺，佘氏宗祠的老房子还在。老街上的马头墙一座连一座，青石板路被挑夫踩得锃亮。&quot;\u003cbr\u003e▌凌家滩遗址守护人 龚大伯（62岁）：&quot;凌家滩挖出来的玉龙、玉鹰，五千八百多年前的东西，做工精细得吓人，说明那时候我们这地方就是文明中心了。褒禅山华阳洞是王安石写《游褒禅山记》的地方，&#x27;非常之观常在于险远&#x27;，就他说的。&quot;\u003c/p\u003e"}, {"n": "繁昌老城", "s": "繁昌", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e繁昌本为春谷县地，县治屡徙：西汉春谷县治在荻港舒村，历时600余年；502年改南陵郡，县治迁荻港赭圻；南唐升元年间（937-942）割南陵五乡复置繁昌县，县治设延载乡（今新港镇），历时500余年，因县小民贫长期无城，仅编竹为障，世称&quot;陋县&quot;。北宋庆历七年（1047）知县夏希道首筑县城，周六里八十步，曾巩撰《繁昌兴造记》、王安石撰《繁昌县学记》记其事。明天顺元年（1457）知县王珣迁县治至金峨上乡（今繁阳镇），旧城改名旧县。新治180多年未筑城，至明崇祯十一年（1638）知县张继曾集士绅议定照田派费，筹银三万余两，历时1年2个月筑成城墙，周646丈8尺、高二丈，设朝阳、迎薰、威远、拱极四门，后又于学宫外增设聚奎门，凡五门五桥。城内十五街十三巷一胡同、十八坊。如今城墙多已不存，惟夫子庙、泮池与城门老地名，还在讲述繁昌&quot;五门四桥&quot;
