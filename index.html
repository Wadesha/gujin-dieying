的旧城格局。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e繁昌古为春谷县地，南唐复置县后县治几度迁移。明天顺元年迁至金峨上乡，崇祯年间筑成五座城门四座桥的城墙，如今夫子庙（大成殿）仍是繁昌仅存的较完好明代建筑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城墙旧址与门址：明代城墙周646丈8尺、高二丈，设朝阳、迎薰、威远、拱极四门及聚奎门，共五门；今城门方位与残基可寻；百子桥（东门桥）：明崇祯十六年太医院判王道纯于朝阳门外捐建，桥拱正中石上百子桥三字肥硕饱满。整个桥拱由九组石块按次序叠筑，桥基三层大石条砌成，桥两端堤岸上四棵百年古柏迎风兀立。；繁昌窑遗址与柯家村窑址：古青白瓷窑址，全国重点文保，证明繁昌宋代已是制瓷之邑；旧县镇（今新港）：明代迁城前的旧县治所在地，沿江古镇遗迹。\u003c/p\u003e\u003cp class=\"main-text\"\u003e夫子庙（大成殿）：在城关一小校园内峨溪河畔，明天顺元年始建，文革中建筑群被毁，今仅存大成殿及泮池。重檐庑殿顶，黄瓦覆盖，正脊两端龙吻、中装葫芦宝瓶，殿顶琉璃脊兽五色缤纷；面阔三间进深三间平面正方形，梁架简朴、斗拱规整、出檐深邃，檐口角铃悬空，檐下额枋梁柱镂空浮雕，为繁昌仅存较完好的明代单体建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌繁昌城关老住户 谢奶奶（72岁）：&quot;繁昌老县城有五座城门四座桥，东门朝阳门外有百子桥，是明朝一位太医自掏腰包修的。城墙崇祯年间筑的，周六百四十六丈，有两丈高。现在城墙没了，夫子庙的大成殿还在，是明朝的老房子。&quot;\u003cbr\u003e▌繁昌学宫旁的老教师 林老师（58岁）：&quot;夫子庙就是以前的学宫大成殿，明朝的，繁昌现在最老的明代房子。曾巩、王安石都给繁昌写过记，一个讲筑城，一个讲办学，可见繁昌自古就重文重教。城墙拆了，庙还在，学味儿还在。&quot;\u003c/p\u003e"}, {"n": "歙县老城", "s": "歙县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦置歙县（前221）。隋末汪华筑郡城。宋宣和三年（1121）改筑新州。元至正十七年（1357）邓愈加筑徽州府城，设德胜、南山、潮水、镇安、临溪五门。明嘉靖三十四年（1555）知县史桂芳始筑县城，三十八年（1559）建成，设紫阳、问政、新安、玉屏四门，自此徽州府县同城。清沿用不改。民国后城墙多段拆除，1990年代后依遗址复修城门。唐代以降文风鼎盛，明代许国、汪道昆，清代新安画派出其邑。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走进徽州府城，第一眼是练江北岸带瓮城的潮水西门，城墙顺着山埂子走，约一公里墙段可登临，望得见渔梁坝横在江上。城中阳和门外，一座四面八柱的石坊正堵在街心，青石板巷子从坊下穿过去，五百年没挪过窝。\u003c/p\u003e\u003cp class=\"main-text\"\u003e徽州古城墙：练江北岸依长青山走势而筑，北宋罗城、明嘉靖三十八年建成府县同城砖石城，原周长约七里半，现潮水门至镇安门一线约七百五十米墙段保存尚好，可登临。潮水西门带月城，进门先见一道小门洞，一个拐弯才撞见第二道城门，瓮中捉鳖的意思就藏在这一拐里。城墙体以块石垒砌墙基、青砖包砌墙身，墙根下还能摸到旧河道的淤痕，1990年代后依遗址复修了德胜门、问政门等城楼。；许国石坊：中和街与打箍井街交口，明万历十二年立，四面八柱围合成口字形，俗称八脚牌楼，全国仅此一座。八根方形茶园石柱各约五十公分见方、七米多高，梁枋、栏板、斗拱全用同色青石榫卯拼装，单块料重四五吨。柱脚十二只石狮各踞一方，有雄狮戏球、雌狮抚幼，台基两侧还镌獬豸；梁枋上巨龙飞腾、瑞鹤翔云、鱼跃龙门、凤穿牡丹层层叠压，青石板巷子从坊下穿过去，五百年没挪过窝。；渔梁坝：城南渔梁村外横截练江的滚水石坝，长约一百三十八米、底宽二十七米、顶宽四米、高约五米，全用吨把重的凤凰麻花岗岩条石层层垒砌。同层石条之间以燕尾锁横向咬合，上下层之间每十块立一根石柱、贯入元宝钉竖向锚固，上下左右紧联一体。坝北中南设三道泄水门，比坝顶低约一尺，三门从北向南依次渐低，最南端水门直冲山壁折向东北，坝上水平如镜、坝下浪头啃石。；南谯楼：古城内子城南门旧址，隋汪华吴王府外城门，宋代报时城门楼，现存明重建、1997年按古制复修的木构。门阙宽四点五米，两壁对称竖立二十六根水桶粗的木柱，左右各十三根，每根柱围一米余、呈十度斜倚墙壁撑住大梁，中门两根藏入墙内，俗称二十四根柱。这种排叉柱做法是正宗宋代城门形制，国内罕见；楼上原置铜壶滴漏与鼓具，晨钟暮鼓传遍府城。；阳和门（东谯楼）：南宋绍兴二十年（1150）始建的谯楼，紧挨着许国石坊，门洞尚存，晨钟暮鼓已歇。；府衙历史街区：府衙、斗山街、渔梁三片连片徽州街区，青石巷道，蛤蟆井、大方井、小方井等明清古井散在路边，抬手能沿井绳打一桶。；中和街、打箍井街、十字街：古城内被岁月磨亮的青石街巷，牌坊、马头墙夹道，脚底下踩的还是旧石板。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌斗山街老住户 许奶奶（70岁）：&quot;徽州府城四门，潮水门还带个月城，民国时还能看见护城河的水。许国石坊八根柱子顶着，村里老人说那是&#x27;八角牌楼&#x27;，逢年过节坊下走亲家，热闹得很。渔梁坝用麻石垒的，几百年洪水都冲不垮。&quot;\u003cbr\u003e▌渔梁坝边渔家 洪师傅（62岁）：&quot;渔梁坝是&#x27;徽州都江堰&#x27;，练江的水到了这就得乖乖分几股。老辈靠这坝行船放排，徽州的茶叶、桐油都从这上船。阳和门那谯楼南宋就有了，晨钟暮鼓，如今楼在钟声歇。&quot;\u003c/p\u003e"}, {"n": "休宁老城", "s": "休宁", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉建安十三年（208）建县。唐天宝九年（750）起海阳为县治。宋代始筑城墙。明嘉靖三十五年（1556）为御倭寇辟七门，四大门以所朝之山为名：北萝宁、东万宁、南玉宁、西齐宁，另设小三门。清代城内有八街七十二巷，民谚东门牌楼西门店、南门住屋北门田。海阳城西万安老街自明清为徽州水陆码头，吴鲁衡罗盘、胡开文徽墨由此出。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e海阳老城被方山、古城塔几座小山围着。齐宁街这条红砂石板路从东门一直铺到西门，脚下泛红，一街走出两个状元。城外万安老街更长，沿横江水湾子排开，老码头石阶一直伸到水里，船一靠岸整条街都活过来。\u003c/p\u003e\u003cp class=\"main-text\"\u003e同安堂：齐宁街一百五十二号清代老药铺，国八，坐北朝南共四进二十八间，占地约一千三百平方米，大小花园与水井各两处。门楣上嵌如意、人物、仙鹤、花卉砖雕；堂前天井水平墙高九米，柱础是连瓣型青石，天花编成席纹状，当地叫nian。主房雀替梁栿木雕龙纹、童子、仙鹤、神鹿，后堂堆过杂物，大门朝北开在左侧山墙上。；同安堂：齐宁街上清代老药铺，国保，前店后坊的徽派商号门面还在，柜台药柜原样。；胡开文墨店：街上百年徽墨老字号故店，金字招牌尚悬。；万安老街：横江水湾边的古商街，长两千五百余米，分上街、中街、下街三段，民谚大大万安街小小休宁城。十数座古水埠码头沿石阶排到水边，百三十余处明清两层前店后坊民居夹道，中国历史文化名街。上街口吴鲁衡罗经老店三百年未挪，第八代传人仍在店里用毛笔描二十四山、刻刀刻木盘；皂荚巷陶行知启蒙馆里，旧私塾课桌椅还摆在原位。；三塔四古桥：古城塔、巽峰塔、富琅塔三塔遥对，富来、轮车、观音、通济四座古桥跨水。；吴鲁衡老罗经店：万安街上百年罗盘老店，店堂里老罗盘、老铜针还在；陶行知启蒙馆亦在老街。；五城老街：长约九百米，唐代起即商贸街市，忠靖王庙会祀张巡。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌万安老街老商户 程老板（66岁）：&quot;万安老街两千五百米，小时候码头边船一排排，米、茶、笋干都从这走。吴鲁衡家的罗盘做得最精，指南针认方向，老船老大出海都要带。&#x27;大大万安街，小小休宁城&#x27;，这话一点也不假。&quot;\u003cbr\u003e▌齐宁街巷口闲坐的吴伯（74岁）：&quot;齐宁街780米，一街出了两个状元，汪绎、汪如洋，都是汪家人。同安堂药铺还是老样子，胡开文墨庄的墨香能飘半条街。老话讲&#x27;东门牌楼西门店&#x27;，如今牌楼没了，店还在。&quot;\u003c/p\u003e"}, {"n": "黟县老城", "s": "黟县", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦二十六年（前221）置县，因黄山古称黟山而名，为全国最古县之一。古城始建于东汉、形成于宋元、鼎盛于明清。宋城设吉阳、望仙、通闾、永宁、桃源、景星六门。明嘉靖四十五年（1566）筑城，设朝阳、迎霭、明昌、环碧、临漳五门，后开桃源小东门。崇祯七年（1634）迎霭门筑月城，称郭门。民国后城墙尽拆，街巷格局未动。2021年列为国家历史文化名城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e黟城是个少见的圆城，城墙顺着山势围成个圈，街巷却走得方方正正，人称圆城方街。城心一条叫槐渠的活水明一段暗一段地穿街过巷，渠上活动石板掀开就能舀水；南宋的三孔石拱桥还跨在渠边东溪上，水依旧清。\u003c/p\u003e\u003cp class=\"main-text\"\u003e槐渠：南北朝梁代太常卿胡明星倾资开凿，自城北柏山筑坝拦漳河引水，长两千五百余米、宽近两米，明渠暗渠相间穿城而过。明渠段流在北街中央，把一条街自然劈成两半；暗渠段潜流巷下，渠上盖板可掀开取水。一千多年旱时灌、涝时泄、急时防火，至今仍是老居民洗菜浣衣的活水渠。；通济桥：俗称北门桥，跨漳河（东溪），南宋淳熙五年县尉李称倡建，原名戊己桥，清乾隆十九年余种德重修改今名。三孔石拱，青石砌筑，长三十二米、宽六米，桥墩向上游伸出成削尖分水头。桥面条石被几百年脚步磨得溜光，桥短柱密、结构严谨，是黟城最老的桥，也是古黟通往北方驿道的咽喉。；程氏宅：泮邻街吴家古井旁，俗称铁皮门大屋，明万历后期建，现存完整明代民居之一，占地仅一百五十六平方米，前后三间二楼结构。天井水平墙高约九米，两侧山墙高达十三米；大门朝北开在左侧山墙，外建木栅栏门亭，亭内方砖大门高二点五米、宽一点八米、厚约十公分，门面铁皮包钉，故名铁皮门。门楼砖雕立体浮雕刻花鸟戏文，刀工细腻，比西递宏村的还老。；戊己桥、薛公井、三元井：散布城巷的宋代古井古桥，井水仍清。；古街巷：九街十三弄，青石板路，成片明清古民居夹巷而立。；三条省历史文化街区：古城核心区街巷肌理完整未动。；环山楼（市保）：城中明代楼阁，二层木构挑出，柱础石仍是旧物。；怀德堂（市保）：明清厅堂，梁架彩绘尚在，隔扇门窗保存完整。；程梦馀宅（县保）：明代民居，门楼砖雕精美。；周氏祠堂（县保）：城中宗祠，享堂梁枋用材硕大。；云门塔（碧山村，清代）：清代砖塔，一九八六、二〇〇九、二〇一四三次省财政拨款维修，一塔凌霄起，晴云足下浮。；汪氏祠堂十三门（碧山村）：二〇二一年政府投资一百二十六万元修缮，十三道门堂连片。；二陆齐名坊：县学山下莲花塘东畔旧坊，青石枋额尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌槐渠边洗衣的汪嫂（57岁）：&quot;槐渠是南北朝留下的，两米宽，明渠暗渠都有。渠上的石板能掀起来，平时盖着走路，起火或洗东西就掀开舀水。老辈讲&#x27;旱时灌、涝时泄、急时防&#x27;，这条活水流了一千多年。&quot;\u003cbr\u003e▌通济桥头老人 胡大爷（75岁）：&quot;通济桥南宋就有了，三孔石拱，桥下东溪水清得很。黟县城是圆的，街巷是方的，九街十三弄走不丢。程氏宅明万历年间的，木雕门楼精致，比西递宏村的还老。&quot;\u003c/p\u003e"}, {"n": "祁门老城", "s": "祁门", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐代建县，为古徽州六县之一。宋城设东迎仙、南朝京、西望云、北通黟四门，元仍宋旧。明嘉靖年间平政、仁济两桥相继架起，三里街因城外水陆要冲先于城兴。周家嘴码头号小上海，过载行分立，为徽茶外销集散中枢。清代以降祁红名扬海内外。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e祁门城夹在阊江和凤凰山之间，东街五百年的青石板从城门一直铺进洪家大屋的天井。江对面三里街比城还老，两座五孔石拱桥隔江对着，夜里月影落在两个桥洞里，就是双虹夜月。\u003c/p\u003e\u003cp class=\"main-text\"\u003e东街历史街区：城东五百年老街，青石板路面，徽派门楼一户挨一户，省历史文化街区。；洪家大屋：东街敦仁里八至十六号，清道光二十四年建，国保。坐北朝南二进二层砖木，总占地一千二百余平方米，承恩堂居中，后有养心斋，左承泽堂、思补斋，右荆奕堂、笃素堂、三世大夫第，屋屋相通连成一片。咸丰十年曾国藩行辕设此，与太平军对峙十月。大门门罩砖雕百子图、渔樵耕读，天井纳光，梁架木作砖雕独具匠心，近年修缮后新换的大梁花窗椽子与老构件融为一体。；谢家大屋：传东晋谢安后人聚居，一宅七进士，万历年间金匾仍悬堂上。；王家大屋（燕舍）、万家大屋：徽商茧丝、酱园、红茶老宅，深宅大院。；三里街：城东南阊江对岸的明清商贸老街，民谚先有三里街、后有祁门城。；平政桥、仁济桥：阊江上相距约两百米的两座五孔石拱桥，一官一民，合称双虹夜月。平政桥为官方所建，仁济桥由民间募资，两桥均青石垒砌，墩作船形分水，桥身微拱，桥面石板被独轮车碾出浅槽。夜里月影落进两个桥洞，一明一暗对着，老辈叫双虹夜月。；伟溪塔、文峰塔：北宋伟溪塔塔身嵌满佛像砖；明六边形砖石文峰塔为古祁门十二景之一。；祁门古戏台群（国保）：全县现存十一座宗祠戏台——敦典堂、会源堂、嘉会堂、大本堂、敦化堂、和顺堂、聚福堂、顺本堂、新安、叙伦堂、馀庆堂。馀庆堂为现存最完好一座，戏台藻井木雕满堂，穹顶层层收分，戏台上锣鼓一响，天井里站满听戏人。；洪家大屋 detail：东街敦仁里八至十六号，清道光二十四年（一八四四）建，含承恩堂、养心斋、承泽堂、思补斋，二进二层砖木，总占地一千二百余平方米，咸丰十年（一八六〇）曾国藩行辕设此。；倪望重宅一府六县（省保第五批二〇〇四年）：清代大宅，一宅如府分六县格局。；报本祠（芦溪乡查湾村汪氏宗祠，市保）：明建清重建，座北朝南三进三开间，前后天井，三进台阶式上升，青石栏板精致，通面阔十三米通进深四十一米。；合一堂（五凤楼，历口镇历溪村王氏宗祠，省保）：明清宗祠。；一本堂（省保第七批二〇一二年，明）：明代祠堂。；祁门茶业改良场旧址（省保第九批，民国）：祁红近代工业遗存。；祁门县博物馆（一九八八年竣工）：藏明郑之珍《新编目连救母劝善戏文》，黄铤刻插图。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌三里街老住户 滕师傅（68岁）：&quot;老话讲&#x27;先有三里街，后有祁门城&#x27;，三里街在城外，比城墙还老。平政桥、仁济桥两座五孔石拱桥隔江相望，相距两百米，晚上月影双虹，好看。周家嘴码头当年做红茶生意，船一到，&#x27;小上海&#x27;就醒过来。&quot;\u003cbr\u003e▌东街洪家大屋管理员 倪女士（55岁）：&quot;洪家大屋是国保，当年曾国藩把行辕设在这，跟太平军对峙了十个月。谢家大屋更传奇，谢安后人迁到这，一门出了七个进士，万历年的金匾还在。东街五百年的青石板，走上去咯吱响。&quot;\u003c/p\u003e"}, {"n": "绩溪老城", "s": "绩溪", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐永泰二年（766）置县，以乳溪、徽溪并流离而复合、有如绩焉得名。县治华阳镇千年未移。宋筑城，明嘉靖年间砖砌城墙，设城门、鼓楼，清康熙三十八年《县志城垣图》留存。城内前店后坊，徽墨作坊林立，为徽墨制作技艺国家级非遗核心产地，亦是徽菜发源地。龙川胡氏宗祠建于明代，木雕九百余件无一雷同。民谚无徽无成镇、无绩不成街。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e华阳镇做了一千年县治没挪过窝，老城围着中正坊长起来——一座十字拱券门洞的旧坊子，四条街从四个方向穿过去，站在坊下就是老城的地理中心。城外龙川的胡氏宗祠，梁枋雀替雕满了图案，人称木雕艺术殿堂。\u003c/p\u003e\u003cp class=\"main-text\"\u003e中正坊：中正街旧称，俗称四川门，宋代建邑时测此定中、四方延伸筑城，明重建为正方形亭阁式，边长约四米、脊高六点三七米，砖砌券门为明代原物。底层四个拱门贯通东西南北，拱门上分别题中正坊三字与坊志，站在坊下四向皆通，是华阳镇千年未移的老城地理中心。；中正坊-白石鼓、西山两片历史文化街区：百余处历史建筑挂牌，街巷未改。；三雕博物馆：明代嘉靖年间周氏宗祠改建，清乾隆三十四年至四十一年重修，现存建筑面积一千一百五十六平方米，省保。由影壁、门楼、回廊、庭院、正厅组成，门楼重檐歇山顶、面阔七间，八只大戗角腾空四射；正厅明间直柱取银杏木，柱础作菊瓣形。白墙素瓦外表朴素，入内梁枋雀替上鲤鱼跳龙门、鹤鹿同春刀工细腻，明清砖雕木雕石雕原件都陈列在原地。；龙川胡氏宗祠：国保，木雕艺术殿堂，梁枋雀替雕数百图案无一雷同；奕世尚书坊亦在龙川。；绩溪博物馆：老城古县衙旧址上新建，折顶拟山、留树作庭。；西山古井：老城西侧明清井泉。；胡适故居：城内名人故居。；绩溪文庙（国保）：华阳镇良安路北侧，北宋庆历四年始建，元至大邑宰张纲重建，明清屡修，今仅存泮池、泮桥、东西两庑及大成殿。大成殿清乾隆四十二年建，重檐歇山，面阔五间进深四间，建筑面积二百六十平方米，四路花砖正脊，梁架天花藻井遍饰民间彩绘，素有江南第一学宫之称。；明伦堂考棚：清代科举考场，保存完好，与文庙相邻，考棚号舍犹在。；文昌魁星阁：城中旧阁，魁星立鳌头一手执笔一手捧斗，为旧时学子必拜处。；湖村、石家棋盘村、西关古民居：徽派古民居连片，水口园林尚存。；梓潼桥：城外歙溪河上古桥，青石板桥面磨出凹痕。；灵官山摩崖石刻：城外山崖旧刻。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌中正坊看门的老街坊 章叔（69岁）：&quot;中正坊是中正街的中心，门洞是十字拱券，四个方向都能通。老城就围着这坊子长起来，坊下是街，街上做买卖。清代的《城垣图》还在，画着那时的城墙、城门，如今墙没了，十字巷还在。&quot;\u003cbr\u003e▌三雕博物馆讲解员 方小姐（40岁）：&quot;博物馆原是明代周氏宗祠，砖雕、木雕、石雕原件都能看。龙川胡氏宗祠的雀替、梁枋雕了几百个图案，没一个重样，人称&#x27;木雕艺术殿堂&#x27;。绩溪是徽墨之乡，墨坊的烟火气，从老城一直飘到龙川。&quot;\u003c/p\u003e"}, {"n": "旌德老城", "s": "旌德", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐代宝应初置县，首任令高叔夏。元元贞元年（1295）王祯任县尹，营县四门。明嘉靖四十三年（1564）赵在筑城，四十五年（1566）九月竣工，城三面临山一面临水，设七门。万历三十五年（1607）增设水关门。清乾隆二十八年（1763）筑马道。建国后城墙陆续拆除，街巷肌理未改。2016年旌德获评安徽首个国际慢城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e旌阳镇是安徽头一个国际慢城，城小得从南门走到北门不到一公里。三座老桥顺着东门一线锁住徽水，叫三桥锁翠；北宋的文庙大成殿和清乾隆的文昌塔，一殿一塔还立在老城原地。\u003c/p\u003e\u003cp class=\"main-text\"\u003e淳源桥：宋元丰五年（1082）建于上东门，三桥中最古。；架虹桥：明永乐十年（1412）建，位于中东门。；黄济桥：明嘉靖年间建，位于下东门；三桥横跨徽水并称三桥锁翠。；文昌塔：清乾隆八年（1743）建的文峰塔，立在城边，登塔可望全城。；庙首镇古巷：清代徽派大屋肇修堂、女词人吕碧城故居所在。；江村古建筑群（国保二〇〇六年第六批，白地镇江村）：村口聚秀湖六千五百平方米，明成化弘治间开湖。湖边文昌宝塔、世科坊、父子进士坊，村内溥公祠、孝子祠、江氏宗祠、笃修堂、茂承堂、进修堂、黯然别墅、江冬秀故居、江泽涵故居共十二处连片，明清常居人口曾达八万，人称小杭州。；表灵塔（市保二〇一六年，兴隆镇）：清代砖塔，七层楼阁式。；三溪乐成桥：三溪镇石拱桥，皖南第二大石桥。；朱旺村（中国传统村落）：九井十三桥古村，青石板巷沿溪而铺。；乔亭文笔石峰：村口石笔，花岗岩兀立。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文昌塔：清乾隆八年始建、十一年竣工，在原文昌阁旧址上垒石筑基，与文庙隔徽水河相望。塔为八角五层砖木混合楼阁式，高三十一点八米，壁厚一点四米，每面边长二点七米，塔基矩形花岗岩垒砌高约七十公分。塔门卷形开在正西，门上方砖刻阳文昌塔三字；每层设腰檐、翼角腾空，顶置葫芦形塔刹。原二至五层木楼木梯民国间焚毁，塔身仍完好。；老城街巷：南门直通北门，长不足一公里、宽不过三米，麻石街面被独轮车碾出深深凹槽，是当年贩茶贩盐走出来的。淳源、架虹、黄济三座石拱桥顺东门一线锁住徽水，叫三桥锁翠。2016年旌德获评安徽首个国际慢城，街上慢悠悠的，老城墙拆了，桥、塔、殿还是当初的样子。；旌德文庙 detail：国保二〇一三年第七批，旌阳镇营坎路。北宋崇宁元年（一一〇二）始建，初名文宣王庙，五次被毁重建，最后重建于清顺治二年（一六四五）。占地六千六百七十平方米，由文庙与文昌塔一体构成，大成殿斗梁尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老城街口老人 周大爷（73岁）：&quot;旌德城小，南门到北门一路走下去不满一公里，街宽三米。麻石街面被独轮车碾出深深的凹槽，是当年贩茶贩盐走出来的。淳源、架虹、黄济三座桥锁住徽水，&#x27;三桥锁翠&#x27;，晚上月照桥洞最好看。&quot;\u003cbr\u003e▌文昌塔下的老住户 江婶（60岁）：&quot;文昌塔是清乾隆八年造的，立在城边，登塔能望全城。文庙大成殿北宋就有了，过节时还去拜孔夫子。旌德成了&#x27;国际慢城&#x27;，街上慢悠悠的，老城墙拆了，可这三座桥、这塔、这殿，还是当初的样子。&quot;\u003c/p\u003e"}, {"n": "广德老城", "s": "广德", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e南朝梁绍泰元年（555）即为郡县治。宋淳熙六年（1179）郡守赵希仁建六门设子城。元至正十六年（1356）朱元璋令元帅赵继祖、邵荣筑城，设迎春、明威、崇德、阅武、石溪、常州六门。明嘉靖三十二年（1553）知州庄士元改砖砌城墙，万历二年（1574）增子墙。清康熙二年（1663）州守杨苞重建，改门名熙春、丽正、安贞、拱辰。民国起城墙渐拆，建国后于原城墙基修成环城公路。桃州素有负山置郭、夹水为城之势。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e桃州镇做了一千五百年郡县治，老城如今只靠一座北宋鼓角楼的砖石楼座立在街心，旁边天寿寺塔顶着几片残檐。护城河绕着老城走，迎春街、升平街的条石路面还认得出当年的五条大街。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城墙遗址与护城河：明嘉靖三十二年（1553）砖砌城墙，今城墙基址、粮长河熙春河环城水系尚存，河沿犹可想见旧墙。；迎春街、升平街：老城东西南北中五条大街之遗，条石路面。；万桂山：明代知州周瑛所建园林，遍植桂树，尚存凌云峰、澄心池旧迹。；大木桥旧工业区、横山教育区：老城格局东西展开。；天寿寺塔 detail：北宋太平兴国四年（九七九）始建，初五层，元重修成七级，高三十一点三四米，单筒阁楼式砖木，挑檐窜角，角悬风铃，塔内转梯可登。一九八一年省保，第七批国保。修缮中发现地宫石盖长七十四厘米、宽四十四厘米、厚八点五厘米，及石碑六十五乘五十乘五厘米，碑记纠正旧志塔名与建年之误。；凤凰墩（市紫线）：老城东高地，历代郡治县治内外城遗址清晰可辨，夯土断面可见。；万孺人墓（省保）：明代墓葬，石象生与神道碑尚存。；耿村明代耿姓民宅（省保）：因凤凰山水库异地迁移保护，砖木门楼按原构件复建。；月克冲小三线九四零厂旧址：上世纪六七十年代三线工业遗存，部分建筑修缮中。；桥头村祠山庙西楼：省保修缮项目，木构西楼尚整。；张光藻故居（市紫线）：清代天津知府张光藻旧居。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鼓角楼（谯楼）：北宋治平四年始建的广德州衙子城南门，原二层重楼，上置鼓角钟漏，下为拱形卷洞。现存砖石楼座高四点三米，东西长二十六点七米、南北进深十米，楼座下部五层石条叠砌，以上排砌砖墙；正中卷洞门基座由四种规格石条砌成，拱券砌法与江南古桥相仿。清末楼毁、1937年遭日机轰炸仅剩楼座，1999年按原貌重修，是桃州城中仅存的宋代地望。；天寿寺塔：北宋太平兴国四年始建，初五层，元符三年至崇宁四年火后续修为七级，高约三十一米，单筒楼阁式砖木，挑檐窜角，角悬风铃，塔内转梯可登。光绪二十六年毁于火，仅存砖砌塔体。1983年修缮时发现地宫，砖砌直口坑深一点一米、见方三十二公分，内有石碑一块，纠正旧志塔名与建年之误；1986年大修后七级六面、铁链式塔顶，各层檐角风铃仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌迎春街老商户 沈老板（61岁）：&quot;广德城古称桃州，鼓角楼北宋就有了，是州衙的南门，如今只剩楼座，四米三高。老城五条大街，迎春街、升平街都是从前的大马路，条石铺地。护城河绕城一圈，站在河沿还能想起城墙的模样。&quot;\u003cbr\u003e▌天寿寺塔下乘凉的王婆（67岁）：&quot;天寿寺塔是老城的宝贝，几把火都烧不掉它。万桂山是几百年前知州种的，满山桂花树，秋天香遍全城，可惜如今只见其名不见形。广德是山水园林城，护城河里曾有桥有影，美得很。&quot;\u003c/p\u003e"}, {"n": "宁国老城", "s": "宁国", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e东津河（水阳江上游）穿城，河沥溪因水运自明清至民国为宁国首镇。徽茶、竹木由此转运江浙，为皖东南物资集散中心。永福桥明嘉靖间架起，沟通两岸。1990年代后商业中心西移，河沥溪一度萧条。2023年启动保护性更新，2024年9月开街，保留多数传统构件，修旧如旧。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e河沥溪老街沿东津河排开，民谚小小宁国县、大大河沥溪。明嘉靖的九孔石拱桥横跨东津河，桥底下小溪口的青石码头一百来米长，台阶一直伸到水边上，还像等着渡船靠岸。\u003c/p\u003e\u003cp class=\"main-text\"\u003e河沥溪老街：明清至民国宁国首镇，主街长约一千二百米，省历史文化街区，主街沿东津河排开，雨伞巷、状元巷、当铺巷三条横巷向河边散开。程家大屋青石浮雕门套前院正屋后院回廊，今作龙窑非遗体验馆；胡开文墨庄金字招牌、老布店蓝印花布仍在。2023年启动保护性更新，2024年9月开街，修旧如旧。；小溪口古街区：县级文保，老街与东津渡、河沥溪大桥连为一体。；小溪口码头：河沥溪东津河上，用大块青石板筑成低水位与高水位两道台阶，总长约一百米，中间一条宽二点五米青石台阶直通老街街道。明代知县王迁所作《宁川歌》刻在桥边元宝石船上。昔年渡船一靠岸，徽州山货与浙商海货在这台阶上上下，整条街都活过来。；程家大屋：清代老宅，前院正屋后院回廊，青石浮雕门套，今作龙窑非遗体验馆。；老街古巷：雨伞巷、状元巷，胡开文墨庄金字招牌、老布店蓝印花布、当铺巷旧墙。；《宁川歌》刻石：明代知县王迁相所作，刻于老桥下元宝般石船之上。；仙人塔（国保，仙霞镇龙亭村村南冲口峭壁上）：唐贞观年间始建，古称当阳宝塔，塔身挺秀修长如笔，亭亭玉立于崖壁。；千秋关（省保二〇一二年，云梯畲族乡千秋村）：宋南渡置关戍守，清咸丰重修，大块方石迭砌，关残高三点八二米、长二十五点二五米、厚七点一七米，关门嵌千秋关石质匾额。；山门洞及摩崖石刻（省保二〇一二年，城北十五公里文脊山东麓）：石灰岩洞府七十二，最著六洞，山门洞高十米宽十七米，石壁削立豁然中开俨若城门。唐贞元间洞旁建寺，宋治平赐号灵岩寺，崖壁石刻尚存。；上坦桥（省保）：清代石拱桥。；周氏祠堂（省保）：皖南宗祠，门楼砖雕精美。；毛竹山、官山遗址（国保）：旧石器时代旷野遗址，石制品散见。；宁临古道（省保二〇一九年）：宁国至临安浙皖边界石板道。；望仙桥（省保）：古桥，拱券尚整。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e永福桥（东津桥）：明嘉靖元年胡珂捐金两千两始建，九孔满肩石拱桥，又名东津渡桥，嘉靖五年毁于洪水，十年胡珂再捐五千两复建。桥长近一百八十米、宽约八米，九孔等跨，拱券由花岗岩拱肋组成，肋间铸铁腰栓连接；桥墩作船形分水尖，减缓汛期东津河急流。昔年桥上建亭三十九间，今亭不存，桥身仍横卧河上，为宁国现存最大石拱桥。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌河沥溪老居民 徐爷爷（72岁）：&quot;&#x27;小小宁国县，大大河沥溪&#x27;，这话传了几百年。河沥溪是码头，徽州的山货、浙商的海货都从这过。永福桥明朝就有了，九孔石拱，是宁国最大的桥。小溪口的青石码头一百米长，渡船一靠岸，整条街都热闹。&quot;\u003cbr\u003e▌老街雨伞巷住户 刘奶奶（65岁）：&quot;雨伞巷、状元巷，名字都带着故事。程家大屋当年是富户宅子，天井敞亮，如今改成了龙窑体验馆，还能捏陶。街上的胡开文墨庄金字招牌还在，蓝印花布随风摆，像从清朝走到今天。&quot;\u003c/p\u003e"}, {"n": "郎溪老城", "s": "郎溪", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e宋端拱元年（988）置县，因地势卑下，置县五百余年间仅立四门无城。明嘉靖四十三年（1564）赵佑卿始筑城墙，四十五年（1566）成。崇祯八年（1635）侯佐奉檄重建。清雍正八年（1730）西北女儿墙被暴风刮倒七十余丈，旋修复。民国间城墙渐毁，1950年代后逐年拆除，唯临郎川河一段因防水而存。城内东门街、西门街、北门街三街呈丁字形交接，条石铺路。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e郎川河贴着老城淌，南岸一段六十多米的明城墙青砖还立着，是安徽少有的真明代城墙。老城建平千年没挪过，当年七门四关三面环水，如今只剩河边这截老墙认得当年。\u003c/p\u003e\u003cp class=\"main-text\"\u003e四门一水关：东朝阳、南清徽、西甘露、北瞻天四门，南门右水关名听政门；南门正对孔庙不建城楼，说怕挡文气。；胥河：春秋伍子胥所开，世界最古老人工运河之一，比京杭大运河早近千年，至今仍通水。；建平八景：涛峰远望、石涧春和等，载入史册。；侯村祠堂：凌笪镇侯村，清乾隆始建、嘉庆十三年建成，坐东朝西，砖木日字形平面，前中后三进，占地约一千二百平方米，为郎溪现存最完整、建筑面积最大的清代古建筑，省保。两进之间以一米宽滴水沟隔开，又以门洞相通；排架式挑梁构造，斗拱华美，后进南墙保存四幅彩色花鸟壁画，每幅纵七十公分、横二百一十公分；天井两株牡丹相传两百余年，初夏花大如碗。；姚村宣州石砚：李白赞宣州石砚墨色光。；磨盘山遗址（国保，安徽第二批考古遗址公园）：新石器时代环壕聚落，入选全国十大考古新发现，环壕与房址基址经发掘揭露。；鸦山古道（国保二〇一三年）：清顺治年间开凿，嘉庆、光绪、民国间屡修，刘家冲村段建于明嘉靖，青石板沿山脊而上，为徽茶外运古道。；建平镇土墩墓群（国保）：郎川河岗地一墩墩封土堆，安防工程已竣工。；侯村祠堂 detail：凌笪镇侯村，清乾隆始建、嘉庆十三年建成，坐东朝西，砖木日字形平面，前中后三进，占地约一千二百平方米，为郎溪现存最完整、建筑面积最大清代古建筑，一九九八年列省保。；青碧桥（省保）：清代石梁桥，横跨郎川河支流。；徽杭古道郎溪段：与浙江交界段青石板道沿山梁起伏。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明城墙遗存：明嘉靖四十三年始筑、四十五年成，三面环水，设朝阳、清徽、甘露、瞻天四门，南门正对孔庙不建城楼，说怕挡文气。1950年代后逐年拆除，唯临郎川河一段因防水而存约六十多米，青砖包砌、墙身高耸，省重点文保。站在河沿看这截老墙，青砖缝里长草，墙下水声拍墙根。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郎川河畔城堡观景老者 何大爷（74岁）：&quot;郎溪老城叫建平，城墙明朝嘉靖年修的，三面环水，南门正对孔庙，连城楼都不建，说是怕挡了文气。如今剩郎川河边60多米，青砖还在，是省里的宝贝。北大街当年从四牌楼到北门，毁于乱世之中。&quot;\u003cbr\u003e▌胥河边摆渡人 陈师傅（60岁）：&quot;胥河是伍子胥开的，世界最古老的人工运河，比京杭大运河早近千年，现在还通水。郎溪是吴楚交界的码头，姚村的宣州石砚李白都夸过，&#x27;宣州石砚墨色光&#x27;。老城虽小，水韵悠长。&quot;\u003c/p\u003e"}, {"n": "石台老城", "s": "石台", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e汉武帝元封二年（前109）设陵阳县，东晋咸康四年（338）避杜皇后讳改广阳。南朝梁设石埭县，县长治广阳，李白曾游陵阳。明嘉靖四十四年（1565）诏建石城，广阳成大山深处的石头城。城内商号百三十余家、明清古建筑三百余处，为连接池州与徽州的古驿道要冲。1970年7月29日陈村水库（太平湖）蓄水，广阳古城沉入湖底。2015年水下考古探明城墙轮廓与纪年砖。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e石台的老县城不在陆上，在太平湖底——1970年蓄水，整座广阳城沉了下去。秋天水落，船开到湖面上方，水下青石板街和明清房舍的影子还能隐约看见，是最神秘的一座水下徽州。\u003c/p\u003e\u003cp class=\"main-text\"\u003e广阳古城遗址（水下）：太平湖明镜段水下十五至二十八米深处，1970年7月29日陈村水库蓄水时整座沉入湖底。2015年水下考古用声呐与潜水器探摸，确认东门、西门、西南门三处缺口，城墙基本轮廓尚存、残高约一点五米，部分城砖带纪年文字；城外东南有残断桥梁，疑似广阳大桥。城西大型建筑遗存应为当年文庙与学舍，街道、道路清晰可辨。秋天水落时船开到湖面上方，水下房舍影子还能隐约看见。；秧溪街：古城东西主街，长近一公里、宽约四米，青石板铺砌，中铺宽大石作中轴，两侧独轮车碾出石槽，前店后坊两层徽派楼。；龙门古街：回字形石板街，唐代起为青弋江上游主码头，民谚进龙门喜洋洋、出龙门泪汪汪。；西门大街：文庙、县衙、文昌庙皆在街旁，分中街、西门、东门三段，石板铺地。；广阳城墙：明嘉靖四十四年（1565）始砌石墙，五门各设城楼，东西各一水关。；广阳桥：老城跨舒溪河古桥，同沉湖底。；榉根关古徽道（国保）：仙寓山榉根岭，石台、祁门、东至三县交界，古称徽饶通衢，唐以来省际大道。现存青石板铺就约三公里，沿山脊起伏，沿途启源亭、玉泉亭、古稀亭、继保亭古亭基址散落，输山碑、九郎神碑、普祭孤魂之碑刻石尚存。石板被行脚人鞋底磨出凹面，石缝里长着青苔。；仁里镇（今县城）：老城中心，慈云禅寺、饶益寺、西园寺、普林寺旧迹，金钗井、节孝坊、西峰堂、沈家祠堂散落巷陌。；承德桥（县保，七都镇七都村三元组）：明代石拱桥，条石拱券。；虹饮桥（县保，七都镇黄河村小溪组）：清代石梁桥。；徽池古道（七都镇七井村）：石台至徽州山间石板道。；陵阳文昌阁（省保）：石台阁式建筑，木构回廊。；西峰堂、沈氏宗祠、星火吴氏宗祠、陈氏宗祠、严氏宗祠：仁里七都一带祠堂群，池州市保护性建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌太平湖广阳移民后人 汪先生（58岁）：&quot;老城在湖底，我爷爷那辈从广阳搬出来。原来城里西门大街310块青石板，文庙、县衙都在这条街上，商号130多家，&#x27;小秦淮&#x27;的名字不是白叫的。现在船开到那上方，秋天水落，还能隐约看见房舍的影子。&quot;\u003cbr\u003e▌秧溪街旧住户 凌婆婆（78岁）：&quot;秧溪街不到一公里长，四米宽，青石板铺得整齐，中间那块大石板是街的中轴，独轮车的车辙都碾出槽。街对面是龙门街，回字形的。谁能想到，这么一座热闹了千年的城，一下就沉到水底去了。&quot;\u003c/p\u003e"}, {"n": "太平仙源老城", "s": "太平仙源", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐天宝四年（745）割泾县西南十四乡置太平县，名出《庄子》治之至也。首任县令李偁选址麻川河畔三门山前，因仙源水名城，历唐宋元明清民国至1963年为县治。宋绍定间始筑城，明弘治、正德间重建五门。嘉靖四十二年（1563）再筑，万历四年（1576）加固加筑砖环。城内孔庙、县署建筑誉冠宁属六邑。1958年古城墙拆除改建简易公路，仅城北留一小段。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e麻川河从黄山脚下淌下来，绕着仙源镇走。这镇从唐天宝四年做太平县治，一干就是一千二百多年，直到1963年搬走。如今直街横街、两座老石桥还在，城北只剩一小段颓墙认得旧县城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南门桥：明代古桥，与古街古巷古井相连。；仙源古街：直街、横街、后街及城湾巷、天官巷、黄家巷、陈家巷等二十多条街巷，石板卵石铺面。；树德堂、方家大屋、周家大屋：清代古民居。；轩辕车会：纪念轩辕黄帝流传千年的民俗，2006年入选安徽省非遗。；板石石刻：麻川河畔板石潭，河旁一块约二百平方米平卧花岗岩，石旁深潭可供垂钓。明嘉靖知县刘元凯及历代文人题诗刻于石上，今字迹清晰者尚有五首，其移怀就溪山、鱼鸟来争鸣一首可读。水涨时半石没入水中，水落时整面石刻露在阳光下。；麟凤桥 detail：清乾隆二十七至三十三年（一七六二至一七六八）僧人玉成募建，五孔石拱，长约九十二米、宽约七点七米、高约十二米，青麻石垒砌，六墩五孔单曲拱。两侧栏杆石柱六十八根，两端抱鼓石各一对，桥东西侧壁间嵌麟凤桥青石碑，桥南端立石经幢一根，旁地青石刻钱纹一枚，为皖南最宽石板古桥。；永济桥（南门桥）：明代石拱桥，跨麻川河，条石拱券尚整。；老文庙（孔庙）：宋嘉祐县令孙觉徒建，明正统县令张珪增建学制始备，占地二十五亩，建筑十六幢，曾称誉冠宁属六邑，今老卫生院旧址上基址可寻。；重兴寺、察院、城隍庙、周公祠：宋元明旧迹，墙基与石础散在巷间。；七音石：桥北卧石，敲击可出七音。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e麟凤桥：清乾隆二十七年僧人玉成募建、三十三年成，光绪五年维修，跨麻川河，六墩五孔单曲拱，全青麻石垒砌，长约九十二米、宽约七点七米、高约十二米，单孔跨径约十三米。两侧石栏杆石柱六十八根，两端抱鼓石各一对，桥东西侧壁嵌麟凤桥青石碑，桥南端立石经幢一根，旁地青石刻钱纹一枚。桥北众乐亭、桥南迎春亭早已毁于战火，桥身仍横跨河面，是皖南最宽石板古桥。；古城墙遗址：宋绍定间始筑，明嘉靖四十二年重筑，万历四年加筑砖环。1958年拆墙改建简易公路，仅城北留一小段颓墙，夯土断面夹着明代砖环的残痕。直街横街后街及城湾巷、天官巷、黄家巷、陈家巷等二十多条街巷仍在，石板卵石铺面。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌仙源横街老人 邵爷爷（75岁）：&quot;仙源做了1200多年县治，从唐天宝到1963年。老城墙宋朝就有，明朝嘉靖又重新修了一道，如今只剩城北一小段。直街横街后街，城湾巷天官巷，20多条巷子都还认得。孔庙县署当年&#x27;誉冠宁属六邑&#x27;，如今只剩几张老照片。&quot;\u003cbr\u003e▌轩辕车会传承人 何师傅（63岁）：&quot;轩辕车会是为轩辕黄帝传下来的，一千多年了，2006年进了省非遗。麻川河从黄山流下来，仙源水绕城而过，麟凤桥、南门桥都是老桥。聪明的知县把城设在&#x27;面揖黄山、足潆碧水&#x27;的宝地，可惜县城1963年搬走了。&quot;\u003c/p\u003e"}, {"n": "婺源老城", "s": "婺源", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐开元二十八年（740）建县，县治先设清华。天复元年（901）迁紫阳（弦高、蚺城），此后千年为治所。古城东南北三面星江环绕、西面临山，星江绕城半圈西去，即天然护城河。明嘉靖四十五年（1566）大修，改夯土为石墙，向西扩展。万历十三年（1585）知县万国钦铺砌全城石板。咸丰十一年（1861）加高女儿墙。文风鼎盛，从唐至清进士百四十余人，朱弁、董邦达皆出其邑。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e紫阳镇三面被星江抱着，城像一只靴子伸进水里，老辈叫蚺城。北门那两座青石圆拱城门洞还是明代的，老墙根下的廉泉和虹井传了朱熹八百多年，朱子步行街的青石板一直铺到文公阙里坊下。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古城墙与城门洞：明嘉靖四十五年改夯土为石城墙，向西扩展，万历十三年知县万国钦铺全城青石板。今北门旧城墙与两处青石圆拱旧城门洞仍保存，拱券椭圆形、青石垒砌，壁面风化但券脸完整。近年复原璧月门并开放，老墙根下廉泉从石缝涌出常年不涸。；虹井：南门街朱熹故居遗址旁，唐代开凿，井圈呈六边形，内径约一米、深约五米。相传朱松出生时井中气吐如虹，朱熹出生时紫气如云，故立虹井碑。今井圈仍在原位，井水常溢，旁立巨碑铭文，是文公阙里旁最老的活物。；廉泉：古城东门老城墙下，朱熹亲题廉泉，泉水自石缝涌出常年不涸。；文公阙里坊：朱子步行街东端，南宋咸淳五年御赐，与孔子阙里并列。坊呈一字形，四柱通天，高十一米、宽九米，全青石构筑，保持六百余年原貌。坊对面原立文武官员至此下马巨碑，今坊下青石板从街面一直铺到星江边。；弦高古街：老城核心，呈三水七巷格局，白墙黛瓦马头墙，璧月门、程家大院、节孝牌坊、五福居散落其中。；当店巷、石牛巷、朱家巷、东门街、十字街、先儒街、程家街、北门街：青石板街巷纵横。；朱绯塘（文公北路三都村，今入熹园）：半亩方塘静卧徽派建筑群环抱，朱熹与门人滕璘闲游至此吟《观书有感》，塘水如镜照白墙黛瓦。；文公阙里坊 detail：朱子步行街东端，南宋咸淳五年（一二六九）御赐，与孔子阙里并列，四柱通天坊高十一米宽九米，保持六百余年原貌。；太子太保牌坊（朱子步行街）：纪念明代爱国将领汪宏，四柱三间石坊。；钟鼓楼（朱子步行街北）：老街改造时添置的文化景观楼，砖木重檐。；文公庙（城东，元始建二〇一八年重建）：专祀朱熹，院落三进。；智慧井（龙井晓云）：旧灵顺祖殿旁古井，婺城八景之一，井水常溢。；智林禅院、孔庙、婺女庙：弦高古城内旧寺观，基址可寻。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e灵顺庙（五显神祠）：婺源为五显信仰发源地，原址清末毁，老城重建中，旁长径为五显大帝香火地。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌弦高古街老住户 戴婶（61岁）：&quot;古城三面环水，像只靴子伸在星江里，老话叫蚺城。北门的城门洞还是青石砌的，椭圆拱，几百年了很结实。虹井是朱熹家的井，井水不涸，朱松出生那会儿井里冒虹光，传说讲了几百年。&quot;\u003cbr\u003e▌朱子步行街茶馆主 程老板（57岁）：&quot;朱熹是婺源人，&#x27;半亩方塘一鉴开&#x27;就在附近写的。城东老墙下还有他亲题的&#x27;廉泉&#x27;两个字，泉水常年不断。弦高古街修好了，2025年重新开街，渔灯照亮青石板，&#x27;十里徽风半城水&#x27;，一下子又有了当年的气派。&quot;\u003c/p\u003e"}, {"n": "合肥老城·庐州府城·教弩台·包公祠·李鸿章故居", "s": "合肥", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦置合肥县属九江郡，至今两千二百多年。东汉末曹操在此练兵，教弩台为其时遗物。三国魏吴交界，满宠筑曹魏新城于今三十岗乡。南朝梁天监年间于台上建铁佛寺，唐大历年间挖出铁佛改名明教院，清光绪间重修。北宋治平三年（1066）始建包公祠，明弘治元年（1488）迁建香花墩，清光绪八年（1882）李鸿章捐银重建。清代李鸿章、李鹤章兄弟在淮河路建私宅，人称李府半条街。宋代熙宁年间始建庐州府城，历元明清屡修，1938年战乱部分损毁，建国后拆去大半。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e一条淮河路穿起庐州老城——路北边教弩台垒着五米来高的条石台基，台壁陡得像座小城堡，台上明教寺的屋上井井沿还留着晋代一道道绳沟；路南边包公园坐在香花墩上水围四面，再往过去是李府半条街的李鸿章故居。\u003c/p\u003e\u003cp class=\"main-text\"\u003e教弩台：淮河路边高约五米、占地四千余平方米的条石台基，台壁陡立如小城堡，三国时曹操在此教强弩手，原在老城外、宋城扩建圈入。台上听松阁旧为教弩松阴，是庐阳八景之一；台下民房屋脊与台上井口齐平，故井水名屋上井。；明教寺与屋上井：寺南朝梁天监间始建，原名铁佛寺，唐大历间挖出丈八铁佛改名明教院，清光绪间募化重建。屋上井在大殿左侧，因井口高出台下民房屋脊得名，井栏刻泰始四年殿中司马夏侯胜造隶书十二字，为西晋公元268年原物。石栏沿口被汲水绳磨出二十三条深沟，沟面光亮如玉，今井口覆玻璃罩保护。；庐州府城隍庙：北宋皇祐三年（1051）始建，江淮最大城隍庙，清光绪五年李鹤章重修，三进院落。；李鸿章故居：淮河路二百零八号，江淮间最大清代私宅，李府半条街，现存仅为当年李氏宅的十二分之一，前后五进。福寿堂、福寿墙保存完整，走马楼木雕花罩仍在，门罩砖雕依稀可见。；李鸿章故居：淮河路208号，江淮间最大清代私宅，前后五进，李府半条街，现存仅为当年李氏宅的十二分之一，福寿堂、福寿墙保存完整。；曹魏新城遗址：庐阳区三十岗乡，三国魏将满宠所筑城防，土夯城墙残段可蹲身摸到。；大蜀山：合肥近郊死火山，海拔二百八十四米，山顶有电视塔，为淝水之战地理标识之一。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明教寺方丈 觉空法师（72岁）：&quot;明教寺的&#x27;铁佛寺&#x27;名字早了，梁代就有。唐代挖出个丈八铁佛，皇帝赐名明教院。&#x27;屋上井&#x27;的井栏还是晋代刻的字——&#x27;泰始四年殿中司马夏侯胜造&#x27;，公元268年了，井沿上那23条绳痕，每一条都是老合肥人一代代打水井磨出来的。&quot;\u003cbr\u003e▌包公园保洁员 王阿姨（58岁）：&quot;廉泉那口井，老辈说贪官能看见水里有影子还头疼，清官喝了没事，传了上千年了。李鸿章捐了2800两银子重建包公祠，所以有&#x27;包家祠堂李家修&#x27;的说法，两家就在这河两岸，一个祠堂一个宅子。&quot;\u003c/p\u003e"}, {"n": "霍山老城·衡山镇·古南岳·文庙·文峰塔", "s": "霍山", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e隋文帝改封湖南衡山后，这里称古南岳、小南岳。汉高祖五年（前202）置灊县，隋开皇三年（583）改岳安县为霍山县，县名始此。北宋开宝元年（968）降为故埠镇，明弘治七年（1494）复设霍山县。文庙即复县之年动工，历经明万历两次迁址，崇祯八年（1635）兵乱受损，清顺治十年（1653）恢复、乾隆十八年（1753）扩大大修。清道光年间知县朱士达、许道藩先后集资在县城南北建两座风水塔，南塔七级六棱建成，北塔建到第三级而止。历代舜、秦始皇、汉武帝皆曾登山祭南岳。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e衡山镇趴在淠河边，城中心文庙从明弘治七年立到现在，四十五间明清殿宇一片没散；城南文峰塔七层六棱顶着天，对岸淠河边的北塔却只砌了三级就停了，半截锥子戳在那，一完一残隔着城对望。\u003c/p\u003e\u003cp class=\"main-text\"\u003e霍山文庙：文盛街十六号，明弘治七年复设县那年动工，占地约四千平方米，十一座单体建筑、四十五间，红墙黑瓦、青石台基，为安徽保存最完整文庙建筑群之一。大成殿面阔五间进深三间，重檐歇山顶，无斗拱，翼角翘起有饰件，保留明代原构，是省内有明确纪年的明代木构之一。殿前东西两厢、崇圣祠、明伦堂、藏经阁、戟门、名宦祠、乡贤祠沿中轴线排开。；文峰塔（南塔）：清道光二年知县朱士达建，砖石实心密檐，六棱七级，高约二十一米，塔底层围长二十二米、占地十六平方米，塔顶葫芦形镇脊直指云天。塔基层篆书文峰塔三字，塔身逐层嵌当时名人诗咏题词，边缘镶镂人物异兽纹饰。对岸北塔建到第三级因工程受阻而止，一完一残隔着城对望。；北塔：龙头石淠河边，与南塔先后动工，建到第三级因工程受阻中止，至今是半截锥子。；南岳山（小南岳）：山顶南岳庙祀祝融，东门楼明建小南岳为于右任手迹，西门楼汉帝敕封石刻，百步阶明代石阶百二十级，山有天池、试心崖。；衡山古镇（迎驾厂社区）：蚩尤起兵传说地，战神庙遗址出土石斧、石钺、石箭簇。；霍山文庙 detail：文盛街十六号，占地三千八百余平方米，十一座单体建筑。大成殿面阔五间进深三间重檐歇山顶，另有崇圣祠、明伦堂、东庑西庑、藏经阁、戟门、名宦祠、乡贤祠，小瓦砖木石结构，为安徽保存最完整文庙建筑群之一。；文峰塔（南塔）detail：清道光二年（一八二二）知县朱士达建，砖石实心，六棱角七层，高约二十一米，塔底层围长二十二米，占地十六平方米，塔顶葫芦镇脊，塔基层篆书文峰塔三字。；决兴庵（省保，清代）：深山尼庵，木构架尚整，三进院落。；文峰广场：塔前广场，二〇〇〇年后围绕古塔开辟。；衡山镇古城墙基：淠河北岸旧城墙夯土埂，高出平地数米。；六万寨（古寨）：县东六万冲，古城墙沿山脊而筑，石砌寨门尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文庙看门人 陈先生（68岁）：&quot;文庙是明弘治七年复设霍山县那年建的，4027平方米，45间房子。大成殿里的孔子像还在，民国时候差点被拆，老知县保住了。明万历年间搬过一次家，从城中心搬到淠河北、又搬回来，折腾了三次。&quot;\u003cbr\u003e▌文峰塔下卖茶叶的老周（55岁）：&quot;南塔是道光年间建的，高21米，七级六棱，风水塔，知县朱士达建的，说&#x27;人杰原于地灵&#x27;。对面还有个北塔，建到第三级就停了，半截塔，老辈说钱不够了。南岳山顶的庙供的是祝融，老皇帝来祭南岳的地方。&quot;\u003c/p\u003e"}, {"n": "巢湖老城·巢县·居巢·卧牛山·陷巢州传说", "s": "巢湖", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e巢湖周边流传陷巢州、长庐州传说，《永乐大典》引南宋《合肥志》载焦姥化身姥山、女化身姑山、遗鞋化鞋山。2001年巢湖北岸唐咀水下发现秦汉陶片。巢县城始建于元末土城，明嘉靖三十六年（1557）改砖城，设东朝阳、南迎薰、西滨湖、北拱极四门。中庙始建于东吴赤乌二年（239），晋时敕封焦姥为圣妃、建圣妃庙。姥山岛文峰塔明崇祯四年（1631）由严尔圭主持修建；龟山塔明初始建，崇祯雷击倒两层，清道光重修。昭忠祠清光绪十八年（1892）动工、二十年（1894）竣工，为淮军纪念祠堂。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e卧牛山蹲在巢县老城正中心，山顶北侧一截唐宋青砖城墙残段顺着山势还在；湖对岸中庙建在突入湖里的石矶上，像只凤凰落在水面，姥山岛七层文峰塔隔湖望着这座城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卧牛山古城墙：卧牛山顶北侧，唐宋筑城残段，青砖砌筑沿山势蜿蜒，山顶北侧最清晰可辨。城元末始土筑、明嘉靖三十六年改砖城，设朝阳、迎薰、滨湖、拱极四门。残段青砖缝里长草，墙基顺着山脊走，晨练老人从残段旁经过。；中庙：东吴赤乌二年始建，建在突入巢湖百米的朱砂色石矶凤凰台上，因处巢州、庐州中间得名，又称圣姥庙。现有殿阁为清末所建，三进四合院，房屋七十余间，木质结构，红墙黛瓦重檐翘角，坐北朝南横峙湖岸。庙门匾题巢湖中庙，殿高压云，三面临水，与湖心姥山岛隔水相望。；姥山岛文峰塔：明崇祯四年（1631）邑人严尔圭建，七层砖塔，民谚姥山尖一尖、庐州出状元因塔而起。；龟山塔：明初建，崇祯年间雷击倒两层，清道光重修，今七层。；昭忠祠：清光绪十八年动工、二十年成，李鸿章为淮军创建三十年而建，又称淮军总祠堂。由门厅、正殿、两厢组成共三十间，全部占地一千八百平方米；正殿七开间宫殿式，梁柱粗大、雕梁画栋，供奉淮军阵亡将士神位一百九十余尊，含刘铭传、李瀚章。曾被中庙公社作办公地、农机厂作车间，今按修旧如旧恢复，是巢湖现存最大古建筑。；巢湖水下古城遗址：北岸唐咀，2001年考古发现秦汉陶片，为陷巢州长庐州传说实物佐证。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文昌阁：初建卧牛山顶，清末迁天河边，原阁1957年前后拆除，今原址重建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌卧牛山晨练的老巢（72岁）：&quot;卧牛山是老城中心，唐宋年间这里有城墙，残段还在山顶北边，青砖垒的。&#x27;陷巢州长庐州&#x27;的传说，老辈都讲——小白龙降雨被玉帝惩罚，巢湖就陷下来把巢州淹了，焦姥变姥山，她女儿变姑山。&quot;\u003cbr\u003e▌中庙看庙人 吴师傅（66岁）：&quot;中庙是东吴赤乌二年建的，快一千八百年了，叫&#x27;忠庙&#x27;又叫&#x27;圣姥庙&#x27;，晋时皇帝敕封焦姥为圣妃。庙建在湖边石矶上，像凤凰落在湖面上，所以叫凤凰台。老辈说九华山是九华，中庙是九华的&#x27;中&#x27;，南九华中庙。&quot;\u003c/p\u003e"}, {"n": "滁州老城·琅琊山·醉翁亭·欧阳修知滁", "s": "滁州", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e滁州得名于滁河，古称涂中、清流。西晋琅琊王司马睿避乱南下途经西南山，琅琊山因此得名。唐大历六年（771）李幼卿与法琛禅师建宝应寺（琅琊寺）。建中二年（782）韦应物任滁州刺史，写《滁州西涧》。至道元年（995）王禹偁贬守滁州，宽政爱民。北宋庆历五年（1045）欧阳修贬知滁州，僧智仙建醉翁亭，欧阳修为记；庆历六年（1046）于丰山甘泉筑丰乐亭并为记。苏轼为两记书碑，欧文苏字成瑰宝。清光绪七年（1881）薛时雨重修醉翁亭。吴敬梓为滁州全椒人，《儒林外史》作者。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e从滁州城西南行六七里山路，琅琊山深里先望见醉翁亭翘角飞檐，亭前让泉潺潺；宝宋斋墙上嵌着两块四面的苏轼手书碑，欧文苏字，近千年前的一笔一划还看得清。丰乐亭在丰山之侧，守着一口甘泉。\u003c/p\u003e\u003cp class=\"main-text\"\u003e琅琊寺：唐大历六年刺史李幼卿与法琛禅师建，代宗赐名宝应寺。寺门、院墙用红墙拱门，带北方皇家陵园风格；寺内明月观、山门、藏经楼又用粉墙、细木柱、鹅颈椅、漏窗、小青瓦，是江南园林手法。无梁殿、大雄宝殿、摩崖石刻尚存。；醉翁亭：北宋庆历五年琅琊寺僧智仙为欧阳修建，清光绪七年全椒人薛时雨重修。现亭为苏式飞檐亭阁，全木卯榫结构，十六根立柱支撑歇山式亭顶，青瓦亭面、吻兽伏脊，南北框门设格花与浮雕花卉，青砖铺地，四周绕木栏。中间四柱悬饮既不多缘何能醉、年犹未迈奚自称翁一联。亭西宝宋斋嵌苏轼手书《醉翁亭记》两块四面碑，欧文苏字，近千年前的一笔一划还看得清。；丰乐亭与让泉：丰乐亭在丰山南麓，北宋庆历六年欧阳修建于甘泉之上，面阔进深均约六点五米正方形，十六立柱挑檐翘角，梁枋雀替饰浮雕花纹。亭前让泉，泉眼旁石块砌成方池，约三尺见方、池深二尺，清康熙四十年知州王赐魁立让泉二字碑。泉水终年温度变化不大，从石缝里渗出来，汇入山溪。；琅琊寺：唐大历六年（771）刺史李幼卿与法琛禅师建，代宗赐名宝应寺，寺内摩崖石刻、无梁殿、大雄宝殿尚存。；二贤堂：醉翁亭北，纪念王禹偁、欧阳修，堂内欧阳修持书卷像、王禹偁捻须像。；南岳庙、百步阶、洗心亭、影香亭、古梅亭：醉翁亭九景，古梅亭前欧梅传欧阳修手栽，洗心亭始建于清康熙间。；滁河（古涂水）：滁州因水而名，韦应物建中三年（782）任滁州刺史写《滁州西涧》。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌醉翁亭景区老导游 老刘（59岁）：&quot;醉翁亭是北宋庆历五年建的，僧智仙为欧阳修建的，天下第一亭。里面有苏轼写的《醉翁亭记》碑——&#x27;欧文苏字&#x27;，一文一字都是大家。清代薛时雨重修的时候，写了对联&#x27;翁去八百载，醉乡犹在；山行六七里，亭影不孤&#x27;，现在还挂在亭子里。&quot;\u003cbr\u003e▌琅琊寺老僧人 释智远（71岁）：&quot;琅琊寺是唐代大历六年建的，代宗皇帝赐名&#x27;宝应寺&#x27;。韦应物写过《滁州西涧》，就是城南那条小涧。王禹偁、欧阳修、宋濂、文征明这些名人都来过。欧阳修在滁州三年，把他最好的散文写在这里了——一篇《醉翁亭记》，天下都知道滁州。&quot;\u003c/p\u003e"}, {"n": "金寨老城·金家寨·史河古埠", "s": "金寨", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e金家寨地处大别山北麓史河西岸，三面环山，为皖西通鄂豫门户，古称三省通衢。约建于唐末，古名金钗镇，后因金氏立寨聚居称金家寨。船舶可直放三河尖入淮，后河道淤塞仅通排筏。民国年间商旅云集，建中山路、民权路等新街。1950年代修梅山水库，居民分批外迁，千年古镇沉入水下。今库区水位低时可见残存墙基梯田。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e金家寨不在陆上了——1956年修梅山水库，整座千年古镇沉进水底。只有库区水位低的时候，残存的墙基梯田才从水面露出来。原来的胜利街沿史河排开，上码头下码头的石台阶，如今都压在几十米水下。\u003c/p\u003e\u003cp class=\"main-text\"\u003e观音洞：史河北岸天然石洞，民国二十六年（1937）人工开凿可容五十余人，人称小南海；洞边拾级而上观音阁，联曲径通幽处、洞开别有天，额南海春深。；上码头、下码头：老街沿史河傍山而建，主街胜利街宽约三米、长约一公里，卵石铺街，九条小巷宽一米余；毛排多泊上码头。；梅山水库淹没区：1954年秋开始移民，1955年6月县城迁梅山镇，1956年4月金家寨镇没入水库。原胜利街沿史河排开，主街宽约三米、长约一公里，卵石铺街，九条小巷宽一米余；上码头下码头石台阶如今压在几十米水下。只有库区水位低时，残存的墙基梯田才从水面露出来。；梅山水库连拱坝：一九五六年随县城迁梅山而建，坝高八十八点二四米，全长四百四十三点五米，十六个垛、十五个拱，横在史河上，为当时世界最高连拱坝。坝体混凝土墙面被几十年库水浸成青灰色，坝顶公路仍通车，俯瞰高峡平湖。；立夏节起义策源地旧址（国保二〇〇六年第六批，南溪镇丁埠村大王庙）：清末庙宇，一九二九年立夏节起义首发地，梁柱尚整。；赤城县邮政局旧址（国保，汤家汇镇街道徐氏祠）：清代祠堂改作苏区邮政局，祠内隔房仍在。；中共鄂豫皖省委会议旧址（国保）、列宁小学旧址（国保）：汤家汇、斑竹园一带苏区旧屋。；红二十八军重建旧址胡氏祠：汤家汇，祠堂三进院落。；金寨县革命烈士纪念塔（一九六五年建，梅山镇）：塔高二十四米，正面刘伯承题燎原星火镀金大字。；金寨县革命博物馆（一九八三年建，梅山镇红军村）：邓小平题馆名，江泽民题全国爱国主义教育基地匾。；将军寨（古碑镇）：农民起义军山寨遗址，乌鸡石、关门石、红岩罐自然石刻尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e锥子阁：东大街后山砖石宝塔，南宋咸淳年间建，共十一层，是金家寨最醒目的老地标，1939年为防轰炸拆除。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌史河船工后代 阮大爷（78岁）：&quot;我小时候就住在金家寨的老街，胜利街的青石头路，走到下码头竹排蹚蹚地响。老辈讲金家寨唐朝就有，古名金钗镇，錐子阁那座宝塔十ー层，是镇上的&#x27;龟&#x27;。六十年代修梅山水库，全村迁到梅山，老家就沉到水下喽，逢年过节还有人开船去看水面下的老屋顶。&quot;\u003cbr\u003e▌老城文史爱好者 陈叔（63岁）：&quot;金家寨最老的货是观音洞，史河边那个天然石洞，民国时凿大了，能坐五十来人，边上观音阁挂着&#x27;南海春深&#x27;的匾。我太爷在世时常讲，金家寨的码头热闹，毛排从三河尖一直放到史河，山里的茶叶、板栗都是打这走的。如今城在水下，地名还在。&quot;\u003c/p\u003e"}, {"n": "屯溪老街·黄山·活动着的清明上河图", "s": "屯溪老街", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e屯溪得名，一说孙权遣贺齐在此水上屯兵，一说诸溪聚会谓之屯溪。老街始建于南宋，返乡工匠仿宋城风格兴建，又称宋城。元末明初程维宗在华山脚下建店房四所共四十七间，为老街最早文字记载。明万历年间屯溪已是镇长四里的物资集散中心。清代绿毛茶多在屯溪精制外销，统称屯绿，清末民国为皖南最大茶叶集散埠。老街前店后坊、前店后住，麻石条路数百年骨架未散。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新安江、率水、横江三江汇在老街口，一条麻石主街从镇海桥头一直拖到华山脚下，鱼骨似的三条横街、十几条小巷向两边散开。街上三百来幢徽派砖木楼房前店后坊，天井盖瓦，被人叫活动着的清明上河图。\u003c/p\u003e\u003cp class=\"main-text\"\u003e屯溪老街：南宋始兴的商业街，一条麻石主街自镇海桥头拖至华山脚下，三条横街、十八条小巷鱼骨架状散开，三百余幢徽派砖木建筑夹道，宽五六米至七八米。店面前店后坊、前店后住，天井盖瓦、水沟通新安江；胡开文墨庄老师傅仍在天井里点烟做墨，清早七点街上还没游客时才是老街自己的时辰。；八家栈：老街发源地，元末明初徽商程维宗在华山脚下新安江畔建商栈货栈，最早八家经商，得名八家栈。；程氏三宅：柏树街东里巷六、七、二十八号三座明代民居，明成化间程敏政建，国保。均为封闭式砖木二层楼房，一脊两堂，五开间穿斗式，蝴蝶瓦屋面，东西马头山墙三级封护至屋脊，前后檐墙凹进、高低落差约一米。六号宅占地六百七十七平方米，以砖雕著称；七号一百五十四平方米以木雕著称；二十八号一百八十七平方米以前厅明式、后厅清式结合著称。；程大位故居：珠算宗师程大位故居，今设珠算博物馆，国保。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e镇海桥：明嘉靖十五年始建，跨横江，东西贯通老街与黎阳，六墩七孔石拱桥，长约一百三十三米、宽约六米、高约十米。墩砌等腰三角形，墩顶分水石尖翘起；拱脚拱圈用褐红麻条石交错砌筑，以糯米稀、猕猴桃藤汁加灰浆胶结；中洞嵌禁止取鱼四楷书。2020年被洪水冲毁后按清康熙之制重修，铁锭锔石，桥表一寸三錾。；万粹楼：私人博物馆，用老宅拆下的老梁老柱老砖瓦按样复建，集文房古玩于一楼。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡开文墨庄老师傅 汪伯（67岁）：&quot;我在屯溪老街做墨做了四十多年，胡开文的招牌是老字号，徽墨的老法子不敢丢。老街这些店面，前头卖货后头做坊，天井里透光，下雨不积水，底下水沟通着新安江，老辈人修的最牢。每天清早七点光景，街上还没有游客，才是老街自己的时辰。&quot;\u003cbr\u003e▌老街老住户 程奶奶（72岁）：&quot;我年轻时老街就这条麻石路，一下雨干干净净的不打滑。程氏三宅那边我外公住过，明朝的房子，梁上雕花漆都褪了还能看。八家栈是老街的根，镇海桥民国时烧过又重修，现在桥下还是抽水的老码头。你们年轻人逛热闹，我们看的是命根子。&quot;\u003c/p\u003e"}, {"n": "马鞍山采石矶·长江三矶之首·采石古镇", "s": "马鞍山采石矶", "p": "安徽", "w": "", "h": "\u003cp class=\"main-text\"\u003e采石矶古称牛渚矶，在当涂西北、今马鞍山西南翠螺山南麓，绝壁临江。相传三国赤乌年间矶上建寺掘井得五彩石，凿成香炉供寺，故称彩石矶。李白多次登临，写《夜泊牛渚怀古》《横江词》《望天门山》，晚年留醉酒捉月传说。唐元和年间建太白楼，白居易、刘禹锡、陆游、文天祥等慕名来游题咏。采石古镇北宋元丰年间形成，扼长江天险，素有金陵屏障之称。1983年采石矶由当涂县划归马鞍山市。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e翠螺山伸到长江边，牛渚矶绝壁一下子扎进水里。矶头一块临江巨石翘在江面上，刻着联璧台，传说李白酒醉从这跳江捉月；山上太白楼三重飞檐俯瞰大江，与岳阳楼黄鹤楼滕王阁并称长江三楼一阁。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太白楼：国保，始建唐元和年间，现存清光绪三年彭玉麟捐资重建，三重飞檐歇山顶，前楼后祠，与岳阳楼、黄鹤楼、滕王阁并称长江三楼一阁。楼高约十八米，三层两进，左右回廊曲折，筒瓦滴水、鳌鱼走兽；祠堂正厅供楠木雕李白站像，背负双手、昂首挺胸。郭沫若题太白楼匾仍悬。；捉月台（联璧台）：采石矶头临江峭壁上两块嵌崖巨石，中分一线，翘首凌空伸向江面，险峻异常。台上刻联璧台三字，字径一尺二寸，题字下方刻明嘉靖三十一年天台狂客蔡景尧等人诗句。1987年李白祭辰旁塑青铜李白像，大袖当风、仰首望月，崖下乱石嵯峨、浪花撞碎成雪白泡沫。；三元洞：临江绝壁中的天然石洞，采石矶最大一座，上下两层、洞中洞可通大江。洞傍山临江嵌在崖壁间，下落无地如自水出，江水拍击洞边崖壁、浪花飞溅。洞内供天、地、水三元水府神位，依洞建阁、飞檐翘角，下层近江可闻涛声，上层凭栏可望江天一色。；采石古镇：北宋元丰年间形成，长江下游重要津渡与城防要塞，素有金陵屏障之称，镇上老码头、唐贤街、跳和合民俗尚存。；李白衣冠冢：宋嘉泰年间原在采石镇神霄宫，1972年迁翠螺山麓，青石垒砌圆冢，冢前汉白玉碑林散之手书唐诗人李白衣冠冢。；林散之艺术馆：采石矶园内，当代草圣林散之晚年葬此，与李白诗书为邻。；广济寺：采石矶上，传三国赤乌年间建寺掘井得五彩石凿成香炉，彩石矶由此得名。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌采石古镇老船工 张大叔（69岁）：&quot;采石渡口我跑了四十年的木船，江心那几块大石头下头水深得很，老辈子讲李白就从捉月台那跳江捞月。镇上唐贤街的老码头，明清时候芜湖、南京的船都在这泊，跳和合的锣鼓一响，全街都出来看。如今建了风景区，江还是那条江。&quot;\u003cbr\u003e▌园内文保员 老周（61岁）：&quot;太白楼是正儿八经的老楼，唐元和年间就有，民国失火烧过，清光绪三年又修起，1978年大修，郭沫若题的&#x27;太白楼&#x27;匾还挂着。楼下李白祠的香火，千把年没断过。林散之老先生也有意思，字写得好，非要葬在采石，跟诗仙做邻居，自古书画是一家嘛。&quot;\u003c/p\u003e"}, {"n": "东平州城", "s": "东平", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e明代纵横各十八条街，现六十多条。这些街巷名现在还在用：。宋咸平三年（1000）始建土城，形如方胜（两个菱形压角相叠），城门东西各二。清乾隆三十四年（1769）知州沈维基以砖易土，西部城墙内缩，西门减为一，龟城变成向前游动姿态——蜷右前爪、扭尾巴。1982年县城迁往新城，旧县城废弃。现状：城墙残垣还能摸出龟城轮廓。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e州城坐落在东平湖畔平原上，北宋咸平三年因黄河水患从须昌迁此，全城按龟形布局——南门龟头探出、北门龟尾收束、东西四门如龟爪趴伏。今城墙虽已拆尽，街巷格局仍沿宋代旧网，桂井子街心那口青石圆井仍在，井绳磨出的深痕里牵着千年不涸的甘泉。\u003c/p\u003e\u003cp class=\"main-text\"\u003e桂井子（龟肚脐井）：桂井子街中段路西，全城南北中轴线正中，一口青石砌垒的圆井。井口用两尺见方、厚约一尺的整块大青石中凿圆而成，井绳在石沿磨出三十二道深浅不一的竖痕，深可三分，千年汲水磨出来的凹槽至今可手触。州城地下水多苦咸，独此井甘冽，相传宋康王南逃路过曾饮此水。今井栏犹存，井口覆以木盖加不锈钢罩，街旁早点摊仍取此井水熬粥。；东平粥（徐家粥）：桂井子街南首徐氏，自清康熙年间传下来的手艺，大豆小米分别磨浆，取桂井子甜水慢熬，粥浓如酱入口似水，碗底喝得干干净净。早年运河船工纤夫凌晨蹲在井边喝，至今仍是州城早起的头一桩事。；东平故城（宿城）城墙残垣：宿城村西北杂树林中，一段西汉东平国王城的北城墙。黄土夯筑的长方土台横在田边，长约一百八十米、宽十五米、高近三米，夯层与夹棍洞排列整齐，每层约二十公分厚，上面长满酸枣棵与野草。城北就是自东向西流的白吉河，铁网围着土台，村民仍以东门、南门指认方位。；五块城门石匾：当年五座城门各嵌一石匾——大东门龙虎、小东门瞻岱、南门望鲁、西门秩成、北门拱极。望鲁匾上款乾隆戊子巧月、下款知州沈维基书，当年挖塘清淤时从城外池塘里起出，今藏东平县博物馆；其余四块藏于州城石刻博物馆。；永济桥（南大桥）：南关村南跨小清河，明洪武二十八年州人邢整奏请所建，原十八孔，万历四年添砌桥栏，清顺治十五年重修。今存十三孔，跨径约四米、孔径高两米半，石基砖拱，桥长九十八米、宽七米。几十年淤垫下来，大部分桥孔已压进路面之下，只剩靠近河床的一两孔还露着青砖拱券，青石板桥面被车辙磨得发亮，至今仍是东平至靳口公路所经，车马仍从桥上走过。旧时桥下秋水澄澈，城堤秋水为东平古八景之一。；宋槐：永济桥北端东侧一株古槐，传北宋咸平三年筑城时所植，老干中空仍枝繁叶茂，树下是老州城人乘凉的老地方。槐树东三十步另有一井，传为龟城的耳朵眼，井旁石刻龙头保存尚好。；桂井子街：因井得名，原名龟井子，后雅化为桂。南北贯通的老街，桂井子在街心偏西，街南首路东就是万里故居。；署前街：从迎门墙口直对南门的老街，旧时晋商兴成永、协和永票号都开在这条街上，今仍为临街铺面。；署东街、署西街：分列州署旧衙东西的两条窄巷，今仍以旧衙为轴，格局未改。；大隅首顶：全城地势最高处，隆起如龟背，旧时当铺盐店聚此，今为街口小广场。；牌坊街、文庙街、大东门街、小隅首、书院街：清末民初城内五十余条老街中的主街，因牌坊、文庙、书院得名，至今路面仍是旧网。；迎门墙口：旧州衙前照壁留下的地名，当年是衙前小广场，吃食摊昼夜不散，老州城的市井中心。；万里故居：桂井子街南首路东，青瓦白墙的海青屋式民居，坐北朝南分东西两院。1937年10月东平县第一个中共县级组织——县工委在此成立，万里任书记。今辟为纪念馆。；北门玄武老爷青铜法身：原供于北门，1938年日军侵东平被掠走。；城内七十二座牌坊：旧时跨街而立，今已不存。；十里宋街：州城南北主街，北宋筑城以来即为漕运要道。马可·波罗游记称此地万船竞发、舟楫如织。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e五座城门城楼：五门之上原建重檐城楼，红墙碧瓦，四角铁马风铃，城门外沿皆建石闸。今城楼已毁，仅存地名。；铁皮城门：原城门外包铁皮，满布门钉，配大象鼻式铁锁，厚重坚实。已毁。；州署大堂、库房、帑藏：北宋咸平三年筑城时所建州衙主体，后毁于火，今仅存地名。；魁星楼（文昌阁）：原建于大东门正南城墙之上，为州城文脉所系。已毁。；护城河：绕城一周，引汶水入城濠，今已填平为街巷。。\u003c/p\u003e", "c": ""}, {"n": "肥城老城", "s": "肥城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e城内以霸王街（南北大街）为虎脊，关帝庙东墙根一米余赤色菱形石为虎心，城隍庙街中段紫色条石为虎肺。街巷名保留至今。元初始建土城，形如卧虎（南有二隅似虎膝，西北有锯齿缩进似虎腚，北端两侧凹进似虎肷，东北东南两隅凸形似虎爪）。明万历四十六年（1618）改砖城，外砌33层青条石，缝处刀刃不入，号称&quot;玉城&quot;——阳光照耀泛玉石色。清代屡修屡圮，1938年兵燹后城墙残垣仅存东北段。现状：城墙残垣还能摸出卧虎轮廓，元代大成殿完整保存。城墙规格：周长四里三十步，高三丈，厚两丈七尺。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老城北依巧山、南望平原，明万历年间按猛虎卧姿筑石城，东墙弧形如虎头、西北锯齿如虎脊、北门武定门正对虎口。今城墙已拆尽，唯县学里那座元代大成殿还立着，殿内八根两人合抱的明柱，七百年原物至今可上手摸。\u003c/p\u003e\u003cp class=\"main-text\"\u003e元代大成殿（文庙）：老城街道县学旧址内，元至元十二年复设肥城后所建文庙主体。面阔五间通阔二十米、进深三间通深十二点四米、通高十二点二米，歇山式黄琉璃瓦顶，四角单飞檐，重椽斗拱三下昂六铺作。殿内竖明柱八根，每根直径约六十公分，两人合抱，柱身七百年原物至今可上手摸，柱上木纹与包浆历历。后墙外壁正中嵌明代碑刻一通，元代状元张起岩曾亲撰加封大成至圣宣王碑记。为山东境内罕见的元代木构殿堂。；城墙基址线：老居民仍呼城墙根，一圈夯土基址尚可辨认。传说建城所用青石全取自巧山，城成而巧山被挖成平地。；北门迎恩桥：北门外武定门跨护城河之桥，明嘉靖年间重修，邑人李邦珍家族出资、进士尹庭撰文作记。桥体尚存，后经重修。；齐长城遗址（肥城段）：战国齐长城自长清项峪山蜿蜒入境，沿老城、潮泉北部群山之巅东西横亘，至窗户岭出境，绵延近四十公里。就地以片麻石、鱼籽石垒砌，石块大小错杂、干缝相扣，年久风蚀但遗址清晰，部分墙段犹存山脊之上，石缝间生酸枣与野草。；北坦遗址（大汶口文化）：老城街道北坦村周围，为距今约五千年的大汶口文化晚期聚落。1973年起陆续出土磨光石器、陶器、骨器、玉器，文化层堆积深厚，是肥城境内已知最早的人类居址。；护城河：绕城开挖，引康河水注濠，河面宽阔水深可戍。今多平为街巷。；城隍庙：旧时庙内城隍像为活动机关木雕像，按下膝部人偶即可站立，精巧有趣，今已不存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e城墙（玉城）：明万历二十二年知县马经伦改筑石城，城外壁以青条石逐层包砌，砌缝紧密刀刃不入，阳光照射泛玉石光泽，号称玉城。1946年起分段拆除，1958年夷平。；七座石牌坊：旧时跨街而立，有龙章奕世坊、敕赠坊、柱史坊、飞舄乘骢坊、谏议坊等，多为明清旌表仕宦节烈而立，今全毁于兵燹与运动。；衙署：元代始建，毁于元末兵火，后屡毁屡建。1980年县治南迁新城后废圮，今仅存地名。。\u003c/p\u003e", "c": ""}, {"n": "宁阳老城", "s": "宁阳", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e古城四街至今位置走向没变，街名沿袭旧称！东西两街贯通，南北两街错开，北街垂直接在西街上。旧县署建在错开十字的东北位置，与东西两街和北街组成一个&quot;上&quot;字——全城最高点。四条街道由内向外成坡，水从中心流向四门，雨过天晴城区干净清新。北齐天保七年（556），县治从汉宁阳城迁至今址，略呈正方形。北宋始筑土城。明正德六年（1511）被农民义军拆除。明嘉靖九年（1530）外砖内土，周四里五十步，高二丈四尺三寸，顶阔一丈，趾厚二丈。明万历九年（1581）悉易以砖，三十一年改城墙顶水道于内。护城河深八尺阔一丈二尺，蛇眼诸泉四面环绕。1950年代，城墙砖被拆去建学校，护城河填为街道。南城壕        至 人民路北沟（还在！人民广场西至世纪城）。东城壕        至 教师河（还在！）。北城壕        至 欣街（建国初填河建成）。西城壕        至 宁阳河（还在！）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e北齐天保七年迁此，北宋始筑土城，明嘉靖九年改外砖内土。城内以旧县署为中心，东、西、南、北四条大街自明代至今一丝未挪窝；唯独城墙砖全被拆去建了学校，只留下文庙泮池上那七十二块石板铺成的状元桥，还在数着孔子弟子的旧数。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宁阳文庙（省级文保）：县城中心，坐北朝南，为泰安境内现存唯一县学文庙。元大德初年以旧县署改建，历明清屡修，今为宁阳县博物馆驻地。中轴线上棂星门、泮池泮桥、大成门、大成殿、东西两庑及乡贤祠、名宦祠次第展开，棂星门为木结构，一九五四年曾倒塌今修复如初；门外东西各立下马碑，刻文武官员军民人等至此下马十二楷书大字。；泮池泮桥（状元桥）：明嘉靖十九年创建，半月形砖砌泮池上横亘单孔石拱桥。桥面以七十二块大小不一的石板铺成，暗合孔子弟子三千、身通六艺者七十二人之数。桥券作三券三伏，三层立砖与三层平砖交叉发券，按古制本为帝王园林方可用的高规格做法。旧时唯新科状元方可过桥，余者绕池而行，故俗称状元桥，又叫青云桥、盼桥。；天主教堂：东街路南，清光绪二十年德国传教士所建，仿中式宫殿格局。今为宁阳宾馆（县第一招待所）址。；尚书路旧街（一街三教）：按源稿此条原列元代关帝庙、孔子庙与宝相寺一街相望；经核，一街三教实为汶上尚书路景观，宁阳老城并无尚书路，此条系源稿误植，今仅存宁阳旧街格局。；元代关帝庙（源稿误置）：源稿称位于尚书路中段，经核宁阳老城无尚书路，此条系汶上内容误植，今宁阳老城无可对应遗存。；孔子庙（明代，源稿误置）：源稿称位于尚书路东段，经核宁阳老城无尚书路，此条系汶上内容误植，今宁阳老城无可对应遗存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宝相寺遗址（大寺）：东门里路北，宋代所创，宋时乡人王筠曾铸铁塔置寺中。元末毁于兵燹，明初重修，嘉靖间增建禅院，今已不存，其地今为县城东广场。；明代砖城四门：明嘉靖九年改土城为砖筑，辟四门。今城墙城楼全毁，唯东、西、南、北四条大街格局犹存，巷名仍沿旧称。；护城河：嘉靖九年随砖城开凿，引河水绕城，今已填为街道。；县署：元大德元年复置县后始建，位于城中心，至正四年毁于火后重修。今仅存地名。；城隍庙：城东北隅，明洪武初年建，光绪十年重修。大殿、廊房、钟鼓二楼、碑亭俱全，中塑城隍，两廊分列十殿阎君，庙前有广场戏楼。民国十七年冯玉祥拆神像改建小学，今为实验中学一带。；文庙后附属建筑：明伦堂、敬一亭、尊经阁、文昌阁等学署建筑，今全拆不存。。\u003c/p\u003e", "c": ""}, {"n": "兖州老城", "s": "兖州", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e金代始建土城（由瑕丘古城迁建今址）。元沿用土城。明洪武十八年（1385），朱元璋封第十子朱檀为鲁王，派武定侯郭英扩建：。清康熙三十一年至五十九年（1692-1720）重建兴隆塔（郯城大地震震塌上截）。1960年代后，城墙砖全被拆走——明初14里大城荡然无存。现状：西护城河东侧残留6米残墙（长6米宽1米高4米），夹在两座民居间。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古九州之一，明代鲁王城封地，城周十四里余山东数一数二。如今只剩西护城河东侧一段数米残墙夹在两民居之间，被称为国内现存最短的古城墙遗址；而城东泗河上那条以铁扣锁石的金口坝，还横卧在河床上，像一道不沉的长虹。\u003c/p\u003e\u003cp class=\"main-text\"\u003e兴隆塔（全国重点文保）：隋仁寿二年始建，宋太平兴国七年改筑为砖塔，十三层八角楼阁式空芯砖塔，高五十四米。下七层宽大，层间设回廊，挑出约两米宽的环形阳台，台周设石雕栏杆；上六层急剧收分，造型奇异如一塔座塔。清康熙间因郯城大地震震塌上截，后重建；一九三六年梁思成、林徽因曾专程来此测绘写入《中国建筑史》。二〇〇八年地宫考古发掘，地宫正方形边长二点二五米、高三点一米，中央置唐代墓志铭与莲花基座石函，函内鎏金银棺层层相套，金瓶通高十三厘米、重六十二克，瓜棱形纯金，内盛四十七颗金顶骨真身舍利，并出佛牙与安葬舍利纪事碑。；金口坝（全国重点文保）：城东泗河之上，始建于北魏延昌三年，兖州刺史元匡主持筑堰。坝体东西长一百二十三米，十五孔石拱单孔跨约五米，坝高约七米、坝基宽约二十米，长条石浆砌，石与石之间以重约十斤的铸铁扣咬合，铁扣阴刻楷书金口坝三字，坝名由此而来。当年筑坝用石三万余块、木桩八万余根、石灰百万斛，至今横卧泗河如长虹。集拦水、灌溉、济运、通行于一体，有江北小都江堰之誉。；兖州府文庙：三路五进院落，沿中轴线依次为棂星门、大成门、大成殿、明伦堂、尊经阁，格局完整，为明代鲁王府扩建时所建府学文庙。；府河（原御河、南护城河）：绕城南流，今河道犹存，中御桥、东御桥、西御桥三桥跨河而立，仍是老城通行要道。；聊城东昌古城（作为对比）：同为明代筑城，北门亦设扭头门。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e石佛寺遗址（城东北豆腐店村北）：隋代始建，故村初名石佛寺村，民间素有先有石佛寺、后有兖州城之说。寺有大石佛像，殿前凿圣水井，井底卧灵石一方，宋淳化五年刻咒水变成甘露真言于其上，旧时天旱取石祈雨。石佛灵泉为明清兖州八景之一。今寺已毁，遗址与圣水井犹可寻访。；明城墙残垣（国内最短古城墙）：明初洪武十八年朱檀封鲁王、武定侯郭英扩建府城，城周十四里余，外砌青砖。一九六〇年代后城砖陆续拆走，今唯西护城河东岸、中山西路侧残存一段西门瓮城残墙，长仅六米、宽一米、高四米，墙砖长四十五公分、宽二十九公分、厚十三公分，夹在两座民居之间得以幸存，被称为国内现存最短的古城墙遗址。。\u003c/p\u003e", "c": ""}, {"n": "汶上老城", "s": "汶上", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e尚书路最独特：一街聚儒释道——东段文庙（儒·孔子）、中段关帝庙（道·关公）、西段宝相寺（释·释迦）。明代四尚书：吏部尚书吴岳、兵部尚书路迎、户部尚书王杲、工部尚书郭朝宾——&quot;小县不大四尚书&quot;。周代封鲁置中都邑（孔子宰前叫&quot;致密城&quot;）。唐天宝元年（742）改称中都县，移治今址。金泰和八年（1208）取&quot;汶水在上&quot;意更名汶上县（汶上之名始此）。明成化至万历十年（1475-1582）筑土城覆砖石，周长6.3公里方形。四门：北门望岳、东门醉白、南门观河、西门怀冉，外筑月城（瓮城）。民国二十七年，寺遭炮轰夷为平地，塔身受创。现状：城门全毁。东、北两面遗有土筑残垣还能摸出轮廓。宝相寺已重建，太子灵踪塔保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e尚书路自东而西，文庙祀儒、关帝庙奉道、宝相寺供释，三位圣人隔街相望。路西宝相寺里那座北宋熙宁敕造的太子灵踪塔凌空高耸，1994年维修时塔基地宫打开，石匣内金棺银椁层层相套，藏释迦牟尼真身佛牙舍利——牙上刻东府二字。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宝相寺（国家4A级）：北魏始建，原名昭空寺，北宋真宗封禅泰山时驻跸于此，御赐改额宝相寺，素有北朝最初名胜、东土第一道场之誉。寺内现存太子灵踪塔为原构，余皆1995年后复建。；太子灵踪塔（全国重点文保）：北宋熙宁六年至政和二年敕建，仿开封开宝寺灵感塔形制，十三层八角楼阁式砖塔，底层莲花座，塔内设螺旋阶梯可直达顶层，为皇家敕造的佛牙塔。一九九四年维修时发现塔基地宫，宫室面积约八十平方米：北壁佛龛须弥座正中供石匣，匣内纯金棺长二十六厘米，安于银制棺架上，外覆黄绢与一百零八颗水晶摩尼珠，金棺银椁层层相套，藏释迦牟尼真身佛牙一枚、舍利九百三十六颗，牙上刻东府二字；佛龛旁有双膝跪地捧真身菩萨像及石弥勒浮雕，石匣上刻铭文一百七十一字。此佛牙为唐代高僧悟空自北天竺犍陀罗求取而归，世称悟空佛牙。；汶上文庙（省级文保）：尚书路中段，始建于唐开元十三年，现存戟门、大成殿、明伦堂及烈女祠、节孝祠。鲁定公九年孔子初仕为中都宰，在此行之一年，中都大治，路不拾遗，夜不闭户，为孔子一生从政首邑。庙内辟孔子宰中都博物馆。；汶上关帝庙（省级文保）：尚书路中段，与文庙毗邻，元代中叶因久旱祈关圣灵应而始建，典型元代风格建筑群，有庙门、武圣殿、配殿、寝殿。自明兵部尚书路迎至清同治间屡经重修。一街之上，文庙祀儒、关帝庙奉道、宝相寺供释，三教圣迹相望，为天下奇观。；贾柏遗址（全国重点文保·新石器时代北辛文化）：县城西北汶上街道周村，遗址面积约五万平方米，经考古发掘发现房址、墓葬及大量石磨盘、石磨棒、蚌器、陶器残片。距今约七千年，是济宁境内已知最早的新石器时代文化遗址，北辛文化重要代表。；大运河南旺枢纽分水龙王庙古建筑群（世界文化遗产·全国重点文保）：县城西南十五公里南旺镇汶运交汇处运河右岸，明正德年间建宋公祠、白公祠、分水龙王庙。庙前临汶运交汇处石砌驳岸长约二百二十米，四处石阶直通大门，石阶两侧八个巨石水兽盘卧作镇水状，驳岸下竖十二根石桩以挽缆船只。现存龙王庙大殿、戏楼、禹王殿、水明楼、宋公祠、白公祠等明清建筑；禹王殿单檐硬山，面阔十五米、进深八米、高十米，顶覆琉璃瓦，脊饰蟠龙；水明楼起于高四米、宽十八米、长二十二米的台基之上，楼八米高、十二米阔、十米深，前檐悬清人题水明楼匾。明永乐九年工部尚书宋礼采纳汶上农民白英策，在此建分水枢纽，七分朝天子三分下江南，为运河全线水脊。；蚩尤冢（省级文保·新石器时代）：南旺镇南旺三村，封土堆高约五米，长宽各约数十米，周围遍植松柏。传为上古东方部落首领蚩尤冢所在，与黄帝涿鹿之战传说相关。；茅家堌堆墓群（省级文保·汉代）：南旺镇十里闸北村，堌堆高出地表数米，地表散落汉代砖瓦残片，曾出土汉代陶器、青铜器。为汉代家族墓葬群。。\u003c/p\u003e", "c": ""}, {"n": "滕州老城", "s": "滕州", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e滕国故城（省级文保）在县城西南十四里的姜屯镇滕城村一带。周武王灭商后封其异母弟叔绣于滕，滕国传三十一世、享国七百年有余，到了战国，滕文公礼聘孟子入滕推行仁政，故城便是那场&quot;仁政实验&quot;的唯一现场。内城至今保存，东北隅的文公古台隆起成一座土台，台上立滕文公庙，庙前那棵唐代古槐枝繁叶茂。薛国故城（全国重点文保）横跨张汪镇与官桥镇之间，战国时齐国灭薛，孟尝君受封于此，城周二十八里、内城七里，夯土城墙如今仍高八到十米、清晰可辨，站在墙下仍能想见当年&quot;宾客三千&quot;的排场。滕州城内的龙泉塔是明代万历年间的建筑，八角九层、高四十三米，民间传说塔顶供奉舍利，早已成为滕州的地标。此外，宋元丰元年范纯粹任滕县知县时，苏轼自徐州来滕视察，撰《滕县公堂记》勒石记事，明万历重刻的碑石仍存，字里行间还能读到这位文豪对滕县吏治的期许。唐元和十二年（817），滕县治所从故蕃城东移二里，取原黄山岭的黄土夯筑起一座方城，这便是今日滕州老城区的雏形，宋、金、元各代沿用，旧时仅有土城。到明洪武二年（1369）才始建砖城，万历年间重修加固。城墙以内，历代官署、文庙、鼓楼次第铺陈，护城河畔遍植荷花，池莲四面成为滕文人吟咏的景致。至于更早的那座滕国故城，其内城至今残存着土筑的城墙遗迹，文公台隆起于东北隅，历两千年而不没。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e滕州西南七公里姜屯镇滕城村，西周滕国故城的内城土城墙至今高出地面两三米，东北隅隆起一座文公台。台上滕文公楼前两株唐槐苍劲对峙，相传贞观年间所植，一千三百多年了还枝繁叶茂。这就是滕文公礼聘孟子推行仁政的唯一实地现场。\u003c/p\u003e\u003cp class=\"main-text\"\u003e滕国故城（省级文保）：县城西南姜屯镇滕城村，荆河之阳。周武王封异母弟叔绣于滕，传三十一世、享国七百余年。战国时滕文公礼聘孟子至此推行仁政。内城土筑城墙至今高出地面两三米，城基宽约十米，二〇一九年省考古院发掘文公台前东南角，实测墙宽竟达三十余米，下挖近五米才到城根，每层夯土约二十公分厚，墙内外各有一道护城河，河底沙中夹贝壳。东北隅隆起文公古台，台高约七米、面积近三千平方米，台上建滕文公楼，台前两株唐槐苍劲对峙，传为唐贞观年间所植；台南有灵沼遗址，再南即孟子讲学处。；薛国故城（全国重点文保）：横跨张汪镇与官桥镇之间，战国时齐灭薛，孟尝君田文父子受封于此，广招门客三千。外城城墙蜿蜒起伏，夯土层与夯窝清晰可辨，残垣高厚，至今犹存地面之上，是我国现存保存最完整的先秦古城址之一。；龙泉塔：城东荆河西岸龙泉广场，八角九级仿木结构楼阁式砖塔，高四十三点三五米，塔基周长三十七点六米、基座直径九点二米。塔基之上配石砌须弥座，高八十公分，自下而上作下枋、下枭、束腰、上枭、上枋，一至九层层高递减，每层有拱门与盲窗。整座塔不靠木梁柱，全凭青砖错缝咬合垒起，塔内原有螺旋砖梯可登顶，今不能登。据形制判断当为北宋遗构，明宣德三年重修，底层嵌重修碑记；一九三八年滕县保卫战中受损严重，一九八四年修复。；苏轼《滕县公堂记》碑：北宋元丰元年，苏轼自徐州视察滕县，见县令范纯粹修葺公堂而己居简陋，深敬其清廉克己，归徐后撰《滕县公堂记》勒石。碑记文章今存，碑石近年回归滕州。；北辛遗址（全国重点文保·新石器时代北辛文化）：市区东南二十八公里官桥镇北辛村北首、古薛河南岸，遗址面积约五万平方米，经两次发掘出土石铲、石斧、蚌镰、陶鼎、钵等器物。碳十四测年距今七千三百年至六千一百年，北辛文化由此命名，1982年编入国家教科书，今建北辛考古遗址公园。；渠村堂楼（省级文保·民国）：官桥镇渠村中部，现存主房五间两层、配房三间两层，均为硬山顶砖石木结构，青砖砌筑覆仰合瓦，正脊有砖雕，主楼高七点二米，石基高一米，门洞为拱券式。1938年渠若聚所建住宅，为民国时期鲁南民居典型代表。；岗上遗址（全国重点文保·新石器时代）：市区东陈岗镇岗上村，大汶口文化城址，面积约八十万平方米，发掘出夯土城墙、城壕及大型墓葬，出土玉钺、象牙镯等精美文物。2021年度全国十大考古新发现。；大韩东周墓地（省级文保·东周）：官桥镇大韩村东，面积约七千平方米，发掘出土陶器、青铜器、金器、玉器、漆木器等文物三千余件。2019年度山东省五大考古新发现，入选全国十大考古新发现终审候选。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌滕城村文保员 郑大爷（67岁）：\u003cbr\u003e&quot;老辈人讲，咱这村底下就是古滕国的城，文公台上那棵老槐树，我爷爷小时候就在底下乘凉，说唐僧取经都未必有它岁数大。每年清朗，四边姓滕、姓薛的都回来认祖，站台上往南一指——那一片全是薛国的地界。&quot;\u003cbr\u003e▌滕州退休老师 颜老师（70岁）：\u003cbr\u003e&quot;教书那会儿我爱给学生讲滕文公，说孟子在别处都碰壁，独独在咱这地方把&#x27;仁政&#x27;真推行开了，这就是孟子的实验田。龙泉塔底下有一圈浮雕，老人说是镇塔的，我打小看着它，拆了重建好几回，塔心还是老的。&quot;\u003c/p\u003e"}, {"n": "枣庄台儿庄老城", "s": "台儿庄", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e肇始于秦汉，发展于唐宋。明万历三十八年（1610），京杭大运河改道流经，迅速崛起为鲁南水陆通衢。清咸丰七年（1857）加固城墙：东西5华里×南北3华里，城门六座，水门一座（水上通道与运河主航道连通）。清乾隆年间最盛：&quot;商贾迤逦，一河渔火，歌声十里，夜不罢市&quot;——乾隆御笔钦赐&quot;天下第一庄&quot;。1938年春，兵燹毁灭古城，化为废墟。战后居民自发在故居残存墙基上重建家园。2008年枣庄市委市政府启动重建，遵循&quot;留古、复古、扬古、用古&quot;原则。现状：重建后2平方公里，3千米古运河道（月河），18个汪塘，15千米水街水巷，53处兵燹遗址保存完好。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明万历年间京杭运河改道流经，崛起为水旱码头，清乾隆御赐天下第一庄。古城重建后，古运河月河段三公里老河道仍沿东西走向流淌，沿岸青石驳岸斑驳；大战遗址公园里那面义丰恒商号南墙，密密麻麻的弹孔从底到上，一平方米内最多九十四个，原始遗存未修。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古运河月河段（世界文化遗产）：京杭大运河改道后留存的一段月牙形老运河，约三公里，沿岸古码头鳞次、古驳岸青石斑驳，是运河全线唯一完全东西流向的河道，被世界旅游组织称为活着的古运河、京杭运河仅存的遗产村庄。；53处兵燹遗址：一九三八年台儿庄大战后按留古原则原貌保存。大战遗址公园内存义丰恒商号、仁寿堂药店、和顺糕点店等明末民居十一栋，残存青砖外墙布满密密麻麻弹孔与炮火焦痕。义丰恒商号南楼对面是一条宽约两米的南北竖巷，中国守军曾在巷内架重机枪，直对商号南墙射出一片弹孔，那面墙宽约两米，弹孔从底到上密布。清真寺西小讲堂南墙上一块约八十厘米见方的青砖墙，密密麻麻嵌着九十四个弹孔，一九八八年被国家博物馆揭取陈列，定为国家一级文物；西小讲堂曾是三十一师一八六团指挥所，七天七夜拉锯战，一平方米墙面上最多留下三百七十五个弹孔。；明代水门遗址：原为运河主航道通入城内水街水巷的水上闸门，当年商船经此入城，今已恢复通航，舟楫可直入城内水巷。；八种建筑风格齐聚：台儿庄地处南北漕运要冲，晋商、徽商及南北客商聚此落户，带来家乡营造法式，遂有北方大院、徽派白墙、闽南红砖、岭南骑楼、欧式洋楼、鲁南民居、宗教庙宇、江南水乡八种风格并存，被誉为中国民居建筑博物馆。；台儿庄大战旧址清真古寺（全国重点文保·清乾隆七年）：古城后大路东段，俗称北大寺，清乾隆七年由阿訇李中和主持兴建，占地约四千二百平方米，坐西朝东，建有礼拜堂、大小讲堂、望月楼，具鲜明民族特色。大战时为中国守军据守要点，北讲堂西耳房墙面弹洞密集，1988年国家博物馆揭取一块弹洞砖墙定为国家一级文物。；偪阳故城（全国重点文保·春秋）：城区南张山子镇侯塘村与涧头集镇周庄村之间，城周长三千二百九十三米，当地有九里单八步之说，北墙高出地表四五米、底宽二十余米，城迹轮廓清晰可见，城中西南隅有米山小丘。春秋偺阳国都城，诸侯联军伐偺阳之战即发生于此，孔子之父叔梁纥曾力托悬门。；古码头群（世界文化遗产）：古运河月河段沿岸现存十一座古码头，青石驳岸绵延九百余米，南清真寺码头、郁家码头、官码头等依次排列，条石砌垒、木桩为基，至今泊岸痕迹可辨。明万历年间运河改道后，商船经此出入城内水街水巷。；新关帝庙（省级文保·清代）：古城内，清乾隆年间建，现存山门、大殿、东西配殿，砖木结构青砖灰瓦，殿内壁画残迹依稀。大战时为中国守军据点之一。。\u003c/p\u003e", "c": ""}, {"n": "聊城东昌古城", "s": "聊城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e（古镇·运河活码头）。北宋熙宁三年（1070）筑土城。明洪武五年（1372）改筑砖城，周长3.5千米（七里余），高11.7米。南东西瓮城为扭头门——南门东向似凤头、东西门南向似凤翅、北门北向似凤尾，故名&quot;凤凰城&quot;，能陷不失。明洪武七年（1374）建光岳楼（城中心更鼓楼），高33米。永乐九年（1411）会通河疏通，聊城成运河九大商埠之一，&quot;漕挽之咽喉，天都之肘腋&quot;，&quot;江北一都会&quot;——漕运繁荣400年。清乾隆御题光岳楼&quot;天下第一楼&quot;，康熙帝四次驾临，乾隆帝九次驻跸。1947年城墙城楼全部拆除。现状：城墙墙基还在（辟为环城路），护城堤残留2公里（城南龙湾至南堤口）。古城区1.17平方公里，被6.3平方公里东昌湖环抱。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e黄河以北罕见的水上府城，城中有水水中有城。古城方正，四周环以东昌湖，明洪武间陈镛以修城余木建光岳楼于城心，四重檐歇山十字脊木构楼阁巍然耸立。南、东、西三座瓮城皆作扭头门——南门瓮城向东开似凤头，东、西门瓮城向南开似凤翅，北门瓮城正北向似凤尾，合观如丹凤展翅。\u003c/p\u003e\u003cp class=\"main-text\"\u003e光岳楼（全国重点文保）：明洪武七年平山卫指挥佥事陈镛以修城余木创建，初名余木楼、东昌楼。总高三十三米，楼基为砖石砌成的正四棱台，占地一千二百三十六平方米，底边三十四点四三米、台高九点三八米，上台边三十一点九四米，下大上小有明显收分，台体四面各辟半圆拱门，台心为十字券洞通道，自地面登台共一百一十蹬踏跺。台上主楼四层高二十四米，四重檐歇山十字脊木构，覆盆式柱础、双槽柱列、斗栱疏朗，为宋元木构向明清过渡的典范。明清间即有虽黄鹤、岳阳亦当望拜之誉，康熙、乾隆南巡屡登此楼，乾隆御题天下第一楼。；山陕会馆（全国重点文保）：东关古运河西岸，清乾隆八年山西、陕西商人集资兴建，历时六十六年方成。神庙与会馆合一，现存有心门、戏楼、夹楼、钟鼓楼、南北看楼、南北碑亭、关帝殿、财神殿、火神殿、春秋阁等亭台楼阁一百六十余间。山门为四柱三间牌坊式门楼，面阔七米、进深一点七米、高十米，四柱柱础皆圆雕狮子。戏楼与山门合为过街戏楼，两重檐十翼角，檐下额枋以整根核桃木透雕福禄寿三星、飞龙花卉，台前立四根方石柱刻楷书楹联。会馆门前一对石狮高三点二五米，为山东现存最大石狮；聊城本不产石，石材全自山西运来。；海源阁（清代四大藏书楼）：光岳楼南万寿观街杨氏宅院，清道光二十年江南河道总督杨以增始建。二层硬山楼阁，下为杨氏家祠，上贮宋元珍本。经杨氏四代积聚，鼎盛时藏书四千余种、二十二万余卷，多宋元善本，与江南铁琴铜剑楼、皕宋楼、八千卷楼并称清代四大藏书楼，为清代北方最大私家藏书楼。；运河古码头：东关运河岸大码头，明清为漕运要冲，商船麇集，市肆繁华，旧有金太平、银双街、铁打的小东关之谚。；凤凰城城墙格局：古城方正，四周环以东昌湖，世称中华水上古城。明洪武间陈镛筑砖城，辟四门，东曰春熙、西曰清远、南曰正德、北曰宣武。南、东、西三座瓮城皆作扭头门——南门瓮城向东开似凤头，东、西门瓮城向南开似凤翅，北门瓮城正北向似凤尾，合观如丹凤展翅，故名凤凰城。；隆兴寺铁塔（国保·北宋）：东关运河西岸原护国隆兴寺东南角，八角十二层仿木铸铁佛塔，通高十五点五米，由地宫、塔座、塔身、塔刹四部分组成，塔座须弥座浮雕金刚力士、伎乐人物、孔雀麒麟龙凤，明永乐间倒塌、成化二年僧祖崇重立，与湖北当阳玉泉寺铁塔、济宁崇觉寺铁塔并称中国三大铁塔，为聊城现存最早古建筑。；傅氏祠堂（傅斯年陈列馆，省文保·清）：东关大街111号，清初开国状元傅以渐家祠，面阔三间进深三间歇山带廊，门悬状元府第匾，内悬康熙帝南巡御题传胪姓名无双士开代文章第一家对联，1993年辟为傅斯年陈列馆，季羡林题匾。；大小礼拜寺街历史文化街区（聊城市级）：运河西岸、东昌湖东岸，包括礼拜寺街、药王庙街、小礼拜寺街、清孝街四条小街，街宽两米许，两侧保留1950至1980年代土坯、红砖、砖土混合传统民居，为黄泛平原民居典型，与铁塔、清真东寺连成一片。；东昌府区清真东寺（市文保·明永乐）：小礼拜寺街深处，明永乐年间始建，大殿坐西朝东砖木起脊，院内古柏，为运河回回商贾礼拜之所，1993年公布聊城市重点文保。。\u003c/p\u003e", "c": ""}, {"n": "枣庄山亭翼云石头部落", "s": "翼云石头部落", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e（淮安古城补充）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e藏在翼云山东麓褶子里，鲁南最大的全石头村。民居多顺山势铺开，墙体以当地青石干垒不施泥灰，屋顶层层叠压薄页岩石板为瓦，连院墙、鸡窝、灶台也全用石条石片搭就，远望一片青灰。村中有一条石板巷道，踩上去咚咚作响，底下是空的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e石板房古村：翼云山东麓，原名兴隆庄村，为鲁南规模最大、保存最完整的石板房古村落。今存石屋一百二十六栋，最高老宅已有两百余年房龄，民居顺山势铺开成三街六巷十八胡同。墙体以当地青石干垒而成，不施泥灰而百年稳固，石墙缝隙间尚能看出当年糯米浆拌红泥的粘合痕迹；屋顶层层叠压薄页岩石板为瓦，门楣上嵌泰山石敢当小石碑，连院墙、鸡窝、灶台、晒粮架也全用石条石片搭就，远望一片青灰。二〇二四年以修旧如旧方式修复古宅七十余处。；响石巷：村中一条石板巷道，路面石板之下中空，行人踏上去便发出咚咚回响，如石中共鸣。旧时村人借这中空巷道藏匿粮食、防备土匪，故得名响石巷。；老石磨：院角一盘石磨已转动数百年，磨齿间仍嵌着经年玉米面的残黄，今日仍可用来磨辣椒、推豆浆，是鲁南山村农耕生活的实物见证。；后山石阶：从村里通往后山的石阶全由整块岩石凿成，每级石面上都有一道浅浅凹痕，那是数百年来挑水人扁担两头常年磨压留下的印记。；普照寺（省级文保·始建于隋）：山亭区西集镇西集村西、龙河之阳，现仅存大殿五间，硬山式砖木结构青砖灰瓦。殿前檐廊下竖四根青石盘龙立柱，采用高浮雕技法，龙身盘柱、鳞爪宛然；殿檐下嵌明代石碑两通，刻明代文学家贾三近诗作。始建于隋开皇年间，金大定年间扩建，明万历年间规模宏大。；梁王城遗址（省级文保·新石器至东周）：西集镇东集村西龙河北岸，台形高地东西长约五百米、南北宽约二百米，地表散落龙山文化至东周时期石器、陶片，东北部有旧梁王庙遗址。考证为小邾国倪犁来所建都城，俗称梁王城。；抱犊崮三清观（省级文保·明清）：北庄镇抱犊崮，共两进院落，有三清殿、碧霞阁、观音殿等殿宇房舍二十三间，建筑面积一千多平方米，院中有一棵高二十四米、胸围四点六米的千年银杏树，枝繁叶茂。；葫芦套八路军115师司令部机关旧址（省级文保·抗战时期）：徐庄镇驻地东南约一点五公里两山之间，共五间房屋，其中司令部旧址三间、陈光罗荣桓旧居两间，均为木石结构，墙体青石干垒不施泥灰。1939年八路军115师司令部曾驻此。。\u003c/p\u003e", "c": ""}, {"n": "青州明府城", "s": "青州", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e南阳城（主体）：明洪武三年（1370）改建砖城，城高12米厚6米，垛口1777个。四门：海晏（东）、阜财（南）、岱宗（西）、瞻辰（北）。清代多次重修。1972年修南环路拆南城墙。2017年国家5A级景区（免费）。青州作为山东政治经济文化中心达\u003cstrong class=\"hl\"\u003e1400多年\u003c/strong\u003e（前106年至1376年朱元璋移治济南）。省会史\u003cstrong class=\"hl\"\u003e1605年\u003c/strong\u003e。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e大禹划九州之青州，古青齐文化中心。先后建过六座古城（广县城、广固城、东阳城、南阳城、东关圩子城、满族旗城），明洪武九年前一直是山东省会。东关昭德街上那座元大德六年所建的真教寺，三进院落沿中轴线次第展开，融阿拉伯穹拱与中国宫殿木构于一炉，与杭州、定州并称元代三大清真寺。\u003c/p\u003e\u003cp class=\"main-text\"\u003e偶园：原为明衡王府东花园，清康熙年间文华殿大学士冯溥告老归里后购为别业，取无独有偶之意改名偶园。园中假山三峰沿东、南两墙环列，结构上分坪、峰、涧、台四组主题，层次繁而不乱，为国内仅存完整的康熙风格叠山，传为造园名家张南垣之子张然所叠，与北京中南海瀛台同一手法。园内还遗有衡王府遗留的福、寿、康、宁四块太湖奇石，石体瘦透漏皱并存。；海岱都会坊：古城内一座四柱三间木构牌坊，巍峨高耸，海岱都会四字点明青州自古为海岱间都会名城。；万年桥：南阳城北门外跨南阳河的明代石桥，旧时为城北出入通衢，河水穿桥而过，桥上车马往来。；衡王府石坊：明代成化间封藩青州的衡王府仅存遗物，俗称午朝门，为王府前甬道上的两座石坊，坐北朝南，通体石雕，刻龙纹、瑞兽、云蝠，雕工精细，气势宏阔，足想见当年王府规模。；青州博物馆：全国县级博物馆中唯一的国家一级博物馆。镇馆之宝有明万历二十六年赵秉忠殿试卷——为科举制度一千三百余年间唯一存世的状元答卷真迹；东汉宜子孙玉璧；龙兴寺遗址窖藏出土的北朝贴金彩绘佛教造像，那尊含笑的菩萨被称为青州微笑。；东门大街：古城内一条始建于北魏的老街，沿街后司巷为金代山东东西路统军司所在，卫里巷为明初山东都指挥使司驻地，千年间一直是山东军政要冲。；偶园大街：古城主干道，青石板铺路，旧时牌坊林立，有柱国坊、大学士坊、一门科第坊等，多为旌表明代冯氏家族科第而建。；昭德街：东关回族聚居老街，青石板路面两旁为传统民居，真教寺即坐落在这条街上，是青州多民族共居的历史见证。；青州贡院：旧时乡试考场，其地曾为山东布政使司衙门所在，可见明清青州作为省会级重镇的分量。；南阳城城墙：明初洪武间筑南阳城，今大部无存，仅存1986年修复的一小段。；东阳城、广县城、广固城：自汉晋以来叠压于今城下的历代古城，城墙今已无存，仅为地下遗址。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e真教寺（全国重点文保）：东关昭德街，元大德六年元相伯颜后裔所立，与杭州真教寺、定州真教寺并称元代三大清真寺，元代即封为国封官寺。全寺占地六千余平方米，坐西朝东，三进院落沿中轴线次第展开大门、二门、礼拜殿、望月楼。礼拜大殿为勾连搭式，由前殿、中殿、后窑殿勾连相接，面积六百余平方米，后窑殿上接望月楼，可容千人礼拜；前中两殿皆单檐歇山，斗拱梁枋朱漆彩绘。大殿前二门后立百字赞碑亭一座，高四米、阔三米，正面刻明洪武元年太祖御制至圣百字赞全文，背刻圣谕，原亭清乾隆二十五年建，文革毁，一九八五年重建。南北讲堂各面阔五间、单檐硬山前廊，横枋雀替饰阿文图案。大门楼砖雕素有似兽非兽、有眼无珠之说。；衡王府建筑群：明成化间宪宗封第七子朱祐楎为衡王，在南阳城内大兴土木营建王府，清初王府被查抄拆毁，今仅存两座石坊。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《尚书·禹贡》：\u003cbr\u003e&quot;海岱惟青州&quot;——渤海和泰山之间。\u003cbr\u003e▌青州导游词：\u003cbr\u003e&quot;2230年建城史·12年国都史（南燕慕容德·山东唯一称帝者）·1605年省会史&quot;。\u003c/p\u003e"}, {"n": "临清老城", "s": "临清", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e元代开通会通河，临清成汶卫交汇枢纽。明宣德四年（1429）设临清钞关——\u003cstrong class=\"hl\"\u003e全国最早的运河钞关之一\u003c/strong\u003e。明万历年间鼎盛：年收船料商税\u003cstrong class=\"hl\"\u003e8.3万两\u003c/strong\u003e（全国八大钞关之首，占全国四分之一）。彼时山东省一年课税折银仅8860两。清光绪二十七年（1901）运河漕运停止，钞关署治遂废。现状：临清运河钞关是\u003cstrong class=\"hl\"\u003e全国仅存的一处运河钞关\u003c/strong\u003e（世界文保+国保）。中洲古城160余条明清老街巷格局依旧。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明清运河八大钞关之首，万历年间年税收占全国商税四分之一。会通河南支西岸那组硬山青灰瓦院落，就是国内现存唯一的运河钞关旧址，院中两株古槐葱郁；河汊处石坝挑出如鳌之首，两支运河、四处河闸分列如鳌四足，广济桥横卧其后如鳌尾，故名鳌头矶。\u003c/p\u003e\u003cp class=\"main-text\"\u003e临清运河钞关（全国重点文保、世界文化遗产）：会通河南支西岸，明宣德四年始建，由户部直接派驻官员督理，下设五处分关。当年建筑群自河口正关、阅货厅、国计民生坊、关堞、仪门至正堂沿河西迤逦展开，厅堂坊舍数百间。今仅存两进院落，仪门、南北穿厅、科房、船料房等八十余间俱为硬山青灰瓦，院中两株古槐粗可合抱、枝叶遮院，明清碑刻错立廊下。清光绪二十七年漕运停止，钞关署遂废，是国内现存唯一的运河钞关旧址。；鳌头矶（全国重点文保、世界文化遗产）：明永乐十五年建。此处会通河分汊，石坝挑出如鳌之首，两支运河、四处河闸分列如鳌四足，广济桥横卧其后如鳌尾。现存主体观音阁，下为砖砌高台，台高五米、九米见方，台身围以雉堞女墙，辟东西向门洞贯通，门楣上刻独占二字。台上阁面阔三间、进深二间，歇山卷棚顶，以三五七架梁加抹角梁撑起，筒瓦陶脊，四角飞挑起翘颇大，与面河的望河楼相映，旧称鳌矶凝秀。；舍利宝塔（全国重点文保）：城北卫运河东岸，明万历三十九年重修，九级八面砖木楼阁式砖塔，高六十余米，通体几近垂直，仿木构斗拱密檐，刹顶作将军盔形，为省内孤例。塔身各层门楣匾额有秀聚中天、西引太行等题刻。与通州燃灯塔、杭州六和塔、扬州文峰塔并称运河四大名塔。；临清贡砖（国家级非遗）：明清两代岁征城砖百万，北京紫禁城、天坛、明十三陵及清东陵、西陵的皇家建筑，多用临清所贡城砖，故有临清砖漂起北京城之谚。贡砖选运河胶泥澄浆炼制，烧成后击之有声、断之无孔、不碱不蚀。城东南河隈张庄明清砖窑遗址犹存，为全国重点文保，烧制技艺列入国家级非物质文化遗产。；月径桥（全国重点文保）：清顺治九年徽商邵以枢捐资修建，单孔石拱桥，拱券轻盈，横跨河上，为清初商捐资修桥的实物见证。；临清闸（全国重点文保）：元至元三十年建，为会通河接入卫运河的头道船闸，舟至此换船入卫，是元代京杭运河南北接驳的关键节点。；明代砖城城墙：明嘉靖二十一年扩建城垣，夯土为芯外砌青砖，今残段犹存。；钞关现存建筑：当年数百间官署厅堂今仅存两进院落，仪门、正堂与耳房犹在，院中老槐依旧，静述帝国税关的往事。；运河漕运盛况：明清临清扼运河漕运咽喉，商贾迤逦，帆樯如林，东南漕船、北上商船麇集于此，号称富庶甲齐郡、繁华压两京。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代大学士李东阳（过临清）：\u003cbr\u003e&quot;十里人家两岸分，层楼高栋入青云。官船贾舶纷纷过，击鼓鸣锣处处闻。&quot;\u003cbr\u003e▌临清当地谚语：\u003cbr\u003e&quot;先有临清仓，后有临清城&quot;——临清仓年储粮300万石，输京漕运占四分之三，戍仓士兵3000人。\u003c/p\u003e"}, {"n": "济宁老府城", "s": "济宁", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐：任城县城，南北二里东西三里，长方形，单城门。南门即今南门。金天德二年（1150）济州迁治任城。元建济州城，土城。明洪武三年（1370）济宁左卫指挥使狄崇重建易以砖，周九里三十步，大体正方形，四门\u003cstrong class=\"hl\"\u003e均双城门\u003c/strong\u003e（城门+月城门）。四门匾题：南门宣阜门&quot;野入青徐&quot;、北门宗翰门&quot;云连海岱&quot;、东门绥华门&quot;邹鲁接壤&quot;、西门萃成门&quot;获麟古道&quot;。还有外城土圩、外圩门、外濠。现状：明清砖城全毁，\u003cstrong class=\"hl\"\u003e太白楼建在仅存的南城墙之上\u003c/strong\u003e（重建后还在原址）。竹竿巷、清平巷街巷格局保留。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e唐代李白客居任城二十三年，贺兰氏酒楼因他而易名太白酒楼。明洪武二十四年左卫指挥使狄崇将楼移建于三丈八尺高的南城墙之上——谪仙已逝何需俗醪相佐。今楼两层十间重檐歇山砖木结构，巍踞城头，楼前乾隆御题诗碑分列两侧。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太白楼（全国重点文保）：原为唐代贺兰氏经营的酒楼。开元二十四年李白迁居任城，日日与友荒宴于此。唐咸通二年吴兴沈光登楼篆书太白酒楼额，楼遂得名。明洪武二十四年左卫指挥使狄崇将楼移建于三丈八尺高的南城墙之上，并剔去酒字，只留太白二字。今楼一九五二年在残存高约四点五米的明城墙上重建，两层重檐歇山砖木结构，高二十余米，坐北朝南巍踞城头，连同台基占地六千平方米。二层檐下正中悬扇形太白楼楷书阴刻石匾，北壁上方镶明代诗酒英豪大字石匾，下嵌李白、杜甫、贺知章全身阴刻三公画像石；乾隆南巡五次登楼，御题诗碑分列楼前。；竹竿巷历史文化街区：老运河南岸，巷长二里，因竹器集散而得名。沿街店铺多为二层三层硬山楼房，前出抱厦、明柱承檐，临水而建，俨然江南水乡。与纸坊街、纸店街、汉石桥街、清平巷首尾相衔，曲尺相连。明清时运河商船泊岸，竹行、纸栈、商号鳞次栉比，人声鼎沸。；顺河东大寺：运河西岸小闸口，因依河而建俗称顺河东大寺。始建于明洪武年间，清康乾间大规模扩建，坐西朝东，沿中轴线对称布局，石坊、石门、大殿、望月楼次第展开，是运河沿岸规模宏壮的清真寺，全国重点文保。；南池公园（古南池）：城南王母阁湖一带，唐代开元天宝间即为胜游之地，南池荷净为济宁八景之一。天宝间李白与杜甫同游南池，杜甫有秋水通沟洫、城隅进小船之句。；铁塔寺（崇觉寺）：寺内北宋崇宁四年铸铁塔，九层八面，高二十余米，为我国现存最高最完整的宋代铁塔，全国重点文保。塔以生铁分段浇铸叠装，砖缝间尚存当年铸款。寺前声远楼内悬明代巨钟，一击声闻十余里，铁塔清梵为古任城八景之一。今寺为济宁市博物馆老馆。；明代砖城四门：明洪武间砌砖城，东门宣阜、西门宗翰、南门绥华、北门萃成，各门皆两道城门，城楼巍峨。；外城土圩、外圩门、外濠：砖城之外复筑土圩一圈，辟外圩门、挖外濠环护，形成里城包外郭的格局。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《济宁府志》（明万历）：\u003cbr\u003e&quot;周九里三十步，大体正方形，四门均系双城门，城上有城楼、炮台、女墙、垛口，下有护城河，四门外各有吊桥。&quot;\u003cbr\u003e▌济宁老篾匠（世代居竹竿巷）：\u003cbr\u003e&quot;我家祖上就在这剖竹编筐，运河没水的年头还能靠手艺活，水来了就泊船卸货，日子就这么晃过去了。&quot;\u003c/p\u003e"}, {"n": "邹城老县城", "s": "邹城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e明初土城。明正德元年（1506）重筑。明万历五年（1577）知县冯中州改砌砖城，耗银1000两谷900石。方形，周长4里80步（945丈），高1丈6尺5寸，垛口1528个。四门：瞻岳（东）、近鲁（北）、襟济（西）、崇教（南）。城外护城河深1丈宽7尺，引因利渠水注入，四门石桥横跨。明末天启二年（1622）白莲教起义，部分城墙被拆。清顺治五年（1648）修复，改城垛为375个。清康熙七年（1688）地震，西南城墙坍塌。1950年左右，古城墙最终拆除。现状：城墙全毁。亚圣庙街历史文化街区（鱼骨型格局）、孟母断机处遗址、孟庙孟府完整保存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e孟子故里，孟母三迁择邻、断织喻学的故事发源地。城南孟庙前后五进院落，亚圣殿前二十六根八棱石柱环立如卫，柱下石鼓为础、础下覆莲为托——那覆莲是北宋建庙原物，石柱本身则是明弘治九年整块盘龙石雕成。庙内古柏抱槐、藤系银杏，碑碣三百余方林立其间。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孟庙（亚圣庙，全国重点文保）：城南，北宋宣和三年迁建今址，历宋元明清续修扩建。前后五进院落，以亚圣殿为主体，南北中轴对称。亚圣殿高十七米、阔二十七米、深二十四米，绿琉璃瓦重檐歇山，下檐斗拱七踩单翘重昂、上檐七踩三昂。殿前擎檐石柱二十六根，皆八棱整石雕成，柱高三点零五米，柱下以石鼓为础，础高零点六五米，鼓下又以宋代石刻覆莲作承托，覆莲为北宋建庙原物，石柱为明弘治九年重修时整块盘龙石雕成。殿前廊下八根柱上饰浅浮雕翼龙牡丹缠枝，门侧四柱南面阴刻双翅翼龙。殿后启圣殿、孟母殿、致严堂、祧主祠、东西两庑环列。院内古柏桧槐四百余株，多为宋元所植，古柏抱槐、藤系银杏、桧寓枸杞、洞槐望月并称古树四奇，碑碣三百余方林立其间。；孟府（全国重点文保）：孟子嫡裔世袭翰林院五经博士的府第，在孟庙西侧，南北长二百二十六米、东西宽九十九米，占地约二万二千四百平方米。前后七进院落，沿中轴线依次为亚圣木坊、大门、仪门、大堂、世恩堂、赐书楼、见山堂，廊庑勾连，楼堂房室一百四十八间。大堂五楹，堂前檐下正中悬清雍正帝手书七篇贻矩匾；世恩堂为内宅正房，五楹硬山前后回廊，明间悬世恩堂楷书巨匾。赐书楼两层，每层三间，前后出厦，硬山式明代典型建筑，木楼板上又加铺一层方砖以防火，楼上窗作龟背锦花格、楼下窗为直棂，专为存放皇帝钦赐圣旨诰封与家族档案。保存了明代以来的官衙与内宅格局。；亚圣庙街历史文化街区：以亚圣街为主轴，过街棚街、塘子街、东马道、西马道、人祖庙街、井胡同、杜家胡同、小寺街、韩家胡同、武学胡同如鱼刺般两侧参差延伸，构成鱼骨型街巷格局，千年未改。；明代砖城四门：明洪武间砌砖城，东门瞻岳、西门近鲁、南门崇教、北门襟济，城楼巍峨。；县衙全套建筑：明清邹县署沿中轴线布局，大堂、二堂、三堂、六房、监狱齐全，今已不存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孟母断机处遗址（省级文保）：古邹县城南门外因利河北岸，明代立孟母断机处、子思子作中庸处两通石碑，旁有清道光间河道总督栗毓美书额的三迁故址坊。抗战时古建筑毁于战火，碑石移入孟庙碑亭东侧保存，近年南门外复建孟母祠、子思书院、子思祠。；明代十六座牌坊（全毁）：明清邹县城内跨街牌坊林立，有三迁坊（南门外纪念孟母三迁）、断机堂坊、攀桂坊、进士坊、青云坊、登云坊、世科坊、双桂坊（兄弟同举）、澄清坊、宣化坊（县署前）、城隍坊、亚圣坊等，每座牌坊都是一方读书立世的宣言，今已全毁。；护城河：明代随砖城开凿，今已填为街道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明代嘉靖《邹县地理志》：\u003cbr\u003e&quot;地方二百余里，纵广七十里，横一百五十里，东南至滕，西至鲁齐，北抵泗岱。&quot;\u003cbr\u003e▌《孟母戒子》（西汉韩婴）：\u003cbr\u003e&quot;孟子辍然中止，乃复进。其母引刀裂其织，曰：此织断能复续乎？&quot;——孟母剪断正在织的整匹锦缎，教育孟子半途废学就像剪断的织锦再难续接。\u003cbr\u003e▌邹城老居民：\u003cbr\u003e&quot;老照片里三迁牌坊还在，旁边两通石碑、三孔因利桥。我妈说她小时候还在牌坊下留过影，现在只剩石碑了。&quot;\u003c/p\u003e"}, {"n": "菏泽老府城·曹州", "s": "菏泽", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e明清棋盘格局完整保留至今：。东方红大街（明东西轴） 还在！交叉点叫&quot;隅首&quot;，共23个（钟楼隅首、鼓楼隅首、石碑隅首、石人隅首、铁货隅首、油坊隅首、潘隅首、宋隅首……）——\u003cstrong class=\"hl\"\u003e以隅首为界，街分数段各段长短大体相等，通名叫巷\u003c/strong\u003e（全国独有）。明正统十一年（1446）原曹县知县范希正迁任曹州知州，利用旧州址始筑城池。至明正德七年（1512）告成，历时66年。城周12华里，城墙高2.5丈，堞高5尺，趾宽3丈，池深1.5丈广4丈。四门：东&quot;双河&quot;、西&quot;凤山&quot;、南&quot;南华&quot;、北&quot;济阴&quot;。城门额嵌石为匾，上设城楼（东&quot;青波旭日&quot;、南&quot;风入虞弦&quot;、西&quot;凤台霜晓&quot;、北&quot;云里蓬莱&quot;）。外圆内方铜钱形制——方形城墙圆形护城河。清乾隆三十二年（1767）改土墙为砖墙，周长1872丈，设炮台26座、水簸箕84道、门楼4座、垛口3134堵。1938-1948年十年间两次重修三次拆除。1960年代初城墙遗址上植树，现已成林。现状：城墙全毁，七纵七横棋盘格局完好，东方红大街（明清东西中轴线）是老菏泽人叫的&quot;菏泽第一街&quot;。（已固化18座旧县城+6古镇·待下一批扩充）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明正统十一年知州范希正始建，七纵七横棋盘格局至今完好。老城呈方形、边长三里，外绕圆形护城河，合观如一枚外圆内方的大铜钱。今老街深处仍有古井遗存，青年湖畔曾出土明代福寿井碑；而金元时期的主干道走向，与今天的广福大街、东方红大街基本重合，八百年街道骨架未移。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城地下历代古城叠压：今菏泽老城下叠压宋、金、元、明、清数代城址，文化层深达数米。金元时期的主干道走向与今日广福大街、东方红大街基本重合，八百年街道骨架未移。；七十二井：明清曹州城号称七十二条街、七十二眼井、七十二个坑塘，井水甘冽。今青年湖东北岸福寿街西，明代福寿井重见天日：井为砖砌圆形，井口石砌方形，上覆不锈钢防护罩，空隙间垂首下望可见水面；旁立石碑刻福寿井三字。传明天启间山东巡抚赵颜饮此井水熬豆粥称善，知州杨湛然于天启七年集资立碑定名。井边那块鹿卢石本是汉代画像石，被后人改作汲水辘轳的压脚石，一石跨两千年。古井古碑长期湮没地下，二〇二〇年老城复兴工程中重新发掘原样复原。；青年湖：原为老城七十二坑塘之一，近年修整为城市滨湖公园，湖面开阔，环湖步道垂柳，湖上五拱环洞泰宁桥横卧。；1446街区（老城曹州文旅区）：老城西南，二〇二二年开放，街区取明正统十一年首任曹州知州范希正筑城之年为名。内有海棠寺街、民权街、太平街，慎思园即范希正纪念园，系将范希正故里苏州一带明代古建筑整体迁建而成，苏州园林式布局，含甘棠遗爱坊、劝济门、养正斋、澄怀堂、崇化阁等十八景。青年湖西南岸永安塔为仿宋楼阁式砖混结构，高五十六米，七层八角四门，占地约六百八十平方米，每层绕环廊，登塔可俯瞰全城。湖上五拱环洞泰宁桥横卧，把湖岸与街区连成一片。；曹州牡丹园：曹州牡丹栽培始于隋、盛于唐、甲天下于明，今品种千余种，谷雨前后花潮如海，为菏泽最负盛名的城市名片。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e明代砖城与四门城楼：明正统十一年范希正筑城，方形砖石城，边长三里，七纵七横街道棋盘展开，城四门建楼，四角筑敌台。今城墙城楼全毁。；七十二座牌坊：明清曹州城内跨街牌坊林立，号称七十二座，旌表仕宦节烈，今全毁。；明正统郭氏牌坊：原位于东方红大街中段，为正统间为本地郭氏所立，1958年拆除，老档案照片尚存。；钟鼓楼：旧在城中，晨钟暮鼓为老城报时，1950年代拆除。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《菏泽市志·城垣变化》：\u003cbr\u003e&quot;七纵七横，相互交叉，状若棋盘。交叉点称隅首，共23个。以隅首为界，街分数段，各段长短大体相等，通名叫巷。&quot;——这种街巷分段命名法全国独有。\u003cbr\u003e▌菏泽老居民（世代居曹州路）：\u003cbr\u003e&quot;我家就在考棚街边上，爷爷说他小时候听老人讲——地下还有一层城，老早战乱黄河决口淹的。后来挖地基挖出宋金元的砖头瓦块，才知是真的。&quot;\u003cbr\u003e▌菏泽歌谣（世代口传）：\u003cbr\u003e&quot;七十二条街，七十二眼井，七十二个牌坊，七十二个坑，七十二地煞藏其中。&quot;——72是吉利数，应地煞星驱魔禳灾护祐百姓。\u003c/p\u003e"}, {"n": "郯城老县城·碌碡城", "s": "郯城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e元末沂州守御王信在郯城河（今郯子湖）以南筑新城，\u003cstrong class=\"hl\"\u003e用碌碡排垫墙基，累土版筑\u003c/strong\u003e——所以叫&quot;碌碡城&quot;。周五里八十步，高二丈二尺，厚八尺。设三门（郯城自古无东门）：南通淮、西瞻鲁、北拱极。明正德五年知县黄琮修北门建楼。嘉靖二十一年修南门西门建楼。万历二十三年（1595）\u003cstrong class=\"hl\"\u003e始甃以砖\u003c/strong\u003e（第一次外包砖）。清康熙七年（1668）郯城8.5级大地震，城墙垛堞都轰然坍塌。1958年拆城墙时挖出\u003cstrong class=\"hl\"\u003e大批砌排整齐的碌碡\u003c/strong\u003e——每个长69cm直径51cm，青石红石有辋无辋皆有（实物现存郯城一中老城墙边）。现状：郯国故城遗址（国保·周代）西墙北墙局部保存，残墙高4米。元明清碌碡城城墙全毁。（T3批次6城已固化·累计24座旧县城+6古镇）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e元末沂州守御王信在郯城筑城时，正值隆冬天寒地冻采石困难，为抢工期从民间大量征用碌碡排垫城墙基，累土而立版筑而成——所以郯城古城又叫碌碡城。今县城北与今城仅隔一道护城河，西周至战国郯国故城的西墙、北墙局部夯土犹存，墙基宽厚，残墙高起。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郯国故城遗址（全国重点文保）：西周至战国郯国都城，少昊后裔所封，以鸟为图腾。城址在今县城北，与今城仅隔一道护城河，平面呈不规则四边形，周长四千六百七十米，其中西墙、北墙各长一千二百六十米，东墙一千三百七十米，南墙七百八十米。城墙系黄土夯筑，墙基宽四十米、顶宽十五米，今存残墙高三至四米，北墙、西墙局部尤其郯城一中段保存完整。城置四门均以青石砌筑，今仅存西墙北墙局部夯土犹存，墙基宽厚，二〇二五年辟为故城遗址公园，以浅草植被标识取代硬质围栏。鲁昭公十七年郯子朝鲁，在宴上详述少昊以鸟名官的古老制度，二十七岁的孔子闻之专程登门向郯子学官制，即韩愈师说孔子师郯子所本。；马陵古战场（全国重点文保）：郯城东部马陵山独龙涧，俗称庞涓沟，九条冲沟环绕尖子山，形如葫芦口袋，自古为设伏险地。周显王二十八年齐魏马陵之战，孙膑以减灶示弱诱庞涓轻骑追入峡谷，夜伏万弩齐发，射杀庞涓于此。山间今存孙膑指挥塔、恨谷崖、庞涓被射处、点将台、分尸岭等遗迹。；于公墓与东海孝妇冢：城西有西汉于公墓。于公为县狱吏、郡决曹，决狱公平，汉书有传。今郯城又传东海孝妇故事——孝妇少寡养姑甚谨，蒙冤被诛，郡中大旱，即后世关汉卿窦娥冤所本，孝妇冢至今犹存。；明代县衙：旧县署沿中轴线布局，历经明清沿用，今部分明清建筑残存，梁架斑驳可辨。；马头清真寺（省级文保·明永乐年间始建）：县城西南马头镇驻地北部，占地十三亩，建筑面积八百七十平方米，四合院落式布局，有朝真大殿、南北讲堂、东对厅、水房、古井亭、门楼、望月楼。大殿二十四间，枋檩斗拱鸱尾走兽，融合中国宫殿式与伊斯兰建筑风格。始建于明永乐三年，清雍正年间扩建，为苏北鲁南规模最大保存最完整的清真寺。；鄟国故城（省级文保·周至汉）：县城北泉源镇前城村，城址残垣断续可见，夯土城墙高出地面，地表散落周代至汉代陶片。古鄟国都城，后入鲁为邑，汉代仍沿用。；新城遗址（省级文保·北宋）：县城北庙山镇，城址为北宋初年所筑土城，城墙残段夯土犹存，城基宽厚。北宋初年郯城因地震黄河水患迁治于此，后又迁回。；马陵山细石器文化遗址（省级文保·旧石器时代）：县城东马陵山红花镇境内，山间冲沟两岸散布细石器标本，有石叶、石核、刮削器等，为旧石器时代晚期至新石器时代早期人类活动遗迹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《乾隆郯城县志》：\u003cbr\u003e&quot;元守御王信筑城，时值隆冬，大量征用碌碡排垫墙基，累土版筑，故又称碌碡城。&quot;\u003cbr\u003e▌郯城一中老教师（1958年亲历拆城）：\u003cbr\u003e&quot;我亲眼看见挖出来的碌碡——砌得整整齐齐，像一排一排的圆石头柱子，每个都有半人高，青石的红石头都有。&quot;\u003cbr\u003e▌《左传·昭公十七年》：\u003cbr\u003e&quot;郯子来朝，公与之宴。昭子问焉，曰：&#x27;少昊氏鸟名官，何故也？&#x27;郯子曰：&#x27;吾祖也，我知之。&#x27;&quot;——前525年郯子到鲁国朝见，讲述少昊氏以鸟名官的历史，孔子闻之特意见郯子而学之。\u003c/p\u003e"}, {"n": "蒙阴老县城·蒙恬故里", "s": "蒙阴", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉初置蒙阴县（前205年），县治置于联城镇城子村一带（汉蒙城）。西晋公家城子村（晋蒙城），城址四角有四个大土堆，城墙和护城河沟清晰可见。明洪武三十年（1397）百户龙胜重修县城，石城周围一里零二百步，连雉口高一丈六尺。三座城门：东望海、西瞻岱、南文昌。1947年蒙阴遭强烈地震，城垣倒塌。1950年代城墙拆除。现状：汉蒙城遗址（边家城子村，角堆尚存），晋蒙城遗址（公家城子村），蒙恬故里联城镇。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e秦将蒙恬故里经县史志办实地考证确认为联城镇边家城子村（汉蒙城旧址），村东北北靠青龙山、南望蒙山，西汉初置蒙阴县治所，考古调查发现大量汉代砖瓦与大段墙基。村中有颛臾庙，庙前一株千年黄连木数人合抱，枝叶苍郁至今犹存。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汉蒙城遗址·蒙恬故里：联城镇边家城子村东北，北靠青龙山、南望蒙山，为西汉初置蒙阴县治所。考古调查在村北高地上发现大量汉代绳纹砖瓦与大段墙基残迹，墙土中夹蚌壳。村中颛臾庙为明永乐二年建，实为祭蒙山的颛臾王祠庙，亦为蒙氏宗祠，庙前一株千年黄连木数人合抱，枝叶苍郁至今犹存，树龄与周成王封颛臾时间相类。一九九五年蒙阴县政府立蒙恬故里碑于村前，秦将蒙恬即本县人。；晋蒙城遗址：公家城子村，城址四角各有一个大土堆，为当年城墙转角残段，城下护城河沟痕迹清晰可辨。；蒙山（亚岱）：主峰海拔一千一百五十六米，为山东第二高峰，素有亚岱之称。孔子登东山而小鲁，即此山。云蒙峰下峪子里相传为鬼谷子王禅隐居讲学处，旧有鬼谷子庙，民间传孙膑、庞涓、苏秦、张仪俱在此师从学纵横与兵法。；蒙恬造笔传说：秦将蒙恬即本县人，后世传其始以鹿毫竹管制笔，改进毛笔形制，被尊为毛笔之父。；北楼迎仙桥（省级文保·明代）：县城东北旧寨乡北楼村西南，跨一条南北走向的河滩，敞肩式三孔全石拱桥，长三十米、宽五米有余、高四米。桥面青石板及条石铺成，石面被数百年车马碾得光滑锃亮，辙痕宛然；两边各立栏柱五根、间隔栏板四块，栏板浅浮雕花篮、渔鼓等八仙法器与花卉瑞兽，两两桥孔上方各卧一条石龙，龙头朝北、龙尾朝南，桥上下游各蹲一对石牛石狮。桥西立光绪三十三年重修碑及捐资碑三通。始建于明，清同治间损坏、光绪三十三年捐资重修，为山东仅存四座古代石拱桥之一。；卢县故城（省级文保·汉代）：县城东北岱崮镇东指村，城址为台形高地，汉代城墙残段夯土犹存，地表散落汉代砖瓦。西汉置卢县于此，属泰山郡。；黄云山摩崖造像（省级文保·北朝）：县城东南垛庄镇朱红圈村北黄云山南麓，裸露的青灰崖壁上凿出佛龛，主尊结跏趺坐，衣纹线条流畅，北魏秀骨清像与东魏丰腴圆润并存。龛像露天无遮，经一千五百年风雨，佛面多已风化模糊，石缝间生出杂草，只余主尊轮廓与两侧胁侍依稀可辨，须攀山入峪、由本地引路方可寻得。；丁家庄四合院（省级文保·明清）：丁家庄村内，现存南北两院，正房厢房砖木结构青砖灰瓦，院落布局完整，木雕砖雕精细。为明清时期鲁中山区民居代表。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《沂州府志》：\u003cbr\u003e&quot;蒙阴故城，在县西南十五里，汉县，属泰山郡。&quot;\u003cbr\u003e▌蒙氏祖谱：\u003cbr\u003e&quot;始祖蒙山公，周成王在位时，封蒙山公为东蒙主，安居蒙阴县，此地为蒙氏发祥圣地也。&quot;\u003cbr\u003e▌蒙阴县史志办考证（2018）：\u003cbr\u003e&quot;蒙恬故里可断定在距蒙阴县城西南7.5公里处的边家城子村东北约一公里的汉蒙阴县城旧址上——颛臾王庙即蒙氏宗祠，千年黄连木树龄与周成王封颛臾时间吻合。&quot;\u003c/p\u003e"}, {"n": "兰陵古城·兰陵镇", "s": "兰陵", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周周公兼治七十二国，在兰陵筑土城，大块红石做地基夯土做墙，&quot;土围子&quot;。北齐兰陵王高长恭封地在兰陵，\u003cstrong class=\"hl\"\u003e下令扩建城池\u003c/strong\u003e——新城围城总长12华里，东西2.5华里南北3.5华里长方形。兰陵王府在土围墙北门外300米，门正对土围子北门。唐盛世年间酒业兴起，扩建外城（楚币晒金滩遗址在温岭南头）。1917-1920年民国年间在内城墙原址用土修复——垫一层碌碡压一层，用了三年。1950年代城墙大部拆除。现状：内城遗址东西宽885米×南北长1980米=175万㎡，墙基宽约30米，南部残存几米残墙。荀子墓在兰陵镇东南1.5公里（省保）。（T4批次6城已固化·累计30座旧县城+6古镇·v8 行数字符待追加验证）。古今叠影稿（v8·30座旧县城+6古镇）完。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e山东境内最早设立的县治单位之一，近两千四百年历史。荀子两任兰陵令近二十年，辞官后定居终老于此——培养出李斯韩非浮丘伯。兰陵镇东南运女河西岸，黄土封土垒成的荀子墓前，立着清道光间补建墓碑与光绪间楚兰陵令荀卿之墓碑，碑字至今清晰可辨。\u003c/p\u003e\u003cp class=\"main-text\"\u003e兰陵古城墙残段：兰陵镇即两千三百年前楚置兰陵县治所，旧城墙墙基宽约三十米，今城南仍残垣数段，夯土斑驳。；兰陵美酒：兰陵酿酒史可上溯商周，北魏贾思勰齐民要术已载其曲酿之法；唐李白客居东鲁，留下兰陵美酒郁金香、玉碗盛来琥珀光的绝唱。1995年徐州狮子山西汉楚王墓出土三坛封存完好的兰陵美酒，坛口泥封印兰陵贡酒、兰陵丞印，沉埋两千余年犹有酒香，被评为当年全国十大考古发现之首。1915年巴拿马万国博览会获金质奖章，1954年周恩来携赴日内瓦会议宴请各国使节。；四城门匾额：北齐兰陵王高肃（长恭）封邑于此，其地旧城门石匾相传为东曰东海镜清、西曰逵达邹鲁、南曰衢通徐淮、北曰文峰映秀，可见当年兰陵城北接邹鲁、南通徐淮的形胜。；鄫国故城（全国重点文保·周至汉）：县城西北向城镇鄫城前村与鄫城后村之间，黄黏土夯筑的土城，平面略呈梯形，墙基宽约三十米，东南、东北两个城角夯土层叠压清晰，残高近十米，西北角已平为平地。城墙外一圈护城河痕迹犹在，城与河之间夹道宽约三丈；城中部偏东隆起一座长方形夯土台基，传为宫殿故址。一九七七年所立省级文保碑正压在南门遗址上，如今城郭内外尽是蔬菜大棚，唯四角残垣高出田垄可指认。；萧望之墓地（省级文保·西汉）：兰陵镇北萧氏文化园内，黄土封土隆起，墓前立碑，周边建有萧氏祠堂及石仪。西汉元帝时太傅萧望之葬于此，为兰陵萧氏始祖，后世南朝齐梁诸帝皆出此族。；城子遗址（省级文保·新石器时代）：县城西南城子村，堌堆高出地表数米，面积约数万平方米，地表散落大汶口文化至龙山文化时期陶片、石器，北面另有汉代墓群朱村古墓群。为鲁南史前文化重要遗址。；文峰山鲁南革命烈士陵园（省级文保）：县城西南尚岩镇文峰山，山上山下分两部分，上山建十二处革命纪念碑，山下安葬苏北鲁南淮海战役牺牲烈士三千七百九十一人遗骨。文峰山上另有季文子庙、鲁王墓等古迹。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e荀子墓（省级文保）：兰陵镇驻地东南运女河西岸，黄土封土堆成，东西长、南北窄，墓上遍生刺槐，四周以青石矮墙围砌。文革时有人在封土正中挖沟，竟掘出一洞，后又回填封护植树。墓前两碑东西横排：西为道光二十一年补建荀子墓碑，碑额篆书，碑身高两米余、宽不及一米，有四角碑帽，碑文楷书而字已漫漶；东为光绪三十年山东巡抚周馥所立楚兰陵令荀卿之墓碑。两碑夹墓而立，二百年来沐风栉雨。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李白（唐开元二十八年）：\u003cbr\u003e&quot;兰陵美酒郁金香，玉碗盛来琥珀光。但使主人能醉客，不知何处是他乡。&quot;——千古绝句，对兰陵美酒从色香味情进行综合鉴赏。\u003cbr\u003e▌《金瓶梅》作者兰陵笑笑生：\u003cbr\u003e据专家考证为兰陵人——兰陵千年古镇、兰陵美酒、荀子文化、《金瓶梅》文化四大品牌世界闻名。\u003cbr\u003e▌徐州狮子山楚王墓考古队（1995年）：\u003cbr\u003e&quot;兰陵美酒陶制球形缸沉埋2148年，泥封上印有&#x27;兰陵贡酒&#x27;&#x27;兰陵之印&#x27;戳记——打开后一股浓郁酒香溢出，令在场考古专家惊叹不已。&quot;\u003c/p\u003e"}, {"n": "定陶老县城·陶丘", "s": "定陶", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e尧舜以陶丘为都（陶唐氏）。西周初年周武王封其弟振铎为曹伯，建曹国，都陶丘，历26君558年。春秋宋灭曹，设陶郡，治陶城。秦始置定陶县（前221）。自春秋末至西汉400多年，定陶一直是中原水陆交通中心和商贸都会，享有&quot;天下之中&quot;美誉。元文宗至顺二年（1331）黄水淹没定陶故城。明洪武四年（1371）迁县城于今址。现状：官堌堆（刘邦登基处）、定陶王陵、仿山曹国古墓群、范蠡墓等遗存尚存，老县城明清街巷格局依稀可辨。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e定陶地处黄河冲积平原，老城四周台地隆起，商周堌堆与汉代王陵散落田间，遗存多为土台高丘与深埋地下的墓室，沿田间陇上可逐一寻访。\u003c/p\u003e\u003cp class=\"main-text\"\u003e官堌堆（受命坛，省级文保）：仿山镇姜楼村南四百米田畴间一座商周堌堆，高近九米，土台壁立，夯层夯窝隐约可辨，顶部平整。公元前二〇二年二月初三，刘邦即于此堌堆上即皇帝位，旧称受命坛、即位坛。堌堆本身也是新石器至汉代村落遗址，土层中至今可捡到陶片与蚌壳。一九九二年列为山东省第二批省保，二〇二一年菏泽市中华文化促进会于台上新立盘龙碑首、龟趺座石碑，正面刻汉高祖刘邦登基处中华汉文化发源地纪念碑。；仿山古墓群（省级文保）：定陶城区西北六里，平地堆起东西两座土阜，积壤之高仿佛如山，故名仿山。东山葬曹叔振铎以下二十五代国君，西山为其次子卞城王一系，冢墓累累环丘排列，坡上古柏参天、碑碣林立。台上旧有曹氏祖庙大殿，今存始祖大殿前广场，每年清明海内外曹姓宗亲远自南洋来此祭祖，香火至今不绝。；范蠡墓（省级文保）：定陶城区东北崔庄村北，封土隆起成丘，黄土覆草，四周村落农田。范蠡佐越灭吴后止于陶，称陶朱公，卒葬于此，陶朱公传说列入国家级非物质文化遗产。；梁王台：定陶城区东北，传为汉初梁王彭越点将练兵之台，今为一片略高于周围的台地，旧志载晨望台上白气茫茫。；十里铺遗址：定陶城区西南，龙山文化聚落遗存，土层中夹灰坑陶片，2015年入选全国十大考古新发现。；陶丘（古陶国遗址）：城区西南马集镇费庄村北，双层叠起的土丘，形如陶灶，相传帝尧初封陶国所在，今丘上草木覆被。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e定陶王陵M2汉墓（全国重点文保）：马集镇田野之下，地表一垄封土直径九十余米，斜坡墓道东向，墓圹近方形。地下为一座黄肠题凑木构建筑群，二十三间墓室对称环绕，黄肠木全用柏心，层层枋木夹以楠松，椁周以青膏泥封护、砖与圹间填细沙。封护青砖多达三万块，十之八九带朱书、墨书或戳印文字，记工匠名、产地与年月日，年号自汉宣五凤至汉哀建平，发掘后原址回填，今地表仍是平坦麦田。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·货殖列传》：\u003cbr\u003e&quot;朱公以为陶天下之中，诸侯四通，货物所交易也。乃治产积居，与时逐而不责于人。故善治生者，能择人而任时。十九年之中三致千金，再分散与贫交疏昆弟。&quot;\u003cbr\u003e▌《定陶县志》（清）：\u003cbr\u003e&quot;官堌堆在城西北十里许，汉高帝即位于氾水之阳即此，高阜犹存，今名官堌堆。&quot;\u003cbr\u003e▌定陶文保干部李娜：\u003cbr\u003e&quot;260万字——你想象一下，一座墓里埋了一座图书馆。黄肠木上的墨书是工匠写的&#x27;某年某月某日造&#x27;，陶砖上有的写着产地&#x27;济阴郡定陶县昌邑乡&#x27;，比史书还准。&quot;\u003cbr\u003e▌仿山守墓老人曹大爷：\u003cbr\u003e&quot;每天都有全国各地姓曹的来上香——我守了40年，见过最远的是马来西亚来的。都说来认祖，说&#x27;天下曹姓从定陶来&#x27;。&quot;\u003c/p\u003e"}, {"n": "巨野老县城·麟州", "s": "巨野", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉始建县城（周九里）。唐高祖武德四年（621）设麟州于巨野，因&quot;西狩获麟&quot;而名。元文宗至顺元年（1330）黄水注巨，城址淹没，县治一度迁城北邢家务。明洪武七年（1374）黄河义决，巨野水深四丈，塔没二级，房屋殆尽。明武宗正德七年（1512）因农民起义军攻克数城，知县余守观惧故城空旷，急调民工改建——拆城西、北两隅，保留东、南两隅，新城周长1113丈（约3公里），加瓮城。明熹宗天启二年（1622）地震+起义军围攻，抢修城防。1946年元旦，巨野旧城墙开始被拆除，建起环城路。现状：永丰塔、文庙大成殿、麒麟台、昌邑故城址、金山秦王避暑洞尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e巨野地处鲁西南黄河冲积平原，老城坐落在洙水故道旁，一座北宋砖塔泡在塔下碧池之中，文庙大成殿隔路相望；东南二十余里金山南麓，一孔人工劈山凿成的西汉崖墓藏在青石壁立的山腹里，沿县城至金山的公路可一一寻访。\u003c/p\u003e\u003cp class=\"main-text\"\u003e永丰塔（国保·北宋嘉祐·县城东南角）：县城人民路东段北侧、文庙南百余米，等边八棱四门楼阁式砖塔，青砖、青石以白灰砌筑。原七级，元末明初黄河决口淤没最下两级，地面现存五级、通高约三十米，底层周长四十四米。一层用砖叠涩密挑出檐、檐下无斗栱，如鱼鳞层层外凸，以上各层华拱两挑交叉；塔心室北门可入，壁间嵌七块宋代石佛造像碑。为护塔基，塔周三面常年浸水，塔身在水中受力不匀，微微斜向东北，塔影倒浸碧波，古巨野八景梵塔朝晖即此。；麒麟台/麒麟冢（省保·春秋西狩获麟处）：麒麟镇陈胡庄村东，一座商周堌堆隆起田畴间，台上古台基犹存，明嘉靖进士张九叙斗书麒麟冢碑、明天启重修瑞麟寺功德碑立在冢前。鲁哀公十四年西狩获麟即此，孔子至此观麟绝笔春秋。；昌邑故城址（国保·西汉昌邑国都城）：县城南大谢集镇昌邑集一带，西汉山阳国、昌邑国都城，黄河多次决口，厚重泥沙将城深埋地下，地面仅存夯土城墙残段隐约可辨，城址上现居前昌邑、后昌邑等村。；金山秦王避暑洞（国保·西汉刘贺废崖墓）：县城东南金山南麓，人工劈山凿成的大型西汉崖墓，实为昌邑王刘贺营而未用的废冢，由明道、侧室、耳室、主室组成，凿山而成不用一砖一石，盛夏洞内阴凉如春，一脉清泉自石缝渗出悬流不断。金大定三年赐封大明禅院，洞口上方敕赐大明禅院六字刻石犹存，洞壁宋至民国摩崖题记四十余帧。1947年刘邓曾在此指挥羊山战役。；蚩尤墓：县城东北固堆庙村前，一丘隆起田畴，相传为上古蚩尤葬处。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e巨野文庙大成殿（国保·明洪武迁建）：县城文庙街北，明洪武十五年县丞吕让自城北水患处迁建今址，清康熙四十一年重建，一九四七年文庙大部被毁、唯此殿独存。殿建在一点四米高砖石台基上，通高近十四米，面阔五间、进深三间，重檐九脊歇山顶，翼角轻挑，绿瓦朱甍。殿周环立二十四根大型石柱，前檐八根深雕二龙戏珠、上缀浮云下着波涛，余柱浅浮雕缠枝花卉；殿内旧供清代景泰蓝五供祭器，红釉地缠枝牡丹莲纹，今藏县博物馆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《巨野县志》（清道光）：\u003cbr\u003e&quot;鲁哀公十四年春，西狩获麟。孔子曰&#x27;孰为来哉，孰为来哉&#x27;，反袂拭面，涕沾袍……遂绝笔于获麟。&quot;——《春秋》写到这里就停笔了，所以又叫《麟经》。\u003cbr\u003e▌巨野文庙管理员张老师：\u003cbr\u003e&quot;大成殿的斗拱是真家伙——每一组都有名字：一跳、二跳、耍头、令拱……明式做法，没有任何一根钉子，全靠榫卯咬合。我带过很多建筑系学生来量，说这在菏泽地区是独一份。&quot;\u003cbr\u003e▌金山景区导游小刘：\u003cbr\u003e&quot;刘贺当过27天皇帝就被霍光废了，回昌邑继续当王。他怕死后被盗，在金山的悬崖上凿了个墓——就是这个避暑洞。为什么叫秦王避暑？因为金大定三年皇帝赐封后，老百姓觉得&#x27;大明禅院&#x27;不如&#x27;秦王避暑&#x27;好记，就这么叫下来了。&quot;\u003cbr\u003e▌永丰塔下卖酒的李老头：\u003cbr\u003e&quot;我家酒厂在永丰泉旁边50年了——这泉水酿的酒，喝了不头疼。老辈人说塔下有泉，泉下有龙，龙吐水出来酿酒——半真半假，但这水确实好。&quot;\u003c/p\u003e"}, {"n": "单县老县城·牌坊城", "s": "单县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e明代始建县城，万历年间以砖包城。清代屡修屡圮。乾隆三十年（1765）立百寿坊（朱家节孝坊）。乾隆四十三年（1778）立百狮坊（张家节孝坊，比百寿坊晚13年，两坊相对成&quot;姊妹坊&quot;）。1950年代城墙大部拆除。2013年百狮坊+百寿坊列为第七批全国重点文物保护单位。现状：两坊完整，朱家楼院（省保）尚存两处楼院，老县城街巷格局依稀。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e单县老城里两座乾隆年间的青石牌坊相隔不足百米，一座立在牌坊街中段，一座立在胜利北街路口，八根夹柱上石狮子攀卧嬉闹、额枋上百个篆体寿字绕柱回舞；朱家大院磨砖合瓦的东西两院缩在老城一角，沿石板路可一一走近。\u003c/p\u003e\u003cp class=\"main-text\"\u003e百狮坊（国保·清乾隆四十三年·天下第一坊）：牌坊街中段，青石仿木全石结构，四柱三间五楼式，高近十四米、宽九米，歇山顶。正间单檐、次间重檐，正间楼檐下六垛斗拱，次间上下楼檐各三垛斗拱，皆青石剔出。八根夹柱石上透雕一百零八只石狮，大狮雄踞昂首，小狮攀腹滚球，各各不同；正间额枋串枝牡丹、次间龙凤缠枝。清乾隆四十三年为张蒲妻朱氏建，俗称张家牌坊，素有天下第一坊之誉。；百寿坊（国保·清乾隆三十年·天下第一龙坊）：胜利北街，距百狮坊不足百米，以青色鱼子状石灰岩筑成，四柱三间五楼式，高约十三米、宽八米。前后正间枋心环雕百个篆体寿字，钟鼎石鼓大小篆各各相异，如一部篆书字典绕柱回舞；坊座八头雄狮分列，八条出水五爪蛟龙盘柱而上，民间石坊雕五爪真龙绝无仅有。清乾隆三十年为朱叔琪妻孔氏建，因坊主娶曲阜孔氏、经奏准特许雕龙，正上匾敕褒节孝。；朱家楼院（省保·明末清初·单县民俗博物馆）：老县城内朱氏故宅，明末清初历十代扩建，鼎盛时连片院落占老城近五分之一，历经战火今存东西两院，磨砖对缝合瓦，檐下雀替雕花，东蝴蝶厅花鸟盘龙依稀可辨。2011年修缮辟为单县民俗博物馆。；单县羊肉汤地标：老县城内街巷间数十家羊肉汤馆林立，奶白汤色滚沸，单县羊肉汤为山东非遗，传单县籍武将在京任职时带入宫廷，有中华第一汤之誉。；张堌堆遗址（省级文保·新石器时代至汉）：县城园艺街道幵山公园内，南北长一百一十五米、东西宽一百一十八米、高约五米，总面积一万三千五百七十平方米，苍松翠柏掩映，小径石阶盘绕。遗址包含龙山文化、岳石文化、商代、周代等时期遗存，曾出土带有单父字样的陶片，与秦置单父县记载吻合。；周自齐故居：牌坊街北侧牌坊广场北，四合院布局，房屋十一间，占地三百二十平方米，灰砖青瓦，院内陈列周自齐生平事迹。周自齐为清华学堂创始人，1922年任北洋政府国务总理兼教育总长并摄政大总统，故居2011年复建。；湖西人民会议厅旧址（省级文保·1950年）：老县城内，建筑面积七百五十六平方米，砖木结构，为1950年湖西专署召开人民代表大会之所，2011年修缮布展为红色教育基地。；单县明代护城河（县级文保）：老县城四周，明代开凿的护城河河道今仍断续可见，部分河段已整治为环城水系。明洪武年间筑单县城时开凿，历经明清至今河道走向未变。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《单县志》（清道光）：\u003cbr\u003e&quot;单县建坊百余座，宋至清末皆有之。上世纪五十年代初尚存34座。百狮坊、百寿坊，一雕百狮一雕百寿，相距不足百米，为天下奇观。&quot;\u003cbr\u003e▌百狮坊老石匠孙师傅（78岁，家传石雕6代）：\u003cbr\u003e&quot;造百狮坊时没有吊车，是用堆土法——修多高堆多高的土山，把石料滚上去，修完再把土清走。造石狮子最难的是那5个小狮，每个都不一样。我爹说，他年轻时还见过造坊的老工匠后代，人家说&#x27;每雕完一只小狮，就要在石头上刻一个小记号——不然雕了50只以后自己就记混了&#x27;。&quot;\u003cbr\u003e▌单县老教师郭敏：\u003cbr\u003e&quot;我小时候从牌坊底下钻过去，百狮坊的石狮爪子上还挂着红布条——听老辈说，清朝时有小孩从石狮上掉下来摔伤，后来就不让爬了。百寿坊的寿字我数过，真有100个，每个都不一样——有钟鼎文、石鼓文、小篆、大篆，像是把一本篆书字典都刻上去了。&quot;\u003cbr\u003e▌朱家大院看门大爷：\u003cbr\u003e&quot;原来的朱家大院，从牌坊街到东关，占了县城一半地。我小时候听老辈说朱家是单县八大家之首，&#x27;出城巡游数百里，车不轧外姓田，靴不沾他姓泥&#x27;。现在只剩这两处楼院了——20多院剩2院，我守了10年，看着它从杂草堆变成博物馆。&quot;\u003c/p\u003e"}, {"n": "金乡老县城·有缗国", "s": "金乡", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e夏代有缗国故城（卜集镇缗城堌堆），龙山文化至商至周至汉至唐文化层层叠压。秦置东缗县，治所在今嘉祥阿城铺村（旧金乡故城）。西晋泰始元年（265）金乡县治从阿城移至今金乡县城。明弘治十六年（1503）修县城，周长七里三十步，根阔一丈七尺，顶阔五尺，四门：东作/西成/南薰/北拱。明万历六年（1578-七年1579）大修砖城——烧砖百余万块，城垣增阔增高院增六尺，四门外加瓮城。明天启二年（1622）地震+民变围攻，抢修城防。1940年代县城砖石结构完整，西门外十字大街（清真街、南店子街）最繁华。1947年西、北、东门被土石堵塞，仅南门放行。1950年代城墙拆除。现状：缗城堌堆、羊山汉墓群、文峰塔、文庙大成殿尚存，仓房街、东秦街等传统街巷格局可辨。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e金乡地处鲁西南平原，夏代有缗国的堌堆台地散在卜集镇田间，羊山镇周围平野上叠压着成片汉墓；县城中心一座唐塔立在奎星湖畔，文庙大成殿、泮池、棂星门沿一条中轴线排开，格局未散。\u003c/p\u003e\u003cp class=\"main-text\"\u003e缗城堌堆（有缗国故城·省保）：卜集镇东门屯村，一座夏商周汉唐七层文化叠压的堌堆型古城址，土台隆起田畴，考古出土陶鼎鬲豆、五铢钱、筒瓦板瓦。有缗氏为大禹治水后轴心方国，夏王相之后后缗即出此国。；羊山汉墓群（省保·山东最大汉墓群之一）：羊山镇周围平野，两万余座汉墓层层叠叠星罗棋布，多为单室双室平民墓，间以汉代将军墓，葛山一带明清石马石羊石翁仲尚立。1947年刘邓在此发起羊山战役，羊山主峰建有鲁西南战役纪念馆。；文峰塔（光善寺塔·国保·唐贞观四年）：县城中心奎星湖畔，石台八角底座上砖砌九层楼阁式塔身，通高约四十九米，塔顶铸铁质葫芦形塔刹直指苍穹。每层檐下施双层砖砌斗拱，东西南北各砌一拱形券门，一层北门旋梯可盘上顶层；三层南门内嵌唐代石刻三佛造像，五层壁面浮雕小佛。一九三八年遭日军炮火轰去最上三层，一九九九年按原状修复，今塔影倒映湖面，为县城千年地标。；金乡文庙（省保·格局完整）：县城中心，唐开元始建，今存大成殿五楹、东西庑各十一楹、戟门、泮池、棂星门、青云桥，千古道源坊沿一条中轴线次第排开。青云桥横跨旧寿河，今河水汇成奎星湖；泮池一圈青石栏绕水，池上石面被五百年脚步踩得发亮。大成殿梁上墨书万历八年重修字样犹可辨，是菏泽一带格局最完整的县学文庙。；仓房街、东秦街（明清古街巷）：县城内保留的传统街巷，青石板路蜿蜒，两侧民国商铺门板、柜台格局尚存。；金谷（中华四大名米之一）：马庙镇一带所产金谷，康熙间为贡米，齐头占金谷穗齐粒圆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《金乡县志》（清康熙）：\u003cbr\u003e&quot;明万历六年修城，计地输柴烧砖百余万块，自二月讫于次年八月。城垣加阔，马车可并轨；女墙敌楼森然壮观，鲁邑雄镇。&quot;\u003cbr\u003e▌缗城堌堆考古队：\u003cbr\u003e&quot;堌堆高约10米，夯土层清晰可辨。在堌堆下1.5米处发现西周陶鬲残片——这说明夏代有缗国可能就建在堌堆之上，后来逐层叠加。当地人说&#x27;这堆土比县城还老&#x27;——确实，老了2000年。&quot;\u003cbr\u003e▌金乡文庙管理员老李：\u003cbr\u003e&quot;文庙大成殿是明代原物——梁上墨书&#x27;万历八年重修&#x27;清晰可见。泮池里种着荷花，每逢六月满池香。青云桥是明代原桥，桥面石头被踩得发亮——500年的脚步声都留在上面了。&quot;\u003c/p\u003e"}, {"n": "嘉祥老县城·曾子故里·武氏祠汉画像石", "s": "嘉祥", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e金皇统七年（1147）设嘉祥县，以山口镇为县城。金大定十五年（1175）再徙萌山之阳（今嘉祥县城址）。明正统十年（1445）重建曾子庙（南武山南麓）。明成化初，山东守臣上言：嘉祥南武山西南元寨山东麓有渔者陷入一穴中，得见悬棺，前有石碣曰&quot;曾参之墓&quot;——成化帝下旨修治。明正德二年（1507-九年1514），孝宗/武宗皇帝下诏扩修曾庙如颜孟庙制，历时7年。明嘉靖十八年（1539）授曾子59代孙曾质粹翰林院五经博士，世世承袭。清代屡修。1950年代城墙拆除。现状：曾翰博府、曾子琴堂、武氏祠汉画像石、南武城遗址夯土残垣尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e嘉祥地处鲁南泰沂余脉与平原交界，武翟山村北一对汉代石阙立在田头，阙下石狮张口怒目，四十六块画像石砌于室内壁间；南武山南麓曾子庙红墙环绕古柏参天，老城东南角曾翰博府门前御匾犹悬，沿山南公路可一路寻访。\u003c/p\u003e\u003cp class=\"main-text\"\u003e武氏祠汉画像石（国保·1961年第一批·东汉桓灵年间）：纸坊镇武翟山村北，全石结构墓地石刻，现存一对子母双阙、一对石狮、两方汉碑与四十六块画像石。双阙对称、间距四米余，为现存唯一一对完整汉代石质子母阙，西阙身正面镌建和元年题铭九十字；一对石狮张口怒目、昂首扭颈，是现存最早有确切年代的石狮。画像石以减地平面线刻凿成，物像外留细密平行凿纹，壁上浮起的帝王圣贤、忠臣孝子旁各有小字榜题。一七八六年为黄易访得，就地建屋将画像石砌于室内壁间，外缭石垣，遂成今日面貌。；曾子庙/曾庙（国保·明正德重修）：南武山南麓，红墙环绕，沿中轴线分中东西三路五进院落，殿庑七十余间。中路宗圣殿面阔七间重檐九脊歇山，殿门悬清世宗道传一贯巨匾，庙内古柏参天碑碣林立，宗圣殿前有乾隆御碑亭。；曾翰博府（曾氏翰林院五经博士府）：县城南隅，北面隔街对原县衙，大堂五间中悬清世宗御赐曾尚溶省身念祖匾额，抱厦三间，前坊一座影壁一座。自曾府立后，东颜西孟中曾三家世代同享五经博士待遇。；南武城遗址（春秋·济宁市保）：满硐乡南武山村东南，方形子午向，残存东城墙夯土层，夯窝圆形圜底为周代筑城特征，夯层中含西周晚期至春秋陶片，与曲阜鲁故城同期工艺相同。；曲阜颜孟三家并列：自嘉祥曾翰博府立后，东有颜庙，西有孟庙，中有曾府，三家世世代代同享五经博士待遇，地方官春秋二祭。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e曾子琴堂（城东北隅·金建明毁·琴台坑尚存）：萌山之阳，传为曾子鼓琴处，金泰和七年重建，穴地砌石台，南面九级石阶，堂前甘泉池名琴台坑。明嘉靖九年知县取石建泮宫桥堂遂毁，然琴台坑泉眼至今仍冒水。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌明《重建宗圣公庙记》（正统十一年许彬撰）：\u003cbr\u003e&quot;郕国宗圣公自有封谥以来，载在祀典，血食天下。而此庙则在故里南武城，旧为邑，即子游为宰处。在今兖州之西，嘉祥、金乡县界，庙南北去县各四十五里，南武山之阳。&quot;\u003cbr\u003e▌武氏祠考古学者：\u003cbr\u003e&quot;武氏祠是东汉武氏家族出资造的——武梁是从事、武开明是郡丞、武班是敦煌长史、武荣是执金吾丞。兄弟四人都是汉代中高层官员，攒钱给家族修墓造石刻。画像石旁有文字榜题，比如&#x27;武梁从事&#x27;四字——\u003cstrong class=\"hl\"\u003e汉代的简历直接刻在自己墓前\u003c/strong\u003e，这自信没谁了。&quot;\u003cbr\u003e▌曾翰博府后人曾大爷：\u003cbr\u003e&quot;我家是曾子的嫡传后代——从明朝嘉靖年间就世袭翰林院五经博士，管曾子祠墓的事。大堂上那块&#x27;省身念祖&#x27;是雍正皇帝亲笔写的。后来断了传承，但每年清明我们家还是要回曾庙上香——这祖宗牌位不能丢。&quot;\u003c/p\u003e"}, {"n": "曹县老城·商汤之都·景亳", "s": "曹县", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e商汤自契至成汤八迁都，最终定居于景亳（曹县）。商汤会三千诸侯于景山（曹县梁堌堆），灭夏建商。汤王在位30年死后葬于涂山之阳（曹县土山集）。盘庚曾居亳（景亳），恢复汤政。周初曹县属宋国（宋君为商汤后裔），把汤陵作为祖先宗邑祭祀。汉哀帝建平元年曾遣使祭祀汤陵。明弘治五年（1492）/嘉靖二十五年（1546）/万历九年（1581）多次重修汤陵庙。1967年山东省文保单位。现状：汤陵、伊尹墓、盘庚陵、莱朱墓、景山（梁堌堆）、莘冢集（有莘国遗址）尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e曹县地处黄河冲积平原，商汤景亳故地的土台丘垄散在阎店楼、大集、莘冢集之间，汤陵一垄封土隆起田畴，陵前明清石碑卧立；城东梁堌堆松柏环绕，沿田间土路可逐台寻访商代旧迹。\u003c/p\u003e\u003cp class=\"main-text\"\u003e景山/梁堌堆（商汤会诸侯处·省保）：县城东梁堌堆，龙山商周叠压文化层，土台隆起松柏环绕，出土商周陶片。商汤灭夏前在此会盟诸侯演兵，《商颂》陟彼景山松柏丸丸即此。；伊尹墓（商右相·省保）：县城东南大集镇殷庙村西北二百五十米，覆锅状封土高约一米半、径八米，南向，墓园近方形。墓前元圣祠存明清碑刻数通，碑身青石、字迹尚可辨认；殷庙村因伊尹祠得名，村名千年未改，西望汤陵方向正是古亳都畿。伊尹耕于莘野后任汤右相，沃丁以天子礼葬之。；盘庚陵（商中兴之主）：县城北燕陵村，一丘隆起，后人建盘庚祠纪念，盘庚曾一度回景亳推行汤政。；莘冢集（有莘国遗址·省保·伊尹耕莘处）：县城北莘冢集镇，龙山至商周叠压堌堆型遗址，有莘国旧地，伊尹曾在此耕稼，商汤娶有莘氏为妃。；曹县城明清遗址（明代城墙残段）：明代曹县城残垣可辨，城内有盘庚村、盘庚祠遗址。；汤陵异木、莘野春耘、景山夕翠：曹县明八景中三处与商汤有关，旧迹散在田野。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汤王陵（省保·商肇建之君·封土尚存）：阎店楼镇土山集村西，一垄封土南北长七十米、东西宽五十米，高仅一米有余，平铺在华北平原的麦田里。陵前旧有汤庙大殿，抗战中大殿塌毁、数百碑倒地，今存明清两代重修汤陵碑数通，半卧半立于土垄之前，碑面风蚀、字迹漫漶。商汤革夏命后葬涂山之阳，三千年过去，唯有这垄薄土与残碑可指。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·殷本纪》：\u003cbr\u003e&quot;成汤自契至汤八迁。汤始居亳，从先王居，作《帝诰》。——伊尹去汤适夏，既丑有夏，复归于亳。入自北门，遇汝鸠、汝方，作《汝鸠》《汝方》。&quot;\u003cbr\u003e▌王国维《观堂集林·说亳》：\u003cbr\u003e&quot;商汤之都亳，为汉之薄县，即今山东曹县南二十余里。左丘明、司马迁、班固、傅瓒、杜预、伏滔皆持此说。&quot;\u003cbr\u003e▌曹县文保干部老王：\u003cbr\u003e&quot;汤王陵封土南北70米——这是商王墓的标准规制。我们1967年立文保碑时，墓前还有明清两代的碑——共5块，现在只剩3块完整的，两块裂了。汤庙大殿毁了两次——民国战乱一次，黄河洪水一次。遗址夯土还在，每年清明还有人来上香。&quot;\u003cbr\u003e▌莘冢集老农民张大爷（76岁）：\u003cbr\u003e&quot;我家地就在莘冢集堌堆边上——小时候挖土豆经常能挖到陶片，碎陶片上有绳纹——老人说这是&#x27;伊尹耕田时用的碗&#x27;，我不敢信也不敢扔，捡回家放窗台上了。&quot;\u003c/p\u003e"}, {"n": "峄城老城·三城叠压", "s": "峄城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e汉承县：西汉置承县，城周约二千五百米长、约一千米宽。金兴定年间（1221-1223）：王宣在仙坛山南麓建峄州城——周约3500米，西墙紧依承水，北墙在峄城北关外300米。元至元二年（1265）：省兰陵县入峄州，峄州版图扩大。元末：徐达、常遇春北伐&quot;三打峄州&quot;——峄州城夷为平地。明洪武二年（1369）：降峄州为峄县，知县乐徽在峄州城西南隅筑新县治——\u003cstrong class=\"hl\"\u003e三座城叠压格局就此形成\u003c/strong\u003e。成化二十二年（1486）：知县毛凤鸣将土城整建为石头城——内外壁面长条块石砌垒，中间填夯土、毛石、豆汁白灰麻刀。乾隆四十三年至四十九年（1778-1784）：知县张玉树重修城垣、文庙、乡贤祠。清后期/民国：\u003cstrong class=\"hl\"\u003e城毁于兵燹，仅余城西北临河一段矮墙\u003c/strong\u003e，西门相对完整。1949年后：拆城建房、&quot;文革&quot;破四旧，城墙几乎荡平，仅余西门。2013年：峄县西城门列为区级文保单位。2016年：峄城区文广新局修复西门南墙，用青砖补垛子——试开放。现状：峄县西门（迎恩门）经局部修复对外开放，汉承县西北角残土墙尚存，城内地下三城叠压。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e峄城地下叠压三座城池——汉承县、金峄州、明峄县，今唯明峄县西门一段青砖门洞立在原址，2016年补砌垛口面向公众；西门外承水河上孺子桥条石今多淤埋于市场之下，汉承县夯土墙仅西北角一段黄土残段露在河畔。\u003c/p\u003e\u003cp class=\"main-text\"\u003e孺子桥（西门外驿道桥·明代遗存）：西门外横跨承水河，大青石砌成元宝形桥身，长近九十米，十二孔中三孔为半截旱孔。明弘治九年重建，桥头原有石狮两对文革中被砸；上世纪八十年代河道取弯改直，古桥被淤埋于农贸市场之下，今仅残基一段可指认，冬春河面水汽缥缈，即古峄八景承水环烟。；汉承县故城残墙（省保·西汉城址）：峄城西一里紧靠承水河畔，城址四周墙基已夷为平地，仅西北角残存一段黄土夯筑土墙，夯土层中曾挖出汉代陶罐、五铢钱，为鲁南最早县级城垣之一。；仙坛山（古峄州城靠山·仙坛晓翠）：金峄州城北天然屏障，山顶旧有玉皇祠、元代玄真观，山下承水河环绕，承水环烟为峄县八景之首。；峄城基督教堂（省保·1911年）：坛山街道南关街，美国基督教会宣统三年始建、次年竣工，砖石结构西式教堂，南北长二十余米，与院内同期方楼、铁楼并立。鲁南现存较早的近代教会建筑，2013年与方楼、铁楼同列省保。；青檀寺（省保·唐开元）：榴园镇王府山村西北峡谷中，原名云峰寺，唐开元间建，因谷中青檀密布而易名。现存大殿及1985年重修之岳飞养眼楼，楼内塑岳飞坐像；峡谷两侧山岩石缝间遍布千年古檀，青檀秋色旧为峄县名景。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e峄县西门（迎恩门·区级文保·2016年修复）：老城西门，明洪武二年降州为县筑土城，成化二十二年知县毛凤鸣改建石头城——内外壁以长条块石砌垒，中间填夯土、毛石，浇豆汁、白灰、麻刀，复合墙体六百年未散。西门青砖灰瓦门洞面向承水河，门洞旧为处斩罪犯所经；二〇一六年文广新局对南墙十来米残段加固，用老青砖补砌垛口，糯米灰浆勾缝，为峄城现存唯一城门。；贾三近故居（明代文豪）：峄城牌坊街社区，明隆庆进士贾三近主编首部《峄县志》，故居三进院落青砖灰瓦，门楣旧题光禄第，文革中被毁仅存门楼残基。；匡衡墓（省保·汉）：榴园镇贾庄村北，一垄高大封土高约四米、径三十五米，墓区遍植槐柏青檀。文革时封土南部被人挖下一坑、深两米余，未及墓室，今坑痕犹在、草木已合。墓南旧有匡衡祠，清乾隆四十年峄县令张玉树重建，文革中祠毁，今唯存张玉树亲题汉丞相乐安侯匡衡之墓碑一座。凿壁偷光典故即出于此，建昭三年拜相封乐安侯。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌峄城区文保所老赵：\u003cbr\u003e&quot;峄城地下埋着三座城——汉代的在西、金代的在中、明代的在东，叠压在一起。我们2018年搞基建时，在牌坊街打地基，挖到3米深时发现了金代峄州城的夯土墙基——直径1米左右，夯土层每层20厘米。再往下挖，居然挖到了汉代的陶排水管道，完整的，一节一节扣在一起。&quot;\u003cbr\u003e▌峄城西门守夜人张大爷（72岁）：\u003cbr\u003e&quot;我守西门5年了——每天早上开门，晚上关门。游客不多，大多是老头老太太遛弯的。2016年修城墙时，县文保所找的都是当地老石匠——用的还是传统的&#x27;糯米灰浆&#x27;，不是现在的水泥。我亲眼看着老石匠把凿好的条石一块一块砌上去，缝里塞的是麻刀和细沙——600年前我祖辈就是这么砌的。&quot;\u003cbr\u003e▌牌坊街老住户王奶奶（81岁）：\u003cbr\u003e&quot;我家就在牌坊街——原来街上有三座跨道石坊，文革时被推倒当了建材。我爷爷当年亲眼见贾三近的后代把《金瓶梅》手稿捐给了北京——说是祖传的，不敢留。后来听说北京的专家说是假的，我爷爷气得三天没吃饭。&quot;\u003c/p\u003e"}, {"n": "微山夏镇·运河名镇", "s": "夏镇", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦代：置广戚县——今夏镇戚城。南北朝：废广戚县并入留县——戚城城垣尚存，但繁华消退。明嘉靖末：新开漕运新渠（南阳至留城141里）——夏村（夏镇原名）成为沿运码头。明隆庆三年（1569）：夏村改村为镇，工部、户部分司自沽头城移驻。明万历十六年（1588）：筑土城，建四门楼——东&quot;见泰&quot;（后改&quot;安澜&quot;）、西&quot;瞻华&quot;、南&quot;延庆&quot;、北&quot;拱极&quot;。清顺治十五年（1658）-十八年（1661）：\u003cstrong class=\"hl\"\u003e改建为砖城\u003c/strong\u003e——城为梯形，周长九百余丈，高二丈五尺，雉堞千余，因常驻护河兵又名&quot;部城&quot;。清康熙七年（1668）：郯城8.5级大地震波及——\u003cstrong class=\"hl\"\u003e部城四门楼皆倒塌，城内房屋多毁，商贾东迁运河东岸\u003c/strong\u003e。清咸丰元年（1851）：黄河蟠龙集决口，沛县栖山一带淤没——沛县县城自栖山迁夏镇东寨，历经11年。咸丰二年（1852）：东寨筑土圩——因西以运河为障，仅三面筑墙，建三门楼（东&quot;同德&quot;、南门、北门）。清末：夏镇形成戚城（西北·滕县辖）、部城（西南·沛县辖）、夏镇寨（东·两县分治）三合一格局——&quot;一部两省三座庙，一条大街两县分&quot;。1949年后：拆城建房，城墙陆续荡平。现状：老运河（漕运新渠故道）5.8公里活水段、三绝碑（省文保）、顺河街/月河圈/三孔桥、泰山庙（碧霞宫）遗迹尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e夏镇由戚城、部城、东寨三片叠压而成，老运河自西北向东南穿镇蜿蜒，两岸垂柳拂水；运河西岸皇华亭中一通螭首龟趺高碑立着，顺河街、月河圈老街沿半月形河道弧形展开，一镇跨苏鲁两省。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老运河（漕运新渠故道·世界文化遗产延伸段）：明隆庆元年工部尚书朱衡主持开凿，北起南阳闸经夏镇南至留城，夏镇段保留数公里活水河道。河道自西北向东南穿镇蜿蜒，两岸垂柳拂水，咸丰元年黄河决口淤塞旧道后不再漕运，今作城市景观河，顺河街、月河圈老街沿半月形河道弧形展开，青石条驳岸隐在柳下。；夏镇闸（明代漕运节制闸）：老运河上，明隆庆间朱衡主持建石制节制闸，上世纪三十年代仍在用，建国后改建为公路桥一部分。；顺河街、月河圈、三孔桥（运河老街）：顺河街原名运河涯，运河西岸码头街巷，粮行布店药铺银匠铺鳞次栉比；月河圈为清乾隆疏河时挖得的半月形泊船河道，居民绕河弧形而居；三孔桥为清嘉庆二十三年三孔石桥横跨运河。；姜肱故里碑（汉代名士）：碑刻篆书汉姜肱故里五大字，姜肱为东汉名士，与弟同被而眠，姜被成为兄弟友爱典故。；部城遗址（市保·明隆庆）：夏镇街道部城东村、部城西村一带，明隆庆三年工部主事杨信于夏村原址筑城，城内驻工部漕运衙门，故名部城。今地面建筑早已无存，田野间散落陶片瓦砾，唯部城二字仍作村名。；吕公堂春秋阁（市保·清乾隆）：夏镇街道部城东村，吕公堂明代已有，清代作徽商会馆，现存春秋阁一座两层砖木楼阁，清乾隆间建，距今二百六十余年，门口墙上嵌乾隆年间古碑两通。；官口隋唐佛教遗址（市保）：夏镇大官口村北薛河故道，1995年村民挖沙出土隋大业二年造像碑一通，碑高一点五米，上半部开龛浮雕三尊佛像，主佛结跏坐须弥座、二菩萨赤足立莲蓬上；河底另出唐开元年间碑四通及小石塔、石佛、须弥座六十余件，知薛河南岸旧有伽蓝寺。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e三绝碑（漕运新渠记碑·省文保）：夏镇运河西岸皇华亭中，螭首龟趺，通高六米、宽两米，石龟趺体量硕大，单龟头即可容四人围坐。明嘉靖四十四年吏部尚书徐阶撰文、江南书法名家周天球书丹、名石匠吴鼐刻石，撰、书、刻三绝，人称明碑第一。碑原立玄帝庙皇华亭内，文革时被砸裂、亭亦毁，八十年代修复重立，今临运河而立。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌微山县志办退休干部王建国：\u003cbr\u003e&quot;1980年修县志时，我在夏镇老街走访了三个月——一位姓赵的老太太告诉我：她1948年刚嫁到夏镇时，运河东岸的顺河街还能通船——夏天河里到处是荷花，小孩在水里摸莲蓬。后来泇河主运道改线，这条河就不通船了。现在河两边盖了住宅楼，河里种了荷花，每年夏天还有不少人来拍照。&quot;\u003cbr\u003e▌三孔桥附近老住户张大爷（74岁）：\u003cbr\u003e&quot;三孔桥是嘉庆年间造的——石头块一块挨一块，没用水泥没用灰，就是&#x27;卯榫&#x27;接起来的。我爷爷说，造桥时石料从微山湖上船运过来，一块石头要10个壮劳力抬。现在桥面上铺了沥青，桥墩还是原来的石头——600年了，一块石头都没掉。&quot;\u003cbr\u003e▌夏镇老船夫老李（70岁）：\u003cbr\u003e&quot;我爹是运河上的老船工——给漕船拉纤的。他说，夏镇泰山庙会是运河上最热闹的——四月十五到十八，碧霞元君出巡，队伍有几千人，銮驾、卫队、八仙、僧侣……光唱戏的戏台就搭了5座。那时候运河上的船连起来能排5里长——南北的客商全来逛庙会，卖粮的、卖布的、卖银器的……&quot;\u003c/p\u003e"}, {"n": "郓城老城·水浒故里·好汉七十二", "s": "郓城", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e鲁成公四年（前587）：\u003cstrong class=\"hl\"\u003e鲁国筑城名郓\u003c/strong\u003e——郓城得名之始，近2600年。南北朝至唐贞观八年（634）：郓州治所驻\u003cstrong class=\"hl\"\u003e旧县城\u003c/strong\u003e（今城东张营乡张营村）——740余年。隋开皇十年至唐贞观八年（590-634）：郓州设总管府、都督府，统郓、濮、兖、戴、曹5州30县。唐贞观八年（634）：郓州治徙须昌（今东平）。金大定六年（1166）：\u003cstrong class=\"hl\"\u003e黄河泛滥，旧县城沦没\u003c/strong\u003e，徙盘沟村建新县城——即今郓城老城。金大定六年（1166）至今：县城位置稳定——\u003cstrong class=\"hl\"\u003e850年未挪\u003c/strong\u003e。清末民初：城墙设四门（南迎薰、东通济、北拱极、西安澜），四隅炮楼，东城墙南段魁星楼。城内18条街巷：育贤街、文献街、武安街、英贤街、平政街、油坊街、指南巷、豆腐巷等。1939年：动乱波及郓城——\u003cstrong class=\"hl\"\u003e城墙遭严重破坏\u003c/strong\u003e。1946年：郓城县民主政府为防国民党据城固守——\u003cstrong class=\"hl\"\u003e组织民工将城垣、城楼、炮楼拆除，只剩城墙根\u003c/strong\u003e。1947年：国民党五十五师再踞郓城，筑城墙+碉堡——同年刘邓大军攻克，城垣碉堡全拆。1949年后：县城向四周扩展——60-70年代向南，80年代向西西北。现状：水浒好汉城（4A）、郓城文庙（明代）、七级唐塔（五代）、宋江武校、县城东门街/西门街/金河路/唐塔路等街巷名沿用至今。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e郓城老城坐落在鲁西南平原，五代唐塔残立在唐塔公园绿树间，塔顶残破如官帽；水浒好汉城把晋陕浙皖的明清木构整体搬迁围合，文庙大成殿红脊碧瓦嵌在城内东南隅，宋江武校的刀枪棍棒声响沿街可闻。\u003c/p\u003e\u003cp class=\"main-text\"\u003e水浒好汉城（4A景区·整体搬迁明清建筑群）：县城西门街，整体搬迁晋陕浙皖元明清民间建筑围合而成，内有晁家庄城堡庄园、郓城县衙、宋江武馆、孙二娘客栈、乌龙院、及时雨茶楼，北方四合院与浙派徽派木构荟萃。；宋江武校（全国十大武校之首）：县城水浒路西段，狗娃艺术团《狗娃闹春》曾上央视春晚，重两百余斤的状元大刀悬在校场，师生以能举此刀为荣，校址与水浒好汉城一体。；武状元祠（省级文保·清光绪年间扩建）：县城西北二十五公里张鲁集镇状元张楼村中心街北端，三进院落，由影壁、大门、过厅、正殿及东西厢房组成，大门面阔三间，两根明柱撑起前廊，上置日月窗，门前左右石狮一对，青瓦覆顶五脊六兽。清光绪十六年张宪周钦点武状元后，在原张氏家祠基础上扩建，为山东最后一名武状元家祠。；万人堌堆义军公墓（省级文保·明代）：县城武安镇飞集村东南，堌堆高约六米，封土隆起于田野间，为明徐鸿儒起义军部将聚葬之地。明天启年间徐鸿儒率白莲教起义，兵败后部将聚葬于此。；肖堌堆遗址（市级文保·新石器时代）：肖堌堆村，堌堆高出地表数米，面积约数千平方米，地表散落大汶口文化时期夹砂红陶片、灰陶片，曾出土石斧、骨器。六千年前大汶口文化时期先民聚居遗址。；鲁西南战役指挥部旧址（省级文保·1947年）：县城内，青砖灰瓦四合院，1947年刘邓大军在此指挥鲁西南战役，今辟为纪念馆，为全国爱国主义教育示范基地。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郓城文庙大成殿（省文保·明代）：老城内东南隅，明洪武九年重建，下石柱木柱支撑，上双层飞檐楼阁，红脊碧瓦风铃铮铮。1947年拆城时百姓保护下来，今为水浒好汉城核心建筑，明伦堂与大成殿内展水浒人物故事。；七级唐塔（观音寺塔·国保·五代后唐）：老城内东北隅胜利街北段，全砖结构八棱四门楼阁式塔，五代后唐长兴二年建。东西南北四面各开一券门，其余四面隐出砖雕假窗，塔檐全由层层砖斗拱叠出。原七级，黄河数度决口淤没下层、又经地震毁顶，今地表残存四级、通高约三十二米，清末塔顶塌成官帽状，故又称荒塔、幞头塔。塔上自古栖居云燕，春日绕塔飞鸣，荒塔云燕为古郓城一景。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郓城水浒研究会李会长：\u003cbr\u003e&quot;我研究水浒30年了——水浒里晁盖、宋江、吴用、李逵的故事，很多真的发生在郓城。\u003cstrong class=\"hl\"\u003e宋江家乡在水堡镇\u003c/strong\u003e——水堡镇原名宋家庄，宋江起义后改名&#x27;宋保义&#x27;，后改水堡。现在还有宋江井、宋江祖坟。\u003cstrong class=\"hl\"\u003e黄泥冈在郓城县黄泥冈镇\u003c/strong\u003e——当年晁盖等人劫生辰纲的地方，现在还有&#x27;黄泥冈遗址&#x27;碑。施耐庵当年写《水浒传》，很多细节都是从郓城老人们那里听来的。&quot;\u003cbr\u003e▌晁家庄管理员小张（28岁）：\u003cbr\u003e&quot;我每天在晁家庄里转——这个庄园是2008年从山西晋南搬迁过来的，城堡式结构，有暗道有迷宫。\u003cstrong class=\"hl\"\u003e2016年有个游客是山西祁县人，说他家祖上就是这座庄园的主人\u003c/strong\u003e——族谱上说庄园被卖了，但不知道卖到哪儿。他找到晁家庄，跪在庄园门口哭了半小时。我们听了都心酸——一座老宅子，承载的是两家人几百年的记忆。&quot;\u003cbr\u003e▌水堡镇宋江村老支书：\u003cbr\u003e&quot;宋江村全村300多户，姓宋的占70%——族谱上明确写着&#x27;起义军首领宋江后裔&#x27;。\u003cstrong class=\"hl\"\u003e每年清明，海内外宋氏后人组团来祭祖\u003c/strong\u003e——从美国、加拿大、台湾来的都有，每次一两百人。宋江井是村里的宝贝——据说宋江当年就是喝这口井水长大的。文革时红卫兵要填井，全村老人手拉手围着井不让填。&quot;\u003c/p\u003e"}, {"n": "梁山老城·宋江寨·会通河起点", "s": "梁山", "p": "山东", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉：梁山原名良山——汉梁孝王北猎良山，因改为梁山。隋大业四年（608）：隋炀帝开永济渠——东征高丽。东晋太和四年（369）：桓温北伐，开挖桓公沟——沟通泗水、汶水与济水，奠定济州河基础。元至元二十年（1283）：济州河挖通——济宁鲁桥至梁山小安山西南码头，全长75公里。\u003cstrong class=\"hl\"\u003e元至元二十六年（1289）：会通河开挖\u003c/strong\u003e——寿张县尹韩仲晖、边源建议，自码头为起点分梁山泺水源，经寿张、聊城125公里至临清会御河。\u003cstrong class=\"hl\"\u003e元世祖忽必烈赐名&quot;会通河&quot;\u003c/strong\u003e——\u003cstrong class=\"hl\"\u003e比隋唐大运河缩短900公里\u003c/strong\u003e，修通后北调南粮占全国税粮5/6。元至正年间：济州河与会通河衔接——码头村成为运河枢纽。明永乐九年（14
