<script>
const DATA = [{"n": "萧县老县城", "s": "萧县", "p": "安徽", "w": "皇藏峪刘邦避难·天门寺孔子晒书台·白土寨项羽驻军刘邦彭城兵败后藏身皇藏峪，蜘蛛结网巨石挡洞躲过项羽追兵。天门寺旁有孔子晒书台、砚墨池。白土镇萧窑（唐宋）烧窑，窑火绵延百里。", "h": "\u003cp class=\"main-text\"\u003e秦属泗水郡。汉属彭城郡。明万历年间筑砖城。1950年代城墙拆。现状：城墙遗址2026年第四次文物普查新发现（交通路以北龙山路以西龙凤大道以南花园街以东）。皇藏峪国家森林公园（4A）、天门寺、瑞云寺、萧窑遗址保存。&quot;蜘蛛结网救汉王，巨石挡洞躲项王&quot;——公元前205年彭城之战刘邦败逃皇藏峪，蜘蛛在洞前结网、巨石滑到洞口，项羽追兵以为洞无人迹撤去。&quot;皇藏峪原名黄桑峪，以峪内多黄桑树得名。&quot;。&quot;孔子晒书台上还有石台，砚墨池的水还在——2500年前的痕迹，现在还能摸到。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e皇藏峪（国家4A·96%森林覆盖率）：原名黄桑峪，因峪内长满黄桑树。公元前205年彭城之战刘邦兵败藏身于此，蜘蛛结网、巨石挡洞躲过项羽追兵——&quot;皇藏&quot;之名始此。有72处景点：皇藏洞、三仙洞、拔剑泉（刘邦拔剑得泉）、马扒泉（战马扒地得泉）、仙人床、瑞云寺（南朝梁大同年间建）、苏轼祈雪处、闵子祠。；天门寺（元至正年间建）：天门山双峰壁立如天门，孔经此讲学留晒书台、砚墨池、洗砚泉、飞来佛、蚂虾泉。明宣德四年知州杨秘重建改名&quot;天门禅院&quot;。现有殿堂20余间，缅甸玉佛6尊、各种佛像40余尊。；白土寨遗址（项羽驻军地）：白土镇白土寨村南部，夯土残垣还在。元末红巾军、明末义军均曾驻守。萧窑（唐宋）烧窑，窑火绵延百里，明清贡砖产地。；萧县民治古街巷：明清-近现代，民治街中段保留。；明代砖城城墙（遗址尚存）；萧窑大部分窑址（仅存遗址）。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌萧县民谚：\u003cbr\u003e▌《萧县志》（明万历）：\u003cbr\u003e▌天门寺游客（2026）：\u003c/p\u003e"}, {"n": "砀山老县城·凤城", "s": "砀山", "p": "安徽", "w": "内方外圆城·黄河27次改道·燕喜台李白饮·百万亩梨园都围着老城城是方的护城河是圆的——&quot;内方外圆&quot;独一份。明万历二十六年（1598）黄河淹城，全城人&quot;抱木登屋，有不食死者遂相食&quot;，迁城于虞山（今址）。此后268年间黄河流经砀境130次，重大决溢数十次。燕喜台是李白宴饮处（唐天宝年李白游砀山宴嬉于台），梨园百万亩环绕古城，吉尼斯纪录认定的世界最大连片果园就在这里。", "h": "\u003cp class=\"main-text\"\u003e秦置砀郡，郡城在芒砀山西麓（今永城芒山镇）。金世宗大定六年（1166）黄河决口，砀城县治迁至虞山（今砀山县城址），此后800余年城址未动。明万历二十六年（1598）春大饥、夏疾疫，秋黄河决口淹没砀城，官民被迫迁徙。万历三十一年（1603）黄河决口朱家旺口，改道城南。万历三十四年（1606）大水，再改道城北。崇祯十四年（1641），砀山原有29393人，水患、饥馑、瘟疫、盗贼接踵而至，最终仅存6327人。现状：护城河（圆形）仍完整环绕老城区，城墙残垣可摸，燕喜台遗址、清真寺、文庙尚存。明代新城城门  现状。东门（望华）  全毁。南门（永固）  全毁。西门（来安）  全毁。北门（拱极）  全毁。护城河      圆形完整，全长约4公里，平均宽20米。&quot;万历二十六年秋，黄水入砀城，官民抱木登屋，有不食死者遂相食。二十九年始复故址。民存者十之一。&quot;。&quot;我爷爷说，民国时老城墙还能跑马车，后来拆砖盖学校、盖供销社，一块不剩。但护城河没拆，水还在淌，鱼还在游——这是砀城剩下的唯一圈住我们的东西。&quot;。&quot;我家种梨五辈人，老梨树就在古城墙根下。砀山梨能卖到东南亚，全靠这沙壤土、这黄河水。城里人都说我们砀山有三宝：墙圆、梨甜、燕喜台有诗仙。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城护城河（完整环城圆形护城河·全国罕见）：全长约4公里，平均宽度20米，历经800年仍完整围绕老城区。清代县志载&quot;城方池圆&quot;，护城河至今仍调节小气候、美化环境。；燕喜台（又名宴嬉台·唐代李白饮处）：唐天宝年间李白游砀山，县令刘砀于台上设宴款待，李白赋诗&quot;燕喜台边春水流&quot;。现存台基为清代遗址，台周石碑数通。；砀山清真寺（明代）：始建于明万历年间，位于老城区西南隅，占地约2亩，礼拜大殿为卷棚顶三开间，斗拱飞檐，是皖北保存较好的明代清真寺。；百年梨树王（砀山酥梨原产地核心地标）：良梨镇侯楼村，树龄约300年，树干直径约0.8米，每年仍挂果300-500斤。吉尼斯纪录认定砀山为世界最大连片果园——百万亩梨园环绕古城。；黄河故道（百里古黄河横卧其间）：森林覆盖率达70%，明代黄河改道遗迹清晰可辨。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e砀山县文庙（明代）：始建于明万历年间，民国年间改为学校，现存大成殿主体。清乾隆《砀山县志》载&quot;文庙坐北朝南，棂星门、泮池、泮桥、戟门、大成殿、明伦堂依此排布&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《砀山县志》（清乾隆三十五年）：\u003cbr\u003e▌砀山老教师张鹤龄：\u003cbr\u003e▌砀山酥梨非遗传承人李怀珍：\u003c/p\u003e"}, {"n": "蒙城老县城·漆园", "s": "蒙城", "p": "安徽", "w": "庄子漆园吏·万佛塔宋建10年·文庙青云街·南华门烟火里庄子做漆园吏的地方——漆园就是蒙城的前身。万佛塔造了10年（宋崇宁元年到五年，每层有碑记哪年造的），全国重点文保。北大街历史街区7.53公顷省级文保，青云街一头连文庙棂星门一头连万佛塔——赶考学子拜完圣从这过，寓意&quot;平步青云&quot;。南华门（南门）至今是老城区最热闹的出入口，穿过城门洞就踏入宋元明清的老街巷。", "h": "\u003cp class=\"main-text\"\u003e北宋万佛塔始建，用10年建成（崇宁元年1102建到第四层，崇宁五年1106建到第十一层，全塔13层）。元至元二十一年（1284）始建文庙。明万历年间以砖包城。清代屡修屡圮。1950年代城墙大部拆除，四门仅存南华门门洞残段。2021年北大街历史文化街区列为省级保护街区，保护范围7.53公顷，核心区2.45公顷。现状：万佛塔、文庙、南华门完整，北大街、青云街、漆园街、三报司街等历史街巷格局完好。明代城门     现状。东门（宾阳）  全毁。南门（南华）  门洞残段尚存，穿门而入即老城区。西门（通济）  全毁。北门（拱辰）  全毁。&quot;万佛塔造于宋崇宁间，历十年而成。每层嵌琉璃小佛，数近万，因名。塔下有宋代碑三，记其造年。&quot;。&quot;万佛塔四层以上门窗位置不规则——为什么？因为它不是一次造完的。崇宁元年造到四层停了三年，崇宁五年才又接着往上造，所以楼梯改了方向，门窗位置也乱了。这是一座有&#x27;施工中断痕迹&#x27;的宋塔。&quot;。&quot;我就在南华门洞里纳鞋底纳了50年。穿过门洞往西是卖菜的菜市，往东是青云街——小时候跟着母亲去文庙上香，娘说从这走过，下辈子也能考个秀才。现在门洞还是那个门洞，我还在，人换了一茬又一茬。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e蒙城文庙（省保·清代建筑·元始建）：位于老城区中心，占地2042平方米。大成门正对青云街（&quot;平步青云&quot;之意）。大成殿面阔五间进深三间，歇山顶抬梁式，九檩十八架四十二檐墩，巨杉为栋梁。圣井（大成门西南侧）——&quot;圣井甘泉&quot;为蒙城八景之一。明代二龙戏珠丹陛石在殿前。；南华门（南门门洞）：明清遗留，穿过即入老城区，烟火气最浓的出入口。；青云街（古街巷·至今在用）：一头接文庙棂星门一头遥望万佛塔。街名由来——古时赶考学子祭拜先圣后从此街走过，寓意平步青云。早年曾叫孟庄街，后恢复古名。；北大街历史街区（省保·7.53公顷）：商肆格局完整，有庄子牌坊、钟鼓楼（省保1处）、文王庙、四牌楼等13处挂牌历史建筑。；漆园街、三报司街、光复街：历史街巷格局完好，原住民仍住。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e万佛塔（国保·北宋·1102-1106建）：八角十三层楼阁式砖塔，高42.2米。塔身内外嵌砌赭、黄、绿三彩琉璃小佛近万尊。宋代属兴化寺，明代属慈氏寺。塔体水磨青砖砌造，下几层穿心式楼梯，上面改成盘旋式。宋碑三块完整记载建造历程（哪年建到第几层）。1981-1984年国家文物局拨款修缮。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《蒙城县志》（清光绪）：\u003cbr\u003e▌蒙城县历史文化研究会：\u003cbr\u003e▌南华门老裁缝王桂英（82岁）：\u003c/p\u003e"}, {"n": "亳州老县城·三朝古都", "s": "亳州", "p": "安徽", "w": "商汤南亳·花戏楼砖雕第一·曹氏宗族墓10平方公里·药都36老街三朝古都——商汤在此建都190年（王国维考证景亳在曹县土山集，今亳州市区亦为亳地核心区）、汉末曹操的故乡（陪都级）、元末韩林儿&quot;小明王&quot;称帝建&quot;宋&quot;以亳州为国都。花戏楼（大关帝庙·山陕会馆）的砖雕——厚度不足二寸的特制青砖上透刻30余个3毫米孔的双层花绣球，戏文70余种——松鹤延年、郭子仪做寿、吴越之战、三顾茅庐、白蛇传，巧夺天工。曹氏宗族墓群占地10平方公里，出土银缕玉衣、800多块带文字的墓砖（隶/篆/草/真/行五体俱全）。明清时期亳州是天下四大药都之一，北关老街现存白布大街、打铜巷、爬子巷、南京巷等36条老街72条古巷。", "h": "\u003cp class=\"main-text\"\u003e商汤建都亳（景亳/南亳），历190年。魏皇初二年（221）封谯郡为陪都——&quot;三朝古都&quot;头衔之一。隋大业二年（606）改谯郡为亳州，为唐代十望州府之一。元至正十五年（1355）刘福通拥韩林儿在亳州称帝建&quot;宋&quot;——&quot;三朝古都&quot;头衔之三。明洪武初（1368）降州为县。弘治九年（1496）复称亳州。清时为区域经济中心，&quot;小南京&quot;。1950年代城墙拆除。现状：花戏楼、曹操地下隐兵道、曹氏宗族墓群、南京巷钱庄、道德中宫（孔子问礼处）、华佗华祖庵、36条老街（白布大街、南京巷、打铜巷、爬子巷等）尚存。明清城门     现状。东门        全毁。南门        全毁。西门        全毁。北门        全毁。&quot;亳州自商汤建都以来，历经魏陪都、小明王宋都，三朝古都。明清时为天下四大药都之一，北关老街药栈林立，商贾云集，号称&#x27;小南京&#x27;。&quot;。&quot;你看这砖雕——厚度才2厘米，却透刻了3层。那个5厘米的花绣球，上面有30多个3毫米的孔，全是手工刻的！砖雕上的人物，有的只有指甲盖大，眼睛眉毛都清清楚楚。1656年建的，370多年了——2厘米的青砖，这就是砖雕的命。&quot;。&quot;800多块文字墓砖是宝贝——汉代书法史之前靠碑刻，墓砖是民间书法——有个墓砖上刻的是&#x27;曹氏丞曹甫砖&#x27;，还有的刻着当时工匠的牢骚话，比史书有趣多了。&quot;。&quot;我家在白布大街住了60年——这条街明清时是药都的门面街，药材商在这里卸车、看样、谈价。现在街两侧的门面还都是清代的青砖灰瓦——我小时候帮爹晒白芍，就铺在街面上——白芍晒3天，手摸起来发烫就是好药。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e花戏楼（国保·1656年建·山陕会馆·天下砖雕第一）：大关帝庙内，清顺治十三年（1656）山西/陕西药材商人集资建，康熙十五年（1676）建戏楼。戏楼与山门连为一体——砖雕牌坊式门楼，拱门&quot;大关帝庙&quot;四字上面镶嵌&quot;参天地&quot;金匾。特制青砖厚度不足二寸，透刻成数层——有一个直径仅5厘米的双层透花绣球，通体刻了30余个3毫米圆孔。戏文涉及70余种：松鹤延年、三星高照、郭子仪做寿、吴越之战、三顾茅庐、白蛇传、老君炼丹。戏台正中屏风透雕&quot;二龙戏珠&quot;，场门额书&quot;想当然&quot;&quot;莫须有&quot;。；曹氏宗族墓群（国保·占地10平方公里·2001年公布）：魏武大道两侧——董园汉墓群、曹四孤堆、刘园孤堆、薛家孤堆、观音山孤堆、张园汉墓、马园汉墓、袁牌坊汉墓群、元宝坑汉墓群。墓门多为石结构饰画像刻石，墓室墙壁券顶绘彩色壁画。出土银缕玉衣、玉刚卯、玉猪、象牙石等，800多块带文字墓砖（隶/篆/草/真/行五体俱全）——有曹氏宗组成员姓名、地方官吏姓名，也有反映当时社会的词句。；曹操地下隐兵道（国保·亳州古地道·长4500米·双层立体）：传说曹操为早期战略运用所建。双道并行，纵横交错，互相连通。工程巨大——有&quot;地下长城&quot;之称。结构有上下两层、单层、道中有室、室中有门，规模宏大。；道德中宫（省保·孔子问礼处·老子庙）：市区中心，传孔子在此向老子问礼。始建年代不详，历代重修，现建筑为明代遗构。；华佗华祖庵（省保·神医华佗故里）：市区永安街，华佗故居，庙祠完整，草堂经声、药圃流香、五禽鸣寿等八大景观。；南京巷钱庄（国保·清代·亳州现存最完整的钱庄）：北关老街南京巷，清道光年间建，三间三进院落，保存完好。；亳州36条老街（白布大街、打铜巷、爬子巷、南京巷、小花子街、署前街等）：明清格局，原住民仍住，日常烟火气。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：\u003cbr\u003e▌花戏楼导游小周：\u003cbr\u003e▌曹操墓群考古队：\u003cbr\u003e▌白布大街老药工王大爷（81岁）：\u003c/p\u003e"}, {"n": "涡阳老城·老子故里", "s": "涡阳", "p": "安徽", "w": "天静宫东汉始建·九龙井九眼甘泉·流星园感星受孕·老子坟在尹王村老子故里千年之争——涡阳天静宫vs河南鹿邑太清宫，两边各有依据，学界各执一词，老百姓把两地都当老子圣地来拜。涡阳的根据：东汉延熹八年（165）汉桓帝在涡阳建老子庙（这是官方给老子立祠的最早记载），元代《天静宫兴造碑》+出土流星园古碑+九龙井遗址+涡水北岸&quot;山南水北为阳&quot;的古地理选址。明成祖朱棣早年在此屯兵许愿：若能靖难登帝位，必大兴土木重修——靖难成功后果然兑现，天静宫扩建为皖北道教第一宫观。九龙井传说老子降生时九条龙喷水沐浴——九眼甘泉至今泉水清冽。", "h": "\u003cp class=\"main-text\"\u003e东汉延熹八年（165）汉桓帝敕建老子庙（最早官方立祠记载）。唐弘道元年（683）高宗改建为太清宫。宋真宗亲临加号太上老君，纳入皇家祭祀。元世祖定名&quot;天静宫&quot;。元末/明末/晚清多次毁于兵燹。明成祖朱棣靖难之役前在涡阳屯兵，许愿登帝位后重修天静宫——靖难成功兑现，天静宫迎来巅峰（&quot;食业数千人，庙地三千亩&quot;）。民国末期因战乱损毁殆尽，仅存东岳庙改作学校。1993年台湾道教学院马炳文教授/香港青松观侯宝垣道长筹资重建。现状：天静宫（4A级景区·2014年建成）、九龙井、流星园、尹喜墓、老子坟（李聃墓）遗址尚存。涡阳老子遗迹     现状。天静宫（老子庙）  4A景区·1993年重建·出土汉代瓦当/元代碑。九龙井        九眼甘泉尚存·唐代瓦圈。流星园        出土古流星园石碑·感星受孕传说地。尹喜墓        县城北·尹喜追随老子西出函谷关后回归葬涡阳。老子坟（李聃墓）  尹王村西·遗址·明清有祠。城父古城      春秋楚平王居城父·县城西北闸北镇。&quot;天静宫在城北郑店村，始建于汉桓帝延熹八年。明成祖靖难之役前屯兵涡阳，许愿登帝位后大修——靖难成功兑现，庙地三千亩，食业数千人，为皖北第一宫观。&quot;。&quot;老子生楚苦县厉乡曲仁里。按水经注，苦县故城即今安溜古城，赖乡城在涡河之北——古水经注所记与今天静宫位置吻合。&quot;。&quot;老子故里争了上千年——涡阳有东汉最早立祠的碑、有元代兴造碑、有九龙井、有流星园古石碑、有尹喜墓，都是实证。鹿邑那边有太清宫庙群、有唐玄宗宋真宗的碑文。两地都是老子圣地——游客来了，涡阳拜天静宫，鹿邑拜太清宫，两头跑才对。道不分家。&quot;。&quot;九龙井的水我喝了一辈子——夏天舀一瓢喝，清冽甘甜。老人说这井是老子降生时九条龙喷水成的——不管真不真，这水确实比别的井水好，我家种的白菜比别家的嫩。&quot;。&quot;唯见碧流水，曾无黄石公&quot;——涡水从涡阳天静宫旁流过，东流经蒙城、怀远入淮河，李白也走过这条水路。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e九龙井（唐代瓦圈·传说老子降生时九龙汲水·九眼甘泉尚存）：天静宫内九龙井苑，九眼古井并列，泉水常年清冽。传说老子降生时，九条巨龙环绕井口喷水沐浴，九井留存至今。井口多为唐代瓦圈砌成。；流星园（古流星园石碑·感星受孕传说地·出土汉代瓦当）：天静宫西侧。传说老子母亲李氏在此园中休憩，一颗流星坠落园中，感星而孕。考古出土&quot;古流星园&quot;石碑——实物对标古籍记载。；尹喜墓（春秋·涡阳省级文保·老子弟子尹喜之墓）：县城北，传说尹喜追随老子西出函谷关后回归涡阳葬此。；城父古城（春秋·楚平王居城父·县城西北闸北镇）：春秋楚平王夺位后居城父12年，伍子胥之父伍奢为城父司马。秦置城父县，汉代为城父侯国。城址尚存夯土残垣。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e天静宫（省级文保·道教祖庭·东汉始建·2014年复建）：县城北郑店村（武家河与涡河环绕）。始建于东汉延熹八年（165）——这是官方给老子立祠的最早记载（汉桓帝敕建）。历代帝王敕修：唐高宗太清宫→宋真宗加号→元世祖定名天静宫→明成祖靖难之役后大兴土木（&quot;食业数千人，庙地三千亩&quot;）。元末/明末毁于兵燹。1993年复建，4A级景区。考古出土汉代瓦当、春秋陶片、古井基址、元代重修石碑——地下全是硬货。依&quot;致虚极守静笃&quot;无为理念布局——中轴线统领对称布局，全长1800余米长廊群，朱色廊柱数百对。中路：山门→会仙桥→灵官殿→老君殿→三清殿。；老子坟/李聃之墓（尹王村西·明清有祠·遗址尚存）：传说为老子葬处（或纪念地）。明清有&quot;李氏石门&quot;石牌坊，毁于抗战前期。辉子园（李子园·避讳老子姓李改名为辉子）、紫楸林（楸树林·传与紫气东来传说有关）遗址尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《亳州志》（清光绪）：\u003cbr\u003e▌元代《天静宫兴造碑》：\u003cbr\u003e▌涡阳天静宫道士张先生（82岁·在此修行50年）：\u003cbr\u003e▌郑店村老农老尹：\u003cbr\u003e▌李白《经下邳圯桥怀张子房》（关联地涡阳）：\u003c/p\u003e"}, {"n": "泗县老城·虹县故城·裁虹归泗", "s": "泗县", "p": "安徽", "w": "古泗州沉洪泽湖·虹县600年砖城·大运河通济渠活水5.8km·世界遗产中国的&quot;水下庞贝城&quot;——清康熙十九年（1680）黄河夺淮，千年泗州城沉入洪泽湖底——城内水深数丈，&quot;官若浮鸥，百姓尽奔盱麓&quot;。泗州城在水下躺了300年，学者称之为&quot;东方庞贝&quot;。如今的泗县城，其实是古虹县——清乾隆四十二年（1777）&quot;裁虹归泗&quot;，泗州州治从盱眙迁到虹县，虹县作为独立县治的600年历史就此终结。隋唐大运河通济渠泗县段28公里，其中5.8公里活水段是大运河世界文化遗产段。", "h": "\u003cp class=\"main-text\"\u003e夏商：夏丘古国（传说大禹封地）。西汉：置夏丘县。北周大象二年（580）：改东楚州为泗州——&quot;泗州&quot;之名首次出现，治所在今江苏盱眙。唐武德四年（621）：析夏丘县置虹县。唐贞观八年（634）：夏丘县并入虹县，虹县治迁至今泗县城——泗县县城成为虹县治所，延续600年。唐大业元年（605）：隋炀帝开通济渠（汴河）穿虹县城而过——虹县成为运河重镇。北宋：苏轼《南乡子·宿州上元》赞宿州&quot;此去淮南第一州&quot;——虹县属宿州。南宋：宋金对峙，虹县为淮北前线，屡遭兵燹。明洪武九年（1376）：知县乐徽创建县衙大堂。明弘治十三年（1500）：知县樊江修筑五门。明万历二十三年（1595）：知县任愚创建砖城。明万历四十四年（1616）：知县伍元正开通东西水关。清康熙十九年（1680）：黄河夺淮——泗州城沉洪泽湖底，州署寄居盱眙山上。清乾隆四十二年（1777）：裁虹归泗——泗州州治北迁虹县，虹县建制撤销。清乾隆四十五年（1780）：泗州知州张佩芳撰文、书法家梁巘书丹，立《移泗州治记》碑。民国元年（1912）：废州改县，定名泗县。现状：古泗州城遗址（江苏盱眙淮河镇·国保·水下庞贝）、虹县故城（泗县老城一环内·明代格局）、通济渠活水段5.8km（世界文化遗产）、《移泗州治记》碑尚存。泗县双城运河遗迹      现状。古泗州城遗址（水下）  江苏盱眙淮河镇·洪泽湖西岸·国保·水下庞贝·考古已探出城门、城墙、街道、房屋遗迹·清代《泗州志》&quot;泗州水漫盱眙山&quot;。虹县故城（明代砖城）  泗县城一环内·原周长约3km·城四门·东西水关·遗存较少·明代格局基本延续至今。通济渠（汴河）泗县段  总长28km·县城东5.8km活水·大运河世界文化遗产·泗县段遗存完好。古运河遗址公园        泗县泗水街道·沿通济渠活水段·古码头、古河堤、漕运陶片、瓷片、钱币出土。《移泗州治记》碑      泗县博物馆藏·乾隆四十五年·张佩芳撰·梁巘书丹。古鞋博物馆            泗县城内·世界唯一·藏古今鞋子千余双。泗州戏起源地          国家级非遗&quot;拉魂腔&quot;·虹乡老艺人代代传承。&quot;古泗州城沉在水下300年——为什么不打捞？主要是技术和资金问题。洪泽湖是蓄水库，水位高度影响防洪——如果要打捞，首先要让遗址完全露出水面，但这会影响洪泽湖调蓄能力。目前只能维持原状，通过测深仪、声呐、潜水员去探查。我们已经探出城墙全长约11里，街道纵横20多条，主要建筑遗址30余处——这比意大利庞贝城还要大。&quot;。&quot;我家祖辈就在运河边——小时候我在河里游泳、捉鱼摸虾。那时候运河水很清，夏天能看到河底的鱼。以前沿河都是村庄，后来世界遗产申报，为了保护河道，老曹苗村整体搬迁了——村民都搬进了附近的楼房。我现在还经常去运河边散步，看看鸭子在河里游，看看花花草草——河还是那条河，我已不是当年那个光腚小孩了。&quot;。&quot;我家就在原来的县衙旁边——听老辈人说，原来的县衙大堂三进院落，有&#x27;抱厦厅&#x27;、&#x27;礼房&#x27;、&#x27;兵房&#x27;……文革时拆了大部分，只剩后堂一间。80年代县公安局占了县衙地基盖办公楼——我现在路过还能找到原来县衙的台阶——那两块青石板，我小时候在上面摔过跤。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古泗州城遗址（水下庞贝·国保·中国唯一完整保存的水下古城）：江苏盱眙县淮河镇，洪泽湖西岸。康熙十九年（1680）黄河夺淮，一夜之间沉入洪泽湖。考古已探出城门、城墙、街道、房屋、寺庙——城墙全长约11里，城内街道纵横，有东大街、西大街、南大街、北大街、小北街、城隍庙街等。城内建筑有州署、文庙、城隍庙、钟楼、鼓楼、关帝庙、天庆观等。遗址深埋水下1.5-2.5米——如今洪泽湖水位下降时，部分城墙遗迹露出水面。学者称之为&quot;中国庞贝城&quot;。；通济渠（汴河）泗县段（世界文化遗产·大运河通济渠段7处遗产点之一）：总长28公里，其中县城东5.8公里为活水段——泗县段是通济渠唯一保留活水的河段。河堤高约5米，河宽约100米。沿岸出土大量漕运遗存——古码头遗迹、古河堤、漕船锚具、唐代开元通宝、宋代景德元宝、景德镇瓷器、越窑青瓷、磁州窑白釉黑花瓷等。2014年6月22日，随大运河整体列入《世界文化遗产名录》。；《移泗州治记》碑（乾隆四十五年·泗县博物馆藏·裁虹归泗的官方记录）：乾隆四十五年（1780）泗州知州张佩芳撰文，清代著名书法家梁巘书丹。碑文详细记载古泗州城沉没的全过程、州署寄居盱眙90年的困境、以及最终迁治虹县的决策经过。碑高2.5米，宽0.9米，楷书——书法遒劲有力，是梁巘代表作之一。；古运河遗址公园（泗县泗水街道·沿通济渠活水段）：2014年世界遗产申报成功后建设。公园内有古码头遗址展示、古河堤保护标识、考古发掘地层剖面展示——考古队在泗运河遗址曾清理出完整的河堤、河道、河坡，船底摩擦河底痕迹，以及木岸狭河遗迹——证明主副航道的漕运模式。；泗州戏（国家级非遗·拉魂腔·虹县乡土民间戏曲）：泗县是泗州戏的原生地。唱腔婉转缠绵，韵味拉魂动人——&quot;一听拉魂腔，三日不思乡&quot;。清代乾嘉年间形成雏形，道光年间已有职业戏班。传统剧目《四告》、《拾棉花》、《压裙记》等。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e虹县故城（明代砖城·泗县老城一环内·明代格局延续至今）：明洪武九年（1376）知县乐徽创建县衙大堂——至今遗存部分建筑结构。明弘治十三年（1500）知县樊江修筑五门——四门楼外加东西水关（万历四十四年1616伍元正开通）。明代砖城周长约3公里，城墙高5米、厚3米——清末城毁，仅剩城基。如今泗县城一环内老城区，街道走向、空间格局基本延续明代——县衙大堂原址现为泗县公安局。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌泗县博物馆馆长刘建国：\u003cbr\u003e▌泗县老船夫姜治怀（84岁·泗水街道曹苗社区）：\u003cbr\u003e▌虹城街道老居民王大娘（76岁）：\u003c/p\u003e"}, {"n": "凤阳·明中都", "s": "凤阳", "p": "安徽", "w": "朱元璋衣锦还乡建的未完成皇城、比北京故宫大12万平方米、被乡愁放弃的都城", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 濠州钟离 | 1328 | 朱元璋出生于此 | 父母饿死无钱安葬 |。| 诏建中都 | 1369年9月 | 洪武二年下诏营建中都 | 调全国百万人力 |。| 罢中都役作 | 1375年 | 洪武八年突然停工 | 功将完成时放弃 |。| 明皇陵 | 1379年 | 朱元璋父母兄嫂墓 | 亲撰碑文 |。| 2017年 | 2017 | 安徽省首个国家级考古遗址公园 | 规划382.3公顷 |。| 2021年 | 2021 | 入选全国十大考古新发现 | 600年后重见天日 |。| 现状 | 2024 | 皇城午门/西华门/1100米城墙/鼓楼台基存 | 2026年核心区开放迎客 |。&quot;我1969年到凤阳干校——那时候明中都就是一片荒地，皇城里还有个县城村住着1200多户人家。我蹲在鼓楼台基下面摸那青石板——那砖上刻着&#x27;洪武二年造&#x27;，砖缝里长着荒草，草下面埋着600年前的工匠手印。我花了10年写了《明中都城考》——现在这本书是研究明中都的权威。有人问我&#x27;朱元璋为什么放弃中都&#x27;，我说&#x27;因为家太近了，近到他的老乡们跟他坐同一张桌子喝酒；又太远了，远到他能当皇帝却不能掌控家乡的权力&#x27;。中都不是被洪水淹的、不是被兵燹毁的——是被乡愁放弃的。这在中国历史上独一份。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明中都皇故城（国保第一批+国家考古遗址公园）：占地50平方公里，宫城84万㎡（比故宫大12万㎡），午门/西华门/1100米城墙/鼓楼台基（南北72米×东西34.25米×高15.8米，终明之最）存。蟠龙石础22.2吨（全国最大）。；明皇陵（国保第二批）：神道长257米，石像生32对，朱元璋亲撰碑文。；凤阳花鼓（国家级非遗）：明清传唱至今，&quot;说凤阳道凤阳&quot;。；小岗村：1978年大包干发源地，18位农民红手印契约。；历代帝王庙：朱元璋祀三皇五帝。；肇建功臣庙：徐达/常遇春/汤和等淮西集团。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王剑英（已故，人民教育出版社历史地理学家，1969年五七干校到凤阳，第一个系统研究明中都的学者）：\u003c/p\u003e"}, {"n": "宿州老城", "s": "宿州", "p": "安徽", "w": "唐符离镇建州、苏轼墨竹扶疏亭、残墙256米见证汴河千帆", "h": "\u003cp class=\"main-text\"\u003e| 时代 | 年份 | 城墙/格局 | 关键事件 |。|------|------|-----------|---------|。| 唐建宿州 | 809年 | 土城，汴河穿城 | 埇桥为水陆要冲 |。| 北宋高光 | 960-1127 | 水陆驿站四通八达 | 苏轼《南乡子》&quot;淮南第一州&quot; |。| 明砖城 | 1377年 | 周3716米，高11米，厚8.3米 | 四门戍楼，护城河8里 |。| 万历疏浚 | 约1573 | 护城河种荷堤岸植柳 | 城濠如画 |。| 遭毁 | 1938/战事 | 残垣炮痕，拆作工事 | 北城墙仅存256米 |。| 现状 | 2024 | 残256米，为埇桥区政府后墙 | 市级文保 |。&quot;我爹在埇桥区政府当过保安——他说他小时候北城墙还完整，城墙上能骑自行车，底下是州衙的后墙，谯楼暮鼓声从城墙角传出来。后来城墙一段一段被拆，拆到1970年代只剩最后这256米——就是现在区政府后院那段。我现在开的车，后备箱里永远放着一把铁锹——每次去蕲县古城，我都下车在城墙根儿转转，捡几块带花纹的陶片带回家。我家橱柜里摆了一排陶片——战国的绳纹瓦、汉代的方格陶、明代的城砖——都是我爹和我两代人捡的。我儿子在安徽大学考古系——暑假回来第一件事就是坐我车去蕲县挖陶片。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宿州老城墙残段（市级文保）：仅存北城墙256米，石砌马面（长18米高11米）。；扶疏亭：刻苏轼墨竹碑，&quot;扶疏余韵&quot;古八景。；蕲县古城遗址（省级文保）：距城20公里，战国秦代夯土城周长6000米，陈胜吴广攻克第一城。；三贤庙：纪念陈胜/吴广/刘邦，庙前2000年红果树。；通济渠泗县段：大运河世界遗产点。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李师傅（59岁，宿州市文物管理局司机，开了20年文物调研车）：\u003c/p\u003e"}, {"n": "寿县老城·宋代城墙", "s": "寿县", "p": "安徽", "w": "安徽唯一保存完好的古城池·月坝自动防洪涵闸·500成语之乡中国保存最完好的宋代古城墙，比平遥早约100年。1991年淮河大水时，城外一片汪洋，城内居民还能坐在城垛上把脚伸进水里洗脚。", "h": "\u003cp class=\"main-text\"\u003e&quot;1991年发大水，我蹲在东门城楼上，脚就搭在垛口，水都淹到城外田地那么高，城里头倒安稳。老一辈说&#x27;铁打的寿州城&#x27;，真不是吹牛。&quot;。&quot;我带孙子认&#x27;投鞭断流&#x27;&#x27;风声鹤唳&#x27;这些成语，全出在寿县。寿县是500个成语的故乡，孩子课本上划出来的，好多我们脚下就踩得着。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城墙（宋代·周长7147米·高约9.7米）：顶宽6-10米、底宽18-20米，土夯核心外砌青石灰砖，用糯米汁、石灰、桐油粘合。四门：东宾阳门、南通淝门、西定湖门、北靖淮门；月坝（明代·东北角、西北角各一座）：城墙底下的排水涵闸，城内积水自动往城外排，城外洪水一涨又凭水压自动关闸，堵住倒灌，是古人的&quot;海绵城市&quot;；宾阳门瓮城（东门·宋代遗风最浓）：主城门与瓮城门不在一条中轴线上，错位成&quot;歪门斜道&quot;，洪水冲来会被拧成涡流，卸掉冲城的力道；报恩寺（始建于唐贞观·1300多年）：院内两株唐代银杏，北宋塔基地宫，大雄宝殿里十八尊清代泥塑罗汉；孔庙（始建于唐·元代迁今址·安徽规模最大的孔庙）：最盛时占地两万多平方米，五进院落，棂星门、半月泮池、戟门、大成殿、明伦堂一路排开；留犊祠巷（东汉时苗留犊的清廉故事）、状元街、北过驿巷；前494年：蔡昭侯迁都州来（下蔡），寿县第一次成为都城；前241年：楚考烈王迁都寿春（郢），这里是楚国最后的都城；北宋熙宁年间（1068-1077）：始筑城墙；南宋嘉定年间：重修加固，做成&quot;土坡战城式&quot;，一段城墙同时兼任防洪大堤；唐代：城内报恩寺、孔庙等陆续兴建；1950年代以后：城墙当堤坝继续使用，城内街巷格局保持两千年未大变；现状：城墙、四门、瓮城、月坝基本完好，见证2500多年连续建城史。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌寿县牛肉汤铺老张（58岁）：\u003cbr\u003e▌孔庙旁的退休教师李姨（65岁）：\u003c/p\u003e"}, {"n": "阜阳老城·颍州", "s": "阜阳", "p": "安徽", "w": "西周胡子国筑城的三千年水城·奎星楼&quot;三蓬塔&quot;唯一幸存的城墙角楼·颍州西湖被黄河淤成平地淮北平原上建城三千年、城墙却在1939年全拆了的古城，如今只剩东南城角一座9.93米高的&quot;三蓬塔&quot;奎星楼，替整座城守着文脉。", "h": "\u003cp class=\"main-text\"\u003e&quot;老人都讲&#x27;七蓬塔能爬，三蓬塔爬不得&#x27;，说塔里睡着大蟒。其实那三蓬塔早先是东南城角的敌楼，望敌情用的，后来才改成求功名的风水塔，成了全城独一份的老底子。&quot;。&quot;我小时候西湖早淤成平地了，只在老相片里见过。这几年政府照着欧阳修的诗一亭一桥地往回建，我领着孙子去，说&#x27;这就是当年跟杭州西湖并称的那个湖&#x27;。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e文峰塔（康熙三十五年建·七层·青灰色）：与奎星楼一紫一青，隔着老城相望；资福寺（清代）：城内古刹；城隍庙（明至清·建设街23号）；颍州西湖（重建一期湖面1.9平方公里）：照着欧阳修&quot;平湖十顷碧琉璃&quot;的诗句，一亭一桥往回建，&quot;湖亭&quot;&quot;兰园&quot;&quot;撷芳亭&quot;&quot;怡园&quot;等古建重新落水；西周：胡子国在此建都；秦：置汝阴县；北魏武泰元年（528）：首置颍州，颍州的称呼从这里开始；北宋：欧阳修、苏轼先后任颍州，盛赞颍州西湖&quot;平湖十顷&quot;&quot;未觉杭颍谁雌雄&quot;；金、元以后：黄河屡次夺淮入颍，泥沙把西湖一点点淤成平地，主湖一度只剩唐时的1/150；明正德九年至十一年（1514-1516）：砌南城，四角建敌楼，东南角一座称&quot;望霍&quot;（今奎星楼）；清康熙三十五年（1696）：建七层文峰塔，俗称&quot;七蓬塔&quot;；现状：城墙无存，奎星楼、文峰塔、资福寺、城隍庙等零星尚存。\u003c/p\u003e\u003cp class=\"main-text\"\u003e奎星楼（明代·高9.93米·三层六边形砖塔）：原东南城角的瞭望敌楼，后改为祭祀奎星、求文运的风水塔。塔顶一铁制舞凤头西尾东，二层门楣题&quot;文光射斗&quot;、三层题&quot;奎壁联辉&quot;。老阜阳人叫它&quot;三蓬塔&quot;&quot;望霍楼&quot;&quot;拐角楼&quot;；1939年：遵&quot;拆城墙&quot;通令，古城墙悉数拆除，唯有已变成风水塔的奎星楼保留下来。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌颍州老裁缝陈师傅（71岁）：\u003cbr\u003e▌西湖边晨练的王大爷（64岁）：\u003c/p\u003e"}, {"n": "灵璧老县城·磬石之乡", "s": "灵璧", "p": "安徽", "w": "霸王别姬虞姬墓·乾隆御封&quot;天下第一石&quot;·钟馗画发源地宋元祐元年（1086）建县、靠&quot;一石一姬一画&quot;鼎起一座城的皖北小县。楚汉垓下的悲歌、亿万年磬石的铜音、家家张贴的钟馗像，撑起了小城的文化魂。", "h": "\u003cp class=\"main-text\"\u003e&quot;我们灵璧人画钟馗，跟别处不一样——钟馗要画得又凶又亲。凶能镇宅，亲是老百姓把他当自家人。我爷爷那辈，过年集市上挂的全是钟馗像，孩子们追着看&#x27;钟馗嫁妹&#x27;。&quot;。&quot;灵璧石敲一下有铜音。乾隆爷封它&#x27;天下第一石&#x27;，我爹一辈子在磬云山凿石头，说宋朝就有人在这儿采石头给宫里做磬。摸一摸，是几亿年的东西。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e虞姬墓（省保）：霸王别姬纪念地，墓冢、霸王广场、楚汉碑廊。园内汉白玉虞姬雕像，垂柳绕湖；磬石山（国家地质公园·宋代采石坑、摩崖造像）：灵璧石原生地，磬石瘦、皱、漏、透，叩之音如青铜。乾隆御封&quot;天下第一石&quot;。山上还有宋代古采石坑、将军洞、拔剑泉；花石纲遗址（国保）：北宋给宫廷采运贡石（花石纲）留下的采石遗迹；大运河遗址（灵璧段）：通济渠故道，近年勘探出土大量船具、瓷片；灵璧钟馗画（省级非遗）：中国民间文化艺术之乡，钟馗画、钟馗剪纸、钟馗皮影世代相传；宋元祐元年（1086）：始置灵璧县；秦末楚汉之际：垓下古战场，霸王别姬的故事在这里收场（虞姬墓在灵璧）；宋代：磬云山开采灵璧磬石，凿成宫廷编磬进贡；北宋：通济渠（隋唐大运河）穿境，汴水绕城；明清：钟馗画成了民间过年的大宗年画，家家张贴驱邪纳福；现状：古城墙无存，虞姬墓、磬石山、花石纲遗址等地上地下遗迹尚存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌钟馗画坊画师钟师傅（50岁）：\u003cbr\u003e▌磬石山脚下的石匠老李（57岁）：\u003c/p\u003e"}, {"n": "怀远老县城·荆涂峡口", "s": "怀远", "p": "安徽", "w": "禹会诸侯于涂山·荆山卞和洞和氏璧·白乳泉&quot;天下第七泉&quot;淮河在荆山、涂山之间拐出一道峡口，大禹在此&quot;会诸侯于涂山&quot;，夏朝从这里萌芽。全淮河最厚的一段上古史，就压在城外的两座山底下。", "h": "\u003cp class=\"main-text\"\u003e&quot;每年农历三月二十八涂山庙会，省里都列了非遗，祖祖辈辈上山拜禹王。我们这儿石榴五月开花像火，八月熟透掰开红籽像宝石——就长在荆涂二山夹着的淮河边上。&quot;。&quot;早先在地里刨出陶片，谁也没当事，随手就扔。考古队一来，说这是四千年前大禹开会的地方。我才明白，脚下踩的是夏朝的一个脚后跟。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e禹王宫（始建于前195年·涂山之巅·主峰338.7米）：祭祀大禹与涂山氏女，两千多年的老庙。会爬山的先登主峰烧香，再望淮河拐弯；启母石（望夫石·文保单位）：大禹治水&quot;三过家门&quot;，涂山氏女盼夫化成的巨石；禹会村遗址（龙山时代·国家考古遗址公园）：挖出大型祭祀台基，出土陶器来自山东、河南、安徽、江苏、上海、浙江六地，正应了&quot;执玉帛者万国&quot;；卞和洞（荆山半腰·天然岩石堆叠）：和氏璧的传说，楚人卞和献玉的地方，洞不大，弓腰才能进，能容十几人；白乳泉（苏轼赞&quot;天下第七泉&quot;）：四周榴林似海，五月花开如千株红珊瑚；常氏三王墓（常遇春祖坟·省保）、常遇春纪念馆；四千年前：大禹会诸侯于涂山，《左传》记&quot;执玉帛者万国&quot;；汉高祖（前195年）：过涂山，命立禹王庙镇涂山；南宋宝佑五年（1257）：设怀远军，&quot;荆山为城，义在怀远&quot;，怀远之名从此定下来；明：常遇春故里常坟镇，明太祖追封开平王；2017年：禹会村国家考古遗址公园正式立项；现状：城墙无存，涂山禹王宫、启母石、荆山卞和洞、白乳泉等遗迹集中在荆涂两山之间。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌涂山庙会常客涂大爷（72岁）：\u003cbr\u003e▌禹会村放牛的老马（63岁）：\u003c/p\u003e"}, {"n": "太和老县城·细阳故城", "s": "太和", "p": "安徽", "w": "皖北唯一的元末明初文庙大成殿·七处故城叠置·楚都钜阳一个县城地面下压着七处故城遗址，楚考烈王还曾迁都于此（钜阳）；地面上，文庙大成殿又是皖北仅存的元末明初木构。", "h": "\u003cp class=\"main-text\"\u003e&quot;大成殿那几根柱子是元末明初的老木头，全皖北独一份。泮池的汉白玉栏杆别的县早没了，我们这儿一圈还整整齐齐。太和是书画之乡，广场上常年有人蘸水练字。&quot;。&quot;我小时候每年清明&#x27;城隍出巡&#x27;，抬着木雕的城隍爷出南门进东门，各街出龙灯、旱船，热闹得过节。后来庙没了，这出巡再也没抬起来过。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e文庙大成殿（省保·元末明初木构·皖北唯一）：真正原装的古建筑只剩大成殿和背后崇圣祠，泮池四周一圈汉白玉石栏保存完整——普通县级文庙的泮池栏杆早就没了；枕头馍（文庙小摊）：外皮酥脆、层层分明，一个够吃一个礼拜；太和板面：一清二白三红四绿，配卤羊蹄；春秋：宋国鹿上，宋襄公会诸侯的&quot;鹿上之盟&quot;在这里；前253年：楚考烈王迁都巨阳（钜阳）于此；秦：置新阳县，属颍川郡；汉：置细阳县，汝阴侯夏侯婴食邑细阳千户；元大德八年（1304）：建置今县城，始建文庙、城隍庙；明洪武三年（1370）：改&quot;泰和&quot;为&quot;太和&quot;，取太平祥和之意；现状：古城墙无存，文庙大成殿、崇圣祠、南寺等尚存，城隍庙只剩地名。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南寺（省保·人民北路120号·吕字形宫殿式建筑）：一部分直接占了马路的上街沿都没拆，正在申报国保；城隍庙遗址（明代曾&quot;大门三间、中门三间、正殿三间&quot;、青瓦丹柱）：1941年被毁，只留下&quot;城隍庙&quot;的地名；1941年：城隍庙毁于一旦，绵延数百年的&quot;城隍出巡&quot;庙会就此断绝。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌文庙广场练书法的刘老师（56岁）：\u003cbr\u003e▌老城隍庙巷口的老住户徐奶奶（81岁）：\u003c/p\u003e"}, {"n": "颍上老城·慎邑·管仲故里", "s": "颍上", "p": "安徽", "w": "管仲故里·管鲍祠·&quot;皖北水乡&quot;八里河《史记》&quot;管仲夷吾者，颍上人也&quot;，这座淮河、颍河交汇的水乡，把&quot;管仲故里&quot;四个字变成了满城的老街、古塔与烟火。", "h": "\u003cp class=\"main-text\"\u003e&quot;我们颍上人出去说&#x27;管仲是我们县人&#x27;，谁听了都信。老街这些马头墙是照老样子复建的，晚上灯笼一亮，外地客都说像在江南——其实这是淮河边。&quot;。&quot;八里河是发大水之后，全镇人用小推车一车车推出来的。当年照着挂历上的名胜照片自己琢磨着建。我指着那座假山跟孙子说：这山，爷爷也推过一铲子土。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e管仲老街（沿外城河复建·明清风格古建街）：以管仲文化为主题，青石板路、徽派马头墙，晚上红灯笼一亮像到了江南。内有纪念管仲、鲍叔牙的管鲍祠；明清苑（皖北规模最大、保存最完整的明清古建筑群）：斗拱飞檐、木雕砖雕、石雕影壁；九合塔：临水古塔；八里河（国家5A·占地15.8平方千米）：1991年灾后，全镇人用小推车一车车推出来的&quot;天下第一农民公园&quot;，曾被联合国授予环保&quot;全球五百佳&quot;；颍上花鼓灯（国家级非遗·&quot;东方芭蕾&quot;）、推剧发源地；周：慎邑，属楚；秦：置慎县，属泗水郡；隋大业二年（606）：改名颍上县，一直用到今天；春秋：管仲、鲍叔牙故里，&quot;管鲍之交&quot;的典故从这里来；明清：外城河、老街格局形成；1991年：特大洪水之后，利用低洼沼泽建起八里河景区；现状：管仲老街复建明清古建街，明清苑是皖北规模最大的明清古建筑群。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌管仲老街开茶馆的小管（45岁）：\u003cbr\u003e▌八里河畔的沈大爷（70岁）：\u003c/p\u003e"}, {"n": "临涣老城·铚城", "s": "临涣", "p": "安徽", "w": "国内唯一镇级夯土古城墙·5802米城垣还能登·不产茶却飘香千年的棒棒茶镇临涣是全国现存唯一一处镇级夯土古城墙遗址，春秋宋国在此筑铚城，两千多年城址核心没挪过窝，城墙至今还能登临", "h": "\u003cp class=\"main-text\"\u003e&quot;我祖上开染坊，这条南阁街从前就是牛市，浍河边一天几百头牛。现在老茶客天天清早来敲门，我晚开一步门口就一堆老头等。&quot;。&quot;三十多年前我接手时一壶棒棒茶两毛钱，十年前定成一元就没涨过。镇上老人一天来两趟，不为喝茶，就是来坐坐说说话。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城墙（夯土·总长约5802米·残高5-7米）：东、北、西三段基本完好，南城墙部分残存；城墙东西长1409米、南北宽约1400米，占地195万平米；城上豁口12处、外凸台墩8处、四角角楼基础仍在；城外北东西三面护城河总长4.2千米、宽5-10米，部分淤塞；南阁楼（玉皇阁·砖石结构）：临涣唯一砖石城楼，民间传说姜子牙在阁楼屋脊修了座迷你姜太公庙；文昌宫（唐代始建·初昌帝庙，宋更名文昌宫）：前后三进院落；怡心茶楼（1909年始建·两层三进天井）：棒棒茶一元一壶，十余年没涨价；棒棒茶：用六安瓜片、祁门红茶加工后剩的茶梗，配当地龙须泉水冲泡，别处泡不出这股绵甜；春秋：宋国设铚邑，在涣水（今浍河）北岸夯筑土城；战国：属楚；秦：置铚县，属泗水郡，为区域政治经济中心；汉：仍为铚县；唐改称临涣；明：临涣商贸鼎盛，号称&quot;两庵四寺九阁十八庙&quot;；1968年：当地&quot;退城还田&quot;号召把城墙推平改农田，多处城墙遭破坏；2006年：临涣城址列为第六批全国重点文物保护单位；2017年：安徽省文物考古研究所对城墙做全面勘探，解剖东北角断面。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌南阁街烟酒店老板李广英（63岁）：\u003cbr\u003e▌怡心茶楼掌柜张秀侠：\u003c/p\u003e"}, {"n": "界首老城·颍滨彩陶乡", "s": "界首", "p": "安徽", "w": "沙颍河黄胶泥烧了千年·田营十三窑·刀马人三彩国家级非遗界首彩陶是首批国家级非物质文化遗产，承&quot;唐三彩&quot;遗风，一件要过72道工序烧三个多月，田营一带有十三个以窑为名的村庄", "h": "\u003cp class=\"main-text\"\u003e&quot;上一批彩陶烧出来，72道工序我盯着过了三个多月。梅瓶、观音瓶、石榴瓶，窑门一开流光溢彩。&quot;。&quot;现在村里就我还做陶了，做了一辈子。我要是不做，这手艺就绝了。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e田营十三窑古窑址（省保）：卢窑、计窑、魏窑等十三口窑，2022年&quot;修旧如旧&quot;复原，修复前窑口长满树；界首彩陶（国家级非遗）：三彩刻花、刀马人刻画、花鸟纹，72道工序历时三个多月；界首工艺陶瓷厂老窑（七十多年·红砖烟囱高耸）：韩美林曾多次来此指导，2025年改造成陶艺公园；彩陶博物馆（田营镇韩楼村）：邢淑芹创办，可研学体验制陶；卢氏刻花彩陶非遗传习所（城区）：国家级传承人卢群山设，7位老师免费教学；唐宋：颍河（沙颍河）南岸已出现以黄河淤土为原料的陶窑；元延祐年间黄河泛滥后：淤土分&quot;小胶泥&quot;&quot;大胶泥&quot;，可塑性变强，能做复杂器型；清：田营镇形成卢窑、朱窑、计窑、魏窑、高窑、田窑、荣窑等十三窑，村以窑为名；1954年：窑工卢山义的&quot;刀马人&quot;三彩酒坛登上苏联《造型艺术》杂志，东欧国家争相收藏；2006年：界首彩陶烧制技艺列入首批国家级非遗；2019年：田营十三窑列为安徽省第八批省级文保，2022年完成抢救性修复；2025年：界首工艺陶瓷厂老窑入选全省第四次文物普查&quot;十大新发现&quot;。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌田营镇制陶世家卢一林（市级非遗传承人）：\u003cbr\u003e▌计村老艺人计文刚（67岁）：\u003c/p\u003e"}, {"n": "临泉老城·沈子国", "s": "临泉", "p": "安徽", "w": "周文王第十子聃季载封地·古城子12层文化层·2000年通教寺银杏临泉是西周沈国的都城，周文王第十子聃季载的封地，城西&quot;古城子&quot;城墙、护城河、烽火台犹存，是天下沈姓的祖根", "h": "\u003cp class=\"main-text\"\u003e&quot;都说我们临泉三件宝——老丘堆、银杏树、古城堡。我在银杏树底下乘了一辈子凉，二十年前有个沈姓宗亲从外地回来，跪在树底下抱着就哭，说找着祖坟了。&quot;。&quot;鲖阳古城那片地金贵，犁地都能犁出黑陶片。老辈说这是楚国铸钱的地方，我们管那叫&#x27;鬼集&#x27;——阴天夜里老听见铜钱响。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沈子国古城遗址（省保）：县城西500米古城子，北依泉河、南临流鞍河，城墙、护城河、古城堡、烽火台犹存；考古共12个文化层，上限商周、下限宋元；城边出土青铜镞、陶范众多；老丘堆（沈子墓·新石器遗址）：流鞍河南岸，长50余米、宽20余米、高10余米，出土石斧、石锛、骨针、陶方鼎；相传聃季载葬此；通教寺银杏树（唐·两千多年）：高30余米、胸围8米，&quot;九棱十八丫&quot;，根部传有李闯王&quot;马蹄印&quot;；与古城子、老丘堆合称&quot;临泉三件宝&quot;；鲖阳古城（鲖城镇北郊·两汉魏晋曾设郡）：陶片瓦砾俯拾皆是，出土楚国黄金货币&quot;郢爰&quot;、铜镜、石磬；姜尚故里（姜寨镇）：太公庙、姜公冢、&quot;姜尚故里&quot;石碑；前1042年：周文王第十子聃季载受封沈地，建沈子国，这是临泉有明确记载的建城之始；春秋：前506年沈子国为蔡所灭，后归楚；秦：设平舆县，属泗水郡；西汉：西部置鲖阳县（治今鲖城镇），两汉魏晋间鲖阳曾两次设郡；1934-1935年：析阜阳西乡设临泉县（县名取&quot;临泉河&quot;之意）；现状：古城子遗址保护，古沈国历史文化园建成。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌古城子旁老人王大爷（71岁）：\u003cbr\u003e▌鲖城镇赶集的刘婶（58岁）：\u003c/p\u003e"}, {"n": "凤台老城·州来下蔡", "s": "凤台", "p": "安徽", "w": "淮河绕城的茅仙洞佛道胜地·八公山豆腐源头·刘安《淮南子》之乡凤台古称&quot;州来&quot;、又因蔡国迁都称&quot;下蔡&quot;，城依淮河第一峡而建，茅仙洞三面环水佛道共奉，八公山则是一清二白豆腐的老家", "h": "\u003cp class=\"main-text\"\u003e&quot;我撑了一辈子淮河船，就数峡山口那段最险，船贴着一线天过。茅仙洞的道士说这是&#x27;淮上第一胜境&#x27;，夏天进去乘凉，比空调房还舒服。&quot;。&quot;我们这豆腐是两千年前刘安炼丹炼出来的，卤水一点，白得像玉。我这豆腐坊传了三代，豆子是本地豆，点浆用八公山的水，别处做不出这股嫩。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e茅仙洞（淮河第一峡·佛道两教胜地）：城南3公里，三面环水、淮河绕境，山石倒长南仰北倾；茅仙古洞、清天观、古寿唐关距今千年；八公山（豆腐发源地）：西汉淮南王刘安炼丹，无意间用卤水点出豆腐——&quot;八公山豆腐&quot;由此来，白嫩如脂；淮河故道（黑龙潭至峡山口段）：山高水急，淮河出峡第一景；刘安文化遗存：《淮南子》&quot;一人得道，鸡犬升天&quot;的典故即出此地；春秋：楚灭州来国，为州来城；前493年：蔡昭侯由河南新蔡迁都州来，改称下蔡；秦：置下蔡县，属泗水郡；汉：刘安封淮南王，与门客在八公山编《淮南子》；清雍正十年（1732年）：置凤台县（因境内凤凰台得名），县名沿用至今；现状：下蔡老城格局尚存，茅仙洞、八公山是淮南文旅核心。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌茅仙洞山下老船工常大叔（68岁）：\u003cbr\u003e▌八公山豆腐坊刘婶（61岁）：\u003c/p\u003e"}, {"n": "五河老城·五水汇聚", "s": "五河", "p": "安徽", "w": "淮浍漴潼沱五水交汇·顺河老街七十余家粮行·人送&quot;小上海&quot;五河因淮、浍、漴、潼、沱五条河在此汇聚得名，顺河老街曾是皖东北粮食集散地，粮行从20多家猛增到70多家，外地商人叫它&quot;小上海&quot;", "h": "\u003cp class=\"main-text\"\u003e&quot;我曾祖父开九和粮行，红火到蚌埠信丰面粉厂的采购员常年住我家。小时候东桥口码头石阶还能走，后来给土盖起来，我路过就扒开看两眼。&quot;。&quot;五河五条河，吃水靠人驮。我年轻时天天挑淮河水，顺河街码头卸粮的、上船的，一天到晚不断人，比现在赶集还热闹。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e顺河老街（省级历史文化街区·总面积3.378公顷）：水巷、小东河巷、河西街、元宝街、顺河老街5条历史街巷；7处历史建筑（胡家大院、九和粮行、陈家果行、丁家宅院、张家果行、丁家粮行、板桥）；东桥口码头：36阶石阶埋于地下（上世纪80年代检查时用土盖住保存）；清末建筑四五处：黄霭堂杂货店、九和粮行、张家干果行、陈家水果行的部分房子；五河民歌（国家级非遗）、临北狮子舞、钱杆舞（省级非遗）；古城墙旧址：淮河路五河城墙旧址（2026年立牌）；清末：五河口成天然良港，顺河老街（东桥口一带）农历逢集成市；光绪版县志（1894）：记载&quot;顺河街在东桥口，迤南，每日逢集&quot;；民国初：上海、广州、天津客商汇入，粮行20多家猛增到70多家，从业人员500多人；2006年：顺河老街列为省级历史文化街区；2026年3月：五河城墙旧址、顺河街码头旧址、民国顺河老街纪念碑纳入第四次文物普查新增文物点。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌顺河街邓家后人小邓（52岁）：\u003cbr\u003e▌老街住户陈奶奶（76岁）：\u003c/p\u003e"}, {"n": "阜南老城·台家寺", "s": "阜南", "p": "安徽", "w": "商代淮河青铜文明中心·龙虎尊出土地·原鹿会盟之城阜南建县才七十多年，却在台家寺发现了商代淮河流域最高等级的聚落和铸铜作坊；1957年一个渔民一网从润河捞出国家一级文物&quot;龙虎尊&quot;", "h": "\u003cp class=\"main-text\"\u003e&quot;1957年徐庭兰在河里撒网，一网兜上来个大家伙，锈得发黑。政府奖了他200块，顶我爹半年工钱。后来才晓得那叫龙虎尊，进北京了。&quot;。&quot;台家寺挖出1174块陶范，专家一比，跟龙虎尊纹路严丝合缝——原来这尊是三千年前就地在润河边铸的，不是外面运来的。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e台家寺遗址（国保）：朱寨镇三河村润河湾北岸，由1个大台墩+4个小台墩组成；方形环壕东西105米、南北85米、宽13-15米；围内大型宫殿基址、铸铜作坊；出土陶范1174块，证实龙虎尊在此铸造；龙虎尊（国家一级文物·禁止出境·高50.5厘米、口径45厘米）：肩部三条蟠龙，腹部三组双虎食人纹；1959年送藏中国国家博物馆，中国十大青铜器之一；原鹿故城遗址（公桥乡阮城村）：春秋鹿上会盟地，夯土城墙、护城河遗迹尚存，田野能捡到楚国蚁鼻钱、汉代铜镜；商代铜方鼎、铜鬲（1944年出土）：同出润河湾，比龙虎尊早13年；商代中晚期：台家寺成为商王朝在淮河流域的最高等级聚落、&quot;江淮金道&quot;上的铜料中转重镇；前639年：宋襄公在鹿上（今公桥乡阮城村一带，古原鹿故城）邀齐、楚会盟；1957年：朱寨镇农民徐庭兰在润河捕鱼，一网捞出8件商代青铜器（两尊两斝两觚两爵），其中的龙虎尊定为国家一级文物；2014-2017年：武汉大学联合安徽省考古所发掘台家寺，出土陶范1174块；2019年：台家寺遗址列为第八批全国重点文物保护单位。\u003c/p\u003e\u003cp class=\"main-text\"\u003e1949-1950年：拆阜阳、临泉、颍上部分乡镇设阜南县。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌朱寨镇三河村放牛老汉徐大爷（70岁）：\u003cbr\u003e▌博物馆讲解员小张（28岁）：\u003c/p\u003e"}, {"n": "谷阳老城·固镇", "s": "谷阳", "p": "安徽", "w": "西汉谷阳城遗址·862年郡县治所·字圣许慎为官地谷阳城建于西汉初，作为郡县治所延续862年，是&quot;固镇&quot;一名的源头（谷镇→固镇）；东汉文字学家许慎在此为官、著《说文解字》。", "h": "\u003cp class=\"main-text\"\u003e&quot;地里一锄下去净是汉朝碎瓦片子，早先不知道是宝，都捡去垫了猪圈。后来划成文保，种地都得绕着城墙根走。&quot;。&quot;固镇人一提起许慎，腰杆都直——写《说文解字》的字圣，在俺们这当过官呢。&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e谷阳城遗址（西汉·省保）：四方土城，每边城墙约1000米、面积100万平米；四门居中；遗址高于周围约3米、城墙残高平均3.5米、上宽20米、基宽30米、文化层厚3.5米；地表遍布汉代碎砖瓦、陶片；汉代&quot;谷阳之玺&quot;等出土文物（存固镇县博物馆）；许慎文化公园：纪念东汉字圣许慎；谷阳城樱花景观带：15万株、47种樱花环绕古城墙；西汉初：筑谷阳城，属沛郡谷阳县；后汉：属沛国；南北朝：北魏置阳平郡，太和年间改谷阳郡，改谷阳城为谷阳镇，俗称&quot;谷镇&quot;（后演变为今名&quot;固镇&quot;）；隋：废谷阳郡，仍为谷阳县；唐显庆元年：省谷阳入蕲县，城废；2004年：谷阳城遗址列为省级文保；2025年：编制《谷阳城遗址保护规划（2025—2035年）》，遗址与樱花景观结合活化。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌谷阳村种地老农（60岁）：\u003cbr\u003e▌许慎文化公园晨练老人：\u003c/p\u003e"}, {"n": "濉溪老城·柳孜运河·千年口子酒·临涣茶镇", "s": "濉溪", "p": "安徽", "w": "柳孜运河·千年口子酒·临涣茶镇隋唐大运河通济渠柳孜码头，19柳孜运河·千年口子酒·临涣茶镇隋唐大运河通济渠柳孜码头，1999年全国十大考古新发现，河下埋着唐代沉船与宋代码头；城里的口子酒酿了2700年，老井老窑池至今还在用。", "h": "\u003cp class=\"main-text\"\u003e隋大业元年（605）通济渠开凿，今濉溪正当汴水入睢之&quot;口&quot;，徐渡口→徐溪口→睢溪口→濉溪，地名随水势生生改了三回。柳孜镇便是运河岸边的码头，千帆往来、漕运繁忙，到了宋代石筑码头沿河而立。春秋时宋侯曾在此歃血会盟，韩非子《宋人酤酒》写的就是这一带酒家的故事，口子酒一酿2700年。明代万历年间镇上酒坊已有十余家，清晚期更膨胀到七十二家、占地三十七万㎡，民谣&quot;团城七十二居中尽得法&quot;。老井掘于隋唐，老窑池起于元末明初，六百年来一直沿用到今天。1999年柳孜运河遗址发掘出土8艘唐代沉船与宋代石构码头，一举揭开古运河路线之谜，入选全国十大考古新发现。柳孜运河遗址（世界文化遗产/柳孜镇）：路面上挖出的宋代石筑码头、多艘唐代沉船、成堆瓷器铜钱，2014年随大运河入列世界遗产。口子酒作坊（濉溪老城）：老井掘于隋唐，老窑池起于元末明初，600年不间断使用，是活着的酿酒遗迹。临涣古镇（浍河北岸）：江淮保存最完整的汉代城址之一，青石板街绵延，文昌阁、城隍庙古韵犹存，茶馆一壶棒棒茶5元能续一天。嵇康、刘伶的故里临涣，至今茶馆里还打着大鼓说书。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌濉溪老酒工 王师傅（71岁）：&quot;老祖宗传下来的窑池，泥是几百年的窖泥，我爹在池边酿酒，我孙子还在这池子边闻。老井的水打上来是甜丝丝的，酿酒、沏茶都靠它。口子这个名字，就是汴河水跟睢水合一道的口子上长出来的。&quot;\u003cbr\u003e▌柳孜村船工后代 老赵（67岁）：&quot;1999年挖公路，一铲子下去挖出个旧码头，那底下全是沉船、瓶瓶罐罐。我爷爷那辈人说柳孜街从前是码头上排队的船，一里长。千年走船的水路，如今归了地底下。&quot;\u003c/p\u003e"}, {"n": "蚌埠老城·千里淮河第一港·津浦铁路·长淮", "s": "蚌埠", "p": "安徽", "w": "千里淮河第一港·津浦铁路·长淮卫近代因津浦铁路兴起的&quot;火车拉千里淮河第一港·津浦铁路·长淮卫近代因津浦铁路兴起的&quot;火车拉来的城市&quot;，淮河第一座铁路桥1908年凿通，正街、老大街上还留着开埠的味道。", "h": "\u003cp class=\"main-text\"\u003e蚌埠古来是淮河边一个河滩小集，宋代正街便是河滩码头，明代定名&quot;正街&quot;，&quot;先有小蚌埠后有大蚌埠&quot;俗谚流传。光绪三十四年（1908）津浦铁路淮河铁桥建成，民国元年（1912）蚌埠站通车，这座淮河边的小码头一夜之间成了南北咽喉，渔船货栈拥塞淮岸。长淮卫是明洪武六年（1373）朱元璋御定的三大卫之一，苏轼&quot;十里清淮上，长堤转雪龙&quot;咏的正是这一段河湾。同治元年（1862）老大街（青年街）由陈氏三兄弟于苗沛霖之乱后倡建，成了民国时繁华的商业街。凤阳双墩遗址坐落在不远处的淮河边，7300年前的先民已在这片坡地生息。淮河铁路桥（津浦线/1908年建）：淮河上第一座铁路桥，桥墩桥座近120年仍在承重，火车照常驶过。老大街/青年街（同治元年陈氏建）：青石板老街，两侧老店铺、骑楼式门面还有开埠时的样子。正街（宋代码头）：河边旧街市，地名沿用至今。长淮卫：明代卫城遗迹散布在淮河湾边。双墩遗址（7300年）：淮河北岸的史前聚落，出土刻符陶片。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌蚌埠老船工 陈师傅（74岁）：&quot;老话讲&#x27;先有小蚌埠，后有大蚌埠&#x27;，我打小就在淮河里撑船。1908年那条铁桥一修，南来北往的货都从这过，码头上的绳子比我的胳膊还粗，一条龙排到河心。&quot;\u003cbr\u003e▌老大街老住户 李婶（66岁）：&quot;青年街那头的青石板，是清同治年间陈家弟兄铺的，踩了几百年磨得发亮。记得小时候街两边的店铺半夜还亮着灯，盐、布、铁器都在这条街上过手，热闹得很。&quot;\u003c/p\u003e"}, {"n": "霍邱老城·古蓼国·大青砖城墙·李氏庄园隋", "s": "霍邱", "p": "安徽", "w": "古蓼国·大青砖城墙·李氏庄园隋开皇十九年始置霍邱县，明代正德古蓼国·大青砖城墙·李氏庄园隋开皇十九年始置霍邱县，明代正德年间砖石城墙用大青砖糯米汁浆砌筑，护城河深6米宽10米，四门楼至今有名有姓。", "h": "\u003cp class=\"main-text\"\u003e霍邱古为蓼国之地，明末史志记&quot;华夏风水河&quot;淮河三面环城。隋开皇十九年（599）始置霍邱县。宋初筑土城墙，明成化年间培土加高，弘治五年（1492）扩城，挖出深6米宽10米的护城河，四门各设吊桥。正德七年（1512）改筑砖石城，用40×20×10cm大青砖，石灰糯米汁浆勾缝，城高6米、宽1米、周长4053.3米，四门楼分别为镇淮楼、来熏楼、朝阳楼、拱辰楼。康熙七年（1668）再扩建。民国二十八年（1939）拆城，古城墙渐次消失，唯地名与城墙根遗址留存。李氏庄园（清咸丰六年1856始建，全国四大地主庄园之一，2006年全国重点文保）：现存西圩140间房，占地70亩，青砖黛瓦、深宅大院。古城墙遗址：护城河与城墙基址在城周多处可见，河床、吊桥遗迹还能找着。淮河大堤与城河湾：三面环水的旧城格局依稀可辨。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌霍邱老居民 周大爷（70岁）：&quot;老城墙是大青砖垒的，砖缝里是糯米浆，硬得跟铁一样。我爹见过四门的城楼，镇淮楼正对着淮河，涨水时侯知府都要登楼看水。民国二十八年拆城，一车车大砖拉去修路，可惜了。&quot;\u003cbr\u003e▌李氏庄园后人 老李（63岁）：&quot;我们这庄园是清咸丰年间的老财主起家盖的，430间房子，现在还剩西边140间。石头门槛磨得光滑，天井里老槐树还在，房子空着，可砖瓦都是当年的。&quot;\u003c/p\u003e"}, {"n": "利辛老城·文州故城·西淝河·阴阳城唐武德", "s": "利辛", "p": "安徽", "w": "文州故城·西淝河·阴阳城唐武德三年置文州，州城就设在西淝河边文州故城·西淝河·阴阳城唐武德三年置文州，州城就设在西淝河边的张村铺一带，县境里阴阳城、伍奢冢都是东周汉代的古遗存。", "h": "\u003cp class=\"main-text\"\u003e利辛境内古来是淮北平原沃野，西淝河穿境，楚时期乾溪（阴阳城一带）为伍子胥故里，楚令尹子荡伐吴的乾溪之战发生在这条河畔。唐武德三年（620）置文州，治鲁丘堡/张村铺，领西淝河两岸之地，早废。五代宋以后，这一带分属阜阳、涡阳、蒙城、凤台等县。1964年析阜阳、涡阳、蒙城、凤台四县地置利辛县，县城设在利辛集。田野间阴阳城遗址（东周至汉）与伍奢冢（伍子胥之父的墓冢）遍布，是这片沃土千年人来人往的见证。阴阳城遗址（省级文保，东周-汉）：西淝河畔的古城址，城墙轮廓尚存，地表散见陶片。伍奢冢（大汶口文化晚期+东周汉，伍子胥父之墓冢）：高高的土冢立在平川上。禅阳寺遗址、纪家塔、柳叶县古城址（战国-宋）：田野间的旧城旧寺遗存，见证一朝一代的更迭。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌利辛老农 张大叔（69岁）：&quot;阴阳城那两堆土，小时候放牛天天去，老人说底下埋着一座城，从东周传到汉朝。土堆上捡过不少碎瓦片，洗洗还能看见花纹。&quot;\u003cbr\u003e▌伍奢冢守坟人后代 老刘（64岁）：&quot;冢子名叫伍奢冢，说是伍子胥他爹埋的。逢年过节还有人烧纸上坟，传了千把年的故事。春天冢上开满野花，好看，也荒凉。&quot;\u003c/p\u003e"}, {"n": "六安老城·皋陶故里·明代砖城墙·南北双塔", "s": "六安", "p": "安徽", "w": "皋陶故里·明代砖城墙·南北双塔&quot;中国司法鼻祖&quot;皋陶的故里，明皋陶故里·明代砖城墙·南北双塔&quot;中国司法鼻祖&quot;皋陶的故里，明代洪武十三年砖石城墙周长1010丈、垛口1364个，南门锥、北门锥双塔高耸，是皖西古城最后的念想。", "h": "\u003cp class=\"main-text\"\u003e六安古为皋陶的封地，上古四圣之一的皋陶&quot;明五刑、弼五教&quot;，被尊为中国司法鼻祖，其墓至今仍在。春秋时这里是六国国都，西古城遗址相传即夏仲甄之都、六国都城与九江王英布的都城，南北长471米、东西宽229米，四角城堡高10-13米，叠了7个文化层。隋唐时筑土城，明洪武十三年（1380）改砖石城，周长1010丈、高2.3丈，设朝京、镇南、通济、武定四门加月城与南北水关，外壕宽7丈深1.4丈。民国后城墙渐拆，今仅存云路桥北140米清代墙体，砖上有&quot;道光三年/城工&quot;铭文，2004年列省级文保。城中的南门锥（观音寺塔，9级高27米）与北门锥（多宝庵塔，北宋遗存，残高21.6米）双塔遥遥相望。皋陶墓（上古）：六安城东，墓冢高耸，享堂碑碣犹存。明城墙遗存（云路桥北140米清代墙体）：夯土砖砌，可见&quot;道光三年/城工&quot;砖铭。南门锥观音寺塔（9级，27米）：明代砖塔高踞城南。北门锥多宝庵塔（北宋，残高21.6米）：残塔立城北。西古城遗址（省保/1981年）：四角城堡、多个文化层，晨昏可辨城垣轮廓。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌六安老文保员 王伯（72岁）：&quot;皋陶是咱六安的根，&#x27;画地为牢&#x27;的说法就从他那来的。云路桥北那截老城墙，砖上刻&#x27;道光三年&#x27;，道光年补的工。四门四塔，南门锥北门锥，老早城里的孩子都爬过。&quot;\u003cbr\u003e▌六安老市民 刘姨（65岁）：&quot;南门锥的塔是砖的，一层一层往上收，夏天傍晚塔影拉得老长。皋陶墓那棵老树，树下歇脚的人都说，这是断案断了几千年的人埋的地方。&quot;\u003c/p\u003e"}, {"n": "明光老城·女山湖沉城·旧县镇·嘉祐院女山", "s": "明光", "p": "安徽", "w": "女山湖沉城·旧县镇·嘉祐院女山湖下埋着一座元代沉入湖底的招信女山湖沉城·旧县镇·嘉祐院女山湖下埋着一座元代沉入湖底的招信古城，镇上老人说&quot;一夜沉城&quot;，郯庐断裂带又给这个传说添了地质注脚。", "h": "\u003cp class=\"main-text\"\u003e明光古称招信（汉赘其县、宋招信县），女山湖镇旧名&quot;旧县&quot;，正因老县城迁走而得名。汉晋设县，宋称招信，城傍女山湖而建。约元末大水，古招信城大半沉入湖底；明正德十二年（1517）黄河决堤、淮水泛滥，湖中城只剩半平方公里的小岛。湖底至今能捞出唐宋城砖、古钱币与陶片，印证这座城确实沉在水下。嘉祐院相传宋仁宗南渡时驻跸，现存的清代大殿6间还在。明太祖朱元璋生于斯地，相传明光山上有&quot;五色云气&quot;，&quot;旧县十景&quot;里记着这些传说。嘉祐院（清代重建大殿6间）：女山湖畔的旧寺院，宋仁宗驻跸的旧地。古戏台、招信寺、火神庙：湖边旧庙旧台散布。700年古柏：湖岸老树，粗可合抱。湖底遗存：旱季水浅时，湖岸滩涂能捡到唐宋城砖与古钱币。女山湖&quot;沉城&quot;传说：旧县镇老人代代口传的&quot;一夜沉城&quot;故事。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌明光老渔民 孙师傅（73岁）：&quot;女山湖水底下埋着旧招信城，老辈说晌午好好的，一夜大水过来，城就没了。天旱水浅的时候，湖边能摸到城砖，还有带字的铜钱，一洗全是青绿锈。这是真的，不是瞎编。&quot;\u003cbr\u003e▌嘉祐院看庙人 陈姨（66岁）：&quot;老辈讲宋仁宗避难在这住过，叫嘉祐院。大殿现在还剩6间，屋里供着老菩萨。门口那棵柏树700年了，村里办喜事都来系红布。&quot;\u003c/p\u003e"}, {"n": "定远老城·东城遗址·炉桥古镇·东周古城秦", "s": "定远", "p": "安徽", "w": "东城遗址·炉桥古镇·东周古城秦置曲阳、阴陵、东城三县拱卫，东东城遗址·炉桥古镇·东周古城秦置曲阳、阴陵、东城三县拱卫，东城遗址是汉代东成侯的国都；炉桥镇相传曹操在此建冶铸剑，地名棠火飘了1800年。", "h": "\u003cp class=\"main-text\"\u003e秦始皇二十六年（前221）置九江郡，今定远境内同时设曲阳、阴陵、东城三县。东城为汉代东成侯刘良的封国县治，秦砖汉瓦、古井70多口遍布城址，公元202年项羽败走东城、公元前209年&quot;项羽至阴陵迷失道&quot;的故事就发生在这片土地上。汉文帝封淮南厉王刘长子刘良为东成侯，城东南的&quot;红卫汉墓&quot;相传即其墓。隋开皇三年（583）废郡，大业十一年（615）县废，唐武德二年（619）复置定远县，天宝四年（745）迁至今治。炉桥古镇原名冶溪，建安十三年（208）曹操在此建炉铸剑，窑河上的石桥、马场湖、马园——曹军骑兵驻地——地名沿用至今。宋代的定远城墙在旧城仍有遗址可寻，今县城边的护城河、北城墙、南城墙遗址均是宋明遗物。东城遗址（省保/1998年，汉代东成侯国都）：内外两城轮廓清楚，城基高出地面3米，四角城楼高5米，护城濠深约1丈，城中古井70多口，遍地秦砖汉瓦残片。定远宋城墙遗址：北城墙、南城墙遗迹尚存，护城河与后北城墙遗址在旧城可见。炉桥古镇（1800年）：三眼井青石井盖、马道井、窑河石桥、马场湖地名犹在。古曲阳城（秦置，草庙湖下）：高塘湖水下埋着被浮山堰淹没的西曲阳故城。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌定远老农民 高大叔（68岁）：&quot;东城遗址这土岗子，老人叫&#x27;城里头&#x27;，全是秦砖汉瓦。老辈说那是楚霸王项羽走丢的地方，然后往东就到东城去了。土堆上捡过一块带细纹的瓦，黑亮黑亮的，说是汉瓦。&quot;\u003cbr\u003e▌炉桥老住户 郑叔（71岁）：&quot;炉桥这地名，是曹操在这山沟里炼铁铸剑来的，窑河上一座石桥，河这边是马场湖——操练骑兵的场子。三眼井那口井盖是整块青石凿的，三个眼，夏天打上来的水凉得沁牙。&quot;\u003c/p\u003e"}, {"n": "天长老城·千秋古县·老西门·四大古镇唐代", "s": "天长", "p": "安徽", "w": "千秋古县·老西门·四大古镇唐代天宝元年置千秋县、以玄宗生辰&quot;千秋古县·老西门·四大古镇唐代天宝元年置千秋县、以玄宗生辰&quot;天长节&quot;命名，崇本门、老西门的古城格局与&quot;茉莉花&quot;歌谣里的水乡风韵犹存。", "h": "\u003cp class=\"main-text\"\u003e天长春秋称&quot;卑梁&quot;，《史记》&quot;卑梁之衅&quot;因边民争桑而起；北周改石梁县，隋大业初改永福县，唐代贞观年间石梁废。开元十七年（729）唐玄宗定八月五日为千秋节，天宝元年（742）割江都、六合、高邮三县地置千秋县，天宝七年（748）更名天长县，沿用至今。宋置天长军，南唐升雄州。明代天长隶属凤阳府，嘉靖年间筑城，崇本门正对朱元璋龙兴之地。今老西门、老南门格局尚存，崇本门于2017年护城河治理时发现旧墙基而重建。市境里的秦栏（孝子朱寿昌&quot;弃官寻母&quot;故里，千年&quot;孝子树&quot;尚存）、铜城、金集、汊涧四大古镇，各有明清街巷遗韵。崇本门（明代，重建后一层为旧物展示馆）：老城墙砖、石碾、石磨、上马石等百余件旧物收在一层。老西门古巷（越河巷、胭脂巷、礼堂巷等）：青砖老巷纵横，巷子四通八达，形如迷宫。秦栏&quot;孝子树&quot;（朱寿昌手植，千年）：孝子故里的老树仍在。龙岗古镇（铜城镇下，明清老街，&quot;荷形&quot;村落）：三面环水的古村，明清街巷保存完好。马家墩遗址（5000年）、石梁古城遗址（千年）。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌天长老居民 吴奶奶（72岁）：&quot;崇本门是嘉靖年间的老城门，正对着凤阳，那是给皇帝家的老家开的。2017年清护城河挖出老墙根，又照着原样盖起来了。老西门这巷子啊，越河巷、胭脂巷弯弯绕绕，走进去跟走迷宫似的，可总有路能穿出来。&quot;\u003cbr\u003e▌秦栏老菜农 朱大爷（70岁）：&quot;我们秦栏讲孝子，朱寿昌弃官找娘的故事传了千年。他手栽的那棵&#x27;孝子树&#x27;现在还活着，老树发新芽，村人拿它当宝贝。开春树下头坐满了歇脚的人。&quot;\u003c/p\u003e"}, {"n": "全椒老城·襄水环城·吴敬梓·走太平著名讽", "s": "全椒", "p": "安徽", "w": "襄水环城·吴敬梓·走太平著名讽刺小说《儒林外史》作者吴敬梓的襄水环城·吴敬梓·走太平著名讽刺小说《儒林外史》作者吴敬梓的故乡，县城山水环抱、襄水绕城，&quot;正月十六走太平&quot;的民俗从东汉传到今天、千万人同走。", "h": "\u003cp class=\"main-text\"\u003e全椒古为椒国/椒邑，黄帝之孙颛顼在覆釜山建古椒国，西汉高祖四年（前203）置全椒县。东晋平北将军姚襄筑襄城，襄河由是得名，绕城千年如护城河。春秋伍子胥伐楚、项羽垓下突围曾路经此地，霸王桥、饮马池、楚迷沟的地名至今还在。明代吴敬梓先祖吴国对探花及第建&quot;探花第&quot;（河湾老街），吴敬梓在此度过少年，中年家败移居南京，以十年之功写成《儒林外史》。城里的&quot;正月十六走太平&quot;自东汉传承至今1500多年，清明时数十万人从积玉桥（汉代建）过袁家湾老街、红栏桥（宋代建）、太平桥，祈愿平安。吴敬梓纪念馆与故居（襄河两岸隔水相对）：探花第旧地，青砖硬山、马头墙，遗园与文木山房的旧影可寻。袁家湾老街（明清历史地段）：东西向老街为骨，连着仙鹤巷、袁家湾巷、邱家院等老巷，铁匠铺、豆腐坊等老手艺店铺尚存。积玉桥（汉代）、红栏桥（宋代）、太平桥：三桥串起&quot;走太平&quot;的老路线。尊经阁、笔峰塔、北极阁：襄河两岸的旧阁古塔与山景相映。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌全椒老手艺人 孙师傅（73岁）：&quot;袁家湾那条街，从积玉桥进、过红栏桥、上太平桥，正月十六几十万人走这条道，图个平安。街上老铁匠铺、豆腐坊、蔑器行都还开着，手艺是一代一代传下来的。&quot;\u003cbr\u003e▌吴敬梓纪念馆讲解员 周老师（68岁）：&quot;吴敬梓年轻在全椒的探花第住过，后来家道中落才去了南京写《儒林外史》。故居隔河正对着纪念馆，河水一隔就是一辈子。他那支笔，把假儒生一个个都写活了。&quot;\u003c/p\u003e"}, {"n": "来安老城·永阳古城·太平古城·南北四门五", "s": "来安", "p": "安徽", "w": "永阳古城·太平古城·南北四门五代南唐建县、南宋迁治大雍镇（今永阳古城·太平古城·南北四门五代南唐建县、南宋迁治大雍镇（今新安镇），清代四门宾阳/庆成/迎薰/拱极尚有名字，滁河边还躺着一座1400年的太平古城。", "h": "\u003cp class=\"main-text\"\u003e来安县建于五代南唐，县城南宋时迁至大雍镇（今新安镇）。旧城地势东低西高，主街呈&quot;十&quot;字形，东西南北四门为宾阳、庆成、迎薰、拱极，另有崇文小南门、耀武小西门。城内旧有县衙署、儒学宫、开元观、大成殿、明伦堂、东壁楼（鼓楼）、城隍庙等，多毁于兵火年久；尚存琉璃井、县署井、北门井、东门开元观井4口古井。清末民初城墙犹在，民国27年（1938）拆城、护城河填平。滁河边还有一个更老的太平古城，始建于隋唐，长800米、宽500米、面积40万㎡，曾是江淮间的水陆码头，城墙高约8米、底宽6米、顶宽4米，青砖砌筑。来安旧城4口古井（琉璃井、县署井、北门井、开元观井）：旧城中心的活水遗迹，井栏井石犹存。太平古城（隋唐，滁河边）：遗存的青砖城墙高约8米，明代的太平石拱桥长30米、桥心铺&quot;龙纹石&quot;，古街两侧明清建筑仍在。青龙街八面塘（1984年出过新石器石器）：城东旧塘，找到过7000年前的石器。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌来安老居民 马叔（70岁）：&quot;老城四门叫宾阳、庆成、迎薰、拱极，听着就气派。民国二十七年拆的城墙，护城河后来填平盖了楼。剩下那几口老井，琉璃井的水夏天打上来还是清凉的，街坊还来打水泡茶。&quot;\u003cbr\u003e▌太平古城老住户 吴婶（65岁）：&quot;滁河边那个老城，说是隋唐就有了，城墙青砖垒的，八米高。太平桥是明朝的，桥心那块龙纹石，小孩过桥都踩一脚讨个吉利。老街两边的铺子还是老式两层楼，青砖灰瓦。&quot;\u003c/p\u003e"}, {"n": "淮南老城·淮河老街·田家庵·舜耕山从\"老", "s": "淮南", "p": "安徽", "w": "淮河老街·田家庵·舜耕山从&quot;老田家的庵子&quot;到淮上重镇，田家庵淮河老街·田家庵·舜耕山从&quot;老田家的庵子&quot;到淮上重镇，田家庵老城（淮河老街）浓缩了20世纪市井；城北寿县、八公山、芍陂、武王墩分踞楚风汉韵。", "h": "\u003cp class=\"main-text\"\u003e淮南这片土地，名始见于西周青铜器应侯见工簋铭文&quot;淮南夷&quot;，距今2900多年。春秋时淮夷在此建州来国，楚灭蔡后改下蔡为寿春，西汉高祖封刘长为淮南王、都寿春（今寿县），续国八十一年。寿县古城内大城几度为都：楚考烈王迁都寿春（前241），末代楚都格局东西6.2公里、南北4.25公里。今田家庵区本身由淮河渡口的&quot;老田家的庵子&quot;起家，民国后淮河航运日盛，正街、淮河老街、老码头渐成商贸重地，牧童谣与渡口的市声在这里铺开。田家庵淮河老街（老北头）：老码头巷、红旗照相馆、回民饭店、候船室等老建筑修缮如旧，青石板路面复刻旧时肌理，巷弄里藏着20世纪的烟火气。寿县古城（宋代城墙900年）：7147米宋代城墙保存完好，四门瓮城俱存，报恩寺、孔庙、二十四节气馆在城内。寿春城遗址（末代楚都，大城轮廓清楚）。武王墩（2025年考古轰动，楚王级大墓）：出土&quot;新楚大鼎&quot;与成套九鼎八簋、50多张瑟。八公山（刘安墓、廉颇墓、珍珠泉等30余处）。安丰塘芍陂（比都江堰早300年）。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌田家庵老码头工 刘师傅（72岁）：&quot;老田家的庵子&quot;就是咱这名字的来头——从河滩上一个歇脚的庵堂，长成了淮上大码头。老北头那条街，候船室、回民饭店、红旗照相馆，民国到六七十年代的房子一溜排，青石板是照着老样重铺的。\u003cbr\u003e▌寿县城墙边老住户 老孙（68岁）：&quot;寿县的城墙是宋代筑的，900多年，7公里多的一整圈，四门都有瓮城。&#x27;风声鹤唳&#x27;&#x27;投鞭断流&#x27;都发生在咱这城边的淝水。老城墙上的砖，一块块都有故事。&quot;\u003c/p\u003e"}, {"n": "淮北老城·相土筑城·隋唐运河·相山显通寺", "s": "淮北", "p": "安徽", "w": "相土筑城·隋唐运河·相山显通寺商汤十一世祖相土在此筑城而得名相土筑城·隋唐运河·相山显通寺商汤十一世祖相土在此筑城而得名&quot;相城&quot;，隋唐大运河穿城、柳孜遗址2014年入列世界遗产，历代郡国都城遗落在平原上。", "h": "\u003cp class=\"main-text\"\u003e淮北古称相城，史载商汤十一世祖相土在此立城，距今四千多年龙山文化已经繁盛。春秋宋国曾迁都相城，秦设泗水郡、西汉沛郡治所、东汉沛国国都都设在相城，平原上的城邑周而复始。隋大业年间通济渠自西向东穿过今濉溪、相山、烈山，柳孜成为运河重镇。唐以后运河渐衰，临涣古镇却因浍河之利始终繁华，现存江淮地区保存最完好的汉代城址之一。1960年因煤建市，名濉溪市，1971年更名淮北市——一座因煤而兴的工业新城，把古相城的记忆藏进了地名与博物馆。相山显通寺（西晋太康五年284始建，现存清代建筑）：相山之巅，乾隆御题&quot;惠我南黎&quot;碑刻犹在，寺内千年古槐银杏覆荫。历山相城遗址（相土筑城地）：平原上秦汉城的印痕尚可寻。临涣古城（浍河北岸，汉代城址）：青石板街、文昌阁、城隍庙，茶馆5元一壶棒棒茶续一天。柳孜运河遗址（世界文化遗产/2014年）：宋代码头、唐代沉船、南北窑口瓷器，2025年新开遗址博物馆。淮北市博物馆（国家一级馆）：汉画像石、运河瓷器，52米东阳木雕壁画再现柳孜盛景。\u003c/p\u003e", "r": "", "c": "\u003cp class=\"comment\"\u003e▌淮北老职工 张师傅（73岁）：&quot;咱这地方老名叫相城，是商朝老祖宗相土筑的城，几千年了。山上的显通寺，西晋就有，乾隆爷还题过&#x27;惠我南黎&#x27;的石碑。城里老人都知道，隋唐大运河就从咱这过，柳孜的码头挖出来过唐代沉船。&quot;\u003cbr\u003e▌临涣老茶馆主 陈爷（69岁）：&quot;临涣的城墙是汉代的，两千多年了，还立在那。茶馆里一壶棒棒茶5块钱能坐一整天，用回龙泉的水泡，听大鼓书、说评书。老街青石板磨得溜光，脚下就是明清的车辙印。&quot;\u003c/p\u003e"}, {"n": "桐城老城", "s": "桐城", "p": "安徽", "w": "金龟城·六尺巷·紫来桥·文都桐城？明代万历筑的砖城状如金龟趴伏龙眠河畔，号称&quot;铁打桐城&quot;。六尺巷一封让墙信&quot;让他三尺又何妨&quot;，紫来桥五孔石桥还在，文庙元代始建至今香火不绝。", "h": "\u003cp class=\"main-text\"\u003e明代万历年间（1575）知县陈于阶以砖筑城，城周长六里，开六门，形制方圆如龟盖，北高南低恰似金龟饮水，民间称为&quot;金龟城&quot;，有&quot;铁打桐城&quot;之誉。城墙内土外砖，设有垛口，护城河环绕。清咸丰年间城墙一度受损，同治年间重修。二十世纪五十年代后城墙渐次拆除，仅东作门一带尚有残迹，为今之复建提供依据。县城历来文风鼎盛，明清两代出进士三百余人，张英、张廷玉&quot;父子宰相&quot;，方苞、姚鼐、刘大櫆桐城派大家皆出于此，故称&quot;文都&quot;。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e六尺巷：清康熙年间张英家人与邻居争宅基地，张英回信&quot;让他三尺又何妨&quot;，两家各退三尺成六尺巷。巷道全长100米宽2米，鹅卵石铺就，现存砖石巷道为今人依史复建，是桐城&quot;礼让&quot;的城市名片；东作门：明万历四年（1576）重筑砖城，东门&quot;东作&quot;取农事耕作之意，2008年依旧制在原址重建；城门洞上方石额&quot;东作&quot;二字仍可辨；紫来桥：元末始建，五孔石桥长48米，横跨龙眠河；道光年间桐城派文人以&quot;紫气东来&quot;更名紫来桥，青石桥面车辙深印；文庙：元延祐年间（1314-1320）始建，明代移建今址，大成殿、大成门、泮池保存完整，楠木梁架为江南少见；北大街：明清老街肌理尚存，青石板路、马头墙店铺林立；龙眠河：穿城而过的母亲河，宋代李公麟曾归隐龙眠山，自号龙眠居士。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌桐城北大街老住户 吴奶奶（74岁）：&quot;六尺巷那故事是真的，张家让步让出了名气。我小时候天天在紫来桥上看人挑水过龙眠河，桥面都磨光了。文庙里供着孔子，桐城读书人多，老话说&#x27;穷不丢书，富不丢猪&#x27;，这话到今儿还灵验。&quot;\u003cbr\u003e▌紫来桥边卖米酒的老谢（61岁）：&quot;这桥是元朝造的，五孔，长得很，河涨水也冲不垮。桥缝里卡着老船钉，大人说那是康熙年间的。现在桥还在走车走人，桥下的龙眠河还是老样子，一抬头就是文庙的飞檐。&quot;\u003c/p\u003e"}, {"n": "潜山老城", "s": "潜山", "p": "安徽", "w": "皖国都城·梅城土城墙·薛家岗十三孔石刀？潜山古称皖城，是古皖国都城所在，安徽简称&quot;皖&quot;即源于此。城区残留着明清土城墙四段，薛家岗遗址出土的十三孔石刀把中国新石器开孔工艺推到极致。", "h": "\u003cp class=\"main-text\"\u003e潜山春秋为皖国，西汉设皖县，安徽简称为&quot;皖&quot;即源于此。唐贞观年间设舒州，治皖城。宋末元初，梅城因处皖河冲积平原，屡毁于水患，城池反复修筑。明成化年间筑土城，嘉靖年间砌砖，开四门，城周约三里。清咸丰年间再修，护城河引皖河水。二十世纪后城墙多拆，唯临河处土城墙因防洪需要得以保存至今。三国时曹操经略皖城，庐江郡治曾设于此；隋唐至北宋，天柱山为佛教禅宗南传重地，三祖寺、山谷流泉摩崖遍布文人题刻，王安石、苏东坡、黄庭坚皆曾游历。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e天柱山（古南岳）：汉武帝元封五年（前106）南巡登礼天柱山，封为南岳，此山海拔1489.8米，摩崖石刻遍布；梅城土城墙：明清梅城城墙，沿河而筑，今东门河堤、雪湖南岸、西环路一带尚存青石垒砌的四段残墙，夯土墙体内可见明代城砖；薛家岗遗址：新石器时代遗址，出土十三孔石刀（长51.6厘米），把石刃开孔数量推到十三孔，为全国之最；另有玉琮、陶器数千件，距今约5000年；皖公古墓与皖公像：东周皖国君主墓，山巅立皖公石像；二乔故居遗址：汉末乔玄二女大乔小乔故里，胭脂井遗迹流传。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌梅城雪湖南岸老住户 韩大爷（70岁）：&quot;这段土城墙从明朝就有了，靠河那边一直护着，青石砌的，结实得很。小时候我们爬上去玩，砖缝里还能抠出老铜钱。薛家岗挖出来的十三孔石刀我见过图了，那手艺，谁说五千年前的人笨？&quot;\u003cbr\u003e▌潜山老街坊 储奶奶（68岁）：&quot;天柱山老辈人都叫南岳，汉武帝封的。城里老槐树底下听人说书，讲的就是二乔、皖公这些老故事。城墙拆了，但河边的土城埂还在，那就是潜山的根。&quot;\u003c/p\u003e"}, {"n": "安庆老城", "s": "安庆", "p": "安徽", "w": "振风塔·迎江寺·倒扒狮街·长江第一塔？安庆是安徽之名&quot;安&quot;字的来处，明隆庆年间建的振风塔高64.8米，雄踞江岸号称&quot;长江第一塔&quot;；倒扒狮街明代门楼上的四排石狮，是安庆六百年来商贸繁华的活证人。", "h": "\u003cp class=\"main-text\"\u003e安庆之名起于南宋&quot;同安郡&quot;与&quot;德庆军&quot;各取一字。明万历年间设按察使、兵备处于此，成为皖江重镇。清康熙年间安徽建省，安庆为省会长达两百余年，省内第一座近代工业城。振风塔自明代耸立江岸，为安庆地标；太平天国时期城墙存废反复，清末洋务运动中安庆内军械所诞生了中国第一台蒸汽机与第一艘小火轮。同治二年（1863）曾国藩于安庆设内军械所，徐寿、华蘅芳在此造出中国首台蒸汽机。1920年代后铁路公路兴起，江运渐衰，城墙随之拆除，惟振风塔、迎江寺与倒扒狮街区留存，成为&quot;安徽之源、宜城安庆&quot;的记忆坐标。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e振风塔：明隆庆四年（1570）始建，塔高64.8米七层八角，塔内螺旋石阶168级，临江而立，号称&quot;万里长江第一塔&quot;；塔身嵌有明代砖雕佛像；迎江寺：北宋开宝七年（974）始建，原名万佛塔寺，现存殿宇多为清代重建，山门前一对铁锚是安庆独有的&quot;镇船锚&quot;；倒扒狮街：明代隆庆年间建的门楼，四排石狮&quot;倒扒&quot;朝街，取狮子镇邪吉祥之意，为安庆现存最老的石牌门楼；两侧骑楼商铺延续明清商贸格局；振风塔下的古钱塘街、火正街：明清安庆商业网点的旧街名仍在使用；江岸码头群与大观亭遗址：皖河长江交汇处，历代漕运盐运重埠。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌倒扒狮街老商户 郑老板（66岁）：&quot;这牌楼上的狮子是明清就有的，四排石狮倒着扒，镇邪的。街两边老铺子换了好几茬主人，但骑楼的廊柱还是旧的。我爷爷的爷爷在这街上卖布，传到我这辈卖干果，倒扒狮街的街名一天没断过。&quot;\u003cbr\u003e▌迎江寺看塔人 周师傅（58岁）：&quot;振风塔64米8，七层，爬168级台阶上去，长江就在脚底下。老话说&#x27;塔不倒，江不决&#x27;，安庆人对这塔亲得很，那是咱的定江神针。&quot;\u003c/p\u003e"}, {"n": "怀宁石牌老城", "s": "怀宁石牌", "p": "安徽", "w": "京戏源头·徽班进京·无石不成班？&quot;无石不成班，无徽不成商&quot;，石牌是京剧真正的源头。清代石牌老街上走出高朗亭的三庆班，徽班进京二百多年后，石牌老街的弦索声仍是那个起点。", "h": "\u003cp class=\"main-text\"\u003e怀宁历史可溯至东晋，最初县治在今县城一带。清乾隆年间石牌因处皖河通江之利，商贾云集，戏班林立，&quot;无石不成班&quot;成为梨园行话。高朗亭率三庆班进京，与四喜、和春、春台合称&quot;四大徽班&quot;，由此孕育出京剧。光绪年间怀宁县治一度在石牌，1950年迁至石牌镇，2002年县城再度西迁，石牌保留为皖西南文化名镇。今天的石牌街头，茶馆里仍有人哼唱黄梅戏，老街的砖墙木板门在夕阳里泛着旧红，那是&quot;京戏源头地&quot;最后的温柔。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e石牌老街（上下石牌）：分上石牌、下石牌，鼎盛时25条街巷纵横，青石板路、马头墙徽式店铺绵延，为皖西南商贸重镇；徽班进京三庆班旧址与石牌戏窝子：清乾隆五十五年（1790）高朗亭率三庆班自扬州进京，石牌由此成为&quot;京剧之村&quot;；老街保留旧戏楼遗址；石牌古镇文武庙旧址：清同治年间徽式建筑，庙前广场为旧时酬神唱戏之所；猫山新城遗址：清代石牌老城为长江支流环抱，新城系民国后因水患西移所建，遗址可见老城墙基；石牌早茶与黄梅戏：街头茶楼弦索不绝，京、黄二腔并茂。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌石牌老街老戏迷 方向东（69岁）：&quot;&#x27;无石不成班&#x27;，说的就是咱石牌。京剧老祖宗高朗亭就是石牌人，他带的三庆班进京，唱出了京戏。我打小唱黄梅，也学京戏的西皮二黄，街上老茶馆里两样都能听见。&quot;\u003cbr\u003e▌石牌镇文化站老站长 黄爷爷（73岁）：&quot;石牌老街当年25条街，布行药铺茶馆数不清，全靠着河码头。戏台就搭在文庙前，逢年过节唱大戏，四面八方的班社都来赶场。我小时候挤在人堆里看戏，那个热闹，一辈子忘不了。&quot;\u003c/p\u003e"}, {"n": "望江老城", "s": "望江", "p": "安徽", "w": "雷池之滨·三孝故里·七街十巷八桥？&quot;不敢越雷池一步&quot;的雷池就在望江，全城七街十巷八桥七十二条弄，明万历三年（1575）筑砖城，出过孟宗哭竹、王祥卧冰、徐仲源泣墓&quot;三孝&quot;。", "h": "\u003cp class=\"main-text\"\u003e望江古属楚地，晋代建雷池、雷港。明万历三年（1575）知县蒲以遇筑砖城，周长约六百丈，开七门。清咸丰、同治年间城池屡修，为安庆外围重镇。县城倚香茗山、临泊湖，水网密布，旧时以&quot;七街十巷八桥&quot;勾连。二十世纪后城墙渐拆，环城路即旧城基。历代望江人才辈出，明代县学文庙香火不绝；&quot;雷池&quot;一词借喻持守本分、不敢逾越，成为汉语常用典故，望江也因此被称作&quot;不敢越雷池一步&quot;的故地。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e文庙大成殿：明末清初重建，五开间歇山顶，飞檐翘角，现存皖西南最完整的文庙大殿之一；雷池：古雷水与池水交汇处，晋代庾亮&quot;足下无过雷池一步&quot;令典即出于此，今雷池乡一带湖泊池沼连片；三孝祠：纪念孟宗、王祥、徐仲源三位孝子，旧祠废而&quot;三孝故里&quot;之名沿用至今；望江县署旧址与老城墙基：明万历三年（1575）筑砖城，城周一里，设孝感、翔凤等七门；今护城河沿线尚有部分墙基；香茗山、太阳山、泊湖：县境山水，古有&quot;望江八景&quot;。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌望江县署街老街坊 徐阿姨（65岁）：&quot;文庙的大成殿还是明朝的老样子，飞檐翘角的，梁上彩绘都还在。雷池就在城外的圩里，老话说&#x27;不足无过雷池一步&#x27;，咱望江人守着这份本分，过自己的日子。&quot;\u003cbr\u003e▌望江三孝祠旧址旁 老童（58岁）：&quot;三孝祠是老字号了，孟宗哭竹、王祥卧冰、徐仲源泣墓，都是咱望江人。城还是明万历年间的格局，七街十巷八桥，桥多的很。河边的老城墙基还在，砖给拆了，土埂子还杵着。&quot;\u003c/p\u003e"}, {"n": "太湖老城·晋熙", "s": "太湖", "p": "安徽", "w": "西正街之河街·鱼骨街巷·南朝建街？太湖县治晋熙的西正街俗称河街，始建于南朝元嘉末年（424-452），一千五百多年没挪窝，主街两侧鱼骨般岔出条条小巷，是江南罕见的古街&quot;活化石&quot;。", "h": "\u003cp class=\"main-text\"\u003e太湖县始建于南北朝，县治晋熙镇地处皖河之滨，自南朝起商贸渐兴。西正街因临河得名河街，为千余年来太湖最繁华的商贸动脉，粮食、布匹、山货经皖河转运进出。明万历年间筑砖城，崇祯九年（1636）为镇水患将六门一一更名，屡毁屡建。清中叶为水患所迫，县城西街外迁，老街格局渐定。二十世纪中叶花亭湖水库建成，部分旧街市沉入水下，但河街区至今仍是太湖最有烟火气的所在，逢集日人流如织，老铺子的木门板吱呀开合。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e西正街（河街）：东起韦家巷、西至马路河口，长约650米；南朝元嘉末（424-452）始建，现存清代徽派店铺与马头墙，鱼骨状街巷肌理保存；韦家巷、华美巷等支巷：自河街两侧呈鱼骨状岔开，青石板铺路，深宅高墙间藏着老井；花亭湖：县西水库，库区淹没了古城的部分街市，湖滨老村落群成片；徐桥老街：太湖南境古镇老街，青石板街、徽派建筑仍存。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太湖文庙遗址与老城北门：明万历年间屡毁屡筑的城墙遗址，护城河残迹，老城砖散落街巷。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌河街布店老板娘 孙姐（60岁）：&quot;这条街一千五百多年了，从南朝就有。两边门面是清代的马头墙，一架架小木楼，鱼骨一样的巷子岔开去。赶集的日子，山里的山货、河里的鱼鲜都往这街上涌。我嫁到河街三十年，看着它老，也看着它活。&quot;\u003cbr\u003e▌韦家巷老住户 石爷爷（72岁）：&quot;我家巷子口那口井，青石井圈磨得溜光，打了几百年水了。街上的老铺子一家挨一家，砖墙进了水泛着青苔。太湖城老，河街更老，老得连县志都记不清它啥时候建的。&quot;\u003c/p\u003e"}, {"n": "宿松老城", "s": "宿松", "p": "安徽", "w": "松兹侯国·小孤山·白崖寨·黄梅戏发源地？宿松始封松兹侯国于西汉，城东江畔小孤山一柱擎天，江中有&quot;海门第一关&quot;之誉；南宋白崖寨绵延十余华里号称&quot;南国小长城&quot;，还是黄梅戏的发祥地。", "h": "\u003cp class=\"main-text\"\u003e宿松置县始于西汉，初为松兹侯国，唐代始称宿松。地处皖、鄂、赣三省交界，长江自此出皖境。晋代诗人李白曾来游，作&quot;浮云知古城，落日见秋色&quot;，咏的便是宿松。北宋时县城屡筑新城，青白釉瓷器烧造声名远播，南京市博藏有一件宿松北宋青白釉仙人吹笙壶，为全省仅见的国宝瓷。元末白崖寨筑就，明清两代兵燹屡经，城墙存废循环。二十世纪后临江商贸渐衰，但小孤山依旧耸立，白崖寨依旧巍然，老街的弦索声里还留着黄梅调的影子。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e小孤山：海拔78.3米，孤峰耸立长江北岸，嶙峋削立，号称&quot;海门天柱&quot;&quot;江上第一关&quot;，山顶启秀寺、御碑林立；白崖寨：元末吴仕杰筑的石头寨墙，沿山蜿蜒十余华里，以青石垒砌，垛口瞭望台保存完好，人称&quot;南国小长城&quot;；松兹故城遗址：西汉高祖时封松兹侯国，故城位于今县城一带，夯土遗存偶见；黄梅戏发祥地：宿松与黄梅隔江相望，采茶调在此孕育流行，为黄梅戏早期流传的核心区；县城老城墙基与雷港故道：江畔港埠废兴，老地名沿用。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌小孤山船工 骆师傅（63岁）：&quot;小孤山一柱擎天，立在江心里，老话叫&#x27;海门天柱&#x27;。跑船的看到小孤山就知道到宿松、出皖江了。山顶的庙香火旺，过江的都上去拜。李白到过这，写&#x27;浮云知古城&#x27;，那字还刻在山崖上。&quot;\u003cbr\u003e▌白崖寨护寨人 王大叔（68岁）：&quot;这寨墙是石头的，元末吴仕杰筑的，沿山十几里，垛口枪眼都在，人称&#x27;南国小长城&#x27;。我小时候就在寨墙上放牛，青石缝里长着老苔。城墙会老，这石头寨子比县城的老城墙还硬气。&quot;\u003c/p\u003e"}, {"n": "枞阳老城", "s": "枞阳", "p": "安徽", "w": "上码头老街·射蛟台·洗墨池·川字三街？汉武帝在枞阳射蛟、陶侃在洗墨池洗笔。上码头老街后街、中街、河街三街似&quot;川&quot;字并列，是皖江老码头难得一见的旧街格局。", "h": "\u003cp class=\"main-text\"\u003e枞阳西汉初置县，武帝元封五年（前106）南巡经此射蛟，于是设枞阳，属庐江郡。三国时为魏吴交争之地，地名&quot;周瑜镇&quot;流传。东晋陶侃曾令于此，凿洗墨池明志。隋唐以后枞阳因皖江之利渐成水路商贸重镇，上码头一带船桅林立，布行盐号鳞次栉比。明末清初，桐城学派的代表人方以智、方苞、姚鼐多与枞阳渊源深厚，故枞阳有&quot;文章之府、诗人之窟&quot;之誉。近代铁路公路兴起后江运转衰，老码头沉寂，但&quot;川&quot;字三街、射蛟台、洗墨池的旧迹连同老地名一起留在了枞阳人的记忆里。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e上码头老街：后街、中街、河街三街近平行并列，形似&quot;川&quot;字，青石板路面、斑驳木楼；中街旧为商贸主街；射蛟台：传汉武帝元封五年（前106）在枞阳长江射蛟，登高台留遗迹，今枞山麓尚有台地；洗墨池：东晋陶侃任枞阳令时所凿，池水常年不涸，后人立碑纪念；杨子升井：明代所凿，井圈青石镌&quot;杨子升&quot;三字，井水至今清冽可用；舒家祠堂：清代宗祠建筑，木雕彩绘保存完整；老城门楼：枞阳老城残存的麻石条砌城门，券顶厚实。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌上码头中街老商户 陈伯（67岁）：&quot;我这条街叫中街，老辈子叫上码头，后街、中街、河街三条街排成&#x27;川&#x27;字，都是老码头留下的名堂。河街临江，涨潮时船就靠在街边。陶侃在枞阳当过官，洗墨池的碑还在。&quot;\u003cbr\u003e▌枞阳老文化人 何老师（70岁）：&quot;射蛟台上老辈人都说汉武帝登过，射过蛟。枞阳文气重，桐城派的大家好多从这出去，&#x27;文章之府&#x27;不是白叫的。老城门楼是麻石条砌的，喝了江水再重的车也压不垮。&quot;\u003c/p\u003e"}, {"n": "舒城老城", "s": "舒城", "p": "安徽", "w": "龙舒胜地·周瑜故里·晓天老街·龙头塔？舒城古称龙舒，是周瑜故里、李公麟隐居地。老城里明代谯楼鼓楼街仍存，城外周瑜城、春秋山遗址散布，晓天老街是皖西保存最完整的徽派古街。", "h": "\u003cp class=\"main-text\"\u003e舒城春秋为舒国，隋唐析置舒城县，属庐州。宋代李公麟归隐龙眠山，自号龙眠居士，泼墨山水由此得名&quot;龙眠山色&quot;。明代洪武三年（1369）重建县署与鼓楼，县城格局渐定。清咸丰三年（1853）县署两度被毁，此后&quot;官赁民房作署&quot;，旧衙渐废。二十世纪后旧城改造，鼓楼街、东门路一带老街肌理大部荡然，惟晓天、汤池、桃溪等乡镇老街遗存较好。周瑜城、春秋山、龙津桥等古迹仍立在青山绿水间，为这座两千年古城留下可触的注脚。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e龙头塔：县城东山之上，宋代始建的七层砖塔，塔身向城河倾斜，俗称&quot;龙抬头&quot;，为舒城地标；鼓楼街（古楼大街）：明代洪武三年（1369）知县员义建谯楼，重檐翚飞钟鼓严肃，为鼓楼街之始，今街名沿用；周瑜城：县西十八里，周瑜随孙策起义兵徙家于舒时所筑，夯土城垣残迹尚存；晓天老街：始建于元、成形于明清，长700米宽3米，依山傍水的徽派古街，2023年获批省级历史文化街区；春秋山：传唐贞元年间二禅子于此脱解，山上有李公麟读书堂、洗砚池遗址；龙津桥：古驿道上的石桥，横跨南溪，为南关外三里街门户；七门堰：汉颉羹侯刘信筑，与都江堰芍陂并称，利泽千亩。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌鼓楼街老居民 束大爷（72岁）：&quot;鼓楼街明朝就有，洪武三年知府建的鼓楼，钟鼓一响四方都听得见。街上老铺子一家挨一家，我小时候还听见过敲更的梆子。后来楼拆了，街名还留着，老辈人都管这街叫&#x27;鼓楼大街&#x27;。&quot;\u003cbr\u003e▌晓天老街住户 花姐（58岁）：&quot;这条街从元朝就有人住，明清成了买卖，长700米，靠山临水。街头石桥、老井、祠堂戏台都在，青石板磨得发亮。2023年省里批了历史文化街区，街上又热闹起来了。&quot;\u003c/p\u003e"}, {"n": "庐江老城", "s": "庐江", "p": "安徽", "w": "金岗银湾·水西门·岗湾老街·冶父山？庐江古称潜川，岗湾老街是庐江商业发源地，明清时&quot;金岗银湾&quot;誉满天下；水西门明代筑就，冶父山禅林参天，周瑜故里的英风犹在。", "h": "\u003cp class=\"main-text\"\u003e庐江春秋属庐子国，西汉置庐江郡。东汉末周瑜生于舒，与庐江渊源颇深。南北朝时县治数迁，至梁代定于庐城南。唐代杨行密驻军庐江，舍宅建寺广兴佛事。元至正年间县人许荣筑土城，周围五百丈；明万历年间易土为砖，崇祯年间开六门。清朝时岗湾老街商贸鼎盛，&quot;金岗银湾&quot;之名远播。二十世纪后城墙拆除，环城河犹存；2021年岗湾老街依原貌重建，青砖马头墙再现潜川古韵。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e岗湾老街：位于庐城西北西大街，俗称&quot;岗上&quot;&quot;西门湾&quot;，取两地首尾得名&quot;岗湾&quot;；为潜川徽派建筑保存最完整的古街，商业发源地，古称&quot;金岗银湾&quot;；水西门（小西门/通济门）：明崇祯十二年（1639）建，庐江六道城门之一，石券门洞与护城河桥尚存；冶父山：县城东北，禅林古刹众多，伏虎禅师于此开坛，山上有&quot;冶父晴岚&quot;胜景；黄屯老街：庐江东南山乡，明清建筑百余间，两横一纵街巷格局，2015年入选安徽省首批千年古村落；金牛山安城遗址：县城西北，三国曹魏筑安城，古城残墙、旗杆石、葵花井等遗存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌岗湾老街老住户 李阿姨（63岁）：&quot;&#x27;金岗银湾&#x27;是老话，讲的就是咱庐江西门岗湾。老街在岗上，下头绣溪河拐弯，米行布庄药铺挤得满满当当。2021年重建的岗湾，青砖马头墙，想找回老庐江的模样。&quot;\u003cbr\u003e▌黄屯老街铺主 郑叔（59岁）：&quot;黄屯老街两横一纵，明清老房子一百多间，竹子、山货从这河运出去。街老了，铺子还有些，茶馆里还摆着老桌子。2015年评上千年古村落，村里人都挺高兴。&quot;\u003c/p\u003e"}, {"n": "无为老城", "s": "无为", "p": "安徽", "w": "米公祠·黄金塔·墨池·无城古城墙？无为是米芾痴禅拜石之地，&quot;墨池&quot;犹存。北宋黄金塔是安徽现存最古老的塔，无城古城墙遗址与米公祠（省级文保）一道，守着两千多年水乡的记忆。", "h": "\u003cp class=\"main-text\"\u003e无为之名取自&quot;思天下安于无事，无为而治&quot;，北宋太宗所定。三国时孙权筑濡须坞，为濡须口岸，曹操在此屯兵，濡须河成魏吴争夺要冲。北宋崇宁三年（1103）米芾知军于此，宝晋斋、墨池、拜石皆成佳话。宋末元初筑城，明洪武年间因水患重建，周围九里。清代无为商贸日盛，黄金塔、太平桥、华林桥等跨河而设。二十世纪后城墙多拆，惟北墙一段存为遗址。县境水网如织，泥汊、姚沟、刘渡、陡沟等老地名皆因水得名，诉说着这座水乡之城与江河湖汊共生两千年。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e米公祠：北宋崇宁三年（1104）米芾任无为知军时所建书斋宝晋斋，后祀米芾为祠；祠内藏碑刻一百五十余通，1981年公布为省级文保；墨池与投砚亭：米芾研墨洗笔之池，池水常呈墨色；投砚亭为米芾掷砚处，今在米公祠院内；拜石：米芾见奇石便整衣下拜，称&quot;石兄&quot;，此石今置米公祠内；黄金塔：北宋咸平元年（998）建，安徽省存世年代最早的砖塔，七层六面，立在西河之滨；无城古城墙遗址：明代的北城墙残段，从仓埠门至东门一带，砖砌券顶尚存；绣溪公园与杏花泉井：县园林，老井青石井圈古意盎然；襄安白鹤观遗址：商周遗址，出土青铜鼎、玉璧、原始青瓷等，为无为先民聚落到此两千年的佐证。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌米公祠看祠人 老侯（61岁）：&quot;米芾在这当过知军，他那个书斋叫宝晋斋，藏过王羲之的帖。墨池的水常年发黑，是他洗笔洗的；那块拜石他还称过&#x27;石兄&#x27;，跪着拜过。祠里一百五十多通碑，楷行草都有名师手笔。&quot;\u003cbr\u003e▌黄金塔下老船工 丁师傅（66岁）：&quot;黄金塔是北宋咸平年间的，安徽最老的古塔，七层六面，立在河西岸。跑船的看见塔就知道到家了。米公祠在南门里，墨池杏花泉井都挨着，老无城的根都在这。&quot;\u003c/p\u003e"}, {"n": "岳西响肠老街", "s": "岳西响肠老街", "p": "安徽", "w": "皖西南大屋·惜字亭·千佛塔·山城记忆？岳西建县虽晚（1936年），境内却藏着响肠老街这样的明清古街：惜字亭六面三层铁戟指天，方氏胡氏宗祠堪称皖西南古建筑典范，千佛塔见证这座山城建县的年轻与老街的古老。", "h": "\u003cp class=\"main-text\"\u003e岳西建县于1936年，为安徽省最年轻的县之一，由潜山、太湖、舒城、霍山边境析置。虽县龄不足百年，境内却古村镇遍布，响肠、店前、黄尾等皆是明清以来皖西南商道上的重镇。响肠地处潜岳通衢，古为商贾云集之地，石碑石桥石亭沿河而设。山城多雾、溪谷深秀，传统村落保存完整，先后有响肠、请水寨等列入中国传统村落名录。老街的祠堂戏楼、惜字亭上的铁戟，提醒人们这座年轻的县城底下，沉睡着更古老的文脉。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e响肠老街：明代始建、清初成街，长250米宽4米，依响肠河而建；街口惜字亭塔高五丈、六方三层、塔顶铁戟指天；方氏宗祠：响肠老街保护最完好的祠堂，石鼓、石雕门楼、戏楼彩绘，古建专家称其&quot;与徽州古建筑相媲美&quot;；胡氏宗祠：皖西南大屋典范，青砖黛瓦，木雕精美；千佛塔：响肠镇内，相传已有1800多年历史，古塔历尽沧桑；万家楼、大夫第：明代古民居与功名府第，马头墙、天井、木格窗保存尚好；店前老街：岳西南部店前镇，临河埠而建，清末店铺近百家，巨型青石板铺街。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌响肠老街居民 方奶奶（75岁）：&quot;这条街从明朝就有，清末成了大买卖，河边码头抬货的人络绎不绝。街口的惜字亭是烧字纸的，老辈人敬惜字纸，写在纸上的字不能乱扔。方氏祠堂的戏楼唱过多少台戏，正月的花灯从这里出发。&quot;\u003cbr\u003e▌胡氏宗祠古建修缮工 储师傅（57岁）：&quot;胡家的祠堂是皖西南的老手艺，石雕木雕都讲究，专家看了都说能跟徽州的比。响肠的千佛塔一千八百多年了，老街的石头桥、老井、马头墙，一进山就能撞见一百多年前的老光景。&quot;\u003c/p\u003e"}, {"n": "贵池老城", "s": "贵池", "p": "安徽", "w": "池州府城·秀山门·七门城墙·陶公遗风？池州府城明代筑起七座城门的砖石城墙，秀山门博物馆里还留着瓮城和夯土断面，能看见城墙&quot;里土外砖&quot;的千年砌法。唐代始建的池州府儒学，大成门、状元桥、泮池至今完好。", "h": "\u003cp class=\"main-text\"\u003e明代洪武年间池州设府领贵池等六县，府城原为唐武德年间尉迟敬德初筑（一说唐永泰年间李芃修筑），明正德十二年（1520）知府何绍正依故址筑城，设七门：南面通远、毓秀、钟英三门，东九华门，西秀山门，北迎恩、望京二门。明万历三年（1573）加筑城楼，设警铺二十七处；清乾隆二十九年（1764）大修城墙，四门城楼巍然。清末至民国年间城墙渐次倾圮，惟秀山门及北城夯土尚存，1990年代后依遗址保护复建秀山门城墙展示。贵池古为秋浦、池州治所，李白曾五至秋浦，作《秋浦歌十七首》，&quot;炉火照天地，红星乱紫烟&quot;即咏铜官山冶铜之景；杜牧刺池州时&quot;借问酒家何处有&quot;的杏花村即在此。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e秀山门博物馆：明代洪武年间始建的秀山门为池州七门之一，现存城墙基址与部分墙体，城门呈瓮城结构，博物馆内可看古城墙夯土断面；池州府儒学：唐代始建，正对牌坊街，大成门、大成井、状元桥、泮池保存完好，为皖南少见完好的府学建筑群；牌坊街：原池州城有牌坊九十余座，今仅存复建者，孝肃街口立有牌坊，连接府儒学与秀山门；城墙残段：明代城墙清乾隆二十九年（1764）修缮后周长1428丈（四周近4公里），墙基底宽2丈3尺，上宽可跑马；今城北一带尚有夯土残墙可寻；池口镇古街：清溪河汇江处旧商埠，青石板街与老码头遗迹尚存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌秀山门旁老街坊 李爷爷（72岁）：&quot;秀山门这瓮城是明代的，砖缝里都长青苔了。老辈讲城墙基宽两丈三，上面能跑马，我小时候还在城墙上放过风筝。府学的大成殿现在还在，逢考的日子，家长们还去状元桥走一走，图个吉利。&quot;\u003cbr\u003e▌杏花村街茶馆主 王大爷（63岁）：&quot;李白来过秋浦五次，&#x27;白发三千丈&#x27;就是在这写的。池州这地方水好山好，老城墙剩得不多了，但秀山门那张老脸还在，一见着它就想起当年七门齐开的模样。&quot;\u003c/p\u003e"}, {"n": "东至老城", "s": "东至", "p": "安徽", "w": "东流古镇·陶公祠·菊江塔影·十字老街？东流是&quot;菊邑&quot;，陶渊明任彭泽令时常来此采菊，陶公祠里香火至今不断。东流老街十字街东西880米南北300米，明清徽派老屋一千多幢，是皖西南保存最好的古镇之一。", "h": "\u003cp class=\"main-text\"\u003e东流于唐会昌初年置县，因地处长江南岸、陶渊明采菊于此而有&quot;菊邑&quot;之称。明万历元年（1573）知县陈春循江筑城，分水城、山城、平城三段，设五门，后屡经增修。清乾隆年间建秀峰、天然双塔镇守南端，与对岸塔影相望。清末民初东流为皖西南商贸口岸，十字街船楫往来，商贾云集。1959年东流与至德合并置东至县，县治移尧渡，东流老城保留为历史文化名镇，老街、双塔、陶公祠成为&quot;菊邑东流&quot;的文脉见证。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东流老街：十字街格局，东西880米、南北300米，街宽3-5米，两侧明清徽派房屋1000余幢，1989年列为省级历史文化保护区；陶公祠（靖节祠）：原在县学宫内，明弘治三年（1490）重建，万历元年（1573）移建菊江亭侧，祀陶渊明，祠前菊径古意盎然；秀峰塔：清乾隆二十四年（1759）建，五层六方，高21.5米，底层周长14.6米，为东流老城南端镇塔；天然塔：清乾隆十年（1745）建，建于回龙山，为周氏族人捐建；东流双塔（秀峰塔+天然塔）：1998年间同列安徽省文物保护单位；东流老城墙遗址：明万历元年（1573）知县陈春筑城，周长736丈，高1.4丈，分水城274丈、山城256丈、平城210丈，设迎春、丽山、通津、菊江、瞻极五门；今城基局部犹存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌东流老街住户 陈奶奶（70岁）：&quot;老街东西880米，走到底得老半天。街上的徽派老房子有一千多幢，青砖马头墙，檐下挂着旧牌匾。秀峰塔五层六方，老远就能看见，塔影落在菊江里，好看得很。&quot;\u003cbr\u003e▌陶公祠看祠人 吴师傅（59岁）：&quot;陶渊明当彭泽令，常到东流来采菊，所以这里叫菊邑。祠堂自明代移过来，香火一直没断，院里的菊花开到秋深还不谢。老话讲&#x27;采菊东篱下，悠然见南山&#x27;，说的就是这股子淡泊劲儿。&quot;\u003c/p\u003e"}, {"n": "青阳老城", "s": "青阳", "p": "安徽", "w": "蓉城·陵阳古镇·九芙蓉·太平山房？蓉城自唐天宝元年（742）置青阳即为县治，李白赞九华山&quot;秀出九芙蓉&quot;。镇内仅存富阳、双河两座明清石拱桥，陵阳古镇则有汉县遗迹与120根圆柱顶梁的国家文保太平山房。", "h": "\u003cp class=\"main-text\"\u003e青阳唐天宝元年（742）析南陵置县，治所设蓉城，此后历代为县治所未曾迁移。蓉城之名承九华山&quot;秀出九芙蓉&quot;之意，李白乐观九华而名之。陵阳更古，西汉元封二年（前109）置陵阳县，为皖南古县之一，东晋以后县治渐废，陵阳镇留为古镇。南宋以降青阳文风兴盛，明代理学家王阳明、湛若水曾至九华讲学。蓉城城墙历代皆以土筑，清末民初渐废为民居街巷，今仅富阳、双河二桥与老街肌理为昔日城池之遗，陵阳古镇的汉城遗址与明代太平山房则把青阳的文脉一路拉回两千年前。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e富阳桥：蓉城镇内仅存两座明建清修石拱桥之一，横跨青通河，桥栏雕兽古朴；双河桥：另一座明代始建、清代重修的青石拱桥，桥券粗壮，是蓉城过河老径；太平山房（所村村）：全国重点文物保护单位，明代建筑，117根圆柱顶梁，四进五开间，梁架雄浑，为皖南罕见的大型明代民居；陵阳古镇：汉元封二年（前109）置县为陵阳，今汉古城墙遗址、汉县衙遗址尚可寻，镇上明清古民居156栋、古桥40余座；南流桥：陵阳镇明代嘉靖年间建的三孔石拱桥，长45米、宽5米、高7米，桥面石阶车辙深印；蓉城老街：青通河畔明清街巷肌理尚存，青石板路与沿河吊脚屋相映。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌所村村守太平山房的老屋主 刘大伯（71岁）：&quot;太平山房117根大柱子顶着那么大屋顶，四进院，当年是大户人家的正堂，现在还是村里的宝贝。陵阳的南流桥三孔，45米长，我爷爷小时候就在桥上乘凉，桥下的水清亮亮的。&quot;\u003cbr\u003e▌蓉城富阳桥头摆摊的周婶（58岁）：&quot;富阳桥、双河桥是蓉城老街上仅剩的两座老石桥，明代建的，清代修过。青通河涨水也不怕，拱洞大。九华山就在城西南，李白起的名，&#x27;秀出九芙蓉&#x27;，一出太阳就能看见九座山头。&quot;\u003c/p\u003e"}, {"n": "铜陵老城", "s": "铜陵", "p": "安徽", "w": "大通古镇·澜溪老街·和悦洲·商埠余韵？大通古名澜溪，北宋建镇，与安庆、芜湖、蚌埠并称安徽&quot;四大商埠&quot;，有&quot;小上海&quot;之称。澜溪老街780米走不完六百年的商埠浮沉，沿街老店与江心洲格局至今可辨。", "h": "\u003cp class=\"main-text\"\u003e大通北宋设镇，古名澜溪，因长江支流澜溪河得名。明代以后大通为皖江货运集散中心，清代辟为商埠，与安庆、芜湖、蚌埠并称&quot;四大商埠&quot;，街市&quot;三街十三巷&quot;，钱庄、剧院、茶楼林立，号称&quot;小上海&quot;。1938年一场大火焚毁八大钱庄、四大剧院与三街十三巷大部，商埠自此衰落。铜陵本以铜名，春秋金牛洞古铜矿开采数百年，宋设铜官监，明清铜冶不辍，今铜陵市博物馆藏春秋兽耳鸟纹鉴，其青铜板幕墙用铜50吨，见证&quot;中国古铜都&quot;之名。如今澜溪老街与和悦洲隔江相望，旧港船影渐淡，惟老秤行的叮当声与天主堂的钟楼还守着大通的旧码头味。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e澜溪老街：旧名澜溪，长780米，六百年历史，沿江徽式骑楼店屋鳞次栉比，青石板路直通码头；和悦洲：长江江心洲，旧时&quot;三街十三巷&quot;格局，头道街、二道街尚存，为当年商号夹江而市之所在；夏洪兴老秤行：百年老店，第四代传人夏大明至今制秤，杆秤、戥子手艺仍在；原生代遗址五处：大通天主堂、和悦洲圣公会、万子会、法式小楼、龙泉井，为大通开埠通商留下的老建筑；金牛洞古采矿遗址：春秋至西汉铜矿遗址，全国重点文保，反映铜陵三千年铜冶历史；铜官山旧址与1978文创园：明清以来铜采冶重地，今辟为文创街区。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌大通澜溪老街住户 章奶奶（75岁）：&quot;老街780米，从这头走到那头，一路都是老店铺。夏洪兴的秤做了四代人，现在还在做，称东西一称一个准。和悦洲在江心，当年三条街十三条巷，热闹得跟上海似的。&quot;\u003cbr\u003e▌夏洪兴老秤行第四代 夏大明（60岁）：&quot;我太爷爷那辈就在澜溪街做秤，传到我这第四代。秤是公平，不能亏了买卖人。老话说大通是&#x27;小上海&#x27;，钱庄剧院都烧了，可做秤的手艺还在，街还在，那就行。&quot;\u003c/p\u003e"}, {"n": "南陵老城", "s": "南陵", "p": "安徽", "w": "春谷·籍山镇·文风塔·城墙头？南陵古称春谷，周瑜、黄盖先后任春谷长，李白几度寓居。县治唐代迁籍山镇后千年未改，&quot;城墙头&quot;还留着一圈护城土埂，宋代的文风塔立着&quot;文峰璧立&quot;三碑。", "h": "\u003cp class=\"main-text\"\u003e南陵西汉置春谷县，三国时周瑜、黄盖先后任春谷长，李白《南陵别儿童入京》&quot;仰天大笑出门去&quot;即离南陵入京之作。唐长安四年（704）县治由赭圻迁至青阳城（今籍山镇），此后千年末移。明洪武元年（1368）知县梅鼎建县署，正德十年（1515）知县胡文静立四门：东迎恩、西黉堂、南丽正、北拱辰；城门俱设城楼，外环护城河。清代增修，城墙遮護城池数百年。二十世纪后城墙渐拆，惟&quot;城墙头&quot;土埂因防洪而存，遗址公园内老木森森，文风塔依旧矗立，是为南陵&quot;春谷故郡&quot;之城根。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e文风塔：北宋元祐年间始建，明嘉靖四十四年（1565）改称文风塔，塔旁立&quot;文峰璧立、雁塔题名、金石榜&quot;三碑；城墙头遗址公园：城北老城墙头，明清城墙夯土遗存连同一圈合抱粗古木，今辟为遗址公园；护城土埂：县城&quot;城墙头&quot;现存一圈土埂，明清以降每逢梅雨汛期即为护城屏障，土埂上老树盘根；籍山河畔老街：县治籍山镇沿青弋江支流的明清街巷与老码头；弋江镇：南陵东郊千年古镇，九条明清老街保存完好，为青弋江畔旧埠；大工山铜矿遗址：全国重点文保，西周至汉铜矿采冶遗址，曾出土青铜器。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌南陵城墙头老住户 孙大爷（74岁）：&quot;&#x27;城墙头&#x27;这圈土埂是明朝起的，年年梅雨就靠它挡水。土埂上那几棵大树，比我爷爷的爷爷还老，树根把土都抱住了。文风塔宋代就有，塔旁三块碑，&#x27;文峰璧立&#x27;那四个字还在。&quot;\u003cbr\u003e▌籍山镇青弋江畔的老船工 黄师傅（66岁）：&quot;南陵老话讲&#x27;周瑜黄盖守春谷&#x27;，李白走的时候高唱&#x27;仰天大笑出门去&#x27;。县治从唐朝搬到籍山就没挪过窝，快一千四百年了。弋江镇九条老街上，老铺子一家接一家。&quot;\u003c/p\u003e"}, {"n": "泾县老城", "s": "泾县", "p": "安徽", "w": "宣纸故乡·章渡吊栋阁·明代城墙·桃花潭？泾县是宣纸故里，&quot;纸中之王&quot;从这里走向天下。章渡古镇的&quot;吊栋阁&quot;临江木柱撑起97间老屋，号称&quot;江南千条腿&quot;；明嘉靖筑的砖城墙，南门口到青弋江大桥还留着1060米条石老墙。", "h": "\u003cp class=\"main-text\"\u003e泾县西汉置县，属丹阳郡，古为宣纸产地，唐时宣纸即以泾县为最。明嘉靖四十二年（1563）为防倭寇知县陈廷芝筑砖城，乾隆二十九年（1764）大修，城周扩至1035丈、垛口2027个，耗白银三万五千两。历代城墙屡修屡圮，至民国时仅余南门口至青弋江大桥一段条石城墙，凭借临江顶托之力保存至今，为皖南不可多得的明代城墙实物。泾县文脉鼎盛，李白游泾县桃花潭作《赠汪伦》，&quot;桃花潭水深千尺&quot;千古传唱；宣纸自唐宋传续，乌溪红星宣纸为&quot;文房四宝&quot;之首；查济、章渡等古村古镇，则把泾县的山光水色与纸墨书香一并留在了青弋江畔。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e泾县明代城墙：明嘉靖四十二年（1563）知县陈廷芝为防倭筑城，城高1丈9尺、厚8尺、周长932丈（1865步），城垛1696个，设迎晖、保泰、文明、拱辰四门及小东门、南北水关；今南门口至青弋江大桥全长1060米，条石砌筑，高约10米，为皖南保存最长的古城墙；章渡古镇&quot;吊栋阁&quot;：临青弋江木柱支撑的吊脚屋群，现存97间，沿线6处下河石阶分7组，称&quot;江南千条腿&quot;；桃花潭：李白&quot;桃花潭水深千尺，不及汪伦送我情&quot;即咏此，踏歌岸阁、文昌阁犹存，翟氏一门曾出举人23人；查济古村：元明清古民居140余处、古桥40余座、祠堂30座，全国重点文保；宣纸作坊（乌溪）：红星牌宣纸产地，古法捞纸技艺传承千年；青弋江水西双塔：北宋双塔隔河相望，全国重点文保。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌泾县南门城墙根下住户 查奶奶（73岁）：&quot;这段城墙是明朝嘉靖年间筑的，条石砌的，十来米高，老结实了。青弋江就在墙脚下流过，涨水也不怕。桃花潭更老，李白的诗把它的名气唱了一千年。&quot;\u003cbr\u003e▌章渡古镇吊栋阁住户 冯大爷（70岁）：&quot;吊栋阁就吊在青弋江上，底下木柱子撑着，一共97间，顺河排开，像千条腿撑着一条街。下河有六级石阶，洗菜挑水都走那。老匠人还守着捞宣纸的手艺，泾县纸天下闻名。&quot;\u003c/p\u003e"}, {"n": "宣州老城", "s": "宣州", "p": "安徽", "w": "宛陵·九街十八巷·谢朓楼·敬亭山？宣城古名宛陵，2300年古城，是&quot;宣城自古诗人地&quot;。谢朓、李白、白居易、杜牧都在此留下名篇，李白&quot;相看两不厌，只有敬亭山&quot;让敬亭山成了江南诗山。古城&quot;九街十八巷&quot;格局可寻，唐代始建的谢朓楼今日重现。", "h": "\u003cp class=\"main-text\"\u003e宣城西汉为丹阳郡治，古名宛陵，历代为郡、州、府治所，号称&quot;江南通都大邑&quot;。东晋咸和二年（327）内史桓彝营建子城，隋开皇中刺史王选扩筑罗城广轮三十里，唐末罗城毁，南唐刺史林仁肇更筑龟形新城。清末民初城墙总长九里十三步，高二丈五尺、厚三丈，设五门：东阳德、小东泰和、南薰化、西宝城、北拱极，均为双城门。1939年为城墙改用，县长率数万民工拆除古城墙，&quot;九街十八巷&quot;格局逐渐改观。谢朓楼、景德寺塔、敬亭山与广教寺双塔则跨越千年，把宣城&quot;上江人文之盛首&quot;的文脉一直讲到今天。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e谢朓楼：南齐建武二年（495）谢朓任宣城太守时筑高斋于陵阳山，唐初改建为楼，李白登楼作&quot;抽刀断水水更流，举杯销愁愁更愁&quot;；历代重建，今楼为1997年依旧制重建，遗址列为省级文保；敬亭山：海拔300余米，李白&quot;相看两不厌&quot;咏之，历代300余位诗人登临，有&quot;江南诗山&quot;之称，广教寺双塔（北宋）在山麓；景德寺塔（开元塔）：北宋始建，古城东南，是宣城老城的重要地标；九街十八巷：九街为阳德、木直、福星、锦城、元宝、奉公、镇前、迎恩、西直大街；十八巷如孙家巷、瓦碴巷、九曲巷等，街道原为青石板铺设，下为拱形下水道，两溜青石嵌边；水东老街：宣州区水东镇明清老街，天主教堂建筑群与花戏楼为省保；老十字街与济川桥：阳德门外的济川桥跨宛溪河，为老城四桥之首。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宣城老大街街坊 许大爷（76岁）：&quot;老宣城有&#x27;九街十八巷&#x27;，阳德街、木直街、锦城街，青石板下面都是拱形的排水沟，下雨不积水。小时候还爬过城墙，九里十三步，五个城门双城门。现在城墙没了，老街还留着几段。&quot;\u003cbr\u003e▌敬亭山下摆茶摊的郑婆婆（67岁）：&quot;敬亭山不高，三百来米，可李白一写就出了名，&#x27;相看两不厌，只有敬亭山&#x27;。谢朓楼更不用讲，李白喝醉酒写&#x27;抽刀断水水更流&#x27;，就在那楼上。城变了，山和楼的故事没变。&quot;\u003c/p\u003e"}, {"n": "当涂老城", "s": "当涂", "p": "安徽", "w": "太平府城·姑孰·采石矶·太白楼？当涂是太平府治所，姑孰城始筑于三国东吴&quot;黄武&quot;年号。采石矶为&quot;长江三矶&quot;之首，太白楼是全国现存最古的纪念李白古建筑；城内的清源门城墙遗址与护城河还勾勒着明清府城的轮廓。", "h": "\u003cp class=\"main-text\"\u003e姑孰城始筑于三国东吴黄武年间（222-228），旧志载城基建基有&quot;黄武&quot;二字，为当涂县治之始。东晋兴宁二年（364）大司马桓温镇姑孰重建城并筑子城，此后姑孰历为县、州、路、府治所，明清为太平府附廓。宋建炎三年（1129）知州郭伟弃姑溪河于城外，开挖护城河、增南北水关、建五门城楼；清乾隆初年城成高三丈六尺、围9里19步的砖石城垣，城蝶1850个，设行春、澄江、清源、龙津、南津、湖孰六门。清咸丰年间太平军拆城砖运至金柱关筑&quot;天保城&quot;，城垣渐损；1937年城垣尽拆，惟护城河与城基遗址留存。当涂因李白而名，李白晚年定居此地，葬于青山西麓，太白楼、太白墓遂成&quot;诗仙&quot;乡愁所系。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e姑孰城清源门（北门）段城墙遗址：明清姑孰城北门城墙，位于太平府文化园，为明城遗存；护城河：明清姑孰城护城河总长4公里、宽近百米，至今水环老城；采石矶：长江三大名矶之首，临江绝壁，李白、白居易、苏轼、陆游等皆登临题咏；翠螺山、太白楼、三台阁、三元洞、捉月台等景；太白楼（谪仙楼）：唐元和年间始建，主楼高18米，为我国现存最早、规模最大、保存最完整的纪念李白古建，2013年列全国重点文保；太白墓（青山李白墓）：全国重点文保，李白晚年寓居当涂并葬于此，衣冠冢、碑林俱在；黄山塔：南朝始建，李白&quot;长啸倚天梯&quot;咏之；金柱塔建于明代，八角七层；天门山（东西梁山）：李白&quot;天门中断楚江开&quot;即咏此夹江对峙之山。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌当涂清源门遗址旁住户 赵奶奶（71岁）：&quot;姑孰城是三国吴黄武年间起的，明朝修成砖城，高三丈六，九里十九步，六座城门。现在只剩北门清源门一段城墙和一圈护城河。河还在，四公里长，水还绕着老城走。&quot;\u003cbr\u003e▌采石太白楼讲解员 马老师（55岁）：&quot;太白楼唐代就有了，是我国最老的纪念李白的楼，李白晚年就住当涂，葬在青山。&#x27;天门中断楚江开&#x27;写的东梁山西梁山，就在采石矶对过。来当涂的人都说，这是诗仙最后的家。&quot;\u003c/p\u003e"}, {"n": "芜湖老城", "s": "芜湖", "p": "安徽", "w": "鸠兹·米市·中江塔·环城马路？芜湖古称鸠兹，两千五百多年城史，吴黄武二年孙权把县治迁到青弋江口。明代万历筑的城墙如今拓成了环城马路，中江塔、城隍庙、宋代谯楼还把着古城的江岸烟火。", "h": "\u003cp class=\"main-text\"\u003e芜湖古为鸠兹邑，公元前570年楚国大夫子重克鸠兹，这是芜湖最早的城址。西汉元封二年（前109）鸠兹设县，易名芜湖。三国吴黄武二年（223）孙权迁县治于青弋江口鸡毛山高地，此后城址未再迁移；东晋王敦在此筑&quot;王敦城&quot;。隋唐芜湖撤县为当涂属镇，南唐复置县，北宋筑县城，盛极一时。明嘉靖间倭寇窜犯，县库两次被盗失银一万三千八百两，遂于万历三年（1575）起费时6年筑新城，周5华里、高3丈，设宣春、长虹、弼赋、来凤四城门及迎秀、上水、下水三便门。清光绪二年（1876）芜湖辟为通商口岸，城墙渐拆拓为环城马路。晚清开埠后芜湖米市盛极一时，居江南四大米市之首，中江塔、城隍庙与沿江街巷记录着这座江城吞吐千帆的旧事。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e中江塔：始建明、续建清，八角五层，临青弋江与长江交汇处，既是江上航标也是镇水之塔，塔壁砖雕精美；城隍庙：东吴始建，距今约1700年，是国内最早一批城隍庙之一，香火延续至今；宋代谯楼与明清县衙：安徽现存不多的宋代高台谯楼，保存完整明清县衙，可看古代大堂；花街、南街：古城热闹老街区，青石板路、马头墙、红灯笼；南正街为明万历年间芜湖最早的步行街，前店后场格局；环城马路（环城东、西、南、北路）：即四百年前明代城墙遗址，四周城门方位仍可循；干将铸剑遗址（赤铸山）：春秋冶剑师干将、莫邪为楚王铸剑处，淬剑池、铁门槛等遗迹尚存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌芜湖环城路老住户 秦大爷（74岁）：&quot;这圈环城路就是明朝城墙扒掉修的，宣春门、长虹门、来凤门，方位我还能指出来。中江塔是又当航标又镇水，四角挂风铃，晚上江上的船看着塔灯就知道到芜湖了。&quot;\u003cbr\u003e▌南正街老商户 沈老板（62岁）：&quot;南正街是明朝万历年间的步行街，前店后场，我爷爷在这卖过米。芜湖米市当年是江南四大米市之首，青弋江边的船一靠岸，米就挑上岸过秤。街还是老街，米市的余味还在老街巷里飘。&quot;\u003c/p\u003e"}, {"n": "和县老城", "s": "和县", "p": "安徽", "w": "历阳·陋室·镇淮楼·乌江霸王？和县古名历阳，秦置县，2200年城史。刘禹锡被贬和州时写下&quot;斯是陋室，惟吾德馨&quot;；镇淮楼是朱元璋登楼赋诗的地方；乌江的霸王祠，是项羽&quot;不肯过江东&quot;的千古凭吊处。", "h": "\u003cp class=\"main-text\"\u003e和县秦置历阳县，因&quot;历&quot;水得名，梁陈时南梁北齐在此议和，555年改名和州，沿称至民国改和县。历阳镇古称亚父城，相传为范增所建，自古为和州治所。唐代文豪刘禹锡元和年间贬任和州刺史，于州署东偏筑陋室，作《陋室铭》以明志，陋室遂成千古名迹。北宋镇淮楼雄踞城北，明代墙垣屡加修筑，清乾隆、道光年间重修，朱元璋曾登楼赋诗。明末清初和州为江东险要之郡，城墙多次增筑。乌江镇为项羽自刎地，霸王祠香火千年。二十世纪后城墙渐废，惟陋室、镇淮楼、文庙、文昌塔与乌江霸王祠跨越千年，把和县的文臣风骨与霸王气概一并留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e陋室：唐长庆四年（824）刘禹锡任和州刺史时于州署东偏营建，写下《陋室铭》；清乾隆年间知州宋思仁重建陋室九间，1986年列省级文保，后扩建为陋室公园；镇淮楼（谯楼）：始建于北宋宁宗年间，楼基长55米、南北宽21米、高11米，坐北朝南，为省级文保；朱元璋攻采石时驻兵和州，登楼赋《登镇淮楼诗》&quot;我上镇淮楼一望，满天明月大江流&quot;；和县文庙：唐代始建，地方祭祀孔子官学之处，重建有大成殿、东西庑、泮池，红墙黄瓦；西楚霸王灵祠：乌江镇祭祀项羽的祠庙，西路霸王衣冠冢在此，碑刻尽镌李清照&quot;生当作人杰，死亦为鬼雄&quot;；历阳古城遗址与亚父城：历阳镇古称亚父城，传为项羽亚父范增所建，城池遗址可寻；文昌塔、万寿塔、和阳桥：明代文昌塔、三国万寿塔与明代和阳桥。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌和县陋室公园老住户 钱大爷（73岁）：&quot;陋室是刘禹锡当和州刺史时住的，&#x27;斯是陋室，惟吾德馨&#x27;就写在这。乾隆年间重建过九间，1986年还立了省保。镇淮楼在城北，朱元璋上去喝酒作诗，&#x27;满天明月大江流&#x27;。&quot;\u003cbr\u003e▌乌江霸王祠守祠人 韩师傅（64岁）：&quot;霸王祠就建在项羽自刎的乌江边，李清照那句&#x27;生当作人杰，死亦为鬼雄&#x27;，刻在碑上。老辈人都说项羽&#x27;不肯过江东&#x27;，气节重过性命。和县这地方，文有陋室，武有霸王，全了。&quot;\u003c/p\u003e"}, {"n": "含山老城", "s": "含山", "p": "安徽", "w": "凌家滩·褒禅山·昭关·运漕古镇？含山有中华远古文明曙光凌家滩，5800年前的玉龙、玉鹰从这里出土；褒禅山华阳洞是王安石《游褒禅山记》的诞生地；运漕古镇是千年商贸水乡，李鸿章当铺至今仍在。", "h": "\u003cp class=\"main-text\"\u003e含山先秦为吴楚边界要地，秦属九江郡历阳县地。东晋大兴二年（319）为安置北来流民，侨置龙亢县于此，县治在杨府城村。唐武德六年（623）分历阳西部置含山县，县名源于县西含山&quot;群山列峙，势若吞含&quot;，永乐间近1400年沿用不改，其间武德八年曾废并历阳，长安四年复置改名武寿，神龙元年恢复含山。宋元明清含山长期属和州。清中期县治环峰筑城，城外环山，明清两代屡有修葺。含山文脉厚重：春秋伍子胥过昭关，北宋王安石游褒禅山作名篇，理学家游酢晚年定居含山终老；而凌家滩遗址则以五千八百年前的精美玉器，把含山的根扎进中华文明的源头。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e凌家滩遗址：铜闸镇新石器时代晚期遗址，距今5800-5300年，出土玉器、石器等3000余件，为中华玉礼文化重要源头，列国家考古遗址公园；褒禅山华阳洞：长江以北少见的喀斯特溶洞，王安石游此作《游褒禅山记》，&quot;世之奇伟、瑰怪、非常之观，常在于险远&quot;；古昭关与伍相祠：东为马山、西为城山，一道天然关隘，伍子胥过昭关一夜白头的故事发生地，伍相祠矗立关隘之上，关前青石板车辙深印；运漕古镇：裕溪河畔千年商贸水乡，中国历史文化名镇（2014）、安徽省首批千年古镇（2015），马头墙连绵，李鸿章当铺、佘氏宗祠、明清古民居保存至今；环峰老街与县署旧址：县治环峰镇因周围环山得名，老城街巷仍存部分明清肌理。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌运漕古镇老住户 贾奶奶（69岁）：&quot;运漕是千年老镇，傍着裕溪河，当年商船云集。李鸿章在这里开过当铺，佘氏宗祠的老房子还在。老街上的马头墙一座连一座，青石板路被挑夫踩得锃亮。&quot;\u003cbr\u003e▌凌家滩遗址守护人 龚大伯（62岁）：&quot;凌家滩挖出来的玉龙、玉鹰，五千八百多年前的东西，做工精细得吓人，说明那时候我们这地方就是文明中心了。褒禅山华阳洞是王安石写《游褒禅山记》的地方，&#x27;非常之观常在于险远&#x27;，就他说的。&quot;\u003c/p\u003e"}, {"n": "繁昌老城", "s": "繁昌", "p": "安徽", "w": "春谷旧治·五门四桥·夫子庙·迁治记？繁昌古为春谷县地，南唐复置县后县治几度迁移。明天顺元年迁至金峨上乡，崇祯年间筑成五座城门四座桥的城墙，如今夫子庙（大成殿）仍是繁昌仅存的较完好明代建筑。", "h": "\u003cp class=\"main-text\"\u003e繁昌本为春谷县地，县治屡徙：西汉春谷县治在荻港舒村，历时600余年；502年改南陵郡，县治迁荻港赭圻；南唐升元年间（937-942）割南陵五乡复置繁昌县，县治设延载乡（今新港镇），历时500余年，因县小民贫长期无城，仅编竹为障，世称&quot;陋县&quot;。北宋庆历七年（1047）知县夏希道首筑县城，周六里八十步，曾巩撰《繁昌兴造记》、王安石撰《繁昌县学记》记其事。明天顺元年（1457）知县王珣迁县治至金峨上乡（今繁阳镇），旧城改名旧县。新治180多年未筑城，至明崇祯十一年（1638）知县张继曾集士绅议定照田派费，筹银三万余两，历时1年2个月筑成城墙，周646丈8尺、高二丈，设朝阳、迎薰、威远、拱极四门，后又于学宫外增设聚奎门，凡五门五桥。城内十五街十三巷一胡同、十八坊。如今城墙多已不存，惟夫子庙、泮池与城门老地名，还在讲述繁昌&quot;五门四桥&quot;的旧城格局。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e夫子庙（大成殿）：繁昌学宫大成殿，明代建筑，今存城关，为繁昌县城较完好的明代单体建筑；泮池在其侧；城墙旧址与门址：明代城墙周646丈8尺、高二丈，设朝阳、迎薰、威远、拱极四门及聚奎门，共五门；今城门方位与残基可寻；百子桥（东门桥）：明崇祯十六年（1643）太医院判王道纯于朝阳门外捐建跨河桥，历经重修，为&quot;四座桥&quot;之首；繁昌窑遗址与柯家村窑址：古青白瓷窑址，全国重点文保，证明繁昌宋代已是制瓷之邑；旧县镇（今新港）：明代迁城前的旧县治所在地，沿江古镇遗迹。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌繁昌城关老住户 谢奶奶（72岁）：&quot;繁昌老县城有五座城门四座桥，东门朝阳门外有百子桥，是明朝一位太医自掏腰包修的。城墙崇祯年间筑的，周六百四十六丈，有两丈高。现在城墙没了，夫子庙的大成殿还在，是明朝的老房子。&quot;\u003cbr\u003e▌繁昌学宫旁的老教师 林老师（58岁）：&quot;夫子庙就是以前的学宫大成殿，明朝的，繁昌现在最老的明代房子。曾巩、王安石都给繁昌写过记，一个讲筑城，一个讲办学，可见繁昌自古就重文重教。城墙拆了，庙还在，学味儿还在。&quot;\u003c/p\u003e"}, {"n": "歙县老城", "s": "歙县", "p": "安徽", "w": "徽州府城·许国石坊·渔梁坝·明清四门？歙县是中国保存最完好的四大古城之一，与平遥、阆中、丽江齐名。徽州府城墙、许国石坊、渔梁坝历经五百年不坏，现存潮水西门、新安门、问政门三座城门，堪称&quot;徽州大观园&quot;。", "h": "\u003cp class=\"main-text\"\u003e歙县秦代置县（前221），隋末汪华筑郡城（内子城周一里四十二步，罗城周四里二步），宋宣和三年（1121）改筑新州。元至正十七年（1357）邓愈加筑徽州府城，周九里七十步、设德胜、南山、潮水、镇安、临溪五门；明嘉靖三十四年（1555）知县史桂芳始筑县城（1559年建成，四门紫阳、问政、新安、玉屏），至此徽州府县同城，县治附郭无城近千年后方有县城。清沿用不改，民国后城墙多段拆除，1990年代后依遗址修复秀山门等。唐代以降徽州府学文风鼎盛，明代出过许国、汪道昆，清代有新安画派；渔梁坝横锁练江，自古为徽商物资集散的黄金水道。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e徽州古城墙：北宋徽州罗城，明嘉靖间重修，现存潮水西门（含月城）、新安门、问政门及约1公里可登临城墙，护城河深一丈二尺阔二丈四尺；许国石坊：明万历十二年（1584）建，四面八柱冲天石坊，雕龙刻凤，为国内唯一大学士功名牌坊，全国重点文保；渔梁坝：唐代始建、明代重建的拦河滚水坝，长138米、高5米，用上万块重吨麻石垒砌，郑孝燮称&quot;与都江堰媲美&quot;；南谯楼：宋代徽州子城报时城门楼，现存明代重建的&quot;排叉柱&quot;支撑木构，为国内孤例；阳和门（东谯楼）：南宋绍兴二十年（1150）始建的谯楼；府衙历史街区：5.4公顷，含府衙、斗山街（9.3公顷）、渔梁（8.9公顷）三片徽州街区；徽州现存牌坊400余座中歙县有104座；中和街、打箍井街、十字街：古城内青石街巷，蛤蟆井/大方井/小方井等明清古井散布。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌斗山街老住户 许奶奶（70岁）：&quot;徽州府城四门，潮水门还带个月城，民国时还能看见护城河的水。许国石坊八根柱子顶着，村里老人说那是&#x27;八角牌楼&#x27;，逢年过节坊下走亲家，热闹得很。渔梁坝用麻石垒的，几百年洪水都冲不垮。&quot;\u003cbr\u003e▌渔梁坝边渔家 洪师傅（62岁）：&quot;渔梁坝是&#x27;徽州都江堰&#x27;，练江的水到了这就得乖乖分几股。老辈靠这坝行船放排，徽州的茶叶、桐油都从这上船。阳和门那谯楼南宋就有了，晨钟暮鼓，如今楼在钟声歇。&quot;\u003c/p\u003e"}, {"n": "休宁老城", "s": "休宁", "p": "安徽", "w": "中国第一状元县·海阳七门·齐宁街·万安老街？休宁是&quot;中国第一状元县&quot;，自宋至清出状元19位。海阳古城四方塔山、城门以山为名，齐宁街780米一街出两状元，万安老街2500米是&quot;古徽州清明上河图&quot;。", "h": "\u003cp class=\"main-text\"\u003e休宁东汉建安十三年（208）建县，唐代天宝九年（750）起海阳为县治。宋代始筑城墙，明嘉靖三十五年（1556）为御倭寇辟七门，四大门以所朝之山为名：北萝宁、东万宁、南玉宁、西齐宁，另有小三门，遂成&quot;四塔四山四大门三小门&quot;之局。清代城内有8街72巷，民谚&quot;东门牌楼西门店，南门住屋北门田&quot;道尽街巷分工。海阳城西的万安老街自明清乃徽州水陆码头，商旅辐辏，吴鲁衡罗盘、胡开文徽墨皆由此出，与五城、龙湾等并称休宁古镇。街巷格局至今犹存，红砂石板的齐宁街仍撑着这座状元县的文脉。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e齐宁街（海阳西街）：长780米、宽4米，红砂岩板铺就，一街十六巷，2019年省历史文化街区，&quot;一街两状元&quot;（汪绎康熙庚辰1700、汪如洋乾隆庚子1780）；同安堂：全国重点文保，清代老药铺，齐宁街上保存完好的徽派商号建筑；胡开文墨店：市保老店，徽墨百年老字号故店；万安老街：长2500多米，&quot;大大万安街，小小休宁城&quot;，12个古水埠码头、130余处古民居，2012中国历史文化名街；三塔四古桥：古城塔/巽峰塔/富琅塔，富来/轮车/观音/通济四座古桥；吴鲁衡老罗经店：罗盘老字号，陶行知启蒙馆亦在老街；五城老街：长900米，唐代起为商贸中心，忠靖王庙会祀张巡。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌万安老街老商户 程老板（66岁）：&quot;万安老街两千五百米，小时候码头边船一排排，米、茶、笋干都从这走。吴鲁衡家的罗盘做得最精，指南针认方向，老船老大出海都要带。&#x27;大大万安街，小小休宁城&#x27;，这话一点也不假。&quot;\u003cbr\u003e▌齐宁街巷口闲坐的吴伯（74岁）：&quot;齐宁街780米，一街出了两个状元，汪绎、汪如洋，都是汪家人。同安堂药铺还是老样子，胡开文墨庄的墨香能飘半条街。老话讲&#x27;东门牌楼西门店&#x27;，如今牌楼没了，店还在。&quot;\u003c/p\u003e"}, {"n": "黟县老城", "s": "黟县", "p": "安徽", "w": "圆城活水·槐渠·通济桥·九街十三弄？黟县是全国少见的圆形城池，城墙之圆顺应山水，街巷之方承载儒家秩序，人称&quot;圆城方街&quot;。城内的槐渠是南北朝开凿、2500米长的明暗活水，通济桥南宋屹立至今。", "h": "\u003cp class=\"main-text\"\u003e黟县秦二十六年（前221）置县，黄山古称黟山，因山名县，是全国最古老县之一。古城始建于东汉、形成于宋元、鼎盛于明清。宋城周&quot;二里三百五十步&quot;设吉阳、望仙、通闾、永宁、桃源、景星六门；明成化二十二年（1486）知县吴一贯复建四门楼；嘉靖四十五年（1566）知府何东序筑城，&quot;周七百三十余丈（约2200余米）&quot;，高2丈厚1丈2尺，设朝阳、迎霭、明昌、环碧、临漳五门，后开桃源（小东门），崇祯七年（1634）迎霭门筑月城称&quot;郭门&quot;。民国后城墙尽拆，唯街巷格局未动，九街十三弄的圆城方街仍在。2021年黟县被列为第137座国家历史文化名城，槐渠活水与通济桥依旧流经城心。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e槐渠：南北朝梁太常卿胡明星开凿，长2500余米、宽近2米，明渠暗渠结合，活动石板掀开可取水灭火，&quot;旱时灌、涝时泄、急时防&quot;仍在使用；通济桥：南宋始建的三孔石拱桥，横跨东溪，为黟城老桥；程氏宅：明万历年间建造的民居，保存完好；戊己桥/薛公井/三元井：宋代古井石桥，散布城巷；古街巷：九街十三弄，青石板路，228处古建筑、3000余幢明清古民居；三条省历史文化街区：古城核心区街巷肌理完整。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌槐渠边洗衣的汪嫂（57岁）：&quot;槐渠是南北朝留下的，两米宽，明渠暗渠都有。渠上的石板能掀起来，平时盖着走路，起火或洗东西就掀开舀水。老辈讲&#x27;旱时灌、涝时泄、急时防&#x27;，这条活水流了一千多年。&quot;\u003cbr\u003e▌通济桥头老人 胡大爷（75岁）：&quot;通济桥南宋就有了，三孔石拱，桥下东溪水清得很。黟县城是圆的，街巷是方的，九街十三弄走不丢。程氏宅明万历年间的，木雕门楼精致，比西递宏村的还老。&quot;\u003c/p\u003e"}, {"n": "祁门老城", "s": "祁门", "p": "安徽", "w": "红茶之乡·东街历史街区·三里街·双虹夜月？祁门是&quot;红茶之乡&quot;，也是古徽州六县之一，红茶鼻祖祁红发源于此。老城东街五百年历史，洪家大屋是当年曾国藩的行辕；三里街&quot;先有三里街，后有祁门城&quot;，两座石拱桥隔江对峙。", "h": "\u003cp class=\"main-text\"\u003e祁门唐代建县，为古徽州六县之一。宋城周&quot;五里二百四十七步&quot;，设东迎仙、南朝京、西望云、北通黟四门，元仍宋旧，明初城圮惟门存。古城夹在阊江与凤凰山之间，阳明门内外商埠辐辏。明嘉靖年间平政、仁济两桥相继架起，三里街因处城外水陆要冲而&quot;先于城兴&quot;，周家嘴码头号称&quot;小上海&quot;，&quot;过载行&quot;五家分立（舒立大/周允兴/马延龙/马元泰/马福顺），是徽茶外销的集散中枢。清代以降祁红名扬海内外，与祁门香并称，森林覆盖率高达88%。老城东街的徽商大宅与三里街的街市，共同撑起这座红茶古城的百年底色。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e东街历史街区：省级历史文化街区，五百年历史，青石板老街与徽派门楼鳞次；洪家大屋：全国重点文保，清代大宅，与太平军对峙十月时曾作曾国藩行辕；谢家大屋：东晋谢安后人聚居地，&quot;一宅七进士&quot;，存万历年间金匾；王家大屋（燕舍）：徽商茧丝酱园老宅，万家大屋为清150余年红茶徽商老宅；三里街：城外东南隔阊江，&quot;先有三里街，后有祁门城&quot;，明清商贸老街；平政桥、仁济桥：两座五孔石拱桥，相距200米，&quot;一官一民、一拱一梁&quot;，合称&quot;双虹夜月&quot;；伟溪塔：北宋所建，塔身嵌400多块佛像砖；文峰塔为明六边形砖石塔，古祁门十二景之一。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌三里街老住户 滕师傅（68岁）：&quot;老话讲&#x27;先有三里街，后有祁门城&#x27;，三里街在城外，比城墙还老。平政桥、仁济桥两座五孔石拱桥隔江相望，相距两百米，晚上月影双虹，好看。周家嘴码头当年做红茶生意，船一到，&#x27;小上海&#x27;就醒过来。&quot;\u003cbr\u003e▌东街洪家大屋管理员 倪女士（55岁）：&quot;洪家大屋是国保，当年曾国藩把行辕设在这，跟太平军对峙了十个月。谢家大屋更传奇，谢安后人迁到这，一门出了七个进士，万历年的金匾还在。东街五百年的青石板，走上去咯吱响。&quot;\u003c/p\u003e"}, {"n": "绩溪老城", "s": "绩溪", "p": "安徽", "w": "华阳古镇·中正坊·三雕博物馆·徽墨之乡？绩溪2007年被列为国家历史文化名城，县治华阳镇千年未移。中正坊的十字拱券门洞贯通四方街巷，是徽州难得的古城规划活标本；龙川胡氏宗祠是&quot;木雕艺术殿堂&quot;。", "h": "\u003cp class=\"main-text\"\u003e绩溪唐永泰二年（766）置县，以乳溪、徽溪&quot;并流离而复合，有如绩焉&quot;得名，县治华阳镇千年未移。宋筑城，明嘉靖年间砖砌城墙，设城门、鼓楼，清康熙三十八年《县志城垣图》至今留存。老城以中正坊为中心街巷四通，城内店铺前店后坊，徽墨作坊林立，是徽墨制作技艺国家级非遗的核心产地，亦是徽菜发源地，胡适一品锅、臭鳜鱼、赛琼碗皆出于此。龙川胡氏宗祠建于明代，木雕九百余件无一雷同，为徽雕巅峰之作。绩溪文风鼎盛，&quot;无徽无成镇，无绩不成街&quot;，从老城中正坊到龙川古村，五百年的徽州文脉浸润着一方水土。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e中正坊：中正街旧称，宋代始建、明代重建，十字拱券门洞贯通东西南北四方街巷，为老城最初地理中心；中正坊-白石鼓历史文化街区、西山历史街区：两片保护街区，163处历史建筑挂牌；三雕博物馆：明代周氏宗祠改建，藏明清砖木石雕原件；龙川胡氏宗祠：全国重点文保，素有&quot;木雕艺术殿堂&quot;之称；奕世尚书坊亦在龙川；绩溪博物馆：老城古县衙旧址上建，建筑师李兴钢&quot;折顶拟山、留树作庭&quot;；西山古井：老城西侧明清井泉；胡适故居：县城内名人故居。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌中正坊看门的老街坊 章叔（69岁）：&quot;中正坊是中正街的中心，门洞是十字拱券，四个方向都能通。老城就围着这坊子长起来，坊下是街，街上做买卖。清代的《城垣图》还在，画着那时的城墙、城门，如今墙没了，十字巷还在。&quot;\u003cbr\u003e▌三雕博物馆讲解员 方小姐（40岁）：&quot;博物馆原是明代周氏宗祠，砖雕、木雕、石雕原件都能看。龙川胡氏宗祠的雀替、梁枋雕了几百个图案，没一个重样，人称&#x27;木雕艺术殿堂&#x27;。绩溪是徽墨之乡，墨坊的烟火气，从老城一直飘到龙川。&quot;\u003c/p\u003e"}, {"n": "旌德老城", "s": "旌德", "p": "安徽", "w": "三桥锁翠·大成殿·文昌塔·国际慢城？旌阳镇是2016年安徽首个国际慢城，城虽小却有三座古桥锁住绿水，称&quot;三桥锁翠&quot;。北宋崇宁年间的文庙大成殿、清乾隆的文昌塔，至今都还立在老城。", "h": "\u003cp class=\"main-text\"\u003e旌德唐代宝应初置县，首任令高叔夏。元元贞元年（1295）东平人王祯（《农书》作者）任县尹，&quot;营县四门&quot;。明嘉靖四十三年（1563）巡道命知县赵在筑城，历时二年，嘉靖四十五年（1565）九月竣工——城三面临山、一面临水（南临梓岫、西倚栖真、北障柳山、东濒徽水），墙高2丈、厚1丈2尺、周891丈，设七门（东三：上迎和、中中和、下义济；大西永丰、小西大有；南阜民、北迎恩），警铺12处、城楼七座。万历三十五年（1607）增设水关门，清乾隆二十八年（1763）筑马道宽5尺、长380丈。建国后城墙陆续拆除，唯街巷肌理未改。三桥锁翠、大成殿、文昌塔皆老城根本，2016年旌德获评安徽首个国际慢城，麻石街上的车辙凹槽仍诉说着旧日商旅。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e淳源桥：宋元丰五年（1082）建于上东门，旌德三桥最古者；架虹桥：明永乐十年（1412）建，位于中东门；黄济桥：明嘉靖年间建，位于下东门；三桥并称&quot;三桥锁翠&quot;；文庙大成殿：北宋崇宁元年（1102）始建，为旌德县学大殿；文昌塔：清乾隆八年（1743）建，古县城文峰塔；老城街巷：南门直通北门，长不足1公里、宽不过3米，麻石街面被独轮车碾出凹槽；庙首镇古巷：清代徽派大屋肇修堂、女词人吕碧城故居所在古镇。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老城街口老人 周大爷（73岁）：&quot;旌德城小，南门到北门一路走下去不满一公里，街宽三米。麻石街面被独轮车碾出深深的凹槽，是当年贩茶贩盐走出来的。淳源、架虹、黄济三座桥锁住徽水，&#x27;三桥锁翠&#x27;，晚上月照桥洞最好看。&quot;\u003cbr\u003e▌文昌塔下的老住户 江婶（60岁）：&quot;文昌塔是清乾隆八年造的，立在城边，登塔能望全城。文庙大成殿北宋就有了，过节时还去拜孔夫子。旌德成了&#x27;国际慢城&#x27;，街上慢悠悠的，老城墙拆了，可这三座桥、这塔、这殿，还是当初的样子。&quot;\u003c/p\u003e"}, {"n": "广德老城", "s": "广德", "p": "安徽", "w": "桃州古城·鼓角楼·天寿寺塔·七门石城？桃州镇自南朝梁绍泰元年（555）即为郡县治，是拥有1500年建制史的山水园林城。鼓角楼北宋始建，是广德城中仅存的古建筑；天寿寺塔与护城河、古井一起，勾勒出桃州古城的轮廓。", "h": "\u003cp class=\"main-text\"\u003e广德最早见于宋淳熙六年（1179），郡守赵希仁建六门设子城；元至正十六年（1356）朱元璋令元帅赵继祖、邵荣筑城，城周8里、高1丈5尺、宽8尺，濠阔16尺深6尺，设迎春、明威、崇德、阅武、石溪、常州六门。嘉靖三十二年（1553）知州庄士元改砖砌城墙、设女儿墙，万历二年（1574）增子墙。清康熙二年（1663）州守杨苞重建，城周9里13步、长1218丈，改门名熙春、丽正、安贞、拱辰。历道光、咸丰大水地震，民国起城墙渐拆，建国后于原城墙基修成环城公路，护城河与老城街巷仍存。桃州素有&quot;负山置郭、夹水为城&quot;之势，万桂山遍植桂树，是远近闻名的山水园林小城。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e鼓角楼（谯楼）：北宋治平四年（1067）始建，广德州衙子城南门，现存砖石楼座高4.3米，为城中仅存古建筑，市保单位；老城墙遗址与护城河：明嘉靖三十二年（1553）砖砌城墙，清朝城周9里13步、长1218丈，设熙春、丽正、安贞、拱辰四门；今城墙基址、护城河（粮长河、熙春河）及环城水系尚存；迎春街、升平街：老城东西南北中五条大街之遗，条石路面；万桂山：明代知州周瑛所建园林，遍植万棵桂树，凌云峰、澄心池；大木桥旧工业区、横山教育区：老城格局东西展开。\u003c/p\u003e\u003cp class=\"main-text\"\u003e天寿寺塔（大圣宝塔）：古桃州地标砖塔，历焚毁而幸存。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌迎春街老商户 沈老板（61岁）：&quot;广德城古称桃州，鼓角楼北宋就有了，是州衙的南门，如今只剩楼座，四米三高。老城五条大街，迎春街、升平街都是从前的大马路，条石铺地。护城河绕城一圈，站在河沿还能想起城墙的模样。&quot;\u003cbr\u003e▌天寿寺塔下乘凉的王婆（67岁）：&quot;天寿寺塔是老城的宝贝，几把火都烧不掉它。万桂山是几百年前知州种的，满山桂花树，秋天香遍全城，可惜如今只见其名不见形。广德是山水园林城，护城河里曾有桥有影，美得很。&quot;\u003c/p\u003e"}, {"n": "宁国老城", "s": "宁国", "p": "安徽", "w": "河沥溪老街·永福桥·小溪口码头·徽商水埠？&quot;小小宁国县，大大河沥溪&quot;，河沥溪老街是水阳江上游最大的内河水陆码头，徽商北上、浙商西进的要冲。永福桥始建明嘉靖年，被称为&quot;世界最长扩孔石拱桥&quot;，古码头石阶犹在。", "h": "\u003cp class=\"main-text\"\u003e宁国地处皖南，东津河（水阳江上游）穿城而过，河沥溪因水运便利自明清至民国一直是&quot;规模最大、人口最多&quot;的宁国首镇。老街沿东津河而建，码头、商号、作坊林立，徽茶、竹木由此转运江浙，是皖东南物资集散与物流中心。永福桥明嘉靖间架起，九孔满肩，沟通两岸；小溪口码头青石垒砌，渡船往来。1990年代后商业中心西移，河沥溪一度萧条，2023年启动保护性更新，2024年9月开街，保留92%传统构件，修旧如旧。老街的骑楼、雕花门窗、石板巷弄，仍是&quot;大大河沥溪&quot;最鲜活的注脚。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e河沥溪老街：明清至民国宁国首镇，皖南浙西物资集散地，2019年省历史文化街区，1200米主街；永福桥（东津桥/河沥溪大桥）：明嘉靖元年（1522）胡珂捐建，九孔满肩石拱桥，宁国现存最大石拱桥；小溪口古街区：县级文保，老街与东津渡、河沥溪大桥连为一体；小溪口码头：全长约100米，青石台阶直通河道，青石斜坡通道；程家大屋：清代老宅，占地约500平方米，前院正屋后院回廊，青石浮雕门套，今作龙窑非遗体验馆；老街古巷：雨伞巷、状元巷，胡开文墨庄招牌、老布店蓝印花布、当铺巷旧墙；《宁川歌》刻石：明代知县王迁相所作，刻于老桥下元宝般石船之上。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌河沥溪老居民 徐爷爷（72岁）：&quot;&#x27;小小宁国县，大大河沥溪&#x27;，这话传了几百年。河沥溪是码头，徽州的山货、浙商的海货都从这过。永福桥明朝就有了，九孔石拱，是宁国最大的桥。小溪口的青石码头一百米长，渡船一靠岸，整条街都热闹。&quot;\u003cbr\u003e▌老街雨伞巷住户 刘奶奶（65岁）：&quot;雨伞巷、状元巷，名字都带着故事。程家大屋当年是富户宅子，天井敞亮，如今改成了龙窑体验馆，还能捏陶。街上的胡开文墨庄金字招牌还在，蓝印花布随风摆，像从清朝走到今天。&quot;\u003c/p\u003e"}, {"n": "郎溪老城", "s": "郎溪", "p": "安徽", "w": "建平古城·明代城墙·七门四关·水环雉堞？郎溪县城古称建平，千年县治未曾迁移。明嘉靖四十五年（1564）始筑城墙，三面环水、周780丈，现存60多米较完整的明代城墙列为省级文保，是安徽少有的城墙遗存。", "h": "\u003cp class=\"main-text\"\u003e郎溪宋端拱元年（988）置县，因南滨郎川河、受广德万山之水，地势卑下，故&quot;聚为治，无城&quot;，置县570余年间仅立四门。明嘉靖四十三年（1564）赵佑卿始筑城墙，四十五年（1566）成，周784丈、高1丈；崇祯八年（1635）侯佐奉宪檄重建，周780丈、趾宽2.5丈。清康熙至雍正屡修，雍正八年（1728）西北女儿墙被暴风刮倒70多丈，复修复。民国间城墙渐毁，1950年代后逐年拆除，唯濒临郎川河一段因防水而保存完好。城墙之内东门街、西门街、北门街三街呈&quot;丁&quot;字形交接，条石铺路。郎溪地接吴楚，胥河古韵与建平八景相映，是皖南水韵古县。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e明城墙遗存：明嘉靖四十五年（1564）始筑，城周784丈、高1丈，三面环水；今临郎川河一段保存60多米较完整，省级重点文保；四门一水关：东朝阳、南清徽（清澈）、西甘露、北瞻天四门，南门右水关名听政门，俗呼&quot;小南门&quot;；南门正对孔庙不建城楼；胥河：春秋伍子胥所开，世界最古老的人工运河，比京杭大运河早近千年，至今流淌；建平八景：涛峰远望、石涧春和等，载入史册；侯村祠堂：国家级文保单位，徽派古建；姚村宣州石砚：李白赞&quot;宣州石砚墨色光&quot;。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郎川河畔城堡观景老者 何大爷（74岁）：&quot;郎溪老城叫建平，城墙明朝嘉靖年修的，三面环水，南门正对孔庙，连城楼都不建，说是怕挡了文气。如今剩郎川河边60多米，青砖还在，是省里的宝贝。北大街当年从四牌楼到北门，毁于乱世之中。&quot;\u003cbr\u003e▌胥河边摆渡人 陈师傅（60岁）：&quot;胥河是伍子胥开的，世界最古老的人工运河，比京杭大运河早近千年，现在还通水。郎溪是吴楚交界的码头，姚村的宣州石砚李白都夸过，&#x27;宣州石砚墨色光&#x27;。老城虽小，水韵悠长。&quot;\u003c/p\u003e"}, {"n": "石台老城", "s": "石台", "p": "安徽", "w": "广阳沉城·秧溪街·龙门古街·水下徽州？石台古称石埭，其县治广阳镇是拥有2000多年历史的古城，1970年太平湖蓄水后整城沉入湖底。秧溪街、龙门街的青石板与明清建筑完好地封存在水下，是最神秘的&quot;水下古徽州&quot;。", "h": "\u003cp class=\"main-text\"\u003e石台之根在广阳。汉武帝元封二年（前109）于此设陵阳县，东晋咸康四年（338）避杜皇后讳改名广阳，南朝梁设石埭县，县治长在广阳，李白曾游陵阳（&quot;归问陵阳钓鱼晚&quot;）。明嘉靖四十四年（1565）诏建石城，完工后广阳成大山深处的石头城，明城椭圆形，面积近1平方公里。城内有秧溪街、龙门街、西门大街等石板街，商号130余家，明清古建筑300余处，为连接池州与徽州的古驿道要冲。1970年7月29日陈村水库（太平湖）蓄水，广阳古城沉入湖底。2015年水下考古探明城墙轮廓与纪年砖，广阳桥、秧溪街、龙门祠堂重见&quot;天日&quot;，古城完整封存于水下，成为皖南最独特的历史遗存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e广阳古城遗址（水下）：太平湖底，2015年水下考古发现城墙轮廓残高约1.5米，部分城墙砖石有纪年文字，明清古建筑300余处；秧溪街：古城东西主街，长近1公里、宽约4米，青石板砌，中铺宽大石作中轴，两侧独轮车碾出石槽，前店后坊两层徽派楼；龙门古街：回字形石板街，唐代起为青弋江上游主码头，&quot;进龙门喜洋洋，出龙门泪汪汪&quot;；西门大街：宽5米、长465米，用310块长1.5米青石板铺就，分中街、西门、东门三段，文庙、县衙、文昌庙皆在街旁；广阳城墙：明嘉靖四十四年（1565）始砌石墙，高1丈5尺、厚8尺，五门（东来宁、南仪凤、小南清舒、西金城、北望华），各设城楼，东西各一水关；广阳桥：老城跨舒溪河古桥，沉于湖底。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌太平湖广阳移民后人 汪先生（58岁）：&quot;老城在湖底，我爷爷那辈从广阳搬出来。原来城里西门大街310块青石板，文庙、县衙都在这条街上，商号130多家，&#x27;小秦淮&#x27;的名字不是白叫的。现在船开到那上方，秋天水落，还能隐约看见房舍的影子。&quot;\u003cbr\u003e▌秧溪街旧住户 凌婆婆（78岁）：&quot;秧溪街不到一公里长，四米宽，青石板铺得整齐，中间那块大石板是街的中轴，独轮车的车辙都碾出槽。街对面是龙门街，回字形的。谁能想到，这么一座热闹了千年的城，一下就沉到水底去了。&quot;\u003c/p\u003e"}, {"n": "太平仙源老城", "s": "太平仙源", "p": "安徽", "w": "麻川古邑·轩辕车会·麟凤桥·千年县治？仙源镇自唐天宝四年（745）设为太平县治，历1218年县治未移，是黄山脚下千载不变的古城。宋代筑城、明代重筑，如今古街石桥尚存，轩辕车会民俗流传千年。", "h": "\u003cp class=\"main-text\"\u003e太平县域原为泾县地，唐天宝四年（745）割泾县西南十四乡置太平县，名出《庄子》&quot;治之至也&quot;。首任县令李偁选址麻川河畔三门山前，因毗邻仙源水而名仙源，遂为太平县治，历唐、宋、元、明、清、民国直至1963年。宋绍定间始筑城，明弘治、正德间重建南宁国、西弦歌、上东门、下东门、北拱辰五门，嘉靖四十二年（1563）再筑，万历四年（1576）加固并加筑砖环900多丈。城内街巷20余条，孔庙、县署建筑宏伟精美，&quot;誉冠宁属六邑&quot;。1958年古城墙拆除改建简易公路，仅城北留一小段。老城麻川河、富溪河环流，麟凤桥、南门桥、树德堂等古建至今。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e麟凤桥：清代建筑，安徽省文物保护单位，跨麻川河古桥；南门桥：明代建筑，与古街古巷古井相连；仙源古街：直街、横街、后街及城湾巷、天官巷、黄家巷、陈家巷等20多条街巷，街宽5米，石板卵石铺面；树德堂、方家大屋、周家大屋：清代古民居；轩辕车会：为纪念轩辕黄帝流传千年的民俗，2006年入选安徽省非遗代表作名录；古城墙遗址：宋绍定间（1228-1233）始筑，周一里二百一十步、高八尺，城门通津/宁远/承流/宣化；明嘉靖四十二年（1563）重筑，城北尚留一小段颓墙；板石石刻：麻川河畔某板石，明嘉靖知县刘元凯及历代文人题诗刻石。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌仙源横街老人 邵爷爷（75岁）：&quot;仙源做了1200多年县治，从唐天宝到1963年。老城墙宋朝就有，明朝嘉靖又重新修了一道，如今只剩城北一小段。直街横街后街，城湾巷天官巷，20多条巷子都还认得。孔庙县署当年&#x27;誉冠宁属六邑&#x27;，如今只剩几张老照片。&quot;\u003cbr\u003e▌轩辕车会传承人 何师傅（63岁）：&quot;轩辕车会是为轩辕黄帝传下来的，一千多年了，2006年进了省非遗。麻川河从黄山流下来，仙源水绕城而过，麟凤桥、南门桥都是老桥。聪明的知县把城设在&#x27;面揖黄山、足潆碧水&#x27;的宝地，可惜县城1963年搬走了。&quot;\u003c/p\u003e"}, {"n": "婺源老城", "s": "婺源", "p": "安徽", "w": "蚺城朱熹故里·弦高古街·虹井廉泉·三面环水？婺源是朱熹故里，县城紫阳镇（古称蚺城）三面环水、形如靴状半岛。明代石城墙与北城门洞至今保存，虹井、廉泉、朱子步行街诉说着朱熹与千年文脉，弦高古街2025年完成保护性修缮。", "h": "\u003cp class=\"main-text\"\u003e婺源唐开元二十八年（740）建县，县治先设清华，天复元年（901）迁紫阳（弦高/蚺城），此后千年为治所。古城东南北三面星江环绕、西面临山，城垣凸起呈靴形、似舌状半岛，星江河绕城半圈西去，即天然护城河。明嘉靖四十五年（1566）大修，改夯土为石墙，向西扩展500米，此后天启、顺治、康熙、乾隆、嘉庆、道光等屡修，咸丰十一年（1861）加高女儿墙三尺。城内街巷青石铺就，万历十三年（1585）知县万国钦铺砌全城石板。婺源文风鼎盛，朱熹故里在此，从唐至清进士140余人，朱弁、董邦达等皆出其邑。城北、城东城门洞今尚存，虹井、廉泉、朱子步行街与弦高古街把千年文脉铺在脚下。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e古城墙与城门洞：明嘉靖四十五年（1566）改夯土墙为石城墙，今北门旧城墙与两处旧城门洞（青石圆拱）保存；2022-2024年复原重建城墙门楼（璧月门）并于2025年开放；虹井：朱熹故居遗址旁的古井，内径1米、深约5米，传朱松出生时井中气吐如虹，旁有巨碑铭文；廉泉：古城东门老城墙下，朱熹亲题&quot;廉泉&quot;墨宝，泉水石缝涌出常年不涸；虹井、朱子步行街：2006年改造老城为徽派商业街，全长约1000米，东西牌坊&quot;文公阙里&quot;与汪鋐四柱牌坊；弦高古街（老城核心）：呈&quot;三水七巷&quot;格局，白墙黛瓦马头墙，木雕砖雕石雕精湛，璧月门、程家大院、节孝牌坊、五福居；当店巷、石牛巷、朱家巷、东门街、十字街、先儒街、程家街、北门街：青石板街巷纵横。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌弦高古街老住户 戴婶（61岁）：&quot;古城三面环水，像只靴子伸在星江里，老话叫蚺城。北门的城门洞还是青石砌的，椭圆拱，几百年了很结实。虹井是朱熹家的井，井水不涸，朱松出生那会儿井里冒虹光，传说讲了几百年。&quot;\u003cbr\u003e▌朱子步行街茶馆主 程老板（57岁）：&quot;朱熹是婺源人，&#x27;半亩方塘一鉴开&#x27;就在附近写的。城东老墙下还有他亲题的&#x27;廉泉&#x27;两个字，泉水常年不断。弦高古街修好了，2025年重新开街，渔灯照亮青石板，&#x27;十里徽风半城水&#x27;，一下子又有了当年的气派。&quot;\u003c/p\u003e"}, {"n": "合肥老城·庐州府城·教弩台·包公祠·李鸿章故居", "s": "合肥", "p": "安徽", "w": "三国曹操教弩台·包家祠堂李家修·&quot;李府半条街&quot
