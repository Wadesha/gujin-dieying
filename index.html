枚铁马风铃，风过即响。距顶端两米处置楼板成斗室，四面各开一窗，内供魁星；楼原是东街小学门楼上的建筑，原貌基本未变。；汜水城旧址（汜水镇）：明洪武六年（1373）建，北依卧虎山，西、南濒汜河，西城门已修复，王家旧宅、李家旧宅、老县衙三处古建尚存。；京襄城遗址（省级文保）：豫龙镇南，春秋郑国寄孥故城，西城墙残长约一百五十米、高约十五米，夯土层一层一层像翻开的书页，清晰可辨两千多年前筑城的泥土。；石洞沟商相祠：高山镇石洞沟村，全国唯一祀殷商傅说的专祠，门楣良弼家风，门前石阶二十四级。；大海寺旧址：北魏正光年间建，1976年发掘出北魏造像龛与唐代坐佛、菩萨、罗汉数十尊。；郑氏三祖铜像：郑上路，郑桓公、武公、庄公三尊铜像立像，天下郑氏寻根标志。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌郑老板（60岁，荥阳郑氏宗亲会副会长，全球寻根组织者）：\u003cbr\u003e&quot;我每年清明都要组织全球郑氏宗亲回荥阳祭祖——2024年来了3000多人，从美国、加拿大、新加坡、马来西亚飞回来的都有。有人问我&#x27;天下郑氏出荥阳&#x27;到底凭什么？就凭郑鲁以国为姓那一刻——公元前375年，韩灭郑，他带着族人逃到广武山，从此郑氏在这里扎根。从汉到隋唐，20多个宰相、186个进士都出自荥阳郑氏，这叫&#x27;郑半朝&#x27;。现在我家也在修家谱——往上追到郑庄公，已经75代了。&quot;\u003c/p\u003e"}, {"n": "巩义老县城", "s": "巩义", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋巩伯国建都于康店一带。北魏约太和年间（约500年）迁治站街老城村，历一千四百年。隋大业初短暂迁洛口；唐武德年间回治。隋末李密曾建都于此。明清华老城五门，多次修缮。1928年西泗河与洛河洪水灌城；1931年再雨，老城成藕坑。1964年县治迁孝义镇（今巩义市区）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e巩义老城村的故事是水写的。北魏以来一千四百年县治扎在这儿，1928年西泗河山洪夹洛水一夜灌城，1931年再一场大雨把老城泡成了藕坑，五〇年代淤成平地，1964年县治干脆搬去孝义镇。如今陇海铁路与连霍高速之间那片平地，就是沉下去的老县城；而东边笔架山下那孔窑洞，杜甫就生在里头。\u003c/p\u003e\u003cp class=\"main-text\"\u003e杜甫故里：站街镇笔架山下，唐先天元年（712）杜甫诞生的窑洞至今尚存。砖券窑洞长约十一米、宽二点九米、高二点七米，门额悬杜甫诞生窑匾，洞壁前七米为明代砖券、后十三米系一九五五年仿明砖券重修。大门外北侧房山墙上嵌清代洛阳知府张汉草书诗圣故里碑一通，路口另有碑楼一座；窑旁种枣树，秋天落枣。；巩县老城遗址（藕坑）：站街镇陇海铁路与连霍高速之间，原县治城垣已淤为平地，地表下偶见明清碎瓷。；巩义窑址（全国重点文保第六批）：北山口镇水地河、白河、铁匠炉村一带，唐三彩、唐青花、白瓷、绞胎器产地，中国青花瓷源头。；北宋皇陵（全国重点文保第二批）：芝田镇、回郭镇一带，七帝八陵与皇后陵、陪葬墓，神道石刻两千余件散在田野。；东周巩王城遗址：康店镇，传春秋巩伯国，现存西城墙约四百米。；康百万庄园：全国三大庄园之一，主宅区过厅悬挂留余匾，匾上刻宋贤王伯大四留铭七十二字：留有余不尽之巧以还造化、不尽之禄以还朝廷、不尽之财以还百姓、不尽之福以还子孙。院内一株乾隆初年种的葡萄树至今三百年，藤干粗如儿臂。；巩义石窟寺：市区北九公里邙山洛水边，北魏熙平年间开凿，现存五窟、千佛龛一个、摩崖大佛三尊、佛像七千七百余尊、造像题记一百八十余方。窟内第一窟帝后礼佛图浮雕为全国孤品，分三层排列，比丘前导、帝后后随，侍女梳着当时流行的发髻、皇后手挎提包；三壁三龛造像仍可上手仰望，窟顶莲花藻井彩绘隐约。；永昭陵（宋陵公园）：市区西南，宋仁宗赵祯陵，神道青石石刻三对列，望柱、象、马、虎、羊、客使、文武臣重新排列，鹊台、乳台、陵台夯土尚存，免费开放。；杜甫陵园：康店镇邙岭上，杜甫墓冢封土隆起，背靠嵩山、俯瞰洛河，墓前清代石碑两通，陵园内杜诗碑林数十通。；青龙山慈云寺：大峪沟镇青龙山，北朝古寺，与少林寺共祖，现存山门、大雄殿、东西厢房，寺外古柏数十株。；张祜庄园：新中镇，清末民初张祜所建十八处四合院，砖雕门楼、窑洞式院落在豫西少见，为省保。；巩义窑址三彩窑：北山口镇水地河、白河村一带，唐宋窑址堆积层厚达一二米，地表可拾到唐三彩残片与唐青花瓷片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杜老先生（82岁，巩义老城村居民，杜甫后裔旁系）：\u003cbr\u003e&quot;我小时候还见过老城的城墙根儿——就在西泗河边上，砖都泡在水里，长了绿苔。1958年&#x27;大炼钢铁&#x27;时挖城墙砖垒高炉，后来又有人挖城墙土卖钱——城墙上的黄土好，和泥盖房子结实。现在藕坑那个位置，我小时候还去摸过鱼——水退下去能摸到碎瓷片，都是明清的。杜甫那孔窑洞我从小看到大——就在笔架山下，旁边种着枣树，每年秋天我去捡枣。我爹说杜甫就出生在那孔窑洞里，我小时候还在里面玩过家家呢。&quot;\u003c/p\u003e"}, {"n": "登封老县城", "s": "登封", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e相传周公于此土圭测影，定地中。隋置嵩阳县。唐万岁登封元年（696）武则天封禅嵩山，改嵩阳为登封、阳城为告成。元至元十三年（1276）郭守敬建观星台，修《授时历》。明清建砖城四门。今城墙仅存一段；城隍庙为市博物馆。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e登封老城在嵩山脚下，武则天封禅后给它改了名。城里文庙街那座城隍庙是明初原构，一进大门、照壁、大殿、廊房，院里立着一百多品碑。老城城墙只剩市直一初中北墙外三十米一段，夯土层贴着学校围墙。真正的大家伙在城外告成镇——一座覆斗形砖台，台北一条石圭平躺在地上，郭守敬就在这台上测日影。\u003c/p\u003e\u003cp class=\"main-text\"\u003e观星台（世界文化遗产）：告成镇周公庙内，元至元十三年（1276）郭守敬建。台身作覆斗形砖石结构，台身高约九米半，连台顶小室通高约十二米半；台身北壁正中凹槽即测影高表，槽东西两壁自下而上对称收分，槽与石圭之间留三十六厘米空隙，正是当年横梁下垂悬球校验垂直之处。凹槽向北，三十六块青石平铺成石圭（量天尺），通长三十一米余，圭面刻景符刻度。台身北壁东西两侧对称设出入口，砖石踏道盘旋上台顶，踏道四角设水道排水，台顶周砌女儿墙。；周公测景台（世界文化遗产）：观星台北约二十米，唐代南宫说所立石表，上刻周公测景台，为最早土圭测影遗址。；中岳庙（世界文化遗产）：市区东太室山南麓，五岳现存最大祠庙建筑群，峻极殿面阔九间重檐庑殿。神库四角立四尊北宋治平元年（1064）铸铁铁人，高三米许、重约三吨，握拳振臂、怒目挺胸，至今未锈；院中汉柏唐槐三百三十余株，皮裂如鳞。；嵩岳寺塔（世界文化遗产）：市区北五公里，北魏十二边形密檐式砖塔，高约三十八米，灰砖黄泥垒砌，中国现存最古密檐砖塔。；登封城隍庙（全国重点文保第七批）：文庙街西，明初年建，占地五千三百平方米。沿轴大门、照壁、东西掖门、仪门、卷棚、大殿、东西廊房一路排开，共十二座建筑八十余间；大殿面阔五间、进深三间，歇山式灰筒瓦顶。院内碑碣石刻一百五十余品，含新建中岳庙记、大明国河南府登封县八棱碑、景日昣墓表，以及清代登封县、古嵩阳楼石匾。二〇〇〇年辟为登封历史博物馆。；登封古城墙残段：市直一初中北墙外，长约三十米、宽约八米、高约五米，夯土。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌常松木（登封史学家，城隍修复工程牵头人，耗时3年还原登封古城）：\u003cbr\u003e&quot;我用了3年时间，走访了20多位老前辈，翻阅了能找到的所有县志，才把登封古城的格局搞清楚——北城墙在中岳大街南侧，南城墙在少林路北侧，西城墙在嵩阳路东侧，东城墙在菜市街西侧。最繁华的是东西关街。现在那30米残段还在——我每次路过都要摸一下那夯土层，摸的时候脑子里想的是武则天站在嵩山上封禅的样子。我今年60多了，希望有生之年能把这段残段修复起来，不是为了搞旅游，是为了让后人知道，登封这个名字是怎么来的。&quot;\u003c/p\u003e"}, {"n": "襄城老县城", "s": "襄城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋楚灵王六年（前540）筑城，因周襄王居氾地得名襄城。汉、唐、宋历代增修，仍为土城。明嘉靖二十九年（1550）重修方城，周五门。明万历二十五年（1597）加砖筑城并增瓮城。明末李自成毁城；清顺治、康熙间两次重修。2013年核定为全国重点文保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e襄城老城最硬的一段是西城门那座瓮城。半圆形的城圈，两道城门拐着弯——头一道门朝南，第二道门朝西，墙外头有墙、门里头还有门，红石奠基、青砖覆面。城墙顺着北汝河铺，残墙还剩两千二百多米，红石条从根底一直压到墙腰。城旁边就是襄城驿，古驿站的土台还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e襄城古城墙（全国重点文保第七批）：现存西、南两段残墙约二千三百米，高近七米，底宽约十五米、上宽八米，墙基用长条形红石条石垒砌、石基高一米余，外青砖覆面、内黄土夯筑。红石从北汝河滩地采来，色泽暗红，雨后天晴墙根泛出赭色；墙顶旧有垛口，今断断续续约剩几段。；西城门瓮城：半圆形城圈，南北间距约五十八米、东西进深三十二米、周长约一百五十米，高八米余、顶宽四米，红石奠基、青砖覆面。两道城门方向不一——第一道朝南，第二道朝西，门外有门、墙外加墙，瓮城内左右留有耳室。一九六〇年代为防洪，瓮城以砖封堵，封堵的新砖与旧砖色差至今留在门洞内壁。；襄城驿遗址：瓮城旁，古驿站基址，专家考为中国最早古驿站之一。；古城公园：西城门外、北汝河畔。；襄城乾明寺：首山北麓寺门村，唐武德年间始建，号称中州第一禅林。山门前明代砖雕照壁建于嘉靖二十八年（1549），一字形砖砌、全长约十三米、高近四点七米、厚七十余厘米，正面青砖浮雕黄帝首山采铜图与七圣迷径图；寺后一株省念禅师手植千年银杏，秋来满地黄叶。；襄城文庙奎壁影壁：县城关镇利民街，文庙大成殿南，明万历十三年（1585）建。挑山式壁顶覆琉璃瓦，壁高近十米、长二十四米余、厚一点六米；主体画面长约十三米，由两组双龙戏珠、东西两侧麒麟望月与双凤朝阳拼成，下衬云雷纹、花草纹两层。壁基取首山红石砌成，上雕对称缠枝花卉与狮子戏绣球，刀法遒劲，是中原文庙影壁中最精的一座。；紫云书院：县城南紫云山南麓，明成化年间户部尚书李敏所建，为明代全国八大书院之一，现存大成殿、左右明伦堂、东西两庑，四合院完整，外有钟鼓楼、文昌祠。；首山：县城南一里，嵩山余脉，传黄帝采铜处，乾明寺即在山阴，山上乾明寺塔林残塔数座散落荒草。；襄城城墙红石基：现存残长二千二百余米，高约六米，墙基清一色红石条石垒砌，内黄土夯筑，是河南境内保存最好的春秋至明代夯土城墙之一。；襄城文庙大成殿：县城利民街，明洪武二年重建，面阔五间，殿前青石月台，殿内金柱两人合抱。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌谢金成（襄城县文广旅局文物管理股工作人员，守了城墙30年）：\u003cbr\u003e&quot;我1994年参加工作就守在这个瓮城里——那时候瓮城里长着几棵榆树，粗得两个人合抱不过来。我最喜欢登西城门的台阶——拾级而上，站在城墙上能看到北汝河。西城门是1960年代为了防洪被封死的——那时候怕洪水从城门灌进来，用砖堵了。现在城门洞里还留着当年封堵的痕迹。瓮城里的榆树2018年清理瓮城的时候砍了——说是要修原貌，我看着那几棵榆树被拉走，心里空落落的，那树比我爷爷岁数都大。&quot;\u003c/p\u003e"}, {"n": "长葛老县城", "s": "长葛", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋鲁隐公九年（前714年前后）郑武公筑长葛邑，子产采邑。战国时迁长社，因社柏暴长得名。隋开皇六年（586）设长葛县，治今老城镇。明正德年间闭四大门、开小南门。1960年县治迁和尚桥新城，老城镇留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e长葛老城在老城镇，地面上的老物件不多——老县衙只剩一堵墙，爬满爬山虎。但镇南和平村那片洗砚池还在，长方形一汪，池水早干了长着草；打绳赵村西那片社柏更老，二十六株古柏立在田野里，粗得三人合抱，风一吹满柏香。\u003c/p\u003e\u003cp class=\"main-text\"\u003e钟繇洗砚池：老城镇和平村南小南门，长方形，东西长约六十米、南北宽约三十米，相传楷书之祖钟繇在此练字洗砚、池水尽黑。民国时池上曾建亭榭曲桥，今已不存，池边高台钟繇台仍在。近年沿池砌起石护坡、围了汉白玉护栏、岸旁植柳，但实地池水覆一层绿藻浮萍，水面黄浑，与墨池清幽相去远矣。；社柏群：老城镇西北半里、打绳赵村西，为战国魏长社邑社稷坛故地。原有古柏二十六株，现存二十三株，最大者树围丈余、数人合抱，树龄两千年以上，枝干虬曲、针叶深碧，风过满柏香。坛早不存，乡人仍呼社柏为社坛之柏。；长葛故城（省级文保）：佛耳湖镇孟寨村，春秋郑武公所筑，城墙夯土现存最高约四米。；十二连城（全国重点文保）：战国魏长城，今存五段约一千五百米，夯层清晰。；长葛老县衙：今仅余一堵墙，爬满爬山虎。；石固遗址：石固镇岗河村西，石梁河与胜天湖河故道汇流的高台地上，裴李岗文化叠压仰韶文化，距今七千四百年，一九七三年冬当地农民取土发现，后经社科院考古所多次发掘，出土房基、灰坑、墓葬与大量磨制石器、夹砂红陶，为第六批国保。；禅静寺造像碑：老城镇初级中学校园内，东魏兴和二年（540）镌，记敬史君事迹。碑高二点五米、宽八十四厘米、厚二十六厘米；碑额九十厘米长，雕六条倒首盘龙与壁龛式佛造像，碑文一千二百余字，书法扁平方正、圆润含蓄，康有为列为逸品上。碑清雍正六年出土、乾隆十四年移陉山书院，今置于方形保护房内、外罩玻璃。；泰山庙大殿：老城镇东关村，清代建筑，面阔五间、进深三间，单檐歇山九脊顶。屋面铺绿色琉璃筒瓦，当中点缀三组黄色琉璃方心，正脊通体饰琉璃牡丹纹样、脊端起三重檐楼阁，檐角安走兽并挂风铎，檐下五踩斗拱出挑深远，木构保留豫中地方手法。；子产墓：陉山山顶，春秋郑相子产墓冢封土尚存，墓前清代石碑两通，登山可望新郑、长葛两县。；具茨山岩画：市境西南具茨山，大量远古岩刻符号与凹穴散布山脊，为全国罕见的史前岩画群。；苗庄遗址：老城镇北，新石器至商周聚落，台地高出周围数米，地面散见红陶与黑陶片，为省保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌钟老汉（75岁，老城镇洗砚池边住了50年，钟繇后裔旁系）：\u003cbr\u003e&quot;我小时候洗砚池里还有水——池水是黑的，我爹说那是钟繇洗砚台留下的墨汁。我半信半疑，舀了一瓢尝了一口——没味，但颜色确实黑。现在洗砚池干了，池底长了草，钟繇台还在，被村里立了个牌子。社柏群我也常去——那26株柏树，我爹说他爷爷小时候就那么粗，2700年了，还在长。我们钟氏家谱我爹还存着——往上追到钟繇，已经不知道多少代了，就知道是他的后代。&quot;\u003c/p\u003e"}, {"n": "禹州老县城", "s": "禹州", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e相传夏启于钧台之享，瓦店为夏代早期都邑。战国韩景侯（前408年）迁都阳翟。明正德三年（1508）徽王朱见沛获准甃砖城，四门。明末李自成军围城，城墙受损。1942年国民政府令扒城防日机，仅扒部分。近代城墙多次拆毁；今存钧官窑路一段。（T17豫中郑州西部+许昌6县·完）。（以上为T17大批次6县正文）。（以下为T18大批次7县正文·豫南信阳大别山）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e禹州老城（阳翟）在颍水边，明徽王七代经营留下的砖城早拆得只剩钧官窑路一段二百来米、高约七米的残墙，墙上还留着当年挖黄土脱坯的凹痕。城东南神垕镇那座伯灵翁庙才是活的——窑神庙花戏楼飞檐下盘龙翔凤，老街七里长，匣钵垒成的笼盔墙一路从街口砌到巷尾，两边全是钧瓷作坊。\u003c/p\u003e\u003cp class=\"main-text\"\u003e阳翟城墙残段（省级文保，2016）：钧官窑路一段，长约二百三十米、高约七米，纯夯土城垣。墙面上凹凹凸凸留着当年穷苦人挖黄土脱坯的勺痕，一块一块像被狗啃过，雨冲处露出夯土层；墙根野草从夯缝里钻出。；瓦店遗址（全国重点文保）：火龙镇，夏代早期都邑，发现围沟、红烧土面、五谷坑、人骨坑等夏代祭祀遗存。；钧窑遗址（全国重点文保）：钧台路原第一高中院内，北宋徽宗时期专为宫廷烧造的官办窑场，东西长约一千一百米、南北宽约三百五十米，文化堆积层厚一至二米。一九七三至七四年发掘清理出两座完整窑炉：一号窑为长方形窑室、双乳状火膛，造型独特极少见；七号窑为北方常见馒头窑。窑炉、烘房、泥料作坊基址尚存。；伯灵翁庙（省级文保）：神垕老街中心，俗称窑神庙，始建于宋，明弘治八年（1495）重建，清光绪两次重修。正门即花戏楼，飞檐斗拱、盘龙翔凤石雕；庙内祀窑神孙伯灵（传孙膑烧炭）、土山大王（舜陶河滨）、金火圣母三尊。花戏楼又名争气楼，源于清同治十三年窑工罢工请愿、每月增工钱二十文，窑工立誓所建。；怀帮会馆（全国重点文保第七批）：清代山西怀庆府商人所建，禹州十三帮会馆之一。；古钧台（省级文保）：城南，传夏启钧台之享处。；天宁万寿寺（全国重点文保）：钧台路西，元大德三年建，是禹州现存唯一元代建筑。大雄宝殿面阔三间、进深三间，平面方形，单檐歇山灰瓦顶，檐下置四铺作单下昂；殿内减柱造，仅存两根后金柱，梁架为彻上明造草栿梁，大部分木构件保留自然材，为第八批国保。；周定王陵：无梁镇老官山东麓，明周定王朱橚墓，地宫前殿、正殿穹隆完整，石门、石椁尚存，旁有王妃陪葬墓，是河南明代藩王墓中少有的可下地宫参观者。；钧官窑遗址：钧台路原第一高中院内，北宋徽宗时期官窑，东西长一千一百米、南北宽三百五十米，文化堆积层厚一二米，窑炉、烘房、泥料作坊基址尚存，第三批国保。；神垕老街笼盔墙：神垕镇七里长街，两侧院墙全部用烧瓷废弃的匣钵笼盔垒砌，赭红色圆孔洞洞相连，从街口一直砌到巷尾，作坊至今仍在烧钧瓷。；天宁万寿寺大雄宝殿：钧台路西，元大德三年建，减柱造，仅存两根后金柱，梁架为元代原构，第八批国保。；伯灵翁庙花戏楼：神垕老街中心，明弘治八年重建，正门即花戏楼，飞檐斗拱，盘龙翔凤石雕，庙内祀窑神孙伯灵。；怀帮会馆：老城西北，清代山西怀庆府商人所建，戏楼、拜殿、正殿保留完整，木雕精美，第七批国保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘天骧（88岁，禹州城内长大，城墙旁卖黄土的连堂街居民后代）：\u003cbr\u003e&quot;我爹说他小时候在连堂街住——就是禹州城墙西边那片空地。新中国成立前，连堂街的穷苦人都在城墙上挖土洞住，以卖黄土为生。禹州城墙的黄土好，陶器脱坯、烧砖都离不开。我爹说他十几岁的时候，一天能挖两筐黄土，卖两文钱，够全家人吃一天。1942年国民政府下令扒城墙防日机轰炸——禹县政府没敢全扒，说城壕是防洪的，不能塞。后来城墙砖被陆续拆了盖房子、建学校，现在就剩钧官窑路那229米。我有时候路过那残段，还能看见城墙上挖过土的痕迹——凹凹凸凸的，像被狗咬过。&quot;\u003c/p\u003e"}, {"n": "信阳老城", "s": "信阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周宣王时封申伯于此，义阳三关为南北要冲。明洪武十三年（1380）千户张用展拓旧址筑砖城，五门。明正德八年（1513）兵宪宁河、佥事阎钦甃以砖石，三年落成。崇祯十四年（1641）流寇夜袭城陷，垣堞尽毁。清初顺治间吴士伸督修，垣堞复旧。1950年7月古城墙开始拆除。今存文庙大成殿与文庙后街。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e信阳老城像一艘船，浉河从城南横过当了天然护城河，城墙西北东三面夯土包砖，南面借河。城早拆了，奎楼1950年跟着城墙一块没了，只留下一张1943年的老照片。如今城里只剩文庙大成殿——信阳现存唯一一座古建筑；殿后的文庙后街五百米，青瓦白墙，墙上还绘着老城故事。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文庙后街：东起中山路、西至广场南路，长约五百米，青瓦白墙，街壁绘老城故事连环画；今为机关幼儿园与老街巷，墙根下偶见旧条石。；义阳社区：沿用古义阳山名，原义阳山已平。；浉河：穿城南而过，借河为城，今河仍是老城屏障。；申伯台、申国故城：北郊有战国板筑法古城残墙。；城阳城址（楚王城）：平桥区城阳城址保护区，距市区二十五公里淮河北岸，春秋楚武王破申时所筑，分内外两城，内城周长一千八百七十九米、外城三千五百八十七米，是我国现存六座楚王城中规模最大、保存最好的一座。公元前二七八年秦破楚都，楚顷襄王曾到此避难为临时国都；一九五七年附近楚墓出土我国第一套完整青铜编钟。；申伯楼：浉河公园内，沿用古八景奎楼晚照功能新建，近汉唐风格，楼体硕大，登楼可望浉河与老城屋脊。；文庙大成殿月台：义阳社区，元始建明清重修，殿前青砖砌祭祀台长二十五米、宽十五米，使大殿更显庄重。；西关石板老街：老城西门外，明清青石板路残存数百米，两侧豫南民居木门板、马头墙依稀可辨。；义阳山故址：老城义阳社区，古义阳山已平，仅存地名与一株老皂荚树。；浉河古渡：城南浉河湾，老渡口石阶仍在，河面上今仍通小型渡船。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文庙大成殿（省级文保）：老城义阳社区，是信阳现存唯一一座古代建筑。元始建，明清屡修，大成殿五楹通长约十八米，建在高台之上；殿前青砖砌祭祀台长二十五米、宽十五米，使大殿更显庄重。原建筑群还有崇圣祠、泮池、正门桥、尊经阁、明伦堂，自民国兵燹后多毁，今仅存大成殿木构。；奎楼（已毁）：原在东南城墙上，奎楼晚照为信阳八景之一，1950年随城墙拆除，仅有老照片存世。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘老爷子（80岁，信阳老城十字街居民，住了55年）：\u003cbr\u003e&quot;我小时候城墙还在——1943年那张老照片是我爹拍的，他是照相馆的学徒。城墙那时候还能跑马车，宽得很。我爹说奎楼原来有两座——下奎楼在关帝庙旁，上奎楼在东南城墙上，&#x27;奎楼晚照&#x27;说的就是上面那座。1950年拆城的时候，我爹还哭了一场——那奎楼他小时候常爬上去玩。现在文庙大成殿还在，我每周都去那儿转一圈——里面有孔子像，有人烧香。文庙后街我也常走，现在修得比以前好，但我还是怀念以前那些青石板路——下雨后亮堂堂的，能照见人影。&quot;\u003c/p\u003e"}, {"n": "固始老县城", "s": "固始", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周至春秋：为蓼国、番国地，番国故城在此立国。东汉建武二年（26年）：光武帝封李通为固始侯，县名沿用至今近两千年。南宋：始建东门楼，为凤凰城标志。明景泰元年（1450年）：知县马良筑砖城，周三里、四门。初唐：陈元光率固始将士南下入闽；唐末王潮、王审知复率固始义军入闽。一九七〇年代：东门楼拆毁。现状：番国故城夯土残垣存，陈元光祖祠、吴其濬墓等文保单位尚存，老城区街巷格局依稀。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在固始城关，第一眼看见的不是楼，是城外那一圈还没被磨平的东周夯土——番国故城的残垣从田埂上隆起，夯层一层压着一层，外城护城河的旧道还在地里弯着。县城老街上，东门楼早已不在，可&quot;三弯九巷十八条大街&quot;的骨架还在，青石板缝里嵌着闽台两姓回来寻根的脚印。\u003c/p\u003e\u003cp class=\"main-text\"\u003e番国故城遗址（第五批国保）：城关镇外围，东周番国都城，分内城外城两圈，外城周长近十四公里。西墙残垣分成十一段断续趴在田埂上，黄粘土夯层一层压着一层，每层约半尺厚，圆形夯窝密密麻麻排着，墙基最宽处近二十米，高处有一人半，北城墙一段至今保存最为完整。土层里随手翻得起春秋战国陶片，外城护城河的旧道还在地里弯着。；陈元光祖祠（第六批国保，清）：县城东北二十五公里陈集镇，坐北朝南面向浮光峰，清嘉庆年间复建的四合大院，占地五千余平方米，原房近百间今存三十一间，石基石柱青砖灰瓦，堂室含廊，硬山式砖木，门前一泓碧水称月牙塘。大门外石狮石象蹲坐，狮象背上浮雕斑纹，石柱脚方形雕有人像。海内外陈氏宗亲每年正月十六来此祭祖。；吴其濬墓及故居（省保）：县城南六公里汪棚乡大皮村为墓，县城中心存故居，清代状元、《植物名实图考》作者，青砖小瓦木架结构，前后廊石基木柱。；东关南街与西关大街：老城区明清格局残留，街巷三弯九转，青瓦白墙豫南民居夹道。；孙叔敖祠：期思陂比都江堰早三百年的水利工程纪念，春秋楚相孙叔敖，祠宇近年修葺。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e蓼城凤凰台旧址：县城内，古城形如翔凤、东门楼为凤首的传说源起，东门楼一九七〇年代拆毁，台基尚在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陈先生（55岁，固始陈氏宗亲会副会长，开漳圣王祖祠守祠人）：\u003cbr\u003e&quot;我守陈祠20年了——每年正月十六陈元光诞辰庙会，天不亮就有人来烧香。2024年来了台湾宗亲300多人，带着族谱回来——他们说&#x27;台湾70%的人口祖籍在福建，福建70%的人口祖籍在固始&#x27;。我听完眼睛都湿了——我们固始人在台湾的后代，比固始本地人还多。我儿子在厦门做生意，每次回来都要去陈祠上香——他说他是陈元光第78代孙，在厦门那边已经繁衍到好几千人了。我跟他说：&#x27;不管走到哪儿，根在固始，别忘了回来烧个香&#x27;。&quot;\u003c/p\u003e"}, {"n": "息县老县城", "s": "息县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e周武王十三年（前1044年）：封姬姓息侯国，都青龙寺；同时封赖子国于包信。春秋：楚灭息国置息县，为&quot;郡县制&quot;活化石。元元贞元年（1295年）：建息州谯楼。明万历四年（1576年）：知县王用宾重建谯楼。二十世纪七十年代：濮公山水泥厂采石，山体被开采殆尽。现状：城墙大部拆毁，谯楼独存，息国故城、赖国故城夯土残垣在。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e息县十字街正中，那座元代谯楼还蹲在路口——城台拱券门洞南北贯穿，车马仍从楼下过。城外西南六公里青龙寺，息国故城的夯土残垣还立在田边，比周围地面高出二十来米。濮公山被水泥厂削去半座，如今正在原址上堆出地质公园，湖先回来了。\u003c/p\u003e\u003cp class=\"main-text\"\u003e息州谯楼（县保）：县城十字街中心，元元贞元年始建，明万历四年重建，清嘉庆年间重修，一九八四年在原台基上仿古复建。今楼身双重檐砖木水泥结构高约九米，楼下砖石城台正中一道拱券门洞南北贯穿，车马仍从楼下过，门洞两侧的砖壁台基还是元代原物，七百年不曾挪窝。为息县现存最老的地上建筑。；古息城遗址（省保）：县城西南六公里徐庄村青龙寺，西周息侯国都城，城址长方形，东西约八百余米南北四百余米，后人在城址上建了青龙寺故俗称青龙寺遗址。北城墙中部一段长约三百米、宽约三十米、高出地面四五米的夯土残垣还立在田边，断面夯层八至十二厘米一层，夯窝直径约四厘米，层层叠压清清楚楚。城基宽十余米至三十米不等，曾出土青铜剑、戈、箭镞。；赖国故城（省保第四批）：县城东北三十五公里包信镇付庄村，闾河之滨，西周赖子国都城，城址略呈方形，高出地面约两米，四周有护城河旧道，为赖姓发源地。；濮公山地质公园：古称浮光山，苏轼曾题&quot;东南第一峰&quot;，一九七〇年代水泥厂采石削山，近年辟为地质公园，桃花谷、不老泉等九湖复现。；息夫人像与纪念馆：息州大道口立息夫人（桃花夫人）像，春秋楚文王夫人，今辟纪念馆。；宋代县城地下排水系统：县城地下仍在使用，砖石水道为宋代原构。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，息县十字街居民，住了50年）：\u003cbr\u003e&quot;我小时候濮公山还在——山上有狼洞、滴水洞、八仙洞，三月三庙会人多极了，耍猴卖艺的、卖玩具的、卖饭的全有。我和小伙伴爬山顶看庙会，挤得人都动不了。1970年代开始开水泥厂，十年工夫山体就挖没了——我爹说他亲眼看着山头被铲平，那炮声轰隆隆响了好几年。现在正在建地质公园，山还没修起来，九湖倒是先有了。我每天都去湖边转一圈——看着那湖水，我就想起小时候的濮公山。我儿子现在在河南大学教书，每次回家都要去濮公山看看——他说等修复好了要带我看苏轼题的&#x27;东南第一峰&#x27;。&quot;\u003c/p\u003e"}, {"n": "罗山老县城", "s": "罗山", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e北魏：灵山寺始建。北宋：县治迁今罗山县城，避水患。明嘉靖年间：重修砖城。一九三四年十一月十六日：红二十五军从何家冲出发长征。现状：城墙拆毁，正大街明清格局存，灵山寺、何家冲、天湖墓地三处国保省保尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e罗山老城本身墙已拆尽，正大街南北一线，青瓦白墙还剩几进豫南老院。真正的宝在城外：灵山寺藏在豫鄂交界的山坳里，寺门匾额是明太祖御笔；往南走铁铺乡何家冲，那棵古银杏树下，一九三四年红二十五军两千九百多人从这里踏上长征路。\u003c/p\u003e\u003cp class=\"main-text\"\u003e灵山寺（省保）：县城西南灵山东南山坳，始建于北魏，唐开元间重建，明嘉靖年间重修，一九七九年落架大修。寺院三进依山势呈梯形排列，中轴线上天王殿、祖师殿、大雄宝殿一路抬升。大雄宝殿为庑殿顶式，东西面阔五间，殿内五尊明代泥塑佛像端庄完好，中供释迦牟尼佛高约五米，阿难迦叶侍立两侧各高两米出头。中院一井甘美为灵山泉一窍，寺门圣寿禅寺匾额传明太祖御笔。；红二十五军长征出发地（第四批国保，1996年）：铁铺乡何家冲，现存军部旧址何氏祠、医院旧址与集合地古银杏树，一九三四年十一月十六日红二十五军两千九百余人在此集结出发，为长征四大出发地之一。；天湖墓地（国保）：商周文化遗址，出土大批商代墓葬与青铜器，已辟国家考古遗址公园。；董寨国家级自然保护区：县境南部，豫南候鸟天堂，白冠长尾雉种群密度居全国之首。；正大街：老城区南北主街，明清格局残留，两侧青瓦白墙豫南民居。；罗山协议旧址：民国时期建筑，已活化利用。；灵山寺山门与三奇：县城西南灵山东南麓，北魏延兴四年建，庙门东开、僧尼同寺、带发修行并称灵山三奇，寺门圣寿禅寺匾额传明太祖朱元璋御笔，现存大殿七层，僧尼数十人。；何家冲何氏祠：铁铺乡何家冲，红二十五军军部旧址，明初始建的青砖四合院，占地约四百平方米，前后两进各五间正房，东西厢房十六间，马头墙翘出墙头，青砖布瓦风格豫南。祠前一株古银杏胸围数人合抱，一九三四年十一月十六日红二十五军两千九百余人在树下集结出发长征。东行三百米为红军医院旧址，四座相连的明代四合院占地一千六百平方米。；何氏祠医院旧址：何家冲内另一处清代院落，为红二十五军医院旧址，木楼、药房基址尚存。；天湖墓地：县城东南，商周文化遗址，出土商代古酒载入吉尼斯世界纪录，已辟国家考古遗址公园。；子路问津处：县城西南子路镇，传孔子使子路问津处，台地尚存，旁立明清碑刻。；灵山寺银杏与佛塔：寺后一株千年银杏，树围数抱，寺西侧塔林残塔数座散落。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王大妈（68岁，罗山正大街老居民，在老城住了45年）：\u003cbr\u003e&quot;我小时候正大街两边全是青瓦白墙的老房子——每天清晨能闻到隔壁蒸馒头的香味，傍晚街口卖糖葫芦的铜锣一响，小孩们都跑出来了。现在正大街还在，但老房子越来越少了——我家隔壁那棵老槐树今年被砍了，说是要修商业街。灵山寺我每年正月初一都去烧香——我女儿在郑州工作，每次回来也要去。说也奇怪，我去灵山求了好几次，她的工作每次都能如愿。我知道这是心理安慰，但人老了，就信这个。董寨我也去过——满山的鸟，叫得跟唱歌似的，比正大街闹多了。&quot;\u003c/p\u003e"}, {"n": "光山老县城", "s": "光山", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e北宋天禧三年（1019年）：司马光生于光山正大街司马池宅第。明末至清康熙三年（1664年）：建紫水塔。清乾隆年间：紫水塔毁；光绪年间重修至六层；建国后复原七层。现状：城墙已拆，正大街部分格局存，司马光故居、紫水塔、邓颖超祖居尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e光山正大街南北五里，青石板被踩得发亮。街中段那座四合院是司马光故居，院里司马井的水还清着；往东走到司马光东路，紫水塔八角七层立在河边，每层两个真门两个假门，小孩钻进去容易迷路。往北过白云巷，邓颖超祖居的清代四合院门关着，门楣上&quot;邓氏祖居&quot;四字还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e司马光故居（县保）：正大街中段，北宋真宗天禧三年司马光出生于此，占地一千三百余平方米，四合院落格局，现存东西两门，悬山式砖木结构。院中心司马井传为司马光洗三时所用，井旁养粹亭立着，西院墙下一组砸缸群塑还在，东门外千年古柏依旧青苍。院内立宋代石碑一通，门前一对元代石狮刀法古朴。；邓颖超祖居（第六批国保，2006年）：城关镇司马光中路白云巷，清代豫南四合院，占地约三千平方米，分东中西三座院落，坐北朝南前后两进，现存清代房屋三十余间，格扇门窗古朴。门楣挂邓氏祖居匾，院内青砖铺地凹凸不平，陈列周恩来、邓颖超生前文物与生平事迹。；正大街：南北走向五华里，砖石路面，五十年前光山唯一主街，两旁青瓦房明清格局残留。；弦山公园：城北弦山，&quot;紫水弦山&quot;格局中的弦山所在。；王大湾会议会址：砖桥镇文氏祠，一九四七年刘伯承、邓小平在此召开旅以上干部会议，现存清代文氏祠四合院，辟为纪念馆。；净居寺：大苏山北麓，北齐天保年间始建，宋苏轼贬黄州时常来读书，寺内现存大雄殿、御书楼，寺外古柏数株，传苏轼手植。；白雀园明清街：白雀园镇南北主街，青石板路残存数百米，两侧明清木门板店铺仍在，是光山保存最完整的一条老街。；司马光故居宋代石碑与元代石狮：正大街中段故居院内，立有宋代石碑一通，门前一对元代石狮，刀法古朴，院内司马井井水至今清澈。；花山寨会议旧址：城西花山村，一九三四年红二十五军长征出发前会议旧址，旧式四合院尚存。；紫水塔二真二假门：司马光东路，八角七层砖塔，每层两个真门两个假门，游人入内易迷方向，塔内石阶可盘旋至顶。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e紫水塔（省保）：司马光东路紫水河畔，明末始建，清康熙三年完工，八角七级楼阁式砖塔通高二十七米，底层直径约八米。塔基花岗岩条石砌成，塔身灰砖叠砌，塔门朝西，石雕门额紫水塔三字，上款同知衔知光山县事王玉山题，下款光绪丙申孟夏上浣重建。二至六层每层两个真门两个假门，半圆拱券对称排布，乾隆年间塔毁残高约二十米，光绪丙申重修至六层，建国后补筑七层塔刹。今塔门封闭，塔内旋壁石阶与檀木楼板仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌小方（28岁，光山县融媒体中心记者，司马光故居讲解志愿者）：\u003cbr\u003e&quot;我从小在正大街长大——上学路过司马光故居，天天进去蹭玩。我奶奶说我小时候跟同伴&#x27;砸缸&#x27;玩过——那时候还不知道自己玩的就是砸缸救友的典故。现在我是故居的志愿者讲解员，每次给游客讲司马光的故事，讲到&#x27;持石击瓮破之&#x27;，我都手舞足蹈的——可能小时候玩砸缸的记忆太深刻了。紫水塔我也常去——塔里面有石阶能爬到顶层，每层有两个真门两个假门，我小时候分不清，被卡住过两次。现在塔门还是那个样子——明代的工艺，真就是真，假就是假，像司马光这个人，表里如一。&quot;\u003c/p\u003e"}, {"n": "商城老县城", "s": "商城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉：置雩娄县。北宋建隆元年（960年）：避宣祖赵弘殷讳，改殷城为商城。明成化十一年（1475年）：从固始分县复置。一九二九年五月六日：立夏节起义，建立赤城县苏维埃。一九三二年：设赤城县；一九三七年复名商城。现状：城墙拆尽，崇福塔、金刚台红军洞群、法眼寺遗址尚存。（T18豫南信阳大别山7县·完）。（以上为T18大批次7县正文）。（以下为T19大批次6县正文·豫东开封补+豫北新乡）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e商城县城最老的建筑是崇福塔，明代砖塔立在老城街心。往东南走二十公里上金刚台，海拔一千五百多米的山腹里藏着七十六条红军洞；再往东黄柏山，法眼寺早已无存，只剩一对明代石狮和两株千年银杏守着台基。《八月桂花遍地开》就是从这一带唱出去的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e崇福塔（省保）：县城关第一中学院内，明代楼阁式砖塔，六角七层通高约二十二米，底层直径六米四。塔基赭红色花岗岩垒砌束腰须弥座，下刻圭脚上雕宝相覆莲，束腰处减地浮雕折枝牡丹，转角立柱阳刻卐字纹；上枭上枋高浮雕龙、狮、天马、松竹梅、鹿等图案各具神态。塔身青砖平卧错缝砌筑，一层西壁拱门通塔心室，砖铺磴道绕内壁盘旋而上。崇祯二年重建题记嵌于一层东外壁，各层檐角旧悬风铎。为老城现存最古建筑。；金刚台红军洞群（国保）：县城东南金刚台主峰一带，海拔一千五百余米，山腹石洞中曾藏红军游击队二十八年，现存洞群数十个，一九五五年河南省政府辟为红色景区。；赤城县苏维埃政府旧址（省保）：县城内，一九二九年立夏节起义后建立的县级苏维埃旧址，辟商城县革命史纪念馆。；汤泉池：金刚台脚下温泉，历代疗养胜地。；林伯襄故居：河南大学首任校长林伯襄故里，县城内。；崇福塔细节：县城关第一中学院内，明崇祯二年重建，六角七层楼阁式砖塔，通高约二十二米，直径六米四，石砌底座浮雕仰莲、伏莲与龙狮如意，基层西面圭形门，内辟一室，砖铺磴道绕塔身内壁盘旋而上。；息影塔：黄柏山塔湾，明天启七年梅之焕为法眼寺开山无念禅师所建，八方四层楼阁式石墓塔，通高八米五，全以精雕花岗岩砌成，塔前眉刻息影塔三字。；金刚台朝阳洞：金刚台主峰西南，海拔一千一百四十五米，天然岩洞深十二米、宽八米、高五米，洞口草木掩映，曾为红军医院旧址。；华祖庙：金刚台上，清康熙十三年建，纪念华佗采药，每年农历九月初九庙会。；赤城县苏维埃旧址：县城内，一九二九年立夏节起义后建立的县级苏维埃，旧式四合院，辟为商城县革命史纪念馆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e法眼寺遗址（省保）：黄柏山，明万历年间无念禅师创建，原房一百余间，文革中寺毁，现仅存石狮一对、两株千年银杏与明代碑刻九通，李贽曾在此讲学。；黄柏山法眼寺石狮与银杏：黄柏山法眼寺台基前一对明代石狮蹲坐，两株千年银杏分立左右，树冠遮天蔽日。寺已毁于文革，台基尚在，明代碑刻九通散立阶下，碑面风化但字口尚可辨认。李贽当年在此讲学，如今石台空阔，唯石狮与银杏相对无言。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌周先生（45岁，商城县教体局干部，商城起义史研究者）：\u003cbr\u003e&quot;商城的名字960年改至今，从来没变过。我每次给外地朋友介绍商城，都不说别的——先说109位进士，再说52位授衔将军，最后唱一句《八月桂花遍地开》。我爹是县党史办的退休干部，从小给我讲立夏节起义——1929年5月6日夜里，全县同时暴动，一夜之间打了商城县城。那是河南第一次成功的武装起义，意义大了去了。我现在每周都带学生去金刚台抗敌洞群——那上面藏着59个洞，28年红旗不倒。红军们在那上面吃野菜、盖草棚，还唱《八月桂花遍地开》。我每次唱这首歌，都能想起我爹讲的那些故事——商城的魂，就在那首歌里。&quot;\u003c/p\u003e"}, {"n": "开封县老县城", "s": "开封县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：郑庄公筑启封城，取&quot;启拓封疆&quot;意。西汉景帝前元元年（前156年）：避景帝刘启讳，改&quot;启封&quot;为&quot;开封&quot;，沿用至今两千二百年。唐延和元年（712年）：开封县治迁汴州城（今开封市区），启封故城废。明洪武年间：启封故城旁建朱仙镇，因岳飞抗金驻此得名。二〇一四年：撤开封县设祥符区。现状：启封故城西墙残垣存，朱仙镇七十二街巷格局存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e真正的&quot;开封&quot;二字不在今开封市区，而在朱仙镇东南两公里古城村——郑庄公筑的启封故城，西墙一段高约七米的夯土残垣还立在田边，夯层八厘米一层，夯窝柱洞清晰可辨。附近朱仙镇的明清老街还在，木版年画作坊一年到头印着门神。\u003c/p\u003e\u003cp class=\"main-text\"\u003e启封故城遗址（第七批国保，2013年）：朱仙镇东南两公里古城村，春秋郑庄公筑，取启拓封疆意，城址呈不规则梯形，四墙全长约三千三百米。东、南、北三面城墙已没入地下数米，唯西墙北段一段长约一百五六十米、高约七米、墙基宽三十余米的夯土残垣还立在麦田边，东侧峭立西侧缓坡，夯层八厘米一层，夯窝柱洞清晰可辨。残垣周围种着高大树木，荒草没膝。；朱仙镇古街巷：明清古镇，西大街、顺河街、估衣街、京货街、铜货街分行划市，明清格局存，与汉口、佛山、景德并称四大古镇。；朱仙镇木版年画（国家级非遗）：与天津杨柳青、山东潍坊、四川绵竹并称四大年画，作坊至今在老街开张。；启封故园（4A）：朱仙镇北，近年按北宋风格复建的水景园林，城墙高约十米、长约两公里。；陈留镇：祥符区陈留镇，秦置县、汉晋陈留郡治，现存北宋汴河故道陈留段（省保）与明清街巷，曹旧镇已无城垣。；朱仙镇岳飞庙（含关帝庙，第七批国保二〇一三年）：朱仙镇岳庙大街，明成化十六年始建，占地约一万八千平方米，三进院落坐北朝南，为全国四大岳庙之一。大殿拜殿沿中轴线次第展开，东院碑林立碑三百余通，碑面历经风雨字迹漫漶，但碑座石础仍在。与启封故城、清真寺并称全镇三国保。；朱仙镇清真寺（国保二〇〇六年）：朱仙镇老街，回坊风格，大殿出檐深远，与岳飞庙、启封故城并称全镇三国保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌陈文斐（祥符区文管所所长，启封故城考古人）：\u003cbr\u003e&quot;我1987年刚参加工作时，就守着启封故城那段残垣——那时候城墙比现在高，上面长着酸枣树，我和考古队的人蹲在城根儿刷陶片。1986到1987年我们探明了整个城址——梯形，东西南北四墙全有，就是后来黄河淤积、后人取土烧窑，把城墙毁了不少。现在那段158米的残垣，是仅存的地面遗存——但夯土层每层8厘米，跟现在工地标准差不多。2013年评国保的时候我跟着去答辩，专家说&#x27;这段残垣是郑州以东、开封以南保存最完整的春秋城垣&#x27;——我心里那块石头才落了地。现在很多人只知道清明上河园，不知道启封故城——清明上河园是假的，这才是真开封的根儿。&quot;\u003c/p\u003e"}, {"n": "洧川老县城", "s": "洧川", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e金兴定二年（1218年）：置洧川县。明景泰元年（1450年）：知县筑砖城，开五门。明正德十年（1515年）：知县张恭建五门门楼。明清：十二次重修，有&quot;八保洧川、固若金汤&quot;之称。一九六五年：洧川县并入尉氏县。一九九二年：南门维修，王成喜书&quot;镇洧门&quot;三字嵌于门额。现状：城墙毁，仅大南门与城上古柏存，城隍庙残殿存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e洧川镇最奇的一眼，是站在南城门洞下往上看——门洞拱券正上方的砖缝里，斜斜长出一棵胸围一人的古柏，根须沿砖缝扎进墙体，五百多年了枝叶还朝城北倾。城墙其余部分早拆了，唯独这座门因这棵柏活到今天。城门外那道宽百米的护城河，原本是挖在城里的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e洧阳门（南城门，省保，2006年）：洧川镇中轴，明景泰元年建，东西宽约七米、进深十三米半、高约十米，内外壁大砖砌就，底部青石铺基，顶部半圆形拱券门。门洞北出口正上方砖缝中斜斜长出一棵古柏，树干直径一点一米，向北倾卧，根系沿砖缝扎进墙体深处，五百余年枝叶仍葱郁。一九九二年维修，王成喜书镇洧门三字嵌于门额，至今汽车仍从门洞下穿过。；城门古柏：相传城池竣工时鸟衔柏籽落砖缝而生，树龄五百余年，一九六四年暴雨冰雹中岿然未倒。；洧川城隍庙（省保，2006年，与南门合并公布）：明初建，明正统五年重修，拜殿面阔五间，明弘治十七年石狮一对，高二米四七。；城内护城河：河南独一份——护城河挖在城内而非城外，宽百米，残段仍在镇中。；十字形城垛遗址：原城墙垛口呈十字花形，传为宋明两朝出吕蒙正、刘理顺两状元方可使用，今仅存基址。；洧川城隍庙石狮：镇中心路北，明弘治年间石狮一对蹲在城隍庙大门外，高二米四七，刀法古朴，卷鬃鬣毛仍清晰可辨，石面风化但蹲姿犹健。城隍庙明初建、明正统五年重修，拜殿面阔五间，与南城门合并公布为省保。；鸿台寺听月：镇西北里许，双台并峙，各高数丈，上建玉皇阁，旧为洧川八景之鸿台听月，今台基仍在，荒草没膝，登台可望双洎河。；兴隆岗新石器遗址：镇北兴隆岗，台地高出周围数米，地表散见红陶与夹砂陶片，为县保。；裴寨马旺古寨：洧川镇裴寨村南，明清寨墙残段夯土尚存，为第三批准定历史建筑。；洧川老街十字街：镇中心东西南北四街仍为石板路，老门板铺面数十家，每逢双日大集。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e北门古榆传说：原北门城楼顶曾有一株古榆，与南城门古柏遥相呼应，洧川老话南门至北门百柏里有余榆，今北门已毁，仅存北门里地名。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王水田（洧川镇文化站站长，&quot;金牌讲解员&quot;，发表新闻作品9000余篇）：\u003cbr\u003e&quot;我给每一批来洧川的游客讲的第一件事就是那棵古柏——传说500年前城池竣工，一只小鸟衔着柏树籽飞过，柏籽从嘴里滑落，偏巧落在城门洞正上方的砖缝里，就长出来了。我每次讲这个故事，都要抬头看一眼那棵柏——它的根沿着砖缝往下扎，扎进城墙的砖缝里，扎进地下，跟这城门血脉相连。1964年那个闷热的夏夜，狂风裹着暴雨下着冰雹，很多树连根拔起，但这棵古柏岿然不动。我今年也常去南城门——现在城门洞里汽车川流不息，古柏的枝叶还那么葱郁，像个守护了500年的老爷爷。&quot;\u003c/p\u003e"}, {"n": "新乡老县城", "s": "新乡", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e隋开皇六年（586年）：设新乡县。唐武德元年（618年）：始筑土城，中高四下，状类覆釜，俗称龟背城。明崇祯十二年（1639年）：知县米寿图创包砖城。北宋政和元年（1111年）：建北关大桥。一九四九年至一九五二年：新乡为平原省省会。一九五〇年代：城墙城门逐步拆除。现状：城墙无存，环城四街位置仍存，卫河与北关大桥桥墩遗迹在。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新乡老城的轮廓看不见墙，只看得见四条环城街——环城北街、西街、南街、东街，正好压在明清城墙的基线上。城里十字口是老城最高点，文庙在西、关帝庙在东，左文右武。城北卫河从城下流过，北宋政和年间的北关大桥桥墩，清淤时还露过水。\u003c/p\u003e\u003cp class=\"main-text\"\u003e北关大桥（邵公桥）遗迹：城北卫河上，北宋政和元年（1111年）邵博建，二〇一八年卫河清淤时见宋桥墩，仍在河床中。；大观圣作之碑：老城内西大街原红旗区政府院内，北宋大观二年立，碑高四米四七、宽一米二六、厚约四十厘米，龟趺座。碑额半圆形，上刻二龙戏珠与缠草图案，下刻云气纹饰，大观圣作之碑六字为蔡京题额。碑文四周浅刻卷龙缠枝牡丹花边，正文二十七行满行七十一字，共一千余字，为宋徽宗瘦金体、李时雍摹写，笔笔瘦硬挺拔。全国仅存四通此碑，此通保存最为完好，近年修葺后将作为景点开放。；关帝庙（寿亭侯庙）：东大街（崇化街），元至元七年（1270年）建，左文右武格局中的武庙。；卫河（大运河永济渠段）：城北流过，世界文化遗产河道。；城里十字与环城四街：东大街崇化街、西大街弦歌街、北大街安仁街、南大街归德街交汇于老城最高处，环城四街即旧城墙线。；大观圣作之碑：老城内西大街原红旗区政府院内，北宋大观二年立，碑高四米四七、宽一米二六、厚四二厘米，龟趺座，碑额半圆雕二龙戏珠与缠枝纹，碑文为宋徽宗瘦金体、李时雍摹写、蔡京题额，全国仅存四通。；东岳庙天齐大殿：城内东关，五代后唐清泰二年建，现仅存大殿、月台与山门，大殿面阔五间、进深三间，殿内木雕精美，楹联道贯三界、德表两仪为中国名联。；新乡文庙大成殿：西大街弦歌街，北宋元祐四年重建，明洪武三年重修，现仅存大成殿与明伦堂。殿内金柱为明代原物，柱身包浆与木纹历历，殿外月台砖缝间生野草。文庙旧址即大观圣作之碑原立处，左文右武格局中文庙居西。；关帝庙（寿亭侯庙）：东大街崇化街，元至元七年建，左文右武格局中的武庙，现存大殿三间。；北关传统民居：卫河沿岸北关街，因漕运兴起的清代四合院群，青砖木门，门板上仍存商号题记。；平原省委旧址：城北和平路，一九四九至一九五二年平原省省会办公地，苏式二层楼尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨大爷（75岁，新乡城里十字老居民，住了55年）：\u003cbr\u003e&quot;我小时候还在城墙上跑呢——那时候城墙高三丈七尺，砖缝里长着酸枣，我和小伙伴摘酸枣吃。北门（拱辰门）离卫河只有二丈远，城墙根儿就是护城河。1958年大队说拆城墙炼铁，我爹也去了——他搬了几块砖回家垒鸡窝。现在那鸡窝还在，砖上的花纹磨平了。北关大桥我也常去——那桥是北宋建的，桥墩还在。卫河边的老槐树，我小时候就在下面乘凉，现在还在。城里十字现在盖了商场，但西大街、东大街的老巷子还留着——文庙、关帝庙的香火还没断。我每天遛弯必走那条老巷——闻着香火味，心里踏实。&quot;\u003c/p\u003e"}, {"n": "获嘉老县城", "s": "获嘉", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e商末：周武王率八百诸侯在此同盟伐纣，后为牧野之战誓师地。西汉元鼎六年（前111年）：汉武帝巡狩至此，闻平南越捷报，取&quot;斩获吕嘉、功成吉祥&quot;意置获嘉县。明洪武三年（1370年）：知县熊邦基重筑土城。清康熙二十三年（1684年）：改创砖城。一九五一年至一九六〇年：县城墙拆尽。现状：县城墙无存，同盟山武王庙与唐槐存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e获嘉县城东三公里，同盟山是个高出周围五六米的黄土台——相传周武王率八百诸侯在此每人捧一抔土兜成此台，歃血为盟。台上武王庙现存明清殿宇四十余间，山门、拜殿、武王大殿一路抬升，院里一棵唐槐还活着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e同盟山武王庙（省保第二批，1986年）：县城东三公里，周武王伐纣牧野誓师盟台，盟誓夯土台高出周围地面五至七米。庙坐北朝南三进五院，自南至北山门、二门、拜殿、武王大殿一路抬升，现存明清殿堂三十余间。武王大殿单檐歇山九脊造，绿色琉璃瓦覆顶，台基为须弥座式，主体保留明代结构。院内唐槐一株老干横斜，历代碑刻二十余通散落廊下，庙旁诸侯饮马池旧坑仍在，八百米御道青石铺砌。；齐州故城：县北，北朝齐州城址，夯土残垣高约二三米，长数百米，地面散见战国至汉代陶片，为省保。城垣趴在田野间，断面夯层尚可辨，与同盟山武王庙一北一南相望。；渡河词碑：明代内阁首辅夏言撰文书丹，现存县城。；石佛芝麻糖：二十余道古法工序，省级非遗，县城老店。；获嘉马皮舞：省级非遗，北方少见的传统舞蹈。；武王庙唐槐与明狮：同盟山武王庙山门前，一株唐槐老干横斜，一对明代石狮蹲在台阶两侧，石面风化但卷鬃仍可辨。；周武王同盟之山指路碑：县城东获嘉至新乡公路旁，明嘉靖三十年秋卫辉府获嘉县立，青石石碑一通，由此岔路通往武王庙。；同盟山御道与饮马池：武王庙前三进五院间，八百米御道青石铺砌，庙旁诸侯饮马池旧坑仍在，积水成洼。；齐州故城：县北，北朝齐州城址，夯土残垣高约二三米，长数百米，地面散见战国至汉代陶片，为省保。；渡河词碑：县城内，明嘉靖年间内阁首辅夏言撰文书丹，记录嘉靖帝渡黄河盛况，行草刚劲。；武王庙文王殿、太公殿：庙内除武王大殿外，文王殿、太公殿、周公殿、圣母殿一路抬升，明清木构四十余间。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（62岁，获嘉县同盟山武王庙讲解员，干了25年）：\u003cbr\u003e&quot;我每次给游客讲同盟山，都要让他们蹲下来摸一摸脚下的土——这就是3000年前八百诸侯每人捧一抔黄土堆出来的山。我25岁开始在这里当讲解员，那时候武王庙还没现在这么火，每年只有庙会的时候才有人来。现在每年清明前后都有上千人从全国各地赶来——有的是研究商周史的，有的是《封神演义》迷，有的是寻根的宁氏宗亲。我每次讲到&#x27;武王与诸侯歃血为盟&#x27;那段，声音都不自觉提高——3000年前这群人就是从这里出发，一路打到朝歌，推翻了商纣王。我摸那夯土台的时候，手还能感觉到3000年前残留的温度。&quot;\u003c/p\u003e"}, {"n": "卫辉老县城", "s": "卫辉", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东魏：始建汲县城池。明洪武年间：重筑砖城。明万历十九年（1591年）：潞简王朱翊镠建望京楼。明万历年间：潞王就藩，城池南拓，原南护城河变为城内玉带河。明末：形成西盐店城、北盐店城与主城三城拱辉格局。现状：城墙大部存残段，比干庙、望京楼、潞简王墓、徐世昌家祠四处国保尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e卫辉老城的骨架是个&quot;日&quot;字——外护城河一道，城内玉带河又一道，两水夹城。城东北隅望京楼立在原地，三十多米高的砖石无梁殿，墙面风化斑驳，墙缝里能摸到明代砖灰。城外西北凤凰山麓，潞简王墓神道石刻一对对列着，像把北京定陵缩成了藩王规制。顿坊店乡比干庙里，周武王封的龙洞与北魏孝文帝吊比干文碑都还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e比干庙（第四批国保，1996年）：顿坊店乡比干庙村，墓庙合一，北魏孝文帝因墓建庙，现存照壁、山门、二门、碑廊、拜殿、大殿、石坊、墓冢一路抬升，占地四万四千平方米。照壁明弘治七年建，中间嵌二十四块高浮雕绿色琉璃砖拼成牡丹花卉图。碑廊内自北魏至明清碑刻八十六通，东廊下孝文帝吊比干文碑身完整。墓冢封土高约二十米，前亭残碑殷比干墓四字传为孔子剑刻。每年四月初四海内外林氏来此寻根。；潞简王墓（第三批国保）：城西北凤凰山南麓，万历四十三年（1615年）建，现存最大、保存最完好的明代藩王墓，神道石刻十六对、石牌坊、华表、祾恩殿基址，仿定陵规制。；徐世昌家祠（国保）：贡院街西口，民国大总统徐世昌家祠，现存最大民国影壁。；卫辉古城墙残段：明洪武年间重筑，原周长六里，今局部夯土残垣存，原城门为拱券式、外设半圆形瓮城。；日字形水系：外护城河与城内玉带河（原南护城河因潞王拓城圈入城内）至今仍有河道。；陀罗尼经幢：城内，后晋天福年间所建石经幢，八角形，幢身刻陀罗尼经文，刀法流畅，第八批国保。；镇国塔：城内，明代楼阁式砖塔，七层八角，塔身砖雕佛像，与望京楼遥相呼应，为省保。；香泉寺石窟：城西北霖落山间，南北朝至清石窟群，现存佛像数十尊，摩崖题记数十处，第七批国保。；小店河古村寨：狮豹头乡小店河村，清代民居建筑群二十余处，依山傍水，石墙石瓦，为省保。；比干庙孝文帝吊比干文碑：庙内东廊下，北魏孝文帝南巡时亲撰并书，碑身完整，书法为北魏碑刻代表作。；望京楼无梁殿：城东北隅，明万历十九年潞简王朱翊镠建，高三十三米，全砖石砌，无一根木梁，国内现存最大石构无梁殿，外墙风化斑驳，墙缝可摸到明代砖灰。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e望京楼（第六批国保，2006年）：卫辉古城东北隅，明万历十九年潞简王朱翊镠为思母所建，国内现存规模最大的石构无梁殿。楼高约三十三米，东西宽约三十二米、南北进深约十九米，平面长方形坐北面南，共两层：外壁青条石垒砌，内壁白石镶筑，中设白石腰檐。底层东南西南各辟券门，四面开窗，形成十字拱券结构，中央可容数百人，穿堂风过凉如殿。第二层原五间歇山式大殿清初被拆，青石柱础成排犹存。全楼无一根木梁，外墙风化斑驳，墙缝可摸到明代砖灰。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌林老师（70岁，卫辉比干庙管委会成员，林氏后裔，福建厦门人回卫辉寻根定居）：\u003cbr\u003e&quot;我每年四月初四都要在比干庙门口挂上&#x27;天下林氏归卫辉&#x27;的牌子——我是林氏第97代孙，老家在福建厦门，但族谱上清楚写着&#x27;源于卫辉&#x27;。我2005年第一次到卫辉，站在比干墓前，眼泪控制不住地往下掉——1000多年了，我们林氏子孙终于回到了根上。现在我退休后就定居在卫辉，每天去比干庙帮忙——有人问我&#x27;你厦门人跑到河南来干嘛&#x27;，我说&#x27;我回家&#x27;。&quot;\u003c/p\u003e"}, {"n": "辉县老县城", "s": "辉县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周：共国在此建都，共伯和行政（前841年）为中国有确切纪年之始。元至元四年（1267年）：建善济塔。明崇祯五年（1632年）：知县张可俭筑砖城，仅辟东西南三门，独缺北门。清道光年间：城垣定型。一九五〇年代：明清砖城拆毁。现状：共城夯土残垣存，百泉、善济塔、琉璃阁三处国保尚存。（T19豫东开封补+新乡6县·完）。（以上为T19大批次6县正文）。（以下为T19大批次6县正文·豫东开封补+豫北新乡）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e辉县城东，共国故城的夯土残墙还在田野上隆起——东墙残段高五六米、墙基宽约四十米，西周共伯和&quot;共和行政&quot;就从这片土上开始。县城共和路心，善济塔七级六角立着，元至元四年的砖，塔身带石刻佛像。往西北两公里苏门山南麓，百泉湖还在，卫源庙、涌金亭环着泉水旧道。\u003c/p\u003e\u003cp class=\"main-text\"\u003e共城城址（第四批国保）：县城外围，西周共国都城，残存夯土城墙约千米，东残垣高五六米、墙基宽约四十米，夯层清晰，公元前841年共和行政发源于此。；百泉（第五批国保，2001年）：县城西北苏门山南麓，河南最大古典园林建筑群。卫源庙隋大业年间始建，坐北朝南依山势，由山门、拜亭、清晖殿、寝殿四部分组成。清晖殿面阔五间进深三间，副阶重檐，背面单檐歇山，为河南大型明代木构之一。涌金亭临湖而建，亭内嵌历代碑刻五十余块，北宋苏轼书苏门山涌金亭六字犹在。湖底泉眼累累如贯珠，湖水常年恒温，冬不结冰（近年水位下降，泉眼暂不喷涌）。；善济塔（第七批国保，2013年）：共和路天王寺旧址，元至元四年建，七级六角楼阁式砖塔，通高约二十四米。塔基须弥座仅高不到半米，塔身由下至上逐层收敛呈锥形，通体嵌砌石雕佛像、砖雕斗拱与棱柱假窗。第一层东壁半圆券门入塔，塔室旋道可登，第五层外壁一排砖雕佛龛内佛造像各各不同。历经十二次地震与战火仍巍然，为全国仅存八座元代楼阁式砖塔之一，二〇一九年修复塔刹。；琉璃阁遗址（国保）：城东，东周至汉古墓葬群，文昌阁蓝色琉璃瓦重檐攒尖顶八角形。；百泉药会（国家级非遗）：始于明代，全国四大药市之一，每年四月初一至十五在百泉湖边开市。；白云寺：薄壁镇薄壁村西太行山西麓，唐始建，原名白茅寺，现存山门、中殿、东西陪殿五十余间，寺后元代普照大禅师石塔、唐代银杏、五百罗汉碑并峙，第七批国保。；孟庄遗址：市东南孟庄镇，裴李岗、仰韶、龙山三层叠压，为共工氏核心活动区，第六批国保。；百泉卫源庙与清晖殿：苏门山南麓百泉湖东北，隋建卫源庙，清晖殿面阔五间为明代木构，殿前珍珠亭、涌金亭临湖，泉眼累累。；百泉涌金亭与清辉阁：百泉湖岸，北宋遗构，亭柱刻历代题咏，亭下泉水自湖底串串涌出，如贯珠。；太平兴国禅院碑铭：市西北太行山区，宋代碑刻一通，碑文记太平兴国禅院沿革，书法精整，为省保。；赵长城遗址：辉县与卫辉交界太行山脊上，战国赵长城沿山脊蜿蜒，石砌残墙尚存，为第八批国保。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌韩师傅（58岁，辉县百泉药会传承人，&quot;百泉通&quot;，在百泉摆了25年药材摊）：\u003cbr\u003e&quot;我爷爷在百泉药会摆了50年摊，我爹摆了30年，传到我这里25年了——三代人，正好105年。我爹说他小时候百泉药会比现在还热闹——山西商人拉着骡子车来，卖党参、黄芪；安徽商人挑着担子来，卖白芍、菊花。药会从四月初一开到四月十五，半个月不散场。现在药会现代化了，网上也能卖，但我还是每年在百泉湖边摆个小摊——卖我爷爷传下来的老药方配的草药。2018年评国家级非遗的时候，我去北京参加论证——专家说百泉药会是目前全国唯一一个延续600年的露天药材交易市场，我说我信，因为我爷爷摆了50年，那片湖的水都能闻出药味儿来。&quot;\u003c/p\u003e"}, {"n": "伊川老县城", "s": "伊川", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国末（前256年）：周赧王姬延伐秦无功，逃入新城（今古城寨）躲债，&quot;债台高筑&quot;典出于此。隋大业元年（605年）：始置伊川县。北宋：程颢、程颐在此讲学，&quot;程门立雪&quot;典故发生。明成化十二年（1476年）：复置伊阳县。北宋仁宗以来：范仲淹、邵雍、程颢程颐先后葬于此。现状：战国夯土城墙存，二程墓、范仲淹墓、徐阳墓地三处国保，朱温宣陵省保存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e伊川老城不在今县城，在城关镇古城寨村外——一圈战国夯土城墙还环着村子，土层里夹着粟米灰烬和锈箭镞，传说就是周赧王躲债的&quot;新城&quot;。城外西北一公里，二程墓古柏成林；往南彭婆镇万安山下，范仲淹墓的封土堆前立着&quot;先天下之忧而忧&quot;的石碑。\u003c/p\u003e\u003cp class=\"main-text\"\u003e周赧王避债台（古城寨战国城）：城关镇古城寨村外，战国新城夯土城墙周长数里，残垣断续隆起，土层夹粟灰与锈箭镞。城垣趴在村边田埂上，断面夯层夹着炭灰，成语债台高筑典故源地。；二程墓（国保）：县城西北一点五公里，程颢、程颐墓园，古柏数百株，近年辟二程文化园，程门立雪典故发生地。；范仲淹墓（第六批国保，2006年）：彭婆镇许营村万安山麓，俗称范园，坐北朝南，南北长约一百八十余米、东西宽约一百余米，园内古柏四百七十二株。前域青砖青瓦山门入内，清顺治年间石坊四柱三门，坊额刻高山仰止。神道两侧北宋石刻石翁仲、石狮、石羊各一对，石面风化但轮廓犹可辨。范公祠堂坐北朝南，祠堂后范仲淹墓冢高约四五米、周长三十米，墓碑宋参知政事范文正公墓清雍正五年立。祠前褒贤之碑碑额为宋仁宗亲书，碑文欧阳修撰、王洙书丹。；邵雍墓（省保）：平等乡西村紫荆山下，&quot;安乐佳城&quot;，北宋易学大家邵雍葬此。；徐阳陆浑戎墓地（第八批国保）：鸣皋镇徐阳村，东周墓群六百余座，二〇二〇年全国十大考古新发现。；杜康造酒遗址（国家级非遗）：葛寨镇上皇古泉，明弘治&quot;酒源&quot;题刻。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e伊川书院（省保第五批，2008年）：鸣皋镇，程颢程颐讲学处，现存一株九百年古树，原碑刻建筑二〇〇五年修缮时多有损毁。；朱温宣陵（省保，2000年）：白沙镇常岭村东南，五代后梁太祖朱温墓，现存封土高约十二米、南北长三十三米、东西宽三十五米，神道石刻已毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌范老师（56岁，彭婆镇范园管理员，范仲淹后裔旁系）：\u003cbr\u003e&quot;我爹从1960年代就守范园了，传到我这儿第二代。每年清明周边学校都来范园祭范仲淹——学生们齐声读&#x27;不以物喜不以己悲&#x27;，清亮的声音撞在古碑上，我每次都鼻子发酸。我爹说他小时候范园古柏比现在还粗，有棵三个人合抱不过来的，1958年大炼钢铁砍了烧高炉。现在范园还有几十棵古柏——其中一棵我爹说&#x27;范仲淹亲手种的&#x27;，虽然我不信，但每次摸那棵树的树皮，我就觉得在摸一千年的风骨。我儿子在河南大学读中文，每次回来都要去范园转转——他说他毕业论文要写范仲淹，写完第一个给我看。&quot;\u003c/p\u003e"}, {"n": "汝阳老县城", "s": "汝阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e唐先天元年（712年）：曾置伊阳县，后废。明成化十二年（1476年）：析嵩县东、汝州西置伊阳县，首任知县韦坚筑土城。明正德至崇祯年间：甃砖、增角楼警铺。清光绪十三年（1887年）：护城拦河大堤、三面砖砌。一九五九年八月：国务院批准伊阳县改名汝阳县，避与宜阳同音。现状：城墙大部拆，观音寺、杜康庙存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e汝阳县城东南十五公里圣王台村，那座观音寺坐南朝北，跟天下佛寺反着来——中轴线从山门开始一层比一层高，天王殿、关圣殿、正佛殿、汤王宫一直抬到最高处。关圣殿墙上明代壁画还在，单刀赴会、水淹七军的线条没褪。县城北边蔡店乡杜康村，杜康河的水还在流。\u003c/p\u003e\u003cp class=\"main-text\"\u003e观音寺（省保，1986年）：小店镇圣王台村，坐南朝北，南倚凤凰山北临汝河，与天下佛寺朝向相反。北宋庆历年间始建，明正统年间铁船和尚重修，现存四进院落沿山势层层升高，中轴线上山门、天王殿、关圣殿、正佛殿、汤王宫一路抬到最高处。关圣殿内壁画为明代原绘，单刀赴会、水淹七军线条未褪，无后期重绘。寺内留存十二通明清古碑，两株雌雄古银杏近千年，洗心井泉水甘冽。；杜康庙与杜康村：蔡店乡杜康村，杜康造酒遗址，国家级非遗酿造技艺，&quot;酒祖之乡&quot;，杜康河穿村。；汝阳老县衙：西门大街，清顺治二年始建，正堂忠爱堂、思补堂。；西泰山：杜鹃花海景区，前坪水库。；宝应寺：蔡店乡杜康村与常渠村之间，唐宝应元年始建，现存山门、大佛殿与东西厢房。大佛殿硬山筒瓦，殿内壁嵌清乾隆四十一年重修碑，碑面字迹尚清。寺邻杜康河，与杜康庙、杜康村连片。；云梦山鬼谷洞：城关镇云梦村云梦山，山半腰传为鬼谷子隐居授徒处，云梦洞、孙膑洞、传兵洞沿山壁凿开，洞内曾出古钱币与石斧。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌铁船（法号，80岁，观音寺第17代住持，守寺55年）：\u003cbr\u003e&quot;我师父给我起法号铁船——就是明代重修寺院那位铁船和尚的名字。我1969年进寺，那时候观音寺已经被改成了小学校，关圣殿里坐满了学生，壁画被糊上了报纸。我偷偷把报纸撕下来，用湿布擦壁画——擦了三天，擦出了单刀赴会的画面，那色彩还鲜艳着呢。现在壁画保护下来了，被评为河南省寺院壁画珍品。观音寺倒驾慈航坐南朝北——有人说这是菩萨面北望众生，有人说这是顺应凤凰山汝河水的地势。我不管那些，我只知道这寺在这儿快一千年了，汤王宫就在最高处——中原人把治水的汤王供在佛菩萨上面，这就是中原的厚道。&quot;\u003c/p\u003e"}, {"n": "三门峡湖滨区", "s": "三门峡湖滨区", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉元鼎四年（前113年）：始建陕州城。北魏太和十一年（487年）：改置陕州。金大定十七年（1177年）：重建宝轮寺塔。明洪武至永乐：端王扩建，城周九里一百三十步。一九五七年：三门峡水库规划，陕州城在淹没区，居民已迁移，后方案调整城未被淹。一九七〇年代：辟为陕州公园。二〇〇〇年：公布为河南省第三批省保。二〇二六年：东城墙南段本体保护项目立项。现状：城墙残垣存，宝轮寺塔、地坑院存。（T20豫西补全3县·完）。（以上为T20大批次3县正文）。（以下为T21大批次7县正文·河北南部邯郸+邢台）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e三门峡市区西、黄河边，陕州公园内那段东城墙南段，夯土残墙还贴着地面走——南北长约三公里半、东西宽约两公里，最长的一段残墙约两百米、厚三五米、高四五米。塔在城东南，金代宝轮寺塔独立于原宝轮寺基址上，塔下击掌有蛤蟆回声。塬上张汴乡北营村，地坑院一家挨一家，见树不见村。\u003c/p\u003e\u003cp class=\"main-text\"\u003e陕州故城遗址（省保第三批，2000年）：湖滨区陕州公园内，西汉元鼎四年始建，历代为州府治所，城址南北长约三公里半、东西宽约两公里，地表残存墙垣数段，最长约两百米、墙厚三至五米、残高四至六米。东城墙南段残墙贴着地面走，夯土断面层次可辨，墙根荒草里能摸到汉代夯土。；陕州地坑院（4A、国家级非遗）：张汴塬北营村，&quot;见树不见村、进村不见房&quot;的地下四合院，现存近万座，最老者住过六代人逾两百年，穿山灶九孔火路出&quot;十碗席&quot;。；虢国博物馆：市区北部，西周虢国墓地遗址博物馆。；三门峡大坝：一九六〇年建成，万里黄河第一坝。；虢国车马坑：市区北上村岭虢国博物馆保护大厅内，国君虢季一号坑南北长四十余米，十三辆车马列队殉葬，木痕马骨历历在目，梁姬、太子二坑并列。；南梁万寿宫：交口乡南梁村，明代木构道院，省保第七批，正殿梁架与石刻柱础尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宝轮寺塔（第五批国保，2001年）：陕州故城东南隅，金大定十七年重建，十三级叠涩密檐式砖塔，坐北朝南平面正方形，通高约二十六米半，周长约二十一米半。塔身以青灰条砖一顺一丁垒砌，自下而上逐层收窄，外轮廓呈流畅抛物线形。底层南门嵌石刻塔铭三圣舍利宝塔。一九二八年寺毁唯塔独存。游人立塔四周数丈击掌叩石，即闻呱呱蛤蟆式回声，为中国古代四大回音建筑中年代最早者。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（78岁，陕州故城边住了60年，当年参与1957年移民的亲历者）：\u003cbr\u003e&quot;我1957年23岁，三门峡水库说要淹陕州城，我爹带着我们全家往南边迁——那时候什么都没拿，就带了两件棉袄。迁了半年，突然说水库方案改了，陕州城不淹了！我爹领着我们又搬回来——那时候城砖已经被拆走了一半，很多房子被推倒了，我们就在废墟里捡砖重新盖房子。我家现在的房子用的砖，就是当年拆陕州城墙的砖——你看那砖上还有当年的白灰印子。现在2025年说要修城墙了——我等了60年，终于等到这一天。我每天都去城墙根儿转一圈——那残垣上的荒草里，能摸到汉代的夯土。&quot;\u003c/p\u003e"}, {"n": "驻马店·西平+遂平+正阳+泌阳+平舆+确山", "s": "驻马店", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e一九三八年：中共中央中原局驻确山竹沟镇。现状：六县古墙多已不存，但酒店冶铁炉、正阳石阙、沈国故城、竹沟旧址等国保单位尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e驻马店六县分头找实物：西平酒店村那座战国冶铁竖炉残高二米多，是天下第一剑棠溪的作坊；遂平县城西嵖岈山花岗岩盆景立在平原上；正阳东关烈士陵园里，孤零零一座东汉石阙子阙；泌阳盘古山顶盘古庙与盘古井；平舆射桥镇古城村沈国故城夯土；确山竹沟镇小李庄，中原局旧址十八排老房子还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e西平｜酒店冶铁遗址（第四批国保，1996年）：西平县酒店乡谭山水库畔，战国韩国冶铁铸剑作坊，现存战国冶铁竖炉残高二点二五米，炉壁以红褐色耐火砖与草拌泥砌成，炉身半截埋在断壁土层里，炉旁散落铁矿渣与陶范残片。为全国现存最早、结构最完整的战国冶铁炉，棠溪、墨阳等名剑皆出于此。；西平｜棠溪源国家森林公园：西平与遂平交界，战国棠溪铸剑处，嫘祖故里盘丝洞传说。；遂平｜嵖岈山（5A，2015年）：县城西，伏牛山东缘花岗岩奇石群落，一九八六版《西游记》主要外景地，山形玲珑如盆景。；遂平｜嵖岈山卫星人民公社旧址：全国第一个人民公社，一九五八年成立，现存办公楼与标语。；正阳｜正阳石阙（第七批国保，2013年）：县城东关烈士陵园南端，东汉永乐少府贾君墓前神道阙，原东西双阙今仅存东阙。通高约四米七五，十九块青石条砌成，母阙居西高约三米七五、阙身十一层石，子阙居东高约二米六、阙身八层石。单檐四阿顶，阙顶下浮雕三素枋相叠，阙身四面雕波纹、云纹、人字纹与菱纹，仿木结构清晰可辨。石质粗劣，两千年风化下来表面纹饰已漫漶模糊，全身略向北倾斜，俗称望乡台，为河南三对半汉阙中的半对。；正阳｜江国故城遗址（省保）：大林镇涂店村，周代江国都城，夯土层中夹春秋陶片。；泌阳｜盘古山景区：县城南盘古乡，主峰海拔四百五十九米，山上存盘古庙、盘古井、盘古墓、大磨等实物，农历三月初三盘古文化节。；泌阳｜焦竹园革命旧址：鄂豫边省委旧址，红色研学地。；平舆｜沈国故城（国保）：射桥镇古城村西北洪河北岸，西周周文王第十子聃季载封国都城，城址长方形东西长约一千三百五十米、南北宽约一千五百米，面积约两平方公里余。文化层厚一至五米，夯土城墙残迹断续在田野间隆起，东北城角高出地面约一米八，东、西、南三门址尚可辨认，城基城壕清晰。城墙多已扒平埋入地下，仅余高坡处一墩残土立在杨树行旁，为沈姓发源地。；平舆｜太任故里：县城内，周文王母亲太任浣纱处，二〇二二年命名&quot;河南省太任文化之乡&quot;。；确山｜中共中央中原局旧址（竹沟革命纪念馆，第三批国保，1988年）：确山县西三十公里竹沟镇，一九三八年刘少奇、李先念在此主持中原局。现存房屋一百八十二间，为清代咸丰年间豫南典型砖木民居，白灰夯土墙体、小青瓦覆顶，每三间为一单元、每四单元组成一个院落，四合院式沿延安街依次排布，窄巷连环多进合院，没有繁复雕饰朴素厚重，素有小延安之称。；确山｜薄山湖：淮河支流臻头河上水库，环湖山林。；确山｜老乐山景区：县城西南，道教名山，4A。；西平｜宝严寺塔（国保第六批）：县城东关柏城街道，北宋晚期建，仿木结构楼阁式七级六角砖塔，通高二十八点八米，塔基直径约十米。整座塔以三十七种不同规格青砖砌筑，外部砂浆勾缝，内部土坯垒砌。塔身内壁镶嵌飞天、海石榴花等浮雕花砖，线条流转。一、二层塔室四角形拱顶，设台阶式盘旋梯道；三至七层为斜直竖井梯道，各层塔心室底层方形向上渐变为六角形。檐下五铺作双抄偷心造砖雕斗拱，塔角雕饰龙首。塔顶莲花铁刹高两米余重数千斤，历经明嘉靖、清道光及建国后三次大修。；西平｜冶炉城遗址：出山镇酒店村，汉西平铁官所在。距酒店战国冶铁竖炉不远，城址夯土残段断续，地表散落汉代铁器残件与陶片。；遂平｜吴房故城（省保）：县西南文城乡文城村，春秋房国、吴房县治所。城址周长三千二百一十米，现存城垣残高一至四米，夯土层清晰，城内瓦砾遍地。；遂平｜唐岗遗址（省保）：县北新石器时代台地，含大汶口、屈家岭文化因素，地表见红陶、黑陶片与石斧石镰。；遂平｜嵖岈山红石崖抗日根据地旧址：嵖岈山主峰南麓，一九四四年新四军五师十三旅组建地，石屋残墙依山势排列，立有解释碑。；正阳｜闰楼遗址（国保）：县北商代聚落遗址，考古发掘出商代贵族墓葬群，出土青铜礼器多件，为豫南商代文化重要节点。；正阳｜黄叔度墓（省保）：县城内，东汉黄宪葬处。墓前现存大石碑两块，一为唐颜真卿所书墓碑，一为清乾隆重立碑。；正阳｜临淮城遗址（省保）：县东北，西汉临淮县故城，夯土城基在农田下，地表散见汉代绳纹瓦当。；泌阳｜下河湾冶铁遗址（国保）：县南马谷田镇，战国至汉代官营冶铁作坊，总面积约二十三万平方米。遗址区内随处可见炉壁残块、炼渣、铁块、铁矿石与陶豆陶釜板瓦筒瓦碎片，东部北部断壁上仍暴露炼铁炉六座，据推算炉址至少在百座以上。炉渣堆积层厚达数米，与西平酒店冶铁遗址同为战国秦汉时期中原冶铁中心。；泌阳｜比阳故城：县城内古城村，北魏东荆州、唐唐州故城。遗址为高出周围三至五米的长方形台地，南北长三百五十米东西宽五百六十米。；泌阳｜铜山风景区：县城东铜山乡，花岗岩峰林，山顶铜山海拔六百多米，有唐代石窟造像与摩崖。；平舆｜秀公戒师和尚塔（国保）：县东，金代砖塔，六角五级，砖雕斗拱精细，为豫南金塔代表作。；平舆｜阳城故城与魏长城遗址：阳城镇，战国魏长城（鸿沟）南段夯土残段在田埂上隆起，城址内出土战国铜戈。；平舆｜月旦亭遗址：县南沙口铺，东汉许劭许靖月旦评故地，台地尚存，立有解释碑。；平舆｜普照寺塔：县东，宋代砖塔，七级八角，塔身收分匀称。；确山｜北泉寺（省保）：县城西北七公里乐山秀山间，北齐始建已有一千四百余年，因地处三泉之北泉而得名。寺内四株隋代银杏最大一株树围七米有余，遭雷火中空内可容四人围坐，然枝叶犹茂秋实果累；两株唐代古柏分列八卦池两侧，树身斑驳挺拔苍劲。八卦池九曲池清泉自石罅流出四季不涸。寺旁颜真卿被李希烈拘禁殉难处，大雄宝殿一九九二年原址重建，每年农历二月初二庙会。；确山｜杨靖宇将军故居：李湾村，清末四合院青砖瓦房，按将军少年时旧貌复原，院内有其手植槐树。；确山｜确山农民起义指挥部旧址：县城刘店镇，一九二七年确山暴动旧址，旧门楼尚存。。\u003c/p\u003e", "c": ""}, {"n": "道口老城·运河古镇", "s": "道口", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉建安九年（204年）：曹操疏浚白沟，为卫河前身。隋大业四年（608年）：开永济渠，道口因河而兴。明：道口属浚县，旧称李家道口，天启八年设递运所。清乾隆五十二年（1787年）：张炳改良道口烧鸡配方。一九四九年：道口划归滑县。二〇一四年：隋唐大运河滑县段列入世界文化遗产。现状：原生态运河道、九码头、老街古建存，明福寺塔存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e卫河从道口镇自南而北穿镇而过，八公里原生态河道还在流——沿岸顺河南街、顺河北街、一面街，三千多米老铺面与一千多间老房子贴着河走，九座古码头的青石还在河坡上。镇南明福寺塔七层八角，塔身布满佛像。老街那家义兴张烧鸡铺，煮鸡的锅据说三百多年没断过火。\u003c/p\u003e\u003cp class=\"main-text\"\u003e道口古城墙与一面街、顺河南街、顺河北街：明清老街长约三千米，老店铺与古民居一千余间，老胡同十六条、老字号五处。；明福寺塔（国保）：县城西南隅，唐宝历二年始建，现存北宋早期砖构，八角七层楼阁式通高约四十三米，底面直径约十一米。塔基青石砌就，塔身及塔刹由七十余种不同规格灰砖砌成。第一层正面半圆拱券门，门上饰浮雕帷幔；二至七层四正面辟门，五层与七层侧面砌直棂假窗与卍字图案，檐下砖雕普柏枋与五铺作斗拱。塔身外壁砖雕佛龛内嵌佛像千余尊，千佛千面各异其姿，俗称千佛塔。原九层遭雷击坍塌至五层，民国十八年集资修至七层，塔顶改桃状。；大王庙：大运河畔明清庙宇。；欧阳书院：欧阳修读书处遗址。；义兴张烧鸡老铺：清顺治年间张家始营，乾隆五十二年（1787年）张炳改良配方，道口烧鸡至今。；同和裕老票号：清代票号旧址。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大运河滑县段（世界文化遗产，2014年）：道口镇穿镇而过，原生态古河道长八千二百四十米、宽三十至五十米，沿岸古码头九座、古水闸六处。九座古码头的青石还在河坡上，石面被货船缆绳磨出深痕。顺河南街、顺河北街、一面街三千多米老铺面贴着河走，一千余间老房子未大拆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌顺河北街老住户（72岁）：\u003cbr\u003e&quot;我这条胡同直通卫河大堤，早年河里帆樯一片，南粮北运、津货南来，码头天天卸货。现在老了，天天在胡同口看游客。&quot;\u003cbr\u003e▌烧鸡铺老师傅：\u003cbr\u003e&quot;道口烧鸡讲究&#x27;八料加老汤&#x27;，先炸后煮四五个钟头。义兴张老铺那口锅，三百来年没断过火。&quot;\u003c/p\u003e"}, {"n": "昆阳老城·叶公故里", "s": "昆阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋：楚灭应置叶邑，为楚北方重镇，沈诸梁封于此。战国：昆阳始见《战国策》。秦：置昆阳、叶阳二县。金正大三年（1226年）：建文庙。明洪武二年（1369年）：建叶县县衙。二〇〇六年：叶县县衙公布为第六批国保。现状：县衙、文庙、东城墙残基存，古城街巷格局存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e叶县老城中轴线上，明代县衙还坐北朝南——大门、仪门、卷棚、大堂一路抬升，大堂前那块跪石被犯人跪了六百年，中间凹出一个坑。县衙东边金代文庙的古柏还活着，文庙大成殿是金正大三年的原构。城外叶邑镇，叶公墓在田野上，天下叶姓认祖的地方。\u003c/p\u003e\u003cp class=\"main-text\"\u003e叶县县衙（第六批国保，2006年）：县城中心，明洪武二年建，中国现存唯一明代五品县衙，坐北朝南占地约一万七千平方米，中轴线与东西副线四十一个单元一百五十三间房。大门、仪门、卷棚、大堂一路抬升，大堂由厅堂与卷棚勾连搭，天沟罗锅椽相接，为五品县衙孤例。堂前跪石为石英沙石，犯人跪了六百年中间凹出一道裂痕，今以玻璃罩护。大堂悬明镜高悬匾，卷棚悬于右任书天地正气匾，黄庭坚书尔俸尔禄民膏民脂官箴刻石犹在，后花园六百年桂花树仍开。；叶县文庙（省保）：县衙东侧，金正大三年知县刘从益创建，明初重建。大成殿歇山式砖木结构，面阔五间进深三间，琉璃瓦覆顶，前檐青石质小八角石柱及镏金覆莲柱础，殿内明柱八根下承莲花形石柱础，保留宋金覆莲柱础、元代梁架与明代石柱各代营造特征。棂星门三门四柱，明间七踩斗拱，棂星门三字传苏轼手迹。泮池宽约二十七米，为国内现存文庙中规模最大者。院内明清碑刻二十余通，数株古柏树龄超八百年。；昆阳古城墙：明清叶县治所，周长约三千米、面积约七十五万平方米，今仅东城墙南段残存约一百七十米基址，护城河环绕一周。；明清街：县衙东侧，明清商铺建筑，明代风格一条街。；叶邑故城（叶邑镇）：春秋楚叶邑，叶公墓、明清街存，&quot;叶公好龙&quot;典故发生地，天下叶姓发源地。；岩盐资源：展布约四百平方公里，地质储量约两千三百亿吨，中原盐都。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌县衙讲解员（45岁）：\u003cbr\u003e&quot;别的县衙七品用黑漆柱子，我们是五品用青漆。大堂那块跪石让犯人跪了六百年，凹下去个坑，游客都抢着去摸。&quot;\u003cbr\u003e▌叶邑镇种田老农：\u003cbr\u003e&quot;俺们是叶公老家，叶公好龙的故事打小听。老辈说叶公本名沈诸梁，现在天南海北姓叶的都回来认祖。&quot;\u003c/p\u003e"}],PROVS={"安徽": ["东至老城", "临泉老城·沈子国", "临涣老城·铚城", "五河老城·五水汇聚", "亳州老县城·三朝古都", "休宁老城", "全椒老城·襄水环城·吴敬梓·走太平著名讽", "六安老城·皋陶故里·明代砖城墙·南北双塔", "凤台老城·州来下蔡", "凤阳·明中都", "利辛老城·文州故城·西淝河·阴阳城唐武德", "南陵老城", "合肥老城·庐州府城·教弩台·包公祠·李鸿章故居", "含山老城", "和县老城", "天长老城·千秋古县·老西门·四大古镇唐代", "太和老县城·细阳故城", "太平仙源老城", "太湖老城·晋熙", "婺源老城", "宁国老城", "安庆老城", "定远老城·东城遗址·炉桥古镇·东周古城秦", "宣州老城", "宿州老城", "宿松老城", "寿县老城·宋代城墙", "屯溪老街·黄山·活动着的清明上河图", "岳西响肠老街", "巢湖老城·巢县·居巢·卧牛山·陷巢州传说", "广德老城", "庐江老城", "当涂老城", "怀宁石牌老城", "怀远老县城·荆涂峡口", "旌德老城", "无为老城", "明光老城·女山湖沉城·旧县镇·嘉祐院女山", "望江老城", "来安老城·永阳古城·太平古城·南北四门五", "枞阳老城", "桐城老城", "歙县老城", "泗县老城·虹县故城·裁虹归泗", "泾县老城", "涡阳老城·老子故里", "淮北老城·相土筑城·隋唐运河·相山显通寺", "淮南老城·淮河老街·田家庵·舜耕山从\"老", "滁州老城·琅琊山·醉翁亭·欧阳修知滁", "潜山老城", "濉溪老城·柳孜运河·千年口子酒·临涣茶镇", "灵璧老县城·磬石之乡", "界首老城·颍滨彩陶乡", "石台老城", "砀山老县城·凤城", "祁门老城", "繁昌老城", "绩溪老城", "舒城老城", "芜湖老城", "萧县老县城", "蒙城老县城·漆园", "蚌埠老城·千里淮河第一港·津浦铁路·长淮", "谷阳老城·固镇", "贵池老城", "郎溪老城", "金
