米八依次叠压唐、宋、元、明、清五层。现存州桥为明代早期在宋代柱梁平桥桥基上改建的单孔砖券石板拱桥。桥东侧汴河南北两岸揭露北宋巨幅石雕石壁，由十六层石块密实垒砌，纹饰通高约三点三米、最长二十一点二米；每组一匹独角海马、两只仙鹤环以祥云，逆水而上，正与《东京梦华录》“近桥两岸皆石壁，雕镌海马水兽飞云之状”一句字字对应。；大梁门古马道博物馆：西门内侧，三层斜坡马道上下叠压——最上层清道光、中间道光二十年、最下层金代，砖面车辙深浅不一，最底一层被千年车马磨得圆滑发亮。台阶逐级而下，可亲手摸到三层不同时代的砖面。；中山大道：今日柏油马路，前身是宋金御街、明代周府前大街、清代南门大街，一条路十二朝，从未偏移。；铁塔（全国重点文保）：东北隅，北宋皇祐元年建的琉璃砖塔，八角十三层，高五十五米余。塔身遍嵌二十八种仿木构模制琉璃雕砖，砖面烧制飞天、降龙、麒麟、坐佛、立僧、菩萨、伎乐、狮子、宝相花等五十余种图案；砖色因铁元素千年氧化呈深褐，远望如铁铸。底层四门唯北门设梯道，绕塔心柱盘旋至顶；余三门为盲窗。九百年来历经地震、水患、战火，主体仍巍然。；繁塔（全国重点文保）：东南隅，北宋太平兴国二年建，是开封现存最老的地面建筑。现存三层，躯粗首小、状似编钟，顶上另砌一小型塔刹。塔身内外遍嵌约七千块佛像砖，一尺见方砖面中央开满月形佛龛，一砖一佛，共菩萨、罗汉、乐伎、行脚僧等一百零八种形象；宋砖为模印后再以细刀修刻，明修补砖上还刻有“周府吴”字样。二层塔心室前壁列二十名乐伎，各持十三种共二十件乐器。；山陕甘会馆（全国重点文保）：徐达府旧址上，清乾隆四十一年建，照壁、木雕、砖雕堪称一绝。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌考古队员小李（28岁·河南省考古研究院）：\u003cbr\u003e&quot;挖到地下4.5米时碰到巨大青石桥基，大家都兴奋坏了——《东京梦华录》里的州桥！往下清出长17米宽30米的明代桥面，再往下是宋代原建桥基，最底层还能摸到唐代最初建桥的石料。一座桥，四层遗存……这不是挖宝，是在翻一本立体的开封史。&quot;\u003cbr\u003e▌老开封人王大爷（72岁·家住中山大道南段）：\u003cbr\u003e&quot;我小时候常听老人说&#x27;开封城城摞城&#x27;，以为是瞎编的。直到大梁门那挖出三层马道，州桥又挖出五层来……原来我脚下这块柏油路，底下真的压着宋朝人走的路！这中山路啊，一千多年没挪过窝——宋朝皇帝去大内走这条路，明朝周王爷去午门走这条路，清朝考生去贡院还是走这条路，现在我去买菜还是这条路。&quot;\u003c/p\u003e"}, {"n": "周口周家口老城·三寨夹河豫东小武汉", "s": "周口", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e明永乐年间三川交汇口形成渡口，称周家口。清康熙间漕运兴盛，码头林立。清咸丰八年（1858）绅商统筑寨墙，三寨格局形成。清末民初漕运渐衰。2023年启动南寨历史文化街区保护更新。2026年2月南寨正式开街，入选河南省历史文化街区。现状：南寨存十一条老巷、十八处历史建筑、六座复建古码头。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沙、颍、贾鲁三条河在这碰头，把城分成三块陆地——清末绅商沿三块地各筑一圈寨墙，南寨、北寨、西寨夹河对峙。北寨西寨早散成地名，只有南寨那条红石板巷还卧在沙颍河南岸，赭色条石被脚磨得发亮。2026年初这条街刚重新开街。\u003c/p\u003e\u003cp class=\"main-text\"\u003e红石板巷：南寨老街肌理最完整的一段，赭色条石铺路，年久被脚磨得油亮，石缝间长青苔。两侧青砖小院沿巷排开，门楼上新换的雕花与老墙的斑驳并置。二零二六年二月南寨正式开街，入选河南省历史文化街区。；李家当铺院（市级文保）：南寨一座北方四合院，按原材料、原工艺、原形制修缮，院内展陈老纺车、青石磨、漕运旧船等中原百工老物件。；白彦章故居（市级文保）：清末民初硬山灰瓦院落，是周口最早的西医医院同仁医院旧址。；周口皮件厂旧址：建国初苏式红砖厂房与烟囱，今改文创园。；三川交汇处：沙河、颍河、贾鲁河汇流处，今复建大渡口等六座古码头。；周口关帝庙（山陕会馆，第四批国保，四A）：沙颍河北岸、贾鲁河东岸，坐北面南，清康熙三十二年山西陕西商人集资始建、历百余年方成，现存楼廊殿阁一百四十余间。山门雍正十三年建，单檐歇山覆绿琉璃瓦，五彩斗拱朱漆大门。山门前一对铁旗杆，嘉庆二年陕西同州府大荔、朝邑、澄城天平会众商敬献，高二十二米、重三万余斤；六角青石浮雕基座，上承六角须弥式铸铁座，杆身分五节浇铸，身饰蟠龙、飞凤、万字、寿字、钱币，顶端透空匾牌铸“大义”“参天”四字。匠人徐福长以“分节屯土”法浇铸。大殿、戏楼、拜殿、春秋阁沿一线排开，春秋阁孔雀蓝琉璃瓦两层楼阁，内供关公夜读《春秋》像。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南寨古寨墙残段：沙颍河南岸老居民区里，包砖早已拆走，只剩黄土夯筑的残段，隐在民房之间。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老周口张师傅（68岁·退休码头工人）：\u003cbr\u003e&quot;以前南寨北寨西寨各占一块地儿，沙颍河中间一划，就像三个岛。码头那时候热闹啊——粮船、棉船、盐船，桅杆戳天，夜里灯笼一串串从码头挂到街里。后来漕运衰了，寨墙也拆了砖修房子了……现在大渡口又建起来了，我去看过，修得跟以前差不多，就是船没了。&quot;\u003cbr\u003e▌洪玲娣（28岁·商水姑娘·汉服店老板）：\u003cbr\u003e&quot;我是商水人，去年年底在南寨租了门面做汉服租赁写真。以前来这里的时候，巷子破破烂烂的，红石板上长着青苔，院子里住了好多老人，电线蜘蛛网似的。现在修好了，老墙保留了，木门窗换了新的雕花，一到节日游客多得推不开门。&quot;\u003c/p\u003e"}, {"n": "太康老城·夏王封地谢氏故里", "s": "太康", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦置阳夏县。隋开皇七年（587）改阳夏为太康县。元至正二年（1342）建土城。明宣德元年（1426）建文庙。明崇祯九年（1636）改土城为砖城。崇祯十五年文庙毁于兵燹，清顺治五年重建。近代砖城拆除。2024年刘庄遗址发现夏代早期城墙。现状：文庙大成殿、拜殿完整，太康陵为市保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e县城黉学里，那座大成殿一抬头就是绿琉璃瓦——豫东县城文庙少见的规格，正脊上两条琉璃龙盘着珠子，四角挑得比别处都翘。城东南王陵村，夏王太康那座封土冢还蹲在麦地里。乡下刘庄，2024年新挖出一段夏代早期夯土城墙。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太康文庙大成殿（全国重点文保）：县城黉学，清顺治五年重建，面阔七间二十二点六五米、进深五间十四米、高十点五米，建在一米高的台基上。单檐歇山顶覆绿色琉璃瓦，正脊为琉璃烧制的二龙戏珠、人物、宝瓶、彩珠、象轮与花卉，两端置大吻，垂脊、戗脊上蹲琉璃狮狗小兽。檐下四周施五彩重昂斗拱，普柏枋与栏额上龙凤花卉镂空雕饰。殿前月台前台阶正中嵌一块卧龙陛石。前坡做两断式加深，四角高挑，带南方韵味，中原少见。；文庙拜殿：大成殿前，面阔五间，灰筒瓦歇山，斗拱彩绘尚存。；刘庄遗址夏代城墙：2024年新发现，四道夯土墙围成圆角小城，南墙留一门缺口，城内十六座房址成排，碳十四测年入夏代早期。；太康陵（市级文保）：县城东南二里王陵村，一座封土大冢，传为夏王太康葬处。；谢安故里（老冢镇谢堂村）：东晋谢氏祖居地，近年辟为文化园区。；高贤寿圣寺塔（国保第七批）：城西北二十三公里高贤集东街，明正德十三年重建，六角实心七级楼阁式砖塔，通高二十八点三米，上承宝珠塔刹。第一级每面宽三点八米，南壁一至六层辟圭形真门，各层檐下施青砖仿木五踩斗拱。塔身共嵌石雕佛像二百一十一尊、石碣十四块。寺废塔存，塔体略向东北倾斜。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌太康退休教师刘先生（65岁·文庙义务讲解员）：\u003cbr\u003e&quot;我小时候文庙还有泮池棂星门戟门崇圣祠，从南到北一排全的。文革时候拆了好多，棂星门拆了搭戏台用。现在就剩大成殿和拜殿了，但那大成殿真牛——绿色琉璃瓦，正脊上二龙戏珠，那挑角比别的地方文庙都大，听老师说那是南方风格，中原少见。每年祭孔大典33个步骤，不能错一点——我背得滚瓜烂熟。&quot;\u003cbr\u003e▌考古队员小李（29岁·河南省考古研究院·刘庄遗址）：\u003cbr\u003e&quot;碳十四测年出来的时候我们全组都炸了——公元前1964年！正好卡在夏代早期纪年里！这城址才东西126米南北100米，小归小，但是夏代早期的夯土城墙啊！四道城墙有南门缺口，城内16座房子一排一排的……豫东这地方，真的是藏龙卧虎，随便挖挖就能改写历史。&quot;\u003c/p\u003e"}, {"n": "扶沟老城·桐丘程门·大程书院", "s": "扶沟", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为郑国桐丘邑。西汉置扶沟县，治崔桥镇。隋大业十四年（618）县治迁桐丘（今县城）。北宋熙宁八年（1075）程颢任扶沟知县，开书院讲学。明洪武三年（1370）建土城。明正德五年（1510）包砖。1948年拆除城墙修公路。现状：大程书院为第八批国保，固城城墙省保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e县城书院街闹市中，一座四进青砖院落静卧——大程书院，程颢当年讲学处，立雪讲堂还在原地，是中国北方保存最完整的古书院之一。城西南十八公里固城村，一段春秋夯土城墙斜卧田埂上，1974年挖石灰池还从墙根挖出过一篮楚国金币。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大程书院（全国重点文保）：县城书院街，北宋程颢任扶沟知县时创建，现存清代四进院落。南北长七十三点六五米、东西宽三十九点九米，总面积近三千平方米。大门三间，门内古槐一棵；龙门三间，门前古松两株；再进立雪讲堂三间；东西文场各两排、每排十三间，共五十二间考棚。青石台阶、朱漆大门、高柱重梁、青砖灰瓦、重檐叠脊，是中国北方保存最完整的古书院之一，二零一九年列第八批国保。；固城春秋古城墙（省级文保）：县城西南固城乡固城村，一段不规则长方形夯土城垣，西南角保存最好，残高近八米。夯层与圆形夯窝清晰可辨，墙根还出土地下排水陶管。一九七四年村民挖石灰池，从墙根挖出二十余斤楚国金币，用篮子满满装了一篮。城墙南角今已长树。；扶沟西汉故城（崔桥镇古城村）：断续夯土城垣尚存，地表散落汉瓦陶罐片。；吉鸿昌故居（吕潭镇）：清代院落，抗日名将吉鸿昌出生地。；支亭寺（支亭遗址，省保一九八六年）：县城西南十八里柴岗乡，北齐始建的千年古寺。殿宇历劫，今存一株汉槐与一座清康熙年间所建阎王殿，寺周即仰韶文化台地，每年农历四月庙会乡人仍聚。；雾烟山天井泉：韭园镇，传老子西行讲道头一站。山上平地冒出一眼常年不涸的泉，乡人呼天井泉，庙观为近年重修，唯泉水旧脉未断。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌固城乡村民老孙（72岁·固城村土生土长）：\u003cbr\u003e&quot;1974年我还没下地干活呢，就听人说固北大队挖石灰池挖出了金子！那22斤楚金币啊，用篮子装了满满一篮，金光闪闪的。我跑过去看，城墙根下挖了个坑，底下还是城墙夯土。后来考古队来了，说这城\u003cstrong class=\"hl\"\u003e春秋就有了\u003c/strong\u003e，比桐丘城还早……这城墙我小时候常爬，南边那角还能上去，现在长树了。&quot;\u003cbr\u003e▌扶沟退休教师张老师（68岁·大程书院义务讲解）：\u003cbr\u003e&quot;程颢在扶沟只待了三年，可是这三年把整个扶沟的文风都转过来了。大程书院立雪讲堂，现在还在那里，青砖长房，当年弟子们就在那读书。你说奇怪不奇怪，程门立雪的故事，杨时游酢在程颢那也立过——真事发生在洛阳，但扶沟人说，程颢在这讲学的三年，杨时也来过……这不管真假吧，书院立在这，文脉就没断。&quot;\u003c/p\u003e"}, {"n": "西华老城·娲城女娲·逍遥胡辣汤", "s": "西华", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋为女娲城（娲皇故城）。秦置长平县，西汉分长平、西华两县。唐武德八年（625）为箕城县治。明洪武间重建县城，夯土包砖。1938年花园口决口，全境没于黄水。1986年女娲城址公布为省级文保。1994年民众重修女娲陵景区。现状：明城墙已拆，女娲城夯土残段尚存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e城北十公里思都岗村，一片方形夯土城圈卧在平原上——春秋女娲城，外郭内城两层，残墙最高处还能站人。城里女娲陵那座土丘前香火常年不断，农历三月庙会车从许昌漯河一路排过来。县城里明伦堂还守着文庙旧基。\u003c/p\u003e\u003cp class=\"main-text\"\u003e女娲城遗址（省级文保）：县城北聂堆镇思都岗村西北，一座方形内外两层城圈。外郭城墙每边长约一千米、周长四千米，内城每边三百六十米、周长一千四百四十米。今残存城墙最高处约三米、宽约八米，护城壕轮廓清晰，基底宽六米、上部宽十五米。城墙分层夯筑，每层厚十至二十厘米，圆形平底夯窝直径约五厘米，手按上去能摸到一层层土的接缝。城内出过春秋陶鬲陶罐。；女娲陵：思都岗村遗址旁，一座封土陵丘，1938年黄水淤没后乡民清淤重修，常年香火，农历三月庙会香客数万。；明伦堂（省级文保）：县城内西华文庙主建筑，青砖灰瓦硬山，面阔数间，棂星门尚存。殿前原泮池、戟门今已不存，唯明伦堂与两株老柏仍守文庙旧基。；逍遥镇：县城西二十五公里，胡辣汤发源地，镇上早市胡椒香飘满街。；龙泉寺（县保）：县城北十公里聂堆镇思都岗村，西距女娲城仅五百米。汉建明清重修，大殿面阔五间，殿廊木柱下古雕石墩犹存，殿前立明万历年间古碑两通，寺门&quot;龙泉寺&quot;匾为明代石刻原物，豫东少见的原貌古寺。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e箕子读书台（省保）：县城西北隅百亩湖心。旧台明代所建、一九八〇年风化塌毁，二〇〇〇年于原址重建，台以青石铺就呈方形，台上箕子亭青砖灰瓦，孤零零立在水面中央。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌思都岗村王老汉（78岁·女娲陵守墓人后代）：\u003cbr\u003e&quot;我爹说1938年黄水漫过来的时候，女娲陵被淤了大半，就剩个土尖尖露着。后来水退了，村里人扛着锄头铁锹，挖了半个月才把陵挖出来……现在的陵是清淤后重修的。每年三月庙会，从许昌漯河郑州来的人一车子一车子的，我守陵一辈子了，就信这——女娲娘娘在这住过，这是咱老李家老王家的根。&quot;\u003cbr\u003e▌西华中学退休教师李老师（65岁·文史爱好者）：\u003cbr\u003e&quot;西华城下面压着好几层呢——最底下是春秋女娲城，上面是汉长平县，再上面是唐箕城县，最上面才是明洪武间建的砖城。可惜明城墙建国后全拆了，护城河也淤了。现在县城中心立着个铁铸女娲像，旁边建了女娲文化广场，算是把根找回来了。&quot;\u003c/p\u003e"}, {"n": "商水老城·阳城扶苏·叶氏庄园", "s": "商水", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国为楚阳城邑。秦置阳城县。隋开皇十六年（596）置溵水县，北宋建隆元年改商水。明崇祯九年（1636）改筑砖城。清咸丰八年（1858）叶氏始建庄园，历五十余年落成。2013年叶氏庄园公布为第七批全国重点文保。现状：砖城已拆，扶苏城残墙可辨，叶氏庄园完整。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e县城西南邓城镇，一片青灰色清代大院卧在沙颍河边——叶氏庄园，走马门楼、五尺高石狮子、四角炮楼围出一座寨堡。舒庄乡扶苏村田地里，一截战国夯土墙高出麦田，那是陈胜故里的阳城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e扶苏城（阳城故城，全国重点文保）：舒庄乡扶苏村，战国长方形内外两城。外城东北角夯土墙残段仍高出麦田一截，夯土硬得锄头刨不动；内城俗称“金銮殿”。城内曾出土“扶苏司工”陶片。；阳城故址：扶苏寺村一带，战国楚边邑。；寿圣寺塔（国保二〇〇六年）：郝岗镇，北宋六棱锥形砖塔，自底至顶均匀收分，塔顶铸铁铸成葫芦形宝顶，一九八六年列省保、二〇〇六年升国保。；邓城许村白果树（汉）：邓城镇许村西南，一株汉代老银杏，半枯半荣，虬枝横斜，相传就在刘秀饮马台旁。；刘秀饮马台：邓城镇沙颍河边，传东汉光武帝刘秀屯兵饮马处，夯土台基高出河滩，台侧引水旧渠尚存。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e叶氏庄园（全国重点文保）：邓城镇，清咸丰八年叶氏数代营建的寨堡式庄园，原占地二百七十亩，四角炮楼、寨河环绕。文革间拆去四角炮楼，原二百六十六间今存九十九间；一号院三进完整保留，二号、三号院仅存局部。整组建筑为北方典型青砖灰瓦硬山四合院，走马门楼前一对大石狮子，门柱彩雕青蛙戏荷，砖雕、木雕、石雕三绝遍布门窗柱础。一九六六年八月，一幅价值连城的木雕被两汽车红卫兵翻房越脊五分钟砸毁，断痕今仍清晰可见。庄园东邻汉代白果树与刘秀饮马台。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌叶氏后裔叶国玺（75岁·邓城镇）：\u003cbr\u003e&quot;我祖上叶绍颐是明末从山西洪洞迁来的，开饭店起家——这听着不像啊，但老辈传下来就是。后来漕运通了，周家口那时候属商水，我家靠码头盐粮买卖发了，从清咸丰八年开始建宅子，建了五十多年！270亩啊，四角炮楼，护城河，东中西三组院落每组三进院……文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军1976年来了一趟，不让再拆，才保住。&quot;\u003cbr\u003e▌后陈村村民王振行（62岁·扶苏村村支书）：\u003cbr\u003e&quot;陈胜就是从我们后陈村出去的！扶苏城是他诈称扶苏后筑的——你看那外城残墙，在村东边那片田地里，一长段土坡坡，夯土硬得很，用锄头刨都刨不动。挖出的陶片上有&#x27;扶苏司工&#x27;四个字，考古队说是陈胜造的。陈胜吴广起义，那可是中国第一次农民大起义！我小时候上学，老师就在课堂上讲，说咱村出了个揭竿而起的人。&quot;\u003c/p\u003e"}, {"n": "项城老城·三迁城址·袁寨故居", "s": "项城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周封项子国。春秋为顿子国（南顿）。汉置项县。东魏天平二年（535）侨置秣陵县。明宣德三年（1428）县治迁秣陵镇。清咸丰七年（1857）袁甲三购明代石氏庄园改建袁寨。1953年县治迁水寨镇。2013年袁寨古民居、南顿故城公布为第七批全国重点文保。现状：南顿三层夯土墙、袁寨三组院落并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e项城老城搬过三次家——槐坊店、秣陵镇、水寨。城南袁寨村，一座七米高的砖砌方寨卧在三道寨河里，那是袁世凯出生的地方。西南方南顿镇，一段商代夯土城墙还立在庄稼地边，地下一层压着一层，商、周、秦三代土色清清楚楚。\u003c/p\u003e\u003cp class=\"main-text\"\u003e袁寨古民居（全国重点文保）：王明口镇袁寨村，清咸丰七年袁甲三购明代石氏庄园改建的防御寨堡。原占地二百七十亩，各式建筑二百四十八间，寨墙周长一千八百米、高十余米，六座炮楼、三道寨河环绕，门外吊桥高悬。今寨墙已残，吊桥改石桥，现存东、中、西三组院落几十间青砖灰瓦房舍。一八五九年袁世凯出生在中院腰楼西间，那间房不大，今仍原样保留。；南顿故城（全国重点文保）：南顿镇，北城墙残段长二百一十六米、宽三十米、高五米，东西走向卧在庄稼地边，墙上长满杂树。墙体一刀切开三层——下层商代、中层东西周、上层秦代，夯窝密密麻麻如牛蹄印。残段北墙外即光武台，东西长二百七十米、南北宽二百四十五米，台上现存光武庙大殿与人祖殿；庙旁一口俗称“扳倒井”，井台石圈犹在。；莲溪书院（老项城）：秣陵镇，清代院落在，匾额尚存。；袁世凯行宫（省保二〇〇〇年，今项城市博物馆）：市区西大街，清光绪三十三年始建、一九一七年落成，坐西向东。今存中轴院落中后两节天井院、楼房八座三十六间，清代宫廷式木构，雕梁花窗完整。；高寺遗址（省保·一九六三年首批）：高寺镇一处高台地，自下而上叠压裴李岗、龙山、夏、商、周、秦汉文化层，耕层下陶片灰坑历历。；南顿光武庙与扳倒井：南顿故城北侧，传刘秀少时随父任所处。光武台、光武庙近年重修，庙旁一口俗称扳倒井，井台石圈犹在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌袁寨村老周（68岁·袁氏后裔邻居）：\u003cbr\u003e&quot;袁寨那房子结实，一百多年了还立着。我小时候常钻寨墙根底下玩，那寨墙是砖砌的，外面三道寨河，四角炮楼——你说厉害不厉害？袁世凯出生在中院腰楼西间，我去看过那间房，不大。文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军说&#x27;这房子不能拆&#x27;，才保住。&quot;\u003cbr\u003e▌南顿镇刘大爷（80岁·城墙根下长大）：\u003cbr\u003e&quot;那城墙是商代的！三层啊——底下是商朝的土，中间是周朝的，上面是秦朝的——考古队挖的时候我在旁边看了好几天。城墙上夯窝密密麻麻，像牛蹄子印似的。我小时候常爬到城墙上玩，现在城周围都是庄稼地，只有东北角那一段土坡还像样子。刘秀小时候跟着他爹刘钦在南顿当县令，王莽追他他躲在八角井里——那井现在还在。&quot;\u003c/p\u003e"}, {"n": "沈丘老城·三迁城址·槐店古项", "s": "沈丘", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周初聃季载封沈子国，都今临泉古城子。隋开皇三年（583）置沈丘县。明弘治十年（1497）复置沈丘县，治乳香台。正德二年（1507）砖包城墙。后县治迁槐店。现状：乳香台台地尚存，槐店石板街、清真古寺并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e沈丘老城搬过三次——最早在安徽临泉古城子（沈子国），明弘治迁到乳香台，民国后又落到槐店。老城镇徐营村东北，乳香台那座黄土台地高出汾泉河湾，龙山灰坑还埋在土里。槐店东关，元代那座老寺改成的清真古寺还在，大礼拜殿木柱两人合抱。\u003c/p\u003e\u003cp class=\"main-text\"\u003e乳香台遗址：老城镇徐营村东北，汾泉河北岸一处高出平地的黄土台地，现存南北约七十米、东西约六十米。一九八七年在此发掘出龙山文化灰坑，台上旧有乳香台寺，今仅余台地。；沈子国遗址（在今安徽临泉古城子）：长方形高台地，西周沈子国都，夯土城垣残高一至二米，台上一株千年银杏虬枝参天。；槐店石板街与大胡同：今沈丘县城，沙河、谷河、蔡河三川交汇处。东关老巷青砖灰瓦尚存，几块红石板仍在原处，是老住户跳房子的地方。槐店文狮子为国家级非遗，每年庙会仍跳。；清真古寺（省级文保）：槐店东关清真寺街，元至元十年由西征来华的波斯人阿力始建，原名至元寺，明弘治十五年移建今址。寺院坐西朝东，占地四千三百余平方米，牌坊式山门、火墙叠檐。现存二进三院，由寺门、过殿、前殿、大殿、讲经堂、开经堂、女拜殿及附属建筑组成。寺门面阔三间、进深一间，前后廊单檐硬山。大礼拜殿木柱粗壮，两人方可合抱；寺内古碑十余通。；李鸣钟故居（省保二〇〇〇年，三A）：槐店长安街路北，一九三六年西北军将领李鸣钟所建仿清式四合院，河北涿县工匠刘乐亭主持，几进院落坐北朝南尚存，今辟爱国主义教育点。；冢子湖遗址（省保一九八七年）：县境一处新石器时代至周的高台地，灰坑层层，地表散落陶片。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临泉古城子刘大爷（82岁·沈子国遗址守树人）：\u003cbr\u003e&quot;这棵银杏树是周朝的！我爷爷说他爷爷那辈儿就这么粗——要三个人才能合抱。旁边那土台台就是沈子国的城墙根了，夯土硬得很。1985年挖商代墓的时候我去看热闹，挖出了好多铜器——爵、觚、剑……亮闪闪的。这地方水好风好，沈子国选这儿建都没错。&quot;\u003cbr\u003e▌槐店老陈（70岁·回族镇老户）：\u003cbr\u003e&quot;槐店这地方三川交汇啊，沙河、谷河、蔡河在这儿碰面，船多得很，老早以前就热闹。石板街那几块红石板还在，我小时候在上面跳房子。大胡同两边的房子还是老样子，青砖灰瓦。清真古寺那座老礼拜殿，木柱都要两人合抱——听我爹说那是明初建的。槐店文狮子，国家级非遗，每年庙会都要跳。&quot;\u003c/p\u003e"}, {"n": "郸城老城·老子丹成·宁平故城", "s": "郸城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e相传帝喾、商汤先后都亳于此。西汉置宁平县。东汉封刘伯姬为宁平长公主。西晋永嘉五年（311）宁平城毁于石勒追歼晋军。隋设郸县，后废。1952年设郸城县。现状：宁平故城夯土残段、公主墓、汲黯墓并存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e县城西南宁平镇，一圈夯土残墙围着旧日的宁平城——商朝前期亳都、汉代宁平县都在这圈墙里。城外双楼乡，两座覆斗形封土堆并立，是光武帝妹妹宁平长公主刘伯姬的墓。西边汲冢镇，汲黯那座孤冢还蹲在麦田路口。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宁平故城（省级文保）：宁平镇，故城原东西长六百二十米、南北长六百一十二米，城墙外寨海子（护城河）轮廓可辨。一九四九年建政，城砖被扒去建宁平粮库，一块顶现在两块大；今仅余夯土残段斜卧田边，夯层可辨。；宁平长公主墓（市级文保）：双楼乡，两座覆斗形夯土封土堆并立，前祭殿后墓室，砖砌墓道相通，传为东汉光武帝妹刘伯姬葬处。；汲黯墓（省级文保）：西境汲冢镇，一座不高的土冢，高不过五米。墓前省保石碑立在路口，碑面经风化字迹已淡，传为西汉名臣汲黯葬处。；段寨遗址（第七批国保·二〇一三年）：城南五公里巴集乡段寨村，早期大汶口、中晚期龙山文化高台地，出土大量陶器，灰土层层下到。；王子庄遗址（王子升仙台，市保）：宁平镇，传王子晋升仙处，一座夯土高台兀立田边。；洺河老君庙与炼丹炉遗址：县城西洺河北岸，传老子在此&quot;丹成&quot;，今存小庙一间与炉址夯土，临河而立。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宁平镇老艺人王大爷（85岁·城墙记忆）：\u003cbr\u003e&quot;我爹是1948年建政那年在宁平粮库干活的，他说粮库那青砖全是从城墙上扒下来的——那砖真大，一块顶现在两块。城墙我小时候还见过，大寨墙厚9米多，上面还有小寨墙，四角有碉堡圆形的能藏人。每面城墙上有两眼大铁炮，炮筒粗得像高压线杆，装上药能打二三里远。四门都是外门内门，进去像钻隧道——我爬过门楼，上面摆着门神牌位。&quot;\u003cbr\u003e▌郸城退休干部小李（60岁·文史爱好者）：\u003cbr\u003e&quot;郸城这县名太有意思了——老子在洺河边炼丹，丹成了，叫&#x27;丹成&#x27;，谐音&#x27;郸城&#x27;。传说老子原来在鹿邑那练，后来嫌苦，跑到洺河边——&#x27;汲洺河之水，拔苇为薪&#x27;，一举成功。宁平故城更了不得了，商朝前期都城就在这儿，二百年啊！成汤迁过来的，五帝帝喾也在这儿定都。可惜城墙拆了，大青砖建粮库了，只剩夯土残段了。&quot;\u003c/p\u003e"}, {"n": "宁陵·吕坤故里的修城传奇", "s": "宁陵", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e金大定二十二年（1182）县治迁今汴河堤南古城。明初城周四里余。明成化间割城南之半改筑。明万历二十九年（1601）吕坤倡修砖城，城周六里余。崇祯十五年（1642）李自成军克城拆墙。1956年城墙拆尽。近年复建钟祥门、延和门，整治四湖。现状：城门复建，老城四湖成公园。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e老县城四湖之间，钟祥门、延和门是这几年新复建的——清代城墙早在上世纪五十年代拆光了，机关学校拉砖回家。真正留到今天的，是吕坤写在县志里那封《修城书》，两千字，句句讲怎么把城墙修结实。城外逻岗镇的地名还叫着李自成留下的音。\u003c/p\u003e\u003cp class=\"main-text\"\u003e复建钟祥门（北门）与延和门（东门）：老城区葛天文化城内，近年按明城原方位复建的两座城门，青砖砌筑，临四湖而立。；吕坤《修城书》：存于清光绪《宁陵县志》，明万历二十九年吕坤辞官回乡倡导修城所撰，力主三年之劳为千年之计，是传世罕见的明代民间修城文献。；逻岗镇：县城西，本名涝岗，传为明末李自成军巡逻驻此改今名，当地人至今仍读涝音。；吕坤墓（市保二〇〇一年）：阳驿乡吕坟村西北三百米，北依大沙河。墓以青砖砌就、上覆圆形土丘，周长三十米、高约三米，墓前立石碑、石条几、石桌石凳、石蜡台，整个陵园呈南北向长方形。史载原周围柏树数百亩、墓区占地五百四十亩，今松柏已成行。二零零六年按明神宗敕修规模恢复原貌。；葛城遗址（葛伯国遗址，夏代·市保）：县境，上古葛伯国城址。夯土台地在麦田里隆起，地表偶见夏商陶片，是汤始征葛的故地。；元代清真寺与己吾城：县城内元代清真寺存；黄岗镇己吾城传为曹操起兵处，夯土残段犹存于村边。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（70岁，宁陵中学退休语文教师，吕坤研究爱好者）：\u003cbr\u003e&quot;我家在县城东大街，小时候见过城墙残段——夯土的，上面长着酸枣树。58年大跃进那会儿，机关上带头扒砖，老百姓跟着扒，一夜之间砖城墙就没了。后来我在县志里翻到吕坤的《修城书》，那是他花了好几年才写成的，2000多字，句句恳切。现在复建城门，算是还了老吕一个愿。&quot;\u003cbr\u003e▌刘大嫂（55岁，逻岗镇开了20年农资店）：\u003cbr\u003e&quot;我爹说逻岗原来叫涝岗，李自成巡逻的部队来过后才改的。其实我们当地人一直叫涝岗，书面上写逻岗。镇西那沙河岸边，还有个土台子，老辈说那是当年李自成的瞭望哨。&quot;\u003c/p\u003e"}, {"n": "虞城利民·古虞国杜康酿酒的城", "s": "利民", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e舜时 舜子商均封此建古虞国，少康（杜康）避难于此发明秫酒，后中兴夏朝。秦汉 置虞县，属砀郡。明弘治九年（1496）选建新城即今利民老城，筑土城，开四门：东宾阳、南薰风、北拱辰、西望汴。嘉靖十年（1531）县治迁此。崇祯八年（1635）县人范良彦、杨春育捐资改土城为砖城。清康熙三十年（1691）、雍正八年（1730）、乾隆二十六年（1761）、咸丰八年（1858）四次修缮。光绪二十七年（1901）城墙倒塌过甚，官绅商民捐资大修。建国后城墙城门渐拆。1954年谷熟、虞城两县合并，县城迁马牧集（今虞城县城），此地改称利民镇。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到利民镇，最先看见的是一圈比镇子还大的水面——两千多亩护城湖把老城整个抱在当中，湖外又有一道五六里长的护城堤圈着。城里四条大街斜交于正中的大隅首，拼出一个卍字；西南城外一里，是舜子商均的大墓冢。\u003c/p\u003e\u003cp class=\"main-text\"\u003e护城四湖（四城湖）：老城四周水面分东南西北四片，以四门为界，明弘治年间筑城取土挖成，今水还清，绕镇一周，人称四分水一分城。湖心还留着观音阁、泰山庙、歇马亭的旧基，岸边老住户冬日仍在冰上行走；2017年起清淤搬迁住户，复为3A景区水面。；护城堤：圈在湖外的一圈黄土长堤，约五六里、高出水面两人多，堤上原有鲁班庙、火神庙、山西会馆，今多不存，残碑偶见。；商均墓：老城西南商墓村后，覆斗形封土残高约四米、周长百十米，占地约九百六十平方米。清康熙四十一年知县程本节曾立碑二通，雍正十年又建社稷商均坛，1942年春曾遭日军盗掘，墓冢受损而主体未平。今祠宇碑石多已不存，仅余大冢与四周古木，村人仍称商堌堆。；利民城隍庙：镇中，明万历年间本县人刑部尚书杨东明倡建，与老虞城砖城同期落成，崇祯邑御史范良彦、清顺治佥宪杨春育相继重修，乾隆七年知县蒋光祖又添戏楼、醮房。今正殿仍保留明代原貌，硬山灰瓦，梁架未动；庙院三开大门，中间三间供人出入，两边各一小门，门内原有泥塑马一对，雕塑精细。；杨东明墓：镇郊，明刑部尚书杨东明（号晋庵，豫地理学家）归葬处。旧有石人石马牌坊，今存一座古墓冢与几通残碑。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卍字街与大隅首：城内四街斜交成卍字格，中心大隅首至今未动；早年拆城，三十来斤重的黑青老城砖被各家搬去砌墙盖屋。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，利民镇南街老木匠，曾用城砖盖过厨房）：\u003cbr\u003e&quot;我家厨房西墙全是老城砖——30斤一块，黑青色的，比现在砖宽一倍。那时候城墙拆，家家户户都去抬。我爹跟我说，城砖缝里抠出过铜钱和瓷片子。护城河的水现在还清，我年轻时候冬天在冰上打炮楼子（一种游戏）。&quot;\u003cbr\u003e▌孙会计（58岁，利民镇文化站干事）：\u003cbr\u003e&quot;现在护城堤还在，上面的庙大部分毁了，山西会馆的残碑我前些年见过，在南关那菜园子边上。2200亩护城河抱城——&#x27;四分水一分城&#x27;，这套格局在全国县城里真不多。河南其他地方都是城在水里，利民是水在城外。&quot;\u003c/p\u003e"}, {"n": "民权老城·民国最年轻的县城", "s": "民权", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e清末 李坝集为黄河渡口。清嘉庆年间黄河漫溢，土不能筑墙，村民编篱笆围之，又名篱笆集。1928年冯玉祥批准设民权县，首任县长孙巍在李坝集筑土城，北枕黄河故道大堤为北墙，不设北门，仅东、南、西三门，名中山门、平等门、博爱门。1930年中原大战，李坝集激战三月。1935年大火延烧西半城。1946至1948年历经战乱，城墙毁于兵燹。1948年县治迁田庄车站（今民权县城），李坝集改称老城村。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e李坝集早就不是县城了。可站在村里，北边那道高峻宽阔的黄河故道大堤就是当年的北城墙；村中东门、西门、南门的地名还能指出当年三门的位置。一座1928年才修的土城，墙平了，骨架靠地名留了下来。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城村四门地名：村中仍呼东门、西门、南门，旧三门位置至今可循，此城当年不设北门。；黄河故道南大堤：村北一道高大宽阔的老堤，当年直接兼作北城墙，堤身至今隆起。；县政府遗址：原关帝庙改的县政府，大殿三间、东西廊房各六间，今为双语幼儿园所占。；四眼旧井：城东南、西南、东北、西北四角各一井，井口约两米，上立田字木架。；白云禅寺（省保一九八六年）：县城西南二十公里白云寺镇白云寺村，唐贞观元年始建，今院落实测东西一百四十九米、南北一百三十八米约两万多平方米，沿中轴韦驮殿、大雄宝殿、罗汉殿、千佛阁、佛定塔依次排开。罗汉殿面阔五间，单檐悬山灰板瓦间黄琉璃瓦顶，殿前有月台，东西厢房硬山灰瓦，门下立汉白玉石狮门枕一对。寺内铁锅槐长在明代施粥铁锅中，锅口径两米半、腹深一米半，树根透过锅底裂缝扎入土中，树围两米四、高四米，枝叶仍茂；韦驮殿内悬明铸大铁钟一口，重约七百五十公斤。；庄周墓（省保）：老颜集乡唐庄村东，圆形土冢，原高仅两米、周十米，黄泛淤平后重修，今冢高约九米、周近九十米，墓园占地四十余亩，前有牌坊、石拱旱桥、东西厢房。清乾隆五十四年立庄周之墓碑一通，碑高约一米八、宽不足一米六，阳刻正楷四字，碑阴密密麻麻刻着州县官员至黎民三百二十六名立碑人姓名；碑上罩红漆八角亭，亭后碑林百余通。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌徐金堂（62岁，老城东村村干部，族谱可追溯到李坝集时代）：\u003cbr\u003e&quot;我爷爷当年在城墙上种过树。那城墙真高——8米，上面能跑马车。建国后先拆的城门楼，然后拆城墙砖盖学校，最后连夯土都被挖了垫路了。我家那块宅基地，原来就在西南头——当年的赵家大同照相馆位置。&quot;\u003cbr\u003e▌孙守礼（80岁，老城村最年长的老人之一，亲历老城8次易手记忆）：\u003cbr\u003e&quot;我记得第一次攻城——1946年8月，打了18天18夜没打下来。后来1948年才彻底安定。那时候城壕里死的人真多，护城河水都是红的。现在城壕填平了，上面盖了房子，谁知道这儿原来是护城河啊。&quot;\u003c/p\u003e"}, {"n": "杞县·杞人忧天的双重城防", "s": "杞县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e商 杞国都城。秦 置雍丘县。金大定十四年（1174）避世宗讳改雍丘为杞县。元太宗六年（1234）黄河决口冲垮城北。元癸卯年（1243）万户张柔在故城北筑新城（张柔城）。元至大四年（1311）河决张柔城，县治迁回今城址。明崇祯八年（1635）知县乔岱改土城为砖城。清乾隆二十八年（1763）大水毁城，修后塞废小南门，留五门。清嘉庆二十五年（1820）知县徐大镛筑护城堤，道光六年沿堤植柳。1946年出于战事拆除城墙。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e杞县老城如今双重城防只剩外圈一道土堤还看得出轮廓——内城砖城早平了，南北四条大街仍是明清棋盘；城外那道七里半长的护城土堤，清代黄河决口全靠它挡水保城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e护城堤土段：圈在城外的一圈黄土长堤，约七里半、高出平地两人多，县医院后一段尚完整，已列县级文保。；文庙大成殿：城内黉学主体，明洪武三年始建，永乐、成化、嘉靖、万历屡修，基台东西长二十三米多、南北宽十七米多，殿高约十三米，面阔五间、进深四架，歇山式木结构，绿琉璃瓦盖顶，四角飞挑，檐脊琉璃神兽仍在。殿前青砖露台七级台阶，台上明柏明槐各一株；鼓形束腰青石柱础上承二十四柱，双踏步间嵌石雕大盘龙，鳞爪分明。；圉镇古街：城南圉镇为汉晋圉县旧治，西街伯喈胡同传为蔡邕故里，青石板路经数百年车轮人足磨得发亮，胡同两侧老门楼砖雕依稀，如今仅存两家老宅；镇上崇兴寺、泰山庙、子在塔多已残改，街口近年复立蔡文姬纪念馆。；四街格局：东门、西门、南门、北门四条大街十字相交，仍沿旧名，棋盘未改。；抚辰楼（齐政楼、钟鼓楼，县保）：县城十字中心，元至正四年县尹孙楠始建、明嘉靖二十年重建，蓝砖台基中留拱券门洞宽四米、高三米一，为出入县府大门。台上两层砖木楼，硬山三开间，底楼门居中向南，回廊四向延伸，廊下环立漆红明柱十六根，以鼓形雕石为柱础；顶楼宫殿式四面起坡，五脊分立，檐角展翅，八角翅飞各悬一钟形铃铛。门洞青石板上百年车辙深痕仍在，自元明清直至建国后一直做县衙大门。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郦生冢（县保一九八四年）：县城西南高阳镇铁底河南岸，汉初郦食其、郦商兄弟墓，两冢东西并列、高约十五米。墓后郦祠东汉延熹六年所建，一九三九年毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，杞县城关镇东街老住户，曾在护城堤上放过羊）：\u003cbr\u003e&quot;我小时候护城堤还完整着呢——上面全是柳树，道光年间种的那批。后来大跃进砍了烧火。7.5公里的堤，我放羊一绕就是大半天。现在堤被挖得七零八落，只有县医院后面那段还像个样子。&quot;\u003cbr\u003e▌王大姐（55岁，圉镇开蔡文姬纪念馆的个体户）：\u003cbr\u003e&quot;伯喈胡同就在圉镇西街——蔡邕（蔡伯喈）的故里，青石板还在。我小时候那条胡同里还有老宅子，门楼上有雕花。现在修了路，老房子只剩两家了。子在塔也在圉镇，相传孔子过此住过一夜，弟子后来建的塔。&quot;\u003c/p\u003e"}, {"n": "通许·400年没挪窝的县城", "s": "通许", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e北宋建隆元年（960）置通许镇。咸平五年（1002）以通许镇置咸平县。金大定二十九年（1189）改咸平为通许县。明洪武五年（1372）知县姜允和增筑土城。明嘉靖七年（1528）知县于尚春始筑砖城，明末毁。清顺治年间知县褚士行、姜汝松、贾待旌相继修葺。清光绪十五年（1889）知县谢立本外筑砖墙。清光绪三十年（1904）筹资加固。1949年后砖墙拆除。1972年向北扩建新城区。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e通许老城最老实的地方，是把明嘉靖年间的县城图对着今天走一遍——南北四街走向几乎一寸没动。城墙早拆成了环城路，寺、桥、街都在原位，是黄泛区里少见的没挪过窝的县城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城棋盘街：状元桥街、光复路、行政路交错成棋盘，与嘉靖县志所载城图对照几乎未变。；清真寺：老城区内的明清清真寺，仍在使用。；护城河残水：城东南隅还留一小片水面，是旧池遗迹。；曹植墓（省保第三批二〇〇〇年）：县城东七公里长智镇后七步村，三国魏陈思王墓。明成化六年黄河决口冲出魏陈思王曹子建之墓碑，万历八年建祠立《通许县创建陈思王陵祠记》碑，碑高约三米四、宽七十六公分、厚二十二公分，碑文正书三十六行，碑座为巨龟，今立八角亭内。黄泛几次淤平冢身，一九九八年省文物局拨专款重修，封高墓丘、砌两米高砖石围墙，今冢高约三米六、径十二米，墓前立魏陈思王曹植之墓碑，院中香烟不断。；庞涓墓（县保）：县城东三里岗，圆丘形封土，墓地约千平方米，四周皆耕地，地表散落绳纹陶片与碎砖瓦，冢上杂草丛生，无碑无亭，仅田埂旁县保小碑一通。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e环城路城墙基：环城路一线即当年城墙基址，建国后拆砖铺路，墙基埋在路面下。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵大爷（76岁，通许县中街老裁缝，从青年到老年在同一条街上做衣服）：\u003cbr\u003e&quot;我18岁在这街上摆缝纫机，现在76了，还在这条街的另一头。街变宽了，铺子换了一茬又一茬，但街道走向没变——南北街东西街，还是明嘉靖年间那个棋盘样。我那台老缝纫机用了40年，现在搁家里当摆设。&quot;\u003cbr\u003e▌退休教师李老师（70岁）：\u003cbr\u003e&quot;我是教历史的，嘉靖二十七年县志上有老县城图，拿出来跟现在的地图一比——街道位置几乎没动。这在黄河泛滥区太少见了，周围杞县、睢县都迁过城，通许从唐代起就没挪窝，真是奇迹。&quot;\u003c/p\u003e"}, {"n": "尉氏·城墙还在的活化石", "s": "尉氏", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋 为郑大夫尉氏之邑。秦始皇三年（前219）置尉氏县。汉 始筑县城。明宣德六年（1431）外拓城垣一里余，方形城变凸字形。明成化十九年（1483）修城，开六门。明崇祯七年（1634）改土城为砖城。明崇祯十四年（1641）毁于闯军。清顺治初重修。1951年拆取城砖用于城市建设。1959年夯土城垣大部移平。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e尉氏老城的砖层早拆了，可站在城外，一圈两米来高的夯土轮廓还完整地圈着城——这在豫东平原不多见。更绝的在洧川镇：明代南城门洞顶上，砖缝里斜长出一棵五百岁的柏树，城门因它才留到今天。\u003c/p\u003e\u003cp class=\"main-text\"\u003e太平兴国寺塔（国保二〇〇六年）：县城内，北宋太平兴国年间建，六角八层重檐楼阁式砖塔，通高约三十米，底径七米余，寺早废唯塔独存。塔内卧砌青砖衔咬，每层由平座、塔身、挑檐三段组成，檐下斗拱仿木结构、用材硕大；因黄河多次淤灌，底层室内地平低于室外一米，塔基没入地下。塔顶三层为明嘉靖二十五年重修，宝瓶式铜刹扣顶，塔身内外嵌佛龛、假门、假窗，历经千年地震与黄水仍巍然。；紫铜钟（省保一九五六年）：今悬于县政府院内明万历年间所建钟楼上，北宋咸平二年原物，高约一米八六、围四米、厚八分。钟顶浑铜钮八齿，铸皇帝万岁、重臣千秋八字，每两字间一孔共四眼；钟腹按八方铸铭文，记铸造年代与功德主，除南方一面剥蚀外其余各方大部清晰，大宋国咸平字样可辨。原悬东关太平兴国寺，寺废后移此，击之声闻数十里。；刘青霞故居（国保二〇〇六年）：城内西大街两侧，清光绪六年建，原为刘半县师古堂庄园一部分，今存东西两座三进院，硬山灰瓦，水磨砖出厦天井院，檐下透雕花砖，青瓦高叠脊出兽。东院有房三十六间，内院堂楼面阔五间，下层木柱出厦一周，厦下大亮窗；院中立刘青霞手植百年腊梅一株，今辟为纪念馆。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城夯土残垣：砖面拆尽后一圈夯土轮廓仍在，从城外望去最高处约两人高，街巷随城墙弯成凸字形。；洧川南门（镇洧门，省保）：洧川镇南街，明景泰元年建，东西宽七米、进深十三米半、高十米，内外壁大青砖砌成，底部青石铺基，半圆拱券门洞，城垛作十字柿花形。门洞内侧圈顶正中砖缝里斜长出一棵五百余年古柏，向北倾卧，树干胸围一米一，枝形如凤，根沿两侧砖缝扎入地下；城楼早已毁，仅余城台与券洞，当地人初一十五在砖缝前上香。；洧川北门古榆（已毁）：原与南门古柏遥对，民间有&#x27;南门到北门，柏（百）里有余（榆）&#x27;之说。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌退休志办赵主任（73岁）：\u003cbr\u003e&quot;我把嘉靖二十七年的老县志城图拿出来，跟现在尉氏的卫星地图一比——街道走向一模一样。这在豫东太罕见了！旁边通许虽然也没迁城，但城墙早平了；杞县迁过两次城。尉氏是真&#x27;老实&#x27;——2500年，城没挪窝，街没改向。&quot;\u003cbr\u003e▌洧川南街老校长（68岁，教了一辈子书）：\u003cbr\u003e&quot;那棵柏树从我爷爷小时候就在那——500年了。传说是小鸟衔的柏籽掉进门洞砖缝里长出来的。82年县文物所的人给南门挂牌，说柏树是&#x27;自然奇观&#x27;。我小时候爬上去摸过树根，那根顺着砖缝往下钻，不知道扎到哪儿了。&quot;\u003c/p\u003e"}, {"n": "兰考考城·迷你小城堌阳镇", "s": "考城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉建初八年（83）甾县改名考城县。元至元间城没于河，迁贺丘。明洪武二十三年（1390）河决，迁江墓店。正统二年（1437）再遭河患，迁北关，筑土城。崇祯年间改砖城。清康熙二十八年（1689）淫雨塌城重修。清乾隆四十三年（1778）北关城没于黄河。清乾隆四十九年（1784）县治迁堌阳，知县雷逊筑三里小城，内土外砖，开四门，各门设铁索吊桥。1949年县治迁张君墓（今考城镇）。1954年考城与兰封合并为兰考县。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e堌阳镇的老城不大——清乾隆年间最后一次迁来的考城，城周三里，四门互不相照，丁字街像迷宫。城墙砖散在村民家院墙里，护城河的圈子还在，是一座被黄河追着跑了两千年才停下的小城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e丁字迷宫街：城内多丁字路口、少十字街口，少有平行街，外来者易迷路。；四门地名：东门朝阳、南门迎薰、西门安澜、北门拱辰，旧名仍指得出位置。；黄陵岗塞河功完碑：县境黄陵岗，清代治河碑刻，记述当年封堵黄河决口始末，碑身立于河务旧址。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e堌阳城残基：清乾隆四十九年知县雷逊筑的三里小城，内土外砖，开四门、各门设铁索吊桥，今夯土残垣与护城河圈仍在，城址占地约二十万平方米。拆城时分给村民的老城砖每块近三十斤，至今散见各家院墙屋基；城内丁字街格局未改，外来者仍易迷路。；老城砖：拆城时分给村民的老城砖每块近三十斤，至今散见各家院墙屋基。；张良墓（省保第七批二〇一六年）：县城西南三义寨乡曹辛庄村南、陇海铁路曹辛庄站南侧，汉留侯张良墓。冢高约十米、周近百米，保护区三万五千平方米，1978年修陇海铁路复线曾占去北茔地四百平方米、伐柏十二棵，今存古柏一百九十七棵、树龄约两百三十年，夹以杨、槐、桐、椿，阵风过处林涛有声。原张良祠早毁于水战火患，今主殿为近年重修，塑张良像配祀黄石公。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老爹（82岁，堌阳镇最年长的老人，见证老城变迁）：\u003cbr\u003e&quot;我还记得建国前堌阳城的样子——城墙不高但很结实，四门有吊桥，每天晚上放下来。城内街道太绕了，刚来的人容易迷路——全是丁字路口，没几个十字街口。卖胡辣汤的、炸油条的、补鞋的都挤在大隅首。后来1949年县治搬走，城就慢慢败了。&quot;\u003cbr\u003e▌退休中学教师刘老师（70岁，本地史学家）：\u003cbr\u003e&quot;考城的迁徙史就是一部黄河泛滥史——从西汉到乾隆，迁了至少5次，每次都是河毁城。最后在堌阳找到这块高地，只筑了3里城——黄河能淹到的地方越来越高，能用来筑城的地方越来越小。3里城在豫东县城里是最小的，但它挺了170年。&quot;\u003c/p\u003e"}, {"n": "中牟·官渡之战的曹操城", "s": "中牟", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋 为郑邑清邑。西汉初始置中牟县。东汉末曹操在青峰岭重筑城池，即今明清县城前身。明天顺五年（1461）黄河决口城毁，知县董敏移筑今址。明崇祯七年（1643）知县俞士鸿易土为砖，加筑东西瓮城。清顺治二年（1645）重修，定四门朝阳、观光、迎薰、拱辰。清乾隆十五年（1750）知县孙和相重建四门瓮城楼。1938年花园口决堤，冲毁城墙三分之一，城内房屋多倒，全城只剩丁字口一片高地。1956至1958年余墙砖石拆除。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e中牟老城地面上城墙已无，可东西大街与南北大街仍在丁字口相交——1938年花园口决堤，全城只剩丁字口这一片高地没淹。城北官渡桥村一带，就是当年曹操败袁绍的古战场。\u003c/p\u003e\u003cp class=\"main-text\"\u003e丁字口街格：老城东西大街与南北大街在丁字口相交，这里是当年洪水后幸存的高地。；官渡古战场：县城北官渡桥村一带，东汉末官渡之战主战场。；东古城遗址：县城东南十余里，东周至宋古城，2023年东关洞上村居民房后新发现一段长约二十米、宽十余米的夯土残垣，西北城角隆起。村民房基下压着夯层，墙土比水泥还硬，把中牟建城史上推至夏商时期。；丁字口老民宅：丁字口附近零星保留几处民国老屋。；寿圣寺双塔（国保）：县城东南黄店镇冉家村东约一公里土岗上，宋代两座砖塔东西对峙、相距约二十米，均六角楼阁式空心砖塔，无塔顶，传因宋末战乱未竟全功。东塔现存四层、高约十五米，塔身东面辟门，底层每面雕坐佛一排；西塔现存七层、高约三十米，每层券门外饰砖雕兽头、真窗盲窗相间，塔身已向东北倾斜约四十厘米，沙土地基上斜而不倒。；梁惠王墓：县境，战国魏惠王冢，封土尚存，近年做过墓体保护与环境整治。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌齐治平（真名赵福群，中牟历史研究专家，行走的中牟活字典）：\u003cbr\u003e&quot;我是个农民，小学都没毕业，后来靠自学。2023年在东关洞上村居民房后发现一段古城墙——长约20米，宽10余米，初步断定就是中牟城遗址。这一发现把中牟建城史从汉代提前了两千年，通到夏商时期了。我研究了十多年，终于找到点实在东西。&quot;\u003cbr\u003e▌退休老干部李主任（75岁，1950年代就住在老城区）：\u003cbr\u003e&quot;我小时候听老辈说，1938年那场大水，全城就剩丁字口那一片没淹，周围全是水。后来日本人来了，在碉堡里住。1945年日本人投降后，居民才敢回来搭棚子。我家1952年盖房子，砖还是从城墙基下挖的。&quot;\u003c/p\u003e"}, {"n": "新郑·四十五里牛角城", "s": "新郑", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋初郑武公迁都新郑。前375年韩灭郑，迁都新郑，加高加固东、北城墙。前230年秦灭韩。此后故城夯土城墙一直作为新郑县城基址。明代重修城，增瓮城、城楼。明隆庆年间新郑人高拱入阁。1958年拆城墙砖，夯土墙体大部未动。1997年拓宽郑新公路时改线保护一段城墙。2006年西环路改造挖出明代城墙基，下以青石长条为基、上砌带铭文城砖。（以上为T12大批次12县正文）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e进新郑，先撞见一圈趴在地上的黄土长堤——郑韩故城的夯土城墙从城郊圈到城边，基宽数十米、残高十来米，是东周列国都城里地面保存最好的一座。城里南街青石板巷，还活了六百年。\u003c/p\u003e\u003cp class=\"main-text\"\u003e郑韩故城夯土墙（首批国保）：东墙、北墙地段仍高高隆起，五花土分层夯筑，每层厚八至十二厘米、夯窝密集，基宽四五十米、顶宽二米半至五米，残高一般十米上下、最高近十六米。一道南北隔墙把城分作西城宫城、东城郭区，西城西北部阁老坟村西南梳妆台夯土台基长一百三十五米、宽八十米，原高八米，今仍高六米余，是城内唯一高出地面的春秋宫殿台基；北墙外侧数处马面，是中国最早的新型城防设施。；南街古巷（省级历史文化街区）：长约五百米的青石板老街，黑灰砖墙、雕花木窗，明代起名六百年未改。青石板被几百年车轮人足磨得发亮，缝里长草，两侧老宅木门板、砖墀头依稀，街内合盛泰布庄旧号近年修复，灯笼亮起时仍与老住户记忆中的模样相似。；惠济门：近年复建的明代南城门，城头嵌&#x27;惠济门&#x27;石额，门外即热闹的南环路。；欧阳修陵园（国保第六批二〇〇六年）：市区西十三公里辛店镇欧阳寺村，宋熙宁八年欧阳修赐葬处。双冢并列，一为欧阳修、一为夫人薛氏，陵园占地十六亩半，院西树元明清重修碑七十余通，古柏翠竹。；新郑博物馆：市区轩辕路黄帝故里西侧，两层歇山式仿古建筑，长四十三米、宽十六米，馆藏郑韩出土青铜礼器与裴李岗文物五万余件。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e鉴忠堂宝谟楼：明隆庆年间高拱接旨之所，民间俗称接旨亭，面阔三间八米、进深七米、高约十米，墙身与穹窿拱顶均用青灰砖白灰粘砌，歇山顶覆绿琉璃瓦。楼上建筑清代已毁，今仅余底层拱形过厅残构与青石条基座，矗于黄帝故里鼎坛南侧绿地中，是新郑旧城仅存的一处明代原构。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张大爷（83岁，南街最年长的老住户，南街&quot;活化石&quot;）：\u003cbr\u003e&quot;我这辈子没离开过南街——小时候青石板就被磨得发亮了，街两边的老宅子一座挨一座。1958年拆城墙，南街口那段老墙还在，青砖斑斑驳驳缝里长草。我每次路过都摸一把。现在好了，南街2024年成了省级文化街区，灯笼一亮，小孩追着跑，跟我小时候一样一样的。&quot;\u003cbr\u003e▌退休志办王主任（70岁）：\u003cbr\u003e&quot;郑韩故城的城墙是真厉害——2700多年了，土夯的比砖的还结实。墙基最宽60米，顶上2.5米，能并排跑两辆马车。97年公路改线保护那段，是新郑人做对的一件大事——多花了400万，但保住了世界文化遗产。&quot;\u003c/p\u003e"}, {"n": "长垣老城·黄河岸边的蒲城", "s": "长垣", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋 孔子弟子仲由任蒲邑宰三年。金元 县城在今苗寨旧城村一带，屡经黄河泛滥淤没。明洪武二年（1369）县丞刘彦昭迁治古蒲城（今老城）。正统十四年（1449）展拓城周八里。成化十年（1474）加高城墙、开护城壕。崇祯十年（1637）知县王虚白改土城为砖砌。清乾隆三十三年（1768）知县吴钢重修，题四门。1945年9月组织万余民工拆砖城墙。1986年县政府将古城墙划为重点保护区。1995年大部土城拓为内环路。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e长垣老城只剩一小段城墙还站着——龙山商业街南口东侧，石片裹着的一段七十来米。城后老县衙院里，一棵三抱粗的古槐还活着，传说是岳飞拴过马的那棵。\u003c/p\u003e\u003cp class=\"main-text\"\u003e系马槐：老县衙后院，一棵古槐粗需三人合抱，树干中部已中空，仍枝叶尚茂，传南宋岳飞随宗泽北伐驻长垣时拴马于此，旁立岳飞系马处碑。文革时差点被砍烧火，一位老木工把锯子藏起才保住，一九八六年列为县保。；蒲城旧治石额：县衙遗址残存，刻&#x27;蒲城旧治&#x27;四字。；子路祠：老城西街，祀孔子弟子仲由治蒲&#x27;三善&#x27;，明清建筑。；学堂岗圣庙（省保第七批二〇一六年）：县城北五公里满村镇学堂岗村东，传孔子率子路、曾皙等四子弦诵处。现存杏坛亭一座，明建清修，亭高六米、宽六米四，飞檐无斗拱、枋上留彩绘；亭前杏坛碑亭全青石精雕、深浮雕滚龙柱，院中明清碑刻六通。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e古城墙残段：龙山商业街南口东侧，1995年大拆中老辈人争下的一段七十来米，外砌石块护墙，高约两人半，系二〇〇〇年包护的原状，墙顶仍生洋槐，五月槐花飘香；其余九里十八步城墙早已拓为内环路，墙基下偶见老城砖。；蘧公祠残碑（县保一九八六年）：县城东南隅，春秋卫贤大夫蘧伯玉祠旧址。清康熙间改寡过书院，祠毁于抗日战火，仅存三通石碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董老汉（80岁，老城北街原粮库家属院，在城墙根儿住了一辈子）：\u003cbr\u003e&quot;我小时候城墙还完整着呢——9里18步，上面能跑马车。北城墙上洋槐树最多，5月槐花一开，香半里地。我妈那时候常带我去掐槐花蒸饭。70年代修环城路，拆墙的人来了，我爹跟他们吵了一架——这墙比你爷年纪都大！吵也没用，一夜之间没了半面。&quot;\u003cbr\u003e▌张会计（62岁，长垣县文物管理所退休）：\u003cbr\u003e&quot;系马槐是真的老——据说岳飞拴过马，树干粗得很。文革时候差点被砍了烧火，一个老木工偷偷把锯子藏起来才保住。现在树旁边立了块碑，写着&#x27;岳飞系马处&#x27;。每年春天槐花开，很多人专门来合影。&quot;\u003c/p\u003e"}, {"n": "浚县·河堤上的活城墙", "s": "浚县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉置黎阳县。隋初设黎阳总管府。明洪武三年（1370）始建县城，以文治阁为中心夯土筑城。正德三年（1508）建云溪桥。崇祯十五年（1642）李自成军围城五月，黄河决堤灌城，城墙大部损毁。清初复修，沿卫河西岸一段因兼作河堤得以完整保留。2014年大运河申遗成功，这段城墙纳入世界文化遗产。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e浚县老城最奇的一段城墙紧挨着卫河——它既是城防又是河堤，拆不得。沿河岸走七百来米，青石砌基、青砖贴面、内填夯土，砖上还留着明代窑口的戳印。河上云溪桥五孔连拱，是卫河上硕果仅存的古桥之一。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文治阁（清代重建，国保）：城心高阁，通高约二十米，下部方形台基每面宽十二米、青石基砖砌墙，四面十字拱券穿心通行，券门外嵌青石横额，东丹流东壁、西壁泻西山为清代赵素庐书，南清环黎水、北黛护伾岚为清代张子白书。台上两层楼阁，双重檐攒尖顶、花脊琉璃剪边，上层四面开窗分题四额，登阁可俯瞰四街八巷。；黎阳仓遗址（世界文化遗产点）：隋代大运河官仓故址。；大伾山摩崖大佛（北魏，国保）：城外大伾山上二十来米高的大石佛。；浮丘山碧霞宫（明清，国保）：浮丘山上层层递进的道教建筑群。；大伾山恩荣坊：大伾山西侧百猴路中段，明万历四十五年为旌表孟楠家一门三进士所建，四柱三间五楼石质仿木结构，高宽各约十米。坊分七层，首层刻二龙戏珠，二层竖匾龙章宠锡，三层八仙庆寿，四层刻敕封官职题铭，刀法到今仍清晰。原在卫贤镇南大街，1997年因原址保护困难迁建现址。；天宁寺龙槐：大伾山东腰天宁寺山门前，一株隋唐古槐立了一千三百多年，老干虬曲如龙，当地人叫龙槐，传赵匡胤曾牵马避雨其下，树身中空仍枝繁叶茂。；大伾山天齐庙宋代滚龙石柱：天齐庙内两根宋代石柱，柱身满雕滚龙飞云，绕柱而上，是大伾山古建筑群里石雕最精的一对，手摸上去龙鳞凸凹可辨。；大伾山摩崖题记：大佛楼四周崖壁上，自后赵至明清四百六十余处摩崖题刻层层叠压，其中后周《准不停废记》碑、明王阳明《大伾山诗》碑最受书法界看重。；阳明书院：大伾山东侧山腰，王阳明嘉靖年间在浚县讲学的旧址，现存小院三间，院外石阶直通山门，崖壁上仍刻着他当年手书的五言诗。；碧霞宫西山门与浮丘山石窟：浮丘山碧霞宫侧旁，千佛寺石窟凿于唐代，洞内佛像被近代破坏严重，但窟顶飞天藻井和外壁的力士浮雕仍可上手细辨。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卫河沿岸城墙（明代，世界文化遗产点）：沿卫河西岸七百六十八米，青石砌基约四米高、上部青砖贴面厚一米三、内实夯土白灰灌浆，砖面带明代窑厂戳记，2021年修缮时发现三百七十八块带铭文城砖，嘉靖三十六年大伾山窑造、万历二年黎阳窑制字样可辨。墙南北两端各开券顶城门一道，北为水驿门、南为允淑门，一墙兼作河堤驳岸，拆不得。；云溪桥（明正德三年，省保）：卫河上五孔连拱青石石桥，桥身长近五十米，桥墩砌分水尖，四角原雕水兽。明正德三年初为木桥，嘉靖三十三年坍塌，四十四年知县魏廉川改石桥。桥四角华表已不存，1958年不规范修复时青石望柱栏板被换为钢筋混凝土，四角水兽头部早年损毁以水泥修补，桥身主体仍坚固，今仍通行。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王奶奶（78岁，西街村人，在卫河边住了60年）：\u003cbr\u003e&quot;那城墙就是河堤——小时候涨大水，河面上的浪能拍到城墙砖上。要是拆了那768米，西街这一片早冲没了。我家就在城墙根儿，后门一推就是城墙的砖面，下雨能避雨，夏天能乘凉。这墙比我爷爷年纪还大。&quot;\u003cbr\u003e▌张掌柜（65岁，西大街开了30年浚县子馍铺）：\u003cbr\u003e&quot;我做子馍的鹅卵石，就是从城墙上捡的——那砖缝里的小石头磨得溜光，炕子馍最好用。现在城墙上不让捡了，我都从河滩里挖。浚县子馍要放在烫热的鹅卵石上炕，淋鸡蛋进去，外皮脆内里软，这手艺传了几百年。&quot;\u003c/p\u003e"}, {"n": "淇县·朝歌城门缝里的古柏", "s": "淇县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e商末纣王都朝歌。春秋卫国都朝歌，后迁楚丘、帝丘。西汉置朝歌县。明洪武二年（1369）降州为县称淇县，筑土城。崇祯十五年（1642）战乱损毁。清初重建砖城，摘星台于明代中期重建。建国后城墙渐拆、护城河填平。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e淇县老城是商末朝歌。城墙早没了，可城中心摘星台门洞顶上，一棵柏树从砖缝里斜长了五百年；城外卫国故城的夯土残段还趴在田边。几百米的老街上，清末、民国、建国初的铺面一层层叠着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e摘星台古柏：城中心摘星台（朝歌遗址公园）门洞砖缝里斜长出的一棵古柏，树龄约五百年，根沿两侧砖缝扎入地下。台顶今建心星阁红墙碧瓦，园内并立殷朝六七贤圣君故都碑、扯淡碑、陈婆造心经浮图、麒麟壁等五十余处，1984年辟为公园。；朝歌老街（省级历史文化街区）：青石板街，清末深宅、民国商铺、建国初供销社与人民剧院铺面叠在一起。；卫国故城残墙（国保第六批）：县城四周尚存四段夯土残墙，残高数米、长数十米至上千米。；文昌阁：明末崇祯年间所建，老街口标志，登阁可望老街屋脊。；云梦山：城外鬼谷子隐居处，水帘洞、孙膑洞诸迹。；鹿台遗址与鹿台阁：县城东南八里鹿台寺村，传纣王积财之台，今夯土台基仍高出周围地面数米，台上新建重檐鹿台阁，登阁可望淇河与广润坡。；三仁祠：县城南关摘心台南，明代始建、近年重修，纪念被孔子誉为三仁的箕子、微子、比干，现存山门、大殿，院内古柏两株，碑刻数通。祠前原照壁麒麟壁雕于明正德元年，至今浮雕刀法可辨；因比干为天下林姓始祖，海内外林氏宗亲年年清明来此祭祖。；帝辛墓与苏妲己墓：城东淇河西岸，两冢并列，封土尚存，前立清乾隆年间石碑，墓周已圈为绿地，村民仍称纣王墓。；荆轲冢：县城南五里锦园村，传战国荆轲葬处，封土堆尚在，周围麦田环绕，冢前近年新立石碑一通。；卫国冶铁作坊遗址：朝歌镇东关、付庄村一带，春秋战国冶铁与制骨作坊层层叠压，地面至今可拾到战国铁渣与骨器残片，国碑立在田埂边。；前嘴石窟：县城西北前嘴村太行山岩壁上，北朝石窟一窟三龛，佛头多残但背光、胁侍浮雕仍在，是豫北少见的北魏摩崖造像。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，朝歌老街最年长住户，在老街上住了60年）：\u003cbr\u003e&quot;那棵柏树什么时候有的？我爷爷说他小时候就在那儿了——至少500年。门洞砖缝里长出来的，根顺着砖缝往下钻，不知道扎到哪儿了。我小时候常爬上去摸树根。现在有人说那是&#x27;封神&#x27;的一景，游客来都要摸一把。&quot;\u003cbr\u003e▌孙姐（58岁，朝歌老街开了20年代香铺+茶馆）：\u003cbr\u003e&quot;我家那屋子是民国时期的，木梁雕花都在。老街有意思——明清的深宅、民国的商铺、建国初期的供销社、人民剧院，全挤在一条街上。我小时候供销社还开着，卖的糖块5分钱一颗，现在供销社变文物了。&quot;\u003c/p\u003e"}, {"n": "原阳原武·黄河渡口的玲珑塔", "s": "原武", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉置原武县。明洪武四年（1371）筑土城，崇祯十三年（1640）改砖城。清代属怀庆府，屡经重修。1938年12月外敌占据原武，在东城墙上站岗，留下城墙老照片。1941年伪知事岳绍明修城墙，立城壁修复纪念碑。1945年光复。1950年代原武、阳武合并为原阳县，县治迁原武镇，后又迁出，此地为原武镇。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e原武镇是黄河北岸的老渡口小城。城墙早不存了，可东关外那座北宋玲珑塔还斜斜地站着——六角十三层、四十来米高，底层早被黄河泥沙淤进地下，人称中国的比萨斜塔。镇北还有汉丞相张苍的大冢。\u003c/p\u003e\u003cp class=\"main-text\"\u003e善护寺玲珑塔（国保第七批）：原武镇东关，北宋崇宁四年建，六角十三层楼阁式砖塔，全高约四十余米，比意大利比萨斜塔早六十多年。塔身向东北倾斜二度三十三分，底层被黄河泥沙淤埋一层，地面只见十二层。塔门设在南面，为原二层窗洞改建，各层半圆券门、古钱纹与破子棂假窗相间，每层檐角原挂铁风铎七十二枚，今仅存数枚悬于塔顶，风过仍响；塔刹为明万历重修时所铸铁质葫芦，黑锈斑驳。；汉张苍墓：镇北，西汉丞相张苍墓冢封土隆起。；老城四街：东西南北四条街格局仍在。；黄河古渡口：镇北依黄河大堤，为古代河北渡河南下开封的旧码头。；张苍墓碑：谷堆村商代遗址上，汉丞相张苍墓冢东西长约四十米、南北宽约三十米，封土高一二米，冢上槐林茂密。冢前立清康熙年间圆首石碑，碑额镌云龙图案，中刻汉丞相北平侯张公讳苍之墓，碑身风化漫漶而大字尚可辨认，村人仍称张相谷堆。；玲珑塔风铃与铁刹：塔每层檐角原挂铁铃数百枚，今仅存数枚悬于塔顶，风过仍响；塔刹为铁质葫芦，明万历年间重修时所铸，黑锈斑驳。；玲珑塔倾斜实测：塔向东北倾斜二度三十三分，底层被黄河泥沙淤进地下一层，地面只见十二层，游人绕塔一周可明显看出塔身歪而不倒。；原武老西门外古槐：镇西关帝庙前一株古槐，传明崇祯年间外敌站城站岗时即在树下，老干中空，仍抽新枝。；原武镇老街与残存城砖：东西南北四条老街格局未改，街基下偶见明代城砖，老住户门楼上仍有砖雕墀头。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e原武城隍庙：原武镇十字街北，明洪武二年重建，斗拱梁柱仍带元代遗风，是豫北现存规模最大、保存最完整的明代城隍庙。现存大门、拜殿、东西厢房与大殿，院内古柏两株，庙前石狮一对仍蹲在街沿。上世纪五十年代庙院被粮库占用，未遭大拆大改，木构砖墙上百年烟火气仍在；明清碑刻二十余通并存，部分彩绘犹存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，原武镇东街老木匠，1950年代见过完整城墙）：\u003cbr\u003e&quot;那城墙是真高——7米，跟现在两层楼差不多。外敌站岗那事儿我爹跟我说的——人拿枪逼着老百姓修城，还立了碑。我小时候城墙砖还能挖着，后来大跃进全扒了烧砖炼钢。善护寺的塔现在还在，我爬上去过，能看见黄河滩。&quot;\u003cbr\u003e▌退休教师李老师（70岁，原阳县志办公室）：\u003cbr\u003e&quot;那战时档案是我从网上找到的——日本防卫厅战史研究所藏的。上面写着&#x27;原武城城墙高七米，上宽二米，下宽十米，周长二千五百四十七米&#x27;，精确到米。还有一张老照片，外敌站在城墙上，背后就是玲珑塔。这是原武城仅存的几张老照片。&quot;\u003c/p\u003e"}, {"n": "延津·吴起城的鬼打城传说", "s": "延津", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国传吴起于此筑城驻军抗秦。金明昌五年（1194）黄河改道，宜村由南岸变北岸。金贞祐二年（1214）卫州州治迁宜村新城，正大八年（1231）以石包砌城壁。元代胙城县治他迁，城废。2005年冬修高速取土挖出古钱。2006年考古调查勘探，勘明三面残墙。2013年沙门城址列入第七批全国重点文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e延津城外黄河故道的沙窝里，趴着一座国保古城——沙门城址，俗称吴起城。夯土墙圈着千把亩地，大半埋在黄沙下；城东还有一圈传说一夜长成的夯土，如今全种成了麦子。\u003c/p\u003e\u003cp class=\"main-text\"\u003e吴起城遗址（沙门城址，国保第七批）：塔铺街道沙门村东北，传战国吴起屯兵处，实为宋金黄河渡口城址；北墙七百四十米、西墙八百米、东墙六百四十米夯土尚存，城址大半压在黄河故道黄沙下，路边立国保碑，碑旁自生一棵老柳。2005年冬修高速取土挖出汉宋古钱一坑，引得淘宝人翻遍四周田地，今耕地恢复种麦。；鬼打城夯土：城东古墙村一带，传一夜长成的城墙，实为明代百姓避乱集体所筑，今已成沃田。；胙城城隍庙：旧胙城县治所，庙尚存。；大觉寺万寿塔：县城北街大觉寺院内，六角七层楼阁式砖塔，唐天宝年间始建，明嘉靖二十七年倒塌后重启重修，历三代皇帝、十五任知县、三十六年才封顶，万历十三年铸一千多斤铜宝瓶塔葫芦扣顶。塔通高约二十九米七、基座直径七米八，二层至七层由砖雕仰莲平座、砖砌塔身、斗拱挑檐组成，二〇一九年列为第八批国保。；赵孟頫长明灯记碑：大觉寺大雄殿右前方，元揭徯斯撰文、赵孟頫亲书《泰安王子开府公长明灯记》刻石一通，今罩玻璃护亭。碑身斑驳、行楷秀劲，是延津县城内最珍贵的元碑，与明成化二十二年王秉撰文的重修碑分立大殿神道两旁；玻璃反光下仍可辨赵字圆转妍丽的笔意。；大觉寺大雄殿：寺内现存明建大雄殿三间，殿顶琉璃脊兽仍在，殿前两株古柏斜出，门廊石柱上有明万历年间捐资题记。；酸枣阁：县城东北十余里，传隋代酸枣县得名处，高阁三间，阁内一株千年酸枣树老干横斜，树皮斑驳，当地人仍称酸枣庙。；陈玉成殉难处玉石关帝庙：县城西教场，清代太原知府周计百告老还乡所建，现存大殿三间，英王陈玉成一八六二年在此被清军处死，庙前立纪念碑。；延津县城老街：北街、西街两侧明清铺面尚有残段，木门板、砖墀头依稀可见，大觉寺前一段青石板路仍在使用。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宋老师（72岁，延津县十八里村农民，吴起城遗址发现者之一）：\u003cbr\u003e&quot;2005年修高速挖土方，挖出一堆古铜钱——有汉代的、宋代的。消息传开，全国来淘宝的人把地都翻遍了。我也捡了一枚&#x27;大观通宝&#x27;，后来县文管所来人收走了，给了我一张奖状。现在那夯土堆上立着&#x27;国保&#x27;石碑，旁边长着一棵老柳树，不知道什么时候栽的。&quot;\u003cbr\u003e▌张老汉（68岁，东古墙村农民，&quot;鬼打城&quot;传说知晓者）：\u003cbr\u003e&quot;我爹说那夯土堆原来有1000米长、3米高——传说是鬼神一夜筑的。其实就是明朝时候周围村子为了躲土匪，晚上偷偷一起筑的，怕被土匪发现，才说&#x27;鬼打城&#x27;。现在全成耕地了，种麦子。我小时候还在上面放羊呢。&quot;\u003c/p\u003e"}, {"n": "封丘·黄池会盟的城墙路", "s": "封丘", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋（前482）吴王夫差与晋定公等会盟于黄池。西汉置封丘县。明景泰二年（1451）典史郜瑢筑土城。明嘉靖三十年（1551）知县李嵩始筑砖城。清顺治、咸丰年间多次重修。1980年代城墙拆除、护城河填平，修成黄池路。2019年黄池路拓宽为双向四车道。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e封丘老城最妙的是把城墙走成了路——南北向的黄池路，路基就是明代东城墙加护城河；城里四角还有四个当年取土留下的大塘，下雨全靠它们收水。胡同里的老宅子还是前堂后寝。\u003c/p\u003e\u003cp class=\"main-text\"\u003e黄池路：穿城南北主干道，路基即明东城墙与旧护城河位置。；四角碱坑：城东南西北四角取土筑城留下的四片湖，今种荷花成城市公园，雨水顺地势汇入。；边胡同：南北数百米，两侧前房后院式明清老宅，因边氏一族出过两对父子进士闻名。；黄池会盟碑：黄池公园内近年立。；陈桥驿系马槐：县城东南十三里陈桥镇陈桥村东岳庙（今陈桥驿）院内，一株古槐老态龙钟，树围五米四、需三人合抱，树干沟壑纵横、心已空，1983年秋曾枯死，根部旁又抽新枝，传后周时赵匡胤在此拴过战马。树旁立清乾隆年间河南尹张松孙书系马槐碑一通，碑侧并立石马一匹。；陈桥驿大殿：单檐歇山顶九脊，红墙绿瓦，滚龙盘脊，清代重修，殿内供赵匡胤像，门悬陈桥驿匾，殿前东西厢房尚在，院内古井一眼石栏仍在。大殿前西侧立宋太祖黄袍加身处清代石碑一通，碑高约一米七、宽五十七公分，正面八字楷书，碑阴刻金梦麟题系马槐诗，行草相间。；陈桥驿大殿：单檐歇山顶九脊，红墙绿瓦，滚龙盘脊，清代重修，殿前东西厢房尚在，院内古井一眼，石栏仍在。；青堆遗址：县城东北青堆村，新石器时代龙山文化遗址，台地高出周围地面数米，地表可拾到绳纹陶片，是封丘境内最早的人类聚落。；使君祠：王村乡庙岗村，纪念东汉县令王宠的祠堂，现存大殿三间，院内古柏三株，碑记数通。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e封丘城隍庙：县城东大街路北，明洪武五年县丞张宗海始建，万历十一年重修，现存大门、二门、后寝宫，东西厢房拆改，庙院石碑数通。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李老汉（78岁，老城边胡同住户，边姓后人）：\u003cbr\u003e&quot;我家就在边胡同——清末的时候胡同里出了两对父子进士。现在我家那老宅子还是前房后院的格局，门楼砖雕都在。我爹说当年城墙还在的时候，北门上有块镶金的大匾，后来日本人来了就没了。那匾是夸李嵩阳的——他是清顺治年间的御史，捐钱修城墙、救济流民。&quot;\u003cbr\u003e▌王大姐（62岁，封丘退休教师，碱坑爱好者）：\u003cbr\u003e&quot;封丘老城最聪明的地方就是那四个碱坑——修城墙取土挖的，后来变成湖。不管下多大的雨，城里不积水——雨水顺着地势往四个坑里流。这是几百年前古人的排水智慧！现在南边那个碱坑变成公园了，种满了荷花，我常去拍照。&quot;\u003c/p\u003e"}, {"n": "汝南·天下之中的蔡州城", "s": "汝南", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东晋义熙十四年（418）汝南郡治迁悬瓠城（今老城）。北魏城三面环水，仅设东西南三门。明洪武八年（1375）增辟北门，拓城周九里三十步。成化二十年（1484）重修，绕以子墙。清顺治、咸丰年间多次重修。1936至1937年除四关城门外城墙全拆。1953至1968年四座城门陆续拆除，北门因防洪独存。1996年农行捐资复建天中门（南门），2021年复建汝南门。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e汝南城被汝河三面抱着，形状像个垂下来的葫芦。城外天中山是个丈把高的小土丘，颜真卿亲题&#x27;天中山&#x27;三字就刻在碑上；城西南角那座唐塔，传冬至正午没有影子。\u003c/p\u003e\u003cp class=\"main-text\"\u003e天中山：城外一座高不过丈余的土丘，传周公立圭测影处，颜真卿题&#x27;天中山&#x27;碑今存文化园。；悟颖塔（国保）：城南小南海畔，传唐代高僧悟颖所建，1984年维修时于第八层发现石刻志铭，实为南宋构，明隆庆年间重修。六角九级楼阁式砖塔，通高约二十六米，全用长三十五公分、宽十六公分半、厚五分半特制青砖平卧顺砌，白灰浆粘壁、黄泥合缝。单层须弥座束腰嵌砖雕花卉与山羊一对，塔顶六角攒尖，铁铸塔刹作将军头盔样、明代修补，传冬至正午无影。；小南海：城东南取土筑城挖成的湖，环湖观音阁、大士阁、准提楼错落。；皇家驿站：明代官驿旧址，近年复建为景区。；汝宁石桥：城东汝河故道上，明代五孔青石拱桥，桥身仍在，栏板浮雕已风化，现为国保，桥下旧道已成河滩。；汝南文庙大成殿：县委院内，明成化八年建，崇祯十七年兵燹后顺治十五年重修，面阔五间，单檐歇山绿琉璃瓦，建于一米高、二百一十六平方米砖砌台基上。檐柱高四米三、柱径三十九公分，柱础青石覆盆式、明间雕覆莲，鼓下又承覆盆；斗拱昂头作琴面象鼻状，有异形瓜拱。殿被数座现代办公楼环抱，殿前青砖祭祀台长二十五米。；南海禅寺：城东南小南海畔，当代按明清制式复建的大丛林，山门、大雄宝殿、观音阁层层递进，牌坊、钟楼、鼓楼俱全，是豫南最大的寺院建筑群。；开元寺：城西北，唐开元年间始建，明洪武十八年重修，现存大殿三间，寺前两株唐槐老干横斜。；刘备台遗址：城南三官庙村，传刘备驻兵点将处，台地高出周围数米，地面散见西周陶片，为省保。；小南海古建筑群：湖岸观音阁、大士阁、准提楼错落，均为清代建筑，环湖石板路仍在，碑刻十余通散置廊下。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e北城门：全城唯一没拆的老城门，因挡汝河水得以保留，门洞高约七米半，砖砌拱券，门基拱壁内多为汉晋旧砖、券门外壁以明代大砖砌垒，1941年国军强扒仅留北瓮门，1986年重修并嵌北拱金字石额。门外汝河天然成濠，河上宏济桥为明弘治年间五孔联拱石桥。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张爷爷（82岁，汝南北街老住户，见过完整南城门）：\u003cbr\u003e&quot;我小时候那南城门还在——三洞双檐，叫汝南门。门口有两头大石狮子，我常骑在上面玩。1968年那时候拆的——我亲眼见的，拆了三天。北边那城门因为挡水才没拆，现在就剩个土台子。天中山那地方，我爹说原来就是个小土丘，颜真卿的碑是后来立的。&quot;\u003cbr\u003e▌退休教师李老师（70岁，秦观研究爱好者）：\u003cbr\u003e&quot;秦观在汝南当了8年蔡州教授——元丰八年到元祐八年。他写的《汝水涨溢记》就是记录汝南水灾的。我研究了一下，《鹊桥仙》里的牛郎织女故事，汝南有传说——城西董永墓、城东织女湖，古代有七夕庙会。秦少游可能就是受了本地传说的启发。&quot;\u003c/p\u003e"}, {"n": "上蔡·蔡国六百年夯土城", "s": "上蔡", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周初周武王封弟叔度于蔡。周成王三年蔡仲胡就封，续筑都城。前529年蔡平侯迁都新蔡。战国楚灭蔡。秦汉以来上蔡县城一直在故城内收缩，未再迁徙。建国后明清内城城墙拆毁，蔡国故城夯土墙留存。1996年蔡国故城公布为第四批全国重点文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e上蔡县城就坐在蔡国故城里。一圈十里长的夯土城墙趴了三千年，残高四五米到十一米不等，每层夯土八九厘米厚、圜底夯窝至今看得清清楚楚——这是中国地面保存最完整的西周城。\u003c/p\u003e\u003cp class=\"main-text\"\u003e蔡国故城夯土墙（国保第四批）：绕县城一圈约一万零四百九十米，残高四至十一米、底宽十五至二十五米，夯层八九厘米一层、圜底夯窝至今可辨，西城、南城保存最好。墙体外侧就是麦田，墙缝里长酸枣树，村民仍在墙根放牛；1996年立国保碑后加了铁栏杆，不让攀爬。；二郎台：城中心一座比周围高出六七米的大土台，台上散落春秋筒瓦板瓦，掘出古井与陶排水管道。；蔡侯墓群：城西北九座大土冢，传为蔡侯墓葬。；李斯楼村：城西秦丞相李斯故里。；蔡明园：故城内近年新建的仿古园林，免费开放。；伏羲画卦亭：县城东十五里白圭庙村，八角形砖砌高台，亭檐下刻八卦符号，旁立东汉蔡邕题伏羲画卦碑与清康熙重修碑记，周围古柏苍苍，蓍草仍生。；李斯墓园：县城西李斯楼村南，秦丞相李斯墓冢封土尚存，墓前石碑两通。村名李斯楼沿用至今，村里李姓人自称李斯后裔，留有不置坟头的旧俗，说是李斯被腰斩没了头。2021年县财政投入百万元做局部升级改造。；蔡侯叔度公陵园：县城西北九座大土冢，传为蔡国诸侯墓葬，冢周麦田环绕，近年蔡氏宗亲每年清明来此祭祖。；郭庄楚墓：县城西北，战国早期楚墓群，曾出土大型青铜礼器与编钟，夯土封土堆尚在，为省保。；蔡国故城内二郎台陶排水管道：台地出土的春秋陶排水管道一节，现藏上蔡县文物保管所，灰陶筒瓦、板瓦仍散落在台边。；上蔡老城区青石街：县衙街至文庙街一线，明清青石板路残存数百米，两侧老宅木门板、砖墀头依稀可辨。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尚景照（退休文物专家，78岁，用了30年研究蔡国故城）：\u003cbr\u003e&quot;我是1977年调到县文化馆搞文物的。那时候蔡国故城的城墙没人管——有人在城墙上取土盖房，有人在城墙上放牛。后来1996年立了国保碑才好点。我用了30年走遍这10公里城墙，每层夯土都摸过——8到14厘米厚的夯层，圜底夯窝，这就是西周的筑城法！我出版了《蔡国史研究》《蔡国纪事本末》。&quot;\u003cbr\u003e▌刘老汉（75岁，蔡国故城旁边王庄村农民，从小在城墙根长大）：\u003cbr\u003e&quot;我家种地就在城墙边上——那夯土真结实，比现在水泥都硬。小时候我爬城墙，从上往下跳，摔在土墙上也不疼，夯土厚着呢。城墙缝里长酸枣树，我常摘酸枣吃。现在不让爬了，立了铁栏杆。&quot;\u003c/p\u003e"}, {"n": "新蔡·蔡平侯迁都的春秋故城", "s": "新蔡", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e前529年蔡平侯迁都吕地（今新蔡），在吕国都城基础上扩建。前493年蔡昭侯迁都州来（下蔡），故城渐废。明洪武年间在故城西南筑小县城。明正德十一年（1516）知县刘汉始筑砖城，开四门。民国三十年（1941）为疏散敌机轰炸拆毁砖城墙，仅留四门城台。建国后城台与护城河拆平。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e新蔡老城东北角，一段一千四百来米的春秋夯土墙还趴在庄稼地边——那是蔡国第二个都城仅存的一段。其余城墙早被工厂、学校、机关压在了下面。\u003c/p\u003e\u003cp class=\"main-text\"\u003e新蔡春秋故城（省保）：县城东墙外，东西长方圆城，周长八里半；东南角一千四百余米夯土残垣尚好，高二至十米、底宽二十至五十米，墙根就是花生地，夯土硬得花生根扎不深。地里尽是灰陶豆柄与绳纹瓦片，近年文物普查在墙上挖了探方，夯层一层一层如年轮。；新蔡文庙明代孔子铜像：文庙大成殿内，全国仅存的明代孔子青铜坐像一尊，高约一米二五、重约二百公斤，青铜锡铅合金铸造后精细雕刻描金。头戴云纹莲花冠，足蹬朝靴，双手作揖，衣襟滚锦边理纹至今清晰。殿内高悬康熙御笔万世师表匾，颜回、曾子、子思、孟子四贤配像分列两侧，殿后存明清重修碑四通。；金粟禅林寺：城南清康熙年间重兴的江北名刹，旧有塔林数十座。；葛陵故城：县城西北李桥回族镇葛陵村，战国楚平夜君成封邑，城址略呈方形，南北长约一千三百三十米、东西宽约一千二百米，四面环水。1994年至2000年间三次发掘城东楚墓，出土战国楚简一千五百余枚、近八千字，记卜筮祭祷之事，大部分字迹清晰，数量超过信阳长台关楚墓，为第八批国保。；新蔡文庙明代孔子铜像：文庙大成殿内，全国仅存的明代孔子青铜像一尊，高一米三，头戴云纹莲花冠，足蹬朝靴，重约二百公斤，衣襟滚锦边理纹至今清晰。；仁义巷：老城内一条窄巷，因明代两户人家各让三尺成巷得名，青石板路残存，两侧老宅木门板仍在。；孔子子路问津台：城南关津乡，传孔子使子路问津处，台地尚存，旁立明清碑刻数通。；金粟禅林寺塔林残碑：寺后山门外，原塔林数十座仅存残石经幢与龟趺碑座，散落荒草间。；闹天寺古槐：县城东南闹天村，一株唐槐老干横斜，村人仍称闹天槐。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵老汉（70岁，新蔡老城农民，春秋城墙边上的庄稼户）：\u003cbr\u003e&quot;我家的地就在城墙边上——东南角那段1415米的夯土墙，旁边就是我种的花生地。那土夯得比石头还硬，花生根都扎不深。我爷爷说那是&#x27;蔡平侯城&#x27;，3000年前的城墙，现在还能摸得到。2025年文物普查，他们在那段城墙里挖了个探方，拿出来的夯层样本我看了——一层一层跟年轮似的。&quot;\u003c/p\u003e"}, {"n": "潢川光州·一水隔两城的吕字古城", "s": "潢川", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋黄国都于此，前648年楚灭黄。西汉初置弋阳县，治南城。唐太极元年（712）光州州治迁定城（南城）。南宋庆元元年（1195）引小潢河入城，城分南北两半。明正德七年（1512）知州李镗用砖石重修南北两城。民国二年（1913）废光州设潢川县。建国后城墙陆续拆除、护城河填平。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e小潢河把潢川劈成南北两半，像个&#x27;吕&#x27;字——南城弋阳、北城春申，靠镇潢桥连着。南城小南海边，两根二十米高的铁旗杆立在三义观里，是两百年前光州商民捐资铸的。\u003c/p\u003e\u003cp class=\"main-text\"\u003e弋阳古镇（南城，省级历史文化街区）：小海南岸大巷、中大、南国西天三条老街，清代胡家大院、苏家大院等几十处老宅。；镇潢桥：小潢河上连接南北城的明清石桥，今仍通行。；黄国故城（国保）：城西六公里，周长六千余米夯土城墙尚存。；春申君墓：北城传为楚令尹黄歇墓。；弋阳古镇胡家大院：南城大巷街，清代四合大院，前厅后楼，砖雕门楼，院内天井、厢房尚在，是南城五十余处清代老宅中保存最好的一座。；南城清真寺：小南海北岸，明代清真寺，大殿、望月楼、南北讲堂俱全，与对岸三义观隔湖相望。；黄国故城黄君台：城西隆古乡，城址长方形周长六千七百二十米，夯土城墙残高四至七米、基宽三十至四十米，尚存三处城门豁口，城外护城壕宽达三十六米。城中心偏西沈店村旁黄君台，南北长一百三十五米、东西宽一百零五米，残高二至三米，中部椭圆形水池传说千年不涸，台上散存板瓦筒瓦与陶豆残片，出土过铜镞、蚁鼻钱。；光州专署旧址：北城中山门内，民国砖木结构二层楼，红砖青瓦，廊柱尚在，是潢川老城民国建筑的代表。；镇潢桥石栏：小潢河上连接南北两城的明清石桥，今存桥身与部分石栏，栏板雕刻水兽，桥下仍通船。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e铁旗杆（三义观内，省保）：两根生铁铸柱，各高约二十一米、径二十八公分，一对共重一万七千五百公斤，清嘉庆十四年光州商民捐资所铸。杆顶各立展翅金凤，凤下蟠一龙一大一小，龙凤之间三层空心万字方斗；下端莲花虎头各叼一副铁联，上铁杆颂德高千尺、下铜柱表诚灿九霄。旗杆下为六边形六层基座，下三层石质浮雕喜鹊闹海、伯乐相马、二龙戏珠，上三层铁质铸纹饰铭文。观内殿宇碑刻多毁于战乱，唯此双杆巍然。；望河楼：小潢河北岸、镇潢桥东侧，民国二十一年建，原五层约二十六米，集楼台亭阁于一体。1939年为避免日军飞机定位轰炸，主动拆掉上两层，今存三层。楼外四面刻字，西汲古、南滴翠、北崇文，东字已缺；楼内藏吴道子线刻观音像与虞世南攀龙附凤碑刻，今为潢川博物馆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨大爷（76岁，弋阳古镇人，在南城外住了一辈子）：\u003cbr\u003e&quot;我家就在小南海边上——这湖是建城时挖土挖出来的，后来成了湖。三义观那两根铁旗杆，上面还刻着字呢，我小时候常爬上去摸。老北城我小时候还见过——官府都在那儿，后来拆得只剩下几个老巷子。现在南城被保护起来了，每天都有游客来拍照。&quot;\u003c/p\u003e"}, {"n": "鄢陵·郑伯克段于鄢的好城墙", "s": "鄢陵", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e周 封求言后裔于鄢，故城在彭店镇古城村。春秋 郑武公灭鄢，因城在黄土高陵之上称鄢陵。前722年郑伯克段于鄢故事发生于此。汉 置鄢陵县。东汉永元元年（89）县治由彭店古城南迁今安陵镇。明景泰七年（1456）知县康健增筑土城，开四门：东朝阳、西荣乐、南长宁、北永安。明万历四十年（1612）知县张舜典重修，四门及小北门各建重楼，砖包瓮城，疏浚护城河，壕外筑新堤。明崇祯六年（1633）鄢陵籍兵部尚书梁廷栋倡修砖城，改土为砖，时称汴南金汤。清咸丰十年（1860）四面城墙建空心敌台八座。民国25年（1936）大修通体包砖，时人谚扶沟县的好牌坊，鄢陵县的好城墙。建国后城墙因城建拆除，城砖被扒走盖房。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到鄢陵老城，城墙早平成了环城大路。可老北街的人还叫得出小北门——清嘉庆年间因为风水不利科举封了，地名留到今天。城西北陈店村是东汉陈寔故里，小北门外清代乾明寺还立着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e小北街地名：原小北门清嘉庆年间因风水不利科举封闭，这条街至今仍叫小北街。；陈寔故里：县城西陈店村，东汉太丘长陈寔（梁上君子典故主角）故里。；唐庄汉魏古城：县城西南，省保，汉魏时期城址残迹。；衙署街格：城内原县署一带街道格局仍沿旧名。；兴国寺塔：城南马栏镇马栏村，后周显德元年建，六角九层楼阁式空心砖塔，高约二十七米，底层周长约二十米，塔基用砖石砌出六边形座。每层檐下以砖雕出额枋、斗拱、椽子，把木构构件一一翻刻在砖上，檐上压山花蕉叶状饰件，犹存唐风。塔内中空，原有木棚板已朽，旧时可由塔内塔外交替盘旋登至七层，顶上铁葫芦刹沉稳古拙。寺院早废，唯塔独立村野，与城西北乾明寺塔遥对，人称双塔映鄢。；尹宙碑：县城初级中学校园内，东汉熹平六年立，青石质，通高两米零九、宽九十六厘米、厚二十四厘米。碑额正中有一直径十三厘米的圆形碑穿，穿右残留篆书从铭二字，原额八字仅余此二字。碑文隶书十四行、满行二十七字，字径寸许，方整浑穆，漫漶处波挑犹见。碑自明万历间洧水溃堤后复出，今覆以碑亭，立于操场一侧。；陈德馨藏书楼：县城内，一九三六年所建两层中西合璧小楼，青砖外墙、木格窗棂，解放后曾作中学图书室，今为省保。；许由墓：县城西许由寨村，颍川许氏始祖许由墓冢封土尚存，墓前石碑两通，周围古柏数十株。；甘罗古柏：县城西北柏梁村，传秦甘罗手植，树围数人合抱，老干中空仍枝繁叶茂，是鄢陵境内最老的一株柏。；鄢国故城：县城西北彭店乡古城村，东周鄢国都城，夯土残垣高约二三米，长数百米，国保第七批。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e乾明寺塔：城西北龙形岗上，隋仁寿四年始建木塔，今存砖塔为宋中晚期遗构，明嘉靖二十八年重修，六角十三层楼阁式，高约三十八米。每层檐下砖雕斗拱，七层以下为鸳鸯交手拱、七层以上改单抄，第二层嵌直棂假窗三孔、第三层砌砖雕佛像八尊，角挑铁铃。寺院早已废圮，民国十七年佛像被毁，塔下殿宇为后世新建，唯此宋塔独存，1996年维修时塔刹内出明代鎏金铜佛及纸本《华严经》三十二件。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，鄢陵老城北街住户，当过城墙根卖菜的小贩）：\u003cbr\u003e&quot;我小时候那城墙还在——真坚固，砖缝里长草都扎不进去。北门叫永安门，我爹在那儿摆过菜摊。后来说城墙挡路，要扒了修马路——一夜之间扒了半边，剩下的砖有人拉走盖房。现在走那条大路，就是城墙基址。我家宅基地原来就在南门瓮城边上，现在那块地盖了个小区。&quot;\u003c/p\u003e"}, {"n": "清丰·中心阁里的好城墙", "s": "清丰", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e宋 原县城在今西北十八里，元丰五年（1082）后因黄河水患南迁今址。明初 始建土城，开四门：东布德、西施泽、南阜财、北拱极。明嘉靖三十六年（1557）知县李汝宽重修，城上建更铺、墩台、角楼、城门楼。明嘉靖年间 建中心阁（揽秀阁）。明万历四十五年（1617）知县黄文星在城墙南隅立魁星楼。明天启四年（1624）四瓮城门重门包铁。崇祯八年（1635）四门各建敌楼。清康熙十三年（1674）知县杨燝修葺瓮城及雉堞。康熙十五年重修中心阁。建国后城墙拆除，砖和夯土用于城市建设。（以上为T13大批次12县正文）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e清丰老城城墙拆了几十年，可走到十字街，抬头还是那座八角形的中心阁——明代嘉靖年的木阁，长方条石铺基，下层人穿行、上层供伏魔圣像。城内东西南北四街棋盘还在，南街有子路祠，城北有清丰亭。\u003c/p\u003e\u003cp class=\"main-text\"\u003e中心阁（揽秀阁）：十字街中心，明嘉靖年间建，八角形木构楼阁，下层通行、上层供伏魔圣像，清康熙十五年重修，近年保护修缮。；子路祠：县城南街，纪念孔子弟子仲由。；清丰亭：县城北，隋孝子张清丰故里纪念建筑，清丰县名由此而来。现存亭为重檐八角攒尖顶，如伞盖擎天，十六根石柱直撑亭顶，暗合旧制十六两一斤，榫卯历经多次地震未损。亭周古柏参天，当地老人在石桌上下棋，亭内立唐代所遗张清丰祠碑一通。；四街棋盘：东西南北四街十字相交，街道格局仍沿旧名。；普照寺唐槐与槐中槐：寺院内两株古槐，一株树干树瘤酷似合十僧人，东侧古槐树洞中又生一株小槐，人称槐中槐。；单拐革命旧址：双庙乡单拐村，一九四五至一九四六年中共中央平原分局、冀鲁豫军区司令部驻地，保留旧式四合院二十余处，兵工厂旧址、邓小平旧居均在，第五批国保。；张清丰祠与孝子牌坊：老城原县衙前街，隋代孝子张清丰纪念建筑，近年重修，祠前石牌坊仍在。；清丰抗战烈士祠：纸房乡伍仙镇村西高丘上，一九四六年建，祠后青石卧碑一通，刻抗战烈士一百五十八人姓名籍贯。；文明渠故道：城南仍可辨渠形，传孔子弟子子路治蒲时率众开挖，排灌至今。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e普照寺大雄宝殿：县城西南隅，明成化二十一年建，面阔五间、进深三间，面积二百四十八点九二平方米，单层庑殿顶全木构，覆绿彩琉璃脊顶，飞檐挑角，脊上珍禽瑞兽尚在。殿面前壁由朱漆木格扣合，殿内纵四横六合抱明柱，梁架上佛道融合的彩绘六百年未褪，正面供丈高铜佛三尊、四周泥塑十八罗汉。1938年遭日军破坏，1949年县委迁入办公，寺余建筑尽毁，独存此殿，1986年省拨专款用木七十余方修缮一新。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（82岁，清丰东街老木匠，1960年代见过完整中心阁）：\u003cbr\u003e&quot;那中心阁是真气派——千根木柱子撑着八角顶，上面雕梁画栋。我小时候爬上去过，伏魔圣像就在上面坐着。文革时差点被砸，几个老木匠偷偷把圣像拆了藏起来才保住。现在阁重新修了，比以前差点意思，但架子还在。我还能认出当年的木料——那根大梁是我师父的师父做的。&quot;\u003c/p\u003e"}, {"n": "洛阳老城·从都城缩到府城的活化石", "s": "洛阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e隋大业元年（605）建隋唐东都，外郭城周长约二十七公里，洛水横贯。金兴定元年（1217）金宣宗在隋唐东城旧基上筑新城，面积仅为隋唐外郭城的二十分之一，设四门：东建春、西丽景、南长夏、北安喜，即今老城前身。明洪武六年（1373）砌以砖石。民国28年（1939）老城城墙拆除。2002年复建丽景门，初名丽京门，2009年考据后改回丽景门。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e站在丽景门门洞下往西看，是不足十米宽的西大街，青砖灰瓦硬山顶铺面；往东看，是明万历年间从府前街移建来的鼓楼砖石拱门。这一里多地，就是隋唐东都缩到二十分之一后的金明清府城——走完它一刻钟，走完隋唐外郭城要两小时。\u003c/p\u003e\u003cp class=\"main-text\"\u003e丽景门：2002年在金兴定元年西门原址复建，城门楼高约三十米、城墙宽约十余米，钢筋混凝土芯外包青砖，登城收费。；东西大街：明清府城主街，全长约一公里，宽不足十米，青砖灰瓦铺面，电动车行人混行。；鼓楼（谯楼）：东大街上，明万历四十二年（1614）因建福王府由府前街移建至此，钟鼓楼合一，砖石拱券门洞可穿行，清代两次大修。；河南府文庙：文明街中段，金元始建、明嘉靖六年重修，沿中轴线台阶式抬升，依次为琉璃陶塑彩龙壁、棂星门、泮池石桥、戟门、大成殿。戟门面阔三间、进深二间，悬山顶，前后檐斗拱犹存金元遗法。大成殿单檐歇山绿琉璃瓦顶，面阔五间，雄踞青砖月台之上，台周阶条石压护，御道青石浮雕祥云二龙戏珠长两米三、宽一米五。琉璃龙壁与山门今已不存，2026年正在院落环境整治。；洛阳周公庙：定鼎南路东侧，隋末唐初王世充草创，明嘉靖四年在原址重建，现存定鼎堂、礼乐堂、先祖堂沿中轴线排开，古柏合围，为洛阳城内现存较早的明清祠庙组群。；妥灵宫：文明街东端，坐西朝东，门楼、卷棚、大殿三间仍在，传曹操葬关羽首级处，被视作国内最早关庙之一，明清重修碑记嵌在墙里。；洛阳山陕会馆：九都东路，清代康雍间晋陕商人所建，坐北朝南，不设正开大门，只东西两座仪门，琉璃照壁横亘二门之间。照壁高七点六米、宽十三点二米，下承青石须弥座，上覆硬山绿琉璃瓦顶，壁身北面用彩色琉璃砖拼出二龙戏珠，外绕缠枝牡丹，人物头部多已残缺，露出内里灰砖。山门门额刻河东夫子四字，拜殿面阔五间、进深三间歇山高台，殿内清代早期点金彩绘为中原面积最大、保存最完好者。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文峰塔：洛邑古城内，北宋始建、明末毁于战火、清初重建，密檐式青砖方塔九层，高约三十米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵师傅（65岁，西大街开了25年寿衣花圈店的老板）：\u003cbr\u003e&quot;我这条西大街，一半是游客，一半是老洛阳人。游客从丽景门进来往东走，走到十字街就拐去夜市吃水席了，没人再往我这西边走。但老街坊知道——要买寿衣还得回来找赵师傅。这西大街静，安静得能听见隔壁下棋的落子声。我25年没搬过店，这儿就是我的根。&quot;\u003cbr\u003e▌小张（28岁，汉服租赁店老板娘，东大街打工3年）：\u003cbr\u003e&quot;我刚到洛阳的时候以为丽景门是唐代的，后来才知道2002年才建的。但这不重要——站在丽景门洞里往西看，西大街的青砖灰瓦，往东看鼓楼的砖石拱门，两个门洞之间压缩的就是这座城一千年的历史。穿汉服拍出来特别有感觉，每天都能接到十几单。&quot;\u003c/p\u003e"}, {"n": "偃师老城·1935年被洛水淹没的城", "s": "偃师", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e前1046年 武王伐纣在此筑城息偃戎师，偃师得名。秦汉 置偃师县，治今城关镇老城村。明正德六年（1511）知县朱璟重修土城。崇祯十五年（1642）知县夏士誉改土城为砖城。清顺治九年（1652）知县魏惟紫重修。民国24年（1935）夏洛河暴涨，老城被淹，房屋倒塌殆尽，县长杨兆钫被渔船救出，上海《晨报》以偃师陆沉报道。民国25年（1936）士绅募捐在槐庙北槐荫寨半山坡建新城。1950年代中期 火车站扩建扒南城墙。1982年 洛河再发大水，新老城均遭灾。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e偃师老城村现在就是洛河北岸一片庄稼地。1935年夏洛河暴涨，整座城一夜之间成泽国，县长靠渔船连夜逃出，上海《晨报》以偃师陆沉为题报道。如今村西北、东北角还剩几段夯土残垣，一下雨就冲出老城砖。\u003c/p\u003e\u003cp class=\"main-text\"\u003e老城残垣：城关镇老城村西北、东北角，1935年水灾后残存的夯土城墙，地面无重要文物。；玄奘故里：缑氏镇陈河村，玄奘法师故里，现存明代重修玄奘寺、唐僧墓。；四奇地名：北墙根平地三孔窑、西堤百步两孔桥、西街一步两眼井、三官庙三柏一顶，地名仍在。；名人路名：今市区街道以许远、玄奘、杜甫、武亿、苌弘命名。；滑国故城：府店镇滑城河村台地，城垣屈曲呈弧形，平面略作长靴形，南北长约两千米、东西宽约一千米，三面临深涧以崖代墙。夯土城墙断断续续时隐时现，土层中夹战国陶片与布纹瓦，断崖上筒瓦板瓦瓦当棱角外伸。城北通滑城河半坡上尚存清道光十七年砖石城门一座，门洞上方刻古滑城三字。2026年南城墙与东北城门正实施保护加固。；刘国故城：寇店镇陶家村东北，南墙夯土分东西两段横在断崖上，东段百三十余米、厚约二十五米，墙外护城壕旧道仍可辨认，城内散落春秋陶片。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e偃师商城遗址：市区西洛河北岸，商汤灭夏后所建西亳，大城套小城、小城围宫城三重叠压。城址南北长约一千七百米，南墙被洛河冲毁，现存西墙一千七百一十米、北墙一千二百四十米、东墙一千六百四十米，夯土多埋地下一至三米。宫城在小城南部正中，边长两百余米，四周厚约两米夯土围墙，内部分南部宫庙、中部祭祀、北部御苑三区，御苑人工池塘东西长一百三十米、南北宽二十米。今辟遗址公园，二、四号宫殿基址已覆土复原。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董大爷（82岁，老城村村民，亲历1935年大水，当时6岁）：\u003cbr\u003e&quot;那天下大雨，三天三夜没停。洛河涨得快，眨眼就漫上城墙了。我爹抱着我爬到城墙上的树洞里，就听底下哗哗响——房子被冲倒的声音。后来爹找了块门板，我趴在上面漂了半天，被上游过来的渔船接住。现在老城村那块地，一下大雨还能看见城砖。&quot;\u003c/p\u003e"}, {"n": "孟津老城村·黄河5次改道的迁徙史", "s": "孟津", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e金天眷三年（1140）河清县改名孟津县，治今会盟镇花园村东北桃花店。元代 黄河暴涨，县城西迁五里至永安堤。明嘉靖十四年（1535）黄河泛滥冲毁永安堤城，迁于会盟镇老城村。崇祯九年（1636）知县张尔葆改土城为砖城。清顺治四年（1647）知县宋弘道补修，建城楼四座。1959年9月 县治从老城村迁入长华新城，老城村结束四百二十七年县治史。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e会盟镇老城村距今孟津城区二十二公里。从金代到明嘉靖，孟津县城被黄河逼得搬了五次家，最后一次在这儿落脚，一直住到1959年。村里最气派的是明末清初大书法家王铎的故居，前后院落带八十亩后花园；村西两公里是汉光武帝刘秀陵。\u003c/p\u003e\u003cp class=\"main-text\"\u003e王铎故居：明清大书法家王铎宅第，省保、AAA景区，前后院落约两千六百平方米，后花园八十亩，藏王铎书法刻石。；会盟古渡口：老城村北黄河岸边，武王伐纣渡河盟誓处（盟津渡），渡口遗迹尚在。；汉光武帝陵：老城村西两公里白鹤镇铁谢村，东汉刘秀与阴丽华合葬墓，南依邙山、北临黄河，枕河蹬山一反帝陵常规。由神道、陵园、祠院三部分组成，陵冢夯土高约二十米、周长约四百九十米。园内现存隋唐植柏一千四百五十八株，聚植一园，其中二十八株高耸称二十八宿，柏体杏香为国内仅有的乔木佳品。；老城街巷：明清十字街格局尚存，城墙残段隐于村舍间。；拟山园帖石刻：王铎故居内，王铎次子王无咎遵其遗命，从其晚年书作中遴选出七十九幅近两万字，延请刻手张翱精雕，历时九载（顺治八年至十六年）勒成九十方汉白玉，每方长八十七厘米、宽二十五厘米，十卷一百零三件作品，嵌于王氏家祠北屋壁面。行草雄浑，至今拓片可传，2023年入选国家文物局第一批古代名碑名刻文物名录。故居院落为1998年依古制复建，唯此九十方刻石是真物。；龙马负图寺：会盟镇雷河村，东晋始建，现存伏羲殿、文王殿、山门沿中轴排开，院内明代龙马负图碑石仍立，传伏羲据河图画八卦处。；扣马夷齐祠：会盟镇扣马村黄河岸，传伯夷叔齐扣马谏武王处，村巷口小祠三间尚存，古柏两株遮院，残碑嵌壁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王奶奶（78岁，王铎同宗后人，在老城村住了一辈子）：\u003cbr\u003e&quot;我家就在王铎故居隔壁。小时候那故居是王家后人住着，后来收归公了。王铎那字写得真是绝了——他一天能写一万字，而且&quot;神笔王铎&quot;不是白叫的。文革时候故居差点被砸，老村长连夜组织人把王家祖宗牌位藏起来才保住。现在每年都有人来拍照。&quot;\u003c/p\u003e"}, {"n": "新安县·杜甫《新安吏》的汉函谷关", "s": "新安", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦庄襄王元年（前249）置新安县，属三川郡。西汉元鼎三年（前114）楼船将军杨仆把函谷关从灵宝迁至新安，汉函谷关自此为两京咽喉。隋仁寿四年（604）县治从义马西南迁阎韩城（今新安老城）。明天启年间 汉函谷关城楼毁于兵燹。清同治十二年（1873）重建，1923年复毁后张钫重修。1923年 康有为游铁门镇，为张钫花园题额蛰庐。1935年 张钫建成铁门镇城墙及七个城门。2014年 汉函谷关随丝绸之路列入世界遗产名录。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e铁门镇离新安县城不远，张钫蛰庐的十五孔窑洞里嵌着上千方唐代墓志——狄仁杰为好友写的绝笔、武则天造的十九个怪字，全在墙上。出县城往东，杨仆把函谷关从灵宝挪到这儿，现存关楼是1923年张钫重修的，两侧夯土关墙还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e千唐志斋：铁门镇张钫蛰庐内，1935年前后张钫收集邙山出土墓志，在花园内筑十五孔砖拱窑洞、三个天井院，将一千余方志石分排嵌于窑壁与走廊墙上，章炳麟题额。其中狄仁杰撰书的袁公瑜墓志（久视元年）是现存唯一可考狄公亲笔；近百方武周墓志上完整保留武则天所造十九字，除曌字外皆不见于字书。张钫自撰门联谁非过客、花是主人。；张钫故居：铁门镇，省保，三进院落豫西民宅。；铁门镇城门：1931年建，七个城门，于右任题铁门镇，北额凤舞、南额龙飞。；洞真观（王乔洞）：铁门镇玉梅村烂柯山，元代道教宫观，三进院落坐北朝南，山门、三清殿、玉皇殿沿轴排开，崖壁另凿王乔等五窟，宋金至明清碑刻六十余通夹在观内。；西沃石窟：原黄河南岸北魏摩崖，因小浪底蓄水迁至新安县城就近保护，佛龛、佛传浮雕仍可细辨，为黄河岸边少见的北魏中小型石窟。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汉函谷关：城关镇东关村，丝绸之路世界遗产点。现存关楼为1923年张钫重修，砖石结构三层，下层平坛高约九米、南北长二十五米、东西宽二十米，坛下中部辟拱形东西通道，西门洞横额汉函谷关四字为康有为所题；中层四面相通呈十字形。关楼与东侧鸡鸣台、望气台两座阙台呈H形分布，中间宽约五十米为通关古道，南北夯土关墙沿山对峙。1958年大炼钢铁时关楼再遭损毁，今残高约十五米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张主任（70岁，千唐志斋博物馆退休馆员，守了一辈子墓志）：\u003cbr\u003e&quot;我1975年进馆，那时候馆里就一个看门老头，千唐志斋窑洞差点被当仓库。后来慢慢修复，1996年评国保，2024年新展区开放。狄仁杰那方墓志是镇馆之宝——他为好友娄师德写的绝笔，当时他自己也快病死了。武则天那19个字，&#x27;曌&#x27;字最有名，其他18个在任何字典里都找不到，只有在这儿能看到。&quot;\u003c/p\u003e"}, {"n": "宜阳·锦屏山下的船城", "s": "宜阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国 韩景侯迁都阳翟后在宜阳置西部重镇。前308年秦克宜阳。隋开皇四年（584）始建寿安城（今老城前身）。明景泰元年（1450）知县康健增筑土城。明正德十三年（1518）知县司牧以砖筑城，城周约二公里，平面如船，俗称船城。明万历四十年（1612）知县在城垣高处另开小东门，避洛河水浸入城。清咸丰十年（1860）四面城墙建空心敌台八座。建国后城墙拆毁。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e宜阳老城是豫西少见的船形城——南北长、东西窄，锦屏山十二峰在城南一字排开，像挡风的屏风。城墙早拆了，南门挹秀门只剩半截，小南门通贤门的单拱青砖还完整；城西二十五公里韩城镇东，战国韩国故城的夯土墙高出地面三到八米。\u003c/p\u003e\u003cp class=\"main-text\"\u003e锦屏山：城南十二峰，夕阳、太狮、文笔、玉柱等，最高峰玉柱峰，武则天赐名锦屏奇观。；通贤门：城南小南门，单拱青砖筑成，保存较完好。；挹秀门：原南门，仅存下半部，上部已后世改建。；凝瑞门：城西偏门遗迹。；韩都故城（韩国故城）：城西二十五公里韩城镇东，国保第七批，郭城夯土城墙东、北两面残高三至八米，夯层约二十厘米，护城河遗迹可见。；城隍庙：中街学校内，明嘉靖三十七年建，明代遗存。；福昌阁：城西福昌村西南崖头，建在约三十米高的夯土台地上，正南与东西两侧以一百二十余级青石阶叠涩直上台顶。主殿重檐歇山式，面阔五间，黄绿琉璃瓦覆顶，四角挑檐悬钟，门楣悬福昌宫匾；阁东西两崖就山壁凿出吕祖、华佗、老君、鲁班、药王等数十孔神龛，儒释道诸像同处一台，人称豫西小布达拉宫。现存为明代遗构，清嘉庆二十四年重修。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e五花寺塔：三乡镇连昌河西岸汉山脚下，八角九级密檐砖塔，残高三十七点二米，底周长约三十二米，塔基用条石铺砌。塔身微微向东北倾斜约一米二，当地称洛阳比萨斜塔。一、二、三、四、六层正南设门，二层为真门，门两侧砖刻力士、菩萨浮雕，衣纹流畅；塔心室东侧原可旋登而上，今通道已毁。历史上从无维修记载，1994年地宫被盗，2017年方搭架大修。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李老汉（75岁，韩城镇农民，韩国故城旁边住了一辈子）：\u003cbr\u003e&quot;我家地就在夯土墙边上——那土真硬，比石头还硬。小时候我爬城墙，从上往下跳，摔在夯土上也不疼。城墙缝里长酸枣树，我常摘酸枣吃。现在那遗址立了国保碑，不让爬了，立了铁栏杆。&quot;\u003c/p\u003e"}, {"n": "洛宁老城·千年不挪窝的永固城", "s": "洛宁", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e前秦建元年间（370-384）苻坚筑永固城，城以其字为名。隋义宁二年（618）改熊耳县为永宁县，治永固城。唐 永宁县多次迁徙。北宋咸平四年（1001）迁回永固城。明景泰元年（1450）知县重修土城，三座城门：东迎恩、西普安、南中和。崇祯六年（1633）李自成义军炸开北城墙。清同治年间砖石修补。1947年 东城门和炮楼被炸毁。1958年 城内大石牌坊拆除。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e洛宁老城一千四百年没挪过窝——前秦苻坚字永固，在洛河边筑了永固城。城墙早平了，可走到老城东南角，那座高约十八米的砖砌聚魁楼还立着：底层正方形、二三层八面棱柱、顶上八棱锥尖顶圆球。城北明代城隍庙的山门舞楼献殿一进进穿过去。\u003c/p\u003e\u003cp class=\"main-text\"\u003e文庙：城内，明始建，近年修缮，琉璃龙壁、棂星门、大成殿。；书形格局：老城平面以文昌路为轴形如翻开的书，街巷格局仍可辨认。；香山寺：罗岭乡罗岭村西山坳，东汉永平年间始建，现存三十六间殿房沿中轴线排开，正殿大佛殿内儒释道三教始祖同坐，院内两株千年古柏斜出檐外。；仓颉造字台：兴华镇阳峪河东侧半山腰，台地黄土仍存，传仓颉据洛书造字处，今立标识碑，山下阳峪河绕台而过。；张家大院：老城西南明清街区，清代豫西富商宅第，三进四合院青砖到顶，木雕隔扇与石门枕仍在，院砖缝长瓦松。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e聚魁楼（魁星楼）：老城东南隅东关村，清顺治十四年知县程玚重建，四层砖砌塔式结构，高约十八点二米。楼基为砖砌长方形高台，长十三点一米、宽十二点四米、高三点二米，北面砌石阶登正门，周围回檐走廊。一、二层正方形，二、三层间飞檐已毁；三、四层为八面棱柱，每层东西南北各开小拱门；顶砌八棱锥体，锥尖固定一圆球。每层门两侧砖刻对联：一层人能为我存心、天必赐汝以福，横批文光普照；二层肇启斯文盛、崇封祀典隆；三层金鳌辉紫霭、银管点青云，横批聚魁楼。；城隍庙：老城兴宁街北，元至正四年建，明洪武三年、清乾隆五十三年复修，现存山门、正殿、后殿及回廊共三十七间。山门面阔三间、进深二间，单檐悬山，用北方少见的穿斗式，斗拱形式繁复；正殿面阔五间，单檐歇山重拱重昂；后殿面阔五间单檐硬山。院中碑碣夹道，旧时辕门、南北戏楼、六角石柱亭多已毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王会计（68岁，洛宁县志办退休，在老县城住了一辈子）：\u003cbr\u003e&quot;我小时候还见过北城墙——夯土的，上面长满酸枣树。后来大跃进被扒了烧砖炼钢。那座魁星楼是我从小爬到大的——上面有木梯，登上去能看见全城。1958年差点被拆，几个老木匠把木梯拆了藏起来才保住。现在修复了，比当年还好看。&quot;\u003c/p\u003e"}, {"n": "陕州老城·陕西之名的起点", "s": "陕州", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周初 武王封神农之后于焦。周公召公以陕塬为界分陕而治，陕西得名。秦孝公十年（前390）置陕县。北魏太和十一年（487）改置陕州。明洪武元年（1368）大规模整修，四城门：宣威、迎恩、政平、宣化。明崇祯八年（1635）寇毁城后重修，城围缩为九里余。清光绪十三年（1887）修护城拦河大堤，东、西、南三面城墙砖砌。1957年 三门峡大坝动工，陕州城属淹没区，群众完成迁移；后因方案调整免于淹没，但已成废墟，城砖陆续拆走。2000年 陕州故城公布为河南省文物保护单位。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e三门峡市区西南的陕州公园，就是当年陕州城的废墟——1957年说要淹，全城搬空，后来说不淹了，回去城砖早被拉光，只剩一座金代的宝轮寺塔立在东南隅，拍掌叩石能听见蛤蟆叫。塔旁还有一座明代石牌坊。\u003c/p\u003e\u003cp class=\"main-text\"\u003e陕州故城夯土城墙：汉代古城址，省保，东西约一千二百米、南北约一千九百米，东城墙南段近年获省文物局批准立项修缮。；地坑院：庙上村一带，地平线下的生土窑洞院落群，国家级非遗。；石壕古道：崤函古道石壕段，世界遗产，杜甫经此写《石壕吏》。；安国寺：西李村乡元上村，背倚瑞云山、面临永昌河，始建于隋，殿堂覆彩釉筒瓦，俗称琉璃寺。以一道高约四米火墙分前后两院，山门单檐硬山面阔三间，门额清嘉庆六年香云结彩砖雕，两侧墙壁砖雕龙凤壁画，正门外石蹲狮二；火墙正中门楼顶部作中空楼阁，为防火藏经所设，门侧嵌明隆庆四年重修碑。前、中、后佛殿及经房禅房多为明清遗构。；空相寺：西李村乡熊耳山下，东汉永平年间始建，与白马寺同期，达摩圆寂后葬此，院内达摩塔砖构尚存，唐宋元碑碣夹道。；姚崇故里：陕州区张茅古镇，唐初名相姚崇籍里，老街旁姚崇故居旧址立碑，崤函古道穿镇而过，老槐树残干尚在。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e宝轮寺塔：陕州故城东南隅，金大定十七年僧人智秀在隋木塔旧址上重建，十三级叠涩密檐式砖塔，塔门南向、平面正方形，高二十六点五米、围二十一点六米。正面刻三圣舍利宝塔塔铭，塔身自下而上逐层收分，外轮廓呈抛物线形，用菱角牙子砖和叠涩砖层砌出塔檐；每层辟半圆形拱券门、佛龛、窗洞，翼角下原悬铁风铃铎。塔内有塔心室。寺已早毁，唯塔独存，塔周数丈内击掌叩石，回声呱呱如蛤蟆叫。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，原陕州城居民，1957年搬迁亲历者）：\u003cbr\u003e&quot;我家原来就在北门宣化门边上，三间土坯房，院子里有棵老槐树。1957年一说要淹，全家人扛着包袱往西走——搬到温塘村那边。后来听说不淹了，但回去一看，城已经成废墟了——城砖被拉去盖办公楼、学校。那座宝轮寺塔我小时候常爬，现在塔还在，我家老槐树早没了。&quot;\u003c/p\u003e"}, {"n": "灵宝老城·紫气东来的函谷关", "s": "灵宝", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西周 始建周秦函谷关，关在谷中深险如函。秦庄襄王 置函谷关校尉。老子骑青牛过此，关令尹喜请著《道德经》。汉元鼎三年（前114）杨仆迁函谷关于新安，原关称旧关。曹魏正始元年（240）弘农太守孟康在弘农涧河西岸筑魏函谷关。隋开皇十六年（596）置桃林县，将三清殿圈入县城。唐天宝元年（742）因在函谷关掘得灵符，桃林县改名灵宝县。明景泰元年（1450）重建灵宝县城。1923年 康有为为魏函谷关题天下为公。1960年 三门峡大坝落闸蓄水，魏函谷关和灵宝故城被淹；1962至1978年大坝降为中坝，水位下降，关城出露但已为泥沙覆盖。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e灵宝函谷关景区在稠桑塬下，关楼是1992年按原图复建的，可古道还在——车辙印在黄土峡谷里压了两千年。关令尹喜当年望见紫气的望气台、孟尝君门客学鸡叫的鸡鸣台都在景区里。真正老的是太初宫，主殿元明原构，老子骑青牛在这里写下五千言。\u003c/p\u003e\u003cp class=\"main-text\"\u003e函谷关关楼：景区内，1992年按古关图复建，秦汉式城楼，登楼可见深险如函的峡谷。；函关古道：周秦函谷关遗址内，东起弘农涧河桥、西至王垛村，全长七点五公里，穿行于稠桑塬下黄土峡谷，两侧绝壁陡起，最窄处仅两三米，古书上说车不方轨、马不并辔。谷底青石路面留存两千余年车辙凹槽，最深处近十厘米，关城东侧断面可见十一层板筑夯土，每层约十五厘米，最底层掺麦秸草筋。今非景区段仍开放，游人可徒步穿行。；太初宫：古道中段沟沿南，坐北面南，面阔三间、进深三间，长十一米、宽九米，硬山庑殿式。现存主殿保留唐、元、明、清四代构件，中间脊梁板下题记大明嘉靖十九年建，前二梁记大清雍正三年重建。殿顶飞梁纵横、椽檩参差，殿宇宽阔中无撑柱，殿脊与山墙檐边塑麒麟狮虎鸡狗等走兽。院内立元大德四年、清顺治十年重修碑各一通，殿内供老子著经坐像，壁间写《道德经》全文。；望气台、鸡鸣台：景区内，分别对应紫气东来、鸡鸣狗盗典故。；魏函谷关遗址：黄河南岸，1960年三门峡蓄水淹没，水退后仅余六号铁路隧洞东口残迹，被泥沙淤去大半。；黄帝铸鼎原：阳平镇荆山之下，国保，传说黄帝采首山铜铸鼎处，塬上仰韶至龙山大型聚落层层叠压，唐轩辕黄帝铸鼎原碑仍在。；西坡遗址：铸鼎原上，仰韶庙底沟期大型中心聚落，房屋门道一律朝中央广场，向心式布局国内罕见，已局部发掘出大房基址。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孙老汉（78岁，函谷关镇王垛村农民，在周秦函谷关边上住了一辈子）：\u003cbr\u003e&quot;我家就在周秦函谷关边上的半山坡上——往东能看见崤函古道，往西是稠桑塬。那周秦关我小时候常爬——关楼是土夯的，后来塌了。魏函谷关在北边5公里，60年被淹了，后来水退下去，关楼没了，只剩个铁路隧洞口子——泥沙淤了大半，现在只剩2米高。你看那隧洞，上面还长着枣树。&quot;\u003c/p\u003e"}, {"n": "卢氏·2300年没改名没迁城的活化石", "s": "卢氏", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国韩宣王七年（前319）始置卢氏县，有七年卢氏令戈出土。汉武帝元鼎四年（前113）再置卢氏县，属弘农郡。明洪武元年（1368）知县李可民重修土城，四门：东文华、西平理、南望洛、北仰恩。崇祯六年（1633）李自成义军炸开北城墙。清康熙十三年（1674）知县尚天禄建城楼四座。同治元年（1862）捻军两入卢氏，知县弃城。同治二年（1863）知县秦家驹修砖城，一年竣工，时称小洛阳。1932年 山东匪首刘桂棠攻城三日不下。建国后城墙陆续拆除，西墙拆成新建路，南城壕填平建洛滨路。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e卢氏从战国韩宣王七年置县，两千三百年县名没改、城址没动。城墙早拆了，西墙位置成了新建路，南城壕填成洛滨路。可中华街北边那座元代奠基的城隍庙还在——山门、舞楼、献殿、正殿一进进穿过去，献殿重檐歇山顶压在两米多高的台基上。\u003c/p\u003e\u003cp class=\"main-text\"\u003e卢氏城隍庙：中华街路北，国保第七批，元末始建、明洪武元年重建，明天顺至成化间再修，今存山门、舞楼、献殿、正殿及东西廊房四十一间，占地约两千一百平方米。山门临街，单檐歇山顶，面阔三间进深二间，前后檐斗拱层叠如莲，两侧琉璃门楼镶九龙壁浮雕。舞楼高约十五米，歇山顶转角高台二层。献殿古称香祭亭，建于一米多高台基上，重檐歇山顶，面阔三间，十九条彩色琉璃脊纵横交错。正殿面阔五间进深三间，五脊宫殿式。大木构件多存明代成化原构。；清真上寺：城内，清乾隆四十三年（1778）建，豫西最大清真寺，前后两进，六角高楼。；魁星楼：城内，明代砖砌楼阁。；四门地名：北门仰恩、东文华、西平理、南望洛，地名叫北街、东街、西街、南街。；卢氏古县衙：中华街南侧，与城隍庙隔街相对，明清县衙旧址，今为县委机关所在，原大堂二堂格局犹存，门前石狮一对守街。；瓮关村史家大院：官道口镇瓮关村，清代豫西民居大院，青砖黛瓦三进院落，木雕门楣与石台阶尚存，为豫西传统民居标本。；红二十五军长征过卢氏旧址：官坡镇兰草村，一九三四年红军长征途经所留老屋，土墙瓦顶仍在，院内立说明碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌尚允康（85岁，卢氏籍作家，写过《卢氏烟云记忆》，小时候见过完整砖城）：\u003cbr\u003e&quot;我7岁那时候还爬城墙上玩——城墙是青砖的，3丈高，四个角有炮楼。北门仰恩门我常从门洞钻过去——洞里装着两层铁皮包的城门，特别厚。1958年大跃进开始拆，先拆西墙，拆下来的砖拉去盖炼钢厂。我爹那时候当会计，亲眼看见的，回来跟我说心疼得直掉眼泪。现在只有城隍庙和清真寺还在——那是文保单位，没拆动。&quot;\u003c/p\u003e"}, {"n": "渑池·仰韶文化发现地的秦赵会盟台", "s": "渑池", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e前283年 秦昭襄王与赵惠文王会于渑池，蔺相如逼秦王击缶。1921年 瑞典安特生、中国袁复礼发掘仰韶村遗址，命名仰韶文化。1938年11月 刘少奇在渑池兵站撰写《论共产党员的修养》，驻留五十六天。1941年 卫立煌重修会盟台并撰文。1985年 渑池县政府重建会盟台。2022年 仰韶村遗址入选第四批国家考古遗址公园。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e渑池县城北韶山脚下，仰韶村那片台地就是中国考古学的出生地——1921年安特生第一次科学发掘，把这类彩陶命名为仰韶文化。站在台地上，脚下黄土层里夹着七千年前的红陶片。城南一公里，是蔺相如逼秦王击缶的秦赵会盟台。\u003c/p\u003e\u003cp class=\"main-text\"\u003e仰韶村遗址：仰韶镇仰韶村南韶山前台地，国保第一批、国家考古遗址公园，东北至西南长九百余米、西北至东南宽三百余米，文化层厚二至四米，跨仰韶、龙山两期。探方断面切开，最上层明清瓦砾、中间商周灰陶、最底层黄土里嵌着红陶片。仰韶文化博物馆外观如倒扣陶罐，馆藏小口尖底瓶、人面鱼纹彩陶盆（复制品，原件藏国博）等一万六千余件，以红底黑彩为调。；中共渑池兵站旧址：刘少奇旧居，豫西长条二进四合院，刘少奇在此写《论共产党员的修养》。；赵沟古村：千年石头村，石墙石板路，古槐古镜泉完好。；冯异故城：仰韶镇礼庄寨村西，东汉建武三年冯异与赤眉军交战所筑残城，只筑南、北、西三面便停，东墙始终未起，墙基宽约二十米、残高约二十米，半截城垣戳在田边。；云门寺：县城北韶山主峰南山坳，唐代始建，崖壁金代云门禅院题刻尚在，寺周石塔群散落坡地，殿宇后世重修，望山如门悬云中。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e秦赵会盟台：县城西南渑水与羊河交汇处，1941年卫立煌、章士钊倡议重修，台顶立四棱锥碑塔，高约两米、每面宽三十八厘米，东面蒲城寇遐隶书古秦赵会盟台六字。文革中护台基石与四面台阶被拆，唯碑塔残存。1985年县政府原址重建，总高二十二米，夯土台体十四米，东西各铺五十二级青石阶，台顶双层八角挑檐碑亭覆金琉璃瓦、红柱回廊，栏板浮雕完璧归赵故事。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（75岁，仰韶镇退休文化站长，守仰韶村遗址40年）：\u003cbr\u003e&quot;我20岁参加工作，就在仰韶村遗址边上。1980年第三次考古发掘，我给考古队做饭——那时候考古队条件苦，帐篷搭在田野里。出土的彩陶盆、小口尖底瓶，我亲手摸过。2021年是仰韶文化发现100周年，我儿子带我去博物馆看，那个彩陶鱼纹盆真漂亮——7000年了，颜色还那么鲜亮。我一辈子就守这个遗址，值了。&quot;\u003c/p\u003e"}, {"n": "义马·秦汉新安故城的千秋古镇", "s": "义马", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦庄襄王元年（前249）置新安县，治今义马西南。汉元鼎三年（前114）杨仆迁函谷关于新安县城，义马故城降为一般县城。北魏 千秋亭驿开始形成。隋仁寿四年（604）新安县治迁往阎韩城，义马故城废弃。北宋景祐四年（1037）改千秋镇为延禧，民间仍呼千秋。明清 千秋镇成崤函古道重要驿站。2019年 秦汉新安故城入选第八批国保。（以上为T14大批次12县正文）。（以下为T15大批次12县正文·豫西南南阳）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e义马市区西南两公里，下石河社区那片庄稼地下压着秦汉新安故城——两京古道从城中间穿过去。城东南的千秋古镇还留着四百多所明清瓦房，涧河对岸仙崖山上有北魏石窟石佛。\u003c/p\u003e\u003cp class=\"main-text\"\u003e秦汉新安故城：市区西南下石河社区，国保第八批，东西约五百米、南北约六百九十米，崤函古道沿东西从城中穿过。文化层厚一至三米，地表翻耕后可拾到陶水管、绳纹筒瓦、半瓦当，断崖上夹着春秋至汉代陶片。隋仁寿四年县治迁走后城址废弃，今大部压在庄稼地下，仅立国保碑。；千秋古街：城东南崤函古道上，明清老街尚存四百余所砖木瓦房，青瓦灰墙高低错落，二百多户老人守着。街旁李家大院自东至西由五套四合院组成，人称五过庭，清咸丰初年建，台基、构架、门窗保存尚好，院门砖雕与木雕隔扇仍在。2009年前后陇海铁路改线后老街渐冷，今晨仍有老人在街门口下棋。；仙崖山石窟：千秋古街南涧河对岸，北魏太和元年（477）石佛。；杨仆故里：铁门镇南湾村，西汉楼船将军杨仆故里。；楚坑遗址：二十里铺西李杏湾，俗称万人坑，东西长约四百米、南北宽约二百五十米的一处洼地，南临涧河北依土岭，传项羽一夜坑秦降卒二十万处，1912年修陇海铁路曾挖出累累白骨。；慈禧行宫：二十里铺下石河村，清光绪二十七年慈禧自西安回銮所建行宫，原前院后宫，2000年遭火焚，今仅余残垣断壁与旧础石。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌周老汉（80岁，千秋古镇老居民，在老街住了60年）：\u003cbr\u003e&quot;我家那房子是明朝传下来的——三进院子，青砖院，我爹说那是杨仆后人的房子。我小时候在院墙上刻字，现在那刻痕还在。千秋街原来有3000多人，后来陇海铁路改线，镇就慢慢冷清了。现在老街还住着200多户，年轻人都出去打工了，就剩我们这些老头老太太守着老房子。我每天早上在街门口下棋，下到中午回家吃饭，下午再出来——日子慢得像磨盘。&quot;\u003c/p\u003e"}, {"n": "南阳老城", "s": "南阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉 宛为全国五大都会之一。东汉 为南都陪都。明洪武三年（1370）卫指挥郭云重修府城，甃砖。清同治二年（1863）知府傅寿彤建梅花寨，四门外各筑独立寨堡，形若梅花。建国后城墙外城渐拆，南寨墙因对白河防汛有用得以保留。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走到南阳老城，民主街中段那片清代府衙一百多间房沿中轴线排开。再往南到梅城公园，梅花寨的夯土南寨墙上嵌着永庆门，门额金堤巩固四字清清楚楚。老城东北隅防爆研究所附近，汉宛城的夯土高台明远顶还高出地面近十米。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汉宛城残墙（明远顶）：城区东北隅医圣文化园东南、温凉河西岸，一处平夯堆筑的高台，南北长四十六米、东西宽四十四米、残高约九米，台顶暴露大量汉代砖瓦陶片，当为宫殿基址。另一处望仙台在人民公园内，东西长八十米、南北宽七十米、残高约九米，地表亦散汉瓦。北墙残段残长八百米、高出地面四至六米，夯层中夹汉代陶片。；梅花寨南寨墙：梅城公园内，现存约三百米夯土残段（原绵延约九百七十米），永庆门额金堤巩固、大寨门额淯流锦带，寨墙夯土可见层。；南阳府衙：民主街中段，国保第五批，现存清代建筑一百四十余间沿中轴线排开。大堂面阔五间、进深三间，通面阔约二十米，单檐硬山筒瓦顶，五架梁对前后双步梁，明间减前金柱作减柱造，内部开敞。大堂前卷棚与大堂同建在高约一米二青石台基上，堂前悬公廉匾，为清咸丰间五任南阳知府顾嘉蘅所书。仪门、大门、二堂、三堂依次抬升，1980年代从县委大院迁出辟博物馆。；四经四纬古巷：共和街、新华路、联合街、民主街为纬，光复路、工农路、和平街、民权街为经，八十一条古巷格局沿自明清。；护城河水系：近年完成数公里河道驳岸整治，桥梁修复十余座。；医圣祠：城东温凉河畔，东汉张仲景墓祠所在，大殿、拜殿、仲景墓沿中轴线排开，春台亭秋风阁环墓，墓前清代医圣碑立。；南阳武侯祠：城西卧龙岗，魏晋始建，元明清木构殿宇沿岗坡层层抬升，岳飞夜出师表手迹碑刻嵌在廊壁，为历代祀诸葛正祠。；察院：民主街中段，明清省级科举考棚衙署，硬山房舍沿轴线尚存，与府衙隔街相望。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘老爷子（78岁，民主街老居民，府衙旁住了50年）：\u003cbr\u003e&quot;我小时候府衙里还住着干部呢——那时候是县委大院。1980年代才搬出来当博物馆。我爷爷说他民国时候在府衙门口摆地摊卖馄饨，一碗两文钱。那时候光复路还叫长春街，青石板铺的。我家老屋在明伦巷，1990年翻修过一次，但地基还是明朝的——我刨院子的时候刨出个明代的瓷碗底，后来捐给府衙博物馆了。&quot;\u003c/p\u003e"}, {"n": "镇平老县城", "s": "镇平", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e金哀宗正大三年（1226）设镇平县，县名沿用八百年。明成化六年（1470）知县李贤筑土城。明末 知县钟其硕增筑营房、敌台。民国20至23年（1931-1934）四次重修砖城。2020年后 镇菩路打通，老城墙残段被楼盘包围。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e镇平老城现在被中央华府一片新楼盘围着，镇菩路从老城中间撕开一道口子。可黉学大殿还孤零零立在钢筋楼群里，城隍庙、太极观的老房子守在路两边。北依伏牛山、西傍赵河的山环水抱格局没变。\u003c/p\u003e\u003cp class=\"main-text\"\u003e黉学大殿（文庙）：老城内明代建筑，被新楼包围。；城隍庙、太极观、察院、魁星楼、纪公楼：明清遗存，零散分布在镇菩路两侧。；老城壕沟残迹：镇菩路两侧楼盘间偶见老城墙土段，被居民种菜。；安固城遗址：城郊乡王庄村南，汉安固县城址，省保。；菩提寺：老庄镇杏花山阴，国保第七批，唐永徽年间始建，现存八十二间清代房舍依山势四重院落递升，中轴依次为二佛殿、大雄宝殿、卧佛殿、藏经楼。二佛殿单檐硬山筒瓦，中供韦驮与十八罗汉；大雄宝殿面阔五间单檐硬山，阑额、内额、四椽栿遍饰彩绘，殿前月台宽展；藏经楼重檐歇山，斗拱彩绘。三进院卧佛殿供汉白玉侧卧石佛一尊，寺壁嵌明清碑刻，唐贝叶经为国家一级文物。；阳安寺大殿：王岗乡砚台村东，明代单檐悬山大殿独立田野间，梁架斗栱尚为明代原构，四周新楼未及。；五垛山祖师顶道观：二龙乡五垛山北顶，与武当山南顶齐名，依山石阶直上祖师庙，明碑与古银杏树并存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌贾元武（退休干部，镇平老城保护倡议者）：\u003cbr\u003e&quot;我写那篇《打通镇菩路》的文章的时候，镇菩路中段还是一片老院子。2020年后终于撕开了口子——先拆中医院西墙，再拆中山大街至雪枫路那片。中央华府建起来了，老城墙呢？就剩几段土堆在人家院子里种菜。我呼吁修复一段老城墙——不是为了搞旅游，是为了给后人留点念想。现在钢筋丛林不缺，我们缺的是老根儿。&quot;\u003c/p\u003e"}, {"n": "内乡老县城", "s": "内乡", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e元大德八年（1304）县治从西峡白羽城迁渚阳镇（今址）。明崇祯十六年（1643）李自成军攻陷内乡，炸开北城墙。清咸丰七年（1857）捻军焚县衙，此后历任知县借察院办公三十五年。清光绪十八年（1892）浙江会稽知县章炳焘到任，历时三年重修县衙，离任时余银修四城门、护城河。1984年 县衙辟为国内第一座衙门博物馆。1996年 公布为第四批国保。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e内乡老城最核心的是县衙——站在照壁前抬头，宣化坊、大门、仪门、大堂、二堂、三堂沿中轴线一进进排开，二百多间房。现存建筑几乎全是清光绪十八年那位绍兴籍知县章炳焘三年修成的。大堂正中他手书天理国法人情匾还挂着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e内乡县衙：县城东大街，国保第四批，元大德八年始建，现存为清光绪十八年章炳焘重建，占地约两万七千平方米，房舍二百六十余间。大堂面阔五间、进深三间，单檐硬山仰合瓦，五架梁九檩式无斗拱，前有月台，平面明三暗五，明间减柱造。堂正中设暖阁公案，案上置文房四宝与红绿头签，正面屏风绘海水潮日图；大堂正中天理国法人情匾为章炳焘手书。照壁、宣化坊、大门、仪门、二堂、三堂沿一百七十余米中轴线依次抬升。；天理国法人情匾：大堂正中，章炳焘手书。；古槐：县衙大门旁，约七百年树龄。；县衙监狱：南隅，完整保留清代形制。；别公堰：县城东南湍河上，民国宛西自治别廷芳主持修建的引水石堰，堰体横河砌石至今仍在输水，渠首闸房尚存。；内乡文庙大成殿：县城一初中院内，元大德八年始建，单檐歇山式，面阔五间十九点九米、进深三间十一点二三米、高约十一点九米，建在直壁式台基上。殿顶筒板瓦覆盖，檐下斗拱六铺作三下昂，正脊三重檐各收手处塑龙头。月台东西长二十一点三米、南北宽十一点三米、高约半米，方砖墁地、阶条石压边。殿内供孔子及四配十二哲牌位，距县衙仅两百米。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，内乡县衙导游，干了35年）：\u003cbr\u003e&quot;我1989年开始在县衙当导游，那时候还没现在这么火。最早来的是高校搞古建筑研究的教授，后来是旅游团，现在是拍抖音的。最有意思的是讲章炳焘的故事——他离任时两袖清风，没钱回家，百姓凑了银子，他只拿了路费，剩下的捐给学堂了。我每次讲到这里，都看见有人抹眼泪。&quot;\u003c/p\u003e"}, {"n": "西峡老县城", "s": "西峡", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e周襄王十六年（前636）楚筑白羽城，后改称析。秦 置析县，治白羽城。元大德八年（1304）县治迁渚阳镇（今内乡），旧城改峡口镇巡检司。1948年 从内乡县析出建西峡县。1993年 西峡恐龙蛋化石群发现，列为当年世界十大科技新闻。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e西峡县城东北莲花寺岗上，那段藏在竹林荒草里的夯土城墙就是春秋楚国的白羽城——夯层每层约八厘米，跟现代工地差不多。城墙围着的岗地高出老灌河十米。城南地下埋着几万枚白垩纪恐龙蛋。\u003c/p\u003e\u003cp class=\"main-text\"\u003e白羽城遗址：县城东北莲花寺岗，岗地高出平地五米、高出老灌河十米，城近方形，占岗脊一段，东墙约七百米、南墙约五百米、西墙七百五十米、北墙约四百米，占地约三十二万平方米。东西两面紧临岗崖，南北两端尚存深宽壕沟遗迹，西北隅残墙断崖上夯土层每层约八厘米，与现代工地相近。城内散布红灰色绳纹瓦片，断崖上文化层厚一米余、土色褐红，1956年曾出土战国陶鼎陶敦陶壶。2009年辟为白羽公园。；白羽城遗址公园：岗上，2009年辟为遗址公园。；恐龙蛋化石群：县城周边地下埋藏数万枚白垩纪恐龙蛋，西峡恐龙遗迹园展陈。；陈塘关（奎文关）：丁河镇奎文村，秦楚古道要冲，2000年建哪吒祖庙。；屈原岗：回车镇屈原村岗地，传屈原扣马谏楚怀王处。岗上屈原庙为三座各三间清末砖木瓦房，青砖瓦舍，西间后山墙嵌清光绪四年内乡知事高袖海题楚三闾大夫屈子神位石刻。庙前青石碑高两米、宽六十五厘米、厚十八厘米，碑阳横刻地以人传、竖刻屈原岗，碑阴为宣统三年内乡知县邱铭勋序文约五百字，今覆玻璃罩、建碑亭护之。；燃灯寺：城西寺山国家森林公园内，唐乾符年间始建，卧佛殿、天王殿沿山坡抬升，门前合抱古柏一株，山墙旁断翅铁钟仍卧。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张俊伟（回车镇文化中心主任，白羽城遗址研究人）：\u003cbr\u003e&quot;我给网友当向导，指着那段藏在竹林里的老城墙说——这就是楚国人2600年前筑的城，夯土层每层8厘米，跟现在工地的标准差不多。秦楚丹阳之战就是在这城墙外打的。现在西峡人一聊就是恐龙蛋、哪吒——没错，但白羽城才是根儿。&quot;\u003c/p\u003e"}, {"n": "淅川老县城", "s": "淅川", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e明成化七年（1471）淅川县城在穆山村另建砖城。1958年 丹江口水库开工。1960至1961年 老县城整体搬迁至上集镇（今县城）。1973年 水库蓄水，老县城原址沉入水下。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e淅川老县城早就沉在丹江口水库底下了——明成化七年建的砖城，在穆山村整整待了五百年，1961年整体搬到上集。现在去老城镇，水面下就是当年的城隍庙、魁星楼、顺阳楼。但淅川境内还有一座活的明清古镇荆紫关，五里长街没拆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e淅川老县城遗址：老城镇穆山村，1961年整体搬迁，明砖城原址在水库水位下。；荆紫关明清一条街：县城西北荆紫关镇，国保第五批，南北走向五里长街。关门砖石结构，单拱门头砖砌斗拱，上塑狮子宝瓶大象，门楣荆紫关三字左右彩绘门神。街东侧平浪宫为清初船工集资所建，坐东向西，大门楼面阔三间进深二间硬山灰瓦，门南题风平、北题浪静；两侧钟鼓楼为四角攒尖三重檐木构，纯榫卯无钉，楼顶宝珠塔刹上书风调雨顺，檐角木雕龙头挂风铃，今鼓楼已北倾、以铁斜撑拄地。道光间所建山陕会馆存大门楼、戏楼、春秋阁，麒麟望北斗、丹凤朝阳透雕为绝。；香严寺：仓房镇白崖山，国保第六批，唐开元二年建，下寺已淹入丹江口水库，上寺存明清殿宇一进五院。大雄宝殿始建明永乐、清乾隆重修，面阔五间进深三间，硬山式兼南北风格，东西长二十九米、南北宽二十二米，四周环廊二十六根合抱大柱，檐下斗拱刻龙头龙尾象鼻形昂嘴。殿内四壁彩色壁画共四百零三平方米，为明代朝元图，东西二墙各长十六点一六米、高九点二米，中原现存面积最大寺院壁画。；南水北调中线渠首：陶岔，一渠清水北送北京。；龙城遗址：老城镇丹江水中，传楚始都丹阳故址，1973年蓄水后沉入水下，水位低时城埂出露，国家博物馆藏淅川下寺出土的云纹铜禁、王子午鼎即此文化圈重器。；下寺春秋楚墓群：仓房镇丹江水库西岸，春秋中晚期楚贵族墓地，曾出土铜禁、编钟、石排箫等重器，现墓区大部淹没于库区，出土文物多存省市博物馆。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌程老汉（75岁，淅川县移民，1961年随县城搬迁）：\u003cbr\u003e&quot;我14岁那年搬的家——全村人拖家带口，锅碗瓢盆全带上，坐卡车往北走。回头看老城，还能看见城墙上的砖。1973年水库蓄水，我特意回去看——水面已经淹到膝盖了，城隍庙的屋脊还露在外面一点点。我现在还在上集镇住着——孙子上大学了，每次问他老家在哪儿，我都说在水底呢，你看南水北调的水，那就是咱们家乡的水。&quot;\u003c/p\u003e"}, {"n": "新野老县城", "s": "新野", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉建安六年至十三年（201-208）刘备屯新野，始筑土城。明正德年间（1506-1521）改筑砖石城，周四里、四门。1938年为防空疏散拆城垣；1953年护城河夷为环城路。1995年按古制复建南城门。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e走进新野老城，第一眼不是城墙，是一座巴掌大的青砖小城——汉桑城。方方一圈带垛口的城垣里，包着一棵主干已枯、根上年年抽新枝的老桑树。城早拆了，护城河填成了环城路，唯独这方小堡和那棵桑，在闹市街口站着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汉桑城（县级文保）：老城闹市里一圈青砖小堡，城围十一米、墙高四米、直径三米五，青砖砌筑上有土垛，竟不设城门，门洞以石碑镶嵌。堡内那棵老桑相传千八百年，主干枯成一截黑桩，霜皮虬柯，根部年年萌发新枝，七弯八叉的枯枝伸出城外，远看如一盆古秀盆景。传刘备屯新野时关羽马啃了房东桑树，亲手补种，明代官府砌城护桑。；南城门（复建）：一九九五年按古制在原址复建，砖石门洞飞檐，城内出城的主街从门下穿过。；邓禹故里碑：城郊乡李湖村，整块青大理石碑高近三米，碑面竖刻汉高密侯邓元公故里九字，为东汉云台二十八将之首邓禹故里标识。；拦马桥：县城内老街口，传关羽在此拦马，单孔青石桥券尚存，桥面石板被岁月磨出一层浅凹，车辙与足痕叠在一处，缝里积着昨夜的雨。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e汉议事台（县级文保）：传刘备诸葛亮在此议军务，明万历年间改筑矩形台，南北长八十米、宽四米、高五米，砖石垒成，酷似一段小城墙。台上双层八角纪念亭，上层八角背上各爬陶制飞龙一条、卷曲欲飞，角端饰镇海神像八尊、凝视八方，八脊中心作法轮式葫芦顶。1944年亭旁魁文阁被毁，1972年钟鼓楼因碍交通拆去，1987年台基翻修至今，台边有门、门内有阶，拾级可登台顶。；光武桥：民国年间拆庙宇牌坊石碑砌成的两座老桥，桥身石条上还能看见旧碑刻的残字，有的字迹被桥路压得只剩半边，石面磨得发乌。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌葛磊（新野县文史研究学者）：\u003cbr\u003e&quot;我每次带考察队去汉桑城，都要跟他们说——这城不是奇观，是人心。一棵普通的桑树，因为关羽种过，烧不死，就有人给它砌座城守着。六百多年了，这城比很多大城池都命长。新野的城墙拆了，护城河填了，但汉桑城还在——就像一座活的三国纪念碑。&quot;\u003c/p\u003e"}, {"n": "唐河老县城", "s": "唐河", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e北魏始治襄城县于此（今唐河城区），县治此后一千六百年未动。南宋绍兴十一年（1141）始建土城，历代大修。清乾隆年间修成砖城，四门各筑瓮城。1938年抗战时期拆部分城墙；护城河与两塔留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e唐河老城趴在平地上，没剩几段城墙，但东南角立着一座宋塔，城另一头又立着一座明塔——一宋一明两座塔隔空对着，老城人说这城是艘船，两塔是桅杆，水涨船高。护城河还有一段水，绕着旧城根流。\u003c/p\u003e\u003cp class=\"main-text\"\u003e泗洲寺塔（全国重点文保）：城东南隅菩提寺旧址上，八角十层仿木楼阁式砖塔，通高五十一米，长方形青砖加白灰垒砌，塔身高度与边长自下而上逐层递减，略呈抛物线。塔内有砖砌实心塔心柱，柱周绕八十八级螺旋踏道可盘旋登临；第二层外壁嵌五十九尊释迦牟尼砖雕佛像、第四层嵌六尊，佛像高约二十一厘米，端坐莲花须弥座。塔身翼角探出石雕龙首八十条（石质七十二、木质八），悬出塔身外三十余厘米，龙首口衔铁环、环下系风铎，风起铃响；塔顶覆绿琉璃瓦、覆莲及覆钵宝瓶。塔始建于宋绍圣二年（1095），明洪武十年重建。；文峰塔：明末本地文人自筹资兴建，在城另一头与泗洲塔遥对，民间称作船地后桅。八角九层仿木楼阁式砖塔，通高三十米，首层实心、直径五米余、周长近十八米，二至九层中空，二、四、五、六、八级交错辟拱券门窗，塔形瘦秀如一支饱蘸浓墨的笔。清康熙十年、乾隆三年两次重修，今为省保。；护城河残段：原护城河水系部分保留，现为城中一段活水，沿旧城根绕流。；光复路（原中山大街）：西起河边码头，自明清至今的主干道，街面翻新，走向未移。；蓼王庙（蓼山神祠）：湖阳镇蓼山顶，五代后晋天福七年建，祀古蓼国祖，庙院今存清代重修殿宇，山下即古蓼国都邑遗址。；湖阳公主墓：湖阳镇南一公里，东汉光武帝姊刘黄封邑，墓冢封土仍隆，周围农田环绕。；陕西会馆：实为城北二十公里源潭镇上，亦称关帝庙，清雍正九年陕西客商集资所建，坐北朝南二进院、占地约五千平方米。大殿座于两米高的石基之上，面阔三间、进深二间，现存大殿、东西配殿、东廊房与一对铁旗杆，砖雕门楼刻陕西巷陌字样。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌路喆（唐河县融媒体中心记者，《唐河的城》作者）：\u003cbr\u003e&quot;我小时候听我奶奶说唐河是&#x27;船地&#x27;——我就趴在护城河边上看，真的能看出个船形来。后来我查地方志，发现这说法不是空的——唐河的城址确实选得巧，1600年治所没动，说明祖先看得准。&quot;\u003c/p\u003e"}, {"n": "社旗老县城", "s": "社旗", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉初（25年前后）传刘秀在此赊旗起兵，镇名赊旗店。明清鼎盛，城墙周十里、九门九关、七十二街，为万里茶道水陆中转，与朱仙、周口、道口并称中原四大名镇。1965年建社旗县，周恩来总理圈改赊旗为社旗。2010年建赊店商埠文化示范区，古街格局完整留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e赊店老城是被一条河养出来的商镇。走到瓷器街，脚下还是青石板，两旁老店面一开间挨一开间；镇子南头那座山陕会馆，隔着老远先看见一面琉璃照壁，黄绿蓝三色琉璃拼成二龙戏珠，再走近是一座三重檐的大戏楼，檐下木雕密得像织出来的。九门九关的城墙早没了，七十二条古街的骨架还在。\u003c/p\u003e\u003cp class=\"main-text\"\u003e山陕会馆（全国重点文保第三批）：清乾隆、嘉庆间晋陕商人集资起建，前后修了百余年。进院先过琉璃照壁——高十点一五米、宽十点六米、厚一点四六米，下为一点六米高青石须弥座，上覆琉璃硬山顶，壁面以四百七十六块彩釉琉璃方砖拼出二龙戏珠、鲤鱼跳龙门；照壁前一对铁旗杆，清嘉庆二十二年铸、重五万余斤、高近十八米，青石座上铸铁狮，龙身盘柱而上、顶立凤鸟。再北是悬鉴楼（八卦楼），高三米、东西宽十七米，三重檐歇山顶戏楼，全部木构榫卯不用一钉，戏台顶螺旋藻井自带聚音；往北过石牌坊即大拜殿，重檐庑殿，殿檐下木刻《西游记》《封神榜》人物满布。中轴线自南而北：照壁、悬鉴楼、石牌坊、大拜殿、春秋楼。；广盛镖局：清代戴氏心意拳发祥地，华中一带第一镖局，在瓷器街北端路西，坐西面东。五间门头，中为高大门楼，门前树一高旗杆，上悬书广盛镖字样的镖旗；内为一进三的大院落，分设会客厅、签押房、仓房、镖头居室、镖师居室与练武场，院落仍在。；厘金局：设于清咸丰十年（1860），为国内现存唯一道台级清代税务衙署，在瓷器街中段路西，坐西朝东。建筑均为单檐硬山式抬梁构架，两进院落作日字形布局，临街为三间两层楼房，檐下悬厘金局匾，青砖高墙、官署格局完整。；七十二条古街：瓷器街、永庆街、西阁内外街，青石板路铺到今天。瓷器街是国内唯一以瓷器命名的街道，鼎盛时聚六大窑系四十余家瓷号，一开间挨一开间的老店面沿石板排开，红灯笼挂在檐下，街面仍分行划市的老走向。；九门城墙：旧城门二〇一〇年后陆续重建，砖石门洞重立街口。；火神庙：赊店古镇瓷器街旁，省级文保，山门、大殿、戏楼沿轴排开，琉璃脊饰与木雕梁架仍在，为会馆之外的镇庙。；福建会馆：瓷器街与广盛镖局相邻，闽商所建，山门牌楼硬山，院落窄长，砖雕故事墙尚存。；古码头遗址：镇南潘河故道旁，石砌码头岸线残段贴水，当年万里茶道装卸处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌杨银鹏（社旗县文化局干部，《厚重赊店》作者）：\u003cbr\u003e&quot;赊店最有意思的是&#x27;九门九关&#x27;——一般县城四个城门，赊店凭什么九个？光武御批是传说，但实际原因是镇太大了，13万人，四道门堵得慌。而且九门是不同方向的商路——北门通开封、西门通西安、南门通襄阳。相当于九条高速公路进出口。&quot;\u003c/p\u003e"}, {"n": "方城老县城", "s": "方城", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e战国楚筑长城经大关口，方城为楚北塞隘。西汉元朔六年（前123）张骞封博望侯，封地在今博望镇。县城历代修筑，今城墙仅零星残段；文庙、张释之祠、炼真宫存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e方城老城在新楼堆里，文庙大成殿、张释之祠守在街旁，真正的主角倒在城外——城北二十五公里独树镇那道楚长城，两峰夹峙；西南三十公里博望坡，一棵被火烧过的柘刺树还活着。城里没墙，城外有关。\u003c/p\u003e\u003cp class=\"main-text\"\u003e大关口楚长城（省级文保）：县城北二十五公里独树镇中信庄村，东为黄石山西麓擂鼓台、北岭头诸峰，西为伏牛山东麓对门山、旗杆山诸峰，东西两峰夹峙成隘。楚长城从此横跨北出，隘口南北两道城墙并列，山脊上石砌与夯土残垣断续可见，石缝里生着酸枣丛。；博望坡遗址（省级文保）：县城西南三十公里博望镇老街西侧，传刘备火烧博望坡处，坡上曾出土折戟断镞与烧焦谷物。坡上那棵柘刺树高约六米、围粗二米余，树冠成品字形，枝干如铁蜷曲如爪，苍老主干二〇〇〇年枯老，根上又萌新枝至今叶繁，碳十四测年恰与三国相当，人称三国柘。；方城文庙：大成殿面阔七间，单檐歇山顶，殿前戟门尚存，四周被新街新楼围住。；张释之祠（省级文保）：西汉廷尉张释之（方城人）专祠，在县城西关释之路北侧，占地约三千七百平方米，元明清三代先后复建重修。现存飨殿三间、祠堂三间、后寝三间，祠院与碑刻仍在；张释之本人葬于县城西北两公里胡岗村旁。；普严寺：唐元和年间建，河南四大名寺之一，山门前两株千年银杏合抱粗，秋后满地黄叶。；炼真宫：县城西北角北环路北侧，东汉湖阳公主修真处，明成化十二年重修炼真宫记碑仍在，宫城沿中轴殿宇重建，松柏苍翠。；佛沟摩崖造像：小史店镇寺门村香山，宋代摩崖石刻造像数十龛分布两石上，国保第七批，石面风化但佛头背光犹可辨。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌许金星（县政协委员，老城区保护提案撰写者）：\u003cbr\u003e&quot;方城的问题是——博望坡、大关口这些好东西都在城外，县城里的文庙、炼真宫被楼围着没人注意。方城人说&#x27;城小，城墙没了就没了，但文庙不能没&#x27;。我说文庙还在，但旁边的老院子快没了。&quot;\u003c/p\u003e"}, {"n": "南召老县城", "s": "南召", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋鲁庄公八年（前688）楚文王灭申，于鹿鸣山南建行宫（世传子城）。明成化十二年（1476）复置南召县，筑砖城，北倚鹿鸣山、独缺北门。1947年县城自云阳迁往李青店（今县城），旧邑改云阳镇。1958-1960年号召拆城，砖被搬走，城墙基本消失。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e南召老县城不在今天的县城，在云阳镇老城村。村小学院里，两棵古柏并立，粗得三人合抱，枝柯遮了半座院子——传说是楚文王和妃子栽的，两千七百年了。城北不靠城墙，靠鹿鸣山，所以这城从来就没开过北门。城墙早拆了，青砖搬回家砌了院墙，只剩民居间半人高的土堆。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南召文庙：明成化年间建，大成殿与状元桥尚存。；城隍庙戏楼：明代建筑，木结构残破但梁架完整。；杏花山猿人遗址：云阳镇李楼村杏花山，国保第七批，1978年发现一枚古人类牙齿化石，与北京猿人同期，山前台地旧石器出土地点立碑。；兴阳观：云阳镇西南半里，三面环山，唐宋以来道教宫观，现存山门、大殿与庙会台，每年正月十五庙会仍盛。；丹霞寺：四棵树乡留山南麓，唐长庆年间始建，豫西南名刹，现存山门、大雄殿与清代碑刻，寺周古柏成林。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e南召文庙：明成化十二年（1476）在楚王行宫遗址上改建，棂星门前空地原是祭祀场所，今为一小操场；棂星门改为办公楼，泮池与状元桥尚存，大成殿沿清工部营造法式重修，殿前石阶被几代学生踩出浅光。；古城墙残段：老城社区民居之间，只剩半人高的夯土堆，砖已被拆净——一九五八年号召拆城，青砖被搬回家砌院墙、垒灶案，夯土缝里偶尔露出半块被磨平的旧城砖。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌高天顺（退休教师，《南召文化大观》作者）：\u003cbr\u003e&quot;上世纪50年代末拆城墙，我爹也去拆了——他搬了12块青砖回家，用来垒厨房的案台。现在那12块砖还在我家厨房里。那两棵古柏我从小看到大——2700年啊，楚王栽的，我每次摸它都觉得，我摸的不是木头，是楚文王的手摸过的地方。&quot;\u003c/p\u003e"}, {"n": "桐柏老县城", "s": "桐柏", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e秦始建淮渎庙，为四渎之一淮河祭祀场所。北宋开宝六年（973）县治自固县镇迁今址。明成化十二年（1476）以山石重建石城，四门。1938年固县镇关帝庙被炸毁；近代城墙拆除，淮渎庙仅剩台基。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e桐柏老城靠山吃山，城墙全是石头砌的。千里淮河从城边桐柏山发源，县城就趴在淮河边上。东关原是淮渎庙，如今只剩大殿台基压在县一高中底下；城里文庙、城隍庙还守着，城外水帘洞藏在西北山里。\u003c/p\u003e\u003cp class=\"main-text\"\u003e淮渎庙遗址：县城东关，今县一高中校址上，原是四渎之一淮河祭祀庙，始建于秦，盛时殿宇多达五百二十六间。一九三六年庙改学校，后又经抗战，今仅存大殿台基、若干石栏杆与几块明清碑刻，院角三棵古柏仍立，旧庙砖石被就近砌进了校舍，操场边上的台基高出地面一截。；桐柏文庙、城隍庙：县城内，建筑与碑刻经明清重修，格局尚存。；水帘洞：县城西北桐柏山中，传李白访友至此，洞穴与摩崖在涧谷间。；水帘寺：水帘洞下临龙潭，千年古刹，中原四大名寺之一，殿宇沿涧谷一层层排开，寺后即瀑布飞流，水帘挂雪为桐柏八景；涧水声与殿角风铃相杂。；云台禅寺：桐柏山主峰太白顶（海拔一千一百四十米），临济宗白云系祖庭，红墙碧瓦。寺东侧山墙旁大淮井、小淮井并列，石砌六角井台高约半米，井口仅小儿洗澡盆大小，蹲身垂手可及水面，久旱不涸，山泉下渗成溪、山下汇为淮河正源。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e固县镇老街：北宋以前的老县城，四条明清大街格局未动；镇中关帝庙1938年被炸毁，基址尚存。；金庭观遗址：县城西北桐柏山南麓，南北朝时与茅山、庐山并称全国五大道观，今观已毁，仅余残碑与古柏数株。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王技术员（62岁，淮河流域水利工程师）：\u003cbr\u003e&quot;桐柏作为淮河源头，我在外地搞水利30年，每次回家都要去淮渎庙遗址转一圈。现在全国搞四渎文化复兴，桐柏的淮渎庙是中国四大河神祭祀里最破的——黄河有庙，长江有庙，济水虽然干了还有济渎庙，就淮河的庙成了个台基。希望以后能修复起来——让后人知道，千里淮河从这儿开始。&quot;\u003c/p\u003e"}, {"n": "邓州老县城", "s": "邓州", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e东汉张仲景（约150年生）为邓州穰东人，著《伤寒杂病论》。北宋庆历六年（1046）范仲淹贬知邓州，于花洲书院春风堂作《岳阳楼记》。明洪武二年（1369）金吾卫镇抚孔显筑内城砖城。明弘治前后知州吴大有筑外城土城，回字形双壕格局成。近代城墙损毁；平成门、西城墙修复。2021年团结中路发现宋金古商业街遗址（2023河南十大考古新发现）。（T15大批次12县·完）。（以上为T15大批次12县正文·豫西南南阳）。（以下为T16大批次5县正文·豫东濮阳）。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e邓州老城是个回字——里头一圈砖城，外头一圈土城，两圈之间还有河。如今内城西门平成门修复了，西城墙露出一段，内外城河还在流。城里十字街西南角立着一座宋塔，塔身满壁砖雕佛像；城东那座花洲书院，春风堂前四棵桂树秋天开得一街香，范仲淹就在这堂里写下《岳阳楼记》。\u003c/p\u003e\u003cp class=\"main-text\"\u003e花洲书院（全国重点文保第八批）：城内百花洲畔，北宋庆历六年（1046）范仲淹知邓州时在此作《岳阳楼记》。现存春风堂，房门两侧挂先天下之忧而忧后天下之乐而乐一联；堂前四棵古桂相传范公手植，中秋开花香溢街巷，桂瓣落进阶前石板缝。堂西为范文正公祠，明嘉靖四十五年为纪念范仲淹而建；另有大成殿与百花洲园林，多为后世重修。；平成门（西门）：邓州古城西门修复后重立，砖石门洞与城楼重新起架，门洞青砖上还留着老砖的磨痕，门洞外老壕沟仍有水。；西城墙遗址：内外城河之间一段土城墙修复，老壕沟仍有水。；宋金古商业街遗址：团结中路，2023年河南十大考古新发现，唐代街巷肌理沿用至今。；穰东张仲景故里：城东三十公里，医圣张仲景籍贯所在。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e福胜寺塔（全国重点文保）：城内十字街西南，八角七级仿楼阁式砖塔，高约三十八米，通体青砖，塔身满嵌佛龛浮雕砖，千佛林立。塔始建于北宋天圣十年（1032），原十三级，元末兵燹毁去上部，明初重修为七级；一九八八年修复塔基时在塔心下五米深处发现地宫，宫室坐南向北，由大门、通道、宫室组成，出土金棺（纯金长十九厘米、重六百余克）、银椁、佛顶骨佛牙、玻璃舍利瓶、鎏金双龙银壶与紫红玻璃葫芦，银椁前竖两檐柱承仿木构房顶，刻脊兽瓦垄滴水。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌邓老汉（80岁，邓州老居民，花洲书院旁住了60年）：\u003cbr\u003e&quot;我小时候在花洲书院后面玩——那时候书院是高中校舍，我们翻过墙去摘桂花。春风堂前面的四棵古桂，每年8月开，香得整条街都是。我爹说他小时候也摘过。现在书院成了景区，收门票，我用老年证免费进。每次走到春风堂，我都跟我孙女说——这就是范仲淹写&#x27;先天下之忧而忧&#x27;的地方。&quot;\u003c/p\u003e"}, {"n": "濮阳老城", "s": "濮阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e仰韶时代（前4400年前后）西水坡蚌塑龙虎，中华第一龙。鲁僖公三十年（前629）卫成公迁都帝丘。后梁贞明五年（919）筑澶州城，南北两城夹黄河。后汉天福十二年（947）郭威澶州兵变黄袍加身。北宋景德元年（1004）宋辽澶渊之盟于北城。明清为开州砖城。近代城墙残三段，最长约一千七百米；2004年国家历史文化名城。2025年澶州北城遗址做分层夯筑修缮。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e濮阳老城十字街正中立着一座四牌楼，四层檐八角，四面匾额写着颛顼遗都、澶渊旧郡。牌楼往北是北大街，明万历年间的八都坊还立着；往西水坡方向走，五代澶州北城的夯土墙斜斜塌着，最高处一人多高，二〇二五年刚用分层夯筑补过。城外南边戚城遗址，东城墙外八十米一座四米多高的夯土台，就是春秋诸侯会盟的地方。\u003c/p\u003e\u003cp class=\"main-text\"\u003e五代澶州北城遗址（省级文保，2021）：西水坡南侧，夯土城墙残长约一千七百米，最宽处约三十米、最高约八米，夯土层一层层斜斜叠压，墙体向一侧倾斜塌陷，二〇二五年按分层夯筑法补过，新补土层与老夯土之间留下一道颜色分界。此城即后梁贞明五年（919）所筑夹寨北城，宋真宗澶渊之盟在此驻跸。；西水坡遗址（全国重点文保第三批）：仰韶文化蚌塑龙虎出土地，中华第一龙距今六千四百年。；回銮碑（全国重点文保第五批）：又称契丹出境碑，在新华街（原御井街）路西澶渊之盟博物馆院内，是宋辽澶渊之盟唯一实物。碑为宋真宗亲撰《契丹出境诗》，一九七八年残碑补接加固后高约二点六米、宽一点三米、厚三十六厘米；碑亭旁现存三通石碑，中间为宋代残碑、左侧一九七八年复制碑、右侧民国题诗碑，均以玻璃罩保护。碑南有一古井，传为宋真宗亲驻时所凿，井水清甘，御井甘泉为明清开州八景。；四牌楼（中心阁）：老城十字街中心，通高八点六米、长宽各六点六米，四层檐八角，四面分悬颛顼遗都、澶渊旧郡、河朔保障、北门锁钥匾额。四根石柱为明代原物，一九八二年落架大修时将瓦件换成琉璃瓦并补走兽；牌楼四面穿街，车轮在柱根磨出浅沟。；濮阳县城隍庙：北宋熙宁十年（1077）始建，明时祀好官开州知州李嘉祥。；戚城遗址（全国重点文保第四批）：市区南，东周卫邑，城垣周长一千五百余米，东西北三面残墙犹存，夯层清晰；东城墙外八十米会盟台长约二十米、宽约十六米、高约四米半，春秋诸侯七次会盟于此。；唐兀公碑（全国重点文保第六批）：柳屯镇杨什八郎村，元代蒙汉融合实物。；张挥公园：南环路，张姓始祖挥公纪念地。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e八都坊：北大街跨路而立，明万历间为纪念董汉儒等八位濮阳籍都御史所建青石坊，由石条、石柱叠砌嵌合。原坊毁于文革，今由县府拨款按原样重修，青石柱础上的卷草纹仍可辨认。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老周（76岁，濮阳老城十字街居民，住了50年）：\u003cbr\u003e&quot;我小时候四牌楼上还挂着灯笼呢——过年过节亮一整夜。那时候西水坡还没挖第一龙，就是一片荒地，我们去那儿放羊。1987年挖第一龙的事儿，我亲眼看着那些考古队的人用刷子一点点刷蚌壳——我那时候才三十多，蹲在边上看了一下午。后来修了中华龙碑，380吨重，立在那儿像个大墓碑似的，我觉得不如那片荒地看着亲切。&quot;\u003cbr\u003e▌刘伟强（省政协委员，无党派人士，濮阳工商联副主席，2024年澶州北城遗址保护提案人）：\u003cbr\u003e&quot;我2024年10月用无人机拍澶州北城遗址的时候，发现墙体倾斜了200米，裂缝宽20厘米、深80厘米——要是不修，再过十年就得塌。我们组织了&#x27;益心为公&#x27;志愿者小分队，5个文旅博主+5个文物专家，用倾斜摄影建模，给检察院提了公益诉讼。县文广局采纳了分层夯筑防渗方案，现在修好了。澶州北城是919年建的，比北宋还早——郭威黄袍加身在这儿，宋辽澶渊之盟也在这儿，比陈桥驿早50年。&quot;\u003c/p\u003e"}, {"n": "南乐老县城", "s": "南乐", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e相传黄帝子昌意（颛顼之父）约五千年前于此筑昌意城。西汉初置乐昌县；西晋改昌乐；后梁避李国昌讳改南乐。北宋元丰四年（1081）县治迁王彦章营（今址）。明代建砖城，周三里许。近代城墙残段零星；文庙、仓颉陵、古街留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e南乐老城在平原上，十字街下去是文庙，青石板路还在；县城西北十八公里史官村那座陵庙才是主角——一进朝天门、仰圣门，沿中轴穿过万古一人殿、六书殿，走到造书台，台上一抔土，说是仓颉葬处。陵下挖开是仰韶到龙山的文化层，四千多年的土层压着。\u003c/p\u003e\u003cp class=\"main-text\"\u003e仓颉陵庙（全国重点文保第八批，4A）：县城西北十八公里史官村，陵高约五米，陵墙周长三十六点五米、暗合一年三百六十五天，墙分十二节对应十二月，每节长度随月日天数不等。祠始建于东汉永兴二年（154），沿中轴线朝天门、仰圣门、万古一人殿、六书殿、藏甲楼、造书台一路排开；造书台高约三丈，台上旧有仓亭，亭内灵龟负书碑刻仓颉初创二十八字及释文。寇准题联盘古斯文地、开天圣人家悬于殿内，元明清碑刻与明代大方碑林立。一九九九年考古证实陵下压仰韶龙山文化层。；南乐文庙大成殿：城关镇南街，明洪武三年主簿叶伯瑾始建，永乐、正统年间扩建，今存大成殿、崇圣祠、东西庑、泮池。大成殿是豫北现存时代最早的明代木构，比北京故宫早近半世纪，元代遗风与明代早期做法并存；文庙三路院落，西学宫、中文庙、东文昌宫。二〇二〇年复原工程后焕然一新，殿前青石板路仍在。；明清古街：老城核心区，青石板铺地，飞檐老店面尚存。；昌意城遗址：县城西北十八公里、仓颉陵北侧，传黄帝子昌意所筑，地表下为仰韶龙山环壕。；昌乐故城：谷村一带，晋魏昌乐县旧治。；南乐文庙大成殿：城关镇南街，明洪武三年主簿叶伯瑾始建，永乐、正统年间扩建，今存大成殿、崇圣祠、东西庑、泮池，二〇二〇年复原工程后焕然一新，殿前青石板路仍在。；宋耿洛汉墓：县城西宋耿洛村，东汉张侯墓群，一号墓出土黄釉陶楼、铜缕玉衣等国宝，墓室穹顶砖雕仍可进入参观，为省保。；三娘子台遗址：梁村乡邵庄村东南，仰韶至龙山文化台地，高出周围地面数米，地面散见红陶片。；南乐十二牌坊：明清跨街牌坊群今已不存，但南街、北街仍有牌坊巷、牌坊街地名，老住户门楼上偶见旧石雕构件。；隋唐大运河南乐段：县西卫河故道，河道弯环，河堤仍存，为大运河国家文化公园组成段。；仓颉陵藏甲楼与六书殿：史官村仓颉庙内，沿中轴线一进朝天门、仰圣门、万古一人殿、六书殿、藏甲楼、造书台，寇准所题盘古斯文地、开天圣人家联悬于殿内。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老吴（72岁，史官村仓颉陵守陵人，守了30年）：\u003cbr\u003e&quot;我爷爷是守陵的，我爹也是，传到我这儿第三代了。每年正月二十四仓颉诞辰庙会，天不亮就有人来烧香——从豫鲁冀过来的，开着面包车来。香火烧得能把半座陵都熏黑。我守陵30年，见过的最有意思的事儿是2023年谷雨祭仓颉，美国国会图书馆的人也来了——他们说仓颉是全球12位文字圣人之一，跟苏美尔、埃及文字创始人并列。那时候我才知道，我守的不是一座陵，是整个汉字文明的根。&quot;\u003c/p\u003e"}, {"n": "范县老城", "s": "范县", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e汉初于此建范县旧城，为晋大夫士会食邑，六门龙形。明洪武十三年（1380）黄河决堤，旧城淹没，迁龙王庄。明景泰至天顺年间（1451-1459）筑濮州城于今濮城镇。1956年县治迁山东莘县樱桃园。1964年以金堤河为界，县城留山东境，成中国唯一跨省飞地。1997年再迁白衣阁乡新城区。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e范县的老县城是个挪了六次的城。最老的那座沉在黄河底下；濮城镇还留着一圈明代濮州城，城墙土埂高出地面两三米，护城河的水在埂下流。而县城本身，直到1997年才从山东莘县樱桃园那片飞地里搬回河南——老飞地如今只剩汽车站和几家店。\u003c/p\u003e\u003cp class=\"main-text\"\u003e濮州古城遗址（濮城镇）：明景泰二年（1451）动工、天顺三年（1459）落成的濮州州城，城周七里，四门凝和、遂昌、延熙、拱极。原城墙为夯土墙，周长约四千米、高约七点五米，护城河宽十三米、深五米。如今夯土城埂仍高出地面两三米，护城河水在埂下流，水浅时河底明朝铺的青石板一片片可见。；范县旧城（黄河底）：汉初晋大夫士会食邑，相传筑六门以肖龙形；明洪武十三年（1380）黄河决口淹没，今沉于黄河故道下。；吴道子铸铜关帝像（已佚）：旧城古佛堂前传吴道子所铸，1958年大炼钢铁时被运走。；老城飞地：位于山东莘县樱桃园镇境内，原河南范县城关镇驻地，今仅剩汽车站等少量功能建筑。；十字坡遗址：县城北一里，北宋顺河大街故址，传《水浒》孙二娘开店处。一九五八年前有龟座残碑一通，碑面刻十字坡三大字，后被抬去垫临黄堤；今仅存地名与新立石碑，道旁麦田一望无际。；丹朱墓：辛庄镇丹徐庄，尧子丹朱墓冢，原占地百二十亩，今中心封土隆起，一九七五年试掘发现战国文化层，冢周麦田环绕。；苏佑墓：县城东北，明刑部尚书苏佑墓，墓前石马、石羊残件散落在田野，封土尚在。；闵子骞墓：县城西南，孔门弟子闵子骞葬处，墓冢封土尚存，旁立清代石碑。；颜村铺革命旧址：颜村铺乡，抗日战争时期冀鲁豫边区党委、军区司令部驻地，有边区小延安之称，保护面积一百三十八亩。保留旧式青砖黛瓦四合院十余处，其中完整砖木房屋九间、占地八百余平方米，室内附属文物保存完好，第六批国保。；郑板桥纪念馆：辛庄镇毛楼村黄河岸边，纪念郑板桥任范县令五载，院内板桥诗书画刻石数十通。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（80岁，范县濮城镇老居民，濮州古城边住了60年）：\u003cbr\u003e&quot;我小时候还在濮州城墙上跑呢——那时候城墙还有一人多高，砖都还在，城垛子也没全塌。后来大炼钢铁拆了一部分砖，再后来修公社修学校又拆了一部分。现在就剩几段土堆了，比人高不了多少。护城河还在——水少的时候能看见河底的青石板，那是明朝铺的。有一年涨水，冲出来个明朝的瓷碗，我捡回家当盐罐用了，我孙子说这得值不少钱，我说值多少钱不是我的，是祖宗留下的。&quot;\u003cbr\u003e▌范县干部小李（35岁，在新城区办公，老家樱桃园老飞地）：\u003cbr\u003e&quot;我小时候在老飞地住——河南县城被山东包围，去镇政府办事要进山东地界，打电话信号一会儿是鲁一会儿是豫。1997年迁新区以后，飞地就剩下汽车站、几个商店了。我现在开车回飞地，10分钟就到新区，中间还能经过一段山东地界——踩一脚油门过省界，这感觉挺神奇的。&quot;\u003c/p\u003e"}, {"n": "台前老县城", "s": "台前", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e西汉置寿良县；东汉避光武帝叔刘良讳改寿张。唐麟德二年（665）唐高宗访张公艺于寿张，赐百忍堂。明初县治迁王陵店（今阳谷寿张镇）。1964年因金堤河水患，寿张县撤销，其地并入范县。1974年设台前工委；1978年建台前县，以凤凰台前村为名。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e台前是河南伸进山东的一只犀牛角。县城1978年才建，但底子是老寿张县——张公艺九世同居的故事就落在孙口乡桥北张村，村里那座百忍堂，祠堂里新刻了忍字匾。城南黄河拐个大弯，金堤从东汉王景那会儿一直卧到今天。\u003c/p\u003e\u003cp class=\"main-text\"\u003e凤凰台遗址：今台前村，明初刘姓移民于凤凰台前建村，县名台前由此来。；寿张故城旧迹：原寿张县（今阳谷县寿张镇）清代四大寨门、东西主街旧迹尚存。；金堤：东汉永平十二年（69）王景治河所筑，台前段残堤蜿蜒。；将军渡与刘邓大军渡河纪念碑：孙口镇黄河大堤北，一九八一年立青石纪念碑一通，通高三米、宽七米、厚四十厘米，碑首刻五角星，碑座刻水纹浪花，碑身刻孙口渡河处五字，陈天然书丹；二〇〇八年再建主碑，碑高二十七点三七米（碑座六点三米、碑身十九点四七米、碑冠二米），薄一波题词，台阶十二层象征四个纵队十二万大军于此渡河。；古贤桥：孙口镇古贤桥村，传唐太宗遣使访张公艺时所筑。二〇〇六年文物钻探断定为石拱桥，桥长约五十二米、宽约六米，深埋地下约六米，建于唐初，比赵州桥仅晚数十年。清宣统元年重修古贤桥碑高约二点四八米、宽约六十七厘米，碑阳刻古贤桥遗迹五字，今移至桥北张村南百忍堂前。；徐堌堆龙山文化遗址：吴坝乡徐堌堆村，原名桃丘，台地高数仞，地表散见龙山文化黑陶片，为县保。；八里庙治黄碑刻：八里庙村，明清治黄记事碑数通，嵌于墙内，碑文记载黄河决口与修堤经过。；张公艺墓冢：桥北张村南，清光绪年间黄河决口原墓园淤埋，族人在原址堆起新冢，高约十二米，底径三米，松柏环绕。；蚩尤冢：县城东南，传上古蚩尤葬处，封土堆尚在，为县保。。\u003c/p\u003e\u003cp class=\"main-text\"\u003e张公艺墓祠（百忍堂）：孙口乡桥北张村南约二百米，唐麟德二年（665）唐高宗亲访九世同居的张公艺，赐号百忍。原墓园广约十余亩，松柏参天、仰视不见天日，墓前旧有石坊三座、石碑十余通；清光绪年间黄河决口，旧墓园淤埋地下，族人在原址堆起新冢，高约十二米、底径约三米，松柏环绕。百忍堂原物毁于文革，一九九四年县府拨款、张氏族人集资在村南重建，堂匾为后人重刻，村人每年年节祭祖。；晋王城遗址：吴坝乡晋城村，传五代李克用、李存勖屯兵处，方形小城，今地面城墙已毁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（百忍堂后人，桥北张村居民，70岁）：\u003cbr\u003e&quot;我是张公艺第78代孙。我们村百忍堂每年过年都祭——老人们说百忍堂的&#x27;忍&#x27;字写了一百个，其实是101个，高宗看了哭的那个就是多写的那个。我爹说他1960年代见过百忍堂的老匾——木头的，黑底金字，文革的时候被砸了。现在我们村自己刻了个新的挂在祠堂门口。我家现在还九代同堂——就差两代到张公艺那个规模了。&quot;\u003c/p\u003e"}, {"n": "荥阳老县城", "s": "荥阳", "p": "河南", "w": "", "h": "\u003cp class=\"main-text\"\u003e春秋郑武公于京襄城寄孥，为郑国早期都邑。西晋永嘉元年（307）张卓、董迈筑大栅坞。北魏太和十七年（493）大栅坞改荥阳城。明景泰元年（1450）知县王凯筑土城；明代逐步包砖。1981年县政府迁索河东岸新城，老城留存。\u003c/p\u003e", "r": "\u003cp class=\"main-text\"\u003e荥阳老城趴在索河边上，中间高四周低，民间叫金龟戏水。县衙的大堂还在，东街那座青砖八棱魁星楼铁马风铃还挂着；城墙早拆净了，只在北边露出一点夯土基。真正压阵的是豫龙镇那圈京襄城，西城墙残段一百五十米、高十五米，两千多年的夯土层一层一层像书。\u003c/p\u003e\u003cp class=\"main-text\"\u003e荥阳县衙：明洪武初年始建，四进院落。照壁、头门、仪门、大堂、二堂、三堂的中轴线格局仍在；大门上原有谯楼，门额石书中州名邑四字，仪门东西设角门，大堂前有戒石亭。大堂三间为清顺治五年知县周维新建，大堂两侧东西书吏廊房各五间；二堂题宝训堂，雍正二年重修。今大堂与卷棚经保护修缮后，两屋顶分离、两檐滴水之下以地沟排水，月台呈方形，大堂与内宅保存完整。；魁星楼：东街，青砖砌成八棱形，直径四米、高约十米，基层正面设四门、均作拱券；楼顶斗拱挑檐，檐角各系一
