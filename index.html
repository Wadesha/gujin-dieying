t;，后人称&quot;收成&quot;，这是建湖有城之始。东晋义熙年间，盐渎县改称盐城县——建湖境地东部属盐城、西部属左乡县。1941年9月，中共华中局将原盐城县划县分治——建阳县成立，1951年改称建湖县。2008年，淮剧、杂技皆被列入第二批国家级非物质文化遗产名录——建湖杂技、淮剧享誉全国。2024年，九龙口旅游度假区接待游客400万人次——淮剧小镇获评&quot;国家级文旅融合典型案例&quot;\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e九龙口国家湿地公园：国家4A级景区——九条自然河道（蚬河、林上河、钱沟河、安丰河等）从南西北不同方位蜿蜒而来，汇聚于龙珠岛；高空俯瞰如&quot;九龙戏珠&quot;。2. 沙庄古村（淮剧小镇）：淮剧发祥地——修复沙庄老街、老唐槐、东海王墓等遗存；复原&quot;村在荡中，荡在村中&quot;格局；淮剧沉浸式演出每天上演。3. 收成古村：2100年历史的汉代首城——修复收成老街，发现汉代东海王墓；&quot;村在荡中，荡在村中&quot;。4. 草堰口汉墓群：汉代墓葬群——九龙墩汉代墓葬群落，出土铜器、陶器等文物。5. 朦胧宝塔：唐代始建——八角七层楼阁式砖塔，高23.6米，是建湖的地标。6. 陆秀夫故里：南宋丞相——&quot;当为国死&quot;抱帝蹈海；建湖县建阳镇是其出生之地。7. 颜单老街：明清古街——存明清建筑数十处，石板路蜿蜒曲折。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e九龙口的&quot;九龙戏珠&quot;，据说只有从高空才能看清楚。九条河从不同方向流过来，像九条龙，中间那个龙珠岛就是&quot;珠&quot;——大自然的鬼斧神工，不是人造的。我在龙珠岛上见过一个老渔民，姓赵，他爹当年就是在这九条河里捕鱼的。&quot;我爹说，九龙口的鱼特别鲜——因为九河水都流到这儿，水活，鱼就鲜&quot;，他说，&quot;以前打鱼，下一个网，能捞上来半网螃蟹半网鱼，现在不行了，但还是比别处的鲜&quot;。他说着拿出一壶自制的鱼露给我看——&quot;用九龙口的鱼做的，放了三年了，香得很&quot;。远处传来淮剧的唱腔，是沙庄古村的戏班子在排戏，声音婉转悠扬，跟九龙口的流水声配在一起，像一场天然的音乐会。\u003c/p\u003e"}, {"n": "兴化", "s": "兴化", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e五代杨吴武义二年(920)，正式置兴化县——取&quot;兴盛教化&quot;之意，距今1106年。南宋年间，先民向水要地——创造&quot;垒土成垛、架木浮田&quot;的垛田农耕系统，将水下淤泥堆砌成高出水面的田块。明嘉靖年间，李春芳中状元——官至礼部尚书、武英殿大学士，是兴化籍唯一状元。明末，施耐庵隐居兴化白驹场著《水浒传》。清代，郑板桥在兴化城东门故居生活——&quot;板桥&quot;之名源自兴化东门外的古板桥。2014年，兴化垛田入选全球重要农业文化遗产——联合国粮农组织（FAO）评定。2022年，兴化垛田入选世界灌溉工程遗产。2024年，兴化获批国家历史文化名城——1200年建城史的正式确认\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e千垛菜花景区：国家4A级景区——占地5000亩，由成千上万个大小不一、形态各异的垛田拼接而成；&quot;河有万弯多碧水，田无一垛不黄花&quot;；2014年全球重要农业文化遗产。2. 李中水上森林公园：国家4A级景区——十万余株水杉、池杉从水里长出来，被誉为&quot;苏中九寨沟&quot;；1980年代堆土造林而成。3. 金东门老街：苏中明清第一街——全长约500米，原汁原味古街风貌，留存明清民国建筑100余处；状元坊为纪念李春芳而立。4. 四牌楼：兴化千年文脉的见证——楼上高悬47块匾额，旌表75位兴化籍历史名人；郑板桥、施耐庵均在其中。5. 郑板桥故居：清代民居——粉墙黛瓦，兰竹萧疏；院中有几竿翠竹，呼应郑板桥&quot;宁可食无肉，不可居无竹&quot;。6. 施耐庵纪念馆：水浒作者故里——白驹场施氏宗祠内；墓碑刻&quot;大文学家施耐庵先生之墓&quot;。7. 兴化古城墙遗址：宋筑砖城，明包砌——现存东北角残段约200米；周长约10里，设四门。8. 沙沟古镇：国家历史文化名镇——明清盐商聚居地，存明清建筑100余处。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e兴化的垛田是怎么来的？南宋年间，里下河一片沼泽，年年淹水。兴化的先民想了个法子——把河里的淤泥挖出来，堆成一个个高出水面的土垛，然后在土垛上种油菜、种水稻。这样水来了，垛不淹；水退了，垛上就是良田。这种&quot;垒土成垛、架木浮田&quot;的方法，全世界只有兴化有。2014年联合国粮农组织给它发了&quot;全球重要农业文化遗产&quot;的牌子——&quot;人类应对水患的智慧典范&quot;。我在千垛景区的观光塔上见过一个七十多岁的垛田老农，姓王，他爹就是种垛田的。&quot;我爹说，垛田比命还金贵&quot;，他说，&quot;一个垛田才一两分地，一年能收三四百斤油菜籽——那就是一家人的油盐钱。垛塌了，就得花三五个月重新堆起来&quot;。他说着指着脚下的垛田：&quot;你看那些垛，有的已经有几百年了，比我爷爷还老。我家的垛是明末传下来的，到我这儿是第七代了&quot;。\u003c/p\u003e"}, {"n": "高邮", "s": "高邮", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e公元前223年，秦王嬴政在此建高邮亭——&quot;高邮&quot;之名因此，别称&quot;秦邮&quot;，是全国唯一以邮命名的城市。汉高帝六年(前201)，置高邮县——属荆王国东阳郡。唐僖宗年间(874-888)，举直禅师弟子建成镇国寺塔——珍藏禅师舍利子和经卷；高邮城区始有&quot;孤塔伴双寺&quot;景观。北宋开宝四年(971)，置高邮军——诏文称&quot;惟彼高邮，古称大邑。舟车交会，水陆要冲。宜建军名，以雄地望&quot;；知军高凝祐始筑高邮城池（略呈方形，周长10里316步，高2.5丈）。南宋嘉定七年(1214)，郡守汪纲在四个城门外增设瓮城——高邮城防御功能完备。明洪武八年(1375)，建盂城驿——全国保存最完好的明代水马驿站。1956年，大运河拓宽——镇国寺塔本应拆毁，因周恩来&quot;让道保塔&quot;指示，留下一块近40亩的河心小岛，塔耸立其间。2014年，镇国寺塔、盂城驿作为大运河遗产点列入世界文化遗产。2024年，高邮获批国家历史文化名城\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e镇国寺塔（南方大雁塔）：全国重点文物保护单位——方形七层砖塔，始建唐代僖宗年间；高35.36米，与西安大雁塔形制相似；1956年周恩来指示&quot;让道保塔&quot;，塔耸立运河河心岛。2. 盂城驿：全国保存最完好的明代水马驿站——明洪武八年(1375)始建；因秦观&quot;吾乡如覆盂&quot;得名；是解读古代邮驿制度的&quot;活化石&quot;；世界文化遗产。3. 净土寺塔（东塔）：明代万历三十四年(1606)建——楼阁式砖塔，方形七层；与镇国寺塔（西塔）并称&quot;高邮双塔&quot;。4. 高邮古城墙遗址：宋筑砖城，明包砌——现存北门瓮城遗址；周长约10里，设四门。5. 文游台：北宋苏轼与秦观、孙觉、王巩载酒论文处——&quot;四贤雅集&quot;文坛佳话；现为国家4A级景区。6. 高邮州署：明清高邮行政中心——延续古代州府规制格局。7. 秦观故里：婉约词宗&quot;两情若是久长时，又岂在朝朝暮暮&quot;的作者——高邮籍，苏门四学士之一。8. 汪曾祺纪念馆：当代作家——《受戒》《大淖记事》作者，师从沈从文。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e镇国寺塔的命运，差一点就被大运河拓宽的推土机抹平了。1956年，京杭大运河要拓宽到60米，镇国寺塔正好在航道上。工程队已经把塔的围墙拆了一半，周恩来总理看到图纸，说：&quot;让道保塔&quot;。于是大运河在这里拐了个弯，留下一块近40亩的河心小岛，镇国寺塔就耸立在岛上，四面环水，像一座&quot;塔中孤岛&quot;。从那时到现在，已经69年了——大运河的船从塔边来来往往，塔纹丝不动，运河的水涨了又落，塔的影子在水里晃了又晃。我在运河边见过一个老船工，姓王，他爹当年就是运河上的船老大。&quot;我爹说，过高邮的时候，远远就能看见镇国寺塔——那是船老大认路的标记&quot;，他说，&quot;现在运河宽了几倍，船快了几倍，但塔还在那儿，跟我爹当年看见的一模一样&quot;。\u003c/p\u003e"}, {"n": "东海", "s": "东海", "p": "江苏", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦代分三十六郡——东海郡是江苏境内唯一保留到今天的郡名。西汉时，东海郡辖38县——规模是今天的几倍大，是当时鲁南苏北的政治中心。1993年，温泉镇尹湾村村民平整土地时发现汉墓群——6号墓出土133枚竹简、23枚木牍，共4万多字；墓主是东海郡功曹史师饶（相当于市政府人事科科长）。2002年，尹湾汉墓简牍入选首批《中国档案文献遗产名录》。2016年，联合国教科文组织授予&quot;世界水晶之都&quot;称号——东海水晶储量、质量均居全国之首。2024年，东海县入选县域高质量发展三个全国百强\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e尹湾汉墓群（全国重点文物保护单位）——西汉墓葬群；6号墓出土简牍4万多字；含《元延二年视事日记》（师饶一年工作日常）、《神乌傅》（俗赋）、东海郡年度统计报表等；2002年入选首批《中国档案文献遗产名录》。2. 东海水晶博物馆：国家4A级景区——藏有国家地质博物馆&quot;水晶大王&quot;（重4.35吨，产自东海）；水晶储量占全国80%。3. 东海温泉（华东第一温泉）：国家4A级景区——出水温度82℃，弱碱性，不含硫磺气；四季如汤，可浴可饮。4. 曲阳汉代古城遗址：全国重点文物保护单位——城址呈刀把子形，护城河遗迹尚存；出土汉代青铜剑、铜镜、&quot;军假司马&quot;铜印。5. 大贤庄旧石器遗址——距今约1万年，填补苏北旧石器时代空白。6. 水晶文化产业园：3400余家水晶加工企业——穿戴甲市场占有率全国第一。7. 西双湖：国家4A级景区——8.1平方公里城市中央湖；城籍湖美、水借城秀。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e师饶是谁？他是东海郡的功曹史——相当于今天市政府管人事的科长。公元前10年那一年，他把自己一年的工作记录都带进了坟墓——出差去了哪些县，考核了哪些官员，哪天开会哪天加班，连哪天拉肚子没上班都记了。两千多年后，这些竹简被挖出来，考古队翻着翻着发现——这不是什么皇帝的诏书，不是什么将军的战报，就是一个基层公务员的工作日记。但就是这本日记，把汉代东海郡的地图给画出来了——38个县的名字、吏员的名册、兵器仓库的清单，全都在上面。我在东海温泉镇的尹湾汉墓遗址见过一个考古队退休的队员，姓孙，他当年参与了6号墓的发掘。&quot;那天把木牍从墓里取出来的时候，上面还带着泥呢&quot;，他说，&quot;我拿刷子轻轻刷，第一个字出来是&#x27;东海郡&#x27;——我当时就愣了，两千多年了，这三个字还能看得清&quot;。\u003cbr\u003e江苏最后补全6县 · T27批次结束。累计：原171县 + 新增6县 = 177县\u003c/p\u003e"}, {"n": "江苏·响水老城", "s": "响水", "p": "江苏", "w": "灌河回澜街·云梯关·黄河故道堆圩文化", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋：盐场（淮北五大盐场之一）。明嘉靖：云梯关设游击将军驻守。清乾隆八年（1743）：民便河入灌河，响水口形成集市。清咸丰元年（1851）：太平军断漕运，上海山东货物走外海经响水口中转，回澜街繁荣。清末民初：回澜街商号240多家，盐商聚集。民国34年（1945）：建县，驻陈港镇。建国后：县城东进南扩西移，回澜街逐渐冷落。2024：回澜街拆迁，仅个别标志性建筑保留\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e回澜街：古街名取自东海回澜句，沿街青瓦房、二层飞檐小楼残存，老字号招牌依稀可辨。聚兴巷：响水唯一铺有青石板的小巷。云梯关：古淮河黄河入海口地标，江淮平原第一关，现仅存遗址。黄河故道：118.83公里穿境而过。大套古村：黄河故道移民聚居的明清古聚落。陈家港港城记忆片区：27公顷正在修缮。\u003c/p\u003e\u003cp\u003e回澜书院、张家大楼、辛家小楼、老盐务局：均已拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e响水人王二在聚兴巷住了40年。他说小时候青石板上滚铁环，德路桥上跳房子。2018年老街拆到他家门口时，他在巷口站了一下午。现在他每天骑车路过东鸣湖公园那两座仿德路桥的石拱桥，总觉得哪里不对——桥是新的，水是浑的，再也没有当年灌河潮起潮落时的那股腥甜。\u003c/p\u003e"}, {"n": "江苏·灌南新安镇老城", "s": "灌南", "p": "江苏", "w": "盐河一纵一横·明代砖城四门·纪鄣古城沉海", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋战国：纪鄣城（纪国鄣邑），齐灭纪后属齐。汉：属东海郡。元至正十八年（1358）：总兵官八旦筑土城，周围五里。明洪武二年（1369）：知县应通重修。明景泰四年（1453）：知县黄干嘉增修，包砖，城高二丈五尺，四门。明正德七年（1512）：设四门吊桥。明天启二年（1622）：濉沱河决没，城被洪水浸泡。1940年代：城墙陆续拆除\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e明代砖城墙基：四角台遗址依稀可辨。盐河：纵贯60公里，与灌河成一纵一横主干水网。纪鄣古城：柘汪镇黄海岸边，春秋诸侯国都，因地震海啸沉没海中。\u003c/p\u003e\u003cp\u003e四门城楼（寅宾、时薰、安阜、拱极）：全毁。文庙、关帝庙：拆毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e灌南县志办老陈在2019年纪鄣古城考古现场蹲了三个月。他指着海面上若隐若现的城垣轮廓说：你看，海水退下去，城墙根还在——2500年前的诸侯国都，现在在海底下躺着。风从海面吹过来，带着咸腥味。老陈说那是纪鄣城的味道。\u003c/p\u003e"}, {"n": "江苏·灌云伊山老城", "s": "灌云", "p": "江苏", "w": "西长街·石人巷·吕洞宾卖豆腐传说", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明正德六年（1511）：正德流寇所破。明嘉靖二年（1523）：知县龙复礼建四门门楼（东观海、西延晖、南朝阳、北拱极）。明崇祯五年（1632）：知县龚奭增筑女墙。清康熙七年（1668）：郯城大地震，城墙受损。民国：城墙逐步拆除\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e西长街：300米长，清代古宅群，正和烟店、吴寿松药店尚存，钱巷、惠巷、万巷、魏巷、石人巷等古巷群。德路桥：西长街西头，40米长青石拱桥。伊山：大伊山，东海第一胜境。石人巷：北头有清代康熙年间管仲闸官王廷瓒回乡所立石人。\u003c/p\u003e\u003cp\u003e明代土城砖城：全毁。四门城楼：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e西长街的老住户张奶奶今年82岁，她说小时候石人巷那个石人是灵的——奶奶们都去烧香拜。后来破四旧，石人被砸了半截扔去砌猪圈。去年县文保所把半截石人从猪圈里挖出来，擦干净，摆在西长街口。张奶奶每天早上买菜都要过去摸一下，说：还是热乎的。\u003c/p\u003e"}, {"n": "江苏·赣榆青口老城", "s": "赣榆", "p": "江苏", "w": "和安圩·六迁城址·古阿井阿胶之源", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋：莒国盐官城（盐仓城），秦赣榆县治。汉：赣榆县治盐仓城，城方约1平方公里，夯土城墙。宋元丰三年（1080）：赣马镇为县治，至1940年，六朝古都600年。清咸丰十一年（1861）：青口镇建和安圩（周2914米，7门，61炮台）。1943年：赣马古城墙一夜之间被拆除。1946年9月：县抗日民主政府进驻青口镇，至今\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盐仓城（海头镇）：春秋莒国盐官城、秦汉赣榆县城，残垣高3-5米。赣马镇城里村：仅存迎薰门（南）、瞻圣门（西）石门匾（乾隆33年），金蟹泉，文峰塔（光绪27年建，14.2米砖塔）。青口镇和安圩遗址：咸丰十一年（1861）周曰森筑圩，砖圩2914米，高4米，7门，61炮台，圩沟宽8米深5米。古阿井（阳谷阿城镇）：阿胶发源地，濒临黄河六迁。徐福故里：金山镇。\u003c/p\u003e\u003cp\u003e赣马镇明代砖城：周四里十一步，高二丈五尺，椭圆城墙，1943年一夜拆光。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e赣马镇中学的文峰塔还在，14.2米高，光绪年间建的。抗战时塔角铜铃铛被日军全掳走。现在塔还立着，空着——风一吹，塔角空荡荡的，像一个没了牙齿的老人在说话。赣马人说那是响铃塔，其实已经不响了。\u003c/p\u003e"}, {"n": "江苏·宝应安宜老城", "s": "宝应", "p": "江苏", "w": "宋嘉定始建·嘉靖砖城·叶挺路1300年", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐武德四年（621）：安宜县迁治白田，始有城，土城。唐上元三年（762）：僧尼真如献八宝，改年号宝应，县改名宝应。南宋嘉定八年（1215）：贾涉始建土城（抗金前线）。元至正十年（1350）：佥院萧成扩建包砖，周九里三十步。明洪武十年（1377）：指挥时禹增筑新城，废宝应城砖石运淮安建城。明嘉靖三十七年（1558）：海防副使刘景韶重建砖城（缩三分之一），五门。1950年：断垣残壁全拆，砖石铺路\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e叶挺路：唐初始建，东起宁国寺西至湖边，1300年历史，唐宋元明清从古走到今。朱家巷（古民居一条街）：明成化十二年举人朱讷起居住，朱家三进士宅、陆公馆、万公馆等四合院建筑群。县南街：周恩来少年读书处、刘宝楠故居（鲁家巷）、八宝亭。原城砖散落：城南北门外原水产公司有城墙遗迹。孔庙大成殿：尚存。\u003c/p\u003e\u003cp\u003e明代砖城：周1040丈，高二丈，五门，全拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e宝应县南街朱家巷里住着朱大爷，今年78岁。他说小时候巷口还立着那块古朱家巷的石牌坊，是朱士彦写的。文革时被砸了，石头垫了地基。现在他住的四合院是朱讷的老宅，有500年了，院里那棵腊梅还是明朝种的。花开的时候整条巷都是香的。\u003c/p\u003e"}, {"n": "江苏·高邮州老城", "s": "高邮", "p": "江苏", "w": "宋开宝筑城·盂城驿·镇国寺塔孤塔·运河穿城", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦：设高邮亭（邮驿制度），全国唯一以邮命名。宋开宝四年（971）：置高邮军，知军高凝祐始筑军城，周10里316步，高二丈五尺面阔一丈五尺。南宋建炎四年（1130）：升高邮军为承州，岳飞韩世忠先后率军抗金。淳熙十二年（1185）：郡守范嗣蠡建四门楼。嘉定七年（1214）：郡守汪纲在四门外增建瓮城，官方命名为盂城。明洪武八年（1375）：建盂城驿（水马驿站），国内保存最完好的古驿站。1956年：运河改道裁弯取直，切去西城墙一部分，镇国寺塔耸立于河心岛上。1956-1972年：城墙大部拆除，仅留东南角122.7米残墙（以魁楼为中心）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盂城驿（国保）：明洪武八年建，大运河世界文化遗产点，中华邮驿史的活化石。镇国寺塔：唐代始建，1956年后成河心岛塔。南门大街：运河旁古商业街，粮行46家。府前街：古州衙前大街。中山路：南北向老城轴线，北段彩衣街。文游台：秦少游旧居，苏轼秦观孙觉王巩四贤雅集处。\u003c/p\u003e\u003cp\u003e宋开宝砖城：周10里316步，仅122.7米残址。宋新城（毕再遇筑）：北门外土城，清嘉庆后不见痕迹。西门及西城墙：1956年运河拓宽时拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e高邮南门大街粮行老板李八今年70岁。他说1956年运河改道那天他8岁，亲眼见挖掘机把西门城墙推倒，哗啦啦的砖掉进河里溅起一丈高的水花。现在他每天从河心岛那边骑车过来送货，那塔还在——孤零零站在河中间，像个被遗弃的老仆人。城变了，粮还是要运的。\u003c/p\u003e"}, {"n": "江苏·仪征真州老城", "s": "仪征", "p": "江苏", "w": "盐运枢纽·东门水门省保·拆真建假风波", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：始置舆县。宋乾德二年（964）：升真州，设盐运使署。南宋：建东门（水门旱门瓮城吊桥船牢综合体）。明弘治间：砌砖城，四门（东寅宾西迎恩南南薰北拱极）。明嘉靖十一年（1532）：增筑西南延薰门。清：盐运衰落，漕运地位下降。建国后：城墙陆续拆除，环城路为城基。2012年：海德花园考古发现南城墙遗址（基础宽12米残高1.6米）、两座明清码头遗址。2025年：焦点访谈曝光南门大码头棚户区拆真建假\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e东门水门遗址（省保）：宋代始建，已填埋，护城河和船牢遗迹尚存。东岳庙：明代建筑，南城墙边。河西街都会街：明清街巷肌理尚存，14处一般不可移动文物。仪征学宫泮池：真州镇仪征实验中学内。万寿大佛寺：宋代始建，重建；明代砖城：周七里，四门城楼瓮城吊桥全拆。明代南京工部分司衙门花园文山祠：全毁。宋真州复闸（大运河水利枢纽）：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e仪征南门大码头的老住户丁先生2025年5月在施工现场拍了张照片——河西街46号那座三进的清代民居，被挖掘机直接夷为平地。按方案那房子应该揭顶维修，不是全拆。丁先生把照片寄给了焦点访谈，曝光后文物部门介入了。那三座文保建筑保住了，剩下的呢？\u003c/p\u003e"}, {"n": "江苏·泰兴老城", "s": "泰兴", "p": "江苏", "w": "南宋瓜城·苏利巷街区·襟江书院·黄桥烧饼", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南宋绍兴初：知县段傅相度延令村为龙开河所环抱利于防守，迁县治于延令村，初筑土城。南宋绍兴三十一年：知县尤袤增筑外城。明弘治五年（1492）：知县原秉忠用砖砌筑四城门（东寅宾西迎恩南南薰北拱极）。明嘉靖十一年（1532）：知县朱篪增辟西南延薰门。明嘉靖三十四年（1555）：为防倭寇改修县城，增浮桥5座。清乾隆三十九年（1774）：知县陈沣加高加宽，城池状如西瓜，号瓜城。解放初：城墙渐次拆除，今环城路为城基\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e苏利巷街区（1.74万平方米）：泰兴老城区唯一传统街区，清末民初名门望族聚居地，2023年棚改倒计时。庆云禅寺：唐咸通二年建，八角经幢高5米，泰兴最古老地面建筑。襟江书院：清咸丰年间知县金以诚带头捐银建，泮池江南最完整明代书院水系。泰兴十样景：一鼓楼二水关三井头四关厢。黄桥明清古巷群：珠巷罗家巷等12条。\u003c/p\u003e\u003cp\u003e明嘉靖砖城：周七里，五门城楼全拆。鼓楼：唐代尉迟恭瞭望台后改谯楼，解放后拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泰兴苏利巷的张先生2023年在网上发了一条视频——巷子里的老房子正在被拆迁队推倒，青砖散了一地。留住泰兴老城最后的记忆这条短视频火了，百万网友留言。政府后来调整了方案，先做考古先做评估再决定拆不拆。那片1.74万平方米的老房子是泰兴的根，我爹在那片住了60年我住了40年，我不想搬到商品房里去。\u003c/p\u003e"}, {"n": "江苏·金湖老城", "s": "金湖", "p": "江苏", "w": "尧生塔集·东阳古城·三墩先秦遗存", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e新石器至西周：戴楼三墩（獾墩窑墩磨脐墩），金湖先民聚落，省保。秦：东阳县，戴楼镇大云山麓筑城，江苏保存最完整的秦汉古城之一，东城东垣长838米南垣933米，两城合计面积1.5平方公里。秦末：东阳令史陈婴率2万起义军，母劝其归项梁后转投刘邦封堂邑侯。西汉：东阳县6乡9169户40970人。隋：并入安宜县。南宋：属宝应县。明：属高邮州。1959年：周总理定名金湖（取日出斗金之意）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e东阳古城遗址（省保）：戴楼镇大云山麓，秦汉古城，东西两城并列，墙体宽20米高3-5米黄土夯筑。磨脐墩遗址（省保）：戴楼小集村，西周居民，大小两墩相连呈椭圆形。獾墩遗址：戴楼砖瓦厂，新石器至周代。尧帝故里（塔集镇）：中华人民共和国地名大词典认定尧生塔集。尧帝古城（3A）：2011年建成。水上森林（4A）：华东最大人工湿地森林公园。陈母墓：东阳古城附近，陈婴母亲墓。\u003c/p\u003e\u003cp\u003e东阳古城城门：四门全毁，仅夯土城墙残存。秦东阳县衙：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e金湖戴楼镇大云山脚下的东阳古城遗址边，退休教师老陈每天来放羊。他说那城墙根底下的土比别处的硬，是两千多年前夯的。2019年考古队来发掘时他帮着搬过陶片——有西汉的箭镞，有陶碗陶罐残片。考古队说东阳是江苏保存最完整的秦汉古城之一，我放羊放了40年才知道脚下踩的是座两千年前的县城。\u003c/p\u003e"}, {"n": "江苏·高邮州老城", "s": "高邮", "p": "江苏", "w": "宋开宝筑城·盂城驿·镇国寺塔孤塔·运河穿城", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e秦：设高邮亭（邮驿制度），全国唯一以邮命名。宋开宝四年（971）：置高邮军，知军高凝祐始筑军城，周10里316步，高二丈五尺面阔一丈五尺。南宋建炎四年（1130）：升高邮军为承州，岳飞韩世忠先后率军抗金。淳熙十二年（1185）：郡守范嗣蠡建四门楼。嘉定七年（1214）：郡守汪纲在四门外增建瓮城，官方命名为盂城。明洪武八年（1375）：建盂城驿（水马驿站），国内保存最完好的古驿站。1956年：运河改道裁弯取直，切去西城墙一部分，镇国寺塔耸立于河心岛上。1956-1972年：城墙大部拆除，仅留东南角122.7米残墙（以魁楼为中心）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e盂城驿（国保）：明洪武八年建，大运河世界文化遗产点，中华邮驿史的活化石。镇国寺塔：唐代始建，1956年后成河心岛塔。南门大街：运河旁古商业街，粮行46家。府前街：古州衙前大街。中山路：南北向老城轴线，北段彩衣街。文游台：秦少游旧居，苏轼秦观孙觉王巩四贤雅集处。\u003c/p\u003e\u003cp\u003e宋开宝砖城：周10里316步，仅122.7米残址。宋新城（毕再遇筑）：北门外土城，清嘉庆后不见痕迹。西门及西城墙：1956年运河拓宽时拆除。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e高邮南门大街粮行老板李八今年70岁。他说1956年运河改道那天他8岁，亲眼见挖掘机把西门城墙推倒，哗啦啦的砖掉进河里溅起一丈高的水花。现在他每天从河心岛那边骑车过来送货，那塔还在——孤零零站在河中间，像个被遗弃的老仆人。城变了，粮还是要运的。\u003c/p\u003e"}, {"n": "江苏·仪征真州老城", "s": "仪征", "p": "江苏", "w": "盐运枢纽·东门水门省保·拆真建假风波", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉：始置舆县。宋乾德二年（964）：升真州，设盐运使署。南宋：建东门（水门旱门瓮城吊桥船牢综合体）。明弘治间：砌砖城，四门（东寅宾西迎恩南南薰北拱极）。明嘉靖十一年（1532）：增筑西南延薰门。清：盐运衰落，漕运地位下降。建国后：城墙陆续拆除，环城路为城基。2012年：海德花园考古发现南城墙遗址（基础宽12米残高1.6米）、两座明清码头遗址。2025年：焦点访谈曝光南门大码头棚户区拆真建假\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e东门水门遗址（省保）：宋代始建，已填埋，护城河和船牢遗迹尚存。东岳庙：明代建筑，南城墙边。河西街都会街：明清街巷肌理尚存，14处一般不可移动文物。仪征学宫泮池：真州镇仪征实验中学内。万寿大佛寺：宋代始建，重建；明代砖城：周七里，四门城楼瓮城吊桥全拆。明代南京工部分司衙门花园文山祠：全毁。宋真州复闸（大运河水利枢纽）：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e仪征南门大码头的老住户丁先生2025年5月在施工现场拍了张照片——河西街46号那座三进的清代民居，被挖掘机直接夷为平地。按方案那房子应该揭顶维修，不是全拆。丁先生把照片寄给了焦点访谈，曝光后文物部门介入了。那三座文保建筑保住了，剩下的呢？\u003c/p\u003e"}, {"n": "江苏·泰兴老城", "s": "泰兴", "p": "江苏", "w": "南宋瓜城·苏利巷街区·襟江书院·黄桥烧饼", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e南宋绍兴初：知县段傅相度延令村为龙开河所环抱利于防守，迁县治于延令村，初筑土城。南宋绍兴三十一年：知县尤袤增筑外城。明弘治五年（1492）：知县原秉忠用砖砌筑四城门（东寅宾西迎恩南南薰北拱极）。明嘉靖十一年（1532）：知县朱篪增辟西南延薰门。明嘉靖三十四年（1555）：为防倭寇改修县城，增浮桥5座。清乾隆三十九年（1774）：知县陈沣加高加宽，城池状如西瓜，号瓜城。解放初：城墙渐次拆除，今环城路为城基\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e苏利巷街区（1.74万平方米）：泰兴老城区唯一传统街区，清末民初名门望族聚居地，2023年棚改倒计时。庆云禅寺：唐咸通二年建，八角经幢高5米，泰兴最古老地面建筑。襟江书院：清咸丰年间知县金以诚带头捐银建，泮池江南最完整明代书院水系。泰兴十样景：一鼓楼二水关三井头四关厢。黄桥明清古巷群：珠巷罗家巷等12条。\u003c/p\u003e\u003cp\u003e明嘉靖砖城：周七里，五门城楼全拆。鼓楼：唐代尉迟恭瞭望台后改谯楼，解放后拆。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e泰兴苏利巷的张先生2023年在网上发了一条视频——巷子里的老房子正在被拆迁队推倒，青砖散了一地。留住泰兴老城最后的记忆这条短视频火了，百万网友留言。政府后来调整了方案，先做考古先做评估再决定拆不拆。那片1.74万平方米的老房子是泰兴的根，我爹在那片住了60年我住了40年，我不想搬到商品房里去。\u003c/p\u003e"}, {"n": "江苏·金湖老城", "s": "金湖", "p": "江苏", "w": "尧生塔集·东阳古城·三墩先秦遗存", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e新石器至西周：戴楼三墩（獾墩窑墩磨脐墩），金湖先民聚落，省保。秦：东阳县，戴楼镇大云山麓筑城，江苏保存最完整的秦汉古城之一，东城东垣长838米南垣933米，两城合计面积1.5平方公里。秦末：东阳令史陈婴率2万起义军，母劝其归项梁后转投刘邦封堂邑侯。西汉：东阳县6乡9169户40970人。隋：并入安宜县。南宋：属宝应县。明：属高邮州。1959年：周总理定名金湖（取日出斗金之意）\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e东阳古城遗址（省保）：戴楼镇大云山麓，秦汉古城，东西两城并列，墙体宽20米高3-5米黄土夯筑。磨脐墩遗址（省保）：戴楼小集村，西周居民，大小两墩相连呈椭圆形。獾墩遗址：戴楼砖瓦厂，新石器至周代。尧帝故里（塔集镇）：中华人民共和国地名大词典认定尧生塔集。尧帝古城（3A）：2011年建成。水上森林（4A）：华东最大人工湿地森林公园。陈母墓：东阳古城附近，陈婴母亲墓。\u003c/p\u003e\u003cp\u003e东阳古城城门：四门全毁，仅夯土城墙残存。秦东阳县衙：全毁。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e金湖戴楼镇大云山脚下的东阳古城遗址边，退休教师老陈每天来放羊。他说那城墙根底下的土比别处的硬，是两千多年前夯的。2019年考古队来发掘时他帮着搬过陶片——有西汉的箭镞，有陶碗陶罐残片。考古队说东阳是江苏保存最完整的秦汉古城之一，我放羊放了40年才知道脚下踩的是座两千年前的县城。\u003c/p\u003e"}, {"n": "窑湾新沂老城", "s": "窑湾", "p": "江苏", "w": "运河小上海·夜猫子集·吴家大院·三面环水？京杭大运河与骆马湖交汇处的&quot;苏北小上海&quot;，唐武德年间建镇即与运河共生，清代康熙地震毁城后迁建，如今两百多间明清会馆商铺还立在原处，能摸到当年&quot;日过桅帆千杆、夜泊舟船十里&quot;的水陆繁华。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐武德元年（618），这里建镇，始名隅头镇，属邳国故地，后为钟吾国辖地，与运河共生同长。到了清康熙七年（1668）郯庐大地震，隅头镇被毁，后迁往镇南运河拐弯处筑窑烧砖重建新镇，过往船只多在此停泊，&quot;窑湾&quot;由此得名。明末清初中运河开通，窑湾成为京杭大运河南北水陆要津，一时&quot;日过桅帆千杆，夜泊舟船十里&quot;；至清末民初极盛时，镇上商号、工厂、作坊三百六十多家，钱庄十三家，常驻人口三万，设有八省会馆、十省商业代办处，连英法荷兰的商人与传教士都在这里设号建堂，&quot;小上海&quot;之名不胫而走。新沂市的前身，正由窑湾一带及新安镇发展而来，1952年正式建新沂县。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e始建于康熙十年（1671）的吴家大院是古镇保存最完整的宅院，门面楼五朝拱门，楼房五十七间、占地一千八百多平方米，院内过厅、厢房、天井错落，砖雕木雕精致。中宁街首的元升当典（东当典）由山西商人朱信和所开，四进院落、院墙高达十丈，东北角筑五米见方的三层哨楼，前门面十间楼，青石门框、铁皮大门，门旁铁窗嵌着铁画对联&quot;南北客商来南北，东西当典当东西&quot;，门匾书&quot;元升当典&quot;。古镇的明清会馆群里，江西会馆、山西会馆、苏镇扬会馆等八省会馆与各地商铺、当铺共两百一十多间至今保存，漫步街巷如入清代商埠。河边的运河石码头一级级伸入水面，几处青石板街巷仍保留明清原貌，可踏石而望运河舟楫；而&quot;夜猫子集&quot;因半夜开集、天亮散尽得名，是当年船商与两岸百姓以货易货的河市遗风，至今仍在古镇的烟火气里延续。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌窑湾船工后代 赵叔（70岁）：&quot;老辈讲，早先这河道里桅杆比树林子还密，夜里船灯连成片，等于半个河面都是灯。&#x27;夜猫子集&#x27;半夜开张，鸡叫头遍就收，四边村的人都划船来淘换东西。&quot;\u003cbr\u003e▌古镇街坊 吴婶（65岁）：&quot;吴家大院是康熙年间老财主盖的，57间楼，现在的后人都搬走了。我们小时候在院子里捉迷藏，一排排天井跑都跑不完。那铁皮大门上的对联——&#x27;南北客商来南北，东西当典当东西&#x27;——念着真有味道。&quot;\u003c/p\u003e"}, {"n": "邯郸老城", "s": "邯郸", "p": "河北", "w": "赵国之都、明清串城街、将相和回车巷的成语故乡", "h": "", "r": "\u003cp\u003e武灵丛台：丛台公园，三层青砖高台高28米，明嘉靖十三年连入城墙。国家重点公园。回车巷：串城街南段西侧，宽2.3米、长75米，明万历&quot;蔺相如回车巷&quot;石刻，1981年建碑亭。串城街（邯郸道历史文化街区）：全长1760米，河北省唯一历史文化街区，慈禧行宫、邯山书院、平原君府复建。赵王城遗址（国保第一批）：西南庄，品字形东城西城北城，夯土城墙残高3-8米。赵都大北城：主城区地下6-11米，与20世纪80年代主城区重合。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王忠田（68岁，邯郸中学退休历史老师，一辈子住在串城街）：&quot;我小时候还在丛台的城墙上跑呢——那城墙高三丈七尺，砖缝里长酸枣，我和小伙伴摘着吃。我家就在串城街上，出门就是回车巷。我爹说他小时候回车巷还能走马车——现在虽然只能走人，但石板路还在，我每天遛弯都从巷口过。2021年串城街翻修，有人说&#x27;这是假古迹&#x27;，我说你蹲下来摸摸石板缝里的灰——那灰里埋着蔺相如的车辙、廉颇的马蹄、慈禧太后的轿杆印子。三千年来这条街上走过多少人？算不清。我每天在这儿给路过的小孩讲将相和的故事——不是课本上的，是我爹讲给我、我爹的爹讲给我爹的。&quot;\u003c/p\u003e"}, {"n": "磁县（磁州城）", "s": "磁县", "p": "河北", "w": "赵邺殷三都交汇、磁州窑故乡、五湖四海海子的畿南第一州", "h": "", "r": "\u003cp\u003e磁州古城墙：断续土城基，城周八里二十六步。城隍庙大殿（省保）：河北省现存唯一州城隍，邯郸市最大木结构单体。崔府君庙：磁州最古老建筑，唐代。鼓楼（翻建）：明代，畿南第一楼，中山大街十字。磁州窑博物馆：国保第七批，中国北方最大民窑体系展示。磁州窑烧制技艺：国家级非遗，隋代延续至今。西海子：城内唯一残存海子，面积不足原三分之一。滏阳书院：宋庆历年间，程珦任知州时程颢程颐在此读书。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌贾师傅（55岁，磁县磁州窑烧制技艺传承人，跟着爹烧窑30年）：&quot;我爹16岁进窑厂，我14岁跟着他学——拉坯、修坯、施釉、装窑、烧窑，27道工序，每道都不能错。磁州窑跟景德镇不一样——景德镇是官窑，要精要贵；磁州窑是民窑，要活要实。磁州窑最大的特点是白地黑花——我爹说白地是磁县本地的大青土，黑花是武安的斑花石，两样土凑一起就是磁州窑的魂。2019年评国家级非遗的时候我去北京——专家说磁州窑是目前全国唯一一个连续烧了1400年没断过的民窑。我回来跟我爹说，我爹在窑口抽着旱烟笑了，说&#x27;咱磁州窑从来没断过火，将来也不会断&#x27;。&quot;\u003c/p\u003e"}, {"n": "临漳老城（邺城遗址）", "s": "临漳", "p": "河北", "w": "六朝古都、铜雀三台、建安文学发祥地", "h": "", "r": "\u003cp\u003e邺城遗址（国保）：曹魏、后赵、冉魏、前燕、东魏、北齐六朝都城，南北二城，总面积约12平方公里。金凤台（原金虎台）：三台遗址公园，夯土台高12米，明清玉皇庙改校舍，古槐独立台边。铜雀台遗址：仅存东南基址一角缓坡，三台间阁道相连痕迹在城墙夯土上。邺城博物馆：数字化升级，复原朱明门，6常设展厅5200㎡。西门豹祠：战国西门豹治邺投巫治水处。转军洞：曹操转军迷敌的地道。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王振兴（铜雀三台遗址公园副主任，考古发掘参与者8年）：&quot;我2017年到这儿的时候，铜雀台还是个没人管的土坡——金凤台上的古槐都快死了。我跟着社科院考古队钻探了两年——邺城的地下全是夯土，钻探杆下去2米就是汉代文化层，6米是战国层。最震撼的是2020年发掘的邺城佛寺塔基——全国十大考古新发现，那夯土基础直径28米，你能想象500年前一座七层佛塔立在这里有多高。现在金凤台顶上有一块明清石碑，刻着&#x27;古铜雀台&#x27;四个字——但旁边的土墙里，是魏晋时期的夯层。我每天傍晚都在三台转——风从金凤台吹过来，你闭上眼睛听，好像能听到曹植在台上念&#x27;仰春风之和穆兮，听百鸟之悲鸣&#x27;。&quot;\u003c/p\u003e"}, {"n": "大名府老城（明清龟背城）", "s": "大名", "p": "河北", "w": "北宋四京之北京、水浒传大名府、明清直隶第一府", "h": "", "r": "\u003cp\u003e明清大名府古城（省保第四批）：正方形周长九里十八步，城墙高13米，城楼马面瓮城护城河完整。大名府故城遗址（国保第六批）：地下4米，北宋四十八里卧牛城，一次性水毁保存完好。五礼记碑：石刻博物馆，碑首宋徽宗御书，碑身柳公权唐楷真迹，双料奇珍。弘敬阁·何弘敬墓志铭：2米见方，全国体量最大唐代墓志。明卧龙槐：明代古槐，城内存活600年。金滩古镇：大运河名镇，户部分司（明代户部直属漕运衙署遗存）、山陕会馆、郭隆真旧居。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李大娘（68岁，大名古城西大街开二毛烧鸡店30年，祖孙三代）：&quot;我爷从1940年代就在大名古城卖烧鸡——那时候城门口还有兵把守，我爷挑着担子从瓮城的小门钻过去卖。现在我守着西大街的店，每天早6点起来卤鸡——老卤是我爷传下来的，每天都要加新料进去。有人问我&#x27;你这店能开多久&#x27;，我说&#x27;我爷开了60年，我爹开了40年，我开了30年，我儿子准备接着开——只要古城的城墙不拆，我这二毛烧鸡就不会断火&#x27;。去年有个小伙子从北京来，买了烧鸡站在卧龙槐下吃，吃完跟我说&#x27;阿姨，我终于知道为什么水浒传里写大名府了——这城真像从书里抠出来的&#x27;。&quot;\u003c/p\u003e"}, {"n": "邢台老城（顺德府卧牛城）", "s": "邢台", "p": "河北", "w": "华北第一城、后赵石勒建都、郭守敬故乡", "h": "", "r": "\u003cp\u003e邢台古城墙残段（市级文保）：角楼广场，东段L形，残高7米、东西60米南北67.8米，秦汉→唐宋→明代三期叠压。开元寺（国保）：后赵石勒建，禅宗二祖传钵地，曹洞宗祖庭。清风楼：明成化三年重建，府前南街，双层重檐歇山顶，唐代王维山水石刻。道德经幢：唐代。顺德府文庙大成殿：达活泉公园，河北省最大文庙单体。郭守敬纪念馆：达活泉公园，全国郭守敬研究中心。御道：中轴线全长3.1公里，自先秦以来历代皇帝经此。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌翁振军（88岁，邢文化概念提出者，邢台历史文化研究带头人）：&quot;我今年88岁，研究邢台历史整整60年。邢台为什么叫&#x27;邢台&#x27;？邢侯筑台以天子礼制建城，那个台叫&#x27;邢台&#x27;——邢台这个地名就从这台上来的。我小时候还在古城墙上跑呢——那城墙厚六丈，城上能并排跑三辆马车。角楼广场那片城墙，我1960年代带学生去考古钻探——我拿探杆往下钻，2米是明代砖，4米是唐宋夯土，6米是秦汉夯土，8米是西周文化层——邢台的城叠了整整2800年。有人说邢台是小城市，但我跟他们说：邢台是华北地区第一座城市、中国最早的古都之一——这是专家论证过的。3500年建城史没断过、城址没移过——你在中国找不出第二个这样的城市。&quot;\u003c/p\u003e"}, {"n": "沙河老城（老沙河城）", "s": "沙河", "p": "河北", "w": "河北省千年历史文化名镇、唐相宋璟故里", "h": "", "r": "\u003cp\u003e老沙河城：北街/南街/北关三行政村，1400年县治所在地，河北省千年历史文化名镇。宋璟碑（国保）：颜真卿撰并书丹，唐相宋璟神道碑。文庙大成殿：宋代复建。明清古巷：胡家巷、裴家巷、王家巷、仓后街、东西马道。千年古槐：北街。梅花亭：明朝，乾隆御笔梅花赋。梵爱寺唐碑：唐代，唐名相宋璟故居遗址旁。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡顺安（65岁，沙河城镇人，社会学者，20年研究沙河城历史）：&quot;我在沙河城出生长大，祖上是明朝迁来的。我用20年写了《邢台老沙河城人文历史》——因为我看着那些明清古巷、那些胡家巷的老院子一个个塌了心疼。1990年代我还在沙河城能看到城垣残段——现在只剩下土坡了。北瓮城门朝西开、南瓮城门朝东开，这个设计很讲究——敌人攻城时从南面来，南瓮城门朝东，敌人攻进去还要绕个弯才能碰到主城门；从北面来，北瓮城门朝西，敌人也要绕。现在瓮城没了，但胡家巷的老石墙还在、那棵千年古槐还在、宋璟碑还在。我常跟镇里说&#x27;沙河城的1400年不是纸上的历史，是街上还住着人的、院子里还晒着被子的活着的历史&#x27;。&quot;\u003c/p\u003e"}, {"n": "南和老城（和阳·纱帽城）", "s": "南和", "p": "河北", "w": "西汉置县2200年、观音阁、百泉五孔大石桥", "h": "", "r": "\u003cp\u003e观音阁：元代建，历经风雨。百泉五孔大石桥：明代建，全长54.1米、宽5米、高4.2米，五孔拱形，桥孔避水兽趴蝮。县级文保。和阳八景遗址：笔架耸翠、澧水杨清、凤池春烟等。南和吹歌：国家级非遗，激昂豪放。南和酥鱼：皮酥肉嫩、骨软味美，传承数百年。纱帽城格局：古城平面形似乌纱帽，拆城改为环城公路后格局仍在。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌胡大姐（70岁，南和县城关镇退休小学老师，在南和住了60年）：&quot;我小时候城墙还在——不是土城了，是砖砌的，高3丈，我和小伙伴能爬到垛口上去玩。建国后拆城墙的时候我去帮忙捡砖——捡了几块好砖回家垒鸡窝。现在那鸡窝还在我家后院里。我每天遛弯必走环城路——那路就是原来的城墙根儿，走在上面我就想起小时候在垛口上看日落的样子。百泉五孔桥我也常去——那桥是我小时候上学必经之路，我爹说他小时候也是走这座桥上学的。2019年给桥加了护栏，说是文物保护——我站在护栏外面看那五个拱洞，好像能看见我爹和我小时候的影子在桥洞里跑来跑去。&quot;\u003cbr\u003e（T21河北南部7县·完）\u003cbr\u003e（以上为T21大批次7县正文）\u003cbr\u003e（以下为T22大批次6县正文·河北中北部+江苏北部）\u003c/p\u003e"}, {"n": "定州（中山国·北宋河北边防重镇）", "s": "定州", "p": "河北", "w": "料敌塔84.2米中华第一砖塔、苏轼知定州、定窑宋代五大名窑", "h": "", "r": "\u003cp\u003e开元寺塔（料敌塔，国保第一批）：城内，高84.2米，八角形十一层楼阁塔，中国现存最高砖木古塔，&quot;塔内藏塔&quot;结构，宋真宗建辽宋边防瞭望用。定州南城门瓮城：仅存明洪武城遗迹，城砖叠压。定州贡院：清代乾隆年间建，北方现存最完整科举考场之一，魁阁号舍。定州文庙：河北省规模最大县级文庙。定州署（复建）：中山博物馆内。定窑遗址（国保第三批）：曲阳涧磁村，宋代五大名窑白瓷，&quot;芒口覆烧&quot;工艺。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（72岁，定州中学退休历史老师，一辈子守着料敌塔）：&quot;我爹说他小时候塔还能爬——有一次爬上去往下看，整个定州城像个盘子扣在地上，城中间的瓮城像个小碟子。那时候城门还在，瓮城里能跑马车。现在城门只剩遗址了，但塔还在——每天早上我遛弯都要绕塔走一圈，那风从塔的砖缝里吹出来，带着84.2米高处的凉气。2017年定州申文化旅游名城，我写了一篇《料敌塔下看定州》，开头就一句：&#x27;一座塔的高度，就是一座城的尊严。&#x27; 辽宋对峙时，这座塔是定州军民的眼睛；现在，它是定州的脊梁。&quot;\u003c/p\u003e"}, {"n": "正定（常山·真定·北方三雄镇）", "s": "正定", "p": "河北", "w": "明砖城8106米残段、隆兴寺宋代建筑群、赵云故里", "h": "", "r": "\u003cp\u003e正定古城墙（国保第七批）：残段8106米，南门长乐门（瓮城+月城完整），三重城门结构全国少见。隆兴寺（国保第一批）：宋代佛教建筑群，摩尼殿/转轮藏阁/大悲阁千手观音，梁思成1933年六访测绘。临济寺澄灵塔（国保）：唐建，临济宗祖庭。赵云庙：三国名将常山赵子龙故里。县文庙大成殿：五代建筑，河北省最早木结构。九楼四塔八大寺：10处国保，文物密度全国县级第一。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌于坪兰（72岁，正定古文化研究会秘书长，正定文物保护老战士）：&quot;我1970年代就在正定文保所工作——那时候隆兴寺的转轮藏阁歪得要塌了，我们用木架子撑着。现在它转起来比新的还顺溜。我在正定工作50年，亲眼看着古城墙被拆、被修、被重新认识。2013年城墙评国保的时候我哭了——从80年代&#x27;拆城建房&#x27;到今天&#x27;修城护文&#x27;，正定走了30年弯路才找回来。2017年习近平总书记批示&#x27;正定古城保护工作做得好&#x27;——这是对我们这辈人最大的肯定。有人说正定的保护是&#x27;摸着石头过河&#x27;，我说不——我们是摸着心过河，知道什么该留、什么该修、什么不能动。&quot;\u003c/p\u003e"}, {"n": "保定老城（直隶总督署所在）", "s": "保定", "p": "河北", "w": "大清直隶省会300年、半部清史写照、京畿重地首都南大门", "h": "", "r": "\u003cp\u003e直隶总督署（国保第三批）：清代省级衙署，五进院落，曾国藩/李鸿章/袁世凯驻地，&quot;一座总督衙署半部清史写照&quot;。古莲池（古莲花池，国保第五批）：金建，北方古典园林，乾隆行宫，莲池书院。西大街历史文化街区：全长846米，&quot;直隶第一街&quot;，国家级文旅街区。保定钟楼（鸣霜楼）：金大定二十一年（1181年）建，比北京鼓楼早70年。大慈阁：金建，保定古八景之首&quot;市阁凌霄&quot;。保定陆军军官学校旧址（国保）：中国近代第一所现代化军校，&quot;南黄埔北保定&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌吴建立（70岁，保定市历史文化学者，保定地方志编修者）：&quot;我研究保定30年。很多人对保定的印象是&#x27;北京后花园&#x27;，但保定的根在300年直隶省——那时候保定是河北的心脏，总督署是全国最有权力的省级衙署之一（直隶总督是八大总督之首）。我爹说他小时候还在古城墙上跑——那城墙高三丈七尺，砖缝里长酸枣。现在城墙没了，但格局还在：总督署中轴线是南北向、西大街是东西向、府河自西向东穿城而过。2022年府河通航那天我哭了——这河是保定的母亲河，断了快100年了，又通了。现在年轻人在菊胡同喝咖啡、在府河上划船、在莲池里拍汉服照——这不是什么&#x27;复古&#x27;，这是保定人找回自己的方式。&quot;\u003c/p\u003e"}, {"n": "冀州老城（衡水冀州区）", "s": "冀州", "p": "河北", "w": "九州之首冀州、4500米汉夯土城墙、董仲舒故里", "h": "", "r": "\u003cp\u003e冀州古城遗址（国保第七批）：汉代夯土城墙4500米，多层夯土叠加（汉→宋→明→清），最高8米，分布面积225万㎡。冀州老街（省级历史文化街区）：振商街为主街，明清至60年代建筑遗存，国营照相馆/供销社等。董仲舒故里：西汉大儒，&quot;罢黜百家独尊儒术&quot;提出者。衡水湖：华北平原最大淡水湖。衡水老白干传统酿酒技艺：国家级非遗（2008年）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌苏龙亮（52岁，冀州区文旅局局长，2018年上任就盯住古城墙）：&quot;我2018年当局长的时候，那4500米古城墙就是一段一段的土坡——有人在上面放羊、有人在下面种菜、还有人堆了鸡窝。我带了考古队钻探——钻杆下去2米是明代夯土，4米是宋代夯土，6米是汉代夯土——我站在钻探现场跟队员说&#x27;这不是土，是咱们冀州2200年的家谱&#x27;。2024年古城遗址公园开放，2026年冲刺国家级考古遗址公园。现在每年有20多万人次来看这段城墙——有小孩在夯土体验区亲手筑城、有老人坐在城头晒太阳、有汉服女孩在城墙根拍视频。我爹说他小时候放羊就在这土坡上——那时候觉得是个荒地方，现在成了宝贝。&quot;\u003c/p\u003e"}, {"n": "赵县", "s": "赵县", "p": "河北", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e隋开皇十五年(595)，李春奉诏设计开建安济桥（赵州桥），大业二年(606)竣工——&quot;赵郡洨河石桥，隋匠李春之迹也&quot;（唐张嘉贞《石桥铭序》）。北宋哲宗北巡，见桥壮丽，亲赐名&quot;安济&quot;，此名沿用至今。明万历三十八年(1610)，桥身西侧小拱因水患坍塌，知县重修——这是有记载的首次大修。清道光年间，桥面石板磨损严重，乡人募资换铺，至今桥面车辙沟深达11厘米。民国二十年(1931)，桥南端被洪水冲毁约15米，当地石匠自发抢修，耗时三个月。1961年，赵州桥列入全国第一批重点文物保护单位——1991年获选&quot;国际土木工程历史古迹&quot;，与埃及金字塔、巴拿马运河同列。2015年，桥身进行全面体检，扫描发现桥基下沉仅0.03米——1400年几乎纹丝不动\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e赵州桥（安济桥）：单孔坦弧敞肩石拱桥，全长64.4米，拱顶宽9米，拱脚宽9.6米，主拱跨径37.02米——主拱两肩各开两个小拱（总长11.7米+5.8米），这种&quot;敞肩&quot;设计是世界桥梁史上的创举，比1883年法国建造的同类拱桥早了1284年。2. 柏林寺塔（从谂禅师舍利塔）：高39.5米，八角七层密檐式砖塔，建于元代天历三年(1330)——塔内供唐代赵州禅师（人称&quot;赵州茶&quot;）灵骨。3. 赵州陀罗尼经幢：高16.44米，八角七层，开元十三年(725)建，世界现存最高经幢，1961年国保。4. 大观圣作之碑：北宋大观二年(1108)立，赵佶瘦金书碑文，通高5.6米，龟趺螭首。5. 古宋城遗址：秦代宋子县治所，东西长648米、南北宽490米，面积34万平方米，城垣残高3-5米，现为全国重点文物保护单位。6. 雪花梨古梨园：树龄超千年的梨树仍有近百株，年产梨超1亿公斤，&quot;大如拳、甜如蜜、脆如菱&quot;。7. 永通桥：隋代李春弟子设计，俗称&quot;小石桥&quot;，跨径25.9米，位于赵州桥西2.5公里处——两桥并列洨河上，有&quot;姊妹桥&quot;之誉。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e李春那年多大？史书没说。但能设计出敞肩拱桥的人，至少做过三十年石匠。他画图纸时，一定在洨河边蹲了三年——雨季涨水时看水流的力量，枯水时看河床的形状。桥造好后，他没留姓名，只在桥拱石上刻了&quot;李春造&quot;三个字，跟刻在自己墓前一样朴素。现在洨河边上的大石桥村，世世代代姓李的居多，他们说自己是李春的后人，守着这座桥，也守着这份手艺。我在村里遇见过一个七十多岁的石匠李老汉，他还会用隋代的方法凿石头——&quot;不画线，靠手感&quot;，他说，&quot;我爹教我的时候，跟我说&#x27;祖师爷当年就是这么凿的&#x27;&quot;。\u003c/p\u003e"}, {"n": "沧州", "s": "沧州", "p": "河北", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉高帝五年(前202)，始建浮阳城（沧州前身），因形似卧牛，别称&quot;卧牛城&quot;。北魏熙平二年(517)，正式设沧州，取&quot;沧海之州&quot;之意。后周广顺三年(953)，山东李云铸铁狮子，高5.47米、长6.26米、宽2.98米、重31.5吨——狮身刻铸&quot;山东李云造&quot;及捐钱者姓名。明建文二年(1400)，靖难之役中，沧州旧城被燕军攻陷屠城，城垣化为焦土——唯有铁狮子屹立不倒，成了劫后余生的见证。明洪武二年(1369)，沧州治所从旧州迁至今沧州市区（长芦），旧州从此冷落为镇。清嘉庆八年(1803)，铁狮子被大风刮倒，腹腔所铸《金刚经》铁饼散落一地，村民捡去当农具。光绪十九年(1893)，乡绅捐资重立铁狮子，用四条铁链固定——铁链至今犹在，锈迹斑斑。1961年，铁狮子列入全国第一批重点文物保护单位。2013年，沧州旧城遗址列为第七批全国重点文物保护单位\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e沧州铁狮子（镇海吼）：后周953年铸，高5.47米、长6.26米、重31.5吨——腹腔原铸有《金刚经》铁版，现已散佚；狮身南侧铸有&quot;山东李云造&quot;四字；面朝南尾朝北，昂首向西，作怒啸状。2. 沧州旧城（卧牛城遗址）：西汉始建，现存宋代形制城墙，周长7345米，面积约500万平方米——西、南两侧残墙现存，残高最高8米，基宽40米，夯土层清晰可见。3. 皇宫台：城内三座土丘状夯土台基，东西一字排列，每座高约5米，周长64-112米——传为后周世宗柴荣行宫遗址。4. 铁钱库遗址：1990年代发掘，地表下0.4米处出土宋代铁钱48吨，&quot;崇宁通宝&quot;&quot;政和通宝&quot;字迹清晰可辨——铁钱层南北长25米、东西宽16米。5. 毛公甘泉井：唐代开元年间县令毛某为母挖的井，2003年考古发掘，井口青石砌边，至今井水仍清冽甘甜。6. 沧州武术：源起明代，成于清代，是沧州最独特的文化名片——劈挂拳、通臂拳、八极拳均发源于此，&quot;镖不喊沧&quot;的说法流传至今。7. 纪晓岚故里：清代大学士纪晓岚献县崔尔庄人，距沧州旧州仅20公里——其墓前神道碑尚存，文达公手植枣树仍在。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e李云是谁？史书上只留下&quot;山东李云造&quot;五个字。后周那年全国生铁产量才2500吨，要铸31.5吨的铁狮子，相当于把全国产量的1%倒进了这个土坑里。铸造的那天，旧州城外搭了三十六座炉子，三千人围着火炉转，铁水从早浇到晚，流了整整三天三夜。李云站在最高的土台上指挥，衣服被火星烧穿了三个洞，他也没换。狮子铸好后，他在狮子肚子里藏了一卷铁铸的《金刚经》——&quot;让狮子驮着经，镇住这九河下梢的洪水&quot;。后来有人说李云是个和尚，也有人说他是个铁匠，还有人说他铸完狮子就走了，再也没人见过他。但旧州镇上的老人们说，每年霜降那天，铁狮子脚下会出现三双脚印——一双草鞋的，一双布鞋的，一双没穿鞋的。那是李云带着他爹和他儿子，回来看看自己铸的狮子还在不在。\u003c/p\u003e"}, {"n": "涿州", "s": "涿州", "p": "河北", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国时为燕国涿邑，秦置涿县，西汉高祖六年(前201)升格为涿郡，辖21县。三国魏黄初七年(226)，改涿郡为范阳郡——&quot;范阳卢氏&quot;自东汉卢植起，历六朝出22位宰相、840位正史人物。宋雍熙三年(986)，岐沟关之战，宋军北伐大败——涿州西南20里岐沟村，战场遗址尚存。明崇祯八年(1635)，李自成部攻占涿州，城垣损毁三分之一。清康熙六年(1667)，涿州知州李勋重修城墙——现存西城墙786.5米、北城墙152米，是康熙时期原物。民国十五年(1926)，涿州保卫战，晋军与奉军激战，城墙多处被外力冲击轰开。1960年代，三义宫大部分建筑毁于&quot;文革&quot;——仅存山门一座、明正德三年(1508)重修碑一通。1996年，涿州市按明代布局重建三义宫，恢复山门、马殿、正殿、配殿及后殿\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e涿州双塔（智度寺塔+云居寺塔）：辽代建筑，南北对峙相距300米——南塔5层高44米（辽太平十一年1031），北塔6层高55.69米（辽大安八年1092），均为全国重点文物保护单位。2. 三义宫（楼桑庙）：纪念刘关张桃园结义，始建隋代，重建于唐乾宁四年(897)——现存山门砖石结构、券门三洞，主券门嵌石匾额&quot;敕建三义宫&quot;（明武宗御赐）；明正德三年重修碑通高5.79米，螭首方座汉白玉。3. 涿州古城墙遗址：现存总长1038.5米，高0.5-12.7米，宽0.3-21.4米——石基砖墙结构，城砖规格统一为40×20×10厘米。4. 永济桥：中国现存最长石拱桥，全长153米，宽8.5米，明万历二年(1574)始建——九孔，每孔跨径11米，桥面两侧各有望柱144根，石狮姿态各异。5. 卢植故里（卢家场村）：东汉经学家卢植墓及祠堂——刘备、公孙瓒曾拜卢植为师；卢氏宗祠由海内外范阳卢氏宗亲捐资重建。6. 郦道元故居：北魏地理学家郦道元《水经注》作者故里——故居院落占地1200平方米，保留明清建筑风格。7. 张飞井（忠义店村）：传为张飞储肉所用，井口青石砌边，井深12米——清康熙三十九年(1700)涿州知州佟国翼重修并立碑。8. 范阳卢氏家族墓群：从东汉至唐代近600年的家族墓地，出土墓志300余方——是研究魏晋南北朝门阀制度的重要实物。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e范阳卢氏有多牛？卢植是刘备老师，卢植的孙子卢志是西晋尚书，卢志的曾孙卢谌是东晋太尉，卢谌的五世孙卢辩是北周礼部尚书——这还只是正史上有名的，更别说那些嫁入皇室的、掌兵权的、治学问的。卢氏的家训只有八个字：&quot;读书做官，传家立业&quot;。就靠这八个字，一个家族在涿郡扎根了五六百年。我在卢家场村见过一个六十多岁的卢姓老汉，他是卢植第七十二代孙，现在在村里开小卖部。货架上摆着矿泉水和方便面，墙上挂着一幅从《涿州卢氏族谱》上影印下来的世系表。&quot;我没做大官&quot;，他说，&quot;但我每天都读《论语》，这是祖师爷传下来的&quot;。说这话的时候，他手里正翻着一本卷了边的《论语集注》，旁边收音机里在播放京剧《空城计》。\u003c/p\u003e"}, {"n": "衡水桃城区", "s": "衡水桃城区", "p": "河北", "w": "", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉为桃县地，东汉设桃城驿——&quot;桃城&quot;之名延用至今已逾两千年。隋开皇十六年(596)，始置衡水县，治所在今衡水湖东岸。明永乐十三年(1415)，洪水淹没古桃城，县城被迫迁至今址——宝云塔虽被洪水包围，但塔身未倒，成为新县城的定位标记。明嘉靖三十一年(1552)，衡水城内有名酒坊十八家，以德源涌最负盛名，其酒&quot;洁&quot;&quot;干&quot;著称，遂名&quot;老白干&quot;。清乾隆三十年(1765)，直隶总督方观承奏建安济桥，拨银47600两，次年竣工——乾隆皇帝赐名&quot;安济&quot;（注意区别于赵州桥）。1937年，外敌犯境，安济桥中孔被炸毁，滏阳河交通中断20年。1946年，冀南行署将十八家酒坊收归国有，组建新中国第一家白酒生产企业&quot;衡水制酒厂&quot;。1915年，衡水老白干获巴拿马万国博览会甲等大奖章——享誉世界\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e衡水安济桥：清乾隆三十年(1765)始建，七孔连拱石桥，全长116米、宽7.5米——每孔跨径11米，桥墩有棱锥形分水石，每个拱孔正上方雕有龙头吞水兽；桥面石板车辙沟最深达11厘米；2013年列为全国重点文物保护单位。2. 宝云塔：始建隋代，重修北宋，高36.6米，八角七层楼阁式砖塔——登塔方式独特：每上一层需走出塔外沿塔檐转半圈才能进入下一层入口；塔身融合唐宋建筑风格。3. 宝云寺：始建隋代，寺内一株&quot;千年不死草&quot;（马蔺草），相传为唐代诗人王之涣任衡水县主簿时所栽——至今已逾千年仍葱绿繁茂。4. 衡水老白干十八酒坊遗址：滏阳河西关码头一带，十八家酒坊的地窖群——现已开辟为&quot;十八酒坊文化产业园&quot;。5. 衡水内画（冀派鼻烟壶）：国家级非物质文化遗产，创始人王习三——内画技艺始于清代，是中国四大内画流派之首。6. 侯店毛笔：传为秦代蒙恬授艺，世代相传——与衡水金鱼、内画并称&quot;衡水三绝&quot;。7. 衡水湖（冀州湖）：华北平原最大内陆淡水湿地，总面积268平方公里——国家级自然保护区，每年迁徙水鸟达30万只。8. 孔颖达故里：唐代经学大师，负责纂修《五经正义》，与盖文达、盖文懿并称&quot;冀州儒学三杰&quot;——墓在桃城区前马庄村。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e衡水老白干为什么叫&quot;老白干&quot;？明嘉靖年间德源涌酒坊的掌柜姓薛，酿出来的酒&quot;烧锅&quot;出来后清澈见底，点火能着，烧完不留一点水份。有个过路的举人喝了一口，说&quot;这酒老白能喝，干了不留渣&quot;——从此&quot;老白干&quot;就叫开了。我在衡水十八酒坊的地窖里待过一个下午，那里常年保持17度，酒缸一排一排码着，从地面延伸到地下三米。地窖入口处有个八十多岁的酿酒师傅，姓马，他爹当年是十八家酒坊里的&quot;酒把头&quot;。&quot;我爹说，酿酒最要紧的是良心&quot;，马师傅摸着酒缸说，&quot;水要用滏阳河的水，曲要踩三天三夜，粮食要选当年的新高粱——少一样都不行&quot;。说着他递过一杯原浆，七十度，喝下去嗓子冒烟，然后从胃里往上翻的，是十八岁那年爷爷给他倒第一口酒的记忆。\u003c/p\u003e"}, {"n": "商丘古城·归德府", "s": "商丘", "p": "河南", "w": "城摞城六叠奇观·城墙活水·外圆内方八卦古城中国保存最完好的明清古城之一，地下叠压六座城，护城河活水从城墙根自然涌出。", "h": "", "r": "\u003cp\u003e城摞城六叠：地下层层叠压——周朝宋国都城、秦汉梁国睢阳城、隋唐宋城、北宋应天府南京城、元代归德府城、明代弘治十六年城。外圆内方八卦古城：城是砖砌方正端庄，城外一圈水，水外又是圆形护城大堤——天圆地方阴阳相生。城墙：明弘治十六年(1503年)建，历时八载竣工。城墙下部青砖泛白花花盐碱酥松剥落。水激石响·城墙活水：护城河渗入地下的活水经年累月从城墙根基处自然涌出——不是人工引渠，是古城自己渗出来的。壮悔堂（侯方域故居）：明末清初才子侯方域，《桃花扇》原型。应天书院：北宋四大书院之首，范仲淹曾在此执教。八关斋（八角亭八棱石幢）：颜真卿晚年书写九百多字。阏伯台：四千多年前商族始祖观星授时的土丘。；（徐州地标）。\u003c/p\u003e", "c": ""}, {"n": "睢县老县城·睢州", "s": "睢县", "p": "河南", "w": "水下城·袁家山船形建筑·袁可立登莱巡抚平倭明崇祯十五年黄河决口一夜沉旧城，今北湖下就是宋睢州城——&quot;湖下有城城上有湖&quot;。明代兵部尚书袁可立为还愿，在别墅里仿蓬莱阁建了一座船形建筑——前低后高，四面环水远远望去像一艘船荡在水中。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明崇祯十五年（1642）三月，李自成攻陷睢州城，&quot;欲倾大树先剪重枝&quot;派军拆城。九月攻开封时双方都扒黄河大堤，狂流南奔溃堤破城——&quot;官舍民庐庙刹学宫成付泽波&quot;，旧城遂沉为湖。今北湖是东起微山山西到西安沿陇海线最大内陆淡水湖，平均水深2.2米最大3.9米。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e睢州故城遗址（省保·水下城）：北湖底，南北1883米×东西1330米=3794亩。1996年西城湖开发时挖出大量宋代陶瓷碎片。湖面上还能看到露出的襄台（宋襄公望母台）、驼岗（形似骆驼的小岛）。袁家山·吕祖庙（省保·全国罕见船形建筑）：明天启年间（1621-1627）兵部尚书袁可立为还愿建。袁可立巡抚山东登莱，出海平倭遇狂风恶浪，昏暗中吕洞宾显灵保佑，凯旋归来后在老家睢州陆园仿蓬莱阁建吕祖庙。前有山门，中有纯阳宝殿，后有望月台（台上八仙亭），台下纯阳洞。前低后高酷似船形，四面环水——远远望去像一艘船荡在水中。圣寿寺塔（国保·宋代）：宋建，睢县南线。无忧寺塔（唐宋）：睢县南线。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌睢县民谚：&quot;古开封城摞城，老睢州阴阳城&quot;——湖下有城城上有湖，睢州城&quot;凸&quot;字形（旧城正方形+新城扁担形）相连。\u003cbr\u003e▌《睢州志》（清康熙）：&quot;崇祯十五年三月，闯贼攻陷睢州，拆城入壕。九月黄河决，狂流南奔，旧城遂沉为湖。&quot;\u003cbr\u003e▌睢县老渔民：&quot;北湖底下是古城没错，我爷爷年轻时旱年湖里能看到露出的房基瓦当。夏天水浅时撒网还能捞到瓷碗碎片。&quot;\u003c/p\u003e"}, {"n": "淮阳老县城·陈楚故城", "s": "淮阳", "p": "河南", "w": "龙湖抱城·太昊伏羲陵·弦歌台孔子厄陈蔡·9公里环城墙遗址8000年文明史3000年建成史，陈楚故城是西周初年陈胡公始建陈国的都城，延续至今未断。龙湖环抱全城是国内面积最大的内陆环城湖，《诗经·陈风》&quot;彼泽之陂有蒲与荷&quot;就是写这片水。弦歌台在湖心，孔子厄于陈蔡断粮七日仍弦歌不绝。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周初年陈胡公始建陈城，此后城址绵延不断3000年。明洪武元年（1368）以砖包城，周九里十三步，高二丈五尺。清屡修屡圮。1938年后城墙残垣，1950年代大部拆除。2019年后千余户占压城墙遗址的居民搬迁，19万立方米垃圾清运，9公里长环城墙遗址公园建成——四门八景，古迹可触。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e陈楚故城遗址（省保·9公里夯土城墙）：淮阳老城区西北隅唯一保存至今的夯土城墙段落，3000年。曾被棚户区挤占，2019年拆迁重建为环城墙遗址公园。龙湖（国内最大内陆环城湖·11平方公里）：东湖/柳湖/弦歌湖/南坛湖四泓拼成，环抱淮阳城。东湖白莲是商周原生态种群——《诗经·陈风》&quot;彼泽之陂有蒲与荷&quot;实景地。太昊伏羲陵（国保·天下第一陵·国家5A）：唐贞观四年诏护陵寝，宋增制，明正统十三年重建，清乾隆十年发帑银八千两大修。三道皇城套中轴：渡善桥→午朝门→道仪门→先天门→太极门→统天殿→显仁殿→太始门→八卦坛→伏羲之陵→蓍草园，以先天八卦数理排布。陵区200余株唐植古柏。弦歌台：湖心岛上，孔子厄于陈蔡断粮七日仍弦歌不绝处。春秋鲁哀公六年（前489），孔子自楚返卫途经陈国被困，断粮七日弟子饿病不能兴，仍讲学不辍。画卦台：伏羲仰观俯察始画八卦处，东湖北岸。平粮台古城遗址（国保）：5000年前龙山文化古城，中国最早有城墙的城市之一。二月二至三月三太昊陵庙会：42天80余万人参拜，吉尼斯纪录。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌史传统《河南行》：&quot;龙湖抱月卧羲陵——龙湖这一汪水替淮阳立了骨，水外是麦浪水内是荷浪，水中央浮起一座红垣金瓦的殿宇，像谁把上古的天幕裁了一角，轻轻覆在蔡水之阳。&quot;\u003cbr\u003e▌《诗经·陈风》：&quot;彼泽之陂，有蒲与荷。有美一人，伤如之何。寤寐无为，涕泗滂沱。&quot;——3000年前的淮阳人，对着龙湖里的蒲草荷花想心事。\u003cbr\u003e▌淮阳芦苇画非遗传承人葛磊：&quot;以前住城墙边上推门就是臭水坑，现在城墙修好左边是城墙右边是龙湖，走到这个画面里边都很美——我用城墙上的砖块芦苇创作非遗，城墙上的每一块砖都在讲陈胡公的事。&quot;\u003c/p\u003e"}, {"n": "永城老县城·芒砀山", "s": "永城", "p": "河南", "w": "汉兴之地·天下石室第一陵·孔子唯一以之名命山·刘邦斩蛇碑灵光幻影芒砀山汉梁王墓群是世界规模最大的地下西汉王陵——梁孝王王后地宫东西全长210.5米总面积1600㎡，比北京明定陵大两倍，早1300年，被誉为&quot;天下石室第一陵&quot;。梁共王陵《四神云气图》早于敦煌630年，被誉&quot;敦煌前之敦煌&quot;。孔子在此避雨晒书，夫子山是全国唯一以孔夫子之名命名的山峰。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e隋大业六年（610）始置永城县，治马甫城。明嘉靖二十四年（1545）属归德府。1996年撤县设市，政府机构东迁8公里至沱河北岸新城区。现状：老县城（老城街道）街巷格局保留，芒砀山国家5A级景区完整开放。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e梁孝王王后陵（天下石室第一陵·国保）：地宫里有中国最早的石制座便器（比冲水马桶早2000多年）、冰窖（古代冰箱）、一线天奇观，梁孝王陵和王后陵之间有地下通道相连。梁共王刘买陵·《四神云气图》（早于敦煌630年·国保）：黑底彩绘，青龙白虎朱雀玄武+祥云+灵芝+长蕊红花，历经2100年仍色彩艳丽。僖山汉墓金缕玉衣：出土的金缕玉衣作为&quot;国之瑰宝&quot;先后赴美国日本新加坡巡回展出。夫子崖（孔子避雨处）：芒砀山主峰西南夫子山南坡，宽10米进深6.5米高4米的天然悬崖。孔子率弟子周游列国经此遇雨避于崖下，晒书台在洞外。洞中明代圆雕孔子石像（全国仅存的孔子古石雕像），面部残。斩蛇碑·灵光幻影奇观：明隆庆五年（1571）重立。夜晚灯光直射可看到高祖灵光幻影——被誉为&quot;天下第一奇观&quot;。陈胜王陵（国保）：中国历史上第一位农民起义领袖郭沫若题碑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·高祖本纪》：&quot;秦始皇帝常曰&#x27;东南有天子气&#x27;，于是因东游以厌之。高祖即自疑，亡匿，隐于芒砀山泽岩石之间。&quot;——刘邦隐于芒砀山紫气岩，斩蛇起义处。\u003cbr\u003e▌永城民谚：&quot;汉兴之地，华夏之源&quot;——芒砀山被专家论证为汉兴之地，汉族、汉语、汉字、汉学自此而兴。\u003cbr\u003e▌《河南日报》：&quot;梁孝王王后陵比明定陵大两倍早1300年，地宫里的汉代坐便比现在的冲水马桶早2000多年——考古队都被古人的智慧惊住了。&quot;\u003c/p\u003e"}, {"n": "鹿邑老县城·老子故里", "s": "鹿邑", "p": "河南", "w": "太清宫唐代如帝者居中·明道宫老君台13发哑弹·九龙井2500多年前老子诞生于此，太清宫是唐宋皇家祭祀老子的地方，唐时规模&quot;如帝者居中&quot;。老君台（升仙台）是传说中老子修道成仙飞升之地，1938年兵燹13发炮弹全成哑弹——现在弹孔遗迹还能看到。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e楚置苦县。秦属砀郡。唐武德三年（620）置真源县（以老子&quot;真人故里&quot;取名）。乾封元年（666）改名为真源县，后唐改鹿邑县。明洪武二年（1369）知县韩瓛重修县城，周九里十三步，高二丈，广一丈三尺。四门：东望仙、南迎恩、西通济、北迎仙。1950年代城墙拆除。现状：太清宫遗址（国保·唐宋皇祭祀老子处）、明道宫（国家5A）、老君台保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e太清宫（国保·道教祖庭·老子诞生地）：鹿邑城东5公里太清宫镇，唐宋皇家祭祀老子的地方，唐时规模&quot;如帝者居中&quot;（皇帝祭太庙的规格）。现存唐宋建筑基址1.5平方公里，碑刻20多通——宋真宗&quot;三御碑&quot;（撰文+亲书+篆额）高8米，北宋皇家碑刻。明道宫（国家5A·老子传道处）：鹿邑县城紫气大道中段，核心景观老君台（升仙台）——传说老子修道成仙飞升之地，台高13米，大砖构筑，唐代始建。台上正殿偏殿，唐代始建古柏群千年树龄。老君台哑弹遗迹：1938年1938年兵燹下老君台，13发炮弹全成哑弹未爆炸，弹孔遗迹仍清晰可见——和平教育特殊看点。九龙井（老子诞生时九龙吐水洗身处）：太清宫内，井水又香又甜清澈见底。隐山遗址：龙山文化至商周时期，老子出生处。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《史记·老子韩非列传》：&quot;老子者，楚苦县厉乡曲仁里人也，姓李氏，名耳，字聃，周守藏室之史也。&quot;——苦县即今鹿邑。\u003cbr\u003e▌太清宫历代尊荣：唐高祖尊老子为圣祖追封太上玄元皇帝，武则天加封太上老君，宋真宗加封混元上德皇帝——历朝九位皇帝亲临鹿邑祭拜。\u003cbr\u003e▌鹿邑老人：&quot;我小时候老君台弹孔还在，听老辈说鬼子炮打上来全没炸——老子爷保佑的。现在弹孔遗迹做了和平教育点。&quot;\u003c/p\u003e"}, {"n": "虞城老县城·利民古城", "s": "虞城", "p": "河南", "w": "少康中兴起点·商均墓·全国保存最好水抱城·内方外圆4000年前虞舜的儿子商均封于此建立古虞国，夏朝少康以纶邑（今利民镇）为根据地，有田一成（方圆10里）有众一旅（500人），最终灭寒浞完成&quot;少康中兴&quot;——中国最早的&quot;王子复仇记&quot;。明弘治九年（1496）筑龟背形制古城，内方外圆格局，2200亩护城湖——&quot;全国保存最好的水抱城&quot;。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明弘治九年（1496）始建龟背形制古城，内方外圆格局，城高5米，五公里护城堤，2200亩护城湖。设四门。崇祯八年（1635）改土墙为砖墙，创建西门瓮城。清康熙、雍正、乾隆、咸丰四朝四次修复。光绪二十七年大修。1954年虞城县城南迁马牧集，老城改称利民镇。现状：利民镇2017年开始搬迁住户改造古城清淤城湖，2023年获国家3A景区。商均墓仍存（4000年前上古王族墓葬，豫东少见）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e商均墓（省保·4000年上古王族墓葬）：利民镇西南，冢残高4米周长110米占地960㎡。《汉书》《括地志》《虞城县志》记载商均死后葬于封地。1942年兵燹波及盗走文物，主体封土仍保留。利民古城（全国保存最好水抱城）：明弘治九年龟背形制，内方外圆，2200亩护城湖，2023年获国家3A。仓颉墓：虞城古王集乡堌堆坡村西，造字鼻祖仓颉葬身之地。木兰祠：虞城营廓镇，木兰故乡。伊尹祠：虞城谷熟镇，商朝肇建名相伊尹故乡。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌《左传·哀公元年》：&quot;少康中兴，邑诸纶。有田一成，有众一旅。&quot;——纶邑即今虞城利民镇，少康以此为根据地完成复国。\u003cbr\u003e▌利民镇古谚：&quot;少康隐忍图强，厚积薄发&quot;——代代教育后辈的少康复国故事。\u003cbr\u003e▌利民镇近年改造：&quot;2017年以前外地人找不到利民古城墙，本地人看到的也是破烂不堪的古城和脏兮兮的湖水——现在搬迁住户改造成3A景区，成为商丘周边近郊游聚集区。&quot;\u003c/p\u003e"}, {"n": "夏邑老县城·孔子还乡祠", "s": "夏邑", "p": "河南", "w": "上古古都栗陆氏·孔子祖籍·8200年·大运河通济渠中国上古古都——栗陆氏建都夏邑（距今8200-8700年），经北京大学北师大中科院20多位专家论证。孔子祖籍——孔子先祖为宋国贵族居夏邑（栗邑），祖上多人葬于此，孔子长大后常回来省亲祭祖，把此地叫&quot;还乡里&quot;——后人建孔子还乡祠。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e夏邑古称&quot;栗&quot;（殷商甲骨辞即有记载），后改&quot;下邑&quot;，金章宗取&quot;华夏之邑&quot;改称夏邑。明崇祯年间修砖城，周九里十三步，设四门。1950年代城墙拆除。现状：孔子还乡祠（省保·1995年重建），大运河通济渠夏邑段（世界文保），上古古都栗陆氏文化。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e孔子还乡祠（省保）：夏邑县城北王公楼村，占地100亩，孔子先祖多人葬此（孔氏先茔）。祠中立孔子先祖墓碑（微子启/孔父嘉/叔梁纥/正考父等）。宋真宗时孔子45代孙孔良辅、孔彦辅由曲阜来此定居，修复扩建。大运河通济渠夏邑段（世界文保·京杭大运河组成部分）：2014年列入世界文化遗产。栗城遗址（省保·上古古都）：栗陆氏建都所在地，距今8200-8700年。夏邑县明代文庙：大成殿尚存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌2012年中国·夏邑上古古都研讨会（北大/北师大/中科院20多位专家）：&quot;夏邑为中国上古古都、华夏祖地——栗陆氏为中国上古帝王之一，建都夏邑，距今约8200年到8700年。&quot;\u003cbr\u003e▌《礼记·儒行》：&quot;孔子，少居鲁，长居宋&quot;——青年时期曾长期在宋国（今商丘一带）居住，考察殷礼。\u003cbr\u003e▌夏邑老居民：&quot;城区以前立的孔子像不是标准像，叫&#x27;孔子还乡像&#x27;——很多人搞不清曲阜和夏邑的关系，其实孔子祖籍在夏邑，出生地在曲阜。&quot;\u003c/p\u003e"}, {"n": "柘城老县城·朱襄氏陵·容湖水下城", "s": "柘城", "p": "河南", "w": "明嘉靖21年黄河淹城沉湖·西汉夯土残垣·朱襄氏教民耕明嘉靖二十一年（1542）黄河野鸡岗决口，一夜之间柘城旧城被淹没，全城百姓集体南迁，旧城积水成湖——容湖（原名北旧湖）。今天走在容湖边，脚下就是一座从新石器龙山文化层层叠压到明代的古城。西城墙夯土残垣还能摸——500米长，15米高，夯窝清晰可见，夹杂着不同朝代的陶片。朱襄氏是炎帝支系，定都株野（柘城古称），教民耕种五谷、创制乐舞——柘城是华夏农耕文明的起点之一。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉时柘城故城墙周长十一里，高二丈，墙宽一丈八尺，外濠池亦一丈八尺。北城夯土堆积十分坚固，梅雨季节城外水势高涨时城内仍安然。明成化元年（1465）城墙坍塌，十三年（1477）知县甄儒修缮。正德六年（1511）起历任知县胡世忠、于濠、高举、王瓒、艾景贤、冯钺等均曾修城。嘉靖二十一年（1542）七月，黄河自野鸡岗决口，河水沿旧黄河从西北冲来，直冲县城。城墙坍塌，官署民居淹没殆尽，城内居民移居南关数十年。旧城积水成湖——北旧湖（今容湖）。现状：西城墙夯土残垣500米高15米尚存，朱襄氏陵完好，邵园汉墓、李庄遗址等文物保护。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e柘城故城遗址（国保·水下城·豫东跨度最长古城）：城池东西2096米×南北1960米=约4平方公里。文化层叠压龙山文化→商→战国→汉→唐→宋→明共7层。1957年定为新石器遗址，考古发现城墙夯土台基、战国至明代古井、汉代砖室墓。容湖水面下就是这座城——今已建遗址栈道可近观。西城墙夯土残垣（西汉·全国唯一可触摸的水下城垣）：长约500米，高15米。夯窝清晰，夯层中夹杂有汉代五铢钱、唐三彩、宋代黄釉瓷器碎片。像一位&quot;受了伤的老者躺在大地上&quot;（柘城文保工作者语）。朱襄氏陵（朱堌寺·上古炎帝支系）：朱襄氏都株野（柘城），教民耕种五谷、创制乐舞。陵冢原始土丘完好，后世建朱堌寺祭祀。华夏农耕文明纪念地。邵园汉墓（国保·东汉夫妻合葬多室砖墓）：商丘迄今规模最大东汉砖墓，墓主为汉末陈国县令，出土官印、玛瑙、水晶、琥珀等文物。李庄遗址（国保·龙山文化晚期大型祭祀场所）：出土震惊史学界的九牛祭祀坑——华夏早期礼乐祭祀文明的实证。赵楼武德堂（省保·清康熙三进大院）：柘城仅存完整清代官式民居，现存一栋原装二层主楼。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌清光绪《柘城县志》：&quot;嘉靖二十一年秋，黄河自野鸡岗决口，河水从西北冲来，官署民居被淹殆尽。城内居民移居南关数十年，旧城遂成湖。&quot;\u003cbr\u003e▌柘城文保工作者朱卫华：&quot;西城墙的夯土是一层一层砸出来的，每层厚约0.3米，上面还有夯窝——是用一种叫&#x27;夯杵&#x27;的东西砸出来的，每个坑碗口大。我带过小学生摸过，有孩子说&#x27;摸起来像爷爷的手掌纹&#x27;——其实就是2000多年前民夫的力气印在土里。&quot;\u003cbr\u003e▌容湖老渔民刘德发（76岁）：&quot;我年轻时旱年湖里能摸到碎瓦当，撒网捞到过瓷碗。爷爷说&#x27;城在水下，水在城上&#x27;——柘城人早就习惯了和水下的城一起过日子。&quot;\u003c/p\u003e"}, {"n": "商丘归德府老城·外圆内方古铜钱", "s": "商丘", "p": "河南", "w": "六城叠压·八卦水寨·四门八开全球唯一的明代府级城墙孤品，地下压着六座不同朝代的古城，黄河泥沙层层掩埋却完整保留四千年城池序列，城内93条棋盘街巷明清格局至今未变。外圆内方的形制呼应商丘作为商文化发祥地的隐喻，城在湖中、湖在城外的水寨格局更是中国古城池的典范。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明弘治十六年（1503）破土重建，此前旧城毁于黄河水患湮没于黄土之下。正德六年（1511）竣工，归德府城告立，周长4327米，南北略长，墙高7米，底宽10米，上宽6.7米，内夯土外包青砖，共1.13平方公里。嘉靖十九年（1540）筑圆形外城墙（城郭），围十六里，城湖成型——外圆内方、形如古铜钱的格局至此完备。明末城遭战乱折毁十之三。清康熙二十六年（1687）重修，复建城门楼。建国初期城墙尚完整，附近百姓穷，拆城砖打碎当建筑材料，人为破坏严重。角楼、敌楼全部不复存在，仅拱阳门瓮城尚存部分夯土遗迹。2000年起商丘分期修缮古城。2013年《归德府城墙保护规划》获批，持续十年的&quot;修旧如旧&quot;工程启动。现状：城墙周长4.35公里基本完整，高6米，底部宽10米，顶部宽6-7米，为原汁原味明代原构（主体夯土、青砖砌体、白灰勾缝）。城内93条街巷棋盘格局完好，尚存近十处明清四合院。城湖碧波荡漾，外城郭仅南关西关保留部分土城墙遗迹。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e归德府城墙（明代原构·国保）：周长4355米，高6-7米，底宽10米，上宽6-7米，青砖每块重约20斤，白灰喂缝，3600个垛口。东西城门相错一条街（防金木相克），四门八开（瓮城门各有扭头），南门东西两侧各有水门。地下六城叠压（考古确认）：现存明墙之下，依次叠着两周宋国故城、两汉睢阳城、隋唐宋城、北宋南京城、元代归德旧城。是全球已知唯一&quot;六城垂直叠压&quot;的城池奇观。护城湖（明代·现存）：围11平方公里，水面宽阔，城在湖中、湖在城外，&quot;水中城&quot;格局完好。归德府文庙（明代·省保）：河南省现存规模最大的文庙建筑。应天府书院（五代·北宋四大书院之一）：范仲淹曾在此讲学。壮悔堂（明末·侯方域故居）：《桃花扇》主人公侯方域所建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌孟宪炘（74岁·古城土生土长的老居民）：&quot;以前城墙上得有一米多宽，能并排走两个人，有两丈多高……建国初期还完整，后来附近百姓穷，卖砖渣建房地坪，把城墙拆了不少！城砖分三种规格：最大的五十来斤，长七十厘米宽三十厘米两三寸厚，其次三十来斤和十来斤的。3600个垛口，每个垛口有两个炮位……我小时候经常爬上去玩。&quot;\u003cbr\u003e▌高慧芳（40岁·商丘市民）：&quot;我上学时就经常到古城玩。现在变美了，节目也多了，节假日游客多得很。但每次来玩，我都要登上城墙，漫步于青砖之上，俯瞰千亩护城河，看斜阳西落……那种感觉特别好。城墙是城的骨头。&quot;\u003c/p\u003e"}, {"n": "开封汴梁老城·城摞城桥摞桥", "s": "开封", "p": "河南", "w": "中轴线千年未变·州桥四层叠压·六城垂直埋深12米八朝古都，地下垂直叠压着从战国到清代六座完整古城，城市中轴线（中山大道—御街）1200年未偏移，州桥遗址一次挖出唐、宋、元、明、清五层遗存。黄河泥沙反复掩埋却让每一层城池完整封存，造就全世界独一无二的&quot;城摞城、路摞路、桥摞桥&quot;立体奇观。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国魏惠王六年（前364）迁都大梁，建大梁城，周长三十七里，是开封历史上第一座大城。秦王政二十二年（前225）水灌大梁城，城毁。唐建中二年（781）重筑汴州城，奠定今日城墙基础，周围20里155步。北宋建隆元年（960）定都东京，形成外城、内城、皇城三重城郭，外城周长50里，人口150万，是当时世界上最繁华的都市。靖康二年（1127）金军破城，北宋亡。金宣宗将内城向南扩350米、向北扩750米，确定今日城墙规模。明洪武元年（1368）改土城为砖城，周长20里190步，高3丈5尺。明崇祯十五年（1642）黄河泛滥，泥沙淤积达数米，明末路土被埋。清道光二十二年（1842）重建，青砖结构，加高至8米，加宽至5米，周长14.4公里——今日所见开封城墙即此。1994-2017年陆续恢复西门（大梁门）、北门（安远门）、小南门（新门）。2018-2023年州桥遗址大规模考古发掘（全国十大考古新发现），开挖4400平方米，深达13米，完整揭露唐、宋、元、明、清五层文化堆积。现状：城墙周长14.4公里（中国现存第二大古城垣），高8米，基本完整。州桥遗址已建考古工地，地层剖面清晰展示五层叠压。大梁门古马道博物馆可直观看到金、明、清三层马道。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e开封城墙（清道光·国保）：周长14.4公里，高8米，青砖结构，是河南省现存规模最大的城垣。州桥遗址（2022十大考古·唐宋大运河地标）：御街与汴河交汇处，地层剖面清晰——地面至地下12.5米依次叠压清、明、元、宋、唐。宋代州桥为木石结构平桥，金明时期改建为砖石拱桥，桥面路土层层叠压，直接印证中轴线千年未变。大梁门古马道博物馆（2004年开放）：清理出三层完整斜坡马道——清道光马道（地表下0-1.7米）、道光二十年马道（1.7-2.5米）、金代马道（2.5米以下），砖面车辙痕清晰。中山大道（千年中轴线·今日柏油路）：前身分别为清南门大街、明周府前大街、宋金御街——一条路，十二朝，从未偏移。北端龙亭（唐衙署→五代皇宫→北宋大内→明周王府→清贡院→今日公园），南端大南门，直线距离4.2公里。龙亭（北宋皇宫旧址）：明代改建周王府，清代为贡院，今为4A级景区。铁塔（北宋皇祐元年建·国保）：高55.88米，琉璃砖塔，北宋东京城地面仅存的标识性建筑。繁塔（北宋太平兴国二年建·国保）：开封现存最古老的地面建筑。相国寺（北齐建·北宋皇家寺院）：《东京梦华录》有详载。山陕甘会馆（清乾隆四十一年建·国保）：徐达府旧址上聚资修建。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌考古队员小李（28岁·河南省考古研究院）：&quot;挖到地下4.5米时碰到巨大青石桥基，大家都兴奋坏了——《东京梦华录》里的州桥！往下清出长17米宽30米的明代桥面，再往下是宋代原建桥基，最底层还能摸到唐代最初建桥的石料。一座桥，四层遗存……这不是挖宝，是在翻一本立体的开封史。&quot;\u003cbr\u003e▌老开封人王大爷（72岁·家住中山大道南段）：&quot;我小时候常听老人说&#x27;开封城城摞城&#x27;，以为是瞎编的。直到大梁门那挖出三层马道，州桥又挖出五层来……原来我脚下这块柏油路，底下真的压着宋朝人走的路！这中山路啊，一千多年没挪过窝——宋朝皇帝去大内走这条路，明朝周王爷去午门走这条路，清朝考生去贡院还是走这条路，现在我去买菜还是这条路。&quot;\u003c/p\u003e"}, {"n": "周口周家口老城·三寨夹河豫东小武汉", "s": "周口", "p": "河南", "w": "沙河颍河贾鲁河三水交汇·码头—街巷肌理·南寨活态遗存中原四大名镇之一，因沙河、颍河、贾鲁河三水交汇自然分割成三块陆地，清咸丰八年地方绅商筑寨墙形成南寨、北寨、西寨三足鼎立格局，&quot;三寨夹河而峙如三城然&quot;。历史上无州县级治所，纯因漕运商贸兴盛而成城，是豫东唯一一个&quot;因水兴市&quot;的独特案例。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e明永乐年间（1403-1424）沙河颍河贾鲁河三川交汇口形成自然渡口，称&quot;周家口&quot;。清康熙年间（1662-1722）漕运兴盛，码头密布，商号林立，豫东平原粮食、棉花、皮货在此集散。咸丰八年（1858）地方绅商统一修筑寨墙——三寨格局正式形成。寨墙宽五丈、长二千八百余丈，南寨设十六座寨门，兼具防御与商贸功能。史料形容：&quot;三寨夹河而峙，如三城然&quot;——&quot;豫东小武汉&quot;之名由此。清末民初漕运渐衰，码头凋敝，寨墙年久失修。建国后北寨、西寨基本消散，仅南寨尚存部分古街巷肌理。皮件厂、纺织厂等工业遗存见证水运落幕、工业兴起的时代转折。2023年启动南寨历史文化街区保护更新项目，范围26公顷，核心保护4.12公顷，&quot;修旧如旧&quot;修李家当铺、白彦章故居，复建6大古码头（大渡口、小渡口、三道沟、普济门等）。2026年2月南寨街区正式开街，入选河南省第三批历史文化街区。现状：南寨尚存11条百年古街巷（红石板巷、李家大院巷等）、18处历史建筑、6大古码头复建开放。北寨西寨仅存零星地名记忆。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e南寨古寨墙残段（清咸丰·仅存夯土）：寨墙宽五丈、周长二千八百余丈，包砖已拆，仅黄土夯筑残段隐匿于居民区。李家当铺院（清同治·市级文保）：周口首富李氏家族宅邸，北方典型四合院，主楼门柱直径45厘米，严格按&quot;四原&quot;（原材料、原工艺、原形制、原做法）修缮，院内展陈老纺车、青石磨、漕运旧船等千余件中原百工老物件。白彦章故居（清末民初·市级文保）：周口最早西医医院&quot;同仁医院&quot;旧址，主房硬山灰瓦带前廊，南厢房是二层小木楼。白彦章（1902-1976），北平大学医学院毕业，豫东现代西医奠基人。红石板巷（百年古巷·原物尚存）：赭色条石铺地，年久磨得发亮，南寨老街肌理最完好的一段。周口皮件厂（建国初·苏式工业遗存）：红砖烟囱、长条厚墙厂房，记录水运落幕、工业兴起的时代转折，今改建成文创园区。三川交汇处（地理原点）：沙河、颍河、贾鲁河三水汇流处，是周口城市的地理起点。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌老周口张师傅（68岁·退休码头工人）：&quot;以前南寨北寨西寨各占一块地儿，沙颍河中间一划，就像三个岛。码头那时候热闹啊——粮船、棉船、盐船，桅杆戳天，夜里灯笼一串串从码头挂到街里。后来漕运衰了，寨墙也拆了砖修房子了……现在大渡口又建起来了，我去看过，修得跟以前差不多，就是船没了。&quot;\u003cbr\u003e▌洪玲娣（28岁·商水姑娘·汉服店老板）：&quot;我是商水人，去年年底在南寨租了门面做汉服租赁写真。以前来这里的时候，巷子破破烂烂的，红石板上长着青苔，院子里住了好多老人，电线蜘蛛网似的。现在修好了，老墙保留了，木门窗换了新的雕花，一到节日游客多得推不开门。&quot;\u003c/p\u003e"}, {"n": "淮阳陈州老城·羲皇故都水城", "s": "淮阳", "p": "河南", "w": "八千年前伏羲建都·平粮台最早方正城垣·龙湖11平方公里国内最大环城湖中华文明最早的发祥地之一，有&quot;一千年看北京、三千年看西安、五千年看洛阳、八千年看淮阳&quot;之说。平粮台是中国已知最早的史前方正城垣（4600年前），陈楚故城沿用三千年城址未变，龙湖是国内最大环城湖（11平方公里），城在湖中、湖在城中。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e约公元前40世纪，太昊伏羲氏建都宛丘（今淮阳），画八卦，定历法。约公元前28世纪，炎帝神农氏都于此，易名为陈。西周初（前1046年），周武王封舜后妫满（陈胡公）于陈，建陈国，筑陈城——陈楚故城肇建。公元前550年陈国大夫庆寅、庆虎复修陈城。公元前478年楚灭陈，夷陈为县，再筑陈城。公元前278年楚顷襄王迁都来陈（郢陈），大筑陈城——陈楚故城定名。秦置陈县，汉为淮阳国治所。明洪武辛亥（1371）指挥陈亨易砖垣，延袤七里有奇，高三丈，址广五丈五尺，四门各增瓮城，敌台四十九。清乾隆二十七年（1762）重修，东门曰明化、南门曰孝义、西门曰平信、北门曰永安。城内72条街，取八、九吉祥数。清末内城城垣周长4.5公里，高8米，堞2211个，敌台49座。上世纪五六十年代城市扩建，城门城楼、瓮城砖石拱门尽数拆除，古砖散落民间。1980年考古试掘内城南城墙，残高2-5米，基宽20余米，夯层清晰，始建年代不晚于春秋。2022年考古确认：陈楚故城内城周长4.2公里，外城周长13.3公里。2023年启动内城城墙遗址公园建设——东门西侧夯土城墙段（复现春秋早期）、南门东侧包砖城墙段（复现明代）相继完工开放。现状：龙湖11平方公里碧波环抱古城，内城城墙遗址公园沿湖而建，可漫步城墙之上。44条明清街巷格局尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e平粮台古城遗址（4600年前·国保）：中国已知最早的方正城垣，台地高5米，占地5万多平方米，城墙残高3米、宽10米，夯层清晰。城门、陶制排水管道、双轮车辙遗迹——改写中国城市史的发现。陈楚故城城墙遗址公园（2023年开放）：北门西侧夯土段复现春秋早期筑城工艺，南门东侧包砖段复现明代砖砌城墙，覆土绿化保护，全长约4公里，漫步其上可俯瞰龙湖。龙湖（国家湿地公园·11平方公里）：国内最大环城湖，平均水深1.5米，分柳湖、弦歌湖、南坛湖、东湖四湖连珠，《诗经·陈风》&quot;彼泽之陂有蒲与荷&quot;咏此。14公里围堤。太昊伏羲陵（明·国保）：统天殿、显仁殿、太祖观、蓍草园，农历二月十五伏羲祭典（国家级非遗），每年朝祖庙会数十万人。弦歌台（省保）：孔子厄陈蔡七日绝粮仍弦歌不辍处，始建于汉，清代重建。画卦台（省保）：伏羲画八卦处，传说白龟池1984年16岁少年钓起一只235岁白龟（龟甲纹路与古籍记载吻合）。内城残存44条明清街巷（顺城街、南门里、石佛街等）：格局完整，部分门牌仍用旧称。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌淮阳老居民李华忠（62岁·退休教师）：&quot;以前龙湖边上全是垃圾，城墙根杂草长一人高。后来区里投了12亿治理龙湖，建了内城墙遗址公园……现在推窗见绿，出门入园。我每天清晨绕龙湖走一圈，看白鹭抓鱼，看荷花开——这日子啊，以前想都不敢想。&quot;\u003cbr\u003e▌郑州大学历史系研究生郝晓飞（24岁·田野调查）：&quot;平粮台是4600年的！课本上学过，但站在遗址现场看感觉完全不一样——你脚下踩着的是中国最早的方正城垣，中国最早的城市排水系统，中国最早的双轮车辙……我们三个同学蹲在那夯土层边上摸了半小时，手都脏了也不管。这是真东西。&quot;\u003c/p\u003e"}, {"n": "鹿邑老城·老子故里仙源", "s": "鹿邑", "p": "河南", "w": "隐山六千年地层教科书·九龙井宋代石雕·老君台13枚哑弹道家始祖老子的诞生地，太清宫遗址挖出从龙山文化到宋元六千年连续地层，最核心是两座西周城址（9万平方米）。县城格局方正，明清城墙虽毁但护城河尚存，大隅首十字街口千年未变，民间烟火与道家风韵交融。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e新石器时代，隐山一带已有先民渔稼耕猎。夏商时期境内设小诸侯国（厉/赖国），太清宫遗址核心区发现西周大型城址两座，面积约9万平方米——专家推测即老子家族所居诸侯国宫城。春秋称苦邑，秦置苦县，东汉武平，隋开皇十八年（598）改鹿邑县。元至元二年（1265）鹿邑、卫真两县合并，治所迁至今日县城所在地。明洪武二年（1369）知县韩𤩽因元旧城重修，土城周九里十三步，高二丈，广一丈三尺，四门：东望仙、南迎恩、西通济、北迎仙。明正德六年（1511）增修，池外濬小池周九里二百步。明天顺五年（1461）增修，城高三丈，广二丈三尺，开西北门。明隆庆六年（1572）知县王冠始甃以砖石——土城改砖城，设重门，建木桥。崇祯十五年（1642）流寇破城，城墙损毁。清顺治、康熙、乾隆年间多次修缮。咸丰年间筑护城堤为郭，开内外堑，建郭门六座。近代战乱与人为破坏，县城砖城墙逐段拆除——青砖散为民用，仅护城河尚存。1938年日机炮轰时发射的13枚炮弹全部落在老君台未爆炸——弹孔遗迹至今清晰可见。1997-2000年考古发掘太清宫唐宋建筑基址。2001年太清宫被国务院公布为全国重点文物保护单位。现状：县城护城河基本完整，大隅首（城中心十字街口）千年未变，隐山太清宫遗址（唐宋祭祀建筑基址）保护中，老君台（升仙台）高13米，明道宫片区为5A级景区。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e太清宫遗址（国保·六千年地层教科书）：从史前龙山文化到商周、汉唐、宋元，六层地层垂直叠压。核心区9600平方米唐宋建筑基址，中轴线对称布局。鹿邑县城护城河（明清·现存）：环绕老城，起点在红卫桥向南小闸，向北经北关。三段桥梁位置依稀可辨，北关吊桥虽已无&quot;吊&quot;的功能，地名仍存。大隅首（县城地理原点·千年未变）：明清四门（迎春/宣德/望仙/拱极）主街交汇处，妈糊铺子的烟火气百年未断。今日仍为县城最繁华的十字路口。老君台（升仙台·国保）：传说老子修道成仙飞升处，唐代始建，台高13米，以古代大砖构筑。台上正殿偏殿，千年古柏群（树龄超千年）。1938年日机炮弹弹孔至今清晰——13枚全哑弹，成为和平教育特殊看点。隐山遗址（龙山文化至商周）：太清宫遗址核心区，出土大量玉器、青铜礼器，证明老子家族为西周贵族后裔。明道宫（宋·重建）：老子传道讲学处，藏经阁、享殿、迎禧殿沿中轴线排布。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌鹿邑退休教师张大林（70岁·北关人）：&quot;我小时候常在大隅首那转，妈糊铺子的热气裹着黍米香，羊肉烩面的布幌子在风里晃。那时候城墙砖已经拆得差不多了，有人拉着排车拉砖盖房……护城河还在，北关吊桥早不吊了，就是个平桥。去年我带孙子去老君台看那炮弹洞，他摸了摸问我&#x27;爷爷这是啥&#x27;，我说&#x27;日本人打这儿，十三发全没炸——老子爷罩着呢&#x27;。&quot;\u003cbr\u003e▌考古队队员小周（26岁·太清宫工地）：&quot;太清宫挖下去六层！最上面是明清的，然后是唐宋，再往下是汉唐，最底下是西周的宫城基址——9万平方米，有城墙有壕沟有夯土大殿。以前以为老子是个隐士，现在才知道他可能是周朝诸侯国的贵族后代，受过顶级教育的官N代……这考古真是天天在打脸、天天有惊喜。&quot;\u003c/p\u003e"}, {"n": "太康老城·夏王封地谢氏故里", "s": "太康", "p": "河南", "w": "中国唯一以夏王命名的县·文庙大成殿琉璃龙脊·刘庄遗址夏代早期城墙中国唯一以夏朝君王名字命名的县（夏王太康失国后流落戈地筑城，死后葬于此），建县2247年未改名。文庙大成殿绿色琉璃瓦、二龙戏珠脊饰，省内罕有。刘庄遗址夯土城墙碳十四测年公元前1964年——夏代早期纪年。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e约公元前21世纪，夏王太康田猎百日不归，后羿堵路不让其回国。太康流落戈地筑城，死后葬县城东南二里，村名王陵村至今沿用。秦嬴政二十三年（前224）置阳夏县。隋开皇七年（587）改阳夏为太康县——以夏王太康之名，一叫叫到今天。元至正二年（1342）建土城，周九里三十三步，四门（东朝阳、西乐成、南南薰）。明宣德元年（1426）建文庙（黉学）——后历经多次损毁重修，现仅存拜殿和大成殿（清代重建）。明崇祯九年（1636）知县李皋土城换砖城，厚五尺，高四丈三尺。崇祯十五年（1642）文庙毁于兵燹。清顺治五年（1648）重建文庙。康熙六年（1667）、民国23年（1934）两次重修。1952年建国后曾维修文庙。近代县城砖城墙被逐步拆除，仅存零星残段。2024年考古发掘刘庄遗址——夯土城墙碳十四测年为公元前1964-1833年，进入夏代早期纪年。现状：文庙大成殿和拜殿完整保存（国家重点文保），太康陵（夏王太康墓）为市级文保，刘庄遗址夏代城墙考古中。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e太康文庙大成殿（国保·清代重建）：面宽七间22.65米，进梁五间14米，高10.5米，单檐歇山顶覆绿色琉璃瓦。正脊琉璃烧制二龙戏珠、人物、宝瓶、象轮，垂脊戗脊置琉璃狮狗。大殿檐下五彩重昂斗拱，前屋坡为&quot;两断式&quot;（加大深度）——河南省内古建筑罕见，四翼角挑角高且大，具南方风格，中原少有。月台高1米，青石台阶正中嵌祥龙卧云阶石。太康文庙拜殿（国保·清代重建）：面阔五间，进梁三间，单檐歇山灰色筒瓦，檐下五彩重昂斗拱，普柏枋、栏额、斗拱均有彩绘。刘庄遗址夏代早期城墙（2024年新发现）：四道城墙，宽2.6-3.4米，南墙有缺口（城门），平面呈圆角长方形，东西长126米、南北宽100米，城址内有16座龙山晚期房址自南向北成排分布。太康陵（市级文保）：夏王太康墓，位于县城东南二里王陵村，封土尚存。谢安故里（太康县老冢镇）：东晋太傅谢安、才女谢道韫、山水诗祖谢灵运祖籍地，中华谢氏发源地。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌太康退休教师刘先生（65岁·文庙义务讲解员）：&quot;我小时候文庙还有泮池棂星门戟门崇圣祠，从南到北一排全的。文革时候拆了好多，棂星门拆了搭戏台用。现在就剩大成殿和拜殿了，但那大成殿真牛——绿色琉璃瓦，正脊上二龙戏珠，那挑角比别的地方文庙都大，听老师说那是南方风格，中原少见。每年祭孔大典33个步骤，不能错一点——我背得滚瓜烂熟。&quot;\u003cbr\u003e▌考古队员小李（29岁·河南省考古研究院·刘庄遗址）：&quot;碳十四测年出来的时候我们全组都炸了——公元前1964年！正好卡在夏代早期纪年里！这城址才东西126米南北100米，小归小，但是夏代早期的夯土城墙啊！四道城墙有南门缺口，城内16座房子一排一排的……豫东这地方，真的是藏龙卧虎，随便挖挖就能改写历史。&quot;\u003c/p\u003e"}, {"n": "扶沟老城·桐丘程门·大程书院", "s": "扶沟", "p": "河南", "w": "程颢理学圣地·固城春秋残墙·吉鸿昌故里宋代理学泰斗程颢任知县三年的&quot;程门立雪&quot;发源地，大程书院为程颢讲学处。固城村春秋城残段1974年挖出22斤楚金币（全国罕见），县城叠压在先秦郑国边防重镇桐丘城之上。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋时期郑国城邑桐丘，《左传》鲁庄公二十七年（前667）&quot;楚伐郑，郑人将奔桐丘&quot;——扶沟老城叠压在桐丘城址之上。西汉高祖十一年（前196）置扶沟县，县治设崔桥镇古城村（西汉扶沟故城），同时并存新汲、扶乐三县。隋大业十四年（618）新汲县废入扶沟，县治迁至桐丘（今日县城）。宋神宗熙宁八年（1075） 程颢任扶沟知县，在县衙旁开设大程书院讲学——程门四大弟子齐聚，理学一脉在此传承。明洪武三年（1370）县丞刘镒创建土城，高仅一丈，周六里三百二十二步。正统七年（1442）知县韩琼增筑至周九里十三步，高二丈五尺。成化十九年（1483）知县胡宜修四门：寅宾（东）、迎薰（南）、见嵩（西）、拱辰（北）。正德五年（1510） 知县王廷华四面以砖包砌土城，修高城楼增设角楼。崇祯十五年（1642）闯军毁城，后有修缮但高厚不如前。清顺治、康熙、嘉庆年间多次修缮，咸丰年间增设四角炮楼。1948年扶沟县政府陆续拆除城墙修筑公路——砖城尽毁，护城河尚存残段。1938年黄泛虽有城墙保护，城外村镇圩寨尽没。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e固城春秋古城墙（春秋·省保）：位于县城西南18公里固城乡固城村，平面不规则长方形，南北长800米、东西宽480米，城基宽20米，残高2-8米，西南角保存最完好仍高7.5米。夯层8-20厘米，夯窝圆形平底直径5厘米。1974年村民挖石灰池时挖出22斤楚国金币（含金量90%以上）。出土带子母口沿圆筒形地下排水管道——早于周口平粮台。城墙下厚25米、上厚4米，夯土为深灰色，内内涵遗物极少，始建春秋中晚期、鼎盛战国两汉、延至宋明。大程书院（宋·后重建·省保）：程颢任扶沟知县时（1075-1077）讲学处，程门四大弟子齐聚于此，一时英杰汇聚。现存青砖长房（学子读书处）、立雪讲堂（程颢讲学处），格局尚在。明永乐二年（1404）重建，清康熙四十八年（1709）增修。扶沟西汉故城（崔桥镇古城村）：断续夯土城垣尚存，出土汉代筒瓦、板瓦、陶罐残片。吉鸿昌故居（吕潭镇）：清代院落，吉鸿昌1895年生于此，扶沟中学创办者。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌固城乡村民老孙（72岁·固城村土生土长）：&quot;1974年我还没下地干活呢，就听人说固北大队挖石灰池挖出了金子！那22斤楚金币啊，用篮子装了满满一篮，金光闪闪的。我跑过去看，城墙根下挖了个坑，底下还是城墙夯土。后来考古队来了，说这城春秋就有了，比桐丘城还早……这城墙我小时候常爬，南边那角还能上去，现在长树了。&quot;\u003cbr\u003e▌扶沟退休教师张老师（68岁·大程书院义务讲解）：&quot;程颢在扶沟只待了三年，可是这三年把整个扶沟的文风都转过来了。大程书院立雪讲堂，现在还在那里，青砖长房，当年弟子们就在那读书。你说奇怪不奇怪，程门立雪的故事，杨时游酢在程颢那也立过——真事发生在洛阳，但扶沟人说，程颢在这讲学的三年，杨时也来过……这不管真假吧，书院立在这，文脉就没断。&quot;\u003c/p\u003e"}, {"n": "西华老城·娲城女娲·逍遥胡辣汤", "s": "西华", "p": "河南", "w": "中华唯一女娲建都地·春秋女娲城·350年黄泛淤积古称娲城，传说女娲在此抟土造人、炼石补天并建都，是中华创世神话唯一有考古遗址支撑的女娲建都地。明洪武间夯土包砖的老城叠压在唐代箕城县之上，城外10公里春秋女娲城遗址城墙残段仍存。逍遥镇胡辣汤发源地。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋时期 女娲城（娲皇故城），正方形内外两层，外郭城墙长4000米，内城1440米——春秋时期大型城邑，夯层10-20厘米，夯窝圆形平底直径5厘米。秦代置长平县，西汉分长平、西华两县并存。唐武德八年（625） 西华人张道陵后裔建箕城——唐代城址。明洪武年间重建西华县城，夯土包砖，后因洪水反复修缮（西华有史载黄泛350余次）。1938年黄河花园口决口，西华全境没于黄水，淤积泥土数丈厚，女娲陵曾被黄水冲至仅剩土丘，1940年代乡民清淤重修。1986年女娲城址被定为河南省第二批省级文物保护单位。1994年当地民众自发捐资，在女娲古陵处动工兴建女娲城景区。现状：县城明城墙已全部拆除，护城河残段可辨。女娲城遗址城墙残高3米、宽8米，夯土尚在。县城中心女娲文化广场立铁质女娲雕像，城西昆山女娲宫为明代建筑群（古柏参天）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e女娲城遗址（省保·春秋）：位于县城北10公里聂堆镇思都岗村，正方形分内外两层，外郭城墙长4000米，内城墙长1440米。残存城墙最高点3米、宽8米，护城壕轮廓清晰（基底宽6米、上部宽15米）。城墙分层夯筑，夯窝圆形平底直径5厘米。城内出土釜、罐、鬲、瓮、瓦等春秋时期遗物。民国初年三个&quot;娲城夕照&quot;土丘被挖平，1938黄水淤积，1994年民众重修。女娲陵（思都岗村）：1938年黄淤后乡民重修，陵丘尚存，常年香火旺盛。每逢农历三月庙会，香客数万人。明伦堂（清代重建·省保）：西华文庙主建筑，青砖灰瓦，硬山结构，棂星门尚存。逍遥镇（胡辣汤发源地）：距县城25公里，胡辣汤创制于明崇祯年间，以胡椒、面筋、牛肉片为主料，一碗仅8元。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌思都岗村王老汉（78岁·女娲陵守墓人后代）：&quot;我爹说1938年黄水漫过来的时候，女娲陵被淤了大半，就剩个土尖尖露着。后来水退了，村里人扛着锄头铁锹，挖了半个月才把陵挖出来……现在的陵是清淤后重修的。每年三月庙会，从许昌漯河郑州来的人一车子一车子的，我守陵一辈子了，就信这——女娲娘娘在这住过，这是咱老李家老王家的根。&quot;\u003cbr\u003e▌西华中学退休教师李老师（65岁·文史爱好者）：&quot;西华城下面压着好几层呢——最底下是春秋女娲城，上面是汉长平县，再上面是唐箕城县，最上面才是明洪武间建的砖城。可惜明城墙建国后全拆了，护城河也淤了。现在县城中心立着个铁铸女娲像，旁边建了女娲文化广场，算是把根找回来了。&quot;\u003c/p\u003e"}, {"n": "商水老城·阳城扶苏·叶氏庄园", "s": "商水", "p": "河南", "w": "陈胜故里·叶氏270亩寨堡庄园·周口三川漕运商水是陈胜故里（扶苏村即陈胜出生地），扶苏城战国城墙残段（外城东西800米、南北500米）。叶氏庄园是清代中原首富寨堡式庄园（270亩），2017年升为全国重点文保。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国 楚国边邑阳城故址（今扶苏寺村），《楚辞》&quot;惑阳城，迷下蔡&quot;即此。陈胜故里在后陈村。秦代置阳城县，属陈郡。扶苏城为陈胜所筑，秦二世诈称公子扶苏。隋开皇十六年（596） 设溵水县，北宋建隆元年（960）避宋太祖父讳改溵水为商水——商水县名始于此。明洪武四年（1371）县丞孙元仁修土城，周四里有余，高二丈，四门：仁化、义和、道泰、德政。万历三十五年（1607）知县祖鼎欲包砖城仅完成东门以北二十余丈。崇祯九年（1636）知县王化行全面改筑砖城，四门增设瓮城。崇祯十四年（1641）李自成陷商水城，后顺治三年重修。清康熙至乾隆年间，商水周家口（沙河、颍河、贾鲁河三川交汇）漕运兴盛，渡口十六处、街巷百余条，与朱仙镇、道口镇、赊旗镇并称河南四大名镇——周家口历史上属商水县。清咸丰八年（1858）叶氏（叶绍颐后裔）始建叶氏庄园，历时50余年，耗银百余万两。现状：砖城墙全部拆除，护城河仅存残段。扶苏城残墙尚可辨认。叶氏庄园270亩完整保存，2017年升国保。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e叶氏庄园（国保·清代寨堡）：位于邓城镇，270亩（18万平方米），原楼瓦房500余间，现存99间。晚清防御寨堡式庄园，东、中、西三组院落各三进院，青砖灰瓦，走马门楼、石狮子（左边母狮背幼狮、右边雄狮侧视）、五尺高石狮子，门前大江明柱彩雕&quot;青蛙戏荷&quot;。寨堡原高7米，四角炮楼（两层），东寨门书&quot;众志成城&quot;、西寨门书&quot;同登仁寿&quot;。西侧花园有六角凉亭，护城河绕城。1976年杨得志向制止进一步破坏。扶苏城（战国·省保）：位于舒庄乡扶苏村，陈胜故里。外城东西800米、南北500米，外城东北部夯土墙仍高出地面200米残段，城基宽20米。内城每边长250米，俗称&quot;金銮殿&quot;。出土&quot;扶苏司工&quot;陶片4件。阳城故址（战国·省保）：扶苏寺村。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌叶氏后裔叶国玺（75岁·邓城镇）：&quot;我祖上叶绍颐是明末从山西洪洞迁来的，开饭店起家——这听着不像啊，但老辈传下来就是。后来漕运通了，周家口那时候属商水，我家靠码头盐粮买卖发了，从清咸丰八年开始建宅子，建了五十多年！270亩啊，四角炮楼，护城河，东中西三组院落每组三进院……文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军1976年来了一趟，不让再拆，才保住。&quot;\u003cbr\u003e▌后陈村村民王振行（62岁·扶苏村村支书）：&quot;陈胜就是从我们后陈村出去的！扶苏城是他诈称扶苏后筑的——你看那外城残墙，在村东边那片田地里，一长段土坡坡，夯土硬得很，用锄头刨都刨不动。挖出的陶片上有&#x27;扶苏司工&#x27;四个字，考古队说是陈胜造的。陈胜吴广起义，那可是中国第一次农民大起义！我小时候上学，老师就在课堂上讲，说咱村出了个揭竿而起的人。&quot;\u003c/p\u003e"}, {"n": "项城老城·三迁城址·袁寨故居", "s": "项城", "p": "河南", "w": "商周南顿故城·三城叠置·270亩袁氏寨堡项城是唯一经历三次城址迁徙的县城（槐坊店→秣陵镇→水寨），南顿故城商代城墙残段215米尚在。袁世凯故居是晚清最典型的防御寨堡式庄园（270亩），&quot;大邸阁&quot;粮阁遗址为三国正始六年（245年）仓粮仓库。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周 项子国封于此，以&quot;项&quot;为封地，项羽家族即项子国后代。春秋 顿子国（南顿），南顿故城城墙下厚上薄，上层秦代、中层东西周、下层商代——&quot;三层叠压&quot;研究城市变迁的活化石。汉高帝 设项县，东汉光武帝刘秀之父刘钦任南顿县令，刘秀在此长大——&quot;光武台&quot;&quot;晾马台&quot;&quot;扳倒井&quot;等遗迹尚存。东魏天平二年（535） 侨置秣陵县——项城又称秣陵，来源在此。明宣德三年（1428） 槐坊店（古项城）遭黄水淹没，县治迁至秣陵镇（殄寇镇）——老项城，一住五百二十五年。清咸丰八年（1858） 袁甲三（袁世凯叔祖父）购置明代石氏庄园改建袁氏故居寨堡，历时四年完工——三道寨河环绕，高7米砖砌寨墙，四角双层炮楼。1953年底 县城从秣陵镇迁至今水寨镇（原项城镇）。现状：南顿故城东北角商代城墙残段长217米、宽12米、高7米（省保），三层文化层清晰。秣陵镇（老项城）文庙、莲溪书院、状元桥尚存。袁氏故居270亩完整保存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e袁氏故居（国保·晚清寨堡）：位于王明口镇袁寨村，270亩，三道寨河环绕，高7米方形砖砌寨墙，四角双层炮楼，东西寨门吊桥高悬。始建1858年，袁甲三（钦差大臣漕运总督）购置明代石氏庄园改建。住宅99间（原266间，文革拆除），东组5天井院、中组3天井院、西组3天井院，袁世凯出生于中院腰楼西间。走马门楼、彩雕&quot;紫气东来&quot;、石狮子（五尺高）、门前两根大石柱彩雕&quot;青蛙戏荷&quot;。南顿故城（省保·商代至秦汉）：位于南顿镇，残存东北角土城墙217米，宽12米，高7米，三层叠压——上层秦代、中层东西周、下层商代，是研究城市变迁的活化石。东汉建武十九年（43）光武帝刘秀在此筑光武台、建光武庙。莲溪书院（清代·老项城）：秣陵镇，匾额&quot;凡乡之秀美而文者，自成人以及小子咸得攻诗书习礼乐&quot;，是当时全县最高学府。华佗冢（三国·项城）：位于南顿镇，传说华佗死后葬于此。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌袁寨村老周（68岁·袁氏后裔邻居）：&quot;袁寨那房子结实，一百多年了还立着。我小时候常钻寨墙根底下玩，那寨墙是砖砌的，外面三道寨河，四角炮楼——你说厉害不厉害？袁世凯出生在中院腰楼西间，我去看过那间房，不大。文革时候拆了不少，四角炮楼全没了，原来266间剩99间了。杨得志将军说&#x27;这房子不能拆&#x27;，才保住。&quot;\u003cbr\u003e▌南顿镇刘大爷（80岁·城墙根下长大）：&quot;那城墙是商代的！三层啊——底下是商朝的土，中间是周朝的，上面是秦朝的——考古队挖的时候我在旁边看了好几天。城墙上夯窝密密麻麻，像牛蹄子印似的。我小时候常爬到城墙上玩，现在城周围都是庄稼地，只有东北角那一段土坡还像样子。刘秀小时候跟着他爹刘钦在南顿当县令，王莽追他他躲在八角井里——那井现在还在。&quot;\u003c/p\u003e"}, {"n": "沈丘老城·三迁城址·槐店古项", "s": "沈丘", "p": "河南", "w": "沈子国西周遗址·乳香台龙山文化·槐店三川交汇沈丘是罕见的&quot;三座县城&quot;——临泉古城子（沈子国西周都）→乳香台（明弘治新址）→槐店（古项城县治）。沈子国遗址千年银杏仍在，东汉永平七年（64年）建广教寺比白马寺早四年。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周初年 周文王第十子聃季载封沈子国，都临泉古城子——沈丘第一座县城（后属安徽临泉），历经1600余年。春秋鲁定公四年（前506） 沈子国被蔡国所灭，都称&quot;沈集&quot;。隋开皇三年（583） 置沈州，改褒信县为沈丘县——沈丘县名首现。明弘治十年（1497） 划陈州、颍州、项城边隅，复置沈丘县，县界西移，治所由临泉迁至乳香台——第二座县城，建方形土城，周三里半零四十步，城高1.8丈、壕宽3丈深1.5丈。正德二年（1507）砖包城墙工程动工，东、西、南、北四门楼落成，四角四面立八座炮楼，城门以铁叶包裹。明宣德三年（1428） 古项城县治槐坊店遭黄水淹没后南迁，槐坊店改称槐店——沈丘第三座县城，沙河、谷河、蔡河三川交汇，古项羽所筑。现状：沈子国遗址（临泉古城子）千年银杏尚在，城垣残高1-2米。乳香台旧址今为沈丘老城镇（明代沈丘）。槐店（今沈丘县城）古项城石板街、大胡同尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e沈子国遗址（省保·西周）：位于安徽临泉古城子，长方形高台地，南北长500米、东西宽300米，夯土城垣残高1-2米，四角城堡残高2米多。千年银杏立于遗址内，虬枝参天，古姿龙钟。出土楚国蚁鼻钱、郢爰、弧底绳纹陶罐、铜剑、铜戈等。1985年征集商代墓群铜爵、铜觚、玉璜等。乳香台（沈丘老城镇）：龙山文化遗址（4000年），东汉永平七年（64）建广教寺——比白马寺（68年）早四年。明成化年间重建，庙梁为乳香木（伏天渗出乳香香气），故改名乳香台寺。香台井甘美，县志有载。槐店（今沈丘县城）：古项城县治，明万历《项城县志》载&quot;项城县城槐坊店，楚项羽所筑&quot;。东关大胡同、石板街尚存，三川交汇（沙河、谷河、蔡河）。清真古寺（省保）：槐店回族镇，明初建，历次重修。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌临泉古城子刘大爷（82岁·沈子国遗址守树人）：&quot;这棵银杏树是周朝的！我爷爷说他爷爷那辈儿就这么粗——要三个人才能合抱。旁边那土台台就是沈子国的城墙根了，夯土硬得很。1985年挖商代墓的时候我去看热闹，挖出了好多铜器——爵、觚、剑……亮闪闪的。这地方水好风好，沈子国选这儿建都没错。&quot;\u003cbr\u003e▌槐店老陈（70岁·回族镇老户）：&quot;槐店这地方三川交汇啊，沙河、谷河、蔡河在这儿碰面，船多得很，老早以前就热闹。石板街那几块红石板还在，我小时候在上面跳房子。大胡同两边的房子还是老样子，青砖灰瓦。清真古寺那座老礼拜殿，木柱都要两人合抱——听我爹说那是明初建的。槐店文狮子，国家级非遗，每年庙会都要跳。&quot;\u003c/p\u003e"}, {"n": "郸城老城·老子丹成·宁平故城", "s": "郸城", "p": "河南", "w": "商周亳都·汉光武妹妹封地·老子炼丹成名地东魏设丹阳郡、隋设郸县，&quot;郸城&quot;谐音&quot;丹成&quot;——传说老子在洺河岸边炼丹成功大呼&quot;丹成也&quot;。宁平故城是商朝前期都城亳（五帝帝喾都亳、商汤迁亳），两汉宁平县——光武帝刘秀妹妹刘伯姬封地。汉代汲黯（《史记·汲郑列传》）葬此。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e五帝帝喾 都于亳（今郸城宁平）——宁平有五千年建城史。商朝前期 成汤把都城从商丘迁到亳（宁平），历五代十王，亳为都约二百年。战国 称&quot;留城&quot;&quot;留木城&quot;。西汉设宁平县，东汉光武帝封妹刘伯姬为宁平长公主——在宁平生活四年，死后葬城南三公里。西晋永嘉五年（311） 东海王司马越灵柩东运经宁平，石勒追上大败晋军——&quot;宁平之战&quot;，王公士卒死者十余万，宁平故城彻底毁坏，后世在废墟北面重建。隋 设郸县，后撤县，设郸城集。传说老子在洺河岸边（今县城大桥一带）炼丹成功，大呼&quot;丹成也&quot;——&quot;丹成&quot;谐音&quot;郸城&quot;。1951年设郸城办事处（县级），1952年设郸城县。清代康熙《鹿邑县志》载：宁平城是方圆几十里最大的城。建国初期宁平故城城墙尚存，东西长620米、南北长612米、总长2464米——夯土城墙，大寨墙厚9米多高3米多，小寨墙1米多高带垛口，四角碉堡圆形直径5米。四门有外门内门，门板厚约5米高丈余，东北红松做。每门有两眼大铁炮，炮筒一丈长如高压线杆粗。1949年土改时城墙全部拆除——大青砖建了宁平粮库。现状：宁平故城残墙尚存（省保），故城遗址1995年NHK《中华五千年》摄制组拍摄。郸城老城墙、护城河全部拆除，仅存&quot;大桥南侧人民路&quot;北门位置、&quot;南关老汽车站西侧&quot;南门位置。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e宁平故城（省保·商至汉）：位于宁平镇，残存部分夯土城墙，东西长620米、南北长612米、总长2464米，城高3米多，大寨墙厚9米多。1949年拆除大青砖建宁平粮库，现存夯土残段，寨海子（护城河）宽两丈多深一丈多轮廓可辨。四门均有高大双门楼建筑，外门内门相隔八九米，门是厚木门用东北红松做，有大铁铆钉，门外吊桥。每门有两眼大铁炮，炮筒一丈长——民间流传&quot;绿头绳红头绳，大炮打不透宁平城&quot;。宁平长公主墓（东汉·刘伯姬）：光武帝刘秀之妹封地宁平，在宁平生活四年，死后葬城南三公里。封土尚存，近两千年未动。汲冢（西汉·汲黯墓）：《史记·汲郑列传》中的西汉名臣汲黯葬于县城西，今汲冢镇。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宁平镇老艺人王大爷（85岁·城墙记忆）：&quot;我爹是1948年建政那年在宁平粮库干活的，他说粮库那青砖全是从城墙上扒下来的——那砖真大，一块顶现在两块。城墙我小时候还见过，大寨墙厚9米多，上面还有小寨墙，四角有碉堡圆形的能藏人。每面城墙上有两眼大铁炮，炮筒粗得像高压线杆，装上药能打二三里远。四门都是外门内门，进去像钻隧道——我爬过门楼，上面摆着门神牌位。&quot;\u003cbr\u003e▌郸城退休干部小李（60岁·文史爱好者）：&quot;郸城这县名太有意思了——老子在洺河边炼丹，丹成了，叫&#x27;丹成&#x27;，谐音&#x27;郸城&#x27;。传说老子原来在鹿邑那练，后来嫌苦，跑到洺河边——&#x27;汲洺河之水，拔苇为薪&#x27;，一举成功。宁平故城更了不得了，商朝前期都城就在这儿，二百年啊！成汤迁过来的，五帝帝喾也在这儿定都。可惜城墙拆了，大青砖建粮库了，只剩夯土残段了。&quot;\u003c/p\u003e"}, {"n": "永城老城·汴河穿城的运河重镇", "s": "永城", "p": "河南", "w": "隋唐大运河遗址·崇法寺塔·地下8米唐宋码头永城是隋唐大运河汴河段唯一穿城而过的县城，中山街就是原汴河北岸夯土大堤，南侧劳动街就是原运河主河道——两条街高差一米，间距五六十米，跟古籍记录的运河河面宽度完全对得上。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e隋大业元年（605） 通济渠开凿，汴河穿永城而过，县城沿河而建，呈椭圆形（东西长、南北短），因运河不想远离。北宋（960-1127） 永城为汴河漕运重镇，码头舟船不绝。贺铸诗&quot;满城杨柳正黄繁，几处秋千出短垣&quot;写的就是永城土墙不高的样子。明正德七年（1512） 知县乔岱伐石为基，改土城为砖城，增筑。东门额&quot;领豫&quot;，西&quot;迎恩&quot;，南&quot;朝阳&quot;，北&quot;拱极&quot;。东门在今环城路与中山街交叉点，地下发现明代石基（白灰黏合）。金元之际 汴河彻底淤塞断流，东门失去水运地位，原正门沦为侧方小门——小门街地名流传至今。清光绪年间 最后三次修城：光绪九年（1883）、十六年（1890）、二十七年（1901）。1946年 城墙拆除，环城路占古城墙位置。现状： 老城街巷高低起伏，中山街（原汴河大堤）比南侧劳动街（原运河河道）高出1米有余。1990年代老城基本保留原有风貌，大隅口地下8米深处挖出运河淤泥、船板、码头基石和唐宋瓷片。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e崇法寺塔（北宋元祐八年1093-绍圣五年1098，全国重点文保）：高34.6米，八角九级密檐式砖塔，青砖砌造。1938年遭炮轰塔身受损，历经千年风雨仍屹立老城。塔下现为崇法寺街道公园。中山街-劳动街高差（运河遗迹）：中山街路面比南侧劳动街高出约1米，两条街间距五六十米，就是当年汴河大堤与河面的距离。地下唐宋码头遗址（大隅口）：1980-90年代基建施工时，地下8米深处发现唐宋船板、码头基石、瓷片。东门明代石基（环城路与中山街交叉口）：2018年重建东城门时挖出，石墙整齐，白灰黏合，夯土层叠压汉唐宋元明各代。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董胜平（72岁，老城原住民，北关打鱼人家后代）：&quot;北关知道深浅，西关知道薄厚，南关知道远近，东关知道轻重——这四句顺口溜传了三辈子。以前大隅口是&#x27;无影山&#x27;，地势最高，城破的时候炮先打那儿。我家老宅就在崇法寺塔底下，那塔从我爷爷小时候就有个炮洞。&quot;\u003cbr\u003e▌张师傅（65岁，老城补鞋匠，在大隅口摆了30年摊）：&quot;90年代改自来水管道，一挖就是碎瓷片子——宋瓷、元瓷、明代的都有。有个收古董的老头蹲那儿捡了一下午，后来听说卖了几千块。我那时候不懂，就捡了个碗底垫着修鞋用。&quot;\u003c/p\u003e"}, {"n": "睢县·中原唯一水下古城", "s": "睢县", "p": "河南", "w": "黄河灌城沉入湖底·襄台驼岗还在·湖下藏宋街睢县北湖（旧城湖）是中国少有的&quot;阴阳城&quot;奇观——1642年黄河水灌进睢州城，整座明城没入水底，城墙变湖堤，城基变湖底。现在1.7平方公里的湖面上还留着襄台（宋襄公陵）、驼岗、濯锦池等露出水面的遗迹。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e宋崇宁年间（1102-1106） 始建睢州旧城，周长6.5公里，城墙高6.6米，宽5米。明成化十三年（1477） 黄河灌城，城内成湖，城墙变湖堤。明崇祯十五年（1642） 李自成攻打开封，明河南巡抚高名衡扒开黄河大堤，洪水一泻千里，睢州西门堤口先溃，水灌全城——旧城彻底没入水底，形成北湖。这是&quot;城摞城&quot;的另一形态：水下城。清 在旧城北部另筑新城，即今睢县县城。现状： 北湖面积1.7平方公里，深处3米。湖底方形古城轮廓清晰可见——20世纪50年代还能在湖四周看到城墙残迹，90年代环湖修路时遗迹消失。湖内水面遗迹：襄台（宋襄公陵/望母台）、驼岗、濯锦池、乾明寺、金锁岭、恒山。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e北湖城湖（水下宋城+明城）：南北长1883米，东西宽1330米，面积3794亩。1996年西城湖开发时出土宋代陶瓷碎片。襄台（望母台）（春秋）：北湖东北角落，夯土高台，春秋宋襄公为望母所筑，宋襄公死后葬于此。驼岗（北湖东北）：形似骆驼的小岛，高约5米，夯土结构，战国时期已有重要地面建筑。袁家山（吕祖庙）（明天启年间，省保）：明代兵部尚书袁可立仿蓬莱阁所建，船形建筑，四面环水。纯阳宝殿面阔3间，八仙亭歇山式，12根石柱支撑。东关明清一条街（明代中期）：东西长1000米，宽7米，豫东重要商品集散地，晋商曾建&quot;山西旅睢同乡会馆&quot;。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（78岁，北湖渔翁，在湖上划了40年船）：&quot;我年轻时候湖里水浅，能摸到城砖——大青砖，跟新的一样。襄台上还有半截石碑，我爹说那是宋襄公的碑。后来湖底淤了，再也摸不着了。现在就剩驼岗那小岛，上面还能捡到陶片子。&quot;\u003cbr\u003e▌李会计（62岁，睢县文物管理所退休）：&quot;袁家山那个船形建筑太绝了——山门是船头，大殿是船舱，望月台是船尾。袁可立当年在蓬莱平倭遇风浪，吕洞宾显灵救了他，回来就仿着蓬莱建了这船庙。你站在承露盘上看，四面都是水，真像飘在湖里的船。&quot;\u003c/p\u003e"}, {"n": "宁陵·吕坤故里的修城传奇", "s": "宁陵", "p": "河南", "w": "明代唯一《修城书》传世·城墙拆了城门复建宁陵城有两份独一无二的遗产——明代&quot;天下三大贤&quot;之一的吕坤晚年辞官回乡，写了一封《修城书》倡议修城，是唯一留传下来的明代民间修城倡议书；还有&quot;逻岗&quot;&quot;李成帝村&quot;这些跟李自成有关的地名。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e金大定二十二年（1182） 县治徙于汴河堤南古城（宁陵城前身）。明初 宁陵城周围9里有余。成化年间（1465-1487） 知县金玺割城南之半改筑，约5里。明万历二十九年（1601） 吕坤倡修宁陵城——66岁的吕坤辞官回乡，力排众议，筹措经费，写《修城书》，主张展修加固新城。最终城周6里有余，高三丈，全用砖包，开四门：南文明、北钟祥、东延和、西宝城。崇祯十五年（1642） 李自成军攻陷宁陵，拆毁城墙。逻岗（原涝岗）得名——李自成军巡逻部队驻扎于此。清雍正六年（1728）、咸丰八年（1858）、光绪十五年（1889）、十九年（1893） 多次重修。1947年2月 县城第一次被攻克时扒掉部分城墙。1956年 城墙拆除殆尽——机关学校扒砖取土。现状： 近年复建北城门（钟祥门）、东城门（延和门），四湖改造让老城区焕新。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e吕坤《修城书》（明代唯一民间修城倡议书）：存于清光绪十九年《宁陵县志》，全文约2000字，力主&quot;三年之劳，为千年之计&quot;。复建北门钟祥门（2024年复建）：明城原建筑，青砖砌筑。复建东门延和门（2024年复建）：与北门同批复建。逻岗镇（地名遗存）：原称涝岗，因李自成军巡逻部队驻扎改名。至今当地人仍读&quot;涝&quot;音。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老师（70岁，宁陵中学退休语文教师，吕坤研究爱好者）：&quot;我家在县城东大街，小时候见过城墙残段——夯土的，上面长着酸枣树。58年大跃进那会儿，机关上带头扒砖，老百姓跟着扒，一夜之间砖城墙就没了。后来我在县志里翻到吕坤的《修城书》，那是他花了好几年才写成的，2000多字，句句恳切。现在复建城门，算是还了老吕一个愿。&quot;\u003cbr\u003e▌刘大嫂（55岁，逻岗镇开了20年农资店）：&quot;我爹说逻岗原来叫涝岗，李自成巡逻的部队来过后才改的。其实我们当地人一直叫涝岗，书面上写逻岗。镇西那沙河岸边，还有个土台子，老辈说那是当年李自成的瞭望哨。&quot;\u003c/p\u003e"}, {"n": "虞城利民·古虞国杜康酿酒的城", "s": "利民", "p": "河南", "w": "卍字街·2200亩护城河·5公里护城堤利民镇（原虞城老城）是上古古虞国都城、杜康（少康）酿酒之地，现存明代老城格局——&quot;卍&quot;字形街道、&quot;龟背式&quot;地形、外圆内方、2200亩护城河抱城——这套格局在全国县城中罕见。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e舜时 舜之子商均封于此，建立古虞国，建都纶城（今利民镇）。少康（杜康）避难于此20余载，发明秫酒，后中兴夏朝。秦汉 置虞县，属砀郡。明弘治九年（1496） 选建新城（即今利民镇老城），面积约2平方公里，筑土城，墙高5米，开四门：东宾阳、南薰风、北拱辰、西望汴。嘉靖十年（1531） 县治迁于此。崇祯八年（1635） 县人范良彦、杨春育捐资改土墙为砖墙。清康熙三十年（1691）、雍正八年（1730）、乾隆二十六年（1761）、咸丰八年（1858） 四次修缮。光绪二十七年（1901） 城墙倒塌过甚，官绅商民捐资大修。建国后 城墙城门逐渐拆除。1954年 谷熟、虞城两县合并，县城迁马牧集（今虞城县城），利民镇改称今名。现状： 2200亩护城河（东西南北四城湖）完整保存，5公里护城堤（高约7米）仍在，外圆内方格局清晰。城内街道呈&quot;卍&quot;字形，大隅首居中。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e护城河（四城湖）（明弘治九年筑城取土而成）：正常水位面积2200亩，水深1-4米，分东南西北四湖，以四门为入口分隔。湖内有地藏庵、观音阁、泰山庙、歇马亭等遗迹。护城堤（周长5公里，高约7米）：堤上原有鲁班庙、火神庙、玉皇庙、三教堂、山西会馆。商均墓（古城西南3里）：舜子商均之墓，现存。旧城砖石遗物：城区居民早年建房多用城砖——&quot;30斤重的城砖，小时候搬不动，掀起一边慢慢翻&quot;（老城居民回忆）。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，利民镇南街老木匠，曾用城砖盖过厨房）：&quot;我家厨房西墙全是老城砖——30斤一块，黑青色的，比现在砖宽一倍。那时候城墙拆，家家户户都去抬。我爹跟我说，城砖缝里抠出过铜钱和瓷片子。护城河的水现在还清，我年轻时候冬天在冰上打炮楼子（一种游戏）。&quot;\u003cbr\u003e▌孙会计（58岁，利民镇文化站干事）：&quot;现在护城堤还在，上面的庙大部分毁了，山西会馆的残碑我前些年见过，在南关那菜园子边上。2200亩护城河抱城——&#x27;四分水一分城&#x27;，这套格局在全国县城里真不多。河南其他地方都是城在水里，利民是水在城外。&quot;\u003c/p\u003e"}, {"n": "夏邑·四千年地下城叠城", "s": "夏邑", "p": "河南", "w": "战国栗城埋在天龙湖底·挖鱼塘挖出宋瓷夏邑是黄泛区&quot;地下城叠城&quot;的典型——战国栗城、明清县城都埋在天龙湖底，地面上什么都看不见。1983年修鱼塘挖出宋影青瓷、鱼龙砚台，1992年又挖出元砖室墓，湖底藏着4000年的城市史。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国 筑栗城，周长五里余，取土筑城因以为池——护城河就是后来的城湖。汉 置栗侯国。后魏孝昌二年 下邑县治迁此。金明昌三年（1192） 改名夏邑后，县治一直沿用栗城旧址。明正统十四年（1449） 知县周普修城，城周八里，高一丈二尺，池深二丈阔八丈。正德元年（1506） 城湖正式定型，以城墙为界形成内外湖。正德、嘉靖、万历、崇祯年间 多次重修。清末 捻军之乱城墙多次被毁，民国时期逐渐拆除。现状： 城墙地面上已无，护城河（天龙湖）完整保存。城湖总面积3000亩，环绕古城。湖底栗城夯土城基、战国遗物仍在。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e天龙湖（城湖）：周长约8里，面积3000亩，环绕古城。1992年大规模开挖时出土宋白釉黑花瓷碗、瓷瓶、瓷盘，元代砖室墓。现为天龙湖公园。栗城故址保护碑：立在天龙湖湖心岛旁，标注战国栗城位置。孔氏先茔（夏邑城北6公里）：孔子先世栗邑采邑，孔子曾来此祀先省墓，后人建还乡祠。护城河残段：明清砖城护城河，深约2丈，阔8丈，现在天龙湖水面下仍有遗迹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老汉（68岁，天龙湖养鱼户，在湖里划了25年船）：&quot;天龙湖底下全是泥，挖鱼塘的时候能挖出瓷片子——宋朝的碗底最常见，还有砚台。我93年在东湖边见过那个元代砖室墓，砖上有花纹，后来文物所的人来挖走了。现在湖里还有人能捞到碎瓷，收古董的爱来。&quot;\u003cbr\u003e▌退休文物所李所长（72岁）：&quot;夏邑的城是真的&#x27;叠&#x27;起来的——战国栗城在最底下，上面叠着明清县城，再上面是天龙湖的水。1983年修鱼塘的时候，那个鱼龙砚台就是在湖底挖到的，青石的，刻着鱼纹龙纹。可惜大部分文物当时被施工队分了，我们只收回来一小部分。&quot;\u003c/p\u003e"}, {"n": "民权老城·民国最年轻的县城", "s": "民权", "p": "河南", "w": "冯玉祥定名·1928年建城·城墙拆了地名留民权县是整个豫东设县最晚的县——1928年才由冯玉祥批准设立，取三民主义之&quot;民权&quot;为名。建县时城墙是边长500米的正方形土城，北靠黄河故道大堤，设中山、平等、博爱三门，没有北门。1948年迁治后变成普通村庄，但&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;的地名留到今天。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e清末 李坝集（老城原名）是黄河渡口，黄河主流流经于此，设渡口。渡口首领姓李排行第八，人称李八口。清嘉庆年间 黄河漫溢，土不能打墙，村民编篱笆围之——又名篱笆集。1928年 冯玉祥批准在豫东新设民权县，首任县长孙巍在李坝集筑土城。城为边长500米正方形，北枕黄河故道大堤当北墙，墙底宽15米，顶宽4米，高8米，城壕宽20米深2.5米。无北门，仅东、南、西三门——中山门、平等门、博爱门（三民主义命名）。1930年 中原大战，李坝集激战三个月。1935年 大火延烧西半城，损失严重。1946-1948年 历经动乱，城墙毁于兵燹。1948年 民权县迁治田庄车站（今民权县城），李坝集改称&quot;老城村&quot;。现状： 城墙已全部拆除，城壕填平住上人家。&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;地名保留至今。老城村现有1777户4950人，回汉杂居。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e老城村（原民权县治）：属民权绿洲街道办事处，西北距县城2公里。村中仍有&quot;东门&quot;&quot;西门&quot;&quot;南门&quot;等原始城门位置地名。黄河故道南大堤（老城村北侧）：原民权县城的&quot;北城墙&quot;，至今仍高大宽阔。县政府遗址（老城村双语幼儿园）：原关帝庙改建的县政府，大殿3间，东西廊房各6间。四眼吃水井：城东南、西南、东北、西北各一，井口直径约2米，上设田字木架。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌徐金堂（62岁，老城东村村干部，族谱可追溯到李坝集时代）：&quot;我爷爷当年在城墙上种过树。那城墙真高——8米，上面能跑马车。建国后先拆的城门楼，然后拆城墙砖盖学校，最后连夯土都被挖了垫路了。我家那块宅基地，原来就在西南头——当年的赵家大同照相馆位置。&quot;\u003cbr\u003e▌孙守礼（80岁，老城村最年长的老人之一，亲历老城8次易手记忆）：&quot;我记得第一次攻城——1946年8月，打了18天18夜没打下来。后来1948年才彻底安定。那时候城壕里死的人真多，护城河水都是红的。现在城壕填平了，上面盖了房子，谁知道这儿原来是护城河啊。&quot;\u003c/p\u003e"}, {"n": "杞县·杞人忧天的双重城防", "s": "杞县", "p": "河南", "w": "内砖城外土堤·周长9里13步·堤上植柳3000株杞县的双重城防在整个豫东独一无二——内有砖城（9里13步），外有护城土堤（周长7.5公里，高5米）。清代黄河屡次决口，全靠这道土堤挡住洪水保住县城。杞人忧天的典故就出自这里。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商 杞国都城——杞柳丛生，故名杞国。秦 置雍丘县，围筑城表。金大定十四年（1174） 避世宗完颜雍讳，改雍丘为杞县。元太宗六年（1234） 黄河决口，杞县城北面被冲垮。元太宗癸卯年（1243） 万户张柔在故城北约1公里处筑新城（张柔城）。元至大四年（1311） 河决张柔城，县治迁回南杞县（即今城址）。明崇祯八年（1635） 知县乔岱改土城为砖城，周长1400余丈。清乾隆二十八年（1763） 大水冲毁城墙，修缮后塞废小南门，仅余5门：东寅旭、西镇安、南肃清、北永安、西南宝成。清嘉庆二十五年（1820） 黄河决口兰仪，知县徐大镛筑护城堤——周长7.5公里，高5米，顶宽3米，底宽10米。道光六年（1826）沿堤植柳3000株。1946年 城墙拆除——出于战争需要。现状： 护城堤土形仍在，部分地段保存较好，现为县级文保单位。城内70多条街巷棋盘格局，至今基本保持明清风貌。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e护城堤土段：外筑土堤，周长7.5公里，高约5米，现部分残留。孔庙（大成殿）：始建于明洪武三年（1370），县城黉学主体建筑，至今仍在。圉镇（古圉县治）：杞县南部，秦汉圉县、圉城县治所，唐代改镇。现存崇兴寺、泰山庙、普济桥、伯喈胡同（蔡邕故里）、子在塔（孔子行宫塔）。内城街巷：东门大街、西门大街、南门大街、北门大街（原寅旭街、镇安街、肃清街、永安街），格局未变。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（72岁，杞县城关镇东街老住户，曾在护城堤上放过羊）：&quot;我小时候护城堤还完整着呢——上面全是柳树，道光年间种的那批。后来大跃进砍了烧火。7.5公里的堤，我放羊一绕就是大半天。现在堤被挖得七零八落，只有县医院后面那段还像个样子。&quot;\u003cbr\u003e▌王大姐（55岁，圉镇开蔡文姬纪念馆的个体户）：&quot;伯喈胡同就在圉镇西街——蔡邕（蔡伯喈）的故里，青石板还在。我小时候那条胡同里还有老宅子，门楼上有雕花。现在修了路，老房子只剩两家了。子在塔也在圉镇，相传孔子过此住过一夜，弟子后来建的塔。&quot;\u003c/p\u003e"}, {"n": "通许·400年没挪窝的县城", "s": "通许", "p": "河南", "w": "唐始建·嘉靖砖城·街巷格局至今未变通许县城是整个豫东平原上最&quot;老实&quot;的县城——自唐代始建以来，城址从来没迁过，城墙从夯土变砖城，又变成了环城路，但街巷棋盘格局从明嘉靖二十七年（1548）县志上看，到现在几乎没变。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e唐 始建城垣，具体规模不详。明洪武五年（1372） 知县姜允和增筑，周围9里30步，高1丈8尺，宽1丈3尺，池深8尺，涧2丈。明嘉靖七年（1528） 知县于尚春始筑砖城。明末遭毁。清顺治年间 知县褚士行、姜汝松、贾待旌相继修葺。清光绪十五年（1889） 知县谢立本因年久失修，外筑砖墙。清光绪三十年（1904） 筹资修筑加固。1949年后 砖墙拆除。1972年 向北扩建新城区。现状： 街巷格局完整保留，70多条街巷呈棋盘状。主干道光复路、行政路、幸福路、文卫路穿城而过。老城区仍有传统商铺和老房子。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e明嘉靖城墙基址：环城路位置——1949年后拆城砖修路，城墙基址隐于路面下。老城区街巷：状元桥街（北宋王拱辰故里）、光复路、行政路等，格局未变。清真寺：老城区遗存，明清风格。护城河残段：老城区东南部仍有小面积水体，为原城池遗迹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌赵大爷（76岁，通许县中街老裁缝，从青年到老年在同一条街上做衣服）：&quot;我18岁在这街上摆缝纫机，现在76了，还在这条街的另一头。街变宽了，铺子换了一茬又一茬，但街道走向没变——南北街东西街，还是明嘉靖年间那个棋盘样。我那台老缝纫机用了40年，现在搁家里当摆设。&quot;\u003cbr\u003e▌退休教师李老师（70岁）：&quot;我是教历史的，嘉靖二十七年县志上有老县城图，拿出来跟现在的地图一比——街道位置几乎没动。这在黄河泛滥区太少见了，周围杞县、睢县都迁过城，通许从唐代起就没挪窝，真是奇迹。&quot;\u003c/p\u003e"}, {"n": "尉氏·城墙还在的活化石", "s": "尉氏", "p": "河南", "w": "2米夯土轮廓完整·洧川南门长500年柏树尉氏县城的城墙是豫东平原上少有的还能完整触摸到的城墙——虽然砖层1951年被拆，但夯土墙基还在，最高处从城外看约2米，整个轮廓清晰可辨。更为奇特的是，下属洧川镇的明代南城门（镇洧门）门洞砖缝里长着一棵500年古柏，胸围1.1米。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋 郑国别狱（地方监狱），为郑大夫尉氏之邑。秦始皇三年（前219） 置尉氏县，隶属三川郡——秦首批郡县。汉 始筑尉氏县城，周六里一百步，方形。明宣德六年（1431） 知县李琦因南关居民稠密，外拓城垣1里183步——方形城变凸字形。明成化十九年（1483） 知县刘绍修城垣，增高至2丈5尺，开6门：大东门敦化、小东门朝阳、大西门阜成、小西门兴化、北门迎恩、南门保安。明崇祯七年（1634） 改土城为砖城，外砖内土。明崇祯十四年（1641） 毁于闯军。清顺治初 重修。1951年 拆取城墙砖用于城市建设。1959年 夯土城垣被移平——大部分地段。现状： 城墙轮廓清晰可辨，最高处从城外看约2米。从明嘉靖二十七年县志城图、清道光十一年县志城图与现在对比——街道布局几乎没有变动。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e尉氏县城夯土城墙残段：现存轮廓完整，从城外看最高约2米。洧川南门（镇洧门）（明景泰元年1450，省保）：门洞东西宽7米，进深13.5米，高10米。内外壁大砖砌成，底部青石铺基，顶部半圆形拱券。门洞正中砖缝里长着一棵500年古柏——胸围1.1米，根系沿两侧砖缝向下延伸。城垛为柿花形（出过状元的县才允许用）——吕蒙正、刘理顺。洧川北门古榆（已毁）：与南门古柏遥相呼应，有&quot;南门到北门，百（柏）里有余（榆）&quot;之说。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌退休志办赵主任（73岁）：&quot;我把嘉靖二十七年的老县志城图拿出来，跟现在尉氏的卫星地图一比——街道走向一模一样。这在豫东太罕见了！旁边通许虽然也没迁城，但城墙早平了；杞县迁过两次城。尉氏是真&#x27;老实&#x27;——2500年，城没挪窝，街没改向。&quot;\u003cbr\u003e▌洧川南街老校长（68岁，教了一辈子书）：&quot;那棵柏树从我爷爷小时候就在那——500年了。传说是小鸟衔的柏籽掉进门洞砖缝里长出来的。82年县文物所的人给南门挂牌，说柏树是&#x27;自然奇观&#x27;。我小时候爬上去摸过树根，那根顺着砖缝往下钻，不知道扎到哪儿了。&quot;\u003c/p\u003e"}, {"n": "兰考考城·迷你小城堌阳镇", "s": "考城", "p": "河南", "w": "周长仅3里·四门吊桥·康熙年间迁址考城县在豫东县城中堪称&quot;流浪&quot;——从汉代到清乾隆年间，因黄河水患先后迁了至少5次，最后在堌阳镇定居。这座小城周长仅3里（约1500米），是黄河泛滥下考城能找到的最后一块安全地。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东汉建初八年（83） 甾县改名为考城县，城在今民权林七乡西村——内城9里13步，外城36里有奇。元至元间 城没于河，县治迁贺丘（民权王桥集）。明洪武二十三年（1390） 河决，迁江墓店（民权李堂乡）。正统二年（1437） 再遭河患，迁北关（民权北关镇），筑城4里90步，土城。崇祯年间 改土城为砖城。清康熙二十八年（1689） 淫雨致城墙坍塌，重修。清乾隆四十三年（1778） 北关城没于黄河——考城第N次城毁。清乾隆四十九年（1784） 考城县治迁堌阳（今兰考堌阳镇），知县雷逊重新筑城——城周仅3里，高1丈4尺2寸，内土外砖，开四门：东门朝阳、南门迎薰、西门安澜、北门拱辰。四门皆设铁索吊桥。1949年 考城县治由堌阳迁至张君墓镇（考城镇）。1954年 考城与兰封两县合并为兰考县。现状： 堌阳老考城址占地约20万平方米，城墙残迹可寻，护城河遗迹尚存。2026年省专家组正在对堌阳老城开展文物专项调查。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e堌阳考城城墙残段：清乾隆四十九年（1784）筑，城周3里，内土外砖，夯土残垣尚存。护城河遗迹：四门各有铁索吊桥，护城河宽阔。堌阳老城街巷：街道多丁字、少十字，少有平行街，如蛛网密织，似迷宫——独特的防御布局。四门位置：东门朝阳、南门迎薰、西门安澜、北门拱辰——地名仍存。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王老爹（82岁，堌阳镇最年长的老人，见证老城变迁）：&quot;我还记得建国前堌阳城的样子——城墙不高但很结实，四门有吊桥，每天晚上放下来。城内街道太绕了，刚来的人容易迷路——全是丁字路口，没几个十字街口。卖胡辣汤的、炸油条的、补鞋的都挤在大隅首。后来1949年县治搬走，城就慢慢败了。&quot;\u003cbr\u003e▌退休中学教师刘老师（70岁，本地史学家）：&quot;考城的迁徙史就是一部黄河泛滥史——从西汉到乾隆，迁了至少5次，每次都是河毁城。最后在堌阳找到这块高地，只筑了3里城——黄河能淹到的地方越来越高，能用来筑城的地方越来越小。3里城在豫东县城里是最小的，但它挺了170年。&quot;\u003c/p\u003e"}, {"n": "中牟·官渡之战的曹操城", "s": "中牟", "p": "河南", "w": "汉初始置·曹操重筑·崇祯砖城中牟是中国古代史上最著名的战场之一——官渡之战就发生在这里。曹操在青峰岭重筑城池，明清沿用。1938年黄河花园口决堤，中牟城被冲毁三分之一——东门到北门几乎全塌，城内房屋几乎全倒，全城仅剩丁字口一片孤岛。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋 郑国清邑，《左传》记载。西汉初年 始置中牟县。高帝十二年（前195）封单父圣为中牟共侯。汉末曹操 在青峰岭重筑城池，城垣周长6里36步，高2丈5尺，阔2丈——即今明清县城前身。明天顺五年（1461） 黄河决口，城毁。知县董敏移城于西（今址），筑土城，周长6里36步，高1丈5尺。明崇祯七年（1643） 知县俞士鸿易土为砖，加筑东西瓮城。改西门名为观光，北门拱辰。清顺治二年（1645） 重修，四角置窝铺，四门：东门朝阳、西门观光、南门迎薰、北门拱辰。清乾隆十五年（1750） 知县孙和相大兴土木，重建四门瓮城、城楼。城高1丈6尺，顶宽2丈，底宽2丈5尺。1938年 花园口决堤，黄水围城，冲毁三分之一城墙，东门至北门几乎全部坍塌，城内房屋几乎全部倒塌，全城仅剩丁字口地势较高的一片孤岛。1956-1958年 剩余城墙砖石被拆除用于城市建设。现状： 城墙已无，但街道格局保留明清形态。老城区丁字口为当年洪水后的&quot;孤岛&quot;中心。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e明清中牟县城街格局：老城区东西大街（原朝阳-观光门一线）、南北大街（迎薰-拱辰门一线），丁字口为中心。官渡古战场遗址：中牟北部官渡桥村一带，东汉末年官渡之战主战场。东古城遗址（县城东南11公里）：东周至宋代古城，夯土城墙高8米，基宽30米，西北城角保存完好（高15米）。老城区残存民宅：丁字口附近仍有少量民国时期老建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌齐治平（真名赵福群，中牟历史研究专家，行走的中牟活字典）：&quot;我是个农民，小学都没毕业，后来靠自学。2023年在东关洞上村居民房后发现一段古城墙——长约20米，宽10余米，初步断定就是中牟城遗址。这一发现把中牟建城史从汉代提前了两千年，通到夏商时期了。我研究了十多年，终于找到点实在东西。&quot;\u003cbr\u003e▌退休老干部李主任（75岁，1950年代就住在老城区）：&quot;我小时候听老辈说，1938年那场大水，全城就剩丁字口那一片没淹，周围全是水。后来日本人来了，在碉堡里住。1945年日本人投降后，居民才敢回来搭棚子。我家1952年盖房子，砖还是从城墙基下挖的。&quot;\u003c/p\u003e"}, {"n": "新郑·四十五里牛角城", "s": "新郑", "p": "河南", "w": "郑韩故城垣世界之最·南街活了六百年·高拱故里新郑是春秋战国时期的大国都城——郑国和韩国先后在此建都，&quot;四十五里牛角城&quot;（郑韩故城）的夯土城墙至今大部分保存，是世界同期（东周）最完整的古城垣之一。墙基宽40-60米，最高处16米，全部用土夯筑。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西周 郑国肇建名相郑桓公。春秋 郑武公迁都新郑（前769），郑国在此建都39年。战国 前375年，韩国灭郑后迁都新郑，加固加高郑国的东城和北城——因为南、西墙临近双洎河（洧水），向内收缩。公元前230年 秦灭韩。此后 郑韩故城夯土城墙一直作为新郑县城的基础——城内建县治，城外城墙保留。 明代重修新郑城，增建瓮城、城楼。明隆庆年间（1567-1572） 内阁首辅高拱（新郑人）主持朝政。新郑南街立石牌坊&quot;少傅冢宰&quot;&quot;少师大学士&quot;。1958年 拆城墙砖——大量城墙砖被用于城市建设。但夯土城墙大部分未拆，作为地面隆起至今保存。2006年 新郑市改造西环路，挖出明代城墙墙基近千米——下以青石长条为基础，上砌带文字的大砖（隆庆四年造）。1997年 拓宽郑新公路时，新郑市毅然决定多投资400多万元改线50多米——保护了一段城墙。现状： 郑韩故城遗址东西长约5000米，南北宽约4500米，一道南北走向夯土墙将城分为东西两部（西城宫城、东城平民区）。墙基宽40-60米，顶宽2.5米，最高16米。东墙和北墙保存最好。南街古巷：600年未变的老街，2013年列入保护，2024年成为省级历史文化街区。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e郑韩故城夯土城墙（世界同期最完整）：大部分地段仍高出地面——东墙、北墙保存最好，墙基宽40-60米，顶宽2.5米，最高16米。西城地势最险要（牛角最凸出部分）。南街古巷（省级历史文化街区）：明代始建，600年未换名字。老街长约500米，青石板路，老宅黑灰相间古墙，雕花木格窗。现存合盛泰布庄（清代商号，近年修复）。鉴忠堂宝谟楼（明万历年间，高拱接旨亭）：新郑旧城保存下来的唯一明代建筑，基座高1.2米，青石条铺地。惠济门（明代南城门，近年复建）：城头上篆有&quot;惠济门&quot;三字，门口是热闹的南环路。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张大爷（83岁，南街最年长的老住户，南街&quot;活化石&quot;）：&quot;我这辈子没离开过南街——小时候青石板就被磨得发亮了，街两边的老宅子一座挨一座。1958年拆城墙，南街口那段老墙还在，青砖斑斑驳驳缝里长草。我每次路过都摸一把。现在好了，南街2024年成了省级文化街区，灯笼一亮，小孩追着跑，跟我小时候一样一样的。&quot;\u003cbr\u003e▌退休志办王主任（70岁）：&quot;郑韩故城的城墙是真厉害——2700多年了，土夯的比砖的还结实。墙基最宽60米，顶上2.5米，能并排跑两辆马车。97年公路改线保护那段，是新郑人做对的一件大事——多花了400万，但保住了世界文化遗产。&quot;\u003cbr\u003e（以上为T12大批次12县正文）\u003c/p\u003e"}, {"n": "长垣老城·黄河岸边的蒲城", "s": "长垣", "p": "河南", "w": "子路治过的邑·岳飞系马槐·9里18步砖城长垣老城是黄河沿岸最&quot;折腾&quot;的县城——金元旧城被黄河淤没，明初迁到蒲城，明末筑砖城，500年间修了26次。孔子弟子子路在此当过3年&quot;蒲宰&quot;，岳飞抗金路过在县衙后院拴过马（系马槐还活着）。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋 子路（仲由）在此任蒲邑宰3年，&quot;三善&quot;政绩传世。金元 县城在今苗寨镇旧城村一带，因黄河多次泛滥，城址被淤没。至民国黄河中还有古塔露头，成为黄河一景。明洪武二年（1369） 县丞刘彦昭将县治从旧城迁到古蒲城（今老城），初筑土围3里多。正统十四年（1449） 知县萧翼展拓城周至8里，高6米，建四门：仁和、义正、悦来、拱极。成化十年（1474） 城墙加高至6.6米，厚9米，开挖护城壕，四门外各建石桥。崇祯十年（1637） 知县王虚白改土城为砖砌城墙——高10.5米，底宽13.5米，顶宽6.9米，周长9里18步。护城壕宽13.8米，深4.5米。城内挖排水沟120条。这是长垣历史上最完备的城墙。乾隆三十三年（1768） 知县吴钢重修，题名四门：东景晖、西义正、南承熏、北迎恩。1945年9月 因战争需要，组织万余民工拆除砖城墙，从此砖城变土城。1986年 县政府将古城墙4500米作为重点保护区。1995年 大部土城被拓为内环路，仅存西南隅约1公里。2001年 700米开发为仿古商业街。现状： 古城墙仅存约300米（龙山商业街南口东侧），2000年用石块裹护，长70米，高6.2米，底宽14米，顶宽8.4米。老城城内街道格局基本保留，岳飞系马槐仍在县衙旧址后院。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古城墙残段（仅存300米）：龙山商业街南口东侧，用石块裹护，高6.2米，底宽14米。系马槐（岳飞拴马槐，千年古槐）：老县衙后院，树干粗三人合抱，枝繁叶茂。岳飞抗金路过长垣，在此拴马。蒲城旧治石额：县衙遗址残存，刻&quot;蒲城旧治&quot;四字。子路祠（纪念孔子弟子仲由治蒲政绩）：老城西街，明清建筑。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌董老汉（80岁，老城北街原粮库家属院，在城墙根儿住了一辈子）：&quot;我小时候城墙还完整着呢——9里18步，上面能跑马车。北城墙上洋槐树最多，5月槐花一开，香半里地。我妈那时候常带我去掐槐花蒸饭。70年代修环城路，拆墙的人来了，我爹跟他们吵了一架——这墙比你爷年纪都大！吵也没用，一夜之间没了半面。&quot;\u003cbr\u003e▌张会计（62岁，长垣县文物管理所退休）：&quot;系马槐是真的老——据说岳飞拴过马，树干粗得很。文革时候差点被砍了烧火，一个老木工偷偷把锯子藏起来才保住。现在树旁边立了块碑，写着&#x27;岳飞系马处&#x27;。每年春天槐花开，很多人专门来合影。&quot;\u003c/p\u003e"}, {"n": "浚县·河堤上的活城墙", "s": "浚县", "p": "河南", "w": "城墙当河岸用·一县六大国保·2.1平方公里老城浚县古城墙是全国独一无二的&quot;河堤城墙&quot;——沿卫河西岸那段768米城墙，既要承载防御功能，又要充当河堤驳岸，一旦拆除河岸就会坍塌。这段墙完整保留了明代夯土+砖面结构，砖上还能看到明代窑厂的文字印记。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉 置黎阳县，为黄河以北行政中心之一。隋初 设黎阳总管府，辖四州八县。明洪武三年（1370） 始建县城，以文治阁为中心，夯土筑城，周长4公里。城内形成&quot;四街八巷三十六小巷&quot;格局。成化、正德年间 多次增修。正德三年（1508）建云溪桥（卫河桥）。崇祯十五年（1642） 遭李自成军围城5个月，粮尽援绝，黄河决堤灌城，城墙大部损毁。清初 复修。沿卫河西岸一段768米城墙因兼具河堤功能得以完整留存——其他地段在20世纪被陆续拆除。2014年 大运河申遗成功，这段城墙被纳入世界文化遗产点位。现状： 完整保存&quot;四街八巷三十六小巷&quot;格局。城墙沿卫河西岸768米最完整，高约6米，基部砌青石，上部砌砖，内实夯土。面积2.1平方公里，2019年获评国家4A级旅游景区。文治阁（城中心高台楼阁，通高约20米）、文庙、县衙、翰林府等明清建筑保存完好。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e古城墙（沿卫河西岸768米，明代，世界文化遗产）：基部砌青石，上部砌砖，内实夯土。砖面有明代窑厂文字印记。云溪桥（明正德三年1508，省保）：五孔连拱石桥，卫河上仅存的两座古桥之一。桥墩两端砌分水尖，四角各有石雕水兽（低头引颈状）。文治阁（清代重建，古城中心）：通高约20米，四个拱券门分别题&quot;丹流东壁&quot;&quot;碧泻西山&quot;&quot;清环黎山&quot;&quot;黛护伾岚&quot;。黎阳仓遗址（隋代国仓，世界文化遗产）：隋唐大运河关键官仓，有&quot;黎阳收，顾九州&quot;之说。大伾山摩崖大佛（北魏，22米高，国保）：北方早期大型摩崖造像。浮丘山碧霞宫（明清建筑群，国保）：规模宏大，院落层层递进。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌王奶奶（78岁，西街村人，在卫河边住了60年）：&quot;那城墙就是河堤——小时候涨大水，河面上的浪能拍到城墙砖上。要是拆了那768米，西街这一片早冲没了。我家就在城墙根儿，后门一推就是城墙的砖面，下雨能避雨，夏天能乘凉。这墙比我爷爷年纪还大。&quot;\u003cbr\u003e▌张掌柜（65岁，西大街开了30年浚县子馍铺）：&quot;我做子馍的鹅卵石，就是从城墙上捡的——那砖缝里的小石头磨得溜光，炕子馍最好用。现在城墙上不让捡了，我都从河滩里挖。浚县子馍要放在烫热的鹅卵石上炕，淋鸡蛋进去，外皮脆内里软，这手艺传了几百年。&quot;\u003c/p\u003e"}, {"n": "淇县·朝歌城门缝里的古柏", "s": "淇县", "p": "河南", "w": "500年柏长在门洞砖缝·《诗经》淇水汤汤地淇县老城是殷商故都朝歌，古城墙早已不存，但朝歌老街还留着明清、民国、建国初期的建筑叠层——清末5处、民国23处、建国初期36处挤在几百米老街上。更奇的是下属鹿台阁（摘星台）的门洞砖缝里，长着一棵500年古柏，胸围1.1米。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e商末 纣王帝辛都朝歌，历武丁、武乙、帝乙、帝辛四代，约100年。城墙遗址在县城西3公里。春秋 卫国都朝歌，后迁楚丘、帝丘（濮阳）。西汉 置朝歌县。唐 卫县（治今汲县）属卫州。明洪武二年（1369） 降州为县，称淇县。筑土城，后多次增修。崇祯十五年（1642） 遭战乱损毁。清初 重建砖城。鹿台阁（摘星台）为明代中期重建——纣王摘星楼旧址，门洞砖缝里自然长出古柏。建国后 城墙逐步拆除，护城河填平。现状： 朝歌老街保存清末建筑5处、民国建筑23处、建国初期公共建筑36处，青石板路，两侧老铺子。文昌阁（明末崇祯年间建）在街口。卫国故城遗址（春秋卫国都城，国保）在县城东侧，城墙残段尚存。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e鹿台阁古柏（500年，胸围1.1米）：摘星台门洞砖缝里自然生长，根系沿两侧砖缝向下延伸。朝歌老街（省级历史文化街区）：青石板路，清末/民国/建国初期建筑叠层保存。人民剧院、百货公司、新华书店（50-70年代风貌）、大清邮局旧址等。卫国故城遗址（春秋，国保）：县城东侧，夯土城墙残段尚存。文昌阁（明末崇祯年间）：朝歌老街街口标志建筑，登阁可俯瞰老街全景。云梦山（中华第一古军校）：鬼谷子隐居地，水帘洞、孙膑洞等遗址。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌刘大爷（75岁，朝歌老街最年长住户，在老街上住了60年）：&quot;那棵柏树什么时候有的？我爷爷说他小时候就在那儿了——至少500年。门洞砖缝里长出来的，根顺着砖缝往下钻，不知道扎到哪儿了。我小时候常爬上去摸树根。现在有人说那是&#x27;封神&#x27;的一景，游客来都要摸一把。&quot;\u003cbr\u003e▌孙姐（58岁，朝歌老街开了20年代香铺+茶馆）：&quot;我家那屋子是民国时期的，木梁雕花都在。老街有意思——明清的深宅、民国的商铺、建国初期的供销社、人民剧院，全挤在一条街上。我小时候供销社还开着，卖的糖块5分钱一颗，现在供销社变文物了。&quot;\u003c/p\u003e"}, {"n": "原阳原武·黄河渡口的玲珑塔", "s": "原武", "p": "河南", "w": "汉张苍墓·黄河重要渡口·外敌占据时留下城墙老照片原武城是黄河北岸的千年渡口——从汉代到民国，都是从河北过黄河到开封的必经之地。城虽小（周长2547米），但外敌占据时期的战时档案里专门记录了它的城墙数据——&quot;高7米，上宽2米，下宽10米&quot;。城外善护寺的玲珑塔是&quot;原武八景&quot;之一。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e西汉 置原武县。明洪武四年（1371） 筑土城。崇祯十三年（1640）改砖城。清 属怀庆府。多次重修。1938年12月 外敌占据原武。战时档案载：&quot;城墙高7米，上宽2米，下宽10米，周长2547米，外壕沟宽8米深3米。&quot;外敌士兵在东城墙站岗，拍了珍贵的城墙老照片。1941年 伪知事岳绍明奉命修城墙，立&quot;城壁修复纪念碑&quot;。1945年 光复。1950年代 原武、阳武两县合并为原阳县，县治迁原武镇（原阳老县城）。现状： 原武老城（原原阳县城）现为原阳县原武镇。城墙已不存，但街道格局保留。善护寺玲珑塔（宋代）仍在城外，&quot;原武八景&quot;之&quot;东门烟寺暮雨&quot;即指此。城内有汉张苍墓（西汉丞相）。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e善护寺玲珑塔（宋代）：&quot;原武八景&quot;之一，东门烟寺暮雨。塔高约20米，砖结构。战时老照片里仍清晰可见。汉张苍墓（西汉丞相）：原武镇北，现存封土丘。原武老城街巷：街道格局基本保留，东西南北四街仍在。黄河渡口遗址：原武老城北依黄河大堤，古代渡河码头遗迹。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌张老汉（82岁，原武镇东街老木匠，1950年代见过完整城墙）：&quot;那城墙是真高——7米，跟现在两层楼差不多。外敌站岗那事儿我爹跟我说的——人拿枪逼着老百姓修城，还立了碑。我小时候城墙砖还能挖着，后来大跃进全扒了烧砖炼钢。善护寺的塔现在还在，我爬上去过，能看见黄河滩。&quot;\u003cbr\u003e▌退休教师李老师（70岁，原阳县志办公室）：&quot;那战时档案是我从网上找到的——日本防卫厅战史研究所藏的。上面写着&#x27;原武城城墙高七米，上宽二米，下宽十米，周长二千五百四十七米&#x27;，精确到米。还有一张老照片，外敌站在城墙上，背后就是玲珑塔。这是原武城仅存的几张老照片。&quot;\u003c/p\u003e"}, {"n": "延津·吴起城的鬼打城传说", "s": "延津", "p": "河南", "w": "战国吴起驻军·鬼打城传说·黄河古渡口延津有两处全国独一无二的古城遗址——吴起城（沙门城址）是战国名将吴起驻军抗击秦国的古城，城址被黄沙覆盖，近年考古挖出宋农田遗存；还有&quot;鬼打城&quot;传说——一夜之间夯土城墙出现，百姓传是鬼神所筑，其实是明代附近村落因躲避战乱集体筑城。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e战国 吴起在今沙门村驻军抗击秦国，筑吴起城（今沙门城址）。金明昌五年（1194） 黄河改道，宜村（宋金时期叫沙门）从黄河南岸变成北岸。金贞祐二年（1214） 卫州州治迁宜村新城，胙城县治同迁。正大八年（1231）用石头包砌城壁（以石甃其城）。元 胙城县治他迁，卫州城废弃。2005年冬 长济高速施工取土，无意中挖到古钱币，引发&quot;吴起城淘宝热&quot;。2006年7-8月 考古队对遗址全面调查勘探——现存北城墙长740米，东城墙640米，西城墙800米。城址北窄南宽，面积约1000多亩，被黄沙覆盖。2013年 沙门城址列入第七批全国重点文物保护单位。现状： 吴起城遗址立有全国重点文物保护单位石碑，夯土上包着一棵老柳树，经十四路旁。县城老城的明清城墙已全部消失，仅剩城墙基址隐于环城路下。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e吴起城遗址（沙门城址）（国保）：战国，夯土城墙尚存，被黄沙覆盖。现存北墙740米、东墙640米、西墙800米。&quot;鬼打城&quot;夯土堆（延津东古墙/西古墙村）：传说一夜之间出现的夯土城墙，实为明代百姓躲避战乱集体筑城。20世纪90年代遗址长1000米、宽12米、高3米，现在变成肥沃农田。胙城城隍庙：胙城县治旧址，尚存，近年文物专项调查新发现鲁葛祠。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌宋老师（72岁，延津县十八里村农民，吴起城遗址发现者之一）：&quot;2005年修高速挖土方，挖出一堆古铜钱——有汉代的、宋代的。消息传开，全国来淘宝的人把地都翻遍了。我也捡了一枚&#x27;大观通宝&#x27;，后来县文管所来人收走了，给了我一张奖状。现在那夯土堆上立着&#x27;国保&#x27;石碑，旁边长着一棵老柳树，不知道什么时候栽的。&quot;\u003cbr\u003e▌张老汉（68岁，东古墙村农民，&quot;鬼打城&quot;传说知晓者）：&quot;我爹说那夯土堆原来有1000米长、3米高——传说是鬼神一夜筑的。其实就是明朝时候周围村子为了躲土匪，晚上偷偷一起筑的，怕被土匪发现，才说&#x27;鬼打城&#x27;。现在全成耕地了，种麦子。我小时候还在上面放羊呢。&quot;\u003c/p\u003e"}, {"n": "封丘·黄池会盟的城墙路", "s": "封丘", "p": "河南", "w": "春秋黄池会盟·城墙拆了变黄池路·四碱坑封丘老城是春秋吴王夫差黄池会盟的故地——孔子闻&quot;黄池之会&quot;时正在卫国。明嘉靖三十年（1551）知县李嵩始筑砖城。1980年代城墙拆除修成黄池路——现在双向四车道的主干道，路基就是明代东城墙和护城河。城因避水患，城内东南西北四角取土形成四个&quot;碱坑&quot;（现称湖），雨天全城不积水——这是封丘城独特的排水智慧。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e春秋（前482） 吴王夫差与晋定公、鲁哀公等诸侯会盟于黄池——孔子当时在卫国，闻讯感叹&quot;黄池之会&quot;。西汉 置封丘县。明景泰二年（1451） 典史郜瑢筑土城，周五里有奇。明嘉靖三十年（1551） 知县李嵩始筑砖城——基宽3丈，顶宽2丈，高2.5丈，城外壕宽3丈。清顺治、咸丰年间 多次重修。北门有镶金匾额，旌表封丘人李嵩阳（清顺治年间任监察御史）。1980年代 城墙拆除，护城河填平，修成南北主干道黄池路——定名即取自黄池会盟典故。2019年 黄池路全线升级改造为双向四车道。现状： 老城街巷基本保留棋盘格局。四个碱坑（东南西北四角取土形成的湖）仍在——现称东湖、西湖，荷花盛开。边胡同（因边姓家族出两对父子进士而闻名）仍存，两边有明清老宅子。黄池路就是原东城墙+护城河位置。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e黄池路（明城墙原址）：南北主干道，路基为明东城墙+护城河。四个碱坑（明清排水智慧）：城内东南西北四角取土筑城形成的湖，雨天全城雨水汇入，城内不积水。现为城市公园。边胡同：因边姓家族出两对父子进士（举人秀才近百人）闻名，南北长数百米，两侧有前房后院式明清建筑。北干道（原北城墙）：清代砖砌北城墙，顶上曾有垛口、敌楼，墙外为护城河。黄池会盟碑：近年复建，立于黄池公园。。\u003c/p\u003e", "c": "\u003cp class=\"comment\"\u003e▌李老汉（78岁，老城边胡同住户，边姓后人）：&quot;我家就在边胡同——清末的时候胡同里出了两对父子进士。现在我家那老宅子还是前房后院的格局，门楼砖雕都在。我爹说当年城墙还在的时候，北门上有块镶金的大匾，后来日本人来了就没了。那匾是夸李嵩阳的——他是清顺治年间的御史，捐钱修城墙、救济流民。&quot;\u003cbr\u003e▌王大姐（62岁，封丘退休教师，碱坑爱好者）：&quot;封丘老城最聪明的地方就是那四个碱坑——修城墙取土挖的，后来变成湖。不管下多大的雨，城里不积水——雨水顺着地势往四个坑里流。这是几百年前古人的排水智慧！现在南边那个碱坑变成公园了，种满了荷花，我常去拍照。&quot;\u003c/p\u003e"}, {"n": "汝南·天下之中的蔡州城", "s": "汝南", "p": "河南", "w": "秦观当过8年教授·《鹊桥仙》灵感·汝水抱城汝南古称悬瓠城，因汝水三面环抱如垂瓠（葫芦）得名。这里是中国地理上的&quot;天中&quot;——周公在此立圭测影，颜真卿亲笔题&quot;天中山&quot;三字。北宋婉约词宗秦观（秦少游）在此当了8年蔡州教授，《鹊桥仙》&quot;两情若是久长时&quot;的创作灵感深受汝南民间牛郎织女传说滋养。", "h": "\u003cul class=\"timeline\"\u003e\u003cli\u003e东晋义熙十四年（418） 汝南郡治所迁悬瓠城（今汝南老城）。北魏 城周长12公里，仅东、西、南3门，无北门。城墙夯土筑成。公元449年，魏军围困悬瓠城，汝南太守陈宪率千人苦战42天，魏军死伤无数，汝水为之断流。明洪武八年（1375） 增辟北门，城周拓为9里30步，高2.5丈。四门：东作、汝南、西城、拱北。成化二十年（1484） 重修，撤旧楼，绕以子墙，建警铺48个。清顺治、咸丰年间 多次重修。1936-1937年 国民党第八行政区督察专员下令，除四关城门外，城墙全部拆除。1953-1968年 四座城门陆续拆除——1968年南城门和内城西城门最后拆除，北门因对汝河水浸有保护作用而得以留存。1996年 汝南县农业银行捐资复建天中门（南城门）。2021年复建汝南门。现状： 北城门遗址留存，门外汝河为天然护城河。城内七街三巷青石板路，遗存古建筑有悟颖塔、观音阁、准提楼、开元寺等。天中山文化园（周公立圭测影处，颜真卿题碑）、皇家驿站（明代崇简王驻马驿址）均在城外。\u003c/li\u003e\u003c/ul\u003e", "r": "\u003cp\u003e天中山（天下地理中心）：高不过丈余的小土丘，周公立圭测影处。颜真卿亲笔题&quot;天中山&quot;三字，碑刻现存。北城门遗址：1968年唯一没拆的城门，因有防洪功
